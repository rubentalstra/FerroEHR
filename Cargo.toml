# Root workspace manifest for FerroEHR — the pure-Rust openEHR CDR.
# This file is the authoritative pinned dependency set (the "version check").
# Versions are current as of 2026-07 and expressed as caret ranges (Cargo pulls
# the latest matching patch). Where a major/minor was not individually confirmed
# it is marked "verify". Crates opt into these via `dep.workspace = true`.

[workspace]
# NOTE: `resolver` must stay explicit — a VIRTUAL workspace does not infer
# resolver v3 from the members' edition 2024
# (https://doc.rust-lang.org/edition-guide/rust-2024/cargo-resolver.html).
resolver = "3"
members = ["crates/*", "app/*", "tools/*"]

[workspace.package]
version = "4.0.6-rc2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/rubentalstra/FerroEHR"
# No `authors`, deliberately. The cargo manifest reference opens that section
# with "Warning: This field is deprecated"
# (https://doc.rust-lang.org/cargo/reference/manifest.html#the-authors-field),
# and it cannot be corrected after publication. Attribution for the published
# `openehr-*` crates is the repository link above plus CITATION.cff, which IS
# editable and is what GitHub's citation box and the Zenodo deposit both read.
# C-METADATA (https://rust-lang.github.io/api-guidelines/documentation.html#c-metadata):
# members inherit via `<key>.workspace = true`; `readme` resolves from this root.
documentation = "https://ferroehr.eu/"
readme = "README.md"
keywords = ["openehr", "cdr", "healthcare", "ehr", "aql"]
categories = ["database-implementations", "science", "web-programming::http-server"]

[workspace.lints.clippy]
# Zero re-exports (owner hard rule 2026-07-16: every import names its defining
# module) becomes a compile error rather than a review note. It costs nothing
# where it matters — `app/*` and `tools/*` carry no re-exports at all. The only
# exception is the generated spec crates, where the generation preludes ARE the
# public surface; that exception is stamped by the emitter into their `lib.rs`
# as an `#![expect(...)]`, so it self-reports if a crate ever stops re-exporting.
pub_use = "deny"
# The reliability hard-rule set (.claude/rules/reliability.md, owner
# 2026-07-17; hardened per issue #1311, owner 2026-07-30): deny-tier = fails
# every local clippy; warn-tier still fails CI (-D warnings). Tests keep the
# clippy.toml `allow-*-in-tests` scoping. Groups stay at priority -1 so every
# individual lint below (priority 0) overrides them — machine-required by
# clippy::lint_groups_priority (correctness). Restriction lints are CHERRY-
# PICKED individually; the group is never enabled wholesale (official Clippy
# guidance, https://doc.rust-lang.org/clippy/lints.html).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# ── the panic family — closed completely ────────────────────────────────────
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"                      # recoverable = Result; a panic is never a designed outcome
unimplemented = "deny"
todo = "deny"                       # owner rule 2026-07-12: no todo!() ever
unreachable = "deny"                # unreachable!() is a panic; a "cannot happen" state gets a typed error
panic_in_result_fn = "deny"         # a fn returning Result must not panic/assert instead
missing_assert_message = "deny"     # production asserts carry a message (lint ignores test fns by design)
dbg_macro = "deny"
print_stdout = "deny"               # libraries speak tracing; binaries/tools relax per-crate
print_stderr = "deny"
incompatible_msrv = "deny"          # MSRV 1.96 is a hard pin
unchecked_time_subtraction = "deny" # std::time::Duration::sub panics on negative durations; jiff is the safe alternative
as_conversions = "deny"             # `as` silently truncates; use TryFrom/TryInto or explicit casts

# ── no panicking indexing (reliability.md; request paths must not panic) ────
indexing_slicing = "deny"
string_slice = "deny"               # UTF-8 boundaries panic; clinical text is multi-byte

# ── determinism (canonical JSON/XML output is byte-deterministic) ───────────
iter_over_hash_type = "deny"        # HashMap/HashSet iteration order is undefined

# ── silent-discard / silent-loss ─────────────────────────────────────────────
unused_result_ok = "deny"           # `.ok();` looks like a check but only silences #[must_use]
map_err_ignore = "warn"             # map_err(|_| …) throws away the cause

# ── numeric honesty (silent wrong answers are worse than loud failures) ─────
float_cmp_const = "deny"            # pedantic float_cmp misses comparisons to consts
lossy_float_literal = "deny"
as_underscore = "deny"              # `as _` hides the target type of a cast
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"            # shifts mixed with masks — classic wrong-answer bug
suspicious_xor_used_as_pow = "deny" # `2 ^ 8` meaning "2 to the 8th"
integer_division = "warn"           # division discards the remainder — annotate intent

# ── the #[allow] escape hatch, machine-enforced (reliability.md) ─────────────
allow_attributes_without_reason = "deny"  # every suppression carries reason = "…"
allow_attributes = "warn"                 # prefer #[expect]: stale suppressions self-report
                                          # (unfulfilled_lint_expectations); inner #![allow] exempt

# ── the SAFETY-comment convention (free under forbid(unsafe_code)) ───────────
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny" # `// SAFETY:` stays reserved for unsafe code
unnecessary_safety_doc = "deny"     # `# Safety` sections likewise

# ── process / IO / container hygiene ─────────────────────────────────────────
exit = "deny"                       # std::process::exit gives no troubleshooting path
verbose_file_reads = "deny"         # File::read_to_* → fs::read*
filetype_is_file = "deny"           # FileType::is_file is not a readability test
create_dir = "deny"                 # create_dir → create_dir_all
large_include_file = "deny"         # 1 MB cap; largest include today is the 646 KB ITS-JSON schema
rc_buffer = "deny"                  # Rc<String>/Arc<Vec<T>> → Rc<str>/Arc<[T]>
rc_mutex = "deny"                   # Rc<Mutex<T>> is always the wrong shape
mem_forget = "deny"
pointer_format = "deny"             # no address leakage into logs/Debug output
empty_drop = "warn"
deref_by_slicing = "warn"
try_err = "warn"
clone_on_ref_ptr = "warn"           # Arc::clone(&x) makes pointer-only cloning explicit
cfg_not_test = "warn"               # code excluded from test builds is untested code
infinite_loop = "warn"              # an intentional infinite loop returns `!`
mixed_read_write_in_expression = "warn"
same_name_method = "warn"

# ── nursery cherry-picks (the group stays off — "buggy or need more work")
debug_assert_with_mut_call = "warn" # a side-effecting debug_assert! vanishes in release
too_long_first_doc_paragraph = "warn" # RFC 1574 summary line: one short first sentence, blank
                                      # line, then detail (.claude/rules/comments.md); generated
                                      # crates comply via the emitter, never by hand-edit

# ── cargo group (not part of `all`) ──────────────────────────────────────────
wildcard_dependencies = "deny"
negative_feature_names = "deny"     # `no-foo` features invert additive semantics
redundant_feature_names = "deny"    # `use-x`/`with-x` placeholder words (C-FEATURE)

[workspace.lints.rust]
unsafe_code = "forbid"              # NOTE: forbid cannot be relaxed by attribute — not even
                                    # #[allow] compiles under it (rustc book, lint levels); a
                                    # member needing unsafe would have to stop inheriting this
                                    # table entirely, which is a design decision, not an allow.
missing_debug_implementations = "warn"
missing_docs = "warn"               # every public item is documented (C-CRATE-DOC/C-DOC);
                                    # generated crates get theirs from the emitter (BMM docs)
dead_code = "deny"                  # owner rule 2026-07-12: no dead code, ever — delete or wire it
let_underscore_drop = "deny"        # `let _ = lock/tx;` drops the guard immediately
                                    # (must_use discards like `let _ = write!(String)` are the
                                    #  infallible-fmt idiom — NOT denied; the guard class above is)
let_underscore_lock = "deny"        # the same guard-drop, caught at the lock site
unreachable_pub = "warn"            # visibility is deliberate (CI-deny via -D warnings)
non_ascii_idents = "forbid"         # ASCII-only identifiers — no homoglyphs in clinical code
                                    # (rustc book: the security rationale for this lint)

# free guards — zero findings expected; defence in depth
non_local_definitions = "deny"      # RFC 3373: an `impl` inside a fn body is visible OUTSIDE it,
                                    # so it reads as scoped and is not (warn-by-default since 1.83)
unexpected_cfgs = "deny"            # RFC 3013: a typo'd `cfg(feature = "…")` compiles the block
                                    # out silently — the ferroehr-ext feature gates live on this
unsafe_op_in_unsafe_fn = "deny"     # moot under forbid(unsafe_code); costs nothing
ffi_unwind_calls = "deny"           # no FFI in the workspace; keeps it that way
deprecated_safe_2024 = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"

# real bug classes, low noise
unit_bindings = "warn"              # `let x = f();` where f returns () — a silent mistake
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"      # pairs with the zero-re-export import discipline
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "deny"  # `-x.pow(2)` reads wrong — numeric clarity
# NOTE: clippy::arithmetic_side_effects (checked-math-everywhere) is NOT
# enabled (owner ruling 2026-08-01, issue #1426): silent-overflow safety is
# already guaranteed by `overflow-checks = true` in [profile.release] — an
# overflow panics loudly instead of wrapping into a wrong clinical value
# (https://doc.rust-lang.org/cargo/reference/profiles.html#overflow-checks) —
# and a blanket checked-math mandate would invite the silent saturating/
# default dodges this table exists to prevent. Do not re-add it here: it is
# a CLIPPY restriction lint, so a bare entry in this rust table is inert and
# only emits a deprecated-lint-name warning on every crate.

[workspace.lints.rustdoc]
# Enforced by the CI doc job (RUSTDOCFLAGS=-D warnings, cargo doc --workspace)
# — lint levels here apply to every `cargo doc` run, local and CI
# (https://doc.rust-lang.org/rustdoc/lints.html).
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"   # a `should-panic` typo silently disables a doctest
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"
missing_crate_level_docs = "warn"       # every crate opens with //! docs (C-CRATE-DOC)

# ─────────────────────────────────────────────────────────────────────────────
# WORKSPACE DEPENDENCIES  (pinned; features set at the crate that enables them)
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]

# ── Web framework & HTTP core ────────────────────────────────────────────────
axum = "0.8"                        # 0.8.8 current (MSRV 1.78)
axum-extra = { version = "0.12.6", features = ["typed-header", "query"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }   # graceful shutdown + TLS
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed"] }
tower-http = { version = "0.7.0", features = [
  "trace", "cors", "compression-full", "decompression-full", "timeout",
  "limit", "request-id", "sensitive-headers", "catch-panic", "normalize-path", "set-header",
] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http = "1"                          # StatusCode, HeaderMap, Method
http-body = "1"
http-body-util = "0.1"
mime = "0.3"
mime_guess = "2"
headers = "0.4"
bytes = "1"

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"                 # still handy for dyn traits; native async-fn-in-trait since 1.75
pin-project-lite = "0.2"

# ── Authentication & authorization (do NOT hand-roll) ────────────────────────
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }   # JWT encode/decode/validate; aws-lc-rs crypto provider (matches the rustls stack)
oauth2 = { version = "5", default-features = false } # OAuth2 client (HTTP-client agnostic: we supply the pinned reqwest)
openidconnect = "4"                 # OIDC / Keycloak          (verify latest 4.x)
argon2 = "0.5"                      # password hashing (Argon2id); its `password-hash` feature re-exports the PHC string traits
tower-sessions = "0.15.0"            # session middleware        (verify latest)
axum-login = "0.18.0"               # authn/authz for axum      (verify latest)
secrecy = "0.10"                   # wrap secrets, avoid logging
zeroize = "1"
# RBAC/ABAC policy engine for the Stage 2 access-control restoration (pick one at S2):
casbin = "2"                        # RBAC/ABAC policy engine   (verify latest)
cedar-policy = "4"                  # alternative policy engine (verify latest)

# ── TLS / crypto foundations ─────────────────────────────────────────────────
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1.0.8"
# NOTE: `app/ferroehr` deliberately pins rand 0.8 at the crate level instead of
# using this one — it passes `OsRng` into `pgp`'s signing API, so its rand
# generation must match pgp's (`pgp 0.20` requires rand 0.8.7). Bump that pin
# only when pgp does.
rand = "0.10.1"
getrandom = "0.4.3"
sha2 = "0.11.0"
hmac = "0.13.0"
blake3 = "1"
object_store = { version = "0.14.0", features = ["aws"] }   # S3-compatible blob backend for DV_MULTIMEDIA externalization; SeaweedFS in dev/test
pgp = { version = "0.20.0", default-features = false }   # rPGP — pure-Rust OpenPGP (RFC 4880/9580); version signing (no OpenSSL/C, fits the rustls-only stack). default-features off drops the bzip2 (libbz2-rs-sys) dep — detached signatures need no compression, and it fails the cargo-deny license gate.

# ── OpenAPI / Swagger (code-first) ───────────────────────────────────────────
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-axum = "0.2.0"                  # route-matched OpenAPI
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }   # 9.0.2; serves Swagger UI (vendored = offline build, no curl download)
# Swagger UI is the ONE document viewer this server ships; the alternative
# utoipa viewers (redoc/scalar/rapidoc) were pinned here but never consumed by
# any member, so they are gone. Re-add one only when a crate actually serves it.

# ── Database & persistence ───────────────────────────────────────────────────
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros",
  "migrate", "uuid", "json", "rust_decimal", "chrono",
] }                                  # 0.9.x (MSRV 1.94). NOTE: sqlx has no jiff feature; use jiff-sqlx wrapper types at the query boundary.
sea-query = { version = "1.0.1", features = ["backend-postgres", "with-uuid", "with-json", "with-rust_decimal", "postgres-array"] }
sea-query-sqlx = { version = "0.9.1", features = ["sqlx-postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres-array", "with-uuid", "with-json", "with-rust_decimal"] }   # the sea-query 1.0 <-> sqlx 0.9 binder (successor of sea-query-binder, which is stuck on sea-query 0.32). NOTE: its with-jiff+postgres is unimplemented upstream — bind timestamps via jiff-sqlx on plain sqlx queries, or chrono at the binder boundary.
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }   # official jiff<->sqlx 0.9 codec for plain sqlx queries
deadpool-postgres = "0.14"         # optional pipelined hot-read path (verify latest)
tokio-postgres = "0.7"            # paired with deadpool for pipelining

# ── Serialization & data formats ─────────────────────────────────────────────
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_with = "3"
# Number formatters for the openehr-its native canonical-JSON codec
# (`json_codec`): integers via itoa (byte-identical to serde_json), reals via
# ryu (the chosen canonical REAL lexeme — spec-silent, our own design; see
# openehr-its/src/json_codec/runtime.rs).
itoa = "1"
ryu = "1"
serde_path_to_error = "0.1"
quick-xml = { version = "0.41.0", features = ["serialize"] }   # verify latest 0.3x
roxmltree = "0.21"                   # read-only XML DOM — XSD reader for the XML codegen
serde_norway = "0.9"                 # maintained serde_yaml fork — parse vendored OAS YAML for the REST codegen
serde-saphyr = "1.0.0-rc.1"          # pure-Rust YAML 1.2 front-end (no RUSTSEC; alias-expansion Budget) — the CNF 2.0 schedule authoring surface (tools/cnf-runner)
semver = "1.0.28"                    # Cargo/semver requirement syntax for the CNF case `applies` spec-version ranges
base64 = "0.23"
# Typed FHIR R4B resource model (fhir-sdk's model half) — the typed surface of
# the FHIR integration extension (`app/ferroehr-ext`, `fhir` feature): the ATNA
# BALP `AuditEvent` we author and the `Parameters`/`ValueSet` a terminology
# server answers with. Verified live on crates.io 2026-08-04 (0.13.0, MSRV
# 1.95). default-features off drops the r5 model; `r4b` is the declared FHIR
# surface and `builders` supplies the derive_builder constructors. It is
# consumed ONLY from ferroehr-ext — no other crate names a `fhir_model` type.
fhir-model = { version = "0.13.0", default-features = false, features = ["r4b", "builders"] }
# ZIP container writer/reader — the SM COMPRESSION_FORMAT member `zip`
# (docs/specs/openehr/SM/docs/UML/classes/compression_format.adoc) for the admin
# dump/load archive. default-features off keeps it to the DEFLATE method over
# the already-present pure-Rust flate2 backend (no aes/bzip2/lzma/ppmd/zstd/xz
# C stacks); the crate is already in the resolved graph.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# `service::admin::dump_load`: the SM COMPRESSION_FORMAT member `7z`
# (compression_format.adoc) — pure Rust, verified live on crates.io 2026-07-29
# (0.21.3, actively maintained).
# default features off: the bzip2/aes side-codecs drag deps we neither need
# nor allow (bzip2-1.0.6 license); 7z's native LZMA2 rides `compress` alone.
sevenz-rust2 = { version = "0.21", default-features = false, features = ["compress"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }   # BigDecimal replacement (DV_QUANTITY)
rust_decimal_macros = "1"
ordered-float = "5.3.0"
# canonical JSON (RFC 8785 JCS) for hashing/audit — small, pick one or hand-roll:
serde_jcs = "0.2.0"                  # verify; otherwise implement ~150 LoC

# ── Parsing (native ADL / cADL / ODIN / AQL) ─────────────────────────────────
logos = "0.16.1"                      # DFA lexer
chumsky = "0.13.0"                    # 0.10 usable stable (1.0 still alpha; repo now on Codeberg)
winnow = "1.0.3"                      # alternative parser combinator
regex = "1"
fancy-regex = "0.19.0"               # backreferences for cADL where needed (verify)
# parser diagnostics (great for ADL/AQL error reporting):
ariadne = "0.6.0"                    # verify
miette = { version = "7", features = ["fancy"] }

# ── Identifiers, time, validation ────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "v7", "serde", "fast-rng"] }
jiff = { version = "0.2.31", features = ["serde"] }   # 1.0 not yet out as of 2026-07; 0.2.31 pinned for ISO 8601 temporal work
garde = { version = "0.23.0", features = ["derive"] }   # verify latest
url = "2"
urlencoding = "2.1.3"
# WHATWG query-string pair splitting (`+`→space + percent-decoding in one call).
# Already in the graph as a dependency of `url`; pinned explicitly because a
# workspace member uses it directly rather than through `url`.
form_urlencoded = "1.2.2"
csv = "1.4"                        # RESULT_SET → CSV export (admin console BFF; verified live 2026-07-18)

# ── Admin console (Leptos stack — app/ferroehr-admin-ui; pins re-verified live 2026-07-17) ──
leptos = "0.8.20"
leptos_axum = "0.8.10"
leptos_meta = "0.8.6"
leptos_router = "0.8.14"
# thaw: the crates.io `0.5.0-beta` (2025-05-03, the only Leptos-0.8 release) lacks
# `#![recursion_limit = "256"]` and fails plain (non-erase_components) codegen on
# rustc 1.96 — thaw main carries the fix, so we pin a main rev (the design doc's
# planned fallback, 2026-07-17). Re-pin to crates.io when 0.5 stable ships.
thaw = { git = "https://github.com/thaw-ui/thaw", rev = "0726a3d6788f07e929996e77399d83655ffaacde" }
leptos-use = "0.19.0"
leptos-struct-table = "0.19.0"
leptos-chartistry = "0.2.3"
leptos_icons = "0.7.1"              # pure-Rust SVG icon component (verified: requires leptos >=0.8.3)
icondata_lu = "0.1"                 # the Lucide pack alone (the icondata umbrella pulls every pack — WASM bloat)
icondata_core = "0.1"               # the `Icon` type itself (named in component props)
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"       # JsFuture for browser-side file reads (compiles on native, runs in wasm)
console_error_panic_hook = "0.1"
thirtyfour = "0.37.2"               # E2E WebDriver client (dev-dep of the console)

# ── Observability (opentelemetry set is lockstep: keep versions equal) ────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-opentelemetry = "0.33"     # pairs with opentelemetry 0.31 line (verify matching set)
tracing-flame = "0.2"              # span-timing flamegraph capture (folded stacks; render via inferno)
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "experimental_metrics_custom_reader"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.32.1"
# The PULL surface (/management/prometheus), served from the SAME MeterProvider
# as the OTLP push — one metrics system, so a family cannot exist on one
# surface and not the other (#2181). Needs the SDK's custom-reader feature.
opentelemetry-prometheus = "0.32"
prometheus = "0.14"
axum-prometheus = "0.10.0"                # verify latest
# In-process sampling CPU profiler. Its own `criterion` feature is pinned to
# criterion ^0.5 (verified on crates.io 2026-08-04) — incompatible with our
# criterion 0.8 — so benches implement criterion's `Profiler` trait over this
# crate directly instead of enabling it. Its `flamegraph` feature is OFF on
# purpose (#2406): that feature pins `inferno ^0.11`, whose quick-xml 0.26
# carries RUSTSEC-2026-0194/0195; the SVG render goes through the direct
# `inferno` dependency below instead, reproducing pprof's own fold.
pprof = { version = "0.15.0" }
# Flamegraph SVG renderer, at the quick-xml >= 0.41 line. `nameattr` mirrors
# the feature pprof's flamegraph feature enabled, so the render is identical.
inferno = { version = "0.12", features = ["nameattr"] }

# ── Caching, rate limiting, resilience ───────────────────────────────────────
moka = { version = "0.12", features = ["future"] }   # Caffeine equivalent (template/WebTemplate cache)
quick_cache = "0.7.0"
# Rate limiting for axum (GCRA via `governor`). `tonic` is in its default
# feature set and we serve no gRPC, so only `axum` is enabled; `tracing` stays
# off deliberately — its hooks would put a bucket key (a subject id or client
# address) into telemetry.
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
governor = "0.10.4"                  # underlying limiter (verify latest)
backon = "1"                      # retry/backoff (backoff crate is deprecated)
lapin = "4"                       # AMQP 0.9.1 client (RabbitMQ) — contribution-outbox eventing

# ── Errors & utilities ───────────────────────────────────────────────────────
thiserror = "2"                    # v2 current
anyhow = "1"                       # binaries only
config = "0.15.25"                   # the one server-config loader (W-13); figment removed
toml = "1"                         # standalone TOML parser + `config check`/`/management/env` render
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
dashmap = "6"
arc-swap = "1"
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
itertools = "0.15.0"
bitflags = "2"
# once_cell no longer needed for statics on edition 2024: use std::sync::LazyLock.

# ── HTTP client & external integration ───────────────────────────────────────
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip", "brotli"] }
jsonschema = "0.49.3"               # validate against openEHR ITS-JSON schemas (verify latest)

# ── Dev / test (dev-dependencies at the crate level) ─────────────────────────
insta = { version = "1", features = ["json", "redactions", "filters"] }
proptest = "1"
rstest = "0.26.1"                   # verify latest
wiremock = "0.6"
mockall = "0.15.0"                  # verify latest
fake = "5.1.0"                        # verify latest
assert_cmd = "2"
assert_fs = "1"
# HELD at 0.27 by testcontainers-modules: its newest release (0.15.0) requires
# testcontainers ^0.27, and bollard-stubs pins an exact version per bollard
# line, so 0.27 + 0.28 cannot coexist in one lock. Bump both together once a
# testcontainers-modules release targets 0.28.
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "rabbitmq"] }   # verify latest
criterion = { version = "0.8.2", features = ["html_reports"] }
divan = "0.1"
hdrhistogram = "7.5.4"               # coordinated-omission-corrected latency (tools/benchmark)
sysinfo = "0.39.5"                   # CPU/RSS sampling for the benchmark harness

# Cargo plugins used in CI (installed, not dependencies):
#   cargo-nextest, cargo-audit, cargo-deny, cargo-machete, cargo-hakari,
#   cargo-llvm-cov, sccache ; linker: mold (Linux).
#
# Toolchain: Rust stable 1.97.1, edition 2024. The MSRV stays 1.96 — nothing
# here uses a 1.97 feature, and the eight published crates are the only
# artifacts whose consumers would feel a bump (docs/VERSIONS.md §MSRV policy).
# Database: PostgreSQL 18 (target 18.6+; 18.x is the current stable line; PG 19 in beta — do not target).

# ── Build-speed profiles ─────────────────────────────────────────────────────
# Full debuginfo on ~400 deps + 18 workspace crates made dev builds/links slow
# and grew target/ past 190 GB. Line tables keep file:line backtraces for our
# code; dependencies get none (their debuginfo is never read in this repo).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Clinical-grade release posture: integer overflow must FAIL LOUDLY (a panic
# → the catch-panic layer's clean 500 + log), never wrap silently into a
# wrong stored/served value. The few-percent CPU cost is accepted and is
# carried by the benchmarks (measurements stay honest to production).
[profile.release]
overflow-checks = true
# `panic = "unwind"` is the Cargo default, pinned EXPLICITLY because the whole
# clean-500 reliability design depends on it: tower-http's CatchPanic layer is
# std::panic::catch_unwind, which "only catches unwinding panics, not those
# that abort the process" (https://doc.rust-lang.org/std/panic/fn.catch_unwind.html).
# Under panic = "abort" one panicking request kills the entire server — and no
# test would catch the regression, because "tests … ignore the panic setting"
# (https://doc.rust-lang.org/cargo/reference/profiles.html#panic). Never change.
panic = "unwind"
# file:line backtraces in production panics (the overflow-checks posture is
# worthless without a traceable panic site); "line-tables-only" is the minimal
# debuginfo for backtraces (https://doc.rust-lang.org/cargo/reference/profiles.html#debug).
# `strip` stays at its default "none": stripping symbols makes traces
# "incomprehensible" (rustc book, -Cstrip) — never enable it for size.
debug = "line-tables-only"

# WASM bundle profile for the admin console (Leptos book `deployment/binary_size`):
# size-optimized client bundle, wired via the crate's `lib-profile-release`.
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
