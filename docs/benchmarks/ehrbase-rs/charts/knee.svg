.muted { fill: #8f8e85; }
.grid { stroke: #3a3a38; }
.s1 { fill: #3987e5; } .s1s { stroke: #3987e5; }
.s2 { fill: #199e70; } .s2s { stroke: #199e70; }
}
</style>
