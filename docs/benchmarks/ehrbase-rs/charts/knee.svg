<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" role="img" aria-label="Knee/saturation curve — sustained req/s vs p99 latency">
<style>
text { fill: #52514e; font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.title { fill: #0b0b0b; font-weight: 600; }
.muted { fill: #8a8880; font-size: 11px; }
.grid { stroke: #e4e2dd; stroke-width: 1; }
.s1 { fill: #2a78d6; } .s1s { stroke: #2a78d6; }
.s2 { fill: #1baf7a; } .s2s { stroke: #1baf7a; }
