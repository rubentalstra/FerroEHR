<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" role="img" aria-label="Knee/saturation curve — sustained req/s vs p99 latency">
<style>
text { fill: #52514e; font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.title { fill: #0b0b0b; font-weight: 600; }
.muted { fill: #8a8880; font-size: 11px; }
.grid { stroke: #e4e2dd; stroke-width: 1; }
.s1 { fill: #2a78d6; } .s1s { stroke: #2a78d6; }
.s2 { fill: #1baf7a; } .s2s { stroke: #1baf7a; }
@media (prefers-color-scheme: dark) {
text { fill: #c3c2b7; }
.title { fill: #ffffff; }
.muted { fill: #8f8e85; }
.grid { stroke: #3a3a38; }
.s1 { fill: #3987e5; } .s1s { stroke: #3987e5; }
.s2 { fill: #199e70; } .s2s { stroke: #199e70; }
}
</style>
<text x="16" y="22" class="title">Knee — sustained req/s vs p99 latency (log scale)</text>
<line class="grid" x1="64" y1="210.0" x2="660" y2="210.0"/>
<text class="muted" x="56.0" y="214.0" text-anchor="end">100.0ms</text>
<line class="grid" x1="64" y1="185.6" x2="660" y2="185.6"/>
<text class="muted" x="56.0" y="189.6" text-anchor="end">200.0ms</text>
<line class="grid" x1="64" y1="153.4" x2="660" y2="153.4"/>
<text class="muted" x="56.0" y="157.4" text-anchor="end">500.0ms</text>
<line class="grid" x1="64" y1="129.0" x2="660" y2="129.0"/>
<text class="muted" x="56.0" y="133.0" text-anchor="end">1.0s</text>
<line class="grid" x1="64" y1="104.6" x2="660" y2="104.6"/>
<text class="muted" x="56.0" y="108.6" text-anchor="end">2.0s</text>
<line class="grid" x1="64" y1="72.4" x2="660" y2="72.4"/>
<text class="muted" x="56.0" y="76.4" text-anchor="end">5.0s</text>
<line class="grid" x1="64" y1="48.0" x2="660" y2="48.0"/>
<text class="muted" x="56.0" y="52.0" text-anchor="end">10.0s</text>
<line class="s2s" x1="64" y1="129.0" x2="660" y2="129.0" stroke-dasharray="4 3"/>
<text class="muted" x="620.0" y="125.0">SLO 1s</text>
<text class="muted" x="660" y="228.0" text-anchor="end">454 req/s</text>
<polyline class="s1s" fill="none" stroke-width="2" points="482.0,137.4 585.4,190.4 610.3,94.6 652.5,106.7 660.0,85.0"/>
<circle class="s1" cx="482.0" cy="137.4" r="3.5"/>
<text x="488.0" y="133.4">L=32</text>
<text class="muted" x="488.0" y="149.4">788.5ms</text>
<circle class="s1" cx="585.4" cy="190.4" r="3.5"/>
<text x="591.4" y="186.4">L=40</text>
<text class="muted" x="591.4" y="202.4">174.5ms</text>
<circle class="s1" cx="610.3" cy="94.6" r="3.5"/>
<text x="616.3" y="90.6">L=42</text>
<text class="muted" x="616.3" y="106.6">2.7s</text>
<circle class="s1" cx="652.5" cy="106.7" r="3.5"/>
<text x="658.5" y="102.7">L=44</text>
<text class="muted" x="658.5" y="118.7">1.9s</text>
<circle class="s1" cx="660.0" cy="85.0" r="3.5"/>
<text x="666.0" y="81.0">L=48</text>
<text class="muted" x="666.0" y="97.0">3.5s</text>
</svg>
