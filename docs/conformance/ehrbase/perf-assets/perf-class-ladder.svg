<svg xmlns="http://www.w3.org/2000/svg" width="640" height="292" role="img" viewBox="0 0 640 292"><style>text{fill:#52514e;font:12px -apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif}.title{fill:#0b0b0b;font-weight:600}.muted{fill:#8a8880;font-size:11px}.grid{stroke:#e4e2dd;stroke-width:1}.measured{fill:#2a78d6}.floor{fill:none;stroke:#8a8880;stroke-width:1.5;stroke-dasharray:4 3}.notearned{fill:#b3261e;font-weight:600}@media (prefers-color-scheme:dark){text{fill:#c3c2b7}.title{fill:#fff}.muted{fill:#8f8e85}.grid{stroke:#3a3a38}.measured{fill:#3987e5}.floor{stroke:#8f8e85}.notearned{fill:#e5484d}}</style><text x="24" y="28" class="title">Performance class ladder — offered-load floors vs measured sustained load</text><text x="24" y="48" class="muted">Floors are the request rate the hospital-simulation workload must sustain against the class corpus.</text><text x="24" y="63" class="muted">A class is earned only with p99 ≤ 1 s on every measured operation and zero errors under that load.</text><line x1="170" x2="170" y1="92" y2="268" class="grid"/><text x="170" y="284" class="muted" text-anchor="middle">1/s</text><line x1="264.9" x2="264.9" y1="92" y2="268" class="grid"/><text x="264.9" y="284" class="muted" text-anchor="middle">10/s</text><line x1="359.8" x2="359.8" y1="92" y2="268" class="grid"/><text x="359.8" y="284" class="muted" text-anchor="middle">100/s</text><line x1="454.7" x2="454.7" y1="92" y2="268" class="grid"/><text x="454.7" y="284" class="muted" text-anchor="middle">1000/s</text><text x="24" y="108">class POC</text><text x="24" y="122" class="muted">floor 2/s</text><rect width="28.6" height="16" x="170" y="100" class="floor" rx="4"/><rect width="29.3" height="16" x="170" y="100" class="measured" rx="4"/><text x="516" y="113" class="notearned">NOT EARNED</text><text x="24" y="152">class S</text><text x="24" y="166" class="muted">floor 15/s</text><rect width="111.6" height="16" x="170" y="144" class="floor" rx="4"/><text x="516" y="157" class="muted">not measured</text><text x="24" y="196">class L</text><text x="24" y="210" class="muted">floor 150/s</text><rect width="206.5" height="16" x="170" y="188" class="floor" rx="4"/><text x="516" y="201" class="muted">not measured</text><text x="24" y="240">class R</text><text x="24" y="254" class="muted">floor 1500/s</text><rect width="301.4" height="16" x="170" y="232" class="floor" rx="4"/><text x="516" y="245" class="muted">not measured</text></svg>