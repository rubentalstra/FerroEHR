<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img">
<style>
text { fill: #52514e; font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.title { fill: #0b0b0b; font-weight: 600; }
.muted { fill: #8a8880; font-size: 11px; }
.grid { stroke: #e4e2dd; stroke-width: 1; }
.p50 { fill: #7db4ea; } .p90 { fill: #3d7fd0; } .p99 { fill: #1b5cab; }
.measured { fill: #2a78d6; }
.floor { fill: none; stroke: #8a8880; stroke-width: 1.5; stroke-dasharray: 4 3; }
.earned { fill: #1baf7a; font-weight: 600; }
.notearned { fill: #b3261e; font-weight: 600; }
.slo { stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 6 4; }
.slotext { fill: #b3261e; font-size: 11px; }
.sut { stroke: #2a78d6; fill: none; stroke-width: 1.8; }
.db { stroke: #8a8880; fill: none; stroke-width: 1.6; stroke-dasharray: 5 3; }
.warm { fill: #efede8; }
.curve { stroke: #2a78d6; fill: none; stroke-width: 2; }
.cmp { stroke: #8a8880; fill: none; stroke-width: 2; stroke-dasharray: 7 4; }
.cmpfill { fill: #8a8880; }
.knee { stroke: #1baf7a; stroke-width: 2; stroke-dasharray: 2 3; }
@media (prefers-color-scheme: dark) {
text { fill: #c3c2b7; }
.title { fill: #ffffff; }
.muted { fill: #8f8e85; }
.grid { stroke: #3a3a38; }
.p50 { fill: #3d5f82; } .p90 { fill: #3987e5; } .p99 { fill: #9ec7ef; }
.measured { fill: #3987e5; }
.floor { stroke: #8f8e85; }
.earned { fill: #26c78d; }
.notearned { fill: #e5484d; }
.slo { stroke: #e5484d; }
.slotext { fill: #e5484d; }
.sut { stroke: #3987e5; }
.db { stroke: #8f8e85; }
.warm { fill: #2a2a28; }
.curve { stroke: #3987e5; }
.cmp { stroke: #8f8e85; }
.cmpfill { fill: #8f8e85; }
.knee { stroke: #26c78d; }
}
</style>
<text x="24" y="28" class="title">Latency-throughput curve — step-load stress to the maximum sustainable throughput</text>
<text x="24" y="44" class="muted">Short intense load steps (120 s hold) on the cnf.scale.10k corpus · exploration only — never a conformance record</text>
<text x="24" y="59" class="muted">Circles hold the envelope, crosses breach it; the dotted line is the last rate held inside the envelope — the knee.</text>
<line x1="90.0" y1="80" x2="90.0" y2="330" class="grid"/><text x="90.0" y="346.0" class="muted" text-anchor="middle">1/s</text>
<line x1="251.5" y1="80" x2="251.5" y2="330" class="grid"/><text x="251.5" y="346.0" class="muted" text-anchor="middle">10/s</text>
<line x1="412.9" y1="80" x2="412.9" y2="330" class="grid"/><text x="412.9" y="346.0" class="muted" text-anchor="middle">100/s</text>
<line x1="574.4" y1="80" x2="574.4" y2="330" class="grid"/><text x="574.4" y="346.0" class="muted" text-anchor="middle">1000/s</text>
<line x1="90" y1="330.0" x2="700" y2="330.0" class="grid"/><text x="82.0" y="334.0" class="muted" text-anchor="end">1 ms</text>
<line x1="90" y1="263.8" x2="700" y2="263.8" class="grid"/><text x="82.0" y="267.8" class="muted" text-anchor="end">10 ms</text>
<line x1="90" y1="197.7" x2="700" y2="197.7" class="grid"/><text x="82.0" y="201.7" class="muted" text-anchor="end">100 ms</text>
<line x1="90" y1="131.5" x2="700" y2="131.5" class="grid"/><text x="82.0" y="135.5" class="muted" text-anchor="end">1000 ms</text>
<line x1="90" y1="131.5" x2="700" y2="131.5" class="slo"/><text x="696.0" y="125.5" class="slotext" text-anchor="end">p99 budget</text>
<path d="M90.0,80.0 L90.0,80.0 L90.0,80.0 L138.6,80.0" class="curve"/>
<path d="M85.0,75.0 L95.0,85.0 M85.0,85.0 L95.0,75.0" class="slo" stroke-width="2"/>
<path d="M85.0,75.0 L95.0,85.0 M85.0,85.0 L95.0,75.0" class="slo" stroke-width="2"/>
<path d="M85.0,75.0 L95.0,85.0 M85.0,85.0 L95.0,75.0" class="slo" stroke-width="2"/>
<path d="M133.6,75.0 L143.6,85.0 M133.6,85.0 L143.6,75.0" class="slo" stroke-width="2"/>
<line x1="90.0" y1="80" x2="90.0" y2="330" class="knee"/><text x="96.0" y="320.0" class="earned" text-anchor="start">max sustainable 0/s</text>
</svg>
