<svg xmlns="http://www.w3.org/2000/svg" width="640" height="312" role="img" viewBox="0 0 640 312"><style>text{fill:#52514e;font:12px -apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif}.title{fill:#0b0b0b;font-weight:600}.muted{fill:#8a8880;font-size:11px}.grid{stroke:#e4e2dd;stroke-width:1}.measured{fill:#2a78d6}@media (prefers-color-scheme:dark){text{fill:#c3c2b7}.title{fill:#fff}.muted{fill:#8f8e85}.grid{stroke:#3a3a38}.measured{fill:#3987e5}}</style><text x="24" y="28" class="title">Disk growth — database volume across the class POC measured run</text><text x="24" y="48" class="muted">The volume&apos;s on-disk size at the run&apos;s four anchors, probed read-only inside the DB container.</text><text x="24" y="63" class="muted">The scale-seed step yields the storage cost per committed composition · measured context, never a verdict input.</text><line x1="60" x2="580" y1="244" y2="244" class="grid"/><text x="120" y="262" class="muted" text-anchor="middle">empty</text><rect width="84" height="2" x="78" y="242" class="measured" rx="4"/><text x="120" y="234" text-anchor="middle">77 MB</text><text x="260" y="262" class="muted" text-anchor="middle">after scale seed</text><rect width="84" height="133.1" x="218" y="110.9" class="measured" rx="4"/><text x="260" y="102.9" text-anchor="middle">7.2 GB</text><text x="400" y="262" class="muted" text-anchor="middle">after ward seed</text><rect width="84" height="144" x="358" y="100" class="measured" rx="4"/><text x="400" y="92" text-anchor="middle">7.8 GB</text><text x="540" y="262" class="muted" text-anchor="middle">after window</text><rect width="84" height="143.2" x="498" y="100.8" class="measured" rx="4"/><text x="540" y="92.8" text-anchor="middle">7.8 GB</text><text x="260" y="278" class="muted" text-anchor="middle">≈ 7.1 KB / composition (1,000,000 committed)</text></svg>