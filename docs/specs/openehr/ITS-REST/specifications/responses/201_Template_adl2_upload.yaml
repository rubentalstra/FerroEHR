description: |
  `201 Created` is returned when the template has been successfully uploaded.
  If `Prefer` header is `return=representation`, the full resource is included in the response body; if is `return=identifier`, only its unique identifier is included. 
  If the `Prefer` header is missing or set to `return=minimal`, the body is empty.
headers:
  Location:
    $ref: ../headers/Location_Template_adl2.yaml
  ETag:
    $ref: ../headers/ETag_Template_adl2.yaml
  Content-Type:
    $ref: ../headers/ContentType_Template_adl2.yaml
content:
  text/plain:
    schema:
      $ref: ../schemas/aom/OperationalTemplateV2.yaml
  application/json:
    schema:
      $ref: ../schemas/others/TemplateIdentifier.yaml