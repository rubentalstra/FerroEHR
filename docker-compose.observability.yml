# Observability overlay for the FerroEHR quickstart — STANDALONE, like
# docker-compose.keycloak.yml: download it beside docker-compose.yml and run
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up
#
# (In a repo checkout, add -f docker-compose.override.yml before it to build
# from source.)
#
# Adds a single-container LGTM stack (grafana/otel-lgtm = OTLP collector +
# Prometheus + Tempo + Loki + Grafana) and points the app at it:
#   - traces  → OTLP/gRPC to otel-lgtm:4317 (→ Tempo)
#   - metrics → OTLP/gRPC to otel-lgtm:4317 (→ Prometheus, via its OTLP receiver)
#   - logs    → stdout as JSON lines (12-factor; the platform collects them)
#
# Metrics are PUSHED, not scraped, because this image cannot scrape: it starts
# Prometheus with `--config.file=./prometheus.yaml`, a file carrying `otlp:`,
# `storage:` and `global:` and NO `scrape_configs` or `scrape_config_files`
# (`/otel-lgtm/prometheus/prometheus.yml` looks like a scrape config and is a
# sample the process never loads). Metrics reach it over OTLP from the bundled
# collector. An earlier version of this overlay mounted a scrape job into
# `/otel-lgtm/prometheus/scrape-configs/`, which nothing reads — so every metric
# panel on the dashboard was empty with no error anywhere (#2173).
#
# The management surface is enabled on an INTERNAL port (9464) exposed only on
# the compose network — never published to the host. Grafana (3000) is the only
# published port. This overlay is a manual dev convenience, not a CI job.
services:
  ferroehr:
    # Every server setting uses the ONE strict env grammar: `FERROEHR` + the TOML
    # path, upper-cased, with `__` between EVERY segment (including after the
    # prefix). The boot-time sweep of the reserved `FERROEHR_` namespace REJECTS
    # any other spelling — a single-`_` variable is a startup error, not a
    # silently ignored setting, so these names must stay in this form.
    environment:
      # Traces AND metrics to the LGTM collector ([telemetry]). Unset
      # otlp_endpoint would leave the OTel layer out entirely.
      FERROEHR__TELEMETRY__OTLP_ENDPOINT: http://otel-lgtm:4317
      # The push carries every family the Prometheus surface exposes: one meter
      # provider feeds both, so a metric cannot reach one and not the other.
      FERROEHR__TELEMETRY__METRICS_PUSH: "true"
      FERROEHR__TELEMETRY__SERVICE_NAME: ferroehr
      FERROEHR__TELEMETRY__ENVIRONMENT: dev
      FERROEHR__TELEMETRY__TRACES_SAMPLE_RATIO: "1.0"
      # Structured stdout so the bundled log pipeline ingests fields, not text
      # (overrides the root stack's dev-friendly `pretty`).
      FERROEHR__LOG__FORMAT: json
      # Ops-introspection surface on an internal-only port. Metrics do not
      # depend on it — they arrive over OTLP — but /management/prometheus stays
      # reachable on the compose network for a human comparing the two surfaces.
      # (The health probes need none of this — /health, /health/liveness and
      # /health/readiness are always served on the main API port.)
      FERROEHR__MANAGEMENT__ENABLED: "true"
      FERROEHR__MANAGEMENT__PORT: "9464"
      FERROEHR__MANAGEMENT__ENDPOINTS__INFO: "public"
      FERROEHR__MANAGEMENT__ENDPOINTS__METRICS: "public"
      FERROEHR__MANAGEMENT__ENDPOINTS__PROMETHEUS: "public"
    expose:
      - "9464"
    depends_on:
      otel-lgtm:
        condition: service_started

  otel-lgtm:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Single-container LGTM dev stack (OTLP collector + Prometheus + Tempo +
    # Loki + Grafana). Digest-pinned grafana/otel-lgtm:0.29.2 (current release),
    # resolved 2026-07-24; no `:latest`
    # (docs.docker.com/build/building/best-practices — pin by digest).
    image: grafana/otel-lgtm:0.29.2@sha256:af7242c1a9608faf6d26e6f235392fd0c32b67258228f9a3cfc96e724974930c
    environment:
      # Keep collected data in the container's lifetime (dev).
      - ENABLE_LOGS_ALL=true
    # Every LGTM component mkdirs its state under /data at startup. The image
    # ships `/` as mode 555, and with cap_drop ALL (no DAC_OVERRIDE) even root
    # cannot create it: Docker normalizes the root inode to 755 so this never
    # surfaced there; Podman preserves the image's 555 and every component died
    # at mkdir (issue #2636). A tmpfs matches the dev-lifetime intent above and
    # behaves identically on both engines.
    tmpfs:
      - /data
    configs:
      # Inline provisioning so the downloaded overlay is self-sufficient
      # (docs.docker.com/reference/compose-file/configs — the `content`
      # attribute); the blocks live at the bottom of this file.
      - source: grafana-dashboard
        target: /otel-lgtm/grafana/dashboards/ferroehr.json
    ports:
      # Grafana UI only. OTLP (4317/4318) stays on the compose network.
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"

configs:
  # The provisioned Grafana dashboard — this inline block is its single home
  # (the alert starter pack stays a separate file, docker/observability/alerts.yml).
  grafana-dashboard:
    content: |
      {
        "annotations": { "list": [] },
        "editable": true,
        "graphTooltip": 1,
        "title": "ferroehr — service overview",
        "uid": "ferroehr-overview",
        "tags": ["ferroehr", "openehr"],
        "schemaVersion": 39,
        "time": { "from": "now-1h", "to": "now" },
        "templating": { "list": [] },
        "panels": [
          {
            "type": "row",
            "title": "RED — requests, errors, duration",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
          },
          {
            "type": "timeseries",
            "title": "Request rate by route (req/s)",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
            "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
            "targets": [
              {
                "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count[5m]))",
                "legendFormat": "{{http_route}}"
              }
            ]
          },
          {
            "type": "stat",
            "title": "5xx error ratio",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 6, "x": 12, "y": 1 },
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null },
                    { "color": "red", "value": 0.01 }
                  ]
                }
              },
              "overrides": []
            },
            "targets": [
              {
                "expr": "sum(rate(http_server_request_duration_seconds_count{status_class=\"5xx\"}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 1)",
                "legendFormat": "5xx ratio"
              }
            ]
          },
          {
            "type": "stat",
            "title": "In-flight requests",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 6, "x": 18, "y": 1 },
            "targets": [
              { "expr": "sum(http_server_active_requests)", "legendFormat": "active" }
            ]
          },
          {
            "type": "timeseries",
            "title": "Request duration p50/p95/p99 (s)",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
            "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
            "targets": [
              {
                "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))",
                "legendFormat": "p50"
              },
              {
                "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))",
                "legendFormat": "p95"
              },
              {
                "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))",
                "legendFormat": "p99"
              }
            ]
          },
          {
            "type": "timeseries",
            "title": "Auth failures by mechanism/status (/s)",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
            "targets": [
              {
                "expr": "sum by (mechanism, status) (rate(auth_failures_total[5m]))",
                "legendFormat": "{{mechanism}} {{status}}"
              }
            ]
          },
          {
            "type": "row",
            "title": "Persistence & AQL",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 }
          },
          {
            "type": "timeseries",
            "title": "DB pool connections",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
            "targets": [
              {
                "expr": "db_pool_connections",
                "legendFormat": "{{state}}"
              },
              {
                "expr": "histogram_quantile(0.95, sum by (le) (rate(db_pool_acquire_duration_seconds_bucket[5m])))",
                "legendFormat": "acquire p95 (s)"
              }
            ]
          },
          {
            "type": "timeseries",
            "title": "AQL query latency by phase (p95, s)",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
            "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum by (le, phase) (rate(aql_query_duration_seconds_bucket[5m])))",
                "legendFormat": "{{phase}}"
              },
              {
                "expr": "sum by (outcome) (rate(aql_queries_total[5m]))",
                "legendFormat": "queries {{outcome}}"
              }
            ]
          },
          {
            "type": "row",
            "title": "Clinical writes, validation & audit",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 }
          },
          {
            "type": "timeseries",
            "title": "Compositions committed & validation failures (/s)",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 27 },
            "targets": [
              {
                "expr": "sum by (change_type) (rate(compositions_committed_total[5m]))",
                "legendFormat": "committed {{change_type}}"
              },
              {
                "expr": "sum by (pass) (rate(validation_failures_total[5m]))",
                "legendFormat": "validation fail {{pass}}"
              }
            ]
          },
          {
            "type": "timeseries",
            "title": "ATNA audit pipeline (/s)",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 27 },
            "targets": [
              {
                "expr": "rate(atna_audit_sent_total[5m])",
                "legendFormat": "sent"
              },
              {
                "expr": "rate(atna_audit_dropped_total[5m])",
                "legendFormat": "dropped"
              },
              {
                "expr": "rate(atna_audit_send_failed_total[5m])",
                "legendFormat": "send_failed"
              }
            ]
          },
          {
            "type": "table",
            "title": "Build info",
            "datasource": { "type": "prometheus" },
            "gridPos": { "h": 6, "w": 24, "x": 0, "y": 35 },
            "targets": [
              { "expr": "ferroehr_build_info", "format": "table", "instant": true }
            ]
          }
        ]
      }
