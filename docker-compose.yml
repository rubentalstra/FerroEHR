# Quickstart for ehrbase-rs: the preconfigured PostgreSQL image + the app image.
#
#   docker compose up --build          # build + run both from the Dockerfiles
#   curl -u ehrbase:ehrbase -X POST -i \
#     http://localhost:8080/ehrbase/rest/openehr/v1/ehr
#
# The same Dockerfiles CI publishes are used here (no drift). CI can point the
# `*_IMAGE` vars at pre-built images and run `docker compose up --no-build`.
name: ehrbase-rs

services:
  ehrbase-postgres:
    image: ${EHRBASE_POSTGRES_IMAGE:-ghcr.io/rubentalstra/ehrbase-rs-postgres:local}
    # Docker's default 64MB /dev/shm starves PostgreSQL's dynamic shared
    # memory under load (parallel workers error `could not resize shared
    # memory segment … No space left on device`); benchmark runs share this
    # floor with the upstream stack (docker/benchmark/docker-compose.yml).
    shm_size: ${BENCH_PG_SHM_SIZE:-1gb}
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    environment:
      # Bootstrap superuser (postgres) — dev default; override in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # App role/database created by the init script (dev defaults).
      EHRBASE_DB_USER: ${EHRBASE_DB_USER:-ehrbase}
      EHRBASE_DB_PASSWORD: ${EHRBASE_DB_PASSWORD:-ehrbase}
      EHRBASE_DB_NAME: ${EHRBASE_DB_NAME:-ehrbase}
    # pg_stat_statements is loaded so the P20 profiling harness
    # (scripts/profile.sh) can attribute time per statement; negligible
    # overhead, ships in the stock image.
    # The same PG tuning floor the benchmark parity compose applies to BOTH
    # SUTs (docker/benchmark/docker-compose.yml, benchmarking.md §3.4), so
    # local profiling (scripts/profile.sh) measures the tuned configuration.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${BENCH_PG_SHARED_BUFFERS:-1GB}
      - -c
      - max_wal_size=${BENCH_PG_MAX_WAL_SIZE:-4GB}
      - -c
      - work_mem=${BENCH_PG_WORK_MEM:-16MB}
    volumes:
      - ehrbase-pgdata:/var/lib/postgresql
    ports:
      - "${EHRBASE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EHRBASE_DB_USER:-ehrbase} -d ${EHRBASE_DB_NAME:-ehrbase}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ehrbase:
    image: ${EHRBASE_IMAGE:-ghcr.io/rubentalstra/ehrbase-rs:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      ehrbase-postgres:
        condition: service_healthy
    environment:
      EHRBASE_DB_URL: postgres://${EHRBASE_DB_USER:-ehrbase}:${EHRBASE_DB_PASSWORD:-ehrbase}@ehrbase-postgres:5432/${EHRBASE_DB_NAME:-ehrbase}
      # Connection-pool ceiling; the benchmark harness raises it in lockstep
      # with the upstream stack's HikariCP pool (config parity — the dominant
      # tunable must match across compared SUTs).
      EHRBASE_DB_MAX_CONNECTIONS: ${EHRBASE_DB_MAX_CONNECTIONS:-10}
      # In-flight admission cap (503 load shed past it; 0 disables). The
      # benchmark harness raises it so overload manifests as queueing latency —
      # the same failure mode as upstream's Tomcat admission window — instead
      # of shed errors tripping the SLO's error-rate arm (see scripts/benchmark.sh).
      EHRBASE_REST_MAX_IN_FLIGHT: ${EHRBASE_REST_MAX_IN_FLIGHT:-256}
      # Version-signing toggle pass-through (the benchmark harness disables it
      # for throughput parity — upstream has no signing; see scripts/benchmark.sh).
      EHRBASE_SIGNING_ENABLED: ${EHRBASE_SIGNING_ENABLED:-true}
      # Dev config mounted below: enables Basic auth with the ehrbase/ehrbase user.
      EHRBASE_REST_CONFIG: /etc/ehrbase/ehrbase.toml
      # Dev quickstart: human-readable colored logs in `docker compose logs`.
      # Production/collector deployments override to `json` (or unset — the
      # `auto` default picks json when stdout is not a TTY).
      EHRBASE_LOG_FORMAT: ${EHRBASE_LOG_FORMAT:-pretty}
      # Benchmark parity (benchmarking.md §3.4 "Logging: equal, minimal"):
      # scripts/benchmark.sh sets warn on BOTH SUTs; default stays info.
      EHRBASE_LOG_FILTER: ${EHRBASE_LOG_FILTER:-info}
    volumes:
      - ./docker/ehrbase.dev.toml:/etc/ehrbase/ehrbase.toml:ro
    ports:
      - "${EHRBASE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/ehrbase", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # SeaweedFS S3 gateway for DV_MULTIMEDIA externalization (ADR-017) —
  # DEV/TEST ONLY. Externalization is OFF by default, so the app does NOT depend
  # on this. To try it, enable it and point the app at the gateway:
  #   EHRBASE_MULTIMEDIA_ENABLED=true
  #   EHRBASE_MULTIMEDIA_ENDPOINT=http://seaweedfs:8333
  #   EHRBASE_MULTIMEDIA_BUCKET=openehr-multimedia
  #   EHRBASE_MULTIMEDIA_ALLOW_HTTP=true          # dev only; prod S3 is HTTPS
  # With no AWS keys the gateway runs in unauthenticated "allow-all" mode
  # (dev/test only). In production point EHRBASE_MULTIMEDIA_* at a real,
  # credentialed, HTTPS S3 endpoint (AWS S3 / MinIO / etc.) instead of this.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data"]
    volumes:
      - ehrbase-seaweedfs:/data
    ports:
      - "${EHRBASE_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Keycloak for OAuth2/OIDC bearer auth (the "ehrbase" realm is imported from
  # docker/keycloak/import). The app defaults to Basic auth (see ehrbase.dev.toml),
  # so it does NOT depend on Keycloak; point EHRBASE_REST_AUTH__OIDC__* (or a TOML
  # [auth.oidc] block) at http://localhost:8081/auth/realms/ehrbase to use it.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_PORT: 8080
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

volumes:
  ehrbase-pgdata:
  ehrbase-seaweedfs:
