# Quickstart for ferroehr: the preconfigured PostgreSQL image + the app image
# + the admin console.
#
#   docker compose up --build          # build + run the core services
#   curl -u ferroehr:ferroehr -X POST -i \
#     http://localhost:8080/ferroehr/rest/openehr/v1/ehr
#
# The same Dockerfiles CI publishes are used here (no drift — the compose build
# targets `runtime-from-source`, CI targets `runtime-prebuilt`, both share ONE
# runtime stage). CI can point the `*_IMAGE` vars at pre-built images and run
# `docker compose up --no-build`.
#
# ── Lanes (docs.docker.com/compose/how-tos/project-name) ──────────────────────
# NO hard-coded `name:` (issue #282 D3): the project name is chosen per lane so
# the lanes coexist and never tear down each other's containers/networks/volumes.
# All lanes share the 8080/3000/5432/8081 host port block (the CNF ixit pins
# localhost:8080), so they run one at a time on defaults — conformance is the
# "exclusive-server ground" by design; override the *_PORT env vars for true
# parallel coexistence.
#
#   | Lane      | Invocation                                   | Project             |
#   |-----------|----------------------------------------------|---------------------|
#   | dev       | docker compose up                            | ferroehr (dir)    |
#   | CNF (rs)  | scripts/conformance.sh                       | ferroehr-cnf      |
#   | CNF (pgp) | (same run — the parallel signing posture)    | ferroehr-cnf-pgp  |
#   | CNF(java) | CONF_SUT=ehrbase-java scripts/conformance.sh | cnf-ehrbase-java    |
#   | ui-e2e    | scripts/ui-e2e.sh                            | ferroehr-e2e      |
#
# The CNF (rs) run brings up BOTH of its projects: the standard stack and a
# second deployment of the same image in the openPGP version-signing posture
# (docker/sut-pgp-parallel.yml remaps it to 8081/5433 so the two coexist), so
# one record covers both claimed signing modes.
#
# ── Profiles (docs.docker.com/compose/how-tos/profiles) ───────────────────────
# Core services (postgres, ferroehr, ferroehr-admin-ui) are profile-less and start
# on every `up`. Optional dependencies are opt-in:
#   --profile keycloak        OAuth2/OIDC provider (the app defaults to Basic)
#   --profile s3              SeaweedFS S3 gateway for DV_MULTIMEDIA (off by default)
#   --profile terminology     a real FHIR R4 terminology server + its seed step
#                             (external terminology is off by default). The
#                             profile only STARTS the server; pointing the CDR
#                             at it is the docker/sut-terminology.yml overlay:
#                               docker compose --profile terminology \
#                                 -f docker-compose.yml -f docker/sut-terminology.yml up
# The observability stack stays a documented overlay
# (docker-compose.observability.yml) because it must MUTATE the ferroehr service's
# env (OTEL endpoint, internal management port) — a change profiles cannot express
# (docs.docker.com/compose/how-tos/multiple-compose-files).
#
# ── Build provenance ──────────────────────────────────────────────────────────
# Provenance uses the OCI-standard REVISION build-arg only (no bespoke arg): the
# server Dockerfile bridges it into build.rs so /management/info matches the
# org.opencontainers.image.revision LABEL. The driving scripts export
# `REVISION=$(git rev-parse --short=12 HEAD)`. Absent, the identity degrades to
# version-only with SHA=unknown by design (.git is not in the build context).

services:
  ferroehr-postgres:
    image: ${FERROEHR_POSTGRES_IMAGE:-ghcr.io/rubentalstra/ferroehr-postgres:local}
    # Docker's default 64MB /dev/shm starves PostgreSQL's dynamic shared
    # memory under load (parallel workers error `could not resize shared
    # memory segment … No space left on device`); measured runs share this
    # floor with the upstream comparison stack (docker/sut-ehrbase-java.yml).
    shm_size: ${BENCH_PG_SHM_SIZE:-1gb}
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    environment:
      # Bootstrap superuser (postgres) — dev default; override in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # App role/database created by the init script (dev defaults). These
      # configure the DB *container*, not the server binary — the PG_INIT_
      # prefix keeps them out of the server's reserved FERROEHR_ namespace (the
      # strict boot-time env sweep would otherwise reject them).
      PG_INIT_USER: ${PG_INIT_USER:-ferroehr}
      PG_INIT_PASSWORD: ${PG_INIT_PASSWORD:-ferroehr}
      PG_INIT_DB: ${PG_INIT_DB:-ferroehr}
    # pg_stat_statements is loaded so the P20 profiling harness
    # (scripts/profile.sh) can attribute time per statement; negligible
    # overhead, ships in the stock image.
    # The same PG tuning floor the measurement instruments assume, so local
    # profiling (scripts/profile.sh) measures the tuned configuration.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${BENCH_PG_SHARED_BUFFERS:-1GB}
      - -c
      - max_wal_size=${BENCH_PG_MAX_WAL_SIZE:-4GB}
      - -c
      - work_mem=${BENCH_PG_WORK_MEM:-16MB}
    volumes:
      - ferroehr-pgdata:/var/lib/postgresql
    ports:
      - "${FERROEHR_DB_PORT:-5432}:5432"
    # Resource ceilings (docs.docker.com/reference/compose-file/deploy;
    # docs.docker.com/engine/containers/resource_constraints) — the DB gets
    # headroom above the app for shared_buffers (1GB) + /dev/shm (1gb).
    # Overridable so the measured-record lanes can match the party ixit's
    # documented environment envelope (the committed measurement records are
    # environment-bound; production limits live in the Helm values).
    deploy:
      resources:
        limits:
          cpus: "${FERROEHR_DB_CPUS:-4}"
          memory: ${FERROEHR_DB_MEM:-4G}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_INIT_USER:-ferroehr} -d ${PG_INIT_DB:-ferroehr}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ferroehr:
    image: ${FERROEHR_IMAGE:-ghcr.io/rubentalstra/ferroehr:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      # The Dockerfile has two final targets sharing one runtime stage; compose
      # builds the from-source one (CI builds runtime-prebuilt). Without this,
      # buildx would build the last stage (runtime-prebuilt) and fail on the
      # missing bin/ context.
      target: runtime-from-source
      args:
        REVISION: ${REVISION:-}
    depends_on:
      ferroehr-postgres:
        condition: service_healthy
    environment:
      # FERROEHR_ env overrides use the mechanical `__` mapping (TOML path,
      # upper-cased, `__` between segments); they layer on top of the mounted
      # ferroehr.dev.toml (env beats file).
      FERROEHR__DB__URL: postgres://${PG_INIT_USER:-ferroehr}:${PG_INIT_PASSWORD:-ferroehr}@ferroehr-postgres:5432/${PG_INIT_DB:-ferroehr}
      # Connection-pool ceiling; measured comparison runs raise it in lockstep
      # with the upstream stack's HikariCP pool (config parity — the dominant
      # tunable must match across compared SUTs).
      FERROEHR__DB__MAX_CONNECTIONS: ${FERROEHR__DB__MAX_CONNECTIONS:-10}
      # In-flight admission cap (503 load shed past it; 0 disables). The
      # comparison runs raise it so overload manifests as queueing latency —
      # the same failure mode as upstream's Tomcat admission window — instead
      # of shed errors tripping the stress envelope's error-rate arm.
      FERROEHR__SERVER__MAX_IN_FLIGHT: ${FERROEHR__SERVER__MAX_IN_FLIGHT:-256}
      # Version-signing toggle pass-through (measured comparison runs disable it
      # for throughput parity — upstream has no signing.)
      FERROEHR__SIGNING__ENABLED: ${FERROEHR__SIGNING__ENABLED:-true}
      # Dev quickstart: human-readable colored logs in `docker compose logs`.
      # Production/collector deployments override to `json` (or unset — the
      # `auto` default picks json when stdout is not a TTY).
      FERROEHR__LOG__FORMAT: ${FERROEHR__LOG__FORMAT:-pretty}
      # Measurement parity (logging equal and minimal on both SUTs):
      # measured comparison runs set warn on BOTH SUTs; default stays info.
      FERROEHR__LOG__FILTER: ${FERROEHR__LOG__FILTER:-info}
    volumes:
      # Auto-discovered at config search-order position 4 (no pointer needed).
      # Enables Basic auth with the ferroehr/ferroehr user.
      - ./docker/ferroehr.dev.toml:/etc/ferroehr/ferroehr.toml:ro
    ports:
      - "${FERROEHR_PORT:-8080}:8080"
    # Default sized to the party ixit's documented measurement envelope (the
    # committed measured records are environment-bound to the 8-CPU/8GB
    # docker VM; a 2cpu/1Gi cap halved the measured knee). Production limits
    # are the Helm values' concern (deploy/helm/ferroehr/values.yaml);
    # override via env for a constrained profile.
    deploy:
      resources:
        limits:
          cpus: "${FERROEHR_CPUS:-4}"
          memory: ${FERROEHR_MEM:-4G}
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The admin console (ferroehr-admin-ui): a standalone Leptos SSR web app +
  # BFF that consumes the CDR strictly over ITS-REST — never the database.
  # Basic login proxies the CDR's dev users (ferroehr/ferroehr); for OIDC set
  # the FERROEHR_ADMIN__AUTH__OIDC__* variables at the Keycloak realm below.
  ferroehr-admin-ui:
    image: ${FERROEHR_ADMIN_UI_IMAGE:-ghcr.io/rubentalstra/ferroehr-admin-ui:local}
    build:
      context: .
      dockerfile: docker/admin-ui/Dockerfile
      target: runtime-from-source
      args:
        REVISION: ${REVISION:-}
    depends_on:
      ferroehr:
        condition: service_healthy
    environment:
      FERROEHR_ADMIN__CDR__BASE_URL: http://ferroehr:8080
    ports:
      - "${FERROEHR_ADMIN_UI_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr-admin-ui", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # SeaweedFS S3 gateway for DV_MULTIMEDIA externalization — DEV/TEST ONLY,
  # behind the `s3` profile (off by default; externalization is OFF by default,
  # so the app does NOT depend on this). To try it:
  #   docker compose --profile s3 up
  #   FERROEHR__MULTIMEDIA__ENABLED=true
  #   FERROEHR__MULTIMEDIA__ENDPOINT=http://seaweedfs:8333
  #   FERROEHR__MULTIMEDIA__BUCKET=openehr-multimedia
  #   FERROEHR__MULTIMEDIA__ALLOW_HTTP=true          # dev only; prod S3 is HTTPS
  # With no AWS keys the gateway runs in unauthenticated "allow-all" mode
  # (dev/test only). In production point FERROEHR__MULTIMEDIA__* at a real,
  # credentialed, HTTPS S3 endpoint (AWS S3 / MinIO / etc.) instead of this.
  seaweedfs:
    profiles: [s3]
    # Digest-pinned chrislusf/seaweedfs:4.40 (current stable), resolved
    # 2026-07-24; no `:latest` (docs.docker.com/build/building/best-practices).
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command: ["server", "-s3", "-dir=/data"]
    volumes:
      - ferroehr-seaweedfs:/data
    ports:
      - "${FERROEHR_S3_PORT:-8333}:8333"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # A real FHIR R4 terminology server (HAPI FHIR JPA), behind the
  # `terminology` profile. openEHR models the resolver of an archetype
  # constraint binding as an external "terminology query server" (BASE
  # docs/architecture_overview/master12-terminology.adoc §"Binding Terminology
  # Value-sets to Archetypes": the archetype "simply hold[s] an identifier for
  # a query; the query itself is defined within a 'terminology query server'"),
  # and §Overview names the ecosystem — LOINC, ICDx, ICPC, SNOMED CT "and the
  # many other terminologies and vocabularies used in healthcare" — so a
  # deployment binds to SEVERAL at once. This service is that server for the
  # conformance record and for local experimentation; the CDR reaches it
  # through the `[terminology.external]` providers in docker/ferroehr.dev.toml,
  # which stay DISABLED until an overlay enables them.
  #
  # The seeded content is SYNTHETIC (docker/terminology/seed/): two code
  # systems shaped like SNOMED CT and LOINC, under the reserved example.test
  # domain. No licensed terminology content is distributed with this repo.
  terminology:
    profiles: [terminology]
    # Digest-pinned hapiproject/hapi:v8.10.0-3 (current release), resolved
    # 2026-07-29; no `:latest` (docs.docker.com/build/building/best-practices).
    image: hapiproject/hapi:v8.10.0-3@sha256:55213612779ab3eeec919226b7bad378f0061ade823393a61d7dd46dd5087a3d
    environment:
      hapi.fhir.fhir_version: R4
      # The stock image ships with Hibernate Search DISABLED, and without it
      # `ValueSet/$expand` and `CodeSystem/$subsumes` answer 500
      # (HSEARCH800001: Hibernate Search was not initialized). Enabling it
      # naively then crash-loops on HSEARCH000353 (Unknown analyzer) unless
      # HAPI's own Lucene analysis configurer is named, so the whole block
      # below travels together — it is the minimum working terminology
      # configuration of this image.
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_TYPE: lucene
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_ANALYSIS_CONFIGURER: ca.uhn.fhir.jpa.search.HapiHSearchAnalysisConfigurers$$HapiLuceneAnalysisConfigurer
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_DIRECTORY_TYPE: local-filesystem
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_DIRECTORY_ROOT: target/lucenefiles
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_BACKEND_LUCENE_VERSION: lucene_current
    ports:
      - "${FERROEHR_TERMINOLOGY_PORT:-8090}:8080"
    deploy:
      resources:
        limits:
          cpus: "${FERROEHR_TERMINOLOGY_CPUS:-2}"
          memory: ${FERROEHR_TERMINOLOGY_MEM:-2G}
    # No healthcheck: the image carries no in-container HTTP client (no
    # curl/wget), so readiness is polled EXTERNALLY by the seeder below, which
    # is also the gate every dependant waits on.

  # One-shot seeding of the terminology server through its OWN FHIR API — the
  # CDR is never the writer of terminology content. Idempotent (`PUT
  # /<type>/<id>`, the FHIR "update as create" interaction), and it verifies
  # `$validate-code` + `$expand` before exiting so a misconfigured server fails
  # here instead of inside a conformance run.
  terminology-seed:
    profiles: [terminology]
    # Digest-pinned curlimages/curl:8.19.0, resolved 2026-07-29.
    image: curlimages/curl:8.19.0@sha256:c03110c736db81bbe1be0296f1f1608c81b954b01626bdfb0a8f84e5bd00ff3c
    depends_on:
      terminology:
        condition: service_started
    environment:
      FHIR_BASE: http://terminology:8080/fhir
    entrypoint: ["/bin/sh", "/seed.sh"]
    volumes:
      - ./docker/terminology/seed.sh:/seed.sh:ro
      - ./docker/terminology/seed:/seed:ro
    restart: "no"

  # Keycloak for OAuth2/OIDC bearer auth (the "ferroehr" realm is imported from
  # docker/keycloak/import), behind the `keycloak` profile. The app defaults to
  # Basic auth (see ferroehr.dev.toml), so it does NOT depend on Keycloak; add an
  # [auth.oidc] block to ferroehr.dev.toml (or set FERROEHR__AUTH__OIDC__* env)
  # pointing issuer at http://localhost:8081/auth/realms/ferroehr to use it, and
  # start it with `docker compose --profile keycloak up`.
  keycloak:
    profiles: [keycloak]
    # Digest-pinned quay.io/keycloak/keycloak:26.7.0 (current release), resolved
    # 2026-07-24 (docs.docker.com/build/building/best-practices).
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      # In-network port == default host port (8081): one issuer hostname:port
      # (http://keycloak:8081) is then valid from BOTH the docker network and
      # the host (the E2E browser maps `keycloak` to 127.0.0.1), so the
      # containerized console and a host browser can share one OIDC issuer.
      KC_HTTP_PORT: 8081
      # ONE canonical issuer regardless of which host the caller used —
      # token `iss` claims stay stable, so the CDR can validate bearer
      # tokens against a single configured issuer (ferroehr.dev.toml
      # [auth.oidc]). Override for human admin-console browsing if needed.
      # NOTE: a URL-form KC_HOSTNAME replaces the whole base — Keycloak does
      # NOT append KC_HTTP_RELATIVE_PATH to it, so /auth must be included.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://keycloak:8081/auth}
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8081"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    # F10: the Keycloak image ships bash (no curl/wget), so probe the imported
    # realm's OIDC discovery doc over bash's /dev/tcp — this makes
    # `depends_on: {keycloak: {condition: service_healthy}}` a valid gate for
    # the OIDC lanes (docs.docker.com/compose/how-tos/startup-order). Readiness
    # here means the realm is imported AND the HTTP listener answers 200.
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8081; printf 'GET /auth/realms/ferroehr/.well-known/openid-configuration HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1.1 200' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  ferroehr-pgdata:
  ferroehr-seaweedfs:
