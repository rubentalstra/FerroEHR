# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. `cargo deny check advisories` reads the same
# RustSec database `cargo audit` does and adds yanked/licenses/bans/sources, so
# no cargo-audit job exists and no second ignore list should either — one existed
# (`.cargo/audit.toml`), nothing read it, and it had already drifted to a
# different set of ids than this file.
#
# WHY THIS FILE AND AN OSV-BASED SCANNER DISAGREE, and which one to believe.
# `Cargo.lock` records the union of every dependency any feature combination
# COULD pull. Scanners that read the lock file — OSV, and therefore the OpenSSF
# Scorecard `Vulnerabilities` check — report advisories for crates our feature
# set never compiles. `cargo-deny` resolves features and does not, so where the
# two disagree in that direction cargo-deny is the more precise instrument and
# this file needs no entry.
#
# The live example, so the next over-report is diagnosed in a minute:
# RUSTSEC-2026-0235 (`rkyv` 0.7, out-of-bounds read). `rust_decimal 1.42.1`
# declares BOTH `rkyv ^0.8.13` and `rkyv ^0.7.46` as optional dependencies; our
# features enable neither, and `cargo tree --workspace --all-features` finds zero
# rkyv nodes. The lock file still pins 0.7.46 because `^0.7.46` cannot resolve
# above the vulnerable range — so this can only leave the lock file when
# rust_decimal drops that requirement upstream. It is deliberately NOT ignored
# below: an ignore for an advisory this tool never raises records nothing and
# would silently start applying if the tool ever became lock-file-based.
[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly and dated.
yanked = "deny"
ignore = [
  # 2026-07-07: Marvin attack timing sidechannel in `rsa` (pulled in via
  # openidconnect → ferroehr-rest OIDC auth). No fixed release exists upstream;
  # we only *verify* RS256 ID-token signatures (public-key operation) and never
  # hold RSA private keys, so the private-key timing oracle does not apply.
  # Re-check when rsa > 0.9 ships. https://rustsec.org/advisories/RUSTSEC-2023-0071
  { id = "RUSTSEC-2023-0071", reason = "no fix upstream; RSA used for signature verification only (no private keys held)" },
  # 2026-07-12: two quick-xml 0.40.1 DoS-class advisories (unbounded namespace
  # allocation; quadratic duplicate-attribute check), pulled in transitively via
  # object_store 0.14.0 (the S3 multimedia offload) — object_store 0.14.0 is the
  # LATEST release and requires quick-xml ^0.40, so no fix is reachable yet. The
  # affected parser only reads S3 API responses from the operator-configured
  # endpoint (a semi-trusted peer), not client input; our own canonical-XML
  # path uses quick-xml 0.41 (fixed). Re-check on the next object_store release.
  { id = "RUSTSEC-2026-0194", reason = "via object_store 0.14.0 (latest) pinning quick-xml ^0.40; parses operator-configured S3 responses only" },
  { id = "RUSTSEC-2026-0195", reason = "via object_store 0.14.0 (latest) pinning quick-xml ^0.40; parses operator-configured S3 responses only" },
  # 2026-07-18: unmaintained-crate advisory only (no vulnerability); a
  # build-time proc-macro dependency of leptos_macro 0.8 — goes away when
  # leptos drops it upstream. Re-check at the next leptos bump.
  { id = "RUSTSEC-2026-0173", reason = "unmaintained advisory; compile-time proc-macro via leptos_macro (admin console), no runtime exposure" },
  # 2026-07-15: `paste` (proc-macro) is archived/unmaintained — pulled in by
  # utoipa-axum 0.2.0 (the LATEST release of the official utoipa axum
  # bindings; no paste-free release exists). Compile-time-only token pasting,
  # no runtime code, no attack surface. Re-check on the next utoipa-axum
  # release. https://rustsec.org/advisories/RUSTSEC-2024-0436
  { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro via utoipa-axum 0.2.0 (latest); no runtime surface" },
]

[licenses]
version = 2
# Allow permissive licenses compatible with an MIT-licensed project.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Boost Software License (OSI-approved, permissive): xxhash-rust via
  # leptos server_fn (the admin console, 2026-07-18).
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  # MIT No Attribution (borrow-or-share, via fluent-uri → sqlx).
  "MIT-0",
  # Community Data License Agreement — Permissive 2.0 (webpki-roots: the
  # Mozilla CA bundle data). Permissive, Apache-2.0-compatible.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = [
  # inferno (the flamegraph renderer pprof's `flamegraph` feature uses) is
  # CDDL-1.0 — a file-scoped weak copyleft (like MPL-2.0): obligations attach
  # to inferno's own source files, which we consume unmodified as a build
  # dependency of the profiling instrument; nothing of ours is derivative.
  # Scoped exception, not a blanket allow (2026-08-04, issue #1861).
  { allow = ["CDDL-1.0"], crate = "inferno" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-only deps carry an implicit "*" version; all crates are
# publish = false, so path-only is fine and stays denied for external deps.
allow-wildcard-paths = true
# Deny known-unmaintained or footgun crates here as they surface.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# thaw (admin console UI kit): pinned to a main rev because the only Leptos-0.8
# crates.io release (0.5.0-beta) lacks `#![recursion_limit = "256"]` and fails
# non-erase_components codegen on rustc 1.96; main has the fix (2026-07-17).
# Remove when thaw 0.5 stable ships and the pin returns to crates.io.
allow-git = ["https://github.com/thaw-ui/thaw"]
