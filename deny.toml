# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly and dated.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allow permissive licenses compatible with an Apache-2.0 project.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-only deps carry an implicit "*" version; all crates are
# publish = false, so path-only is fine and stays denied for external deps.
allow-wildcard-paths = true
# Deny known-unmaintained or footgun crates here as they surface.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
