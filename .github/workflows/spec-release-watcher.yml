# openEHR RELEASE watcher (tracker issue #179) — the companion of
# spec-update-watcher.yml: that workflow tracks individual completed spec
# changes; this one guarantees a component RELEASE is never missed (the
# ITS-REST 1.1.0 release was discovered by hand — never again). Mechanism
# notes live in scripts/watch/spec-release.sh.
name: Spec-release watcher

on:
  schedule:
    - cron: "47 6 * * 1,4" # Mon + Thu 06:47 UTC (30 min after the update watcher)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report new releases without creating issues"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: spec-release-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # file one spec-release issue per new upstream tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Poll upstream release tags, open spec-release issues
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: bash scripts/watch/spec-release.sh
