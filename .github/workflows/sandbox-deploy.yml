#
# The ONE owner of hosted-sandbox delivery (#2724, sandbox.ferroehr.eu).
# Vercel's git-triggered deployments are fully OFF (vercel.json
# `git.deploymentEnabled: false`) and no ignore script exists: the sandbox
# deploys exactly when this workflow pings the project's Deploy Hook, which
# is a plain trigger URL (no account token, no API scope). Ordering is
# explicit by construction — the ping happens only AFTER the release image
# exists, so no skip-until-exists guard and no image race can occur.
#
# Triggers:
#   - workflow_call from the release pipeline (release.yml), keyed on the job
#     that APPLIES the image tags — not on a workflow's run conclusion (#2776).
#     The sandbox image is `FROM ghcr.io/rubentalstra/ferroehr:latest`, which
#     that job moves on a release tag, so nothing is hand-bumped at a cut. It
#     used to be a `workflow_run` on Containers filtered by
#     `conclusion == success`, and that conclusion covered advisory jobs with
#     no edge to the images: at v4.0.3 a tree scan finding suppressed a
#     perfectly good deploy. The caller passes `expected-version`, which the
#     verified wait below used to parse out of the run payload's `head_branch`.
#   - push to develop touching the sandbox posture (Dockerfile.vercel,
#     vercel.json, deploy/vercel/**): a config change redeploys the same
#     release image with the new posture.
#   - workflow_dispatch: a manual redeploy (reseed skippable).
#
# Provisioning (owner action, once): create a Deploy Hook on the Vercel
# project (Settings → Git → Deploy Hooks, branch `develop`) and store its
# URL with `gh secret set SANDBOX_DEPLOY_HOOK_URL`. An empty secret is a
# hard failure here, never a skip: the job already runs only on the
# upstream repo, so a missing hook is always a misconfiguration, and a
# green run must mean a deploy actually happened (#2755).
#
# After a successful deploy the reseed runs (the reusable half of
# sandbox-reseed.yml): the nightly wipe stays the janitor, and a release
# that edits the baseline migration heals immediately instead of at the
# next midnight. A failure here is reported as a sandbox failure: it can
# never redden CI or Containers, and when the release pipeline calls this
# workflow it reddens that pipeline's `announce` leg — which names the
# recovery — rather than anything the release already published.

name: Sandbox deploy

on:
  workflow_call:
    inputs:
      expected-version:
        description: >-
          The version string the sandbox must serve before the deploy counts as
          done (`X.Y.Z`, no `v`). Empty means "log whatever is served" — which
          is what a posture push or a manual redeploy wants, since neither
          changes the image.
        required: false
        type: string
        default: ""
      reseed:
        description: >-
          Wipe and reseed after the deploy. Declared for the CALL path too, and
          not only on the dispatch below, because `inputs` carries whichever
          trigger's inputs fired: without it a release dispatched by hand (an
          event_name of `workflow_dispatch`) would silently skip the reseed.
        required: false
        type: boolean
        default: true
  push:
    branches: [develop]
    paths:
      - Dockerfile.vercel
      - vercel.json
      - deploy/vercel/**
  workflow_dispatch:
    inputs:
      reseed:
        description: Wipe and reseed after the deploy
        type: boolean
        default: true

permissions: {}

concurrency:
  group: sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: ping the deploy hook and verify
    # Upstream only (forks have neither the hook nor the Neon environment).
    # The prerelease question is settled by the CALLER now: the release pipeline
    # runs this leg only for a real release, because a pre-release moves no
    # `:latest` and so changes nothing to deploy.
    if: github.repository == 'rubentalstra/FerroEHR'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Trigger the Vercel deploy
        env:
          HOOK_URL: ${{ secrets.SANDBOX_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK_URL" ]; then
            echo "::error::SANDBOX_DEPLOY_HOOK_URL is empty — create the Deploy Hook on the Vercel project (Settings → Git → Deploy Hooks, branch develop) and run: gh secret set SANDBOX_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL" -o /dev/null
          echo "sandbox deploy triggered"

      - name: Wait for the sandbox to serve again
        env:
          HOOK_URL: ${{ secrets.SANDBOX_DEPLOY_HOOK_URL }}
          # Only compared against the served version string, never executed.
          EXPECTED: ${{ inputs.expected-version }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK_URL" ]; then
            echo "::error::SANDBOX_DEPLOY_HOOK_URL is empty — nothing was deployed, so there is nothing to wait for." >&2
            exit 1
          fi
          # Vercel builds the container (a pull + retag of the published
          # image, minutes at most) and swaps the deployment; poll until the
          # API answers. Serverless cold boots re-run the migrations, so the
          # first 200 proves the new deployment is live AND migrated.
          # A bare 200 is NOT proof of the new deployment — the OLD one
          # answers 200 too (measured: the 4.0.4 dispatch went green while
          # the sandbox still served 4.0.3). A release run is told the version
          # the tag names and waits for exactly it; other runs log what is
          # served.
          expected="${EXPECTED:-}"
          deadline=$(( $(date +%s) + 1200 ))
          sleep 60
          while :; do
            body=$(curl -sS -m 30 https://sandbox.ferroehr.eu/ferroehr/rest/status || true)
            served=$(printf '%s' "$body" | sed -nE 's/.*"server_version":"([^"]+)".*/\1/p')
            if [ -n "$served" ] && { [ -z "$expected" ] || [ "$served" = "$expected" ]; }; then
              echo "sandbox is serving version ${served}"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the sandbox serves '${served:-nothing}' (expected '${expected:-any}') 20 minutes after the deploy ping." >&2
              exit 1
            fi
            echo "sandbox serves '${served:-nothing}'; waiting for '${expected:-any}'"
            sleep 20
          done

  reseed:
    name: reseed after deploy
    needs: deploy
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reseed }}
    permissions:
      contents: read
    # A called workflow's `secrets` context holds ONLY what the caller passes
    # (verified first-hand: without this, SANDBOX_DATABASE_URL arrived empty
    # and the Neon fence refused the wipe — run 32887862798). `inherit` is
    # the one way to reach an ENVIRONMENT secret from a caller, since a
    # `uses:` job cannot declare the environment itself; the called job's
    # `environment: sandbox-reseed` still applies its protection rules.
    # zizmor's preferred explicit passing is impossible here: the caller's
    # job cannot read an environment-scoped secret to pass it on.
    uses: ./.github/workflows/sandbox-reseed.yml
    secrets: inherit # zizmor: ignore[secrets-inherit]
