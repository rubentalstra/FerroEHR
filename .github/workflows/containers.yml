# .github/workflows/containers.yml
#
# Container images, built for speed:
#
#   1. The `ferroehr` binary is compiled OUTSIDE Docker, natively per
#      architecture (amd64 on ubuntu-26.04, arm64 on ubuntu-26.04-arm — no
#      QEMU emulation anywhere), inside a rust:*-slim-trixie job container
#      so the binary links against the same glibc (Debian 13 / 2.41) as the
#      distroless cc-debian13 runtime image. Swatinem/rust-cache makes warm
#      builds incremental.
#   2. The image build itself is a COPY-only packaging step — `docker/Dockerfile`
#      built with `--target runtime-prebuilt` (the same file compose builds with
#      `--target runtime-from-source`; ONE runtime stage, zero drift — issue #282
#      D5). A multi-arch buildx push takes seconds because no code runs inside.
#   3. The smoke test pulls the pushed image by digest instead of rebuilding.
name: Containers

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/ferroehr
  POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/ferroehr-postgres
  ADMIN_UI_IMAGE: ghcr.io/${{ github.repository_owner }}/ferroehr-admin-ui

permissions: {}

jobs:
  # ── Detect which images need (re)building ───────────────────────────────────
  # The ci.yml owner ruling (2026-07-17) applied to images: a push that touches
  # none of an image's build inputs must not recompile and republish it. A
  # docs-only develop push used to run FOUR native release compiles (two
  # binaries × two arches) plus a cargo-leptos site build for byte-identical
  # images. Tag pushes and manual dispatches always build everything (the
  # per-job conditions below), so a release can never miss an image.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      admin_ui: ${{ steps.filter.outputs.admin_ui }}
      postgres: ${{ steps.filter.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # The app filter mirrors the ui-e2e-binary cache key in ci.yml (the
          # inputs the server build reads); admin_ui mirrors the ui-e2e-console
          # key plus its own Dockerfile. Shared workspace manifests appear in
          # both — a lockfile bump rebuilds both images, correctly.
          filters: |
            app:
              - 'crates/**'
              - 'app/ferroehr/**'
              - 'app/ferroehr-rest/**'
              - 'app/ferroehr-server/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'docker/Dockerfile'
              - 'docker/smoke-test.sh'
              - 'docker-compose.yml'
              - '.github/workflows/containers.yml'
            admin_ui:
              - 'crates/**'
              - 'app/ferroehr-admin-ui/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'docker/admin-ui/**'
              - '.github/workflows/containers.yml'
            postgres:
              - 'docker/postgres/**'
              - '.github/workflows/containers.yml'

  # ── Compile the server binary natively per arch (no QEMU, no in-Docker cargo) ─
  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/Dockerfile
          - docker/postgres/Dockerfile
          - docker/admin-ui/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hadolint over each Dockerfile. Configuration lives in `.hadolint.yaml`,
      # where any rule we deliberately violate is named with its reason — never
      # a blanket disable (OWASP Docker Security Cheat Sheet rule 9).
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          failure-threshold: warning

  # Secret detection + Docker misconfiguration over the tree, in one tool.
  # Trivy's `config` scanner covers the misconfiguration half of rule 9 and its
  # `secret` scanner the credential half, so this replaces a separate gitleaks
  # lane rather than sitting beside one. Deliberate fixtures (the quickstart's
  # Argon2 hash, the development JWT secrets) are allow-listed by path in
  # `.trivyignore.yaml` with their reasons.
  tree-scan:
    name: secret + misconfiguration scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          exit-code: '1'
          severity: HIGH,CRITICAL
          trivy-config: trivy.yaml

  binary:
    name: binary (${{ matrix.platform }})
    needs: changes
    # Skip cascades: app-image needs this job, smoke needs app-image — a
    # skipped need skips the dependent automatically, so the whole app lane
    # turns off together.
    if: >-
      needs.changes.outputs.app == 'true' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    # Debian 13 (trixie) container so the produced binary targets glibc 2.41,
    # matching gcr.io/distroless/cc-debian13 exactly. The tag must equal the
    # rust-toolchain.toml channel — verified below, never assumed.
    # Digest-pinned, not tag-pinned: a tag is mutable, so a re-run of an
    # already-reviewed commit could build against different bytes. The index
    # digest (not a per-platform one) so both runner architectures resolve.
    container: rust:1.97.1-slim-trixie@sha256:3b2879047d42784ca9403ad20c51ed3df361a50f1df96f5777d39b4e33aa65cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain pins (container + Dockerfile == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          arg=$(grep -E '^ARG RUST_VERSION=' docker/Dockerfile | head -1 | cut -d= -f2)
          echo "rust-toolchain=$channel  container-rustc=$have  Dockerfile ARG=$arg"
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel). Bump the container: tag in containers.yml."
            exit 1
          fi
          if [ "$channel" != "$arg" ]; then
            echo "::error::docker/Dockerfile RUST_VERSION ($arg) != rust-toolchain.toml ($channel)."
            exit 1
          fi

      # This lane publishes images, so a restored cache is release input — kept
      # only because no untrusted run can write these keys: the workflow has no
      # `pull_request` trigger at all, and a cache created on a child branch is
      # unreadable from the default branch anyway
      # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
      # — "Workflow runs cannot restore caches created for child branches or
      # sibling branches"). The tag/publish lanes that lack that property
      # (release.yml, publish-crates.yml) build cold instead.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning]
          shared-key: containers-${{ matrix.platform }}

      - name: Build (release, native)
        # The binary is produced by the ferroehr-server package (bin name
        # `ferroehr`) since the crate consolidation; `-p ferroehr` is the
        # platform LIBRARY and yields no binary to strip.
        # build.rs stamps the REVISION value into /management/info; passing
        # github.sha here (an env, never interpolated into a shell) makes the
        # provenance explicit and does not depend on git being present in the
        # slim job container (it is not). Empty/absent degrades to `unknown`.
        env:
          REVISION: ${{ github.sha }}
        run: cargo build --release --locked -p ferroehr-server

      - name: Strip
        run: strip target/release/ferroehr

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferroehr-${{ matrix.platform }}
          path: target/release/ferroehr
          if-no-files-found: error
          retention-days: 1

  # ── Package + push the multi-arch app image (COPY-only; seconds) ────────────
  # On a `v*` tag publish-chart.yml runs concurrently with this workflow and
  # WAITS on this job by name before pulling the image it judges the chart
  # against (#2149). Renaming it here breaks that wait, which is why that step
  # fails loudly on a completed run with no `app image` job rather than sitting
  # out its timeout.
  app-image:
    name: app image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the app image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    needs: binary
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ferroehr-amd64
          path: bin/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ferroehr-arm64
          path: bin/arm64

      # No QEMU: the runtime Dockerfile is COPY-only, so a multi-arch build
      # executes no foreign-arch code.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ANNOTATIONS_LEVELS is not cosmetic. A LABEL lives in the image config
      # blob; an ANNOTATION lives in the manifest or the index — and GHCR reads
      # the package description from the INDEX annotation, which is why a
      # perfectly good description label showed as "No description provided".
      # The action attaches annotations to manifests only by default.
      #
      # The `labels:` block overrides the action's repository-derived guesses,
      # which are wrong for a repository that publishes three images: title
      # comes from the repo NAME, so all three would claim to be "FerroEHR".
      # These values mirror the Dockerfile's, and scripts/checks/image-labels.sh
      # fails if the two ever disagree.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=ferroehr
            org.opencontainers.image.description=Pure-Rust, openEHR-conformant clinical data repository (ITS-REST 1.1.0 + AQL 1.1)
            org.opencontainers.image.source=https://github.com/rubentalstra/FerroEHR
            org.opencontainers.image.url=https://ferroehr.eu/
            org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
            org.opencontainers.image.vendor=FerroEHR
            org.opencontainers.image.authors=Ruben Talstra <https://github.com/rubentalstra>
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=gcr.io/distroless/cc-debian13:nonroot
            org.opencontainers.image.base.digest=sha256:d97bc0a941b8d4be647dc0ee75b264ddbb772f1ac5ba690a4309c00723b23775

      - name: Package and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # REVISION is the OCI-standard git-SHA arg (org.opencontainers.image.revision).
          # runtime-prebuilt is COPY-only, so it only sets the label here; the
          # binary's own /management/info SHA was stamped in the compile job below.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # Full provenance attestation (docs.docker.com/build/metadata/attestations).
          provenance: mode=max
          sbom: true

      # Sign the provenance BuildKit already produced. `provenance: mode=max` +
      # `sbom: true` put SLSA v0.2 provenance and an SPDX SBOM on the image index,
      # but UNSIGNED — a consumer could read them and had no way to tell they were
      # not forged. This binds them to this repository's build identity through
      # Sigstore, the control OWASP's CI/CD cheat sheet asks for beyond commit
      # signing and lockfile hashes.
      #
      # GitHub's native attestation rather than slsa-github-generator: no new
      # secret, and no third-party reusable workflow inside the publish path.
      #
      # This lane is SLSA v1.0 Build **L2**, not L3: the provenance is generated
      # in the same job that builds, and a job's steps share one runner VM, so
      # the signing material is not out of reach of the build steps
      # (https://slsa.dev/spec/v1.0/levels). The release-binaries lane reaches L3
      # by building inside a reusable workflow (release-build.yml); the same move
      # is available here and is tracked on #2140 rather than assumed. Until then
      # this is L2 and says so — the images are genuinely signed, and the level
      # is the honest one.
      #
      #   gh attestation verify oci://ghcr.io/rubentalstra/ferroehr:TAG -R rubentalstra/FerroEHR
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.APP_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  # ── Admin console: server binary per arch + the arch-independent site ───────
  # The WASM/JS/CSS site bundle is architecture-independent, so cargo-leptos
  # runs ONCE (amd64: bin + site); the arm64 job builds only the ssr binary
  # with plain cargo. Same glibc rationale as the app binary job.
  admin-ui-binary:
    name: admin-ui binary (${{ matrix.platform }})
    needs: changes
    # Same cascade as the app lane: admin-ui-image skips with this job.
    if: >-
      needs.changes.outputs.admin_ui == 'true' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    # Digest-pinned, not tag-pinned: a tag is mutable, so a re-run of an
    # already-reviewed commit could build against different bytes. The index
    # digest (not a per-platform one) so both runner architectures resolve.
    container: rust:1.97.1-slim-trixie@sha256:3b2879047d42784ca9403ad20c51ed3df361a50f1df96f5777d39b4e33aa65cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain pin (container == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel)."
            exit 1
          fi

      # Same publishing-lane reasoning as the app binary job above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning]
          shared-key: containers-admin-ui-${{ matrix.platform }}

      - name: Build the ssr server binary (release, native)
        run: cargo build --release --locked --no-default-features --features ssr -p ferroehr-admin-ui

      - name: Strip
        run: strip target/release/ferroehr-admin-ui

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferroehr-admin-ui-${{ matrix.platform }}
          path: target/release/ferroehr-admin-ui
          if-no-files-found: error
          retention-days: 1

      # The site bundle (wasm32 + Tailwind CSS + JS glue) — built once, on
      # amd64 only; it is byte-identical regardless of the server arch.
      # NEVER `cargo install cargo-leptos` here: it unconditionally builds
      # OpenSSL from vendored C source (its cargo-generate dependency pins
      # `vendored-openssl`), which needs perl/make and failed inside the slim
      # image. Prebuilt release binaries keep the pipeline Rust-toolchain-only
      # — the same taiki-e path the ci.yml ui-e2e job uses.
      - name: Install curl for the tool downloads (amd64 only)
        if: matrix.platform == 'amd64'
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates

      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        if: matrix.platform == 'amd64'
        with:
          tool: cargo-leptos@0.3.7,wasm-bindgen@0.2.126

      - name: Build the site bundle (amd64 only)
        if: matrix.platform == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          cd app/ferroehr-admin-ui
          LEPTOS_TAILWIND_VERSION=v4.3.3 cargo leptos build --release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform == 'amd64'
        with:
          name: ferroehr-admin-ui-site
          path: target/site
          if-no-files-found: error
          retention-days: 1

  # ── Package + push the multi-arch admin-console image (COPY-only) ───────────
  admin-ui-image:
    name: admin-ui image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the console image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    needs: admin-ui-binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ferroehr-admin-ui-amd64
          path: bin/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ferroehr-admin-ui-arm64
          path: bin/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ferroehr-admin-ui-site
          path: site

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See the app lane for why ANNOTATIONS_LEVELS and the explicit labels are
      # both required.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.ADMIN_UI_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=ferroehr-admin-ui
            org.opencontainers.image.description=Admin console for openEHR ITS-REST CDRs — pure-Rust Leptos web app (template manager, visual AQL query builder, EHR browser)
            org.opencontainers.image.source=https://github.com/rubentalstra/FerroEHR
            org.opencontainers.image.url=https://ferroehr.eu/
            org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
            org.opencontainers.image.vendor=FerroEHR
            org.opencontainers.image.authors=Ruben Talstra <https://github.com/rubentalstra>
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=gcr.io/distroless/cc-debian13:nonroot
            org.opencontainers.image.base.digest=sha256:d97bc0a941b8d4be647dc0ee75b264ddbb772f1ac5ba690a4309c00723b23775

      - name: Package and push
        id: build_admin_ui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/admin-ui/Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # Full provenance attestation (docs.docker.com/build/metadata/attestations).
          provenance: mode=max
          sbom: true

      # Signed provenance, as on the app image above.
      #
      #   gh attestation verify oci://ghcr.io/rubentalstra/ferroehr-admin-ui:TAG -R rubentalstra/FerroEHR
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.ADMIN_UI_IMAGE }}
          subject-digest: ${{ steps.build_admin_ui.outputs.digest }}
          push-to-registry: true
  # ── PostgreSQL image (only on docker/postgres changes or tags; multi-arch) ──
  # One RUN layer (the Debian security upgrade, #2408) on top of postgres:18.6,
  # so the non-native platform needs QEMU — set up below.
  postgres-image:
    name: postgres image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the postgres image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    needs: changes
    if: >-
      needs.changes.outputs.postgres == 'true' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See the app lane for why ANNOTATIONS_LEVELS and the explicit labels are
      # both required. `licenses` is an SPDX expression here because the image
      # really is mixed: our init scripts over an upstream `postgres` base.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.POSTGRES_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=ferroehr-postgres
            org.opencontainers.image.description=PostgreSQL 18 preconfigured (role/db/schemas/extensions) for ferroehr
            org.opencontainers.image.source=https://github.com/rubentalstra/FerroEHR
            org.opencontainers.image.url=https://ferroehr.eu/
            org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
            org.opencontainers.image.vendor=FerroEHR
            org.opencontainers.image.authors=Ruben Talstra <https://github.com/rubentalstra>
            org.opencontainers.image.licenses=MIT AND PostgreSQL
            org.opencontainers.image.base.name=postgres:18.6
            org.opencontainers.image.base.digest=sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941

      - name: Build and push
        id: build_postgres
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Full provenance attestation (docs.docker.com/build/metadata/attestations).
          provenance: mode=max
          sbom: true

      # Signed provenance, as on the app image above.
      #
      #   gh attestation verify oci://ghcr.io/rubentalstra/ferroehr-postgres:TAG -R rubentalstra/FerroEHR
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.POSTGRES_IMAGE }}
          subject-digest: ${{ steps.build_postgres.outputs.digest }}
          push-to-registry: true
  # ── Smoke test (amd64): pull the pushed image, compose up, exercise the API ──
  image-scan:
    name: image vulnerability scan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the image this run just pushed
    needs: app-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The published index is dual-arch and trivy reads ONE variant per
      # invocation (`--platform`, default linux/amd64), so each variant is
      # scanned explicitly (#2412) — the app image by its pushed digest, the
      # postgres image from per-arch local builds (QEMU for the non-native
      # one; its Dockerfile runs the Debian security upgrade, #2408).
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          scan-type: image
          image-ref: ${{ env.APP_IMAGE }}@${{ needs.app-image.outputs.digest }}
          scanners: vuln
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: ${{ env.APP_IMAGE }}@${{ needs.app-image.outputs.digest }}
          scanners: vuln
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml

      # `ferroehr-postgres` is the one image whose OS package set we do not
      # control — it is built on the upstream `postgres` image — so it is the
      # image this gate exists for. Built locally here because the
      # postgres-image job only runs when its inputs change.
      - name: Build the postgres image for scanning (both platforms)
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t ferroehr-postgres:scan-amd64 docker/postgres
          docker buildx build --platform linux/arm64 --load \
            -t ferroehr-postgres:scan-arm64 docker/postgres

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ferroehr-postgres:scan-amd64
          scanners: vuln
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ferroehr-postgres:scan-arm64
          scanners: vuln
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml

  smoke:
    name: compose smoke (amd64)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the image this run just pushed
    needs: app-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed app image (by digest)
        env:
          DIGEST: ${{ needs.app-image.outputs.digest }}
        run: |
          docker pull "${APP_IMAGE}@${DIGEST}"
          docker tag  "${APP_IMAGE}@${DIGEST}" ferroehr:smoke

      - name: Build postgres image (amd64; COPY-only, seconds)
        run: docker build -t ferroehr-postgres:smoke docker/postgres

      - name: Smoke test
        shell: bash
        env:
          FERROEHR_IMAGE: ferroehr:smoke
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:smoke
        run: bash docker/smoke-test.sh
