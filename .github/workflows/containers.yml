# .github/workflows/containers.yml
#
# Container images, built for speed:
#
#   1. The `ehrbase` binary is compiled OUTSIDE Docker, natively per
#      architecture (amd64 on ubuntu-26.04, arm64 on ubuntu-26.04-arm — no
#      QEMU emulation anywhere), inside a rust:*-slim-trixie job container
#      so the binary links against the same glibc (Debian 13 / 2.41) as the
#      distroless cc-debian13 runtime image. Swatinem/rust-cache makes warm
#      builds incremental.
#   2. The image build itself is a COPY-only packaging step — `docker/Dockerfile`
#      built with `--target runtime-prebuilt` (the same file compose builds with
#      `--target runtime-from-source`; ONE runtime stage, zero drift — issue #282
#      D5). A multi-arch buildx push takes seconds because no code runs inside.
#   3. The smoke test pulls the pushed image by digest instead of rebuilding.
name: Containers

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/ehrbase-rs
  POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/ehrbase-rs-postgres
  ADMIN_UI_IMAGE: ghcr.io/${{ github.repository_owner }}/ehrbase-rs-admin-ui

permissions:
  contents: read
  packages: write

jobs:
  # ── Detect which images need (re)building ───────────────────────────────────
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.filter.outputs.postgres }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            postgres:
              - 'docker/postgres/**'
              - '.github/workflows/containers.yml'

  # ── Compile the server binary natively per arch (no QEMU, no in-Docker cargo) ─
  binary:
    name: binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    # Debian 13 (trixie) container so the produced binary targets glibc 2.41,
    # matching gcr.io/distroless/cc-debian13 exactly. The tag must equal the
    # rust-toolchain.toml channel — verified below, never assumed.
    container: rust:1.96.1-slim-trixie
    steps:
      - uses: actions/checkout@v7

      - name: Verify toolchain pins (container + Dockerfile == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          arg=$(grep -E '^ARG RUST_VERSION=' docker/Dockerfile | head -1 | cut -d= -f2)
          echo "rust-toolchain=$channel  container-rustc=$have  Dockerfile ARG=$arg"
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel). Bump the container: tag in containers.yml."
            exit 1
          fi
          if [ "$channel" != "$arg" ]; then
            echo "::error::docker/Dockerfile RUST_VERSION ($arg) != rust-toolchain.toml ($channel)."
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: containers-${{ matrix.platform }}

      - name: Build (release, native)
        # The binary is produced by the ehrbase-server package (bin name
        # `ehrbase`) since the crate consolidation; `-p ehrbase` is the
        # platform LIBRARY and yields no binary to strip.
        # build.rs stamps the REVISION value into /management/info; passing
        # github.sha here (an env, never interpolated into a shell) makes the
        # provenance explicit and does not depend on git being present in the
        # slim job container (it is not). Empty/absent degrades to `unknown`.
        env:
          REVISION: ${{ github.sha }}
        run: cargo build --release --locked -p ehrbase-server

      - name: Strip
        run: strip target/release/ehrbase

      - uses: actions/upload-artifact@v7
        with:
          name: ehrbase-${{ matrix.platform }}
          path: target/release/ehrbase
          if-no-files-found: error
          retention-days: 1

  # ── Package + push the multi-arch app image (COPY-only; seconds) ────────────
  app-image:
    name: app image
    runs-on: ubuntu-26.04
    needs: binary
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ehrbase-amd64
          path: bin/amd64
      - uses: actions/download-artifact@v8
        with:
          name: ehrbase-arm64
          path: bin/arm64

      # No QEMU: the runtime Dockerfile is COPY-only, so a multi-arch build
      # executes no foreign-arch code.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Package and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # REVISION is the OCI-standard git-SHA arg (org.opencontainers.image.revision).
          # runtime-prebuilt is COPY-only, so it only sets the label here; the
          # binary's own /management/info SHA was stamped in the compile job below.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # Full provenance attestation (docs.docker.com/build/metadata/attestations).
          provenance: mode=max
          sbom: true

  # ── Admin console: server binary per arch + the arch-independent site ───────
  # The WASM/JS/CSS site bundle is architecture-independent, so cargo-leptos
  # runs ONCE (amd64: bin + site); the arm64 job builds only the ssr binary
  # with plain cargo. Same glibc rationale as the app binary job.
  admin-ui-binary:
    name: admin-ui binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    container: rust:1.96.1-slim-trixie
    steps:
      - uses: actions/checkout@v7

      - name: Verify toolchain pin (container == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel)."
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: containers-admin-ui-${{ matrix.platform }}

      - name: Build the ssr server binary (release, native)
        run: cargo build --release --locked --no-default-features --features ssr -p ehrbase-admin-ui

      - name: Strip
        run: strip target/release/ehrbase-admin-ui

      - uses: actions/upload-artifact@v7
        with:
          name: ehrbase-admin-ui-${{ matrix.platform }}
          path: target/release/ehrbase-admin-ui
          if-no-files-found: error
          retention-days: 1

      # The site bundle (wasm32 + Tailwind CSS + JS glue) — built once, on
      # amd64 only; it is byte-identical regardless of the server arch.
      # NEVER `cargo install cargo-leptos` here: it unconditionally builds
      # OpenSSL from vendored C source (its cargo-generate dependency pins
      # `vendored-openssl`), which needs perl/make and failed inside the slim
      # image. Prebuilt release binaries keep the pipeline Rust-toolchain-only
      # — the same taiki-e path the ci.yml ui-e2e job uses.
      - name: Install curl for the tool downloads (amd64 only)
        if: matrix.platform == 'amd64'
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates

      - uses: taiki-e/install-action@v2
        if: matrix.platform == 'amd64'
        with:
          tool: cargo-leptos@0.3.7,wasm-bindgen@0.2.126

      - name: Build the site bundle (amd64 only)
        if: matrix.platform == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          cd app/ehrbase-admin-ui
          LEPTOS_TAILWIND_VERSION=v4.3.3 cargo leptos build --release

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'amd64'
        with:
          name: ehrbase-admin-ui-site
          path: target/site
          if-no-files-found: error
          retention-days: 1

  # ── Package + push the multi-arch admin-console image (COPY-only) ───────────
  admin-ui-image:
    name: admin-ui image
    runs-on: ubuntu-26.04
    needs: admin-ui-binary
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ehrbase-admin-ui-amd64
          path: bin/amd64
      - uses: actions/download-artifact@v8
        with:
          name: ehrbase-admin-ui-arm64
          path: bin/arm64
      - uses: actions/download-artifact@v8
        with:
          name: ehrbase-admin-ui-site
          path: site

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.ADMIN_UI_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Package and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/admin-ui/Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # Full provenance attestation (docs.docker.com/build/metadata/attestations).
          provenance: mode=max
          sbom: true

  # ── PostgreSQL image (only on docker/postgres changes or tags; multi-arch) ──
  # COPY-only on top of postgres:18.4, so multi-arch needs no QEMU either.
  postgres-image:
    name: postgres image
    runs-on: ubuntu-26.04
    needs: changes
    if: >-
      needs.changes.outputs.postgres == 'true' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.POSTGRES_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Full provenance attestation (docs.docker.com/build/metadata/attestations).
          provenance: mode=max
          sbom: true

  # ── Smoke test (amd64): pull the pushed image, compose up, exercise the API ──
  smoke:
    name: compose smoke (amd64)
    runs-on: ubuntu-26.04
    needs: app-image
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed app image (by digest)
        run: |
          docker pull "${APP_IMAGE}@${{ needs.app-image.outputs.digest }}"
          docker tag  "${APP_IMAGE}@${{ needs.app-image.outputs.digest }}" ehrbase-rs:smoke

      - name: Build postgres image (amd64; COPY-only, seconds)
        run: docker build -t ehrbase-rs-postgres:smoke docker/postgres

      - name: Smoke test
        shell: bash
        env:
          EHRBASE_IMAGE: ehrbase-rs:smoke
          EHRBASE_POSTGRES_IMAGE: ehrbase-rs-postgres:smoke
        run: bash docker/smoke-test.sh
