# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The "phases need not compile" gate was retired: every job here is
  # REQUIRED. (The historical PORT_STRICT advisory switch is gone.)

jobs:
  # ── Change detection: cargo jobs run ONLY when build-relevant paths change ──
  # Allowlist (owner ruling 2026-07-17: no Rust-affecting change → no cargo
  # jobs, workflow-only and docs-only PRs included): app/, crates/, tools/,
  # scripts/, .cargo/, .config/, Cargo.toml, Cargo.lock, rust-toolchain.toml,
  # rustfmt.toml, clippy.toml, deny.toml. Everything else (docs/, website/,
  # .claude/, .github/, markdown, compose files, assets) skips the nine cargo
  # jobs. GitHub treats a skipped required check as satisfied, so branch
  # protection is unaffected; a workflow-gating bug surfaces on the next
  # code-touching PR, which is acceptable.
  changes:
    name: change detection
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      admin_ui: ${{ steps.filter.outputs.admin_ui }}
      server_dockerfile: ${{ steps.filter.outputs.server_dockerfile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_SHA"
          fi
          # First push / unknown base: run everything.
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Base $base unavailable — treating as code change."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; echo "$changed"
          if [ -z "$changed" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # scripts/ is NOT build-relevant by default: the cargo jobs never
          # execute repo scripts, so a new watcher/site/release script must
          # not cost a Rust run. Allowlist the ONLY scripts a code-gated CI
          # job actually executes (the drift check and the e2e harness).
          code_relevant=$(echo "$changed" | grep -vE '^scripts/' || true)
          if echo "$changed" | grep -qE '^scripts/(check-codegen-drift|ui-e2e)\.sh$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif echo "$code_relevant" | grep -qE '^(app/|crates/|tools/|\.cargo/|\.config/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|rustfmt\.toml$|clippy\.toml$|deny\.toml$)' ; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build-relevant paths touched — cargo jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Admin-console E2E trigger: the console crate, its harness, the
          # composed stack it drives — AND the inputs to the CDR artifact the
          # battery runs against. `Cargo.lock`, `docker/Dockerfile` and this
          # workflow itself were missing (issue #335): a dependency bump, a
          # Dockerfile change, or a change to the job's own build recipe each
          # alter what is under test, and without them a build/caching-only PR
          # could not even run the job it changes.
          if echo "$changed" | grep -qE '^(app/ehrbase-admin-ui/|scripts/ui-e2e\.sh$|docker-compose\.yml$|docker/Dockerfile$|docker/admin-ui/|docker/keycloak/|docker/postgres/|Cargo\.lock$|\.github/workflows/ci\.yml$)' ; then
            echo "admin_ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin_ui=false" >> "$GITHUB_OUTPUT"
          fi
          # The compose/local image target (docker/Dockerfile
          # `runtime-from-source`) is no longer built by ui-e2e, which packages
          # the shipped `runtime-prebuilt` target instead — so that target gets
          # its own job, gated on the one file whose change can break it.
          if echo "$changed" | grep -qE '^docker/Dockerfile$' ; then
            echo "server_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "server_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Required for code changes: formatting ───────────────────────────────────
  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Always required: no AI/Claude attribution in commit messages ────────────
  no-attribution:
    name: no attribution in commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan commit messages for attribution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          # Handle first-push / shallow edge cases.
          git rev-parse "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" >/dev/null 2>&1 || range="HEAD"
          echo "Scanning range: $range"
          if git log --format='%B' "$range" 2>/dev/null | grep -iEn \
             'co-authored-by:.*(claude|anthropic|\[bot\])|generated[[:space:]]+(with|by)[[:space:]]+.*claude|claude[[:space:]]+code|🤖|assisted-by:.*claude'; then
            echo "::error::Commit message contains AI/Claude attribution. Remove it (see project hard rules)."
            exit 1
          fi
          echo "OK: no attribution found."

  # ── Always required: supply-chain policy ────────────────────────────────────
  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  audit:
    name: cargo-audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Cargo.lock IS committed (workspace ships a binary); audit the real pins.
      - run: cargo audit

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Generated code must stay in sync with the vendored specs ──
  codegen-drift:
    name: codegen drift
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Regenerate and diff
        run: bash scripts/check-codegen-drift.sh

  # ── CNF conformance: the enforced-coverage guard (fast, no DB) ───────────────
  # The conformance instrument's own test suite: the ECC catalogue guard (every
  # registered case has an allocated, never-reused ECC number), the
  # derivation-square guard (every case carries a spec citation, a schedule
  # trace or stated ECC-original reason, and an ITS-REST binding), the fixture
  # manifest + adjudication-register validation, and the wire/edition/model
  # unit tests. The e2e CNF run goes through the Docker compose stack
  # (scripts/conformance.sh — the CNF 2.0 pipeline over tools/cnf-runner) at
  # phase gates; this job is the fast always-on signal: the runner's own
  # test suite (schema drift, artifact gates, interpreter laws, defect
  # rejection, verification pack, comparison gate) plus the full artifact
  # validation.
  conformance:
    name: cnf coverage guard
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p cnf-runner
      - run: cargo run -q -p cnf-runner --bin cnf-runner -- validate --root tools/cnf-runner/artifacts --specs docs/specs/openehr

  # ── Build + tests against PostgreSQL 18.4 ────────────────────────────────────
  test:
    name: build & test (pg18)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # The shared test-database harness (tools/testkit) uses this server
      # directly — no per-test containers in CI at all.
      EHRBASE_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Enable required extensions + non-durable test tuning
        # libxml2-utils provides xmllint — the C14N XML parity gate shells out
        # to it (serialization.md); the runner image does not ship it.
        # The ALTER SYSTEM block applies the non-durable settings the
        # PostgreSQL docs recommend for throwaway data (all three are
        # reloadable — no restart); this server only ever holds test databases.
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d openehr_test \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --all-features
      # --no-tests=pass: empty crates are expected until P17 (nextest exits 4 otherwise)
      - run: cargo nextest run --workspace --all-features --no-tests=pass --profile ci
      - run: cargo test --workspace --doc

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # Same shared-server harness as the test job (tools/testkit).
      EHRBASE_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install xmllint (C14N parity gate) + non-durable test tuning
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --no-tests=pass --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # ── Unused dependencies ──────────────────────────────────────────────────────
  unused-deps:
    name: cargo-machete
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # ── The CDR binary the ui-e2e battery runs against (issue #335) ─────────────
  # It used to be compiled INSIDE the image: `docker/Dockerfile --target
  # runtime-from-source` runs `cargo build --release` in the layer after
  # `COPY . .`. No layer cache can serve that layer — every ui-e2e trigger path
  # lives in the build context, so the COPY is invalidated by construction, and
  # `cargo chef cook` caches THIRD-PARTY dependencies only. The ~190 kLoC
  # first-party release build therefore ran cold on EVERY run (measured locally
  # on an isolated buildx builder: 714 s cold; 6 s with nothing changed; 407 s
  # after touching ONE admin-console source file, with the cook layer reported
  # CACHED and the whole first-party graph recompiling behind it).
  #
  # So the binary is compiled here the way containers.yml compiles the
  # PUBLISHED one — natively, in the pinned rust:*-slim-trixie image, never
  # inside a Dockerfile — and ui-e2e then PACKAGES it with `runtime-prebuilt`,
  # the very final target containers.yml ships. Both final targets inherit ONE
  # shared runtime-base stage, so the battery drives the same distroless base,
  # the same non-root user, EXPOSE, HEALTHCHECK and ENTRYPOINT as before.
  #
  # Two caches, strongest first:
  #   1. the finished binary, keyed on the exact content of every input the
  #      server build reads. An admin-console-only PR touches none of them, so
  #      the key hits and no compile runs at all.
  #   2. sccache (per compilation unit) for the miss case — a lockfile bump or
  #      a server-side change then recompiles only what actually changed
  #      instead of collapsing back to a cold build.
  #
  # SOURCE_DATE_EPOCH is pinned and REVISION is deliberately NOT passed in this
  # lane: app/ehrbase/build.rs bakes both into the `ehrbase` crate through
  # `cargo:rustc-env`, and sccache tracks `env!` values in its cache key
  # ("Values from `env!` require Rust >= 1.46 to be tracked in caching" —
  # github.com/mozilla/sccache docs/Rust.md), so a per-run value makes the three
  # largest first-party crates uncacheable by construction. Without REVISION,
  # build.rs degrades to SHA=unknown BY DESIGN, and the battery asserts
  # behaviour, never provenance. The PUBLISHED images are untouched:
  # containers.yml still stamps github.sha into them.
  ui-e2e-binary:
    name: ui-e2e server binary
    needs: changes
    if: needs.changes.outputs.admin_ui == 'true'
    runs-on: ubuntu-latest
    # Debian 13 (trixie) container so the binary targets glibc 2.41, matching
    # gcr.io/distroless/cc-debian13 exactly — the same pin and the same reason
    # as containers.yml's `binary` job. It must NOT be compiled on the bare
    # runner: glibc compatibility runs forward only, so a runner image with a
    # newer glibc than the runtime image ships yields a binary that image
    # cannot load.
    container: rust:1.96.1-slim-trixie
    env:
      # Fixed build timestamp — reproducible, and the precondition for the
      # compile to be cacheable at all (see the block above; build.rs honours
      # SOURCE_DATE_EPOCH per reproducible-builds.org/docs/source-date-epoch).
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@v7
      - name: Verify toolchain pins (container == rust-toolchain.toml == Dockerfile)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          arg=$(grep -E '^ARG RUST_VERSION=' docker/Dockerfile | head -1 | cut -d= -f2)
          echo "rust-toolchain=$channel  container-rustc=$have  Dockerfile ARG=$arg"
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel). Bump the container: tag."
            exit 1
          fi
          if [ "$channel" != "$arg" ]; then
            echo "::error::docker/Dockerfile RUST_VERSION ($arg) != rust-toolchain.toml ($channel)."
            exit 1
          fi
      # Cache 1 — the binary itself. The key covers every path the server build
      # reads and nothing else; app/ehrbase-admin-ui/ is deliberately absent
      # because the console is not in ehrbase-server's dependency graph (that is
      # ehrbase + ehrbase-rest), which is exactly why an admin-console PR can
      # reuse the binary. Exact key, NO restore-keys: a near-match would package
      # a binary that does not correspond to this tree
      # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching).
      - id: binary-cache
        uses: actions/cache@v6
        with:
          path: bin/amd64/ehrbase
          key: ui-e2e-server-bin-1.96.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ehrbase/**', 'app/ehrbase-rest/**', 'app/ehrbase-server/**', 'tools/**') }}
      # Registry cache only, for the reason the ui-e2e job spells out below:
      # rust-cache's key hashes every manifest, so a lockfile bump rotates a
      # whole target archive and pays a cold build, while sccache degrades to
      # partial hits (github.com/Swatinem/rust-cache — with `cache-targets:
      # false`, "only the cargo registry will be cached").
      - uses: Swatinem/rust-cache@v2
        if: steps.binary-cache.outputs.cache-hit != 'true'
        with:
          shared-key: ui-e2e-server-binary
          cache-targets: false
      - uses: mozilla-actions/sccache-action@v0.0.10
        if: steps.binary-cache.outputs.cache-hit != 'true'
      - name: Build the server binary (release, native)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          # "Incrementally compiled crates cannot be cached"
          # (github.com/mozilla/sccache#known-caveats).
          CARGO_INCREMENTAL: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p ehrbase-server
          strip target/release/ehrbase
          mkdir -p bin/amd64
          install -m0755 target/release/ehrbase bin/amd64/ehrbase
      # Cache-hit visibility in the job log, the same as the battery job below.
      - name: sccache statistics
        if: always() && steps.binary-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: ${SCCACHE_PATH} --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-server-binary
          path: bin/amd64/ehrbase
          if-no-files-found: error
          retention-days: 1

  # ── Admin-console E2E (merge gate for console-touching changes) ─────────────
  # Runs the full composed journey battery (scripts/ui-e2e.sh): postgres +
  # ehrbase + Keycloak via compose, the console built by cargo-leptos on the
  # host, chromedriver journeys with the browser-console gate. Screenshots
  # upload on success AND failure (human review — no pixel-diff assertions).
  ui-e2e:
    name: ui-e2e
    needs: [changes, ui-e2e-binary]
    if: needs.changes.outputs.admin_ui == 'true'
    runs-on: ubuntu-latest
    # Least privilege, scoped to THIS job: the workflow declares no top-level
    # `permissions`, so every other job keeps the repository default and only
    # ui-e2e states its own (job-level settings override workflow-level ones —
    # docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions).
    # `contents: read` for the checkout is all it needs: nothing here writes to
    # a registry any more (the GHCR buildx layer cache was removed, and the
    # image is now packaged locally from a job artifact).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          # sccache (installed next) owns Rust compilation caching for this
          # job, so rust-cache stops caching `target` and keeps only the cargo
          # registry/bin cache (`cache-targets: false` — "If false, only the
          # cargo registry will be cached", github.com/Swatinem/rust-cache).
          # Why: rust-cache's key hashes every Cargo.lock/Cargo.toml, so any
          # lockfile change rotates the whole target archive and the job pays a
          # full cold build; sccache is keyed per compilation unit and degrades
          # to partial hits instead. Keeping both would also have the two
          # caches compete for the same 10 GB/repo Actions cache budget, whose
          # least-recently-accessed eviction is the very pressure this job hit
          # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
          # — "the limit is 10 GB per repository" … "deleting the caches in
          # order of last access date"). The registry cache stays: sccache does
          # not cache crate *downloads*.
          cache-targets: false
      # sccache with the GitHub Actions cache backend, installed BEFORE any
      # cargo invocation so every later compile can reach it
      # (github.com/mozilla-actions/sccache-action). RUSTC_WRAPPER +
      # SCCACHE_GHA_ENABLED are set on the compiling step, not job-wide, so the
      # tool-install step below cannot accidentally depend on the wrapper.
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: taiki-e/install-action@v2
        with:
          # wasm-bindgen pinned to the workspace's wasm-bindgen version;
          # cargo-leptos resolves its external tools from PATH before its
          # own downloader (which failed opaque on a runner), so both it
          # and Tailwind are preinstalled deterministically.
          tool: cargo-nextest,cargo-leptos@0.3.7,wasm-bindgen@0.2.126
      - name: Install the Tailwind v4 standalone binary
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss --help | head -1
      # The CDR image is PACKAGED here, never compiled here (issue #335 — the
      # rationale is on the ui-e2e-binary job above). `runtime-prebuilt` is
      # COPY-only, so this is a seconds-long step with no layer-cache backend
      # involved at all — which is why GHCR stays product-images-only
      # (ehrbase-rs, ehrbase-rs-postgres, ehrbase-rs-admin-ui) and no
      # `build-cache` package is published beside them (owner call 2026-07-26).
      # `load: true` puts the result in the docker store so the compose
      # `--no-build` below finds it.
      #
      # The artifact download loses the executable bit (GitHub artifacts do not
      # preserve file permissions), which is exactly why the Dockerfile COPYs
      # the binary with `--chmod=0755`
      # (docs.docker.com/reference/dockerfile — COPY --chmod).
      - uses: actions/download-artifact@v8
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@v4
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ehrbase-rs:ui-e2e
      - name: Build the postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ehrbase-rs-postgres:ui-e2e docker/postgres
      - name: Run the E2E journey battery
        # UI_E2E_NO_BUILD makes ui-e2e.sh `up --no-build` the pre-built images.
        env:
          UI_E2E_NO_BUILD: "1"
          EHRBASE_IMAGE: ehrbase-rs:ui-e2e
          EHRBASE_POSTGRES_IMAGE: ehrbase-rs-postgres:ui-e2e
          # The HOST Rust build lives inside this script (cargo-leptos for the
          # console + cargo-nextest for the e2e binaries), so the sccache
          # wrapper is set here — the two variables the action documents for
          # Rust (github.com/mozilla-actions/sccache-action#rust).
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          # "Incrementally compiled crates cannot be cached. By default, in the
          # debug profile Cargo will use incremental compilation" (the sccache
          # README, github.com/mozilla/sccache#known-caveats) — and the debug
          # profile is exactly what cargo-leptos and nextest build here. Set
          # explicitly rather than relying on rust-cache also setting it.
          CARGO_INCREMENTAL: "0"
        run: bash scripts/ui-e2e.sh
      # Cache-hit visibility in the job log. `${SCCACHE_PATH}` is exported by
      # the action; `--show-stats` "will print a summary of cache statistics"
      # (github.com/mozilla/sccache). `always()` so a failed battery still
      # reports whether the compile was warm.
      - name: sccache statistics
        if: always()
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: ${SCCACHE_PATH} --show-stats
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-screenshots
          path: target/ui-e2e/screenshots/
          if-no-files-found: ignore

  # ── The compose/local image target (docker/Dockerfile runtime-from-source) ──
  # ui-e2e packages the shipped `runtime-prebuilt` target now (issue #335), so
  # the in-image cargo-chef build that `docker compose up --build` and
  # scripts/conformance.sh rely on would otherwise have no CI exercise at all.
  # It is built here instead — but ONLY when its own recipe changes, which is
  # the one moment the full cold compile buys something. Nothing is exported:
  # the build succeeding IS the assertion.
  server-image-from-source:
    name: server image (from source)
    needs: changes
    if: needs.changes.outputs.server_dockerfile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-from-source
          push: false

  # Screenshot-freshness guard (the changelog-guard pattern): a PR that
  # changes the console UI must re-capture the published book screenshots in
  # the same PR (freshness, not pixels — owner decision). Escape hatch: the
  # `no-ui-visual-change` label for BFF-only/comment/test changes.
  ui-screenshot-guard:
    name: ui-screenshot-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require refreshed screenshots for UI changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-ui-visual-change') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-ui-visual-change label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^app/ehrbase-admin-ui/(src|style)/'; then
            echo "No console UI paths touched — guard not required."; exit 0
          fi
          if echo "$changed" | grep -qE '^website/book/src/admin-ui/img/'; then
            echo "Screenshots refreshed — OK."; exit 0
          fi
          echo "::error::This PR changes the admin-console UI but does not refresh website/book/src/admin-ui/img/ (run scripts/ui-e2e.sh with UI_E2E_DOCS_SHOTS=1 and commit the captures), and does not carry the 'no-ui-visual-change' label." >&2
          exit 1

  # Changelog guard (Keep a Changelog discipline): a PR that changes
  # user-visible surfaces must update CHANGELOG.md's [Unreleased] section in
  # the same PR. Escape hatch: the `no-changelog` label for genuinely
  # invisible changes (internal refactors, CI, docs).
  changelog:
    name: changelog-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Structure check runs UNCONDITIONALLY — the no-changelog label waives
      # the entry requirement below, never the file's Keep-a-Changelog
      # validity (duplicate '### Added'/'### Fixed' headers in one release
      # section shipped into release notes twice before this guard).
      - name: Changelog structure (no duplicate subsections, canonical types)
        run: bash scripts/check-changelog-structure.sh
      - name: Require a CHANGELOG entry for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-changelog label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^(app/|crates/|deploy/|docker/|docker-compose|Cargo\.toml|Cargo\.lock)'; then
            echo "No user-visible surface touched — guard not required."; exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            if git diff "$BASE" "$HEAD" -- CHANGELOG.md | grep -q '^+.*[^[:space:]]'; then
              echo "CHANGELOG.md updated — OK."; exit 0
            fi
          fi
          echo "::error::This PR changes user-visible surfaces (app/, crates/, deploy/, docker/, manifests) but does not add a CHANGELOG.md [Unreleased] entry (Keep a Changelog 1.1.0). Add one, or apply the 'no-changelog' label if truly invisible." >&2
          exit 1

  # Citation guard: CITATION.cff must stay CFF-1.2.0-schema-valid and
  # version-consistent with the workspace — a malformed file silently breaks
  # GitHub's "Cite this repository" button, and a stale version misquotes the
  # release in research citations. The release cut bumps version +
  # date-released (.claude/rules/changelog.md §Cutting a release).
  citation:
    name: citation-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate CITATION.cff (CFF 1.2.0 schema)
        run: pipx run cffconvert --validate
      - name: CITATION.cff version matches the workspace version
        run: |
          set -euo pipefail
          cff_ver=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' CITATION.cff)
          ws_ver=$(sed -nE 's/^version = "(.*)"$/\1/p' Cargo.toml | head -1)
          if [ -z "$cff_ver" ] || [ -z "$ws_ver" ]; then
            echo "::error::could not extract versions (CITATION.cff: '$cff_ver', Cargo.toml: '$ws_ver')." >&2
            exit 1
          fi
          if [ "$cff_ver" != "$ws_ver" ]; then
            echo "::error::CITATION.cff version ($cff_ver) != workspace version ($ws_ver) — the release cut bumps CITATION.cff version/date-released (.claude/rules/changelog.md)." >&2
            exit 1
          fi
          echo "CITATION.cff version $cff_ver matches the workspace version."
