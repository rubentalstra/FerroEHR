# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, NEVER a develop run. The change filter below
  # compares only THIS push's delta, so a develop run cancelled mid-flight is
  # never re-evaluated by the next push if that push touches no code — a
  # defect can then land permanently with every job reported green-or-skipped.
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; every job grants itself the minimum it needs
# (job-level permissions override workflow-level ones —
# docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions).
# A job added without a `permissions:` block therefore gets a token that can do
# nothing, which fails loudly at its checkout rather than running over-privileged.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI builds are closer to from-scratch builds; incremental compilation only
  # adds dependency-tracking overhead and bloats the caches — and sccache
  # cannot cache incrementally-compiled crates at all
  # (github.com/mozilla/sccache#known-caveats).
  CARGO_INCREMENTAL: "0"
  # No debuginfo in CI test builds: linking is the one cost no compile cache
  # can remove (sccache never caches linker invocations), and debuginfo is
  # most of the link weight and most of ./target's cache size. Backtraces
  # keep symbol names, only source lines are lost (the bevy/polars pattern:
  # bevy sets exactly these two vars; polars uses `-C debuginfo=0`).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Every job here is REQUIRED — there is no advisory tier.
  #
  # Cache policy (the ruff/polars `save-if` idiom): only develop writes the
  # per-job rust-cache entries; PR branches restore develop's warm cache and
  # never publish their own. PR-branch caches are read by nothing else (GHA
  # cache scoping), so letting every PR save would only thrash the shared
  # 10 GB repo quota and evict the caches that matter — including the ui-e2e
  # exact-key binary caches below.

jobs:
  # ── Change detection: cargo jobs run ONLY when build-relevant paths change ──
  # Allowlist (owner ruling 2026-07-17: no Rust-affecting change → no cargo
  # jobs, workflow-only and docs-only PRs included): app/, crates/, tools/,
  # scripts/, .cargo/, .config/, Cargo.toml, Cargo.lock, rust-toolchain.toml,
  # rustfmt.toml, clippy.toml, deny.toml. Everything else (docs/, website/,
  # .claude/, .github/, markdown, compose files, assets) skips the cargo
  # jobs. GitHub treats a skipped required check as satisfied, so branch
  # protection is unaffected; a workflow-gating bug surfaces on the next
  # code-touching PR, which is acceptable.
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      admin_ui: ${{ steps.filter.outputs.admin_ui }}
      server_dockerfile: ${{ steps.filter.outputs.server_dockerfile }}
      helm: ${{ steps.filter.outputs.helm }}
      chart_boot: ${{ steps.filter.outputs.chart_boot }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_SHA"
          fi
          # First push / unknown base: run everything. Every output must be set
          # here — an unset output reads as `false` downstream, and a skipped job
          # counts as satisfied in `conclusion`, so omitting one turns "run
          # everything" into "silently gate nothing".
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Base $base unavailable — treating as a change to everything."
            {
              echo "code=true"
              echo "admin_ui=true"
              echo "server_dockerfile=true"
              echo "helm=true"
              echo "chart_boot=true"
              echo "deploy=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; echo "$changed"
          # Every output is written here for the reason the fallback above
          # states: an unset output reads as `false` downstream and a skipped
          # job counts as satisfied, so writing only `code` would leave the
          # other gates unset rather than deliberately false.
          if [ -z "$changed" ]; then
            {
              echo "code=false"
              echo "admin_ui=false"
              echo "server_dockerfile=false"
              echo "helm=false"
              echo "chart_boot=false"
              echo "deploy=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # scripts/ is NOT build-relevant by default: the cargo jobs never
          # execute repo scripts, so a new watcher/site/release script must
          # not cost a Rust run. Allowlist the ONLY scripts a code-gated CI
          # job actually executes (the drift check and the e2e harness).
          # The deployment harness drives the composed stack, so it is relevant
          # to its own scripts, the compose files, and the server image — and to
          # the code, since what it probes IS the server.
          if echo "$changed" | grep -qE '^(scripts/deploy-probe|docker-compose|docker/)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          code_relevant=$(echo "$changed" | grep -vE '^scripts/' || true)
          if echo "$changed" | grep -qE '^scripts/(checks/codegen-drift|ui-e2e)\.sh$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif echo "$code_relevant" | grep -qE '^(app/|crates/|tools/|\.cargo/|\.config/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|rustfmt\.toml$|clippy\.toml$|deny\.toml$)' ; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build-relevant paths touched — cargo jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Admin-console E2E trigger: the console crate, its harness, the
          # composed stack it drives — AND the inputs to the CDR artifact the
          # battery runs against. `Cargo.lock`, `docker/Dockerfile` and this
          # workflow itself were missing (issue #335): a dependency bump, a
          # Dockerfile change, or a change to the job's own build recipe each
          # alter what is under test, and without them a build/caching-only PR
          # could not even run the job it changes.
          if echo "$changed" | grep -qE '^(app/ferroehr-admin-ui/|scripts/ui-e2e\.sh$|docker-compose\.yml$|docker-compose\.override\.yml$|docker-compose\.keycloak\.yml$|docker/Dockerfile$|docker/admin-ui/|docker/keycloak/|docker/postgres/|Cargo\.lock$|\.github/workflows/ci\.yml$)' ; then
            echo "admin_ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin_ui=false" >> "$GITHUB_OUTPUT"
          fi
          # The compose/local image target (docker/Dockerfile
          # `runtime-from-source`) is not built by ui-e2e, which packages
          # the shipped `runtime-prebuilt` target instead — so that target gets
          # its own job, gated on the one file whose change can break it.
          if echo "$changed" | grep -qE '^docker/Dockerfile$' ; then
            echo "server_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "server_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi
          # Helm chart gate (#2110): the chart, its CI value overlays, the golden
          # renders, the validator, the helm pin — and this workflow itself, so a
          # change to the job's own recipe exercises the job it changes.
          if echo "$changed" | grep -qE '^(deploy/helm/|\.github/workflows/ci\.yml$)' ; then
            echo "helm=true" >> "$GITHUB_OUTPUT"
          else
            echo "helm=false" >> "$GITHUB_OUTPUT"
          fi
          # Chart BOOT gate (#2159), a strict superset of the helm filter: the
          # overlays are only half of the pair under test, the other half being
          # the configuration vocabulary they are written against. Both sides
          # can break it — the overlays went un-bootable because the SERVER
          # tightened validation (an auth mechanism became mandatory, the HMAC
          # floor arrived, a password hash started being parsed at boot) while
          # the values files stood still and every render stayed green. So a
          # change to the config tree, its validators or the annotated template
          # that is the schema of record re-boots the overlays too. The
          # Dockerfile is in because it decides what the binary is packaged into.
          if echo "$changed" | grep -qE '^(deploy/helm/|\.github/workflows/ci\.yml$|docker/Dockerfile$|app/ferroehr/src/config/|app/ferroehr/assets/ferroehr\.default\.toml$|app/ferroehr-rest/src/config\.rs$)' ; then
            echo "chart_boot=true" >> "$GITHUB_OUTPUT"
          else
            echo "chart_boot=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Required for code changes: formatting ───────────────────────────────────
  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          # rustfmt compiles nothing — a restored target/registry cache is
          # pure download time here.
          cache: false
      - run: cargo fmt --all --check

  # ── Always required: no AI/Claude attribution in commit messages ────────────
  no-attribution:
    name: no attribution in commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan commit messages for attribution
        shell: bash
        # Context reaches the shell through env, never `${{ }}`-inline: the
        # expression is substituted into the script BEFORE bash parses it, so an
        # inline expansion is executable text (the `changes` job above is the
        # pattern). Same discipline as the other guards in this workflow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
            base="$PR_BASE"
          else
            range="$PUSH_BEFORE..$PUSH_SHA"
            base="$PUSH_BEFORE"
          fi
          # Handle first-push / shallow edge cases.
          git rev-parse "${base:-HEAD~1}" >/dev/null 2>&1 || range="HEAD"
          echo "Scanning range: $range"
          if git log --format='%B' "$range" 2>/dev/null | grep -iEn \
             'co-authored-by:.*(claude|anthropic|\[bot\])|generated[[:space:]]+(with|by)[[:space:]]+.*claude|claude[[:space:]]+code|🤖|assisted-by:.*claude'; then
            echo "::error::Commit message contains AI/Claude attribution. Remove it (see project hard rules)."
            exit 1
          fi
          echo "OK: no attribution found."

  # ── Always required: the workflows audit themselves ─────────────────────────
  # zizmor (docs.zizmor.sh) is static analysis for GitHub Actions, named by the
  # OWASP GitHub Actions Security Cheat Sheet as the defence-in-depth tool for
  # this layer. It is the machine check behind three hard properties here: every
  # `uses:` hash-pinned (unpinned-uses, blanket policy by default), no checkout
  # persisting credentials without a recorded exception (artipacked), and no
  # context value spliced into a shell (template-injection).
  #
  # Ungated on the `changes` filter on purpose: that filter excludes `.github/`,
  # so a workflow-only pull request would otherwise skip the one check that reads
  # workflows.
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: zizmor@1.29.0
      - name: Audit .github/workflows
        # GH_TOKEN enables the ONLINE audits, which is the point of running this
        # beside SHA pinning: impostor-commit verifies that a pinned commit
        # really belongs to the repository named in front of it, and it cannot
        # do that offline. --min-severity=low gates on every actionable tier
        # (artipacked is Low) and leaves the informational tier advisory; zizmor
        # exits non-zero when anything at or above the floor is found.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/workflows/

  # actionlint (github.com/rhysd/actionlint) is the CORRECTNESS half of the pair
  # above: zizmor audits security posture, actionlint checks that the workflow
  # is well-formed at all — `${{ }}` expressions that cannot evaluate, `needs:`
  # naming a job that does not exist, unknown runner labels, and shellcheck over
  # every embedded `run:` block. A committed `.github/actionlint.yaml` (the
  # runner-label roster) existed here long before this job did, so the tool was
  # being run by hand and never gated.
  #
  # Ungated on the `changes` filter for the same reason zizmor is: that filter
  # excludes `.github/`.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The OFFICIAL image, digest-pinned. actionlint is a Go binary, so
        # `taiki-e/install-action` does not carry it and its cargo-binstall
        # fallback cannot ("actionlint is not found" — it is not a crate). The
        # upstream alternative is `curl | bash` off `main`, which is exactly the
        # unpinned fetch this repository's pinning rule exists to forbid. The
        # image is also the only distribution that BUNDLES shellcheck, which
        # half of actionlint's value depends on: "The image contains actionlint
        # executable and all dependencies (shellcheck and pyflakes)"
        # (https://github.com/rhysd/actionlint/blob/main/docs/usage.md).
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence in this repo is a `printf` format string or a
        # `jq` filter, where single quotes are the CORRECT idiom precisely
        # because the shell must not expand `%s` or `$`. Nothing else is
        # suppressed — the run is clean at actionlint's own default severity.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # actionlint validates each job in isolation and cannot know that this
      # repository routes branch protection through a single `conclusion` check,
      # which makes a job missing from its `needs` list run without gating
      # anything.
      - name: Every CI job gates the merge
        run: bash scripts/checks/ci-conclusion-complete.sh

  # Comment-style guard (.claude/rules/comments.md, RFC 505/1574): block
  # comments, TODO(#N) form, NOTE/essay line budgets — over the WHOLE tree
  # hand-written .rs files. Diff-scoped until the legacy essay sweep (#1870)
  # closes, then flips to --all.
  comment-style:
    name: comment-style
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Comment style on changed Rust files
        run: bash scripts/checks/comment-style.sh --all

  spec-citations:
    name: spec-citations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every cited openEHR spec file exists
        run: bash scripts/checks/spec-citations.sh --all

  # No Python anywhere (.claude/rules/rust-style.md §No Python): the tooling
  # languages are bash and Rust. Embedded Python is the worst case — a heredoc
  # inside a command substitution makes bash scan the Python for quote pairs,
  # so one apostrophe in a comment breaks the script.
  no-python:
    name: no-python
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No Python invocations or sources
        run: bash scripts/checks/no-python.sh

  # This project's own code is MIT, so a GPL-family or SSPL grant inside a file
  # we wrote is a licence conflict. It lives here rather than in `.fossa.yml`
  # because FOSSA's customLicenseSearch could not upload on this org's plan and
  # did not honour that file's path exclusions (measured 2026-08-12).
  # LICENSE, REUSE.toml and the codegen header constant must agree on the
  # copyright holder. They did not, and nothing compared them (#2325).
  copyright-holder:
    name: copyright-holder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: One copyright holder, stated identically everywhere
        run: bash scripts/checks/copyright-holder.sh

  license-text:
    name: license-text
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No copyleft licence text in first-party source
        run: bash scripts/checks/first-party-license-text.sh

  # REUSE 3.3 compliance: every file in the tree has machine-readable licensing
  # that SURVIVES the file being copied out of it — which is the expected case
  # for a repository whose premise is that people build on it and ship it, and
  # which redistributes material under six distinct licences.
  #
  # The per-tree `PROVENANCE.md` arrangement is accurate but travels with the
  # tree, not with the file. `REUSE.toml` closes that gap by glob, touching no
  # vendored file — which matters, because hand-editing vendored material is
  # forbidden here.
  licensing:
    name: licensing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint
        # The OFFICIAL image, digest-pinned — the same construction the
        # actionlint job uses and for the same reasons: `reuse` is distributed
        # as a Python package, which this repository does not install, and the
        # published container is the one distribution that needs neither a
        # Python toolchain in CI nor an unpinned installer script.
        run: |
          docker run --rm \
            -v "$PWD:/data" --workdir /data \
            fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e \
            lint
      # `reuse lint` proves the declarations are COMPLETE. It cannot know that
      # this project also publishes a human-readable licensing chapter, which is
      # what a procurement reviewer actually reads and what drifts.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: The declarations, the texts and the chapter agree
        run: bash scripts/checks/licensing-declarations.sh
      # `reuse lint` is satisfied by the glob declaration alone, so it cannot
      # see a first-party file losing the header that makes its licensing
      # travel. This is the check that can.
      - name: First-party Rust source carries its SPDX header
        run: bash scripts/checks/spdx-headers.sh

  # The compose hardening properties (cap_drop ALL, no-new-privileges, no
  # privileged, no seccomp=unconfined, loopback-only publishing). This gate
  # existed and ran nowhere, while `docker-compose.yml` and the operations
  # chapter both told readers it "enforces that on every compose artifact" — a
  # documented guard that does not fire is worse than none, because the docs and
  # the reviewer both believe it did.
  compose-hardening:
    name: compose-hardening
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose artifacts stay hardened
        run: bash scripts/checks/compose-hardening.sh

  # RFC 0201: an error carries its cause. No clippy lint covers this, so the
  # gate is a per-tree ratchet — the flattened-site counts may only fall while
  # the #2034 sweep runs.
  error-source-chain:
    name: error-source-chain
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Error cause chains have not regressed
        run: bash scripts/checks/error-source-chain.sh

  # Default-value style (.claude/rules/rust-style.md §Default values): a field's
  # default lives inline in its struct's `Default` impl — the RFC 3681 shape,
  # hand-written because that syntax is nightly-only.
  #
  # CHANGED-FILES mode until the pre-existing set is swept (#2033): the rule
  # arrived after the tree, so a `--all` gate would fail every PR for violations
  # it did not introduce. This blocks NEW ones from the moment it lands, and the
  # sweep issue flips the argument to `--all` (which additionally enables the
  # single-reader `const` check — that one counts readers tree-wide).
  default-style:
    name: default-style
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # `--all` since #2033 swept the pre-existing sites: the tree is clean, so
      # the guard covers the whole of it rather than only the changed files.
      - name: Default values live in the struct's Default impl
        run: bash scripts/checks/default-style.sh --all
      # Typed-status guard: an HTTP status is compared as a `StatusCode`, never
      # as a number. `--all` from the start — the tree has no violations.
      - name: HTTP statuses are compared as types
        run: bash scripts/checks/typed-status.sh --all
      # Access-layer provenance (#1963): every rationale in the authn/authz layer
      # cites an RFC, a standards publication, or the vendored openEHR text —
      # never another product, a plan-phase marker, or internal markdown.
      - name: Access-layer rationale cites durable sources
        run: bash scripts/checks/access-provenance.sh

  # Docs-claim guard (#1984): a documented KEY must exist in the thing it
  # documents. `mdbook-lint` checks style and `lychee` checks links; both pass on
  # a page whose every technical claim is false, which is how a fabricated Helm
  # values table reached the published site. `--all` from the start: the three
  # defects this found on its first run are fixed in the same change, so the
  # corpus is clean. What it deliberately does NOT check is recorded in the
  # script's header and in `.claude/rules/docs-website.md`.
  docs-claims:
    name: docs-claims
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Documented keys resolve in their source
        run: bash scripts/checks/docs-claims.sh --all
      # Image metadata (#2146): the OCI keys are declared in two places — the
      # Dockerfile, so a direct build is labelled correctly, and the publishing
      # workflow, whose repo-derived defaults are wrong for a repo shipping three
      # images. Two declarations of one fact drift; this fails instead. It also
      # holds base.name/base.digest to the runtime stage's actual FROM pin, and
      # checks that annotations reach the INDEX (the only place GHCR reads a
      # package description from).
      - name: Image metadata is declared once and agrees
        run: bash scripts/checks/image-labels.sh

  # String-built-SQL guard: the AQL engine composes SQL from attacker-supplied
  # query text, so a `format!`/`push_str`-assembled clause in `app/ferroehr/src/
  # aql/` or `app/ferroehr/src/storage/` is refused — the OWASP SQL Injection
  # Prevention Cheat Sheet's "validated data is not necessarily safe to insert
  # into SQL queries via string building". `--all` from the start: the tree is
  # clean, and the one legitimate site is a named exemption in the script.
  sql-string-building:
    name: sql-string-building
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No string-built SQL in the query engine
        run: bash scripts/checks/sql-string-building.sh --all

  error-hygiene:
    name: error-hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No internal detail in a 5xx body or a health detail
        run: bash scripts/checks/error-hygiene.sh

  # ── Always required: supply-chain policy ────────────────────────────────────
  # cargo-deny alone: `cargo deny check` reads the SAME RustSec advisory DB as
  # cargo-audit and additionally enforces yanked = "deny" (deny.toml
  # [advisories]), licenses, bans, and sources — a separate cargo-audit job
  # would be a strict subset run twice (embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html).
  # Cargo.lock IS committed (workspace ships a binary); deny checks the real pins.
  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny
      - run: cargo deny check

  # The published VEX document must be exactly what `deny.toml` plus the prose
  # file generate. Every advisory the gate ACCEPTS carries a machine-readable
  # justification a downstream scanner can ingest — otherwise the argument
  # exists only in a TOML comment nobody downstream reads, and a hospital's
  # scanner sees unexplained findings on a clinical artifact.
  #
  # Ungated on `changes.code`: `deny.toml` is in the code allowlist, but the
  # prose file and the generator are not, and a prose-only edit must still be
  # checked.
  vex:
    name: vex
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `deny.toml` and the prose file are TOML, which jq cannot read. Pinned by
      # version and verified by checksum, like the chart lane's copy: this
      # binary decides whether the gate passes.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: Every accepted advisory has a published VEX justification
        run: bash scripts/checks/vex-advisories.sh

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache (not sccache) is load-bearing here: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539), so the restored
      # target dir is the only compile cache clippy gets.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
      # The console's `hydrate`/`ssr` features are mutually exclusive (a
      # compile_error! guard per the Cargo book §Mutually exclusive features),
      # so the workspace lane excludes it and the crate gets its own two
      # per-feature lanes — the same split as /ui-gates. `--locked` everywhere:
      # CI must fail on new commits only, never on registry drift
      # (https://doc.rust-lang.org/cargo/faq.html#why-have-cargolock-in-version-control).
      - run: cargo clippy --locked --workspace --exclude ferroehr-admin-ui --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p ferroehr-admin-ui --all-targets --features ssr -- -D warnings
      - run: cargo clippy --locked -p ferroehr-admin-ui --target wasm32-unknown-unknown --features hydrate -- -D warnings

  # ── Rustdoc: intra-doc links + doc lints are inert unless rustdoc runs ──────
  # [workspace.lints.rustdoc] levels apply to every `cargo doc`; the -D
  # warnings env additionally promotes the warn-tier doc lints in CI
  # (https://doc.rust-lang.org/rustdoc/lints.html).
  doc:
    name: rustdoc
    needs: changes
    # Path-filtered on PRs (a PR touching no Rust cannot introduce a doc
    # defect), but ALWAYS run on a develop push: the filter is a per-push
    # DELTA, so a code commit whose run was cancelled or whose successor push
    # is docs-only would otherwise never have its docs evaluated at all. This
    # job is ~1/10 the length of the test job, so re-evaluating the whole tree
    # on every develop push is cheap insurance.
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
      # --document-private-items: stale intra-doc links can hide behind
      # non-pub items the public build never evaluates (#1838; measured
      # cost ~10s incremental over the public-only run).
      - run: cargo doc --locked --workspace --exclude ferroehr-admin-ui --all-features --no-deps --document-private-items
      - run: cargo doc --locked -p ferroehr-admin-ui --features ssr --no-deps
      # Doc tests live HERE, not in the pg18 test job: nextest cannot run
      # doctests, so `cargo test --doc` is its own compile (default features —
      # doctests document what a default consumer gets), and this job is ~1/10
      # the length of the test job, so the extra configuration rides the short
      # lane instead of the critical path. No DB: doctests are examples, never
      # integration tests.
      - run: cargo test --locked --workspace --doc

  # ── MSRV verification: the declared rust-version must actually build ────────
  # The Cargo book names cargo-hack as the verification tool — a pinned stable
  # toolchain plus clippy::incompatible_msrv is not verification
  # (https://doc.rust-lang.org/cargo/guide/continuous-integration.html#verifying-rust-version).
  msrv:
    name: msrv (cargo-hack)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-hack
      - run: cargo hack check --rust-version --workspace --locked --all-targets

  # ── Generated code must stay in sync with the vendored specs ──
  codegen-drift:
    name: codegen drift
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Regenerate and diff
        run: bash scripts/checks/codegen-drift.sh

  # ── Build + tests against PostgreSQL 18.4 (+ the CNF artifact validation) ───
  # The CNF coverage guard lives here: its
  # `cargo nextest run -p cnf-runner` was a byte-for-byte subset of this job's
  # `--workspace` nextest run (cnf-runner is a workspace member — its ECC
  # catalogue guard, derivation-square guard, fixture-manifest and
  # adjudication-register tests, and the wire/edition/model unit tests all run
  # here), so the whole suite compiled and ran TWICE per push. Only the
  # artifact `validate` step was unique, and it rides along at the end — the
  # `cargo build` step below has already linked the cnf-runner binary, so the
  # step is pure execution. The e2e CNF run stays where it was: the Docker
  # compose stack (scripts/conformance.sh) at phase gates.
  test:
    name: build & test (pg18)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # The shared test-database harness (tools/testkit) uses this server
      # directly — no per-test containers in CI at all.
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Enable required extensions + non-durable test tuning
        # libxml2-utils provides xmllint — the C14N XML parity gate shells out
        # to it (serialization.md); the runner image does not ship it.
        # The ALTER SYSTEM block applies the non-durable settings the
        # PostgreSQL docs recommend for throwaway data (all three are
        # reloadable — no restart); this server only ever holds test databases.
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d openehr_test \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest
      # The console is excluded from --all-features lanes (mutually exclusive
      # hydrate/ssr, compile_error!-guarded) and tested per-feature instead.
      # The explicit `cargo build` is NOT redundant with nextest: nextest
      # compiles test targets only, this is the one place every workspace BIN
      # actually links (clippy type-checks but never links).
      - run: cargo build --locked --workspace --exclude ferroehr-admin-ui --all-features
      - run: cargo build --locked -p ferroehr-admin-ui --features ssr
      # --no-tests=pass: empty crates are expected until P17 (nextest exits 4 otherwise)
      - run: cargo nextest run --locked --workspace --exclude ferroehr-admin-ui --all-features --no-tests=pass --profile ci
      - run: cargo nextest run --locked -p ferroehr-admin-ui --features ssr --no-tests=pass --profile ci
      # Doc tests moved to the rustdoc job: `cargo test --doc` is a third
      # feature configuration (default features) and compiled the whole
      # workspace again at the tail of THE critical-path job.
      # The CNF artifact validation (catalogue/fixture/register gates over
      # tools/cnf-runner/artifacts) — the binary is already linked by the
      # build step above, so this is seconds of pure execution.
      # `--write-report` refreshes the committed wire-surface coverage report
      # in place; the diff gate below is what makes it a guard. The flag is
      # off by default so a local `validate` never mutates the tree.
      - run: cargo run --locked -q -p cnf-runner --bin cnf-runner -- validate --root tools/cnf-runner/artifacts --specs docs/specs/openehr --write-report
      # Coverage-report drift gate: the regenerated report must match the
      # committed one. Without this the file rots silently — it is generated
      # output that only ever refreshed when someone remembered (#1851).
      - name: Coverage-report drift gate (regenerated report matches the committed artifact)
        run: git diff --exit-code docs/conformance/coverage-report.md

  # ── Coverage: develop pushes only ────────────────────────────────────────────
  # An instrumented build can NEVER reuse the test job's artifacts —
  # cargo-llvm-cov compiles into its own target dir (llvm-cov-target) because
  # `-C instrument-coverage` artifacts are incompatible with normal ones — so
  # on PRs this job was a guaranteed second full build+run of the entire suite
  # whose lcov artifact nothing consumed. It runs post-merge instead (the
  # backstop cadence this repo already merges on), publishes the lcov
  # artifact, and refreshes the README coverage badge on the `badges` branch.
  # PR-only breakage is impossible by construction: it runs the same tests the
  # test job just ran, only instrumented.
  coverage:
    name: coverage
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Pushes the refreshed badge JSON to the `badges` ref below.
      contents: write
    services:
      postgres:
        image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # Same shared-server harness as the test job (tools/testkit).
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install xmllint (C14N parity gate) + non-durable test tuning
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools-preview
          # Only ever runs on develop pushes, so save unconditionally; the
          # instrumented artifacts get their own key by construction (job id).
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # The same two lanes as the test job (the old single `--workspace` run
      # measured the console under its bare default features — neither the ssr
      # nor the hydrate shape anyone ships): everything-but-console with
      # --all-features, console per-feature; --no-report accumulates both into
      # one profile, `report` merges them into a single lcov.
      - run: cargo llvm-cov --no-report nextest --locked --workspace --exclude ferroehr-admin-ui --all-features --no-tests=pass --profile ci
      - run: cargo llvm-cov --no-report nextest --locked -p ferroehr-admin-ui --features ssr --no-tests=pass --profile ci
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
      # README badge: line-coverage %, shields.io endpoint JSON, written as a
      # single-file orphan commit to `badges` (the ref only ever holds one
      # commit). The commit is created through the Git Data REST API, never
      # local plumbing: API commits made with the workflow token are signed by
      # GitHub as github-actions[bot] and show Verified (owner hard rule
      # 2026-08-01 — CI pushes only verified commits;
      # docs.github.com/en/rest/git/commits — "Signature verification").
      # `badges` is not in `on.push.branches`, so this can never retrigger CI.
      - name: Refresh the coverage badge (badges branch)
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pct=$(cargo llvm-cov report --json --summary-only | jq '.data[0].totals.lines.percent')
          printf 'line coverage: %s%%\n' "$pct"
          rounded=$(printf '%.1f' "$pct")
          color=$(awk -v p="$pct" 'BEGIN { print (p>=90) ? "brightgreen" : (p>=80) ? "green" : (p>=70) ? "yellowgreen" : (p>=60) ? "yellow" : "orange" }')
          jq -n --arg msg "${rounded}%" --arg color "$color" \
            '{schemaVersion: 1, label: "coverage", message: $msg, color: $color}' > coverage.json
          blob=$(gh api "repos/$REPO/git/blobs" \
                   -f content="$(base64 -w0 coverage.json)" -f encoding=base64 --jq .sha)
          tree=$(gh api "repos/$REPO/git/trees" \
                   -f 'tree[][path]=coverage.json' -f 'tree[][mode]=100644' \
                   -f 'tree[][type]=blob' -f "tree[][sha]=$blob" --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" \
                   -f message="coverage badge: ${rounded}% line coverage" \
                   -f tree="$tree" --jq .sha)
          # Move (or create) the badges ref to the fresh orphan commit.
          gh api -X PATCH "repos/$REPO/git/refs/heads/badges" \
            -f sha="$commit" -F force=true \
          || gh api "repos/$REPO/git/refs" \
            -f ref="refs/heads/badges" -f sha="$commit"

  # ── The Helm chart's lint + golden renders (issue #2110) ────────────────────
  # deploy/helm/validate.sh is the only check in the repository that pins the
  # chart's security posture — runAsNonRoot, readOnlyRootFilesystem,
  # allowPrivilegeEscalation:false, seccomp RuntimeDefault, drop ALL,
  # enableServiceLinks:false, the default-deny NetworkPolicy — and it ran in no
  # workflow at all, so the goldens went stale on develop and nothing failed.
  #
  # helm is INSTALLED, never taken from the runner image: `helm template` output
  # is not byte-stable across helm releases (4.2.3 emits blank lines 4.1.3 does
  # not), so a drifting preinstalled helm would fail the golden compare with a
  # whitespace diff. The version comes from deploy/helm/.tool-versions, the same
  # file validate.sh checks itself against.
  helm-golden:
    name: helm-golden
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `azure/setup-helm` has NO `version-file` input — its inputs are `version`,
      # `token` and `downloadBaseURL`. An unknown input is a WARNING, not an
      # error, so the action silently installed the latest helm and the golden
      # compare skipped itself ("running helm 4.2.3, goldens are pinned to
      # 4.1.3") while the job still went red. Read the pin and pass it as the
      # input that exists.
      - name: Read the pinned helm version
        id: helm-pin
        run: |
          set -euo pipefail
          version="$(awk '$1 == "helm" { print $2 }' deploy/helm/.tool-versions)"
          [ -n "$version" ] || { echo "::error::no helm line in deploy/helm/.tool-versions"; exit 1; }
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
          echo "pinned helm: v${version}"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.helm-pin.outputs.version }}
      - name: helm lint (default + all-features value sets)
        run: |
          helm lint deploy/helm/ferroehr -f deploy/helm/ci/default-values.yaml
          helm lint deploy/helm/ferroehr -f deploy/helm/ci/all-features-values.yaml
      # The chart gates read the rendered YAML structurally (yq -o=json | jq),
      # because a grep over a manifest passes as soon as ONE container carries a
      # field. Pinned by version and verified by checksum: this step runs before
      # the security gates, so a substituted binary would decide whether they
      # pass.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      # No --update: the goldens in the tree must already match this render.
      - name: Chart validation + golden renders
        run: bash deploy/helm/validate.sh

  # ── Every committed values overlay must BOOT, not merely render (#2159) ─────
  # helm-golden above proves the manifests are well-formed, hardened and
  # unchanged. It proved exactly that while all three overlays carried
  # configurations the server refuses to start on: `auth.enabled` with no
  # mechanism, a placeholder that is not an Argon2id PHC string, a 15-byte HMAC
  # secret under a 32-byte floor, SMART enabled with no public base URL. Four
  # boot failures, four green renders. Nothing but the server can tell the
  # difference, so this job runs it.
  #
  # It runs on every PR that can break the pair (see the `chart_boot` filter),
  # NOT only on a tag — the tag lane's identical check is the last line of
  # defence, and by then the release cut is already failing.
  #
  # The image is packaged from THIS TREE's server binary rather than pulled from
  # GHCR, which is the difference between a gate and a trap: `appVersion` and the
  # chart's config defaults advance on different clocks, so judging a PR against
  # a published image would fail every PR that adds a configuration key, from the
  # commit that adds it until the next release. The binary comes from the
  # ui-e2e-binary job, whose exact-key cache makes a chart-only PR pay nothing
  # for it, and packaging is the COPY-only `runtime-prebuilt` target — seconds.
  chart-boot:
    name: chart-boot
    needs: [changes, ui-e2e-binary]
    if: needs.changes.outputs.chart_boot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pin as the goldens, from the same file: `azure/setup-helm` takes
      # `version`, never `version-file`, and an unknown input is only a warning.
      - name: Read the pinned helm version
        id: helm-pin
        run: |
          set -euo pipefail
          version="$(awk '$1 == "helm" { print $2 }' deploy/helm/.tool-versions)"
          [ -n "$version" ] || { echo "::error::no helm line in deploy/helm/.tool-versions"; exit 1; }
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.helm-pin.outputs.version }}
      # The artifact download loses the executable bit; the Dockerfile COPYs the
      # binary with `--chmod=0755`, which is why that does not matter here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:chart-boot
      - name: Boot every committed values overlay
        env:
          FERROEHR_IMAGE: ferroehr:chart-boot
        run: bash deploy/helm/ci/boot-check.sh

  # ── The deployment harness, on a real composed stack (#2178) ─────────────────
  # The instrument that found ten defects a green 4447-test suite did not: every
  # one lived between "the code is correct" and "the thing an operator runs
  # works". It is worth nothing if it only runs when someone remembers.
  #
  # It reuses the binary the ui-e2e lane already builds, packaged COPY-only in
  # seconds — building the image again here would double a long lane to prove
  # the same bytes.
  #
  # Families needing a dependency the harness composes itself (Keycloak, the
  # broker, the collector) run here; terminology does NOT — it needs a licensed
  # SNOMED release that may not be fetched onto a shared runner, and its own
  # opt-in local lane covers it.
  deploy-probe:
    name: deploy-probe
    needs: [changes, ui-e2e-binary]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:deploy-probe
      - name: Probe the deployment
        env:
          FERROEHR_IMAGE: ferroehr:deploy-probe
        run: bash scripts/deploy-probe.sh
      # The RECORD, always — a failed run is exactly when the per-probe layer
      # attribution and the not-exercised ledger are worth reading.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deploy-probe-record
          path: docs/conformance/deployment/compose.json
          if-no-files-found: warn

  # ── Unused dependencies ──────────────────────────────────────────────────────
  unused-deps:
    name: cargo-machete
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-machete
      - run: cargo machete

  # ── The CDR binary the ui-e2e battery runs against (issue #335) ─────────────
  # It used to be compiled INSIDE the image: `docker/Dockerfile --target
  # runtime-from-source` runs `cargo build --release` in the layer after
  # `COPY . .`. No layer cache can serve that layer — every ui-e2e trigger path
  # lives in the build context, so the COPY is invalidated by construction, and
  # `cargo chef cook` caches THIRD-PARTY dependencies only. The ~190 kLoC
  # first-party release build therefore ran cold on EVERY run (measured locally
  # on an isolated buildx builder: 714 s cold; 6 s with nothing changed; 407 s
  # after touching ONE admin-console source file, with the cook layer reported
  # CACHED and the whole first-party graph recompiling behind it).
  #
  # So the binary is compiled here the way containers.yml compiles the
  # PUBLISHED one — natively, in the pinned rust:*-slim-trixie image, never
  # inside a Dockerfile — and ui-e2e then PACKAGES it with `runtime-prebuilt`,
  # the very final target containers.yml ships. Both final targets inherit ONE
  # shared runtime-base stage, so the battery drives the same distroless base,
  # the same non-root user, EXPOSE, HEALTHCHECK and ENTRYPOINT as before.
  #
  # Two caches, strongest first:
  #   1. the finished binary, keyed on the exact content of every input the
  #      server build reads. An admin-console-only PR touches none of them, so
  #      the key hits and no compile runs at all.
  #   2. sccache (per compilation unit) for the miss case — a lockfile bump or
  #      a server-side change then recompiles only what actually changed
  #      instead of collapsing back to a cold build.
  #
  # SOURCE_DATE_EPOCH is pinned and REVISION is deliberately NOT passed in this
  # lane: app/ferroehr/build.rs bakes both into the `ferroehr` crate through
  # `cargo:rustc-env`, and sccache tracks `env!` values in its cache key
  # ("Values from `env!` require Rust >= 1.46 to be tracked in caching" —
  # github.com/mozilla/sccache docs/Rust.md), so a per-run value makes the three
  # largest first-party crates uncacheable by construction. Without REVISION,
  # build.rs degrades to SHA=unknown BY DESIGN, and the battery asserts
  # behaviour, never provenance. The PUBLISHED images are untouched:
  # containers.yml still stamps github.sha into them.
  #
  # Two consumers now (#2159): the ui-e2e battery below, and the `chart-boot`
  # job, which boots the chart's values overlays against an image packaged from
  # this same binary. Hence the widened condition — the job id and name are
  # unchanged on purpose, because they are branch-protection check names.
  ui-e2e-binary:
    name: ui-e2e server binary
    needs: changes
    if: needs.changes.outputs.admin_ui == 'true' || needs.changes.outputs.chart_boot == 'true'
    runs-on: ubuntu-latest
    # Generous: a binary-cache miss with a cold sccache is a full release
    # build of the ~190 kLoC first-party graph (714 s measured cold, plus
    # dependency compiles on a lockfile bump).
    timeout-minutes: 60
    permissions:
      contents: read
    # Debian 13 (trixie) container so the binary targets glibc 2.41, matching
    # gcr.io/distroless/cc-debian13 exactly — the same pin and the same reason
    # as containers.yml's `binary` job. It must NOT be compiled on the bare
    # runner: glibc compatibility runs forward only, so a runner image with a
    # newer glibc than the runtime image ships yields a binary that image
    # cannot load.
    container: rust:1.97.1-slim-trixie@sha256:3b2879047d42784ca9403ad20c51ed3df361a50f1df96f5777d39b4e33aa65cd
    env:
      # Fixed build timestamp — reproducible, and the precondition for the
      # compile to be cacheable at all (see the block above; build.rs honours
      # SOURCE_DATE_EPOCH per reproducible-builds.org/docs/source-date-epoch).
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain pins (container == rust-toolchain.toml == Dockerfile)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          arg=$(grep -E '^ARG RUST_VERSION=' docker/Dockerfile | head -1 | cut -d= -f2)
          echo "rust-toolchain=$channel  container-rustc=$have  Dockerfile ARG=$arg"
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel). Bump the container: tag."
            exit 1
          fi
          if [ "$channel" != "$arg" ]; then
            echo "::error::docker/Dockerfile RUST_VERSION ($arg) != rust-toolchain.toml ($channel)."
            exit 1
          fi
      # Cache 1 — the binary itself. The key covers every path the server build
      # reads and nothing else; app/ferroehr-admin-ui/ is deliberately absent
      # because the console is not in ferroehr-server's dependency graph (that is
      # ferroehr + ferroehr-rest), which is exactly why an admin-console PR can
      # reuse the binary. Exact key, NO restore-keys: a near-match would package
      # a binary that does not correspond to this tree
      # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching).
      - id: binary-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/amd64/ferroehr
          key: ui-e2e-server-bin-1.97.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ferroehr/**', 'app/ferroehr-rest/**', 'app/ferroehr-server/**', 'tools/**') }}
      # Registry cache only, for the reason the ui-e2e job spells out below:
      # rust-cache's key hashes every manifest, so a lockfile bump rotates a
      # whole target archive and pays a cold build, while sccache degrades to
      # partial hits (github.com/Swatinem/rust-cache — with `cache-targets:
      # false`, "only the cargo registry will be cached").
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.binary-cache.outputs.cache-hit != 'true'
        with:
          shared-key: ui-e2e-server-binary
          cache-targets: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.binary-cache.outputs.cache-hit != 'true'
      - name: Build the server binary (release, native)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          # "Incrementally compiled crates cannot be cached"
          # (github.com/mozilla/sccache#known-caveats).
          CARGO_INCREMENTAL: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p ferroehr-server
          strip target/release/ferroehr
          mkdir -p bin/amd64
          install -m0755 target/release/ferroehr bin/amd64/ferroehr
      # Cache-hit visibility in the job log, the same as the battery job below.
      - name: sccache statistics
        if: always() && steps.binary-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: ${SCCACHE_PATH} --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-server-binary
          path: bin/amd64/ferroehr
          if-no-files-found: error
          retention-days: 1

  # ── Console + e2e test binaries, prebuilt in parallel (issue #335) ─────────
  # The second half of the compile-nothing-in-the-battery split: the host
  # cargo-leptos build and the nextest test-binary compile were 8m32s of the
  # measured battery step, all of it parallelizable with ui-e2e-binary. This
  # job builds both and ships them as one artifact; the battery job then only
  # composes, seeds, and drives the browser.
  #
  # Runs on the BARE runner (not a container) deliberately: the console binary
  # executes on the battery job's host, and the e2e binaries bake
  # env!("CARGO_MANIFEST_DIR") paths at compile time — both jobs being
  # ubuntu-latest gives them the same glibc AND the same workspace path
  # (/home/runner/work/<repo>/<repo>), so the baked paths resolve. Keep this
  # job and ui-e2e on the same runner image always.
  ui-e2e-console:
    name: ui-e2e console + test binaries
    needs: changes
    if: needs.changes.outputs.admin_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cache 1 — the built outputs themselves, exact key, no restore-keys
      # (the ui-e2e-binary pattern above): the key covers everything the
      # console + its e2e binaries read. app/ferroehr, app/ferroehr-rest,
      # app/ferroehr-server are deliberately absent — the console consumes the
      # CDR strictly over ITS-REST and never links those crates, so a
      # server-only PR reuses the console artifact.
      - id: console-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui-e2e-console-stage
          key: ui-e2e-console-1.97.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ferroehr-admin-ui/**') }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        if: steps.console-cache.outputs.cache-hit != 'true'
        with:
          target: wasm32-unknown-unknown
          # Registry-only cache; sccache owns compilation caching (the same
          # split, for the same lockfile-rotation reason, as the jobs above).
          cache-targets: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.console-cache.outputs.cache-hit != 'true'
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        if: steps.console-cache.outputs.cache-hit != 'true'
        with:
          # wasm-bindgen pinned to the workspace's wasm-bindgen version;
          # cargo-leptos resolves its external tools from PATH before its
          # own downloader (which failed opaque on a runner), so both it
          # and Tailwind are preinstalled deterministically.
          tool: cargo-nextest,cargo-leptos@0.3.7,wasm-bindgen@0.2.126
      - name: Install the Tailwind v4 standalone binary
        if: steps.console-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss --help | head -1
      - name: Build the console + archive the e2e test binaries
        if: steps.console-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
          # "Incrementally compiled crates cannot be cached"
          # (github.com/mozilla/sccache#known-caveats).
          CARGO_INCREMENTAL: "0"
          LEPTOS_TAILWIND_VERSION: v4.3.3
        run: |
          set -euo pipefail
          # ORDER IS LOAD-BEARING: the nextest archive step compiles the
          # crate (tests + bin) under plain cargo, WITHOUT the LEPTOS_*
          # compile-time env cargo-leptos sets — and leptos picks the served
          # wasm FILENAME at compile time (leptos 0.8 hydration/mod.rs:
          # `option_env!("LEPTOS_OUTPUT_NAME")` absent ⇒ it appends `_bg` to
          # the preload path). An archive-after-leptos order clobbers the
          # console binary with a `_bg.wasm`-referencing build while the site
          # tree holds `<name>.wasm`, and every page 404s its wasm. Archive
          # FIRST, cargo-leptos LAST, stage immediately.
          cargo nextest archive -p ferroehr-admin-ui --features ssr \
            --archive-file ui-e2e-tests.tar.zst
          (cd app/ferroehr-admin-ui && cargo leptos build)
          # One staging tree = one artifact = one cache path. The console
          # binary's executable bit is restored by the battery job (GitHub
          # artifacts do not preserve file permissions).
          mkdir -p ui-e2e-console-stage/site
          cp target/debug/ferroehr-admin-ui ui-e2e-console-stage/
          cp ui-e2e-tests.tar.zst ui-e2e-console-stage/
          cp -R target/site/. ui-e2e-console-stage/site/
      - name: sccache statistics
        if: always() && steps.console-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: ${SCCACHE_PATH} --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
          if-no-files-found: error
          retention-days: 1

  # ── Admin-console E2E (merge gate for console-touching changes) ─────────────
  # Runs the full composed journey battery (scripts/ui-e2e.sh): postgres +
  # ferroehr + Keycloak via compose, the console + e2e binaries prebuilt by the
  # jobs above, chromedriver journeys with the browser-console gate. Screenshots
  # upload on success AND failure (human review — no pixel-diff assertions).
  ui-e2e:
    name: ui-e2e
    needs: [changes, ui-e2e-binary, ui-e2e-console]
    if: needs.changes.outputs.admin_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `contents: read` (now also the workflow-level default) is all it needs:
    # nothing here writes to a registry any more (the GHCR buildx layer cache
    # was removed, and the image is now packaged locally from a job artifact).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOTHING compiles in this job any more (issue #335): the server binary,
      # the console, and the e2e test binaries all arrive as artifacts from
      # the two parallel jobs above. The toolchain stays only because
      # `cargo nextest run --archive-file` is a cargo subcommand; rust-cache
      # keeps just the registry (nextest resolves no dependencies here, but
      # setup-rust-toolchain's default cache would archive an empty target).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        # This workflow publishes nothing releasable — the artifacts here are
        # screenshots and short-lived test inputs, so the restored registry
        # cache is not release input.
        with: # zizmor: ignore[cache-poisoning]
          cache-targets: false
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest
      # The CDR image is PACKAGED here, never compiled here (issue #335 — the
      # rationale is on the ui-e2e-binary job above). `runtime-prebuilt` is
      # COPY-only, so this is a seconds-long step with no layer-cache backend
      # involved at all — which is why GHCR stays product-images-only
      # (ferroehr, ferroehr-postgres, ferroehr-admin-ui) and no
      # `build-cache` package is published beside them (owner call 2026-07-26).
      # `load: true` puts the result in the docker store so the compose
      # `--no-build` below finds it.
      #
      # The artifact download loses the executable bit (GitHub artifacts do not
      # preserve file permissions), which is exactly why the Dockerfile COPYs
      # the binary with `--chmod=0755`
      # (docs.docker.com/reference/dockerfile — COPY --chmod).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      # The prebuilt console + e2e binaries from the ui-e2e-console job. The
      # artifact download strips the executable bit (GitHub artifacts do not
      # preserve file permissions) — restored here for the console binary; the
      # binaries inside the nextest archive keep theirs (tar preserves modes).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
      - name: Place the prebuilt console where the harness expects it
        run: |
          set -euo pipefail
          mkdir -p target/debug target/site
          install -m0755 ui-e2e-console-stage/ferroehr-admin-ui target/debug/ferroehr-admin-ui
          cp -R ui-e2e-console-stage/site/. target/site/
          test -f ui-e2e-console-stage/ui-e2e-tests.tar.zst
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:ui-e2e
      - name: Build the postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ferroehr-postgres:ui-e2e docker/postgres
      - name: Run the E2E journey battery
        # UI_E2E_NO_BUILD makes ui-e2e.sh `up --no-build` the pre-built
        # images; the two PREBUILT vars make it run the console + e2e
        # binaries the ui-e2e-console job compiled — zero rustc here.
        env:
          UI_E2E_NO_BUILD: "1"
          UI_E2E_PREBUILT_CONSOLE: "1"
          UI_E2E_NEXTEST_ARCHIVE: ${{ github.workspace }}/ui-e2e-console-stage/ui-e2e-tests.tar.zst
          FERROEHR_IMAGE: ferroehr:ui-e2e
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:ui-e2e
        run: bash scripts/ui-e2e.sh
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-screenshots
          path: target/ui-e2e/screenshots/
          if-no-files-found: ignore

  # ── The compose/local image target (docker/Dockerfile runtime-from-source) ──
  # ui-e2e packages the shipped `runtime-prebuilt` target now (issue #335), so
  # the in-image cargo-chef build that docker-compose.override.yml (the repo-dev
  # `up --build` posture) and docker/sut-ferroehr.yml (the conformance SUT
  # stack) rely on would otherwise have no CI exercise at all.
  # It is built here instead — but ONLY when its own recipe changes, which is
  # the one moment the full cold compile buys something. Nothing is exported:
  # the build succeeding IS the assertion.
  server-image-from-source:
    name: server image (from source)
    needs: changes
    if: needs.changes.outputs.server_dockerfile == 'true'
    runs-on: ubuntu-latest
    # A deliberate full cold in-image compile (no cache backend at all).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-from-source
          push: false

  # Screenshot-freshness guard (the changelog-guard pattern): a PR that
  # changes the console UI must re-capture the published book screenshots in
  # the same PR (freshness, not pixels — owner decision). Escape hatch: the
  # `no-ui-visual-change` label for BFF-only/comment/test changes.
  ui-screenshot-guard:
    name: ui-screenshot-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require refreshed screenshots for UI changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-ui-visual-change') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-ui-visual-change label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^app/ferroehr-admin-ui/(src|style)/'; then
            echo "No console UI paths touched — guard not required."; exit 0
          fi
          if echo "$changed" | grep -qE '^website/book/src/admin-ui/img/'; then
            echo "Screenshots refreshed — OK."; exit 0
          fi
          echo "::error::This PR changes the admin-console UI but does not refresh website/book/src/admin-ui/img/ (run scripts/ui-e2e.sh with UI_E2E_DOCS_SHOTS=1 and commit the captures), and does not carry the 'no-ui-visual-change' label." >&2
          exit 1

  # Crate-version guard (the changelog-guard pattern): a PR that changes
  # PACKAGED content of the published crates/* members must bump the lockstep
  # 0.0.x crate version in the same PR — published versions are immutable
  # (.claude/rules/crates-publishing.md; local twin:
  # .claude/hooks/crate_version_bump_guard.sh). Escape hatch: the
  # `no-crate-bump` label for diffs that provably do not alter packaged bytes.
  crate-version:
    name: crate-version-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a lockstep version bump for packaged-content changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-crate-bump') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-crate-bump label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^crates/openehr-[a-z]+/(src/|assets/|schemas/json/|README\.md|LICENSE-|Cargo\.toml)'; then
            echo "No packaged crate content touched — guard not required."; exit 0
          fi
          old=$(git show "$BASE:crates/openehr-base/Cargo.toml" | grep -m1 '^version = ')
          new=$(git show "$HEAD:crates/openehr-base/Cargo.toml" | grep -m1 '^version = ')
          if [ "$old" = "$new" ]; then
            echo "::error::This PR changes packaged content of the published crates/* members but does not bump the lockstep 0.0.x crate version (bump all eight 'version' fields + the internal version requirements — .claude/rules/crates-publishing.md), and does not carry the 'no-crate-bump' label." >&2
            exit 1
          fi
          # Lockstep: all eight crates carry ONE version, and every internal
          # dependency requirement names exactly that version.
          ver=$(echo "$new" | sed -E 's/version = "([^"]+)".*/\1/')
          for c in base rm am adl term lang query its; do
            v=$(git show "$HEAD:crates/openehr-$c/Cargo.toml" | grep -m1 '^version = ' | sed -E 's/version = "([^"]+)".*/\1/')
            if [ "$v" != "$ver" ]; then
              echo "::error::crates/openehr-$c is at $v but the lockstep version is $ver — bump all eight together." >&2
              exit 1
            fi
          done
          reqs=$(git grep -hoE 'path = "\.\./openehr-[a-z]+", version = "[0-9.]+"' "$HEAD" -- 'crates/*/Cargo.toml' | grep -oE 'version = "[0-9.]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ "$reqs" != "$ver" ]; then
            echo "::error::internal openehr-* version requirements ($reqs) do not all match the lockstep version $ver — update every 'version =' on the path dependencies too." >&2
            exit 1
          fi
          echo "Lockstep crate version bumped to $ver — OK."

  # Chart-version guard (the crate-version-guard pattern, issue #2108): a PR that
  # changes PACKAGED chart content must bump `Chart.yaml` version in the same PR.
  #
  # The immutability this protects is NOT the registry's own: an OCI tag is
  # mutable, and a second `helm push` of the same chart version silently replaces
  # the manifest (measured against a local registry — the digest changed with no
  # warning). So the publish lane refuses to overwrite a published version, and
  # this guard makes sure a change carries a version to publish under. Artifact
  # Hub indexes versions, so a re-used one is a listing that misdescribes itself.
  #
  # PACKAGED content is `deploy/helm/ferroehr/**` only. The value overlays, the
  # golden renders, the validator, the helm pin and the Artifact Hub metadata live
  # one level up and ship in nothing — a change to those needs no bump.
  # Escape hatch: the `no-chart-bump` label, for a packaged diff that provably
  # cannot alter what a consumer gets. A comment in `values.yaml` does not
  # qualify: values.yaml ships.
  chart-version:
    name: chart-version-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a Chart.yaml version bump for packaged chart changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-chart-bump') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-chart-bump label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^deploy/helm/ferroehr/'; then
            echo "No packaged chart content touched — guard not required."; exit 0
          fi
          old=$(git show "$BASE:deploy/helm/ferroehr/Chart.yaml" | sed -nE 's/^version: *(.+)$/\1/p')
          new=$(git show "$HEAD:deploy/helm/ferroehr/Chart.yaml" | sed -nE 's/^version: *(.+)$/\1/p')
          if [ "$old" = "$new" ]; then
            echo "::error::This PR changes packaged chart content (deploy/helm/ferroehr/) but leaves Chart.yaml version at $new. A published chart version is taken — bump it (SemVer over the chart's values schema and rendered output), or apply 'no-chart-bump' if the diff provably cannot change what a consumer gets." >&2
            exit 1
          fi
          echo "Chart version bumped $old -> $new — OK."

  # appVersion guard (issue #2108): `appVersion` is the image tag a user gets from
  # a plain `helm install`, so it must never lag the released application version.
  # It is kept equal to the workspace version — the same shape as
  # compose-image-tags.sh, and the same reason: both are "an artifact references
  # the released version" checks that would otherwise depend on someone
  # remembering a release-procedure step.
  #
  # The `artifacthub.io/images` tags are checked with it, because those are what
  # the Artifact Hub security report scans — a stale tag there means the listing
  # reports vulnerabilities for an image nobody is running.
  #
  # What this guard does NOT catch, stated because it was measured rather than
  # imagined: `appVersion` naming the right release does not mean that release's
  # image ACCEPTS the chart's current `config` defaults. Values track development
  # between releases, so the rendered default configuration carries
  # `server.limits` and `db.statement_timeout_ms`, which 3.17.3 does not know — its
  # own `config check` refuses the file, and a plain `helm install` crash-loops.
  # Only the published image can answer that, so the check lives in
  # publish-chart.yml, which refuses to publish a chart that cannot deploy its own
  # default image.
  chart-appversion:
    name: chart-appversion-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: appVersion and the artifacthub.io image tags match the workspace version
        run: |
          set -euo pipefail
          ws=$(sed -nE 's/^version = "(.*)"$/\1/p' Cargo.toml | head -1)
          app=$(sed -nE 's/^appVersion: *"?([^"]+)"?$/\1/p' deploy/helm/ferroehr/Chart.yaml)
          if [ -z "$ws" ] || [ -z "$app" ]; then
            echo "::error::could not extract versions (workspace: '$ws', appVersion: '$app')." >&2
            exit 1
          fi
          if [ "$app" != "$ws" ]; then
            echo "::error::Chart.yaml appVersion ($app) != workspace version ($ws) — the release cut bumps appVersion with the workspace version (.claude/rules/changelog.md), or a plain 'helm install' deploys the previous release." >&2
            exit 1
          fi
          bad=$(grep -oE 'image: ghcr\.io/[^:]+:[^ ]+' deploy/helm/ferroehr/Chart.yaml | grep -v ":${ws}\$" || true)
          if [ -n "$bad" ]; then
            echo "::error::artifacthub.io/images tags do not match the workspace version ($ws):" >&2
            echo "$bad" >&2
            exit 1
          fi
          echo "appVersion and every artifacthub.io/images tag are at $ws — OK."

  # Changelog guard (Keep a Changelog discipline): a PR that changes
  # user-visible surfaces must update CHANGELOG.md's [Unreleased] section in
  # the same PR. Escape hatch: the `no-changelog` label for genuinely
  # invisible changes (internal refactors, CI, docs).
  changelog:
    name: changelog-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Structure check runs UNCONDITIONALLY — the no-changelog label waives
      # the entry requirement below, never the file's Keep-a-Changelog
      # validity (duplicate '### Added'/'### Fixed' headers in one release
      # section shipped into release notes twice before this guard).
      - name: Changelog structure (no duplicate subsections, canonical types)
        run: bash scripts/checks/changelog-structure.sh
      - name: Require a CHANGELOG entry for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-changelog label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^(app/|crates/|deploy/|docker/|docker-compose|Cargo\.toml|Cargo\.lock)'; then
            echo "No user-visible surface touched — guard not required."; exit 0
          fi
          # grep -c, never grep -q: -q exits at the first match, git diff then
          # dies of SIGPIPE, and `pipefail` turns that into a failed pipeline —
          # so a LARGE changelog diff was reported as "no entry" (this PR).
          # -c reads the whole diff, so the pipeline always exits cleanly.
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            added=$(git diff "$BASE" "$HEAD" -- CHANGELOG.md | grep -c '^+.*[^[:space:]]' || true)
            if [ "${added:-0}" -gt 0 ]; then
              echo "CHANGELOG.md updated ($added added lines) — OK."; exit 0
            fi
          fi
          echo "::error::This PR changes user-visible surfaces (app/, crates/, deploy/, docker/, manifests) but does not add a CHANGELOG.md [Unreleased] entry (Keep a Changelog 1.1.0). Add one, or apply the 'no-changelog' label if truly invisible." >&2
          exit 1

  # Citation guard: CITATION.cff must stay CFF-1.2.0-schema-valid and
  # version-consistent with the workspace — a malformed file silently breaks
  # GitHub's "Cite this repository" button, and a stale version misquotes the
  # release in research citations. The release cut bumps version +
  # date-released (.claude/rules/changelog.md §Cutting a release).
  citation:
    name: citation-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate CITATION.cff (CFF 1.2.0 schema)
        run: pipx run cffconvert --validate
      - name: CITATION.cff version matches the workspace version
        run: |
          set -euo pipefail
          cff_ver=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' CITATION.cff)
          ws_ver=$(sed -nE 's/^version = "(.*)"$/\1/p' Cargo.toml | head -1)
          if [ -z "$cff_ver" ] || [ -z "$ws_ver" ]; then
            echo "::error::could not extract versions (CITATION.cff: '$cff_ver', Cargo.toml: '$ws_ver')." >&2
            exit 1
          fi
          if [ "$cff_ver" != "$ws_ver" ]; then
            echo "::error::CITATION.cff version ($cff_ver) != workspace version ($ws_ver) — the release cut bumps CITATION.cff version/date-released (.claude/rules/changelog.md)." >&2
            exit 1
          fi
          echo "CITATION.cff version $cff_ver matches the workspace version."
      # `.zenodo.json` is GENERATED from CITATION.cff, because Zenodo ignores
      # CITATION.cff entirely whenever a .zenodo.json is present
      # (https://help.zenodo.org/docs/github/describe-software/zenodo-json/).
      # A hand-edited copy would therefore silently override the file this job
      # guards, and the disagreement would be archived under a DOI that cannot
      # be edited afterwards.
      - name: .zenodo.json is in sync with CITATION.cff
        run: bash scripts/render/zenodo-json.sh --check

  # Compose version guard: the standalone quickstart docker-compose.yml pins
  # the published images by tag, so a release cut that forgets those defaults
  # ships a quickstart running the PREVIOUS release. The release cut bumps them
  # with the workspace version (.claude/rules/changelog.md §Cutting a release).
  compose-version-guard:
    name: compose-version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker-compose.yml image tags match the workspace version
        run: bash scripts/checks/compose-image-tags.sh

  # ── The one-check aggregate gate (the rust-analyzer/ruff pattern) ───────────
  # A single job that needs everything and passes iff nothing failed — skipped
  # jobs count as satisfied, exactly like branch protection treats them. Point
  # branch protection / a future merge queue at THIS check alone, so adding,
  # renaming, or path-gating jobs never requires touching repository settings.
  conclusion:
    name: conclusion
    if: always()
    needs:
      - changes
      - fmt
      - no-attribution
      - workflow-audit
      - workflow-lint
      - comment-style
      - default-style
      - docs-claims
      - sql-string-building
      - error-hygiene
      - error-source-chain
      - no-python
      - license-text
      - copyright-holder
      - licensing
      - spec-citations
      - compose-hardening
      - deny
      - vex
      - clippy
      - doc
      - msrv
      - codegen-drift
      - test
      - coverage
      - helm-golden
      - unused-deps
      - ui-e2e-binary
      - ui-e2e-console
      - ui-e2e
      - deploy-probe
      - server-image-from-source
      - ui-screenshot-guard
      - changelog
      - citation
      - compose-version-guard
      - crate-version
      - chart-version
      - chart-appversion
      - chart-boot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[] | .result; . == "success" or . == "skipped")' >/dev/null
