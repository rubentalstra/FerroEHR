# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ADR-006 retired the "phases need not compile" gate: every job here is
  # REQUIRED. (The historical PORT_STRICT advisory switch is gone.)

jobs:
  # ── Change detection: cargo jobs run ONLY when build-relevant paths change ──
  # Allowlist (owner ruling 2026-07-17: no Rust-affecting change → no cargo
  # jobs, workflow-only and docs-only PRs included): app/, crates/, tools/,
  # scripts/, .cargo/, .config/, Cargo.toml, Cargo.lock, rust-toolchain.toml,
  # rustfmt.toml, clippy.toml, deny.toml. Everything else (docs/, website/,
  # .claude/, .github/, markdown, compose files, assets) skips the nine cargo
  # jobs. GitHub treats a skipped required check as satisfied, so branch
  # protection is unaffected; a workflow-gating bug surfaces on the next
  # code-touching PR, which is acceptable.
  changes:
    name: change detection
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      admin_ui: ${{ steps.filter.outputs.admin_ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_SHA"
          fi
          # First push / unknown base: run everything.
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Base $base unavailable — treating as code change."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; echo "$changed"
          if [ -z "$changed" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$changed" | grep -qE '^(app/|crates/|tools/|scripts/|\.cargo/|\.config/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|rustfmt\.toml$|clippy\.toml$|deny\.toml$)' ; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build-relevant paths touched — cargo jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Admin-console E2E trigger: the console crate, its harness, or the
          # composed stack it drives.
          if echo "$changed" | grep -qE '^(app/ehrbase-admin-ui/|scripts/ui-e2e\.sh$|docker-compose\.yml$|docker/admin-ui/|docker/keycloak/)' ; then
            echo "admin_ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin_ui=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Required for code changes: formatting ───────────────────────────────────
  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Always required: no AI/Claude attribution in commit messages ────────────
  no-attribution:
    name: no attribution in commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan commit messages for attribution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          # Handle first-push / shallow edge cases.
          git rev-parse "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" >/dev/null 2>&1 || range="HEAD"
          echo "Scanning range: $range"
          if git log --format='%B' "$range" 2>/dev/null | grep -iEn \
             'co-authored-by:.*(claude|anthropic|\[bot\])|generated[[:space:]]+(with|by)[[:space:]]+.*claude|claude[[:space:]]+code|🤖|assisted-by:.*claude'; then
            echo "::error::Commit message contains AI/Claude attribution. Remove it (see project hard rules)."
            exit 1
          fi
          echo "OK: no attribution found."

  # ── Always required: supply-chain policy ────────────────────────────────────
  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  audit:
    name: cargo-audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Cargo.lock IS committed (workspace ships a binary); audit the real pins.
      - run: cargo audit

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Generated code must stay in sync with the vendored specs (ADR-004/005) ──
  codegen-drift:
    name: codegen drift
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Regenerate and diff
        run: bash scripts/check-codegen-drift.sh

  # ── CNF conformance: the enforced-coverage guard (fast, no DB) ───────────────
  # The W-10 instrument's own test suite: the ECC catalogue guard (every
  # registered case has an allocated, never-reused ECC number), the
  # derivation-square guard (every case carries a spec citation, a schedule
  # trace or stated ECC-original reason, and an ITS-REST binding), the fixture
  # manifest + adjudication-register validation, and the wire/edition/model
  # unit tests. The e2e ECC run goes through the Docker compose stack
  # (scripts/conformance.sh, multi-SUT: ehrbase-rs default / ehrbase-java /
  # bring-your-own-endpoint) at phase gates; this job is the fast always-on
  # signal.
  conformance:
    name: cnf coverage guard
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p conformance

  # ── Build + tests against PostgreSQL 18.4 ────────────────────────────────────
  test:
    name: build & test (pg18)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # The shared test-database harness (tools/testkit) uses this server
      # directly — no per-test containers in CI at all.
      EHRBASE_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Enable required extensions + non-durable test tuning
        # libxml2-utils provides xmllint — the C14N XML parity gate shells out
        # to it (serialization.md); the runner image does not ship it.
        # The ALTER SYSTEM block applies the non-durable settings the
        # PostgreSQL docs recommend for throwaway data (all three are
        # reloadable — no restart); this server only ever holds test databases.
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d openehr_test \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --all-features
      # --no-tests=pass: empty crates are expected until P17 (nextest exits 4 otherwise)
      - run: cargo nextest run --workspace --all-features --no-tests=pass --profile ci
      - run: cargo test --workspace --doc

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # Same shared-server harness as the test job (tools/testkit).
      EHRBASE_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install xmllint (C14N parity gate) + non-durable test tuning
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --no-tests=pass --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # ── Unused dependencies ──────────────────────────────────────────────────────
  unused-deps:
    name: cargo-machete
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  # ── Admin-console E2E (merge gate for console-touching changes) ─────────────
  # Runs the full composed journey battery (scripts/ui-e2e.sh): postgres +
  # ehrbase + Keycloak via compose, the console built by cargo-leptos on the
  # host, chromedriver journeys with the browser-console gate. Screenshots
  # upload on success AND failure (human review — no pixel-diff assertions).
  ui-e2e:
    name: ui-e2e
    needs: changes
    if: needs.changes.outputs.admin_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          # wasm-bindgen pinned to the workspace's wasm-bindgen version;
          # cargo-leptos resolves its external tools from PATH before its
          # own downloader (which failed opaque on a runner), so both it
          # and Tailwind are preinstalled deterministically.
          tool: cargo-nextest,cargo-leptos@0.3.7,wasm-bindgen@0.2.126
      - name: Install the Tailwind v4 standalone binary
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss --help | head -1
      - name: Run the E2E journey battery
        run: bash scripts/ui-e2e.sh
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-screenshots
          path: target/ui-e2e/screenshots/
          if-no-files-found: ignore

  # Screenshot-freshness guard (the changelog-guard pattern): a PR that
  # changes the console UI must re-capture the published book screenshots in
  # the same PR (freshness, not pixels — owner decision). Escape hatch: the
  # `no-ui-visual-change` label for BFF-only/comment/test changes.
  ui-screenshot-guard:
    name: ui-screenshot-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require refreshed screenshots for UI changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-ui-visual-change') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-ui-visual-change label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^app/ehrbase-admin-ui/(src|style)/'; then
            echo "No console UI paths touched — guard not required."; exit 0
          fi
          if echo "$changed" | grep -qE '^website/book/src/admin-ui/img/'; then
            echo "Screenshots refreshed — OK."; exit 0
          fi
          echo "::error::This PR changes the admin-console UI but does not refresh website/book/src/admin-ui/img/ (run scripts/ui-e2e.sh with UI_E2E_DOCS_SHOTS=1 and commit the captures), and does not carry the 'no-ui-visual-change' label." >&2
          exit 1

  # Changelog guard (Keep a Changelog discipline): a PR that changes
  # user-visible surfaces must update CHANGELOG.md's [Unreleased] section in
  # the same PR. Escape hatch: the `no-changelog` label for genuinely
  # invisible changes (internal refactors, CI, docs).
  changelog:
    name: changelog-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-changelog label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^(app/|crates/|deploy/|docker/|docker-compose|Cargo\.toml|Cargo\.lock)'; then
            echo "No user-visible surface touched — guard not required."; exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            if git diff "$BASE" "$HEAD" -- CHANGELOG.md | grep -q '^+.*[^[:space:]]'; then
              echo "CHANGELOG.md updated — OK."; exit 0
            fi
          fi
          echo "::error::This PR changes user-visible surfaces (app/, crates/, deploy/, docker/, manifests) but does not add a CHANGELOG.md [Unreleased] entry (Keep a Changelog 1.1.0). Add one, or apply the 'no-changelog' label if truly invisible." >&2
          exit 1
