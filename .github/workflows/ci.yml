# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Flip repository variable PORT_STRICT to "true" at Phase P17 (make-it-compile)
  # to make the compile/clippy/test jobs REQUIRED. Until then they are advisory.

jobs:
  # ── Always required: formatting ──────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Always required: no AI/Claude attribution in commit messages ────────────
  no-attribution:
    name: no attribution in commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan commit messages for attribution
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          # Handle first-push / shallow edge cases.
          git rev-parse "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}" >/dev/null 2>&1 || range="HEAD"
          echo "Scanning range: $range"
          if git log --format='%B' "$range" 2>/dev/null | grep -iEn \
             'co-authored-by:.*(claude|anthropic|\[bot\])|generated[[:space:]]+(with|by)[[:space:]]+.*claude|claude[[:space:]]+code|🤖|assisted-by:.*claude'; then
            echo "::error::Commit message contains AI/Claude attribution. Remove it (see project hard rules)."
            exit 1
          fi
          echo "OK: no attribution found."

  # ── Always required: supply-chain policy ────────────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Cargo.lock is not committed (see .gitignore); audit needs one to scan.
      - run: cargo generate-lockfile
      - run: cargo audit

  # ── Advisory until P17: clippy ──────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.PORT_STRICT != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Generated code must stay in sync with the vendored specs (ADR-004/005) ──
  codegen-drift:
    name: codegen drift
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.PORT_STRICT != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Regenerate and diff
        run: bash scripts/check-codegen-drift.sh

  # ── Advisory until P17: build + tests against PostgreSQL 18.4 ────────────────
  test:
    name: build & test (pg18)
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.PORT_STRICT != 'true' }}
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Enable required extensions
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=openehr psql -h localhost -U openehr -d openehr_test \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"; CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --all-features
      # --no-tests=pass: empty crates are expected until P17 (nextest exits 4 otherwise)
      - run: cargo nextest run --workspace --all-features --no-tests=pass
      - run: cargo test --workspace --doc

  # ── Advisory until P17: coverage ────────────────────────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.PORT_STRICT != 'true' }}
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --no-tests=pass --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # ── Advisory: unused dependencies ───────────────────────────────────────────
  unused-deps:
    name: cargo-machete
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
