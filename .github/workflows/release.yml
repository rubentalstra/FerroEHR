# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Automated versioning + CHANGELOG from conventional commits.
  # Opens/updates a "release PR"; merging it tags a release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: rust
          # For per-crate publishing later, switch to a manifest config:
          #   config-file: release-please-config.json
          #   manifest-file: .release-please-manifest.json

  # Build the server binary and attach it when a GitHub Release is published.
  build-binaries:
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Install cross linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build server
        run: cargo build --release --target ${{ matrix.target }} -p openehr-server
      - name: Package
        shell: bash
        run: |
          bin="openehr-server"
          out="${bin}-${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$out" "$bin"
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}

  # OPTIONAL: container image to GHCR (needs a Dockerfile at repo root).
  # Uncomment when a Dockerfile exists.
