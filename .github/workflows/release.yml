# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Automated versioning + CHANGELOG from conventional commits.
  # Opens/updates a "release PR"; merging it tags a release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: rust
          # For per-crate publishing later, switch to a manifest config:
          #   config-file: release-please-config.json
          #   manifest-file: .release-please-manifest.json

  # Build the server binary and attach it when a GitHub Release is published.
  # Native runner per arch (no cross toolchain, no QEMU) — same strategy as
  # .github/workflows/containers.yml, which handles the GHCR images on tags.
  build-binaries:
    if: github.event_name == 'release'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build server
        run: cargo build --release --locked -p ehrbase
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          out="ehrbase-${TAG}-${{ matrix.target }}.tar.gz"
          strip target/release/ehrbase
          tar -C target/release -czf "$out" ehrbase
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
