# .github/workflows/release.yml
#
# Releases are changelog-driven (Keep a Changelog 1.1.0, CHANGELOG.md):
#   1. A `vX.Y.Z` tag push publishes a GitHub Release whose notes are the
#      matching `## [X.Y.Z]` section — the job FAILS if CHANGELOG.md has no
#      such section, so a release can never ship without its changelog.
#   2. The binary matrix runs in the SAME workflow run (needs:
#      publish-release) and attaches per-arch server tarballs. It must NOT
#      hang off a `release: published` trigger: releases published with
#      GITHUB_TOKEN deliberately do not fire workflow events (GitHub's
#      anti-recursion rule), which is exactly the bug that left v3.0.0
#      asset-less on first cut.
#   3. `workflow_dispatch` with a tag input re-runs the pipeline for an
#      existing tag (e.g. to backfill assets).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish and build assets for"
        required: true
        type: string

# A release must never be cancelled part-way through publishing: a half-created
# release with some assets attached is worse than a queued second run. So a second
# tag push QUEUES behind the first rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create or update the GitHub release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - id: tag
        name: Resolve the release tag
        # The dispatch input reaches the shell via env, never `${{ }}`-inline
        # (workflow-injection hygiene), and must match a full semver tag shape
        # before it is used as a checkout ref below — `case v*` accepted any
        # string starting with "v".
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}
      # Pin the rest of the pipeline to the commit this job actually read. The
      # tag is the only handle a dispatch gives us, but it stays movable, so
      # build-binaries checks out this SHA rather than resolving the tag again.
      - id: rev
        name: Resolve the tag to its commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Extract the changelog section for this tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version — releases are changelog-driven (Keep a Changelog). Add '## [$version] - YYYY-MM-DD' first." >&2
            exit 1
          fi
          # Everything between "## [<version>]" and the next "## [" heading.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The [$version] changelog section is empty." >&2
            exit 1
          fi
          echo "Release notes for $version:"; cat release-notes.md
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Verify the tag matches the workspace version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$manifest" != "$version" ]; then
            echo "::error::Tag $TAG does not match workspace version $manifest in Cargo.toml." >&2
            exit 1
          fi
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Publish (or update) the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          # The quickstart compose files ride along as release assets: the base
          # file pulls the images this tag published, and the two standalone
          # overlays are downloaded beside it, so a downloader never has to
          # clone the repo to run the release.
          files: |
            docker-compose.yml
            docker-compose.keycloak.yml
            docker-compose.observability.yml
          # Releases publish as OFFICIAL releases (owner sign-off
          # 2026-07-31, superseding the 2026-07-11 always-prerelease rule);
          # only an explicitly suffixed tag (v3.16.0-rc1, ...) is a
          # pre-release.
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}

  # Native runner per arch (no cross toolchain, no QEMU) — same strategy as
  # .github/workflows/containers.yml, which handles the GHCR images on tags.
  build-binaries:
    needs: publish-release
    runs-on: ${{ matrix.runner }}
    # A deliberately cold release build (no cache) of the full workspace.
    timeout-minutes: 60
    permissions:
      contents: write # attach the per-arch tarballs to it
      id-token: write # Sigstore, for the provenance + SBOM attestations
      attestations: write # store them against this repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.publish-release.outputs.sha }}
      # Cold by construction, not by hope: setup-rust-toolchain restores a
      # Swatinem/rust-cache entry unless told otherwise, so the published
      # tarballs were being linked from cached bytes this job did not build.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - name: Build server
        # `ferroehr-server` is the binary-producing crate (bin name stays
        # `ferroehr`) since the crate consolidation; `-p ferroehr` is the
        # platform library and yields no binary.
        run: cargo build --release --locked -p ferroehr-server
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.publish-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          out="ferroehr-${TAG}-${TARGET}.tar.gz"
          strip target/release/ferroehr
          tar -C target/release -czf "$out" ferroehr
          echo "ASSET=$out" >> "$GITHUB_ENV"
      # A CycloneDX SBOM of the Rust dependency graph — a different document from
      # the container SBOMs BuildKit emits, answering a different question. The
      # image SBOM sees the OS layer; this one enumerates the cargo graph with
      # `pkg:cargo/...` purls and, crucially, the DIRECT vs TRANSITIVE edges that
      # make an SBOM actionable rather than a flat package list (the OWASP
      # Dependency Graph & SBOM Cheat Sheet's element 8).
      #
      # Generated from the release commit's own `Cargo.lock` with `--locked`, so
      # it describes the graph that was actually built, not one resolved later.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate the dependency SBOM
        env:
          TAG: ${{ needs.publish-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Scoped to the binary-producing crate, so the document describes the
          # artifact being released rather than the whole workspace. Verified
          # content on the release commit's graph: 684 components, every one with
          # a `pkg:cargo/...` purl and licence, 673 with checksums, and 685
          # dependency edges — the direct-versus-transitive structure that makes
          # an SBOM answerable rather than a flat list.
          cargo cyclonedx \
            --manifest-path app/ferroehr-server/Cargo.toml \
            --format json --describe binaries --spec-version 1.5
          # Named for the asset it describes, so a consumer can tell which
          # artifact it belongs to. The generated name follows the BINARY
          # (`ferroehr`), not the crate.
          sbom="ferroehr-${TAG}-${TARGET}.cdx.json"
          mv app/ferroehr-server/ferroehr_bin.cdx.json "$sbom"
          echo "SBOM=$sbom" >> "$GITHUB_ENV"

      # Signed build provenance for the tarball. GitHub's native attestation is
      # the deliberate choice over slsa-framework/slsa-github-generator: it needs
      # no new secret and puts no third-party reusable workflow inside the
      # release path, and Sigstore signing is what turns readable provenance
      # into VERIFIABLE provenance. What it does not claim is the isolation-based
      # SLSA build levels, because the provenance is generated in the same job
      # that builds — an honest boundary rather than a level we assert.
      #
      # A consumer verifies with:
      #   gh attestation verify ferroehr-<tag>-<target>.tar.gz -R rubentalstra/FerroEHR
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ASSET }}
      - name: Attest the SBOM
        id: sbom-attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}

      # The Sigstore bundles, attached AS RELEASE ASSETS beside the artifact they
      # attest. The attestations above already live in GitHub's attestations API,
      # which is what `gh attestation verify` reads — but that requires reaching
      # GitHub. A bundle on the release lets a consumer verify OFFLINE, with the
      # artifact and the bundle in hand and nothing else:
      #
      #   gh attestation verify ferroehr-<tag>-<target>.tar.gz \
      #     --bundle ferroehr-<tag>-<target>.tar.gz.sigstore.json \
      #     --repo rubentalstra/FerroEHR
      #
      # It is also the only form a lock-file-blind scanner can see: the OpenSSF
      # Scorecard's signed-releases probes iterate release ASSETS and match
      # filename suffixes (`.sigstore.json`, `.intoto.jsonl` and peers —
      # probes/releasesAreSigned, probes/releasesHaveProvenance in v5.5.0). They
      # do not consult the attestations API, so signing without an attached
      # bundle scores zero while being genuinely signed.
      - name: Name the attestation bundles after the artifact they attest
        env:
          ASSET_NAME: ${{ env.ASSET }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "${ASSET_NAME}.sigstore.json"
          cp "$SBOM_BUNDLE" "${ASSET_NAME}.sbom.sigstore.json"
          echo "PROVENANCE_ASSET=${ASSET_NAME}.sigstore.json" >> "$GITHUB_ENV"
          echo "SBOM_BUNDLE_ASSET=${ASSET_NAME}.sbom.sigstore.json" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.publish-release.outputs.tag }}
          files: |
            ${{ env.ASSET }}
            ${{ env.SBOM }}
            ${{ env.PROVENANCE_ASSET }}
            ${{ env.SBOM_BUNDLE_ASSET }}
