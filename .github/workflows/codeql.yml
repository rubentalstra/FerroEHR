# CodeQL code scanning (security analysis).
#
# Enables GitHub code scanning so security alerts exist — the prerequisite for
# the issue "Security alerts" relationship (link an alert to a tracked issue;
# see .claude/rules/issue-relationships.md §4, which is UI-only by design).
#
# Rust is a generally-available CodeQL language (GA 2025-10-14) and scans with
# build-mode "none" — no cargo build required, so this stays cheap and never
# contends for the shared ./target tree.
#
# Docs: https://docs.github.com/en/code-security/code-scanning
name: CodeQL

# Push/PR runs are path-filtered to Rust-relevant changes — a docs/CI/artifact
# -only change has nothing for the rust analyzer to scan. The weekly scheduled
# run has no filter, so full-tree coverage is never lost. (CodeQL is not a
# required status check, so a skipped run cannot block a merge.)
on:
  push:
    branches: [develop]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [develop]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC (off-the-hour to dodge load spikes)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write # upload the SARIF results / alerts
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
