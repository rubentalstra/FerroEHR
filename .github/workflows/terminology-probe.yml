# The terminology deployment probe, against a REAL SNOMED CT release (#2178).
#
# Separate from the CI lane and manual by default, for two reasons that are not
# about taste:
#
#   LICENSING — the RF2 package is licensed content under a SNOMED International
#   Affiliate agreement. It is never committed here and never attached to a
#   build: this lane fetches it from wherever the affiliate keeps it, using
#   repository secrets, and the archive stays on the runner's disk for the life
#   of the job. No cache, no artifact upload, nothing that would republish it.
#
#   SIZE — Elasticsearch and Snowstorm want ~8 GB of memory between them, and a
#   full International Edition import needs well more disk than a standard
#   GitHub-hosted runner's 14 GB. That is why `runner` is an input: the default
#   is a larger runner label, and pointing it at `ubuntu-latest` is expected to
#   run out of disk during the import rather than to fail mysteriously later.
name: Terminology probe (SNOMED)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label — needs well more than 14 GB of disk"
        required: false
        default: "ubuntu-latest-8-cores"

permissions: {}

jobs:
  terminology:
    name: terminology against a real SNOMED release
    runs-on: ${{ inputs.runner || 'ubuntu-latest-8-cores' }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Elasticsearch refuses to start without this, and it is a HOST setting no
      # container can apply to itself — the probe says so when it happens, but
      # setting it here means it does not have to.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Report the disk available before the import
        run: df -h /

      # The credentials never reach a `run:` block as interpolated text; they
      # arrive through env, which is also what keeps them out of the command
      # line and therefore out of the process table.
      - name: Probe terminology
        env:
          FERROEHR_SNOMED_RF2_URL: ${{ secrets.SNOMED_RF2_URL }}
          FERROEHR_SNOMED_RF2_USER: ${{ secrets.SNOMED_RF2_USER }}
          FERROEHR_SNOMED_RF2_PASSWORD: ${{ secrets.SNOMED_RF2_PASSWORD }}
          FERROEHR_SNOMED_RF2_MD5: ${{ vars.SNOMED_RF2_MD5 }}
          FERROEHR_IMAGE: ghcr.io/rubentalstra/ferroehr:develop
          PROBE_ONLY: terminology
        run: bash scripts/deploy-probe.sh

      # The RECORD, not the release. The probe's JSON says what was exercised
      # and what was not; the archive itself is never published.
      - name: Upload the probe record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminology-probe-record
          path: docs/conformance/deployment/compose.json
          if-no-files-found: warn
