# SonarQube Cloud analysis — the machine opinion beside CodeQL (#2630;
# CodeRabbit removed in #2638), under the standing law of
# .claude/rules/ai-code-review.md: findings are advisory, never outrank
# the vendored specs, the rules, or the local gates, and gate no merge.
#
# Rust is analyzed first-party (announced 2025-04-17,
# https://www.sonarsource.com/blog/introducing-rust-in-sonarqube/): the
# analyzer runs Clippy itself from the root Cargo.toml — 85 Clippy rules
# managed as quality-profile rules, plus complexity metrics. That run uses
# the workspace DEFAULT features (the console compiles as an empty shell
# with neither ssr nor hydrate), so it sees less than our own deny-tier
# clippy lanes; it is a second, independent configuration on purpose.
# Scope (what is scanned vs excluded) lives in sonar-project.properties.
#
# Rust is not in SonarQube Cloud's Automatic Analysis — CI-based analysis
# is the documented path. SONAR_HOST_URL is not needed for Cloud
# (SonarSource/sonarqube-scan-action README, v8.2.1).
name: SonarQube Cloud

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  scan:
    name: analyze
    # PR analysis authenticates with SONAR_TOKEN, which fork PRs cannot read.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read # PR decoration reads the PR metadata
    # Coverage rides this lane (owner directive 2026-08-24): the instrumented
    # nextest run below produces the lcov the scan imports
    # (sonar.rust.lcov.reportPaths — docs.sonarsource.com/sonarqube-cloud/
    # analyzing-source-code/test-coverage/test-coverage-parameters), so the
    # DB-backed suite needs the same PostgreSQL the CI test job uses. The
    # former ci.yml `coverage` job is folded in here, and the README's
    # coverage badge is Sonar's own — the badges-branch orphan-commit
    # machinery is gone with it.
    services:
      postgres:
        image: postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # The shared test-database harness (tools/testkit) uses this server
      # directly — no per-test containers in CI at all.
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar assigns issues and new-code status by blame.
          fetch-depth: 0
          persist-credentials: false

      - name: Install xmllint (C14N parity gate) + non-durable test tuning
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"

      # Build cache for the analyzer's own Clippy run and the instrumented
      # build (cargo-llvm-cov keeps its own target dir). This lane publishes
      # nothing, so restoring a cache is inside the reliability.md rule
      # (only publishing lanes must run cache-free).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: llvm-tools-preview
          cache-shared-key: sonar
          cache-save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # The same two lanes as the CI test job (the console is excluded from
      # --all-features — mutually exclusive hydrate/ssr — and measured under
      # the ssr shape it ships): --no-report accumulates both into one
      # profile, `report` merges them into the single lcov the scan imports.
      - run: cargo llvm-cov --no-report nextest --locked --workspace --exclude ferroehr-admin-ui --all-features --no-tests=pass --profile ci
      - run: cargo llvm-cov --no-report nextest --locked -p ferroehr-admin-ui --features ssr --no-tests=pass --profile ci
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

      # sonar.projectVersion anchors the "Previous version" New Code window
      # (docs.sonarsource.com/sonarqube-cloud/standards/about-new-code): the
      # workspace version bumps at every release cut, so "new code" means
      # "since the last release" — the milestones-are-releases model as the
      # analysis window. Read from the root Cargo.toml at scan time (never a
      # second hand-maintained copy) and appended to the properties file the
      # scanner reads, so no context value reaches a shell or the action args.
      - name: Derive sonar.projectVersion from the workspace version
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "sonar.projectVersion=$v" >> sonar-project.properties
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
