# .github/workflows/docs.yml — build + deploy the documentation website.
# Rust-only toolchain, vendored static assets, no Node/Python build step for
# the site render.
name: Docs

on:
  push:
    branches: [develop]     # redeploy dev docs + landing/api
    tags: ["v*"]            # cut a frozen version, then redeploy
  pull_request:             # PR: build + lint + link-check ONLY (no deploy)
  workflow_dispatch:

# Pinned toolchain — the single source of truth for the docs build.
env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_MERMAID_VERSION: "0.17.0"
  MDBOOK_TOC_VERSION: "0.15.4"
  MDBOOK_KATEX_VERSION: "0.10.0"
  MDBOOK_LINT_VERSION: "0.14.4"
  LYCHEE_VERSION: "0.24.2"
  SWAGGER_UI_VERSION: "5.32.8"
  # Custom domain (ferroehr.eu): the site is served at the apex root, so the
  # base path is empty. Set explicitly so CI and scripts/site/build.sh agree.
  SITE_ORIGIN: "https://ferroehr.eu"
  SITE_BASE: ""

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ── Build + verify (always; no deploy) ──────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The deployed site is rebuilt in the deploy job, which restores no build
      # cache; this job publishes only a pull-request diagnostic artifact.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0 # zizmor: ignore[cache-poisoning]
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-mermaid@${{ env.MDBOOK_MERMAID_VERSION }},mdbook-toc@${{ env.MDBOOK_TOC_VERSION }},mdbook-katex@${{ env.MDBOOK_KATEX_VERSION }},mdbook-lint@${{ env.MDBOOK_LINT_VERSION }},lychee@${{ env.LYCHEE_VERSION }}
      - name: OAS drift gate (docs copy == vendored ITS-REST)
        run: bash scripts/site/assemble-oas.sh --check       # regenerate + git diff --exit-code
      - name: Stale-numbers gate (no hand-typed conformance claims in site sources)
        run: bash scripts/checks/conformance-numbers.sh
      - name: Render conformance stats + comparison + perf assets (the generated includes must exist before lint)
        run: |
          bash scripts/render/conformance-stats.sh includes
          bash scripts/render/comparison.sh
          bash scripts/render/perf-assets.sh
          bash scripts/render/conformance-assets.sh
          CONF_SUT=ehrbase bash scripts/render/conformance-assets.sh
      - name: Perf-assets drift gate (regenerated SVGs match the committed assets)
        run: git diff --exit-code website/book/src/perf-assets
      - name: Conformance-assets drift gate (regenerated SVGs match the committed assets)
        # comparison-assets/ is gitignored build output (regenerated above);
        # the committed, drift-guarded copies are the product's own.
        run: git diff --exit-code website/book/src/conformance-assets website/book/src/comparison-assets/conformance-heat-grid-ehrbase.svg website/book/src/comparison-assets/conformance-chapter-bars-ehrbase.svg
      - name: Markdown lint gate
        run: mdbook-lint lint website/book/src
      - name: Assemble _site (landing + api + /docs/dev/)
        run: bash scripts/site/build.sh --dev-only       # writes ./_site
      - name: Link-check gate (internal links only — blocking)
        # `--offline` blocks network requests, so this checks exactly the
        # property this repository controls: that every relative and absolute
        # in-site link resolves inside the built tree. A broken cross-reference
        # is a real defect and this is the only thing that catches it.
        #
        # External reachability is NOT checked here, deliberately. A remote host
        # rate-limiting or resetting a CI runner's connection says nothing about
        # the change under review, and it failed two consecutive unrelated pull
        # requests on links that return 200 when fetched directly (#2287). A
        # gate that goes red for reasons the author cannot fix or influence
        # teaches people to merge past red, which costs more than the check is
        # worth. External links move to link-check-external.yml, which reports
        # somewhere a human reads instead of blocking a merge.
        #
        # The deployed site is served at the ferroehr.eu apex ROOT, so absolute
        # /docs/... links resolve against _site itself — no prefixed check tree
        # is needed.
        run: |
          lychee --offline --no-progress --exclude-loopback \
            --root-dir "$PWD/_site" \
            './_site/**/*.html'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site

  # ── Cut a frozen version on a v* tag (push to docs-dist; never rebuilt) ─────
  version-cut:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # push to docs-dist
    steps:
      # The ONE checkout that keeps its credential: cut-version.sh commits and
      # pushes the frozen render to the docs-dist branch, which needs the token
      # in .git/config. Job-scoped to contents: write and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          fetch-depth: 0
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-mermaid@${{ env.MDBOOK_MERMAID_VERSION }},mdbook-toc@${{ env.MDBOOK_TOC_VERSION }},mdbook-katex@${{ env.MDBOOK_KATEX_VERSION }}
      - name: Build frozen vX.Y.Z + push to docs-dist
        run: bash scripts/site/cut-version.sh "${GITHUB_REF_NAME}"   # site-url, rsync into docs-dist, update versions.json, commit+push

  # ── Deploy the full site (develop push, tag, or manual) ─────────────────────
  deploy:
    needs: [build, version-cut]
    # Deploy on any non-PR event. version-cut only runs on tags, so accept it
    # either succeeding (tag) or being skipped (develop / manual dispatch).
    if: >-
      ${{ !cancelled()
        && needs.build.result == 'success'
        && (needs.version-cut.result == 'success' || needs.version-cut.result == 'skipped')
        && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Keeps its credential for the docs-dist fetch below (a git read, not the
      # API): the job's token grants contents: read only, so what stays in
      # .git/config cannot write anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
      - name: Fetch docs-dist (frozen versions)
        run: git fetch origin docs-dist && git worktree add docs-dist origin/docs-dist || true
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-mermaid@${{ env.MDBOOK_MERMAID_VERSION }},mdbook-toc@${{ env.MDBOOK_TOC_VERSION }},mdbook-katex@${{ env.MDBOOK_KATEX_VERSION }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble full _site (landing + api + dev + frozen versions + latest + sitemap)
        run: bash scripts/site/build.sh --full
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
