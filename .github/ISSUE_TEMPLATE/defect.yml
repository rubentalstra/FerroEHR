name: Bug Report
description: Report a defect in ehrbase-rs (wrong wire behaviour, a crash, a conformance divergence)
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: Before reporting an issue
      options:
        - label: I have searched existing issues
          required: true
        - label: I have reproduced the issue on the latest release
          required: true
  - type: textarea
    attributes:
      label: Environment
      description: You can get most of this from `GET %baseUri%/ehrbase/rest/status`.
      placeholder: |
        - ehrbase-rs version:
        - PostgreSQL version:
        - Deployment (compose / Helm / binary):
        - Operating system:
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Include requests, payloads, and templates as attachments where possible.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      description: For spec-governed behaviour, cite the openEHR spec section (component + document + heading) that defines the expectation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    attributes:
      label: Further information
    validations:
      required: false
