<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img">
<style>
text { fill: #52514e; font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.title { fill: #0b0b0b; font-weight: 600; }
.muted { fill: #8a8880; font-size: 11px; }
.grid { stroke: #e4e2dd; stroke-width: 1; }
.p50 { fill: #7db4ea; } .p90 { fill: #3d7fd0; } .p99 { fill: #1b5cab; }
.measured { fill: #2a78d6; }
.floor { fill: none; stroke: #8a8880; stroke-width: 1.5; stroke-dasharray: 4 3; }
.earned { fill: #1baf7a; font-weight: 600; }
.notearned { fill: #b3261e; font-weight: 600; }
.slo { stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 6 4; }
.slotext { fill: #b3261e; font-size: 11px; }
@media (prefers-color-scheme: dark) {
text { fill: #c3c2b7; }
.title { fill: #ffffff; }
.muted { fill: #8f8e85; }
.grid { stroke: #3a3a38; }
.p50 { fill: #3d5f82; } .p90 { fill: #3987e5; } .p99 { fill: #9ec7ef; }
.measured { fill: #3987e5; }
.floor { stroke: #8f8e85; }
.earned { fill: #26c78d; }
.notearned { fill: #e5484d; }
.slo { stroke: #e5484d; }
.slotext { fill: #e5484d; }
}
</style>
<text x="24" y="28" class="title">Performance class ladder — offered-load floors vs measured sustained load</text>
<text x="24" y="48" class="muted">A class's floor is the API request rate (arrivals/s) the hospital-simulation workload must sustain against</text>
<text x="24" y="64" class="muted">that class's seeded corpus for the normative hour-plus window. The rate alone earns nothing: the class is</text>
<text x="24" y="80" class="muted">EARNED only when every measured operation holds p99 &#8804; 1 s with zero errors under that load.</text>
<line x1="150.0" y1="106" x2="150.0" y2="298.0" class="grid"/><text x="150.0" y="314.0" class="muted" text-anchor="middle">1/s</text>
<line x1="290.9" y1="106" x2="290.9" y2="298.0" class="grid"/><text x="290.9" y="314.0" class="muted" text-anchor="middle">10/s</text>
<line x1="431.8" y1="106" x2="431.8" y2="298.0" class="grid"/><text x="431.8" y="314.0" class="muted" text-anchor="middle">100/s</text>
<line x1="572.8" y1="106" x2="572.8" y2="298.0" class="grid"/><text x="572.8" y="314.0" class="muted" text-anchor="middle">1000/s</text>
<text x="24" y="130.0">class POC</text>
<rect x="150" y="116.0" width="42.4" height="18" rx="4" class="floor"/>
<rect x="150" y="116.0" width="43.4" height="18" rx="4" class="measured"/>
<text x="201.4" y="130.0">sustained 2.0/s</text><text x="293.4" y="130.0" class="earned"> · EARNED</text>
<text x="24" y="178.0">class S</text>
<rect x="150" y="164.0" width="165.7" height="18" rx="4" class="floor"/>
<text x="323.7" y="178.0" class="muted">floor 15/s — not measured</text>
<text x="24" y="226.0">class L</text>
<rect x="150" y="212.0" width="306.7" height="18" rx="4" class="floor"/>
<text x="464.7" y="226.0" class="muted">floor 150/s — not measured</text>
<text x="24" y="274.0">class R</text>
<rect x="150" y="260.0" width="447.6" height="18" rx="4" class="floor"/>
<text x="605.6" y="274.0" class="muted">floor 1500/s — not measured</text>
</svg>
