<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API reference · FerroEHR</title>
  <meta name="description" content="OpenAPI endpoint reference for FerroEHR — the openEHR ITS-REST 1.1.0 API, grouped by resource. Rendered offline with Swagger UI.">
  <link rel="canonical" href="https://rubentalstra.github.io/ferroehr/api/">
  <link rel="icon" type="image/png" href="./vendor/swagger-ui/favicon-32x32.png">
  <link rel="stylesheet" href="./vendor/swagger-ui/swagger-ui.css">
  <style>
    /* Brand chrome (design tokens per docs/plans/w1-docs-website.md §3a).
       Only the header bar is theme-aware; Swagger UI itself is light-only, so
       its container is pinned to a light surface and stays readable in dark OS
       themes. */
    :root {
      --rs-rust: #b7410e; --rs-rust-600: #9a360b; --rs-umber: #5a2408;
      --rs-bg: #ffffff; --rs-text: #1b1613; --rs-muted: #6b605a; --rs-border: #e7ddd6;
      --rs-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --rs-bg: #14100e; --rs-text: #f3ece8; --rs-muted: #b3a79f; --rs-border: #332822; --rs-rust: #e4712f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--rs-sans); background: var(--rs-bg); color: var(--rs-text); }
    .rs-header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 1.25rem;
      background: color-mix(in srgb, var(--rs-bg) 85%, transparent);
      backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 2px solid var(--rs-rust);
    }
    .rs-header a.brand { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--rs-text); font-weight: 800; }
    .rs-header .brand img { width: 28px; height: 28px; }
    .rs-header .brand .tld { color: var(--rs-rust); }
    .rs-header nav { margin-left: auto; display: flex; gap: 1.25rem; font-weight: 600; font-size: 0.95rem; }
    .rs-header nav a { color: var(--rs-muted); text-decoration: none; }
    .rs-header nav a:hover { color: var(--rs-rust); }
    /* Keep Swagger UI on a light surface regardless of OS theme (it is light-only). */
    #swagger-ui { background: #ffffff; color-scheme: light; }
    /* Fold Swagger's own top bar branding into our palette. */
    .swagger-ui .topbar { background: #1e1815; }
    .swagger-ui .topbar .download-url-wrapper .select-label span { color: #f3ece8; }
  </style>
</head>
<body>

  <header class="rs-header">
    <a class="brand" href="../">
      <img src="../assets/logo-mark.svg" alt="" aria-hidden="true">
      <span>Ferro<span class="tld">EHR</span></span>
    </a>
    <nav aria-label="Primary">
      <a href="../docs/latest/">Docs</a>
      <a href="../">Home</a>
      <a href="https://github.com/rubentalstra/FerroEHR" rel="noopener">GitHub ↗</a>
    </nav>
  </header>

  <div id="swagger-ui"></div>

  <script src="./vendor/swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="./vendor/swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        urls: [
          { url: "./spec/ehr.openapi.yaml",         name: "EHR" },
          { url: "./spec/definition.openapi.yaml",  name: "Definition" },
          { url: "./spec/query.openapi.yaml",       name: "Query" },
          { url: "./spec/demographic.openapi.yaml", name: "Demographic" },
          { url: "./spec/admin.openapi.yaml",       name: "Admin" },
          { url: "./spec/system.openapi.yaml",      name: "System" },
          { url: "./spec/overview.openapi.yaml",    name: "Overview" }
        ],
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>

</body>
</html>
