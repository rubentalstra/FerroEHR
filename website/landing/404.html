<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — page not found · FerroEHR</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; --rust: #b7410e; --bg: #fff; --text: #1b1613; --muted: #6b605a; }
    @media (prefers-color-scheme: dark) { :root { --rust: #e4712f; --bg: #14100e; --text: #f3ece8; --muted: #b3a79f; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); padding: 2rem; }
    .code { font-size: clamp(4rem, 14vw, 8rem); font-weight: 800; color: var(--rust); line-height: 1; margin: 0; }
    h1 { font-size: 1.4rem; margin: 0.5rem 0 0.75rem; }
    p { color: var(--muted); max-width: 44ch; margin: 0 auto 1.75rem; }
    a { display: inline-block; padding: 0.7rem 1.4rem; border-radius: 8px; background: var(--rust);
      color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you were looking for doesn't exist or has moved. Head back to the documentation home.</p>
    <a href="/">Go home</a>
  </main>
</body>
</html>
