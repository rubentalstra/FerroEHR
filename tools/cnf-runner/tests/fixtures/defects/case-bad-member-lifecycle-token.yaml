id: DEFECT-bad-member-lifecycle-token
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: "seeded defect: a member lifecycle_state outside the version_lifecycle_state group"
description: "seeded defect"
spec_refs: ["RM common §change_control (master06 §Version Lifecycle)"]
requires:
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: creation
          lifecycle_state: finished
    expect: created
