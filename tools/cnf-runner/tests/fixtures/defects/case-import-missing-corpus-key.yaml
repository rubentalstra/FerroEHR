id: DEFECT-import-missing-corpus-key
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
profiles: [CORE]
test_purpose: "seeded defect: requires.import names an extract absent from the manifest"
description: "seeded defect"
spec_refs: ["RM common §change_control (master06 §Copying)"]
requires:
  ehr: { commits: none }
  import:
    extract: cnf.messaging.ehr_extract.does_not_exist
    container: X_VERSIONED_COMPOSITION
flow:
  - step: 1
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${imported_versioned_object_uid}"
      version_uid: "${imported_version_uid}"
    expect: ok
