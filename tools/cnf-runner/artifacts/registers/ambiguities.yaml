AMB-10:
  ambiguity: >-
    Physical deletion is DEFINED by two released components and FORBIDDEN by a
    third, in absolutes on both sides. RM common states the prohibition twice:
    §Contributions — "Since a versioned repository (i.e. a collection of
    `VERSIONED_OBJECTs`) is by definition indelible, all logical changes
    including deletions, additions, modifications … are achieved by physically
    committing new Versions" — and §Logical Deletion — "Medicolegal and
    traceability requirements mean that information cannot be literally removed,
    since it must always be possible to revert back to a previous state of the
    record in which the deleted information is intact. Accordingly, information
    can only ever be logically deleted." Against that, SM declares an operation
    whose entire Meaning is "Physical deletion of specified EHR."
    (`physical_ehr_delete`; `physical_party_delete` is its party twin), and the
    released ITS-REST admin routes wire it in prose that admits no logical
    reading: the success response is "`204 No Content` is returned when the
    requested operation succeeded and the resource(s) identified by the request
    parameters has been physically deleted (i.e. hard-delete)", and both admin
    operation descriptions say every owned resource "(such as COMPOSITION,
    EHR_STATUS, ITEM_TAG, CONTRIBUTION, and their historical versions) will also
    be **permanently** and physically deleted, in compliance with applicable
    data protection regulations (e.g., the GDPR in the European Union)". That
    justification is the ONLY invocation of a data-protection regulation
    anywhere in the vendored spec tree — grep-verified: exactly two sentences,
    in `operations/admin_ehr_delete.yaml` and `operations/admin_ehr_delete_all.yaml`
    (plus the three assembled `computable/OAS/admin-*.openapi.yaml` bundles,
    which carry those same two sentences verbatim), and nowhere else in RM,
    BASE, AM, QUERY, TERM, SM, CNF or the rest of ITS-REST. So the RM's
    indelibility principle — stated as a medicolegal requirement — is overridden
    by an aside in an ITS operation description, and no released text reconciles
    the two. RE-ADJUDICATED 2026-07-27 (group-14 audit): the earlier framing,
    "deleting a VERSIONED_OBJECT is under-specified", understated the defect.
    This is not a silence to be filled; it is a head-on contradiction between
    released components, and the released text that resolves it in the admin
    routes' favour is the only text that describes those routes at all.
  source: >-
    RM common master06-change_control_package.adoc §Contributions (the
    indelibility sentence quoted above) and §Logical Deletion (the "cannot be
    literally removed" / "can only ever be logically deleted" sentences and the
    four-step logical-deletion procedure: new Version, delete its `_data_`,
    `_lifecycle_state_` to `deleted`, commit) CONTRASTED with SM
    UML/classes/i_admin_service.adoc §physical_ehr_delete ("Physical deletion of
    specified EHR."; `an_ehr_id: UUID [1]`; `Pre_has_ehr: has_ehr (an_ehr_id)`;
    error `ehr_id_does_not_exist`) and §physical_party_delete ("Physical delete
    of specified Party, along with related Party relationships.") + ITS-REST
    specifications/responses/204_deleted_hard.yaml (the quoted hard-delete
    sentence) + specifications/operations/admin_ehr_delete.yaml and
    admin_ehr_delete_all.yaml (the quoted permanent/physical/GDPR sentence; the
    grep for GDPR and "data protection" over the whole of
    docs/specs/openehr/ hits only those two files and the three assembled OAS
    bundles) — ALL CONFIRMED first-hand.
  handling: >-
    Fixed handling, split by ROUTE FAMILY, because the two readings govern
    disjoint surfaces and each is grounded on the text that actually describes
    its surface. (1) THE TWO ADMIN ROUTES ARE PHYSICAL. `DELETE
    /admin/ehr/{ehr_id}` and `DELETE /admin/ehr/all` destroy the EHR and every
    resource it owns, leaving no VERSION and no version container behind; the
    admin operation descriptions plus `204_deleted_hard.yaml` are the ONLY
    released text that says what these operations do, and reading them logically
    would leave two released operations with no defined behaviour whatsoever.
    (2) EVERY NON-ADMIN DELETE STAYS RM-LOGICAL. A COMPOSITION, FOLDER,
    EHR_STATUS or PARTY delete on its own resource route commits a new VERSION
    whose `change_type`/`lifecycle_state` is `523|deleted|` and leaves the
    container standing — including where SM says otherwise: AMB-135 defect (7)
    decides `I_PARTY.delete_party`'s physical `Post_party_deleted` against the
    SM and in favour of the RM, precisely because no ITS-REST text describes
    that route as a hard delete. The dividing line is therefore not a
    preference: it is whether a released ITS operation description says
    "physically deleted". (3) THE ADMIN SUCCESS KIND IS `ok_empty`, NEVER
    `deleted`. The closed outcome vocabulary defines `deleted` as "Logical
    delete performed (a new version, lifecycle_state =
    openehr::523|deleted|)" — exactly what a physical delete does NOT produce —
    so both admin bindings map success to `ok_empty` ("Fulfilled with no
    content"), with the async `202` carried as its `alt_status` (AMB-139).
    Reported upstream (#1487): reconcile the RM's indelibility absolutes with
    the SM/ITS physical-delete operations — state in RM common that a
    regulator-compelled erasure is an exception to §Logical Deletion, or state
    in SM/ITS-REST that physical deletion is an out-of-model administrative
    facility — and put the data-protection justification somewhere normative
    rather than in two operation descriptions.
  disposition: fixed_handling
  upstream_issue: 1487
