AMB-24:
  ambiguity: >-
    The SM I_EHR_DIRECTORY.get_versioned_directory operation is not surfaced
    by ITS-REST 1.1.0 — there is no versioned_directory resource (unlike
    versioned_composition and versioned_ehr_status).
    SCOPE (2026-08-02): the withheld surface is not one operation but the
    WHOLE VERSIONED_FOLDER container. VERSIONED_FOLDER is "A version-controlled
    hierarchy of `FOLDERs` giving the effect of a directory" and declares NO
    members of its own — it inherits the entire VERSIONED_OBJECT<T> function
    set. SM I_EHR_DIRECTORY realizes only the version-ADDRESSING half of that
    set (`has_version_at_time` -> has_directory_version /
    get_directory_at_time, `has_version_id`/`version_with_id` ->
    has_directory_version / get_directory_at_version), and its container-level
    operation is the one this entry opens with. EIGHT declared functions
    therefore have neither an SM operation nor an ITS-REST route: the audit
    surface `revision_history()`; the enumeration surface `version_count()`,
    `all_version_ids()`, `all_versions()`; the head selectors
    `latest_version()` and `latest_trunk_version()`; the version-kind
    predicate `is_original_version()`; and `trunk_lifecycle_state()`, whose
    logical-deletion answer reaches the wire only indirectly, as the read
    outcome the deleted-head cases observe. The asymmetry is visible in the
    release's own file set: the versioned COMPOSITION container has four
    operations including an explicit `versioned_composition_revision_history`,
    and the versioned EHR_STATUS container likewise, while the five released
    directory operations are the unversioned ones plus two version-addressed
    reads.
  source: >-
    SM UML/classes/i_ehr_directory.adoc §Functions — TEN operations, read
    first-hand and enumerated: has_directory, has_path, create_directory,
    get_directory, get_directory_at_time, update_directory, delete_directory,
    has_directory_version, get_directory_at_version, get_versioned_directory;
    none of them is revision_history, version_count, all_version_ids,
    all_versions, latest_version, latest_trunk_version, is_original_version or
    trunk_lifecycle_state. RM common
    UML/classes/org.openehr.rm.common.versioned_folder.adoc (§Description +
    §Inherit: VERSIONED_OBJECT, no own members) and
    UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions (the
    declared set, each 1..1) — the surface the container defines. Released
    ITS-REST 1.1.0: no versioned_directory resource — the
    specifications/operations/ directory carries directory_create,
    directory_delete, directory_get_at_time, directory_get_by_version_id and
    directory_update and nothing versioned, while the same directory carries
    versioned_composition_get, versioned_composition_revision_history,
    versioned_composition_version_get_by_id,
    versioned_composition_version_get_at_time and the versioned_ehr_status
    siblings — so the omission is specific to the directory container, not a
    general absence of versioned-container routes.
  handling: >-
    The three official get_versioned_directory cases are in the catalogue,
    active and SM-anchored; the its-rest binding carries an explicit
    unrealized declaration, so on ITS-REST 1.1.0 they verdict as
    not-applicable WITH CITATION. SM/ITS alignment candidate.
  disposition: fixed_handling
  upstream_issue: 1490
