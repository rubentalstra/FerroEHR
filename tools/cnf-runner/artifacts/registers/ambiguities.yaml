  source: "ITS-REST specifications/operations/composition_create.yaml vs CNF platform_test_schedule master07 (create_composition-same_opt_twice + persistent NOTE)"
  handling: >-
    Bind conflict -> 409 on create_composition (the uniqueness/state-conflict
