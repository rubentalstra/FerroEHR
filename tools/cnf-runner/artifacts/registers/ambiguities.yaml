  upstream_issue: 1507
AMB-56:
  ambiguity: >-
    Accept quality-factor (q-value) negotiation strictness is not spec-defined.
    ITS-REST content negotiation states only that a client SHOULD use Accept to
    specify the expected representation and that a service that cannot fulfil it
    MUST respond 406 Not Acceptable; nothing in the ITS-REST corpus defines
    q-value weighting, preference ordering across multiple acceptable types, or
    */* wildcard resolution (grep: no "q=", "quality", or "weight"). RFC 7231
    defines q-values generically, but ITS-REST assigns them no
    conformance-visible behaviour.
  source: >-
    ITS-REST overview Resources.md §Data representation ("The client SHOULD use
    the Accept ... request header to specify the expected ... response format.
    If the service cannot fulfil this aspect of the request, it MUST respond
    with HTTP status code 406 Not Acceptable") + Requests_and_responses.md
    §Representation details negotiation (Prefer verbosity only; no q-value text)
    — silence across the ITS-REST corpus CONFIRMED first-hand
  handling: >-
    No normative cases: a server's handling of a weighted or multi-type Accept
    (q-value ordering, wildcard resolution) is statement-declared, not gated.
    The one documented rule — an Accept the service cannot fulfil yields 406 —
    is already exercised by the unsupported-Accept case
    (SF-EXAMPLE-unsupported_accept). Activates as gating cases only if a future
    ITS-REST release defines q-value semantics.
  disposition: statement_declared
  upstream_issue: 1508
