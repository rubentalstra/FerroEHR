# The ambiguity register: every entry a real, verified spec divergence or
# silence with the normative handling a runner MUST apply. A runner that
# resolves an ambiguity privately is non-conformant to the schedule.
#
# ORACLE (owner rulings 2026-07-24): only RELEASED openEHR components are
# enforceable authority — RM, BASE, AM/ADL, QUERY, TERM, ITS-XML, SM, and the
# ITS-REST docs text. The vendored OAS, the CNF Platform Conformance Test
# Schedule, and the Robot suites are STALLED GUIDES (which behaviour to cover),
# never authority. Every `source` cites a released component; a CNF/OAS/Robot
# mention is a coverage guide, never the ground for a verdict.
AMB-4:
  ambiguity: >-
    ADL 1.4 templates have no formal versioning — duplicate template_id
    handling is implementation-defined: conflict vs version-parameter.
  source: >-
    AM ADL 1.4 master02-overview.adoc §Templates (templates are defined at a
    local level in the dADL formalism and "do not introduce any new semantics
    to archetypes"; no template versioning or duplicate-template_id handling is
    defined) — silence CONFIRMED first-hand
  handling: >-
    Two sibling cases carry option tags; the ICS options declaration selects
    which applies — at least the declared behaviour MUST pass; the undeclared
    sibling is not-applicable.
  disposition: option_select
  options: [adl14-duplicate-conflict, adl14-duplicate-versioned]
  upstream_ref: "UPR-01"
AMB-5:
  ambiguity: "Persistent-COMPOSITION uniqueness per EHR is under SEC debate."
  source: >-
    RM ehr COMPOSITION class §Invariants (Category_validity / Territory_valid /
    Language_valid / Content_valid / Is_archetype_root — no invariant requires a
    persistent COMPOSITION to be unique per EHR) + RM ehr
    master05-composition_package.adoc §Persistent Compositions (silent on
    uniqueness) — silence CONFIRMED first-hand
  handling: >-
    Affected cases carry the flag; verdicts on them are reported but excluded
    from profile computation until resolved.
  disposition: report_only
  upstream_ref: "UPR-02"
AMB-6:
  ambiguity: >-
    The `fetch` default is implementation-defined; `fetch` cannot combine
    with AQL TOP.
  source: "ITS-REST query Request.md (fetch default impl-defined; TOP+fetch not combinable)"
  handling: >-
    Cases always pass `fetch` explicitly; the TOP+fetch rejection is its own
    case.
  disposition: fixed_handling
AMB-7:
  ambiguity: "Additional non-conflicting status codes are permitted."
  source: "ITS-REST overview Requests_and_responses.md §HTTP status codes (additional non-conflicting codes permitted)"
  handling: >-
    Bindings assert the expected code exactly for the expected outcome; they
    never enumerate-reject other codes for other situations.
  disposition: fixed_handling
AMB-8:
  ambiguity: >-
    Empty-directory retrieval is empty-vs-error ambiguous: get_directory on
    an EHR without one "should return an empty structure ... could be an
    error status instead".
  source: >-
    RM ehr EHR class §directory (0..1 — a directory is optional) + released
    ITS-REST 1.1.0 directory retrieval docs (silent on the representation of an
    empty/never-created directory)
  handling: >-
    Sibling cases with option tags; the ICS declares the behaviour.
    On ITS-REST 1.1.0 only the ERROR option is realizable: released ITS-REST
    directory retrieval returns not-found for a directory that does not exist
    (overview Requests_and_responses.md §status codes) and defines no
    empty-structure representation for a never-created directory — so the
    its-rest binding fixes the error branch and no directory-empty-structure
    sibling exists for this ITS (the option pair stands for future ITS
    bindings). Upstream clarification candidate.
  disposition: option_select
  upstream_ref: "UPR-03"
  options: [directory-empty-structure, directory-empty-error]
