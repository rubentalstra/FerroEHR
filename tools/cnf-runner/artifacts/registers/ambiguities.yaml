    export_ehr()/export_ehr_extract() (and lists export_ehr() twice) — the
    vendored SM I_EHR_EXTRACT_SERVICE is the resolution oracle.
  source: "ITS-REST specifications/operations (no message/extract/tdd operations) vs SM docs/UML/classes/i_ehr_extract_service.adoc / i_tdd_service.adoc / i_message_service.adoc; CNF platform_test_schedule master13"
  handling: >-
    Every master13 case is anchored to a resolvable SM operation on
    I_EHR_EXTRACT_SERVICE / I_TDD_SERVICE and its its-rest binding is
    declared unrealized; the cases are not-applicable WITH CITATION on
    ITS-REST 1.1.0 and activate when a later ITS release adds a MESSAGE API.
    Upstream editorial candidate for the master13 interface naming.
  disposition: fixed_handling
AMB-35:
