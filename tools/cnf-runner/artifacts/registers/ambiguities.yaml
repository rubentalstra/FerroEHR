    NOTE ("validation might be part of the OPT upload functionality").
    Upstream editorial-alignment candidate.
  disposition: fixed_handling
AMB-17:
  ambiguity: >-
    The SM I_DEFINITION_ADL14.delete_opt operation is not surfaced by
