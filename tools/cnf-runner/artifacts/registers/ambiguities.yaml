    fractional_seconds_allowed booleans on C_DURATION, but the ITS-XML 1.0.2
    OPT serialization (Archetype.xsd) carries NO millisecond_validity element
    (C_TIME/C_DATE_TIME sequence is pattern, timezone_validity, range,
    assumed_value) and NO per-field duration booleans (C_DURATION is pattern,
    range, assumed_value), and the ADL 1.4 pattern grammar ends at the seconds
    slot. A constraint the schedule tests is unserializable on the OPT 1.4 wire.
  source: >-
    AM aom14 c_time.adoc + c_date_time.adoc (millisecond_validity) +
    c_duration.adoc (seconds_allowed / fractional_seconds_allowed) + AM ADL1.4
    master05-cadl.adoc §Patterns (V_ISO8601_TIME_CONSTRAINT_PATTERN ends at
    seconds) vs ITS-XML 1.0.2 Archetype.xsd (C_TIME/C_DATE_TIME/C_DURATION
    sequences — no such elements)
  handling: >-
    Content rows whose expected rejection rests SOLELY on these
    unserializable axes (millisecond_validity, or a seconds_allowed /
    fractional_seconds_allowed split where the other seconds flag is true)
    are recorded not-applicable WITH CITATION by the per-row realizability
    gate (the ground OPT cannot exist on this technology profile); rows
    whose violations include any serializable axis (timezone_validity IS an
    Archetype.xsd element and stays tested) run normally. The rows activate
    when an ITS-XML release serializes the AOM fields.
  disposition: fixed_handling
  upstream_ref: "UPR-17"
AMB-43:
  ambiguity: >-
    BASE 1.3.0 Interval<T> declares lower/upper as optional (0..1) and
    carries exactly four invariants (Lower_included_valid,
    Upper_included_valid, Limits_consistent, Limits_comparable) — none of
    which requires a bound VALUE to be present when the corresponding
    *_unbounded flag is false. An instance {lower_unbounded: false, no
    lower; upper_unbounded: false, no upper} therefore violates no RM
    invariant, while the CNF content lineage expects such an interval to be
    rejected as malformed. (Older openEHR revisions carried such an
    invariant; the vendored 1.3.0 does not.)
  source: >-
    BASE foundation_types interval.adoc §Attributes (lower/upper 0..1) +
    §Invariants (the four-invariant set — none requires a bound value when
    *_unbounded is false)
  handling: >-
    The framework adopts the RM-invariant reading: a bounded-flag interval
    with absent limits is ACCEPTED (no invariant violated; the flags are
    then vacuous). The affected content rows expect accepted with this
    citation. The rows flip to rejected if a future BASE release restores
    the bound-required invariant.
  disposition: fixed_handling
  upstream_ref: "UPR-18"
AMB-44:
  ambiguity: >-
    DV_TIME literal form diverges between the CNF schedule and BASE: the
    master17.4 §DV_TIME NOTE says "our test data sets all include the T
    time marker" (and the master17.3 interval-of-time tables print
    T-prefixed literals), while BASE Iso8601_time defines the value syntax
    as hh:mm:ss[(,|.)sss][Z|±hh[:mm]] (extended) or hhmmss… (compact) —
    no leading T in either form. DV_TIME.value's type oracle is the BASE
    class.
  source: >-
    BASE foundation_types iso8601_time.adoc §Description (value syntax
    hh:mm:ss[(,|.)sss][Z|±hh[:mm]] extended or hhmmss… compact — no leading T)
  handling: >-
    Time literals in the catalogue take the BASE Iso8601_time form: the
    schedule's T-prefixed time data sets are transcribed WITHOUT the
    leading marker (the T marks the date-time separator and duration
    designators only). The affected DV_TIME/interval-of-time cases tag
    this entry. Flips back if a future BASE release admits the T-prefixed
    time form.
  disposition: fixed_handling
  upstream_ref: "UPR-19"
AMB-45:
  ambiguity: >-
    The master17.4 DV_DATE_TIME range table's T-precision block tests values
    anchored at 2021-10-24 (e.g. 2021-10-24T10) against ranges anchored at
    1900-03-13 yet expects accepted — arithmetically impossible under BASE
    Interval total-order containment.
  source: >-
    BASE foundation_types interval.adoc §has() (total-order containment — the
    master17.4 DV_DATE_TIME T-precision block is arithmetically underivable);
    the master17.4 temporal range table is the stalled guide where the defect
    appears
  handling: >-
    The catalogue re-anchors the block's values to the ranges' 1900-03-13
    date (preserving each row's precision axis and verdict), making every
    row derivable. Editorial correction proposed with the chapter
    conversion.
  disposition: editorial
  upstream_ref: "UPR-20"
AMB-46:
  ambiguity: >-
    Commit-time enforcement of a CONSTRAINT_REF (C_CODE_REFERENCE) against
    the instance's terminology_id is not derivable from AOM1.4: master04
    §Reference Objects defines CONSTRAINT_REF as a proxy whose actual
    constraint definition lives OUTSIDE the archetype, in the
    constraint_bindings query into an external service — no clause mandates
    rejecting a committed instance whose terminology no binding covers. The
    schedule's validate_ext_term row 4 nevertheless verdicts rejected.
  source: >-
    AM AOM1.4 master04-constraint_model_package.adoc §Reference Objects
    (C_REFERENCE_OBJECT / CONSTRAINT_REF — the constraint definition is external
    to the archetype; no commit-time terminology-binding enforcement defined)
  handling: >-
    The unmatched-terminology row asserts acceptance with the AOM citation
    (rejection is not derivable). Instrument note: the declared
    constraint_bindings axis is not yet realized by the OPT synthesizer
    (no binding is emitted into the synthesized template) — the axis is
    declarative until the terminology-binding synthesis lands; the rm_schema
    rows are unaffected. Flips to rejected only if a future AM release defines
    commit-time binding enforcement.
  disposition: fixed_handling
  upstream_ref: "UPR-21"
AMB-48:
