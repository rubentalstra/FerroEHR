    VERSIONED_OBJECT, change_type 251|modification|) — the rejection of a
    mismatched change_type is REQUIRED. The ITS-REST docs text
    (specifications/docs/) assigns NO status code to a change_type mismatch
    (confirmed silent first-hand); ITS-REST overview Requests_and_responses.md
    §HTTP status codes permits 400 (generic client-side error, "used when no
    other 4xx error code is appropriate") or 422 (semantic) — the exact code is
    unassigned.
  handling: >-
    commit_contribution's validation_failed carries BOTH semantic content
    invalidity (422, exact) AND this mismatched-change_type rejection
    (spec-unassigned code); the binding accepts 422 with alt_status [400] for
    the latter. Pure semantic-content cases stay 422. The SAME silence
    governs a direct commit whose openehr-audit-details committal header
    carries an operation-contradicting change_type (overview
    §"openehr-version and openehr-audit-details" requires the merge; RM
    change control requires the rejection; no docs-text sentence assigns the
    code): the update_composition audit_change_type variant's
    change_type_mismatch outcome accepts both (400 with alt_status [422]).
    Out-of-group tokens are NOT this silence — they violate
    AUDIT_DETAILS.Change_type_valid, a semantic error, 422 exact.
  disposition: fixed_handling
  upstream_ref: "UPR-23"
AMB-55:
  ambiguity: >-
    DV_CODED_TEXT.value has no value==rubric invariant. The dv_coded_text.adoc
    Description prose ("A text item whose value must be the rubric from a
    controlled terminology") and the dv_text.adoc value-attribute meaning ("For
    DV_CODED_TEXT, this is the rubric of the complete term as provided by the
    terminology service") are DESCRIPTION text, not invariants: the only
    invariant governing value is the inherited dv_text.adoc Valid_value
    (not value.is_empty), and DV_CODED_TEXT adds only defining_code 1..1. So a
    committed DV_CODED_TEXT whose value is a non-empty string that is NOT the
    coded rubric (an arbitrary display label, or the raw code string) violates
    no RM invariant.
  source: >-
    RM data_types dv_coded_text.adoc §Description ("A text item whose value must
    be the rubric from a controlled terminology") + dv_text.adoc §Attributes
    value ("For DV_CODED_TEXT, this is the rubric of the complete term as
    provided by the terminology service") vs dv_text.adoc §Invariants
    (Valid_value: not value.is_empty — the SOLE invariant on value) +
    dv_coded_text.adoc §Invariants (none beyond defining_code 1..1) — CONFIRMED
    first-hand
  handling: >-
    The framework adopts the RM-invariant reading: a committed DV_CODED_TEXT
    with a present defining_code and ANY non-empty value (the bound rubric, an
    arbitrary label, or the raw code) is ACCEPTED; only an empty value is
    rejected (Valid_value). The acceptance-direction value rows of
    CONT-DV_CODED_TEXT-validate_local_codes / -validate_ext_term tag this entry.
    Flips to value==rubric enforcement only if a future RM release promotes the
    "must be the rubric" prose to an invariant. Pins the anti-overreach ruling
    that reverted value==rubric enforcement (PR #263).
  disposition: fixed_handling
  upstream_ref: "UPR-24"
AMB-56:
  ambiguity: >-
    Accept quality-factor (q-value) negotiation strictness is not spec-defined.
    ITS-REST content negotiation states only that a client SHOULD use Accept to
    specify the expected representation and that a service that cannot fulfil it
    MUST respond 406 Not Acceptable; nothing in the ITS-REST corpus defines
    q-value weighting, preference ordering across multiple acceptable types, or
    */* wildcard resolution (grep: no "q=", "quality", or "weight"). RFC 7231
    defines q-values generically, but ITS-REST assigns them no
    conformance-visible behaviour.
  source: >-
    ITS-REST overview Resources.md §Data representation ("The client SHOULD use
    the Accept ... request header to specify the expected ... response format.
    If the service cannot fulfil this aspect of the request, it MUST respond
    with HTTP status code 406 Not Acceptable") + Requests_and_responses.md
    §Representation details negotiation (Prefer verbosity only; no q-value text)
    — silence across the ITS-REST corpus CONFIRMED first-hand
  handling: >-
    No normative cases: a server's handling of a weighted or multi-type Accept
    (q-value ordering, wildcard resolution) is statement-declared, not gated.
    The one documented rule — an Accept the service cannot fulfil yields 406 —
    is already exercised by the unsupported-Accept case
    (SF-EXAMPLE-unsupported_accept). Activates as gating cases only if a future
    ITS-REST release defines q-value semantics.
  disposition: statement_declared
  upstream_ref: "UPR-25"
AMB-57:
  ambiguity: >-
    ITS-REST 1.1.0 defines no simplified-format (FLAT/STRUCTURED) inner-data
    surface for commit_contribution. The contribution create operation accepts a
    CONTRIBUTION envelope (versions[] + audit) in canonical JSON/XML; the
    Simplified Formats sub-spec scopes itself to COMPOSITION serialization and
    defines only the two wt COMPOSITION MIME types, with no CONTRIBUTION
    representation. So committing a CONTRIBUTION whose inner versions carry
    simplified-format COMPOSITIONs has no wire.
  source: >-
    ITS-REST simplified_formats master02-overview.adoc §Scope (covers "Mapping
    between the Simplified Formats and canonical openEHR RM (e.g. COMPOSITION)";
    CONTRIBUTION not in scope) + §MIME Types (only
    application/openehr.wt.flat+json and application/openehr.wt.structured+json)
    vs the released ITS-REST contribution-create operation (CONTRIBUTION
    envelope body, canonical JSON/XML only) — CONFIRMED first-hand
  handling: >-
    No normative cases: there is no ITS-REST 1.1.0 wire for committing a
    CONTRIBUTION with simplified inner data, so the behaviour is
    statement-declared (a server MAY offer it as an extension). commit_contribution
    coverage stays on the canonical-JSON/XML envelope. Activates if a future
    ITS-REST release defines a simplified contribution surface. SM/ITS alignment
    candidate.
  disposition: statement_declared
  upstream_ref: "UPR-26"
AMB-58:
  ambiguity: >-
    NOT an openEHR ambiguity — a documented extension of ours, kept in this
    register because a case rests on it and must never be mistaken for a
    spec-derived expectation (re-framed 2026-07-27 under the owner ruling that
    an "ambiguity" whose only conflict lives in the stalled OAS is not one).
    The released docs text is simply SILENT on what an `Accept:
    application/json` read of an operational template returns: it defines no
    canonical-JSON representation of an OPERATIONAL_TEMPLATE anywhere, names
    only `application/openehr.wt+json` for the template-as-JSON case, and
    assigns the request neither a body nor a refusal. Both answers a service
    could give — serve some JSON document, or refuse 406 — are consistent with
    every released sentence. The earlier framing of this entry as an internal
    inconsistency has been dropped: the half that "offers" application/json
    exists only in the OpenAPI source fragments, which are stalled and are not
    an oracle, so it never had standing to contradict anything.
  source: >-
    ITS-REST overview Resources.md §JSON Format ("The client SHOULD use the
    Accept: application/json request header to specify the expected JSON
    response format. If the service cannot fulfil this aspect of the request,
    it MUST respond with HTTP status code 406 Not Acceptable"; "Proper header
    Content-Type: application/json MUST be present in the response of the
    service unless the response has no content body") + §Simplified Formats
    ("application/openehr.wt+json for the Operational Template definition as
    Web Template JSON format") — the two rules that govern IF the request is
    fulfilled, neither of which says whether it is. No released sentence
    defines a canonical-JSON OPERATIONAL_TEMPLATE representation; silence
    CONFIRMED first-hand across specifications/docs/**.
  handling: >-
    Our own design/extension, documented rather than derived — no openEHR spec
    governs which of the two permitted answers a service gives. This CDR
    FULFILS the request with the Web Template document, the only JSON
    rendering of an operational template the released text names at all, and
    answers it under `Content-Type: application/json`, the type the client
    negotiated (the §JSON Format MUST, which binds once a body is returned).
    Fulfilling rather than refusing keeps a plain `application/json` client
    working without a second round trip, and the negotiated Content-Type keeps
    the response honest about what it is. Because the CHOICE is ours, the case
    that exercises it (SF-WT-web_template_json_accept) is tagged with this
    entry and kept at OPTIONS, reported and never gating: no conformant server
    is required to answer this way, and one that returns 406 instead is not in
    breach of anything. The spec-named branch is separately and gatingly
    covered by SF-WT-web_template_get (Accept: application/openehr.wt+json →
    the Web Template under its own type). Revisits — and becomes a real
    expectation — if a future ITS-REST release defines the application/json
    template representation. No upstream_ref: there is no released-source
    defect to report, only a silence we filled.
  disposition: fixed_handling
AMB-59:
  ambiguity: >-
    ITS-REST 1.1.0 offers the query-execution EHR scope in two forms — the
    `ehr_id` query parameter and the `openehr-ehr-id` request header — but never
    says what a request carrying BOTH forms means. The released text describes
    them only as alternatives ("or alternatively"), so it defines neither a
    precedence between them nor an outcome when the two name different EHRs.
  source: >-
    ITS-REST specifications/docs/query/Request.md §About the ehr_id parameter
    ("Depending on the needs, clients MAY supply it as a query parameter
    `ehr_id` or alternatively as a request header named `openehr-ehr-id`") +
    §Common Headers and Query Parameters (both forms listed, no precedence) +
    docs/query/Query_types.md §single-EHR queries ("supplying an `ehr_id` query
    parameter or setting an `openehr-ehr-id` request header") — silence
    CONFIRMED first-hand: no released sentence covers the both-supplied case.
  handling: >-
    Fixed handling. Either form alone is the EHR scope, on every execution
    operation and both HTTP methods (Request.md draws no GET/POST distinction).
    Both forms supplied naming the SAME EHR is accepted — the request names one
    EHR, so there is nothing to arbitrate; the query parameter is treated as the
    primary named form and the header as its alternative. Both forms supplied
    naming DIFFERENT EHRs is 400 Bad Request: the request is self-contradictory
    and no released rule picks a winner, which is exactly the generic
    client-error branch (ITS-REST Requests_and_responses.md §HTTP status codes,
    row 400 — "the service cannot or will not process the request due to
    something that is perceived to be a client error" — and §Error codes,
    "status code 400 indicates normally a bad request, as well as a generic
    client-side error, used when no other 4xx error code is appropriate").
    Silently preferring one form would execute a query against an EHR the client
    also named a different id for, which is a wrong clinical answer rather than
    a loud failure. Revisits only if a future ITS-REST release states a
    precedence.
  disposition: fixed_handling
AMB-60:
  ambiguity: >-
    ITS-REST 1.1.0 states two adjacent method SHOULDs whose antecedents overlap
    on the wire and gives no precedence between them: "A server receiving an
    unrecognized or unimplemented method SHOULD respond with the 501 Not
    Implemented status code. If a method is recognized but not allowed for the
    target resource, the response SHOULD be 405 Method Not Allowed status code."
    A request naming any method outside the six-method subset the same section
    tabulates satisfies BOTH antecedents at once — the method is unrecognized by
    the service AND not allowed for the target resource — so the released text
    licenses either code and states no tie-break. It also never says which
    applies when the method is unrecognized on a path the service does not
    route at all (404 vs 501), nor whether the target-resource test is even
    decidable before routing.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md §HTTP
    Methods (the method table listing GET/HEAD/POST/PUT/DELETE/OPTIONS as "the
    following subset is used in this specification", followed by the two
    quoted SHOULD sentences, with no precedence, no unknown-path rule, and no
    MUST on either branch) + §HTTP status codes (rows 404 "The origin service
    did not find the target resource", 405 "The method received in the
    request-line is known by the origin service but not supported by the target
    resource", 501 "The service does not support the functionality required to
    fulfill the request", and "Additional status codes MAY be used as long as
    they do not conflict with the predefined codes") — overlap and silence
    CONFIRMED first-hand. The section's own cited authority for method
    semantics is RFC 9110 (§15.5.6: "The origin server MUST generate an Allow
    header field in a 405 response containing a list of the target resource's
    currently supported methods"; §10.2.1: "An empty Allow field value
    indicates that the resource allows no methods, which might occur in a 405
    response if the resource has been temporarily disabled by configuration").
  handling: >-
    Fixed handling: a request to a KNOWN resource path whose method that
    resource does not serve is answered 405 Method Not Allowed with the openEHR
    error body, for EVERY method — recognized (TRACE, PATCH, an unrouted
    GET/POST/PUT/DELETE) and unrecognized (an arbitrary token) alike — and the
    405 always carries the Allow header RFC 9110 §15.5.6 makes mandatory, either
    the matched path's served-method list or, for a resource turned off by
    configuration, the empty field value of RFC 9110 §10.2.1. The 501 branch is
    NOT abandoned: it is emitted for the other half of the same section, a
    recognized operation the service does not implement. Grounds for choosing
    405 over 501 on the overlap: both sentences are SHOULD, so neither is
    violated by satisfying the other; an unrecognized method IS also "not
    allowed for the target resource", so 405 is a direct reading of the second
    sentence; 405 is a predefined code in the same document's status table and
    therefore cannot conflict with it; and the only mechanism that could reach
    a blanket 501 — a catch-all method fallback ahead of path routing — would
    equally capture requests to paths the service does not route at all and
    report them 501, contradicting the 404 row for a resource the origin
    service "did not find". A 405 without Allow is non-conformant under either
    reading and is the one outcome this entry forbids. Not executable in the
    catalogue today: the binding request model's method vocabulary is closed to
    {GET, POST, PUT, DELETE, HEAD} (no seam for a wrong-but-known or arbitrary
    method on a known path) and the outcome taxonomy has no
    method_not_allowed kind — the assertion half is no longer a blocker
    (header matchers and body selectors are both EXECUTED assertions now,
    exec/headers.rs and exec/bodies.rs), so the boundary
    is carried as the cited vocab/wire_surface.yaml elements
    method-405-allow-header and method-501-unrecognized-method-deviation.
    Revisits if a future ITS-REST release raises either sentence to a MUST or
    states a precedence.
  disposition: fixed_handling
AMB-61:
  ambiguity: >-
    Whether a service accepts or serves the LEGACY / experimental alternative
    data formats is implementation-defined. ITS-REST 1.1.0 enumerates them
    ("Legacy or experimental formats: application/openehr.nc.flat+json based on
    the ECISFLAT format, application/openehr.tds2+xml for TDS simplification of
    RM as XML, …") but mandates none of them: "Services MUST support at least
    one of the openEHR XML or JSON canonical formats for resource
    representation. Additionally, the Simplified Formats format SHOULD be
    supported, while other alternative formats MAY be supported as well,
    depending on the use case." The released text also warns the set is
    unstable — "Some of these formats might not be supported once they become
    obsolete or superseded by newer formats" — so neither support nor refusal
    can be asserted unconditionally. What the text DOES fix is the refusal
    shape once a service does not support a type: an unprocessable request
    payload is 415 and an unfulfillable Accept is 406.
  source: >-
    ITS-REST specifications/docs/overview/Resources.md §Alternative data
    formats (the legacy/experimental list) + §Data representation (canonical
    MUST, Simplified SHOULD, "other alternative formats MAY be supported as
    well") + §Simplified Formats ("If the service cannot process the request
    payload as the simplified format is not supported, it MUST respond with
    HTTP status code 415 Unsupported Media Type"; "If the service cannot
    fulfil this aspect of the request, it MUST respond with HTTP status code
    406 Not Acceptable") + §XML Format / §JSON Format (the same 415/406 MUSTs
    for the canonical types) — MAY-level support and MUST-level refusal shape
    CONFIRMED first-hand.
  handling: >-
    Sibling cases carry option tags; the ICS options declaration selects which
    applies — the declared behaviour MUST pass, the undeclared sibling is
    not-applicable. The legacy-alt-formats-unsupported branch is executable
    today: SF-LEGACY-nc_flat_media_unsupported expects unsupported_media (415)
    for a commit declaring application/openehr.nc.flat+json, and
    SF-LEGACY-tds2_accept_unsupported expects not_acceptable (406) for an
    Accept of application/openehr.tds2+xml. The legacy-alt-formats-supported
    branch has no case: the released text defines neither a canonical mapping
    nor a schema for either legacy representation ("based on the ECISFLAT
    format" / "see this wiki page" are the only pointers, both outside the
    specification), so there is nothing spec-grounded to assert about a
    successful exchange — the tag exists so a supporting SUT declares itself
    out of the unsupported branch rather than failing it. Distinct from AMB-39,
    which governs the DEPRECATED pre-1.1.0 SDT-era .schema+json types
    (superseded equivalents of a CURRENT format, not legacy formats of their
    own).
  disposition: option_select
  options: [legacy-alt-formats-supported, legacy-alt-formats-unsupported]
AMB-62:
  ambiguity: >-
    The `Prefer: return=minimal` branch — which is ALSO the assumed default
    when no `Prefer` is sent — has no assigned response status. The released
    text offers two sentences for the same exchange and neither assigns one:
    "The HTTP status is typically `201 Created`" is descriptive ("typically",
    not a MUST or a SHOULD), and "If no response body is returned, the service
    SHOULD use `204 No Content`" is conditional on whether a body is returned,
    a fact the same text never assigns either. So a conformant minimal write
    may answer 201 or 204 and the text distinguishes neither, on any write
    operation.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md §"Prefer
    minimal, identifier or full representation response" ("`Prefer:
    return=minimal` Indicates the client prefers a minimal response. The
    response SHOULD include a `Location` header pointing to the newly created
    or updated resource. The HTTP status is typically `201 Created`. If no
    response body is returned, the service SHOULD use `204 No Content`.") +
    §Representation details negotiation ("If no `Prefer` header is provided,
    the default behavior is assumed to be `return=minimal`") — the absence of
    a status assignment CONFIRMED first-hand. Contrast the SIBLING preference,
    which IS assigned: §"Prefer only identifier" fixes "the status will be
    `201 Created` or `200 OK`, never `204 No Content`".
  handling: >-
    No case pins the minimal status, and no binding declares a minimal
    outcome — not even one carrying an alt_status pair. Accepting {201, 204}
    would still be an authored expectation assembled from a descriptive
    adverb plus a conditional SHOULD, which is the invention the attribution
    law forbids; the honest position is that the branch has no assertable
    status at all. What the branch DOES assign is asserted elsewhere: the
    `Location` SHOULD is executed on the create outcomes
    (wire_surface `header-location-on-create`), and the body selector
    `prefer_conditional` deliberately never judges the minimal branch. The
    default-when-absent half is exercised indirectly by the bindings that send
    no `Prefer` (I_DEFINITION_ADL2.upload_artefact reads its identifier back
    from `Location`). Carried as the cited wire_surface element
    `header-prefer-return-minimal`. Activates as a gating case when a future
    ITS-REST release fixes the minimal status, or when the case model gains an
    either-status expectation grounded in the two sentences (extension only by
    schedule release).
  disposition: fixed_handling
AMB-63:
  ambiguity: >-
    One-EHR-per-subject is neither defined nor denied by the released sources,
    and three sub-questions follow from that silence. (a) THE KEY: no released
    sentence says which parts of the subject reference are compared, nor how —
    whether `PARTY_REF.type` participates, and whether `id.value` /
    `namespace` are matched byte-for-byte or folded (BASE gives a case rule for
    composite IDENTIFIERS, not for a demographic id borne inside a
    PARTY_SELF). (b) THE SCOPE: SM i_ehr_service.adoc declares the error
    `ehr_for_subject_already_exists` on `create_ehr_for_subject` but NOT on
    `create_ehr_for_subject_with_id`, whose error list carries only
    `ehr_create_fail_duplicate_id` — so whether the refusal reaches the
    client-supplied-id create path is unstated in both directions. (c) THE
    MULTIPLICITY: the same interface's `get_ehrs_for_subject` returns a
    `List<EHR_SUMMARY>` and reads "Retrieve EHR or EHRs that have
    `ehr_status.subject_id` = supplied subject id", and `has_ehr_for_subject`
    reads "Returns True if there are EHR(s) for `_a_subject_id_`" — plural
    readings that contradict a one-EHR-per-subject rule outright, while the
    ITS-REST subject read is a single-EHR resource.
  source: >-
    SM i_ehr_service.adoc §create_ehr_for_subject (error
    `ehr_for_subject_already_exists`) vs §create_ehr_for_subject_with_id (only
    `ehr_create_fail_duplicate_id`) vs §get_ehrs_for_subject ("Retrieve EHR or
    EHRs …": `List<EHR_SUMMARY>`) and §has_ehr_for_subject ("there are EHR(s)")
    + RM ehr EHR_STATUS class §Attributes (`subject`: 1..1 PARTY_SELF, "The
    subject of this EHR. The `_external_ref_` attribute can be used to contain
    a direct reference to the subject in a demographic or identity service" —
    no uniqueness, no comparison rule) + the released ITS-REST docs text, which
    never mentions a subject at all (grep of
    specifications/docs/**: zero hits) — silence CONFIRMED first-hand.
  handling: >-
    Fixed handling, and the parts of it that rest on nothing released are
    flagged as such rather than dressed up as spec. (a) THE KEY is the
    EHR_STATUS.subject.external_ref pair (`id.value`, `namespace`), compared
    EXACTLY — byte-for-byte, no case folding, `type` not part of the key. No
    openEHR spec governs this — our own design/extension: a demographic
    identifier is opaque to the CDR, so two spellings that a demographic
    service might reconcile are two different subjects here, and folding them
    would silently merge two patients' records, the wrong-clinical-answer
    failure mode. Explicitly NOT the BASE composite-identifier case rule
    (base_types master05 §Composite Identifiers and Case), which governs
    OBJECT_VERSION_ID-shaped ids, not a demographic id. (b) THE SCOPE: the
    refusal is carried to EVERY create path, the client-supplied-id form
    included — the with-id operation's text does not lift it, and a rule that
    a client could evade by choosing its own uuid would not be a rule.
    Because that carry is not stated, the case resting on it
    (I_EHR_SERVICE.create_ehr-with_ehr_id_subject_taken) is kept at OPTIONS,
    reported and never gating — the AMB-58 treatment. The id-less path's
    refusal IS stated and stays gating
    (I_EHR_SERVICE.create_ehr-two_ehrs_same_patient). (c) THE MULTIPLICITY
    question does not arise under (b): at most one EHR ever matches, so the
    single-EHR ITS-REST subject read is never asked to choose among several,
    and no case asserts a multi-match shape. The wire cannot distinguish an
    id-duplicate from a subject-duplicate either — both are the 409 of
    Requests_and_responses.md §HTTP status codes ("Indicates that the request
    could not be processed because it might generate a duplicate or a
    conflict") — so the two share the `already_exists` outcome kind and are
    told apart by CASE, never by expectation. Revisits if a future release
    states the key, the scope, or admits several EHRs per subject.
  disposition: fixed_handling
AMB-64:
  ambiguity: >-
    Whether the `Last-Modified` SHOULD reaches the EHR resource is left open by
    the scope sentence itself. The header is SHOULDed "for VERSION,
    VERSIONED_OBJECT, or other resources that have versioning or unique state
    identifiers" — and an EHR is neither a VERSION nor a VERSIONED_OBJECT: it
    is a root object that is not versioned at all (RM ehr EHR class carries no
    uid/version attributes, only `ehr_id` and `time_created`). Whether it
    qualifies under the open-ended third limb turns on reading "unique state
    identifiers", which the document never defines. The companion sentence
    compounds it: the value "should be derived from
    `VERSION.commit_audit.time_committed.value`", and the EHR resource has no
    VERSION of its own to derive it from.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md §"ETag and
    Last-Modified" ("Both `ETag` and `Last-Modified` SHOULD be included in
    responses for VERSION, VERSIONED_OBJECT, or other resources that have
    versioning or unique state identifiers"; "For openEHR resources, this value
    should be derived from VERSION.commit_audit.time_committed.value") + RM ehr
    EHR class §Attributes (`ehr_id` 1..1 HIER_OBJECT_ID, `time_created` 1..1
    DV_DATE_TIME — no uid, no version identity; the EHR is not a
    change-controlled resource) — the undefined third limb and the missing
    derivation source CONFIRMED first-hand.
  handling: >-
    Fixed handling, split by whether a real derivation source exists for the
    exchange. On EHR CREATION (POST /ehr and PUT /ehr/{ehr_id}) the header is
    asserted present: the creation commits an EHR_STATUS under a CONTRIBUTION
    ("the result should be a root EHR object, an EHR Status object, and an EHR
    Access object … created and committed in a Contribution" — RM ehr master04
    §EHR Creation), so a genuine
    `VERSION.commit_audit.time_committed.value` exists and the second sentence
    is satisfiable exactly as written. On an EHR READ (GET /ehr/{ehr_id}, GET
    /ehr?subject_id=…) the header is declared NEITHER present NOR absent: a
    read of the non-versioned root has no commit instant of its own, the third
    limb is undefined, and both asserting and forbidding the header would
    resolve the scope question privately. The sibling `ETag` is unaffected —
    §"ETag and Last-Modified" names "EHR.ehr_id.value" among the identifiers it
    may carry, so it is asserted on EHR reads and writes alike. Revisits if a
    future ITS-REST release defines the third limb or names a derivation source
    for non-versioned resources.
  disposition: fixed_handling
AMB-65:
  ambiguity: >-
    Two RELEASED sources contradict each other on the FORM of the uid copied
    into a top-level object. The RM says copy the leading Guid only: the
    `_uid_` of a top-level type is set "to a copy of the `_uid.object_id()_`
    value of the owning `VERSION` object … i.e. the leading Uid, which is
    normally a Guid", worked through as
    `87284370-…::uk.nhs.ehr1::2` -> `87284370-…` — a HIER_OBJECT_ID. The
    ITS-REST docs text says copy the whole three-part identifier: the inherited
    `uid` "be populated using the `uid` copied from the enclosing VERSION
    object", worked through as `87284370-…::uk.nhs.ehr1::2` ->
    `87284370-…::uk.nhs.ehr1::2` — an OBJECT_VERSION_ID. The two rules take the
    SAME example value and produce different results, and both are stated as
    recommendations for the same attribute. LOCATABLE.uid is a UID_BASED_ID, so
    both forms are type-legal and the model itself does not arbitrate.
  source: >-
    RM common master03-archetyped_package.adoc §Unique Node Identification
    ("The exception is the top-level types such as `COMPOSITION`, `EHR_STATUS`,
    `PARTY` etc for which it is recommended to set the `_uid_` value to a copy
    of the `_uid.object_id()_` value of the owning `VERSION` object (usually an
    `ORIGINAL_VERSION`), i.e. the leading Uid, which is normally a Guid …
    the Guid `87284370-2D4B-4e3d-A3F3-F303D2F4F34B` would be copied to the
    contained `COMPOSITION.uid` field") and RM ehr EHR_STATUS class §Description
    (restates the object_id()-only WORDING for EHR_STATUS while its own worked example copies the FULL three-part value — the sentence contradicts its example, siding with ITS-REST) vs ITS-REST
    specifications/docs/overview/Resources.md §Identifier types ("Since RM
    Release 1.0.4 it is strongly recommended that the inherited `uid` attribute
    in COMPOSITION objects be populated using the `uid` copied from the
    enclosing VERSION object. For example, if an ORIGINAL_VERSION.uid is
    `87284370-2D4B-4e3d-A3F3-F303D2F4F34B::uk.nhs.ehr1::2`, then this value
    should be copied to the COMPOSITION.uid attribute") + RM common
    locatable.adoc §Attributes (`uid`: UID_BASED_ID 0..1 — both forms legal) —
    released-vs-released contradiction CONFIRMED first-hand.
  handling: >-
    Fixed handling: on the wire the served top-level object carries the FULL
    three-part OBJECT_VERSION_ID, the ITS-REST form. Grounds, all from the same
    released ITS-REST chapter that states the rule: §Identifier types builds
    the addressing model on that value — "the COMPOSITION identifier
    `8849182c-…::openEHRSys.example.com::1`, taken from COMPOSITION.uid.value,
    which also implies that the VERSIONED_OBJECT identifier is `8849182c-…` and
    the latest version is `1`" — so the served body's uid is what a client
    parses the version address out of, and §Multiple identifiers for the same
    resource then derives BOTH the explicit-version and implicit-latest request
    forms from it. Truncating to the object_id would delete the version
    coordinate the wire depends on, while the RM form remains recoverable from
    the full one (it is its first segment), so the ITS-REST reading loses no
    information and the RM reading does. This is a wire-representation
    question, and the ITS-REST docs text is the wire oracle. Flips only if a
    future release aligns the two sentences the other way.
  disposition: fixed_handling
  upstream_ref: "UPR-27"
AMB-67:
  ambiguity: >-
    Whether the CONTAINED top-level object served inside an ORIGINAL_VERSION
    envelope must carry a populated `uid` at all is required by NO released
    sentence: RM common locatable.adoc §Attributes types `uid` as
    UID_BASED_ID 0..1; RM common master03-archetyped_package.adoc §Unique
    Node Identification calls the copy "recommended" and adds "The `uid`
    attribute will usually be empty in most EHR data in most openEHR EHR
    systems"; the ITS-REST Resources.md §Identifier types note is
    COMPOSITION-scoped and "strongly recommended"/"should". A server that
    serves the contained object uid-less breaches nothing released.
  source: >-
    RM common locatable.adoc §Attributes (uid 0..1); RM common
    master03-archetyped_package.adoc §Unique Node Identification
    (recommended; "will usually be empty"); ITS-REST
    specifications/docs/overview/Resources.md §Identifier types (COMPOSITION
    scope, "strongly recommended … should be copied") — all
    recommendation-strength, confirmed first-hand.
  handling: >-
    Report-only: the contained-uid-form case exercises the behaviour and
    records the outcome without gating any tier — presence is a
    recommendation this server ADOPTS (commit-time stamping, #439) but no
    conformant server can be failed for omitting. The FORM when present
    stays the gating AMB-65 fixed handling. Reported upstream (UPR-29): the
    recommendation's scope and strength deserve an explicit wire-level
    statement for the non-COMPOSITION top-level types.
  disposition: report_only
  upstream_ref: "UPR-29"
AMB-66:
  ambiguity: >-
    The SM precondition `Pre_no_subject`: `an_ehr_status.subject = Void`, on
    `create_ehr` and `create_ehr_with_id`, is unsatisfiable and contradicts
    three released sources at once — including the paragraph directly beneath
    it. (1) RM: `EHR_STATUS.subject` is 1..1 PARTY_SELF, so a supplied
    EHR_STATUS whose subject is Void is not a valid EHR_STATUS at all and the
    precondition can never hold for a non-null argument. (2) The SM's own
    prose, two lines below the precondition: "A default `_subject_` will be
    generating containing a `PARTY_SELF` object" — describing a subject that
    exists, not one that is Void. (3) ITS-REST: the released API surfaces no
    for-subject create endpoint, so the EHR_STATUS body of POST /ehr and PUT
    /ehr/{ehr_id} is the ONLY way a client can ever give an EHR a subject;
    enforcing the precondition would make subject-bearing EHRs uncreatable over
    the released wire, and would strand the subject-keyed reads the same SM
    interface defines (`get_ehrs_for_subject`, `has_ehr_for_subject`).
  source: >-
    SM i_ehr_service.adoc §create_ehr and §create_ehr_with_id
    (`Pre_no_subject`: `an_ehr_status.subject = Void`, immediately followed by
    "A default `_subject_` will be generating containing a `PARTY_SELF`
    object") vs RM ehr EHR_STATUS class §Attributes (`subject`: 1..1
    PARTY_SELF — "The subject of this EHR") vs the released ITS-REST EHR API
    (no for-subject create operation; the optional EHR_STATUS body is the only
    subject-bearing input) — contradiction CONFIRMED first-hand.
  handling: >-
    Fixed handling: `Pre_no_subject` is treated as a released SM defect and is
    NOT enforced. A create carrying an EHR_STATUS with a subject is accepted
    and the subject becomes the EHR's subject, which is the only reading under
    which the same interface's subject-keyed operations
    (`create_ehr_for_subject`, `get_ehrs_for_subject`, `has_ehr_for_subject`)
    have anything to read, and the only one reachable over the released wire.
    Every subject-keyed case in the catalogue supplies its subject exactly that
    way (I_EHR_SERVICE.create_ehr-two_ehrs_same_patient,
    -existing_ehr_by_subject_id, -with_ehr_id_subject_taken), so the deviation
    is exercised rather than merely declared. No case asserts the
    precondition's rejection branch — a conformant server refusing a
    subject-bearing create would satisfy the SM sentence while failing the RM
    cardinality and the wire, and the catalogue does not test a server into a
    defect. Revisits when the SM drops or restates the precondition.
  disposition: fixed_handling
  upstream_ref: "UPR-28"
