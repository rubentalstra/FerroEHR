AMB-27:
  ambiguity: >-
    BASE-grounded correction: the master17.3 DV_INTERVAL<DV_TIME> range table
    verdicts a domain-constraint rejection (C_TIME.range on lower) for a row
    whose lower bound is absent with lower_unbounded=true — underivable, since
    BASE Interval carries no invariant making a bound-value constraint bite on
    an absent optional limit (the four-invariant set does not require a bound
    value when *_unbounded is false). Guide-quality CNF-internal table typos
    recorded WITHOUT an upstream report: the accepted/[] contradiction near the
    proportion tables; the millisecond-validity column omission; the "different
    limit types" unitary wording on a type=0 (ratio) row; the integer_fraction
    prose type [3] vs data column [4]; the forum-style "IMO should fail" notes.
  source: >-
    BASE foundation_types interval.adoc §Invariants (the four-invariant set —
    Lower_included_valid / Upper_included_valid / Limits_consistent /
    Limits_comparable — none requires a bound value on an absent
    unbounded-flagged limit); the master17.3 quantity decision tables are the
    stalled guide where the defect appears
  handling: >-
    Rows are encoded verbatim where the verdict is unambiguous; the
    contradiction rows follow the data column (verdict cell wins over
    prose); the forum-note rows keep the stated verdict with the note kept
    as case commentary; the constraint-on-absent-unbounded-bound row is
    corrected to accepted with the BASE interval-invariant citation (the
    reported correction). The remaining master17.3 table typos are
    guide-quality observations recorded with the chapter conversion only, NOT
    part of the upstream report.
  disposition: editorial
  upstream_ref: "UPR-08"
