  source: "CNF platform_test_schedule master04 (validate_opt cases + NOTE) vs SM docs/UML/classes/i_definition_adl14.adoc; ITS-REST specifications/operations (no validate endpoint)"
  handling: >-
    Case ids keep the schedule's validate_opt family; sm_operation carries the
    resolvable valid_opt; validation is realized via upload per the master04
