AMB-51:
  ambiguity: >-
    Two master16 HISTORY cells contradict the RM Events_valid invariant: the
    CONT-HIST-events_card_any-summary_ex_opt table (row 1) and the
    CONT-HIST-events_card_opt-summary_ex_opt table (row 1) both verdict
