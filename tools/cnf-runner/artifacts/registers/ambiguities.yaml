  disposition: fixed_handling
AMB-25:
  ambiguity: >-
    Creating a directory on an EHR that already has one carries no assigned
    status code in the directory_create OAS (the DIRECTORY analogue of the
    AMB-21 create-side gap).
  source: "ITS-REST specifications/operations/directory_create.yaml vs CNF platform_test_schedule master09 (create_directory on an EHR with a directory)"
  handling: "Bind already_exists -> 409 (the uniqueness/state-conflict family); flag for upstream code assignment."
  disposition: fixed_handling
AMB-26:
  ambiguity: >-
    Updating or deleting the directory of an EHR that has none overloads the
    unknown-ehr 404 — the OAS assigns no distinct code to the
    missing-directory precondition.
  source: "ITS-REST specifications/operations/directory_update.yaml + directory_delete.yaml vs CNF platform_test_schedule master09 (update/delete on an EHR without a directory)"
  handling: >-
    Bind not_found -> 404 for the missing-directory precondition; kind
    distinguished by the case's provisioned state. Supplied-stale-If-Match
    precedence: the directory update/delete wire REQUIRES If-Match, so the
    empty-EHR cases send a synthetic value; the overview's If-Match-false
    MUST-412 does not fire because HTTP conditional-request precedence
    (RFC 9110 §13.2.2) ignores received preconditions when the response to
    the same request without them would be neither 2xx nor 412 — the
    missing directory answers 404 unconditioned, so 404 stands (a 412
    here is the non-conformant reading).
  disposition: fixed_handling
AMB-27:
  ambiguity: >-
    master17.3 table editorial defects, enumerated: an accepted row whose
    violates cell names a violation (the accepted/[] contradiction near the
    proportion tables); a millisecond-validity column omission in the
    date/time validity tables; the "different limit types" rows label a
    type=0 (ratio) proportion with unitary wording; the integer_fraction
    prose says type [3] while the data column says [4]; several
    interval-of-date/time/duration rows carry a forum-style "IMO should
    fail" note instead of a normative verdict; the DV_INTERVAL<DV_TIME>
    range table verdicts a domain-constraint rejection (C_TIME.range on
    lower) for a row whose lower bound is absent with lower_unbounded=true
    — underivable, since no AOM clause makes a domain constraint bite on an
    absent optional attribute (AOM1.4 master04 §existence: the existence
    constraint alone says whether the object is there at all).
  source: "CNF platform_test_schedule master17.3 (quantity decision tables)"
  handling: >-
    Rows are encoded verbatim where the verdict is unambiguous; the
    contradiction rows follow the data column (verdict cell wins over
    prose); the forum-note rows keep the stated verdict with the note kept
    as case commentary; the constraint-on-absent-unbounded-bound row is
    corrected to accepted with the AOM citation. Upstream editorial fixes
    proposed with the chapter conversion.
  disposition: editorial
AMB-28:
  ambiguity: >-
    master17.1/17.2/17.4 table editorial defects, enumerated: the DV_BOOLEAN
    only_false_allowed table's first row is internally inconsistent
    (expected=accepted while naming a violated constraint); master17.2
    carries a duplicate DV_TEXT validate_open heading (two tables under one
    id); the DV_DURATION fields_range table carries C_DURATION clause-name
    typos and a period-vs-comma multi-violation cell.
  source: "CNF platform_test_schedule master17.1/17.2/17.4 (basic/text/date_time decision tables)"
  handling: >-
    Rows encoded verbatim where the verdict is unambiguous; the inconsistent
    DV_BOOLEAN row resolves to the AOM-derivable verdict (rejected — AOM1.4
    C_BOOLEAN.true_valid=false disallows true; the violates cell wins over
    the verdict cell there); the duplicate DV_TEXT heading is
    one case with the two tables merged (distinguished by the pattern
    column). Upstream editorial fixes proposed with the chapter conversion.
  disposition: editorial
AMB-29:
  ambiguity: >-
    Reduced-precision temporal comparability is under-specified (SPECPR-380,
    open upstream; RM DV_ORDERED comparison for partial dates/times) — the
    date/time constraint tables mix precisions whose ordering the RM leaves
    open.
  source: "CNF platform_test_schedule master17.4 (temporal constraint tables); RM data_types (DV_ORDERED); upstream SPECPR-380"
  handling: >-
    Affected rows carry guards quoting the chapter NOTEs; verdicts on
    mixed-precision comparisons are reported but excluded from profile
    computation until SPECPR-380 resolves.
  disposition: report_only
AMB-30:
  ambiguity: >-
    Rejection of AQL constructs outside the defined language is spec-silent:
    QUERY AQL defines the grammar and the TERMINOLOGY() usage forms, but no
    clause forbids a server from accepting a dialect superset (a removed
    construct such as TIMEWINDOW, a non-grammar clause order, or an undefined
    TERMINOLOGY() form). Interoperability argues for rejection; the spec does
    not mandate it.
  source: "QUERY AQL (grammar; §TERMINOLOGY; Amendment Record SPECQUERY-20) vs ITS-REST query 400_Query (defined only for invalid AQL)"
  handling: >-
    Dialect-extension rejection cases carry this entry and are report_only:
    verdicts are reported per SUT but never gate profile computation, until
    upstream rules on superset acceptance. Genuinely malformed queries with
    no possible interpretation (e.g. missing FROM) remain gating. SPECQUERY
    candidate.
  disposition: report_only
AMB-31:
  ambiguity: >-
    The SM defines no template-example-generation or web-template
    representation operation: ITS-REST 1.1.0 serves GET
    /definition/template/adl1.4/{template_id}/example and the web-template
    representation (application/openehr.wt+json), but I_DEFINITION_ADL14
    only defines get_opt/list_opts et al.
  source: "SM docs/UML/classes/i_definition_adl14.adoc vs ITS-REST specifications/operations (template example + web template)"
  handling: >-
    The example endpoint binds as a variant of the genuine get_opt anchor
    (the AMB-13 rule: official ground, resolvable SM operation); the
    web-template representation rides the negotiated get_opt binding.
    SPECPR candidate: add the example/web-template operations to the SM.
  disposition: fixed_handling
AMB-32:
  ambiguity: >-
    PARTY_RELATIONSHIP has no ITS-REST 1.1.0 wire: the DEVELOPMENT-stage
    Demographic API surfaces PERSON/ORGANISATION/GROUP/AGENT/ROLE resources
    but no PARTY_RELATIONSHIP endpoints, so the six SM relationship
    operations have no bindable realization.
  source: "SM docs/UML/classes/i_party_relationship.adoc + i_demographic_service.adoc vs ITS-REST specifications/operations (demographic_*: no relationship resource)"
  handling: >-
    The relationship cases are in the catalogue, active and SM-anchored; the
    its-rest bindings carry explicit unrealized declarations, so on ITS-REST
    1.1.0 they verdict as not-applicable with this citation. SPECPR/ITS-REST
    candidate.
  disposition: fixed_handling
AMB-33:
  ambiguity: >-
    The SM ADMIN component is almost entirely unrealized in ITS-REST 1.1.0:
    the only admin_* operations in the OAS are admin_ehr_delete and
    admin_ehr_delete_all (physical EHR deletion). I_ADMIN_SERVICE
    list_contributions / contribution_count / versioned_composition_count /
    composition_version_count / physical_party_delete, I_ADMIN_DUMP_LOAD
    export_ehrs, and I_ADMIN_ARCHIVE archive_ehrs / archive_parties have no
    wire.
  source: "ITS-REST specifications/operations (admin_ehr_delete, admin_ehr_delete_all only) vs SM docs/UML/classes/i_admin_service.adoc / i_admin_dump_load.adoc / i_admin_archive.adoc; CNF platform_test_schedule master12"
  handling: >-
    The its-rest binding declares each unwired admin operation unrealized;
    the master12 cases anchored to them are not-applicable WITH CITATION on
    ITS-REST 1.1.0 and activate when a later ITS release adds the endpoints.
    The one realized operation (physical_ehr_delete -> admin_ehr_delete)
    carries a full binding.
  disposition: fixed_handling
AMB-34:
  ambiguity: >-
    The SM MESSAGE component has NO realization in ITS-REST 1.1.0: there is
    no MESSAGE / EHR-Extract / TDD API (no message_*/extract_*/tdd_*
    operations in the OAS). I_EHR_EXTRACT_SERVICE (export_ehrs,
    export_ehr_extracts, import_ehr, import_ehr_extract) and I_TDD_SERVICE
    (import_tdd, import_tdds) are entirely unwired. Separately, master13
