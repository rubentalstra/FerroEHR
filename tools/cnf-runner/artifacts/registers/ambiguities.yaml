  source: "SM docs/UML/classes/i_definition_query.adoc (valid_query; store_query Pre_valid_query) vs ITS-REST specifications/operations definition_query_store.yaml"
  handling: >-
    Realized via store_query (its precondition is is_valid_query): a valid
    text stores, an invalid text or unsupported formalism is rejected.
  disposition: fixed_handling
AMB-19:
  ambiguity: >-
    The SM I_DEFINITION_QUERY.has_query operation (Boolean) has no dedicated
    ITS-REST existence endpoint.
  source: "SM docs/UML/classes/i_definition_query.adoc (has_query) vs ITS-REST specifications/operations definition_query_list.yaml"
  handling: "Realized via the list-by-name GET: a non-empty result set is the positive return."
  disposition: fixed_handling
AMB-20:
  ambiguity: >-
    The SM I_DEFINITION_QUERY.list_queries pagination parameters
