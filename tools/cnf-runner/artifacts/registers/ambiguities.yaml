    resource this API does not have.
    Our own `/demographic/party_relationship/**` routes are the honest boundary
    realization of SM `I_PARTY_RELATIONSHIP`: no openEHR spec governs them —
    our own extension. The demographic invariant defects those routes would have
    to enforce are AMB-130.
    REALIZATION RE-DERIVED 2026-07-28 (#623), and the handling above is
    SUPERSEDED on exactly one point. The missing released wire is CONFIRMED
    unchanged, first-hand: the ITS-REST docs text names no PARTY_RELATIONSHIP
    resource anywhere under specifications/docs/demographic/**, and
    specifications/demographic.openapi.yaml declares twenty-seven paths, none of
    them `/demographic/party_relationship*`. What changed is what the CATALOGUE
    does about it. Parking a CLAIMED capability as "not-applicable with
    citation" was a certification hole: ISO/IEC 9646 test selection legitimizes
    N/A only for a capability a party does NOT claim, and this party claims
    PartyRelationshipOperations. So the six SM relationship operations now carry
    EXTENSION bindings (`extension:` blocks naming the `party-relationship`
    served_extensions family) onto the routes this product actually serves, and
    the fifteen-case battery EXECUTES. The scoping the old wording achieved by
    keeping the bindings unrealized is now MACHINE-ENFORCED instead of
    conventional: the `realization-scope` gate fences an extension binding off
    from every released-wire judgement and requires the capability row to carry
    `realization: extension`, which the matrix model forbids from ever being
    `required`. So it remains true that NO openEHR profile tier and NO ITS-REST
    wire-conformance claim rests on these routes — the difference is that the
    capability is now TESTED as product function rather than excused.
  disposition: fixed_handling
  upstream_issue: 1495
AMB-33:
  ambiguity: >-
    The ADMIN surface has realization gaps in BOTH directions. SM→ITS: of the
    ten operations the three SM admin interfaces declare, the released wire
    realizes ONE. `I_ADMIN_SERVICE` `list_contributions` / `contribution_count`
    / `versioned_composition_count` / `composition_version_count` /
    `physical_party_delete`, `I_ADMIN_DUMP_LOAD` `export_ehrs` / `load_ehrs`,
    and `I_ADMIN_ARCHIVE` `archive_ehrs` / `archive_parties` have no endpoint at
    all. ITS→SM (WIDENED 2026-07-27, group-14 audit): the released
    `admin_ehr_delete_all` — `DELETE /admin/ehr/all{?ehr_id*}`, half the whole
    released Admin API — realizes NO SM operation, and this direction was
    previously invisible because the surface gate is keyed on SM operations.
    The only SM operation it could plausibly answer to is
    `physical_ehr_delete`, which takes `an_ehr_id: UUID [1]` — exactly one
    mandatory id, no list form and no all-EHRs form — so it cannot express
    either the unfiltered call or the multi-id subset. The two `I_ADMIN_ARCHIVE`
    operations DO take `List<UUID> [0..1]` with the same optional-means-all
    shape, but they ARCHIVE ("Move selected EHRs to archival storage"), which is
    the opposite of destroying them. Nothing else in SM is set-scoped. This is
    an ITS→SM gap of the AMB-136 class: a released wire behaviour with no
    service-model anchor to name it by.
  source: >-
    SM UML/classes/i_admin_service.adoc (six operations, incl.
    §physical_ehr_delete's single `an_ehr_id: UUID [1]` parameter),
    i_admin_dump_load.adoc (export_ehrs, load_ehrs), i_admin_archive.adoc
    (§archive_ehrs "Move selected EHRs to archival storage", `ehr_ids:
    List<UUID> [0..1]`; §archive_parties) and
    docs/openehr_platform/master15-admin_service.adoc (the chapter includes
    exactly i_admin_service, i_admin_archive, i_admin_dump_load,
    dump_load_fail_report, export_spec — there is no set-scoped delete
    interface anywhere in SM) vs the released ITS-REST 1.1.0 admin API —
    specifications/admin.openapi.yaml (exactly two paths:
    `/admin/ehr/{ehr_id}` and `/admin/ehr/all{?ehr_id*}`) +
    operations/admin_ehr_delete.yaml + operations/admin_ehr_delete_all.yaml
    ("Deletes all or multiple EHRs, or a specified subset of EHRs identified
    using the `ehr_id` query parameter") + parameters/query/ehr_id_Admin.yaml
    ("An optional parameter to perform the operation on a subset of EHRs") —
    ALL CONFIRMED first-hand.
  handling: >-
    Report both directions; neither is silently absorbed. SM→ITS: the its-rest
    binding declares each unwired admin operation `unrealized`, so the master12
    cases anchored to them are NOT-APPLICABLE WITH CITATION on this ITS and
    activate unchanged when a later release adds the endpoints (the AMB-17
    pattern). ITS→SM: the bulk route is anchored to `I_ADMIN_SERVICE.physical_ehr_delete`
    under `variant: delete_all` — the closest SM operation, since what the route
    performs on each targeted EHR is exactly that operation — and that is a
    CATALOGUE NAMING CONVENTION, NOT a claim that SM defines a set-scoped
    delete, exactly as AMB-127 anchors the stored-query single-definition read
    and AMB-136 the demographic contribution routes. The variant binding carries
    its own outcome map and its own cases, so the route is exercised and visible
    on the SM-keyed surface gate instead of falling through it. The one fully
    realized operation (`physical_ehr_delete` → `admin_ehr_delete`) keeps its
    variant-less binding. Reported upstream (#1496).
    CLAIMS RE-DERIVED 2026-07-28 (#623) for the four capabilities this entry
    excused — ActivityReport, EhrDumpLoad, EhrArchive, DemographicArchive. The
    two-path released Admin API is CONFIRMED unchanged first-hand, and the
    second half of the derivation decides the remedy: this product's OWN admin
    extension surface is exactly three routes (template delete,
    stored-query-version delete, the redacted config read — the
    `admin-extension-routes` family of vocab/wire_surface.yaml), so it serves
    no reporting, archive or dump/load route either. The SM operations behind
    them live at the service layer only
    (`ferroehr::service::admin::{statistics,archive,dump_load}`) and the CNF
    runner is a black-box HTTP instrument, so nothing can drive them. Excusing
    the four while the party CLAIMED them was a certification hole (ISO/IEC
    9646 legitimizes "not applicable" only for a capability a party does NOT
    claim), so the ferroehr statement withdraws all four claims. The cases
    and this entry stay; each becomes re-assertable the day the product serves
    its operations on declared extension routes.
    RE-ADJUDICATED 2026-07-29 (#637) — THAT DAY CAME for three of the four, and
    the withdrawal recorded above never took effect (the #623 convergence kept
    every claim, because an unclaimed required capability trips the static
    review). The released two-path Admin API is CONFIRMED unchanged first-hand
    once more; what changed is OUR side. The product now serves the SM
    reporting calls under /admin/report/ (the `admin-activity-report`
    served_extensions family) and the SM archive pair under /admin/archive/
    (the `admin-archive` family), each behind the same admin gate + RBAC Admin
    class as the released deletes. Their six SM operations carry EXTENSION
    bindings onto those routes, so ActivityReport, EhrArchive and
    DemographicArchive are EXECUTED rather than excused: their matrix
    evidence_exceptions are deleted and the rows carry
    `realization: extension`, which may never be `required` — no openEHR
    profile tier and no ITS-REST wire-conformance claim rests on any of it.
    EhrDumpLoad alone stays excused, and for a reason of its own rather than
    "no route": the SM `export_ehrs` signature carries
    `comp_fmt: COMPRESSION_FORMAT [0..1]` whose members `zip`/`7z`
    (compression_format.adoc) this product declares unbuilt, so a served route
    would REFUTE the catalogue's own export_formats case; and that case's
    `logical_fmt: canonical_json` / `enc_format: utf_8` literals are ungrounded
    against the vendored enumerations (export_format.adoc spells the member
    `openehr_canonical_json`; encoding_format.adoc is an EMPTY enumeration with
    no representable value at all). Both are real defects to fix, not reasons
    to bend anything.
    RE-ADJUDICATED 2026-07-29 (#659) — THE LAST ADMIN EXCUSE IS GONE. The
    two-path released Admin API is CONFIRMED unchanged first-hand once more:
    specifications/admin.openapi.yaml declares exactly admin_ehr_delete and
    admin_ehr_delete_all, and specifications/docs/admin/** describes EHR
    deletion only. Both blockers recorded above are FIXED rather than argued
    around.
    (1) THE SERVICE. `export_ehrs` now realizes the COMPRESSION_FORMAT member
    `zip`: the archive's entry set (manifest.json, segment-NNNN.json,
    blobs/<hex>) is identical in both containers and `zip` packs it into one
    `archive.zip`, which `load_ehrs` — passed no format at all, since
    i_admin_dump_load.adoc gives it `file_sys_loc` alone — DETECTS.
    RE-ADJUDICATED 2026-07-29 (owner approval): `7z` is now REALIZED too
    (`sevenz-rust2`, one `archive.7z` container over the identical entry set,
    detected by `load_ehrs` like the zip form), so COMPRESSION_FORMAT is
    realized in FULL and the `-compression_7z` case drives the member. The
    EXPORT_FORMAT member `openehr_canonical_xml` stays unrealized and answers
    `501 Not Implemented` (RFC 9110 §15.6.2 — "the server does not support
    the functionality required to fulfil the request"), never `400`: a valid
    SM enumeration member is not a malformed request. Its boundary is now
    DESIGN-shaped rather than dependency-shaped: the archive envelope
    (manifest/segments/records) is this product's own design with no XML
    story, so realizing the member means DESIGNING the canonical-XML archive
    form — tracked as its own issue, never invented ad hoc. THE SM IS SILENT
    on whether a service may realize a SUBSET of an enumeration: neither
    i_admin_dump_load.adoc nor export_spec.adoc requires every member, and
    the interface declares no unsupported-format error (its only error is
    `file_not_writable`). That silence is adjudicated HERE: the remaining
    boundary is DECLARED (the admin-dump-load served_extensions family and
    this entry name exactly which members are realized) and CASED NOWHERE,
    because a case for `openehr_canonical_xml` would assert this product's
    own refusal as spec behaviour. No expectation is bent in either
    direction.
    (2) THE CASE LITERALS, re-derived first-hand against the vendored
    enumerations. `canonical_json` -> `openehr_canonical_json`
    (export_format.adoc spells exactly `openehr_canonical_xml` and
    `openehr_canonical_json`). `comp_fmt: zip` STANDS — compression_format.adoc
    declares exactly `zip` and `7z`, so that literal was already a member.
    `enc_format: utf_8` is DELETED rather than corrected: encoding_format.adoc
    declares ENCODING_FORMAT with NO members at all, so no text names one. The
    derivable half of it became a case of its own — an argument outside its
    declared type is a `precondition_violation`, which the
    `-encoding_unrepresentable` case now drives.
    (3) THE WIRE. The product serves POST /admin/dump + POST /admin/load (the
    `admin-dump-load` served_extensions family) behind the same admin gate +
    RBAC Admin class as the released deletes. Both SM operations carry
    EXTENSION bindings, the six-case battery is EXECUTED, the
    evidence_exception is deleted and the matrix row is
    `realization: extension` — which may never be `required`, so no openEHR
    profile tier and no ITS-REST wire-conformance claim rests on any of it.
    The `load_ehrs` sm_operations off_wire exception in vocab/wire_surface.yaml
    is REMOVED with it (the operation now has a binding, and a stale exception
    is a finding). The schedule-guide boundary that entry recorded is noted
    here instead so it is not lost: CNF master12-func_tc_admin.adoc has a
    `=== Service Model operation:` section for NINE of the ten SM admin
    operations and NONE for load_ehrs — the stalled structural guide names no
    behaviour to cover for it, which is why the operation had no case before
    this wave rather than because of a coverage decision of ours. Its own
    released defect — declaring `file_not_writable` for a READ — stays
    register AMB-141(4).
    RE-ADJUDICATED 2026-07-29 (#670) — NO ENUMERATION MEMBER OF THE DUMP/LOAD
    SURFACE IS UNREALIZED ANY MORE, so the `501 Not Implemented` boundary
    recorded in (1) above is RETIRED, and with it its "cased NOWHERE" clause:
    `openehr_canonical_xml` now carries an export case (`-logical_format_xml`,
    `expect: ok`) and its own payload-form-detection LOAD case, the pair shape
    every COMPRESSION_FORMAT member already had. What the member MEANS is the
    part that needed adjudicating, and it splits the archive in two along the
    SM's own wording.
    (a) THE ENVELOPE STAYS JSON IN BOTH MEMBERS, and that is a derivation, not
    a shortcut. `export_spec.adoc` defines `logical_format` as "Logical format
    to use, i.e. flavour of XML, JSON etc." — the flavour of the exported
    CONTENT. The archive skeleton this product writes (manifest.json, the
    segment records of storage rows, blobs/) is storage-shaped and has NO
    XSD-conformant XML target to serialize into: a depth-checked enumeration of
    the top-level `xs:element` declarations across BOTH vendored ITS-XML
    lineages (`crates/openehr-its/schemas/xml/its-xml-1.0.2-nsv1` @ tag
    Release-1.0.2v2 `f7a93777` and `its-xml-2.0.0-nsv2` @ `de8b37ba`, which is
    upstream HEAD) finds document roots ONLY for `composition`, `extract`,
    `extract_request`, `versioned_object` (the Extract-flavoured
    X_VERSIONED_OBJECT), `items` and `version` — there is no global element for
    `EHR`, for `CONTRIBUTION`, or for a standalone `AUDIT_DETAILS` in either
    lineage. An XML envelope could therefore only be INVENTED, which is worse
    than this entry's standing position that no openEHR spec defines an on-disk
    archive format at all. Our own design/extension, unchanged in both members.
    (b) THE PAYLOADS DO HAVE A PUBLISHED FORM, so they follow the member.
    `its-xml-1.0.2-nsv1/ALL/Version.xsd` publishes
    `<xs:element name="version" type="VERSION"/>`, so each stored version
    externalizes to a `versions/<version_uid>.xml` entry holding a complete
    ORIGINAL_VERSION document (RM common master06 §Version and its Subtypes),
    reassembled by the SAME builder the served version read uses — an archived
    document and a served one are the same object, not two renderings of it.
    `<version>` is deliberately NOT the Extract-flavoured `versioned_object`
    (X_VERSIONED_OBJECT), which belongs to the EHR-Extract document family and
    would smuggle Extract structure into a dump. Because that XSD declares
    `<xs:complexType name="VERSION" abstract="true">`, the instance must name
    its concrete type with `xsi:type="ORIGINAL_VERSION"` (XML Schema Part 1
    §2.6.1 + §3.4.6, https://www.w3.org/TR/xmlschema-1/#xsi_type) — the reason
    the archive serializes through a declared-root entry point rather than the
    plain one, which would have written a document no schema accepts. A
    logically-deleted version stores no content, so it gets no document and no
    entry reference, symmetric with its null inline body.
    (c) LINEAGE. The archive always writes nsv1, the released-STABLE bundle the
    server also serves by default. The `version` media-type parameter that
    selects nsv2 is a WIRE negotiation with no counterpart on a file system,
    and neither `i_admin_dump_load.adoc` nor `export_spec.adoc` offers a place
    to express one (`ENCODING_FORMAT`, the only remaining EXPORT_SPEC axis, is
    an empty enumeration). Recorded here as a declared boundary, not a
    coverage gap.
    (d) CORRUPT PAYLOAD ENTRIES stay off the wire for the same reason every
    other corrupt-archive cause does — no operation writes arbitrary bytes to
    the SUT file system — and are proved in-process
    (app/ferroehr/tests/service_dump_load.rs). Their OUTCOME differs from a
    mangled manifest or segment, and that too is derived rather than chosen: a
    `versions/*.xml` entry belongs to exactly ONE EHR, so an unreadable one is
    precisely the per-entity shape `dump_load_fail_report.adoc` exists for
    ("Dump or Load fail report for a single entity, e.g. EHR, PARTY etc."),
    reported with `dump_status: false` and the record skipped whole; a manifest
    or a segment belongs to no single entity, so it stays the whole-operation
    `file_not_writable`.
  disposition: fixed_handling
  upstream_issue: 1496
AMB-34:
  ambiguity: >-
    The SM MESSAGE component has NO realization in ITS-REST 1.1.0: there is
    no MESSAGE / EHR-Extract / TDD API. I_EHR_EXTRACT_SERVICE (export_ehrs,
    export_ehr_extracts, import_ehr, import_ehr_extract) and I_TDD_SERVICE
    (import_tdd, import_tdds) are entirely unwired.
  source: >-
    SM i_ehr_extract_service.adoc / i_tdd_service.adoc / i_message_service.adoc
    (export/import_ehr(_extract), import_tdd(s) — define the operations; the
    vendored SM I_EHR_EXTRACT_SERVICE is the resolution oracle for the master13
    naming) vs released ITS-REST 1.1.0 (no MESSAGE / extract / tdd wire)
  handling: >-
    Every master13 case is anchored to a resolvable SM operation on
    I_EHR_EXTRACT_SERVICE / I_TDD_SERVICE and its its-rest binding is
    declared unrealized; the cases are not-applicable WITH CITATION on
    ITS-REST 1.1.0 and activate when a later ITS release adds a MESSAGE API.
    SM/ITS alignment candidate.
    CLAIMS RE-DERIVED 2026-07-28 (#623) for the three capabilities this entry
    excused — EhrExtract, Tds, MessageApi. The absence is CONFIRMED unchanged
    first-hand: the release publishes seven API groups (overview, system, ehr,
    demographic, query, definition, admin) and no message/extract/tdd group
    exists in either the docs text or the OAS. The second half of the
    derivation decides the remedy: `ferroehr::service::message` implements
    export/import/TDD, but NO route reaches it — the module's own doc comment
    expects an extension wire in `ferroehr-rest` that is not mounted — so the
    black-box runner has nothing to drive. Excusing the three while the party
    CLAIMED them was a certification hole (ISO/IEC 9646 legitimizes "not
    applicable" only for a capability a party does NOT claim), so the
    ferroehr statement withdraws all three claims. The cases and this entry
    stay; each becomes re-assertable the day the release adds a MESSAGE API or
    the product serves the operations on declared extension routes.
    RE-ADJUDICATED 2026-07-29 (#659) — THAT DAY CAME for all three, on the
    second of those two conditions. The released absence is CONFIRMED unchanged
    first-hand once more: the release publishes seven API groups (overview,
    system, ehr, demographic, query, definition, admin) and no
    message/extract/tdd group in either specifications/docs/** or
    specifications/*.openapi.yaml; there are no message_*/extract_*/tdd_*
    operations anywhere in specifications/operations. What changed is OUR side.
    The product serves the four I_EHR_EXTRACT_SERVICE operations and the two
    I_TDD_SERVICE ones under `/message/**` — the `message-extract` and
    `message-tdd` served_extensions families — so all six SM operations carry
    EXTENSION bindings, their batteries are EXECUTED, the evidence_exceptions
    on EhrExtract / Tds / MessageApi are deleted and those rows are
    `realization: extension`, which may never be `required`. `/message` is a
    resource root the release does not define, so no released path shape is
    extended or shadowed; and NO openEHR SPEC GOVERNS THE PRIVILEGE LEVEL of
    these routes — our own design/extension — so the group carries the ordinary
    clinical authentication class rather than the admin gate, on the ground
    that SM places these operations in the MESSAGE component (master09) and not
    in ADMIN, and that the content they move is the same EHR content the
    released clinical routes already serve.
    TWO catalogue-side facts the same re-adjudication settles, both of them
    prior defects rather than spec questions. FIRST, the corpus was
    DOCUMENTARY: spec-shaped but semantically unexecutable — an EXTRACT_SPEC
    whose only manifest entity named neither `ehr_id` nor `subject_id` (an
    entity extract_entity_manifest.adoc gives the receiver no way to locate),
    an EXTRACT with empty chapters and no EHR_STATUS container (so `import_ehr`
    could never clone anything), and a TDD naming a template no corpus entry
    provisions. Every fixture is re-authored EXECUTABLE, the TDDs adopted from
    the official CNF data set with only their root `uid` removed (a version
    identifier is minted by the committing system — RM common master06
    §Version Identification). SECOND, `import_ehr_extract-invalid` expected
    `validation_failed` for a payload carrying NONE of EXTRACT's mandatory
    `time_created` / `system_id` / `sequence_nr` (extract.adoc §Attributes) —
    i.e. not an EXTRACT at all. The ITS-REST overview
    `Requests_and_responses.md` §"HTTP status codes" splits exactly there: row
    400 covers "malformed request syntax, syntactically invalid content", 422
    the well-formed-but-semantically-invalid branch. The expectation is
    re-derived to the malformed branch from the fixture's own adjudicated
    defect, not from any observation.
    ONE naming fact stays as recorded: the CNF master13 chapter cites
    `I_EHR_EXTRACT.export_ehr()` / `export_ehr_extract()`, which the vendored SM
    does not declare; the cases keep anchoring to the real
    I_EHR_EXTRACT_SERVICE operations, since the SM is the operation-resolution
    oracle. And `I_TDD_SERVICE.import_tdds` still carries no SM signature — the
    batch form's all-or-nothing semantics remain this product's flagged
    extension of the interface, declared in the message-tdd family.
  disposition: fixed_handling
  upstream_issue: 1497
AMB-37:
  ambiguity: >-
    The SM I_DEFINITION_ADL2 interface is artefact-generic — a single
    upload_artefact/get_artefact/has_artefact/delete_artefact plus type-specific
    list_*/*_count over archetypes, templates AND operational templates — but
    ITS-REST 1.1.0 surfaces ONLY operational-template (OPT) wire under
    /definition/template/adl2*. There is no ADL2 archetype-provisioning
    endpoint, no generic all-artefacts listing, no DELETE, no *_count endpoint,
    and no regex match-by-pattern; the single ADL2 list does not distinguish
    TEMPLATE from OPERATIONAL_TEMPLATE.
  source: >-
    SM i_definition_adl2.adoc (upload_artefact / get_artefact / has_artefact /
    delete_artefact + list_* / *_count generic artefact operations — define the
    operations) vs released ITS-REST 1.1.0 (OPT-only wire under
    /definition/template/adl2; no archetype provisioning, generic listing,
    DELETE, or *_count — no wire)
  handling: >-
    Archetype provisioning, generic listing, delete, and counts are declared
    unrealized on its-rest (cases not-applicable WITH CITATION, activating on a
    later ITS release). valid_artefact realizes via upload_artefact; has_artefact
    and list_matching_artefacts realize via the ADL2 list (filter); list_templates
    conflates with list_opts on the one list endpoint; example generation and the
    deprecated version GET anchor to get_artefact (the closest SM op). SM/ITS alignment candidate: add ADL2 archetype provisioning + delete +
    count + generic-list + example-generation operations to the released ITS.
    CLAIM RE-DERIVED 2026-07-28 (#623) for the Adl2ArchetypeProvisioning
    capability specifically; the operation-level handling above is unchanged.
    The missing wire is CONFIRMED first-hand
    (specifications/definition.openapi.yaml surfaces only the OPT routes under
    /definition/template/adl2), and this product serves no ADL 2
    artefact-generic provisioning route of its own either — so there is no
    surface, released or extension, for the capability's cases to execute
    against. Excusing it while the party CLAIMED it was a certification hole
    (ISO/IEC 9646 legitimizes "not applicable" only for a capability a party
    does NOT claim), so the ferroehr statement withdraws the claim. The cases
    and this entry stay; the claim becomes re-assertable when a surface exists.
    RE-ADJUDICATED 2026-07-29 (#637) — THE SURFACE NOW EXISTS, and the
    withdrawal recorded above never took effect (the #623 convergence kept the
    claim). The missing released wire is CONFIRMED unchanged first-hand once
    more; what changed is OUR side: the product serves
    GET /definition/archetype/adl2[/count], GET /definition/artefact/adl2[/count]
    and DELETE /definition/artefact/adl2/{artefact_id} (the `adl2-archetype`
    served_extensions family), and the five SM operations behind them carry
    EXTENSION bindings onto those routes. Adl2ArchetypeProvisioning is
    therefore EXECUTED rather than excused and its evidence_exception is
    deleted. The row carries NO `realization: extension` marker on purpose:
    `delete_artefact-existing` verifies its postcondition through the RELEASED
    get_artefact, so the battery is genuinely mixed and the marker is reserved
    for extension-only batteries. No openEHR profile tier and no ITS-REST
    wire-conformance claim rests on the extension routes either way.
  disposition: fixed_handling
  upstream_issue: 1498
AMB-39:
  ambiguity: >-
    Support for the deprecated pre-1.1.0 "Simplified Data Template (SDT)"-era
    simplified-format media types is not mandated: ITS-REST simplified_formats
    master02 defines only the current application/openehr.wt.flat+json and
    application/openehr.wt.structured+json MIME types, and the master02 NOTE
    records that "Simplified Data Template (SDT)" was superseded by "Simplified
    Formats" at Release 1.1.0. Whether a server still accepts the legacy media
    types is implementation-defined.
  source: "ITS-REST simplified_formats master02-overview.adoc §MIME Types + §Overview (SDT rename NOTE)"
  handling: >-
    Sibling cases carry option tags; the ICS options declaration selects which
    applies — the declared behaviour MUST pass, the undeclared sibling is
    not-applicable. Request side (Content-Type): the supported branch
    (sf-deprecated-types-supported) expects the legacy commit to succeed; the
    unsupported branch (sf-deprecated-types-unsupported) expects
    unsupported_media (415). Response side (Accept): the
    sf-deprecated-types-unsupported branch also expects not_acceptable (406)
    when a deprecated media type is requested via Accept and the server does
    not support it (ITS-REST overview Resources.md §Simplified Formats — "If
    the service cannot fulfil this aspect of the request, it MUST respond with
    HTTP status code 406 Not Acceptable").
  disposition: option_select
  options: [sf-deprecated-types-supported, sf-deprecated-types-unsupported]
  upstream_issue: 1499
AMB-41:
  ambiguity: >-
    The SM I_DEFINITION_ADL14 interface defines archetype provisioning
    (upload/get/list over ADL 1.4 archetypes) alongside OPT provisioning, but
    ITS-REST 1.1.0 surfaces ONLY the operational-template wire under
    /definition/template/adl1.4; there is no ADL 1.4 archetype endpoint at all.
  source: >-
    SM i_definition_adl14.adoc (ADL 1.4 archetype provisioning: upload / get /
    list over archetypes — define the operations) vs released ITS-REST 1.1.0
    (OPT-only wire under /definition/template/adl1.4; no archetype endpoint —
    no wire)
  handling: >-
    The archetype-provisioning operations carry unrealized its-rest bindings;
    their cases are not-applicable WITH CITATION and activate when a later
    ITS release adds the wire. SM/ITS alignment candidate.
    CLAIM RE-DERIVED 2026-07-28 (#623), and the last clause of the original
    handling — "never a CORE failure the ITS cannot avoid" — is WITHDRAWN as
    the wrong remedy. The missing released wire is CONFIRMED unchanged
    first-hand: specifications/definition.openapi.yaml declares eleven paths,
    all under /definition/template/** or /definition/query/**, and no ITS-REST
    docs chapter names an archetype resource. What was wrong was excusing a
    CLAIMED capability: ISO/IEC 9646 test selection legitimizes "not
    applicable" only for a capability a party does NOT claim, so an
    excused-while-claimed row was a certification hole rather than a selection
    outcome. The second half of the derivation decides the remedy: this product
    ALSO serves no route for the operations (upload_archetype / get_archetype /
    list_archetypes / has_archetype / delete_archetype / archetypes_count are
    implemented in `ferroehr::service::definition::adl14` and reachable by no
