AMB-54:
  ambiguity: >-
    NARROWED 2026-07-27: the released 400_CONTRIBUTION response text
    ASSIGNS 400 to one half of what this entry originally carried — "or the
    modification type does not match the operation - i.e. first version of
    a MODIFICATION" — so a non-creation change_type committed as the FIRST
    version of a versioned object is NOT ambiguous (400, and this server
    answers 400). What remains UNASSIGNED by any released text: (a) the
    mirror case — a 249|creation| member that names a
    preceding_version_uid (RM Preceding_version_uid_validity grounds the
    rejection, no wire code); (b) a stale or unknown preceding_version_uid
    on a member (no If-Match exists on this operation, no 412/409 trigger
    covers it); (c) an out-of-group change_type/lifecycle token (the RM
    invariants ground the rejection, no wire code).
  source: >-
    ITS-REST specifications/responses/400_CONTRIBUTION.yaml (the assigned
    trigger, quoted); operations/contribution_create.yaml (responses
    201/400/404/409 — no 412/422); RM common
    UML/classes/org.openehr.rm.common.version.adoc
    (Preceding_version_uid_validity) + master06 §Contributions (the
    change-kind law) — confirmed first-hand.
  handling: >-
    Fixed handling: (a) creation-with-preceding and (c) out-of-group tokens
    are 422 (well-formed envelopes whose change-control semantics cannot be
    followed — the general 422 row); (b) a stale/unknown
    preceding_version_uid is 412; the response beyond the status is
    UNCONSTRAINED on this branch — the §If-Match ETag SHOULD is conditioned
    on the service RECEIVING If-Match ("If a service receives this header
    …"), which this operation has no parameter for, and CONTRIBUTION.versions
    is a list over "any number of versionable items" (RM contribution.adoc),
    so no single latest version_uid exists to name. On the DIRECT routes the
    antecedent holds and the referent is unique, and the catalogue
    deliberately gates that SHOULD there (a strength choice, recorded here on
    purpose). The first-version-modification case gates at the released 400.
    Reported upstream (UPR-47): assign the three residual branches, and
    assign (or decline) an identifying header for the body-borne
    precondition failure.
