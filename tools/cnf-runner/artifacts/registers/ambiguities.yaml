  disposition: fixed_handling
AMB-15:
  ambiguity: >-
    The SM EHR_STATUS field-setters (set/clear_ehr_queryable,
    set/clear_ehr_modifiable) have no dedicated ITS-REST endpoint — ITS-REST
    1.1.0 exposes only the whole-resource PUT /ehr/{ehr_id}/ehr_status.
  source: "SM docs/UML/classes/i_ehr_status.adoc vs ITS-REST specifications/operations/ehr_status_update.yaml"
  handling: >-
    Realized as read-modify-write: the cases encode the GET explicitly
    (capture the status version uid), then PUT the flipped flag with the
    prior version as the precondition (AMB-3 realizes it as If-Match).
    SPECPR candidate: add field-setter endpoints or document the
    read-modify-write realization normatively.
  disposition: fixed_handling
AMB-16:
