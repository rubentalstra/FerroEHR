    The ferroehr statement therefore WITHDRAWS the claim. The consequence is
    stated rather than absorbed: the CNF Profiles book marks ADL 1.4 archetype
    provisioning CORE+STANDARD, so a party claiming CORE while not claiming it
    draws a static-review finding — the honest reading of a release that
    publishes no wire for a capability its own conformance book requires, and
    strictly better than a silent excuse. The claim becomes re-assertable the
