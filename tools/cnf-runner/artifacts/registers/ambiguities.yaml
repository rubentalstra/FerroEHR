    those SM operations take an ehr_id (UUID); the subject flows are the
    distinct SM operations has_ehr_for_subject and get_ehrs_for_subject.
  source: "CNF platform_test_schedule master06 (subject-based has_ehr/get_ehr cases) vs SM docs/UML/classes/i_ehr_service.adoc"
  handling: >-
    Official case ids unchanged; sm_operation carries the resolvable subject
