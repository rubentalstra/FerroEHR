  source: >-
    RM common locatable.adoc §Attributes (uid 0..1); RM common
    master03-archetyped_package.adoc §Unique Node Identification
    (recommended; "will usually be empty"); ITS-REST
    specifications/docs/overview/Resources.md §Identifier types (COMPOSITION
    scope, "strongly recommended … should be copied") — all
    recommendation-strength, confirmed first-hand.
  handling: >-
    Report-only: the contained-uid-form case exercises the behaviour and
    records the outcome without gating any tier — presence is a
    recommendation this server ADOPTS (commit-time stamping, #439) but no
    conformant server can be failed for omitting. The FORM when present
    stays the gating AMB-65 fixed handling. Reported upstream (#1511): the
    recommendation's scope and strength deserve an explicit wire-level
    statement for the non-COMPOSITION top-level types.
    SCOPE EXCLUSION (2026-07-27, group-12 audit): this entry does NOT reach
    PARTY. The recommendation-strength reading holds only where every released
    sentence about the contained uid is a recommendation, and RM demographic
    UML/classes/org.openehr.rm.demographic.party.adoc §Invariants carries
    `Uid_mandatory: uid /= Void` — an invariant, not a recommendation — so a
    served PARTY without a uid does breach a released statement. The party
    cases therefore ASSERT the uid rather than merely recording it, and the
    invariant-vs-NOTE tension that creates is AMB-129.
  disposition: report_only
  upstream_issue: 1511
AMB-68:
  ambiguity: >-
    The released RM contradicts itself on REVISION_HISTORY item ordering
    inside one class table: the Purpose row says "The list is in
    most-recent-first order" while the `items` attribute Meaning says "The
    items in this history in most-recent-last order". The two function
    postconditions in the same table settle it — `most_recent_version`:
    `Result.is_equal (items.last.version_id.value)` and
    `most_recent_version_time_committed`:
    `Result.is_equal (items.last.audits.first.time_committed.value)` — the
    most recent item is `items.last`, so the order is most-recent-LAST and
    the Purpose sentence is the defect.
  source: >-
    RM common UML/classes/org.openehr.rm.common.revision_history.adoc —
    Purpose row vs `items` Meaning row vs the two `items.last`
    postconditions; confirmed first-hand.
  handling: >-
    Fixed handling: the wire serves `items` oldest-first
    (most-recent-last), per the postconditions; the revision-history cases
    assert that order. Reported upstream (#1512): correct the Purpose
    sentence.
  disposition: fixed_handling
  upstream_issue: 1512

AMB-69:
  ambiguity: >-
    The wire values of `VERSIONED_OBJECT.owner_id.namespace` and
    `.type` are stated by NO released text. RM types `owner_id` as
    OBJECT_REF 1..1 and says only that it refers to "the id of the
    containing EHR or other relevant owning entity"; BASE constrains the
    namespace lexically ("local", "unknown", or the identifier regex) but
    assigns no value; the ITS-REST docs text never mentions owner_id. The
    reverse edge IS normative (EHR.ehr_status.type must equal
    "VERSIONED_EHR_STATUS"), but nothing released fixes the forward one.
  source: >-
    RM common UML/classes/org.openehr.rm.common.versioned_object.adoc
    §Attributes (owner_id meaning); BASE
    UML/classes/org.openehr.base.base_types.object_ref.adoc (namespace
    legal values); RM UML/classes/org.openehr.rm.ehr.ehr.adoc §Invariants
    (Ehr_status_valid, the reverse direction) — confirmed first-hand.
  handling: >-
    Fixed handling, in two halves — one per owner situation, each pinned by
    its container-shape cases.
    (a) EHR-OWNED containers (VERSIONED_COMPOSITION / VERSIONED_EHR_STATUS /
    VERSIONED_EHR_ACCESS / VERSIONED_FOLDER): `owner_id` is
    `{namespace: "local", type: "EHR", id: HIER_OBJECT_ID of the owning
    ehr_id}` — the RM sentence's first limb ("the id of the containing EHR")
    has a concrete referent here, and the namespace token is BASE's. The
    get_versioned_composition / get_versioned_ehr_status container-shape cases
    assert all three parts, including the id VALUE against `${ehr_id}`.
    (b) EHR-LESS DEMOGRAPHIC containers (VERSIONED_PARTY, and the generic
    VERSIONED_OBJECT this server serves for a PARTY_RELATIONSHIP): a PARTY has
    NO containing EHR at all — RM demographic
    master02-demographic_package.adoc §Versioning Semantics says only "Every
    Party is stored in its own Version container", and the chapter describes a
    demographic service deliberately separate from the EHR, so the RM
    sentence's first limb has no referent while the attribute stays mandatory
    (1..1). The concrete released guidance is the VERSIONED_PARTY example —
    `owner_id` = `{id: {_type: HIER_OBJECT_ID, value: …}, namespace: local,
    type: SYSTEM}` (ITS-REST
    specifications/schemas/demographic/VersionedParty.yaml `example`, vendored
    at crates/openehr-its/vendor/rest-oas/demographic-codegen.openapi.yaml
    `components.schemas.VersionedParty.example`) — the "other relevant owning
    entity" limb read as the serving system, with the same BASE namespace token
    the EHR side uses. WHAT THAT EXAMPLE IS WORTH, under the oracle order: the
    same as AMB-137's five `ItemTagOf<T>` examples — nothing as an assignment.
    Tier 1, the ITS-REST docs text, never mentions `owner_id`; tier 2, the
    released OAS, DECLARES the attribute (`VersionedObject` requires it, typed
    `ObjectRefOfHierObjectId`) but its `example:` block is illustration, not a
    rule. So the two tokens are OUR OWN REGISTER DECISION — no openEHR spec
    governs them — INFORMED BY the released example rather than derived from
    it. They are nevertheless ASSERTED by the versioned_party_get
    container-shape case, on AMB-137's reasoning applied to the same attribute
    name: the field is MANDATORY (1..1) with no derivable value, so leaving it
    unasserted would leave a required wire field entirely unchecked, and
    asserting the registered convention — labelled as a convention wherever it
    is asserted — is the honest position. Only the `id` VALUE stays unasserted,
    because the released example's own id is an opaque UUID that fixes no
    referent, so the case requires presence alone. This server emits the
    configured system identifier there, and emits the SAME shape for the
    X_VERSIONED_PARTY wrapper of an EHR-Extract export and for the demographic
    ITEM_TAG `owner_id` (register AMB-137), so one owner shape covers the whole
    ehr-less demographic surface.
    CORRECTION 2026-08-02 (RM §6.1 audit): before this revision the register
    asserted "This server emits that shape" while the VERSIONED_PARTY container
    read actually emitted `{namespace: "demographic", type: <PARTY |
    PARTY_RELATIONSHIP>, id: the container's OWN uid}` (a self-referential
    duplicate of `uid`) and the EHR-Extract wrapper emitted
    `{namespace: "demographic", type: "SYSTEM", …}` — three shapes across two
    code paths and the served OpenAPI. The statement was false when written;
    the divergence is now converged onto the released-example shape and the
    tokens are asserted, so the register describes what is served. The earlier
    claim that "the tokens are NOT asserted by any case" was likewise stale on
    the EHR side, where the container-shape cases have always asserted them.
    Reported upstream (#1513): state the owner_id wire values normatively,
    including the no-owning-EHR case.
  disposition: fixed_handling
  upstream_issue: 1513

AMB-70:
  ambiguity: >-
    "The version extant at time T" has no released algorithm. RM gives only
    the signature `version_at_time (a_time): VERSION` with
    `Pre: has_version_at_time (a_time)`; nothing released states (a) which
    instant anchors a version's extancy interval (commit_audit.time_committed
    is cited only as the Last-Modified source), (b) whether the interval is
    closed or open at the commit instant, (c) how branch versions
    participate, (d) what a future-dated T returns, or (e) which function
    "latest" means for the no-parameter read — `latest_version()` ("most
    recently added … on trunk or any branch") vs `latest_trunk_version()`
    are both defined and neither ITS-REST nor SM picks one.
  source: >-
    RM common UML/classes/org.openehr.rm.common.versioned_object.adoc
    §Functions (version_at_time, latest_version, latest_trunk_version); SM
    UML/classes/i_ehr_status.adoc get_ehr_status_at_time ("If no time
    supplied, get the latest."); ITS-REST overview Resources.md §Datetime
    format (offset-less values resolve in the local timezone) — confirmed
    first-hand.
  handling: >-
    Fixed handling: extancy anchors on the version's commit instant,
    inclusive at commit (a version is extant from its own commit instant
    until the next commit); a T at or after the newest commit returns that
    newest version (a future T is 200, never 404); a T before the first
    held commit is no-version-at-time (404); "latest" is the current trunk
    version; offset-less T resolves in the server-local timezone. The
    at-time cases pin these choices. Reported upstream (#1514): define
    the extant-at-time semantics normatively.
  disposition: fixed_handling
  upstream_issue: 1514

AMB-71:
  ambiguity: >-
    Two released ITS-REST prose sentences conflict on Location for
    updates: §Location says "The `Location` header MUST ONLY be used for
    resource creation (e.g., `201 Created`) or redirect responses", while
    §"Prefer return minimal" says the response "SHOULD include a `Location`
    header pointing to the newly created or updated resource" — an update
    returns 200/204, never 201, so the two cannot both hold.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md
    §Location (L140) vs §Representation details negotiation, return=minimal
    paragraph (L288: "newly created or updated resource") — confirmed
    first-hand, same released document.
  handling: >-
    Fixed handling: change-controlled writes (create AND update) carry
    Location pointing at the resulting version, per the §Prefer sentence;
    reads, deletes, and 4xx responses never do, per §Location (the
    wire_surface `header-location-only-on-create` entry scopes the
    prohibition to those). Reported upstream (#1515): reconcile the two
    sentences.
  disposition: fixed_handling
  upstream_issue: 1515

AMB-72:
  ambiguity: >-
    The SM I_EHR_STATUS interface carries five editorial defects: (1)
    get_versioned_ehr_status declares a precondition
    `Pre_has_ehr_status_version: has_ehr_status_version (an_ehr_id,
    a_version_uid)` referencing `a_version_uid`, which is not a parameter
    of that operation; (2) get_ehr_status_at_time declares only `a_time`
    yet its precondition uses the undeclared `an_ehr_id`; (3) version
    identifiers are typed UUID where the wire value is an
    OBJECT_VERSION_ID (three-part); (4) get_ehr_status_at_time /
    get_ehr_status_at_version return EHR_STATUS while the ITS-REST
    versioned_ehr_status/version routes serve the VERSION envelope, so the
    mappings are approximate; (5) clear_ehr_modifiable's meaning reads
    "this ensures it is treated as active", contradicting its own
    postcondition `not …is_modifiable` (and misspells `_is_modifable_`).
    None of these change conformant wire behaviour; they distort the
    SM-operation vocabulary the case cores speak.
  source: >-
    SM UML/classes/i_ehr_status.adoc (all five, confirmed first-hand);
    BASE UML/classes/org.openehr.base.base_types.object_version_id.adoc
    (the version-uid form for defect 3); SM has no revision-history
    operation at all (grep across SM/docs = zero hits) — the REST
    revision-history route's abstract counterpart is RM
    VERSIONED_OBJECT.revision_history().
  handling: >-
    Editorial: the catalogue keeps the SM operation names and treats the
    ITS-REST docs text + RM as the behavioural authority where the SM
    typing/preconditions are defective. Reported upstream (#1516).
  disposition: editorial
  upstream_issue: 1516

AMB-73:
  ambiguity: >-
    Whether the template of a VERSIONED_COMPOSITION may change between
    versions is stated by NO released text: RM composition/common classes
    carry no template-stability invariant (VERSIONED_COMPOSITION's own
    invariants pin archetype_node_id and is_persistent across versions —
    versioned_composition.adoc §Invariants — but not
    archetype_details.template_id), and ITS-REST/SM say nothing. The CNF
    schedule's update_composition-wrong_template case expects rejection,
    but the schedule is a stalled guide, never the correctness authority.
    A server accepting a template change breaches nothing released.
  source: >-
    RM UML/classes/org.openehr.rm.ehr.versioned_composition.adoc
    §Invariants (Archetype_node_id_valid + Persistent_validity only); RM
    common master06-change_control_package.adoc §Contributions (no
    content-stability rule); SM i_ehr_composition.adoc update_composition
    (silent); CNF platform_test_schedule master07
    §update_composition-wrong_template (guide only) — silence confirmed
    first-hand.
  handling: >-
    Report-only: this server REJECTS a template change across versions of
    one VERSIONED_COMPOSITION (422) as its own design convention —
    consistent with the versioned container's archetype-stability
    invariants — and the wrong_template case records the outcome without
    gating any tier. Reported upstream (#1517): state whether
    template_id is version-stable.
  disposition: report_only
  upstream_issue: 1517

AMB-74:
  ambiguity: >-
    The read branches for a logically deleted COMPOSITION are only
    partially assigned. The bare route's one deleted branch
    (204_deleted_at_time) is textually scoped to "at specified
    version_at_time"; a GET addressing a deleted version by its explicit
    version_uid, or the implicit latest when the trunk head is deleted,
    has NO released branch, and the four versioned_composition routes
    declare nothing for deleted versions at all (the overview docs never
    mention logical deletion).
  source: >-
    ITS-REST specifications/operations/composition_get.yaml +
    responses/204_deleted_at_time.yaml (the scoping parenthetical);
    specifications/operations/versioned_composition_version_get_{at_time,
    by_id}.yaml (200/404 only); RM common
    master06-change_control_package.adoc §Logical Deletion + RM
    original_version.adoc (data 0..1) — confirmed first-hand.
  handling: >-
    Fixed handling: the bare route serves 204 No Content for a deleted
    version under ALL THREE addressing forms (explicit version_uid,
    implicit latest, version_at_time) — the deleted version has no data to
    represent; the VERSION-envelope routes serve 200 with the data-less
    ORIGINAL_VERSION (lifecycle_state 523|deleted|, commit_audit and
    provenance preserved — the RM-consistent reading, since 204 would
    suppress exactly what the envelope routes exist to expose). Reported
    upstream (#1518): assign the deleted-read branches explicitly.
    SCOPE EXTENDED 2026-07-27 (group-12 audit) to the PARTY family, which is
    the same shape sentence for sentence: the five party gets each declare the
    identically-scoped `204_deleted_at_time` ("at specified `version_at_time`")
    beside 200/404, and the four `/demographic/versioned_party/**` reads
    declare 200/404 only. So the bare party route serves 204 for a deleted
    version under all three addressing forms (explicit `version_uid`, implicit
    latest, `version_at_time`) and the versioned_party VERSION reads serve 200
    with the data-less ORIGINAL_VERSION — the same handling, for the same
    reason, on a change-controlled resource RM common master06 §Overview names
    outright ("Party objects in a demographic system").
  disposition: fixed_handling
  upstream_issue: 1518

AMB-75:
  ambiguity: >-
    Which version identity the composition DELETE's 204 carries in ETag is
    unstated: the response file references the generic ETag header ("an
    identifier … for a specific version of a resource") and no released
    sentence says whether that is the NEW 523|deleted| version's uid or
    the addressed (preceding) uid.
  source: >-
    ITS-REST specifications/responses/204_version_deleted.yaml +
    headers/ETag.yaml (generic wording); RM common
    master06-change_control_package.adoc §Logical Deletion (the delete
    COMMITS a new version — the resource's newest state) — confirmed
    first-hand.
  handling: >-
    Fixed handling: the 204 carries the NEW deleted version's uid (weak
    form) with Last-Modified at its commit instant — the delete commits a
    new version, and the ETag names the resource's current state (overview
    §"ETag and Last-Modified": the value "changes as soon as the resource
    changes (i.e. when a new version is created)"). Reported upstream
    (#1519): name the identity explicitly.
    SCOPE EXTENDED 2026-07-27 (group-12 audit) to the PARTY delete, which
    references the same generic `204_version_deleted` response and the same
    generic `ETag` header, and whose delete is likewise a commit of a new
    `523|deleted|` VERSION — so its 204 carries the NEW deleted version's uid
    in the weak form, on the identical grounds.
  disposition: fixed_handling
  upstream_issue: 1519

AMB-76:
  ambiguity: >-
    RE-GROUNDED 2026-07-29, verdict unchanged. What is unassigned is narrower
    than this entry used to claim, and the earlier ground was defective in
    both directions: it mis-quoted the released 400 row, and it derived the
    400 from a property of THIS SERVER ("every identifier this server MINTS
    is a UUID") — a SUT-derived expectation, which the attribution law
    forbids outright. Neither survives.
    WHAT THE RELEASE DOES SETTLE: the lexical form of every affected path
    segment. `version_uid` is fixed by the DOCS TEXT — Resources.md
    §Identifier types: "The `version_uid` uniquely identifies a VERSION, in
    the lexical form of `object_id :: creating_system_id ::
    version_tree_id`". `ehr_id`, `versioned_object_uid` and
    `contribution_uid` are fixed by the RELEASED OAS, where the docs text is
    silent on their spelling: each path-parameter file declares
    `schema: {type: string, format: uuid}`. A segment violating the declared
    parameter schema is not the identifier the operation takes, so the
    operation's only declared error branch does not reach it: the 404 files
    state their trigger for a WELL-FORMED-but-absent id
    ("`404 Not Found` is returned when an EHR with `ehr_id` does not
    exist"), which presupposes an `ehr_id`. What is left is the overview's
    400 row, whose first named case is exactly this: "malformed request
    syntax".
    WHAT REMAINS UNASSIGNED, and is why this entry survives: no operation
    DECLARES a 400 response for a violation of its own path-parameter
    schema. `ehr_get_by_id`, `versioned_composition_get` and
    `contribution_get` all declare `{200, 404}` and nothing else, so the
    branch is derivable from the overview but absent from every per-operation
    response map — the gap #1520 asks openEHR to close. The release even
    HAS the sentence, in the reusable `responses/400.yaml` ("`400 Bad
    Request` is returned when the request could not be parsed or is invalid
    (e.g. malformed request URL syntax, missing required header or
    parameter, or syntactically invalid header, parameter or content)") —
    it is simply not `$ref`ed by any of these three reads.
  source: >-
    ITS-REST specifications/docs/overview/Resources.md §Identifier types
    (the `version_uid` lexical form, quoted above; `ehr_id` and
    `versioned_object_uid` named without a spelling; `contribution_uid`
    absent — AMB-90) + docs/overview/Requests_and_responses.md §HTTP status
    codes, the 400 row VERBATIM: "The service cannot or will not process the
    request due to something that is perceived to be a client error (e.g.,
    malformed request syntax, syntactically invalid content)" — note this
    Release-1.1.0 wording says "content", NOT the "header, parameter or
    content" this entry previously quoted. TIER 2, THE RELEASED OAS, citable
    because the docs text is silent on these three spellings (owner ruling
    2026-07-28) and cited AS the OAS:
    specifications/parameters/path/ehr_id.yaml,
    path/versioned_object_uid_COMPOSITION.yaml and path/contribution_uid.yaml
    (each `schema: {type: string, format: uuid}`);
    specifications/operations/ehr_get_by_id.yaml, versioned_composition_get.yaml
    and contribution_get.yaml (responses 200 + 404 only — no 400);
    responses/404_unknown_ehr_id.yaml, 404_unknown_ehr_id_or_versioned_object_uid.yaml
    and 404_CONTRIBUTION.yaml (each scoped to an id that "does not exist").
    BASE base_types master05-identification_package.adoc ("all three subtypes
    have mutually exclusive string patterns") + the UID/HIER_OBJECT_ID class
    tables (no lexical invariant beyond non-empty) — all CONFIRMED
    first-hand.
  handling: >-
    Fixed handling (repo-wide): an identifier path segment that violates the
    lexical form the release fixes for it — the docs-text `::` composite for
    `version_uid`, the OAS `format: uuid` for `ehr_id`,
    `versioned_object_uid` and `contribution_uid` — is rejected 400 as
    malformed request syntax, because the operation's 404 branch is scoped to
    a well-formed id that names nothing. Cases address unknown resources with
    well-formed identifiers and malformed-identifier cases expect 400, so the
    400/404 split is exercised rather than assumed. The 400 is NOT an option
    branch: it is derived from the released parameter typing plus the
    overview row, not chosen. Reported upstream (#1520), re-scoped: declare
    the 400 in the per-operation response maps that type their path
    parameters.
  disposition: fixed_handling
  upstream_issue: 1520

AMB-77:
  ambiguity: >-
    The SM I_EHR_COMPOSITION interface carries editorial defects beyond
    the AMB-72 pattern: (1) get_composition_latest declares
    Pre_has_composition (an_ehr_id, a_version_uid) over an undeclared —
    and for its purpose type-wrong — parameter; (2)
    get_composition_at_version names its errors ehr_does_not_exist /
    object_version_does_not_exist while every sibling uses
    ehr_id_does_not_exist / composition_does_not_exist; (3) that same
    operation declares no preconditions at all; (4) delete_composition
    types a_version_uid as UUID while its own Meaning says it identifies
    "the current top Composition Version" (an OBJECT_VERSION_ID); (5)
    update_composition has no preceding_version_uid parameter — the CNF
    schedule itself flags this (master07 L475); (6) the preconditions call
    valid_content(...) while i_validity_checker.adoc declares
    content_valid(...); (7) the 412/409/400-already-deleted wire outcomes
    and create's composition_already_exists error have no SM/wire
    counterparts respectively. Three released-doc typos travel with the
    same report: the ETag_COMPOSITION.yaml example closes W/"…' with a
    single quote; composition_get.yaml reads "is be used"; the Resources.md
    §Multiple identifiers example writes a single colon before the
    version_tree_id.
  source: >-
    SM UML/classes/i_ehr_composition.adoc + i_validity_checker.adoc;
    ITS-REST specifications/headers/ETag_COMPOSITION.yaml,
    operations/composition_get.yaml, docs/overview/Resources.md §Multiple
    identifiers — all confirmed first-hand.
  handling: >-
    Editorial: the catalogue keeps the SM operation names and adjudicates
    behaviour from the ITS-REST docs text + RM where the SM
    typing/preconditions are defective. Reported upstream (#1521).
  disposition: editorial
  upstream_issue: 1521

AMB-78:
  ambiguity: >-
    RE-ADJUDICATED 2026-07-28 under the OAS-fallback oracle order, and
    RETYPED from `report_only` to `fixed_handling`: the RULE is released, so
    the case gates. The entry's whole ground for never gating was that the
    match requirement "appears only in the API definition's operation
    description … which is the stalled OAS layer and never an oracle". That
    layer is tier 2 now, and the docs text is SILENT rather than in conflict
    with it, so the requirement holds: a COMPOSITION update whose request body
    carries a `uid` naming a DIFFERENT version container than the URL's
    `uid_based_id` MUST be refused.
    WHAT IS STILL NOT ASSIGNED, and is why the entry survives: the STATUS. The
    operation declares 200/204/400/404/412/422 and no released sentence — on
    either tier — binds the body-vs-URL contradiction to one of them. The
    docs text's own row descriptions decide it as far as anything can (see the
    handling), but the assignment remains ours and the upstream ask stands.
    The DOCS-TEXT half is unchanged: it says only that a COMPOSITION.uid.value
    "implies that the VERSIONED_OBJECT identifier is …", and that copying the
    enclosing VERSION uid into the contained object is "strongly
    recommended"/"should" — which is why the rule had to come from tier 2.
  source: >-
    TIER 1, DOCS TEXT — ITS-REST specifications/docs/overview/Resources.md
    §Identifier types (the "implies that the VERSIONED_OBJECT identifier is
    `8849182c-…`" derivation + the "strongly recommended … should be copied"
    NOTE); Requests_and_responses.md §HTTP status codes (rows 400 "malformed
    request syntax, syntactically invalid content" and 422 "well-formed but …
    unable to be followed due to semantic errors" — neither ASSIGNED to a
    body-vs-URL identifier contradiction, though the 422 row is the only one
    whose description fits it); RM common
    UML/classes/org.openehr.rm.common.locatable.adoc §Attributes (uid 0..1).
    Docs-text silence on the RULE re-confirmed first-hand 2026-07-28 across
    the whole ITS-REST docs tree.
    TIER 2, THE RELEASED OAS, citable because tier 1 is silent (owner ruling
    2026-07-28) and cited AS the OAS — read first-hand 2026-07-28:
    specifications/operations/composition_update.yaml, description, "If the
    request body already contains a COMPOSITION.uid.value, it must match the
    `uid_based_id` in the URL", with responses 200/204/400/404/412/422 and
    responses/422.yaml ("returned when the content type and syntax is correct,
    could be converted to a resource, but there are semantic validation
    errors"). The same sentence, over the same attribute, appears in
    operations/{person,agent,group,organisation,role}_update.yaml, each of
    which likewise declares 422.
  handling: >-
    Fixed handling. THE RULE GATES: a body uid naming another container is
    REFUSED, on every update that carries the sentence — the COMPOSITION
    update and all five party updates. `I_EHR_COMPOSITION.update_composition-body_uid_mismatch`
    therefore drops its report-only shelter and gates at its declared CORE
    tier, and the addressed container must keep its single version.
    THE STATUS IS ADJUDICATED, not declared, and stays 422: the request parses
    and carries a well-formed COMPOSITION, so the 400 row — scoped by its own
    words to "malformed request syntax, syntactically invalid content" — does
    not describe it, while both the docs-text 422 row ("well-formed but …
    unable to be followed due to semantic errors") and the OAS `422.yaml`
    ("the content type and syntax is correct, could be converted to a
    resource, but there are semantic validation errors") describe it exactly,
    and 422 is among the statuses the operation declares. A server answering
    400 is answering outside that row's stated trigger; the catalogue holds
    the 422 line and the residual risk is recorded here rather than hidden.
    PARTY SCOPE (extended 2026-07-27, re-grounded 2026-07-28): the five party
    updates carry the identical sentence over a class whose own uid rule is a
    released RM invariant rather than a recommendation (AMB-129), so the rule
    is if anything stronger there; the party CREATE is a different question —
    it has no URL identifier for a body uid to contradict — and is AMB-132.
    Reported upstream (#1522), re-scoped: the rule is now findable in the
    release's computable artifacts but still absent from the normative prose,
    and its branch is still unassigned on either tier.
  disposition: fixed_handling
  upstream_issue: 1522

AMB-79:
  ambiguity: >-
    Creating a directory on an EHR that already has a live one has NO
    assigned wire outcome: directory_create declares only 201/400/404, the
    status table's 409 row is not bound to it, and the ITS-REST docs text
    never mentions the case. SM I_EHR_DIRECTORY establishes the RULE
    (Pre_no_directory: not has_directory(ehr_id)) but no error code. The
    stalled Robot suite asserts 409 with the in-file admission "NOTE:
    @PABLO this is not (yet) in the SPEC".
  source: >-
    ITS-REST specifications/operations/directory_create.yaml (responses
    201/400/404 only); SM UML/classes/i_ehr_directory.adoc create_directory
    (Pre_no_directory, errors lack a code for it);
    Requests_and_responses.md §HTTP status codes (the unbound 409 row); CNF
    robot directory_keywords.robot L730-737 (the admission) — confirmed
    first-hand.
  handling: >-
    Fixed handling: this server answers 409 Conflict (the row's own text —
    "the request could not be processed because it might generate a
    duplicate or a conflict") when a LIVE directory occupies the slot; a
    logically deleted directory vacates it (the container survives, RM
    master06 §Logical Deletion) so a re-create opens a new hierarchy. The
    create-conflict case gates on 409. Reported upstream (#1523): bind
    the branch.
  disposition: fixed_handling
  upstream_issue: 1523

AMB-80:
  ambiguity: >-
    Updating or deleting the directory of an EHR that has NONE has no
    assigned wire outcome: both operations' only 404 file is scoped "when
    an EHR with ehr_id does not exist"; 412 is scoped to an If-Match
    mismatch against the latest version — and there is no latest version.
    SM has Pre_has_directory on both with no error code
    (delete_directory's only error is ehr_id_does_not_exist).
  source: >-
    ITS-REST specifications/operations/directory_{update,delete}.yaml +
    responses/404_unknown_ehr_id.yaml (the scoping) +
    responses/412_directory.yaml; SM UML/classes/i_ehr_directory.adoc
    (Pre_has_directory without an error code) — confirmed first-hand.
  handling: >-
    Fixed handling: this server answers 404 Not Found — the directory
    resource the request addresses does not exist, the closest released
    semantics (the 404 row: "the resource … does not exist"). The
    no-directory update/delete cases gate on 404. Reported upstream
    (#1524): scope the 404 files to cover the missing-directory case or
    bind another branch.
  disposition: fixed_handling
  upstream_issue: 1524

AMB-81:
  ambiguity: >-
    The directory `path` query parameter's grammar is stated in one
    sentence ("consists of slash-separated values of the name attribute of
    FOLDERs in the directory", example episodes/a/b/c) that leaves
    unstated: whether a leading slash is permitted; whether the root
    FOLDER's own name is a segment or implicit; how duplicate sibling
    names disambiguate (the RM's own bracket uniqueness-modifier
    convention for directory paths is never adopted by the REST param);
    and how a slash inside a FOLDER name escapes. The RM path syntax
    (master05 §Paths) is a DIFFERENT grammar the parameter never
    references.
  source: >-
    ITS-REST specifications/parameters/query/path.yaml (the whole released
    definition); SM UML/classes/i_ehr_directory.adoc has_path (identical
    wording); RM common master05-directory_package.adoc §Paths (the
    distinct RM grammar) — confirmed first-hand.
  handling: >-
    Fixed handling: this server resolves the parameter root-implicitly
    (segments name SUB-folders; the root's own name is not a segment),
    tolerates a leading slash and empty segments, matches the first
    sibling with the exact name value, navigates folders only (never
    items), and answers 404 for an unresolved path (the declared trigger).
    Path cases pin this grammar. Reported upstream (#1525): define the
    grammar normatively. The RM-layer twin of this collision — master05's
    name-based bare brackets and parenthesised uniqueness modifiers against
    BASE master11's archetype_node_id shortcut, which is what the RM path
    engine implements — is AMB-183.
  disposition: fixed_handling
  upstream_issue: 1525

AMB-82:
  ambiguity: >-
    RM requires content writes to be REFUSED on a deactivated EHR
    (EHR_STATUS.is_modifiable = false scopes to "everything other than the
    EHR_STATUS object" — Compositions AND hierarchical Folders), but NO
    released text assigns the refusal a status code: the ITS-REST docs
    text never mentions is_modifiable outside the EHR-creation defaults,
    and no composition/directory operation declares a branch for it.
  source: >-
    RM ehr master04-ehr_package.adoc §EHR Active Status (the refusal rule,
    naming Compositions and Folders); ITS-REST specifications/ (grep:
    is_modifiable appears only in ehr_create*.yaml defaults and the
    EhrStatus schema) — confirmed first-hand.
  handling: >-
    Fixed handling: this server answers 409 Conflict on any content write
    (COMPOSITION or directory create/update/delete, AND the native
    CONTRIBUTION commit — the primary write route; scope extended
    2026-07-27) into an EHR with
    is_modifiable = false — the request conflicts with the resource's
    current state; EHR_STATUS itself stays always-writable (RM: "The
    EHR_STATUS object itself can always be written to"), which is how a
    deactivated EHR is reactivated. Cases exercising the deactivated-EHR
    refusal gate on 409. Reported upstream (#1526): assign the branch.
  disposition: fixed_handling
  upstream_issue: 1526

AMB-83:
  ambiguity: >-
    The SM I_EHR_DIRECTORY interface carries editorial defects in the
    AMB-72/77 pattern: five operations declare their parameter as `ehr_id`
    while their preconditions read `an_ehr_id` (the interface mixes both
    spellings); version identifiers and ehr ids are typed UUID where the
    wire values are OBJECT_VERSION_ID/HIER_OBJECT_ID; the preconditions
    call valid_content(...) where I_VALIDITY_CHECKER declares
    content_valid(...) — the same defect recurring in a third interface;
    update_directory's Meaning ("Create or update a directory") contradicts
    its own Pre_has_directory and duplicates create_directory's create
    path, while declaring no preceding_version_uid parameter (the value
    lives only in UV_FOLDER); get_directory_at_version declares no
    preconditions and only version_does_not_exist (omitting
    ehr_id_does_not_exist, which its REST 404 explicitly covers);
    has_directory declares no errors while the structurally identical
    has_path declares one; the three write operations are typed 0..1 with
    no return type; no SM error corresponds to the wire 412; and the three
    boolean probes (has_directory, has_path, has_directory_version) have
    no ITS-REST route (inferable only from GET status codes — AMB-24
    covers only get_versioned_directory). Two released ITS-REST
    response-file contract defects travel with the same report: the
    update's 200 and 204 branches select DIFFERENT Location/ETag header
    contracts (Location_directory+ETag_FOLDER vs
    Location_version+generic ETag) for one operation's success, and
    412_directory declares a Location header solely to deprecate it.
  source: >-
    SM UML/classes/i_ehr_directory.adoc (all interface defects) +
    i_validity_checker.adoc; ITS-REST
    specifications/responses/{200_directory_updated,204_version_updated,
    412_directory}.yaml + headers/{Location_directory,Location_version,
    Location_deprecated,ETag,ETag_FOLDER}.yaml — confirmed first-hand.
  handling: >-
    Editorial: the catalogue keeps the SM operation names and adjudicates
    wire behaviour from the ITS-REST docs text + RM; the wire serves ONE
    consistent header contract on both update successes (Location = the
    by-version directory URL, weak ETag = the new version uid) and no
    Location on 412. Reported upstream (#1527).
  disposition: editorial
  upstream_issue: 1527

AMB-84:
  ambiguity: >-
    An empty versions array on a committed CONTRIBUTION has NO released
    ground for rejection: NewContribution declares no minItems (the READ
    schema does: minItems 1 — an asymmetry), the RM CONTRIBUTION class
    declares NO invariants at all (its versions multiplicity is 1..1 on
    the List attribute, not 1..* on items), and no operation branch covers
    it. The stalled Robot asserts 400 with an invented message.
  source: >-
    ITS-REST specifications/schemas/ehr/NewContribution.yaml (no minItems)
    vs schemas/common/Contribution.yaml (minItems 1); RM common
    UML/classes/org.openehr.rm.common.contribution.adoc (invariants
    section absent) — confirmed first-hand.
  handling: >-
    Fixed handling: this server rejects an empty (or missing) versions
    list 422 — a well-formed envelope that commits nothing cannot be
    followed as a change set (a CONTRIBUTION exists to list "the affected
    VERSION objects", master06 §Contributions). Reported upstream
    (#1528): add the minItems to the commit schema or an invariant to the
    RM class.
    SCOPE 2026-07-27 (group-12 audit): the entry is CONTRIBUTION-scoped, not
    EHR-route-scoped, and it reaches `POST /demographic/contribution`
    unchanged — `schemas/demographic/NewContribution.yaml` is a declared copy
    of the EHR one ("copy of same schema from `ehr`, as we need to redefine to
    use only demographic types — reminder to keep them in sync!") with the same
    missing `minItems`, and the RM class it commits is the same CONTRIBUTION
    with the same absent invariants section.
  disposition: fixed_handling
  upstream_issue: 1528

AMB-85:
  ambiguity: >-
    The RM's logical-deletion procedure requires committing a version
    whose data is DELETED (master06 §Logical Deletion: "delete its data"),
    but the released commit schema makes UpdateVersion.data REQUIRED with
    no null form — delete-through-contribution is not representable as
    the RM describes it (and the read-side Version schema likewise
    requires data, contradicting ORIGINAL_VERSION.data 0..1).
  source: >-
    RM common master06-change_control_package.adoc §Logical Deletion +
    UML/classes/org.openehr.rm.common.original_version.adoc (data 0..1)
    vs ITS-REST specifications/schemas/ehr/{UpdateVersion,Version}.yaml
    (data required) — confirmed first-hand.
  handling: >-
    Fixed handling: this server follows the RM — a 523|deleted| member
    MUST omit data (or carry JSON null, treated as absent) and a
    523|deleted| member CARRYING data is rejected 422; the stalled
    schema's required-data is not enforced for deletion members. Reported
    upstream (#1531): give the commit schema a deletion shape.
    SCOPE 2026-07-27 (group-12 audit): the same handling reaches the
    demographic commit — `schemas/demographic/UpdateVersion.yaml` is the
    declared sync-copy of the EHR one and likewise lists `data` among its
    required members, so a `523|deleted|` PARTY member omits data there too.
  disposition: fixed_handling
  upstream_issue: 1531

AMB-86:
  ambiguity: >-
    Whether the openehr-version / openehr-audit-details committal headers
    apply to the NATIVE contribution POST — whose body already carries the
    audit and per-version envelopes natively — is unstated: the overview
    MUST-accept sentence is scoped in context to the convenience
    PUT/POST/DELETE methods on change-controlled resources, and no
    precedence rule exists for a header value conflicting with a body
    value on the native route.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md
    §openehr-version and openehr-audit-details L74-94 (the scoping
    context) vs operations/contribution_create.yaml (no header
    parameters) — confirmed first-hand.
  handling: >-
    Fixed handling: on the native route the BODY is authoritative — the
    committal headers are not merged (they exist to give the convenience
    methods a metadata channel the native envelope already has); the
    server-set fields (time_committed, system_id fallback) apply
    identically either way. Reported upstream (#1532): state the header
    scope explicitly.
    SCOPE EXTENDED 2026-07-27 (group-12 audit) to the DEMOGRAPHIC contribution
    commit: `operations/demographic_contribution_create.yaml` declares the same
    parameter set minus the path id (Prefer, Accept, Content-Type — no
    committal headers) over the same relaxed envelope prose, so the identical
    body-is-authoritative handling applies to `POST /demographic/contribution`.
  disposition: fixed_handling
  upstream_issue: 1532

AMB-87:
  ambiguity: >-
    Whether the ETag / Last-Modified SHOULD reaches the CONTRIBUTION GET
    is left open: the overview SHOULDs both headers for "VERSION,
    VERSIONED_OBJECT, or other resources that have versioning or unique
    state identifiers", Resources.md classifies CONTRIBUTION as a
    NON-versioned resource, the released 200_CONTRIBUTION declares
    neither header — yet the 201 carries the contribution-uid ETag and a
    CONTRIBUTION is immutable with a unique identifier.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md
    §"ETag and Last-Modified" vs Resources.md §Resources (the
    non-versioned classification) vs responses/{200,201}_CONTRIBUTION.yaml
    — confirmed first-hand.
  handling: >-
    Fixed handling: the GET serves the contribution-uid weak ETag (the
    identity the 201 already carries) and Last-Modified from
    audit.time_committed — an immutable resource's unique identifier is a
    unique state identifier, and the instant of committal is its one
    modification instant. Reported upstream (#1533): declare the headers
    on the 200 or scope the SHOULD.
    SCOPE EXTENDED to the COMMIT response (POST /ehr/{ehr_id}/contribution and
    its demographic sibling): the same openness, the same fixed handling. The
    201 already carries the contribution-uid ETag on the released
    `responses/201_CONTRIBUTION.yaml` (headers ETag / Location / Content-Type
    — silent on Last-Modified, not conflicting), so the resource the response
    identifies has exactly the "unique state identifier" the §"ETag and
    Last-Modified" sentence names, and the instant it reports is the committal
    the same section points the value at. Last-Modified is therefore asserted
    on the commit under BOTH representation preferences — under
    `return=minimal` the body is empty, so the header is the only channel the
    commit instant has at all.
  disposition: fixed_handling
  upstream_issue: 1533

AMB-88:
  ambiguity: >-
    The type discipline of CONTRIBUTION.versions[i] OBJECT_REFs is
    internally tense in released text: the RM defines the refs as "Set of
    references to Versions causing changes" while the released schema
    example emits the DATA class (COMPOSITION, FOLDER) as the ref type
    with an OBJECT_VERSION_ID id; OBJECT_REF.type is "Name of the class
    ... of object to which this identifier type refers", which for an
    OBJECT_VERSION_ID id would be a VERSION type. The RM's own next
    sentence ("items of types such as COMPOSITION and FOLDER") leans to
    the data-class reading.
  source: >-
    RM common UML/classes/org.openehr.rm.common.contribution.adoc
    (versions meaning, both sentences); BASE
    UML/classes/org.openehr.base.base_types.object_ref.adoc (type
    meaning); ITS-REST specifications/schemas/common/Contribution.yaml
    (the example: type COMPOSITION / FOLDER) — confirmed first-hand.
  handling: >-
    Fixed handling: the wire follows the released example — versions[i]
    carries the DATA class (COMPOSITION / EHR_STATUS / FOLDER) as type,
    namespace local, and the full OBJECT_VERSION_ID (with _type) as id.
    Reported upstream (#1534): reconcile the RM wording with the example.
  disposition: fixed_handling
  upstream_issue: 1534

AMB-89:
  ambiguity: >-
    The RM mandates that an imported ORIGINAL_VERSION is wrapped as an
    IMPORTED_VERSION and "committed in the normal way (i.e. as part of a
    Contribution)" — but the released commit wire has NO path for it:
    NewContribution.versions items are UpdateVersion only (no oneOf, no
    _type, no item, no uid field to preserve the foreign identity), and
    the SM commit_contribution likewise takes List<UPDATE_VERSION> only.
    IMPORTED_VERSION is readable (the read-side unions) but not writable.
  source: >-
    RM common master06-change_control_package.adoc §Copying ("committed in
    the normal way (i.e. as part of a Contribution)"), §Contributions
    (import → 249|creation|), §Version and its Subtypes vs ITS-REST
    specifications/schemas/ehr/{NewContribution,UpdateVersion}.yaml (no
    import shape; ImportedVersion.yaml referenced only from read unions);
    SM UML/classes/i_ehr_contribution.adoc — confirmed first-hand.
  handling: >-
    Fixed handling: this server does not accept IMPORTED_VERSION members
    on the contribution route (nothing released defines the shape), and
    the refusal is ENFORCED rather than merely declared — a member
    carrying any of the three identity-bearing keys the released
    UpdateVersion schema does not declare is refused as the shape failure
    400_CONTRIBUTION.yaml describes ("syntactically invalid … content"),
    naming the key: `item` (the sole own attribute of IMPORTED_VERSION),
    `uid` (a locally committed version's identifier is allocated by this
    repository), and a `_type` naming any class other than
    UPDATE_VERSION / ORIGINAL_VERSION. A `_type` of one of those two IS
    accepted: the overview docs text makes `_type` a general metadata
    attribute whose value "MUST be the uppercase class name from the RM
    specification" (specifications/docs/overview/Resources.md §Resource
    representation), and the docs text outranks the OAS. Both names denote
    the SAME wire shape — the six-property commit-wire PARTIAL
    UpdateVersion.yaml declares — so admitting ORIGINAL_VERSION names the
    class the member BECOMES, never a licence to post a complete RM
    instance: the mandatory `uid` of ORIGINAL_VERSION
    (UML/classes/org.openehr.rm.common.original_version.adoc §Attributes,
    1..1) is filled by this repository's allocation and appears on the
    READ, which is why the member-borne `uid` refusal holds under either
    tag without contradicting that cardinality. Accepting the
    keys instead would commit a declared FOREIGN version as a locally
    created ORIGINAL_VERSION under a freshly minted local uid, silently
    discarding the identity and provenance the client declared. The
    distributed-import capability is realized by our own EHR-Extract
    import extension (import_ehr — flagged our-own-design), which
    preserves foreign version identities. The catalogue carries the
    refusal beside its accepting twin
    (-imported_version_member). Reported upstream (#1535): define the
    import commit shape.
  disposition: fixed_handling
  upstream_issue: 1535

AMB-90:
  ambiguity: >-
    The SM I_EHR_CONTRIBUTION interface and its commit DTOs carry an
    editorial defect bundle: get_contribution's precondition calls
    has_contribution with one argument (declared with two);
    commit_contribution's postcondition references a_contrib_id, which is
    not a parameter; both error-name spellings (ehr_id_does_not_exist /
    ehr_does_not_exist) and both parameter spellings (an_ehr_id / ehr_id)
    inside one interface; commit_contribution declares NO validation,
    conflict, or precondition error (its only error is
    ehr_id_does_not_exist) so the wire 400/409/412/422 families have no SM
    counterparts; has_contribution typed 0..1 with no return type; SM
    UPDATE_VERSION names the per-version audit "audit" where ITS-REST and
    RM say commit_audit, and carries NO signature attribute; SM
    UPDATE_AUDIT has NO system_id (master03 says it "need[s] to be
    generated on the server") — contradicted by released ITS-REST 1.1.0
    which added client system_id (SPECPR-472/SPECITS-95); SM's
    Terminology_code typing of change_type/lifecycle_state predates the
    released SPECITS-95 move to DV_CODED_TEXT and its own Change_type_valid
    invariant dereferences .defining_code, which Terminology_code lacks;
    UPDATE_AUDIT.description is String vs DV_TEXT (RM) vs UDvText
    (ITS-REST); no SM envelope uid parameter (the wire's client-uid 409
    has no counterpart). Minor released silences travel with the same
    report: the system_id "will be validated" criterion is undefined;
    contribution_uid is missing from the glossary; the Content-Type MUST
    exempts only 204 (a minimal 201 with an empty body is unaddressed);
    the cross-EHR contribution read is 404 only by implication; atomicity
    is an RM "should" never restated in ITS-REST; the copy-down rule
    (system_id/committer/time_committed "should be copied" into member
    audits) is unreconciled with the wire requiring a per-member
    committer.
  source: >-
    SM UML/classes/{i_ehr_contribution,update_version,update_audit}.adoc +
    SM openehr_platform master03-common_package.adoc §Version Update
    Semantics; ITS-REST specifications/schemas/{ehr/UpdateVersion,
    common/UpdateAudit}.yaml + docs/overview/Amendment_record.md
    (SPECITS-95, SPECPR-472) + Glossary_and_conventions.md; RM common
    master06 §Committal and Audits — confirmed first-hand.
  handling: >-
    Editorial: the catalogue keeps the SM operation names; wire behaviour
    adjudicates from the ITS-REST 1.1.0 released text (the newer, typed
    side of every divergence) + RM. Reported upstream (#1536).
  disposition: editorial
  upstream_issue: 1536

AMB-91:
  ambiguity: >-
    A wrong-kind uid on a typed tag route has no assigned outcome: the only
    released 404 text is "when the `uid_based_id` does not exist", which
    never says whether a kind mismatch is that miss or a 400. The released
    surface has SEVEN typed tag families, not two — the EHR-side pair
    (/ehr/{ehr_id}/{composition,ehr_status}/{uid_based_id}/tags) plus the
    demographic quintet
    (/demographic/{person|agent|group|organisation|role}/{uid_based_id}/tags)
    — so the mismatch has two directions the text covers equally poorly:
    WITHIN a space (an EHR_STATUS container's uid presented on
    /composition/{uid_based_id}/tags; a PERSON's container uid presented on
    /demographic/organisation/{uid_based_id}/tags) and ACROSS the two
    spaces (a COMPOSITION uid presented on a party tag route, or a party
    uid on a composition tag route) — the cross-space direction being one
    the EHR-only reading never had to consider.
  source: >-
    ITS-REST specifications/responses/404_unknown_ehr_id_or_uid_based_id.yaml
    and 404_unknown_ehr_id_or_uid_based_id_or_key.yaml (the EHR-side
    trigger sets) + responses/404_unknown_uid_based_id.yaml ("`404 Not
    Found` is returned when the `uid_based_id` does not exist") and
    404_unknown_uid_based_id_or_key.yaml (the demographic-side trigger
    sets — the whole 404 vocabulary of the five party tag families); the
    route-typed operation descriptions
    (operations/{composition,ehr_status}_tags_*.yaml and
    operations/{person,agent,group,organisation,role}_tags_*.yaml, the
    latter five byte-identical modulo the type name) — confirmed
    first-hand.
  handling: >-
    Fixed handling: a wrong-kind uid is 404 — it is not "the
    uid_based_id" of that route's resource family (the same route-kind
    discipline the version routes carry). Enforced on GET, PUT and DELETE
    alike, on all seven typed families, and in both directions: a uid of
    another kind WITHIN the space and a uid belonging to the other space
    are the same miss. Reported upstream (#1537): assign the branch.
  disposition: fixed_handling
  upstream_issue: 1537

AMB-92:
  ambiguity: >-
    "Prefer: return=identifier" is a legal enum value on the tag PUTs, but
    the released identifier contract cannot apply: it requires a non-204
    response whose body is "a single JSON object with a single `uid`
    attribute" — an ITEM_TAG has NO uid (its identity is the (key,
    target_path) pair) and the affected resource is a collection. No
    released text assigns the branch.
  source: >-
    ITS-REST specifications/parameters/header/Prefer.yaml (the enum) +
    docs/overview/Requests_and_responses.md §"Prefer only identifier" (the
    uid-body contract) vs RM
    UML/classes/org.openehr.rm.common.item_tag.adoc (no uid attribute) —
    confirmed first-hand.
  handling: >-
    Fixed handling: return=identifier on a tag PUT resolves to the APPLIED
    default return=minimal (204, Preference-Applied: return=minimal) —
    there is no identifier to return, and claiming the identifier
    preference was applied would be false. Reported upstream (#1538):
    assign or exclude the token for collection resources.
  disposition: fixed_handling
  upstream_issue: 1538

AMB-93:
  ambiguity: >-
    The rejection status for an ITEM_TAG violating its RM invariants
    (Inv_key_valid: non-empty, no leading/trailing whitespace;
    Inv_value_valid: a set value non-empty) is unassigned: all SEVEN tag
    PUTs — the EHR-side pair and the five demographic party PUTs, which
    carry the identical 200/204/400/404 response set — declare only 400
    ("syntactically invalid ... content") while such a
    body is well-formed JSON satisfying the schema — the overview's own
    422 row ("well-formed but was unable to be followed due to semantic
    errors") describes it. The party PUTs make the omission starker: their
    own party-update siblings (person_update.yaml and the other four) DO
    declare 422, so the same service answers semantic invalidity two
    different ways depending on whether the body is a PARTY or its tags.
  source: >-
    RM UML/classes/org.openehr.rm.common.item_tag.adoc §Invariants;
    ITS-REST
    operations/{composition,ehr_status,person,agent,group,organisation,role}_tags_update.yaml
    (responses 200/204/400/404 only — verified identical across the five
    party PUTs) CONTRASTED with
    operations/{person,agent,group,organisation,role}_update.yaml
    (which all five do declare 422) + Requests_and_responses.md §HTTP
    status codes (the 422 row) — confirmed first-hand.
  handling: >-
    Fixed handling: RM-invariant violations answer 422; syntactic
    failures (non-array body, non-string key, unparseable JSON) stay 400.
    Applied identically on all seven tag PUTs. Reported upstream
    (#1539): assign the branch.
  disposition: fixed_handling
  upstream_issue: 1539

AMB-94:
  ambiguity: >-
    The tag-list filter semantics are unstated in four ways, on BOTH
    released list routes: the EHR-scoped ehr_tags_get and the space-wide
    demographic_tags_get, which reference the SAME three parameter files
    and repeat the same sentence verbatim. The description says "filtered
    by the given one or more `tag_key`, `tag_value`, `tag_target_path`"
    while all three params are scalar strings
    (explode:true on a non-array schema is meaningless); how repeats of
    one param combine and how different params combine is unsaid; the
    match mode (exact/prefix/substring, case sensitivity) is unsaid; and
    matching tag_target_path against a tag with no target_path is unsaid.
  source: >-
    ITS-REST operations/ehr_tags_get.yaml and
    operations/demographic_tags_get.yaml (both descriptions carry the
    identical "one or more" sentence; both reference the same three
    parameter files) vs
    parameters/query/tag_{key,value,target_path}.yaml (scalar schemas, no
    description fields at all) — confirmed first-hand.
  handling: >-
    Fixed handling: the filters are scalar, AND-combined across
    parameters, exact-match, case-sensitive; a tag_target_path filter
    matches only tags carrying exactly that path (an absent path matches
    no path filter). One rule for both list routes — the filter grammar
    does not vary with the space being listed. (The demographic route's
    unbounded SCOPE is a separate silence, AMB-138; this entry fixes only
    what a supplied filter MEANS.) Reported upstream (#1540): define the
    filter grammar.
  disposition: fixed_handling
  upstream_issue: 1540

AMB-95:
  ambiguity: >-
    Duplicate (key, target_path) pairs inside ONE tag-PUT body have no
    released rule: identity is the pair, but the array schema carries no
    uniqueItems and no sentence assigns rejection or a merge order.
  source: >-
    ITS-REST operations/*_tags_update.yaml requestBody +
    schemas/common/UpdateItemTag.yaml; Requests_and_responses.md §item-tag
    headers (the identity sentence) — confirmed first-hand.
  handling: >-
    Fixed handling: last-wins — the posted set is deduped on the identity
    pair with the final occurrence kept, mirroring a full-replace applied
    left to right. Reported upstream (#1541): assign uniqueItems or a
    merge rule.
  disposition: fixed_handling
  upstream_issue: 1541

AMB-96:
  ambiguity: >-
    Empty-string vs absent target_path is identity-affecting and the two
    released artifacts model it differently: RM types target_path 0..1
    (absent = no path) with NO non-empty invariant, while SIX of the seven
    released ItemTagOf<T> examples write target_path: "" — under the (key,
    target_path) identity those would be two distinct tags. The ""
    spelling is the released MAJORITY, not an outlier: the EHR_STATUS
    example and ALL FIVE demographic examples (Person, Agent, Group,
    Organisation, Role) carry it; only the COMPOSITION example uses a real
    path, and no released example anywhere omits the attribute — so a
    client reading the examples would emit "" for an unpathed tag as a
    matter of course.
  source: >-
    RM UML/classes/org.openehr.rm.common.item_tag.adoc (target_path 0..1;
    invariants cover key and value only) vs ITS-REST
    specifications/schemas/ehr/ItemTagOfEhrStatus.yaml and
    specifications/schemas/demographic/ItemTagOf{Person,Agent,Group,Organisation,Role}.yaml
    (all six carry target_path: ""); the ...OfComposition example is the
    only one using a real path (/context/start_time/value) — confirmed
    first-hand.
  handling: >-
    Fixed handling: "" normalizes to ABSENT at the service seam — one
    identity, not two; served tags never carry an empty target_path. The
    released majority strengthens rather than weakens the normalization:
    "" is exactly what an example-following client sends, so accepting it
    and folding it into the no-path identity is the only reading that
    keeps such a client's tags addressable by the DELETE-by-key route.
    Applied identically on the EHR and demographic families. Reported
    upstream (#1542): pick one representation.
  disposition: fixed_handling
  upstream_issue: 1542

AMB-97:
  ambiguity: >-
    The ITEM_TAG released surface carries an editorial defect bundle: the
    RM invariant Inv_key_valid calls key.is_justified, a function defined
    NOWHERE (the BASE String class has no is_justified; the enforceable
    rule must be read off the prose Meaning column, whose "whitespace" is
    itself undefined); the DELETE 204 reuses "(logically) deleted" wording
    from the change-control family though an ITEM_TAG has no
    lifecycle_state; BOTH space-wide aggregates declare a single-kind list
    schema for a response spanning kinds — the EHR-wide list declares the
    COMPOSITION-specific schema (no 200_EHR_ItemTagList file exists) and
    the demographic space-wide list declares
    200_PERSON_ItemTagList_retrieved for a response spanning all five party
    kinds (no 200_DEMOGRAPHIC_ItemTagList file exists either), so a
    conformant ROLE tag in that list contradicts the declared schema;
    the demographic space-wide list's own description ends "...associated
    with any target within given EHR" — a copy-paste from ehr_tags_get
    onto the one tag route that has no EHR at all, and the only sentence
    in the whole demographic tag surface naming a resource the route
    cannot address; the five party tag families contradict themselves on
    what the container form of `uid_based_id` is taken FROM — the get and
    delete descriptions say "a HIER_OBJECT_ID identifier taken from
    VERSIONED_PARTY.uid.value", the update in the same family says
    "...taken from VERSIONED_OBJECT.uid.value", for what its own next
    sentence then calls "the target VERSIONED_PARTY container"; all seven
    _updated response files are byte-copies of their _retrieved sibling
    ("successfully retrieved" on a PUT — verified byte-identical for
    COMPOSITION, EHR_STATUS, PERSON, AGENT, GROUP, ORGANISATION and
    ROLE); XML is enumerated on every tag Accept/Content-Type while no
    ITEM_TAG canonical-XML type exists anywhere in ITS-XML and every
    content block is application/json-only; the released examples pair a
    HIER_OBJECT_ID target id with type COMPOSITION (a container id with
    the data-class name) and NO released example anywhere shows a
    VERSION-targeted tag — the form half the surface exists for; the
    DELETE descriptions name the parameter "tag_key" while the path
    declares {key}; the overview names FOLDER as a tag target but no
    /directory tag route exists and the released directory operations
    declare no item-tag headers (the wrapper prose is the only channel);
    the {key} path segment is an unconstrained string with no encoding
    rule; result ordering and paging are undefined on all NINE GETs (three
    EHR-side, six demographic) and both space-wide lists are unpaged; the
    optional-feature sentence ("If the server does not support
    ITEM_TAGs...") scopes only the headers and no
    tag route declares a refusal branch; nothing states tag persistence
    across new target versions, container-tag reach, or cascade on target
    deletion; and the whole class is development-RM-only (SPECRM-87) —
    the one surface in the released ITS-REST whose class link points at
    RM/development.
  source: >-
    RM UML/classes/org.openehr.rm.common.item_tag.adoc + BASE
    foundation_types string.adoc; ITS-REST specifications/
    (operations/*tags*.yaml — including operations/demographic_tags_get.yaml
    L9 "within given EHR" and the
    operations/{person,agent,group,organisation,role}_tags_{get,update,delete}.yaml
    VERSIONED_PARTY/VERSIONED_OBJECT split —,
    responses/200_*_ItemTagList_*.yaml (all seven _updated/_retrieved
    pairs byte-compared),
    204_deleted.yaml, schemas/{ehr,demographic}/ItemTagOf*.yaml,
    parameters/path/key.yaml, ehr.openapi.yaml L148-150,
    demographic.openapi.yaml §'/demographic/tags') +
    docs/overview/Requests_and_responses.md §item-tag headers; ITS-XML
    (grep: no ITEM_TAG) — all confirmed first-hand.
  handling: >-
    Editorial: the wire follows the RM class + the operation descriptions
    where they are the only released text; the served OpenAPI documents
    each defect in place. The two container-form namings denote one
    resource, so the split is wording only: a HIER_OBJECT_ID
    `uid_based_id` on a party tag route addresses the VERSIONED_PARTY
    container either way. NOT an ambiguity, recorded here for the same
    reader: the five party `<t>_update.yaml` declare only the
    `openehr-version-item-tag` request header while their own prose says
    "a `openehr-item-tag` or `openehr-version-item-tag` request header can
    be set" — their `<t>_create.yaml` siblings and every EHR-side
    change-controlled write declare both. That is an OAS-shape omission
    against released prose, not a spec silence: the docs text plus the
    operation's own sentence say both headers are settable, so both are
    accepted on the party updates and each lands in its own collection
    per the wrapper law. Reported upstream (#1543).
  disposition: editorial
  upstream_issue: 1543

AMB-98:
  ambiguity: >-
    The relation of the REST paging parameters (offset/fetch) to an
    in-query AQL LIMIT/OFFSET is entirely unlegislated: the one released
    exclusion clause targets the DEPRECATED TOP ("cannot be combined with
    AQL-top"), whose replacement LIMIT arrived in the same release. Nothing
    states whether REST paging overrides, composes with, or
    conflicts-and-errors against LIMIT/OFFSET, and no status code is
    assigned even to the stated TOP prohibition.
  source: >-
    ITS-REST specifications/docs/query/Request.md §Common Headers and
    Query Parameters (the fetch bullet, linking AQL #_top); QUERY AQL
    master03-syntax.adoc §TOP (deprecated) + §LIMIT — confirmed
    first-hand.
  handling: >-
    Fixed handling: REST paging COMPOSES OVER the AQL-limited result set —
    the AQL LIMIT/OFFSET clauses shape the logical result, then
    offset/fetch window it; fetch combined with the deprecated TOP is
    rejected 400 (the stated prohibition, code ours). Reported upstream
    (#1544): update the exclusion clause for LIMIT and define the
    composition.
  disposition: fixed_handling
  upstream_issue: 1544

AMB-99:
  ambiguity: >-
    The three query POSTs carry offset/fetch/query_parameters in the body
    while the released SHOULD-list ("All query execution requests SHOULD
    support at least the following parameters") draws no GET/POST
    distinction — the URL forms apply to POST too — and no released
    sentence assigns precedence when a value is carried in BOTH places.
    The same duality one level down from AMB-59.
  source: >-
    ITS-REST specifications/docs/query/Request.md §Common Headers and
    Query Parameters vs operations/query_execute_*_body.yaml (zero query
    parameters declared) — confirmed first-hand.
  handling: >-
    Fixed handling (the AMB-59 pattern): the POSTs accept the URL forms;
    a value carried in both places must agree — equal values accepted,
    a disagreement is 400. Reported upstream (#1545): assign the
    precedence.
  disposition: fixed_handling
  upstream_issue: 1545

AMB-100:
  ambiguity: >-
    No released sentence reserves the protocol parameter names (q, ehr_id,
    offset, fetch) from binding as AQL $parameters, and the spec collides
    with itself: the QueryParameters schema example binds ehr_id as a
    query parameter while Request.md §About the ehr_id parameter defines
    ehr_id as the EHR-scope protocol parameter, and the StoredQuery
    example's AQL binds $ehr_id.
  source: >-
    ITS-REST specifications/docs/query/Request.md §Query parameters +
    §About the ehr_id parameter; schemas/query/QueryParameters.yaml (the
    ehr_id example); schemas/query/StoredQuery.yaml (the $ehr_id example
    AQL) — confirmed first-hand.
  handling: >-
    Fixed handling: the four protocol names are reserved — a URL
    parameter named q/ehr_id/offset/fetch is ALWAYS the protocol
    parameter, never a $parameter bind; a query whose AQL declares
    $ehr_id receives it only through the JSON query_parameters object
    (where no protocol meaning exists). Reported upstream (#1546):
    reserve the names or rename the protocol parameters.
  disposition: fixed_handling
  upstream_issue: 1546

AMB-101:
  ambiguity: >-
    The SM error `ehr_id_does_not_exist` has no released wire
    realization: I_QUERY_SERVICE declares it on BOTH query operations,
    but the ad-hoc operations bind no not-found response at all, so a
    well-formed ehr_id scope naming an EHR that does not exist has no
    assigned outcome — an SM-to-ITS realization gap. (What the scope DOES
    is NOT part of this entry: SM defines `_ehr_ids_` as "Specific set of
    EHRs on which to execute the query. If none supplied, a full
    population query will be performed", and the ITS-REST query chapter
    states the same effect from the other side, calling population
    queries the ones "not referring or using any `ehr_id` parameter to
    constrain the scope on a specific EHR".)
  source: >-
    SM UML/classes/i_query_service.adoc §execute_ad_hoc_query (the
    `_ehr_ids_` parameter + the declared `ehr_id_does_not_exist` error);
    ITS-REST specifications/docs/query/Query_types.md §Population queries
    (the constraining effect) + §Single EHR queries; ITS-REST
    specifications/docs/query/Request.md §About the ehr_id parameter (the
    two carriers, at SHOULD strength); ITS-REST
    specifications/operations/query_execute_adhoc_query.yaml §responses
    (200/400/408 only — no not-found branch) — confirmed first-hand.
  handling: >-
    Fixed handling: a well-formed but unknown ehr_id answers 404,
    REALIZING the SM's declared ehr_id_does_not_exist (SM is a released
    oracle; the 404 is the only declared realization candidate). The
    scoping semantics need no adjudication — they are released text — so
    a conflicting in-AQL EHR predicate yields the intersection, empty
    when the two differ. Reported upstream (#1547): bind the unknown-EHR
    branch to a status.
  disposition: fixed_handling
  upstream_issue: 1547

AMB-102:
  ambiguity: >-
    A malformed {version} selector (not exact-3-part and not a
    {major}/{major}.{minor} prefix — e.g. "1.x", "v1", "1.2.3.4") has no
    assigned outcome; the released 404 trigger is "a stored query with
    qualified_query_name AND version does not exist". The same question
    covers a qualified_query_name outside [a-zA-Z0-9_.-] and the reserved
    org.openehr::aql form.
  source: >-
    ITS-REST specifications/parameters/path/version.yaml (the two legal
    forms) + responses/404_Query_version.yaml (the trigger);
    docs/query/Qualified_query_name.md (the class + the reserved-name
    NOTE) — confirmed first-hand.
  handling: >-
    Fixed handling: an unmatchable selector IS "a version that does not
    exist" — 404 under the released trigger's own wording (a selector
    matching nothing), covering malformed versions, out-of-class names,
    and the reserved name alike. This entry is the READ side only; the
    corresponding WRITE-side branches are AMB-122 (a version segment the
    versioned store cannot write) and AMB-123 (a store under the reserved
    name), both 400 rather than 404, because a write cannot address a
    resource that does not exist. Reported upstream (#1548): assign the
    malformed-selector branch explicitly.
  disposition: fixed_handling
  upstream_issue: 1548

AMB-103:
  ambiguity: >-
    The Query surface carries an editorial defect bundle. SM: RESULT_SET
    requiredness is inverted vs the wire (SM columns/id/creation_time 1..1
    with rows 0..1; the released schema requires rows alone, id has no
    wire field); the SM identifier grammar competes (mandatory
    reverse-domain namespace + slash-joined version vs the released
    optional-namespace + path-segment version); SM version matching is
    exact-3-part-only (no prefix concept); SM types query_parameters
    Hash<String,String> against the JSON-typed wire — breaking the AQL
    quoting NOTE that needs the number/string distinction; SM ehr_ids is a
    List with no wire realization (single ehr_id only) and is typed UUID;
    SM negative-value semantics (zero-or-negative fetch means ALL) exist
    only in SM and contradict HTTP intuition; the SM row shape is a
    wrapped object ({values: [...]}) vs the released bare array; the
    flattened wire descriptor loses version/formalism/registration_time —
    the EXECUTED STORED VERSION IS UNOBSERVABLE on the wire, weakening the
    prefix-matching contract; result_set.adoc carries "Rox data.", an
    empty Meaning cell, and a left-in authoring TODO. Released doc
    defects: Request.md's headline example uses the non-existent FETCH
    keyword and a malformed at-code node predicate; the vendored AQL
    grammar files (AqlParser/AqlLexer.g4) are MISSING from the QUERY
    component; the adjacent definition store operationIds carry a literal
    .yaml suffix; 400_Query declares no error body; the OAS is JSON-only
    against the canonical-format MUST while the ITS-XML RESULT_SET is a
    6-line draft stub; the glossary defines no query term; the CNF
    querying schedule links the demographic service model and is
    otherwise TBD/xx throughout.
  source: >-
    SM UML/classes/{i_query_service,stored_query_execute_spec,
    adhoc_query_execute_spec,result_set,result_set_column,result_set_row,
    result_query_descriptor,query_descriptor}.adoc + SM openehr_platform
    master08-query_service.adoc; ITS-REST docs/query/Request.md +
    schemas/query/* + operations/definition_query_*store*.yaml +
    responses/400_Query.yaml; QUERY docs/AQL master07-grammar.adoc (the
    missing includes); ITS-XML components/QUERY/latest/README.adoc; CNF
    platform_test_schedule master11 — all confirmed first-hand.
  handling: >-
    Editorial: the wire adjudicates from the released ITS-REST query
    prose + the QUERY component; the SM's competing shapes are design
    authority only. Reported upstream (#1549).
  disposition: editorial
  upstream_issue: 1549

AMB-66:
  ambiguity: >-
    The SM precondition `Pre_no_subject`: `an_ehr_status.subject = Void`, on
    `create_ehr` and `create_ehr_with_id`, is unsatisfiable and contradicts
    three released sources at once — including the paragraph directly beneath
    it. (1) RM: `EHR_STATUS.subject` is 1..1 PARTY_SELF, so a supplied
    EHR_STATUS whose subject is Void is not a valid EHR_STATUS at all and the
    precondition can never hold for a non-null argument. (2) The SM's own
    prose, two lines below the precondition: "A default `_subject_` will be
    generating containing a `PARTY_SELF` object" — describing a subject that
    exists, not one that is Void. (3) ITS-REST: the released API surfaces no
    for-subject create endpoint, so the EHR_STATUS body of POST /ehr and PUT
    /ehr/{ehr_id} is the ONLY way a client can ever give an EHR a subject;
    enforcing the precondition would make subject-bearing EHRs uncreatable over
    the released wire, and would strand the subject-keyed reads the same SM
    interface defines (`get_ehrs_for_subject`, `has_ehr_for_subject`).
  source: >-
    SM i_ehr_service.adoc §create_ehr and §create_ehr_with_id
    (`Pre_no_subject`: `an_ehr_status.subject = Void`, immediately followed by
    "A default `_subject_` will be generating containing a `PARTY_SELF`
    object") vs RM ehr EHR_STATUS class §Attributes (`subject`: 1..1
    PARTY_SELF — "The subject of this EHR") vs the released ITS-REST EHR API
    (no for-subject create operation; the optional EHR_STATUS body is the only
    subject-bearing input) — contradiction CONFIRMED first-hand.
  handling: >-
    Fixed handling: `Pre_no_subject` is treated as a released SM defect and is
    NOT enforced. A create carrying an EHR_STATUS with a subject is accepted
    and the subject becomes the EHR's subject, which is the only reading under
    which the same interface's subject-keyed operations
    (`create_ehr_for_subject`, `get_ehrs_for_subject`, `has_ehr_for_subject`)
    have anything to read, and the only one reachable over the released wire.
    Every subject-keyed case in the catalogue supplies its subject exactly that
    way (I_EHR_SERVICE.create_ehr-two_ehrs_same_patient,
    -existing_ehr_by_subject_id, -with_ehr_id_subject_taken), so the deviation
    is exercised rather than merely declared. No case asserts the
    precondition's rejection branch — a conformant server refusing a
    subject-bearing create would satisfy the SM sentence while failing the RM
    cardinality and the wire, and the catalogue does not test a server into a
    defect. Revisits when the SM drops or restates the precondition.
  disposition: fixed_handling
  upstream_issue: 1510

AMB-104:
  ambiguity: >-
    Partial-template_id resolution is PROMISED for the ADL 1.4 template routes
    but is underivable there, because no released component defines a grammar
    for an ADL 1.4 `template_id`. The path parameter states the behaviour — "A
    partial `template_id` will resolve to 'latest' major version of that
    template" — and illustrates it with two legacy examples ("Vital Signs",
    "vital_signs.v1") beside the HRID ones, but a partial id can only be
    resolved against a grammar that says which part of the id is the artefact
    and which the version. For the ADL2 routes that grammar exists (AM AOM2
    ARCHETYPE_HRID, whose `release_version` is a SEMVER, plus the released
    `{version}` selector spelling out the `{major}` / `{major}.{minor}` prefix
    forms). For ADL 1.4 nothing does: AM ADL 1.4 gives templates no
    identification or versioning semantics at all. So a server has two
    conformant readings of a GET for `test_versioned` when
    `test_versioned.en.v1` and `test_versioned.en.v2` are loaded — resolve it
    as a partial id to the latest, or treat every supplied id as complete and
    answer not-found, because no template is called `test_versioned`.
  source: >-
    ITS-REST specifications/parameters/path/template_id.yaml (the promise + the
    `legacy` / `legacy_version` / `hrid` / `partial` examples) +
    specifications/operations/definition_template_adl1.4_get.yaml (the ADL 1.4
    route that consumes it) CONTRASTED with
    parameters/path/template_id_adl2.yaml (HRID examples only) and
    parameters/path/version.yaml (the SEMVER prefix rule, which exists only for
    ADL2) + AM ADL 1.4 master02-overview.adoc §Templates (templates "do not
    introduce any new semantics to archetypes"; no template identification or
    versioning defined) — the absence of a legacy template_id grammar CONFIRMED
    first-hand.
  handling: >-
    Sibling cases carry option tags; the ICS options declaration selects.
    `adl14-partial-id-latest` takes the promise at face value: a server that
    imposes its own template-id convention resolves the partial id to the
    latest version (I_DEFINITION_ADL14.get_opt-retrieve_latest_version).
    `adl14-partial-id-exact` is the reading this CDR declares: with no released
    grammar there is nothing to decompose, so every supplied template_id is
    COMPLETE, an exact match is the only match, and an id matching no stored
    template is not-found — which also keeps the promise vacuously, since no id
    is identifiable as partial
    (I_DEFINITION_ADL14.get_opt-partial_template_id_no_match). Retrieval by a
    FULL template_id is not part of the latitude and gates for every server
    (I_DEFINITION_ADL14.get_opt-retrieve_specific_version reads the non-latest
    member of a two-version family back by its exact id). Distinct from AMB-4:
    that entry governs what a duplicate UPLOAD does, this one what a partial id
    RESOLVES to on retrieval.
  disposition: option_select
  options: [adl14-partial-id-latest, adl14-partial-id-exact]
  upstream_issue: 1550

AMB-105:
  ambiguity: >-
    The two released oracles give OPPOSITE answers for a duplicate ADL2
    artefact upload. SM `upload_artefact` commands replacement — "If an
    artefact with the same physical identifier and namespace exists, replace
    it" — while the ITS-REST ADL2 upload declares a conflict branch for exactly
    that request: "`409 Conflict` is returned when a template with same
    `template_id` already exists". Both are RELEASED components and the
    outcomes are mutually exclusive: a replacement is a success leaving one
    artefact with NEW content, a conflict is a refusal leaving the original
    content intact.
  source: >-
    SM i_definition_adl2.adoc §upload_artefact ("Upload an ADL2 artefact, i.e.
    archetype, template or operational_template. If an artefact with the same
    physical identifier and namespace exists, replace it.") vs ITS-REST
    specifications/operations/definition_template_adl2_upload.yaml (response
    '409') + responses/409_template_already_exists.yaml — released-vs-released
    contradiction CONFIRMED first-hand.
  handling: >-
    Fixed handling: the WIRE follows ITS-REST. A duplicate ADL2 upload is
    refused 409 and the stored artefact is untouched — the ITS binds the
    operation to HTTP and is the component a REST client can observe, while the
    SM sentence is design authority for a service model that need not be
    reached over this transport (the precedence the whole catalogue applies
    when SM and the ITS-REST docs text disagree on a wire fact). Gated by
    I_DEFINITION_ADL2.upload_artefact-duplicate_conflict. Distinct from AMB-4,
    which is a genuine SILENCE on the ADL 1.4 side (SM `upload_opt` says
    nothing about duplicates at all) rather than a contradiction. Reported
    upstream (#1551): reconcile the SM replace rule with the ITS 409, in
    either direction.
  disposition: fixed_handling
  upstream_issue: 1551

AMB-106:
  ambiguity: >-
    The SM keys ADL 1.4 OPTs by a UUID the released wire never carries.
    `has_opt`, `get_opt` and `delete_opt` all take `an_opt_id: UUID`, and
    `list_opts` returns `List<UUID>`; the odd sibling `list_matching_opts`
    returns `List<ARCHETYPE_ID>` instead, so the interface disagrees with
    itself about what an OPT is even called. The ITS-REST surface knows neither
    identifier: every ADL 1.4 route is keyed by the `template_id` string, and
    the listed metadata object carries template_id / concept / archetype_id /
    created_timestamp and NO uid at all — so the SM's key is not merely
    unrealized, it is unobtainable from the wire. (An OPT does carry a `uid`
    element inside the canonical XML the GET serves, but no released sentence
    connects it to the SM key or makes it addressable.)
  source: >-
    SM i_definition_adl14.adoc §has_opt / §get_opt / §delete_opt (`an_opt_id:
    UUID [1]`), §list_opts (`List<UUID>`), §list_matching_opts
    (`List<ARCHETYPE_ID>`) vs ITS-REST
    specifications/parameters/path/template_id.yaml (the only ADL 1.4 key),
    schemas/definition/TemplateMetadata.yaml (required template_id, concept,
    archetype_id, created_timestamp; optional deprecated version; no uid) and
    schemas/definition/TemplateList.yaml — CONFIRMED first-hand.
  handling: >-
    Report only. The wire keys ADL 1.4 templates by `template_id`, the only
    identifier the released ITS defines for them, and the catalogue's ADL 1.4
    cases address templates that way throughout; no case asserts a UUID key,
    and none is authorable, because the released list response gives a client
    nothing to read one from. The divergence is carried, never resolved
    privately, and is reported upstream (#1552) rather than absorbed. It sits
    beside AMB-37 (the ADL2 interface's artefact-generic operations vs the
    OPT-only ADL2 wire) — same family, different axis: AMB-37 is about which
    OPERATIONS exist, this entry about which IDENTIFIER they take.
  disposition: report_only
  upstream_issue: 1552

AMB-107:
  ambiguity: >-
    The two oracles specify DIFFERENT pattern languages for the same
    match-by-pattern behaviour, and only one of them defines a failure. SM
    `list_matching_opts` / `list_matching_archetypes` /
    `list_matching_artefacts` all take an `id_pattern` matched as a REGEX
    ("List all artefacts whose identifiers match a regex pattern") and each
    declares an `invalid_id_pattern` error. The ITS-REST list operations that
    realize them take `template_id` and `concept` query filters described as
    "Pattern for matching … (supports wildcards `*`)" — a glob, not a regex —
    and declare a single 200 response with no rejection branch, so a
    syntactically impossible pattern has no assigned outcome on the wire. The
    two languages are not interchangeable: `*` is a valid regex fragment with a
    different meaning (repeat the preceding atom) than its glob meaning (any
    run of characters), so one filter string selects different sets under the
    two readings.
  source: >-
    SM i_definition_adl14.adoc §list_matching_opts + §list_matching_archetypes
    and SM i_definition_adl2.adoc §list_matching_artefacts (regex + error
    `invalid_id_pattern`) vs ITS-REST
    specifications/parameters/query/filter_template_id.yaml ("Pattern for
    matching `template_id` (supports wildcards `*`)", example `vital*`),
    parameters/query/concept.yaml (same wording, example `*signs*`) and
    operations/definition_template_adl1.4_list.yaml +
    definition_template_adl2_list.yaml (a single '200' response, no 400) —
    CONFIRMED first-hand.
  handling: >-
    Fixed handling: the wire language is the ITS-REST one — `*` is a WILDCARD
    standing for any run of characters, the filter matches the whole candidate
    value, and no other character is special. Consequently no filter string is
    syntactically invalid, so the SM's `invalid_id_pattern` error has no wire
    realization and no rejection case is authorable (it would have to invent
    both the grammar and the status). The glob reading is exercised by
    I_DEFINITION_ADL2.list_matching_artefacts-filter. The remaining
    filter/paging semantics the released text leaves open are AMB-114.
    Reported upstream (#1553): state one pattern language for both
    components, and either bind the invalid-pattern error to a status or drop
    it.
  disposition: fixed_handling
  upstream_issue: 1553

AMB-108:
  ambiguity: >-
    The ADL 1.4 OPT sub-surface has realization gaps in BOTH directions.
    SM→ITS: four of the interface's OPT operations have no wire under
    /definition/template/adl1.4 — `valid_opt` (no validation endpoint),
    `has_opt` (no existence probe), `opts_count` (no count resource) and
    `list_matching_opts` as an operation of its own. ITS→SM: the `/example`
    sub-resource added in Release-1.1.0 (SPECITS-58) exists on BOTH template
    routes and realizes NO SM operation — the platform service model defines no
    example-generation function anywhere, so a released wire behaviour has no
    service-model anchor to name it by.
  source: >-
    SM i_definition_adl14.adoc (§valid_opt, §has_opt, §opts_count,
    §list_matching_opts — all defined) vs released ITS-REST 1.1.0 (the
    /definition/template/adl1.4 route set: list / upload / get / example only)
    + ITS-REST specifications/operations/definition_template_adl1.4_example_get.yaml
    and definition_template_adl2_example_get.yaml vs the SM Definition
    interfaces (i_definition_adl14.adoc, i_definition_adl2.adoc — no
    example-generation operation) + ITS-REST
    docs/overview/Amendment_record.md SPECITS-58 ("Add support for /example
    sub-resource under template-definition endpoint") — CONFIRMED first-hand.
  handling: >-
    Report only, both directions carried. SM→ITS: `valid_opt` is exercised
    through the upload (validation happens at commit — the
    I_DEFINITION_ADL14.validate_opt-* cases), while `has_opt`, `opts_count` and
    `list_matching_opts` have no wire and are recorded as honest boundaries in
    vocab/wire_surface.yaml rather than asserted. ITS→SM: the example routes
    are anchored to the closest SM read (`get_opt` / `get_artefact`) with
    `variant: example`, which is a CATALOGUE convention and not a claim that
    the SM defines them — the catalogue's naming law needs an SM anchor and the
    released service model supplies none. Reference, not duplication: the
    neighbouring families are already registered — AMB-17 (delete_opt has no
    wire), AMB-41 (ADL 1.4 archetype provisioning has no wire), AMB-37 (the
    artefact-generic ADL2 operations vs the OPT-only ADL2 wire, including
    `valid_artefact` and `has_artefact`). Reported upstream (#1554): realize
    or retire the four OPT operations, and give example generation an SM
    operation.
  disposition: report_only
  upstream_issue: 1554

AMB-109:
  ambiguity: >-
    The TEMPLATE surface carries an editorial defect bundle. (1) The released
    ADL2 upload's request example is not a legal OPT: its second clause is a
    `specialize` statement (`specialize openEHR-EHR-COMPOSITION.discharge.v1`)
    in a body the operation types as an `OperationalTemplateV2`, while AM says
    an OPT has "no specialisation statement - an OPT is considered a
    'top-level' standalone artefact" and the `adl_operational_template` ANTLR
    rule that fixes the artefact's outer structure has no `specialize`
    production at all — so the example cannot parse against the grammar it
    illustrates. (2) The Web Template metadata example in the Simplified
    Formats chapter carries a `semVer` member the released `WebTemplate` schema
    does not declare — the schema requires templateId / version /
    defaultLanguage / languages / tree and lists no `semVer` property — so the
    one worked example of the format shows a member no schema admits, and
    nothing says whether `semVer` and `version` are two spellings of one fact
    or two different facts.
  source: >-
    ITS-REST specifications/operations/definition_template_adl2_upload.yaml
    (the requestBody example, second clause `specialize`) vs AM
    docs/OPT2/master02-overview.adoc §Types of OPT ("no specialisation
    statement - an OPT is considered a 'top-level' standalone artefact") and
    docs/OPT2/master03-opt_raw.adoc §Artefact Structure (the
    `adl_operational_template` Antlr4 rule: `'operational_template' '('
    qualifiers? ')' ARCHETYPE_HRID 'language' … — no specialize production) +
    ITS-REST docs/simplified_formats/master04-basic_concepts.adoc §Web Template
    Metadata (the example's `"semVer": "0.2.0"` beside `"version": "2.3"`) vs
    specifications/schemas/web_template/WebTemplate.yaml (required
    templateId/version/defaultLanguage/languages/tree; the properties list
    carries no semVer) — all CONFIRMED first-hand.
  handling: >-
    Editorial: the wire follows the NORMATIVE side of each pair. The ADL2
    upload corpus is authored to the AM grammar (top-level
    `operational_template` artefacts, no specialize clause), so the released
    example's defect is documented rather than reproduced — a source carrying a
    specialize clause is an invalid artefact under AM, not a template the
    upload must accept. The Web Template document is served to the released
    schema, and `semVer` is neither required of a client nor asserted by any
    case. Reported upstream (#1555).
  disposition: editorial
  upstream_issue: 1555

AMB-110:
  ambiguity: >-
    Both template uploads leave response branches unassigned. (a) The SEMANTIC
    rejection has no status: the operations declare 201 / 400 / 409 only, the
    400 trigger is explicitly SYNTACTIC ("the request could not be parsed or is
    invalid (e.g. malformed request URL syntax, missing required header or
    parameter, or syntactically invalid header, parameter or content)"), and a
    body that parses perfectly but is not a valid operational template — a
    well-formed OPT XML with mandatory elements removed, an ADL2 source missing
    its `description` section — is by construction not that. The SM says such
    an upload must fail (`Pre_valid`: `valid_opt(an_opt)` /
    `valid_artefact(an_arch)`, errors `invalid_template` / `invalid artefact`)
    but assigns no code, being transport-neutral. (b) The `Prefer:
    return=minimal` branch — also the assumed default when no Prefer is sent —
    IS assigned by the operations' own 201 text ("If the `Prefer` header is
    missing or set to `return=minimal`, the body is empty"), while the overview
    says the opposite for the same exchange ("If no response body is returned,
    the service SHOULD use `204 No Content`").
  source: >-
    ITS-REST specifications/operations/definition_template_adl1.4_upload.yaml
    and definition_template_adl2_upload.yaml (responses 201/400/409 only) +
    responses/400.yaml (the syntactic trigger) +
    responses/201_Template_adl1_4_upload.yaml and
    201_Template_adl2_upload.yaml (identical text: representation → the full
    resource, identifier → only its unique identifier, "If the `Prefer` header
    is missing or set to `return=minimal`, the body is empty") +
    docs/overview/Requests_and_responses.md §HTTP status codes (row 422 "The
    request was well-formed but was unable to be followed due to semantic
    errors"; "Additional status codes MAY be used as long as they do not
    conflict with the predefined codes") + §"Prefer minimal, identifier or full
    representation response" (the SHOULD-204 sentence) + SM
    i_definition_adl14.adoc §upload_opt and i_definition_adl2.adoc
    §upload_artefact (preconditions + errors, no codes) — CONFIRMED first-hand.
  handling: >-
    Fixed handling, one position per branch. (a) THE SPLIT LAW, identical on
    both upload routes: content that fails its OWN SYNTAX answers the released
    **400** branch the operations declare — the docs-text trigger is
    "syntactically invalid content" (§HTTP status codes row 400) and the
    response component states it in the same words (responses/400.yaml: "the
    request could not be parsed or is invalid (e.g. … syntactically invalid
    header, parameter or content)") — while content that PARSES and is then
    invalid as a template artefact answers **422**, which is ADJUDICATED, not
    declared: no template operation lists 422 at all, and the position rests on
    the overview's own table defining 422 as "The request was well-formed but
    was unable to be followed due to semantic errors" plus its explicit "Additional
    status codes MAY be used as long as they do not conflict with the
    predefined codes". The semantic branch must NOT be folded into 400, whose
    trigger the released text confines to input that does not parse. The phase
    boundary is read off AM: a defect the artefact GRAMMAR rejects is syntax
    (AM `OPT2/master03-opt_raw.adoc` §Artefact Structure — the
    `adl_operational_template` Antlr4 rule; for ADL 1.4, XML well-formedness),
    a defect the AOM2 VALIDATION catalogue names is semantics (AM
    `AOM2/master08-validation.adoc` §Phase 1 - Basic Integrity). Both halves
    are exercised on both routes: 400 by
    I_DEFINITION_ADL14.upload_opt-unparseable_opt (an empty file is not
    well-formed XML) and I_DEFINITION_ADL2.upload_artefact-unparseable_artefact
    (a truncated cADL block, an empty source); 422 by the -invalid_opt and
    -invalid_artefacts fixture sweeps. Defects the two AM catalogues BOTH claim
    — a missing mandatory SECTION is a missing grammar production and a named
    validation check at once — are AMB-116 and are pinned by no case.
    (b) The minimal branch is **201 with an empty body**: the operation-level
    201 text is specific to these two operations and states the outcome
    directly, while the SHOULD-204 sentence is a general default in the
    overview and a SHOULD in any case; the specific released statement governs.
    SCOPE ADJUDICATED 2026-07-28 (#543): the specific-over-general reading is
    NOT Definition-scoped — the same shape holds wherever an operation family's
    own released response text assigns the minimal outcome, which the AMB-62
    re-adjudication confirmed is EVERY write family (the creates' 201 files end
    "If the `Prefer` header is missing or set to `return=minimal`, the body is
    empty"; 204_version_updated.yaml covers the updates). AMB-62 now carries
    the per-family assignment as the governing entry; this branch's two upload
    cases are simply the first instances of the general rule, and the remaining
    families' minimal-arm cases are the AMB-62 NEW-CASE set (tracked, #584).
    Gated by I_DEFINITION_ADL14.upload_opt-prefer_minimal and
    I_DEFINITION_ADL2.upload_artefact-prefer_minimal; the sibling identifier
    preference by -prefer_identifier on both. Reported upstream (#1556): add
    the semantic-rejection status to both uploads, and reconcile the 201-empty
    text with the overview's SHOULD-204.
  disposition: fixed_handling
  upstream_issue: 1556

AMB-111:
  ambiguity: >-
    No released sentence says how faithfully a template must be served back.
    The ADL 1.4 GET describes what it returns as "the original (canonical)
    `XML` based OPT format", which reads as verbatim but stops short of saying
    so, and the ADL2 GET says only "Retrieves the latest version of the ADL2
    operational template". Neither states whether the served artefact must be
    byte-identical to the uploaded one, semantically equivalent after a
    parse/re-serialize round trip, or merely a template of the same identity —
    a real difference, since a re-serialized OPT can reorder attributes,
    normalize whitespace, drop unrecognized elements or expand defaults, and a
    re-generated ADL2 source can renumber terminology codes.
  source: >-
    ITS-REST specifications/operations/definition_template_adl1.4_get.yaml
    ("Note that this can return either the original (canonical) `XML` based OPT
    format (if called with the `Accept: application/xml` request header)…") +
    definition_template_adl2_get.yaml ("Retrieves the latest version of the
    ADL2 operational template identified by `template_id` identifier.") +
    responses/200_Template_adl1_4_retrieved.yaml and
    200_Template_adl2_retrieved.yaml (representation only; no fidelity rule) +
    SM i_definition_adl14.adoc §get_opt and i_definition_adl2.adoc
    §get_artefact ("Get the … artefact with id `_an_id_`" — no fidelity rule) —
    silence CONFIRMED first-hand.
  handling: >-
    Fixed handling: retrieval is VERBATIM. What was uploaded is what is stored
    and what is served — the ADL 1.4 OPT as the canonical XML document the
    client sent, the ADL2 artefact as the source text it sent. This is the only
    reading under which "the original (canonical) XML based OPT format" means
    anything ("original" is otherwise redundant), and the only one a client can
    rely on when the OPT is its own contract for the data it commits: a
    re-serialization that silently normalized the template would change the
    constraints the client validated against without changing the template_id.
    The position is asserted rather than merely declared — the equivalence
    assertions on I_DEFINITION_ADL14.get_opt-retrieve_single and
    -retrieve_specific_version compare the served OPT against the uploaded
    fixture. Reported upstream (#1557): state the fidelity rule on both
    retrievals.
  disposition: fixed_handling
  upstream_issue: 1557

AMB-112:
  ambiguity: >-
    Whether the conditional-request headers apply to a TEMPLATE resource is
    left open. The overview scopes them by resource kind — "Both `ETag` and
    `Last-Modified` SHOULD be included in responses for VERSION,
    VERSIONED_OBJECT, or other resources that have versioning or unique state
    identifiers" — and a template is neither of the two named kinds, so the
    question turns entirely on the undefined trailing clause. A template does
    have a unique IDENTITY (its template_id, or the ARCHETYPE_HRID for ADL2)
    but no state that changes: the released uploads mint templates and neither
    route offers an update, so nothing a `Last-Modified` would track ever
    moves. No released sentence resolves either half, and no template operation
    declares a `Last-Modified` header or an `If-Match` / `If-None-Match`
    parameter.
  source: >-
    ITS-REST docs/overview/Requests_and_responses.md §"ETag and Last-Modified"
    (the SHOULD sentence; "The `ETag` value is usually taken from e.g.
    VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc. It
    changes as soon as the resource changes"; "Servers MAY add additional
    `ETag` response headers"; the weak-`W/` MUST) +
    specifications/responses/201_Template_adl1_4_upload.yaml and
    201_Template_adl2_upload.yaml (Location + ETag + Content-Type; no
    Last-Modified) + 200_Template_adl1_4_retrieved.yaml and
    200_Template_adl2_retrieved.yaml + the template operations' parameter lists
    (no conditional-request headers) — CONFIRMED first-hand.
  handling: >-
    Fixed handling, both halves. A template DOES carry a unique state
    identifier for the purposes of the trailing clause — its resolved identity,
    `template_id` for ADL 1.4 and the resolved ARCHETYPE_HRID for ADL2 — so an
    `ETag` is served on the template responses, weak-prefixed per the
    §Deprecated-headers MUST and naming the RESOLVED identity rather than the
    (possibly partial) addressed one. `Last-Modified` is NOT served: it reports
    when a resource last changed, and a released template resource never
    changes after creation, so any value would be an invention. No
    conditional-request precondition is honoured on the template routes,
    because none is declared there. The ETag declarations execute on the upload
    and retrieval bindings; nothing asserts the ABSENCE of Last-Modified, which
    stays a documented boundary rather than a claim. Reported upstream
    (#1558): say whether templates fall under the conditional-header SHOULD,
    and if so what `Last-Modified` means for an immutable resource.
  disposition: fixed_handling
  upstream_issue: 1558

AMB-113:
  ambiguity: >-
    The deprecated ADL2 "Get template at version" endpoint leaves two things
    open. (a) DEPRECATION SIGNALLING: the operation is marked deprecated
    (SPECITS-87) and remains fully specified — a description, a 200 with a
    representation, a 404 — but the release defines no way for a server to TELL
    a client that; there is no `Deprecation` or `Sunset` response header
    anywhere in the overview, and no sentence saying whether a conformant
    server may withdraw the route or must keep serving it. Deprecated-but-
    served and withdrawn-with-404 are equally consistent with every released
    sentence. (b) PRE-RELEASE SEMVER: the `{version}` selector is described as
    "A SEMVER version number… an exact version (e.g. `1.7.1`), or a pattern as
    partial prefix, in a form of `{major}` or `{major}.{minor}`", which covers
    neither the SEMVER pre-release forms (`1.0.0-rc.1`, `1.0.0-alpha`) that AM's
    own versioning chapter admits, nor how a prefix should treat them — whether
    `1.0` selects `1.0.0-rc.1` when that is the highest match, and whether a
    pre-release ever counts as "the highest (latest) version matching the
    prefix".
  source: >-
    ITS-REST specifications/operations/definition_template_adl2_version_get.yaml
    (`deprecated: true`; responses 200/400/404) +
    docs/overview/Amendment_record.md SPECITS-87 ("Deprecate ADL2 'Get template
    at version' and the version query parameter from upload template") +
    docs/overview/Requests_and_responses.md §HTTP headers (no
    Deprecation/Sunset header defined anywhere) +
    specifications/parameters/path/version.yaml (the two legal forms) + AM
    docs/Identification/master04-versioning.adoc (the SEMVER model, including
    pre-release versions) — CONFIRMED first-hand.
  handling: >-
    Fixed handling, both halves. (a) The deprecated route is SERVED, because it
    is released text with a fully specified success branch and the release
    provides no mechanism to signal or schedule its withdrawal; no deprecation
    header is emitted, since none is defined and inventing one would put a
    non-released header on the wire. The case that exercises it carries a guard
    so a SUT that has withdrawn the surface is not failed for it
    (I_DEFINITION_ADL2.get_artefact-version_get). (b) The `{version}` selector
    matches EXACT STRINGS outside the two released forms: a pre-release
    selector resolves only to the artefact whose version string equals it, and
    prefix resolution ranks only the release forms the parameter defines, so a
    pre-release never wins a `{major}` / `{major}.{minor}` prefix over a
    release version. Prefix resolution over the released forms IS gated
    (I_DEFINITION_ADL2.get_artefact-version_prefix). Reported upstream
    (#1559): define deprecation signalling and the withdrawal contract, and
    extend the version selector to the SEMVER pre-release forms.
  disposition: fixed_handling
  upstream_issue: 1559

AMB-114:
  ambiguity: >-
    The template list filters are described one parameter at a time and never
    as a query. Three questions have no released answer: how MULTIPLE filters
    combine (`?template_id=vital*&concept=*signs*` — conjunction, disjunction,
    or last-wins), what an `offset` at or beyond the end of the result set
    returns (an empty list, the last page, or a client error), and what the
    `version` filter means for an ADL 1.4 id whose version substring has no
    defined grammar (AMB-104). The one sentence that does more than name a
    parameter is the version filter's default — "if missing, then only the
    latest version will be returned" — which raises a fourth: it makes the
    UNFILTERED list version-suppressed, while the release's own example
    response shows a flat list of templates carrying no version field at all
    and the metadata schema marks `version` deprecated.
  source: >-
    ITS-REST specifications/parameters/query/filter_template_id.yaml,
    concept.yaml, filter_version.yaml ("Filter by version (e.g. `1.2.*` or use
    `*` for all versions), taken from `template_id`; if missing, then only the
    latest version will be returned"), offset.yaml ("The row number in
    result-set to start result-set from (`0`-based), default is `0`") and
    fetch.yaml + operations/definition_template_adl1.4_list.yaml and
    definition_template_adl2_list.yaml (a single '200' branch) +
    responses/200_TemplateList_adl1_4.yaml (the example list) +
    schemas/definition/TemplateMetadata.yaml (`version` present but
    deprecated) — silence CONFIRMED first-hand.
  handling: >-
    Fixed handling. Filters CONJOIN: each supplied filter narrows the result
    set, so a template must satisfy every one of them to be listed — the only
    reading under which adding a filter cannot widen a result, which is what
    "filter" means. Each filter matches the WHOLE candidate value with `*`
    standing for any run of characters (AMB-107). Paging applies AFTER
    filtering, and an `offset` at or beyond the end of the filtered set yields
    an EMPTY list rather than an error: the released 200 branch is the only one
    either list operation declares, an empty page is a fulfilled request, and
    the 0-based row-number wording makes the empty result the arithmetic
    answer. The glob half is exercised
    (I_DEFINITION_ADL2.list_matching_artefacts-filter); the conjunction and
    past-the-end halves are recorded as coverage gaps in
    vocab/wire_surface.yaml (`template-list-filter-conjunction`,
    `template-list-offset-past-end`) rather than claimed. Reported upstream
    (#1560): define filter combination, the past-the-end page, and the
    interaction of the version filter with an id whose version grammar is
    undefined.
  disposition: fixed_handling
  upstream_issue: 1560

AMB-115:
  ambiguity: >-
    The example-generation routes offer an explicit either/or and assign it to
    nobody, and only one of the two routes carries the sentence at all. The ADL
    1.4 operation says: "When the server does not support the requested `type`
    or `detail_level`, it will fall back to the closest supported level, or it
    may return an error (typically `400 Bad Request`)" — two conformant
    behaviours, no rule for choosing, and "typically" attached to the only code
    named. The ADL2 operation describes the same two parameters with the same
    enums and the same defaults but carries NO such sentence, so whether the
    latitude extends to it is itself unstated. Nor does either say what happens
    for a value OUTSIDE the declared enums (`detail_level=verbose`), as opposed
    to an enum value the server does not implement.
  source: >-
    ITS-REST specifications/operations/definition_template_adl1.4_example_get.yaml
    (the fall-back-or-error sentence + the `required` / `medium` / `complete`
    meanings + the NOTE "The implementation and completeness of these examples
    are not specified, and vendors may produce different results") vs
    definition_template_adl2_example_get.yaml (the same parameters, no such
    sentence) + parameters/query/example_type.yaml (enum input|output, default
    input) + parameters/query/example_detail_level.yaml (enum
    required|medium|complete, default required) + responses/400.yaml (the
    syntactic trigger, which an out-of-enum parameter value DOES meet:
    "syntactically invalid header, parameter or content") — CONFIRMED
    first-hand.
  handling: >-
    Fixed handling, applied UNIFORMLY to both routes: the ADL2 operation
    declares the identical parameters with the identical enums and the same 400
    response, and nothing suggests the two routes were meant to behave
    differently, so the ADL 1.4 prose is read as the surface's rule rather than
    one route's. This CDR takes the ERROR branch of the either/or: a request
    naming a `type` or `detail_level` it cannot produce answers 400 rather than
    silently substituting a different one, because a silent fall-back returns
    an example the client did not ask for with nothing on the wire saying so,
    and the released text names 400 as the code for that branch. An out-of-enum
    value is 400 under the released 400 trigger directly (a syntactically
    invalid parameter), independently of the either/or, so
    I_DEFINITION_ADL14.get_opt-example_invalid_detail_level gates for every
    server: a value outside the enum has no "closest supported level" to fall
    back to, which makes the fall-back branch unreachable there.
    RESIDUAL RESOLVED (#545, 2026-07-28): example generation is its own
    OPTIONS-tier capability (TemplateExamples — the CNF profiles book has no
    example row, the operation NOTE disclaims the output, and this entry's
    latitude exists), so the enum-member cases
    (I_DEFINITION_ADL14.get_opt-example_type_output and
    -example_detail_levels) and the out-of-enum 400 case now ride that row
    and can never gate CORE. The residual permitted configuration (a server
    that neither implements a member nor falls back) simply does not claim
    TemplateExamples and is not judged by these rows. The upstream ask
    stands: it closes when the released text assigns the branch (#1561) or
    the two enum members are made mandatory.
    Reported upstream (#1561): assign the unsupported-value branch, and give
    the ADL2 operation the same prose as its ADL 1.4 twin.
  disposition: fixed_handling
  upstream_issue: 1561

AMB-116:
  ambiguity: >-
    A MISSING MANDATORY SECTION of an ADL2 artefact belongs to both AM phases
    at once, so AMB-110's syntax-vs-semantics split law cannot place it. The
    `adl_operational_template` production makes `language`, `description`,
    `definition`, `terminology` and `component_terminologies` obligatory parts
    of the artefact's grammar, which puts a source lacking one in the SYNTAX
    phase; but the AOM2 validation catalogue's very first list also owns the
    same defect — "any missing mandatory parts, e.g. `terminology` section
    (STCNT)" appears under Phase 1 Basic checks, alongside genuinely semantic
    checks like VARDT — which puts it in the VALIDATION phase. AM never says
    which phase reports it, and the two phases carry different wire statuses
    (AMB-110: syntax → the released 400 branch, semantics → the adjudicated
    422). The same question covers the ADL 1.4 side for any defect an XML
    parser could reject as schema-invalid but an OPT validator could equally
    report as a semantic error.
  source: >-
    AM docs/OPT2/master03-opt_raw.adoc §Artefact Structure (the
    `adl_operational_template` Antlr4 rule: `'operational_template' '('
    qualifiers? ')' ARCHETYPE_HRID 'language' odin_text 'description'
    odin_text 'definition' cadl_text … 'terminology' odin_text …
    'component_terminologies' odin_text` — the sections are grammar
    productions, not optional decorations) vs AM
    docs/AOM2/master08-validation.adoc §Phase 1 - Basic Integrity §Basic checks
    ("any missing mandatory parts, e.g. `terminology` section (STCNT)"),
    listed among the validation checks; neither says which phase reports a
    missing section, and AM defines no phase-assignment rule — CONFIRMED
    first-hand.
  handling: >-
    Fixed handling: the wire status follows the phase in which the artefact
    engine actually detects the defect — 400 when the parse fails on the
    missing production, 422 when the source parses and the validator reports
    it. Both answers are released-grounded under AMB-110's split law, so
    neither is a divergence, and the CATALOGUE pins neither: every rejection
    case uses a fixture whose phase is unambiguous — an unparseable or empty
    source for 400 (I_DEFINITION_ADL2.upload_artefact-unparseable_artefact,
    I_DEFINITION_ADL14.upload_opt-unparseable_opt), a parseable source failing
    a NAMED AOM2 validity check for 422
    (I_DEFINITION_ADL2.upload_artefact-invalid_artefacts, whose fixture
    violates VARDT). The section-boundary fixtures
    (cnf.adl2.opt.invalid.missing_description /
    cnf.adl2.opt.invalid.missing_definition) stay in the corpus, referenced by
    no case, precisely because pinning them would author a status the released
    text does not settle. Reported upstream (#1562): say which phase owns a
    missing mandatory section, or make the two catalogues disjoint.
  disposition: fixed_handling
  upstream_issue: 1562

AMB-117:
  ambiguity: >-
    The released text calls a stored query overwritable and immutable in the
    same breath, and never says which version a VERSION-LESS store writes.
    `definition_query_store` describes itself as "Stores a new query, or
    updates an existing query on the system" and declares only 200 and 400 —
    no conflict branch — while the resource's own tag prose says stored
    queries "provide a reusable, immutable way to identify a specific AQL
    statement", and the versioned sibling declares exactly the 409 that
    immutability implies. Nor does anything assign the minted version: the
    version-less operation takes no `version`, `Qualified_query_name.md`
    makes the version "optional" but states its absent/partial rule for USE
    ("the system must use the latest `version` with the supplied prefix"),
    which is a resolution rule over versions that already exist and says
    nothing about which one a write creates; the single illustration is the
    Location example's `…/org.openehr::compositions/1.0.1`, a minted version
    shown without a rule for choosing it. Re-adjudicated 2026-07-28 against
    the one reading that would close the gap — taking that rule's "or when
    `version` is not supplied at all" clause to govern the STORE — and it is
    affirmatively wrong, not merely strained: see the handling.
  source: >-
    ITS-REST specifications/operations/definition_query_store.yaml
    (description "Stores a new query, or updates an existing query on the
    system."; responses '200' + '400' only) vs
    specifications/tags/StoredQuery_schema.md ("Stored queries provide a
    reusable, immutable way to identify a specific AQL statement that can be
    executed later.") vs operations/definition_query_version_store.yaml
    (responses 200/400/409) + responses/409_StoredQuery_version.yaml ("`409
    Conflict` is returned when a query with the given `qualified_query_name`
    and `version` already exists on the server.") + docs/query/
    Qualified_query_name.md (the version is "optional"; the partial/absent
    rule is stated for use) + headers/Location_Query.yaml (the example
    `…/org.openehr::compositions/1.0.1`) — CONFIRMED first-hand.
  handling: >-
    Fixed handling, resolved BY FORM: the two sentences stop competing once
    the two operations are read apart. The VERSION-LESS store is the
    overwriting form — it writes one default slot and there "updates an
    existing query", which is precisely what its missing 409 says — while the
    VERSIONED store is the immutable form, where an existing
    `(name, version)` pair is refused 409 and never replaced. Immutability is
    therefore a property of a version-ADDRESSED definition, not of the name.
    Reading `Qualified_query_name.md`'s "or when `version` is not supplied at
    all … the system must use the latest `version`" into the STORE is the one
    move that would make the minted version derivable, and it is refuted twice
    over. First, it would have a version-less store target and OVERWRITE the
    latest EXISTING version — silently replacing a version-ADDRESSED
    definition that the sibling route protects as immutable with a 409, and
    destroying a definition the client never named; a rule cannot both forbid
    a write through one route and mandate it through another. Second, it
    assigns nothing at all on a FIRST store, when no "latest query version"
    exists — which is exactly the moment a creation rule would be needed. The
    clause is therefore a rule for USING a stored query, as its chapter says
    ("Stored queries are identified by their name … and an optional `version`
    number"), and the minted version stays genuinely unassigned: the slot
    below is OUR adjudication of a released silence, gated as such and
    reported upstream, not a value the release states.
    The default slot is the constant `1.0.0`: it is the lowest SEMVER a first
    store can carry, it keeps the version-less form idempotent (a second
    store updates the same slot instead of accumulating versions no client
    asked for and no client can predict), and it is the only choice that
    needs no minting rule — every alternative (increment the patch, take the
    highest stored version plus one) would create versions the released text
    never promises and would make the version-less store's own Location
    unpredictable. The slot is CONSTANT even when higher versions exist: a
    version-less store beside a stored `2.0.0` still writes and names
    `1.0.0`, because the version-less form addresses the default slot, not
    the name's latest. Gated by
    I_DEFINITION_QUERY.store_query-default_version_slot (the Location and the
    read-back both name 1.0.0), -update_in_place (a second version-less store
    updates the same slot: one row, the new text, no 409),
    -default_slot_with_higher_version (the constant slot beside a stored
    2.0.0) and -version_duplicate_conflict (the immutable half). Reported
    upstream (#1563): state the minted version of a version-less store, and
    reconcile the overwrite sentence with the immutability prose.
  disposition: fixed_handling
  upstream_issue: 1563

AMB-118:
  ambiguity: >-
    SM `store_query` and the released wire disagree about what a store TAKES
    and what it RETURNS. SM: `store_query(a_query_text, a_type, a_query_name:
    String[0..1]): QUERY_DESCRIPTOR` — "Register a query under a qualified
    name. If no name is provided, one is created in the service. Return a
    Query descriptor containing the query name and unique identifier." On the
    wire the name is a REQUIRED path segment, so the nameless form is not
    even requestable and a server-minted name would have no way to reach a
    client; and the success response is BODYLESS (the released 200 declares a
    description and a `Location` header and no content), so the descriptor is
    not returned. The "unique identifier" that sentence promises exists in
    neither model: SM's own QUERY_DESCRIPTOR declares qualified_query_name /
    version / registration_time / formalism / source and no identifier
    attribute, and the wire `StoredQuery` carries name / type / version /
    saved / q.
  source: >-
    SM UML/classes/i_definition_query.adoc §store_query (the signature, the
    `[0..1]` name, and the quoted Meaning) + UML/classes/query_descriptor.adoc
    (§Description "Object describing a query in terms of its unique
    identifier…" against an attribute list with no identifier) vs ITS-REST
    specifications/parameters/path/qualified_query_name.yaml (`required:
    true`) + operations/definition_query_store.yaml +
    responses/200_StoredQuery_stored.yaml (description + Location header, no
    `content`) + schemas/query/StoredQuery.yaml (required name/type/version/
    saved/q) — CONFIRMED first-hand.
  handling: >-
    Report only. The wire is what the released ITS binds: the client supplies
    the name on the path, and the store answers 200 with no body and a
    Location naming the stored resource; a client that wants the descriptor
    reads it back through the version get. No case asserts a nameless store
    or a descriptor response body — neither is requestable or observable over
    the released wire, and authoring one would test a server into a shape the
    ITS does not offer. The divergence is carried, never resolved privately.
    Sits beside AMB-127, which records the realization gaps of the same
    interface: this entry is about the SHAPE of the one realized store,
    AMB-127 about which operations exist at all. Reported upstream (#1564).
  disposition: report_only
  upstream_issue: 1564

AMB-119:
  ambiguity: >-
    The overview says two things about `Location` on a write, and the
    stored-query stores sit exactly between them. §Location is exclusive
    about the STATUS: the header "is used by a server to indicate the URL of
    a newly created resource … in `201 Created` responses when a new resource
    is successfully created", "It MUST NOT be used to indicate an alternate
    representation of an existing resource", and the deprecation note reads
    "The `Location` header MUST ONLY be used for resource creation (e.g.,
    `201 Created`) or redirect responses". §"Prefer minimal, identifier or
    full representation response" is not: on the `return=minimal` branch "The
    response SHOULD include a `Location` header pointing to the newly created
    or updated resource. The HTTP status is typically `201 Created`", and on
    the identifier and representation branches the response "MAY include a
    `Location` header" where "The HTTP status is typically `201 Created` or
    `200 OK`" — a `Location` paired with a 200 in the overview's own words.
    Neither passage says which governs a write the release assigns `200` and
    never `201`, which is what both stored-query stores are.
  source: >-
    ITS-REST docs/overview/Requests_and_responses.md §Location (the three
    quoted sentences, incl. the DEPRECATION note's MUST ONLY) + §"Representation
    details negotiation" ("If no `Prefer` header is provided, the default
    behavior is assumed to be `return=minimal`") + §"Prefer minimal,
    identifier or full representation response" (the quoted minimal-branch
    SHOULD and the "201 Created or 200 OK" pairings) + §HTTP status codes
    (row 200 "The request succeeded, payload sent in a 200 response depends
    on the request method") vs
    specifications/responses/200_StoredQuery_stored.yaml (which declares the
    header on the store's 200) + headers/Location_Query.yaml ("The `Location`
    response header indicates the URL of the Stored Query resource.") +
    operations/definition_query_store.yaml and
    definition_query_version_store.yaml (both map success to '200' and
    declare no `Prefer` parameter) — CONFIRMED first-hand.
  handling: >-
    Fixed handling: both stores answer 200 and DO carry `Location`. The
    decisive docs-text sentence is the `return=minimal` one — the stores
    declare no `Prefer` parameter, so by "If no `Prefer` header is provided,
    the default behavior is assumed to be `return=minimal`" every request to
    them is that exchange, and its text assigns the header directly: "The
    response SHOULD include a `Location` header pointing to the newly created
    or updated resource." §Location's MUST ONLY is not contradicted, because
    it restricts the header to "resource creation … or redirect responses"
    and a store IS the creation or update of the resource the header names;
    what its parenthetical fixes is an EXAMPLE status, not the only one, and
    the same overview pairs `Location` with `200 OK` two sections later. The
    substantive prohibition — `Location` as an ALTERNATE REPRESENTATION of an
    existing resource, i.e. on a read — stands untouched and is asserted the
    other way: `Location` is declared PRESENT on both store outcomes (pinned
    to the written version on the version-less store — AMB-117) and ABSENT on
    every stored-query read. Reported upstream (#1565): say whether the
    §Location status rule or the §Prefer branch governs a 200-status
    creation, since the release assigns these operations 200 and no 201.
  disposition: fixed_handling
  upstream_issue: 1565

AMB-120:
  ambiguity: >-
    Two released components define DIFFERENT grammars for the same stored-query
    identifier, and neither defers to the other. SM master04 §Registered
    Queries: names "may include a namespace and optionally a formalism type",
    with the schemes `<namespace>::<query-name>` AND
    `<namespace>::<formalism>::<query-name>` (its own example
    `"task_planning::aql::chemotherapy_plans"`), and "If no namespace is
    supplied, the namespace `"misc"` is assumed"; §Query Formalism makes the
    formalism parameter case-insensitive with an optional `::`-separated
    version and "If no version identifier part is supplied, the major version
    "1" is assumed", so that "AQL", "aql" and "AQL::1" are "all equivalent".
    ITS-REST defines only `[{namespace}::]{query-name}` — two parts, no
    formalism segment — with an optional namespace and NO default for it, a
    query-name charset of `[a-zA-Z0-9_.-]`, and a flat `query_type` string
    parameter for the formalism. The consequences differ observably: the SM's
    three-part example is not a legal ITS name, and a bare `my_compositions`
    is one identifier under ITS but `misc::my_compositions` under SM — so the
    same PUT and the same GET may or may not address the same stored query.
    A third silence rides along: the `query_type` parameter and the
    `QueryType` schema both declare `default: "AQL"`, while every released
    example of a stored query's `type` member spells it `"aql"`, and nothing
    says whether the served value echoes what was declared or is normalized.
  source: >-
    SM openehr_platform master04-definition_package.adoc §Registered Queries
    (the two schemes, the examples, "If no namespace is supplied, the
    namespace `"misc"` is assumed") + §Query Formalism (case-insensitive,
    optional `::` version, "the major version "1" is assumed", the three
    equivalent `_type_` values) vs ITS-REST docs/query/Qualified_query_name.md
    (the `[{namespace}::]{query-name}` form, the optional namespace with no
    default, the `[a-zA-Z0-9_.-]` query-name pattern, the valid-name
    examples) + specifications/parameters/query/query_type.yaml and
    schemas/query/QueryType.yaml (`default: "AQL"`) vs
    schemas/query/StoredQuery.yaml and schemas/definition/QueryList.yaml (the
    examples' `"type": "aql"`) — CONFIRMED first-hand.
  handling: >-
    Fixed handling: a documented blend, each half taken from the component
    that governs it. The WIRE grammar is the ITS one — a client addresses
    `[{namespace}::]{query-name}` and is never required to supply a third
    segment. The STORAGE KEY adopts the SM defaults, because they are the
    only released rule that makes two spellings of one query the same query:
    a namespace-less name is keyed under `misc`, so `my_compositions` and
    `misc::my_compositions` are one stored query addressable either way
    (without that default the two spellings would be different registrations
    and a client could store under one and 404 under the other), and a
    three-part `ns::formalism::name` decomposes per §Registered Queries so
    its middle segment is read as the formalism and never as part of the
    query-name — which is also what puts the reserved-name rule on the right
    segment (AMB-123). A dot inside a name stays part of the query-name, per
    the ITS charset, and is never a separator. Formalism values compare
    case-insensitively per §Query Formalism, so the server keys and serves
    the `type` member in ONE canonical spelling — the `QueryType` schema
    default `AQL` — regardless of the casing the client declared (`aql`,
    `AQL` and `AQL::1` are "all equivalent" per §Query Formalism, so the
    normalization is semantically lossless; which spelling the released text
    itself prefers remains contradictory — schema `default: "AQL"` against
    every worked example's `"aql"` — and is carried upstream rather than
    resolved here). The NAME halves
    are exercised — I_DEFINITION_QUERY.store_query-unqualified_name and
    -dotted_name (the namespace-less and dotted forms store and resolve back)
    and list_queries-prefix_all_versions (the prefix list over the canonical
    key). The CASING half is deliberately NOT gated: pinning either spelling
    would assert what the released text declares two ways at once, so the
    served canonical `AQL` is carried here and left for the upstream ruling.
    Reported upstream (#1566).
  disposition: fixed_handling
  upstream_issue: 1566

AMB-121:
  ambiguity: >-
    SM defines a query LISTING the released wire does not have. `list_queries`
    takes `item_offset` / `items_to_fetch`; `list_matching_queries` takes TWO
    PERL regexes — one on the query identifier, one on "archetype / template
    identifiers" referenced INSIDE the query text — plus the same paging
    pair, and declares an `invalid_id_pattern` error. The released wire has
    one list operation, `GET /definition/query/{qualified_query_name}`, whose
    only parameter is the required name, matched as a PREFIX ("will list all
    versions of all queries with names starting with `org.openehr`"), with a
    single 200 branch. So the wire has no regex language, no
    artefact-reference filter, no paging, and no rejection branch that could
    carry the SM error.
  source: >-
    SM UML/classes/i_definition_query.adoc §list_queries (item_offset,
    items_to_fetch) and §list_matching_queries ("List all registered queries
    matching an identifier pattern (regex) and an artefact identifier pattern
    (regex) for artefacts referenced in the query"; "`_id_pattern_`:: PERL
    regular expression on query identifier"; error `invalid_id_pattern`) vs
    ITS-REST specifications/operations/definition_query_list.yaml (parameters:
    qualified_query_name + Accept only; the prefix examples; a single '200') +
    parameters/path/qualified_query_name.yaml — CONFIRMED first-hand.
  handling: >-
    Report only. The wire matches by the released PREFIX rule and nothing
    else: no filter string is a regex, so the SM's `invalid_id_pattern` has
    no wire realization and no rejection case is authorable (it would have to
    invent both the pattern language and the status). `list_matching_queries`
    carries an explicit `unrealized` its-rest binding and an SM-anchored case,
    so the gap is not-applicable WITH CITATION rather than silently absent
    (AMB-127 records the full realization picture). The realized list's own
    open questions — empty result, ordering, and the missing paging the SM
    form implies — are AMB-124. Reference, not duplication: AMB-103 already
    carries the adjacent SM-vs-wire identifier and paging clauses for the
    query EXECUTION surface; this entry is the DEFINITION surface's listing.
    Sits beside AMB-107, the same regex-vs-glob shape on the template list.
    Reported upstream (#1567).
  disposition: report_only
  upstream_issue: 1567

AMB-122:
  ambiguity: >-
    The `{version}` path parameter is described ONCE, for the read and the
    write routes alike, in purely read-resolution terms: "A SEMVER version
    number. This can be an exact version (e.g. `1.7.1`), or a pattern as
    partial prefix, in a form of `{major}` or `{major}.{minor}` (e.g. `1` or
    `1.0`), in which case the highest (latest) version matching the prefix
    will be considered." The DOCS TEXT states the same rule and no other:
    "When only a partial `version` pattern is supplied, or when `version` is
    not supplied at all, the system must use the latest `version` with the
    supplied prefix - i.e. if only `major` or `major.minor` is used, then the
    latest query version matching supplied prefix will be used." Applied to
    the versioned STORE that rule is not merely odd but SELF-REFUTING, and
    nothing released replaces it. The versions it resolves among are ones that
    ALREADY EXIST ("the latest query version matching"), so on a name that has
    them the target it yields is by construction an existing
    `(name, version)` pair — exactly the trigger the same operation assigns to
    409 — which would make the operation's own declared 200 unreachable for
    every prefix; and on a name that has none it yields no version at all,
    leaving the write with nothing to address. Nor does the release ever
    COMPLETE a prefix into a version to create: this surface carries no
    minting rule anywhere. The same silence covers a SEMVER
    pre-release/build-metadata form and any other token — the operation
    declares 200/400/409, its 409 trigger is a duplicate `(name, version)`
    pair, and no released sentence names the branch these take.
  source: >-
    ITS-REST docs/query/Qualified_query_name.md (the quoted partial/absent
    version rule, and "The `version` identifier is in the format specified by
    SEMVER style (i.e. `major.minor.patch`)") +
    specifications/parameters/path/version.yaml (the quoted description,
    shared by definition_query_version_store.yaml,
    definition_query_version_get.yaml and the query-execution routes) +
    operations/definition_query_version_store.yaml (responses 200/400/409) +
    responses/409_StoredQuery_version.yaml (the duplicate-pair trigger) +
    responses/400.yaml ("the request could not be parsed or is invalid (e.g.
    malformed request URL syntax, missing required header or parameter, or
    syntactically invalid header, parameter or content)") + docs/overview/
    Requests_and_responses.md §"HTTP status codes" (the `400 Bad Request` row
    and the generic-client-error sentence below the table) — CONFIRMED
    first-hand; RE-ADJUDICATED 2026-07-28 (the earlier grounds are corrected
    in the handling below).
  handling: >-
    Fixed handling: the versioned store requires an EXACT three-part numeric
    `major.minor.patch`, and every other token — a prefix (`1`, `1.0`), a
    pre-release or build-metadata form (`1.0.0-rc.1`), a non-numeric segment —
    is refused with the operation's declared 400. The STATUS is ASSIGNED by
    the docs text rather than chosen: docs/overview/Requests_and_responses.md
    §"HTTP status codes", immediately below the table — "Status code `400`
    indicates normally a bad request, as well as a generic client-side error,
    used when no other `4xx` error code is appropriate. The client SHOULD NOT
    repeat the request without modifications." A store the release gives no
    version to write is precisely that generic client error, and re-issuing
    with an exact version is precisely the modification the sentence demands.
    No other 4xx fits: 409 needs a duplicate pair, which a fresh name does not
    have, and 404 would claim the resource does not exist rather than that the
    request may not create it (the read-side counterpart is AMB-102, kept
    deliberately distinct — a READ addressing an unmatchable selector names no
    existing resource, while a WRITE cannot address a non-existent resource at
    all). "Syntactically invalid … parameter" is expressly NOT the ground and
    the earlier entry was wrong to lean on it: the prefix form is a shape
    `version.yaml` explicitly DECLARES legal, so the defect is that a legal
    READ selector designates no version to WRITE, not that the token is
    malformed. The three-part restriction is released text too, not a house
    rule: the docs text glosses the identifier as "SEMVER style (i.e.
    `major.minor.patch`)" and the parameter enumerates exactly three
    admissible shapes — exact, `{major}`, `{major}.{minor}` — none of which
    carries a suffix. (The earlier "an unorderable version" argument against a
    pre-release form is WITHDRAWN: SEMVER 2.0.0 §11 does define pre-release
    precedence, so orderability was never the problem; the released
    three-part gloss is.) Storing the segment verbatim remains untenable on
    its own terms: the read must resolve a `{major}`/`{major}.{minor}` prefix
    to "the highest (latest) version matching", and the list is
    SEMVER-ascending (AMB-124), so a stored bare `1` collides with the very
    algebra that must resolve `1` to a full version and a stored non-numeric
    version has no place in that order.
    Gated by I_DEFINITION_QUERY.store_query-version_prefix_rejected,
    -version_prerelease_rejected and -version_malformed_rejected. Reported
    upstream (#1568): state the write-side version grammar, since the
    parameter's prefix semantics cannot apply to a store.
  disposition: fixed_handling
  upstream_issue: 1568

AMB-123:
  ambiguity: >-
    Whether a stored query is CHECKED at store time, and against what, has
    three released sources that never meet. SM makes it a precondition:
    `store_query` carries `Pre_valid_query: is_valid_query(a_query_text)`,
    and `valid_query` "Return True if the provided query text is a valid
    instance of the formalism" — the precondition names a function
    `is_valid_query` the interface does not declare (the declared operation
    is `valid_query`), an editorial defect that leaves the precondition
    formally dangling. ITS-REST declares only the general syntactic 400 on
    both stores and never mentions validity. QUERY 1.1.0 is silent on stored
    queries entirely — the component specifies AQL, not a query registry — so
    no semantic validity contract for a STORE exists anywhere. Two adjacent
    branches are unassigned in the same way: a store under the reserved
    query-name `aql`, which the released NOTE forbids without naming a
    status, and a store declaring a `query_type` the service does not
    implement, which the flat string parameter admits without saying what
    happens.
  source: >-
    SM UML/classes/i_definition_query.adoc §store_query (`Pre_valid_query`:
    `is_valid_query(a_query_text)`) and §valid_query (the declared operation
    name and its Meaning) vs ITS-REST
    specifications/operations/definition_query_store.yaml and
    definition_query_version_store.yaml (400 the only rejection) +
    responses/400.yaml (the syntactic trigger) + docs/query/
    Qualified_query_name.md §NOTE ("The `query-name` value must not be `aql`
    (case-insensitive), as that is a reserved name") +
    parameters/query/query_type.yaml (a free string, `default: "AQL"`) + SM
    UML/classes/query_descriptor.adoc §formalism ("aql"; "any other string
    value") + QUERY 1.1.0 docs/AQL (no stored-query registration or
    store-time validity text) — CONFIRMED first-hand.
  handling: >-
    Fixed handling for all three branches, all on the released 400. (1)
    Store-time validation is SYNTACTIC: the text is parsed as an instance of
    its declared formalism, and a text that does not parse is refused 400.
    That realizes the SM precondition with the only status the released
    operations declare, and it stops at syntax because nothing beyond syntax
    is released — there is no 422 on this surface and no AQL validity
    catalogue to define one. The contrast with the template uploads is
    deliberate: AMB-110's syntax/semantics split exists because AM defines
    BOTH phases for archetypes, and QUERY defines neither for a stored
    definition. (2) The reserved name is refused 400 AT THE STORE: the NOTE
    is a MUST-NOT on the value, and a path segment carrying a forbidden value
    is a syntactically invalid parameter — the released 400 trigger verbatim.
    This EXTENDS AMB-102, whose fixed handling covers the READ side only
    (an unresolvable name is 404 there because it addresses nothing); the two
    are one rule seen from two directions and are deliberately kept apart,
    because a write answering 404 would claim the resource does not exist
    rather than that the request may not create it. (3) An unsupported
    `query_type` is 400 rather than a silent registration: the value is not
    malformed in itself (`QUERY_DESCRIPTOR.formalism` admits "any other
    string value"), but a service that cannot parse a text in that formalism
    cannot satisfy `Pre_valid_query` and must not register a definition it
    could never execute. Gated by I_DEFINITION_QUERY.valid_query-invalid
    (syntax), -bad_formalism (the unsupported formalism) and
    store_query-reserved_name (the reserved name, in both letter cases).
    Reported upstream (#1569): assign the three branches, and fix the
    `is_valid_query` / `valid_query` naming defect.
  disposition: fixed_handling
  upstream_issue: 1569

AMB-124:
  ambiguity: >-
    Beyond "matched by `qualified_query_name` as pattern", the list operation
    is unstated in four ways. (a) NO MATCH: nothing says whether a pattern
    matching nothing is an empty 200 or a 404 — the operation declares one
    branch. (b) ORDER: the response is an array of StoredQuery objects and
    nothing orders it, though the released example happens to show two
    versions of one name ascending (`1.0.1` then `1.1.7`). (c) PAGING: the SM
    form takes `item_offset`/`items_to_fetch` and the wire operation declares
    no paging parameter at all. (d) The WILDCARD clause — "when is empty, it
    will be treated as "wildcard" in the search" — describes a request the
    released API cannot express: the path parameter is `required: true` and
    the definition API declares only `/definition/query/{qualified_query_name}`
    and `/definition/query/{qualified_query_name}/{version}`, with no bare
    `/definition/query` path, so an "empty" name addresses a different URL
    rather than this operation.
  source: >-
    ITS-REST specifications/operations/definition_query_list.yaml (the
    description incl. the wildcard clause and the two prefix examples; a
    single '200' response; parameters qualified_query_name + Accept) +
    parameters/path/qualified_query_name.yaml (`required: true`) +
    responses/200_QueryList.yaml + schemas/definition/QueryList.yaml (the
    two-entry ascending example) + definition.openapi.yaml (only the two
    `/definition/query/…` paths) + docs/overview/Requests_and_responses.md
    §HTTP status codes (row 404 "The origin service did not find the target
    resource or is not willing to disclose that one exists") + SM
    UML/classes/i_definition_query.adoc §list_queries (the paging pair) —
    CONFIRMED first-hand.
  handling: >-
    Fixed handling, one position per silence. (a) A pattern matching nothing
    is a FULFILLED request answering `200 []`: the operation declares exactly
    one branch, and the released 404 trigger is a target resource that does
    not exist — the list resource exists and its result is merely empty.
    (b) Listing order is by qualified name, then version SEMVER-ASCENDING:
    the order the released example shows, and the only total, stable order
    definable over the surface's own version grammar (which is also why the
    write-side version grammar must stay numeric — AMB-122). (c) NO paging is
    exposed, because the released operation declares no parameter for it; the
    SM's paged form is the realization gap AMB-121 records, not a wire
    behaviour to synthesize. (d) The wildcard clause is UNREACHABLE as
    released and is therefore gated by nothing. Our own bare
    `GET /definition/query`, which serves the whole registry as the empty
    prefix of the same rule, is an EXTENSION — no openEHR spec governs the
    bare form — and no case exercises it, so no verdict depends on the
    unreachable clause. Gated by
    I_DEFINITION_QUERY.list_queries-prefix_all_versions (prefix match across
    every version of every matching name, in the SEMVER-ascending order) and
    -no_match_empty_list (`200 []`). Reported upstream (#1570): assign the
    empty-result branch, state the listing order, and either give the
    operation the SM's paging or drop the unreachable wildcard clause.
  disposition: fixed_handling
  upstream_issue: 1570

AMB-125:
  ambiguity: >-
    Whether the conditional-request headers apply to a STORED QUERY is left
    open, and the case for them is stronger here than for a template
    (AMB-112). The overview scopes them by resource kind — "Both `ETag` and
    `Last-Modified` SHOULD be included in responses for VERSION,
    VERSIONED_OBJECT, or other resources that have versioning or unique state
    identifiers" — and a stored query plainly HAS versioning: it is addressed
    at a SEMVER, and its released representation carries a `saved` timestamp,
    which is exactly the last-changed fact `Last-Modified` reports. Yet no
    stored-query response declares either header, and no store declares an
    `If-Match` parameter — including the version-LESS store, the one
    overwriting write on this surface and precisely the lost-update shape
    §If-Match and accidental overwrites addresses ("This is only required by
    a small set of versioned resources in this specification, when the
    `preceding_version_uid` is not part of the endpoint path segment").
  source: >-
    ITS-REST docs/overview/Requests_and_responses.md §"ETag and Last-Modified"
    (the SHOULD sentence; "For openEHR resources, this value should be derived
    from VERSION.commit_audit.time_committed.value") + §"If-Match and
    accidental overwrites" (the quoted SHOULD and the 412 rule) vs
    specifications/responses/200_StoredQuery_stored.yaml (Location only),
    200_StoredQuery_get.yaml and 200_QueryList.yaml (Content-Type only) + the
    four stored-query operations' parameter lists (no conditional-request
    header anywhere) + schemas/query/StoredQuery.yaml (the `saved` member) —
    CONFIRMED first-hand.
  handling: >-
    Fixed handling: NONE of the three is emitted or honoured on the
    stored-query routes. A stored query is not a VERSION or a
    VERSIONED_OBJECT, and its "versions" are independent definitions
    registered under one name rather than a version tree — there is no
    preceding version, no change-controlled state, and nothing an `ETag`
    could name beyond the definition the request already addressed. The
    version-less store's slot has no identifier distinct from the slot
    itself, so an `If-Match` precondition would have no value to compare, and
    the release declares the header on none of these operations; honouring an
    undeclared precondition would put a 412 on the wire that no released
    stored-query response defines. The posture is RECORDED, not asserted: no
    case claims the headers are absent, because that would over-read a SHOULD
    into a MUST NOT — the same restraint AMB-112 applies to `Last-Modified`
    on templates. Reported upstream (#1571): say whether stored queries fall
    under the conditional-header SHOULD, and whether the overwriting
    version-less store takes `If-Match`.
  disposition: fixed_handling
  upstream_issue: 1571

AMB-126:
  ambiguity: >-
    No released sentence says how faithfully a stored query's TEXT must be
    served back. The version get "Retrieves the definition of a particular
    stored query (at specified version) and its associated metadata" and the
    representation types `q` as the AQL string, but nothing states whether
    the served `q` is the byte-identical text the client stored, a normalized
    or re-printed form of the same AQL, or merely an equivalent query — a
    real difference, since a parse-and-print round trip can re-case keywords,
    re-indent, collapse whitespace, and drop anything the parser does not
    retain.
  source: >-
    ITS-REST specifications/operations/definition_query_version_get.yaml (the
    quoted description) + responses/200_StoredQuery_get.yaml (a
    representation, no fidelity rule) + schemas/query/StoredQuery.yaml (`q`
    typed as the AQL text) + operations/definition_query_store.yaml (the
    stored body is the AQL text, `text/plain`) — silence CONFIRMED
    first-hand.
  handling: >-
    Fixed handling: retrieval is VERBATIM. What was stored is what is served
    — the store's request body IS the definition, and a client that reads it
    back to review, diff, or re-store it must see its own text. A silently
    re-printed definition would change the artefact under an unchanged name
    and version, which the immutability of a version-addressed definition
    (AMB-117) forbids in substance even where the text is silent about form.
    The same position, for the same reason, as template retrieval (AMB-111).
    Asserted rather than declared: the version-get cases compare the served
    `q` against the exact text the flow stored. Reported upstream (#1572):
    state the fidelity rule on the stored-query read.
  disposition: fixed_handling
  upstream_issue: 1572

AMB-127:
  ambiguity: >-
    The stored-query sub-surface has realization gaps in BOTH directions.
    SM→ITS: of the nine `I_DEFINITION_QUERY` operations the released wire
    realizes two — `store_query` (in its version-less and versioned forms)
    and `list_queries` (the prefix list). Four have no endpoint at all:
    `delete_query` (with `Pre_has_query`: `has_query(a_query_name)` and
    `Post_query_deleted`: `not has_query (a_query_name)`, and the error
    `invalid_query`), `list_matching_queries`, `queries_count`, and
    `store_query_set` — whose released Meaning is literally "Register a query
    set. TODO: determine details.", an operation upstream has not finished
    specifying. Two more exist only INDIRECTLY: `has_query` (Boolean) has no
    existence probe of its own, and `valid_query` no validation endpoint.
    ITS→SM: the released `definition_query_version_get` — the single-
    definition read, the only way to obtain one stored query — realizes NO SM
    operation, because the interface declares no get-a-query function at all;
    a released wire behaviour with no service-model anchor to name it by.
  source: >-
    SM UML/classes/i_definition_query.adoc (all nine operations, incl.
    §delete_query's pre/postconditions and §store_query_set's "TODO:
    determine details.") vs the released ITS-REST 1.1.0 definition API —
    specifications/definition.openapi.yaml (only
    `/definition/query/{qualified_query_name}` and
    `…/{version}`) + operations/definition_query_list.yaml,
    definition_query_store.yaml, definition_query_version_get.yaml,
    definition_query_version_store.yaml — CONFIRMED first-hand.
  handling: >-
    Report only, both directions carried. SM→ITS: the four operations with no
    wire carry explicit `unrealized` its-rest bindings, so their SM-anchored
    cases are NOT-APPLICABLE WITH CITATION on this ITS instead of silently
    absent, and activate unchanged if a later release adds the endpoints
    (the AMB-17 pattern). The two indirect ones are bound to their
    realizations rather than declared missing — `has_query` to the prefix
    list read (a non-empty result means registered), `valid_query` to the
    store (SM `Pre_valid_query` — AMB-123) — exactly as AMB-108 binds
    `valid_opt` to the template upload. ITS→SM: the version get is anchored
    to `list_queries` with `variant: version_get`, the closest SM read, since
    the object it serves is one member of what `list_queries` returns; that
    is a CATALOGUE naming convention and NOT a claim that the SM defines the
    operation. Our admin `DELETE /admin/query/{qualified_query_name}/{version}`
    does NOT realize `delete_query` and is not bound to it: it deletes one
    `(name, version)` row while the SM contract deletes a query BY NAME
    (its postcondition is `not has_query(a_query_name)`, which a
    single-version delete does not establish), and it is an extension of our
    own — no openEHR spec governs it, and the service code flags it as such.
    Reported upstream (#1573): realize or retire the four unrealized
    operations, finish `store_query_set`, and give the single-definition read
    an SM operation.
  disposition: report_only
  upstream_issue: 1573

AMB-128:
  ambiguity: >-
    The party routes offer the two Simplified Formats MIME types in their
    `Accept`/`Content-Type` enums, but the released Simplified Formats
    sub-specification has no PARTY shape and the one header that makes a
    Simplified commit addressable is scoped away from parties. The format is
    template-derived by definition — "Template-specific: Field identifiers are
    specific to each operational template", "field identifiers are generated
    from OPT definitions" — its RM-mapping chapter's only top-level mapping is
    COMPOSITION (PARTY_PROXY appears solely as a composer/subject datum INSIDE
    a composition, never as a demographic PARTY root), and the header that
    names that template on a Simplified commit carries a MUST scoped to one
    class: "The `openehr-template-id` request header MUST be used whenever
    committing COMPOSITION (via `PUT` or `POST` methods) using a Simplified
    Format which does not support TEMPLATE_ID value under an equivalent
    `LOCATABLE.archetype_details.template_id` attribute of contained data."
    None of the ten party create/update operations declares an
    `openehr-template-id` parameter, so a FLAT party commit has no channel for
    the template its field identifiers would have to be generated from. What a
    service does with the two MIME types it is nevertheless offered on those
    routes is stated nowhere.
  source: >-
    ITS-REST specifications/parameters/header/Accept_LOCATABLE.yaml and
    ContentType_LOCATABLE.yaml (both enums list
    `application/openehr.wt.flat+json` and
    `application/openehr.wt.structured+json`) as referenced by
    operations/{person,agent,group,organisation,role}_{create,update,get}.yaml
    (whose parameter lists carry Prefer / Accept / Content-Type / the item-tag
    headers and NO openehr-template-id) vs ITS-REST
    docs/overview/Requests_and_responses.md §openehr-template-id (the quoted
    MUST, scoped to "committing COMPOSITION") + docs/simplified_formats/
    master02-overview.adoc §Introduction (the "Template-specific" key
    characteristic) and §"Relationship to Other Specifications" ("__Operational
    Templates (OPT)__: field identifiers are generated from OPT definitions";
    "serialized instances represent valid RM structures (e.g. COMPOSITION)") +
    master05-rm_mapping.adoc (the chapter's top-level mapping is `== COMPOSITION`;
    no demographic PARTY root mapping exists) + docs/overview/Resources.md
    §Simplified Formats (the negotiation rules and their 415/406 MUSTs) and
    §"Data representation" ("Services MUST support at least one of the openEHR
    **XML** or **JSON** canonical formats for resource representation.
    Additionally, the **Simplified Formats** format SHOULD be supported") —
    CONFIRMED first-hand.
  handling: >-
    Fixed handling: the party routes are CANONICAL-ONLY, and both refusals are
    the ones the negotiation section already mandates rather than invented
    ones. A party create/update declaring `Content-Type:
    application/openehr.wt.flat+json` (or `…structured…`) is answered `415
    Unsupported Media Type` — §Simplified Formats verbatim: "If the service
    cannot process the request payload as the simplified format is not
    supported, it MUST respond with HTTP status code `415 Unsupported Media
    Type`." A party read whose `Accept` admits only a Simplified type is
    answered `406 Not Acceptable` — the same section: "If the service cannot
    fulfill this aspect of the request, it MUST respond with HTTP status code
    `406 Not Acceptable`." Serving canonical JSON and XML satisfies the
    §"Data representation" MUST outright, and the Simplified SHOULD in the same
    sentence is a SHOULD over a serialization that has no PARTY shape to
    produce: honouring it would require this service to invent both a
    demographic Web Template and a template-naming channel the operations do
    not declare, which is exactly the private resolution the attribution law
    forbids. Nothing is silently narrowed — the refusal is a declared,
    exercised branch. Gated by
    I_DEMOGRAPHIC_SERVICE.create_party-simplified_content_type (415) and
    I_PARTY.get_party-simplified_accept (406). Reported upstream (#1574):
    either give the Simplified Formats a demographic shape and the party
    commits a template-naming channel, or drop the two Simplified MIME types
    from the party routes' negotiation enums.
  disposition: fixed_handling
  upstream_issue: 1574

AMB-129:
  ambiguity: >-
    RM demographic states the PARTY `uid` rule three times at three strengths,
    and the create contract makes the strongest of them unsatisfiable by a
    client. The class table's Invariants section carries `Uid_mandatory: uid /=
    Void` — an invariant, the model's MUST — while the NOTE in the Description
    row of the SAME table calls the same population "strongly recommended".
    §Party Identification then fixes what the value is: "Identifiers of Party
    instances in the system are provided in the same way as identifiers of
    Compositions in the EHR: via the `_uid_` attribute (type
    `OBJECT_VERSION_ID`) of the containing `VERSION`" — an identifier the
    CREATE request cannot carry, because the containing VERSION does not exist
    until the server mints it. So a party create whose body satisfies
    `Uid_mandatory` is impossible, and no released sentence says whether the
    invariant is evaluated on the request or on the committed object. The
    NOTE's own worked example adds a third inconsistency: it prescribes "the
    UID copied from the `_object_id()_` of the `_uid_` field of the enclosing
    `VERSION` object" — `object_id()` yields the leading Guid alone — and then
    copies the WHOLE three-part
    `87284370-2D4B-4e3d-A3F3-F303D2F4F34B::uk.nhs.ehr1::2`.
  source: >-
    RM demographic UML/classes/org.openehr.rm.demographic.party.adoc
    §Description NOTE (the quoted "strongly recommended" sentence and its
    `87284370-…::uk.nhs.ehr1::2` example) vs the same file §Invariants
    (`Uid_mandatory: uid /= Void`) + RM demographic
    master02-demographic_package.adoc §Party Identification (the quoted
    OBJECT_VERSION_ID sentence) and §Versioning Semantics ("Every Party is
    stored in its own Version container") + RM common
    master06-change_control_package.adoc §Version Identification (the
    three-part OBJECT_VERSION_ID scheme; the `object_id()` part "is a copy of
    the `_uid_` of the owning `VERSIONED_OBJECT`") + ITS-REST
    specifications/operations/person_create.yaml (the request body is the
    PERSON; no uid is required and none is knowable) — CONFIRMED first-hand.
  handling: >-
    Fixed handling: the server MINTS the identity and INJECTS it, so the
    invariant holds where the model can evaluate it — on the stored and served
    PARTY, never on the request. A create needs no `uid`; the committed PARTY
    carries the containing VERSION's full OBJECT_VERSION_ID, which is the value
    §Party Identification names and the one every cross-reference between
    parties resolves against. This is the demographic SHARPENING of two
    existing entries, kept as its own entry rather than folded into either
    because it changes their strength, not just their scope. AMB-65 fixes the
    FORM of a copied top-level uid (the full three-part OBJECT_VERSION_ID) from
    the ITS-REST side against an RM sentence that says object_id() only; on
    PARTY the RM's demographic chapter reaches the SAME form independently —
    §Party Identification types the identifier `OBJECT_VERSION_ID` outright,
    and the party NOTE's own example copies all three parts — so here the two
    released components agree and AMB-65's handling is not a wire-oracle
    tie-break but the plain reading of both. AMB-67 records that a contained
    top-level object may be served WITHOUT a uid because every sentence about
    it is recommendation-strength; that is FALSE for PARTY, where
    `Uid_mandatory` is an invariant, and AMB-67's scope now carries the
    exclusion. Gated by the party create/get cases, which read the created
    PARTY back and assert its `uid/value` is the version identifier the
    create's own `ETag` named. Reported upstream (#1575): reconcile the
    invariant with the NOTE's "strongly recommended", say at which point
    `Uid_mandatory` is evaluated, and fix the NOTE's object_id()-versus-example
    contradiction.
  disposition: fixed_handling
  upstream_issue: 1575

AMB-130:
  ambiguity: >-
    `PARTY_RELATIONSHIP.Target_valid` cannot be evaluated as written, and its
    polarity contradicts the class it dereferences. It reads `target /= Void
    and then not target.reverse_relationships.has (self)`. `target` is a
    `PARTY_REF`, which inherits `OBJECT_REF` and declares exactly three
    attributes — `namespace`, `type`, `id` — plus one invariant; it has no
    `reverse_relationships` feature, so the expression dereferences something
    the declared type does not have. Its sibling `Source_valid` carries the
    same defect (`source.relationships`, where `relationships` is a PARTY
    feature and `source` is again a PARTY_REF) but asserts the POSITIVE: the
    source's relationship list DOES contain this relationship. `Target_valid`
    asserts the NEGATIVE, while PARTY's own `Reverse_relationships_validity`
    invariant and the `reverse_relationships()` postcondition both assert the
    positive over exactly this set — every item is a relationship whose
    "`.target = self`". A third defect rides along even on a charitable
    reading: `reverse_relationships` is typed `List<LOCATABLE_REF>`, so
    `has (self)` compares a `PARTY_RELATIONSHIP` object against a list of
    references and can never be True, which leaves the negated form vacuously
    satisfied and the invariant empty.
  source: >-
    RM demographic UML/classes/org.openehr.rm.demographic.party_relationship.adoc
    §Invariants (`Source_valid`: `source /= Void and then
    source.relationships.has (self)`; `Target_valid`: `target /= Void and then
    not target.reverse_relationships.has (self)`) + the same file §Attributes
    (`source`, `target`: PARTY_REF 1..1) + BASE
    UML/classes/org.openehr.base.base_types.party_ref.adoc (inherits OBJECT_REF;
    only a Type_validity invariant) + org.openehr.base.base_types.object_ref.adoc
    §Attributes (namespace / type / id — no relationship features) + RM
    demographic UML/classes/org.openehr.rm.demographic.party.adoc §Functions
    (`reverse_relationships (): List<LOCATABLE_REF>` with
    `Post_reverse_relationships_validity`) and §Invariants
    (`Reverse_relationships_validity` — the positive membership assertion) —
    CONFIRMED first-hand.
  handling: >-
    Editorial. The catalogue asserts NEITHER invariant on the wire: neither is
    computable from anything a relationship payload carries, and manufacturing
    a rejection branch out of a defective expression would test servers into a
    shape no released text defines. What IS asserted is the released structure
    the invariants gesture at and the RM states plainly — relationships ride
    inline in the SOURCE party's `relationships` list (RM demographic master02
    §Party Relationships: "`PARTY_RELATIONSHIPs` are stored as part of the data
    of the `PARTY` designated as the source"), and `source`/`target` are
    `PARTY_REF`s whose ids denote version CONTAINERS ("`OBJECT_REFs` containing
    `HIER_OBJECT_IDs` … rather than `OBJECT_VERSION_IDs`"), not versions. That
    inline reading is now PINNED by a case rather than only stated —
    create_party-inline_relationships_verbatim — and AMB-187 carries what this
    entry does not reach: the same by-value structure stands beside the SM's
    independently-versioned relationship containers, and the two
    representations are disjoint (neither writes the other). The
    inbound direction is undiscoverable over the released wire — recorded on
    AMB-32. Reported upstream (#1576).
  disposition: editorial
  upstream_issue: 1576

AMB-131:
  ambiguity: >-
    The demographic API is FIVE parallel typed route families over one abstract
    class, and neither of the two ways a request can name the wrong one has an
    assigned branch. (a) A body whose `_type` is a DIFFERENT concrete PARTY
    subtype than the route's — a `ROLE` posted to `/demographic/person` — is
    well-formed JSON and a well-formed RM object; the create declares
    400/404/422 and no sentence says which of them covers it. (b) A
    `uid_based_id` naming a version container that EXISTS but holds another
    kind — a PERSON's `versioned_object_uid` addressed through
    `/demographic/organisation/{uid_based_id}` — is a well-formed identifier
    resolving to a real container; the get declares 200/204/404 and no sentence
    says whether that is a miss or something else.
  source: >-
    ITS-REST specifications/operations/person_create.yaml (responses
    201/400/422/404) and organisation_get.yaml (responses 200/204/404), with
    their four siblings each declaring the identical sets +
    docs/overview/Requests_and_responses.md §HTTP status codes (row 422 "The
    request was well-formed but was unable to be followed due to semantic
    errors"; row 404 "The origin service did not find the target resource or is
    not willing to disclose that one exists"; row 400 "malformed request
    syntax, syntactically invalid content"; row 409 "might generate a duplicate
    or a conflict") + RM common master06-change_control_package.adoc §Typing
    ("This ensures that all versions in a given `VERSIONED_OBJECT` are of the
    same type, such as `COMPOSITION`, `FOLDER`, or `PARTY` and that the version
    container itself is properly typed") + RM demographic master02 §Versioning
    Semantics ("Every Party is stored in its own Version container") — the
    silence CONFIRMED first-hand.
  handling: >-
    Fixed handling, one position per branch, each landing on a row the status
    table already describes. (a) WRONG SUBTYPE IN THE BODY is 422: the request
    parses and carries a valid RM object, so the 400 row — malformed syntax,
    syntactically invalid content — does not describe it; what cannot be
    followed is the SEMANTIC contradiction between the resource the route
    creates and the class the body declares, which is the 422 row verbatim.
    (b) WRONG KIND BEHIND THE UID is 404: §Typing makes a version container
    single-typed, so an ORGANISATION container with that uid does not exist and
    the request addresses no target resource — the 404 row verbatim. Neither is
    409: nothing is duplicated and no resource state conflicts. The pair is
    deliberately split rather than merged, because they fail at different
    layers — one is a body the route cannot mean, the other an address that
    names nothing. Gated by
    I_DEMOGRAPHIC_SERVICE.create_party-wrong_subtype_body (422) and
    I_PARTY.get_party-wrong_kind_container (404). Reported upstream (#1577):
    assign both branches on the typed demographic routes.
  disposition: fixed_handling
  upstream_issue: 1577

AMB-132:
  ambiguity: >-
    A party create whose body carries a `uid` has no released branch at all.
    The CONTRIBUTION envelope gets an explicit rule for exactly this shape
    ("`uid`: when provided, it will be accepted in case is not in-use,
    otherwise error will be returned") and the party UPDATE gets a match rule;
    the party CREATE gets neither — it declares 201/400/404/422 and no 409, and
    no sentence says whether a supplied uid is honoured, ignored, or refused.
    The identifier a client could supply is also not one it can legitimately
    choose: §Party Identification makes the PARTY uid the containing VERSION's
    OBJECT_VERSION_ID, whose `object_id()` part is the very version container
    the create is about to mint.
  source: >-
    ITS-REST specifications/operations/person_create.yaml (responses
    201/400/422/404 — no conflict branch; the request body is the Person
    schema, whose uid is optional) CONTRASTED with
    operations/contribution_create.yaml (the relaxed-envelope uid sentence,
    quoted above) and person_update.yaml ("If the request body already contains
    a PERSON.uid.value, it must match the `uid_based_id` in the URL" — the
    OAS-stated match rule AMB-78 carries — tier-2 ground under the 2026-07-28
    order, and in any case an UPDATE rule that a CREATE has no URL identifier
    to be measured against) + RM
    demographic master02-demographic_package.adoc §Party Identification (the
    uid is the containing VERSION's OBJECT_VERSION_ID) + RM common
    master06-change_control_package.adoc §Version Identification (`object_id()`
    is a copy of the owning VERSIONED_OBJECT's uid) — the silence CONFIRMED
    first-hand.
  handling: >-
    Fixed handling, low weight: SERVER-MINTED IDENTITY WINS and the body value
    does not survive. The create is NOT refused — the released operation
    declares no conflict branch to refuse it with, and manufacturing one would
    put a status on the wire that no released party-create response defines —
    and the committed PARTY carries the uid the server minted for its new
    version container (AMB-129). A client-chosen uid cannot be honoured on this
    operation for the reason §Party Identification gives: the value IS the
    containing VERSION's identifier, and that version does not exist until the
    commit this very request performs, so there is nothing for a client value
    to be the identifier OF. The contrast with the CONTRIBUTION envelope is
    principled rather than inconsistent: a CONTRIBUTION uid is a HIER_OBJECT_ID
    naming the change set itself, which a client can choose, whereas a PARTY
    uid is derived from a version the server creates. Gated by
    I_DEMOGRAPHIC_SERVICE.create_party-client_supplied_uid: the create
    succeeds, and the read-back's `uid/value` is the identifier the create's
    own `ETag` named, not the one the body carried. Reported upstream (#1578):
    say what a party create does with a body uid, as the CONTRIBUTION create
    already does.
  disposition: fixed_handling
  upstream_issue: 1578

AMB-133:
  ambiguity: >-
    The reference-resolution preference is described once, generically —
    "Clients MAY request that object references (e.g., OBJECT_REF) be resolved
    into full or partial representations by specifying: `Prefer:
    return=representation, resolve_refs`" — and the demographic payloads are
    the most reference-dense the API has: `PARTY.relationships[i].source` and
    `.target` are `PARTY_REF`s, `ACTOR.roles` is a list of `PARTY_REF`s,
    `ROLE.performer` is a `PARTY_REF`, and `PARTY.reverse_relationships` is a
    list of `LOCATABLE_REF`s. Yet no demographic READ declares a `Prefer`
    parameter at all — not the five party gets, not the four versioned_party
    reads — so the one preference that would matter most on this API cannot be
    requested on it, and no released sentence says whether a service should
    honour it anyway or ignore it.
  source: >-
    ITS-REST docs/overview/Requests_and_responses.md §"Prefer resolving Object
    references" (the quoted MAY and its single worked context, "retrieving
    lists of COMPOSITION resources within an EHR") vs
    specifications/operations/{person,agent,group,organisation,role}_get.yaml
    (parameters: uid_based_id, version_at_time, Accept — no Prefer) and
    versioned_party_{get,revision_history,version_get_at_time,version_get_by_id}.yaml
    (parameters: versioned_object_uid [+ version_at_time / version_uid],
    Accept, Content-Type — no Prefer) + RM demographic
    UML/classes/org.openehr.rm.demographic.{party,role,actor}.adoc (the
    PARTY_REF/LOCATABLE_REF-typed attributes listed above) — CONFIRMED
    first-hand.
  handling: >-
    Report only, and an HONEST BOUNDARY rather than a silent omission: this
    server does not implement `resolve_refs` on any demographic read, and no
    case asserts either behaviour. Asserting resolution would gate a bare
    client-side MAY that assigns the service no obligation, names no status and
    no failure mode; asserting non-resolution would forbid what the same
    sentence explicitly permits. The one place the generic token IS gated is
    the CONTRIBUTION read, where a released paragraph makes the resolution
    observable (AMB-57 binds it) — the demographic reads have no such
    paragraph, and they additionally lack the `Prefer` parameter that would
    carry the request. Carried as the cited wire_surface element
    `demographic-resolve-refs-unrealized`. Activates as a gating case if a
    future ITS-REST release declares `Prefer` on the demographic reads or
    states what resolution over `PARTY_REF` yields. Reported upstream (#1579).
  disposition: report_only
  upstream_issue: 1579

AMB-134:
  ambiguity: >-
    The CONTRIBUTION commit envelope's negotiated formats are declared one way
    and described another, on BOTH contribution routes, and the two routes do
    not agree with each other. The EHR-side commit's own prose adds a
    Simplified-Formats arm and immediately confines it — "the **CONTRIBUTION
    envelope itself remains canonical JSON** … Only the inner versioned payload
    - each `versions[i].data` … - is serialized in the chosen FLAT or
    STRUCTURED form" — while its `Accept`/`Content-Type` enums admit
    `application/xml` for the whole exchange, which the same paragraph's
    envelope-stays-canonical-JSON rule cannot express. The demographic-side
    commit has NO such paragraph and declares the canonical enums (JSON + XML)
    only, so a client reading the two routes side by side sees the same
    operationId offering different format sets, with neither operation
    describing what an XML envelope would even be.
  source: >-
    ITS-REST specifications/operations/contribution_create.yaml (the EHR-side
    commit: the quoted §"Simplified Formats (FLAT / STRUCTURED)" paragraph;
    parameters Accept_LOCATABLE + ContentType_LOCATABLE) vs
    operations/demographic_contribution_create.yaml (the same operationId,
    no Simplified paragraph; parameters Accept_canonical +
    ContentType_canonical) + parameters/header/{Accept,ContentType}_canonical.yaml
    (enum: application/json, application/xml) +
    docs/overview/Amendment_record.md SPECITS-84 ("Add support for FLAT/SDT to
    Contribution REST API calls - accept the Simplified Formats MIME types on
    CONTRIBUTION endpoints; the Simplified Formats serialization applies to
    versions[].data only, the CONTRIBUTION envelope remains canonical") +
    docs/overview/Resources.md §"Data representation" ("Services MUST support
    at least one of the openEHR **XML** or **JSON** canonical formats") and
    §XML Format / §JSON Format / §Simplified Formats (the 415/406 MUSTs) —
    CONFIRMED first-hand.
  handling: >-
    Fixed handling, scoped to BOTH contribution routes (this closes the gap
    left unregistered at the group-7 audit). The commit ENVELOPE is
    canonical-JSON only: on `POST /ehr/{ehr_id}/contribution` the Simplified
    MIME types are accepted exactly as SPECITS-84 defines them — the envelope
    stays canonical JSON and only each `versions[i].data` is read/written in
    the negotiated FLAT or STRUCTURED form (AMB-57 carries the read side) — and
    on `POST /demographic/contribution` they are not accepted at all, because
    that route's own operation declares no Simplified arm and its inner
    payloads are PARTYs, which the Simplified Formats have no shape for
    (AMB-128). No XML envelope is served on either route, and the reasoning
    for that is RE-GROUNDED 2026-07-28 with the conclusion unchanged. The old
    wording dismissed the `ContentType_canonical`/`ContentType_LOCATABLE`
    enums as "OAS shape — the stalled layer, never an oracle"; under the
    2026-07-28 order those enums ARE citable, and they still create no
    obligation, for the reason the order itself states — an enumerated Accept
    or Content-Type value is an OFFER, never a presence requirement. The
    DOCS TEXT is not silent here either, so tier 2 could not override it in
    any case: §"Data representation" requires "at least one of" the canonical
    formats, JSON is that one, and serving JSON alone therefore breaches
    nothing released. (What the release genuinely withholds about a
    CONTRIBUTION in XML is adjudicated next door: the COMMIT envelope's shape
    in AMB-165, the READ side's document root in AMB-167.) The refusals are
    the negotiation section's own: an XML or Simplified request payload the
    service cannot process is `415`, an `Accept` it cannot satisfy is `406`.
    The upstream report stands on the OPERATION DESCRIPTIONS rather than the
    enums — one route documents an inner-payload Simplified arm and the other
    documents nothing, and neither says what an XML envelope is; those
    descriptions are tier-2 text too, and citing them AS the OAS is what the
    order requires (the 2026-07-27 wording called them "released prose", which
    over-stated their tier). Reported upstream (#1580).
  disposition: fixed_handling
  upstream_issue: 1580

AMB-135:
  ambiguity: >-
    The SM demographic interfaces carry a bundle of editorial defects, in the
    AMB-77 pattern. (1) `I_DEMOGRAPHIC_SERVICE.i_party (a_versioned_party_id)`
    and `i_party_relationship (a_versioned_party_rel_id)` declare their
    parameters with NO TYPE at all — the only untyped parameters in the
    interface. (2) `I_PARTY.get_party_at_version` carries
    `Pre_has_party_version: has_party_version (a_party_version_id)`, naming a
    function the interface does not declare; the declared probe is
    `has_party_version_id`. (3) The `I_PARTY_RELATIONSHIP` twin of that
    operation, `get_party_relationship_at_version`, declares NO precondition at
    all, although `has_party_relationship` exists and every other read on the
    interface is guarded. (4) The create/update preconditions call
    `valid_content (a_version)` while `I_VALIDITY_CHECKER` declares
    `content_valid` — the same naming defect AMB-77 records on
    `I_EHR_COMPOSITION`. (5) `I_DEMOGRAPHIC_SERVICE.create_party_relationship`
    lists the error `definition_unknown` but carries only `Pre_content_valid` —
    no `definitions_valid` precondition to raise it, where its `create_party`
    sibling carries both. (6) Every identifier on both interfaces is typed bare
    `UUID` — `a_versioned_party_id`, `a_party_version_id`,
    `a_versioned_party_rel_id`, `a_party_rel_version_id` — although the version
    ones name a VERSION, whose identifier is the three-part OBJECT_VERSION_ID
    (RM common master06 §Version Identification) and whose wire form is exactly
    that. (7) `I_PARTY.delete_party` postulates `Post_party_deleted: not
    has_party (a_versioned_party_id)` — a PHYSICAL delete — which the RM
    forbids for a versioned repository.
  source: >-
    SM UML/classes/i_demographic_service.adoc (§i_party / §i_party_relationship
    — the untyped parameters; §create_party's `Pre_party_definitions_valid` +
    `Pre_content_valid`; §create_party_relationship's `Pre_content_valid` with
    the `definition_unknown` error) + SM UML/classes/i_party.adoc
    (§has_party_version_id vs §get_party_at_version's `Pre_has_party_version`;
    the UUID typing throughout; §delete_party's `Post_party_deleted`) + SM
    UML/classes/i_party_relationship.adoc (§get_party_relationship_at_version —
    no precondition) + SM UML/classes/i_validity_checker.adoc (the declared
    `definitions_valid` and `content_valid`) vs RM common
    master06-change_control_package.adoc §Contributions ("Since a versioned
    repository (i.e. a collection of `VERSIONED_OBJECTs`) is by definition
    indelible, all logical changes including deletions … are achieved by
    physically committing new Versions") and §Logical Deletion (the four-step
    procedure: new Version, delete its `_data_`, `_lifecycle_state_` to
    `deleted`, commit) + §Version Identification (the OBJECT_VERSION_ID form) —
    ALL CONFIRMED first-hand.
  handling: >-
    Editorial: the catalogue keeps the SM operation NAMES as case anchors and
    adjudicates BEHAVIOUR from the ITS-REST docs text plus the RM wherever the
    SM typing, preconditions or postconditions are defective — the AMB-77
    disposition, applied to the demographic interfaces. Defect (7) is the only
    one with a wire consequence and it is decided against the SM: the RM wins,
    so `DELETE /demographic/{kind}/{uid_based_id}` is a LOGICAL delete that
    commits a new `523|deleted|` VERSION, the version container survives, and
    the postcondition the catalogue asserts is the RM's (a second VERSION whose
    `change_type` is DELETED), never SM's `not has_party`. Defect (6) likewise
    never reaches the wire: the released routes address versions by
    OBJECT_VERSION_ID, and the catalogue's captures carry that form. Reported
    upstream (#1581).
  disposition: editorial
  upstream_issue: 1581

AMB-136:
  ambiguity: >-
    The demographic sub-surface has realization gaps in BOTH directions.
    ITS→SM: six released routes realize no SM operation. The four
    `/demographic/versioned_party/**` reads (the container get, the
    `revision_history` sub-resource, the version-at-time read and the
    version-by-id read) have no SM counterpart, because `I_PARTY` declares no
    container read, no revision-history operation, and no operation returning a
    VERSION envelope — its reads all return a bare `PARTY`. The two
    `/demographic/contribution` routes have no counterpart either, because SM
    declares no demographic contribution interface at all: there is
    `I_EHR_CONTRIBUTION` for the EHR side and nothing beside it (zero hits for
    a demographic-contribution interface across the vendored SM tree). SM→ITS:
    `I_PARTY.has_party` and `I_PARTY.has_party_version_id` have no wire — the
    demographic API declares no existence probe, so the Booleans exist only as
    the 200/404 of a read — and `I_DEMOGRAPHIC_SERVICE.i_party` /
    `i_party_relationship` are interface FACTORIES with no wire meaning at all.
  source: >-
    SM UML/classes/i_party.adoc + i_party_relationship.adoc +
    i_demographic_service.adoc (the complete operation lists) and SM
    docs/openehr_platform/master06-demographic_service.adoc (the chapter
    includes exactly i_demographic_service, i_party, i_party_relationship,
    uv_party, uv_party_relationship — no contribution and no versioned-party
    interface) vs the released ITS-REST 1.1.0 demographic API —
    specifications/demographic.openapi.yaml and
    operations/versioned_party_{get,revision_history,version_get_at_time,version_get_by_id}.yaml
    + demographic_contribution_{create,get}.yaml — CONFIRMED first-hand.
  handling: >-
    Report only, both directions carried, with the AMB-127 naming convention
    applied where a released wire behaviour would otherwise go unexercised.
    ITS→SM: the two versioned_party VERSION reads are anchored to the closest
    SM read they serve a member of — `I_PARTY.get_party_at_version`, variants
    `versioned_party` (by id) and `versioned_party_at_time` — and the two
    demographic contribution routes to `I_EHR_CONTRIBUTION.commit_contribution`
    / `get_contribution`, variant `demographic`; in both cases that is a
    CATALOGUE NAMING CONVENTION and NOT a claim that SM defines the operation,
    exactly as AMB-127 anchors the stored-query single-definition read. The
    container get and the `revision_history` sub-resource are NOT anchored that
    way, because no SM read returns either shape — the closest-SM-read
    convention has nothing to reach for. RE-ADJUDICATED 2026-07-28: they are
    anchored under the RESERVED PSEUDO-INTERFACE mechanism instead
    (`I_ITS_REST_VERSIONED_PARTY.versioned_party_get`,
    `I_ITS_REST_REVISION_HISTORY.versioned_party_revision_history`). That is a
    DIFFERENT mechanism from the closest-SM-read convention this entry declined,
    and it POST-DATES the original adjudication: AMB-161 established the
    reserved `I_ITS_REST_*` prefix plus the pinned `NON_SM_REST_OPERATIONS`
    table (tools/cnf-runner/src/validate.rs) for exactly this shape — a RELEASED
    ITS-REST operation the SM models no interface for — and it names no SM
    operation at all, so unlike a closest-read anchor it asserts nothing about
    what the SM defines. Pseudo-interface families group by the SERVED RESOURCE
    (as `I_ITS_REST_ITEM_TAGS` already spans the EHR and demographic tag
    routes), which is why the revision history joins its two EHR-side twins
    under `I_ITS_REST_REVISION_HISTORY` while the container read keeps
    `I_ITS_REST_VERSIONED_PARTY`. Both routes now carry bindings and cases, and
    the honest-boundary ledger row
    `versioned-party-container-and-revision-history` retires to covered_by. The
    realization GAP itself is unchanged and still reported: the SM has no home
    for either route.
    SM→ITS: `has_party` and `has_party_version_id` are bound to their
    realizations rather than declared missing (existence is the 200/404 of the
    corresponding read — the AMB-108 pattern), and the two interface factories
    are off-wire by construction, since an interface handle is not a resource.
    Reported upstream (#1582): give the versioned-party reads and the
    demographic contribution an SM home, and decide whether the existence
    probes deserve a wire.
  disposition: report_only
  upstream_issue: 1582

AMB-137:
  ambiguity: >-
    `ITEM_TAG.owner_id` is MANDATORY (1..1 `OBJECT_REF`) and its entire
    released definition is the gloss "Identifier of owner object, such as
    EHR" — an example, not a rule. On the EHR side that example suffices,
    because the RM declares the containment that makes the EHR the owner:
    `EHR.tags` is a `List<OBJECT_REF>` whose Meaning fixes the reach ("Tag
    `_target_` values can only be within the same EHR"), and both EHR-side
    released examples duly set `owner_id.type: EHR`. The demographic side
    has NO such anchor. Not one class in the RM demographic package declares
    a `tags` containment — the demographic chapter and all thirteen
    `org.openehr.rm.demographic.*` class files contain no tag attribute at
    all (the only "tag" hits in the package are the substrings inside "stage
    names" / "stagename" in the PARTY and PARTY_IDENTITY prose) — so nothing
    states what object OWNS a tag placed on a VERSIONED_PARTY or on a party
    VERSION, and a mandatory attribute is left with no derivable value. The
    only released signal is the five demographic `ItemTagOf<T>` examples,
    which all give `owner_id` the same shape: an `OBJECT_REF` with
    `namespace: local` and `type: SYSTEM` — not the party, not an EHR, and
    not any resource the demographic API addresses.
  source: >-
    RM UML/classes/org.openehr.rm.common.item_tag.adoc (`owner_id`: 1..1
    `OBJECT_REF`, Meaning "Identifier of owner object, such as EHR") + RM
    common master07-tags.adoc §Semantics (a tag "may be associated with any
    information item" — no owner rule anywhere in the package) + RM
    UML/classes/org.openehr.rm.ehr.ehr.adoc §Attributes (`tags`:
    `List<OBJECT_REF>`, "Optional list of tags associated with this EHR. Tag
    `_target_` values can only be within the same EHR") CONTRASTED with RM
    docs/demographic/master02-demographic_package.adoc and every
    UML/classes/org.openehr.rm.demographic.*.adoc class file (zero tag
    containment; grep-verified) + ITS-REST
    specifications/schemas/demographic/ItemTagOf{Person,Agent,Group,Organisation,Role}.yaml
    (all five: `owner_id: {id: {_type: HIER_OBJECT_ID, ...}, namespace:
    local, type: SYSTEM}`) vs
    specifications/schemas/ehr/ItemTagOf{Composition,EhrStatus}.yaml (both
    `type: EHR`) — ALL CONFIRMED first-hand.
    WHAT THOSE FIVE EXAMPLES ARE WORTH, under the oracle order: NOTHING as an
    assignment. Restated 2026-07-28 (the #556 sweep flagged the wording, no
    verdict change): tier 1, the ITS-REST docs text, never mentions
    `owner_id`; tier 2, the released OAS, DECLARES the attribute
    (`schemas/common/ItemTag.yaml` types it and the five demographic
    `ItemTagOf<T>` schemas require it) but its `example:` blocks are not
    declarations — an example is illustration and not a rule, the exact
    treatment AMB-69 applies one entry over to the VERSIONED_PARTY
    `owner_id` example on this same attribute name (that entry reaches the
    same shape, `local`/`SYSTEM` over a system-identifier `HIER_OBJECT_ID`,
    by the same route). Both released sources
    therefore WITHHOLD the value, which is spec silence: the shape below is a
    register decision, not a derivation.
  handling: >-
    Fixed handling, and honestly labelled: the demographic `owner_id` shape is
    OUR OWN DESIGN — no openEHR spec governs this — INFORMED BY the five
    released examples rather than derived from them. A demographic tag's
    `owner_id` is emitted as an `OBJECT_REF` with `namespace: local` and
    `type: SYSTEM`, whose `id` is a `HIER_OBJECT_ID` carrying the server's
    configured system identifier — the shape all five examples show,
    unanimously across every party kind, and the one that survives the two
    alternatives: naming the tagged party itself would make the attribute a
    duplicate of `target` and contradict the word "owner", and naming an EHR
    would invent a containment the demographic package does not have.
    THE SHAPE IS UNCHANGED by this restatement, and it stays PINNED by the
    wire tests: this attribute is MANDATORY (1..1) with no derivable value at
    all, so leaving it unasserted would leave a required wire field entirely
    unchecked; asserting our registered convention is the honest position, and
    it is labelled as a convention wherever it is asserted. AMB-69 asserts the
    identical two tokens on `VERSIONED_OBJECT.owner_id` for the same ehr-less
    demographic containers, on this same reasoning (its earlier
    decline-to-assert wording was retired 2026-08-02, when the three-way
    divergence in the served shape was converged). `target` is
    unaffected: it stays the bare RM `UID_BASED_ID` (`HIER_OBJECT_ID` for
    the container, `OBJECT_VERSION_ID` for a VERSION) the RM class requires,
    on both families alike. Reported upstream (#1583): state who owns a
    tag outside an EHR, or declare a demographic `tags` containment.
  disposition: fixed_handling
  upstream_issue: 1583

AMB-138:
  ambiguity: >-
    `GET /demographic/tags` is the only tag route in the released surface
    with NO scoping parameter of any kind, and nothing states how the
    resulting whole-space read is bounded. Its EHR twin is bounded by
    construction — `ehr_tags_get` takes `ehr_id` in the path and declares a
    404 for an unknown one, so the largest answer it can give is one EHR's
    tags. This route takes no path parameter, requires no filter ("In case
    no such parameter is provided then all ITEM_TAG resources will be
    retrieved"), declares no paging parameter, and carries only a 200/400
    response set — so the released reading of an unfiltered call is "every
    ITEM_TAG on every party in the whole demographic space", with no
    maximum, no page, no continuation and no ordering. Nor is there an
    access-scope rule to fall back on: the only released text on
    authorization is scheme-agnostic and resource-neutral, fixing which
    status codes an authorizing service returns but assigning no scope to
    any particular resource, and this route is the one place in the tag
    surface where that silence is load-bearing.
  source: >-
    ITS-REST specifications/operations/demographic_tags_get.yaml (parameters
    are the three optional filters + Accept — no path parameter; description
    "In case no such parameter is provided then all ITEM_TAG resources will
    be retrieved"; responses 200 and 400 only) CONTRASTED with
    operations/ehr_tags_get.yaml (path parameter `ehr_id` +
    responses/404_unknown_ehr_id.yaml) and with the five typed party tag
    gets (path parameter `uid_based_id` + a 404) +
    docs/overview/Requests_and_responses.md §"Authentication and
    authorization" ("Services SHOULD implement and support an HTTP
    Authentication and Authorization framework, though this specification
    does not mandate a specific authentication scheme") and §"HTTP status
    codes" (the 401 and 403 rows) — CONFIRMED first-hand.
  handling: >-
    Fixed handling: the route is served WHOLE — one unpaged list of every
    ITEM_TAG in the demographic space the caller is entitled to see — under
    the deployment's own authorization layer, which is exactly where the
    released text puts access control. No server-invented cap, page size,
    continuation token or mandatory filter is introduced: the operation
    declares 400 as its only client-error branch, so refusing an unfiltered
    call would refuse a request the released text calls valid, and a
    silently truncated list would be a wrong answer rather than a loud one.
    This is DISTINCT from AMB-94, which fixes what the three filter
    parameters MEAN once supplied and applies to both list routes equally,
    and from AMB-97's ordering/paging clause, which records the silence for
    lists that at least HAVE a scope to page within; the delta registered
    here is that this list has no scope at all. Reported upstream
    (#1584): bound the space-wide read — a required filter, a paging
    pair, or an explicit statement that the whole space is the intended
    answer.
  disposition: fixed_handling
  upstream_issue: 1584

AMB-139:
  ambiguity: >-
    `202 Accepted` is a declared success of both released admin operations and
    is ABSENT from the specification's own status-code table. Each admin
    operation states the async branch in prose — "The server may execute this
    operation asynchronously (e.g. in batches), in which case returns status
    `202 Accepted`. If the deletion is processed synchronously and completes
    successfully, the server returns status `204 No Content`." — and enumerates
    a `202` response whose description reads "`202 Accepted` is returned when
    the requested operation has been accepted for processing, but processing has
    not been completed or may not have started (i.e. when requests are processed
    asynchronously)." The overview's §HTTP status codes table, which opens "The
    following subset is used in this specification", lists 200, 201, 204, 400,
    401, 403, 404, 405, 406, 408, 409, 412, 415, 422, 500 and 501 — and no 202.
    So the two admin operations are the only released operations whose success
    can be a code the specification's own subset does not contain.
  source: >-
    ITS-REST specifications/operations/admin_ehr_delete.yaml and
    admin_ehr_delete_all.yaml (the quoted async/sync paragraph; both enumerate
    `202`) + specifications/responses/202.yaml (the quoted description) vs
    docs/overview/Requests_and_responses.md §"HTTP status codes" (the sixteen-row
    table and its lead-in "The following subset is used in this specification",
    with no 202 row) and its closing clause "To indicate the status of a request
    or operation, an appropriate HTTP status code MUST be used as described
    above. Additional status codes MAY be used as long as they do not conflict
    with the predefined codes" — CONFIRMED first-hand.
  handling: >-
    Editorial — the table RESOLVES ITS OWN OMISSION. The closing clause permits
    "additional status codes … as long as they do not conflict with the
    predefined codes", and `202` conflicts with nothing in the sixteen rows: no
    listed code claims the accepted-for-later-processing meaning, and `204`,
    the row it sits beside, is the completed-synchronously answer the same
    paragraph distinguishes it from. This is the AMB-60 device applied the
    other way round: there the MAY clause let 405 stand against a competing
    SHOULD; here it lets 202 stand against a table that simply does not list
    it. No wire consequence and nothing to adjudicate — the branch is legal.
    HOW THE CATALOGUE CARRIES IT, stated plainly rather than hidden: both admin
    bindings absorb the branch as `alt_status: [202]` under `ok_empty`
    ("Fulfilled with no content"), which is the honest logical reading — a
    bodyless success — but which also means a case expecting `ok_empty` passes
    on either code and no case can require or distinguish the asynchronous
    branch. That is a deliberate, recorded limit of the instrument, not
    coverage. The vocabulary obstacle behind it is GONE: the 2026-07-28
    schedule release added the `accepted` kind, so the branch is now nameable
    and the absorption is a pending migration rather than a hard boundary (the
    `admin-delete-async-acceptance-branch` wire-surface element carries it).
    This SUT is synchronous and always answers `204`.
    Reported upstream (#1585).
  disposition: editorial
  upstream_issue: 1585

AMB-140:
  ambiguity: >-
    The bulk delete's partial-failure semantics are entirely unstated, and its
    declared 404 has no trigger. `admin_ehr_delete_all` accepts a subset of ids
    ("Deletes all or multiple EHRs, or a specified subset of EHRs identified
    using the `ehr_id` query parameter") and declares 202/204/404/405, but the
    404 it declares is the GENERIC `responses/404.yaml` ("returned when, based
    on the request parameters, the server did not find a current representation
    of a target resource"), not the single-route's `404_unknown_ehr_id.yaml` —
    and nothing says what a MIXED list of known and unknown ids does. Three
    distinct questions have no released answer: (a) does one unknown id in a
    list of ten fail the whole call, delete the nine, or fail with the generic
    404; (b) does an unfiltered call against an EMPTY repository succeed or
    404, given that "all EHRs" then names nothing; (c) is the operation atomic
    at all — the same paragraph says it "may execute this operation
    asynchronously (e.g. in batches)", which makes any all-or-nothing claim
    unobservable from the client's side, since a `202` client cannot see where
    the batches stopped. The single-EHR route has none of this ambiguity: one
    id, `Pre_has_ehr`, and a dedicated `404_unknown_ehr_id`.
  source: >-
    ITS-REST specifications/operations/admin_ehr_delete_all.yaml (the quoted
    subset sentence; the quoted asynchronous/batches sentence; responses
    202/204/404/405, with the 404 resolving to responses/404.yaml) +
    specifications/responses/404.yaml (the generic wording quoted above)
    CONTRASTED with operations/admin_ehr_delete.yaml (responses 202/204/404,
    the 404 resolving to responses/404_unknown_ehr_id.yaml, "returned when an
    EHR with `ehr_id` does not exist") + parameters/query/ehr_id_Admin.yaml
    ("An optional parameter to perform the operation on a subset of EHRs") + SM
    UML/classes/i_admin_service.adoc §physical_ehr_delete (single-id only, so
    SM supplies no set-level failure rule either) + docs/overview/Requests_and_responses.md
    §"HTTP status codes" row 400 ("malformed request syntax, syntactically
    invalid content"; "Status code `400` indicates normally a bad request, as
    well as a generic client-side error, used when no other `4xx` error code is
    appropriate") — the silence CONFIRMED first-hand.
  handling: >-
    Fixed handling, three positions, each landing on released ground and none
    inventing a status the operation does not declare. (a) A SUBSET LIST IS
    DELETE-WHAT-EXISTS → `204`. Every id the caller named that resolves to an
    EHR is deleted; an id that resolves to nothing contributes nothing and does
    not fail the call. Grounds: the operation's only stated purpose is to delete
    the named subset, and its postcondition — those EHRs are gone — is satisfied
    for an id that already named no EHR; reaching for the generic 404 would put
    an error on a request whose entire effect the released text describes as
    achieved. This makes the bulk route IDEMPOTENT, which the single-EHR route
    deliberately is not (`Pre_has_ehr` + a dedicated 404): the two differ
    because one addresses a resource in its path and the other names a
    selection in its query. (b) AN UNFILTERED CALL AGAINST AN EMPTY REPOSITORY
    IS `204`, by the same reading — "all EHRs" over an empty set is a fulfilled
    request with nothing to do. (c) MALFORMED IDS ARE REFUSED BEFORE ANY
    DELETION, with `400`. A query value that is not a well-formed identifier is
    not a subset selector at all, and the released 400 row covers it verbatim
    ("syntactically invalid content" / the generic-client-error clause); the
    whole request is rejected and NOTHING is deleted, so a typo in one id can
    never silently destroy the others in the same call. That ordering — validate
    the entire list, then act — is the shipped behaviour and is documented at
    its seam (`app/ferroehr/src/service/admin/delete.rs`,
    `admin_ehr_delete_all` → `parse_uuid_list`: "Parse a whole id list,
    rejecting the entire request on the first malformed id (a bulk call is
    validated before any work runs)"). The atomicity question (c above) is left
    unasserted rather than resolved: with the async branch released, no
    client-observable test can distinguish an atomic bulk delete from a batched
    one, so asserting either would test a property the wire does not expose.
    Reported upstream (#1586).
  disposition: fixed_handling
  upstream_issue: 1586

AMB-141:
  ambiguity: >-
    The SM ADMIN interfaces carry a bundle of editorial defects, in the AMB-77 /
    AMB-135 pattern. (1) The `ENCODING_FORMAT` enumeration is EMPTY — its class
    table has a Description row with no text and no Attributes section at all,
    so an enumeration referenced by two signatures has zero members. (2) FOUR
    class files the admin chapter's own cross-references point at are included
    by NO chapter in the whole SM docs tree — `platform_service.adoc`,
    `export_format.adoc`, `compression_format.adoc` and `encoding_format.adoc`
    (grep-verified across every `include::{uml_export_dir}/classes/…` in
    docs/openehr_platform, docs/serial_data_formats and docs/simplified_im_b) —
    so every `<<_platform_service_enumeration,PLATFORM_SERVICE>>`,
    `<<_export_format_enumeration,EXPORT_FORMAT>>`,
    `<<_compression_format_enumeration,COMPRESSION_FORMAT>>` and
    `<<_encoding_format_enumeration,ENCODING_FORMAT>>` reference in
    `i_admin_service.adoc`, `i_admin_dump_load.adoc` and `export_spec.adoc`
    resolves to an anchor the rendered document does not contain. `PLATFORM_SERVICE`
    is the worst case: it is the first parameter of four `I_ADMIN_SERVICE`
    operations. (3) `EXPORT_SPEC` and `DUMP_LOAD_FAIL_REPORT` are included by
    master15 and listed in the class index but are referenced by NO signature
    anywhere in SM: `export_ehrs` takes the three format enumerations flattened
    into its parameter list instead of the `EXPORT_SPEC` that exists to carry
    them (and never sees `EXPORT_SPEC.segment_split_size`, its only mandatory
    attribute), and no operation returns or takes a `DUMP_LOAD_FAIL_REPORT`,
    although both dump/load operations are exactly the ones that would report
    per-entity failures. (4) `load_ehrs` — a READ from the file system into the
    repository — declares the error `file_not_writable`, copy-pasted from its
    `export_ehrs` sibling; the failure it can actually suffer (an unreadable or
    malformed archive, or the duplicate-id case its own Meaning names: "import
    EHRs with duplicate EHR ids will fail") has no error at all. (5) The
    precondition pair is inconsistent in both directions:
    `physical_ehr_delete` declares `Pre_has_ehr: has_ehr (an_ehr_id)`, naming a
    function declared on `I_EHR_SERVICE` and NOT on `I_ADMIN_SERVICE` (a
    cross-interface precondition — grep-verified: `has_ehr` is declared in
    i_ehr_service.adoc alone), while its twin `physical_party_delete` declares
    NO precondition at all even though it carries the matching
    `party_id_does_not_exist` error.
  source: >-
    SM UML/classes/encoding_format.adoc (the empty enumeration) +
    export_format.adoc + compression_format.adoc + platform_service.adoc (the
    four chapter-orphaned files) + export_spec.adoc and dump_load_fail_report.adoc
    (the two unreferenced classes) + i_admin_service.adoc (the four
    `PLATFORM_SERVICE`-taking operations; §physical_ehr_delete's `Pre_has_ehr`;
    §physical_party_delete with no precondition and the
    `party_id_does_not_exist` error) + i_admin_dump_load.adoc (§export_ehrs'
    flattened `logical_fmt`/`comp_fmt`/`enc_format` parameters and its
    `file_not_writable`; §load_ehrs with the same `file_not_writable`) +
    i_ehr_service.adoc (the sole declaration of `has_ehr`) +
    docs/openehr_platform/master15-admin_service.adoc (its five `include::`
    lines) + UML/class_index.adoc (which lists EXPORT_SPEC and
    DUMP_LOAD_FAIL_REPORT) — ALL CONFIRMED first-hand.
  handling: >-
    Editorial: the catalogue keeps the SM operation NAMES as case anchors and
    adjudicates BEHAVIOUR from the ITS-REST docs text plus the RM wherever the
    SM typing, preconditions or enumerations are defective — the AMB-77
    disposition, applied to the admin interfaces. None of the five defects
    reaches the released wire, because the only realized admin operation is
    `physical_ehr_delete`: defects (1)–(3) touch dump/load and the statistics
    operations, all of them off-wire (AMB-33); (4) touches `load_ehrs`, which
    has no endpoint and no CNF master12 section either (the schedule's chapter
    covers nine of the ten SM admin operations and omits `load_ehrs` outright —
    recorded on the `I_ADMIN_DUMP_LOAD.load_ehrs` entry in
    vocab/wire_surface.yaml). Defect (5) is the only one with a case-visible
    consequence, and it is benign in both halves: `has_ehr` is exactly the probe
    the delete cases already use to verify the postcondition (the cross-interface
    reference is a rendering defect, not a semantic one), and the missing
    precondition on `physical_party_delete` costs nothing while that operation
    is unrealized. Reported upstream (#1587).
  disposition: editorial
  upstream_issue: 1587

AMB-142:
  ambiguity: >-
    The most destructive operations in the whole released API have NO
    authorization contract. `admin.openapi.yaml` declares `security: []` — the
    OpenAPI form of "no security applies" — exactly as every other API group
    does, so nothing distinguishes the admin group's requirements from the
    clinical read that fetches one EHR. Neither admin operation declares a 401
    or a 403 response: `admin_ehr_delete` declares 202/204/404 and
    `admin_ehr_delete_all` 202/204/404/405, so an authorizing service refusing
    an unprivileged caller answers with a status neither operation enumerates.
    The only released text on the subject is scheme-agnostic and
    resource-neutral — "Services SHOULD implement and support an HTTP
    Authentication and Authorization framework, though this specification does
    not mandate a specific authentication scheme", plus the conditional "If
    authentication and authorization are required, services MUST properly use
    the `WWW-Authenticate` and/or `Proxy-Authenticate` response headers,
    returning `403 Forbidden`, `401 Unauthorized` or `407 Proxy
    Authentication` as applicable" — which fixes the CODES an authorizing
    service returns while assigning no privilege level to any resource. So the
    released specification never says that permanently destroying every EHR on
    a server requires more privilege than reading one composition. The only
    access-related sentence anywhere near these routes is a deployment hint,
    not an authorization rule: "This functionality is intended primarily for
    **development** or **testing** purposes and may be disabled in
    **production** environments, in which case server may respond with `405
    Method Not Allowed`" — and it is on the bulk route only, never on the
    single-EHR delete.
  source: >-
    ITS-REST specifications/admin.openapi.yaml (`security: []`; identical to
    definition/demographic/ehr/overview/query/system.openapi.yaml — all seven
    groups carry the same empty declaration, grep-verified) +
    operations/admin_ehr_delete.yaml (responses 202/204/404 — no 401, no 403)
    and admin_ehr_delete_all.yaml (responses 202/204/404/405 — no 401, no 403;
    the quoted development/testing NOTE) + responses/405.yaml ("`405 Method Not
    Allowed` is returned when the service knows the request method, but the
    target resource doesn't support this method (e.g. due to security
    concerns)") + docs/overview/Requests_and_responses.md §"Authentication and
    authorization" (both quoted sentences) and §"HTTP status codes" (the 401 and
    403 rows) — the silence CONFIRMED first-hand.
  handling: >-
    Fixed handling, and the position is explicitly OURS. NO openEHR SPEC GOVERNS
    THE PRIVILEGE LEVEL OF THE ADMIN ROUTES — our own design/extension: this
    server classifies both released admin operations as
    `OperationClass::Admin` and requires the configured admin role for them,
    while every other generated operation is `OperationClass::Clinical` (any
    authenticated principal with a role) — the classification and its
    total-coverage guard live in
    `app/ferroehr-rest/src/extensions/access/authz/classify.rs`. That is a
    deployment decision grounded in what the operations DO (AMB-10: permanent,
    physical, cascading destruction), not in any released sentence, and it is
    flagged as such rather than presented as conformance. Two consequences are
    kept honest. First, the refusal STATUSES we emit are the released ones —
    the §"Authentication and authorization" MUST fixes 401/403 for an
    authorizing service, so the codes are spec-grounded even though the trigger
    is not. Second, no CNF case asserts an admin authorization branch: the
    catalogue drives the admin routes with the ixit's `admin` principal only,
    because a case asserting that an unprivileged caller is refused would gate a
    privilege boundary the released specification never draws. The
    role-separation behaviour is covered by our own HTTP tests instead, and the
    SEC-BASIC capabilities `AuthenticatedAccess`/`AuthorizationSeparation`
    remain grounded on the generic 401/403 rows, not on the admin surface.
    Reported upstream (#1588).
  disposition: fixed_handling
  upstream_issue: 1588

AMB-143:
  ambiguity: >-
    Nothing released says what a physically deleted EHR looks like AFTERWARDS,
    and the list of what goes with it is explicitly open-ended. Both admin
    operations describe the deletion and stop: no sentence states that a
    subsequent read of the deleted `ehr_id` is a 404 rather than, say, a 410 or
    a tombstone; none states whether the same `ehr_id` may be created again
    (`ehr_create_with_id` declares its 409 for "a conflict with an already
    existing EHR with the same subject id, namespace pair", which says nothing
    about an id that used to exist); and none states whether a deleted EHR's
    ids may be reused by the server. The cascade itself is given by EXAMPLE, not
    by extension: "All resources associated with or owned by the specified EHR
    (**such as** COMPOSITION, EHR_STATUS, ITEM_TAG, CONTRIBUTION, and their
    historical versions) will also be permanently and physically deleted" — a
    "such as" list, so a client cannot tell from the released text whether
    anything outside those four classes (an EHR_ACCESS, a FOLDER/directory
    tree, an attestation, an externalized multimedia blob, an audit record)
    survives the delete.
  source: >-
    ITS-REST specifications/operations/admin_ehr_delete.yaml and
    admin_ehr_delete_all.yaml (the quoted "such as" cascade sentence; no
    post-delete or re-creation statement in either) +
    specifications/responses/204_deleted_hard.yaml (the hard-delete sentence,
    which describes the response and not the subsequent state) +
    operations/ehr_create_with_id.yaml + responses/409_EHR.yaml (the quoted
    subject-conflict wording — the only 409 the create declares) +
    responses/404_unknown_ehr_id.yaml ("`404 Not Found` is returned when an EHR
    with `ehr_id` does not exist") + SM UML/classes/i_admin_service.adoc
    §physical_ehr_delete (`Pre_has_ehr` and the error `ehr_id_does_not_exist` —
    a PREcondition, with no stated postcondition; contrast
    SM i_definition_query.adoc §delete_query, which does state
    `Post_query_deleted`) + RM UML/classes/org.openehr.rm.ehr.ehr.adoc
    §Attributes (the aggregate the delete destroys: `compositions`,
    `ehr_status`, `directory`, `contributions`, `tags`, `ehr_access`) — the
    silence CONFIRMED first-hand.
  handling: >-
    Fixed handling, derived from what the delete IS rather than from a missing
    postcondition. (1) SUBSEQUENT READS ARE 404. After a physical delete the
    EHR does not exist, and `404_unknown_ehr_id.yaml` assigns that exact
    situation — "returned when an EHR with `ehr_id` does not exist" — so the
    generic read branch already covers it and no new status is invented; the SM
    `Pre_has_ehr` of a second delete is likewise false, giving the same 404.
    This is also the only reading consistent with the operation's own purpose:
    a tombstone that still answered would defeat the data-protection
    justification the same description gives (AMB-10). (2) RE-CREATION UNDER
    THE SAME `ehr_id` IS PERMITTED. `ehr_create_with_id`'s only conflict branch
    is the subject/namespace duplicate, and after a physical delete there is no
    EHR with that id to conflict with; refusing would require the server to
    remember an id it was told to destroy, which contradicts the delete.
    (3) THE CASCADE IS TOTAL, not the four named classes. The "such as" list is
    exemplary, and the sentence that governs is "All resources associated with
    or owned by the specified EHR", so everything the EHR owns in our storage
    goes: every versioned object and all of its versions and nodes (COMPOSITION,
    EHR_STATUS, the directory FOLDER tree), attestations, ITEM_TAGs,
    CONTRIBUTIONs, the audit records those referenced, archive markers, and any
    externalized multimedia blob no surviving node still references. That
    closure is documented at its seam (`app/ferroehr/src/service/admin/delete.rs`
    — `delete_ehr`: the FK cascade plus the explicit orphan-audit sweep, since
    `audit` has no foreign key from `ehr`, plus the reference-counted blob GC),
    and the storage graph it walks is our own design — no openEHR spec governs
    the FK graph. Gated by three cases:
    I_ADMIN_SERVICE.physical_ehr_delete-delete_existing_cascade (the single-EHR
    route) and -delete_all_cascade (the bulk route) commit a COMPOSITION and a
    CONTRIBUTION into an EHR and assert both are unreachable after the delete —
    the postcondition the released text omits — while -delete_existing_recreate
    reads the deleted id as absent and then creates a new EHR under it, gating
    positions (1) and (2). What no case can observe is stated openly on the
    wire_surface element `admin-physical-delete-owned-resource-cascade`: every
    released read of an owned resource is EHR-scoped by path, so a 404 for the
    composition of a destroyed EHR cannot be told apart from the EHR's own
    absence — unreachability is the strongest observable form of the promise,
    and the storage-level closure is proven by DB-backed tests instead.
    Reported upstream (#1589).
  disposition: fixed_handling
  upstream_issue: 1589

AMB-144:
  ambiguity: >-
    The one operation medicolegal traceability would most demand an audit
    record of is the one operation with no audit requirement anywhere in the
    released specification — and its cascade destroys the records that would
    have carried the history. The ITS-REST audit obligation is scoped away from
    it by construction: "In order to allow clients to provide committal
    metadata, services MUST accept `openehr-version` and `openehr-audit-details`
    custom request headers" appears in a paragraph whose subject is "committing
    content to an openEHR system, for all change-controlled resources (e.g.
    COMPOSITION, EHR_STATUS, FOLDER, etc.)", and a physical delete commits
    nothing and produces no VERSION. Neither admin operation declares an
    `openehr-audit-details` parameter, and neither description mentions an audit
    record, a log, or an actor. SM offers nothing either: the platform overview
    promises an "IHE ATNA-compliant system log" component, but the
    `I_SYSTEM_LOG` interface it stands on is an EMPTY class table — no
    description, no functions — and it is included by no chapter in the SM docs
    tree, appearing only as a link in the class index. Meanwhile the cascade
    named in the same admin descriptions removes "CONTRIBUTION, and their
    historical versions", i.e. precisely the RM structures that hold each
    change's `AUDIT_DETAILS` — so a physical delete both leaves no required
    trace of itself and destroys the traces of everything that came before it,
    in a model whose §Logical Deletion rule exists because "Medicolegal and
    traceability requirements mean that information cannot be literally
    removed".
  source: >-
    ITS-REST docs/overview/Requests_and_responses.md §"openehr-version and
    openehr-audit-details" (the quoted MUST and its change-controlled-resource
    framing) vs specifications/operations/admin_ehr_delete.yaml and
    admin_ehr_delete_all.yaml (parameters: the path `ehr_id` / the query
    `ehr_id` and nothing else — no audit header, no audit prose; the quoted
    CONTRIBUTION-destroying cascade sentence) + SM
    docs/openehr_platform/master02-overview.adoc (the component table row
    "System Log | IHE ATNA-compliant system log.") vs SM
    UML/classes/i_system_log.adoc (an empty interface table — no Description
    text, no Functions section — included by no chapter, grep-verified, and
    reachable only from UML/class_index.adoc) + RM common
    master06-change_control_package.adoc §Logical Deletion (the quoted
    medicolegal sentence) and §Contributions (each change carries its
    `commit_audit`) — the silence CONFIRMED first-hand.
  handling: >-
    Report only. The gap is upstream's to close and the catalogue does not
    paper over it: no case asserts that a physical delete is audited, because
    no released sentence requires it and asserting one would test servers
    against a rule openEHR has not written. What this server does is recorded
    here as an our-own-design extension rather than as conformance — no openEHR
    spec governs it: the admin delete is emitted to the system log
    (`ferroehr::system_log`, the DICOM PS3.15 + FHIR `AuditEvent`/BALP renderings
    into the local Audit Record Repository), so the erasure itself leaves a
    trace outside the EHR it destroys. That record lives in a different store
    precisely because the cascade empties the one the RM would have used. The
    entry is deliberately NOT `fixed_handling`: there is no wire behaviour to
    fix, only an obligation that ought to exist. Reported upstream (#1590):
    require an audit record for physical deletion — the actor, the time, the
    ids destroyed — and say where it lives, given that the operation's own
    cascade removes the CONTRIBUTIONs and AUDIT_DETAILS that carry every other
    change's history; and either populate `I_SYSTEM_LOG` or drop the ATNA claim
    from the platform overview.
  disposition: report_only
  upstream_issue: 1590

AMB-145:
  ambiguity: >-
    The SMART discovery chapter's own example advertises resource scopes the
    SMART scope chapter's own grammar cannot parse — a released-vs-released
    conflict inside ONE specification, four chapters apart. The master04
    §Service Discovery example document carries `"scopes_supported": ["openid",
    "profile", "launch", "launch/patient", "patient/*.rs", "user/*.rs",
    "offline_access"]`, while master08 §Resource Scopes closes the `<resource>`
    position of `<compartment>/<resource>.<permission>` to exactly three nouns
    — `template-<templateId>`, `composition-<templateId>`, `aql-<queryName>`
    ("The following openEHR REST APIs `<resource>` types are supported for use
    in scopes", an exhaustive list) — and the wildcards master08 then defines
    are for the `<templateId>`/`<queryName>` TAIL, never for the noun: all five
    rows of its pattern table (`MyHospital::Template.v0`,
    `org.openehr::bloodpressure.v1`, `*::Template.v0`, `MyHospital::*`, `*`)
    are id patterns, and all eight rows of its maximal table spell a noun out.
    `patient/*.rs` and `user/*.rs` put a bare `*` exactly where the noun must
    be, so a conformant parser of master08 cannot resolve them to any resource
    family: the two forms are simultaneously the specification's own advertised
    example and ungrammatical under the specification's own grammar. Nothing
    anywhere says what a Platform does with a scope it cannot parse, and
    nothing says whether the SMART-on-FHIR `<compartment>/*.<permission>`
    "everything" idiom the example is plainly borrowing is meant to be legal
    here at all.
  source: >-
    ITS-REST docs/smart_app_launch/master04-service_discovery.adoc §Service
    Discovery (the example JSON block — the quoted `scopes_supported` array)
    CONTRASTED with master08-scopes.adoc §Resource Scopes (the syntax line
    `<compartment>/<resource>.<permission>`; the closed three-noun `<resource>`
    list; the `<templateId>`/`<queryName>` pattern table; the maximal scope
    table) + master07-authorization.adoc §Context Selection NOTE ("standard
    SMART launch scopes and context attributes remain compatible and may be
    used in parallel for interoperability purposes … but their use is not
    normative in this specification" — which covers the LAUNCH scopes, not the
    resource-scope grammar, so it does not license an ungrammatical resource
    scope) — the conflict CONFIRMED first-hand.
  handling: >-
    Fixed handling: INERT DEMOTION, chosen because it is the only reading that
    contradicts neither side of the conflict. The one grammar
    (`crates/openehr-its/src/rest/smart_scopes.rs`, shared by the CDR's scope
    gate and by any REST client previewing what a scope grants) is TOTAL:
    `SmartScope::parse` maps `patient/*.rs` and `user/*.rs` onto
    `SmartScope::Other`, which is retained verbatim and is inert — it neither
    grants nor denies anything, so a token carrying the master04 example's
    scope set is not rejected (the example stays servable) and is also not
    silently widened into `composition-*`/`template-*`/`aql-*` authority the
    master08 grammar never wrote (the grammar stays enforced). Fail-closed mode
    then behaves exactly as it does for a scope-less token: an inert scope is
    not a family scope, so a scope-governed operation is denied. Pinned by
    `smart_scopes.rs` §tests `master04_example_wildcard_resource_is_inert` (the
    two example forms), `unknown_scope_is_inert_other` and
    `bad_permission_char_falls_back_to_other`. What this server ADVERTISES is
    kept consistent with what it can enforce: the default `scopes_supported`
    lists only grammar-parseable forms (`patient/composition-*.cruds`,
    `user/template-*.cruds`, `system/aql-*.cruds`, …) rather than republishing
    the unparseable example forms — an operator whose Authorization Server does
    issue them may still advertise them verbatim through the
    `scopes_supported` override, since the advertisement is the AS's claim, not
    the CDR's. Reported upstream (#1591).
  disposition: fixed_handling
  upstream_issue: 1591

AMB-146:
  ambiguity: >-
    master04 §Authentication Endpoints names the WRONG discovery document for
    its own attribute list. The sentence reads "The following attributes in the
    `.well-known/openid-configuration` must match those defined in the OAuth
    2.0 + OpenID Connect Discovery specification as well as the FHIR SMART
    metadata specification", and the list it introduces ends with
    `capabilities` — which is not an OpenID Provider Metadata member at all but
    a SMART-configuration member, defined by master04's OWN §Capabilities
    section three sections later ("The `capabilities` section advertises
    supported SMART features as an array value"). Everything around the
    sentence is about the other document: the chapter opens by extending "the
    FHIR `.well-known/smart-configuration` endpoint definition", the example
    block it annotates is introduced as "Responses to
    `/.well-known/smart-configuration` endpoint", and the sibling §Services
    section describes a `services` member that is likewise absent from OpenID
    Provider Metadata. So a reader following the sentence literally is sent to
    a different document than the one the whole chapter defines.
  source: >-
    ITS-REST docs/smart_app_launch/master04-service_discovery.adoc
    §Authentication Endpoints (the quoted sentence and its 14-item list, whose
    last item is `capabilities`) vs the same file's §Service Discovery ("The
    *SMART Service Discovery* mechanism extends the FHIR
    `.well-known/smart-configuration` endpoint definition"; "Responses to
    `/.well-known/smart-configuration` endpoint must be served with the
    `application/json` MIME type") and §Capabilities ("The `capabilities`
    section advertises supported SMART features as an array value") and
    §Services ("the response from configuration endpoint must include the
    `services` section") — CONFIRMED first-hand.
  handling: >-
    Editorial: a document-name slip with no wire consequence. This server reads
    the sentence as governing `.well-known/smart-configuration` (the document
    the chapter defines, the document the example is, and the only document
    that can carry `capabilities` and `services`) and serves the whole listed
    attribute set from `/.well-known/smart-configuration`; it publishes no
    `.well-known/openid-configuration` at all, that being an Authorization
    Server document and the CDR being the resource server (master02 §Glossary).
    No case turns on the distinction. Reported upstream (#1592).
  disposition: editorial
  upstream_issue: 1592

AMB-147:
  ambiguity: >-
    master08 names `**` twice and never defines it. §Resource Scopes says the
    ids "support wildcard and pattern-based matching using `*` and `**`, as
    follows:" and then gives a five-row table in which `**` does not appear
    once — the rows are `MyHospital::Template.v0`,
    `org.openehr::bloodpressure.v1`, `*::Template.v0`, `MyHospital::*` and `*`.
    The chapter's NOTE names it a second time ("Wildcard-based scopes (e.g.,
    `*` or `**`) should be used cautiously and only when absolutely
    necessary"), so the token is real and load-bearing in the prose, yet the
    "as follows" table that is supposed to define it defines only `*`. Two
    readings survive the text and it picks neither: `**` as a mere synonym of
    `*`, or `**` as the broader wildcard that crosses the `::` namespace
    delimiter which `*` (per the table's own `*::Template.v0` and
    `MyHospital::*` rows, both of which are meaningless if `*` already crossed
    `::`) does not.
  source: >-
    ITS-REST docs/smart_app_launch/master08-scopes.adoc §Resource Scopes (the
    quoted "using `*` and `**`, as follows:" sentence; the five-row pattern
    table with no `**` row; the quoted wildcard NOTE) — the omission CONFIRMED
    first-hand (grep of the whole smart_app_launch tree: the `**` token occurs
    in those two sentences and nowhere else).
  handling: >-
    Fixed handling, derived from the table the spec DID write. Our documented
    reading is that `*` is segment-local and `**` crosses `::`: it is the only
    reading under which the table's `*::Template.v0` ("Template.v0 from any
    namespace") and `MyHospital::*` ("Any template within MyHospital
    namespace") rows say something a bare `*` does not already say, and it is
    the reading under which the prose's pairing of the two tokens is
    meaningful rather than redundant. The bare-`*` row ("All available
    templates or queries") is honoured as written and is NOT narrowed by the
    segment-local rule — a pattern that is exactly `*` (or exactly `**`)
    matches every id — so the table's own top-level row and the segment-local
    rule coexist. Implemented in
    `crates/openehr-its/src/rest/smart_scopes.rs` (`Pattern::matches` +
    `glob_match`: `**` consumes any bytes, `*` consumes any bytes stopping
    before `:`, every other byte literal) and unit-covered there. Reported
    upstream (#1593).
  disposition: fixed_handling
  upstream_issue: 1593

AMB-148:
  ambiguity: >-
    Two editorial defects in master08's normative sentences. (1) The scope
    syntax is stated with a SINGULAR third component — "the scope syntax
    `<compartment>/<resource>.<permission>` where:" — and then explained with a
    PLURAL one: the third bullet of the same list reads "`<permissions>`
    specifies the allowed operations", a placeholder that appears nowhere in
    the syntax line, while the syntax line's `<permission>` appears nowhere in
    the bullet list. Since the component is in fact a SET of letters (the
    chapter's own `crud`/`cruds`/`rs` examples and the whole maximal table),
    the placeholder a reader is meant to substitute for is genuinely ambiguous
    between two spellings of the same grammar position. (2) The chapter's one
    validation obligation is a comma splice: "The _Platform_ must validate
    requested scopes against the _Application_ registration metadata,
    applicable access control policies, the authenticated user's permissions."
    — three coordinated objects with no conjunction, so a reader cannot tell
    whether the third item is a third object of "against" or the start of a
    dropped clause, nor whether the three are conjunctive (all three must
    permit) or alternative.
  source: >-
    ITS-REST docs/smart_app_launch/master08-scopes.adoc §Resource Scopes (the
    syntax line `<compartment>/<resource>.<permission>` vs the third bullet
    "`<permissions>` specifies the allowed operations"; the permission-letter
    list `c`/`r`/`u`/`d`/`s`; the maximal table rows ending `crud`, `cruds` and
    `rs`) + the same file's §Scopes second paragraph (the quoted validation
    sentence) — both CONFIRMED first-hand.
  handling: >-
    Editorial: neither defect changes what a conformant Platform does. (1) The
    grammar position is read as the plural SET the chapter's own examples show
    — the permission tail is a non-empty string of `c`/`r`/`u`/`d`/`s` letters
    (`Permissions` in `crates/openehr-its/src/rest/smart_scopes.rs`), which
    satisfies both spellings. (2) The validation sentence is read
    CONJUNCTIVELY — every listed source must permit — because that is the only
    reading under which "validate" narrows rather than widens, and because this
    server composes the SMART gate as an AND onto the RBAC/ABAC decision
    (`app/ferroehr-rest/src/extensions/access/pep.rs`: SMART can only narrow,
    never widen) so that the "applicable access control policies" object of the
    sentence is enforced independently of the scope. No case turns on either
    reading. Reported upstream (#1594).
  disposition: editorial
  upstream_issue: 1594

AMB-149:
  ambiguity: >-
    The discovery document is specified as CONTENT and not at all as an HTTP
    resource. master04 fixes its path relative to the Platform base URL and its
    `application/json` media type, and then stops: across the whole
    smart_app_launch tree there is not one status code, not one caching
    statement, not one error shape, and not one sentence on whether the
    document is publicly readable (grep-verified: zero occurrences of any of
    200/201/400/401/403/404, `Cache-Control`, `max-age`, `ETag`, `cache` or
    `error` in any of the nine chapters). Three consequences are unresolved by
    the released text. (1) AUTH POSTURE: whether
    `/.well-known/smart-configuration` may be protected is never stated; it is
    only INFERABLE, from master07 §Embedded iFrame Launch, where the
    Application fetches `{iss}/.well-known/smart-configuration` in order to
    LEARN the `authorization_endpoint` — i.e. strictly before it can hold any
    token — which is an argument, not a rule. (2) FRESHNESS: nothing says
    whether the document may be cached, for how long, or how a client learns it
    changed. (3) The `baseUrl` VERSION SEGMENT: master04 requires "Absolute URL
    to the root of the API" and every example writes the openEHR entry with a
    version segment (`https://platform.example.com/openehr/rest/v1`) while
    writing the FHIR entry without one (`https://platform.example.com/`), but
    no sentence says whether "the root of the API" includes the ITS-REST
    version segment — so a client cannot tell from the text whether to append
    it.
  source: >-
    ITS-REST docs/smart_app_launch/master04-service_discovery.adoc §Service
    Discovery ("The configuration endpoint should be always available relative
    to the _Platform_ base URL"; the `/gateway/v1` sub-path example; "Responses
    to `/.well-known/smart-configuration` endpoint must be served with the
    `application/json` MIME type"; the example's
    `"baseUrl":"https://platform.example.com/openehr/rest/v1"` for
    `org.openehr.rest` against `"baseUrl":"https://platform.example.com/"` for
    `org.fhir.rest`) + §Services ("`baseUrl`: Absolute URL to the root of the
    API `*(required)*`") + master07-authorization.adoc §Embedded iFrame Launch
    ("Once launched, the _Application_ uses the `iss` value to retrieve the
    SMART configuration document from `{iss}/.well-known/smart-configuration`.
    This configuration document provides important endpoints including the
    `authorization_endpoint`") + ITS-REST
    docs/overview/Requests_and_responses.md §"HTTP status codes" (the generic
    table, which assigns no code to this document because ITS-REST does not
    define this document) — the silence CONFIRMED first-hand.
  handling: >-
    Fixed handling on all three, each grounded on the strongest released
    material available and flagged where it is ours. (1) PUBLIC. The discovery
    document is served unauthenticated, outside the auth layer, alongside the
    health family — because master07's pre-authorization fetch is impossible
    otherwise, and because the document is by construction a directory of
    endpoints rather than clinical content (it carries no EHR data). The
    inference is the spec's own launch sequence; the DECISION to serve it
    publicly is ours where the text is silent — no openEHR spec governs the
    auth posture of this document. (2) NO CACHING DIRECTIVES are emitted and
    none are required of clients: with no released freshness rule, inventing
    `Cache-Control`/`ETag` semantics for a document whose contents change only
    on operator reconfiguration would be an unspecified contract, and the
    default (no directive) leaves clients on the generic HTTP heuristics. Our
    own design/extension. (3) THE VERSION SEGMENT IS INCLUDED: the served
    `org.openehr.rest` `baseUrl` is the configured external origin plus the
    server's full REST base path including its version segment, matching the
    only released example of that exact key and satisfying "root of the API" in
    the sense a client can immediately concatenate a resource path onto. The
    absolute-URL requirement itself is NOT part of this silence — it is stated,
    and this server satisfies it from the operator-supplied external origin
    (`smart.public_base_url`, boot-required when SMART is enabled), wire-tested
    in `app/ferroehr-rest/tests/smart_http.rs`. Reported upstream (#1595).
  disposition: fixed_handling
  upstream_issue: 1595

AMB-150:
  ambiguity: >-
    master08 defines a scope grammar and then never connects it to the API it
    governs. Six silences, all in the enforcement half. (1) NO
    SCOPE-TO-OPERATION MAPPING EXISTS ANYWHERE. Nothing in the nine chapters
    names a single openEHR REST route, HTTP method, or operation id
    (grep-verified), so which CRUDS letter a given operation consumes, and
    which of the three nouns it belongs to, is entirely unassigned: the maximal
    table says `user/aql-<queryName>.cruds` grants "Full access to
    user-permitted AQL definitions or ad-hoc queries" without saying that
    executing a query is `s` rather than `r`, or that storing one is `c`.
    (2) OUT-OF-NOUN OPERATIONS. The noun list is closed to templates,
    compositions and AQL, so EHR, EHR_STATUS, CONTRIBUTION, DIRECTORY, the
    demographic resources and the admin routes have no expressible SMART scope
    at all — and the text never says whether that means they are ungoverned,
    universally granted, or universally denied. (3) THE PERMISSION TAIL'S
    WELL-FORMEDNESS. The five letters are listed and nothing more: no statement
    that the tail is order-free, that letters may not repeat, or what a tail
    containing an unrecognised letter means. (4) THE DENY STATUS. master08
    requires the Platform to "validate requested scopes" and never says what a
    refusal looks like on the wire. (5) A `patient/` SCOPE WITH NO RESOLVABLE
    CONTEXT. master07 makes the `ehrId` token-response parameter permissive
    ("the following openEHR-specific parameters may be included in the token
    response"), so a token can hold `patient/composition-*.r` and carry no
    resolvable EHR at all, and nothing says what the Platform then does.
    (6) MULTI-SCOPE COMPOSITION AND COMPARTMENT MATCHING. Nothing says how
    several granted scopes combine when more than one could permit a request,
    and nothing says by what value the `patient` compartment is matched to a
    request's EHR.
  source: >-
    ITS-REST docs/smart_app_launch/master08-scopes.adoc §Scopes (second
    paragraph: "The _Platform_ must validate requested scopes against …") +
    §Resource Scopes (the closed three-noun list; the five permission letters
    `c`/`r`/`u`/`d`/`s` with no well-formedness rule; the maximal table's eight
    rows, all of which describe access in prose and none of which names an
    operation) + master07-authorization.adoc §Context Selection (the token
    response table and its introducing sentence "the following openEHR-specific
    parameters may be included in the token response") + the whole
    smart_app_launch tree, grep-verified to contain no HTTP method, no openEHR
    route path, no status code, and no operation identifier + ITS-REST
    docs/overview/Requests_and_responses.md §"Authentication and authorization"
    ("If authentication and authorization are required, services MUST properly
    use the `WWW-Authenticate` and/or `Proxy-Authenticate` response headers,
    returning `403 Forbidden`, `401 Unauthorized` or `407 Proxy Authentication`
    as applicable") and §"HTTP status codes" (403 — "The service understood the
    request but refuses to authorize it") + RM ehr EHR_STATUS class §Attributes
    (`subject`: 1..1 PARTY_SELF, whose `external_ref` is the demographic
    reference) — all silences CONFIRMED first-hand.
  handling: >-
    Fixed handling on all six; where a choice had no released ground it is
    flagged as ours. (1) THE SCOPE-TO-OPERATION MAPPING IS IMPLEMENTER-INVENTED
    — no openEHR spec governs it, our own design/extension. The table lives in
    `app/ferroehr-rest/src/smart/enforce.rs` (`family_of_op`: `composition_*` /
    `versioned_composition_*` to Composition, `query_execute_*` /
    `definition_query_*` to Aql, `definition_template_*` to Template;
    `permission_of_op`: `query_execute_*` to `s`, create/upload/store to `c`,
    update to `u`, delete to `d`, else `r`) and its only anchors in the spec
    are the maximal table's own prose readings ("Execute and read AQL queries"
    pairing execution with `s`; "AQL definitions or ad-hoc queries" putting
    stored-query definitions in the `aql-` noun). Any citation of this mapping
    must carry that flag. (2) OUT-OF-NOUN OPERATIONS ARE SMART-UNGOVERNED, not
    denied: a grammar that cannot express a scope for
    EHR/EHR_STATUS/CONTRIBUTION/DIRECTORY/demographics/admin cannot be read as
    denying them, so the SMART gate returns allow-with-no-binding for them and
    authorization there is left entirely to the RBAC/ABAC layer the SMART gate
    is AND-composed onto (`family_of_op` yields `None`). (3) THE TAIL IS
    ORDER-FREE AND TOTAL-OR-INERT: any non-empty string over `{c,r,u,d,s}` in
    any order parses to the corresponding set (repetition is idempotent), and a
    tail containing ANY other character makes the WHOLE scope unparseable and
    therefore inert (`SmartScope::Other`) rather than partially honoured — the
    AMB-145 demotion rule applied to the tail, so an unrecognised letter can
    never silently widen a grant. (4) THE DENY STATUS IS THE BASE SPEC'S 403,
    not a SMART-specific code: the caller is authenticated and refused, so the
    ITS-REST §"Authentication and authorization" MUST and the 403 status row
    assign it, and the SMART gate routes every deny through the existing ABAC
    `forbidden` path. (5) A `patient/` SCOPE WITH NO RESOLVABLE
    `ehrId`/`patient` CLAIM IS DENIED — fail-closed, and the choice is ours
    where master07 only says "may": a compartment scope whose compartment
    cannot be established grants access to an unbounded set, which is the
    opposite of what the compartment means, so the absence of the context is
    treated as the absence of the grant. (6) COMPOSITION IS
    BROADEST-COMPARTMENT-WINS AND PATIENT MATCHING IS THE EHR'S SUBJECT
    EXTERNAL REF: when several granted scopes permit the same request, the
    broadest permitting compartment decides (System over User over Patient), so
    a `system/` grant is not narrowed by the coincidental presence of a
    `patient/` one (`broaden` in `enforce.rs`); and when the patient
    compartment does decide, the token's claim is compared to the target EHR's
    `EHR_STATUS.subject.external_ref` (`subject_gate` in
    `app/ferroehr-rest/src/extensions/access/pep.rs`), the only value the RM
    gives an EHR that identifies its patient. Both are our own design where the
    spec is silent. Reported upstream (#1596).
  disposition: fixed_handling
  upstream_issue: 1596

AMB-151:
  ambiguity: >-
    SMART on openEHR is a released chapter set with no conformance surface of
    its own, and its subject is a Platform that is not the CDR. Four facts,
    each verified against the vendored tree. (a) STATUS: the specification
    carries `:spec_status: DEVELOPMENT`. (b) FORCE: it contains exactly ONE
    RFC 2119 uppercase keyword in all nine chapters — master06 §Deprecated
    Flows' "MUST NOT be used" on the Implicit and ROPC grants; every other
    obligation is written in lowercase prose ("must", "should", "may"), so the
    text's requirement force is uniformly weak and uniformly unmarked.
    (c) MACHINE-READABILITY: SMART is the only API area of the release with no
    OpenAPI artifact — the vendored OAS carries exactly seven groups (admin,
    definition, demographic, ehr, overview, query, system) and none of them is
    SMART — and it has no schemas. (d) COVERAGE ANCHOR: the CNF corpus does not
    mention SMART anywhere (grep-verified across the whole vendored CNF tree),
    and the Profiles book's REST-APIs capability table has no SMART row. On top
    of that, the subject of almost every obligation is the *Platform*, defined
    as "a software ecosystem comprising at minimum an Authorization Server, an
    openEHR Clinical Data Repository (CDR), and a FHIR Server" — so with an
    external Authorization Server, most of what the specification requires is
    not CDR behaviour at all.
  source: >-
    ITS-REST docs/smart_app_launch/manifest_vars.adoc (`:spec_status:
    DEVELOPMENT`) + master06-authentication.adoc §Deprecated Flows (the sole
    uppercase keyword: "The following OAuth 2.0 flows are discouraged and MUST
    NOT be used within SMART on openEHR") + master02-overview.adoc §Glossary
    (the quoted Platform definition) + master04-service_discovery.adoc §Service
    Discovery + §Services + §Capabilities (the three CDR-side obligations: the
    document, its `application/json` media type, the required
    `org.openehr.rest` service entry with an absolute `baseUrl`) +
    master08-scopes.adoc §Resource Scopes (the grammar) + ITS-REST
    docs/overview/Requests_and_responses.md §"Authentication and authorization"
    and §"HTTP status codes" (the 403 the deny discipline rests on) + the
    vendored OAS group set (crates/openehr-its/vendor/rest-oas — seven
    `*.openapi.yaml` groups, no SMART) + the vendored CNF tree (zero
    occurrences of "smart", grep-verified) + CNF
    docs/profiles/master03-profiles.adoc §Functional REST APIs table (six rows:
    DEFINITION, EHR, DEMOGRAPHIC, QUERY, ADMIN, MESSAGE — no SMART row) — all
    CONFIRMED first-hand.
  handling: >-
    Statement-declared, with the boundary drawn explicitly rather than left
    implicit. THE CDR'S ENFORCEABLE SHARE OF SMART IS EXACTLY THREE
    BEHAVIOURS: the discovery document (served at the Platform base URL as
    `application/json`, carrying a required `org.openehr.rest` entry whose
    `baseUrl` is absolute), the master08 resource-scope grammar (parsed and
    enforced as a narrowing AND onto RBAC/ABAC), and the 403-on-scope-deny
    discipline (the base spec's status, AMB-150(4)). Everything else the
    specification describes belongs to the Authorization Server: the launch
    sequences of master07, token issuance and the deprecated-grant prohibition
    of master06, client registration and credentialing of master03, and the
    application typology of master05. NINE BOUNDARY DELEGATIONS ARE RECORDED
    HERE AS SCOPE STATEMENTS, NOT AS AMBIGUITIES — in each the specification
    itself hands the rule to HL7 or to the implementer, so there is nothing for
    openEHR to clarify: (B-1) the `.well-known/smart-configuration` endpoint
    definition, which master04 "extends" from FHIR; (B-2) the requiredness and
    semantics of the OAuth2/OIDC discovery members, which "must match those
    defined in the OAuth 2.0 + OpenID Connect Discovery specification as well
    as the FHIR SMART metadata specification"; (B-3) the base `capabilities`
    vocabulary, master04 defining only the four openEHR additions "in addition
    to those scopes defined in the original SMART App Launch framework";
    (B-4) the standard SMART launch scopes and context attributes, whose "use
    is not normative in this specification"; (B-5) the authorization-code
    sequence itself, which "builds on the OAuth 2.0 Authorization Code Flow";
    (B-6) client registration, where "the current recommendation is to handle
    registration out-of-band"; (B-7) the confidential-client authentication
    methods, both of which master06 delegates to HL7 pages; (B-8) end-user
    identity verification, whose "exact mechanisms of identity verification are
    considered implementation-specific and fall outside the scope of this
    specification"; (B-9) the public/confidential application typology, which
    master05 takes from "the considered by SMART specification". COVERAGE
    CONSEQUENCE — REVISED: the three CDR-side behaviours are now EXECUTED
    CASES, and only the boundary above stays statement-declared. The two
    blockers this entry originally recorded were runner/stack capabilities, not
    spec facts, and both have been built. (i) A SMART OVERLAY LANE:
    `docker/sut-smart.yml` boots the SUT in the SMART resource-server posture
    (`smart.enabled`, `smart.require_smart_scopes` — the fail-closed posture
    master04 §Capabilities lets a Platform advertise as `openehr-permission-v1`
    —, the advertised Authorization-Server endpoints, and `auth.oidc` trusting
    a committed static test issuer) — since the owner ruling of 2026-07-28
    this posture IS the standard ferroehr conformance posture: the pipeline
    always composes it, the ixit principals mint scoped Bearer tokens, and
    the one committed record covers the SMART cases alongside the rest.
    (ii) A PER-CASE TOKEN MINT: a flow step declares the `scope` claim its
    principal presents and the runner signs an RS256 access token carrying
    exactly that, against the issuer the party declares in its ixit `smart`
    lane. The CDR still never issues a token — master06 §Supported
    Authentication Flows makes that the Authorization Server's duty and the
    stack still runs none; the RUNNER takes the AS role for the lane, which is
    a test-harness fact, not a claim about the CDR. Because that lane is a
    party declaration, a party whose ixit declares no `smart` block records
    every SMART case not-applicable with that citation (ISO/IEC 9646 test
    selection), so the default SMART-off lane is unchanged and no case is ever
    driven against a deployment that legitimately does not run SMART.
    WHAT IS EXECUTED (`vocab/wire_surface.yaml` → `artifacts/schedule/smart/`):
    `smart-discovery-document-shape` → `SMART-DISCOVERY-document_shape` (the
    document served from the Platform base URL as `application/json`, the
    required `org.openehr.rest` service, its absolute `baseUrl`, the
    `capabilities` array); `smart-resource-scope-grammar` →
    `SMART-RESOURCE_SCOPES-granted_scope_permits` (the granting rows: the
    `user` and `system` compartments, the `*` pattern row, single- and
    multi-letter permission tails, and an identity scope alongside) plus
    `SMART-RESOURCE_SCOPES-scope_deny_403`; `smart-scope-deny-403` →
    `SMART-RESOURCE_SCOPES-scope_deny_403` (a granted template scope without
    the read letter, a scope of another family, identity scopes only, and no
    scope at all). WHAT REMAINS OFF THE WIRE, honestly registered rather than
    absorbed: the disabled-state absence
    (`smart-discovery-absent-when-disabled` — the absence of a surface has no
    wire to drive) and the grammar rows no case reaches yet
    (`smart-resource-scope-grammar-remaining-rows` — the `patient` compartment
    and its launch-context binding, the `composition-`/`aql-` nouns, the four
    non-`*` pattern rows, the inert demotion), a coverage gap that now shrinks
    case by case because the machinery exists. Both stay proven meanwhile by
    the server's own tests — `app/ferroehr-rest/tests/smart_http.rs` and the
    grammar unit suite in `crates/openehr-its/src/rest/smart_scopes.rs` —
    which is evidence about the server and the parser, never about the wire.
    THE POSTURE IS THE BASELINE (re-adjudicated for PR #611; the earlier
    focused-lane paragraph described the retired
    `statement.smart.json`/sidecar-directory scheme): the SMART
    resource-server posture IS the standard ferroehr conformance posture —
    the pipeline always composes the SMART overlay, the ixit's principals
    mint scoped Bearer tokens, and the ONE committed record drives the whole
    claimed surface including the SMART group. The `SmartAppLaunch`
    capability row in `vocab/capability_matrix.yaml` is claimed by THE party
    statement (`party/ferroehr/statement.json`); there is no second
    statement and no per-lane artefact directory.
    Reported upstream (#1597).
  disposition: statement_declared
  upstream_issue: 1597

AMB-152:
  ambiguity: >-
    The Simplified Formats are PROMISED for EHR_STATUS and FOLDER by a released
    sentence and DEFINED for neither. The CONTRIBUTION commit's own description
    prose — released text, not an OAS enum — states that when a Simplified MIME
    type is used "Only the inner versioned payload - each `versions[i].data`
    (the embedded `COMPOSITION`, `EHR_STATUS`, or `FOLDER`) - is serialized in
    the chosen FLAT or STRUCTURED form", naming all three classes explicitly;
    and the same two MIME types are offered on the standalone resources too —
    four DIRECTORY operations (`directory_create`, `directory_update`,
    `directory_get_at_time`, `directory_get_by_version_id`) and three EHR_STATUS
    operations (`ehr_status_update`, `ehr_status_get_at_time`,
    `ehr_status_get_by_version_id`). Yet the Simplified Formats
    sub-specification defines no EHR_STATUS shape and no FOLDER shape anywhere.
    Its RM-mapping chapter has 43 class sections and exactly ONE versioned-object
    root among them, `== COMPOSITION` (every other section is a class contained
    inside a composition — ENTRY subtypes, EVENT_CONTEXT, CLUSTER/ELEMENT — or a
    data type); and the whole field-identifier space is OPT-derived by
    definition: "__Template-specific__: Field identifiers are specific to each
    operational template" and "__Operational Templates (OPT)__: field
    identifiers are generated from OPT definitions". Neither an EHR_STATUS nor a
    directory FOLDER has an operational template, so there is no source from
    which either resource's field identifiers could be generated, and no table
    saying what their suffixes would mean if there were. A THIRD, asymmetric
    variant of the same silence sits on EHR creation: `ehr_create` and
    `ehr_create_with_id` pair a request-side `ContentType_LOCATABLE` (which
    admits both Simplified types on the EHR_STATUS request body) with a
    response-side `Accept_canonical` (JSON + XML only), so the declaration would
    have a service READ an EHR_STATUS in a form it is never allowed to WRITE
    back — a receive-but-not-return asymmetry no sentence explains. This is the
    non-demographic half of the scope problem AMB-128 registers for the PARTY
    routes, and it rests on STRONGER evidence: there the only offer was a
    negotiation enum, here a released prose sentence names the two classes.
  source: >-
    ITS-REST specifications/operations/contribution_create.yaml §"Simplified
    Formats (FLAT / STRUCTURED)" (the released description prose, quoted above,
    naming `COMPOSITION`, `EHR_STATUS` and `FOLDER`) + ITS-REST
    docs/simplified_formats/master05-rm_mapping.adoc (43 class sections; the only
    versioned-object root mapped is `== COMPOSITION` — no EHR_STATUS section, no
    FOLDER section) + master02-overview.adoc §Introduction ("__Template-specific__:
    Field identifiers are specific to each operational template") and
    §"Relationship to Other Specifications" ("__Operational Templates (OPT)__:
    field identifiers are generated from OPT definitions"; "serialized instances
    represent valid RM structures (e.g. COMPOSITION)") +
    specifications/operations/{directory_create,directory_update,directory_get_at_time,directory_get_by_version_id}.yaml
    and {ehr_status_update,ehr_status_get_at_time,ehr_status_get_by_version_id}.yaml
    (each referencing parameters/header/Accept_LOCATABLE.yaml and/or
    ContentType_LOCATABLE.yaml, whose enums carry
    `application/openehr.wt.flat+json` and
    `application/openehr.wt.structured+json`) +
    specifications/operations/{ehr_create,ehr_create_with_id}.yaml
    (ContentType_LOCATABLE on the request against
    parameters/header/Accept_canonical.yaml — enum `application/json`,
    `application/xml` — on the response) + specifications/docs/overview/Resources.md
    §Simplified Formats ("If the service cannot process the request payload as
    the simplified format is not supported, it MUST respond with HTTP status
    code `415 Unsupported Media Type`"; "If the service cannot fulfill this
    aspect of the request, it MUST respond with HTTP status code `406 Not
    Acceptable`") and §"Data representation" ("Services MUST support at least
    one of the openEHR **XML** or **JSON** canonical formats for resource
    representation. Additionally, the **Simplified Formats** format SHOULD be
    supported") + RM ehr §EHR_STATUS and RM common §FOLDER (neither is a
    templated, OPT-derived structure) — all CONFIRMED first-hand.
    TIER NOTE, RE-GROUNDED 2026-07-28 with the verdict unchanged: the
    2026-07-27 wording dismissed the negotiation enums as "OAS shape (stalled,
    never an oracle)" and called `contribution_create`'s §Simplified Formats
    paragraph "released text, not an OAS enum". Both tierings were wrong under
    the current order and are corrected here — `operations/*.yaml` descriptions
    and `parameters/header/*.yaml` enums are BOTH tier-2 OAS material, citable
    where the docs text is silent and cited AS the OAS, which is how this entry
    cites them now. Nothing about the adjudication moves, for two reasons that
    survive the re-tiering intact: an enumerated MIME type is an OFFER and
    never a presence requirement (the order says so explicitly), and the real
    gap is not on either tier of ITS-REST at all — the Simplified Formats
    sub-specification defines no EHR_STATUS and no FOLDER shape, and no OAS
    element can supply a mapping table that was never written.
  handling: >-
    Fixed handling: EHR, EHR_STATUS and DIRECTORY (FOLDER) are CANONICAL-ONLY,
    and both refusals are the ones the negotiation section already mandates
    rather than invented ones. A request declaring `Content-Type:
    application/openehr.wt.flat+json` (or `…structured…`, or
    `application/openehr.wt+json`) on any of these resources is answered `415
    Unsupported Media Type`; a read whose `Accept` admits only a Simplified type
    is answered `406 Not Acceptable`. Serving canonical JSON and XML satisfies
    the §"Data representation" MUST outright, and the Simplified SHOULD in the
    same sentence is a SHOULD over a serialization that has no EHR_STATUS or
    FOLDER shape to produce: honouring it would require this service to invent
    both the mapping tables and a template-naming channel for resources that
    have no template — exactly the private resolution the attribution law
    forbids. The single refusal point is
    `app/ferroehr-rest/src/formats/dispatch.rs::guard_non_templated`, applied
    uniformly at the head of the EHR, EHR_STATUS, DIRECTORY and demographic
    handler groups, and its code NOTE carries the same citation. The
    `ehr_create`/`ehr_create_with_id` asymmetry collapses under the same rule:
    the request body is an EHR_STATUS, so a Simplified `Content-Type` there is
    `415` and the response side never arises. The CONTRIBUTION arm follows from
    the same silence: the envelope stays canonical JSON (AMB-134) and each
    `versions[i].data` is read/written in the negotiated Simplified form ONLY
    when it is a COMPOSITION — an EHR_STATUS or FOLDER member has no Simplified
    shape, so a Simplified CONTRIBUTION carrying one is refused rather than
    guessed (AMB-57 carries the read half). Nothing is silently narrowed: the
    refusals are declared, exercised branches, gated by
    SF-SCOPE-directory_no_simplified (406) and SF-SCOPE-ehr_status_no_simplified
    (406), with AMB-128 gating the demographic sibling. Reported upstream
    (#1598): either give EHR_STATUS and FOLDER real Simplified mappings plus a
    field-identifier source that does not require an OPT, or strike the two
    classes from the contribution_create sentence and drop the Simplified MIME
    types from those seven operations' negotiation enums; and either way say
    what `ehr_create`'s receive-but-not-return asymmetry means.
  disposition: fixed_handling
  upstream_issue: 1598

AMB-153:
  ambiguity: >-
    The STRUCTURED format's own syntax rules contradict each other on instance
    indices, and both released worked examples take the side the rules forbid.
    master04 §"Structured format" states as Syntax Rule 2 that "Instance indices
    MUST remain in property names", repeats it as step 6 of the §"Conversion
    Between Formats" Structured-to-Flat algorithm ("Preserve instance indices in
    property names"), and prefaces both with the descriptive bullet "Instance
    indices remain in property names (e.g., `body_temperature`)" — whose own
    parenthetical example carries no index. Syntax Rule 5 of the SAME list then
    requires "Arrays MUST be used for data values, even when cardinality is
    `0..1` or `1..1`". The two are irreconcilable for a repeating node: an array
    already carries position, so keeping `:i` in the property name of every
    element either duplicates the index or forces one property per occurrence,
    which is not an array. Both worked examples resolve it against Rule 2. The
    master04 §"Structured format" example renders the FLAT keys
    `…/body_temperature:0/any_event:0/temperature|magnitude` as
    `"body_temperature": [ { "any_event": [ { "temperature": [ … ] } ] } ]` —
    array elements, no `:i` anywhere. The master03 §"Structured format" example
    is decisive because it is a rendering of an adjacent FLAT example that
    genuinely repeats: the FLAT block has `blood_pressure/any_event:0/…` AND
    `blood_pressure/any_event:1/…`, and the STRUCTURED block renders them as two
    elements of one `"any_event"` array, again with no index in the property
    name. So the normative MUST is contradicted by the only two instances the
    specification itself provides, and a reader cannot tell whether a producer
    that emits `"any_event:0"` is conformant, non-conformant, or both.
  source: >-
    ITS-REST docs/simplified_formats/master04-basic_concepts.adoc §"Structured
    format" (the descriptive bullet "Instance indices remain in property names
    (e.g., `body_temperature`)"; Syntax Rule 2 "Instance indices MUST remain in
    property names"; Syntax Rule 5 "Arrays MUST be used for data values, even
    when cardinality is `0..1` or `1..1`"; the worked JSON example, whose
    `body_temperature` / `any_event` / `temperature` properties are arrays with
    no `:i`) + the same file's §"Conversion Between Formats" Structured-to-Flat
    step 6 ("Preserve instance indices in property names") and Flat-to-Structured
    step 3d ("If attribute suffix exists, create an array containing an object
    with suffix as property") + §"Instance Indexing" (the FLAT `:i` grammar the
    rules refer back to) + master03-design_rationale.adoc §"Flat format" and
    §"Structured format" (the paired example: FLAT `any_event:0` + `any_event:1`
    rendered as a two-element `"any_event"` array with unindexed property names)
    — the conflict CONFIRMED first-hand.
  handling: >-
    Fixed handling, resolved toward the examples and lenient toward the rule.
    ON INPUT both forms are accepted: a STRUCTURED property name may carry an
    explicit `:i` (Rule 2's literal reading) and it folds into array position,
    and a single occurrence may arrive without its array wrapper — so a producer
    written to either half of the contradiction is read losslessly
    (`crates/openehr-its/src/flat/sim/structured.rs`, `parse_child_property`).
    ON OUTPUT the index is ALWAYS array position and never appears in a property
    name, because that is what both released worked examples show and because it
    is the only form that satisfies Rule 5 at the same time; every child is
    array-wrapped even at `0..1`/`1..1` cardinality, and interior index holes are
    kept as empty array elements so FLAT round-trips preserve their numbering
    (`emit_structured`/`emit_node`). Accepting both and emitting one keeps the
    round-trip total in both directions: a FLAT document converted to STRUCTURED
    and back reproduces its `:i` numbering exactly, which is the property
    §"Conversion Between Formats" actually needs. Gated by SF-STRUCT-style_rules
    (the syntax-rule witness on a live read-back) with SF-STRUCT-arrays_single_
    cardinality and SF-STRUCTURED-commit_roundtrip either side of it. Reported
    upstream (#1599): reconcile Syntax Rule 2 and Structured-to-Flat step 6
    with Syntax Rule 5 and with the master04/master03 worked examples — state
    explicitly that STRUCTURED carries the instance index as array POSITION, and
    either delete the "indices remain in property names" sentences or restate
    them as an accepted-on-input alternative.
  disposition: fixed_handling
  upstream_issue: 1599

AMB-154:
  ambiguity: >-
    A bundle of editorial defects in the STABLE Simplified Formats chapters,
    each re-verified first-hand against the vendored .adoc before listing. None
    changes what a conformant server does, because in every case the RM or the
    chapter's own worked example settles the reading — but several are
    behaviour-relevant on a literal reading, and all of them are wrong as
    published. IN master05-rm_mapping.adoc: (E-1) PHANTOM `/territory` ROWS —
    the ADMIN_ENTRY, INSTRUCTION, ACTION, EVALUATION and OBSERVATION mapping
    tables each carry a `/territory` → RM path `territory` row marked Required
    "Yes", copied from the COMPOSITION table; RM ENTRY declares no `territory`
    attribute at all, so a literal reading makes a non-existent RM attribute
    MANDATORY on five ENTRY types. (E-2) THE MANDATORY `/encoding` ROW IS
    MISSING from those same five tables, which list `/language` (Required "Yes")
    and stop, although RM ENTRY.encoding is 1..1 and every one of the chapter's
    own examples for those five types emits `…/encoding|code` +
    `…/encoding|terminology`. (E-3) `/provider` AND `/_other_participation:i`
    HAVE NO ROWS in any ENTRY table, although the examples emit both
    (`…/_provider|name`, `…/_other_participation:0|function`) and RM ENTRY
    declares provider 0..1 and other_participations 0..1. (E-4) THE DV_QUANTITY
    FLAT TYPES ARE SWAPPED — `|magnitude` is typed String and `|unit` is typed
    Real, the inverse of RM DV_QUANTITY (magnitude: Real, units: String) and of
    the table's own example (`65.9` / `"unit"`); the same table also omits rows
    for `|precision`, `|units_system` and `|units_display_name`, all three of
    which its second example emits. (E-5) `|id_scheme` IS TYPED Integer IN THREE
    TABLES — PARTY_SELF, PARTY_IDENTIFIED and PARTY_RELATED all type the suffix
    that maps to `external_ref.id.scheme` as Integer, while BASE GENERIC_ID.scheme
    is String, the PARTICIPATION table types the same suffix String, and every
    example writes a string ("UUID", "HOSPITAL-NS"). (E-6) `dta` TYPO — the
    DV_MULTIMEDIA `|data` row gives its RM path as `dta`. (E-7) MALFORMED
    `\meaning` CELL — the REFERENCE_RANGE table's last Flat-Path cell reads
    `\meaning`, which is neither the escaped-pipe suffix form (`\|meaning`) its
    sibling rows use nor the sub-path form; both of the chapter's own
    REFERENCE_RANGE examples write it as a SUB-PATH with DV_TEXT/DV_CODED_TEXT
    suffixes (`…/_other_reference_ranges:0/meaning|value`), and the row's Flat
    type is DV_TEXT, so the intended cell is `/meaning`. (E-8) THE FLAT SPELLING
    LEAKED INTO THE RM-PATH COLUMN EIGHT TIMES — DV_ORDINAL, DV_QUANTITY,
    DV_PROPORTION, DV_COUNT, DV_DATE, DV_DATE_TIME, DV_TIME and DV_DURATION each
    give the RM path of their reference-range row as `_other_reference_ranges`,
    underscore and all; the RM attribute is DV_ORDERED.other_reference_ranges,
    and the underscore is the master04 §"RM Attributes prefix" marker that
    belongs only in the Flat Path column. (E-9) FEEDER_AUDIT DOUBLE-MAPPING,
    WRONG TYPE AND TYPO — `/original_content` and `/original_content_multimedia`
    are given the SAME RM path `original_content` with no discriminator beyond a
    Note, and that Note is the ungrammatical "one one of original_content and
    original_content_multimedia can be set", repeated verbatim on both rows;
    in the same table `/originating_system_audit` is typed PARTY_IDENTIFIED
    where RM common FEEDER_AUDIT.originating_system_audit is FEEDER_AUDIT_DETAILS
    1..1 (the sibling `/feeder_system_audit` row types it correctly). (E-10)
    `/_expiry_time` IS MARKED Required "Yes" in the INSTRUCTION table, although
    RM INSTRUCTION.expiry_time is 0..1 and master04 §"RM Attributes prefix"
    defines the leading underscore precisely as the marker for optional RM
    attributes not constrained in the template. (E-11) DV_IDENTIFIER'S `|id` ROW
    CONTRADICTS ITSELF — Required "Yes" with the Note "For the input \|id might
    be left out." (E-12) SIX SECTIONS OPEN WITH A LINK TO THE WRONG RM CLASS —
    ACTION points at EVALUATION, OBSERVATION at COMPOSITION, ISM_TRANSITION at
    ACTIVITY, OBJECT_REF at EVENT_CONTEXT, POINT_EVENT at EVENT_CONTEXT and
    DV_IDENTIFIER at DV_QUANTITY. (E-13) THE OBJECT_REF SUFFIX SPELLING SPLITS —
    the OBJECT_REF table's third row is `|scheme` (→ `id.scheme`) while every
    OBJECT_REF example in the chapter writes `|id_scheme`
    (`_guideline_id|id_scheme`, `_work_flow_id|id_scheme`), as does master06
    §"Workflow ID"; the same table marks all four suffixes Required "yes",
    including a `scheme` that exists only on BASE GENERIC_ID and not on the
    generic OBJECT_ID an OBJECT_REF may carry. (E-14) THE DV_INTERVAL
    `|lower_unbounded` ROW puts the FLAT suffix in its RM-Path cell
    (`\|lower_unbounded`) where its three sibling rows carry the bare attribute
    name. IN master06-context_information.adoc: (D-04) A GHOST `ctx` KEY —
    §"Workflow ID" says "`work_flow_id|namespace` can be left out if
    `ctx/namespace` is set", but no `ctx/namespace` key exists anywhere in the
    chapter; the defined key is `ctx/id_namespace`. ACROSS master05: (D-06)
    VENDOR COMMENTARY AND A SPELLING SPLIT IN A STABLE CHAPTER — the
    §"PARTY_RELATED performer" sub-section closes with a NOTE naming two
    implementations and prescribing which flows to use until "parity is
    established", which is implementation status inside normative text; and that
    same sub-section spells the relationship path `/relationship` while the
    PARTY_RELATED class table spells it `/_relationship`, for the same RM
    attribute at what is structurally the same position. (D-07) THE TERMINOLOGY
    SUFFIX HAS TWO DIFFERENT REQUIREDNESSES — CODE_PHRASE marks `|terminology`
    (→ `terminology_id.value`) unconditionally Required "yes", while
    DV_CODED_TEXT marks the same suffix (→ `defining_code.terminology_id.value`)
    "(yes)" with "only required for external terminologies"; a DV_CODED_TEXT's
    `defining_code` IS a CODE_PHRASE, so the two rows state different
    obligations for the same RM slot, and "external terminologies" is defined
    nowhere in the specification.
  source: >-
    ITS-REST docs/simplified_formats/master05-rm_mapping.adoc §ADMIN_ENTRY,
    §INSTRUCTION, §ACTION, §EVALUATION, §OBSERVATION (the five mapping tables:
    the `/territory` rows; the absent `/encoding`, `/provider` and
    `_other_participation:i` rows; the JSON examples that emit all three) +
    §DV_QUANTITY (`\|magnitude` → Flat type String, `\|unit` → Flat type Real;
    no `\|precision`/`\|units_system`/`\|units_display_name` rows against the
    second example, which emits all three) + §PARTY_SELF, §PARTY_IDENTIFIED,
    §PARTY_RELATED (`\|id_scheme` → Flat type Integer) CONTRASTED with
    §PARTICIPATION (`\|id_scheme` → String) + §DV_MULTIMEDIA (the `\|data` row's
    RM Path cell `dta`) + §REFERENCE_RANGE (the `\meaning` Flat-Path cell; both
    examples writing `_other_reference_ranges:i/meaning|value`) + §DV_ORDINAL,
    §DV_QUANTITY, §DV_PROPORTION, §DV_COUNT, §DV_DATE, §DV_DATE_TIME, §DV_TIME,
    §DV_DURATION (the eight `_other_reference_ranges` RM-Path cells) +
    §FEEDER_AUDIT (`/original_content` and `/original_content_multimedia` both →
    `original_content`; "one one of …" ×2; `/originating_system_audit` typed
    PARTY_IDENTIFIED) + §INSTRUCTION (`/_expiry_time` Required "Yes") +
    §DV_IDENTIFIER (`\|id` Required "Yes" + "For the input \|id might be left
    out.") + the opening "See RM specification of the …" links of §ACTION,
    §OBSERVATION, §ISM_TRANSITION, §OBJECT_REF, §POINT_EVENT and §DV_IDENTIFIER
    + §OBJECT_REF (the `\|scheme` row) against §INSTRUCTION/§ACTION's
    `_guideline_id|id_scheme` and `_work_flow_id|id_scheme` example keys +
    §DV_INTERVAL (the `\|lower_unbounded` RM-Path cell) + §"PARTY_RELATED
    performer" (the `/relationship` row and the implementation-status NOTE)
    against §PARTY_RELATED (the `/_relationship` row) + §CODE_PHRASE
    (`\|terminology` Required "yes") against §DV_CODED_TEXT (`\|terminology`
    Required "(yes)", "only required for external terminologies") +
    master06-context_information.adoc §"Workflow ID" ("`work_flow_id|namespace`
    can be left out if `ctx/namespace` is set") against §"ID Namespace and
    Scheme" ("`id_namespace`: default namespace for external references:
    `OBJECT_REF.namespace`") + master04-basic_concepts.adoc §"RM Attributes
    prefix" (the underscore marks "optional RM attributes not explicitly
    constrained in the template") — ADJUDICATED against RM composition
    §ENTRY (language 1..1, encoding 1..1, subject 1..1, provider 0..1,
    other_participations 0..1 — no `territory`), RM composition §INSTRUCTION
    (expiry_time 0..1), RM common §FEEDER_AUDIT (originating_system_audit:
    FEEDER_AUDIT_DETAILS 1..1; original_content: DV_ENCAPSULATED 0..1), RM
    data_types §DV_QUANTITY (magnitude: Real, units: String), §DV_MULTIMEDIA
    (`data`: Array<Octet>), §DV_ORDERED (other_reference_ranges),
    §REFERENCE_RANGE (meaning: DV_TEXT 1..1) and BASE base_types §GENERIC_ID
    (scheme: String) — every defect CONFIRMED first-hand.
  handling: >-
    Editorial: the RM and the chapters' own worked examples settle every reading,
    and this implementation follows them, so no wire behaviour turns on any of
    these cells. Concretely: no ENTRY-level `territory` is accepted or emitted —
    `territory` is a COMPOSITION leaf only (E-1); `/encoding` is treated as the
    mandatory ENTRY leaf RM makes it and is emitted on every ENTRY (E-2);
    `_provider` and `_other_participation:i` are supported as the examples spell
    them (E-3); `|magnitude` is a number and `|unit` a string, and
    `|precision`/`|units_system`/`|units_display_name` are carried (E-4);
    `|id_scheme` is a string everywhere (E-5); `|data` maps to DV_MULTIMEDIA.data
    (E-6); the reference-range meaning is the sub-path `/meaning` (E-7); the RM
    attribute is `other_reference_ranges` without the FLAT underscore (E-8);
    `/original_content` and `/original_content_multimedia` are the DV_PARSABLE
    and DV_MULTIMEDIA arms of the one 0..1 `original_content` slot and are
    mutually exclusive, and `originating_system_audit` is a FEEDER_AUDIT_DETAILS
    (E-9 — SF-MAP-events_audit already carries this one as a case guard);
    `_expiry_time` is optional (E-10); `|id` is required on output and may be
    absent on input exactly as the Note says (E-11); the mis-targeted class
    links are read through to the section's own class (E-12); the OBJECT_REF
    scheme suffix is `|id_scheme`, matching every example and master06, and is
    optional because `scheme` exists only on a GENERIC_ID (E-13); the
    DV_INTERVAL RM path is `lower_unbounded` (E-14); `ctx/id_namespace` is the
    only namespace default key (D-04); the PARTY_RELATED relationship is
    accepted under both spellings and emitted as the class table's
    `/_relationship`, and the vendor-parity NOTE governs nothing here — no
    vendor implementation is an oracle (D-06); and `|terminology` is required
    whenever a DV_CODED_TEXT is emitted, the CODE_PHRASE row's unconditional
    reading, since an undefined "external terminologies" exemption cannot narrow
    a stated MUST (D-07). Each of these is proven row-by-row by the master05
    semantic battery (`crates/openehr-its/tests/master05_tables.rs`), which
    asserts the Flat Path, Flat type and RM landing of every mapping row rather
    than the published cell. Reported upstream (#1600) as one editorial
    docket.
  disposition: editorial
  upstream_issue: 1600

AMB-155:
  ambiguity: >-
    The STRUCTURED variant is specified by ONE worked example plus six syntax
    rules, and three forms that master04 defines only in FLAT have no stated
    STRUCTURED rendering at all. (1) THE BARE VALUE ALONGSIDE SUFFIXED PARTS.
    Rule 3 says attribute suffixes become `"|suffix"` properties, and the
    examples show suffix-less leaves as bare scalars inside their array
    (`"time": [ "2022-02-03T04:05:06" ]`). Neither says what happens when a leaf
    carries BOTH a bare value and suffixed parts — which seven master05 tables
    require by giving their value row an EMPTY Flat-Path cell alongside `\|…`
    suffix rows: DV_COUNT, DV_DATE, DV_DATE_TIME, DV_TIME, DV_DURATION,
    DV_MULTIMEDIA (the URI plus `|mediatype`/`|size`) and DV_PROPORTION (the
    calculated magnitude), with DV_PARSABLE's own example showing the same shape
    (`…/dv_parsable` + `…/dv_parsable|formalism`). A scalar cannot also hold
    properties, so the object form needs a property name for the bare part and
    the specification never supplies one. (2) THE
    COMPOUND `ctx` ENTRIES. Rule 4 groups context under a `ctx` object, and the
    only STRUCTURED example shows four scalar members (language, territory,
    composer_name, time). master06 defines seventeen `ctx` sections, several of
    which are NOT scalar in FLAT: `ctx/work_flow_id|id` and its three siblings
    (suffixed), `ctx/participation_name:0` … `ctx/participation_identifiers:1|id:1`
    (indexed AND suffixed AND indexed again), `ctx/link:0|type` (indexed +
    suffixed) and `ctx/health_care_facility|name` (suffixed). No example, rule or
    algorithm step says how any of those nest inside the `ctx` object. (3) `|raw`
    IN STRUCTURED. §"Raw canonical JSON" defines the `|raw` bypass with a FLAT
    example only, and never says whether the bypass exists in STRUCTURED, nor —
    if it does — whether the embedded canonical object sits under a `"|raw"`
    property of the leaf's array element or somewhere else. The §"Conversion
    Between Formats" algorithms do not mention `|raw` in either direction.
  source: >-
    ITS-REST docs/simplified_formats/master04-basic_concepts.adoc §"Structured
    format" (the six Syntax Rules and the single worked example: nested objects,
    `"|suffix"` properties, a scalar-only `ctx`, arrays throughout, and bare
    scalars as array elements for `time`) + §"Conversion Between Formats" (both
    algorithms; Flat-to-Structured step 3c/3d speaks only of the case where "an
    attribute suffix exists", Structured-to-Flat step 3 only of "properties with
    a pipe prefix" — neither names the suffix-less part) + §"Raw canonical JSON"
    (the `|raw` bypass, FLAT example only, no STRUCTURED form) + the same file's
    §"Field Identifiers" (the six-component list introduced as what "The
    Simplified Formats use", item 6 being the `|raw` bypass — variant-neutral) +
    master03-design_rationale.adoc §"Structured format" (the second worked
    example, likewise showing bare scalars as array elements —
    `"clinical_interpretation": [ "…" ]`, `"_uid": [ "…" ]` — and likewise never
    combining a bare value with suffixed parts) +
    master05-rm_mapping.adoc §DV_COUNT, §DV_DATE,
    §DV_DATE_TIME, §DV_TIME, §DV_DURATION, §DV_MULTIMEDIA, §DV_PROPORTION (the
    seven tables whose value row is an EMPTY Flat-Path cell alongside `\|…`
    suffix rows) and §DV_PARSABLE (the same shape in its example) +
    master06-context_information.adoc §"Workflow ID", §Participation, §link,
    §health_care_facility (the compound `ctx` keys) — the silences CONFIRMED
    first-hand.
  handling: >-
    Fixed handling on all three; each is lossless against the FLAT forms the
    specification DOES define, and each is flagged where the choice is ours. (1)
    THE BARE VALUE USES THE EMPTY-STRING PROPERTY `""`. A leaf whose only datum
    is the bare value stays a bare scalar in its array element (matching both
    worked examples); a leaf that carries a bare value AND suffixed parts becomes
    an object in which the suffixed parts are `"|suffix"` properties per Rule 3
    and the bare part is the `""` property — the one property name that cannot
    collide with a suffix (`|`-prefixed) or a child segment (a node id, which
    master04 §"Node ID Generation Rules" guarantees is non-empty). No openEHR
    spec governs this key; it is our own design/extension, and it is also the
    ecosystem's established wire
    (`crates/openehr-its/src/flat/sim/mod.rs`, `sim::structured::emit_node`).
    (2) A `ctx` MEMBER TAKES THE SAME THREE SHAPES AS A DATA NODE, one level
    deep: a scalar (bare single), an object of `"|suffix"` properties (suffixed
    single), or an array of either (an indexed member) — so `work_flow_id`
    becomes an object, `participation_name` an array, `link` an array of objects,
    and the master04 example's four scalars are unchanged. This is a direct
    transposition of Rules 3 and 5 onto the `ctx` subtree, chosen because it is
    lossless in both directions against every FLAT `ctx/` form master06 defines;
    no openEHR spec governs the nesting itself (`sim::structured::parse_ctx`).
    (3) `|raw` IS LEGAL IN STRUCTURED, as a `"|raw"` property of the leaf's array
    element. Two released grounds, neither of them an invention: master04
    §"Field Identifiers" lists "**Raw canonical JSON**: Use of `|raw` attribute
    to embed openEHR canonical JSON" as component 6 of the field-identifier
    syntax the sub-specification defines as a whole — the list is introduced as
    what "The Simplified Formats use", not as what one variant uses —, and
    Rule 3 already
    says that an attribute suffix becomes a pipe-prefixed property, which is what
    `|raw` is. The payload rule is the variant-independent one master04 states:
    the embedded value MUST carry `_type`, and it is taken verbatim onto the RM
    leaf (`crates/openehr-its/src/flat/map/mod.rs` — the bypass is applied at the
    datum level, so both codecs reach it identically). Gated by
    SF-RAW-structured_embedding (the STRUCTURED `|raw` commit) with
    SF-RAW-embedding and SF-RAW-missing_type on the FLAT side, and by
    SF-STRUCT-style_rules / SF-STRUCTURED-commit_roundtrip for the `ctx` and
    bare-value shapes. Reported upstream (#1601): give the STRUCTURED variant
    a stated property name for the bare value, a worked `ctx` example covering
    the suffixed and indexed master06 members, and one sentence saying whether
    `|raw` applies in STRUCTURED.
  disposition: fixed_handling
  upstream_issue: 1601

AMB-156:
  ambiguity: >-
    The field-identifier grammar leaves two of its own dimensions unassigned.
    (1) THE INSTANCE INDEX HAS NO UPPER BOUND. master04 §"Instance Indexing"
    defines `:i` as a zero-based index appended to a node id "When a node can
    occur multiple times (max > 1 or max = -1)" and stops: no maximum, no
    statement about what a receiver does with an index far beyond the occurrences
    actually present, and no rule about sparse or out-of-order indices. Since a
    single short key can name an arbitrarily large index, an implementation that
    materialises occurrences positionally has an unbounded allocation in its
    parser with nothing in the specification to bound it. (2) POLYMORPHIC CHOICE
    ALTERNATIVES HAVE NO NAMES. §"Node ID Generation Rules" derives a node id
    from an archetype node NAME; where a template constrains one ELEMENT's
    `value` to several alternative DV_ types (the RM's `ELEMENT.value: DATA_VALUE`
    slot narrowed to a choice), the alternatives share one ELEMENT and therefore
    one name, so the algorithm's step 7 ("Append a numeric suffix if needed to
    ensure uniqueness among siblings") is the only thing standing between them —
    and it says nothing about which alternative gets which suffix, nor in what
    order the alternatives are enumerated. Two implementations following the
    seven steps literally can assign the same client's data to different
    alternatives, and the specification names no discriminator (the `|other`
    suffix of §"Open Value-Sets" covers only the DV_CODED_TEXT/DV_TEXT case).
  source: >-
    ITS-REST docs/simplified_formats/master04-basic_concepts.adoc §"Instance
    Indexing" (the whole section: the `:i` grammar, "The index is appended after
    the node ID and before the next path separator", and the two indexing
    examples — no bound, no sparse/ordering rule) + §"Node ID Generation Rules"
    (the seven steps, step 7 being "__Uniqueness__: Append a numeric suffix if
    needed to ensure uniqueness among siblings"; the examples table's
    `blood_pressure` / `blood_pressure_1` duplicate pair is the only worked
    instance of step 7, and it is a duplicate NAME case, not a choice case) +
    §"Field Identifiers" (the six components of an identifier; nothing on
    polymorphic alternatives) + §"Open Value-Sets and the `|other` Suffix" (the
    one discriminator the chapter does define, scoped to a DV_CODED_TEXT leaf
    with `listOpen: true`) + master05-rm_mapping.adoc (43 class sections, none of
    which is a choice/alternative mapping) + RM data_structures §ELEMENT
    (`value: DATA_VALUE 0..1` — the polymorphic slot a template narrows) — the
    silences CONFIRMED first-hand.
  handling: >-
    Fixed handling on both; both choices are ours where the text is silent and
    are flagged as such at their definitions. (1) THE PARSER BOUNDS `:i` AT
    65,535 and rejects anything larger as a malformed path
    (`crates/openehr-its/src/flat/path.rs`, `MAX_INSTANCE_INDEX`). No openEHR
    spec governs this — it is our own resource-safety bound, chosen so that the
    limit sits orders of magnitude above any clinically plausible repetition
    while making an unbounded allocation from one short key impossible; a
    rejection is a typed malformed-path error, never a truncation or a silent
    reindex, so nothing is accepted and quietly altered. Sparse and out-of-order
    indices ARE accepted below the bound and preserved: an interior hole stays an
    empty occurrence so FLAT⇄STRUCTURED round-trips keep their numbering
    (AMB-153). (2) CHOICE ALTERNATIVES ARE NAMED FROM THEIR RM TYPE, with a
    positional `value`/`value2`/`value3` alias — again our own design/extension
    (`crates/openehr-its/src/flat/webtemplate/id.rs`). The alternative's own
    identifier is derived from its DV type name through the same seven steps, so
    it is stable, self-describing and independent of enumeration order, which is
    what the specification's silence actually costs a client; the positional
    alias exists only so that a producer written against the ordering convention
    still resolves. Both forms are accepted on input and the type-derived form is
    what a generated Web Template advertises, so a client that reads the Web
    Template — which master02 §"Relationship to Other Specifications" makes the
    source of field identifiers — never has to guess. Gated by
    SF-NODEID-generation_rules and SF-NODEID-web_template_ids (the node-id
    algorithm and the advertised ids) and by SF-INDEX-semantics /
    SF-INDEX-multi_event_commit (the index grammar). Reported upstream (#1602):
    state an instance-index bound (or say explicitly that there is none and what
    a receiver must do), define the sparse/out-of-order case, and give
    polymorphic choice alternatives a named, order-independent identifier rule.
  disposition: fixed_handling
  upstream_issue: 1602

AMB-157:
  ambiguity: >-
    NOT an openEHR ambiguity — a DECLARATION, kept in this register so the
    non-openEHR surface this server serves can never be mistaken for a
    spec-derived one (the AMB-58 treatment, generalized from one operation to
    the whole outward surface). The released ITS-REST text is SILENT on the URI
    space beyond the openEHR resource set: it says what a resource IS and which
    resources the API defines, and it never says whether a service may serve
    anything ELSE at other paths. Both readings a reader could take — "the
    listed resources are the whole permitted surface" and "the listed resources
    are the openEHR part of a possibly larger surface" — are consistent with
    every released sentence, and no released clause permits, forbids, or bounds
    additional routes. This server takes the second reading and serves
    FOURTEEN extension families beside the released groups.
  source: >-
    ITS-REST specifications/docs/overview/Resources.md §Resources ("For the
    openEHR API, a **resource** is an instance object of a specific openEHR
    class (type) that can be identified, addressed, handled or managed by the
    service", followed by the resource-kind list and "For a complete list of
    available types, refer to the class index") — a definition of the openEHR
    resource set, never a constraint on the URI space around it. The overview's
    only "Additional … MAY" sentence is about STATUS CODES, not routes
    (Requests_and_responses.md §HTTP status codes: "Additional status codes MAY
    be used as long as they do not conflict with the predefined codes"). Silence
    CONFIRMED first-hand: a grep of specifications/docs/** for an
    additional/vendor/proprietary/custom endpoint clause returns ZERO hits, and
    the overview chapter set contains no "extension" sentence at all. The
    System API chapter that might have bounded the surface is a STUB
    (docs/system/Description.md — purpose, related documents and status only:
    no endpoint list, no field semantics).
  handling: >-
    Statement-declared, and enumerated rather than described. THE FAMILIES ARE
    NOT LISTED HERE: they live in the `served_extensions` axis of
    vocab/wire_surface.yaml — one entry per family with its routes (the default
    deployment spelling), its configuration gate, and its own verified
    spec-silence line — and the Conformance Statement renders that axis as its
    "Additional non-openEHR surface" section, so an SDoC reader learns the
    surface exists instead of discovering it on the wire. Keeping the
    enumeration in exactly one machine-readable place is the point: a prose copy
    here would rot the first time a family is added, gated differently, or
    removed. THE AXIS NEVER GATES: no coverage obligation is derived from it —
    no case is required, no branch is expected, no verdict depends on it —
    which every entry states as `never_gates: true` and the surface-coverage
    gate's own tests pin. Every family is our own design/extension, no openEHR
    spec governs any of them, and this party's statement claims conformance for
    NONE of them. Consequence for the inward axes, stated so the two readings of
    "off the wire" cannot be confused: an SM operation recorded `off_wire`
    because released ITS-REST surfaces no resource for it stays exactly right
    about the SPEC even when this server serves an extension in that space —
    the nine I_TERMINOLOGY_SERVICE rows carry that cross-reference explicitly.
    WHY THIS DISPOSITION: `report_only` is wrong because there is nothing to
    report — the silence is not a defect in openEHR's text but the ordinary
    condition of anything outside its scope, and the disposition would force an
    `upstream_issue` that could only be invented. `fixed_handling` is wrong
    because no case's expectation rests on this entry; nothing in the catalogue
    changes because of it. `statement_declared` is exactly what it is: a
    behaviour the party declares and no normative case covers. Revisits only if
    a future ITS-REST release states a rule about the URI space beyond the
    resource set.
  disposition: statement_declared

AMB-158:
  ambiguity: >-
    The System-API conformance manifest carries an `endpoints` member and no
    released sentence says what it must contain. The docs text describes the
    manifest's PURPOSE and never its content; the only place `endpoints` is
    defined at all is the OAS schema, which types it `array of string`, gives
    it no description, and shows one example listing the five standardised
    groups. So "which endpoints" — every mounted route family, or the openEHR
    API groups the release names — is undefined, and a service that lists only
    the standardised groups and a service that also lists its extension
    families are both consistent with every released sentence.
  source: >-
    ITS-REST specifications/docs/system/Description.md — the whole System API
    chapter, a STUB carrying only Purpose, Related Documents and Status; it
    contains no endpoint list, no manifest field list and no "endpoints"
    occurrence. Plus docs/overview/Requests_and_responses.md §HTTP Methods
    (OPTIONS: "Describe the communication options for the target resource"),
    the only released sentence about the method's meaning. The `endpoints`
    member itself appears ONLY in the RELEASED OAS
    (specifications/schemas/others/Options.yaml: `endpoints: {type: array,
    items: {type: string}}` with the five-entry example, no description; and
    specifications/operations/options.yaml, "exposing service capabilities for
    a conformance manifest").
    RE-GROUNDED 2026-07-28, verdict unchanged: the 2026-07-27 wording recorded
    that OAS material as "provenance … NOT as an oracle (owner ruling
    2026-07-24: the OAS is stalled and the docs text governs)". Under the
    current order it IS the oracle for this member, the docs text being silent
    — and AMB-160 duly grounds the resource, the Content-Type and the JSON
    manifest body there. It still does not answer THIS question, for the
    reason the order fixes: the OAS is never read for more than it states, and
    what it states about `endpoints` is a TYPE (`array of string`, no
    description, no `required`) plus an `example`. An example is an
    illustration, not a rule, so which endpoints the member must list stays
    undefined on both tiers. Silence CONFIRMED first-hand.
  handling: >-
    Fixed handling, and the shipped decision is stated rather than left
    implicit. The manifest lists the LIVE standardised ITS-REST group set —
    /ehr, /definition, /query, /demographic, plus /admin when that group is
    enabled — and omits every extension family. Two reasons, neither of them
    convenience. (a) THE MEMBER SPEAKS ITS-REST: the one example the release
    offers is exactly the released group set, and the manifest's stated job is
    "exposing service capabilities for a conformance manifest" — a
    CONFORMANCE manifest, whose subject is the openEHR API a client can hold
    the service to. Advertising our own routes in that field would put
    non-openEHR paths inside a conformance claim. (b) THE EXTENSION SURFACE HAS
    ITS OWN DECLARATION LAYERS, all three of them honest and all three richer
    than a bare path list: the served OpenAPI document (every extension
    operation flagged our-own-extension in its own description), the
    `served_extensions` axis of vocab/wire_surface.yaml, and the Conformance
    Statement's "Additional non-openEHR surface" section rendered from it
    (register AMB-157). LIVE, NOT STATIC: the list still tracks what is actually
    mounted — /admin appears only when the admin group is enabled — so the
    manifest never advertises a group that answers 404. This entry gates
    nothing: the manifest behaviour itself is exercised by the SUT's own tests
    and recorded as the `system-options-conformance-manifest` wire-surface
    element (no SM anchor exists for the System API operation; the catalogue
    anchors the case under the reserved I_ITS_REST_SYSTEM pseudo-interface —
    AMB-160 — and that case asserts only the 200 + Allow half, never this
    member). Revisits if a future release defines the member's contents.
  disposition: fixed_handling

AMB-159:
  ambiguity: >-
    The released text DECLARES a query-execution timeout branch and withholds
    every trigger for it, so the branch is real but unreachable by any
    conformance case. The status table's 408 row states the branch and its
    server-side cause — "Request maximum execution time is reached, therefore
    the server aborted the request" — but nothing released says what that
    maximum is, who sets it, or how a client can drive a request past it. The
    whole client-settable query surface is enumerated in one place and contains
    no execution bound: docs/query/Request.md §"Common Headers and Query
    Parameters" opens "All query execution requests SHOULD support at least the
    following parameters" and lists exactly `ehr_id`, `offset`, `fetch` and
    `query_parameters`, plus the one related request header `openehr-ehr-id`.
    So "maximum execution time" is a deployment property of the service, not a
    protocol input — and AQL itself offers no cost knob either, since a query
    expensive enough to time out on one deployment returns in milliseconds on
    another. The consequence is specific and worth stating plainly: a
    conformance case for this branch could only be written by inventing a
    trigger the release withholds (a query chosen to be slow on THIS server, i.e.
    an expectation derived from the SUT rather than the spec — the one thing the
    attribution law forbids), or by fault-injecting the server, which is not a
    wire behaviour at all.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md §"HTTP
    status codes", row `408 Request Timeout` ("Request maximum execution time is
    reached, therefore the server aborted the request") — the sole released
    mention of the branch. Silence CONFIRMED first-hand across the entire
    released QUERY chapter: docs/query/Request.md, Response.md, Query_types.md
    and Qualified_query_name.md contain no occurrence of `408`, "timeout" or any
    execution-time concept (grep-verified), and §"Common Headers and Query
    Parameters" is the complete client-settable surface quoted above.
    docs/query/Qualified_query_name.md, which governs the stored route's extra
    addressing, adds only name and version selection — so the stored and ad-hoc
    routes are in exactly the same position.
  handling: >-
    Report-only, and deliberately UNEXERCISED rather than faked. Both
    `timeout` branches — I_QUERY_SERVICE.execute_ad_hoc_query and
    I_QUERY_SERVICE.execute_stored_query — stay DECLARED on their bindings
    (a server that aborts a run-away query MUST have 408 available to it, and
    the declaration is what makes the classifier recognise it) and stay
    recorded as cited exceptions in vocab/wire_surface.yaml rather than being
    closed by a case. This is the same disposition the register already applies
    to I_ADMIN_SERVICE.physical_ehr_delete#delete_all's `not_found` under
    AMB-140: a declared branch whose trigger the released text withholds is an
    honest boundary, never a silent omission and never an invented case. It
    closes the moment a release supplies a client-drivable execution bound —
    then both branches become ordinary gating cases. Reported upstream
    (#1603).
  disposition: report_only
  upstream_issue: 1603
AMB-160:
  ambiguity: >-
    The System API is STABLE, yet its DOCS TEXT describes no wire at all: the
    chapter is a stub (Purpose, Related Documents, Status), and the only
    docs-text prose about the method is one descriptive row of the overview
    method table, which speaks of "the target resource" in general and names
    no path. Everything a client would code against — the resource, the
    Content-Type, the Options manifest schema (solution, solution_version,
    vendor, restapi_specs_version, conformance_profile, endpoints) — lives
    only in the release's OAS artifact (system.openapi.yaml). Before the
    2026-07-28 ruling the catalogue could therefore assert only 200 + Allow.
  source: >-
    ITS-REST specifications/docs/system/Description.md — the whole System API
    chapter, a STUB carrying only Purpose, Related Documents and Status ("This
    specification is in the `STABLE` state"); it contains no path, no field
    list and no status code. Plus docs/overview/Requests_and_responses.md
    §HTTP Methods, the only docs-text sentence about the method's meaning
    ("| OPTIONS | Describe the communication options for the target resource.
    |"), and §HTTP status codes ("| 200 | OK | …" under "an appropriate HTTP
    status code MUST be used as described above"). The rest of the exchange is
    defined by the released OAS: system.openapi.yaml `paths: /` (options),
    response `200_options` (headers Allow + ContentType_JSON; content
    application/json, schema Options with NO required member). That the OAS is
    citable here at all is the owner ruling 2026-07-28, grounded in the
    release's own words — docs/overview/Specifications.md ("Specifications can
    be downloaded as YAML files in OpenAPI Specification 3.0 format") and each
    API Preface's "can be downloaded as OpenAPI specification file" — the OAS
    files ARE the release's computable artifacts; they ground expectations
    where the docs text is SILENT, and the docs text wins on conflict
    (superseding the 2026-07-24 never-an-oracle absolutism). Confirmed
    first-hand on both sides.
  handling: >-
    Fixed handling under the 2026-07-28 ruling. The binding
    I_ITS_REST_SYSTEM.options grounds the resource (`/`), the
    Content-Type (application/json) and the JSON manifest body in the released
    OAS, alongside the docs-text-grounded 200 + Allow. The Options schema
    declares no required member, so no member presence is asserted — the body
    obligation the release actually states is a JSON document, which the
    case's canonical-json format check parses; requiring members would exceed
    the release. Sibling entry AMB-158 fixes the CONTENT of the endpoints
    member; the upstream ask #1604 stands editorially — a STABLE API's docs
    text should describe its one exchange rather than delegating it entirely
    to the OAS artifact.
  disposition: fixed_handling
  upstream_issue: 1604

AMB-161:
  ambiguity: >-
    A RELEASED ITS-REST operation can have NO service-model anchor. The SM
    defines no System component and no interface owns the System API's
    operation, yet case cores are keyed on SM operations
    (I_<INTERFACE>.<operation>) and the coverage gate enumerates Axis 1 by
    walking the vendored SM class exports. A released wire behaviour the SM
    never models is therefore unnameable AND structurally invisible: not merely
    uncovered, but incapable of being reported as uncovered.
  source: >-
    docs/specs/openehr/SM/docs/UML/classes/ — there is no System interface
    (i_system_log.adoc is the ATNA logging interface, i_status.adoc the
    last-call status probe: last_call_failed / last_call_status), and no class
    export in the directory contains the words "options", "manifest" or
    "conformance" at all — against ITS-REST
    specifications/docs/system/Description.md §Status, which puts the System
    API in the `STABLE` state, and docs/overview/Requests_and_responses.md
    §HTTP Methods, which tabulates the method it is served with. The same
    ITS→SM direction AMB-127 records for the stored-query single-definition
    read ("a released wire behaviour with no service-model anchor to name it
    by"), here in its complete form: not one operation missing from an
    interface, but an entire API with no interface at all. NOT a one-off: the
    ITEM_TAG surface is the second and larger instance — the whole vendored
    docs/specs/openehr/SM/docs/ tree contains ZERO occurrences of "tag"
    (grep-verified: no interface, no class, no attribute), while the released
    ITS-REST defines twenty-three tag operations
    (specifications/operations/{ehr,demographic}_tags_get.yaml, the EHR-side
    {composition,ehr_status}_tags_{get,update,delete}.yaml and the demographic
    {person,agent,group,organisation,role}_tags_{get,update,delete}.yaml) and
    calls the wrapper headers "convenient wrappers around the dedicated
    ITEM_TAG operations" (docs/overview/Requests_and_responses.md
    §openehr-item-tag and openehr-version-item-tag) — released wire, no
    service-model anchor.
  handling: >-
    Fixed handling — a naming convention, pinned and enumerable. Such an
    operation is anchored under a reserved I_ITS_REST_<GROUP> pseudo-interface,
    one per released resource family — the family being the SERVED RESOURCE,
    not the OAS tag (I_ITS_REST_SYSTEM.options;
    I_ITS_REST_ITEM_TAGS.<operationId> for the twenty-three tag routes;
    I_ITS_REST_REVISION_HISTORY.<operationId> for the three revision-history
    reads, the SM declaring no revision-history operation on any interface —
    zero occurrences of "revision_history" across SM/docs, grep-verified, the
    abstract counterpart being the RM's own VERSIONED_OBJECT.revision_history();
    I_ITS_REST_VERSIONED_PARTY.versioned_party_get for the demographic container
    read, whose two EHR-side twins DO have SM anchors while I_PARTY declares no
    container read at all — the last two extended 2026-07-28 when AMB-136 was
    re-adjudicated against this mechanism), whose
    operation name is the RELEASED operationId verbatim so every row traces to
    exactly one specifications/operations/<operationId>.yaml, which is a
    CATALOGUE naming convention and
    NOT a claim that the SM defines the operation — exactly the distinction
    AMB-127 draws when it anchors the version get to list_queries with a
    variant. The convention is not free-form: the pseudo-interface prefix is
    RESERVED and the operations bearing it are pinned in the
    NON_SM_REST_OPERATIONS table (tools/cnf-runner/src/validate.rs), which is
    the ITS-side half of the Axis-1 enumeration domain — the pinned operations
    resolve without an SM class export, are held to the same
    binding-or-cited-exception obligation as an SM operation, and appear as
    their own rows of the coverage report; an unpinned I_ITS_REST_* reference is
    a validator finding, so the prefix can never become a way around SM
    resolution. Revisits per family: when a future SM release models the System
    API, declares a tag interface, adds a revision-history operation, or gives
    the demographic container read an SM home (the #1582 ask), that family's
    anchors become real SM operations and its pinned rows go.
  disposition: fixed_handling

AMB-165:
  ambiguity: >-
    The released sources DECLARE `application/xml` as an admissible request
    representation for the CONTRIBUTION commit and WITHHOLD its shape. The
    commit envelope is not the RM CONTRIBUTION: it carries each new version's
    DATA inline (plus its lifecycle_state / preceding_version_uid /
    commit_audit), whereas the only XML shape rule the release states for a
    request payload is conformance to the published XSDs — and the published
    ITS-XML `CONTRIBUTION` complexType cannot express that envelope. So a
    canonical-XML CONTRIBUTION commit is declared possible and left
    undefinable, and no conformance case can drive it without inventing the
    document.
  source: >-
    THREE-WAY CHECK, both sources read first-hand. (1) DOCS TEXT — the only
    sentence governing an XML request payload is ITS-REST
    docs/overview/Resources.md §"XML Format": "When resources are serialized in
    **canonical XML** format, both request payloads and responses MUST conform
    to the [published XSDs]". The EHR API chapter adds nothing:
    docs/ehr/Description.md is a 25-line stub (Purpose, Related Documents,
    Status) with no occurrence of CONTRIBUTION at all. (2) THE PUBLISHED XSD —
    ITS-XML RM Common.xsd types the resource as `<xs:complexType
    name="CONTRIBUTION"><xs:sequence><xs:element name="uid"
    type="HIER_OBJECT_ID"/><xs:element name="versions" type="OBJECT_REF"
    maxOccurs="unbounded"/><xs:element name="audit"
    type="AUDIT_DETAILS"/></xs:sequence></xs:complexType>`: `versions` are
    REFERENCES to versions that already exist and `uid` is mandatory, so the
    type describes a COMMITTED contribution, never a commit request; the schema
    declares no global element for it either (the globally declared document
    elements are `composition`, `version`, `extract`, `extract_request`,
    `versioned_object`, `items`). (3) THE RELEASED OAS, citable only because
    the docs text is silent on the envelope (owner ruling 2026-07-28) —
    ITS-REST specifications/operations/contribution_create.yaml DECLARES the
    media type twice: it references parameters/header/ContentType_LOCATABLE.yaml,
    whose `enum` contains `application/xml`, and its own description says the
    Simplified MIME types "MAY be set to one of the Simplified Formats MIME
    types … in addition to the canonical `application/json` /
    `application/xml`". Yet its `requestBody.content` has exactly ONE entry,
    `application/json`, bound to schemas/ehr/NewContribution.yaml (uid,
    versions[] of UpdateVersion, audit of UpdateAudit) — shapes with no XSD
    counterpart, and the OAS supplies no XML schema, example or XSD reference
    for the envelope. Declaration without definition, on both sides.
  handling: >-
    Report-only, and deliberately UNEXERCISED rather than invented. The
    canonical-xml format stays DECLARED on the
    I_EHR_CONTRIBUTION.commit_contribution binding (a service that accepts an
    XML envelope is not thereby non-conformant, and the declaration is what
    lets the classifier recognise the exchange) and stays recorded as a cited
    exception in vocab/wire_surface.yaml — the same disposition AMB-140 and
    AMB-159 apply to a branch whose trigger the release withholds. Authoring a
    fixture would mean choosing a root element name, a versions-with-inline-data
    element shape and an UPDATE_AUDIT rendering that NO released source states,
    i.e. writing specification rather than testing it. SCOPE, settled
    2026-07-28: this entry is the COMMIT envelope only. The READ side is a
    different question — the published CONTRIBUTION complexType DOES describe
    a committed contribution, so only the document ROOT NAME is withheld
    there, not the shape — and it is adjudicated in AMB-167 with the rest of
    the declared-but-undefined resource types: offering the read in XML under
    an unstated root and refusing it under the §XML Format 406 MUST are BOTH
    conformant, so the two read cases
    (I_EHR_CONTRIBUTION.get_contribution-xml_not_acceptable,
    -has_contribution-xml_not_acceptable) are option-gated on
    `contribution-xml-unsupported` rather than asserted for every server.
    Nothing about the COMMIT changes: its envelope has no XSD counterpart at
    all, so it stays unexercised. Closes when a release publishes a
    CONTRIBUTION XML document (root element + the commit envelope's XML
    representation) or withdraws `application/xml` from the operations'
    Accept/Content-Type enums. Reported upstream (#1605).
  disposition: report_only
  upstream_issue: 1605

AMB-166:
  ambiguity: >-
    The ITEM_TAG wrapper-header RESPONSE ECHO is assigned two different
    strengths by two released sources. The overview docs text makes it
    optional — "Servers MAY include the `openehr-item-tag` or
    `openehr-version-item-tag` header in responses to confirm the actual list
    of ITEM_TAGs stored on the server side" — while the change-controlled
    write operations that declare the headers state it as fact: "The
    corresponding response header(s) will return ITEM_TAGs as they were set by
    the server". A MAY and a "will" cannot both be the obligation, so a
    catalogue cannot decide from the release alone whether the absence of an
    echo on a write that SET the headers is conformant.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md
    §openehr-item-tag and openehr-version-item-tag, §"Usage in Responses"
    ("Servers MAY include …"; and for reads "When retrieving resources via
    `GET`, the server MAY also add these headers to the response") CONTRASTED
    with specifications/operations/composition_create.yaml L6-7 and
    person_create.yaml L6-7 (and their update siblings), verbatim: "A list of
    ITEM_TAGs can be associated with the … in which case a `openehr-item-tag`
    or `openehr-version-item-tag` request header can be set as well. The
    corresponding response header(s) will return ITEM_TAGs as they were set by
    the server" — CONFIRMED first-hand on both sides.
  handling: >-
    Fixed handling under the oracle order: the DOCS TEXT wins the conflict
    (owner ruling 2026-07-24), so the echo is a MAY and the catalogue declares
    it with the optional matcher (`present?`) on the wrapper-header write
    bindings — never as a presence assertion. The operation-file sentence is an
    OAS-tier source and cannot raise a docs-text MAY to a MUST. What the echo
    would CONFIRM is asserted where it is executable and where the release does
    assign it: the stored effect of the two headers, read back through the
    dedicated tag routes — `openehr-item-tag` "applies to *VERSIONED_OBJECT*
    targets", `openehr-version-item-tag` "applies to a specific target
    *VERSION* within a VERSIONED_OBJECT", so the two collections are disjoint
    and each read returns only its own. The value SHAPE of an echoed header is
    likewise unasserted: the closed header-matcher vocabulary has no
    conditional-value form, so a `present?` declaration cannot also pin a
    pattern. Reported upstream (#1606): align the operation prose with the
    overview, or raise the overview MAY to a conditional MUST for writes that
    set the request header.
  disposition: fixed_handling
  upstream_issue: 1606

AMB-167:
  ambiguity: >-
    Canonical-XML enforceability is assigned PER RESOURCE TYPE by the
    release, and for most REST resources it is assigned neither way. The
    published XSDs declare a global document element for only EIGHT names
    — `composition`, `version`, `items`, `template`, `extract`,
    `extract_request`, `versioned_object`, `archetype` (plus `result_set` /
    `query_request` in the 2.0.0-lineage QUERY schema) — while the released
    ITS-REST offers `application/xml` on nearly every EHR/DEMOGRAPHIC
    resource. For a resource WITH a document element, offering XML is fully
    released behaviour and the §XML Format MUSTs are enforceable as written.
    For a resource WITHOUT one (EHR, EHR_STATUS, FOLDER/directory, the five
    demographic PARTY types + PARTY_RELATIONSHIP, CONTRIBUTION on the read
    side, REVISION_HISTORY, the ITEM_TAG lists) the release DECLARES the
    media type and WITHHOLDS the document: a server MAY offer XML (the
    complexType describes the content; the ROOT ELEMENT NAME is spec-silent)
    or MAY refuse it under the §XML Format 406 MUST. Neither answer is
    non-conformant, so neither may be asserted unconditionally — which is
    exactly what the catalogue did in both directions before this entry: the
    CONTRIBUTION reads asserted refusal unconditionally while the
    EHR/EHR_STATUS/directory/PARTY reads asserted a 200 XML answer
    unconditionally, a line drawn by what one SUT happens to serve rather
    than by the release.
    PER-RESOURCE CLASSIFICATION (verified first-hand against both vendored
    bundles; "documented" = a published global element can carry the served
    payload, "undefined" = complexType only or absent):
    (1) DOCUMENTED — COMPOSITION reads/writes and the OPT example payload
    (`composition`); every VERSION sub-resource read of any container
    (`version`, whose ORIGINAL_VERSION.data is `xs:anyType`, so the payload
    type is unconstrained); the ADL 1.4 OPT (`template`, type
    OPERATIONAL_TEMPLATE) and the ADL 1.4/2 archetype (`archetype`);
    EHR_EXTRACT (`extract` / `extract_request`); any LOCATABLE served under
    the generic abstract root (`items`, type LOCATABLE).
    (2) UNDEFINED, media type declared — the VERSIONED_* container reads
    (RE-ADJUDICATED 2026-08-03, first-hand: this entry classified them
    DOCUMENTED on the `versioned_object` element, contradicting its own
    source paragraph. That element is typed `X_VERSIONED_OBJECT` — the
    EXTRACT-package shape (`crates/openehr-its/schemas/xml/
    its-xml-1.0.2-nsv1/ALL/Extract.xsd` line 8, and the nsv2 twin under every
    `RM/*/documents/Extract.xsd`), whose sequence makes `total_version_count`
    and `extract_version_count` MANDATORY and restricts `versions` to
    `ORIGINAL_VERSION`. The RM `VERSIONED_OBJECT` / `VERSIONED_COMPOSITION` /
    `VERSIONED_EHR_STATUS` / `VERSIONED_FOLDER` / `VERSIONED_PARTY`
    complexTypes are declared in Common.xsd / Ehr.xsd / Demographic.xsd with
    NO global element of their own, and a served VERSIONED_COMPOSITION —
    which carries neither extract count — cannot conform under the
    `versioned_object` element. So the release DECLARES the media type and
    WITHHOLDS the document here exactly as it does for EHR and EHR_STATUS.
    No case floor changes: `get_versioned_composition-xml` already asserts
    only an XML-document entity and says why in its own header, which is the
    class-(2) floor); EHR (Ehr.xsd complexType, NOT
    LOCATABLE-derived, so not even the generic `items` root is available;
    absent entirely from the 1.0.2-nsv1 bundle); EHR_STATUS (LOCATABLE
    subtype, no element; absent from nsv1); FOLDER (LOCATABLE subtype, no
    element; a complexType of that NAME is present in BOTH bundles, but it is
    NOT the same type — nsv1 `ALL/Structure.xsd` declares `folders` + `items`
    alone, while nsv2 `RM/latest/Common.xsd` also declares `details`, the
    RM 1.1.0 addition; AMB-185 registers that delta and the rest of the
    nsv1-vs-RM-1.2.0 sweep); PERSON/ORGANISATION/GROUP/AGENT/ROLE
    and PARTY_RELATIONSHIP (LOCATABLE subtypes, no element; absent from
    nsv1); CONTRIBUTION (complexType, NOT LOCATABLE-derived; absent from
    nsv1); REVISION_HISTORY (complexType, no element — no binding declares
    canonical-xml on the three revision-history reads, so no case is gated);
    ITEM_TAG (no complexType at ALL in either bundle — the RM 1.2.0 class is
    not in the published ITS-XML; the tag bindings declare canonical-json
    only).
    (3) OUT OF THE LATITUDE — RESULT_SET: the 2.0.0-lineage QUERY schema DOES
    declare a `result_set` document element, but the released ITS-REST offers
    JSON only on every query and stored-query operation (Accept_JSON), so no
    XML branch exists on that wire at all; the unconditional 406 cases there
    stand on the media type never being offered, not on a missing document.
  source: >-
    ALL THREE SOURCES READ FIRST-HAND, in the oracle order.
    (1) DOCS TEXT — ITS-REST specifications/docs/overview/Resources.md
    §"Data representation": "Services MUST support at least one of the
    openEHR **XML** or **JSON** canonical formats for resource
    representation" (so offering XML is a SERVICE CHOICE, never an
    obligation), and §"XML Format", whose four sentences govern CONDUCT once
    XML is in play, not the offer: "When resources are serialized in
    **canonical XML** format, both request payloads and responses MUST
    conform to the [published XSDs]"; "If the service cannot process the
    request payload as XML format, it MUST respond with HTTP status code
    `415 Unsupported Media Type`"; "If the service cannot fulfill this
    aspect of the request, it MUST respond with HTTP status code `406 Not
    Acceptable`"; "Proper header `Content-Type: application/xml` MUST be
    present in the response of the service unless the response has no
    content body (HTTP status code `204`)". No released sentence assigns a
    document ROOT NAME to any resource, and none obliges a service to offer
    XML for a resource whose document the schemas do not publish.
    (2) THE PUBLISHED XSDs (the §XML Format link target, ITS-XML) — the
    global `xs:element` inventory of BOTH vendored bundles,
    crates/openehr-its/schemas/xml/its-xml-1.0.2-nsv1/** and
    its-xml-2.0.0-nsv2/**, enumerated exhaustively: nsv1 `ALL/` declares
    `archetype` (Archetype.xsd), `composition` (Composition.xsd), `template`
    (CompositionTemplate.xsd, type TEMPLATE), `template` (Template.xsd, type
    OPERATIONAL_TEMPLATE), `extract_request` + `extract` +
    `versioned_object` (Extract.xsd), `items` (Structure.xsd, type
    LOCATABLE, `abstract="true"`), `version` (Version.xsd, type VERSION,
    `abstract="true"`), plus `archetype` twice under `AOM2/`; nsv2 repeats
    the RM set per RM release (1.0.2/1.0.3/1.0.4/1.1.0/latest
    `documents/`), the AM/OET template + archetype elements, and ADDS
    `result_set` + `query_request` (QUERY/latest/Query.xsd) which nsv1 has
    no schema for at all. BUNDLE DELTA, also first-hand: the STABLE nsv1
    bundle has no Ehr.xsd and no Demographic.xsd — EHR, EHR_STATUS,
    CONTRIBUTION and the demographic PARTY types have no complexType there
    either, only FOLDER (Structure.xsd) exists. Type facts that decide the
    classification: nsv2 RM/latest Ehr.xsd `EHR` extends nothing, while
    `EHR_STATUS`, `FOLDER`, `PARTY`/`ACTOR`/`PERSON`/`ORGANISATION`/`GROUP`/
    `AGENT`/`ROLE` and `PARTY_RELATIONSHIP` all derive from `LOCATABLE`
    (Common.xsd / Demographic.xsd), `CONTRIBUTION` (Common.xsd) does not;
    `ORIGINAL_VERSION.data` is `xs:anyType`; the `versioned_object` element
    is typed X_VERSIONED_OBJECT (EhrExtract.xsd — the EXTRACT-package shape,
    with mandatory `total_version_count` + `extract_version_count` and
    ORIGINAL_VERSION-restricted `versions`), NOT the RM `VERSIONED_OBJECT`
    complexType, which has no element of its own; no XSD in either bundle
    mentions ITEM_TAG. CORRECTED 2026-08-02: this entry's per-resource
    classification asked only WHETHER a complexType exists in each bundle, and
    for FOLDER that answer ("present in BOTH") concealed that the two
    complexTypes DIFFER — a same-name-different-type case the sweep in AMB-185
    generalises to 23 attribute divergences and 50 wholly-absent classes.
    (3) THE RELEASED OAS, citable only where the docs text is silent (owner
    ruling 2026-07-28) and cited AS the OAS — the per-operation declaration
    of the media type:
    specifications/parameters/header/Accept_LOCATABLE.yaml and
    Accept_canonical.yaml both `enum` `application/xml` (referenced by
    ehr_get_by_id, ehr_status_get_at_time, directory_get_at_time,
    person_get, contribution_get, versioned_*_get, … ), while
    Accept_JSON.yaml enumerates `application/json` alone and is what every
    query_*, definition_query_* and options operation references.
  handling: >-
    Two-armed, per resource FAMILY, selected by the ICS — the AMB-39
    precedent. For each declared-but-undefined family the catalogue carries
    BOTH branches and the statement's `options` declaration says which one
    the party is judged on: `<family>-xml-supported` gates the ok-XML rows
    (the existing `-xml` cases, which assert only the released conduct — the
    negotiated `Content-Type` and an XML document entity — never a root
    name), `<family>-xml-unsupported` gates the mirror
    `-xml_not_acceptable` row (the §XML Format 406 MUST, the release's own
    designated answer for an Accept it cannot fulfil). The undeclared
    sibling is not-applicable, never a failure. Families: `ehr`,
    `ehr-status`, `directory`, `party` (one seam for all five PARTY types —
    the demographic routes share one binding family and one document
    question), `contribution` (the READ side; the ok arm has no authored
    case yet, the AMB-61 `legacy-alt-formats-supported` pattern — a declared
    branch a party can select itself out of, with nothing spec-grounded to
    assert about the positive exchange; AMB-4's `adl14-duplicate-replace`
    used to be the reference instance of that pattern and was withdrawn on
    2026-07-28 when the released OAS turned out to define its behaviour). The DOCUMENTED
    classification answers WHICH document an offered XML response must
    conform to (a published global element exists); it CANNOT answer WHETHER
    XML must be offered on a resource — §Data representation's "at least one
    of" makes offering a SERVICE CHOICE there too (corrected 2026-07-28,
    posture-run finding 4: the versioned-party container read's 406 is the
    release's own designated answer on a JSON-only resource, not a
    violation). DOCUMENTED rows on families whose XML offering the release
    itself exercises on this SUT stay unconditional; a DOCUMENTED resource
    whose offering the ICS does not declare takes the same two-armed option
    gate as the undefined families (the ok-XML case on `-supported`, the
    §XML Format 406 MUST exercised on `-unsupported` — coverage either way,
    never a bare tolerance). First instance:
    `versioned-party-xml-supported`/`-unsupported`, a separate offering from
    the bare-PARTY family (the five person/agent/... routes serve XML on
    this SUT while the container read does not — per-resource asymmetry is
    exactly what per-family arms exist for). ROOT ELEMENT NAME where a family IS offered: no openEHR spec
    governs it — our own design/extension — so no case asserts one; the
    body floor stays "an XML document entity" and the RM-level assertions
    that read the canonical-JSON `_type` self-tag are deliberately absent.
    THE WRITE SIDE IS NOT SYMMETRIC — RE-ADJUDICATED 2026-07-29. The
    two-armed handling above was authored for READS and silently collected
    the WRITE rows of the same families under the same `-supported` tags.
    That was wrong, and the paragraph above says why in its own words: a
    read row can decline to assert a root name because the SERVER chooses
    the document, and the released conduct (the negotiated `Content-Type`,
    an XML document entity) survives that silence intact. A WRITE row has
    no such half: the CLIENT must choose the request document, so the row
    necessarily requires the service to accept ONE root name — the very
    thing this entry says no released sentence assigns. Worse, the choice
    it made was refuted by the release's own first §XML Format sentence:
    "When resources are serialized in **canonical XML** format, both
    request payloads and responses MUST conform to the [published XSDs]".
    The nine write rows sent `<ehr_status>`, `<folder>` and `<person>`
    documents in `http://schemas.openehr.org/v1` — names NEITHER vendored
    bundle declares as a global element, and for EHR_STATUS and PERSON the
    STABLE 1.0.2-nsv1 bundle carries no complexType at all (it ships no
    Ehr.xsd and no Demographic.xsd), so no conforming canonical-XML
    document of those resources exists in the lineage the schema
    repository still presents as stable. Those roots came from our OWN
    codec (the fixtures are `canonical_convert.rs` output), which is
    exactly the "line drawn by what one SUT happens to serve" this entry
    was opened to remove. A positive write row therefore fails a service
    that implements the §XML Format MUST by validating request payloads
    against the published XSDs — a conformant answer marked
    non-conformant. So: no `<family>-xml-supported` row may carry a
    canonical-XML REQUEST payload for a family in class (2), and the nine
    rows are re-grounded onto the half that IS released — the refusal.
    §XML Format's second sentence, "If the service cannot process the
    request payload as XML format, it MUST respond with HTTP status code
    `415 Unsupported Media Type`", binds a party that declares
    `<family>-xml-unsupported`, and it fires on the MEDIA TYPE before any
    document is parsed, so the payload's root name — the thing the
    release withholds — is not part of what the row asserts. The rows
    keep their codec-derived fixtures for exactly that reason: choosing
    the generic `items`+`xsi:type` spelling instead would be the
    catalogue endorsing a wire form for these resources, which is the
    invention this entry forbids. Affected rows, all now
    `<family>-xml-unsupported` + `unsupported_media`:
    I_EHR_SERVICE.create_ehr-xml (whose payload is an EHR_STATUS, so it is
    the EHR_STATUS document question wearing the EHR family's tag),
    I_EHR_DIRECTORY.{create,update}_directory-xml,
    I_EHR_STATUS.{set,clear}_ehr_{queryable,modifiable}-xml_body,
    I_DEMOGRAPHIC_SERVICE.create_party-xml and
    I_DEMOGRAPHIC_SERVICE.update_party-xml (SM `I_PARTY.update_party`).
    The `-supported` tags are unaffected as ICS declarations: every one of
    them still gates READ rows, which is all this entry ever grounded.
    DOCUMENTED families are untouched — COMPOSITION writes keep their
    `<composition>` payload because Composition.xsd declares that global
    element in BOTH bundles, so the request payload conforms as the MUST
    requires. Note also, first-hand, that the released OAS is not the
    source of the write-side problem: `ehr_create`, `ehr_create_with_id`,
    `ehr_status_update`, `directory_create`, `directory_update`,
    `person_create` and `person_update` all `$ref`
    `parameters/header/ContentType_LOCATABLE.yaml`, whose `enum` contains
    `application/xml`, even though each `requestBody.content` map carries
    `application/json` alone — the media type IS declared for the request,
    and it is the DOCUMENT that is withheld, exactly as on the read side.
    CONTRIBUTION: the READ half of AMB-165 re-grounds here — refusal is one
    conformant answer, not the only one, so
    I_EHR_CONTRIBUTION.get_contribution-xml_not_acceptable and
    -has_contribution-xml_not_acceptable carry `contribution-xml-unsupported`
    instead of asserting the 406 for every server; the COMMIT envelope stays
    AMB-165 report_only and unexercised (its shape, not merely its root
    name, is withheld). ICS-COMPLETENESS CAVEAT: the verdict pipeline's
    option_select review is satisfied by ANY one declared option of an
    entry, so this entry's ten tags are checked as a set, not per family; a
    statement that declares no arm for a family silently deselects both of
    its rows rather than being flagged. Reported upstream (#1607):
    reconcile the XSD document-element inventory with the REST resource
    surface — publish a document element (or an explicit root-name rule) for
    every resource whose Accept/Content-Type enums offer `application/xml`,
    or withdraw the media type from the operations whose document the
    schemas do not define.
  disposition: option_select
  options:
    - ehr-xml-supported
    - ehr-xml-unsupported
    - ehr-status-xml-supported
    - ehr-status-xml-unsupported
    - directory-xml-supported
    - directory-xml-unsupported
    - party-xml-supported
    - party-xml-unsupported
    - versioned-party-xml-supported
    - versioned-party-xml-unsupported
    - contribution-xml-supported
    - contribution-xml-unsupported
  upstream_issue: 1607
AMB-169:
  ambiguity: >-
    NOT an openEHR ambiguity in the operative sense — a DECLARATION of an
    implementation-defined choice the released text leaves entirely open (the
    AMB-157 treatment, applied to a media-type parameter instead of a route
    space). openEHR publishes canonical XML in TWO wire lineages that differ
    only by the namespace a document declares — `http://schemas.openehr.org/v1`
    (Release-1.0.2, which the schema repository still presents as the STABLE
    release) and `http://schemas.openehr.org/v2` (Release-2.0.0, marked TRIAL
    upstream). Released ITS-REST names neither: §XML Format requires
    conformance to "the [published XSDs]" as a set, gives one media type
    (`application/xml`) for all of it, and says nothing about which lineage a
    response carries or how a client could ask for the other. So a service
    serving only v1, a service serving only v2, and a service letting the
    client choose are all consistent with every released sentence. This
    ambiguity is therefore about the SERVED LINEAGE and, for a service that
    lets the client choose, about the SELECTION MECHANISM — which no released
    text supplies either.
  source: >-
    ITS-REST specifications/docs/overview/Resources.md §"XML Format" ("When
    resources are serialized in **canonical XML** format, both request payloads
    and responses MUST conform to the [published XSDs]"; "A client MAY use the
    header `Content-Type: application/xml` in the requests to specify the XML
    payload format"; "The client SHOULD use the `Accept: application/xml`
    request header to specify the expected XML response format") + §"Data
    representation" ("Services MUST support at least one of the openEHR **XML**
    or **JSON** canonical formats") — neither section names a NAMESPACE and
    neither names any media-type parameter; a grep of specifications/docs/**
    for `schemas.openehr.org` or a media-type-parameter clause returns ZERO
    hits. CORRECTED 2026-08-02 — the earlier wording also claimed neither
    section names "a schema release", and that is wrong on its face: the
    §"XML Format" phrase "[published XSDs]" is a MARKDOWN LINK whose target is
    `https://specifications.openehr.org/releases/ITS-XML/latest`, i.e. the
    release IS named, as `latest`. That resolves to the newest published
    ITS-XML release — presently the 2.0.0 lineage, whose namespace is
    `http://schemas.openehr.org/v2` — while the same repository's README
    directs stable consumers to `Release-1.0.2` and marks 2.0.0 TRIAL. So the
    released text does not merely omit the lineage: its own link points one
    way while the schema repository's own release guidance points the other,
    which is why the SERVED-lineage choice remains implementation-defined
    rather than simply undocumented. The two lineages and their
    status come from the ITS-XML component itself (README.adoc §"Releases and
    IM Versions": "NOTE: These schemas are in *TRIAL* state and subject to
    change. An older *STABLE* release of openEHR XML schema can be still found
    at …Release-1.0.2"; "Simultaneously, the internal namespace used in the
    schemas is also changed to `http://schemas.openehr.org/v2`"). Silence
    CONFIRMED first-hand on both components.
  handling: >-
    Sibling option tags; the ICS options declaration selects which applies —
    the declared behaviour MUST pass, the undeclared sibling is
    not-applicable, and a party that serves one fixed lineage is never judged
    by the other branch. `xml-namespace-fixed` is the no-selection branch: the
    service emits one lineage for every XML response and offers no way to ask
    for the other; nothing released assigns which lineage that must be, so
    there is nothing further to assert and the branch carries no case (the tag
    exists so such a party declares itself OUT of the negotiated branch rather
    than failing it). `xml-namespace-negotiated` is the branch with an
    executable case: the service reads a `version` media-type parameter on the
    XML type (`application/xml; version=1|2`), serves the named lineage, and
    defaults a parameter-less request to v2 — the only published lineage whose
    schemas model the RM 1.2.0 the server emits (owner ruling 2026-08-03 on
    tracker issue #1666, superseding the earlier v1 default; the content delta
    that forced the flip is AMB-185). THE
    PARAMETER IS NOT SPEC-DERIVED — it is the declaring party's own
    design/extension, and this register entry exists precisely so it can never
    be mistaken for a released mechanism; the case
    I_EHR_COMPOSITION.get_composition_latest-xml_namespace_v2 asserts only that
    the requested lineage is what comes back, on the declared branch, under
    profile OPTIONS, so no CORE or STANDARD verdict rests on it. What IS
    released and therefore NOT part of this entry: the refusal shapes a service
    owes once it cannot serve what was asked — an unfulfillable `Accept` is 406
    and an unprocessable XML payload is 415 (§XML Format, both MUSTs) — which
    apply to an unrecognized parameter value exactly as to any other
    unsatisfiable request, and which the catalogue asserts through the ordinary
    negotiation cases. Revisits if a future ITS-REST release names a lineage,
    or defines a selection mechanism of its own.
  disposition: option_select
  options: [xml-namespace-negotiated, xml-namespace-fixed]

AMB-170:
  ambiguity: >-
    NOT an openEHR ambiguity — a DECLARATION, in the AMB-157 style, so the
    measured workload's capability coverage can never be mistaken for a
    spec-derived obligation. No released openEHR component says anything about
    a MEASURED workload at all: it does not define one, does not say which
    capabilities a load simulation must touch, and does not say what follows
    when a claimed capability is never exercised under load. The whole
    measured-performance instrument — the hospital simulation, its journeys,
    its arrival shapes, the volumetric classes it earns — is our own
    design/extension, and so is the decision that a particular claimed
    capability sits outside it. Exactly two kinds of capability sit outside a
    sustained open-loop measurement, and both reasons are ours, not
    openEHR's: (1) DESTRUCTIVE MID-MEASUREMENT — the arrival would erase part
    of the population-anchored corpus the measured window is bound to, so the
    class the run earns would no longer describe the declared volume
    (physical deletion, and the released two-operation ADMIN API that IS that
    erase pair); (2) NO REQUEST TO SEND — the capability has neither a
    released ITS-REST wire nor a served extension route, so a black-box load
    instrument has nothing to drive at all (the same nine capabilities whose
    `evidence_exception` records the identical absence; both lapse together
    the day the product serves the routes). "Not reached yet" is NOT a
    legitimate third kind and no longer appears: every other claimed
    capability is exercised by the simulation. Both surviving kinds are
    DECISIONS and must read as decisions.
  source: >-
    CNF guide master03-overview.adoc §Product Scope — the assessment table
    enumerates exactly what conformance covers for a Platform Component: "API
    conformance" ("Conformance of the _implemented APIs_ to the published
    APIs, in a concrete API technology") and "Data Validation conformance"
    ("Conformance of platform's _validation of data against semantic models_
    (archetypes etc)"). There is no throughput, latency, volumetric or
    load-simulation category, and no released component supplies one: silence
    CONFIRMED first-hand across the vendored CNF guide, profiles book and
    platform test schedule, and across the ITS-REST docs text (which governs
    the wire, never the offered load).
  handling: >-
    Statement-declared, and ENUMERATED rather than described. THE EXCLUDED
    CAPABILITIES ARE NOT LISTED HERE: each carries its own
    `workload_exclusion: { register: AMB-170, reason: … }` block on its
    vocab/capability_matrix.yaml row, and the certificate's Workload Coverage
    table renders that reason in place of the bare gap. Keeping the
    enumeration in exactly one machine-readable place is the point — a prose
    copy here would rot the first time a journey lands. THE ENTRY NEVER
    EXCUSES A VERDICT: a workload exclusion says only that the LOAD instrument
    does not touch the capability; the functional catalogue still owes it
    verdict-bearing cases at its `min_cases` floor, and the `claim-completeness`
    and `capability-depth` gates enforce that independently. A claimed
    capability that is neither exercised by the simulation nor carrying one of
    these blocks is a `workload-coverage` finding, so the published
    certificate can never again carry an undecided row.
  disposition: statement_declared

AMB-171:
  ambiguity: >-
    Whether the basic/extended FORM of an ISO 8601 timezone designator must
    match the form of the date/time it is appended to is described two ways
    in the released BASE text, so an extended date/time carrying a compact
    offset (`2019-04-16T21:08:11,380+0000`) has no single reading. Reading
    A, the one `DV_DATE_TIME.Value_valid` actually names: the function
    `valid_iso8601_date_time` lists exactly two complete forms, extended
    `YYYY-MM-DDThh:mm:ss[(,|.)s+][Z|±hh[:mm]]` and compact
    `YYYYMMDDThhmmss[(,|.)s+][Z|±hh[mm]]`, pairing each base with its own
    offset spelling — a mixed string matches neither. Reading B: the sibling
    `valid_iso8601_time` states the offset as a SEPARATE trailing clause
    ("with an additional optional timezone indicator of: `Z` or `±hh[:mm]`
    (extended) `±hh[mm]` (compact)"), and `Iso8601_timezone` — the type
    `Iso8601_date_time.timezone()` returns — gives its own format as
    `Z | ±hh[mm]` while declaring `is_extended()` ("True if this time-zone
    uses ':' separators"), i.e. extendedness is a property of the offset
    alone. NOT AT ISSUE, and explicitly settled by the same text: the COMMA
    decimal sign is legal. `Iso8601_date_time` states the value form as
    `YYYY-MM-DDThh:mm:ss[(,|.)sss][Z | ±hh[:mm]]` and declares
    `is_decimal_sign_comma()` ("True if this time has a decimal part
    indicated by `','` (comma) rather than `'.'` (period)"), and
    `valid_iso8601_time` spells the fraction out as "an optional string
    consisting of a comma or decimal point followed by numeric string of 1
    or more digits". A server refusing a body DV_DATE_TIME for its comma
    alone therefore breaches released text, and no case may treat the comma
    as optional behaviour.
  source: >-
    RM data_types dv_date_time.adoc §Invariants (`Value_valid:
    valid_iso8601_date_time (value)`) + BASE foundation_types
    time_definitions.adoc §valid_iso8601_date_time and §valid_iso8601_time +
    BASE foundation_types iso8601_date_time.adoc §Description and
    §is_decimal_sign_comma + BASE foundation_types iso8601_timezone.adoc
    §Description and §is_extended + ITS-REST
    specifications/docs/overview/Resources.md §Datetime format (the extended
    format is a MUST only for "HTTP query parameters and path segments";
    a body value "will be preserved as it was sent by the client, and passed
    to the underlying backend engine as is") — all CONFIRMED first-hand.
    The ITS-JSON schema adds nothing: `openehr_rm_1.1.0_all.json`
    `definitions.DV_DATE_TIME.properties.value` is a bare
    `{"type": "string"}` with no pattern.
  handling: >-
    The catalogue depends on NEITHER reading: every corpus DV_DATE_TIME uses
    a form both admit — an extended base with `Z` or an extended `±hh:mm`
    offset — so no case gates on the mixed representation. The seven
    Robot-derived COMPOSITION fixtures that carried `+0000` on an extended
    base were normalized to `+00:00` on 2026-07-29 (their MANIFEST
    provenance records it); their comma fractions were kept, being legal
    under the settled half above. Reported upstream (#1608): give the
    offset form one voice.
  disposition: editorial
  upstream_issue: 1608

AMB-172:
  ambiguity: >-
    What a service does with a committed value whose archetype CONSTRAINT
    BINDING cannot be RESOLVED at all — the terminology query server is
    unreachable, answers an error, or does not know the bound value set. Two
    behaviours are consistent with every released sentence: accept the
    composition (the resolution failure is an operational fault of a service
    the CDR does not own) or refuse it (an unverifiable constrained value is
    not demonstrably conformant). Note what is NOT ambiguous and is therefore
    gating in this catalogue: a binding that RESOLVES and answers "not a
    member" is a real constraint violation, because the bound query's result
    IS the permitted value set. Only the unresolvable case is undecided.
  source: >-
    BASE docs/architecture_overview/master12-terminology.adoc §"Binding
    Terminology Value-sets to Archetypes" — the ac code "is bound to queries to
    one or more external terminologies, whose result would be a (possibly
    structured) value set from that terminology", and "Currently there is no
    standard for such queries. This does not affect archetypes directly, since
    they simply hold an identifier for a query; the query itself is defined
    within a 'terminology query server'." The text places the resolver outside
    the archetype and outside openEHR's own specification, and never states an
    outcome for a query that cannot be answered. Confirmed first-hand in the
    two other places the question could have been settled: AM docs/AOM2/
    master08-validation.adoc §Phase 2 lists the terminology-binding checks
    (VTTBK, VTCBK, VETDF) as ARCHETYPE-validation rules over the binding's own
    well-formedness, saying nothing about instance data or about server
    availability; and AM docs/AOM1.4/master04-constraint_model_package.adoc
    §Reference Objects defines CONSTRAINT_REF as "a proxy for a set of
    constraints … expressed in the binding of the constraint reference (e.g.
    'ac0004') to a query … into an external service", again with no failure
    semantics. ITS-REST adds nothing: no released operation surfaces a
    terminology resource at all (the nine I_TERMINOLOGY_SERVICE off_wire rows
    of vocab/wire_surface.yaml), so the wire cannot even express the question.
  handling: >-
    A DEPLOYMENT fact, declared and then tested in both directions — never a
    private resolution and never a runner guess. A running server realizes
    exactly ONE branch (it is one switch), so the party declares which one on
    the addressed instance's ixit `terminology.posture`
    (fail_open | fail_closed), the two sibling cases state the branch they rest
    on in `requires.terminology.posture`, and a case whose branch the addressed
    deployment does not realize is not-applicable with that citation at
    SELECTION time. A party that claims BOTH branches runs both deployments and
    both cases execute in the ONE record — the identical treatment RM common
    master06 §Digital Signature's two signing modes get. The unresolvable
    condition itself is DECLARED, not manufactured: the ixit marks a terminology
    server `reachable: false` and it stays wired to an address nothing answers
    on for the whole run, so no case ever reconfigures or stops a service
    mid-run to produce the branch it tests. WHY THIS DISPOSITION: the handling
    IS encoded in the cases (fixed_handling) — a spec-silent branch that the
    catalogue nevertheless drives, gates and reports on both sides, rather than
    a verdict suspension (report_only) or a claim no case covers
    (statement_declared).
  disposition: fixed_handling
AMB-173:
  ambiguity: >-
    INTER-COMPONENT CONFLICT over what an AQL archetype predicate MATCHES.
    QUERY docs/AQL/master03-syntax.adoc §Archetype predicate presents the
    predicate as "a shortcut of a standard predicate" and equates
    `[openEHR-EHR-COMPOSITION.encounter.v1]` to the WHERE-form
    `c/archetype_node_id = 'openEHR-EHR-COMPOSITION.encounter.v1'` — read
    literally, plain string equality on the root node id. BASE
    docs/architecture_overview/master10-archetypes.adoc §Design-time
    Relationships between Archetypes states the opposite behavioural
    guarantee in normative language: "the data created with any specialised
    archetype will always be matched by queries based on the parent
    archetype - in other words, a query for 'laboratory' Observations will
    correctly retrieve 'glucose' Observations as well", grounding it in
    subsumption; AM docs/AOM1.4 master07 (§Querying / §Supporting
    Archetype-based Querying) derives the same matching set for
    archetype-based queries (the named archetype, its specialisation
    lineage, bounded by the interface-reference major). Data created with
    `openEHR-EHR-COMPOSITION.report-result.v1` carries that specialised id
    as its root `archetype_node_id`, so the two readings give different
    answers to a query naming `openEHR-EHR-COMPOSITION.report.v1`: equality
    returns nothing, subsumption returns the row.
  source: >-
    QUERY docs/AQL/master03-syntax.adoc §Archetype predicate (the equality
    shortcut equivalence); BASE
    docs/architecture_overview/master10-archetypes.adoc §Design-time
    Relationships between Archetypes (parent-archetype queries retrieve
    specialisation-child data); AM docs/AOM1.4/master07 §Querying /
    §Supporting Archetype-based Querying (the archetype-based matching set).
  handling: >-
    The subsumption reading is normative for a full archetype-HRID
    predicate: a predicate naming archetype X matches data whose root
    archetype_node_id is X or any specialisation descendant of X (the
    `-`-extended domain_concept lineage of ADL 1.4-form ids), scoped to the
    same qualified RM entity and major version; a predicate value that is
    not a full archetype HRID (an at/id-code or arbitrary string) stays
    plain equality, exactly as QUERY master03 §Node predicate defines.
    WHY: the QUERY sentence is an illustration of the predicate's
    desugaring, while BASE master10 states the retrieval guarantee as the
    purpose of the specialisation rule itself ("will always be matched") and
    AM master07 defines the matching set — under the released-component
    order a literal-shortcut reading would nullify the behavioural guarantee
    two components state, so the guarantee wins.
    I_QUERY_SERVICE.execute_ad_hoc_query-archetype_subsumption pins all
    three boundary points (exact child id matches; parent id matches child
    data; an unrelated archetype id does not match).
  disposition: fixed_handling
AMB-174:
  ambiguity: >-
    The deprecated `TOP n BACKWARD` selection has no determinable result set.
    QUERY docs/AQL/master03-syntax.adoc §TOP keeps the modifier in the
    language — the published grammar (master07-grammar, `top : TOP INTEGER
    direction=(FORWARD|BACKWARD)?`) still admits it, and the section marks it
    deprecated rather than removed ("The `TOP` will be removed in a future
    major release of AQL specification") — but says only that it "uses
    `BACKWARD` and `FORWARD` to indicate the direction where to start to get
    the number of results to be returned". Nothing fixes what BACKWARD starts
    FROM: the same chapter's §ORDER BY states that without an ORDER BY clause
    "the query result doesn't have any default ordering criteria defined by
    this specification. Ordering could be defined by each implementation or be
    random. In terms of compliance to this specification, default ordering in
    results is undefined" — so there is no defined last row to count back
    from; and where an ORDER BY IS present, §TOP never says whether BACKWARD
    reverses the returned ROW ORDER or only shifts which n rows are taken.
    Two conformant servers can therefore return different sets, and a third
    can refuse the construct: no clause requires acceptance, and none requires
    rejection.
  source: >-
    QUERY docs/AQL/master03-syntax.adoc §TOP (deprecated; the direction is
    described only as "where to start") + §ORDER BY (default ordering
    "undefined") + docs/AQL/master07-grammar §grammar (`top` still admits the
    direction) + released ITS-REST query Response.md (400 defined for an
    invalid query, not for an under-defined one) — silence CONFIRMED
    first-hand.
  handling: >-
    The TOP-BACKWARD case carries this entry and is report_only: the outcome
    is reported per SUT and never gates profile computation, until upstream
    either defines the selection or removes the modifier. The DEFINED part of
    §TOP is unaffected and stays gating — plain `TOP n` (and the explicit
    `FORWARD` default) keeps its own cases. SPECQUERY candidate.
  disposition: report_only
  upstream_issue: 1609
AMB-175:
  ambiguity: >-
    SPEC SILENCE on the version SCOPE a VERSION standard predicate filters
    within. The released grammar (QUERY master07 / AqlParser.g4
    `versionPredicate: LATEST_VERSION | ALL_VERSIONS | standardPredicate`)
    admits a standard predicate over version metadata as the third
    alternative of the version class expression, and QUERY master03
    §Predicates/§Class expressions shows the form — but no released text
    says whether such a predicate selects from ALL versions of the
    container or filters only the LATEST: `[commit_audit/change_type/
    defining_code/code_string='249']` over a created-then-amended object
    answers 1 under the former reading and 0 under the latter. (#970)
  source: >-
    QUERY docs/AQL/master07-grammar.adoc §grammar (versionPredicate,
    quoted from the released AqlParser.g4); QUERY
    docs/AQL/master03-syntax.adoc §Predicates/Standard predicate, §Class
    expressions; RM common master06-change_control_package.adoc
    §Versioned Object (the version-set model the predicate ranges over).
  handling: >-
    The predicate selects from the container's WHOLE version set. WHY:
    the grammar places the three forms as PEER alternatives of
    `versionPredicate` — LATEST_VERSION is the explicit way to address
    currency, and a standard predicate that implicitly filtered only the
    latest version would be redundant with `LATEST_VERSION` plus a WHERE
    clause, collapsing two grammar alternatives into one; the peer
    position is only meaningful if the predicate is its own selection
    over the version set (the same set ALL_VERSIONS names). The one
    metadata field with richer defined semantics is `time_committed`,
    which realizes version-at-time (the trunk version whose validity
    contains the instant — RM common master06). The case
    I_QUERY_SERVICE.execute_ad_hoc_query-version_metadata_predicate pins
    the whole-set reading (created-then-amended: the creation predicate
    answers exactly the first version).
  disposition: fixed_handling
AMB-176:
  ambiguity: >-
    The released RM PRESCRIBES A WIRE VALUE ON AN ATTRIBUTE ITS OWN CLASS MODEL
    DOES NOT DEFINE. RM common master03-archetyped_package.adoc §Structural
    Correspondence tells a converter how to mark a node it had to invent:
    "To indicate synthesis of a data node, a `FEEDER_AUDIT` instance is
    attached to the `LOCATABLE` in question, and its `_change_type_` set to
    'synthesised'." The same chapter's §Meta-data lists "type of change, e.g.
    initial creation, correction ..., logical deletion" among the medico-legal
    meta-data the feeder-audit model is designed to carry. But RM 1.2.0's
    class model defines NO `change_type` anywhere on the feeder-audit types:
    FEEDER_AUDIT has exactly five attributes
    (`originating_system_item_ids`, `feeder_system_item_ids`,
    `original_content`, `originating_system_audit`, `feeder_system_audit`) and
    FEEDER_AUDIT_DETAILS exactly seven (`system_id`, `location`, `subject`,
    `provider`, `time`, `version_id`, `other_details`) — verified attribute by
    attribute in the two class tables. The only `change_type` in RM common is
    `AUDIT_DETAILS.change_type`, which lives on the VERSION commit audit and
    is unreachable from a LOCATABLE's `feeder_audit`. So the sentence names an
    attribute that does not exist on the object it names, and there is no
    released way to express the synthesised marking the chapter mandates.
    A second, smaller mismatch rides along: the prose spells the value
    "synthesised" while the openEHR terminology group the only real
    `change_type` is bound to spells the concept `252|synthesis|` — so even
    reading the sentence as AUDIT_DETAILS.change_type does not yield a legal
    rubric.
  source: >-
    RM common docs/common/master03-archetyped_package.adoc §Structural
    Correspondence (the "change_type set to 'synthesised'" sentence) and
    §Meta-data ("type of change ..."); RM common
    docs/UML/classes/org.openehr.rm.common.feeder_audit.adoc §Attributes (the
    five-attribute list, no change_type) and
    docs/UML/classes/org.openehr.rm.common.feeder_audit_details.adoc
    §Attributes (the seven-attribute list, no change_type); RM common
    docs/UML/classes/org.openehr.rm.common.audit_details.adoc §Attributes
    (`change_type: DV_CODED_TEXT`) + §Invariants (`Change_type_valid`, bound to
    the openEHR `audit change type` group); TERM
    docs/SupportTerminology/codesets/openehr_terminology-vocabularies.adoc
    §Audit Change Type (`| *252* a| synthesis | active`) and
    docs/SupportTerminology/master04-representation.adoc
    (`<group openehr_id="audit_change_type" …>` / `<concept id="252"
    rubric="synthesis"/>`) — contradiction CONFIRMED first-hand.
  handling: >-
    Report-only, no gate. The generated RM types mirror the vendored BMM
    faithfully, so `FEEDER_AUDIT` has no `change_type` member to populate or
    validate, and inventing one would fork the spec model — exactly what the
    generated layer exists to prevent. The canonical-JSON reader ignores
    unknown keys by design (an RM-version-skew tolerance), so a client that
    follows §Structural Correspondence literally and sends
    `feeder_audit.change_type` has that member silently dropped: it is not
    refused, but it is not stored or served either, and no released sentence
    makes either outcome wrong. No case can gate a behaviour with no
    released model behind it; the feeder-audit round-trip cases therefore
    exercise only the five modelled FEEDER_AUDIT attributes. Recording the
    contradiction upstream is the only sound action — flips to a gating
    expectation only if a future RM release adds the attribute (or reworks
    the sentence onto an existing mechanism).
  disposition: report_only
  upstream_issue: 1610
AMB-177:
  ambiguity: >-
    A RELEASED RM INVARIANT RESTS ON A FUNCTION THE SAME CHAPTER LEAVES
    UNDEFINED. RM common
    docs/UML/classes/org.openehr.rm.common.locatable.adoc §Invariants states
    `Archetyped_valid: is_archetype_root xor archetype_details = Void`. Its
    left operand, `is_archetype_root ()`, is declared one section earlier
    under §Functions with a Meaning sentence and nothing else — "True if this
    node is the root of an archetyped structure" — no postcondition, no
    derivation expression, no `_result_` definition, unlike e.g. the same
    package's `PARTY_PROXY` / `LOCATABLE` attributes whose semantics the
    prose fixes. Two readings survive the released text and they disagree
    about what the invariant asserts:
      (a) THE REFERENCE-OBJECT-MODEL READING — `is_archetype_root` IS the
          presence of `archetype_details`. Then `Archetyped_valid` reduces to
          `(archetype_details /= Void) xor (archetype_details = Void)`, which
          is true of every instance: the invariant is a TAUTOLOGY and
          constrains no wire shape at all.
      (b) THE NODE-ID READING — `is_archetype_root` is decided from
          `archetype_node_id`, which §Attributes says is "Always in the form
          of an at-code, e.g. `at0005`" except that "At an archetype root
          point, the value of this attribute is always the stringified form
          of the `archetype_id` found in the `archetype_details` object"
          (restated in docs/common/master03-archetyped_package.adoc §The
          LOCATABLE Class: "The only exception is at archetype root points in
          data, where `archetype_node_id` carries the archetype identifier in
          string form rather than an interior node id from an archetype").
          Then the invariant has real force in BOTH directions: an at/id
          term-code node must NOT carry `archetype_details`, AND every node
          whose `archetype_node_id` is an archetype HRID MUST carry
          `archetype_details`.
    Nothing in the released RM chooses between (a) and (b). The two arms of
    (b) are not equally supported either: the negative arm follows from the
    §Attributes sentence alone (a term code is by definition not an archetype
    identifier, under either reading of the function), while the positive arm
    exists ONLY under reading (b) and vanishes entirely under reading (a).
  source: >-
    RM common docs/UML/classes/org.openehr.rm.common.locatable.adoc
    §Functions verbatim and complete for this function — "*is_archetype_root*
    (): `Boolean` | True if this node is the root of an archetyped
    structure." — with no further definition anywhere in the file;
    §Invariants "__Archetyped_valid__: `is_archetype_root xor
    archetype_details = Void`"; §Attributes (`archetype_node_id`) "Always in
    the form of an at-code, e.g. `at0005`" and "At an archetype root point,
    the value of this attribute is always the stringified form of the
    `_archetype_id_` found in the `_archetype_details_` object"; RM common
    docs/common/master03-archetyped_package.adoc §The LOCATABLE Class ("The
    only exception is at archetype root points in data, where
    `_archetype_node_id_` carries the archetype identifier in string form
    rather than an interior node id from an archetype"; "`LOCATABLE` also
    provides the attribute `_archetype_details_`, which is non-Void for
    archetype root points in data") — read first-hand, undefinedness
    CONFIRMED.
  handling: >-
    Split the invariant and gate only the arm both readings support. The
    ENFORCEABLE NEGATIVE ARM gates: a node whose `archetype_node_id` is an
    at/id term code must not carry `archetype_details`, refused as a semantic
    error at the wire — it holds under reading (b) directly and under reading
    (a) via the §Attributes sentence, so it needs no choice between the two.
    The CONVERSE ARM ("an archetype-HRID node must carry
    `archetype_details`") is NOT enforced: it exists only under reading (b),
    and reading (a) makes the whole invariant a tautology, so a refusal there
    would rest on a reading the released text does not pick. Separately and
    independently of this ambiguity, the ROOT-IDENTITY rule IS enforced
    wherever `archetype_details` is actually present — `archetype_node_id`
    must equal the stringified `archetype_details.archetype_id` — because
    that comes from the §Attributes sentence, not from `is_archetype_root`.
    Corroboration only, never the ground for the above: the CNF valid data
    sets and the canonical-JSON corpus systematically omit `archetype_details`
    on nested archetype roots, so reading (b)'s converse arm would reject
    released reference data. Flips to a gating expectation only if a future
    RM release defines `is_archetype_root ()`.
  disposition: report_only
  upstream_issue: 1614
AMB-178:
  ambiguity: >-
    A RELEASED RM ATTRIBUTE HAS NO SLOT IN THE ITS-XML LINEAGE THE CDR SERVES
    BY DEFAULT. RM 1.2.0 declares `FEEDER_AUDIT_DETAILS.other_details:
    ITEM_STRUCTURE` at 0..1 ("Optional attribute to carry any custom
    meta-data. May be archetyped."). The vendored ITS-XML v1 bundle — tag
    `Release-1.0.2v2`, target namespace `http://schemas.openehr.org/v1`, the
    RELEASED-STABLE lineage and the CDR's default served namespace — does NOT
    declare it: its `FEEDER_AUDIT_DETAILS` complexType is a six-element
    sequence ending at `version_id`. The v2 bundle (tag `Release-2.0.0v2`) is
    split by RM release and straddles the addition: its RM `Release-1.0.2`,
    `Release-1.0.3` and `Release-1.0.4` `Common.xsd` end at `version_id` too,
    while `Release-1.1.0` and `latest` DO carry
    `<xs:element name="other_details" type="ITEM_STRUCTURE" minOccurs="0"/>`
    as the trailing particle. So the attribute is expressible in canonical XML
    only under the v2 lineage's newer RM schema sets, and the released RM
    model has no v1-namespace serialization at all. The RM is silent on which
    XSD generation a canonical-XML document must satisfy, and no ITS-XML
    release withdraws the v1 bundle, so there is no released sentence making
    either the emission or its non-validatability wrong.
  source: >-
    RM common docs/UML/classes/org.openehr.rm.common.feeder_audit_details.adoc
    §Attributes ("*0..1* | *other_details*: `ITEM_STRUCTURE` | Optional
    attribute to carry any custom meta-data. May be archetyped.");
    crates/openehr-its/schemas/xml/its-xml-1.0.2-nsv1/ALL/BaseTypes.xsd
    `<xs:complexType name="FEEDER_AUDIT_DETAILS">` — sequence `system_id`,
    `location`, `provider`, `subject`, `time`, `version_id`, then
    `</xs:sequence>`; the same six-element sequence in
    its-xml-2.0.0-nsv2/RM/Release-1.0.2/Common.xsd,
    .../Release-1.0.3/Common.xsd and .../Release-1.0.4/Common.xsd; the
    seven-element sequence with the trailing
    `<xs:element name="other_details" type="ITEM_STRUCTURE" minOccurs="0"/>`
    in its-xml-2.0.0-nsv2/RM/Release-1.1.0/Common.xsd and
    its-xml-2.0.0-nsv2/RM/latest/Common.xsd — every complexType read
    element-by-element, the split across the two lineages CONFIRMED.
  handling: >-
    Report-only, no gate. The generated XML codec follows the RM under the
    completeness rule and emits `other_details` as the trailing element of
    `FEEDER_AUDIT_DETAILS`, in the same position the v2 `Release-1.1.0`
    schema puts it, so a document that carries the attribute is byte-identical
    across the two lineages bar the root namespace and validates against the
    v2 `Release-1.1.0`/`latest` schema set. Suppressing the element to make
    the v1 XSD happy would silently drop released RM data on the XML wire —
    a lossy serialization of a modelled attribute — and is refused. What
    remains genuinely unassignable is only the v1-namespace validation
    question, which no released document settles; a client that must
    schema-validate against the STABLE v1 bundle and also carries
    `other_details` has no released answer. The XML round-trip gate therefore
    pins the emission and the parse-back (serialize -> parse -> equal, with
    the element present in the emitted document); no case asserts v1 XSD
    validity of such a document. Flips to a gating expectation if a future
    ITS-XML release either back-ports the element to the v1 bundle or
    withdraws that lineage.
  disposition: report_only
  upstream_issue: 1615

AMB-179:
  ambiguity: >-
    THE RELEASED COMMIT SCHEMA NARROWS THE COMMIT AUDIT TO ONE OF THE TWO RM
    CLASSES THE RM ADMITS THERE. The RM makes a VERSION's `commit_audit` an
    `AUDIT_DETAILS` "or its subtype `ATTESTATION`", and gives the subtype form
    a named, motivated use: committing content that must be signed or reviewed
    ("`ORIGINAL_VERSION._commit_audit_` is of type `ATTESTATION` rather than
    `AUDIT_DETAILS`", with `is_pending` True for the review case), which
    master04 calls "the most common scenario" when an attestation is required.
    The released OAS admits only the flat class: `UpdateAudit.yaml`'s own
    description enumerates the acceptable discriminators as `UPDATE_AUDIT`,
    `AUDIT_DETAILS`, or an omitted `_type`, and `UpdateVersion.commit_audit`
    `$ref`s that schema alone — while `UpdateAttestation.yaml`, the commit DTO
    of exactly the ATTESTATION attributes, is reachable from `attestations[]`
    only. So the pending-at-committal case the RM states in prose has no
    released commit shape. The same narrowing applies to
    `AUDIT_DETAILS.description`: the RM types it `DV_TEXT` and the released
    `UDvText` admits the `DV_CODED_TEXT` subtype, so a coded description is a
    representable value whose `defining_code` a flat-string store would drop.
  source: >-
    RM common master06-change_control_package.adoc §Committal and Audits
    ("`AUDIT_DETAILS` ... or its subtype `ATTESTATION`, which adds a number of
    other attributes") + §Attestation ("Signing content at committal ... In
    this case, `ORIGINAL_VERSION._commit_audit_` is of type `ATTESTATION`
    rather than `AUDIT_DETAILS`"; "Marking content for review and signing ...
    the Attestation will have its `_is_pending_` flag set True") + master04
    §Attestation ("the most common scenario will be that a Composition Version
    will be committed with a `_commit_audit_` of type `ATTESTATION`, rather
    than just `AUDIT_DETAILS`; the `_is_pending_` flag will be set to True") +
    UML/classes/org.openehr.rm.common.{attestation,audit_details}.adoc
    §Attributes; ITS-REST specifications/docs/overview/Requests_and_responses.md
    §"openehr-version and openehr-audit-details" ("The 'native' way of
    committing is to use a CONTRIBUTION and wrap the content as a VERSION",
    linking the RM change-control package and VERSION class) vs
    specifications/schemas/common/{UpdateAudit,UpdateAttestation,UDvText}.yaml
    and schemas/ehr/UpdateVersion.yaml — confirmed first-hand.
  handling: >-
    Fixed handling: this server follows the RM, exactly as it does for the
    deletion member the same released schema cannot express (AMB-85). A
    version's `commit_audit` is accepted with `_type` `AUDIT_DETAILS` /
    `UPDATE_AUDIT` / an omitted `_type` (the plain class) or `ATTESTATION` /
    `UPDATE_ATTESTATION` (the subtype — both spellings, so the RM class and its
    released commit DTO pair symmetrically with the flat pair above); any other
    `_type` is refused 422. An accepted ATTESTATION commit audit has its own
    attributes decoded typed and invariant-checked (`Reason_valid`,
    `Items_valid`, `reason`/`is_pending` 1..1) and is stored and served AS an
    `ATTESTATION` — on the version envelope, in the revision history, in a
    CONTRIBUTION rendering and in an EHR-Extract export alike. `description` is
    likewise kept as the whole `DV_TEXT`/`DV_CODED_TEXT` value. The narrowing
    is a released-OAS silence about a released-RM shape, not a prohibition: no
    released sentence says a commit audit may not be an ATTESTATION, and the
    docs text points the native commit at the RM that says it may. The outbound
    ask — give the commit schema an ATTESTATION variant for `commit_audit`, as
    `attestations[]` already has one, and let `description` carry the released
    `UDvText` rather than a flat string — is reported upstream.
  disposition: fixed_handling
  upstream_issue: 1641

AMB-180:
  ambiguity: >-
    THE PROSE AND THE CLASS MODEL DISAGREE ON THE SCOPE OF `ATTESTATION.items`.
    master04 §Attestation states the scope narrowly: "if this list is empty, the
    attestation is for the entire object (usually the content of an
    `ORIGINAL_VERSION`) to which the attestation is attached, otherwise the list
    must contain a set of paths to items WITHIN the item to which the
    attestation is attached" — i.e. every member is required to resolve inside
    the attested object. The class table for the same attribute admits the
    opposite: "Items attested, expressed as fully qualified runtime paths to the
    items in question. Although not recommended, these may include fine-grained
    items which have been ATTESTED IN SOME OTHER SYSTEM." A path to an item
    attested in another system is by definition not within the object the
    attestation is attached to. master04's own closing paragraph on the subject
    leans the same way as the class table — "Normally the list of items being
    attested should be a single Entry or Composition, but there is nothing
    stopping it including fine-grained items" — describing granularity as
    unrecommended rather than invalid. Nothing in either source gives a
    containment predicate a server could evaluate, and the only machine-readable
    constraint on the attribute is the invariant, which says nothing about
    scope.
  source: >-
    RM common master04-generic_package.adoc §Attestation (the "paths to items
    within the item" sentence in the contents list, and the later "nothing
    stopping it including fine-grained items" paragraph) +
    UML/classes/org.openehr.rm.common.attestation.adoc §Attributes (`items`:
    `List<DV_EHR_URI>` 0..1, "attested in some other system") and §Invariants
    (`Items_valid`: `items /= Void implies not items.is_empty` — the ONLY
    declared constraint) — all three read first-hand.
  handling: >-
    Fixed handling: this server enforces the CLASS-MODEL reading, which is the
    machine-readable one. `items` is decoded as `List<DV_EHR_URI>` — each member
    must be a canonical `DV_EHR_URI`, so `DV_EHR_URI.Scheme_valid` still forces
    an `ehr://` target — and `Items_valid` is enforced (a present list must be
    non-empty). NO scope check is applied: a member is not required to resolve
    within the attested object, and a cross-system path is accepted and stored
    verbatim. Enforcing the prose reading instead would refuse exactly the
    cross-system case the class table names as permitted, and would require a
    containment predicate neither source defines. The refusals that ARE pinned
    (empty list, non-`DV_EHR_URI` member) trace to the invariant and the
    attribute type, not to the disputed sentence.
  disposition: editorial
  upstream_issue: 1634

AMB-181:
  ambiguity: >-
    `ATTESTATION.proof` HAS NO DEFINED SERIALISATION, SO NO SERVER CAN VERIFY
    ONE. master04 §Attestation defines the proof as an openPGP signature over
    "the entire Attestation object (note that the proof attribute will be Void
    at this point)" serialised "into an agreed XML, openEHR ODIN or other text
    format" — and then withdraws the definition: "[.tbd] *To Be Determined*: The
    exact serialisation is not yet defined by openEHR, but dADL might be
    preferred". Two facts compound the gap on the server side. First, "an agreed
    ... format" is agreement between the signing parties, not a wire contract a
    repository is party to. Second, the inherited `AUDIT_DETAILS` attributes of
    an attestation are SERVER-MINTED at completion — `system_id`,
    `time_committed` and the `666|attestation|` `change_type` are the server's,
    never the client's (ITS-REST overview `Requests_and_responses.md`
    §"openehr-version and openehr-audit-details": "The `time_committed`
    attribute is always set by the server") — so the object the server ends up
    holding is NOT byte-identical to the object the client signed, whatever
    serialisation either used. A stored proof is therefore never
    server-verifiable even in principle.
  source: >-
    RM common master04-generic_package.adoc §Attestation (the openPGP process
    paragraphs, the "proof attribute will be Void at this point" serialisation
    rule, and the `[.tbd]` block) +
    UML/classes/org.openehr.rm.common.attestation.adoc §Attributes (`proof`:
    `String` 0..1, "Proof of attestation" — no format, no invariant); ITS-REST
    specifications/docs/overview/Requests_and_responses.md §"openehr-version and
    openehr-audit-details" — read first-hand.
  handling: >-
    Fixed handling: `proof` is an OPAQUE CLIENT FACT. It is accepted only as the
    `String` its class table declares (a non-string is refused 422), stored
    byte-for-byte, and served back byte-for-byte; it is never parsed, never
    recomputed, and never verified — at commit or at read. This is distinct from
    the VERSION `signature` mechanism, which this server DOES generate and
    verify for its own signatures (RM common master06 §Digital Signature): there
    the server owns both the canonicalisation and the key, so a digest is
    checkable; here it owns neither. Nothing gates on a proof's value or
    presence, so the TBD costs no coverage: the attestation cases assert the
    round trip, not a cryptographic outcome. This flips to a gating expectation
    only if openEHR resolves the TBD with a canonical serialisation AND a rule
    for the server-minted inherited attributes.
  disposition: fixed_handling

AMB-182:
  ambiguity: >-
    `REVISION_HISTORY` IS BOUND TO A PROPERTY BASE HAS SINCE REMOVED. RM common
    master04 §Revision History states the classes' purpose as covering two
    holders: "These classes provide an interoperable definition of revision
    history for the `VERSIONED_OBJECT` and `AUTHORED_RESOURCE` classes." The
    second holder no longer has the property: the BASE resource package's own
    amendment record carries "Re-engineer `AUTHORED_RESOURCE` classes according
    to AOM2 requirements. Remove `_revision_history_` property", and the current
    `AUTHORED_RESOURCE` class table declares no such attribute. So the RM
    sentence describes a binding one of its two named holders no longer has,
    and the only surviving holder is `VERSIONED_OBJECT`.
  source: >-
    RM common master04-generic_package.adoc §Revision History (the
    "`VERSIONED_OBJECT` and `AUTHORED_RESOURCE`" sentence) + BASE
    docs/resource/master00-amendment_record.adoc ("Remove `_revision_history_`
    property", the AOM2 re-engineering row) + BASE resource
    UML/classes/org.openehr.base.resource.authored_resource.adoc §Attributes
    (no `revision_history`) — read first-hand.
  handling: >-
    Report only, no gate. Our posture already matches the post-removal reality
    and needs no change: `REVISION_HISTORY` is built and served for
    `VERSIONED_OBJECT` alone (the `versioned_*/revision_history` reads), and the
    authored-resource surfaces carry no revision history because the generated
    `openehr-base` model — emitted from the vendored BASE BMM — declares none.
    No case asserts a revision history on an authored resource, and none should:
    the removal is the released state of BASE, so a case built on the RM
    sentence would test a property that does not exist. The entry exists so the
    stale cross-reference is reported rather than silently absorbed, and so a
    future reader does not "restore" the binding from the RM sentence alone.
  disposition: report_only
  upstream_issue: 1635

AMB-183:
  ambiguity: >-
    TWO INCOMPATIBLE BARE-BRACKET PREDICATE GRAMMARS FOR THE SAME PATH SYNTAX.
    RM common master05-directory_package.adoc §Paths states directory paths as
    NAME-based: "Directory paths are built using the `_name_` attribute values
    inherited from `LOCATABLE` into each `FOLDER` object" (l.15), with worked
    examples whose bare brackets hold a name value, not a node id —
    `/folders[hospital episodes]/items[1]` (l.18) — and it adds a uniqueness
    modifier form found in no other openEHR path text: "Uniqueness modifiers
    are appended in brackets" (l.23), `[hospital episodes]` vs
    `[hospital episodes(car accident Aug 1998)]` (ll.26-27). BASE
    architecture_overview/master11-paths.adoc §Archetype path Predicate assigns
    the SAME bare-bracket slot the opposite meaning: "The shortcut form allows
    the archetype code to be included on its own as the predicate, e.g.
    `[at0003]`" (l.68), "the `[atNNNN]` predicates are a shortcut for
    `[@archetype_node_id = 'atNNNN']` in standard Xpath" (l.74). A name is
    reached in master11 only through the explicit `name/value='…'` predicate
    (§Name-based Predicate) or its comma shortcut — never a bare bracket. So a
    bare `[hospital episodes]` means "the FOLDER named 'hospital episodes'"
    under master05 and "the node whose archetype_node_id is
    'hospital episodes'" under master11, and the parenthesised uniqueness
    modifier has no meaning at all under master11, which defines no
    parenthesis production outside boolean predicate grouping.
  source: >-
    RM common master05-directory_package.adoc §Paths ll.15, 18, 23, 26-27; BASE
    docs/architecture_overview/master11-paths.adoc §Archetype path Predicate
    ll.68, 74 + §Name-based Predicate — read first-hand.
  handling: >-
    Fixed handling: the path engine implements master11, BASE's formal path
    grammar chapter, for every path in the system — a bare bracket token binds
    to `archetype_node_id`, and a name is matched only through the explicit
    `name/value` predicate. master05's name-form therefore binds NOTHING: a
    directory path written the master05 way (`/folders[hospital episodes]`)
    parses, binds its token as an archetype_node_id, and matches no node, which
    is the correct master11 answer and is left unchanged. The parenthesised
    uniqueness modifier is a DIFFERENT case and is not silently mis-bound: a
    bare token containing `(`…`)` is refused as an unsupported predicate
    (`PathError::UnsupportedPredicate`) rather than binding the whole literal —
    including the parentheses — as an archetype_node_id that could never match.
    Refusing loudly keeps the two grammars from being silently conflated. This
    is the RM-LAYER twin of AMB-81, which registers the same collision one
    level up on the ITS-REST directory `path` query parameter (that parameter's
    own one-sentence grammar references neither chapter); AMB-81 governs the
    REST parameter's segment resolution, this entry governs the RM path
    predicate grammar the engine implements.
  disposition: report_only
  upstream_issue: 1650

AMB-184:
  ambiguity: >-
    RM NAMES A DEMOGRAPHIC FOLDER THE RELEASED SERVICE SURFACES CANNOT ADDRESS.
    RM common master05-directory_package.adoc §Overview states that
    `VERSIONED_FOLDER` "provides a means of versioning `FOLDER` structures over
    time, which is useful in the EHR, Demographics service or anywhere else
    where Folders are used". Nothing in the released service or wire
    specifications realises the Demographics half: SM
    UML/classes/i_demographic_service.adoc declares exactly four functions —
    `create_party`, `create_party_relationship`, `i_party`,
    `i_party_relationship` — none of them folder- or directory-bearing, and
    there is no `I_DEMOGRAPHIC_DIRECTORY` interface to parallel
    `I_EHR_DIRECTORY`; the ITS-REST demographic API defines no folder or
    directory path, every `directory_*` operation being mounted EHR-scoped at
    `/ehr/{ehr_id}/directory` (specifications/ehr.openapi.yaml). So the RM
    sentence describes a use the released service model and REST API give no
    operation for.
  source: >-
    RM common master05-directory_package.adoc §Overview (the "EHR, Demographics
    service or anywhere else" sentence); SM
    docs/UML/classes/i_demographic_service.adoc §Functions (the complete
    four-function table); ITS-REST specifications/ehr.openapi.yaml
    (`/ehr/{ehr_id}/directory`, `/ehr/{ehr_id}/directory/{version_uid}`) +
    specifications/demographic.openapi.yaml (no folder path) — read first-hand.
  handling: >-
    Fixed handling: FOLDER is an EHR-scoped kind, both ways. A demographic
    CONTRIBUTION carrying a FOLDER version is refused, and an EHR CONTRIBUTION
    carrying a demographic version is refused (the contribution kind-scope
    check). The released scoping is the reality to implement: master05's
    sentence is a statement about where the CLASS is reusable, not a service
    definition, and no released operation exists to create, address, read or
    version a demographic folder. Nothing is registered as unassigned here and
    no upstream report is filed — the specifications are not in conflict, the
    RM merely describes a possibility its service layer never exposed. This
    flips only if a released SM interface or ITS-REST path introduces a
    demographic directory resource.
  disposition: fixed_handling

AMB-185:
  ambiguity: >-
    THE §XML FORMAT `MUST CONFORM` CANNOT BE SATISFIED AGAINST BOTH PUBLISHED
    LINEAGES AT ONCE, BECAUSE THE TWO PUBLISHED XSD BUNDLES MODEL DIFFERENT RM
    GENERATIONS. ITS-REST states one unconditional obligation for canonical
    XML — request payloads and responses "MUST conform to the [published
    XSDs]" — and treats the published XSDs as a single set. They are not one
    set. openEHR publishes TWO ITS-XML bundles: the `Release-1.0.2v2` bundle
    (namespace `http://schemas.openehr.org/v1`, which the schema repository's
    README still presents as the STABLE release) and the `Release-2.0.0v2`
    bundle (namespace `…/v2`, marked TRIAL there). The 2.0.0 release did not
    only change the namespace: it RESTRUCTURED the repository into per-
    component, per-RM-release folders, and the older flat bundle was never
    re-issued against a newer RM. The v1 bundle is therefore frozen at an RM
    generation that predates a large part of RM 1.2.0, while a conformant RM
    1.2.0 serializer must write the RM 1.2.0 model. A document that is a
    correct RM 1.2.0 instance can consequently be INVALID against the v1
    schemas and VALID against the v2 ones — the obligation's two halves
    disagree, and no serialization choice satisfies both. Separately, the v2
    lineage cannot be compiled by a conformant XSD processor at all (see
    source (2c)), so for the newer half the obligation currently has no
    machine-checkable referent either.
  source: >-
    ALL SOURCES READ FIRST-HAND, in the oracle order.
    (1) DOCS TEXT — ITS-REST specifications/docs/overview/Resources.md §"XML
    Format", first sentence: "When resources are serialized in **canonical
    XML** format, both request payloads and responses MUST conform to the
    [published XSDs]", the bracketed phrase linking to
    `https://specifications.openehr.org/releases/ITS-XML/latest`. §"Data
    representation" makes OFFERING XML a service choice ("Services MUST
    support at least one of the openEHR **XML** or **JSON** canonical
    formats"), but says nothing about which bundle a served document is judged
    against. AMB-169 registers the served-lineage choice itself; this entry is
    about the CONTENT delta between the bundles, which AMB-169 explicitly did
    not cover (its premise was that the lineages differ by namespace alone).
    (2) THE PUBLISHED XSDs, both vendored bundles, swept mechanically against
    the generated RM 1.2.0 model by the gate
    `crates/openehr-its/tests/it/xml_xsd_validity.rs` (the sweep re-derives
    itself on every run; the numbers below are its pinned output).
    (2a) THE nsv1 BUNDLE IS INCOMPLETE FOR RM 1.2.0 — 50 concrete RM classes
    have NO complexType in it at all. Upstream's `Release-1.0.2v2` tag
    publishes exactly `components/ALL/` (11 XSDs) + `components/AOM2/`
    (verified against the upstream tag tree), so the bundle carries no
    `Ehr.xsd` and no `Demographic.xsd`: EHR, EHR_STATUS, EHR_ACCESS,
    CONTRIBUTION, every VERSIONED_* container, the five demographic PARTY
    types and PARTY_RELATIONSHIP, plus later additions such as DV_SCALE and
    ITEM_TAG, simply have no v1 schema. (AMB-167 classifies the REST
    consequence — media type declared, document withheld.)
    (2b) WHERE nsv1 DOES DECLARE THE CLASS, IT DECLARES FEWER MEMBERS — 23
    attribute divergences over 17 classes, each traceable to the nsv2 RM
    release folder that DOES declare it. `ISM_TRANSITION.reason`,
    `EXTRACT_CHAPTER.items`, the four `EXTRACT_ENTITY_MANIFEST` members,
    `EXTRACT_SPEC.priority` and `EXTRACT_UPDATE_SPEC.update_method` arrive in
    nsv2 `RM/Release-1.0.3`; `FOLDER.details`, `ELEMENT.null_reason`,
    `CODE_PHRASE.preferred_term`, `DV_QUANTITY.units_system` +
    `units_display_name` and `FEEDER_AUDIT_DETAILS.other_details` arrive in
    nsv2 `RM/Release-1.1.0`; `ENTRY.workflow_id` (inherited by ACTION,
    ADMIN_ENTRY, EVALUATION, INSTRUCTION, OBSERVATION) is declared by EVERY
    nsv2 RM release folder including `Release-1.0.2` and is absent from the
    nsv1 flat bundle entirely — so nsv1 is not even an RM-1.0.2-complete
    packaging. `FOLDER.details` is the wire-visible instance the CDR actually
    serves: RM common `master05-directory_package.adoc` §Overview — "Any
    individual Folder may contain meta-data in its `details` attribute (type
    `ITEM_STRUCTURE`)".
    (2c) THE nsv2 LINEAGE DOES NOT COMPILE. `BASE/latest/BaseTypes.xsd`
    (`xs:simpleType archetypeNodeId`) carries a Perl-flavoured `pattern` facet
    built from `(?:…)` non-capturing groups, with an upstream comment linking
    to regex101. XML Schema Part 2 Appendix F
    (<https://www.w3.org/TR/xmlschema-2/#regexs>) defines the pattern-facet
    language, and its `atom` production admits only a character, a character
    class, or a parenthesised `regExp` — there is no `(?…)` construct, so the
    facet is not a valid XSD regular expression and libxml2 refuses the
    schema. The same defective facet appears in `BASE/Release-1.1.0`,
    `BASE/Release-1.2.0` and the nsv2 `RM/Release-1.0.2` + `RM/Release-1.0.3`
    local `BaseTypes.xsd`, and every nsv2 RM release folder includes one of
    them, so the whole lineage is affected. The nsv1 bundle's own
    `archetypeNodeId` facet is plain XSD regex and compiles.
    (2d) TWO DIVERGENCES SURVIVE AGAINST nsv2 `latest` AND ARE THE XSDs'
    DEFECT, NOT AN AGE EFFECT: `EHR.tags`, which RM
    `UML/classes/org.openehr.rm.ehr.ehr.adoc` declares ("Optional list of tags
    associated with this EHR") and `RM/latest/Ehr.xsd` does not; and a
    spelling conflict on the EHR-Extract flags, where both lineages spell them
    `includes_multimedia` / `includes_revision_history` / `includes_data`
    while RM `ehr_extract/master04-common_package.adoc` and
    `UML/classes/org.openehr.rm.ehr_extract.extract_{spec,version_spec}.adoc`
    spell them `include_multimedia` / `include_revision_history` /
    `include_data`.
    (3) RE-GROUNDED 2026-08-04 (the #1665 re-adjudication, read first-hand):
    this clause previously called `TRANSLATION_DETAILS.accreditaton` and
    `RESOURCE_DESCRIPTION_ITEM.copyright` "defects on OUR side … the RM BMM's
    stale in-component copy". BOTH HALVES OF THAT WERE WRONG, for the same
    reason: the RM's resource package is not a stale copy of BASE's, it is a
    DELIBERATELY RETAINED SECOND GENERATION. RM
    `docs/common/master08-resource_package.adoc` opens by saying so — "the
    version of the Resource package described below is used only in ADL 1.4
    archetypes … with the older form here retained only while needed by AOM
    1.4 based archetypes and tools" — so RM and BASE are expected to carry
    DIFFERENT shapes, and agreement with BASE is not the test.
    (3a) `copyright` IS NOT A DIVERGENCE AT ALL. The retained generation's own
    published schema places it exactly where `openehr_rm::common::resource`
    does: `components/AM/Release-1.4/Resource.xsd` declares `copyright` on
    complexType `RESOURCE_DESCRIPTION_ITEM`, while
    `components/BASE/latest/Resource.xsd` declares it on
    `RESOURCE_DESCRIPTION`. Two generations, two correct shapes; the sweep
    compares an ADL-1.4-generation class against a newer-generation schema
    and the mismatch is the comparison's, not the model's.
    (3b) `accreditaton` IS AN UPSTREAM RM DEFECT, not ours. BASE
    `resource/master00-amendment_record.adoc` records SPECPUB-6, "Correct
    spelling error in `TRANSLATION_DETAILS._accreditation_`" — applied to
    BASE's copy ONLY. The RM component's retained package still spells
    `accreditaton` in its BMM, while EVERY published `Resource.xsd` in BOTH
    lineages spells `accreditation` (verified across
    `its-xml-1.0.2-nsv1/ALL`, `its-xml-1.0.2-nsv1/AOM2`,
    `its-xml-2.0.0-nsv2/AM/Release-1.4` and every BASE release folder). The
    generator reproduces its vendored input verbatim and must, so the
    misspelling is upstream's to fix; filed as the `upstream-report` issue
    recorded in `upstream_issue` below.
    Unchanged and still true: these classes are AUTHORED_RESOURCE metadata and
    are not part of any RM document the CDR serves on the ITS-REST wire, so
    neither item touches the served wire this entry governs.
  handling: >-
    Fixed handling — the served wire is UNCHANGED, and the boundary is
    recorded instead of papered over.
    (a) THE SERVED DEFAULT IS v2 (owner ruling 2026-08-03, tracker issue
    #1666, superseding the initial stays-v1 handling). The premise of the v1
    default — that the lineages differ only by root namespace — is exactly
    what this entry refutes: the v1 bundle cannot describe 50 concrete RM
    classes and 23 attributes this server legitimately serves, so a
    schema-validating client on the default lineage was guaranteed spurious
    invalidity. Correctness beat the STABLE label: the CDR serves v2 by
    default, with v1 still selectable through the `version` media-type
    parameter (AMB-169 records the selection mechanism). The TRIAL status and
    the nsv2 facet defect (d) are unchanged facts, reported upstream
    (tracker issues #1663/#1664).
    (b) THE CODEC KEEPS WRITING THE FULL RM 1.2.0 MODEL. Suppressing
    `FOLDER.details` (or any other member) to make a v1 document validate
    would silently DROP CLINICAL CONTENT the RM mandates and the canonical
    JSON carries — a data-loss defect far worse than a schema-age divergence,
    and a fork of the spec model at the serializer. The RM is the authority
    for WHAT is written; the XSD bundle is a validation artifact of a given
    release, not a content filter.
    (c) THE DIVERGENCE SET IS PINNED, NOT ASSUMED. `xml_xsd_validity.rs`
    re-derives the absent-class set and the attribute delta from the generated
    RM model against the vendored XSD text on every run and fails if either
    changes, and it drives real serialized documents through `xmllint
    --schema` so each pinned divergence is proven at the wire rather than
    asserted. A NEW divergence — from an RM pin bump, an emitter change or a
    re-vendored bundle — fails the build and must be adjudicated here before
    the list may grow.
    (d) THE nsv2 HALF IS PINNED AS UNCOMPILABLE. The gate asserts the compile
    failure and its cause, so the day upstream fixes the facet (or the bundle
    is re-vendored) the test fails and the nsv2 expectations are promoted from
    "uncompilable" to real per-document validation.
    (e) FIXTURE VERDICTS. `cnf.directory.v2.xml` stays `verdict: valid` — it
    is a correct RM 1.2.0 FOLDER and a correct canonical-XML serialization of
    one; its manifest entry cites this register entry so the v1-XSD
    divergence it carries is visible where the verdict is, not buried.
    (f) TWO UPSTREAM DEFECTS ARE WORTH REPORTING and are named above rather
    than absorbed: the invalid `archetypeNodeId` pattern facet (2c) and the
    XSD-vs-RM-text `include*` spelling conflict plus the missing `EHR.tags`
    (2d). They do not change our behaviour, which is why this entry is
    `fixed_handling` rather than `report_only`.
    (g) THE TWO ITEMS OF (3) NEED NO CHANGE HERE (re-grounded 2026-08-04 with
    the rest of (3)). `copyright` is not a divergence — it is the retained
    ADL-1.4 generation's own published shape — so nothing is pinned for it
    beyond the note that the sweep compares across generations. `accreditaton`
    is upstream's misspelling to correct in the RM component's retained
    package; the generator reproduces its vendored input verbatim and must, so
    there is nothing to fix on our side and nothing to work around in a
    consumer. Both stay named here so the sweep's output stays fully accounted
    for rather than filtered out, and neither reaches the served wire.
  disposition: fixed_handling
  upstream_issue: 1849
AMB-186:
  ambiguity: >-
    THE RELEASED COMMIT SCHEMA NARROWS `FOLDER.items` REFERENCE IDS TO TWO OF
    THE SIX SUBTYPES THE MODEL ADMITS THERE. The RM types the slot at its
    abstract root: `FOLDER.items` is `List<OBJECT_REF>` (0..1) and
    `OBJECT_REF.id` is `OBJECT_ID` (1..1) — whose concrete family has SIX
    members, each naming `OBJECT_ID` (directly, or through `UID_BASED_ID`) in
    its own class table's *Inherit* row: HIER_OBJECT_ID, OBJECT_VERSION_ID,
    ARCHETYPE_ID, TEMPLATE_ID, TERMINOLOGY_ID, GENERIC_ID. The ITS-JSON RM
    schema types the same slot the same way, enumerating exactly those six
    `_type` values under `OBJECT_REF.id`. The released OAS admits two: the
    `items` array of `Folder.yaml` `$ref`s `UObjectRefOfUidBasedId.yaml`,
    which overrides `id` with `UUidBasedId.yaml` — a `oneOf` of
    `UMHierObjectId` and `UMObjectVersionId` with a `_type` discriminator
    mapping naming only those two. So a folder reference to anything
    identified outside the UID lineage — a terminology-, archetype-,
    template- or foreign-scheme-identified target, the last of which
    GENERIC_ID exists for ("identifiers whose format is otherwise unknown to
    openEHR") — is a representable RM instance with no released commit shape.
    Nothing released PROHIBITS the wide form: the narrowing is an absence in
    one schema file, not a stated constraint, and the OAS's own generic
    `ObjectRef.yaml` keeps `id` at `UObjectId` while its `example` pins a
    version-addressed COMPOSITION ref.
  source: >-
    ALL SOURCES READ FIRST-HAND, in the oracle order.
    (1) DOCS TEXT — ITS-REST specifications/docs/overview/Requests_and_responses.md
    §"openehr-version and openehr-audit-details" names FOLDER in the sentence
    that assigns the commit semantics to the RM: "for all change-controlled
    resources (e.g. COMPOSITION, EHR_STATUS, FOLDER, etc.) the services are
    [performing versioning] under the hood. The 'native' way of committing is
    to use a [CONTRIBUTION] and wrap the content as a [VERSION]", both links
    pointing at the RM common change-control package, and the following
    sentences make the direct `PUT`/`POST`/`DELETE` methods a convenience over
    it: "services MUST also allow `PUT`, `POST` and `DELETE` methods directly
    on these change-controlled resources. However, these operations MUST
    internally be executed using the 'native' way." The docs text states
    nothing about which OBJECT_ID subtype a folder reference may carry.
    (2) THE MODEL — RM common
    UML/classes/org.openehr.rm.common.folder.adoc §Attributes (`items`:
    `List<OBJECT_REF>` 0..1, "The list of references to other (usually)
    versioned objects logically in this folder"); BASE base_types
    UML/classes/org.openehr.base.base_types.object_ref.adoc §Attributes
    (`namespace`/`type`/`id` each 1..1; `id`: `OBJECT_ID`, "Globally unique id
    of an object, regardless of where it is stored"; and the `type` row's own
    "The type name `ANY` can be used to indicate that any type is accepted");
    the six concrete OBJECT_ID subtypes' class tables
    (…base_types.{hier_object_id,object_version_id,archetype_id,template_id,
    terminology_id,generic_id}.adoc §Inherit); ITS-JSON
    crates/openehr-its/schemas/json/openehr_rm_1.1.0_all.json,
    `definitions.OBJECT_REF.properties.id` — the same six `_type` values.
    (3) THE RELEASED OAS, cited AS THE OAS — ITS-REST
    specifications/schemas/ehr/Folder.yaml (`items.items` `$ref`
    ../base_types/UObjectRefOfUidBasedId.yaml),
    specifications/schemas/base_types/UObjectRefOfUidBasedId.yaml (overrides
    `id` with ../base_types/UUidBasedId.yaml),
    specifications/schemas/base_types/UUidBasedId.yaml (`oneOf`
    UMHierObjectId | UMObjectVersionId, discriminator mapping HIER_OBJECT_ID /
    OBJECT_VERSION_ID) and specifications/schemas/base_types/ObjectRef.yaml
    (`id`: ../base_types/UObjectId.yaml; `example` `{id: {_type:
    OBJECT_VERSION_ID, value: 'fb458d9c-1323-42bc-b7f8-787f3660a0b5::openEHRSys.example.com::1'},
    namespace: local, type: COMPOSITION}`). Read as an offer, never as a
    presence requirement.
  handling: >-
    Fixed handling: this server follows the RM, exactly as it does for the
    commit audit the same released schema set cannot express (AMB-179). A
    `FOLDER.items` member is accepted with `id` of ANY of the six concrete
    OBJECT_ID subtypes, decoded typed, stored and served verbatim in the
    canonical fragment — including the three-part OBJECT_VERSION_ID form (the
    version-pinned reference, which the OAS admits and its own `ObjectRef`
    example uses) and the foreign-scheme GENERIC_ID form (which it does not).
    The refusals that stand on this slot are the ones the RM states: a member
    that is not an OBJECT_REF at all — content by value — is refused 422
    (cnf.directory.invalid.items_by_value), as is a member missing any of the
    three 1..1 attributes. Truncating a version-pinned reference to its
    leading object_id, or coercing a foreign identifier into a UID-shaped one,
    would DELETE clinical addressing the RM mandates and the canonical JSON
    carries — the same data-loss reasoning as AMB-185(b): the RM is the
    authority for WHAT may be written; a narrower schema file is a validation
    artifact of one release, not a content filter. The wide acceptance is
    ASSERTED, not incidental: create_directory-versioned_id_items pins the
    three-part form through a create + read-equivalence round trip, and
    create_directory-wide_id_items pins the GENERIC_ID form the OAS reading
    would refuse. The outbound ask — widen `Folder.yaml`'s `items` id to the
    OBJECT_ID family the RM and the ITS-JSON schema both state, as
    `ObjectRef.yaml` already does — is reported upstream (#1667).
  disposition: fixed_handling
  upstream_issue: 1667

AMB-187:
  ambiguity: >-
    THE RM AND THE SM MODEL A PARTY_RELATIONSHIP AS TWO DIFFERENT THINGS, AND
    NOTHING RECONCILES THEM. The RM makes a relationship COMPOSITIONAL DATA of
    its source party: "`PARTY_RELATIONSHIPs` are stored as part of the data of
    the `PARTY` designated as the source. This means that the relationships
    attribute is by value, while the `PARTY_RELATIONSHIP._source_` and
    `_target_` are represented by references" (master02 L44), and "A Version of
    a `PARTY` includes all the compositional parts, such as identities,
    contacts, Party relationships of which it is the source. Every Party is
    stored in its own Version container" (master02 L48). On that reading a
    relationship has NO container of its own — it is versioned with, and only
    with, its source party — and the RM demographic package accordingly
    declares NO `VERSIONED_PARTY_RELATIONSHIP` class beside `VERSIONED_PARTY`
    (grep-verified: the identifier occurs nowhere in the RM). The SM models the
    exact opposite: `I_PARTY_RELATIONSHIP` gives a relationship its OWN
    independently-addressed version container — every one of its six operations
    takes `a_versioned_party_rel_id`, `update_party_relationship` "Causes
    server-side creation of a new `ORIGINAL_VERSION` and `CONTRIBUTION`" of its
    own, `delete_party_relationship` deletes that container, and four
    operations declare a `versioned_object_does_not_exist` error, which
    presupposes a versioned object that can fail to exist independently of any
    party. The two representations of one relationship are therefore BOTH
    modelled and NOTHING released says how they relate: whether committing an
    inline `relationships` member must materialize a container, whether
    creating a container must appear in its source party's list, which of the
    two is authoritative when they disagree, or whether they are simply
    disjoint.
  source: >-
    RM demographic docs/demographic/master02-demographic_package.adoc §Party
    Relationships L44 + §Versioning Semantics L48 (both quoted above) + RM
    demographic UML/classes/org.openehr.rm.demographic.party.adoc §Attributes
    (`relationships`: `List<PARTY_RELATIONSHIP>` — BY VALUE) and §Invariants
    (`Relationships_validity`: `relationships /= Void implies (not
    relationships.is_empty and then relationships.for_all (r | r.source =
    self)`) + the absence of any `VERSIONED_PARTY_RELATIONSHIP` class in the
    package (contrast `versioned_party.adoc`, which exists) CONTRASTED with SM
    UML/classes/i_party_relationship.adoc (all six operations keyed by
    `a_versioned_party_rel_id: UUID`; `update_party_relationship` "Causes
    server-side creation of a new `ORIGINAL_VERSION` and `CONTRIBUTION`";
    `delete_party_relationship` `Post_relationship_deleted`; the
    `versioned_object_does_not_exist` error on get / get_at_time / update /
    delete) — ALL CONFIRMED first-hand. The ITS-REST docs text cannot break the
    tie: it surfaces no PARTY_RELATIONSHIP resource at all (register AMB-32),
    so tier 1 and tier 2 of the oracle order are both silent on the relation
    between the two representations.
  handling: >-
    Fixed handling: THE TWO REPRESENTATIONS ARE DISJOINT, and the SM drives the
    service surface.
    (a) The SERVICE surface follows the SM: `I_PARTY_RELATIONSHIP` and
    `I_DEMOGRAPHIC_SERVICE.create_party_relationship` are realized as
    independently-versioned containers of their own, on this product's
    `/demographic/party_relationship/**` extension routes (no openEHR spec
    governs those routes — our own extension; register AMB-32 carries the
    missing released wire). That is the only reading under which the SM's
    `a_versioned_party_rel_id`, its own ORIGINAL_VERSION/CONTRIBUTION and its
    `versioned_object_does_not_exist` error mean anything.
    (b) An inline `relationships` list inside a committed PARTY body is
    RM-VALID DATA and is treated as such: it is accepted, validated against
    `PARTY.Relationships_validity` (present-implies-non-empty, and the
    source-identity arm where the body carries a uid to check it against), and
    stored and served VERBATIM as part of that party's version content, exactly
    as master02 L44/L48 require of a by-value compositional part.
    (c) The two are NOT synchronized in either direction — this is the point
    the released text leaves open and the register fixes. Committing a party
    with an inline relationship does NOT mint a relationship container, and
    creating a relationship container does NOT append to any party's
    `relationships` list. Auto-synchronizing would invent server behaviour no
    released sentence asks for, and would silently rewrite client-submitted
    party content; leaving each representation to carry exactly what its own
    writer wrote is the conservative reading. A deployment that wants one view
    of both reads the party for the by-value half and the relationship routes
    for the container half.
    The disjointness is ASSERTED, not merely stated: the inline half is pinned
    by I_DEMOGRAPHIC_SERVICE.create_party-inline_relationships_verbatim (an
    inline list survives a commit + read-back byte-for-byte, and no
    relationship container appears), and the container half by the
    create_party_relationship battery. Register AMB-32 carries the missing
    released wire for the container half and the undiscoverable inbound
    direction; AMB-130 carries the two defective PARTY_RELATIONSHIP invariants
    and reads the same inline structure this entry does.
  disposition: fixed_handling
  upstream_issue: 1670

AMB-188:
  ambiguity: >-
    THE VERSION SIGNATURE'S SERIALISATION IS EXPLICITLY UNDEFINED, AND THE
    DIGEST-ONLY DEPTH HAS NO WIRE SPELLING AT ALL. RM common
    master06-change_control_package.adoc §Digital Signature fixes the PROCESS
    completely — "a Version object (an `ORIGINAL_VERSION` or
    `IMPORTED_VERSION`) is serialised into canonical form which is then hashed
    to produce a digest", the serialisation being "the entire Version object
    (note that the signature attribute will be Void at this point)", "the
    result is then radix-64 encoded" — and then withdraws the one thing a
    second implementation would need to reproduce the bytes: "[.tbd] *To Be
    Determined*: The exact serialisation is not yet defined by openEHR, but
    ODIN might be preferred since it has an unambiguous encoding of object
    structures, whereas different XML libraries can generate different XML from
    the same objects". `VERSION.canonical_form()` states the same rule
    abstractly ("created by serialising all attributes except signature") and
    likewise names no format.
    A SECOND, NARROWER GAP sits inside the first. The section admits two depths
    of one mechanism — "If only the hashing step is done, the digest acts as a
    data integrity check … If the signing step is carried out, it authenticates
    the user as the author" — but gives a self-description rule for only one of
    them: "The openPGP standard ensures that the trasformations and algorithms
    used to create the signature are indicated within it" (upstream's
    "trasformations" typo quoted verbatim), which BASE
    architecture_overview/master07-security.adoc §Digital Signature explains as
    the reason openPGP was chosen at all — "A likely candidate for defining the
    signature and digest strings in openEHR … due to being an open
    specification and self-describing". A radix-64 digest carries no such
    envelope: nothing in either text says how a reader learns which hash
    algorithm and which encoding produced it.
  source: >-
    RM common master06-change_control_package.adoc §Digital Signature (the
    process paragraphs, the two-depths paragraph, the openPGP self-description
    sentence, and the `[.tbd]` block) + RM common
    UML/classes/org.openehr.rm.common.version.adoc §Functions
    (`canonical_form ()`: "A canonical serial form of this Version, created by
    serialising all attributes except signature, suitable for generating
    reliable hashes and signatures") + BASE
    docs/architecture_overview/master07-security.adoc §Digital Signature (the
    "open specification and self-describing" sentence) — all read first-hand.
    The ITS-REST docs text assigns nothing here: it carries `signature` as a
    VERSION member and never states how it is computed, and the released OAS
    types it `string` with no format — so both tiers of the wire oracle are
    silent and this is genuine spec silence.
  handling: >-
    Fixed handling, in two parts, both of them OUR OWN EXTENSION — no released
    openEHR text licenses either.
    (a) THE CANONICAL FORM is canonical openEHR JSON (the native ITS-JSON
    encoding this product already serves, `_type`-tagged, absent optionals
    omitted) with the top-level `signature` member removed, canonicalised per
    RFC 8785 (JSON Canonicalization Scheme). RFC 8785 supplies exactly what the
    `[.tbd]` says ODIN was wanted for — a byte-deterministic encoding (key
    order, number formatting, string escaping all pinned) — over the
    serialisation the REST wire already carries, so the signed bytes are
    reproducible by any reader of the served version without a second format in
    the system. The spec's own choice of ODIN is not taken, because it would
    mean signing bytes no API consumer ever sees.
    (b) THE DIGEST FORM is `sha256:` + standard-base64 of the raw digest. The
    prefix is the digest depth's stand-in for the self-description openPGP
    gives the signing depth: without it a bare radix-64 string names neither
    its algorithm nor its encoding, and the "indicated within it" property the
    spec relies on would simply not hold for the depth it also admits.
    Both parts are ASSERTED rather than merely declared: SIG-VERSION-verifiable
    reconstructs the canonical form from the READ-BACK envelope and verifies the
    stored signature against ixit-declared key material, in whichever mode the
    deployment runs (SIG-VERSION-verifiable-pgp is the openPGP half), and
    SIG-VERSION-at_committal_attestation_signed pins WHICH attributes enter the
    form. Because the posture is declared in the ixit rather than read off the
    wire, a party running a different canonicalisation records these cases
    against its own declaration; nothing here is imposed on another
    implementation, which is the honest consequence of the `[.tbd]`.
  disposition: fixed_handling

AMB-189:
  ambiguity: >-
    `VERSION.Preceding_version_uid_validity` IS UNSATISFIABLE FOR EVERY BRANCH
    VERSION OFF TRUNK NODE 1. The invariant is
    `uid.version_tree_id.is_first xor preceding_version_uid /= Void` (RM common
    UML/classes/org.openehr.rm.common.version.adoc §Invariants, L69). Its left
    operand is defined by BASE, not by the RM:
    `VERSION_TREE_ID.Is_first_validity` is `not is_first xor
    trunk_version.is_equal("1")` (BASE
    UML/classes/org.openehr.base.base_types.version_tree_id.adoc §Invariants,
    L64), i.e. `is_first` is TRUE exactly when the TRUNK part is "1" — it says
    nothing about the branch parts, and the same class's `is_first` function
    text agrees: "True if this version identifier corresponds to the first
    version, i.e. `_trunk_version_` is 1".
    Now take a branch version such as `1.1.1`. Its `trunk_version` is "1", so
    `is_first` is TRUE. It is also, necessarily, NOT a first version: a branch
    exists only as a fork FROM an existing trunk node, so it names that node in
    `preceding_version_uid` — master06 §Version Identification →
    §Local Versioning describes exactly this shape ("'1.1.1' (first version of
    first branch from trunk node 1)"), and §Distributed Versioning REQUIRES the
    form ("to require branching version identifiers to be used when local
    modifications are made to versions copied from elsewhere"). So both
    operands are TRUE and the XOR is FALSE, for every version of every branch
    forked from trunk node 1 — `1.1.1`, `1.1.2`, `1.2.1`, … A conforming
    instance cannot satisfy the invariant, and no reading of the two texts
    rescues it: `is_first` is a BASE-defined predicate over the trunk part
    alone, and the RM invariant consumes it unqualified.
  source: >-
    RM common UML/classes/org.openehr.rm.common.version.adoc §Invariants L69
    (`Preceding_version_uid_validity`: `uid.version_tree_id.is_first xor
    preceding_version_uid /= Void`) + BASE
    UML/classes/org.openehr.base.base_types.version_tree_id.adoc §Invariants L64
    (`Is_first_validity`: `not is_first xor trunk_version.is_equal("1")`) and
    §Functions (`is_first ()`: "True if this version identifier corresponds to
    the first version, i.e. `_trunk_version_` is 1") + RM common
    master06-change_control_package.adoc §Version Identification →
    §Local Versioning (the "'1.1.1' (first version of first branch from trunk
    node 1)" example) and §Distributed Versioning (branching identifiers
    required for modifications to copied versions) — all read first-hand.
  handling: >-
    Report only, no gate, and NO relaxation of the stored data. The rule the
    invariant was written to express is the TRUNK-ONLY one — a version has a
    predecessor exactly when it is not the first version of the trunk — and
    that is the sense enforced: a first trunk version is stored with no
    `preceding_version_uid`, and every other version, TRUNK OR BRANCH, carries
    the real `OBJECT_VERSION_ID` of the version it was committed against. A
    branch version therefore always names its fork point, which is the fact the
    §Distributed Versioning branching rule depends on and which the literal
    invariant would forbid. Nothing is loosened by this: the branch cases assert
    the served `preceding_version_uid` positively, so a version that LOST its
    predecessor fails, and the register entry exists so a future reader does not
    "fix" the store to satisfy a predicate the spec cannot satisfy either. This
    flips to an enforceable invariant if openEHR restates it over the whole
    `VERSION_TREE_ID` rather than over `is_first`.
  disposition: report_only
  upstream_issue: 1677

AMB-190:
  ambiguity: >-
    A CHANGE-KIND ROW NAMES A PROPERTY ON A CLASS THAT CANNOT HAVE IT. RM common
    master06-change_control_package.adoc §Contributions lists the attestation
    change kind as: "attestation of item: a new `ATTESTATION` is added to the
    attestations list of an existing `ORIGINAL_VERSION`; the
    `ATTESTATION._commit_audit_._change_type_` is set to the code
    `666|attestation|`" (L66). There is no such path. `ATTESTATION` has no
    `commit_audit` property: it IS an `AUDIT_DETAILS`
    (UML/classes/org.openehr.rm.common.attestation.adoc §Inherit:
    `AUDIT_DETAILS`), and `change_type` is one of the attributes it inherits
    from that parent
    (UML/classes/org.openehr.rm.common.audit_details.adoc §Attributes:
    `change_type: DV_CODED_TEXT` 1..1). `commit_audit` is a property of
    `VERSION` — "Audit trail corresponding to the committal of this version to
    the `VERSIONED_OBJECT`"
    (UML/classes/org.openehr.rm.common.version.adoc §Attributes) — and is
    exactly what the four SIBLING rows in the same list correctly write
    (`ORIGINAL_VERSION._commit_audit_._change_type_` for creation, deletion,
    amendment/modification; `IMPORTED_VERSION._commit_audit_._change_type_` for
    import). The attestation row appears to have been written by analogy with
    them, on a class that has no such attribute to write.
  source: >-
    RM common master06-change_control_package.adoc §Contributions L66 (the
    attestation change-kind row, quoted above) contrasted with the four sibling
    rows L60–L65 + UML/classes/org.openehr.rm.common.attestation.adoc §Inherit
    (`AUDIT_DETAILS`) and §Attributes (no `commit_audit`) +
    UML/classes/org.openehr.rm.common.audit_details.adoc §Attributes
    (`change_type` 1..1, and the `Change_type_valid` invariant binding it to the
    openEHR `audit change type` group) +
    UML/classes/org.openehr.rm.common.version.adoc §Attributes (`commit_audit`
    is VERSION's) — all read first-hand.
  handling: >-
    Editorial, with the repaired reading implemented. The row is read as
    `ATTESTATION.change_type` — the attribute the class actually has, at the
    only place a `666` could be recorded on an attestation — and that is what
    the server writes and serves: the attestation route stamps
    `666|attestation|` as the completed ATTESTATION's own inherited
    `change_type`, on both arrival routes (the `666` CONTRIBUTION member and the
    attestations committed with a version). No other reading is available:
    there is no attribute the literal path could denote, so treating the row as
    unimplementable would drop the only change kind the section defines for
    attestations. The repaired reading is asserted, not assumed — the
    attestation cases read the served `attestations[…]/change_type` back and
    require the `666` code — so a server that stopped stamping it fails. This
    entry exists so the defective path is reported rather than silently
    absorbed, and so a future reader does not go looking for
    `ATTESTATION.commit_audit`.
  disposition: editorial
  upstream_issue: 1678
AMB-191:
  ambiguity: >-
    SPEC SILENCE on distinguishing at-committal from post-committal
    attestations on the wire. RM common master06 §Digital Signature signs
    "the entire Version object" (only `signature` Void at that point), while
    §Attestation permits adding attestations "at any point in time after
    committal" — so attestations arriving later are necessarily OUTSIDE the
    signed form. But ORIGINAL_VERSION.attestations is one undistinguished
    list: no released attribute marks which members were present at
    committal, so an external verifier recomputing the canonical form over a
    post-committal-attested version cannot exclude the later members and
    will fail on a signature the server itself verifies.
  source: >-
    RM common master06-change_control_package.adoc §Digital Signature
    ("serialising the entire Version object (note that the signature
    attribute will be Void at this point)") and §Attestation ("at any point
    in time after committal") vs org.openehr.rm.common.original_version.adoc
    §Attributes (attestations: List<ATTESTATION> 0..1 — no committal-time
    discriminator). Confirmed first-hand.
  handling: >-
    Fixed handling, our own design where the release is silent: the store
    keeps a private at_committal discriminator per attestation; the signed
    canonical form includes exactly the at-committal members (commit-time
    bytes = served bytes by construction), and post-committal members are
    appended AFTER verification. The served list remains the released
    undistinguished shape — the discriminator has no wire counterpart, so
    external re-verification of post-committal-attested versions stays
    impossible until upstream defines the split; the SIG-VERSION at-committal
    case gates the direction that is verifiable.
  disposition: fixed_handling
AMB-192:
  ambiguity: >-
    PROSE-vs-SCHEMA CONTRADICTION on what a client-supplied `ehr_id` may be.
    The released `PUT /ehr/{ehr_id}` operation text admits the whole
    `HIER_OBJECT_ID` grammar at MUST strength with UUID only RECOMMENDED,
    while the `ehr_id` path parameter that same operation `$ref`s declares
    `type: string, format: uuid` — UUID-only, which an OAS-validating client
    or server enforces. Two conformant implementations therefore disagree
    about a `PUT /ehr/{oid-root}` request: one accepts an ISO-OID or
    internet-id rooted id, the other rejects it before dispatch.
  source: >-
    ITS-REST specifications/operations/ehr_create_with_id.yaml §description
    ("The value of the `ehr_id` unique identifier MUST be valid
    HIER_OBJECT_ID value. It is strongly RECOMMENDED that an UUID always be
    used for this.") contrasted with
    specifications/parameters/path/ehr_id.yaml §schema (`type: string`,
    `format: uuid`) — the same UUID-only shape in the bundled
    ehr-codegen.openapi.yaml §components.parameters.ehr_id and
    query-codegen.openapi.yaml §components.parameters.ehr_id_Query. The
    `HIER_OBJECT_ID` grammar the prose invokes is BASE
    base_types/master05-identification_package.adoc §Syntaxes
    (`hier_object_id = uid_based_id`, `root = uid`,
    `uid = iso_oid | uuid | internet_id`). All read first-hand.
  handling: >-
    Fixed handling: the PARAMETER SCHEMA reading is implemented — an `ehr_id`
    is UUID-only. The schema is the computable artifact that binds EVERY
    ehr_id-carrying operation rather than this one description, and the
    narrowing is independently grounded on how this CDR mints (uuidv7) and
    stores (PostgreSQL `uuid` columns) the value; a non-UUID id would enter a
    store and an AQL surface that cannot represent it. The choice is cited at
    the type that carries it (`app/ferroehr/src/ids.rs`), not left implicit,
    and the contradiction is reported upstream rather than silently resolved.
    Note the narrowing is real only for a CLIENT-supplied id on
    `PUT /ehr/{ehr_id}`: a server-minted id is a UUID either way.
  disposition: fixed_handling
  upstream_issue: 1711
AMB-193:
  ambiguity: >-
    MODEL-vs-PROSE TENSION on an entity-less (criteria-only) extract
    request. The RM ehr_extract prose says the request "may not specify any
    entities (it may rely on query criteria)", but the class model makes
    that request unrepresentable: EXTRACT_SPEC.manifest is 1..1 and
    EXTRACT_MANIFEST.entities carries item-cardinality 1..* in every
    published BMM generation, so no EXTRACT_SPEC can exist without naming
    at least one entity.
  source: >-
    RM ehr_extract master04-common_package.adoc §Content Specification
    ("whereas the request may not specify any entities (it may rely on
    query criteria)") contrasted with
    UML/classes/org.openehr.rm.ehr_extract.extract_spec.adoc §Attributes
    (manifest 1..1) + org.openehr.rm.ehr_extract.extract_manifest.adoc
    §Attributes (entities 1..1 List<EXTRACT_ENTITY_MANIFEST>) + the RM BMMs
    (1.0.4 / released 1.1.0 / 1.2.0), EXTRACT_MANIFEST.entities cardinality
    {lower: 1, upper_unbounded: true} — item count per LANG
    bmm_container_property.adoc §Attributes. All read first-hand.
  handling: >-
    The MODEL governs: a manifest names at least one entity, realized
    structurally in the generated types (an empty mandatory list is
    unrepresentable and refused at parse), and a criteria-only selection
    has no representable form until openEHR relaxes the cardinality or
    restates the prose. The catalogue carries the refusal twin
    (I_EHR_EXTRACT_SERVICE.export_ehr_extracts-empty_manifest) beside its
    one-entity acceptance sibling (-by_spec); the contradiction is
    reported upstream rather than silently resolved.
  disposition: report_only
  upstream_issue: 1735

AMB-194:
  ambiguity: >-
    SPEC SILENCE on the STATUS CODE of the §Incomplete Content rejection. RM
    common master06-change_control_package.adoc states the rejection itself in
    the indicative — content "missing mandatory data fields with respect to its
    generating archetypes … If being committed in the `complete` state, such
    data would be treated as invalid by the repository and rejected by the API"
    — but neither the ITS-REST docs text nor the released OAS assigns a status
    to it. The contribution operation's declared error responses
    (400_CONTRIBUTION, 404, 409 — contribution_create.yaml declares no 422
    branch at all; 422_COMPOSITION.yaml is the released response DEFINITION
    other commit operations reference) never name this trigger, and
    the overview's §HTTP status codes table describes the codes generically
    rather than per-rule. Two conformant implementations may therefore answer
    the same complete-but-incomplete commit 400 or 422.
  source: >-
    RM common master06-change_control_package.adoc §Incomplete Content ("would
    be treated as invalid by the repository and rejected by the API")
    contrasted with ITS-REST specifications/docs/overview/
    Requests_and_responses.md §HTTP status codes and
    specifications/operations/contribution_create.yaml §responses +
    specifications/responses/{400_CONTRIBUTION,422_COMPOSITION}.yaml — none of
    which names the trigger. All read first-hand.
  handling: >-
    Fixed handling: 422. The overview's own 422 row is written for exactly
    this shape — "The request was well-formed but was unable to be followed due
    to semantic errors" — and the released 422_COMPOSITION.yaml assigns 422 to
    committed content the server converts but cannot validate ("information
    about the errors in the provided COMPOSITION"), which is what a
    missing-mandatory-data commit is. 400 is reserved on this route for the
    SHAPE class the released 400_CONTRIBUTION.yaml enumerates ("could not be
    parsed … syntactically invalid header, parameter or content"), and a
    complete-but-incomplete body parses. The catalogue pins both directions:
    -complete_missing_mandatory (refused) beside -incomplete_missing_mandatory
    (the same content accepted at 553).
  disposition: fixed_handling

AMB-195:
  ambiguity: >-
    SPEC SILENCE on the WIRE TREATMENT of version-lifecycle transitions. RM
    common master06 §Version Lifecycle defines a formal state machine (its
    diagram) and §Abandoned and Inactive States tabulates seven transitions
    with named triggers (`abandon`, `retrieve`, `deactivate`, `reactivate`,
    `delete`), but the released REST surface exposes NONE of them as an
    operation: the only channel is the open `lifecycle_state` code on the
    commit wire (`openehr-version` header / `UPDATE_VERSION.lifecycle_state`).
    Two consequences are both unaddressed by released text: (a) nothing says
    whether a server must ENFORCE the table at all, and (b) no status code is
    assigned to a commit that asserts a transition the table does not list.
    The released error responses on the contribution and composition routes
    never name a lifecycle trigger.
  source: >-
    RM common master06-change_control_package.adoc §Version Lifecycle (the
    state-machine diagram, RM-version_lifecycle.svg) + §Abandoned and Inactive
    States (the seven-row transition table) contrasted with ITS-REST
    specifications/docs/overview/Requests_and_responses.md §"openehr-version
    and openehr-audit-details" (which offers only the code channel and says
    "None of these headers are mandatory, but whatever is provided it MUST be
    merged") and the released operations/responses for
    contribution_create / composition_{create,update,delete} — none of which
    declares a transition-legality branch. All read first-hand.
  handling: >-
    Fixed handling: the table is ENFORCED and an unlisted transition is 422.
    Enforcement follows from the state machine being NORMATIVE model content
    rather than commentary — a server that accepts any code from any state has
    not implemented `ORIGINAL_VERSION.lifecycle_state` as a state machine at
    all, only as a free-text field — and 422 is the overview's own row for a
    well-formed request whose semantics cannot be followed ("The request was
    well-formed but was unable to be followed due to semantic errors"). The
    catalogue carries one accepting case per named transition
    (-lifecycle_deactivate / -reactivate / -abandon / -retrieve) beside the
    refusal (-lifecycle_illegal_transition), plus -lifecycle_restore_from_deleted,
    which pins the implemented reading of the diagram's `revert` arrow out of
    `deleted` while that arrow's conflict with the §Logical Deletion prose is
    carried upstream.
  disposition: fixed_handling

AMB-196:
  ambiguity: >-
    The released COMMIT wire declares NO merge shape, while the RM defines
    merge provenance and the released READ wire serves it. RM common master06
    §Version Merging defines `ORIGINAL_VERSION.other_input_version_uids` with
    the derived `is_merged` and the `Is_merged_validity` invariant, and
    ITS-REST `schemas/ehr/OriginalVersion.yaml` declares the property on
    reads — but `schemas/ehr/UpdateVersion.yaml` declares no such property and
    `schemas/ehr/NewContribution.yaml` types `versions` items as
    `UpdateVersion` with no `oneOf` and no `_type` discriminator. A locally
    performed merge is therefore unrepresentable on the released wire: merge
    provenance is produce-only. This is the same absence AMB-89 records for the
    IMPORT commit, one property over.
  source: >-
    RM common master06-change_control_package.adoc §Version Merging +
    UML/classes/org.openehr.rm.common.original_version.adoc §Attributes
    (other_input_version_uids) / §Invariants (Is_merged_validity) contrasted
    with ITS-REST specifications/schemas/ehr/{UpdateVersion,NewContribution}.yaml
    (no merge shape) vs specifications/schemas/ehr/OriginalVersion.yaml (the
    property declared on the read side); SM UML/classes/update_version.adoc
    likewise carries no such attribute. All read first-hand.
  handling: >-
    Fixed handling, mirroring AMB-89: this server does NOT accept
    `other_input_version_uids` on the commit wire — an undeclared member on a
    released schema is refused as the shape failure the released
    400_CONTRIBUTION.yaml describes ("syntactically invalid … content").
    Accepting it would let a client stamp provenance the repository never
    performed onto a version, feeding `Is_merged_validity` and the VERSION
    signature. Merge provenance stays PRODUCE-only: it is served on reads, and
    it reaches storage only through the routes that reproduce a FOREIGN
    `ORIGINAL_VERSION` verbatim (master06 §Copying — "the `ORIGINAL_VERSION`
    instance is never modified") — our own-design EHR-Extract import and
    archive load. The catalogue carries the refusal beside its accepting twin
    (-merge_provenance_member).
  disposition: fixed_handling

AMB-197:
  ambiguity: >-
    MODEL CONTRADICTION between the version-identification prose and the two
    invariants that read the same identifier. BASE `VERSION_TREE_ID` declares
    `Is_first_validity`: `not is_first xor trunk_version.is_equal("1")` — so
    `is_first` is TRUE for EVERY version whose trunk part is 1, branch versions
    included. RM `VERSION` then declares `Preceding_version_uid_validity`:
    `uid.version_tree_id.is_first xor preceding_version_uid /= Void` — so a
    version with `is_first` TRUE must have NO preceding version. Together they
    forbid a `preceding_version_uid` on `1.1.1`, `1.1.2`, `1.2.1` … — every
    version on every branch off trunk node 1. Yet master06 §Local Versioning
    presents exactly `1.1.1` as a normal identifier ("first version of first
    branch from trunk node 1"), and a branch version by definition succeeds the
    trunk node it branches from. The model as written makes the whole
    first-trunk-node branch family unrepresentable.
  source: >-
    BASE UML/classes/org.openehr.base.base_types.version_tree_id.adoc
    §Invariants (Is_first_validity) + RM UML/classes/
    org.openehr.rm.common.version.adoc §Invariants
    (Preceding_version_uid_validity) contrasted with RM common
    master06-change_control_package.adoc §Local Versioning ("version numbers
    like '1.1.1' (first version of first branch from trunk node 1) … are
    possible"). All read first-hand.
  handling: >-
    Report only — the PROSE governs and the implementation follows it: a branch
    version off trunk node 1 is minted with its true `preceding_version_uid`,
    which is what makes the version tree navigable at all and what §Local
    Versioning's own example requires. `is_first` is implemented as the BASE
    accessor the class table defines (`trunk_version = "1"`), so no local
    rewriting of either invariant hides the contradiction; the conflict is
    reported upstream rather than silently resolved, and no catalogue case
    gates on the invariant pair.
  disposition: report_only
  upstream_issue: 1749

AMB-198:
  ambiguity: >-
    CROSS-COMPONENT CONFLICT on the served shape of an IMPORTED_VERSION: the
    RM makes `data` an effected FUNCTION over the wrapper's `item` while the
    released OAS makes it a REQUIRED serialized property. RM
    `IMPORTED_VERSION` declares exactly one own attribute, `item:
    ORIGINAL_VERSION 1..1`, and lists `uid`, `preceding_version_uid`,
    `lifecycle_state` and `data` under §Functions as `(effected)` computations
    — `data` "derived as item.data" — so none of the four is a serialized
    attribute. ITS-XML agrees structurally: its abstract `VERSION` carries only
    `contribution`, `commit_audit` and an optional `signature`, `data` is
    declared on `ORIGINAL_VERSION`, and `IMPORTED_VERSION` extends `VERSION`
    with the single `item` element. The released OAS disagrees: its `Version`
    schema lists `data` under `required` and `ImportedVersion` inherits that
    base through `allOf`, so every
    `UMImportedVersionOf{Composition,EhrStatus,Party}` read is schema-invalid
    unless the whole payload is emitted TWICE — once at the top level and once
    inside `item.data` — with no consistency rule stated anywhere for the two
    copies. The ITS-REST docs text is silent on the shape, so the oracle order
    would otherwise let the OAS ground it — against two other released
    components.
  source: >-
    RM common UML/classes/org.openehr.rm.common.imported_version.adoc
    (§Attributes: item only; §Functions: uid / preceding_version_uid /
    lifecycle_state / data all `1..1 (effected)`, data "Original content of
    this Version", derived from item) + RM common
    master06-change_control_package.adoc §Copying ("the ORIGINAL_VERSION
    instance is never modified"); ITS-XML
    components/RM/Release-1.1.0/Common.xsd (VERSION: contribution /
    commit_audit / signature only; IMPORTED_VERSION extends it with `item`);
    ITS-REST OAS ehr-codegen.openapi.yaml schemas Version (required:
    contribution, commit_audit, data) + ImportedVersion (allOf Version,
    required: item); ITS-REST specifications/docs/ (no sentence on the
    IMPORTED_VERSION payload). All read first-hand.
  handling: >-
    Fixed handling: the wire follows the MODEL, not the OAS defect. A served
    IMPORTED_VERSION is `{_type, contribution, commit_audit, item}` plus the
    optional `signature` — the four things the RM and ITS-XML agree are its
    serialized state — and carries NO top-level `data`. Emitting one would
    duplicate the entire clinical payload with no rule saying which copy wins
    when they differ, and would contradict both the RM's `(effected)` typing
    and the ITS-XML content model; the `item` a consumer already receives is
    the byte-faithful copy master06 §Copying requires, so nothing is lost. The
    omission is DELIBERATE and pinned by an asserted test on the served shape,
    never accidental. This is the third instance of the same released-OAS
    defect family reported upstream as #1750 (`Version.yaml` treating `data` as
    required state rather than as `ORIGINAL_VERSION.data 0..1`): the first two
    are the deletion commit and the deleted-version read.
  disposition: fixed_handling
  upstream_issue: 1750

AMB-199:
  ambiguity: >-
    GENUINE MODEL CONTRADICTION inside master06 §Semantics in Distributed
    Systems: two rules fire on the identical observable state and impose
    opposite obligations, with no marker, procedure or suspension clause
    distinguishing them. §Copying §Subsequent Local Modifications requires a
    system committing new content onto a version copied from elsewhere to
    BRANCH — "When new versions are added locally to a copied object, the local
    system id is recorded in the uid.creating_system_id() attribute, while
    branching numbering is used in the uid.version_tree_id()", reinforced by
    §Version Identification §Distributed Versioning ("to require branching
    version identifiers to be used when local modifications are made to
    versions copied from elsewhere"). §Moving Version Containers requires the
    opposite for a moved container: "subsequent versions of the content created
    in a moved version container will now have the uid.creating_system_id set
    to the id of the new system … the uid.creating_system_id value can change
    in the trunk line". The trigger both rules see is the same — the local
    system commits onto a tip whose creating_system_id is not its own — and
    §Moving Version Containers defines no procedure, no state marker and no
    wire operation, so nothing at the data level tells a receiver which rule
    applies.
  source: >-
    RM common master06-change_control_package.adoc §Semantics in Distributed
    Systems (§Copying §The Copy Operation + §Subsequent Local Modifications;
    §Moving Version Containers) and §Version Identification §Distributed
    Versioning; contrasted with the released ITS-REST surface, which publishes
    no container-move operation at all (0 of 97 operations). All read
    first-hand.
  handling: >-
    Report only — the implementation follows §Copying, which is the rule with a
    procedure, a worked figure and a realized wire behind it; §Moving Version
    Containers has none of the three. The commit engine therefore forks a
    branch whenever the tip's creating system is not the local one, which makes
    §Moving's trunk continuation unrepresentable THROUGH THE COMMIT ENGINE. The
    consequence is bounded and deliberate rather than hidden: storage and every
    read path tolerate a trunk whose creating_system_id changes along the line,
    so a container that ARRIVES already carrying such a lineage (an archive
    load, an EHR-Extract import) is stored and served correctly — what no local
    write can do is CREATE one. Trunk POSITIONS stay unique across creating
    systems either way (both readings agree the trunk is one global sequence),
    which the storage layer enforces. No catalogue case gates on the
    contradiction: neither branch of it is reachable over the released wire.
  disposition: report_only
  upstream_issue: 1767

AMB-200:
  ambiguity: >-
    Whether the SM `I_TDD_SERVICE.import_tdd` route IS the feeder-system
    acquisition RM ehr master04 §Versioning Scenarios describes as Case 2 is
    unstated. Case 2 says "information received from a feeder system, e.g. a
    test result, which will be converted and used to create a new
    IMPORTED_VERSION<COMPOSITION> and ORIGINAL_VERSION<COMPOSITION> pair", but
    it names no operation, and the SM describes import_tdd only as "Import a
    TDD" — binding it to no versioning scenario at all. A literal reading of
    Case 2 applied to this route would have the receiver SYNTHESIZE the wrapped
    ORIGINAL_VERSION, which the copy semantics elsewhere forbid.
  source: >-
    RM ehr master04-ehr_package.adoc §Versioning Scenarios (Case 2 + the
    summary sentence that follows the case list) contrasted with SM
    UML/classes/i_tdd_service.adoc §import_tdd ("Import a TDD"), RM common
    UML/classes/org.openehr.rm.common.imported_version.adoc (item:
    ORIGINAL_VERSION 1..1) and RM common master06-change_control_package.adoc
    §Copying. All read first-hand.
  handling: >-
    Fixed handling: a TDD import commits a PLAIN LOCAL ORIGINAL_VERSION. The
    Case-2 pair is unconstructible from a TDD — IMPORTED_VERSION.item is an
    ORIGINAL_VERSION whose uid (an OBJECT_VERSION_ID naming a creating system
    and a version-tree position), contribution and commit_audit are all
    mandatory, and a Template Data Document carries none of them, so building
    the pair would fabricate a foreign version identity for a version that
    never existed anywhere. That contradicts the governing property of the
    wrapper (master06 §Copying: "the ORIGINAL_VERSION instance is never
    modified - it remains a faithful copy of its original"): there is no
    original to be faithful to. The spec's own mechanism for feeder provenance
    is content, not versioning, and master04 states it immediately after the
    case list — "the AUDIT_DETAILS is always used to document the addition of
    information locally, regardless of where it has come from. If there is a
    need to record original audit details (via the COMPOSITION._feeder_audit_),
    they become part of the content of the versioned object." A converted TDD
    carrying COMPOSITION.feeder_audit therefore keeps its provenance through
    this route, inside the committed content, while the commit's own
    AUDIT_DETAILS documents the local addition. The route rides the
    message-tdd extension surface (register AMB-34), so no released-wire
    conformance claim rests on the choice.
  disposition: fixed_handling

AMB-201:
  ambiguity: >-
    Whether a served ITEM_TAG may carry `_type` is decided by the released OAS
    against itself. `schemas/common/ItemTag.yaml` is `additionalProperties:
    false` and its `properties` block enumerates key/value/target_path/target/
    owner_id — no `_type`. The same released group nevertheless declares
    `discriminator.propertyName: _type` for the ITEM_TAG family, and a
    discriminator's whole function is to be READ off the instance
    (OpenAPI 3.0 §Discriminator Object). So the schema forbids the exact member
    it simultaneously nominates as the type discriminator: a schema-valid
    instance cannot carry the discriminator the schema declares, and an
    instance that carries it is schema-invalid. The ITS-REST docs text is
    silent — `Resources.md` §JSON Format neither requires nor forbids `_type`
    on a concrete standalone type — so nothing above the OAS breaks the tie,
    and the OAS is self-contradictory rather than merely silent.
  source: >-
    ITS-REST specifications/schemas/common/ItemTag.yaml (properties +
    additionalProperties: false) contrasted with the ITEM_TAG group's
    discriminator.propertyName: _type, and with
    specifications/docs/overview/Resources.md §JSON Format; RM common
    UML/classes/org.openehr.rm.common.item_tag.adoc (the class the payload
    realizes). All read first-hand.
  handling: >-
    Fixed handling: served ITEM_TAGs CARRY `_type: "ITEM_TAG"`, on both the EHR
    and the demographic families. Of the two readings the OAS supports, this is
    the one the rest of the release corroborates: `_type` is the canonical-JSON
    self-tagging every other concrete RM payload this server emits carries, the
    discriminator the OAS itself declares names it, and a client that reads the
    discriminator per the OpenAPI specification finds it. The alternative
    honours `additionalProperties: false` literally and breaks the
    discriminator, which no client can then use for anything. The asymmetry
    matters for a payload that has no other type marker: an ITEM_TAG carries no
    `uid` and no archetype id, so `_type` is its only self-description.
    ACCEPTED CONSEQUENCE, stated rather than hidden: a strict validator run
    against the released ItemTag schema will reject our served tags on the
    `additionalProperties` clause. That is a property of the contradiction, not
    of the choice — the other branch fails the discriminator clause of the same
    document. Reported upstream (#1799 item 5): remove
    `additionalProperties: false`, or declare `_type`, or drop the
    discriminator.
  disposition: fixed_handling
  upstream_issue: 1799

AMB-202:
  ambiguity: >-
    ITEM_TAG.target is typed two incompatible ways by two RELEASED artifacts,
    and the documented oracle order does not reach the conflict. RM common
    UML/classes/org.openehr.rm.common.item_tag.adoc types `target:
    UID_BASED_ID 1..1` — a BARE identifier ("Identifier of target, which may be
    a `VERSIONED_OBJECT<T>` or a `VERSION<T>`"). The released OAS types the
    same attribute as an OBJECT_REF WRAPPER
    (`schemas/base_types/UObjectRefOfUidBasedId.yaml`: an object with
    {id, namespace, type}). The two are not reconcilable by reading — one is a
    scalar identifier, the other a three-member object — and the ITS-REST DOCS
    TEXT never mentions `target` at all, so the docs-text-wins rule has nothing
    to say and the docs-text-silent-so-the-OAS-grounds-it rule would hand the
    conflict to the OAS by default. That default is wrong here, and the
    register owns the reason rather than leaving it to a rule that was written
    for a different question.
  source: >-
    RM common UML/classes/org.openehr.rm.common.item_tag.adoc §Attributes
    (`target: UID_BASED_ID 1..1`) contrasted with ITS-REST
    specifications/schemas/common/ItemTag.yaml (`target: $ref
    ../base_types/UObjectRefOfUidBasedId.yaml`) and
    specifications/schemas/base_types/UObjectRefOfUidBasedId.yaml; the ITS-REST
    docs text (specifications/docs/**) contains no occurrence of the attribute.
    All read first-hand.
  handling: >-
    Fixed handling: the RM shape wins — `target` is served as a BARE
    UID_BASED_ID (a HIER_OBJECT_ID for a container target, an
    OBJECT_VERSION_ID for a VERSION target), on both tag families. The reason
    is a distinction the oracle order's docs-text-vs-OAS rule does not draw:
    the OAS is the wire PROJECTION of a model, and RM is the released
    definition of the model being projected. Where a projection disagrees with
    its own subject about what an attribute IS — not about how it is
    transported — the subject decides, or the wire stops describing the RM at
    all. The concrete stakes are the two-arity targeting the RM sentence exists
    to state: an OBJECT_REF wrapper's `type` member would have to say
    VERSIONED_COMPOSITION or ORIGINAL_VERSION redundantly with what the id's
    own syntax already says (BASE master05 §Syntaxes — an OBJECT_VERSION_ID is
    recognisable by its `::` structure), and a client would then have two
    disagreeing places to read the arity from. The same ordering was applied to
    ITEM_TAG.owner_id's VALUES in register AMB-137, which took the released
    examples as informative for a field the RM leaves open; this entry is the
    complement — the SHAPE, where the RM is not open at all. Reported upstream
    (#1799): state which artifact governs an RM class's attribute types when
    the OAS projection diverges.
  disposition: fixed_handling
  upstream_issue: 1799

AMB-203:
  ambiguity: >-
    The openehr-item-tag / openehr-version-item-tag header grammar is defined
    by ONE worked example and nothing else. ITS-REST overview
    Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag
    says only that "Tag values are provided as a list of key-value pairs,
    separated by semicolons" and shows `key="reviewed",value="true";
    key="flag",value="follow-up",target_path="/composition/start_time/value"`.
    There is no ABNF, no statement of which characters may appear unquoted, no
    escaping rule, and no statement of what a quoted run means. That leaves two
    concrete questions undecided: (a) whether a `;` INSIDE a quoted value ends
    the entry — which is not hypothetical, because the same section's own
    `target_path` token is a path and RM common
    UML/classes/org.openehr.rm.common.item_tag.adoc admits an AQL path there,
    whose predicates may carry `;` inside quoted strings; and (b) what a server
    does with a syntactically parseable entry that carries no `key`.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md §openehr-
    item-tag and openehr-version-item-tag (the whole section — the example is
    the only grammar given); ITS-REST specifications/headers/openehr-item-tag.yaml
    and openehr-version-item-tag.yaml (a `schema: type: string` with the same
    example, no `pattern`); ITS-REST specifications/schemas/common/UpdateItemTag.yaml
    (`required: [key]`); RM common UML/classes/org.openehr.rm.common.item_tag.adoc
    (target_path: "archetype (i.e. AQL) or RM path"). All read first-hand.
  handling: >-
    Fixed handling, in two parts. (a) A DOUBLE-QUOTED RUN IS OPAQUE at the
    entry separator: the `;` split skips any `;` between quotes, the same way
    the pair scanner already treats a quoted value as opaque at the `,` level.
    This is the only reading under which the section's own `target_path`
    example generalizes to the paths the RM says may appear there; the
    alternative shatters such an entry into fragments that then parse as
    garbage, silently. (b) A NON-BLANK ENTRY WITH NO `key` IS REFUSED 400. The
    header is declared "a convenient wrapper around the dedicated ITEM_TAG
    operations", and `key` is the one REQUIRED member of the operation's own
    UPDATE_ITEM_TAG schema — a wrapper cannot admit what the operation it wraps
    refuses, and skipping the entry would silently drop a tag the client
    believes it set (the never-lax rule). A BLANK segment — a trailing `;`, or
    an empty repeat of the header — carries no entry at all and is NOT an
    error, because the release gives an empty header value its own meaning
    ("Providing an empty value for this header will effectively remove all
    ITEM_TAGs"). Reported upstream (#1800): publish an ABNF for the header
    value, including quoting and escaping.
  disposition: fixed_handling
  upstream_issue: 1800

AMB-204:
  ambiguity: >-
    The release assigns the ITEM_TAG wrapper headers no atomicity semantics.
    ITS-REST overview Requests_and_responses.md §openehr-item-tag and
    openehr-version-item-tag §Usage in Requests says what the header MEANS on a
    PUT/POST ("the header instructs the system which ITEM_TAG list should be
    associated with the target VERSION or VERSIONED_OBJECT resource") and
    nothing whatever about what happens when the tag list cannot be honoured
    while the content can. Every operation carrying the header declares its
    ordinary content statuses (201/200/204 plus the content error branches) and
    none declares a tag-specific failure branch, so the wire itself does not
    say whether such a request is a success with the tags dropped, a failure
    with the content committed, or a failure with nothing committed. The
    question is forced, not academic: a tag list can fail the RM ITEM_TAG
    invariants (a key with surrounding whitespace, a set-but-empty value) that
    the content passes.
  source: >-
    ITS-REST specifications/docs/overview/Requests_and_responses.md §openehr-
    item-tag and openehr-version-item-tag (both usage sub-sections, read in
    full); the operation files that carry the request headers
    (composition_create/composition_update/ehr_status_update/directory_create/
    directory_update and the five demographic create/update ops — none declares
    a tag-failure branch); RM ehr master04-ehr_package.adoc §Tags ("they do not
    cause re-versioning of the content"); RM common
    UML/classes/org.openehr.rm.common.item_tag.adoc §Invariants. All read
    first-hand.
  handling: >-
    Fixed handling: VALIDATE FIRST, WRITE AFTER. The wrapper headers are parsed
    and invariant-checked BEFORE the content commit, so a defective tag list
    refuses the whole request with nothing durable; the tag WRITE itself stays
    after the commit, because the tags target the version the commit mints and
    RM ehr master04 §Tags forbids the tag from causing re-versioning of that
    content. The split is what makes both properties hold at once. The rejected
    alternative — apply the tags after the commit and fail there — answers 4xx
    for a request whose VERSION is already durable and whose response therefore
    carries no ETag and no Location, leaving the client no way to learn what it
    just created: its only recovery is to re-POST, duplicating clinical
    content. Nothing in the release prefers that outcome, and the RM's own
    separation of tags from content ("tags … have no direct association with
    the objects they annotate") is easier to honour when the tag judgement
    happens before the content is touched at all. Reported upstream (#1800):
    state the failure semantics of the wrapper headers.
  disposition: fixed_handling
  upstream_issue: 1800

AMB-205:
  ambiguity: >-
    The released UpdateItemTag schema is strict — `additionalProperties: false`
    over exactly key/value/target_path, with `key` required — but NOTHING
    released says what a server does when a body violates that strictness. The
    ITS-REST docs text never discusses the tag write body's member set at all,
    so the schema itself is the only source (which the oracle order accepts for
    a docs-text-silent behaviour); but the schema is a shape, not a wire
    outcome, and the seven tag PUTs' response sets declare only 200/204/400/404
    with the 400 described as "the request could not be parsed or is invalid".
    Two shapes fall in the gap: a member the schema does not declare (`target`,
    `owner_id`, `_type`, anything), and a declared member of the wrong JSON
    type (`"value": 42`). Neither is malformed JSON, so neither is obviously
    the declared 400; and neither is an RM-invariant failure, so AMB-93's 422
    branch does not reach them either.
  source: >-
    ITS-REST specifications/schemas/common/UpdateItemTag.yaml (required: [key];
    properties key/value/target_path; additionalProperties: false);
    specifications/operations/{composition,ehr_status,person,agent,group,
    organisation,role}_tags_update.yaml (responses 200/204/400/404);
    specifications/responses/400.yaml ("returned when the request could not be
    parsed or is invalid"); specifications/docs/** (no occurrence of the write
    body's member set). All read first-hand.
  handling: >-
    Fixed handling: BOTH shapes are refused 400, naming the offending member by
    its JSON path. The strictness itself is the release's, not ours — the
    schema states it, and under the oracle order a docs-text-silent behaviour
    is grounded by the released OAS — so the only question this entry decides
    is the STATUS, and 400 is the one branch the operations declare that can
    carry it: a body that violates the declared request schema is content that
    "is invalid" in the words of the declared 400, whereas 422 is reserved by
    AMB-93 for a body that satisfies the schema and then fails an RM invariant.
    The refusal is total (nothing is stored) and both shapes carry asserted
    negative tests beside their accepting twins. What this rules OUT is the
    tolerant read: silently ignoring an undeclared member, or reading a
    non-string `value` as ABSENT. The second is the reason this entry is
    fixed_handling rather than a shrug — a numeric `value` read as absent
    stores a tag with no value at all, which is a silent loss of clinical
    annotation, and a non-string `target_path` read as absent silently changes
    the tag's IDENTITY (the (key, target_path) pair) so the client's later
    delete addresses nothing. Reported upstream (#1800): assign a status to a
    request-schema violation on the tag PUTs.
  disposition: fixed_handling
  upstream_issue: 1800

AMB-206:
  upstream_issue: 1834
  ambiguity: >-
    'Latest available version' is undefined when a container carries TWO open
    lineage heads. The default Extract request has no version specification,
    "corresponding to the assumption of 'latest available version' for each
    matched item" (RM ehr_extract master04-common_package.adoc §Version
    Specification), and the only switch the spec offers beside it is
    `include_all_versions`, which returns "the whole version stack". Neither
    sentence says WHICH head is latest when a trunk head (`::2`) and a branch
    head (`::1.1.1`) are both current — and RM common master06 §Semantics in
    Distributed Systems makes coexisting lineages a normal state, not an
    error. The RM itself names the two readings without choosing between them
    for an Extract: VERSIONED_OBJECT declares BOTH `latest_version()` and
    `latest_trunk_version()` as distinct functions (RM common
    UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions), so a
    conformant implementation could defensibly export either head, or both.
  source: >-
    RM ehr_extract master04-common_package.adoc §Version Specification (read
    first-hand): "An Extract request in its simplest form has no version
    specification, corresponding to the assumption of 'latest available
    version' for each matched item", and the two enumerated possibilities
    (`include_all_versions`, `include_revision_history`) — no third setting
    and no lineage rule. RM ehr_extract
    UML/classes/org.openehr.rm.ehr_extract.extract_version_spec.adoc
    §Attributes: `include_all_versions` "forces all versions to be included",
    so its FALSE branch is exactly the undefined one. RM common
    UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions:
    `latest_version()` and `latest_trunk_version()` are separate functions
    over the same container. No released sentence in either component picks
    one for the Extract, and the ITS-REST release publishes no MESSAGE API at
    all (register AMB-34), so no wire source narrows it either.
  handling: >-
    Fixed handling: the default (non-`include_all_versions`) Extract includes
    the TRUNK head of each matched container and no branch head. The reason is
    the RM's own trunk-first reading of "latest": master06 §The 'Virtual
    Version Tree' makes the trunk the lineage every branch descends from,
    `VERSIONED_OBJECT.latest_trunk_version()` names it without qualification,
    and a branch is by construction a local divergence that may never have
    been propagated — the same asymmetry master04 already relies on when it
    warns that an Extract returns "all available versions from the repository
    in question", not all that exist. Exporting a branch head under a request
    that asked for the latest version would hand the receiver a version whose
    trunk successor it never sees, so the fixed choice is the conservative
    one; a caller that wants the branch asks for the whole stack with
    `include_all_versions`, which the same section defines. Pinned by
    `I_EHR_EXTRACT_SERVICE.export_ehr_extracts-latest_across_lineages`, whose
    container holds trunk `::2` and branch `::1.1.1` at once.
  disposition: fixed_handling

AMB-207:
  ambiguity: >-
    The REJECTION of a template-INDEPENDENT Simplified-Format violation is
    mandated, but no released text assigns it a status. ITS-REST
    docs/simplified_formats/master04-basic_concepts.adoc §"Open Value-Sets and
    the `|other` Suffix" states the rule in the imperative — "`|other` is
    mutually exclusive with `|code`, `|value` and `|terminology` on the same
    leaf path; servers MUST reject combinations" — and the sibling bullet adds
    "`|other` MUST be rejected when the constraint is closed". Neither bullet,
    nor any other sentence of that chapter, names a status code. The overview
    chapter that DOES assign codes to the simplified formats
    (specifications/docs/overview/Resources.md §Simplified Formats) assigns
    only 415 (payload format not supported) and 406 (response format not
    acceptable) — nothing for a body that IS in the format and violates its
    own suffix grammar. The released OAS does not narrow it either: the
    composition write operations declare both 400 and 422, and neither
    response file binds itself to this trigger. So the wire answer is
    genuinely open between the two refusal rows.
  source: >-
    ITS-REST docs/simplified_formats/master04-basic_concepts.adoc §"Open
    Value-Sets and the `|other` Suffix" (the two MUST-reject bullets, no
    status); ITS-REST specifications/docs/overview/Resources.md §Simplified
    Formats (415 and 406 only); ITS-REST specifications/responses/400.yaml
    ("returned when the request could not be parsed or is invalid (e.g.
    malformed request URL syntax, missing required header or parameter, or
    syntactically invalid header, parameter or content)");
    specifications/responses/422.yaml ("returned when the content type and
    syntax is correct, could be converted to a resource, but there are
    semantic validation errors, such as the underlying template is not known
    or is not validating the supplied resource"). All read first-hand.
  handling: >-
    Fixed handling: a template-INDEPENDENT Simplified-Format violation is
    refused 400. The discriminator is decidability: the `|other`/`|code`
    conflict is a property of the submitted document's own suffix grammar and
    is detected without consulting any Operational Template, so it never
    reaches the stage `responses/422.yaml` describes — the body cannot be
    "converted to a resource" in the first place, which is exactly the
    unconvertible half `responses/400.yaml` owns as "syntactically invalid
    ... content". The complementary template-MEDIATED half is AMB-208's 422.
    Pinned by `SF-FLAT-reject_other_with_code`.
  disposition: fixed_handling

AMB-208:
  ambiguity: >-
    The status of a template-MEDIATED Simplified-Format validation failure is
    likewise unassigned. ITS-REST
    docs/simplified_formats/master04-basic_concepts.adoc §Validation
    enumerates the checks — "Mandatory context fields (language, territory)
    are present", "Data types match expected types from the Operational
    Template", "Terminology bindings are valid" — without a status code, and
    the overview's §Simplified Formats assigns only 415 and 406. The two
    refusal rows the composition write operations declare therefore both
    remain candidates for this class.
  source: >-
    ITS-REST docs/simplified_formats/master04-basic_concepts.adoc §Validation
    (the enumerated checks, no status); ITS-REST
    specifications/docs/overview/Resources.md §Simplified Formats (415 and 406
    only); ITS-REST specifications/responses/422.yaml ("returned when the
    content type and syntax is correct, could be converted to a resource, but
    there are semantic validation errors, such as the underlying template is
    not known or is not validating the supplied resource");
    specifications/responses/400.yaml (the unconvertible half). All read
    first-hand.
  handling: >-
    Fixed handling: a template-MEDIATED Simplified-Format validation failure
    is refused 422. Every check master04 §Validation lists is stated as a
    comparison against the Operational Template, so the failure IS the
    released 422 trigger in its own words — the template "is not validating
    the supplied resource". The NOTED ALTERNATIVE, recorded because it is a
    defensible reading of the same file: `responses/422.yaml` opens with
    "could be converted to a resource", and a Simplified-Format body that
    fails one of these checks may never yield a COMPOSITION at all, which
    would put every FLAT conversion failure on the 400 row and leave the 422
    branch for simplified formats populated only by "the underlying template
    is not known". That reading is not taken, because it makes the 422
    clause's own second half ("or is not validating the supplied resource")
    unreachable for the one format whose validation the release describes at
    length. The complementary template-INDEPENDENT half is AMB-207's 400.
    Pinned by `SF-FLAT-reject_datatype_mismatch`, `SF-CTX-missing_mandatory`
    and `SF-FLAT-reject_terminology_binding`.
  disposition: fixed_handling

AMB-209:
  ambiguity: >-
    Which refusal row a MALFORMED-URI value takes is unassigned. The
    parse/semantic boundary the released OAS draws — `responses/400.yaml`
    "syntactically invalid header, parameter or content" versus
    `responses/422.yaml` "could be converted to a resource, but there are
    semantic validation errors" — separates a body that cannot become the
    resource from one that becomes it and then fails validation. A `DV_URI`
    whose `value` is a present String that is not an RFC 3986 URI sits on the
    seam: the JSON is well-formed, every member the request-body schemas
    declare `required` is present, and the String IS a String, so the
    structure converts; but the word "syntactically" in the 400 row can also
    be read to reach a value whose own lexical form is wrong. Nothing
    released picks a side, and the RM does not settle it either: the only
    invariant `DV_URI` declares is `Value_valid: not value.is_empty`, while
    the RFC 3986 requirement lives in the class DESCRIPTION — which in the
    same breath permits "so-called 'plain-text URIs' that contain RFC-3986
    forbidden characters such as spaces etc". So the status is ours to fix.
  source: >-
    ITS-REST specifications/responses/400.yaml ("returned when the request
    could not be parsed or is invalid (e.g. malformed request URL syntax,
    missing required header or parameter, or syntactically invalid header,
    parameter or content)"); specifications/responses/422.yaml ("returned
    when the content type and syntax is correct, could be converted to a
    resource, but there are semantic validation errors");
    specifications/docs/overview/Requests_and_responses.md §HTTP status codes
    (the two rows, neither drawing the boundary). RM
    UML/classes/org.openehr.rm.data_types.dv_uri.adoc §Description ("A
    reference to an object which structurally conforms to the Universal
    Resource Identifier (URI) RFC-3986 standard", plus the plain-text
    allowance) and §Invariants (`Value_valid: not value.is_empty` — the ONLY
    declared invariant); RM
    UML/classes/org.openehr.rm.data_types.dv_ehr_uri.adoc §Invariants
    (`Scheme_valid`). All read first-hand.
  handling: >-
    Fixed handling: a malformed-URI value is refused 422, NOT 400. The
    discriminator is convertibility, applied literally: the body decodes into
    the declared `DV_URI` structure — a present String in a String-typed
    mandatory attribute — so it HAS been "converted to a resource" in the
    words of `responses/422.yaml`, and what fails afterwards is a check on
    that value's domain. That places it with the `rm_invariant(...)` and
    interval-bound refusals, not with the missing-mandatory-attribute
    refusals that never convert at all. The practical reason to hold this
    line: the 400 row's trigger is "the request could not be PARSED", and a
    parser that produced the value cannot claim it failed to parse it.
    The NOTED ALTERNATIVE, recorded because it is a defensible reading of the
    same sentence: "syntactically invalid ... content" can be read to cover a
    value whose own lexical form is invalid, which would move this class to
    400 and make the boundary "does every value satisfy its lexical grammar"
    rather than "does the body convert". That reading is not taken, because
    it has no stopping point — every format-constrained leaf (ISO 8601
    durations, terminology codes, archetype ids) would migrate to 400 with
    it, collapsing the 422 branch that `responses/422.yaml` explicitly
    provides for content that converted. Pinned by row 1 of
    `CONT-DV_URI-validate_open` and row 1 of `CONT-DV_EHR_URI-validate_open`,
    whose authored `violates` clause is a `rm_schema:` entry about a VALUE's
    form and therefore does NOT carry the `mandatory` word the
    content-table refusal split keys on (schedule/content/README.md).
  disposition: fixed_handling

AMB-210:
  ambiguity: >-
    No released openEHR text says which specification GENERATION SET a running
    server implements, and none says what a server does with STORED content
    that a configured older generation set cannot express. The release
    strategy makes a minor release "significant additions that do not change
    the semantics of the existing part of the release", so the released and
    development generations accept different surface while looking identical
    on every wire the release defines — which set a deployment runs is
    therefore a deployment fact no operation discloses, and the behaviour at
    the boundary (a body committed under the development set, read under the
    released one) is unassigned by every released component.
  source: >-
    openEHR release strategy
    (specifications.openehr.org/governance/release_strategy — minor releases
    as compatible supersets, read 2026-07-20); ITS-REST overview
    Requests_and_responses.md §HTTP status codes (the 409 row, "a conflict");
    RM common master06-change_control_package.adoc (VERSION semantics — a
    stored version is served verbatim, never rewritten). None of them names a
    runtime generation-set selection mechanism; the mechanism is this
    product's own design/extension (the `spec_profile` configuration key,
    docs/VERSIONS.md §Spec version policy).
  handling: >-
    Fixed handling: the generation set is an IXIT declaration (`spec_profile`
    on the party and per instance — the same law the signing and terminology
    postures follow), matched at selection time against a case's
    `requires.spec_profile`, so a party that declares no set is
    not-applicable-with-citation on every case whose expectation rests on
    one. The boundary behaviour the spec leaves unassigned is fixed as: a
    stored version body the ACTIVE profile's generation set cannot express is
    refused with 409 — RFC 9110 §15.5.10 assigns 409 to "a conflict with the
    current state of the target resource" whose resolution the response
    describes, which is exactly this condition (the stored state conflicts
    with the deployment's declared profile, and switching the profile back
    resolves it) — never served under a generation set that does not define
    it, never down-converted, and never silently elided (AQL whole-object
    projections refuse the whole query: a RESULT_SET has no per-row
    diagnostic channel that could explain a dropped row). 406 was rejected
    (RFC 9110 §15.5.7 scopes it to proactive content negotiation; no request
    header changes this outcome) and 500 was rejected (the condition is a
    deployment decision with a named remedy). The wire cases drive both
    directions on the two composed deployments: the development instance
    commits and serves the development-only body, the stable instance refuses
    it at read, and a released-surface body serves identically under both.
  disposition: fixed_handling
AMB-211:
  ambiguity: >-
    No released text assigns the write-side referential validity of
    FOLDER.items: ITS-REST's directory operations declare no semantic
    branch (400 is parse/syntax by its own text; 422 is wired to the
    composition and demographic operations only), FOLDER declares no
    invariants at all (the amendment record shows its invariants edited out
    under SPEC-49), the EHR class constrains its own reference lists on
    .type only and states a same-scope rule solely for EHR.tags, and SM
    Pre_content_valid reaches only RM-class structural validity
    (i_validity_checker.adoc). BASE object_ref.adoc grounds ACCEPTANCE for
    distributed references — the target "may exist locally or be maintained
    outside the current namespace", and namespace "unknown" is legal — but
    says nothing about a reference that CLAIMS the committing system and
    does not resolve there. Whether such a reference is accepted or refused
    is unassigned in every released component.
  source: >-
    ITS-REST specifications/operations/directory_create.yaml +
    directory_update.yaml (declared response sets) +
    specifications/responses/400.yaml + 422.yaml + overview
    Requests_and_responses.md §HTTP status codes; RM common
    UML/classes/org.openehr.rm.common.folder.adoc (no Invariants row) + ehr
    master00-amendment_record.adoc (SPEC-49) +
    UML/classes/org.openehr.rm.ehr.ehr.adoc §Invariants (+ the tags-only
    scope sentence); BASE
    UML/classes/org.openehr.base.base_types.object_ref.adoc §Description +
    §Attributes; SM UML/classes/i_ehr_directory.adoc §create_directory /
    §update_directory + UML/classes/i_validity_checker.adoc §content_valid.
  handling: >-
    Fixed handling (own-design extension, issue #1951): a FOLDER.items
    OBJECT_REF whose namespace claims THIS system — the literal "local", or
    the deployment's configured system id — must resolve to a versioned
    object in the committing EHR (any lifecycle state; the lookup spans the
    archival tier), judged on every folder commit path (the direct directory
    routes, and the CONTRIBUTION path inside the commit transaction after
    the set's inserts so the verdict never depends on member order). An
    unresolvable this-system reference refuses the commit as invalid content
    (422 — the overview status table's generic semantic-errors row plus its
    "additional status codes MAY be used" clause), naming each dangling
    reference at its tree path. References in foreign namespaces and
    "unknown" are accepted verbatim, ids standing free — the BASE
    distributed-referencing ground — so the accepting corpus twins reference
    foreign systems, and the refusal twin (cnf.directory.invalid.local_
    dangling_item) pins the boundary from the other side. The reference's
    type facet is deliberately not judged (BASE admits any ancestor name and
    ANY). The 553|incomplete| relaxation never reaches the check: a dangling
    this-system claim is wrong data, not missing data (RM common master06
    §Incomplete Content). EHR-Extract import and archive load replay
    verbatim and are exempt by construction.
  disposition: fixed_handling
  upstream_issue: 2413
AMB-212:
  ambiguity: >-
    RM common master08's front-matter NOTE says THIS Resource-package
    version "is used only in ADL 1.4 archetypes, i.e. via the AOM 1.4
    archetype model", but the released machine-readable AM 1.4 BMM
    (openehr_am_1.4.0.bmm.json) declares no resource classes of its own and
    includes openehr_base_1.3.0 — upstream's own retro-model binds AOM 1.4
    meta-data to the NEWER BASE resource form the same NOTE presents as the
    successor. The RM ch.8 shape's only machine-readable carrier is the
    ITS-XML v1 bundle (Resource.xsd + Template.xsd: original_author /
    lifecycle_state / details / parent_resource, no title/licence), i.e.
    the OPT 1.4 wire. No released text says which model form governs a 1.4
    artefact's meta-data VALIDATION, and none assigns the RM ch.8 class
    invariants an enforcement seam.
  source: >-
    RM common master08-resource_package.adoc (front-matter NOTE) + RM
    UML/classes/org.openehr.rm.common.{authored_resource,
    translation_details,resource_description,resource_description_item}.adoc
    §Invariants; the vendored AM 1.4 BMM
    (tools/openehr-codegen/vendor/bmm/components/AM/json/
    openehr_am_1.4.0.bmm.json — includes: openehr_base_1.3.0, no resource
    classes); ITS-XML v1 AM Release-1.4 Template.xsd (the
    OPERATIONAL_TEMPLATE annotation: the template "will inherit" from
    AUTHORED_RESOURCE) + ALL/Resource.xsd.
  handling: >-
    Fixed handling (issues #2446/#2447): the RM ch.8 classes stay
    emitted-complete in openehr-rm (the completeness rule); typed AOM-1.4
    meta-data flows through the BASE-shaped model per the released AM BMM
    includes; and the RM ch.8 invariants are enforced at the two ADL
    1.4-era ingest seams — the OPT 1.4 template upload (the RM-ch.8-shaped
    canonical XML wire; the full family as invariant-named 422 refusals,
    audited clean against the vendored OPT corpus first) and the ADL 1.4
    source catalogue (openehr-adl validate/resource_meta.rs; the
    structural + language rows as Errors, and the empty-prose rows
    Purpose_valid/Use_valid/misuse_valid as WARNING-severity findings,
    because "" is the 1.4 ecosystem's spelling of absence — 61/162/873
    occurrences across the vendored CKM library, pinned by the
    ckm_archetype_packs sweep; 1.4-source tolerance is our own design, so
    the downgrade lives at that seam only). Translations_valid /
    Description_valid are vacuous at the OPT ROOT (Template.xsd declares no
    translations element, and the invariants' antecedent is
    `translations /= Void`); they bind on an embedded ARCHETYPE and at the
    ADL source seam, where translations exist. valid_opt answers with the
    same artefact catalogue upload_opt enforces, so the two never diverge.
  disposition: fixed_handling
AMB-213:
  ambiguity: >-
    The RM data_structures document contradicts itself about
    ITEM_TABLE.as_hierarchy's shape. §ISO 13606 Encoding Rules — ITEM_TABLE
    defines the encoding by ROWS ("Each row is encoded as a Cluster
    containing a number of ELEMENTs, each corresponding to the value of a
    column in that row"; the ELEMENT names are the column names; "The names
    of the containing CLUSTER of each row is the stringified number of the
    row in the overall table"; a void cell is an ELEMENT with null_flavour
    set), and both the class Description ("Implemented using Cluster-per-row
    encoding") and the normative instance figure (three at0010|row| CLUSTERs)
    corroborate rows — while the same class table's as_hierarchy Meaning
    sentence alone says "a single CLUSTER containing the CLUSTERs
    representing the columns of this table".
