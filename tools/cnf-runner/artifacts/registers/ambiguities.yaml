    upstream chapter is fleshed. Upstream authoring candidate.
  disposition: fixed_handling
AMB-37:
  ambiguity: >-
    The SM I_DEFINITION_ADL2 interface is artefact-generic — a single
    upload_artefact/get_artefact/has_artefact/delete_artefact plus type-specific
    list_*/*_count over archetypes, templates AND operational templates — but
    ITS-REST 1.1.0 surfaces ONLY operational-template (OPT) wire under
    /definition/template/adl2*. There is no ADL2 archetype-provisioning
    endpoint, no generic all-artefacts listing, no DELETE, no *_count endpoint,
    no validation-only endpoint, and no regex match-by-pattern (the list filter
    is a wildcard glob with no invalid-pattern error path). ITS-REST also adds
    an example-generation surface the SM does not define, and its single ADL2
    list does not distinguish TEMPLATE from OPERATIONAL_TEMPLATE.
  source: "SM docs/UML/classes/i_definition_adl2.adoc vs ITS-REST specifications/operations (definition_template_adl2_* — OPT-only)"
  handling: >-
    Archetype provisioning, generic listing, delete, and counts are declared
    unrealized on its-rest (cases not-applicable WITH CITATION, activating on a
    later ITS release). valid_artefact realizes via upload_artefact; has_artefact
    and list_matching_artefacts realize via the ADL2 list (filter); list_templates
    conflates with list_opts on the one list endpoint; example generation and the
    deprecated version GET anchor to get_artefact (the closest SM op, AMB-13/AMB-31
    rule). SPECPR candidates: (1) add ADL2 archetype provisioning + delete + count
    + generic-list + example-generation operations to the SM/ITS alignment;
    (2) give the runner binding schema a variant discriminator so example can
    carry its own 406 independently of the plain get_artefact binding.
  disposition: fixed_handling
AMB-38:
  ambiguity: >-
    master05 is a stub chapter: all seven stored-query case tables carry
    xx/TBD cells — the schedule defines the case inventory but no behaviour
    text.
  source: "CNF platform_test_schedule master05 (all case tables xx/TBD)"
  handling: >-
    Cases are active with flows derived from the SM I_DEFINITION_QUERY
    operation semantics and the STABLE stored-query Definitions API, each
    carrying a disclosure guard (the master10/master12 stub-chapter rule,
    AMB-36 precedent); flows/assertions are replaced when the upstream
    chapter is fleshed.
  disposition: fixed_handling
AMB-39:
  ambiguity: >-
    Support for the deprecated pre-1.1.0 "Simplified Data Template (SDT)"-era
    simplified-format media types is not mandated: ITS-REST simplified_formats
    master02 defines only the current application/openehr.wt.flat+json and
    application/openehr.wt.structured+json MIME types, and the master02 NOTE
    records that "Simplified Data Template (SDT)" was superseded by "Simplified
    Formats" at Release 1.1.0. Whether a server still accepts the legacy media
    types is implementation-defined.
  source: "ITS-REST simplified_formats master02 §MIME Types + §Overview (SDT rename NOTE)"
  handling: >-
    Two sibling cases carry option tags; the ICS options declaration selects
    which applies — the declared behaviour MUST pass, the undeclared sibling is
    not-applicable. The supported branch (sf-deprecated-types-supported) expects
    the legacy commit to succeed; the unsupported branch
    (sf-deprecated-types-unsupported) expects unsupported_media (415).
  disposition: option_select
  options: [sf-deprecated-types-supported, sf-deprecated-types-unsupported]
AMB-40:
  ambiguity: >-
    Several write operations enumerate only 400 (plus 404/409) for rejected
    content — contribution_create, definition_template_adl1.4_upload,
    definition_template_adl2 upload, ehr_create/ehr_create_with_id — yet
    their payloads can fail SEMANTIC validation (RM/AOM/template
    nonconformance), which the overview's general status table assigns to
    422 ("well-formed but unable to be followed due to semantic errors") and
    which 422.yaml describes verbatim ("could be converted to a resource,
    but there are semantic validation errors, such as the underlying
    template is not known or is not validating the supplied resource"). The
    enumerated 400 responses scope syntax-level failures (parse, malformed
    URL/header/content, mismatched modification type), so which code a
    semantic rejection carries is unenumerated.
  source: >-
    ITS-REST operations/contribution_create.yaml (responses 201/400/404/409)
    + responses/400_CONTRIBUTION.yaml + responses/422.yaml + overview
    Requests_and_responses.md §HTTP status codes ("Additional status codes
    MAY be used as long as they do not conflict with the predefined codes")
  handling: >-
    The affected bindings' validation_failed (and, on contribution,
    template_not_found) expectations carry alt_status [422]: a server
    answering the OAS-enumerated 400 or the overview-permitted,
    non-conflicting 422 both classify as the semantic-rejection kind; no
    other status is accepted. The kinds on the shared status are
    distinguished by fixture (the AMB-2 pattern).
  disposition: fixed_handling
AMB-41:
  ambiguity: >-
    The SM I_DEFINITION_ADL14 interface defines archetype provisioning
    (upload/get/list over ADL 1.4 archetypes) alongside OPT provisioning,
    and the Profiles book lists "ADL 1.4 Archetype provisioning" as a
    required CORE capability — but ITS-REST 1.1.0 surfaces ONLY the
    operational-template wire under /definition/template/adl1.4; there is
    no ADL 1.4 archetype endpoint at all.
  source: "SM docs/UML/classes/i_definition_adl14.adoc vs ITS-REST specifications/operations (definition_template_adl1.4_* — OPT-only); CNF profiles master03-profiles.adoc §Functional (Definitions)"
  handling: >-
    The archetype-provisioning operations carry unrealized its-rest bindings;
    their cases are not-applicable WITH CITATION and activate when a later
    ITS release adds the wire. The verdict pipeline records the capability as
    unrealized-on-this-technology-profile — an explicit scope exclusion on
    the certificate, never a silent pass and never a CORE failure the ITS
    cannot avoid.
  disposition: fixed_handling
AMB-42:
  ambiguity: >-
    The AOM 1.4 object model defines millisecond_validity on
    C_TIME/C_DATE_TIME (AM UML c_time.adoc, c_date_time.adoc) and the
    separate seconds_allowed / fractional_seconds_allowed booleans on
    C_DURATION (c_duration.adoc), and the CNF content schedule tests them
    (master17.4: "mandatory/optional/prohibited flags for each part of the
    time expression: minute, second, millisecond and timezone") — but the
    ITS-XML 1.0.2 OPT serialization (Archetype.xsd) carries NO
    millisecond_validity element (C_TIME/C_DATE_TIME sequence is pattern,
    timezone_validity, range, assumed_value) and NO per-field duration
    booleans (C_DURATION is pattern, range, assumed_value), and the ADL 1.4
    pattern grammar ends at the seconds slot (master05-cadl §Patterns).
    A constraint the schedule tests is unserializable on the OPT 1.4 wire.
  source: >-
    AM docs/UML/classes/org.openehr.am.aom14.c_time.adoc +
    c_date_time.adoc + c_duration.adoc; AM ADL1.4 master05-cadl.adoc
    §Patterns (lexer V_ISO8601_TIME_CONSTRAINT_PATTERN ends at seconds) vs
    ITS-XML 1.0.2 Archetype.xsd (C_TIME/C_DATE_TIME/C_DURATION sequences);
    CNF platform_test_schedule master17.4 §DV_TIME / §DV_DURATION
  handling: >-
    Content rows whose expected rejection rests SOLELY on these
    unserializable axes (millisecond_validity, or a seconds_allowed /
    fractional_seconds_allowed split where the other seconds flag is true)
    are recorded not-applicable WITH CITATION by the per-row realizability
    gate (the ground OPT cannot exist on this technology profile); rows
    whose violations include any serializable axis (timezone_validity IS an
    Archetype.xsd element and stays tested) run normally. The rows activate
    when an ITS-XML release serializes the AOM fields.
  disposition: fixed_handling
AMB-43:
  ambiguity: >-
    BASE 1.3.0 Interval<T> declares lower/upper as optional (0..1) and
    carries exactly four invariants (Lower_included_valid,
    Upper_included_valid, Limits_consistent, Limits_comparable) — none of
    which requires a bound VALUE to be present when the corresponding
    *_unbounded flag is false. An instance {lower_unbounded: false, no
    lower; upper_unbounded: false, no upper} therefore violates no RM
    invariant, while the CNF content lineage expects such an interval to be
    rejected as malformed. (Older openEHR revisions carried such an
    invariant; the vendored 1.3.0 does not.)
  source: >-
    BASE docs/UML/classes/org.openehr.base.foundation_types.interval.adoc
    §Attributes (lower/upper 0..1) + §Invariants (the four-invariant set);
    CNF platform_test_schedule master17.3 (interval open tables)
  handling: >-
    The framework adopts the RM-invariant reading: a bounded-flag interval
    with absent limits is ACCEPTED (no invariant violated; the flags are
    then vacuous). The affected content rows expect accepted with this
    citation. The rows flip to rejected if a future BASE release restores
    the bound-required invariant.
  disposition: fixed_handling
AMB-44:
  ambiguity: >-
    DV_TIME literal form diverges between the CNF schedule and BASE: the
    master17.4 §DV_TIME NOTE says "our test data sets all include the T
    time marker" (and the master17.3 interval-of-time tables print
    T-prefixed literals), while BASE Iso8601_time defines the value syntax
    as hh:mm:ss[(,|.)sss][Z|±hh[:mm]] (extended) or hhmmss… (compact) —
    no leading T in either form. DV_TIME.value's type oracle is the BASE
    class.
  source: >-
    CNF platform_test_schedule master17.4 (§DV_TIME NOTE) + master17.3
    (interval-of-time tables) vs BASE
    docs/UML/classes/org.openehr.base.foundation_types.iso8601_time.adoc
    §Description
  handling: >-
    Time literals in the catalogue take the BASE Iso8601_time form: the
    schedule's T-prefixed time data sets are transcribed WITHOUT the
    leading marker (the T marks the date-time separator and duration
    designators only). The affected DV_TIME/interval-of-time cases tag
    this entry. Flips back if a future BASE release admits the T-prefixed
    time form.
  disposition: fixed_handling
AMB-45:
  ambiguity: >-
    The master17.4 DV_DATE_TIME range table's T-precision block tests values
    anchored at 2021-10-24 (e.g. 2021-10-24T10) against ranges anchored at
    1900-03-13 yet expects accepted — arithmetically impossible under BASE
    Interval total-order containment and under the chapter's own
    full-interval interpretation of reduced-precision limits.
  source: >-
    CNF platform_test_schedule master17.4 (§CONT-DV_DATE_TIME-validate_range,
    the T-precision block) vs BASE foundation_types interval.adoc §has()
  handling: >-
    The catalogue re-anchors the block's values to the ranges' 1900-03-13
    date (preserving each row's precision axis and verdict), making every
    row derivable. Upstream editorial fix proposed with the chapter
    conversion.
  disposition: editorial
AMB-46:
  ambiguity: >-
    Commit-time enforcement of a CONSTRAINT_REF (C_CODE_REFERENCE) against
    the instance's terminology_id is not derivable from AOM1.4: master04
    §Reference Objects defines CONSTRAINT_REF as a proxy whose actual
    constraint definition lives OUTSIDE the archetype, in the
    constraint_bindings query into an external service (a terminology
    service) — no clause mandates rejecting a committed instance whose
    terminology no binding covers (the VATDF/VACDF codes validate the
    ARCHETYPE/TEMPLATE, not committed data). The schedule's
    validate_ext_term row 4 nevertheless verdicts rejected
    (constraint_binding: terminology_id not found).
  source: >-
    AM AOM1.4 master04-constraint_model_package.adoc §Reference Objects
    (C_REFERENCE_OBJECT) vs CNF platform_test_schedule master17.2
    (§CONT-DV_CODED_TEXT-validate_ext_term row 4)
  handling: >-
    The unmatched-terminology row asserts acceptance with the AOM citation
    (rejection is not derivable). Instrument note: the declared
    constraint_bindings axis is not yet realized by the OPT synthesizer
    (no binding is emitted into the synthesized template) — the axis is
    declarative until the terminology-binding synthesis lands (the #255
    instrument lane); the rm_schema rows are unaffected. Flips to rejected
    only if a future AM release defines commit-time binding enforcement.
  disposition: fixed_handling
AMB-47:
  ambiguity: >-
    The master09 has_path folder-structure data set diverges from the
    OFFICIAL Robot realization of the same chapter: the table cells print
    hyphenated names (episode-x, summary-composition-x) and the D.2 NOTE
    calls '/' "the default name for the root FOLDER", while the official
    Robot runner and its data set use underscore names (episode_x,
    summary_compo_x), a root FOLDER named "root", and an extra
    special-characters folder.
  source: >-
    CNF platform_test_schedule master09 (§has_path-folder_structure data
    set, §has_path-ehr_root_directory NOTE) vs
    CNF/tests/platform/robot/_resources/test_data_sets/directory/
    subfolders_in_directory.json + has_path-folder_structure.robot
  handling: >-
    The catalogue fixture and probes follow the official Robot data set
    (provenance-stamped in corpus/MANIFEST.yaml), preserving the official
    true/false probe pattern exactly. Upstream editorial-alignment
    candidate (table cells vs the chapter's own reference runner).
  disposition: fixed_handling
AMB-48:
  ambiguity: >-
    The SM I_EHR_COMPOSITION.has_composition operation (Boolean) has no
    dedicated ITS-REST existence endpoint (the AMB-19/AMB-23 shape).
  source: "SM docs/UML/classes/i_ehr_composition.adoc (has_composition) vs ITS-REST specifications/operations (no composition-existence probe)"
  handling: >-
    Realized as a GET of the version at the known uid: 200 (ok) is the
    positive return, 404 (not_found) the negative — the boolean is carried
    by the outcome kind, never a response body.
  disposition: fixed_handling
AMB-49:
  ambiguity: >-
    CNF<->SM operation-name divergence for composition version retrieval:
    master07 anchors I_EHR_COMPOSITION.get_composition_version(), but the
    vendored SM defines get_composition_at_version (no
    get_composition_version).
  source: "CNF platform_test_schedule master07 (get_composition_version heading) vs SM docs/UML/classes/i_ehr_composition.adoc"
  handling: >-
    Official case ids keep the schedule's get_composition_version family;
    sm_operation carries the resolvable get_composition_at_version (the
    AMB-13 rule). Upstream editorial-alignment candidate.
  disposition: fixed_handling
AMB-50:
  ambiguity: >-
    master07 editorial defect: the delete_composition-non_existent case's
