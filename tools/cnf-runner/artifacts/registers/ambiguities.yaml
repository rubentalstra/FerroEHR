AMB-39:
  ambiguity: >-
    Support for the deprecated pre-1.1.0 "Simplified Data Template (SDT)"-era
    simplified-format media types is not mandated: ITS-REST simplified_formats
    master02 defines only the current application/openehr.wt.flat+json and
    application/openehr.wt.structured+json MIME types, and the master02 NOTE
    records that "Simplified Data Template (SDT)" was superseded by "Simplified
    Formats" at Release 1.1.0. Whether a server still accepts the legacy media
    types is implementation-defined.
  source: "ITS-REST simplified_formats master02-overview.adoc §MIME Types + §Overview (SDT rename NOTE)"
  handling: >-
    Sibling cases carry option tags; the ICS options declaration selects which
    applies — the declared behaviour MUST pass, the undeclared sibling is
    not-applicable. Request side (Content-Type): the supported branch
    (sf-deprecated-types-supported) expects the legacy commit to succeed; the
    unsupported branch (sf-deprecated-types-unsupported) expects
    unsupported_media (415). Response side (Accept): the
    sf-deprecated-types-unsupported branch also expects not_acceptable (406)
    when a deprecated media type is requested via Accept and the server does
    not support it (ITS-REST overview Resources.md §Simplified Formats — "If
    the service cannot fulfil this aspect of the request, it MUST respond with
    HTTP status code 406 Not Acceptable").
