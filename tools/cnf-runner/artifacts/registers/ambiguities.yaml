  source: "SM docs/UML/classes/i_definition_adl14.adoc (delete_opt) vs ITS-REST specifications (definition template operations: no DELETE)"
  handling: >-
    The four official cases are in the catalogue, active and SM-anchored; the
    its-rest binding carries an explicit `unrealized` declaration, so on
    ITS-REST 1.1.0 they verdict as not-applicable with this citation and
