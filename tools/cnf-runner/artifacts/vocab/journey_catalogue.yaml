# The clinical journey catalogue — the hospital-simulation vocabulary the
# performance workloads decompose into. Each journey is an ordered,
# time-offset operation sequence; every operation name is the closed PerfOp
# vocabulary with a fixed ITS-REST wire realization; commit/update stages
# name their corpus template (the payload's constraint carrier — 15
# COMPOSITION-rooted templates vendored from the openEHR CKM, provenance in
# corpus/templates/ckm/PROVENANCE.md, manifest entries in
# corpus/MANIFEST.yaml).
#
# No openEHR spec governs measured performance (CNF guide
# master03-overview.adoc §Product Scope excludes it) — our own
# design/extension. The envelope stays population-anchored: workload
# `arrival_rate` is aggregate OPERATION arrivals (the class floor's unit);
# each journey's `derivation` traces its shape/rate to the same official
# activity statistics the class floors derive from; the expanded write
# share must reconcile to the 10:1..50:1 read:write derivation band
# (validator-enforced).
#
# Offsets are deterministic under the seeded schedule: fixed (PTnMnS),
# uniform ranges (hashed), and periodic repetitions (the drug round).
# Dependent stages are spaced >= 15 s apart so every prerequisite has
# landed on any SUT inside the p99 <= 1 s budget; a prerequisite missing at
# fire time (a stalled SUT) records honestly as an error arrival.

# ── ADT flow ────────────────────────────────────────────────────────────

admission:
  description: >-
    ADT admission: create the EHR, read it back, set the admission
    EHR_STATUS, commit the admission problem list and the admission
    summary, and open the per-episode directory folder tree.
  derivation: >-
    0.128 inpatient discharges/capita/yr (OECD Health at a Glance 2023) at
    ~10 documents per stay; ~10% daily ward turnover.
  stages:
    - { op: ehr_create, at: PT0S }
    - { op: ehr_read, at: PT15S }
    - { op: ehr_status_read, at: PT30S }
    - { op: ehr_status_update, at: PT45S }
    - { op: composition_commit, template: cnf.ckm.problem_list, at: PT1M }
    - { op: composition_commit, template: cnf.ckm.ips, at: PT2M }
    - { op: directory_create, at: PT75S }

discharge:
  description: >-
    ADT discharge: read + update the EHR_STATUS, commit the discharge
    summary, read the episode directory and close it out.
  derivation: >-
    Mirrors admission (0.128 discharges/capita/yr, OECD Health at a Glance
    2023); the discharge summary is the stay's closing document.
  stages:
    - { op: ehr_status_read, at: PT0S }
    - { op: ehr_status_update, at: PT15S }
    - { op: composition_commit, template: cnf.ckm.ips, at: PT30S }
    - { op: directory_read, at: PT45S }
    - { op: directory_update, at: PT1M }

# ── monitoring streams ──────────────────────────────────────────────────

vitals_round:
  description: >-
    A nursing observation round: one vital-signs composition (BP, pulse,
    respiration, temperature, SpO2) committed per round — the dominant
    ward write stream.
  derivation: >-
    Ward observation cadence ~4-6 observation sets/patient-day (RCP NEWS2
    monitoring guidance); each round is one committed document within the
    46 documents/capita/yr envelope.
  stages:
    - { op: composition_commit, template: cnf.ckm.vital_signs, at: PT0S }

# ── medication (the eMAR loop) ──────────────────────────────────────────

medication_round:
  description: >-
    The eMAR loop: a medication order followed by scheduled administration
    commits at the drug-round cadence.
  derivation: >-
    21.8 prescription items/capita/yr (NHS BSA Prescription Cost Analysis
    2024/25); administrations follow orders at the round cadence.
  stages:
    - { op: composition_commit, template: cnf.ckm.eprescription, at: PT0S }
    - { op: composition_commit, template: cnf.ckm.eprescription, at: { periodic: { interval: PT20M, count: 2 } } }

medicines_reconciliation:
  description: >-
    Medicines reconciliation: read the patient's current medicines list
    and amend it as a new version.
  derivation: >-
    Reconciliation on admission/transfer per medicines-optimisation
    guidance (NICE NG5); a versioned update of the standing list.
  stages:
    - { op: composition_read_current, at: PT0S }
    - { op: composition_update, template: cnf.ckm.medicines_list, at: PT30S }

# ── laboratory / imaging pipelines (asynchronous) ───────────────────────

lab_pipeline:
  description: >-
    The asynchronous order-to-result pipeline: a laboratory request, the
    result landing as its own contribution after a realistic turnaround,
    then the ordering clinician's chart view. Nothing blocks: each stage
    is its own planned arrival.
  derivation: >-
    15 laboratory results/capita/yr (RCPath pathology activity); result
    turnaround tens of minutes.
  stages:
    - { op: composition_commit, template: cnf.ckm.ereferral, at: PT0S }
    - { op: contribution_commit, template: cnf.ckm.lab_result, at: { uniform: [PT20M, PT50M] } }
    - { op: composition_read_current, at: PT55M }

imaging_pipeline:
  description: >-
    The imaging order-to-report pipeline: a request, the report landing
    after a longer turnaround, then the report review.
  derivation: >-
    0.82 imaging tests/capita/yr (NHS Diagnostic Imaging Dataset 2023/24);
    report turnaround hours.
  stages:
    - { op: composition_commit, template: cnf.ckm.ereferral, at: PT0S }
    # TODO: restore cnf.ckm.ccta_report as the report payload once the
    # example generator emits RM-valid instances for it (its generated
    # example carries ELEMENT.value = ITEM_TREE, which the platform's own
    # validation rejects); the synoptic report carries the stage meanwhile.
    - { op: composition_commit, template: cnf.ckm.breast_cancer_report, at: { uniform: [PT1H, PT3H] } }
    - { op: composition_read_current, at: PT3H30M }

# ── specialist & registry reporting ─────────────────────────────────────

specialist_report:
  description: >-
    A specialist synoptic report (the cancer-reporting protocol shape)
    committed, then its version history reviewed.
  derivation: >-
    Structured cancer synoptic reporting per RCPA cancer reporting
    protocols; specialist documents within the 46 documents/capita/yr
    envelope.
  stages:
    - { op: composition_commit, template: cnf.ckm.breast_cancer_report, at: PT0S }
    - { op: composition_revision_history, at: PT1M }

registry_submission:
  description: >-
    The registry export: a registry report committed as its own
    CONTRIBUTION, then the contribution inspected (the integration audit
    trail).
  derivation: >-
    Disease-registry submission flows (EU PARENT registry lineage);
    batch-style commits riding CONTRIBUTIONs.
  stages:
    - { op: contribution_commit, template: cnf.ckm.treat_registry_report, at: PT0S }
    - { op: contribution_read, at: PT1M }

# ── public-health surveillance ──────────────────────────────────────────

public_health_notification:
  description: >-
    The statutory notification pipeline: an event notification committed
    at detection, the confirmed-case report following after investigation.
  derivation: >-
    Notifiable-disease reporting duty (UKHSA notifiable diseases
    reporting); confirmation follows notification by hours.
  stages:
    - { op: composition_commit, template: cnf.ckm.sars_notification, at: PT0S }
    - { op: composition_commit, template: cnf.ckm.covid19_report, at: { uniform: [PT2H, PT6H] } }

case_investigation:
  description: A public-health case investigation form committed.
  derivation: >-
    Case-investigation activity per notifiable case (public-health
    surveillance practice); the rare structured-form write.
  stages:
    - { op: composition_commit, template: cnf.ckm.poisoning_investigation, at: PT0S }
    - { op: composition_commit, template: cnf.ckm.diphtheria_investigation, at: PT30M }

# ── clinical review (the read-heavy bulk) ───────────────────────────────

chart_review:
  description: >-
    The ward-round chart read: composition reads at version and current,
    the version history, the per-patient AQL trend, and the episode
    directory — the read-heavy bulk of clinical work.
  derivation: >-
    ~597 EHR interactions per inpatient encounter, overwhelmingly reads
    (PMC10148376 audit-log evidence) — the ground of the 10:1..50:1
    read:write band.
  stages:
    - { op: composition_read, at: PT0S }
    - { op: composition_read, at: PT20S }
    - { op: composition_read_current, at: PT40S }
    - { op: composition_revision_history, at: PT1M }
    - { op: adhoc_query, at: PT80S }
    - { op: directory_read, at: PT100S }

ward_dashboard:
  description: >-
    The ward worklist: a cross-EHR ad-hoc query over the population plus a
    registered stored query executed continuously (the dashboard pattern).
  derivation: >-
    Busy-hour worklist polling across the ward population (the ITU-T E.500
    busy-hour convention the floors' peak factor cites); the cross-EHR
    query class.
  stages:
    - { op: ward_query, at: PT0S }
    - { op: stored_query_execute, at: PT30S }

# ── corrections & governance ────────────────────────────────────────────

correction:
  description: >-
    Documentation governance: read the current document, amend it as a new
    version, review the revision history.
  derivation: >-
    Documentation amendment activity ~1 event/patient-day (PMC10148376
    audit-log evidence); every amendment is a versioned update riding a
    CONTRIBUTION.
  stages:
    - { op: composition_read_current, at: PT0S }
    - { op: composition_update, template: cnf.ckm.gp_data_set, at: PT30S }
    - { op: composition_revision_history, at: PT1M }

audit_review:
  description: >-
    The audit-review journey: inspect a committed CONTRIBUTION and the EHR
    it belongs to.
  derivation: >-
    Every commit rides a CONTRIBUTION (RM common change_control); audit
    review is the read side of that accountability trail.
  stages:
    - { op: contribution_read, at: PT0S }
    - { op: ehr_read, at: PT20S }

deletion:
  description: >-
    The rare erroneous-record correction: commit an observation, logically
    delete it after review.
  derivation: >-
    Logical deletes are rare governance events (RM common change_control —
    deleted lifecycle); held at the catalogue's smallest share.
  stages:
    - { op: composition_commit, template: cnf.ckm.vital_signs, at: PT0S }
    - { op: composition_delete, at: PT10M }

# ── platform surface ────────────────────────────────────────────────────

integration_poll:
  description: >-
    The integration-engine template poll: list the template store, fetch
    one template definition.
  derivation: >-
    Steady background polling by integration engines against the
    definition surface; rate-bounded background reads.
  stages:
    - { op: template_list, at: PT0S }
    - { op: template_get, at: PT30S }

tagging:
  description: >-
    Workflow tagging of a hot composition: replace the tag set, read it
    back (ITS-REST TAGS API).
  derivation: >-
    Worklist-driven tagging of active documents; a small steady write/read
    pair on the hottest compositions.
  stages:
    - { op: tags_put, at: PT0S }
    - { op: tags_read, at: PT30S }
