    source: "The released sources DECLARE the media type for this operation and WITHHOLD the shape of the document it would carry, so no conformance case can drive it without inventing one. DOCS TEXT — the only sentence governing an XML request payload is Resources.md §\"XML Format\": \"When resources are serialized in **canonical XML** format, both request payloads and responses MUST conform to the [published XSDs]\"; the EHR API chapter adds nothing (docs/ehr/Description.md is a 25-line stub — Purpose, Related Documents, Status — with no occurrence of CONTRIBUTION). PUBLISHED XSD — ITS-XML RM Common.xsd types the resource `<xs:complexType name=\"CONTRIBUTION\"><xs:sequence><xs:element name=\"uid\" type=\"HIER_OBJECT_ID\"/><xs:element name=\"versions\" type=\"OBJECT_REF\" maxOccurs=\"unbounded\"/><xs:element name=\"audit\" type=\"AUDIT_DETAILS\"/></xs:sequence></xs:complexType>`: `versions` are REFERENCES and `uid` is mandatory, so the type describes a COMMITTED contribution, never the commit envelope, which must carry each new version's DATA inline; no global element is declared for it either. RELEASED OAS (citable only because the docs text is silent on the envelope — owner ruling 2026-07-28) — operations/contribution_create.yaml DECLARES the type twice, via parameters/header/ContentType_LOCATABLE.yaml (whose `enum` contains `application/xml`) and its own description (\"in addition to the canonical `application/json` / `application/xml`\"), yet its `requestBody.content` has exactly ONE entry, `application/json`, bound to schemas/ehr/NewContribution.yaml, whose UpdateVersion/UpdateAudit shapes have no XSD counterpart and no XML schema, example or XSD reference anywhere in the release. Register AMB-165"
