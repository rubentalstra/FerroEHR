  # Query EHR-scope request header (ITS-REST docs/query/Request.md).
  - id: query-ehr-id-request-header
    description: "The openehr-ehr-id request header alone scopes a query execution to one EHR — on ad-hoc GET, ad-hoc POST, and stored execution — exactly as the ehr_id query parameter does."
    source: "ITS-REST query Request.md §About the ehr_id parameter (\"clients MAY supply it as a query parameter `ehr_id` or alternatively as a request header named `openehr-ehr-id`\") + §Common Headers and Query Parameters (\"All query execution requests SHOULD support at least the following parameters\"; \"Related request headers: `openehr-ehr-id` - used to execute the query within a single EHR context\") + Query_types.md §Single EHR queries — no HTTP method and no execution form is carved out"
    covered_by:
      - I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_header_get
      - I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_header_post
      - I_QUERY_SERVICE.execute_stored_query-ehr_id_header
  - id: query-ehr-id-parameter-header-conflict
    description: "A query execution carrying BOTH the ehr_id query parameter and the openehr-ehr-id header is executed when they name the same EHR and rejected 400 when they name different EHRs."
    source: "ITS-REST query Request.md §About the ehr_id parameter offers the two forms as alternatives and never defines the both-supplied case — the released text is SILENT, adjudicated in register AMB-59 (400 per Requests_and_responses.md §HTTP status codes, row 400 / generic client-side error)"
    exception:
      reason: coverage_gap
      register: AMB-59
      note: "server behaviour fixed + HTTP-tested (app/ehrbase-rest/tests/query_ehr_id_header.rs: matching forms execute, conflicting forms are 400, on GET and POST, ad-hoc and stored). Not authorable as a case today: the rejection is a self-contradictory REQUEST, and the closed outcome taxonomy (vocab/outcomes.yaml) has no kind for it — `invalid_query` means malformed AQL, which this is not. Closes when the outcome vocabulary gains a malformed-request kind (extension only by schedule release)."
  # HTTP-method discipline (ITS-REST Requests_and_responses.md §HTTP Methods).
  - id: method-405-allow-header
    description: "A known resource path called with a method it does not serve answers 405 Method Not Allowed AND carries the Allow header naming the methods that resource currently supports (the empty field value when a configuration gate leaves it serving none)."
    source: "ITS-REST Requests_and_responses.md §HTTP Methods (\"If a method is recognized but not allowed for the target resource, the response SHOULD be `405 Method Not Allowed` status code\") over RFC 9110, the authority that section names for method semantics (§15.5.6 \"The origin server MUST generate an Allow header field in a 405 response containing a list of the target resource's currently supported methods\"; §10.2.1 \"An empty Allow field value indicates that the resource allows no methods, which might occur in a 405 response if the resource has been temporarily disabled by configuration\")"
    exception:
      reason: coverage_gap
      register: AMB-60
      note: "server behaviour fixed + HTTP-tested (app/ehrbase-rest/tests/http.rs `recognized_but_unallowed_method_is_405_with_allow` / `unrecognized_method_is_405_with_allow` for the router fallback, app/ehrbase-rest/tests/admin_http.rs `disabled_admin_is_405_and_never_deletes` / `disabled_admin_config_is_405` for the handler-produced 405 of the config-gated admin group, plus the unit matrix in app/ehrbase-rest/src/overview/error.rs). Not authorable as a case today for TWO independent model reasons: the binding request model's method vocabulary is closed to {GET, POST, PUT, DELETE, HEAD} (tools/cnf-runner/src/vocab.rs `HttpMethod`), so a deliberately wrong-but-known or arbitrary method on a known path cannot be expressed, and the closed outcome taxonomy (vocab/outcomes.yaml) has no method_not_allowed kind — the same shape as the case-transform precedent. The Allow assertion additionally needs the header-matcher evaluation tracked in #403 (`outcomes.*.headers` matchers are parsed but never evaluated — only the status is classified, tools/cnf-runner/src/exec/outcome.rs). Closes when the method vocabulary and the outcome taxonomy gain those members (extension only by schedule release) and #403 lands."
  - id: method-501-unrecognized-method-deviation
    description: "An unrecognized method is answered 405 (with Allow) rather than the 501 the overview SHOULDs, while 501 stays the answer for a recognized-but-unimplemented operation."
    source: "ITS-REST Requests_and_responses.md §HTTP Methods states two SHOULDs whose antecedents overlap for any method outside the tabulated subset (unrecognized AND not allowed for the target resource) and gives no precedence — adjudicated in register AMB-60; 405 is a predefined row of §HTTP status codes and so cannot conflict with it (\"Additional status codes MAY be used as long as they do not conflict with the predefined codes\"), while a blanket 501 fallback would also swallow unrouted paths owed the 404 of the same table"
    exception:
      reason: coverage_gap
      register: AMB-60
      note: "the deviation is registered, not silent, and its 405 half is exercised by the app tests listed on method-405-allow-header. Not authorable as a case today for the same closed-vocabulary reasons (no arbitrary method in the binding request model, no method_not_allowed outcome kind); the 501 half that IS realized — a recognized but unimplemented operation — has no ITS-REST 1.1.0 operation on this SUT that reaches it, since every mounted operation is implemented."
