# Axis 3 — cross-cutting wire-surface behaviours (populated below).
elements:
  # ITEM_TAG routes + wrapper headers (RM common master07-tags.adoc; ITS-REST
  # Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag;
  # ALL the Release-1.1.0 /tags routes — the EHR-side pair
  # (/ehr/{ehr_id}/{composition,ehr_status}/{uid_based_id}/tags) AND the
  # demographic quintet (/demographic/{person|agent|group|organisation|role}/
  # {uid_based_id}/tags), plus the two space-wide lists /ehr/{ehr_id}/tags and
  # /demographic/tags). ITS-REST-only operations — no SM
  # interface, so axis 1 cannot enumerate them (#288 owns that derivation
  # fix); registered here so the surface is an honest boundary, not silence.
  # Each element states one law that holds identically on BOTH families; the
  # demographic-specific silences are adjudicated in the register (AMB-137
  # owner_id, AMB-138 the unscoped space-wide list).
  - id: item-tag-identity-key-path-pair
    description: "Two same-key tags on different target_paths coexist on one target; PUT round-trips both (identity = key + target_path pair). Holds on every typed tag family — the two EHR-side and the five demographic party routes alike, whose operation descriptions repeat the identity sentence verbatim."
    source: "ITS-REST Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag (uniquely identified by their key and target_path pair); the same sentence in operations/{composition,ehr_status}_tags_{get,update}.yaml and operations/{person,agent,group,organisation,role}_tags_{get,update}.yaml"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested on the EHR side (#365) and on the demographic side with the group-13 wire fix (#509); runner tag verbs land with the #288 derivation fix"
  - id: item-tag-version-vs-container-targets
    description: "Container-addressed and VERSION-addressed tag collections of the same target are disjoint; each PUT replaces only the addressed collection, and each GET/DELETE reaches only the addressed one. Holds on every typed tag family: the dual-form uid_based_id sentence is carried verbatim by the two EHR-side and all five demographic party routes."
    source: "RM common master07-tags.adoc ITEM_TAG.target (may be a VERSIONED_OBJECT<T> or a VERSION<T>); ITS-REST Requests_and_responses.md §item-tag headers; the dual-form uid_based_id paragraph in operations/{composition,ehr_status}_tags_{get,update,delete}.yaml and operations/{person,agent,group,organisation,role}_tags_{get,update,delete}.yaml (\"The former is used to … a particular (target) version …, whereas the latter … the target VERSIONED_PARTY container\")"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#365); the disjointness now also holds through the wrapper-header write/echo path (#398, app/ehrbase-rest/tests/headers.rs reads both collections back through composition_tags_get after a two-header write); the group-8 audit (#384) added the target-guard 404s (nonexistent/foreign/wrong-kind — AMB-91), the EHR-wide listing guard, the empty-target_path normalization (AMB-96), and the register set AMB-91..97 with wire tests (headers.rs tag_* batteries); the group-13 wire fix (#509) extends the same anchor discipline to the five demographic party routes, whose seam previously discarded the version component and served the container collection for a version-addressed uid; runner tag verbs land with the #288 derivation fix"
  - id: item-tag-rm-target-shape
    description: "ITEM_TAG.target is emitted as the RM UID_BASED_ID (HIER_OBJECT_ID container / OBJECT_VERSION_ID version), never an OBJECT_REF wrapper — on the demographic party routes exactly as on the EHR-side ones, the RM class being shared."
    source: "RM common master07-tags.adoc ITEM_TAG (target: UID_BASED_ID) — one class, one shape, for every route that serves an ITEM_TAG; the RELEASED RM wins over the stalled OAS ItemTag schema. The sibling attribute owner_id has no such single answer outside an EHR — see register AMB-137."
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested on both sides: the EHR side since #365; the demographic seam since the group-13 wire fix (#509, PR #516) — target is the bare UID_BASED_ID (OBJECT_VERSION_ID for version targets) and owner_id the AMB-137 local/SYSTEM shape, wire-tested (demographic_tags_http.rs). runner tag verbs land with the #288 derivation fix"
  - id: item-tag-kind-checked-routes
    description: "Every typed tag route family 404s when the addressed versioned object is of another kind: within the EHR space (composition / ehr_status), within the demographic space (person / agent / group / organisation / role), and across the two (a COMPOSITION uid on a party tag route, or a party uid on a composition tag route). Enforced on GET, PUT and DELETE alike, together with plain existence."
    source: "Register AMB-91 (the wrong-kind 404 adjudication, widened to all seven typed families and the cross-space direction) over ITS-REST responses/404_unknown_ehr_id_or_uid_based_id{,_or_key}.yaml and responses/404_unknown_uid_based_id{,_or_key}.yaml (\"returned when the uid_based_id does not exist\") + the route-typed ITS-REST tag operations. The EHR half additionally has RM ehr ehr.adoc EHR.tags (\"Tag target values can only be within the same EHR\"); the demographic half has NO such RM containment — register AMB-137 records that silence — so its kind discipline rests on the route typing plus AMB-91, not on an RM reach rule."
    exception:
      reason: coverage_gap
      register: AMB-91
      note: "server behaviour fixed + DB-tested on the EHR side (#365, #384); the demographic get/delete previously ignored their kind parameter and performed no existence check (a nonexistent or wrong-kind party answered 200 []) — gated with the group-13 wire fix (#509), which brings get and delete up to the guard the party update already had. runner tag verbs land with the #288 derivation fix"
  - id: item-tag-wrapper-headers-distinct-collections
    description: "openehr-item-tag replaces the container collection and openehr-version-item-tag the committed VERSION's collection on a change-controlled write; an absent header leaves its collection untouched, and the RESPONSE echo confirms each target's stored list under its own header only. Holds on every change-controlled write that declares the headers — the EHR-side creates/updates and the demographic party creates/updates alike."
    source: "ITS-REST Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag (\"openehr-item-tag applies to VERSIONED_OBJECT targets\"; \"openehr-version-item-tag applies to a specific target VERSION within a VERSIONED_OBJECT\") §Usage in Requests + §Usage in Responses (\"Servers MAY include the openehr-item-tag or openehr-version-item-tag header in responses to confirm the actual list of ITEM_TAGs stored on the server side\"); operations/{person,agent,group,organisation,role}_{create,update}.yaml, whose own prose says \"a openehr-item-tag or openehr-version-item-tag request header can be set\" (the five updates' parameter lists omit openehr-item-tag against that prose — the released prose wins; recorded in register AMB-97)"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested: the request side in #365, and the RESPONSE echo in #398 (app/ehrbase-rest/tests/headers.rs) — the two collections are kept separate through the write seam so openehr-item-tag echoes only the VERSIONED_OBJECT's stored list and openehr-version-item-tag only the VERSION's (previously both headers carried the merged union), and a header the request did not send is not echoed at all. The demographic party writes read only openehr-item-tag until the group-13 wire fix (#509), which accepts both headers per the operations' own prose and lands each in its own collection. runner tag verbs land with the #288 derivation fix"
  # EHR identity + subject keying (RM ehr; SM i_ehr_service.adoc). The
  # released ITS-REST docs text never mentions a subject at all (grep of
  # specifications/docs/**: zero hits), so everything subject-shaped on this
  # wire is anchored on SM + RM.
  - id: ehr-id-path-segment-malformed-rejection
    description: "An ehr_id path segment that is not a well-formed identifier at all (a non-UUID token) is refused as a client error rather than served, and never resolves to some other EHR."
    source: "RM ehr EHR class §Attributes (`ehr_id`: 1..1 HIER_OBJECT_ID, \"The unique identifier of this EHR\", NOTE \"is is strongly recommended that a UUID always be used for this field\") + SM i_ehr_service.adoc (every ehr_id-taking operation declares `ehr_id: UUID [1]`) + ITS-REST Requests_and_responses.md §HTTP status codes, which offers two rows that both fit and picks neither: 400 (\"The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)\") and 404 (\"The origin service did not find the target resource or is not willing to disclose that one exists\")"
    exception:
      reason: coverage_gap
      note: "Not authorable as a case today, for a model reason AND a grounding reason. Model: the closed outcome taxonomy (vocab/outcomes.yaml) has no malformed-request kind — the same closed-vocabulary blocker recorded on query-ehr-id-parameter-header-conflict and method-405-allow-header. Grounding: the released text does not choose between its own 400 and 404 rows for a syntactically impossible identifier, so even with a kind available the catalogue could not say which code to expect without inventing the assignment; this is deliberately NOT registered as an ambiguity, because the owner ruling of 2026-07-26 confines the register to the five genuine released-source dispositions and a code the text simply never assigns to a case nobody wrote is a gap, not a divergence we carry. What IS covered is the well-formed-but-absent identifier, which the 404 row does assign and which I_EHR_SERVICE.get_ehr-get_ehr_by_invalid_ehr_id and has_ehr-non_existing_ehr_id gate. Closes when the outcome taxonomy gains a malformed-request kind (extension only by schedule release) AND a released sentence assigns the code."
  - id: ehr-subject-query-argument-required
    description: "The subject-keyed EHR read requires its subject argument: a request that omits it is not a request for all EHRs, and is refused rather than answered with an arbitrary or empty EHR."
    source: "SM i_ehr_service.adoc §get_ehrs_for_subject and §has_ehr_for_subject (both declare `a_subject_id: PARTY_REF [1]` — a mandatory argument, with no argument-less form of either operation) + ITS-REST Requests_and_responses.md §HTTP status codes row 400 (\"The service cannot or will not process the request due to something that is perceived to be a client error\"; \"Status code `400` indicates normally a bad request, as well as a generic client-side error, used when no other `4xx` error code is appropriate\")"
    exception:
      reason: coverage_gap
      note: "Not authorable as a case today for two independent model reasons. The binding request model cannot express an omitted MANDATORY argument at all: the I_EHR_SERVICE.get_ehrs_for_subject binding's query templates are `${subject_id}` / `${subject_namespace}`, and only the binding-template `${name?}` optional form permits an unbound reference (tools/cnf-runner/src/refgrammar.rs) — an unbound mandatory reference fails step resolution and records as an INCONCLUSIVE transport-class row, never as a request the SUT answered. And the closed outcome taxonomy has no malformed-request kind for the refusal (the query-ehr-id-parameter-header-conflict precedent). The positive and not-found halves of the same operation ARE gated (I_EHR_SERVICE.get_ehr-existing_ehr_by_subject_id, -get_ehr_by_invalid_subject_id). Closes when the binding model gains a deliberate-omission form and the outcome taxonomy a malformed-request kind (extension only by schedule release)."
  - id: locatable-uid-copied-version-form
    description: "A served top-level object (EHR_STATUS, COMPOSITION, …) carries its uid as the FULL three-part OBJECT_VERSION_ID copied from the enclosing VERSION, not truncated to the leading object_id — so a client can parse the version coordinate out of the body it was served."
    source: "ITS-REST Resources.md §Identifier types (\"it is strongly recommended that the inherited `uid` attribute in COMPOSITION objects be populated using the `uid` copied from the enclosing VERSION object. For example, if an ORIGINAL_VERSION.uid is `87284370-2D4B-4e3d-A3F3-F303D2F4F34B::uk.nhs.ehr1::2`, then this value should be copied to the COMPOSITION.uid attribute\"; the same section derives request addressing from that served value) CONTRADICTED by RM common master03-archetyped_package.adoc §Unique Node Identification and the RM ehr EHR_STATUS class §Description, which both recommend copying `_uid.object_id()_` only — \"the leading Uid, which is normally a Guid\". Released-vs-released; adjudicated in register AMB-65 in favour of the ITS-REST form, since RM common locatable.adoc types `uid` as UID_BASED_ID and so admits both"
    covered_by: [I_EHR_STATUS.get_versioned_ehr_status-contained_uid_form]
  - id: resource-identifier-stability
    description: "A resource identifier, once assigned, keeps addressing the same resource for that resource's lifetime: the versioned_object_uid minted at creation still resolves — to the container's current state — after a further version is committed under it."
    source: "ITS-REST Resources.md §Resource identification (\"Each resource has a unique identifier within the system for its type, typically including a globally unique identifier and, in some cases, a version identifier. Once assigned, a resource identifier remains unchanged throughout its lifetime.\")"
    covered_by: [I_EHR_COMPOSITION.get_composition_latest]
  - id: resource-multiple-identifier-forms
    description: "The two addressing forms of the same versioned resource agree: while the latest version is unchanged, the explicit version_uid URI and the implicit versioned_object_uid URI resolve to the identical resource."
    source: "ITS-REST Resources.md §Multiple identifiers for the same resource (\"There are circumstances when openEHR resources can be uniquely identified by two different identifiers\" — the explicit version reference and the implicit latest version reference — \"However, the implicit URI will only resolve to the same resource as the explicit versioned URI as long as no new versions are created\")"
    exception:
      reason: coverage_gap
      note: "Each form is exercised on its own (I_EHR_COMPOSITION.get_composition_version reads by version_uid, I_EHR_COMPOSITION.get_composition_latest reads by versioned_object_uid), but no case asserts the EQUIVALENCE the section states — one flow reading both forms of the same head version and comparing the two representations. That is the whole behaviour, so a NEW case closes it; it is authorable today (both bindings exist and the equivalent assertion compares served payloads). Recorded rather than silently absorbed: the section is a released cross-cutting rule with no exercising case."
  - id: ehr-subject-uniqueness-and-key
    description: "A subject owns at most one EHR: the key is the EHR_STATUS.subject.external_ref (id.value, namespace) pair compared exactly, the refusal is the same 409 as an id-duplicate, and it holds on the client-supplied-id create path as well as the id-less one."
    source: "SM i_ehr_service.adoc §create_ehr_for_subject (error `ehr_for_subject_already_exists`) — the only released sentence that establishes the refusal at all; §create_ehr_for_subject_with_id omits it, and §get_ehrs_for_subject (\"Retrieve EHR or EHRs that have `ehr_status.subject_id` = supplied subject id\", returning a List) reads against it + RM ehr EHR_STATUS class §Attributes (`subject`: 1..1 PARTY_SELF, external_ref for the demographic reference — no uniqueness rule and no comparison rule) + ITS-REST Requests_and_responses.md §HTTP status codes row 409 (\"Indicates that the request could not be processed because it might generate a duplicate or a conflict\"). The key's comparison rule has no released sentence at all — register AMB-63 records the exact-match choice as our own design/extension"
    covered_by:
      # The stated half — the id-less create path — gates.
      - I_EHR_SERVICE.create_ehr-two_ehrs_same_patient
      # The unstated half — the client-supplied-id path — reports at OPTIONS.
      - I_EHR_SERVICE.create_ehr-with_ehr_id_subject_taken
  - id: ehr-status-subject-accepted-on-create
    description: "A create carrying an EHR_STATUS whose subject is populated is ACCEPTED and that subject becomes the EHR's subject — the SM `Pre_no_subject` precondition is a released defect and is not enforced."
    source: "SM i_ehr_service.adoc §create_ehr and §create_ehr_with_id state `Pre_no_subject`: `an_ehr_status.subject = Void`, immediately followed by \"A default `_subject_` will be generating containing a `PARTY_SELF` object\" — contradicting itself, and contradicting RM ehr EHR_STATUS class §Attributes (`subject`: 1..1 PARTY_SELF, so a Void subject is not a valid EHR_STATUS) and the released ITS-REST EHR API, which surfaces no for-subject create operation and so leaves the optional EHR_STATUS body as the ONLY way a client can give an EHR a subject. Adjudicated in register AMB-66"
    covered_by:
      - I_EHR_SERVICE.create_ehr-two_ehrs_same_patient
      - I_EHR_SERVICE.get_ehr-existing_ehr_by_subject_id
      - I_EHR_SERVICE.has_ehr-existing_subject_id
      - I_EHR_SERVICE.create_ehr-with_ehr_id_subject_taken
  # Conditional / versioning headers (ITS-REST Requests_and_responses.md).
  - id: header-etag-on-create
    description: "ETag returned on resource creation carrying the new version/object uid (optimistic concurrency)."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (ETag taken from VERSION.uid / EHR.ehr_id, changes on each new version)"
    covered_by: [I_EHR_COMPOSITION.create_composition-event, I_EHR_SERVICE.create_ehr-main]
  - id: header-etag-weak-prefix
    description: "Every ETag holding a resource identifier carries the weak-type W/ weakness indicator — on EHR, COMPOSITION, EHR_STATUS, FOLDER, CONTRIBUTION and VERSION responses alike, whatever identifier the service chose to put inside it."
    source: "ITS-REST Requests_and_responses.md §Deprecated headers (\"The `ETag` response header was used without a weakness indicator `W/`. This is now deprecated, all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`\") + §ETag and Last-Modified (the weak-type rationale and the `ETag: W/\"…::…::2\"` shape; the identifier inside is a choice — \"usually taken from e.g. VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value\")"
    covered_by:
