    description: "Every typed tag route family 404s when the addressed versioned object is of another kind: within the EHR space (composition / ehr_status), within the demographic space (person / agent / group / organisation / role), and across the two (a COMPOSITION uid on a party tag route, or a party uid on a composition tag route). Enforced on GET, PUT and DELETE alike, together with plain existence."
    source: "Register AMB-91 (the wrong-kind 404 adjudication, widened to all seven typed families and the cross-space direction) over ITS-REST responses/404_unknown_ehr_id_or_uid_based_id{,_or_key}.yaml and responses/404_unknown_uid_based_id{,_or_key}.yaml (\"returned when the uid_based_id does not exist\") + the route-typed ITS-REST tag operations. The EHR half additionally has RM ehr ehr.adoc EHR.tags (\"Tag target values can only be within the same EHR\"); the demographic half has NO such RM containment — register AMB-137 records that silence — so its kind discipline rests on the route typing plus AMB-91, not on an RM reach rule."
