  # The directory `path` query parameter (ITS-REST directory GET operations).
  - id: directory-path-parameter-navigation
    description: "The `path` query parameter NARROWS a directory GET to a nested sub-FOLDER — the served body is that sub-FOLDER, not the root — on BOTH directory read routes (latest/at-time and by-version); a path that resolves to nothing is 404, never an ancestor folder and never an empty success."
