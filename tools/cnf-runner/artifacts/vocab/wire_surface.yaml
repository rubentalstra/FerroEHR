  # admitting ITS-only anchors" — was lifted by the AMB-161 reserved
  # `I_ITS_REST_*` pseudo-interface + the pinned NON_SM_REST_OPERATIONS table
  # (tools/cnf-runner/src/validate.rs), which post-dates both entries and exists
  # for exactly this shape: a RELEASED ITS-REST operation the SM models no
  # interface for. AMB-136 was re-adjudicated against it the same day. The
  # anchors name no SM operation, so nothing here claims the SM defines one, and
  # the ITS→SM realization gap stays reported (#1516, #1582).
  - id: ehr-side-revision-history-reads
    description: "The EHR-side REVISION_HISTORY reads (GET /ehr/{ehr_id}/versioned_ehr_status/revision_history and GET /ehr/{ehr_id}/versioned_composition/{versioned_object_uid}/revision_history) are ITS-REST wire operations with NO SM anchor: SM defines no revision-history operation on any interface (grep across SM/docs = zero hits; the abstract counterpart is RM VERSIONED_OBJECT.revision_history()). They are anchored under the reserved I_ITS_REST_REVISION_HISTORY pseudo-interface (AMB-161) and exercised: the two-commit shape/order cases assert one REVISION_HISTORY_ITEM per version, oldest-first per the RM's items.last postconditions (AMB-68), each carrying its version_id and a commit audit; the miss branch is cased per route."
    source: "SM openehr_platform I_EHR_STATUS / I_EHR_COMPOSITION operation lists (docs/specs/openehr/SM/docs/UML/classes/) vs the released ITS-REST 1.1.0 EHR wire; AMB-72 records the interface defects; RM common revision_history.adoc + revision_history_item.adoc for the served shape; the ITS-REST docs text is silent on revision history, so the released operation files (specifications/operations/versioned_{composition,ehr_status}_revision_history.yaml) ground the status set, cited AS the OAS"
    covered_by:
      - I_ITS_REST_REVISION_HISTORY.versioned_ehr_status_revision_history-two_versions
      - I_ITS_REST_REVISION_HISTORY.versioned_ehr_status_revision_history-bad_ehr
