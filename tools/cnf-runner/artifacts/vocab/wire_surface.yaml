# Axis 3 — cross-cutting wire-surface behaviours (populated below).
elements:
  # ITEM_TAG routes + wrapper headers (RM common master07-tags.adoc; ITS-REST
  # Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag;
  # the Release-1.1.0 /tags routes). ITS-REST-only operations — no SM
  # interface, so axis 1 cannot enumerate them (#288 owns that derivation
  # fix); registered here so the surface is an honest boundary, not silence.
  - id: item-tag-identity-key-path-pair
    description: "Two same-key tags on different target_paths coexist on one target; PUT round-trips both (identity = key + target_path pair)."
    source: "ITS-REST Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag (uniquely identified by their key and target_path pair)"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#365); runner tag verbs land with the #288 derivation fix"
  - id: item-tag-version-vs-container-targets
    description: "Container-addressed and VERSION-addressed tag collections of the same target are disjoint; each PUT replaces only the addressed collection."
    source: "RM common master07-tags.adoc ITEM_TAG.target (may be a VERSIONED_OBJECT<T> or a VERSION<T>); ITS-REST Requests_and_responses.md §item-tag headers"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#365); the disjointness now also holds through the wrapper-header write/echo path (#398, app/ehrbase-rest/tests/headers.rs reads both collections back through composition_tags_get after a two-header write); runner tag verbs land with the #288 derivation fix"
  - id: item-tag-rm-target-shape
    description: "ITEM_TAG.target is emitted as the RM UID_BASED_ID (HIER_OBJECT_ID container / OBJECT_VERSION_ID version), never an OBJECT_REF wrapper."
    source: "RM common master07-tags.adoc ITEM_TAG (target: UID_BASED_ID); the RELEASED RM wins over the stalled OAS ItemTag schema"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#365); runner tag verbs land with the #288 derivation fix"
  - id: item-tag-kind-checked-routes
    description: "A tag route family (composition / ehr_status) 404s when the addressed versioned object is of the other kind."
    source: "RM ehr ehr.adoc EHR.tags (tag targets within the same EHR) + the route-scoped ITS-REST tag operations"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#365); runner tag verbs land with the #288 derivation fix"
  - id: item-tag-wrapper-headers-distinct-collections
    description: "openehr-item-tag replaces the container collection and openehr-version-item-tag the committed VERSION's collection on a change-controlled write; an absent header leaves its collection untouched, and the RESPONSE echo confirms each target's stored list under its own header only."
    source: "ITS-REST Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag (\"openehr-item-tag applies to VERSIONED_OBJECT targets\"; \"openehr-version-item-tag applies to a specific target VERSION within a VERSIONED_OBJECT\") §Usage in Requests + §Usage in Responses (\"Servers MAY include the openehr-item-tag or openehr-version-item-tag header in responses to confirm the actual list of ITEM_TAGs stored on the server side\")"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested: the request side in #365, and the RESPONSE echo in #398 (app/ehrbase-rest/tests/headers.rs) — the two collections are kept separate through the write seam so openehr-item-tag echoes only the VERSIONED_OBJECT's stored list and openehr-version-item-tag only the VERSION's (previously both headers carried the merged union), and a header the request did not send is not echoed at all. runner tag verbs land with the #288 derivation fix"
  # Conditional / versioning headers (ITS-REST Requests_and_responses.md).
  - id: header-etag-on-create
    description: "ETag returned on resource creation carrying the new version/object uid (optimistic concurrency)."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (ETag taken from VERSION.uid / EHR.ehr_id, changes on each new version)"
    covered_by: [I_EHR_COMPOSITION.create_composition-event, I_EHR_SERVICE.create_ehr-main]
  - id: header-etag-weak-prefix
    description: "ETag carries the weak-type W/ prefix (format-independent version identity)."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (ETag is weak-type; should carry the W/ weakness indicator)"
    covered_by: [I_EHR_COMPOSITION.create_composition-event]
  - id: header-location-on-create
    description: "Location header on 201 Created pointing at the new resource URL."
    source: "ITS-REST Requests_and_responses.md §Location (used in 201 Created; MUST NOT indicate an alternate representation)"
    covered_by: [I_EHR_COMPOSITION.create_composition-event, I_EHR_SERVICE.create_ehr-main]
  - id: header-last-modified
    description: "Last-Modified response header on versioned resources (from VERSION.commit_audit.time_committed)."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (Last-Modified SHOULD be included for VERSION/VERSIONED_OBJECT responses)"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#396, app/ehrbase-rest/tests/headers.rs): Last-Modified is now emitted on every VERSION read, on the COMPOSITION / EHR_STATUS reads and writes, and on the EHR create, with the value pinned byte-equal to the IMF-fixdate rendering of the served VERSION.commit_audit.time_committed. The presence is DECLARED as `Last-Modified: present` on those binding outcomes. NEW-CASE candidate blocked on the runner capability tracked in #403: `outcomes.*.headers` matchers are parsed but never evaluated — only the status is classified (tools/cnf-runner/src/exec/outcome.rs) — so no executable header assertion exists yet; this gap closes when #403 lands header-matcher evaluation."
  - id: header-prefer-return-representation
    description: "Prefer: return=representation is honored — the created/updated resource body is returned (vs the default return=minimal)."
    source: "ITS-REST Requests_and_responses.md §Prefer + §Representation details negotiation (default return=minimal; return=representation returns the full resource)"
    covered_by: [I_EHR_COMPOSITION.create_composition-event]
  - id: header-prefer-return-identifier
    description: "Prefer: return=identifier is honored — the body is the identifier of the affected resource only, at a 201/200 status, never 204 No Content."
    source: "ITS-REST Requests_and_responses.md §Prefer only identifier (\"a variant of preference that implies minimal response semantics, but with a non-empty response body (i.e. the status will be `201 Created` or `200 OK`, never `204 No Content`)\"; \"when application/json is requested … the response body will be a single JSON object with a single uid attribute\")"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#398, app/ehrbase-rest/src/overview/negotiate.rs unit matrix + app/ehrbase-rest/tests/headers.rs `ehr_status_update_identifier_is_never_204` + tests/directory_http.rs `create_identifier_returns_uid_only` + tests/demographic_http.rs `person_create_identifier_returns_the_uid_body`): the identifier branch is unreachable without an identifier to render, so it can no longer degrade into the 204 minimal body, and the EHR_STATUS PUT — whose minimal outcome IS 204 — answers 200 with the `{uid}` body. NEW-CASE candidate: every binding fixes one `Prefer` value in its request headers, so an identifier variant needs its own variant binding, and its assertion needs the header-matcher evaluation tracked in #403 (`outcomes.*.headers` matchers are parsed but never evaluated — only the status is classified, tools/cnf-runner/src/exec/outcome.rs)."
  - id: header-preference-applied
    description: "Preference-Applied on a write response names the return preference the response actually applied (return=minimal | return=identifier | return=representation), including the applied default when no Prefer was sent."
    source: "ITS-REST Requests_and_responses.md §Representation details negotiation (\"The service MAY include a `Preference-Applied` header in the response, such as `Preference-Applied: return=minimal` or `Preference-Applied: return=representation`, to indicate that the client's preference has been honored\"; \"If no `Prefer` header is provided, the default behavior is assumed to be `return=minimal`\") + the §Location and §Prefer only identifier response examples, which show the header on a 201 and on the identifier 200"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#398, app/ehrbase-rest/tests/{headers,demographic_http,flat_http,definition_adl2_http}.rs): every write path — canonical/JSON RM writes, demographic party/relationship/contribution writes, both template uploads, the ITEM_TAG collection writes, and the Simplified-Formats COMPOSITION commit — declares the preference it applied through one seam, and never claims an unapplied preference. The presence is DECLARED as `Preference-Applied: present?` (a MAY) on the create_composition / update_composition binding outcomes. NEW-CASE candidate blocked on the runner capability tracked in #403: `outcomes.*.headers` matchers are parsed but never evaluated."
  - id: header-if-match-412
    description: "If-Match precondition on a state-changing method evaluates false → 412 Precondition Failed, latest version_uid echoed in ETag; absent when required → 400."
    source: "ITS-REST Requests_and_responses.md §If-Match and accidental overwrites (412 on false condition; 400 when the service expects If-Match and it is absent)"
    exception:
      reason: coverage_gap
      note: "NEW-CASE candidate: a stale-If-Match update (update_composition / update_directory / update_party) expecting 412 + latest version_uid in ETag. Consistent with the Axis-2 precondition_failed/precondition_missing gaps on those bindings."
  - id: header-if-match-weak-form
    description: "If-Match supplied in the weak entity-tag form W/\"<uid>\" — the shape the server itself emits as the ETag — is decoded and evaluated as a precondition: a current value passes the write, a stale value is 412 (never a malformed-syntax rejection)."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (the ETag \"is considered to be of weak-type and should have a weakness indicator W/ prefix\") + §Deprecated headers (\"all ETag headers that hold a resource identifier MUST include a weakness indicator W/\") + §If-Match and accidental overwrites (412 only when \"the condition evaluates to false\")"
    covered_by:
      - I_DEMOGRAPHIC_SERVICE.update_party-weak_etag_accepted
      - I_DEMOGRAPHIC_SERVICE.update_party-weak_etag_stale
  - id: header-committal-change-type-merge
    description: "A client-supplied AUDIT_DETAILS change_type in the openehr-audit-details committal header is merged into the commit (a legal divergent group code like 250|amendment| on an update is honoured verbatim); an out-of-group token is 422 (Change_type_valid); a group code contradicting the operation (249|creation| on an update) is a 400 change-control mismatch."
    source: "ITS-REST Requests_and_responses.md §openehr-version and openehr-audit-details (change_type first among the client-suppliable attributes; \"whatever is provided it MUST be merged\") + RM common master04 (AUDIT_DETAILS.Change_type_valid) + RM common master06 §Contributions (the audit_change_type group semantics)"
    covered_by:
      - I_EHR_COMPOSITION.update_composition-audit_amendment
      - I_EHR_COMPOSITION.update_composition-audit_change_type_mismatch
      - I_EHR_COMPOSITION.update_composition-audit_change_type_invalid
  - id: header-committal-on-delete
    description: "The committal request headers are accepted and merged on DELETE too — the delete commits a 523|deleted| VERSION whose AUDIT_DETAILS carries the supplied description/committer."
    source: "ITS-REST Requests_and_responses.md §openehr-version and openehr-audit-details (\"services MUST also allow PUT, POST and DELETE methods directly\"; \"services MUST accept openehr-version and openehr-audit-details custom request headers\") + RM common master06 §Logical Deletion"
    covered_by: [I_EHR_COMPOSITION.delete_composition-audit_headers]
  - id: header-deprecated-audit-details-bare
    description: "The bare deprecated committal header name openEHR-AUDIT_DETAILS (a different name than the Release-1.1.0 openehr-audit-details after lowercasing) is still accepted, with the same attribute-path-in-value grammar."
    source: "ITS-REST Requests_and_responses.md §Deprecated headers (the openEHR-AUDIT_DETAILS -> openehr-audit-details table row; \"the deprecated headers remain available for backward compatibility\")"
    covered_by: [I_EHR_COMPOSITION.update_composition-audit_bare_deprecated]
  - id: header-if-match-case-insensitive
    description: "The If-Match OBJECT_VERSION_ID is compared case-insensitively: a token differing from the current version_uid only in case names the same version and must not raise a spurious 412."
    source: "BASE base_types master05-identification_package.adoc §Composite Identifiers and Case (two composite identifiers \"identical apart from case … identify the same thing\") applied to the ITS-REST Requests_and_responses.md §If-Match and accidental overwrites condition"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#394, app/ehrbase-rest/tests/demographic_http.rs + the service unit tests). NEW-CASE candidate blocked on a runner capability: a case cannot build a case-flipped variant of a captured version_uid (the only capture transforms are strip: weak-quotes and transform: root-uid — tools/cnf-runner/src/model/binding.rs), and no per-case header override exists."
  - id: header-location-only-on-create
    description: "Location is emitted ONLY on resource creation (and redirects): reads, deletes, and 4xx error responses carry no Location; the version identity travels in the weak ETag."
    source: "ITS-REST Requests_and_responses.md §Location (\"It MUST NOT be used to indicate an alternate representation of an existing resource (e.g. via GET method)\"; \"The Location header MUST ONLY be used for resource creation (e.g., 201 Created) or redirect responses\") + §Deprecated headers (Location deprecated on GET and DELETE responses)"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#394); the absence is DECLARED as `Location: absent` on the get_party / get_party_at_time / get_party_at_version / delete_party / update_party binding outcomes. NEW-CASE candidate blocked on a runner capability: `outcomes.*.headers` matchers are parsed but never evaluated — only the status is classified (tools/cnf-runner/src/exec/outcome.rs), so no header assertion (present/absent/pattern) executes today."
  - id: header-etag-on-versioned-object-read
    description: "A VERSIONED_OBJECT / VERSION read carries the weak ETag (VERSIONED_OBJECT.uid.value or VERSION.uid.value) and, where the commit instant is available, Last-Modified."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (\"Both ETag and Last-Modified SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique state identifiers\"; the ETag \"is usually taken from e.g. VERSIONED_OBJECT.uid.value, VERSION.uid.value\", Last-Modified \"derived from VERSION.commit_audit.time_committed.value\")"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested for the demographic versioned reads (#394) and for the EHR-group VERSION / COMPOSITION / EHR_STATUS reads (#396, app/ehrbase-rest/tests/headers.rs); the presence is DECLARED as `ETag` + `Last-Modified` on those binding outcomes. NEW-CASE candidate blocked on two runner capabilities: header matchers are not evaluated (see header-location-only-on-create; tracked as #403), and the /demographic/versioned_party/** resource has no binding of its own — the SM versioned-party reads are realized through I_PARTY.get_party_at_version on /demographic/person/{version_uid}."
  # Content negotiation (ITS-REST Requests_and_responses.md §HTTP status codes + Representation details negotiation).
  - id: negotiation-canonical-json
    description: "Canonical-JSON representation negotiated and returned (the default representation)."
    source: "ITS-REST Requests_and_responses.md §Representation details negotiation (Accept/Content-Type negotiation of the resource representation)"
    covered_by: [I_EHR_COMPOSITION.get_composition_latest]
  - id: negotiation-canonical-xml
    description: "Canonical-XML representation negotiated via Accept: application/xml."
    source: "ITS-REST Requests_and_responses.md §Representation details negotiation (the alternative XML representation)"
    covered_by: [SF-EXAMPLE-accept_forms]
  - id: negotiation-406-not-acceptable
    description: "Accept names a representation the resource cannot produce → 406 Not Acceptable."
    source: "ITS-REST Requests_and_responses.md §HTTP status codes (406 Not Acceptable: no acceptable representation for the target resource)"
    covered_by: [SF-EXAMPLE-unsupported_accept]
  - id: negotiation-415-unsupported-media
    description: "Request payload media type unsupported by the method on the target resource → 415 Unsupported Media Type."
    source: "ITS-REST Requests_and_responses.md §HTTP status codes (415 Unsupported Media Type) + Resources.md §XML Format (\"If the service cannot process the request payload as XML format, it MUST respond with HTTP status code 415 Unsupported Media Type\") and the symmetric §JSON Format sentence"
    covered_by: [SF-DEPRECATED-media_unsupported, I_DEFINITION_ADL14.upload_opt-wrong_media]
  - id: negotiation-json-accept-on-template-get
    description: "Accept: application/json on the ADL 1.4 OPT GET is fulfilled with the Web Template JSON document (the only JSON template representation the released text defines), not refused."
    source: "ITS-REST Resources.md §JSON Format (an Accept the service cannot fulfil is 406, so a fulfilled one returns a body) + §Simplified Formats (application/openehr.wt+json = the Operational Template as Web Template JSON); the representation itself rests on register AMB-58 (the released source enumerates application/json on this operation without declaring a schema for it)"
    covered_by: [SF-WT-web_template_json_accept]
  - id: negotiation-response-content-type-mirrors-accept
    description: "The response Content-Type is the media type the client negotiated — a read accepted as application/json is answered application/json, never in another type the client did not accept."
    source: "ITS-REST Resources.md §JSON Format (\"Proper header Content-Type: application/json MUST be present in the response of the service unless the response has no content body\") + §XML Format (the same MUST for application/xml)"
