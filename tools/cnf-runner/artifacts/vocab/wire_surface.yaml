  - id: negotiation-415-unsupported-media
    description: "Request payload media type unsupported by the method on the target resource → 415 Unsupported Media Type."
    source: "ITS-REST Requests_and_responses.md §HTTP status codes (415 Unsupported Media Type) + Resources.md §XML Format (\"If the service cannot process the request payload as XML format, it MUST respond with HTTP status code 415 Unsupported Media Type\") and the symmetric §JSON Format sentence (\"If the service cannot process the request payload as JSON format, it MUST respond with HTTP status code 415 Unsupported Media Type\") + §Simplified Formats (the same MUST for the simplified types)"
    covered_by:
      - SF-DEPRECATED-media_unsupported
      - SF-LEGACY-nc_flat_media_unsupported
      - I_DEFINITION_ADL14.upload_opt-wrong_media
      - I_EHR_COMPOSITION.create_composition-wrong_media
  - id: negotiation-json-accept-on-template-get
    description: "Accept: application/json on the ADL 1.4 OPT GET is fulfilled with the Web Template JSON document (the only JSON template representation the released text defines), not refused."
    source: "ITS-REST Resources.md §JSON Format (an Accept the service cannot fulfill is 406, so a fulfilled one returns a body) + §Simplified Formats (application/openehr.wt+json = the Operational Template as Web Template JSON); the representation itself rests on register AMB-58 (the released source enumerates application/json on this operation without declaring a schema for it)"
    covered_by: [SF-WT-web_template_json_accept]
  - id: negotiation-response-content-type-mirrors-accept
    description: "The response Content-Type is the media type the client negotiated — a read accepted as application/json is answered application/json, never in another type the client did not accept."
    source: "ITS-REST Resources.md §JSON Format (\"Proper header Content-Type: application/json MUST be present in the response of the service unless the response has no content body\") + §XML Format (the same MUST for application/xml)"
    covered_by:
      - SF-WT-web_template_json_accept
      - I_EHR_COMPOSITION.get_composition_latest
      - I_EHR_COMPOSITION.create_composition-event
      - I_EHR_STATUS.get_ehr_status-get_by_ehr_id
      - I_EHR_CONTRIBUTION.get_contribution-existing
  # Error-body + deprecated-media families.
  - id: error-body-family
    description: "For 4xx/5xx, services MAY return additional error details ({message, code, errors[]}) when Prefer: return=representation is present; the runner asserts at most a message string (loose)."
    source: "ITS-REST Requests_and_responses.md §HTTP status codes (4xx/5xx MAY carry additional error details under Prefer: return=representation)"
    covered_by: [I_EHR_COMPOSITION.create_composition-invalid_event, I_EHR_CONTRIBUTION.commit_contribution-full_ehr_status]
  - id: deprecated-media-conditional
    description: "Support for the deprecated pre-1.1.0 SDT-era simplified-format media types is implementation-defined (supported → commit succeeds; unsupported → 415)."
    source: "ITS-REST simplified_formats master02-overview.adoc §MIME Types + §Overview (SDT superseded at 1.1.0); register AMB-39"
    covered_by: [SF-DEPRECATED-media_supported, SF-DEPRECATED-media_unsupported]
  # Query EHR-scope request header (ITS-REST docs/query/Request.md).
  - id: query-ehr-id-request-header
    description: "The openehr-ehr-id request header alone scopes a query execution to one EHR — on ad-hoc GET, ad-hoc POST, and stored execution — exactly as the ehr_id query parameter does."
    source: "ITS-REST query Request.md §About the ehr_id parameter (\"clients MAY supply it as a query parameter `ehr_id` or alternatively as a request header named `openehr-ehr-id`\") + §Common Headers and Query Parameters (\"All query execution requests SHOULD support at least the following parameters\"; \"Related request headers: `openehr-ehr-id` - used to execute the query within a single EHR context\") + Query_types.md §Single EHR queries — no HTTP method and no execution form is carved out"
    covered_by:
      - I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_header_get
      - I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_header_post
      - I_QUERY_SERVICE.execute_stored_query-ehr_id_header
  - id: query-ehr-id-parameter-header-conflict
    description: "A query execution carrying BOTH the ehr_id query parameter and the openehr-ehr-id header is executed when they name the same EHR and rejected 400 when they name different EHRs."
    source: "ITS-REST query Request.md §About the ehr_id parameter offers the two forms as alternatives and never defines the both-supplied case — the released text is SILENT, adjudicated in register AMB-59 (400 per Requests_and_responses.md §HTTP status codes, row 400 / generic client-side error)"
    # RETIRED coverage_gap (2026-07-28): the exception's own closing condition —
    # "the two forms naming the same EHR execute, naming different EHRs is
    # refused … now authorable and simply MISSING" — is met, as BOTH halves.
    # The new `ehr_id_param_and_header` variant binding is the first that can
    # express the collision at all (the earlier variants each carry one form
    # only), and its two outcomes are gated by one isolated case each. The
    # conflicting case mints a SECOND real EHR for the header so the refusal
    # cannot be the unknown-scope 404 of AMB-101; the AMB-59 adjudication rides
    # on both cases as an explicit guard.
    covered_by:
      - I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_param_and_header_agree
      - I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_param_and_header_conflict
  - id: query-unknown-ehr-scope-not-found
    description: "A query execution scoped to a well-formed but non-existent ehr_id reports the EHR does not exist rather than answering an empty result set."
    source: "SM i_query_service.adoc §execute_ad_hoc_query and §execute_stored_query (both declare the error `ehr_id_does_not_exist`; `_ehr_ids_` is \"Specific set of EHRs on which to execute the query\") vs the released ITS-REST query API, which gives that error no wire branch — docs/query/Request.md §About the ehr_id parameter says only that the scope \"MAY be used by the underlying backend to perform routing, optimizations or similar\". Adjudicated in register AMB-101 (fixed handling: 404, realizing the SM error), on Requests_and_responses.md §HTTP status codes row 404 (\"The origin service did not find the target resource or is not willing to disclose that one exists\")"
    covered_by: [I_QUERY_SERVICE.execute_ad_hoc_query-unknown_ehr_scope]
  # Query paging: the URL/body duality and the composition with in-query AQL
  # clauses (ITS-REST docs/query/Request.md §Common Headers and Query Parameters).
  - id: query-post-url-paging-forms
    description: "The URL paging parameters are honoured on the POST execution forms: fetch supplied only in the query string windows the result, and the same value carried in both the URL and the body is accepted."
    source: "ITS-REST query Request.md §Common Headers and Query Parameters (\"All query execution requests SHOULD support at least the following parameters\" — `offset`/`fetch` among them, with no GET/POST distinction drawn) + §GET vs POST (the body form: \"a mostly self-documented AQL query in a request body\"). The both-places precedence is unlegislated and adjudicated in register AMB-99 (fixed handling: equal values accepted)"
    covered_by:
      - I_QUERY_SERVICE.execute_ad_hoc_query-post_fetch_url_only
      - I_QUERY_SERVICE.execute_ad_hoc_query-post_fetch_url_and_body
  - id: query-post-paging-parameter-conflict
    description: "A query POST carrying DIFFERENT values for the same paging parameter in the URL and in the body is rejected rather than silently resolved to one of them."
    source: "ITS-REST query Request.md §Common Headers and Query Parameters offers the URL forms for all execution requests while the POSTs carry the same parameters in the body, and no released sentence assigns precedence when both are supplied — the released text is SILENT, adjudicated in register AMB-99 (a disagreement is 400, per Requests_and_responses.md §HTTP status codes row 400 / generic client-side error)"
    # RETIRED coverage_gap (2026-07-28): the exception's own closing condition —
    # "the binding outcome and its case" — is met. The `post_fetch_url` variant
    # already offered the two paging slots as SEPARATE references, so the
    # refusal needed no new variant, only the `bad_request` outcome the
    # 2026-07-28 schedule release (#544) made nameable plus a case binding the
    # two slots to different, individually legal window sizes. The ACCEPTED
    # half of the same duality stays gated by query-post-url-paging-forms; the
    # AMB-99 adjudication rides on the new case as an explicit guard.
    covered_by: [I_QUERY_SERVICE.execute_ad_hoc_query-post_fetch_conflict]
  - id: query-paging-composes-over-aql-limit
    description: "REST paging composes OVER an in-query AQL LIMIT: the AQL clause shapes the logical result set, then offset/fetch window it."
    source: "ITS-REST query Request.md §Common Headers and Query Parameters states the one exclusion on `fetch` against the DEPRECATED TOP only (\"cannot be combined with AQL-top\") and says nothing about its replacement — QUERY AQL master03-syntax.adoc §LIMIT — so the relation of REST paging to LIMIT/OFFSET is unlegislated; adjudicated in register AMB-98 (fixed handling: composition)"
    covered_by: [I_QUERY_SERVICE.execute_ad_hoc_query-fetch_over_limit]
  - id: query-protocol-parameter-names-reserved
    description: "The protocol parameter names (q, ehr_id, offset, fetch) are reserved in the URL: such a parameter is always the protocol parameter, and an AQL $parameter of the same name is bound only through the body's query_parameters object."
    source: "ITS-REST query Request.md §Common Headers and Query Parameters (the protocol parameters) vs §Query parameters (\"other parameter(s) to replace placeholder(s) within the query … in the real request they will have specific names … according to their names in the query definition\") — no released sentence resolves a collision between the two namespaces, and the spec collides with itself (the QueryParameters example binds `ehr_id` while §About the ehr_id parameter defines it as the EHR scope). Adjudicated in register AMB-100 (fixed handling: the four names are reserved)"
    covered_by: [I_QUERY_SERVICE.execute_stored_query-protocol_fetch_reserved]
  # Stored-query identity: the qualified name + version selector
  # (ITS-REST docs/query/Qualified_query_name.md).
  - id: query-stored-version-selector-matching
    description: "A stored query is addressable at a version: an exact major.minor.patch selector executes that definition, a {major} prefix the highest version inside that major, and a {major}.{minor} prefix the highest inside that minor line."
    source: "ITS-REST query Qualified_query_name.md §Qualified query name (the version identifier) (\"The `version` identifier is in the format specified by SEMVER style (i.e. `major.minor.patch`)\"; \"When only a partial `version` pattern is supplied, or when `version` is not supplied at all, the system must use the latest `version` with the supplied prefix - i.e. if only `major` or `major.minor` is used, then the latest query version matching supplied prefix will be used\")"
    covered_by:
      - I_QUERY_SERVICE.execute_stored_query-version_exact
      - I_QUERY_SERVICE.execute_stored_query-version_major_prefix
      - I_QUERY_SERVICE.execute_stored_query-version_minor_prefix
  - id: query-stored-version-unmatchable-selector
    description: "A version selector that matches no stored version — an out-of-range major, or a token that is neither an exact SEMVER nor a legal {major}/{major}.{minor} prefix — is not found, and never falls back to another version."
    source: "ITS-REST query Qualified_query_name.md §Qualified query name (the version identifier) admits exactly the exact-SEMVER and the {major}/{major}.{minor} prefix shapes and assigns nothing to any other token; adjudicated in register AMB-102 (fixed handling: an unmatchable selector IS a version that does not exist), on Requests_and_responses.md §HTTP status codes row 404 (\"The origin service did not find the target resource or is not willing to disclose that one exists\")"
    covered_by:
      - I_QUERY_SERVICE.execute_stored_query-version_unknown_major
      - I_QUERY_SERVICE.execute_stored_query-version_malformed_selector
  - id: query-reserved-query-name-unresolvable
    description: "The reserved query-name `aql` never identifies a stored query: it is refused on store, and a stored execution addressing it (behind any namespace) is not found."
    source: "ITS-REST query Qualified_query_name.md §NOTE (\"The `query-name` value must not be `aql` (case-insensitive), as that is a reserved name\") + Query_types.md §Ad-hoc queries (the bare `aql` segment IS the ad-hoc execution endpoint) + Requests_and_responses.md §HTTP status codes row 404; the read-side reading is register AMB-102's (\"covering malformed versions, out-of-class names, and the reserved name alike\")"
    covered_by:
      - I_DEFINITION_QUERY.store_query-reserved_name
      - I_QUERY_SERVICE.execute_stored_query-reserved_name
  # Query response headers (ITS-REST docs/query/Request.md §Common Headers and
  # Query Parameters, related response headers).
  - id: query-result-set-etag-identifier
    description: "A query execution answers with an ETag identifying the resultSet, in the mandatory weak form; the identifier inside the tag is the service's own choice and is not constrained."
    source: "ITS-REST query Request.md §Common Headers and Query Parameters (\"Related response headers: `ETag` - A unique identifier of the resultSet\") + Requests_and_responses.md §ETag and Last-Modified (\"Both `ETag` and `Last-Modified` SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique state identifiers\"; \"the `ETag` value is independent of its resource serialization format (JSON/XML) … Therefore, the `ETag` is considered to be of weak-type and should have a weakness indicator `W/` prefix\") + §Deprecated headers (\"all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`\")"
    covered_by:
      - I_QUERY_SERVICE.execute_ad_hoc_query-result_set_etag
      - I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_header_get
      - I_QUERY_SERVICE.execute_stored_query-ehr_id_header
      - I_QUERY_SERVICE.execute_stored_query-version_exact
  # Stored-query execution request shapes (ITS-REST docs/query/Request.md).
  - id: query-stored-post-body-optional
    description: "Every field of the stored-execution POST body is an optional parameter with a released default, so a parameterless stored query executes on an empty JSON object."
    source: "ITS-REST query Request.md §Common Headers and Query Parameters (\"`offset` - used for paging: the row number in result to start result-set from (`0`-based); default `0`\"; \"`fetch` - used for paging: the number of rows to fetch (i.e. limit); default depends on the implementation\") + §Query parameters (query_parameters are per query definition) + §GET vs POST (\"we recommend clients using the `POST` method instead of `GET`\", unqualified by execution form); the body-borne carriage of those parameters is recorded first-hand in register AMB-99"
    covered_by: [I_QUERY_SERVICE.execute_stored_query-post_empty_body]
  # Datetime request parameters (ITS-REST Resources.md §Datetime format).
  - id: datetime-param-timezone-optional
    description: "A datetime request parameter (version_at_time on every at-time read; the contribution time_range bounds) supplied in the extended ISO 8601 form WITHOUT a timezone is valid and is resolved in the server's local timezone, never rejected 400 — while the basic format, a bare date, and malformed values stay 400."
    source: "ITS-REST Resources.md §Datetime format (\"HTTP query parameters and path segments that are dates, datetimes, or times, MUST always use the _extended_ ISO 8601 format. The general form of a datetime is `YYYY-MM-DDThh:mm:ss.sss[Z|±hh:mm]`\"; \"Timezone SHOULD be only supplied when needed, otherwise the local timezone is assumed\") + specifications/parameters/query/version_at_time.yaml (\"A given time in the extended ISO 8601 format\" — a time, so a date-only value is not one)"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + tested (#401): one shared decoder (app/ferroehr/src/service/datetime.rs, with its unit matrix) now backs every at-time read of the EHR and DEMOGRAPHIC groups, so an offset-less extended datetime resolves against the server's system timezone instead of 400-ing on jiff::Timestamp's offset-requiring grammar; HTTP-tested end to end in app/ferroehr-rest/tests/directory_http.rs and tests/demographic_http.rs (`version_at_time_without_offset_resolves_in_the_local_timezone`). Not authorable as a case today: a case can only name an instant through the CLOSED reference grammar's temporal vocabulary (${time:before|after|between}, tools/cnf-runner/src/refgrammar.rs), every member of which renders a UTC `…Z` string (format_instant_ms, tools/cnf-runner/src/exec/resolve.rs) — there is no offset-less rendering form, and the three members' ±1 ms / midpoint margins would not survive reinterpretation in an unknown SUT-local zone (the runner has no way to learn the SUT's system timezone, and ITS-REST exposes none). A literal offset-less string cannot stand in either: the instants a case must address are its own commit times, known only at run time. Closes when the temporal vocabulary gains an offset-less rendering member whose margin exceeds the ±14 h UTC-offset range (extension only by schedule release) — the same closed-vocabulary precedent as method-501-unrecognized-method-deviation."
  # The System API (ITS-REST system, STABLE) — one operation, no SM anchor.
  - id: system-options-conformance-manifest
    description: "OPTIONS on the API base path answers 200 and carries the Allow header, describing the communication options for that resource — the docs-text half. The RESOURCE the operation is served on (`/`), the negotiated `Content-Type: application/json` and the JSON manifest body are grounded in the RELEASED OAS, which fills the docs text's silence here (owner ruling 2026-07-28). No MEMBER of the manifest is asserted: the Options schema declares none required, and an optional schema member is not a presence requirement."
    source: "TIER 1, DOCS TEXT — ITS-REST specifications/docs/system/Description.md §Status (\"This specification is in the `STABLE` state\") + docs/overview/Requests_and_responses.md §HTTP Methods (\"| OPTIONS | Describe the communication options for the target resource. |\", over RFC 9110, the authority that section names for method semantics) + §HTTP status codes (\"| 200 | OK | The request succeeded, payload sent in a 200 response depends on the request method |\" under \"an appropriate HTTP status code MUST be used as described above\"). The System chapter is a stub and states no path, no field list and no media type. TIER 2, THE RELEASED OAS, citable because tier 1 is silent (owner ruling 2026-07-28) and cited AS the OAS: system.openapi.yaml `paths: /` (options) and its `200_options` response (headers Allow + ContentType_JSON; content application/json, schema `Options`, which declares NO required member — hence no member assertion). Register AMB-160 records the ruling's application and keeps the editorial upstream ask #1604; the ITS-only anchor the case uses is register AMB-161."
    covered_by: [I_ITS_REST_SYSTEM.options-conformance_manifest]
  # HTTP-method discipline (ITS-REST Requests_and_responses.md §HTTP Methods).
  - id: method-405-allow-header
    description: "A known resource path called with a method it does not serve answers 405 Method Not Allowed AND carries the Allow header naming the methods that resource currently supports (the empty field value when a configuration gate leaves it serving none)."
    source: "ITS-REST Requests_and_responses.md §HTTP Methods (\"If a method is recognized but not allowed for the target resource, the response SHOULD be `405 Method Not Allowed` status code\") over RFC 9110, the authority that section names for method semantics (§15.5.6 \"The origin server MUST generate an Allow header field in a 405 response containing a list of the target resource's currently supported methods\"; §10.2.1 \"An empty Allow field value indicates that the resource allows no methods, which might occur in a 405 response if the resource has been temporarily disabled by configuration\")"
    covered_by: [I_EHR_SERVICE.create_ehr-wrong_method]
  - id: method-501-unrecognized-method-deviation
    description: "An unrecognized method is answered 405 (with Allow) rather than the 501 the overview SHOULDs, while 501 stays the answer for a recognized-but-unimplemented operation."
    source: "ITS-REST Requests_and_responses.md §HTTP Methods states two SHOULDs whose antecedents overlap for any method outside the tabulated subset (unrecognized AND not allowed for the target resource) and gives no precedence — adjudicated in register AMB-60; 405 is a predefined row of §HTTP status codes and so cannot conflict with it (\"Additional status codes MAY be used as long as they do not conflict with the predefined codes\"), while a blanket 501 fallback would also swallow unrouted paths owed the 404 of the same table"
    exception:
      reason: coverage_gap
      register: AMB-60
      note: "the deviation is registered, not silent, and the 405-with-Allow answer it shares with the recognized-method branch IS now gated (I_EHR_SERVICE.create_ehr-wrong_method, the method-405-allow-header element). What stays uncased is this element's own subject — an UNRECOGNIZED method — and the reason is the one closed-vocabulary blocker that survives the 2026-07-28 schedule release (#544): the binding request model's method vocabulary is the six-method subset the overview §HTTP Methods tabulates (tools/cnf-runner/src/vocab.rs `HttpMethod`), which by construction admits no token outside it, so a request the service cannot recognize cannot be authored. Its server behaviour is HTTP-tested (app/ferroehr-rest/tests/it/http.rs `unrecognized_method_is_405_with_allow`). The 501 half that IS realized — a recognized but unimplemented operation — has no ITS-REST 1.1.0 operation on this SUT that reaches it, since every mounted operation is implemented. Closes when the method vocabulary gains an unrecognized-token form (extension only by schedule release)."
  # Authentication challenge (ITS-REST Requests_and_responses.md §Authentication
  # and authorization).
  - id: header-www-authenticate-401
    description: "A 401 refusal carries the WWW-Authenticate response header — the authentication challenge, not a bare status."
    source: "ITS-REST Requests_and_responses.md §Authentication and authorization (\"If authentication and authorization are required, services MUST properly use the `WWW-Authenticate` and/or `Proxy-Authenticate` response headers, returning `403 Forbidden`, `401 Unauthorized` or `407 Proxy Authentication` as applicable\") + §HTTP status codes (row 401) over RFC 9110, the authority §HTTP headers names for the standard headers (§15.5.2: \"The server generating a 401 response MUST send a WWW-Authenticate header field … containing at least one challenge applicable to the target resource\"; `Proxy-Authenticate` is the 407 counterpart, §15.5.8)"
    covered_by: [SEC-AUTHENTICATED_ACCESS-www_authenticate_challenge]
  # Canonical-JSON serialization discipline (ITS-REST Resources.md §JSON Format).
  - id: json-null-empty-list-absent
    description: "RM attributes that are Null or an empty list are absent from the canonical-JSON representation — never rendered as a JSON null or an empty array, even for required attributes."
    source: "ITS-REST Resources.md §JSON Format (\"The RM attributes (even required ones) that are `Null` or an empty list (array) SHOULD be absent when serialized as JSON\")"
    covered_by: [I_EHR_COMPOSITION.create_composition-null_empty_absent]
  # Datetime handling (ITS-REST Resources.md §Datetime format).
  - id: datetime-body-lexical-preservation
    description: "A date/datetime/time value inside a request body is stored and read back in the client's own lexical form — offset and fractional-second precision unchanged, never normalized to UTC or reformatted."
    source: "ITS-REST Resources.md §Datetime format (\"Any date, datetime or time value provided as part of the HTTP message body, when creating or updating a resource (e.g. a DV_DATE_TIME value inside the COMPOSITION content), will be preserved as it was sent by the client, and passed to the underlying backend engine as is\"; \"Retrieval or querying those resources SHOULD return date, datetime, or time values in the (original) format provided by underlying backend engine, avoiding any format change\")"
    covered_by:
      - I_EHR_COMPOSITION.create_composition-datetime_lexical
      - SF-MAP-temporal
  - id: datetime-param-timezone-offset-full
    description: "A datetime request parameter supplied in the extended ISO 8601 form WITH a timezone designator (the `Z`/±hh:mm branch of the general form) is accepted and resolved at that instant — the offset-bearing half of the version_at_time / time_range parameter grammar."
    source: "ITS-REST Resources.md §Datetime format (\"HTTP query parameters and path segments that are dates, datetimes, or times, MUST always use the _extended_ ISO 8601 format. The general form of a datetime is `YYYY-MM-DDThh:mm:ss.sss[Z|±hh:mm]`\") — the bracketed designator is the branch this element covers; the offset-LESS branch (\"Timezone SHOULD be only supplied when needed, otherwise the local timezone is assumed\") is the separate datetime-param-timezone-optional element"
    covered_by:
      - I_EHR_COMPOSITION.get_composition_at_time
      - I_EHR_COMPOSITION.get_composition_at_times
      - I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory
      - I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory_versions
      # The two clock-independent directory edges, both fixed Z-bearing
      # literals rather than captured instants.
      - I_EHR_DIRECTORY.get_directory_at_time-before_first_version
      - I_EHR_DIRECTORY.get_directory_at_time-future
      - I_DEMOGRAPHIC_SERVICE.get_party_at_time-aaaa
      # The EHR_STATUS at-time reads, on both routes, with Z-bearing literals.
      - I_EHR_STATUS.get_ehr_status-at_time_before_first_version
      - I_EHR_STATUS.get_ehr_status-at_time_future
      - I_EHR_STATUS.get_versioned_ehr_status-at_time_before_first_version
      - I_EHR_STATUS.get_versioned_ehr_status-at_time_future
  # Legacy / experimental alternative data formats (ITS-REST Resources.md
  # §Alternative data formats).
  - id: media-legacy-alternative-formats
    description: "The legacy/experimental alternative media types (application/openehr.nc.flat+json, application/openehr.tds2+xml) are MAY-level: a server that does not support them refuses an unprocessable payload 415 and an unfulfillable Accept 406, on both the request and the response side."
    source: "ITS-REST Resources.md §Alternative data formats (\"Legacy or experimental formats: `application/openehr.nc.flat+json` based on the ECISFLAT format, `application/openehr.tds2+xml` for TDS simplification of RM as XML\") + §Data representation (\"other alternative formats MAY be supported as well, depending on the use case\") + §Simplified Formats / §XML Format / §JSON Format (the 415 and 406 MUSTs); the MAY-level support is adjudicated in register AMB-61 (option_select)"
    covered_by:
      - SF-LEGACY-nc_flat_media_unsupported
      - SF-LEGACY-tds2_accept_unsupported
  # Simplified-Formats mapping rows the FLAT wire cannot carry, or cannot carry
  # on this corpus (ITS-REST docs/simplified_formats/master05-rm_mapping.adoc).
  - id: simplified-participation-time-not-emitted
    description: "PARTICIPATION.time has no FLAT representation: the mapping table defines |function, |mode, |name, |id, |id_scheme, |id_namespace and the |identifiers_* family, and the section's own NOTE states that the RM time interval is not emitted at all, directing such entries to canonical RM JSON."
    source: "ITS-REST simplified_formats master05-rm_mapping.adoc §PARTICIPATION (the ten-row mapping table, which has no time row, and the closing NOTE: \"PARTICIPATION's `time` (RM `DV_INTERVAL<DV_DATE_TIME>`) is not currently emitted by FLAT mappings. Entries with a constrained participation `time` interval require the canonical RM JSON form.\") + RM common §PARTICIPATION (time: DV_INTERVAL<DV_DATE_TIME> 0..1)"
    exception:
      reason: off_wire
      note: "The specification itself puts this attribute off the simplified wire, so there is nothing for a case to assert: `present` would demand a serialization no released table defines, and `absent` would pin a hole the same NOTE marks as provisional (\"not currently\"). The canonical route the NOTE names IS exercised — a participation time interval round-trips through the canonical JSON/XML composition cases — so the datum is not unreachable, only unreachable in FLAT/STRUCTURED. Revisits if a future release gives PARTICIPATION.time a suffix; the master05 semantic battery (crates/openehr-its/tests/master05_tables.rs) records the row's absence explicitly rather than skipping it."
  - id: simplified-instruction-details-suffixes
    description: "The ACTION _instruction_details node carries three flat suffixes on the node itself — |path -> instruction_id.path, |composition_uid -> instruction_id.id, |activity_id -> activity_id, all required — and not a nested instruction_id child with OBJECT_REF suffixes."
    source: "ITS-REST simplified_formats master05-rm_mapping.adoc §INSTRUCTION_DETAILS (the three-row mapping table and its worked example, which agree: `…/_instruction_details|path`, `…/_instruction_details|composition_uid`, `…/_instruction_details|activity_id`) + §ACTION (the `/_instruction_details` row typing the node INSTRUCTION_DETAILS) + RM composition §INSTRUCTION_DETAILS (instruction_id: LOCATABLE_REF 1..1, activity_id: String 1..1)"
    # RETIRED coverage_gap (2026-07-28): the exception's own closing condition —
    # "a FLAT fixture that commits an ACTION carrying _instruction_details plus
    # its canonical read-back assertions in the SF-MAP-* group" — is met. The
    # carrier the note called missing already existed: cnf.opt.minimal_action
    # (openEHR-EHR-ACTION.minimal.v1) has a committed FLAT payload, the official
    # Robot cnf.flat.vitals.minimal_ctx, whose ism_transition and time already
    # satisfy ACTION's RM-mandatory attributes; the new fixture is that payload
    # plus the three released suffixes, so nothing about the ACTION arm had to
    # be invented.
    covered_by: [SF-MAP-instruction_details]
  - id: simplified-interval-event-sample-count
    description: "INTERVAL_EVENT carries |sample_count (INTEGER -> sample_count) as a datum suffix on the event node itself, alongside the /width and /math_function sub-paths."
    source: "ITS-REST simplified_formats master05-rm_mapping.adoc §INTERVAL_EVENT (the `\\|sample_count` row, Flat type INTEGER, RM Path sample_count, Required no; the second worked example spelling it `…/any_event:0|sample_count: 5`, a suffix on the event and not a sub-path) + RM data_structures §INTERVAL_EVENT (sample_count: Integer 0..1)"
    # RETIRED coverage_gap (2026-07-28): the exception's own closing condition —
    # "a SMALL functional-corpus OPT constraining one EVENT node to
    # INTERVAL_EVENT (the cnf.tpl.ecc_event_type_narrowing.opt shape, which
    # already narrows the same node to POINT_EVENT) plus a FLAT fixture
    # carrying |sample_count and its canonical read-back in the SF-MAP-* group"
    # — is met, verbatim. cnf.tpl.sf_interval_event IS that skeleton with its
    # one events slot narrowed to the other concrete subtype, emitted by the
    # same generator builder, so nothing about the carrier was invented; the
    # fixture carries all three §INTERVAL_EVENT rows with the section's own
    # example values. The CKM route stays rejected for the reason the old note
    # gave (measurement templates, canonical-JSON companions, and a FLAT
    # payload hand-derived against a five-thousand-line OPT would be exactly
    # the invention this ledger prevents), and the unconstrained cnf.opt.vitals
    # route stays unreachable because its any_event is the ABSTRACT EVENT.
    covered_by: [SF-MAP-interval_event]
  # openehr-uri response header (ITS-REST Requests_and_responses.md §openehr-uri).
  - id: header-openehr-uri-declined-may
    description: "The openehr-uri response header advertising a DV_EHR_URI form of the resource is a service-level MAY that this catalogue declines to require: the released text conditions it on the service supporting DV_EHR_URI generation at all, and defines neither an operation set nor an obligation, so neither presence nor absence is assertable."
    source: "ITS-REST Requests_and_responses.md §openehr-uri (\"If the service supports generating resource URIs in the format defined by the DV_EHR_URI class, it MAY include the openehr-uri response header for applicable openEHR resources\") — a doubly-conditional MAY (\"if the service supports\" + \"MAY\" + \"applicable\" resources left unenumerated); RM data_types §DV_EHR_URI defines the URI form itself but assigns no HTTP behaviour"
    exception:
      reason: statement_declared
      note: "An honest declined boundary, not a coverage gap: there is no conformance obligation to test. `present` would over-claim a MAY on a capability the text lets a service lack entirely, and `absent` would forbid what the text explicitly permits — the closed matcher vocabulary has no if-present-then-well-formed form. A service that does emit the header declares that capability in its ICS; the shape it must then carry is the DV_EHR_URI lexical form (RM data_types), which no ITS-REST sentence binds to any operation. Revisits if a future ITS-REST release enumerates the applicable resources or raises the MAY."
  # Prefer object-reference resolution (ITS-REST Requests_and_responses.md
  # §Prefer resolving Object references).
  - id: header-prefer-resolve-refs
    description: "Prefer: return=representation, resolve_refs asks the service to resolve OBJECT_REFs into full or partial representations."
    source: "ITS-REST Requests_and_responses.md §Prefer resolving Object references (\"Clients MAY request that object references (e.g., OBJECT_REF) be resolved into full or partial representations by specifying: `Prefer: return=representation, resolve_refs`\"; \"This is particularly useful when retrieving lists of COMPOSITION resources within an EHR, where the default behavior is to return only reference links\")"
    # The generic token remains a bare CLIENT sentence: it assigns the service
    # no obligation, names no status, no `Preference-Applied` value and no
    # failure mode, and its one worked example ("lists of COMPOSITION resources
    # within an EHR") is not an ITS-REST 1.1.0 operation — so no case gates it
    # in general, and none should. What IS gated is the ONE resource on which a
    # released paragraph makes the resolution observable: the CONTRIBUTION
    # read, whose §Simplified Formats paragraph promises a
    # `versions[i].data` serialization its OBJECT_REF-typed body cannot express
    # (register AMB-57 binds that promise to this token). The exception is
    # therefore retired in favour of the case, and coverage only ratchets up.
    covered_by:
      - I_EHR_CONTRIBUTION.get_contribution-resolve_refs
  # Deprecated custom-header spellings (ITS-REST Requests_and_responses.md
  # §Deprecated headers — the five-row rename table). Each deprecated name is a
  # genuinely DIFFERENT HTTP field name after case-insensitive folding (the
  # openEHR-* rows carry underscores where the Release-1.1.0 names carry
  # hyphens), so a server reading only the new name silently ignores the old.
  - id: header-deprecated-template-id-spelling
    description: "The deprecated committal header name openEHR-TEMPLATE_ID still identifies the template of a Simplified-Format COMPOSITION commit."
    source: "ITS-REST Requests_and_responses.md §Deprecated headers (the openEHR-TEMPLATE_ID -> openehr-template-id table row; \"While the deprecated headers remain available for backward compatibility, their use is strongly discouraged\") + §openehr-template-id (\"The `openehr-template-id` request header MUST be used whenever committing COMPOSITION (via `PUT` or `POST` methods) using a Simplified Format …\")"
    covered_by: [I_EHR_COMPOSITION.create_composition-deprecated_template_id]
  - id: header-deprecated-version-and-ehr-id-spellings
    description: "The remaining deprecated request-header spellings — openEHR-VERSION (the committal VERSION metadata) and openEHR-EHR-id (the query EHR-scope header) — are still accepted under their Release-1.1.0 semantics."
    source: "ITS-REST Requests_and_responses.md §Deprecated headers (the openEHR-VERSION -> openehr-version and openEHR-EHR-id -> openehr-ehr-id table rows; \"the deprecated headers remain available for backward compatibility\") + §openehr-version and openehr-audit-details (the VERSION metadata the first row carries) + query Request.md §About the ehr_id parameter (the EHR-scope header the last row carries)"
    # Closed by the #288 element sweep, one variant binding + one case per
    # table row: a create_composition variant sending `openEHR-VERSION:
    # lifecycle_state.code_string="553"` (the committed VERSION must carry the
    # supplied non-default lifecycle code), and a GET ad-hoc-query variant
    # sending `openEHR-EHR-id` (the deprecated spelling alone must scope the
    # execution to one EHR). Both differ from the two rows cased earlier
    # (openEHR-TEMPLATE_ID, openEHR-AUDIT_DETAILS) in that they fold to exactly
    # their replacement names under RFC 9110 §5.1 rather than to underscore
    # names — the cases exist because the released table makes the old
    # spellings normative and a case-SENSITIVE custom-header match fails them
    # SILENTLY (a wrong lifecycle_state, a population-scoped answer), never
    # with an error the client sees. The fifth table row, openEHR-uri, is a
    # RESPONSE header and is a declined MAY
    # (header-openehr-uri-declined-may), not a gap.
    covered_by:
      - I_EHR_COMPOSITION.create_composition-version_bare_deprecated
      - I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_header_deprecated_get
  # Committal request headers, the base merge family (ITS-REST
  # Requests_and_responses.md §openehr-version and openehr-audit-details). The
  # change_type attribute has its own element above; these are the rest.
  - id: header-committal-merge-family
    description: "The AUDIT_DETAILS attributes a client MAY supply through the openehr-audit-details header (change_type, description, committer) are MERGED into the VERSION the write commits — not ignored, and not replacing the server-set attributes."
    source: "ITS-REST Requests_and_responses.md §openehr-version and openehr-audit-details (\"In order to allow clients to provide committal metadata, services MUST accept `openehr-version` and `openehr-audit-details` custom request headers\"; \"Through the `openehr-audit-details` header, clients MAY supply values for the AUDIT_DETAILS attributes `change_type`, `description`, `committer` and `system_id`\"; \"None of these headers are mandatory, but whatever is provided it MUST be merged with the default VERSION and VERSION.audit_details attributes on commit runtime\") + RM common master06 §change_control (AUDIT_DETAILS)"
    covered_by:
      - I_EHR_COMPOSITION.delete_composition-audit_headers
      - I_EHR_COMPOSITION.update_composition-audit_amendment
      - I_EHR_COMPOSITION.update_composition-audit_bare_deprecated
      # The CREATE half of the same MUST: EHR creation commits change-controlled
      # content (RM ehr master04 §EHR Creation), so POST /ehr merges the headers
      # into the EHR_STATUS version's commit_audit like any other commit.
      - I_EHR_SERVICE.create_ehr-committal_headers
  - id: header-committal-version-lifecycle-and-system-id
    description: "The last two committal attributes: VERSION.lifecycle_state supplied through the openehr-version header reaches the committed VERSION, and the system_id rule holds in both arms — a client-supplied system_id is merged verbatim, and a commit that supplies none carries a server-set identifier instead of the earlier client value or nothing."
    source: "ITS-REST Requests_and_responses.md §openehr-version and openehr-audit-details (the worked example's `openehr-version: lifecycle_state.code_string=\"532\"` line; \"whatever is provided it MUST be merged with the default VERSION and VERSION.audit_details attributes on commit runtime\"; \"In particular, when `system_id` is not provided by the client, the server MUST set it to its own configured system identifier\") + TERM SupportTerminology §Version Lifecycle State (the code_string vocabulary the header carries)"
    # Closed by the #288 element sweep. The lifecycle case supplies
    # 553|incomplete| rather than the example's 532|complete| because 532 is
    # the default (RM common master06 §Incomplete Content: "Usually content
    # will be committed in the `complete` state") and could not tell a merging
    # server from one ignoring the header; the same section's transition table
    # has no `complete` -> `incomplete` transition, so the state is authored on
    # the FIRST commit. The system_id case drives both arms in one flow, the
    # supplied arm establishing the client token the defaulted arm must NOT
    # carry. The residual identity claim — that the defaulted value IS the
    # server's configured identifier — is its own element below.
    covered_by:
      - I_EHR_COMPOSITION.create_composition-version_lifecycle
      - I_EHR_COMPOSITION.update_composition-audit_system_id
  - id: header-committal-system-id-server-value
    description: "The defaulted AUDIT_DETAILS.system_id is the server's OWN CONFIGURED system identifier — not merely some server-set non-blank token."
    source: "ITS-REST Requests_and_responses.md §openehr-version and openehr-audit-details (\"In particular, when `system_id` is not provided by the client, the server MUST set it to its own configured system identifier\")"
    covered_by:
      # The IDENTITY half, against the value the party DECLARES its SUT is
      # configured with: the closing condition this element named — "the ixit
      # declares the SUT's configured system identifier as an environment
      # fact a case may reference" — was met by the 2026-07-28 schedule
      # release (#569), which added the ixit `system_id` declaration and the
      # `${ixit:system_id}` reference. A party that declares none records the
      # case not-applicable with that citation; the identifier is still never
      # invented, and no released operation discloses it.
      - I_EHR_COMPOSITION.create_composition-audit_system_id_declared
      # The halves that need no declaration: a supplied system_id is merged
      # verbatim, and the defaulted one is present, non-blank, and not the
      # client token the same flow supplied a version earlier.
      - I_EHR_COMPOSITION.update_composition-audit_system_id
  # The default representation preference (ITS-REST Requests_and_responses.md
  # §Prefer minimal, identifier or full representation response).
  - id: header-prefer-return-minimal
    description: "Prefer: return=minimal — and the assumed default when no Prefer is sent — answers a minimal response pointing at the affected resource through Location rather than returning its representation."
    source: "TIER 1, DOCS TEXT — ITS-REST Requests_and_responses.md §Prefer minimal, identifier or full representation response (\"`Prefer: return=minimal` Indicates the client prefers a minimal response. The response SHOULD include a `Location` header pointing to the newly created or updated resource. The HTTP status is typically `201 Created`. If no response body is returned, the service SHOULD use `204 No Content`\") + §Representation details negotiation (\"If no `Prefer` header is provided, the default behavior is assumed to be `return=minimal`\") — two sentences that between them settle no status. TIER 2, THE RELEASED OAS, citable because tier 1 states both and assigns neither (owner ruling 2026-07-28) and cited AS the OAS: the CREATE operations declare exactly one success status and their response files close \"If the `Prefer` header is missing or set to `return=minimal`, the body is empty\" (responses/201_COMPOSITION.yaml, 201_PERSON.yaml, 201_Template_adl1_4_upload.yaml, 201_Template_adl2_upload.yaml), while the UPDATE operations declare 200 and 204 and split them by preference — responses/204_version_updated.yaml, \"`204 No Content` is returned when the update operation was successful and the `Prefer` header is missing or is set to `return=minimal`\". Register AMB-62"
    # RETIRED coverage_gap (2026-07-28): the exception's own retirement
    # condition — "RETIRES when the missing cases land" — is met. The five
    # write families the note named are now cased, one behaviour each, through
    # `-return_minimal` variant bindings that pin the header, plus the
    # default-when-absent half on a create and an update through
    # `-prefer_absent` variant bindings that send no `Prefer` at all. The
    # per-family statuses are the ones AMB-62's re-adjudication assigns from
    # the released response files: 201-with-an-empty-body on a create, 204 on
    # an update. The body selector `prefer_conditional` is untouched — the
    # minimal branch is judged by the bindings' `body: absent`, not by it.
    # ONE FAMILY STAYS UNASSERTABLE and is deliberately not cased: the EHR
    # create. `responses/201_EHR.yaml` is the only create response file WITHOUT
    # the "If the `Prefer` header is missing or set to `return=minimal`, the
    # body is empty" sentence (verified first-hand 2026-07-28), so both sources
    # are still silent there and a status expectation would be invention —
    # register AMB-62's residue clause, and the boundary
    # I_EHR_SERVICE.create_ehr-return_identifier names.
    covered_by:
      # CREATE — 201 with an empty body, plus the Location the branch SHOULDs.
      - I_EHR_COMPOSITION.create_composition-prefer_minimal
      - I_EHR_DIRECTORY.create_directory-prefer_minimal
      - I_DEMOGRAPHIC_SERVICE.create_party-prefer_minimal
      - I_EHR_CONTRIBUTION.commit_contribution-prefer_minimal
      # The two template uploads, already gated under AMB-110(b) before the
      # 2026-07-28 ruling generalized the reading.
      - I_DEFINITION_ADL14.upload_opt-prefer_minimal
      - I_DEFINITION_ADL2.upload_artefact-prefer_minimal
      # UPDATE — 204 No Content, the identity in the ETag alone.
      - I_EHR_COMPOSITION.update_composition-prefer_minimal
      - I_EHR_STATUS.set_ehr_queryable-prefer_minimal
      - I_EHR_DIRECTORY.update_directory-prefer_minimal
      - I_DEMOGRAPHIC_SERVICE.update_party-prefer_minimal
      # THE DEFAULT-WHEN-ABSENT HALF — no `Prefer` header at all, asserted to
      # answer exactly what the explicit form answers, on one create and one
      # update (§Representation details negotiation: "If no `Prefer` header is
      # provided, the default behavior is assumed to be `return=minimal`").
      - I_EHR_COMPOSITION.create_composition-prefer_absent
      - I_EHR_COMPOSITION.update_composition-prefer_absent
  # Version-at-time semantics (RM common versioned_object.adoc; the wire form
  # in ITS-REST Resources.md §Datetime format).
  - id: version-at-time-extancy-branches
    description: "The four branches of an at-time versioned read: the parameter omitted serves the latest version; a value outside the ISO 8601 grammar is a client error; an instant before the first commit finds no version; an instant after the newest commit still serves the newest version rather than 404-ing."
    source: "SM i_ehr_status.adoc §get_ehr_status_at_time (\"Get the version of the EHR Status extant at time `_a_time_`. If no time supplied, get the latest.\") + RM common UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions (`version_at_time (a_time): VERSION`, `Pre: has_version_at_time (a_time)` — the only released statement of the accessor, which fixes neither the extancy interval nor the future-T answer) + ITS-REST Resources.md §Datetime format (\"HTTP query parameters and path segments that are dates, datetimes, or times, MUST always use the _extended_ ISO 8601 format\") + Requests_and_responses.md §HTTP status codes rows 400 and 404. The unstated halves — which instant anchors extancy, and what a future T returns — are adjudicated in register AMB-70"
    covered_by:
      # The bare-EHR_STATUS route.
      - I_EHR_STATUS.get_ehr_status-at_time_omitted
      - I_EHR_STATUS.get_ehr_status-at_time_malformed
      - I_EHR_STATUS.get_ehr_status-at_time_before_first_version
      - I_EHR_STATUS.get_ehr_status-at_time_future
      # The VERSION-envelope route, where the served version's identity is
      # assertable from the envelope's own normative uid.
      - I_EHR_STATUS.get_versioned_ehr_status-at_time_omitted
      - I_EHR_STATUS.get_versioned_ehr_status-at_time_malformed
      - I_EHR_STATUS.get_versioned_ehr_status-at_time_before_first_version
      - I_EHR_STATUS.get_versioned_ehr_status-at_time_future
      # The DIRECTORY route, whose at-time reads are the third resource the
      # same accessor governs. The omitted-parameter branch is the ordinary
      # get_directory read; the malformed branch is the shared datetime
      # grammar; these two are the extancy EDGES, both as clock-independent
      # fixed literals.
      - I_EHR_DIRECTORY.get_directory_at_time-before_first_version
      - I_EHR_DIRECTORY.get_directory_at_time-future
  # The version container as a resource of its own (RM common
  # versioned_object.adoc §Attributes).
  - id: versioned-object-container-shape
    description: "A served VERSIONED_OBJECT carries a container uid with NO version extension (unlike the three-part VERSION uid), an owner_id referencing the owning entity, and its creation time."
    source: "RM common UML/classes/org.openehr.rm.common.versioned_object.adoc §Attributes (`uid`: HIER_OBJECT_ID, \"Unique identifier of this version container in the form of a UID with no extension\"; `owner_id`: OBJECT_REF 1..1, \"Reference to object to which this version container belongs, e.g. the id of the containing EHR or other relevant owning entity\"; `time_created`: DV_DATE_TIME 1..1) contrasted with RM common master06 §change_control (\"VERSION objects are identified by a `_uid_` attribute of type `OBJECT_VERSION_ID`\"); the WIRE VALUES of owner_id are stated by no released text and are adjudicated in register AMB-69"
    covered_by:
      - I_EHR_STATUS.get_versioned_ehr_status-container_shape
  # The per-EHR scoping of a version container (RM ehr ehr.adoc EHR.ehr_status).
  # The directory `path` query parameter (ITS-REST directory GET operations).
  - id: directory-path-parameter-navigation
    description: "The `path` query parameter NARROWS a directory GET to a nested sub-FOLDER — the served body is that sub-FOLDER, not the root — on BOTH directory read routes (latest/at-time and by-version); a path that resolves to nothing is 404, never an ancestor folder and never an empty success."
    source: "ITS-REST specifications/operations/directory_get_at_time.yaml and directory_get_by_version_id.yaml, whose descriptions BOTH read \"If `path` is supplied, retrieves from the directory only the sub-FOLDER that is associated with that path\" and which both list ../parameters/query/path.yaml + their 404 response files 404_directory_unknown_ehr_id_or_no_version_at_time_or_no_path.yaml / 404_directory_unknown_ehr_id_or_no_version_uid_or_no_path.yaml (\"or when `path` does not exist within the directory\") + Requests_and_responses.md §HTTP status codes row 404. The parameter's GRAMMAR — leading slash, whether the root FOLDER's own name is a segment, duplicate-sibling disambiguation, escaping a slash inside a name — is stated by nothing beyond the one sentence in parameters/query/path.yaml (\"consists of slash-separated values of the name attribute of FOLDERs in the directory\", example `episodes/a/b/c`) and is adjudicated in register AMB-81"
    covered_by:
      - I_EHR_DIRECTORY.get_directory-path_sub_folder
      - I_EHR_DIRECTORY.get_directory-path_unresolved
      - I_EHR_DIRECTORY.get_directory_at_version-path_sub_folder
      - I_EHR_DIRECTORY.get_directory_at_version-path_unresolved
      # The same wire read as a boolean probe (status only, body ignored).
      - I_EHR_DIRECTORY.has_path-folder_structure
  # Deactivated-EHR content refusal (RM ehr master04 §EHR Active Status).
  - id: ehr-not-modifiable-refuses-content-writes
    description: "While EHR_STATUS.is_modifiable is false the EHR refuses content writes — on BOTH content kinds the rule enumerates (Compositions and hierarchical Folders) AND through the native CONTRIBUTION commit, the primary write route, which a route-scoped guard would leave open — while EHR_STATUS itself stays writable so the EHR can be reactivated."
    source: "RM ehr master04-ehr_package.adoc §EHR Active Status: \"The `EHR_STATUS._is_modifiable_` attribute is used to indicate whether _the contents of an EHR_ are modifiable, and is set to `True` if the EHR is considered _active_. An EHR's 'contents' consist of everything other than the `EHR_STATUS` object, i.e. its Compositions (Versioned objects referred to by the `_compositions_` attribute), its hierarchical Folders (Versioned objects referred to by the `_folders_` attribute) and any other content that may be added in later releases of this specification\" — the ITS-REST docs text never mentions is_modifiable outside the EHR-creation defaults (grep of specifications/docs/**: zero hits) and assigns the refusal no status code, so the 409 is adjudicated in register AMB-82 against Requests_and_responses.md §HTTP status codes row 409 (\"Indicates that the request could not be processed because it might generate a duplicate or a conflict\")"
    covered_by:
      - I_EHR_DIRECTORY.create_directory-ehr_not_modifiable
      - I_EHR_COMPOSITION.create_composition-ehr_not_modifiable
      # The native change-set route (register AMB-82's scope extension).
      - I_EHR_CONTRIBUTION.commit_contribution-ehr_not_modifiable
  # The CONTRIBUTION change-set surface (SM i_ehr_contribution.adoc; RM common
  # master06 §Contributions; the ITS-REST contribution routes).
  - id: contribution-simplified-format-envelope-split
    description: "The Simplified Formats MIME types are accepted on both CONTRIBUTION endpoints, and the simplified serialization reaches versions[i].data ONLY: on a commit the request envelope (uid, versions[] metadata, audit) is canonical JSON with each member's inner payload in the chosen FLAT or STRUCTURED form, and on a read a simplified Accept still yields a canonical CONTRIBUTION envelope."
    source: "ITS-REST docs/overview/Amendment_record.md, the SPECITS-84 row verbatim: \"Add support for FLAT/SDT to Contribution REST API calls - accept the Simplified Formats MIME types on CONTRIBUTION endpoints; the Simplified Formats serialization applies to `versions[].data` only, the CONTRIBUTION envelope remains canonical\" + docs/overview/Resources.md §Simplified Formats (the two MIME types and their Content-Type/Accept negotiation: \"clients and servers MUST use: `application/openehr.wt.flat+json` … `application/openehr.wt.structured+json`\"). The PER-OPERATION statement of the split is docs-text-silent and grounded on the RELEASED OAS (cited AS the OAS — owner ruling 2026-07-28): operations/contribution_create.yaml §\"Simplified Formats\" (\"When a Simplified Formats MIME type is used, the **CONTRIBUTION envelope itself remains canonical JSON** … Only the inner versioned payload - each `versions[i].data` … - is serialized in the chosen FLAT or STRUCTURED form\") and operations/contribution_get.yaml §\"Simplified Formats\" (\"the **CONTRIBUTION envelope itself is still returned as canonical JSON**\")"
    covered_by:
      - SF-CONTRIB-flat_commit
      - SF-CONTRIB-structured_commit
      - SF-CONTRIB-flat_read
      - SF-CONTRIB-structured_read
  - id: contribution-client-supplied-envelope-uid
    description: "The CONTRIBUTION envelope's optional client-supplied uid is ACCEPTED when free — the committed resource is addressable under it — and a second commit naming a uid already in use is refused as a duplicate identifier."
    source: "ITS-REST specifications/operations/contribution_create.yaml, the relaxed-envelope list, verbatim: \"`uid`: when provided, it will be accepted in case is not in-use, otherwise error will be returned\" — the only released sentence governing the attribute. WHICH error comes from Requests_and_responses.md §HTTP status codes, the 409 row (\"Indicates that the request could not be processed because it might generate a duplicate or a conflict\"), the only row that describes a colliding identifier"
    covered_by:
      - I_EHR_CONTRIBUTION.commit_contribution-client_uid_in_use
  - id: contribution-preceding-version-precondition
    description: "A member's preceding_version_uid is a real precondition, not decoration: naming a superseded version fails the commit and the response names the container's current latest version — the lost-update guard on a route that carries no If-Match at all."
    source: "RM common master06-change_control_package.adoc §The 'Virtual Version Tree' (a new Version supersedes the one it names as preceding) + RM common UML/classes/org.openehr.rm.common.version.adoc (Preceding_version_uid_validity) vs ITS-REST Requests_and_responses.md §HTTP status codes, whose 412 row is written for HEADER preconditions (\"One or more conditions given in the request header fields evaluated to false\") while this route's precondition travels in the member body — the code and the ETag echo are adjudicated in register AMB-54(b), the ETag half mirroring §\"If-Match and accidental overwrites\" (\"SHOULD return also latest `version_uid` in the `ETag` response headers\")"
    covered_by:
      - I_EHR_CONTRIBUTION.commit_contribution-stale_preceding_version
  - id: contribution-change-kind-rejection-families
    description: "The three distinct change-control failures a commit can carry, each answered differently: a first-version MODIFICATION (the released 400 trigger), a CREATION that names a preceding version, and an out-of-group change_type/lifecycle token."
    source: "ITS-REST specifications/responses/400_CONTRIBUTION.yaml assigns exactly ONE of them — \"or the modification type does not match the operation - i.e. first version of a MODIFICATION\" — and nothing released assigns the other two; RM common master06 §Contributions (the change-kind law) + UML/classes/org.openehr.rm.common.version.adoc (Preceding_version_uid_validity) + master04 (AUDIT_DETAILS Change_type_valid) ground the REJECTIONS, and register AMB-54(a)/(c) adjudicates their codes into the Requests_and_responses.md §HTTP status codes 422 row (\"The request was well-formed but was unable to be followed due to semantic errors\")"
    covered_by:
      - I_EHR_CONTRIBUTION.commit_contribution-one_commit_invalid_change_types
      - I_EHR_CONTRIBUTION.commit_contribution-one_commit_invalid_change_types_persistent
      - I_EHR_CONTRIBUTION.commit_contribution-creation_with_preceding_version
      - I_EHR_CONTRIBUTION.commit_contribution-two_commits_second_creation
  - id: contribution-rejection-status-discrimination
    description: "WHICH of 400 and 422 a given commit rejection carries — the released 400 for a first-version MODIFICATION versus the register-adjudicated 422 for the remaining change-control and change-set failures — is a real distinction on the wire that the catalogue cannot currently pin."
    source: "ITS-REST specifications/responses/400_CONTRIBUTION.yaml (the one assigned trigger) vs Requests_and_responses.md §HTTP status codes rows 400 and 422, read together with register AMB-54 (the narrowed entry: the first-version-MODIFICATION half IS assigned, the creation-with-preceding and out-of-group halves are not) and AMB-84 (the empty change set)"
    exception:
      reason: coverage_gap
      register: AMB-54
      note: "Not authorable today for a closed-vocabulary reason — and, since 2026-07-28, the LAST of that family: the two elements that once shared the blocker (ehr-id-path-segment-malformed-rejection, query-ehr-id-parameter-header-conflict) are now cased on the `bad_request` kind the schedule release added, but that kind does not help HERE. This branch needs a rejection pair spanning 422 AND 400 on ONE operation, not a malformed-request kind: the outcome taxonomy carries ONE rejection kind for both codes (`validation_failed`), and the commit binding's `validation_failed` therefore declares `alt_status: [400]` so the kind spans the family. A case can say a rejection happened, not which code it wore. Splitting the two would need either a second rejection kind in the closed taxonomy or a per-case status override, both of which are extensions only a schedule release may make; a variant binding cannot do it, because the two branches differ in the BODY's change kind, not in the request shaping a variant expresses. What IS gated meanwhile is the rejection itself on every branch (contribution-change-kind-rejection-families) plus the two branches that DO have distinct kinds — 412 (contribution-preceding-version-precondition) and 409 (contribution-client-supplied-envelope-uid). Closes when the outcome taxonomy gains the second rejection kind."
  - id: contribution-deletion-member-shape
    description: "A deletion member is data-LESS: committing 523|deleted| with the data omitted performs the logical delete, and a 523|deleted| member that carries data is refused rather than committed."
    source: "RM common master06-change_control_package.adoc §Logical Deletion, the procedure verbatim: \"create a new Version in the normal way; delete its `_data_`; set the `_lifecycle_state_` value to the code for `deleted`; commit in the normal way\" + UML/classes/org.openehr.rm.common.original_version.adoc (data 0..1, which is what lets a deletion version carry none) — CONTRADICTED by the released commit schema, which makes the member's data required with no null form; adjudicated in register AMB-85 in favour of the RM, with the refusal in the Requests_and_responses.md §HTTP status codes 422 row"
    covered_by:
      - I_EHR_CONTRIBUTION.commit_contribution-delete_directory
      - I_EHR_CONTRIBUTION.commit_contribution-deleted_member_with_data
  - id: contribution-versions-ref-shape
    description: "A served CONTRIBUTION's versions[i] reference carries the committed DATA class (COMPOSITION / EHR_STATUS / FOLDER) as its type, the local namespace, and the full three-part OBJECT_VERSION_ID of the version that caused the change — and resolves to the full ORIGINAL_VERSION when the client asks for reference resolution."
    source: "RM common UML/classes/org.openehr.rm.common.contribution.adoc (versions: \"Set of references to Versions causing changes\", then \"items of types such as COMPOSITION and FOLDER\") + BASE UML/classes/org.openehr.base.base_types.object_ref.adoc (type: \"Name of the class ... of object to which this identifier type refers\") + RM common master06 (VERSION objects \"are identified by a `_uid_` attribute of type `OBJECT_VERSION_ID`\"); the RM-vs-BASE tension over which class name belongs in `type` is adjudicated in register AMB-88 in favour of the released schema example (the DATA class)"
    covered_by:
      - I_EHR_CONTRIBUTION.get_contribution-version_ref_shape
      - I_EHR_CONTRIBUTION.get_contribution-resolve_refs
  - id: versioned-object-addressing-is-ehr-scoped
    description: "A version_uid resolves only within the EHR whose route addresses it: a live version identifier belonging to another EHR's container is not served, so version ids are not a global namespace."
    source: "RM ehr UML/classes/org.openehr.rm.ehr.ehr.adoc §Attributes (`ehr_status` is THIS EHR's VERSIONED_EHR_STATUS) + RM common UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions (`version_with_id`, `Pre: has_version_id (a_ver_id)` — membership of the addressed container) + ITS-REST Requests_and_responses.md §HTTP status codes row 404 (\"The origin service did not find the target resource or is not willing to disclose that one exists\")"
    covered_by:
      - I_EHR_STATUS.get_versioned_ehr_status-version_of_other_ehr
  # Definition / TEMPLATE surface (group-10 audit, 2026-07-27). The list-filter
  # semantics and the ADL2 rejection-phase boundary the released text leaves
  # open — registered rather than silently omitted.
  - id: template-list-filter-conjunction
    description: "Supplying more than one list filter narrows the result set: a template must satisfy every supplied filter to be listed, so adding a filter can never widen a result."
    source: "ITS-REST specifications/parameters/query/filter_template_id.yaml + concept.yaml + filter_version.yaml (each described alone — \"Pattern for matching …\" / \"Filter by version …\") + operations/definition_template_adl1.4_list.yaml and definition_template_adl2_list.yaml (both declare a single 200 branch); the released text never describes the parameters AS A QUERY and assigns no combination rule — adjudicated in register AMB-114 as conjunction, the only reading under which a filter filters"
    exception:
      reason: coverage_gap
      register: AMB-114
      note: "The single-filter glob half IS gated (I_DEFINITION_ADL2.list_matching_artefacts-filter). The COMBINATION is not authorable as a discriminating case today: the closed assertion vocabulary offers no membership or cardinality predicate over a JSON list body (`field` addresses RM paths, `result_set` is AQL-only), so a two-filter case could assert only that the request was fulfilled — which conjunction, disjunction and last-wins all satisfy equally. Closes when the assertion vocabulary gains a list-membership form (extension only by schedule release), or when a released sentence assigns the combination."
  - id: template-list-offset-past-end
    description: "An offset at or beyond the end of the filtered template list is a fulfilled request answering an EMPTY list — not a client error, and not the last page."
    source: "ITS-REST specifications/parameters/query/offset.yaml (\"The row number in result-set to start result-set from (`0`-based), default is `0`\") + operations/definition_template_adl1.4_list.yaml and definition_template_adl2_list.yaml (a single declared 200 branch — no rejection exists to reach); the released text assigns no outcome to a past-the-end offset — adjudicated in register AMB-114 as the empty page"
    exception:
      reason: coverage_gap
      register: AMB-114
      note: "Same closed-vocabulary blocker as template-list-filter-conjunction. The empty-list positive is already gated on an empty server (I_DEFINITION_ADL2.list_opts-empty, I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts), but telling an empty PAGE from a non-empty one on a POPULATED server needs a list-cardinality assertion the vocabulary does not have, so a past-the-end case could assert only fulfilment. Closes when the assertion vocabulary gains a list-cardinality form."
  - id: template-upload-section-boundary-phase
    description: "A rejection for a MISSING mandatory ADL2 section (language / description / definition / terminology / component_terminologies) may wear either upload rejection status, because AM places the defect in the grammar and in the validity catalogue at once."
    source: "AM docs/OPT2/master03-opt_raw.adoc §Artefact Structure (the `adl_operational_template` Antlr4 rule makes each section a production, so a source lacking one fails to parse) vs AM docs/AOM2/master08-validation.adoc §Phase 1 - Basic Integrity §Basic checks (\"any missing mandatory parts, e.g. `terminology` section (STCNT)\", so a validator may equally report it); neither says which phase owns it, and the two phases carry different wire statuses under register AMB-110"
    exception:
      reason: coverage_gap
      register: AMB-116
      note: "A deliberate hold-out, not an omission. Both rejection STATUSES are gated on phase-unambiguous fixtures — 400 by I_DEFINITION_ADL2.upload_artefact-unparseable_artefact and I_DEFINITION_ADL14.upload_opt-unparseable_opt, 422 by I_DEFINITION_ADL2.upload_artefact-invalid_artefacts (a VARDT violation) and I_DEFINITION_ADL14.upload_opt-invalid_opt — so the split law itself is covered. What is NOT pinned is which status a SECTION-level defect wears; the corpus keeps cnf.adl2.opt.invalid.missing_description and .missing_definition referenced by no case for exactly that reason. Closes when AM assigns the phase (#1562)."
  # Definition / STORED QUERY surface (group-11 audit, 2026-07-27). The
  # version-slot, immutability, write-grammar, listing and fidelity positions
  # the released text leaves open, plus the conditional-header posture —
  # registered rather than silently omitted.
  - id: query-stored-default-version-slot
    description: "A version-less stored-query store writes one constant default version slot (1.0.0) and its Location names the version WRITTEN, not the name's latest; a second version-less store updates that same slot in place."
    source: "ITS-REST specifications/operations/definition_query_store.yaml (\"Stores a new query, or updates an existing query on the system\"; no conflict branch, and no version parameter) + docs/query/Qualified_query_name.md (the version is optional and its absent/partial rule is stated for USE — \"the system must use the latest `version` with the supplied prefix\" — not for a write) + docs/overview/Requests_and_responses.md §\"Representation details negotiation\" (\"If no `Prefer` header is provided, the default behavior is assumed to be `return=minimal`\") + §\"Prefer minimal, identifier or full representation response\" (\"The response SHOULD include a `Location` header pointing to the newly created or updated resource\"); the minted version itself is spec-silent and adjudicated in register AMB-117"
    covered_by:
      - I_DEFINITION_QUERY.store_query-default_version_slot
      - I_DEFINITION_QUERY.store_query-update_in_place
      - I_DEFINITION_QUERY.store_query-default_slot_with_higher_version
  - id: query-stored-version-immutability
    description: "A version-ADDRESSED stored query is immutable: re-storing an existing (name, version) pair — in any letter case — is refused and the stored definition is untouched."
    source: "ITS-REST specifications/tags/StoredQuery_schema.md (\"Stored queries provide a reusable, immutable way to identify a specific AQL statement\") + responses/409_StoredQuery_version.yaml (\"`409 Conflict` is returned when a query with the given `qualified_query_name` and `version` already exists on the server\") reading on docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 409 (\"the request could not be processed because it might generate a duplicate or a conflict\") + BASE base_types master05 §\"Composite Identifiers and Case\" (\"two identifiers identical apart from case are considered to be identical\"); the coexistence with the version-less store's overwrite sentence is register AMB-117"
    covered_by:
      - I_DEFINITION_QUERY.store_query-version_duplicate_conflict
      - I_DEFINITION_QUERY.store_query-version_duplicate_case_variant_name
  - id: query-stored-write-version-grammar
    description: "The versioned store accepts only an exact numeric major.minor.patch version segment: a {major}/{major}.{minor} prefix, a SEMVER pre-release, and any malformed token are refused and register nothing."
    source: "ITS-REST specifications/parameters/path/version.yaml (its prefix semantics are RESOLUTION semantics — \"the highest (latest) version matching the prefix will be considered\" — which cannot apply to a write) + docs/query/Qualified_query_name.md (\"The `version` identifier is in the format specified by SEMVER style (i.e. `major.minor.patch`)\") + docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 400 (\"malformed request syntax, syntactically invalid content\"); the write-side grammar is adjudicated in register AMB-122"
    covered_by:
      - I_DEFINITION_QUERY.store_query-version_prefix_rejected
      - I_DEFINITION_QUERY.store_query-version_prerelease_rejected
      - I_DEFINITION_QUERY.store_query-version_malformed_rejected
  - id: query-stored-list-order-and-empty-result
    description: "The stored-query listing matches the qualified name as a prefix and returns every version of every match, ordered by name then SEMVER ascending; a prefix matching nothing is a fulfilled request answering an empty list, not a not-found."
    source: "ITS-REST specifications/operations/definition_query_list.yaml (\"Retrieves list of all stored queries on the system matched by `qualified_query_name` as pattern\"; \"will list all versions of all queries with names starting with `org.openehr`\"; a single declared 200) + schemas/definition/QueryList.yaml (the example's two versions of one name, ascending) + docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 404 (a missing TARGET RESOURCE — which the list resource is not); the order and the empty-result branch are spec-silent and adjudicated in register AMB-124"
    covered_by:
      - I_DEFINITION_QUERY.list_queries-prefix_all_versions
      - I_DEFINITION_QUERY.list_queries-no_match_empty_list
      - I_DEFINITION_QUERY.list_queries-empty
  - id: query-stored-definition-read-fidelity
    description: "A stored query's definition text is served back VERBATIM — the bytes the client stored, not a re-printed or normalized equivalent."
    source: "ITS-REST specifications/operations/definition_query_version_get.yaml (\"Retrieves the definition of a particular stored query (at specified version) and its associated metadata\") + schemas/query/StoredQuery.yaml (`q` is the AQL text) — neither states a fidelity rule, so the position is adjudicated in register AMB-126 (verbatim, as for template retrieval in AMB-111)"
    covered_by:
      - I_DEFINITION_QUERY.list_queries-version_get_exact
  - id: query-stored-version-selector-read
    description: "The stored-query DEFINITION read resolves its version selector exactly as the execution read does: an exact SEMVER serves that definition, a {major} prefix the highest inside that major, a {major}.{minor} prefix the highest inside that minor, and a selector matching nothing is not found."
    source: "ITS-REST docs/query/Qualified_query_name.md §version identifier (\"When only a partial `version` pattern is supplied, or when `version` is not supplied at all, the system must use the latest `version` with the supplied prefix - i.e. if only `major` or `major.minor` is used, then the latest query version matching supplied prefix will be used\") + docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 404; the same rule is exercised on the EXECUTION surface by query-stored-version-selector-matching"
    covered_by:
      - I_DEFINITION_QUERY.list_queries-version_get_exact
      - I_DEFINITION_QUERY.list_queries-version_get_major_prefix
      - I_DEFINITION_QUERY.list_queries-version_get_minor_prefix
      - I_DEFINITION_QUERY.list_queries-version_get_unknown
  - id: query-stored-negotiation-branches
    description: "The stored-query routes carry the general negotiation MUSTs: a request declaring a payload media type the store cannot process is 415, and an Accept the JSON-only reads cannot satisfy is 406."
    source: "ITS-REST docs/overview/Resources.md §\"JSON Format\" (\"If the service cannot process the request payload as JSON format, it MUST respond with HTTP status code `415 Unsupported Media Type`\") + §\"XML Format\" (\"The client SHOULD use the `Accept: application/xml` request header … If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`\") — no stored-query operation declares either branch itself, so both are assembled from the general MUSTs (register AMB-127 records the surface's realization picture)"
    covered_by:
      - I_DEFINITION_QUERY.store_query-wrong_media
      - I_DEFINITION_QUERY.list_queries-xml_not_acceptable
      - I_DEFINITION_QUERY.list_queries-version_get_xml_not_acceptable
  - id: query-stored-conditional-headers
    description: "No ETag, Last-Modified or If-Match is emitted or honoured on the stored-query routes, although a stored query is version-addressed and carries a `saved` timestamp."
    source: "ITS-REST docs/overview/Requests_and_responses.md §\"ETag and Last-Modified\" (\"Both `ETag` and `Last-Modified` SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique state identifiers\") + §\"If-Match and accidental overwrites\" (\"This is only required by a small set of versioned resources in this specification, when the `preceding_version_uid` is not part of the endpoint path segment\") vs the four stored-query operations, none of which declares a conditional-request parameter and none of whose responses declares either header — adjudicated in register AMB-125"
    exception:
      reason: coverage_gap
      register: AMB-125
      note: "Deliberately unasserted in BOTH directions. Asserting the headers would demand of a server what no released stored-query response declares; asserting their ABSENCE would read a SHOULD as a MUST NOT — the same restraint AMB-112 applies to Last-Modified on templates. Closes when a released sentence says whether stored queries fall under the conditional-header SHOULD and whether the overwriting version-less store takes If-Match (#1571)."
  - id: query-stored-list-wildcard-unreachable
    description: "The listing's empty-pattern wildcard clause names a request the released API cannot express, so no case exercises it."
    source: "ITS-REST specifications/operations/definition_query_list.yaml (\"If pattern should given be in the format of `[{namespace}::]{query-name}`, and when is empty, it will be treated as \\\"wildcard\\\" in the search\") vs parameters/path/qualified_query_name.yaml (`required: true`) and definition.openapi.yaml, which declares only `/definition/query/{qualified_query_name}` and `…/{version}` — there is no bare `/definition/query` path for an empty name to address; adjudicated in register AMB-124(d)"
    exception:
      reason: off_wire
      register: AMB-124
      note: "Unreachable as released, so nothing in the catalogue may depend on it. Our own bare GET /definition/query serves the whole registry as the empty prefix of the same rule — an extension no openEHR spec governs — and is deliberately exercised by no case, so no verdict rests on the unreachable clause. Closes if a release declares the wildcard route."
  # ADMIN surface (group-14 audit, 2026-07-27). The released Admin API is TWO
  # operations, both DELETE, both EHR-scoped. The single-EHR one has an SM
  # anchor (I_ADMIN_SERVICE.physical_ehr_delete) and axis 1 sees it; the BULK
  # one — DELETE /admin/ehr/all{?ehr_id*} — realizes NO SM operation at all
  # (register AMB-33), so its behaviours are ITS-ONLY and axis 1 cannot
  # enumerate them, exactly like the ITEM_TAG routes above. They are registered
  # here so the whole bulk surface is an honest boundary rather than silence.
  # Two behaviours are shared with the single-EHR route (the cascade and the
  # async acceptance branch) and their elements say so rather than being
  # duplicated per route.
  - id: admin-bulk-delete-unfiltered-full-set
    description: "The bulk delete called with NO ehr_id parameter targets every EHR on the server — an absent selector is the full set, neither an error nor a no-op — and succeeds with no content."
    source: "ITS-REST specifications/operations/admin_ehr_delete_all.yaml (\"Deletes all or multiple EHRs, or a specified subset of EHRs identified using the `ehr_id` query parameter\"; \"If the deletion is processed synchronously and completes successfully, the server returns status `204 No Content`\") + parameters/query/ehr_id_Admin.yaml (\"An optional parameter to perform the operation on a subset of EHRs\" — optional, so its absence cannot mean an empty selection) + responses/204_deleted_hard.yaml (\"the resource(s) identified by the request parameters has been physically deleted (i.e. hard-delete)\"); the emptiness is observed by reading each id back, since the released API has no EHR listing"
    covered_by: [I_ADMIN_SERVICE.physical_ehr_delete-delete_all_unfiltered]
  - id: admin-bulk-delete-subset-selection
    description: "A bulk delete carrying an ehr_id selector destroys exactly the EHRs it names and leaves every unnamed EHR retrievable."
    source: "ITS-REST specifications/operations/admin_ehr_delete_all.yaml (the quoted \"or a specified subset of EHRs identified using the `ehr_id` query parameter\") + parameters/query/ehr_id_Admin.yaml (\"An optional parameter to perform the operation on a subset of EHRs\"); what a subset naming an UNKNOWN id does is assigned by no released sentence and is adjudicated in register AMB-140 (delete-what-exists → 204)"
    covered_by: [I_ADMIN_SERVICE.physical_ehr_delete-delete_all_subset]
  - id: admin-bulk-delete-subset-form
    description: "The subset selector is accepted in the released RFC 6570 exploded form — a repeated `?ehr_id=a&ehr_id=b` — as well as in a single comma-joined value, and every named id is deleted rather than only the first."
    source: "ITS-REST specifications/admin.openapi.yaml (the path template `/admin/ehr/all{?ehr_id*}` — the only RFC 6570 query expansion in the whole released API) + parameters/query/ehr_id_Admin.yaml (`style: form`, `explode: true`, with a `multiple` example listing two identifiers) vs specifications/operations/admin_ehr_delete_all.yaml, whose prose fixes only that a subset is \"identified using the `ehr_id` query parameter\" and no serialization form at all"
    covered_by:
      # The repeated form itself, two ids, both deleted (the exploded
      # expansion the released path template `{?ehr_id*}` asks for). The
      # binding query model gained the repeated form in the 2026-07-28
      # schedule release (#539), retiring the former coverage_gap exception.
      - I_ADMIN_SERVICE.physical_ehr_delete-delete_all_subset_repeated
      # The law the prose fixes — a selector deletes exactly what it names —
      # at the smallest arity.
      - I_ADMIN_SERVICE.physical_ehr_delete-delete_all_subset
  - id: admin-bulk-delete-malformed-id-rejection
    description: "A bulk delete whose ehr_id selector carries a value that is not a well-formed identifier is refused as a client error, and the refusal happens BEFORE any deletion runs, so a typo in one id cannot silently destroy the well-formed ones in the same call."
    source: "ITS-REST docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 400 (\"The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)\") and the clause below the table (\"Status code `400` indicates normally a bad request, as well as a generic client-side error, used when no other `4xx` error code is appropriate\") + parameters/query/ehr_id_Admin.yaml (the selector is an EHR identifier) + SM UML/classes/i_admin_service.adoc §physical_ehr_delete (`an_ehr_id: UUID [1]`); the ORDERING — validate the whole list, then act — has no released sentence at all and is adjudicated in register AMB-140"
    # RETIRED coverage_gap (2026-07-28): the exception's own closing condition —
    # "the binding outcome and the gating case … are now authorable and are
    # simply MISSING" — is met. The delete_all binding declares `bad_request`
    # (400) on the overview's own row-400 sentence, and the case names one
    # malformed token beside a well-formed id, then reads the well-formed EHR
    # back to prove the refusal preceded any deletion — the ORDERING half,
    # which has no released sentence and stays adjudicated in AMB-140 and
    # guarded as such on the case.
    covered_by: [I_ADMIN_SERVICE.physical_ehr_delete-delete_all_malformed_id]
  - id: admin-bulk-delete-disabled-405
    description: "When a deployment disables the admin surface, the bulk-delete resource answers 405 Method Not Allowed — from a matched handler, carrying the mandatory Allow header with the empty field value — and deletes nothing."
    source: "ITS-REST specifications/operations/admin_ehr_delete_all.yaml (\"> NOTE: This functionality is intended primarily for **development** or **testing** purposes and may be disabled in **production** environments, in which case server may respond with `405 Method Not Allowed`.\") + responses/405.yaml (\"`405 Method Not Allowed` is returned when the service knows the request method, but the target resource doesn't support this method (e.g. due to security concerns)\") + docs/overview/Requests_and_responses.md §\"HTTP status codes\" (405 is a predefined row) and §\"HTTP Methods\" (\"If a method is recognized but not allowed for the target resource, the response SHOULD be `405 Method Not Allowed` status code\") over RFC 9110 §15.5.6 (the Allow header MUST) and §10.2.1 (\"An empty Allow field value indicates that the resource allows no methods, which might occur in a 405 response if the resource has been temporarily disabled by configuration\")"
    exception:
      reason: coverage_gap
      note: "Server behaviour fixed + HTTP-tested (app/ferroehr-rest/tests/it/admin_http.rs `disabled_admin_is_405_and_never_deletes`, which asserts the 405, the empty Allow, the openEHR error body AND that the EHR survives; `disabled_admin_config_is_405` for the group gate). Not authorable as a case — of the two former reasons ONE is gone. The outcome-taxonomy blocker is LIFTED since the 2026-07-28 schedule release (#544): `method_not_allowed` now exists. The TOPOLOGY reason remains and is decisive: a case cannot ask the SUT to be reconfigured mid-run — the branch exists only under a deployment setting the ixit does not model. NOTE the released asymmetry: this sentence appears on the BULK operation only; admin_ehr_delete carries no such NOTE and declares no 405, although the same configuration gate necessarily covers both routes, so the single-EHR route's 405 rests on the overview §HTTP Methods SHOULD rather than on its own operation. Closes when the outcome taxonomy gains the kind and the ixit models a disabled-admin instance (extension only by schedule release). SCOPE (2026-07-29): the very same configuration gate and the very same handler answer cover the THREE admin extension families declared in the served_extensions axis (admin-activity-report, admin-archive, admin-dump-load) plus the admin-extension routes of the released group — the gate is written once (the group dispatcher) and every /admin/ route inherits it — so the topology exclusion recorded here is the whole admin surface's, not the bulk delete's alone. That wider reach is HTTP-tested in-process by app/ferroehr-rest/tests/it/admin_extension_http.rs `the_admin_gate_covers_the_extension_groups`, which drives one route of each extension family against a disabled deployment and asserts the 405."
  - id: admin-physical-delete-owned-resource-cascade
    description: "A physical delete — on the single-EHR route and the bulk route alike — destroys everything the targeted EHR owned, not merely the EHR row: its COMPOSITIONs, EHR_STATUS, ITEM_TAGs, CONTRIBUTIONs and all their historical versions become unreachable."
    source: "ITS-REST specifications/operations/admin_ehr_delete.yaml and admin_ehr_delete_all.yaml, both verbatim: \"All resources associated with or owned by the specified EHR (such as COMPOSITION, EHR_STATUS, ITEM_TAG, CONTRIBUTION, and their historical versions) will also be **permanently** and physically deleted, in compliance with applicable data protection regulations (e.g., the GDPR in the European Union).\" + responses/204_deleted_hard.yaml (\"physically deleted (i.e. hard-delete)\") + RM UML/classes/org.openehr.rm.ehr.ehr.adoc §Attributes (the owned aggregate: compositions, ehr_status, directory, contributions, tags, ehr_access) — the list in the ITS sentence is exemplary (\"such as\"), and no released sentence states a postcondition at all; register AMB-143 adjudicates the closure as total, AMB-10 why the delete is physical in the first place"
    covered_by:
      - I_ADMIN_SERVICE.physical_ehr_delete-delete_existing_cascade
      - I_ADMIN_SERVICE.physical_ehr_delete-delete_all_cascade
  - id: admin-physical-delete-post-delete-identity
    description: "After a physical delete the ehr_id reads as ABSENT (not as a tombstone or a gone-marker) and is free again: creating an EHR under the same client-supplied identifier succeeds rather than conflicting."
    source: "ITS-REST specifications/responses/404_unknown_ehr_id.yaml (\"`404 Not Found` is returned when an EHR with `ehr_id` does not exist\") + responses/409_EHR.yaml (the create-with-id operation's ONLY conflict branch: \"Unable to create a new EHR due to a conflict with an already existing EHR with the same subject id, namespace pair, whenever EHR_STATUS is supplied\" — no clause about a previously deleted identifier) + SM UML/classes/i_ehr_service.adoc §create_ehr_with_id (`Pre_no_duplicate`: `not has_ehr (an_ehr_id)`, which a physical delete makes true again) and §physical_ehr_delete (a precondition and NO postcondition); the post-delete contract itself is unstated and adjudicated in register AMB-143"
    covered_by: [I_ADMIN_SERVICE.physical_ehr_delete-delete_existing_recreate]
  - id: admin-delete-async-acceptance-branch
    description: "Both admin deletes MAY be executed asynchronously, in which case the answer is 202 Accepted instead of 204 No Content — a success whose meaning is that the deletion has been accepted, not that it has happened."
    source: "ITS-REST specifications/operations/admin_ehr_delete.yaml and admin_ehr_delete_all.yaml, both verbatim: \"The server may execute this operation asynchronously (e.g. in batches), in which case returns status `202 Accepted`. If the deletion is processed synchronously and completes successfully, the server returns status `204 No Content`.\" + responses/202.yaml (\"`202 Accepted` is returned when the requested operation has been accepted for processing, but processing has not been completed or may not have started\") vs docs/overview/Requests_and_responses.md §\"HTTP status codes\", whose sixteen-row subset contains no 202 row and whose closing clause legalizes it (\"Additional status codes MAY be used as long as they do not conflict with the predefined codes\") — the omission is register AMB-139"
    exception:
      reason: coverage_gap
      register: AMB-139
      note: "MIGRATED, and the residue is honest. Both admin bindings now DECLARE the `accepted` (202) outcome the 2026-07-28 schedule release (#544) added, so the branch is nameable instead of hiding inside a success alias; each carries its own declared-but-unexercised row in the `branches:` section above. What did NOT change, and cannot: the branch has no client-side TRIGGER. The released sentence makes asynchrony the SERVICE's choice (\"The server may execute this operation asynchronously (e.g. in batches)\") with no request shape, header or parameter selecting it, so no case can drive it — the AMB-140 / AMB-159 pattern of a declared branch whose trigger the release withholds, not a coverage decision of ours. `ok_empty` therefore KEEPS `alt_status: [202]` on both bindings: every delete case asserts the deletion happened, and dropping the alias would turn the released MAY into a catalogue MUST-NOT and refute a conformant asynchronous server. This exception RETIRES when a release gives the arm a client-selectable trigger, or when the ixit models an asynchronous-deletion deployment fact a case can key on."
  # SMART on openEHR (ITS-REST docs/smart_app_launch/, `:spec_status:
  # DEVELOPMENT`). Prose-only: no OAS group, no schemas, no CNF anchor, and
  # exactly one RFC 2119 uppercase keyword in the whole specification — so
  # axis 2 (realized bindings) cannot enumerate it and axis 1 reaches only the
  # discovery document, through the reserved I_ITS_REST_SMART pseudo-interface
  # pinned in NON_SM_REST_OPERATIONS (the SM models no Platform component at
  # all). With an external Authorization Server, the CDR's enforceable share is
  # exactly the three elements below; the launch flows (master07), token
  # issuance and the deprecated-grant prohibition (master06), registration
  # (master03) and the application typology (master05) are Authorization-Server
  # behaviour, not CDR behaviour, and stay adjudicated by register AMB-151.
  #
  # ALL THREE ARE NOW EXECUTED (#538). The two blockers AMB-151 recorded are
  # gone: `docker/sut-smart.yml` boots the SUT in the SMART resource-server
  # posture, and the runner mints per-case Bearer tokens carrying a chosen
  # `scope` claim against the party's declared static test issuer
  # (ixit `smart` lane; the CDR itself never issues tokens — master06
  # §Supported Authentication Flows). A party that declares no `smart` lane
  # records these cases not-applicable with that citation, so the default
  # (SMART-off) lane is unchanged.
  - id: smart-discovery-document-shape
    description: "When SMART is enabled, /.well-known/smart-configuration is served relative to the Platform base URL as application/json, and its `services` map carries at minimum an `org.openehr.rest` entry whose `baseUrl` is an ABSOLUTE URL to the root of the openEHR REST API, alongside a `capabilities` array."
    source: "ITS-REST docs/smart_app_launch/master04-service_discovery.adoc §Service Discovery (\"The configuration endpoint should be always available relative to the _Platform_ base URL\"; \"Responses to `/.well-known/smart-configuration` endpoint must be served with the `application/json` MIME type\") + §Services (\"the response from configuration endpoint must include the `services` section\"; \"At a minimum, the `services` section must include the openEHR REST API using the key `org.openehr.rest`\"; \"`baseUrl`: Absolute URL to the root of the API `*(required)*`\") + §Capabilities (\"The `capabilities` section advertises supported SMART features as an array value\"; `openehr-permission-v1`: \"Indicates support for fine-grained scopes and authorization scheme over openEHR resources\"). The document's status codes, caching and auth posture are unstated — register AMB-149; the §Authentication Endpoints list names the wrong well-known document — register AMB-146"
    covered_by: [SMART-DISCOVERY-document_shape]
  - id: smart-discovery-absent-when-disabled
    description: "A deployment that does NOT run the SMART resource-server role serves no /.well-known/smart-configuration document and is byte-identical on the wire to a non-SMART deployment — the SMART surface is additive, never a change to the openEHR REST wire."
    source: "ITS-REST docs/smart_app_launch/master04-service_discovery.adoc §Service Discovery defines the document as a *Platform* facility, and manifest_vars.adoc marks the whole specification `:spec_status: DEVELOPMENT`; ITS-REST docs/overview/Resources.md §Resources defines the openEHR resource set the REST wire serves and never requires this document of it — so a CDR that is not part of a SMART Platform owes nothing here. No released clause governs the absent state; register AMB-151 is the adjudication"
    exception:
      reason: statement_declared
      register: AMB-151
      note: "The ABSENCE of a surface has no wire to drive: a case asserting a 404 would be asserting the router's fallback, not a released behaviour, and no released clause assigns the disabled state a status. Proven instead by app/ferroehr-rest/tests/it/smart_http.rs — `discovery_absent_when_disabled` and `smart_disabled_leaves_families_ungated` (the zero-drift disabled state, both halves). The positive direction IS executed: SMART-DISCOVERY-document_shape drives the document in the SMART lane, and it is not-applicable — never failed — on the default lane, so the two lanes together are the honest statement."
  - id: smart-resource-scope-grammar
    description: "A token's `scope` claim is parsed by the master08 resource-scope grammar — <compartment>/<resource>.<permission> — and a granted scope narrows access to exactly what it names: the operation the scope grants succeeds, and one whose permission letters do not cover the operation is refused. An identity scope (`openid`) presented alongside neither widens nor narrows the resource decision."
    source: "ITS-REST docs/smart_app_launch/master08-scopes.adoc §Resource Scopes (the syntax line `<compartment>/<resource>.<permission>`; the three compartments and their meanings; \"The following openEHR REST APIs `<resource>` types are supported for use in scopes\" with its closed three-noun list; the five-row `<templateId>`/`<queryName>` pattern table; the permission letters `c`/`r`/`u`/`d`/`s`; the eight-row maximal table) + §Scopes (\"The _Platform_ must validate requested scopes …\"; the three scope purposes, of which `openid` is an Identity Claim). The discovery example advertises two forms this grammar cannot parse — register AMB-145; `**` is named twice and never defined — AMB-147; the placeholder and validation sentences are defective — AMB-148; no scope-to-operation mapping, no tail well-formedness rule, no composition rule and no compartment-matching rule exist anywhere — AMB-150"
    covered_by:
      - SMART-RESOURCE_SCOPES-granted_scope_permits
      - SMART-RESOURCE_SCOPES-scope_deny_403
  - id: smart-resource-scope-grammar-remaining-rows
    description: "The grammar rows the executed cases do not yet reach on the wire: the `patient` compartment (which also needs a launch-context claim bound to a provisioned EHR), the `composition-` and `aql-` resource nouns, the four non-`*` rows of the id pattern table, and the INERT demotion of a string the grammar cannot parse (retained, granting and denying nothing)."
    source: "ITS-REST docs/smart_app_launch/master08-scopes.adoc §Resource Scopes (the five-row pattern table; the `patient` compartment: \"Access is limited to the current EHR and Patient is present in the context\"; the `composition-<templateId>` and `aql-<queryName>` nouns) + master07-authorization.adoc §Context Selection (the `ehrId` launch-context claim a `patient/` scope needs). AMB-145 (unparseable example forms), AMB-147 (`**` undefined) and AMB-150 (no compartment-matching rule) are the adjudications the inert reading rests on"
    exception:
      reason: coverage_gap
      register: AMB-151
      note: "A GENUINE COVERAGE GAP, stated openly rather than counted: the lane machinery now exists (the SMART compose overlay + the ixit `smart` token mint), so each remaining row is a new case, not a blocked one. Coverage ratchets: this entry shrinks as rows land and retires when none is left. Meanwhile the parser itself is exhaustively covered by its unit suite in crates/openehr-its/src/rest/smart_scopes.rs — the ONE parser both the CDR gate and scope-previewing REST clients use, covering all five pattern-table rows, all eight maximal-table rows, the compartments, the CRUDS letters, the AMB-147 `**` reading, and the inert demotion of the AMB-145 example forms — which is evidence about the parser, never about the wire."
  - id: smart-scope-deny-403
    description: "A request the granted SMART scopes do not permit is refused with 403 Forbidden — the authenticated-but-unauthorized status — and the refusal composes as an AND onto RBAC/ABAC: SMART can only narrow a decision, never widen one. On a Platform advertising `openehr-permission-v1`, a token holding no scope of the operation's resource family is refused the same way."
    source: "ITS-REST docs/overview/Requests_and_responses.md §\"Authentication and authorization\" (\"If authentication and authorization are required, services MUST properly use the `WWW-Authenticate` and/or `Proxy-Authenticate` response headers, returning `403 Forbidden`, `401 Unauthorized` or `407 Proxy Authentication` as applicable\") + §\"HTTP status codes\" (403 — \"The service understood the request but refuses to authorize it\") applied to ITS-REST docs/smart_app_launch/master08-scopes.adoc §Scopes (\"The _Platform_ must validate requested scopes against the _Application_ registration metadata, applicable access control policies, the authenticated user's permissions\"), which states the obligation and assigns no status — register AMB-150(4). The no-scope-of-the-family branch rests on the Platform's own declaration: master04-service_discovery.adoc §Capabilities, `openehr-permission-v1` — \"Indicates support for fine-grained <<_resource_scopes,scopes>> and authorization scheme over openEHR resources\""
    covered_by: [SMART-RESOURCE_SCOPES-scope_deny_403]

# ── Axis 4 — the OUTWARD axis: the non-openEHR surface this SUT serves ──────
#
# The first three axes are spec-inward (what the released text defines, and
# whether a case reaches it). This one runs the other way: it DECLARES the
# route families the SUT serves BEYOND the openEHR resource set, so a reader
# of the Conformance Statement learns the extension surface exists instead of
# discovering it on the wire. Register AMB-157 is the adjudication.
#
# IT NEVER GATES. No coverage obligation is derived from this axis — no case
# is required, no branch is expected, no verdict depends on it — and every
# entry says so in its own `never_gates: true`.
#
# THE STANDING SILENCE every entry rests on, verified first-hand: no released
# clause governs the URI space beyond the ITS-REST resource set.
# docs/overview/Resources.md §Resources defines what a resource IS ("a
# **resource** is an instance object of a specific openEHR class (type) that
# can be identified, addressed, handled or managed by the service") and lists
# the openEHR resource kinds; it never constrains what else a service may
# serve. The overview's only "Additional … MAY" sentence is about status codes
# (Requests_and_responses.md §HTTP status codes: "Additional status codes MAY
# be used as long as they do not conflict with the predefined codes"). A grep
# of ITS-REST specifications/docs/** for an additional/vendor/proprietary/
# extension endpoint clause returns zero hits. So every family below is
# spec-silent by construction — our own design/extension — and each entry
# records the silence, never a permission the text does not grant.
#
# ROUTES are written as the server mounts them under the DEFAULT deployment
# (absolute from the server root, `server.base_path` = /ferroehr/rest/openehr/v1
# included) — the same convention the served OpenAPI document uses. A
# non-default `server.base_path` moves the base-path-relative ones; the served
# document follows it.
served_extensions:
  # ── (1) the ten families the group-17 audit found undeclared ──────────────
  - family: health
    routes:
      - "GET /health"
      - "GET /health/liveness"
      - "GET /health/readiness"
    config_gate: "always on — no toggle; mounted outside the API base path and outside authentication (app/ferroehr-rest/src/extensions/health.rs)"
    spec_silence: "ITS-REST defines no health/liveness/readiness resource anywhere (grep of specifications/docs/**: zero hits) and no released clause governs the URI space beyond the resource set — Resources.md §Resources defines resources, never a route-space constraint. Our own design/extension: a container-orchestration probe surface."
    never_gates: true
  - family: server-status
    routes:
      - "GET /ferroehr/rest/status"
    config_gate: "always on — no toggle; mounted at the REST root (the base path minus /openehr/v1), outside authentication (app/ferroehr-rest/src/overview/status.rs)"
    spec_silence: "No released clause defines an operational status resource; the one released self-description operation is the System API's OPTIONS on the API root (docs/system/Description.md), which this endpoint neither replaces nor duplicates. No released clause governs the URI space beyond the resource set. Our own design/extension."
    never_gates: true
  - family: openapi-meta
    routes:
      - "GET /ferroehr/rest/api-docs/openapi.json"
      - "GET /ferroehr/rest/api-docs/ferroehr-ehr.openapi.json"
      - "GET /ferroehr/rest/api-docs/ferroehr-query.openapi.json"
      - "GET /ferroehr/rest/api-docs/ferroehr-definition.openapi.json"
      - "GET /ferroehr/rest/api-docs/ferroehr-demographic.openapi.json"
      - "GET /ferroehr/rest/api-docs/ferroehr-admin.openapi.json"
      - "GET /ferroehr/rest/api-docs/ferroehr-management.openapi.json"
      - "GET /ferroehr/rest/api-docs/ferroehr-terminology.openapi.json"
      - "GET /ferroehr/rest/api-docs/ferroehr-relationships.openapi.json"
