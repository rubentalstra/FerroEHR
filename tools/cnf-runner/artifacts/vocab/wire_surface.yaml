  - id: ehr-subject-uniqueness-and-key
    description: "A subject owns at most one EHR: the key is the EHR_STATUS.subject.external_ref (id.value, namespace) pair compared exactly, the refusal is the same 409 as an id-duplicate, and it holds on the client-supplied-id create path as well as the id-less one."
    source: "SM i_ehr_service.adoc §create_ehr_for_subject (error `ehr_for_subject_already_exists`) — the only released sentence that establishes the refusal at all; §create_ehr_for_subject_with_id omits it, and §get_ehrs_for_subject (\"Retrieve EHR or EHRs that have `ehr_status.subject_id` = supplied subject id\", returning a List) reads against it + RM ehr EHR_STATUS class §Attributes (`subject`: 1..1 PARTY_SELF, external_ref for the demographic reference — no uniqueness rule and no comparison rule) + ITS-REST Requests_and_responses.md §HTTP status codes row 409 (\"Indicates that the request could not be processed because it might generate a duplicate or a conflict\"). The key's comparison rule has no released sentence at all — register AMB-63 records the exact-match choice as our own design/extension"
    covered_by:
      # The stated half — the id-less create path — gates.
      - I_EHR_SERVICE.create_ehr-two_ehrs_same_patient
      # The unstated half — the client-supplied-id path — reports at OPTIONS.
      - I_EHR_SERVICE.create_ehr-with_ehr_id_subject_taken
  - id: ehr-status-subject-accepted-on-create
    description: "A create carrying an EHR_STATUS whose subject is populated is ACCEPTED and that subject becomes the EHR's subject — the SM `Pre_no_subject` precondition is a released defect and is not enforced."
    source: "SM i_ehr_service.adoc §create_ehr and §create_ehr_with_id state `Pre_no_subject`: `an_ehr_status.subject = Void`, immediately followed by \"A default `_subject_` will be generating containing a `PARTY_SELF` object\" — contradicting itself, and contradicting RM ehr EHR_STATUS class §Attributes (`subject`: 1..1 PARTY_SELF, so a Void subject is not a valid EHR_STATUS) and the released ITS-REST EHR API, which surfaces no for-subject create operation and so leaves the optional EHR_STATUS body as the ONLY way a client can give an EHR a subject. Adjudicated in register AMB-66"
    covered_by:
      - I_EHR_SERVICE.create_ehr-two_ehrs_same_patient
      - I_EHR_SERVICE.get_ehr-existing_ehr_by_subject_id
      - I_EHR_SERVICE.has_ehr-existing_subject_id
      - I_EHR_SERVICE.create_ehr-with_ehr_id_subject_taken
  # Conditional / versioning headers (ITS-REST Requests_and_responses.md).
  - id: header-etag-on-create
    description: "ETag returned on resource creation carrying the new version/object uid (optimistic concurrency)."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (ETag taken from VERSION.uid / EHR.ehr_id, changes on each new version)"
    covered_by: [I_EHR_COMPOSITION.create_composition-event, I_EHR_SERVICE.create_ehr-main]
  - id: header-etag-weak-prefix
    description: "Every ETag holding a resource identifier carries the weak-type W/ weakness indicator — on EHR, COMPOSITION, EHR_STATUS, FOLDER, CONTRIBUTION and VERSION responses alike, whatever identifier the service chose to put inside it."
    source: "ITS-REST Requests_and_responses.md §Deprecated headers (\"The `ETag` response header was used without a weakness indicator `W/`. This is now deprecated, all `ETag` headers that hold a resource identifier MUST include a weakness indicator `W/`\") + §ETag and Last-Modified (the weak-type rationale and the `ETag: W/\"…::…::2\"` shape; the identifier inside is a choice — \"usually taken from e.g. VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value\")"
    covered_by:
      - I_EHR_COMPOSITION.create_composition-event
      - I_EHR_COMPOSITION.get_composition_latest
      - I_EHR_SERVICE.create_ehr-main
      - I_EHR_SERVICE.create_ehr-with_ehr_id
      - I_EHR_SERVICE.create_ehr-return_identifier
      - I_EHR_SERVICE.get_ehr-existing_ehr_by_ehr_id
      - I_EHR_STATUS.get_ehr_status-get_by_ehr_id
      - I_EHR_STATUS.set_ehr_queryable-existing_ehr
      - I_EHR_DIRECTORY.create_directory-empty_ehr
      - I_EHR_DIRECTORY.update_directory-ehr_with_directory
      # The weak indicator on a DELETE's 204 as well, where the identifier
      # inside it is the newly committed deleted version (register AMB-75).
      - I_EHR_DIRECTORY.delete_directory-etag_names_new_version
      - I_EHR_CONTRIBUTION.commit_contribution-valid_composition
      # The CONTRIBUTION READ's tag as well — a non-versioned resource whose
      # unique identifier the register (AMB-87) reads as a unique state
      # identifier; the identifier-preference commit is the same tag on the
      # write side.
      - I_EHR_CONTRIBUTION.get_contribution-header_identity
      - I_EHR_CONTRIBUTION.commit_contribution-return_identifier
      - SIG-VERSION-signature_present
  - id: header-location-on-create
    description: "Location header on 201 Created pointing at the new resource URL."
    source: "ITS-REST Requests_and_responses.md §Location (used in 201 Created; MUST NOT indicate an alternate representation)"
    covered_by:
      - I_EHR_COMPOSITION.create_composition-event
      - I_EHR_SERVICE.create_ehr-main
      - I_EHR_SERVICE.create_ehr-with_ehr_id
  - id: header-last-modified
    description: "Last-Modified response header on versioned resources (from VERSION.commit_audit.time_committed)."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (\"Both `ETag` and `Last-Modified` SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique state identifiers\"; \"For openEHR resources, this value should be derived from VERSION.commit_audit.time_committed.value\")"
    covered_by:
      - I_EHR_COMPOSITION.create_composition-event
      - I_EHR_COMPOSITION.get_composition_latest
      - I_EHR_COMPOSITION.get_composition_at_time
      - I_EHR_SERVICE.create_ehr-main
      # The other EHR creation method: PUT /ehr/{ehr_id} asserts the same three
      # creation headers as POST /ehr (the matchers were optional there until
      # #428). Whether the SHOULD's scope sentence reaches the non-versioned
      # EHR resource at all is register AMB-64, whose fixed handling asserts
      # the header on the CREATION — where the EHR_STATUS creation commit
      # supplies a real VERSION.commit_audit.time_committed — and neither
      # asserts nor forbids it on an EHR READ.
      - I_EHR_SERVICE.create_ehr-with_ehr_id
      - I_EHR_STATUS.get_ehr_status-get_by_ehr_id
      # The DELETE's 204: the delete COMMITS a version (RM common master06
      # §Logical Deletion), so the SHOULD reaches it and the instant is that
      # commit's own (register AMB-75).
      - I_EHR_DIRECTORY.delete_directory-etag_names_new_version
      # The CONTRIBUTION read: whether the SHOULD reaches a resource
      # Resources.md classifies as non-versioned is register AMB-87, whose
      # fixed handling supplies the committal instant.
      - I_EHR_CONTRIBUTION.get_contribution-header_identity
      # The CONTRIBUTION COMMIT, under both representation preferences —
      # AMB-87's scope extension. The minimal branch is the pointed one: its
      # body is empty, so the header is the only channel the commit instant
      # has.
      - I_EHR_CONTRIBUTION.commit_contribution-last_modified
      - I_EHR_CONTRIBUTION.commit_contribution-last_modified_minimal
      # The demographic sibling commit, on the same extension: its binding
      # declares the header, so this case executes it.
      - I_EHR_CONTRIBUTION.commit_contribution-demographic
      - SIG-VERSION-signature_present
  - id: header-prefer-return-representation
    description: "Prefer: return=representation is honored — the created/updated resource body is returned (vs the default return=minimal)."
    source: "ITS-REST Requests_and_responses.md §Prefer + §Representation details negotiation (default return=minimal; return=representation returns the full resource)"
    covered_by: [I_EHR_COMPOSITION.create_composition-event]
  - id: header-prefer-return-identifier
    description: "Prefer: return=identifier is honored — the body is the identifier of the affected resource only, at a 201/200 status, never 204 No Content."
    source: "ITS-REST Requests_and_responses.md §Prefer only identifier (\"a variant of preference that implies minimal response semantics, but with a non-empty response body (i.e. the status will be `201 Created` or `200 OK`, never `204 No Content`)\"; \"when application/json is requested … the response body will be a single JSON object with a single uid attribute\")"
    covered_by:
      - I_EHR_COMPOSITION.create_composition-return_identifier
      # The EHR half: the identifier of a created EHR is its ehr_id
      # (Resources.md §Identifier types, "an `ehr_id` to identify an EHR"), and
      # the case proves the returned `uid` is that by reading the EHR back
      # through it.
      - I_EHR_SERVICE.create_ehr-return_identifier
      # The UPDATE half of the preference: 200 (never 204) and the identifier
      # of the version the update created.
      - I_EHR_STATUS.set_ehr_queryable-return_identifier
      # The docs text's own worked example of the preference is a COMPOSITION
      # PUT (§Prefer only identifier), exercised here.
      - I_EHR_COMPOSITION.update_composition-return_identifier
      # The CHANGE-SET half: the affected resource of a native commit is the
      # CONTRIBUTION itself, and the case reads it back through the returned
      # identifier.
      - I_EHR_CONTRIBUTION.commit_contribution-return_identifier
  - id: header-preference-applied
    description: "Preference-Applied on a write response names the return preference the response actually applied (return=minimal | return=identifier | return=representation), including the applied default when no Prefer was sent."
    source: "ITS-REST Requests_and_responses.md §Representation details negotiation (\"The service MAY include a `Preference-Applied` header in the response, such as `Preference-Applied: return=minimal` or `Preference-Applied: return=representation`, to indicate that the client's preference has been honored\"; \"If no `Prefer` header is provided, the default behavior is assumed to be `return=minimal`\") + the §Location and §Prefer only identifier response examples, which show the header on a 201 and on the identifier 200"
    exception:
      reason: coverage_gap
      note: "server behaviour fixed + DB-tested (#398, app/ferroehr-rest/tests/{headers,demographic_http,flat_http,definition_adl2_http}.rs): every write path — canonical/JSON RM writes, demographic party/relationship/contribution writes, both template uploads, the ITEM_TAG collection writes, and the Simplified-Formats COMPOSITION commit — declares the preference it applied through one seam, and never claims an unapplied preference. The presence is DECLARED as `Preference-Applied: present?` on the create_composition / update_composition / create_composition#return_identifier binding outcomes, and those declarations now EXECUTE (#403, tools/cnf-runner/src/exec/headers.rs). What is still not assertable is the header itself: the released text makes it a MAY (\"The service MAY include a `Preference-Applied` header\"), and the closed matcher vocabulary offers no if-present-then-equals form — `present?` never fails and a literal/pattern fails on absence, so asserting either the presence or the value would over-claim the MAY. Closes when the matcher vocabulary gains a conditional-value form (extension only by schedule release) — the same closed-vocabulary precedent as method-501-unrecognized-method-deviation."
  - id: header-if-match-412
    description: "If-Match precondition on a state-changing method evaluates false → 412 Precondition Failed, latest version_uid echoed in ETag; absent when required → 400."
    source: "ITS-REST Requests_and_responses.md §If-Match and accidental overwrites (412 on false condition; 400 when the service expects If-Match and it is absent)"
    covered_by:
      # Both halves land on the EHR_STATUS whole-resource PUT — the operation
      # the same section's scope sentence describes exactly ("when the
      # `preceding_version_uid` is not part of the endpoint path segment").
      - I_EHR_STATUS.set_ehr_queryable-stale_if_match
      - I_EHR_STATUS.set_ehr_queryable-missing_if_match
      # The same two halves on the COMPOSITION PUT — the other operation the
      # scope sentence covers (its path carries the version CONTAINER id, not
      # the preceding VERSION uid).
      - I_EHR_COMPOSITION.update_composition-stale_if_match
      - I_EHR_COMPOSITION.update_composition-missing_if_match
      # Both halves again on the DIRECTORY PUT *and* the DIRECTORY DELETE —
      # the routes carry no version segment at all, so the scope sentence
      # reaches them too, and the delete is the case that keeps the 412/409
      # line honest: a version-in-the-path delete (COMPOSITION) conflicts,
      # a version-in-If-Match delete (directory) fails its precondition.
      - I_EHR_DIRECTORY.update_directory-stale_if_match
      - I_EHR_DIRECTORY.update_directory-missing_if_match
      - I_EHR_DIRECTORY.delete_directory-stale_if_match
      - I_EHR_DIRECTORY.delete_directory-missing_if_match
  - id: header-if-match-weak-form
    description: "If-Match supplied in the weak entity-tag form W/\"<uid>\" — the shape the server itself emits as the ETag — is decoded and evaluated as a precondition: a current value passes the write, a stale value is 412 (never a malformed-syntax rejection)."
    source: "ITS-REST Requests_and_responses.md §ETag and Last-Modified (the ETag \"is considered to be of weak-type and should have a weakness indicator W/ prefix\") + §Deprecated headers (\"all ETag headers that hold a resource identifier MUST include a weakness indicator W/\") + §If-Match and accidental overwrites (412 only when \"the condition evaluates to false\")"
    covered_by:
      - I_DEMOGRAPHIC_SERVICE.update_party-weak_etag_accepted
      - I_DEMOGRAPHIC_SERVICE.update_party-weak_etag_stale
  - id: header-committal-change-type-merge
    description: "A client-supplied AUDIT_DETAILS change_type in the openehr-audit-details committal header is merged into the commit (a legal divergent group code like 250|amendment| on an update is honoured verbatim); an out-of-group token is 422 (Change_type_valid); a group code contradicting the operation (249|creation| on an update) is a 400 change-control mismatch."
    source: "ITS-REST Requests_and_responses.md §openehr-version and openehr-audit-details (change_type first among the client-suppliable attributes; \"whatever is provided it MUST be merged\") + RM common master04 (AUDIT_DETAILS.Change_type_valid) + RM common master06 §Contributions (the audit_change_type group semantics)"
    covered_by:
      - I_EHR_COMPOSITION.update_composition-audit_amendment
      - I_EHR_COMPOSITION.update_composition-audit_change_type_mismatch
      - I_EHR_COMPOSITION.update_composition-audit_change_type_invalid
      # The same MUST-merge on the other change-controlled resource the
      # section names (EHR_STATUS), including the description attribute.
      - I_EHR_STATUS.set_ehr_queryable-audit_change_type
  - id: header-committal-on-delete
    description: "The committal request headers are accepted and merged on DELETE too — the delete commits a 523|deleted| VERSION whose AUDIT_DETAILS carries the supplied description/committer."
    source: "ITS-REST Requests_and_responses.md §openehr-version and openehr-audit-details (\"services MUST also allow PUT, POST and DELETE methods directly\"; \"services MUST accept openehr-version and openehr-audit-details custom request headers\") + RM common master06 §Logical Deletion"
    covered_by: [I_EHR_COMPOSITION.delete_composition-audit_headers]
  - id: header-deprecated-audit-details-bare
    description: "The bare deprecated committal header name openEHR-AUDIT_DETAILS (a different name than the Release-1.1.0 openehr-audit-details after lowercasing) is still accepted, with the same attribute-path-in-value grammar."
    source: "ITS-REST Requests_and_responses.md §Deprecated headers (the openEHR-AUDIT_DETAILS -> openehr-audit-details table row; \"the deprecated headers remain available for backward compatibility\")"
    covered_by: [I_EHR_COMPOSITION.update_composition-audit_bare_deprecated]
  - id: header-if-match-case-insensitive
    description: "The If-Match OBJECT_VERSION_ID is compared case-insensitively: a token differing from the current version_uid only in case names the same version and must not raise a spurious 412."
    source: "BASE base_types master05-identification_package.adoc §Composite Identifiers and Case (two composite identifiers \"identical apart from case … identify the same thing\") applied to the ITS-REST Requests_and_responses.md §If-Match and accidental overwrites condition"
    covered_by: [I_DEMOGRAPHIC_SERVICE.update_party-case_variant_if_match]
  # RETIRED coverage_gaps (2026-07-28): both revision-history rows and the
  # VERSIONED_PARTY container row are now EXERCISED, not excepted. The blocker
