      note: "server behaviour fixed + DB-tested (#398, app/ehrbase-rest/tests/{headers,demographic_http,flat_http,definition_adl2_http}.rs): every write path — canonical/JSON RM writes, demographic party/relationship/contribution writes, both template uploads, the ITEM_TAG collection writes, and the Simplified-Formats COMPOSITION commit — declares the preference it applied through one seam, and never claims an unapplied preference. The presence is DECLARED as `Preference-Applied: present?` on the create_composition / update_composition / create_composition#return_identifier binding outcomes, and those declarations now EXECUTE (#403, tools/cnf-runner/src/exec/headers.rs). What is still not assertable is the header itself: the released text makes it a MAY (\"The service MAY include a `Preference-Applied` header\"), and the closed matcher vocabulary offers no if-present-then-equals form — `present?` never fails and a literal/pattern fails on absence, so asserting either the presence or the value would over-claim the MAY. Closes when the matcher vocabulary gains a conditional-value form (extension only by schedule release) — the same closed-vocabulary precedent as method-405-allow-header."
  - id: header-if-match-412
