# The wire-surface coverage register (issue #271) — the authored,
# spec-cited record of the wire surface the CNF catalogue is measured
# against for TOTAL coverage. The `surface-coverage` gate
# (tools/cnf-runner/src/validate.rs) fails on any spec-defined wire
# behaviour with neither a covering case nor an entry here — silence is
# not coverage (.claude/rules/testing.md §CNF coverage).
#
# ORACLE (owner ruling 2026-07-24): every `source` cites a RELEASED
# component — the SM platform interfaces + the ITS-REST docs text — never
# the vendored OAS. `reason` vocabulary: off_wire (ITS-REST 1.1.0 exposes
# no wire), variant_of (realized as another binding/variant), accessor
# (sub-interface navigation — excluded upstream, none here), coverage_gap
# (on the wire, not yet exercised — a NEW-CASE candidate that ratchets
# out when a case lands), statement_declared (an off-wire declared
# capability).

