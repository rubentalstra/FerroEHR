  - id: ehr-id-path-segment-malformed-rejection
    description: "An ehr_id path segment that is not a well-formed identifier at all (a non-UUID token) is refused as a client error rather than served, and never resolves to some other EHR."
    source: "RM ehr EHR class §Attributes (`ehr_id`: 1..1 HIER_OBJECT_ID, \"The unique identifier of this EHR\", NOTE \"is is strongly recommended that a UUID always be used for this field\") + SM i_ehr_service.adoc (every ehr_id-taking operation declares `ehr_id: UUID [1]`) + ITS-REST Requests_and_responses.md §HTTP status codes, which offers two rows that both fit and picks neither: 400 (\"The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)\") and 404 (\"The origin service did not find the target resource or is not willing to disclose that one exists\") — the choice between them is adjudicated in register AMB-76, whose repo-wide fixed handling puts a segment that parses as no identifier form at 400 and leaves the well-formed-but-unknown one at 404, and whose scope names `ehr_id`"
