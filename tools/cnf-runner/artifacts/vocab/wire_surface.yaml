  - id: versioned-party-container-and-revision-history
    description: "The VERSIONED_PARTY container read (GET /demographic/versioned_party/{uid}) and its revision_history sub-resource are ITS-REST wire operations with NO SM anchor: I_PARTY offers has_party_version_id/get_party_at_time/get_party_at_version but no container or revision-history read. The two VERSION sub-resources are realized under the AMB-127 closest-read convention (I_PARTY.get_party_at_version, variants versioned_party and versioned_party_at_time); these two are anchored under the reserved I_ITS_REST_VERSIONED_PARTY / I_ITS_REST_REVISION_HISTORY pseudo-interfaces (AMB-161) instead, because no SM read returns either shape, and both are now exercised — container shape + versioning headers, the negotiated canonical-XML branch (DOCUMENTED per AMB-167, so not option-gated), the revision-history order and item shape, and the miss branch of each."
    source: "SM openehr_platform I_PARTY (docs/specs/openehr/SM/docs/UML/classes/i_party.adoc — the operation list) vs the ITS-REST demographic wire (DEVELOPMENT lifecycle); register AMB-136 carries the full demographic realization picture in both directions and its 2026-07-28 re-adjudication against the pseudo-interface mechanism; RM common versioned_object.adoc + RM demographic versioned_party.adoc for the container shape (owner_id's local/SYSTEM tokens asserted per AMB-69's registered convention, its id value left unasserted)"
