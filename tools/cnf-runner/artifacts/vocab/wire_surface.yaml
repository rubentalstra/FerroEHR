  - id: demographic-resolve-refs-unrealized
    description: "Prefer: return=representation, resolve_refs is not implemented on any demographic read, and no demographic read declares the Prefer parameter that would carry it — although the party payloads are the API's most reference-dense (PARTY.relationships[i].source/.target and ROLE.performer are PARTY_REFs, ACTOR.roles is a list of them, PARTY.reverse_relationships a list of LOCATABLE_REFs)."
    source: "ITS-REST Requests_and_responses.md §\"Prefer resolving Object references\" (\"Clients MAY request that object references (e.g., OBJECT_REF) be resolved into full or partial representations by specifying: `Prefer: return=representation, resolve_refs`\"; the one worked context is \"retrieving lists of COMPOSITION resources within an EHR\") vs the five party get operations and the four versioned_party reads, none of which declares a Prefer parameter; RM demographic party.adoc / role.adoc / actor.adoc for the reference-typed attributes"
    exception:
      reason: statement_declared
      register: AMB-133
      note: "An honest declined boundary, not a coverage gap. The token is a bare CLIENT-side MAY: it assigns the service no obligation, names no status, no Preference-Applied value and no failure mode, and on the demographic reads it cannot even be requested. Asserting resolution would gate a MAY; asserting non-resolution would forbid what the same sentence permits. The one resource where a released paragraph makes the resolution observable is the CONTRIBUTION read (register AMB-57), which is gated by header-prefer-resolve-refs. Revisits if a future ITS-REST release declares Prefer on the demographic reads or states what resolving a PARTY_REF yields (#1579)."
