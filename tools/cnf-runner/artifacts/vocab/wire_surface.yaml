      reason: coverage_gap
      note: "server behaviour fixed + HTTP-tested (#397, app/ehrbase-rest/tests/template_adl14_http.rs: the ADL 1.4 template GET now answers Accept: application/json with Content-Type: application/json and keeps application/openehr.wt+json for the wt Accept); the presence is DECLARED as `Content-Type: negotiated` on the get_opt binding outcome. NEW-CASE candidate blocked on the runner capability tracked in #403: `outcomes.*.headers` matchers are parsed but never evaluated — only the status is classified (tools/cnf-runner/src/exec/outcome.rs) — so no executable Content-Type assertion exists yet; this gap closes when #403 lands header-matcher evaluation."
