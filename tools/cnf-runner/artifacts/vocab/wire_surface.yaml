    reason: variant_of
    source: "released ITS-REST 1.1.0 — the ok branch is exercised on the variant-less I_DEFINITION_ADL14.get_opt binding; this variant scopes only its distinctive negotiation/rejection branch"
  - binding: I_DEFINITION_ADL14.get_opt
    variant: example_deprecated_accept
    outcome: not_found
    reason: variant_of
    source: "released ITS-REST 1.1.0 — the not_found branch is exercised on the variant-less I_DEFINITION_ADL14.get_opt binding; this variant scopes only its distinctive negotiation/rejection branch"
  # RETIRED coverage_gap: the variant-less get_opt not_acceptable branch is now
  # exercised by I_DEFINITION_ADL14.get_opt-flat_not_acceptable (an OPT read
  # asking for application/openehr.wt.flat+json, a COMPOSITION data format the
  # template resource has no representation in).
  - binding: I_DEFINITION_ADL2.get_artefact
    variant: example
    outcome: not_acceptable
    reason: variant_of
    source: "released ITS-REST 1.1.0 — the not_acceptable branch is exercised on the variant-less I_DEFINITION_ADL2.get_artefact binding; this variant scopes only its distinctive negotiation/rejection branch"
  - binding: I_DEFINITION_ADL2.get_artefact
    variant: version
    outcome: not_found
