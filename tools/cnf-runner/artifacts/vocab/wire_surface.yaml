      - I_EHR_CONTRIBUTION.commit_contribution-ehr_not_modifiable
  # The CONTRIBUTION change-set surface (SM i_ehr_contribution.adoc; RM common
  # master06 §Contributions; the ITS-REST contribution routes).
  - id: contribution-client-supplied-envelope-uid
    description: "The CONTRIBUTION envelope's optional client-supplied uid is ACCEPTED when free — the committed resource is addressable under it — and a second commit naming a uid already in use is refused as a duplicate identifier."
    source: "ITS-REST specifications/operations/contribution_create.yaml, the relaxed-envelope list, verbatim: \"`uid`: when provided, it will be accepted in case is not in-use, otherwise error will be returned\" — the only released sentence governing the attribute. WHICH error comes from Requests_and_responses.md §HTTP status codes, the 409 row (\"Indicates that the request could not be processed because it might generate a duplicate or a conflict\"), the only row that describes a colliding identifier"
    covered_by:
      - I_EHR_CONTRIBUTION.commit_contribution-client_uid_in_use
  - id: contribution-preceding-version-precondition
    description: "A member's preceding_version_uid is a real precondition, not decoration: naming a superseded version fails the commit and the response names the container's current latest version — the lost-update guard on a route that carries no If-Match at all."
    source: "RM common master06-change_control_package.adoc §Version tree (a new Version supersedes the one it names as preceding) + RM common UML/classes/org.openehr.rm.common.version.adoc (Preceding_version_uid_validity) vs ITS-REST Requests_and_responses.md §HTTP status codes, whose 412 row is written for HEADER preconditions (\"One or more conditions given in the request header fields evaluated to false\") while this route's precondition travels in the member body — the code and the ETag echo are adjudicated in register AMB-54(b), the ETag half mirroring §\"If-Match and accidental overwrites\" (\"SHOULD return also latest `version_uid` in the `ETag` response headers\")"
    covered_by:
      - I_EHR_CONTRIBUTION.commit_contribution-stale_preceding_version
  - id: contribution-change-kind-rejection-families
    description: "The three distinct change-control failures a commit can carry, each answered differently: a first-version MODIFICATION (the released 400 trigger), a CREATION that names a preceding version, and an out-of-group change_type/lifecycle token."
    source: "ITS-REST specifications/responses/400_CONTRIBUTION.yaml assigns exactly ONE of them — \"or the modification type does not match the operation - i.e. first version of a MODIFICATION\" — and nothing released assigns the other two; RM common master06 §Contributions (the change-kind law) + UML/classes/org.openehr.rm.common.version.adoc (Preceding_version_uid_validity) + master04 (AUDIT_DETAILS Change_type_valid) ground the REJECTIONS, and register AMB-54(a)/(c) adjudicates their codes into the Requests_and_responses.md §HTTP status codes 422 row (\"The request was well-formed but was unable to be followed due to semantic errors\")"
    covered_by:
      - I_EHR_CONTRIBUTION.commit_contribution-one_commit_invalid_change_types
      - I_EHR_CONTRIBUTION.commit_contribution-one_commit_invalid_change_types_persistent
      - I_EHR_CONTRIBUTION.commit_contribution-creation_with_preceding_version
      - I_EHR_CONTRIBUTION.commit_contribution-two_commits_second_creation
  - id: contribution-rejection-status-discrimination
    description: "WHICH of 400 and 422 a given commit rejection carries — the released 400 for a first-version MODIFICATION versus the register-adjudicated 422 for the remaining change-control and change-set failures — is a real distinction on the wire that the catalogue cannot currently pin."
    source: "ITS-REST specifications/responses/400_CONTRIBUTION.yaml (the one assigned trigger) vs Requests_and_responses.md §HTTP status codes rows 400 and 422, read together with register AMB-54 (the narrowed entry: the first-version-MODIFICATION half IS assigned, the creation-with-preceding and out-of-group halves are not) and AMB-84 (the empty change set)"
    exception:
      reason: coverage_gap
      register: AMB-54
      note: "Not authorable today for a closed-vocabulary reason, the same blocker recorded on ehr-id-path-segment-malformed-rejection and query-ehr-id-parameter-header-conflict: the outcome taxonomy (vocab/outcomes.yaml) carries ONE rejection kind for both codes (`validation_failed`), and the commit binding's `validation_failed` therefore declares `alt_status: [400]` so the kind spans the family. A case can say a rejection happened, not which code it wore. Splitting the two would need either a second rejection kind in the closed taxonomy or a per-case status override, both of which are extensions only a schedule release may make; a variant binding cannot do it, because the two branches differ in the BODY's change kind, not in the request shaping a variant expresses. What IS gated meanwhile is the rejection itself on every branch (contribution-change-kind-rejection-families) plus the two branches that DO have distinct kinds — 412 (contribution-preceding-version-precondition) and 409 (contribution-client-supplied-envelope-uid). Closes when the outcome taxonomy gains the second rejection kind."
  - id: contribution-deletion-member-shape
    description: "A deletion member is data-LESS: committing 523|deleted| with the data omitted performs the logical delete, and a 523|deleted| member that carries data is refused rather than committed."
    source: "RM common master06-change_control_package.adoc §Logical Deletion, the procedure verbatim: \"create a new Version in the normal way; delete its `_data_`; set the `_lifecycle_state_` value to the code for `deleted`; commit in the normal way\" + UML/classes/org.openehr.rm.common.original_version.adoc (data 0..1, which is what lets a deletion version carry none) — CONTRADICTED by the released commit schema, which makes the member's data required with no null form; adjudicated in register AMB-85 in favour of the RM, with the refusal in the Requests_and_responses.md §HTTP status codes 422 row"
    covered_by:
      - I_EHR_CONTRIBUTION.commit_contribution-delete_directory
      - I_EHR_CONTRIBUTION.commit_contribution-deleted_member_with_data
  - id: contribution-versions-ref-shape
    description: "A served CONTRIBUTION's versions[i] reference carries the committed DATA class (COMPOSITION / EHR_STATUS / FOLDER) as its type, the local namespace, and the full three-part OBJECT_VERSION_ID of the version that caused the change — and resolves to the full ORIGINAL_VERSION when the client asks for reference resolution."
    source: "RM common UML/classes/org.openehr.rm.common.contribution.adoc (versions: \"Set of references to Versions causing changes\", then \"items of types such as COMPOSITION and FOLDER\") + BASE UML/classes/org.openehr.base.base_types.object_ref.adoc (type: \"Name of the class ... of object to which this identifier type refers\") + RM common master06 (VERSION objects \"are identified by a `_uid_` attribute of type `OBJECT_VERSION_ID`\"); the RM-vs-BASE tension over which class name belongs in `type` is adjudicated in register AMB-88 in favour of the released schema example (the DATA class)"
    covered_by:
      - I_EHR_CONTRIBUTION.get_contribution-version_ref_shape
      - I_EHR_CONTRIBUTION.get_contribution-resolve_refs
  - id: versioned-object-addressing-is-ehr-scoped
    description: "A version_uid resolves only within the EHR whose route addresses it: a live version identifier belonging to another EHR's container is not served, so version ids are not a global namespace."
    source: "RM ehr UML/classes/org.openehr.rm.ehr.ehr.adoc §Attributes (`ehr_status` is THIS EHR's VERSIONED_EHR_STATUS) + RM common UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions (`version_with_id`, `Pre: has_version_id (a_ver_id)` — membership of the addressed container) + ITS-REST Requests_and_responses.md §HTTP status codes row 404 (\"The origin service did not find the target resource or is not willing to disclose that one exists\")"
    covered_by:
      - I_EHR_STATUS.get_versioned_ehr_status-version_of_other_ehr
  # Definition / TEMPLATE surface (group-10 audit, 2026-07-27). The list-filter
  # semantics and the ADL2 rejection-phase boundary the released text leaves
  # open — registered rather than silently omitted.
  - id: template-list-filter-conjunction
    description: "Supplying more than one list filter narrows the result set: a template must satisfy every supplied filter to be listed, so adding a filter can never widen a result."
    source: "ITS-REST specifications/parameters/query/filter_template_id.yaml + concept.yaml + filter_version.yaml (each described alone — \"Pattern for matching …\" / \"Filter by version …\") + operations/definition_template_adl1.4_list.yaml and definition_template_adl2_list.yaml (both declare a single 200 branch); the released text never describes the parameters AS A QUERY and assigns no combination rule — adjudicated in register AMB-114 as conjunction, the only reading under which a filter filters"
    exception:
      reason: coverage_gap
      register: AMB-114
      note: "The single-filter glob half IS gated (I_DEFINITION_ADL2.list_matching_artefacts-filter). The COMBINATION is not authorable as a discriminating case today: the closed assertion vocabulary offers no membership or cardinality predicate over a JSON list body (`field` addresses RM paths, `result_set` is AQL-only), so a two-filter case could assert only that the request was fulfilled — which conjunction, disjunction and last-wins all satisfy equally. Closes when the assertion vocabulary gains a list-membership form (extension only by schedule release), or when a released sentence assigns the combination."
  - id: template-list-offset-past-end
    description: "An offset at or beyond the end of the filtered template list is a fulfilled request answering an EMPTY list — not a client error, and not the last page."
    source: "ITS-REST specifications/parameters/query/offset.yaml (\"The row number in result-set to start result-set from (`0`-based), default is `0`\") + operations/definition_template_adl1.4_list.yaml and definition_template_adl2_list.yaml (a single declared 200 branch — no rejection exists to reach); the released text assigns no outcome to a past-the-end offset — adjudicated in register AMB-114 as the empty page"
    exception:
      reason: coverage_gap
      register: AMB-114
      note: "Same closed-vocabulary blocker as template-list-filter-conjunction. The empty-list positive is already gated on an empty server (I_DEFINITION_ADL2.list_opts-empty, I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts), but telling an empty PAGE from a non-empty one on a POPULATED server needs a list-cardinality assertion the vocabulary does not have, so a past-the-end case could assert only fulfilment. Closes when the assertion vocabulary gains a list-cardinality form."
  - id: template-upload-section-boundary-phase
    description: "A rejection for a MISSING mandatory ADL2 section (language / description / definition / terminology / component_terminologies) may wear either upload rejection status, because AM places the defect in the grammar and in the validity catalogue at once."
    source: "AM docs/OPT2/master03-opt_raw.adoc §Artefact Structure (the `adl_operational_template` Antlr4 rule makes each section a production, so a source lacking one fails to parse) vs AM docs/AOM2/master08-validation.adoc §Phase 1 - Basic Integrity §Basic checks (\"any missing mandatory parts, e.g. `terminology` section (STCNT)\", so a validator may equally report it); neither says which phase owns it, and the two phases carry different wire statuses under register AMB-110"
    exception:
      reason: coverage_gap
      register: AMB-116
      note: "A deliberate hold-out, not an omission. Both rejection STATUSES are gated on phase-unambiguous fixtures — 400 by I_DEFINITION_ADL2.upload_artefact-unparseable_artefact and I_DEFINITION_ADL14.upload_opt-unparseable_opt, 422 by I_DEFINITION_ADL2.upload_artefact-invalid_artefacts (a VARDT violation) and I_DEFINITION_ADL14.upload_opt-invalid_opt — so the split law itself is covered. What is NOT pinned is which status a SECTION-level defect wears; the corpus keeps cnf.adl2.opt.invalid.missing_description and .missing_definition referenced by no case for exactly that reason. Closes when AM assigns the phase (UPR-80)."
  # Definition / STORED QUERY surface (group-11 audit, 2026-07-27). The
  # version-slot, immutability, write-grammar, listing and fidelity positions
  # the released text leaves open, plus the conditional-header posture —
  # registered rather than silently omitted.
  - id: query-stored-default-version-slot
    description: "A version-less stored-query store writes one constant default version slot (1.0.0) and its Location names the version WRITTEN, not the name's latest; a second version-less store updates that same slot in place."
    source: "ITS-REST specifications/operations/definition_query_store.yaml (\"Stores a new query, or updates an existing query on the system\"; no conflict branch, and no version parameter) + docs/query/Qualified_query_name.md (the version is optional and its absent/partial rule is stated for USE — \"the system must use the latest `version` with the supplied prefix\" — not for a write) + docs/overview/Requests_and_responses.md §\"Representation details negotiation\" (\"If no `Prefer` header is provided, the default behavior is assumed to be `return=minimal`\") + §\"Prefer minimal, identifier or full representation response\" (\"The response SHOULD include a `Location` header pointing to the newly created or updated resource\"); the minted version itself is spec-silent and adjudicated in register AMB-117"
    covered_by:
      - I_DEFINITION_QUERY.store_query-default_version_slot
      - I_DEFINITION_QUERY.store_query-update_in_place
      - I_DEFINITION_QUERY.store_query-default_slot_with_higher_version
  - id: query-stored-version-immutability
    description: "A version-ADDRESSED stored query is immutable: re-storing an existing (name, version) pair — in any letter case — is refused and the stored definition is untouched."
    source: "ITS-REST specifications/tags/StoredQuery_schema.md (\"Stored queries provide a reusable, immutable way to identify a specific AQL statement\") + responses/409_StoredQuery_version.yaml (\"`409 Conflict` is returned when a query with the given `qualified_query_name` and `version` already exists on the server\") reading on docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 409 (\"the request could not be processed because it might generate a duplicate or a conflict\") + BASE base_types master05 §\"Composite Identifiers and Case\" (\"two identifiers identical apart from case are considered to be identical\"); the coexistence with the version-less store's overwrite sentence is register AMB-117"
    covered_by:
      - I_DEFINITION_QUERY.store_query-version_duplicate_conflict
      - I_DEFINITION_QUERY.store_query-version_duplicate_case_variant_name
  - id: query-stored-write-version-grammar
    description: "The versioned store accepts only an exact numeric major.minor.patch version segment: a {major}/{major}.{minor} prefix, a SEMVER pre-release, and any malformed token are refused and register nothing."
    source: "ITS-REST specifications/parameters/path/version.yaml (its prefix semantics are RESOLUTION semantics — \"the highest (latest) version matching the prefix will be considered\" — which cannot apply to a write) + docs/query/Qualified_query_name.md (\"The `version` identifier is in the format specified by SEMVER style (i.e. `major.minor.patch`)\") + docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 400 (\"malformed request syntax, syntactically invalid content\"); the write-side grammar is adjudicated in register AMB-122"
    covered_by:
      - I_DEFINITION_QUERY.store_query-version_prefix_rejected
      - I_DEFINITION_QUERY.store_query-version_prerelease_rejected
      - I_DEFINITION_QUERY.store_query-version_malformed_rejected
  - id: query-stored-list-order-and-empty-result
    description: "The stored-query listing matches the qualified name as a prefix and returns every version of every match, ordered by name then SEMVER ascending; a prefix matching nothing is a fulfilled request answering an empty list, not a not-found."
    source: "ITS-REST specifications/operations/definition_query_list.yaml (\"Retrieves list of all stored queries on the system matched by `qualified_query_name` as pattern\"; \"will list all versions of all queries with names starting with `org.openehr`\"; a single declared 200) + schemas/definition/QueryList.yaml (the example's two versions of one name, ascending) + docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 404 (a missing TARGET RESOURCE — which the list resource is not); the order and the empty-result branch are spec-silent and adjudicated in register AMB-124"
    covered_by:
      - I_DEFINITION_QUERY.list_queries-prefix_all_versions
      - I_DEFINITION_QUERY.list_queries-no_match_empty_list
      - I_DEFINITION_QUERY.list_queries-empty
  - id: query-stored-definition-read-fidelity
    description: "A stored query's definition text is served back VERBATIM — the bytes the client stored, not a re-printed or normalized equivalent."
    source: "ITS-REST specifications/operations/definition_query_version_get.yaml (\"Retrieves the definition of a particular stored query (at specified version) and its associated metadata\") + schemas/query/StoredQuery.yaml (`q` is the AQL text) — neither states a fidelity rule, so the position is adjudicated in register AMB-126 (verbatim, as for template retrieval in AMB-111)"
    covered_by:
      - I_DEFINITION_QUERY.list_queries-version_get_exact
  - id: query-stored-version-selector-read
    description: "The stored-query DEFINITION read resolves its version selector exactly as the execution read does: an exact SEMVER serves that definition, a {major} prefix the highest inside that major, a {major}.{minor} prefix the highest inside that minor, and a selector matching nothing is not found."
    source: "ITS-REST docs/query/Qualified_query_name.md §version identifier (\"When only a partial `version` pattern is supplied, or when `version` is not supplied at all, the system must use the latest `version` with the supplied prefix - i.e. if only `major` or `major.minor` is used, then the latest query version matching supplied prefix will be used\") + docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 404; the same rule is exercised on the EXECUTION surface by query-stored-version-selector-matching"
    covered_by:
      - I_DEFINITION_QUERY.list_queries-version_get_exact
      - I_DEFINITION_QUERY.list_queries-version_get_major_prefix
      - I_DEFINITION_QUERY.list_queries-version_get_minor_prefix
      - I_DEFINITION_QUERY.list_queries-version_get_unknown
  - id: query-stored-negotiation-branches
    description: "The stored-query routes carry the general negotiation MUSTs: a request declaring a payload media type the store cannot process is 415, and an Accept the JSON-only reads cannot satisfy is 406."
    source: "ITS-REST docs/overview/Resources.md §\"JSON Format\" (\"If the service cannot process the request payload as JSON format, it MUST respond with HTTP status code `415 Unsupported Media Type`\") + §\"XML Format\" (\"The client SHOULD use the `Accept: application/xml` request header … If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code `406 Not Acceptable`\") — no stored-query operation declares either branch itself, so both are assembled from the general MUSTs (register AMB-127 records the surface's realization picture)"
    covered_by:
      - I_DEFINITION_QUERY.store_query-wrong_media
      - I_DEFINITION_QUERY.list_queries-xml_not_acceptable
      - I_DEFINITION_QUERY.list_queries-version_get_xml_not_acceptable
  - id: query-stored-conditional-headers
    description: "No ETag, Last-Modified or If-Match is emitted or honoured on the stored-query routes, although a stored query is version-addressed and carries a `saved` timestamp."
    source: "ITS-REST docs/overview/Requests_and_responses.md §\"ETag and Last-Modified\" (\"Both `ETag` and `Last-Modified` SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique state identifiers\") + §\"If-Match and accidental overwrites\" (\"This is only required by a small set of versioned resources in this specification, when the `preceding_version_uid` is not part of the endpoint path segment\") vs the four stored-query operations, none of which declares a conditional-request parameter and none of whose responses declares either header — adjudicated in register AMB-125"
    exception:
      reason: coverage_gap
      register: AMB-125
      note: "Deliberately unasserted in BOTH directions. Asserting the headers would demand of a server what no released stored-query response declares; asserting their ABSENCE would read a SHOULD as a MUST NOT — the same restraint AMB-112 applies to Last-Modified on templates. Closes when a released sentence says whether stored queries fall under the conditional-header SHOULD and whether the overwriting version-less store takes If-Match (UPR-89)."
  - id: query-stored-list-wildcard-unreachable
    description: "The listing's empty-pattern wildcard clause names a request the released API cannot express, so no case exercises it."
    source: "ITS-REST specifications/operations/definition_query_list.yaml (\"If pattern should given be in the format of `[{namespace}::]{query-name}`, and when is empty, it will be treated as \\\"wildcard\\\" in the search\") vs parameters/path/qualified_query_name.yaml (`required: true`) and definition.openapi.yaml, which declares only `/definition/query/{qualified_query_name}` and `…/{version}` — there is no bare `/definition/query` path for an empty name to address; adjudicated in register AMB-124(d)"
    exception:
      reason: off_wire
      register: AMB-124
      note: "Unreachable as released, so nothing in the catalogue may depend on it. Our own bare GET /definition/query serves the whole registry as the empty prefix of the same rule — an extension no openEHR spec governs — and is deliberately exercised by no case, so no verdict rests on the unreachable clause. Closes if a release declares the wildcard route."
  # ADMIN surface (group-14 audit, 2026-07-27). The released Admin API is TWO
  # operations, both DELETE, both EHR-scoped. The single-EHR one has an SM
  # anchor (I_ADMIN_SERVICE.physical_ehr_delete) and axis 1 sees it; the BULK
  # one — DELETE /admin/ehr/all{?ehr_id*} — realizes NO SM operation at all
  # (register AMB-33), so its behaviours are ITS-ONLY and axis 1 cannot
  # enumerate them, exactly like the ITEM_TAG routes above. They are registered
  # here so the whole bulk surface is an honest boundary rather than silence.
  # Two behaviours are shared with the single-EHR route (the cascade and the
  # async acceptance branch) and their elements say so rather than being
  # duplicated per route.
  - id: admin-bulk-delete-unfiltered-full-set
    description: "The bulk delete called with NO ehr_id parameter targets every EHR on the server — an absent selector is the full set, neither an error nor a no-op — and succeeds with no content."
    source: "ITS-REST specifications/operations/admin_ehr_delete_all.yaml (\"Deletes all or multiple EHRs, or a specified subset of EHRs identified using the `ehr_id` query parameter\"; \"If the deletion is processed synchronously and completes successfully, the server returns status `204 No Content`\") + parameters/query/ehr_id_Admin.yaml (\"An optional parameter to perform the operation on a subset of EHRs\" — optional, so its absence cannot mean an empty selection) + responses/204_deleted_hard.yaml (\"the resource(s) identified by the request parameters has been physically deleted (i.e. hard-delete)\"); the emptiness is observed by reading each id back, since the released API has no EHR listing"
    covered_by: [I_ADMIN_SERVICE.physical_ehr_delete-delete_all_unfiltered]
  - id: admin-bulk-delete-subset-selection
    description: "A bulk delete carrying an ehr_id selector destroys exactly the EHRs it names and leaves every unnamed EHR retrievable."
    source: "ITS-REST specifications/operations/admin_ehr_delete_all.yaml (the quoted \"or a specified subset of EHRs identified using the `ehr_id` query parameter\") + parameters/query/ehr_id_Admin.yaml (\"An optional parameter to perform the operation on a subset of EHRs\"); what a subset naming an UNKNOWN id does is assigned by no released sentence and is adjudicated in register AMB-140 (delete-what-exists → 204)"
    covered_by: [I_ADMIN_SERVICE.physical_ehr_delete-delete_all_subset]
  - id: admin-bulk-delete-subset-form
    description: "The subset selector is accepted in the released RFC 6570 exploded form — a repeated `?ehr_id=a&ehr_id=b` — as well as in a single comma-joined value, and every named id is deleted rather than only the first."
    source: "ITS-REST specifications/admin.openapi.yaml (the path template `/admin/ehr/all{?ehr_id*}` — the only RFC 6570 query expansion in the whole released API) + parameters/query/ehr_id_Admin.yaml (`style: form`, `explode: true`, with a `multiple` example listing two identifiers) vs specifications/operations/admin_ehr_delete_all.yaml, whose prose fixes only that a subset is \"identified using the `ehr_id` query parameter\" and no serialization form at all"
    exception:
      reason: coverage_gap
      note: "Server behaviour fixed + HTTP-tested (app/ehrbase-rest/tests/admin_http.rs `enabled_delete_all_repeated_param_reaches_backend_with_both_ids` for the repeated form and `enabled_delete_all_is_204_bodyless` for the comma form — both assert BOTH ids are gone, not merely a 204). Not authorable as a runner case: the binding request model's `request.query` is a name→single-value map (tools/cnf-runner/src/exec/driver.rs `build_url`), so a repeated parameter cannot be expressed at all, and a comma-joined value would assert a serialization the released prose never fixes. What IS authorable and IS gated is the LAW the prose does fix — a selector deletes exactly what it names — exercised with a one-member subset by I_ADMIN_SERVICE.physical_ehr_delete-delete_all_subset. Closes when the binding query model gains a repeated-parameter form (extension only by schedule release) — the same closed-model precedent as method-405-allow-header."
  - id: admin-bulk-delete-malformed-id-rejection
    description: "A bulk delete whose ehr_id selector carries a value that is not a well-formed identifier is refused as a client error, and the refusal happens BEFORE any deletion runs, so a typo in one id cannot silently destroy the well-formed ones in the same call."
    source: "ITS-REST docs/overview/Requests_and_responses.md §\"HTTP status codes\", row 400 (\"The service cannot or will not process the request due to something that is perceived to be a client error (e.g., malformed request syntax, syntactically invalid content)\") and the clause below the table (\"Status code `400` indicates normally a bad request, as well as a generic client-side error, used when no other `4xx` error code is appropriate\") + parameters/query/ehr_id_Admin.yaml (the selector is an EHR identifier) + SM UML/classes/i_admin_service.adoc §physical_ehr_delete (`an_ehr_id: UUID [1]`); the ORDERING — validate the whole list, then act — has no released sentence at all and is adjudicated in register AMB-140"
    exception:
      reason: coverage_gap
      register: AMB-140
      note: "Not authorable as a case today: the closed outcome taxonomy (vocab/outcomes.yaml) has no malformed-request kind — `precondition_missing` means \"Required version precondition absent\" (an If-Match condition), not a syntactically invalid identifier — the same closed-vocabulary blocker recorded on ehr-id-path-segment-malformed-rejection and query-ehr-id-parameter-header-conflict. Server behaviour fixed and documented at its seam (app/ehrbase/src/service/admin/delete.rs, `admin_ehr_delete_all` → `parse_uuid_list`: the entire request is rejected on the first malformed id, before any deletion runs). Closes when the outcome taxonomy gains a malformed-request kind (extension only by schedule release)."
  - id: admin-bulk-delete-disabled-405
    description: "When a deployment disables the admin surface, the bulk-delete resource answers 405 Method Not Allowed — from a matched handler, carrying the mandatory Allow header with the empty field value — and deletes nothing."
    source: "ITS-REST specifications/operations/admin_ehr_delete_all.yaml (\"> NOTE: This functionality is intended primarily for **development** or **testing** purposes and may be disabled in **production** environments, in which case server may respond with `405 Method Not Allowed`.\") + responses/405.yaml (\"`405 Method Not Allowed` is returned when the service knows the request method, but the target resource doesn't support this method (e.g. due to security concerns)\") + docs/overview/Requests_and_responses.md §\"HTTP status codes\" (405 is a predefined row) and §\"HTTP Methods\" (\"If a method is recognized but not allowed for the target resource, the response SHOULD be `405 Method Not Allowed` status code\") over RFC 9110 §15.5.6 (the Allow header MUST) and §10.2.1 (\"An empty Allow field value indicates that the resource allows no methods, which might occur in a 405 response if the resource has been temporarily disabled by configuration\")"
    exception:
      reason: coverage_gap
      note: "Server behaviour fixed + HTTP-tested (app/ehrbase-rest/tests/admin_http.rs `disabled_admin_is_405_and_never_deletes`, which asserts the 405, the empty Allow, the openEHR error body AND that the EHR survives; `disabled_admin_config_is_405` for the group gate). Not authorable as a case for two model reasons that are already the standing precedent on method-405-allow-header: the closed outcome taxonomy has no method_not_allowed kind, and a case cannot ask the SUT to be reconfigured mid-run — the branch exists only under a deployment setting the ixit does not model. NOTE the released asymmetry: this sentence appears on the BULK operation only; admin_ehr_delete carries no such NOTE and declares no 405, although the same configuration gate necessarily covers both routes, so the single-EHR route's 405 rests on the overview §HTTP Methods SHOULD rather than on its own operation. Closes when the outcome taxonomy gains the kind and the ixit models a disabled-admin instance (extension only by schedule release)."
  - id: admin-physical-delete-owned-resource-cascade
    description: "A physical delete — on the single-EHR route and the bulk route alike — destroys everything the targeted EHR owned, not merely the EHR row: its COMPOSITIONs, EHR_STATUS, ITEM_TAGs, CONTRIBUTIONs and all their historical versions become unreachable."
    source: "ITS-REST specifications/operations/admin_ehr_delete.yaml and admin_ehr_delete_all.yaml, both verbatim: \"All resources associated with or owned by the specified EHR (such as COMPOSITION, EHR_STATUS, ITEM_TAG, CONTRIBUTION, and their historical versions) will also be **permanently** and physically deleted, in compliance with applicable data protection regulations (e.g., the GDPR in the European Union).\" + responses/204_deleted_hard.yaml (\"physically deleted (i.e. hard-delete)\") + RM UML/classes/org.openehr.rm.ehr.ehr.adoc §Attributes (the owned aggregate: compositions, ehr_status, directory, contributions, tags, ehr_access) — the list in the ITS sentence is exemplary (\"such as\"), and no released sentence states a postcondition at all; register AMB-143 adjudicates the closure as total, AMB-10 why the delete is physical in the first place"
    covered_by:
      - I_ADMIN_SERVICE.physical_ehr_delete-delete_existing_cascade
      - I_ADMIN_SERVICE.physical_ehr_delete-delete_all_cascade
  - id: admin-physical-delete-post-delete-identity
    description: "After a physical delete the ehr_id reads as ABSENT (not as a tombstone or a gone-marker) and is free again: creating an EHR under the same client-supplied identifier succeeds rather than conflicting."
    source: "ITS-REST specifications/responses/404_unknown_ehr_id.yaml (\"`404 Not Found` is returned when an EHR with `ehr_id` does not exist\") + responses/409_EHR.yaml (the create-with-id operation's ONLY conflict branch: \"Unable to create a new EHR due to a conflict with an already existing EHR with the same subject id, namespace pair, whenever EHR_STATUS is supplied\" — no clause about a previously deleted identifier) + SM UML/classes/i_ehr_service.adoc §create_ehr_with_id (`Pre_no_duplicate`: `not has_ehr (an_ehr_id)`, which a physical delete makes true again) and §physical_ehr_delete (a precondition and NO postcondition); the post-delete contract itself is unstated and adjudicated in register AMB-143"
    covered_by: [I_ADMIN_SERVICE.physical_ehr_delete-delete_existing_recreate]
  - id: admin-delete-async-acceptance-branch
    description: "Both admin deletes MAY be executed asynchronously, in which case the answer is 202 Accepted instead of 204 No Content — a success whose meaning is that the deletion has been accepted, not that it has happened."
    source: "ITS-REST specifications/operations/admin_ehr_delete.yaml and admin_ehr_delete_all.yaml, both verbatim: \"The server may execute this operation asynchronously (e.g. in batches), in which case returns status `202 Accepted`. If the deletion is processed synchronously and completes successfully, the server returns status `204 No Content`.\" + responses/202.yaml (\"`202 Accepted` is returned when the requested operation has been accepted for processing, but processing has not been completed or may not have started\") vs docs/overview/Requests_and_responses.md §\"HTTP status codes\", whose sixteen-row subset contains no 202 row and whose closing clause legalizes it (\"Additional status codes MAY be used as long as they do not conflict with the predefined codes\") — the omission is register AMB-139"
    exception:
      reason: coverage_gap
      register: AMB-139
      note: "Not authorable as a case: the closed outcome taxonomy (vocab/outcomes.yaml) has no `accepted` kind, so the branch is absorbed as `alt_status: [202]` under `ok_empty` on both admin bindings — the honest logical reading (a bodyless success) but one under which a case passes on either code and NO case can require or distinguish the asynchronous branch. Said openly rather than counted as coverage. This SUT is synchronous and always answers 204, so nothing here is hidden behind a permissive expectation in practice; the permissiveness is nevertheless real and is recorded. Closes when the outcome taxonomy gains an `accepted` kind (extension only by schedule release)."
  # SMART on openEHR (ITS-REST docs/smart_app_launch/, `:spec_status:
  # DEVELOPMENT`). Prose-only: no OAS group, no schemas, no CNF anchor, and
  # exactly one RFC 2119 uppercase keyword in the whole specification — so
  # axis 1 (SM interfaces) and axis 2 (realized bindings) cannot enumerate any
  # of it. With an external Authorization Server, the CDR's enforceable share
  # is exactly the three elements below; the launch flows (master07), token
  # issuance and the deprecated-grant prohibition (master06), registration
  # (master03) and the application typology (master05) are Authorization-Server
  # behaviour, not CDR behaviour. All three are adjudicated by register
  # AMB-151, which also records why no case can execute them (SMART is off in
  # the composed SUT, and a scope case needs a per-case Bearer token the runner
  # cannot mint).
  - id: smart-discovery-document-shape
    description: "When SMART is enabled, /.well-known/smart-configuration is served relative to the Platform base URL as application/json, and its `services` map carries at minimum an `org.openehr.rest` entry whose `baseUrl` is an ABSOLUTE URL to the root of the openEHR REST API; the advertised `capabilities` claim only features the server actually supports. When SMART is disabled the document is absent and the wire is byte-identical to a non-SMART deployment."
    source: "ITS-REST docs/smart_app_launch/master04-service_discovery.adoc §Service Discovery (\"The configuration endpoint should be always available relative to the _Platform_ base URL\"; \"Responses to `/.well-known/smart-configuration` endpoint must be served with the `application/json` MIME type\") + §Services (\"the response from configuration endpoint must include the `services` section\"; \"At a minimum, the `services` section must include the openEHR REST API using the key `org.openehr.rest`\"; \"`baseUrl`: Absolute URL to the root of the API `*(required)*`\") + §Capabilities (\"The `capabilities` section advertises supported SMART features as an array value\"; `openehr-permission-v1`: \"Indicates support for fine-grained scopes and authorization scheme over openEHR resources\"). The document's status codes, caching and auth posture are unstated — register AMB-149; the §Authentication Endpoints list names the wrong well-known document — register AMB-146"
    exception:
      reason: statement_declared
      register: AMB-151
      note: "SMART is config-gated and OFF by default, so the composed conformance SUT (default configuration) serves no such document and a case would drive an absent surface. Proven instead by app/ehrbase-rest/tests/smart_http.rs — `discovery_serves_absolute_base_urls` (the origin-prefixed org.openehr.rest baseUrl, the group-15 wire fix), `discovery_absent_when_disabled` (the zero-drift disabled state) and `permission_capability_only_in_fail_closed_mode` (capability honesty: openehr-permission-v1 is advertised only when the gate actually enforces). Becomes authorable only if the conformance stack gains a SMART-enabled SUT profile."
  - id: smart-resource-scope-grammar
    description: "A token's `scope` claim is parsed by the master08 resource-scope grammar — <compartment>/<resource>.<permission> over the three compartments (patient/user/system), the three closed resource nouns (template-, composition-, aql-), the id pattern table and the CRUDS permission letters — and a granted scope narrows access to exactly what it names. Every string the grammar does not recognise is retained but INERT: it neither grants nor denies."
    source: "ITS-REST docs/smart_app_launch/master08-scopes.adoc §Resource Scopes (the syntax line `<compartment>/<resource>.<permission>`; the three compartments and their meanings; \"The following openEHR REST APIs `<resource>` types are supported for use in scopes\" with its closed three-noun list; the five-row `<templateId>`/`<queryName>` pattern table; the permission letters `c`/`r`/`u`/`d`/`s`; the eight-row maximal table) + §Scopes (\"The _Platform_ must validate requested scopes …\"). The discovery example advertises two forms this grammar cannot parse — register AMB-145; `**` is named twice and never defined — AMB-147; the placeholder and validation sentences are defective — AMB-148; no scope-to-operation mapping, no tail well-formedness rule, no composition rule and no compartment-matching rule exist anywhere — AMB-150"
    exception:
      reason: statement_declared
      register: AMB-151
      note: "Not executable as a case: every grammar row needs a Bearer token carrying a chosen `scope` claim, which needs an Authorization Server the conformance stack does not run and per-case token minting the runner does not have (an ixit Bearer principal is one static token). Proven instead by the grammar's own unit suite in crates/openehr-its/src/rest/smart_scopes.rs — the ONE parser both the CDR gate and scope-previewing REST clients use, covering all five pattern-table rows, all eight maximal-table rows, the compartments, the CRUDS letters, the AMB-147 `**` reading, and the inert demotion of the AMB-145 example forms."
  - id: smart-scope-deny-403
    description: "A request the granted SMART scopes do not permit is refused with 403 Forbidden — the authenticated-but-unauthorized status — and the refusal composes as an AND onto RBAC/ABAC: SMART can only narrow a decision, never widen one. In fail-closed mode a token holding no scope of the operation's resource family is refused the same way."
    source: "ITS-REST docs/overview/Requests_and_responses.md §\"Authentication and authorization\" (\"If authentication and authorization are required, services MUST properly use the `WWW-Authenticate` and/or `Proxy-Authenticate` response headers, returning `403 Forbidden`, `401 Unauthorized` or `407 Proxy Authentication` as applicable\") + §\"HTTP status codes\" (403 — \"The service understood the request but refuses to authorize it\") applied to ITS-REST docs/smart_app_launch/master08-scopes.adoc §Scopes (\"The _Platform_ must validate requested scopes against the _Application_ registration metadata, applicable access control policies, the authenticated user's permissions\"), which states the obligation and assigns no status — register AMB-150(4)"
    exception:
      reason: statement_declared
      register: AMB-151
      note: "Same two blockers as smart-resource-scope-grammar (SMART off in the composed SUT; no per-case scoped Bearer token). Proven instead by app/ehrbase-rest/tests/smart_http.rs — `fail_closed_denies_scopeless_template_access` and `fail_closed_denies_scopeless_query_access` (the two families that were parsed-but-never-enforced before the group-15 wire fix), `advisory_mode_defers_for_scopeless_callers` and `smart_disabled_leaves_families_ungated` (the negative directions) — plus the PEP unit tests in app/ehrbase-rest/src/extensions/access/pep.rs. The generic 401/403 discipline itself is separately gated by the SEC-BASIC cases, which do not depend on SMART."

# ── Axis 4 — the OUTWARD axis: the non-openEHR surface this SUT serves ──────
#
# The first three axes are spec-inward (what the released text defines, and
# whether a case reaches it). This one runs the other way: it DECLARES the
# route families the SUT serves BEYOND the openEHR resource set, so a reader
# of the Conformance Statement learns the extension surface exists instead of
# discovering it on the wire. Register AMB-157 is the adjudication.
#
# IT NEVER GATES. No coverage obligation is derived from this axis — no case
# is required, no branch is expected, no verdict depends on it — and every
# entry says so in its own `never_gates: true`.
#
# THE STANDING SILENCE every entry rests on, verified first-hand: no released
# clause governs the URI space beyond the ITS-REST resource set.
# docs/overview/Resources.md §Resources defines what a resource IS ("a
# **resource** is an instance object of a specific openEHR class (type) that
# can be identified, addressed, handled or managed by the service") and lists
# the openEHR resource kinds; it never constrains what else a service may
# serve. The overview's only "Additional … MAY" sentence is about status codes
# (Requests_and_responses.md §HTTP status codes: "Additional status codes MAY
# be used as long as they do not conflict with the predefined codes"). A grep
# of ITS-REST specifications/docs/** for an additional/vendor/proprietary/
# extension endpoint clause returns zero hits. So every family below is
# spec-silent by construction — our own design/extension — and each entry
# records the silence, never a permission the text does not grant.
#
# ROUTES are written as the server mounts them under the DEFAULT deployment
# (absolute from the server root, `server.base_path` = /ehrbase/rest/openehr/v1
# included) — the same convention the served OpenAPI document uses. A
# non-default `server.base_path` moves the base-path-relative ones; the served
# document follows it.
served_extensions:
  # ── (1) the ten families the group-17 audit found undeclared ──────────────
  - family: health
    routes:
      - "GET /health"
      - "GET /health/liveness"
      - "GET /health/readiness"
    config_gate: "always on — no toggle; mounted outside the API base path and outside authentication (app/ehrbase-rest/src/extensions/health.rs)"
    spec_silence: "ITS-REST defines no health/liveness/readiness resource anywhere (grep of specifications/docs/**: zero hits) and no released clause governs the URI space beyond the resource set — Resources.md §Resources defines resources, never a route-space constraint. Our own design/extension: a container-orchestration probe surface."
    never_gates: true
  - family: server-status
    routes:
      - "GET /ehrbase/rest/status"
    config_gate: "always on — no toggle; mounted at the REST root (the base path minus /openehr/v1), outside authentication (app/ehrbase-rest/src/overview/status.rs)"
    spec_silence: "No released clause defines an operational status resource; the one released self-description operation is the System API's OPTIONS on the API root (docs/system/Description.md), which this endpoint neither replaces nor duplicates. No released clause governs the URI space beyond the resource set. Our own design/extension."
    never_gates: true
  - family: openapi-meta
    routes:
      - "GET /ehrbase/rest/api-docs/openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-ehr.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-query.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-definition.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-demographic.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-admin.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-management.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-terminology.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-relationships.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-events.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-tenancy.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-fhir.openapi.json"
      - "GET /ehrbase/rest/api-docs/ehrbase-smart.openapi.json"
      - "GET /ehrbase/rest/swagger-ui"
      - "GET /ehrbase/rest/swagger-ui/{*file}"
    config_gate: "server.swagger_ui (default on) for the whole family; the document paths follow server.openapi_json_path()/swagger_ui_path(), which derive from server.base_path"
    spec_silence: "No released clause defines an OAS-serving or API-console endpoint; the release publishes its own OpenAPI artifacts as downloads, not as a service obligation (docs/system/Description.md §Status links the bundles for validation/code generation). No released clause governs the URI space beyond the resource set. Our own design/extension: the twelve per-family documents plus the composed document are all generated from this server's own handlers — a vendored openEHR OAS is never served. The trailing `{*file}` is the embedded Swagger asset route (UI packaging, no API contract)."
    never_gates: true
  - family: management
    routes:
      - "GET /management/info"
      - "GET /management/prometheus"
      - "GET /management/metrics"
      - "GET /management/metrics/{name}"
      - "GET /management/env"
      - "GET /management/loggers"
      - "POST /management/loggers"
      - "DELETE /management/loggers"
    config_gate: "observability management.enabled (default off); with management.port set the family moves to its own listener instead of the API listener — when off, the routes are absent (a router 404), not gated in-handler"
    spec_silence: "ITS-REST defines no operational/introspection surface at all (no metrics, no logger, no environment resource — grep of specifications/docs/**: zero hits) and no released clause governs the URI space beyond the resource set. Our own design/extension."
    never_gates: true
  - family: terminology
    routes:
      - "GET /ehrbase/rest/openehr/v1/terminology"
      - "GET /ehrbase/rest/openehr/v1/terminology/{terminology_id}"
      - "GET /ehrbase/rest/openehr/v1/terminology/{terminology_id}/term/{code}"
      - "GET /ehrbase/rest/openehr/v1/terminology/{terminology_id}/subsumes"
      - "GET /ehrbase/rest/openehr/v1/terminology/{terminology_id}/value_set/{value_set_id}"
      - "GET /ehrbase/rest/openehr/v1/terminology/{terminology_id}/value_set/{value_set_id}/validate"
    config_gate: "[terminology].api_enabled (default off); the gate sits in-handler behind authentication, so a disabled group answers 401 to an unauthenticated caller and 404 to an authenticated one"
    spec_silence: "SM i_terminology_service.adoc declares the nine terminology operations and released ITS-REST 1.1.0 surfaces NO terminology resource for any of them (the Axis-1 I_TERMINOLOGY_SERVICE off_wire rows above record that boundary). The absence of a wire is not a prohibition on one: no released clause governs the URI space beyond the resource set. These routes are our own design/extension over the TERM component, and no conformance claim rests on them."
    never_gates: true
  - family: event-subscription
    routes:
      - "GET /ehrbase/rest/openehr/v1/admin/event_subscription"
      - "POST /ehrbase/rest/openehr/v1/admin/event_subscription"
      - "GET /ehrbase/rest/openehr/v1/admin/event_subscription/{subscription_id}"
      - "PUT /ehrbase/rest/openehr/v1/admin/event_subscription/{subscription_id}"
      - "DELETE /ehrbase/rest/openehr/v1/admin/event_subscription/{subscription_id}"
    config_gate: "[events].admin_api (default off); the gate sits in-handler behind authentication (401 unauthenticated, 404 authenticated when off)"
    spec_silence: "ITS-REST defines no subscription/notification resource and the released Admin API is exactly two operations (specifications/operations/admin_ehr_delete.yaml + admin_ehr_delete_all.yaml). No released clause governs the URI space beyond the resource set. Our own design/extension: change-event subscriptions administered under the /admin prefix."
    never_gates: true
  - family: tenancy
    routes:
      - "GET /ehrbase/rest/openehr/v1/admin/tenant"
      - "POST /ehrbase/rest/openehr/v1/admin/tenant"
      - "GET /ehrbase/rest/openehr/v1/admin/tenant/{tenant_id}"
      - "PUT /ehrbase/rest/openehr/v1/admin/tenant/{tenant_id}"
      - "DELETE /ehrbase/rest/openehr/v1/admin/tenant/{tenant_id}"
    config_gate: "[tenancy].enabled (default off); the routes stay mounted and answer 404 in-handler when off (401 first for an unauthenticated caller)"
    spec_silence: "openEHR has no multi-tenancy concept in any released component — ITS-REST names no tenant resource, header or parameter (grep of specifications/**: zero hits) — and no released clause governs the URI space beyond the resource set. Our own design/extension."
    never_gates: true
  - family: fhir-r4-connector
    routes:
      - "POST /ehrbase/rest/openehr/v1/fhir/r4/{resource_type}"
      - "GET /ehrbase/rest/openehr/v1/fhir/r4/{resource_type}"
    config_gate: "[fhir].api_enabled (default off); the gate sits in-handler behind authentication and refuses with a FHIR OperationOutcome"
    spec_silence: "FHIR interoperability is outside every released openEHR component: ITS-REST defines no FHIR resource, media type or route, and no released clause governs the URI space beyond the resource set. Our own design/extension — the inbound HL7 FHIR R4 façade, whose contract is HL7's, not openEHR's."
    never_gates: true
  - family: fhir-mapping-store
    routes:
      - "GET /ehrbase/rest/openehr/v1/admin/fhir_mapping"
      - "POST /ehrbase/rest/openehr/v1/admin/fhir_mapping"
