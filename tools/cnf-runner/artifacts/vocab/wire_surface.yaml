  - id: item-tag-wrapper-headers-distinct-collections
    description: "openehr-item-tag replaces the container collection and openehr-version-item-tag the committed VERSION's collection on a change-controlled write; an absent header leaves its collection untouched. Holds on every change-controlled write that declares the headers — the EHR-side creates/updates and the demographic party creates/updates alike. The RESPONSE echo is NOT part of the assertable law: the docs text makes it a MAY (\"Servers MAY include…\") against the create operations' \"The corresponding response header(s) will return ITEM_TAGs as they were set by the server\", a released conflict the docs text wins (register AMB-166) — so the wrapper-header bindings declare each echo header `present?` and assert nothing about it, while what the echo would CONFIRM (each target's own stored list) is asserted by reading both collections back through their tag routes."
    source: "ITS-REST Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag (\"openehr-item-tag applies to VERSIONED_OBJECT targets\"; \"openehr-version-item-tag applies to a specific target VERSION within a VERSIONED_OBJECT\") §Usage in Requests + §Usage in Responses (\"Servers MAY include the openehr-item-tag or openehr-version-item-tag header in responses to confirm the actual list of ITEM_TAGs stored on the server side\"); operations/{person,agent,group,organisation,role}_{create,update}.yaml, whose own prose says \"a openehr-item-tag or openehr-version-item-tag request header can be set\" (the five updates' parameter lists omit openehr-item-tag against that prose — the released prose wins; recorded in register AMB-97)"
