# REPORTING QUALIFIER, release-pinned (group-12 audit, 2026-07-27) — carried on
# the capability row because the report/statement renderers take their scope
# text from this matrix and no other artifact carries per-API scope wording.
# It qualifies REPORTING only: it is never a verdict modifier, and it is not an
# ambiguity (requirement force is unaffected — the BCP-14 clause of ITS-REST
# `docs/overview/Preface.md` §Requirements is not state-qualified, so every
# MUST/SHOULD on this API binds exactly as elsewhere).
DemographicApi: { family: Platform, tier: OPTIONS, required: false, source: "CNF profiles master03-profiles.adoc §Functional (REST APIs: DEMOGRAPHIC API). SCOPE: the openEHR DEMOGRAPHIC API is DEVELOPMENT-state in the pinned release — ITS-REST docs/demographic/Description.md §Status verbatim: \"This specification is in the `DEVELOPMENT` state\" — and ITS-REST docs/overview/Preface.md §Conformance is literally \"tbd.\", so openEHR publishes no conformance criteria for this API. Claims here are pinned to ITS-REST Release-1.1.0 and derived from the released operation/RM/SM text, not from a conformance clause" }
QueryApi: { family: Platform, tier: STANDARD, required: true, source: "CNF profiles master03-profiles.adoc §Functional (REST APIs: QUERY API)" }
AdminApi: { family: Platform, tier: OPTIONS, required: false, source: "CNF profiles master03-profiles.adoc §Functional (REST APIs: ADMIN API). SCOPE: the openEHR ADMIN API is DEVELOPMENT-state in the pinned release — ITS-REST docs/admin/Description.md §Status verbatim: \"This specification is in the `DEVELOPMENT` state\" — and ITS-REST docs/overview/Preface.md §Conformance is literally \"tbd.\", so openEHR publishes no conformance criteria for this API. Claims here are pinned to ITS-REST Release-1.1.0 and cover exactly the two released operations (admin_ehr_delete, admin_ehr_delete_all), derived from the released operation/RM/SM text, not from a conformance clause; the further /admin routes this server mounts are our own extensions and no claim rests on them" }
MessageApi: { family: Platform, tier: OPTIONS, required: false, source: "CNF profiles master03-profiles.adoc §Functional (REST APIs: MESSAGE API)" }
# TIER BY ANALOGY, release-pinned — the CNF Profiles book has NO SYSTEM row (its
# REST-APIs table lists six: DEFINITION, EHR, DEMOGRAPHIC, QUERY, ADMIN,
# MESSAGE), so the tier below is ours, not a book row — the same footing as
# SmartAppLaunch. OPTIONS and required:false because no released MUST binds a
# service to serve the API: the one released sentence about the method is the
# descriptive §HTTP Methods table row, carrying no RFC 2119 keyword. The API's
# STABLE state does not change that (a stable specification of a descriptive
# row is still descriptive), so the capability may never gate CORE or STANDARD.
SystemApi: { family: Platform, tier: OPTIONS, required: false, source: "ITS-REST docs/system/Description.md §Status (\"This specification is in the `STABLE` state\") + docs/overview/Requests_and_responses.md §HTTP Methods (\"OPTIONS | Describe the communication options for the target resource\"). SCOPE: the CNF Profiles book has no SYSTEM row, so the tier is ours by analogy with the other non-book API capabilities, and the claim covers exactly what the released docs text assigns — a 200 answer carrying Allow on the API base path. The manifest BODY and the resource path are described by no released sentence (register AMB-160), so no claim rests on them" }
# TIER BY THE RELEASE'S OWN WORDS — the ITEM_TAG surface is OPTIONAL, stated
# outright: ITS-REST docs/overview/Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag, "If the server does not support ITEM_TAGs,
# these headers will also be unsupported." A capability a conformant service
# may simply not have can never gate CORE or STANDARD, so OPTIONS +
# required:false — the same footing SystemApi and SmartAppLaunch sit on (the
# CNF Profiles book has no ITEM_TAG row either; its REST-APIs table lists six
# API groups and its Functional table no tag capability). The tag routes live
# INSIDE the EHR and DEMOGRAPHIC API groups, so this capability is deliberately
# NOT EhrApi/DemographicApi: a service that answers every EHR-API operation and
# no tag route is conformant, and folding tags into EhrApi (CORE, required)
# would claim otherwise.
ItemTags: { family: Platform, tier: OPTIONS, required: false, source: "ITS-REST docs/overview/Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag (\"Both headers act as convenient wrappers around the dedicated ITEM_TAG operations\"; \"If the server does not support ITEM_TAGs, these headers will also be unsupported\") + the twenty-three released tag operations (specifications/operations/{ehr,demographic}_tags_get.yaml, {composition,ehr_status}_tags_{get,update,delete}.yaml, {person,agent,group,organisation,role}_tags_{get,update,delete}.yaml) + RM common master07-tags.adoc (the ITEM_TAG class the routes serve). SCOPE: the CNF Profiles book has no ITEM_TAG row, so the tier is ours by analogy with the other non-book capabilities; the operations have no SM interface at all (register AMB-161) and the catalogue anchors them under the reserved I_ITS_REST_ITEM_TAGS pseudo-interface. The editorial defects of the released tag surface are registered (AMB-91..97, AMB-137, AMB-138) and no claim rests on anything they leave unassigned" }
Signing: { family: Platform, tier: STANDARD, required: false, source: "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing); RM common (ORIGINAL_VERSION.signature)" }
SimplifiedFormats: { family: Platform, tier: OPTIONS, required: false, source: "ITS-REST simplified_formats (SHOULD-level: OPTIONS profile, never gates CORE/STANDARD)" }
# REPORTING QUALIFIER, release-pinned (group-15 audit) — the same
# DEVELOPMENT-state scope wording DemographicApi/AdminApi carry, plus the two
# facts unique to SMART: the CNF Profiles book has NO SMART row (its REST-APIs
# table lists six: DEFINITION, EHR, DEMOGRAPHIC, QUERY, ADMIN, MESSAGE), so the
# tier below is ours by analogy with the other DEVELOPMENT-state API groups and
# not a book row; and the capability is CONFIG-GATED (`[smart] enabled`,
# off by default — a stock server serves no discovery document and runs an
# inert gate), so a party claims it only for a SMART-enabled deployment. The
# ehrbase-rs statement does NOT claim it: the composed conformance SUT runs the
# default configuration. Coverage boundary + the CDR's enforceable share:
# register AMB-151.
SmartAppLaunch: { family: Platform, tier: OPTIONS, required: false, source: "ITS-REST docs/smart_app_launch (SMART on openEHR). SCOPE: the specification is DEVELOPMENT-state in the pinned release — manifest_vars.adoc verbatim: \":spec_status: DEVELOPMENT\" — it is prose-only (no OpenAPI group, no schemas), it carries exactly ONE RFC 2119 uppercase keyword in all nine chapters (master06 §Deprecated Flows, \"MUST NOT be used\"), the vendored CNF corpus never mentions it, and ITS-REST docs/overview/Preface.md §Conformance is literally \"tbd.\", so openEHR publishes no conformance criteria for it. Claims here are pinned to ITS-REST Release-1.1.0, are config-gated on the SMART resource-server role being enabled, and cover exactly the CDR's enforceable share — the /.well-known/smart-configuration document (master04 §Service Discovery + §Services + §Capabilities), the master08 §Resource Scopes grammar, and the 403-on-scope-deny discipline (overview Requests_and_responses.md §Authentication and authorization). The launch flows (master07), token issuance and grant prohibitions (master06), registration (master03) and the application typology (master05) are Authorization-Server behaviour and no claim rests on them" }
