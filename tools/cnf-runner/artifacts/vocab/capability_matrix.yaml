# The machine-readable capability -> family -> tier matrix: the Profiles
# book's capability x tier tables as data (CNF profiles
# master03-profiles.adoc, vendored), plus the CNF 2.0 Security family
# proposal. OPTIONS is the book's catch-all pseudo-profile (obtained if
# any optional capability passes) => required: false on OPTIONS rows.
#
# THE CLAIM-COMPLETENESS COLUMNS (owner directive 2026-07-28). Declaring a
# capability IS the obligation to run the framework against it, so every row
# also carries the machine-checked depth and honesty state the certificate
# reports. All four are enforced by `cnf-runner validate`, never by review:
#
#   min_cases          the verdict-bearing case-count FLOOR (active cases
#                      naming the capability, minus the report_only ones).
#                      Floors RATCHET UP ONLY: a battery that shrinks below
#                      its floor is a `capability-depth` finding. The values
#                      here were derived from the catalogue at authoring; a
#                      new battery raises the floor in the same change.
#   realization        released-wire (default, omitted) | extension — where
#                      the capability's cases drive. An `extension` row is
#                      verified over routes no openEHR specification governs
#                      (our own design/extension, declared in
#                      vocab/wire_surface.yaml), so it may never be
#                      `required`; the certificate renders the marker.
#   evidence_exception the register entry adjudicating a capability EVERY one
#                      of whose cases resolves excused/deselected (an
#                      unrealized wire) — without it, `claim-completeness`
#                      fails: a claim that can never carry executed evidence
#                      is a certification hole, not a selection outcome.
#   workload_exclusion the register entry adjudicating a claimed capability
#                      the measured hospital simulation does not exercise —
#                      without it, `workload-coverage` fails, so the
#                      certificate can never carry a bare `NO — catalogue
#                      gap` row again.
#
# THE RESTING STATE OF THE WORKLOAD EXCLUSIONS. The hospital simulation now
# exercises every claimed capability except the eleven below, and each of
# those carries a PERMANENT, capability-specific reason of exactly one of two
# kinds — never "not reached yet":
#   * DESTRUCTIVE MID-MEASUREMENT (PhysicalDeletion, AdminApi — the released
#     ADMIN API is that same erase pair): the arrival would shrink the
#     population-anchored corpus the measured window is bound to.
#   * NO REQUEST TO SEND (the nine SM capabilities with neither a released
#     ITS-REST wire nor a served extension route): a black-box load
#     instrument cannot drive an operation that has no HTTP surface. Each of
#     these rows also carries the matching `evidence_exception`; both lapse
#     together the day the product serves the routes.
# An exclusion whose capability the simulation DOES exercise is a stale-row
# finding (`workload-coverage`), so a landed journey cannot leave one behind.
#
# ── THE 2026-07-28 REALIZATION DERIVATIONS (#623) ─────────────────────────────
# Ten rows were `excused (unrealized)` while the ehrbase-rs statement CLAIMED
# them. Each was re-derived FIRST-HAND against the released ITS-REST docs text,
# then the released OAS, then the surface this product actually serves. The
# outcomes, and why an `evidence_exception` survives on some rows:
#
#  (b) SERVED ON THE EXTENSION SURFACE — PartyRelationshipOperations. The
#      product serves all six SM relationship operations, so the battery is
#      EXECUTED there, `realization: extension`, exception deleted. See its row.
#
#  (c) NO TESTABLE SURFACE, CLAIM CORRECTED — the other nine. For each, the
#      release defines no wire AND this product mounts no route: the SM
#      operations are implemented at the SERVICE layer only, and the CNF runner
#      is a black-box HTTP instrument, so there is nothing for it to drive. A
#      claim with no testable surface is the dishonest row, so the ehrbase-rs
#      statement no longer claims them (ISO/IEC 9646 test selection legitimizes
#      "not applicable" precisely for a capability a party does NOT claim). The
#      rows STAY in the matrix — it is the Profiles book as data, not our claim
#      list — and keep their `evidence_exception`, which is now a plain
#      statement of catalogue fact: every case still resolves excused because
#      the released wire is still absent.
#      TODO: each of these nine becomes re-claimable the day the product serves
#      the operations on declared extension routes (the PartyRelationship
#      pattern: routes + served_extensions family + `extension:` bindings + an
#      executed battery). That is a PRODUCT change, not a catalogue one.
#
# Row-level derivations follow each row.
# (c) NO RELEASED WIRE — verified first-hand 2026-07-28: the released
# specifications/definition.openapi.yaml declares eleven paths, all
# /definition/template/** or /definition/query/**, and none for archetypes; the
# ITS-REST docs text never names an archetype resource. AND NO SERVED ROUTE:
# this product mounts nothing under /definition/archetype (the SM operations
# upload_archetype / get_archetype / list_archetypes / has_archetype /
# delete_archetype / archetypes_count are implemented in the service layer
# only). The claim was therefore withdrawn from the ehrbase-rs statement.
# CONSEQUENCE, stated rather than hidden: the CNF Profiles book marks this
# capability CORE+STANDARD, so a party claiming CORE while not claiming it is a
# static-review finding — which is the honest reading of a release that defines
# no wire for a capability its own conformance book requires.
# OWNER ADJUDICATION 2026-07-29 (recorded on AMB-41): the CNF Profiles book
# lists this row CORE/required, but released ITS-REST 1.1.0 surfaces no ADL
# 1.4 archetype wire and an extension realization may never be `required`
# (owner ruling 2026-07-28). The owner chose FULL IMPLEMENTATION over a
# standing excuse: the served /definition/archetype/adl1.4** routes carry an
# executed six-case battery, the row flips to `realization: extension`, and
# `required` DROPS — a conscious, register-derived departure from the book's
# CORE table (the book requires what the release gives no wire for). The
# workload exclusion stays register-linked: provisioning archetypes is
# definition administration, not a per-patient hospital arrival.
Adl14ArchetypeProvisioning: { family: Platform, tier: CORE, required: false, realization: extension, min_cases: 11, workload_exclusion: { register: AMB-170, reason: "definition administration, not a sustainable per-patient arrival: archetype provisioning is a design-time operation a hospital simulation would not repeatedly drive (the same family reason the ADL2/OPT provisioning rows carry journeys for is satisfied by the definition-poll journey; this row's own upload/delete churn would grow the definition store unboundedly through a measured hold)" }, source: "CNF profiles master03-profiles.adoc §Functional (Definitions: ADL 1.4 Archetype provisioning)" }
Adl14OptProvisioning: { family: Platform, tier: CORE, required: true, min_cases: 22, source: "CNF profiles master03-profiles.adoc §Functional (Definitions: ADL 1.4 OPT provisioning)" }
# (c) NO RELEASED WIRE — verified first-hand 2026-07-28: the released
# definition.openapi.yaml surfaces only OPT wire under /definition/template/adl2
# (list / upload / get / example / the deprecated version GET); there is no ADL 2
# archetype-provisioning path and the docs text names none. AND NO SERVED ROUTE:
# this product mounts nothing for artefact-generic ADL 2 provisioning. Claim
# withdrawn from the ehrbase-rs statement.
# REALIZED ON THE EXTENSION SURFACE (#637, 2026-07-29) — the row carried an
# evidence_exception while ITS-REST 1.1.0 surfaced no ADL 2 archetype/artefact
# wire AND this product served none either. It now serves five routes
# (/definition/archetype/adl2[/count], /definition/artefact/adl2[/count],
# DELETE /definition/artefact/adl2/{id}; the `adl2-archetype` served_extensions
# family), the five SM operations carry EXTENSION bindings onto them, and the
# battery is EXECUTED. The exception is therefore GONE.
#
# The row carries NO `realization: extension` marker, and that is a derived
# fact rather than an oversight: `delete_artefact-existing` verifies its own
# postcondition by reading the artefact back through the RELEASED
# get_artefact (GET /definition/template/adl2/{id} -> 404), so the battery is
# genuinely MIXED — four cases drive extension routes only, two touch released
# wire — and `check_realization_markers` reserves the marker for a battery
# whose every case is extension-only. Weakening that read-back to an
# extension-only probe to earn the marker would trade real evidence for a
# label.
#
# The workload_exclusion is gone too: the `integration_poll` journey now polls
# the ADL 2 archetype store (`archetype_adl2_list`), so the measured
# hospital simulation exercises the capability.
Adl2ArchetypeProvisioning: { family: Platform, tier: OPTIONS, required: false, min_cases: 9, source: "CNF profiles master03-profiles.adoc §Functional (Definitions: ADL 2 Archetype provisioning)" }
Adl2OptProvisioning: { family: Platform, tier: OPTIONS, required: false, min_cases: 29, source: "CNF profiles master03-profiles.adoc §Functional (Definitions: ADL 2 OPT provisioning)" }
