# ── External-terminology corpus (the composed FHIR R4 terminology server) ─────
# BASE docs/architecture_overview/master12-terminology.adoc §"Binding
# Terminology Value-sets to Archetypes": an "ac" code is "bound to queries to
# one or more external terminologies, whose result would be a (possibly
# structured) value set from that terminology", and the query itself "is
# defined within a 'terminology query server'". The two templates below are the
# only corpus templates carrying that binding; the compositions are their
# member / non-member / unresolvable instances. The value sets they name are
# SYNTHETIC test content seeded into the composed server (docker/terminology/),
# under the reserved example.test domain (IETF RFC 6761 §6.2) — no licensed
# terminology content is distributed in this repo.
cnf.opt.invalid.undefined_constraint_code:
  source: templates/dt_coded_text_binding_undefined_ac.opt
  format: opt-xml
  rm_versions: [">=1.0.2"]
  validity:
    verdict: invalid
    defect: "the definition references constraint code ac0001 (CONSTRAINT_REF) and constraint_bindings binds it, but no constraint_definitions entry defines it, and the ontology omits the mandatory term_definitions"
    spec_ref: "AM ADL1.4 master08-adl.adoc §Coded Term Validity (VATDF: all ac codes used in the definition must be defined in constraint_definitions; VACDF); master05-cadl.adoc §Placeholder Constraints; ITS-XML components/AM/Release-1.4 §Archetype 1.4; ITS-XML components/AM/Release-1.4/Archetype.xsd §ARCHETYPE_ONTOLOGY (term_definitions mandatory)"
  template_id: "cnf.tpl.dv_coded_text_binding_undefined_ac"
  provenance: "the 2026-07-29 triage's adjudicated-invalid shape, preserved verbatim under its own id per the valid+invalid-twins rule (owner 2026-07-29): the pre-correction dt_coded_text_binding_sct.opt whose upload the SUT was spec-RIGHT to refuse (422 VTCBK). Its corrected valid twin is cnf.tpl.dv_coded_text_binding_sct; this row pins the refusal so a lenient server fails it"
cnf.tpl.dv_coded_text_binding_sct:
  source: templates/dt_coded_text_binding_sct.opt
  format: opt-xml
  rm_versions: [">=1.0.2"]
  validity: { verdict: valid }
  template_id: "cnf.tpl.dv_coded_text_binding_sct"
  provenance: "authored 2026-07-29 as templates/dt_coded_text_constraint_ref.opt (itself generated from the openEHR CNF Robot minimal_observation.opt skeleton) plus a complete component_ontologies entry for the OBSERVATION component (corrected 2026-07-29 after the first live run — the 2026-07-29 triage attributed the upload refusal to this fixture): the mandatory term_definitions (Archetype.xsd ARCHETYPE_ONTOLOGY — term_definitions carries no minOccurs; AOM1.4 master07 §Term and Constraint Definitions requires text+description), the constraint_definitions entry DEFINING ac0001 (ADL1.4 master08-adl.adoc §Coded Term Validity VATDF/VACDF: every ac-code used in the definition must be defined in constraint_definitions; master05 §Placeholder Constraints), and the constraint_bindings set (master08 §Constraint_bindings) binding ac0001, under terminology id cnf-sct-shaped, to the terminology query http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders — placed under component_ontologies because the constraint lives in a component archetype, not the root template (OPT2 master03-opt_raw.adoc §Terminology; Template.xsd FLAT_ARCHETYPE_ONTOLOGY). The unbound twin stays cnf.tpl.dv_coded_text_constraint_ref, so a case pair isolates the binding itself"
cnf.tpl.dv_coded_text_binding_tsdown:
  source: templates/dt_coded_text_binding_tsdown.opt
  format: opt-xml
  rm_versions: [">=1.0.2"]
  validity: { verdict: valid }
  template_id: "cnf.tpl.dv_coded_text_binding_tsdown"
  provenance: "authored 2026-07-29 as the UNRESOLVABLE twin of cnf.tpl.dv_coded_text_binding_sct (same complete component_ontologies shape — term_definitions + the ac0001 constraint_definitions entry per ADL1.4 master08 §Coded Term Validity VATDF/VACDF, corrected 2026-07-29 with its twin): ac0001 bound under terminology id cnf-ts-down to http://cnf.example.test/fhir/ValueSet/ts-down-set — a namespace a deployment routes to a terminology server that is declared unreachable for the whole run. It is the carrier of the fail-open / fail-closed branch pair (register AMB-172); the template itself is intrinsically VALID, only its bound query cannot be answered"
cnf.composition.terminology_binding_sct_member:
  source: fixtures/composition/terminology_binding_sct_member.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity: { verdict: valid }
  template_id: "cnf.tpl.dv_coded_text_binding_sct"
  provenance: "authored 2026-07-29 on the cnf.tpl.dv_coded_text_binding_sct carrier shape (COMPOSITION.minimal / OBSERVATION.minimal / HISTORY at0001 / POINT_EVENT at0002 / ITEM_TREE at0003 / ELEMENT at0004), whose coded leaf carries 1000002 — a MEMBER of the bound value set — under the seeded code system http://cnf.example.test/fhir/CodeSystem/sct-shaped"
cnf.composition.terminology_binding_sct_non_member:
  source: fixtures/composition/terminology_binding_sct_non_member.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity:
    verdict: invalid
    defect: "the coded leaf's code 1000003 is not in the value set bound to the archetype constraint code ac0001"
    spec_ref: "BASE architecture_overview master12 §Binding Terminology Value-sets to Archetypes (the ac code is bound to a query whose result IS the permitted value set); AM AOM1.4 master04 §Reference Objects (a CONSTRAINT_REF is a proxy for the constraints that binding expresses)"
  template_id: "cnf.tpl.dv_coded_text_binding_sct"
  provenance: "authored 2026-07-29 as the non-member twin of cnf.composition.terminology_binding_sct_member: identical but for the coded leaf's code_string, 1000003, which the seeded value set http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders deliberately excludes while the code system does define it — so the only defect is value-set MEMBERSHIP, resolvable solely against the terminology query server"
cnf.composition.terminology_binding_tsdown:
