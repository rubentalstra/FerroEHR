# Corpus additions for the CNF master11 (QUERY) schedule cases. Same entry
# schema as MANIFEST.yaml; the validate harness concatenates this into
# corpus/MANIFEST.yaml at integration (never edit MANIFEST.yaml directly here).
#
# Two families:
#   - the generated loaded-db set cnf.set.query-bp-10 (recipe query_bp), with the
#     declarative views the loaded-db cases assert against; and
#   - the AQL query-text fixtures (format aql-text) the invalid-query,
#     empty-db-shapes, and terminology-reject fixture_sets iterate over.
# Provenance for the ecc- ground: re-adjudicated 2026-07-21 from the retired ECC
# AQL battery against QUERY AQL 1.1 spec text; the AQL texts are re-authored to
# the AQL 1.1 grammar/semantics (not copied from the RM-1.0.x-era vendored
# corpus). All fixtures are spine-first authored; the generated set is a
# digest-pinned recipe contract (corpus/recipes/query_bp.md).

# ── the generated loaded-db corpus ────────────────────────────────────────────
cnf.set.query-bp-10:
  generated_by: { recipe: query_bp, digest: "sha256:a40cec50cdc09dca7f24081ef40e1caad60b21663c2ed0929ae80888e9bc359a" }
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity: { verdict: valid }
  provenance: "generated set: 10 blood-pressure COMPOSITIONs, systolic 100..190, category event (recipe contract corpus/recipes/query_bp.md)"
  views:
    all_uids_asc:
      select: "committed uids of all compositions"
      order_by: "uid ascending"
    systolic_ge_140_uids_asc:
      select: "committed uids of compositions"
      where: "systolic magnitude >= 140"
      order_by: "uid ascending"
