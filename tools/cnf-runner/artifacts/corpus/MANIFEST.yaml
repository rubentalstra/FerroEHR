  template_id: "cnf.tpl.sf_interval_event"
  provenance: "authored functional-corpus template (#548) — the cnf.tpl.ecc_event_type_narrowing shape with the events slot narrowed to INTERVAL_EVENT instead of POINT_EVENT, generated by the same generate_content_opts.py structural_event() builder (AM 1.4 C_OBJECT.rm_type_name, the constraint the official master16 CONT-EVENT-type_interval_event case declares). It exists so the ITS-REST simplified_formats master05-rm_mapping §INTERVAL_EVENT rows (`/width`, `/math_function`, `|sample_count`) are REACHABLE on the wire: no other functional-corpus template constrains an EVENT to a concrete INTERVAL_EVENT, and a FLAT commit cannot conjure an interval event the template does not declare. `width` and `math_function` are deliberately left UNCONSTRAINED, exactly as `time` is on the POINT_EVENT siblings — they are RM-mandatory attributes the compacted web template carries no child for, and the master05 per-type mapping tables make them addressable regardless. The events occurrence is 0..* (upper_unbounded): master04 §Conditionally Collapsed Wrapper Types collapses a sole max-1 EVENT out of the web template — which left the fixture paths naming no node (the 2026-07-28 triage) — and an unbounded occurrence RETAINS the node by that same released sentence"
