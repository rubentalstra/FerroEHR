# MESSAGING (master13) corpus additions — concatenated into MANIFEST.yaml by
# the verify harness. Canonical-JSON EXTRACT / EXTRACT_SPEC and TDD (XML)
# payloads for the I_EHR_EXTRACT_SERVICE / I_TDD_SERVICE cases.
#
# RE-AUTHORED EXECUTABLE 2026-07-29 (#659). These payloads used to be
# DOCUMENTARY — shaped to the RM class model but never sent anywhere, because
# no wire reached the services. This product now serves them on declared
# extension routes (vocab/wire_surface.yaml `message-extract` / `message-tdd`,
# register AMB-34), so every entry below is REALLY POSTED to a live SUT and had
# to become semantically importable rather than merely well-typed: the EXTRACTs
# carry an X_VERSIONED_* container with a complete ORIGINAL_VERSION (uid,
# lifecycle_state, contribution, commit_audit, data), and the TDDs name an
# operational template the owning case provisions through `requires.templates`.
#
# FORMAT NOTE: a TDD is XML but NOT canonical openEHR RM XML — it is an
# instance of the template-derived TDS (AM OPT2 master02-overview.adoc
# §Purpose of the OPT). The closed CorpusFormat vocabulary
# (tools/cnf-runner/src/vocab.rs) has no TDS member and a vocabulary value
# enters only by schedule release, so these entries carry `canonical-xml`,
# which the resolver treats as "an XML text payload".
# TODO: give the TDS its own CorpusFormat member when the schedule releases one.
cnf.messaging.ehr_extract.v1:
  source: fixtures/messaging/ehr_extract.v1.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity: { verdict: valid }
  provenance: "authored 2026-07-29 (#659) from the RM ehr_extract IM — a whole-EHR EXTRACT as master09-semantics §Creation Semantics builds one: EXTRACT (mandatory time_created / system_id / sequence_nr>=1) + a `specification` EXTRACT_SPEC naming the SOURCE ehr_id (which import_ehr re-uses when the caller fixes none — RM common master06 §Copying Case 1) + one EXTRACT_CHAPTER carrying an OPENEHR_CONTENT_ITEM around an X_VERSIONED_EHR_STATUS whose single ORIGINAL_VERSION is complete (uid, lifecycle_state 532|complete|, contribution, commit_audit, EHR_STATUS data). Its EHR_STATUS.subject is PARTY_SELF with no external_ref so importing it collides with no other EHR's subject (one EHR per subject, RM ehr master04 §EHR Status)"
