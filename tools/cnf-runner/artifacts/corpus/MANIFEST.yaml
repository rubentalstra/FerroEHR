# The FOLDER.details slot twins. `details` is typed ITEM_STRUCTURE (abstract;
# concrete subtypes ITEM_TREE / ITEM_LIST / ITEM_SINGLE / ITEM_TABLE), so a
# DATA_VALUE in that slot is not a FOLDER. The ACCEPTING twin already exists as
# cnf.directory.v2 (its details is a populated ITEM_TREE, read back by the
# update/get cases' `equivalent` assertions); this is the invalid twin that
# pins the refusal a lenient server would skip.
cnf.directory.invalid.details_not_item_structure:
  source: fixtures/directory/details_not_item_structure.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity:
    verdict: invalid
    defect: "RM: a FOLDER whose details is a DV_TEXT — FOLDER.details is typed ITEM_STRUCTURE"
    spec_ref: "RM common UML/classes/org.openehr.rm.common.folder.adoc §Attributes (details: ITEM_STRUCTURE, 0..1); RM common master05-directory_package.adoc §Overview"
  provenance: "derived 2026-08-01 from cnf.directory.root_only by adding a `details` carrying a DV_TEXT instead of one of the four concrete ITEM_STRUCTURE subtypes, leaving the payload well-formed JSON with exactly ONE defect — the invalid twin of cnf.directory.v2's populated ITEM_TREE details"
# The FOLDER.items twins. `items` is `0..1 List<OBJECT_REF>` — the reference
# slot the whole directory abstraction rests on: "A FOLDER instance contains
# more FOLDERs and/or items, which are references to other (usually versioned)
# objects … Since they are references, multiple references to the same object
# are possible, allowing the structure to be used to mutiply classify other
# objects" (RM common master05-directory_package.adoc §Overview), restated in
# RM ehr master04-ehr_package.adoc §Folders: "Folder structures do not contain
# Compositions, only references to them. More than one Folder can therefore
# refer to the same Composition or other target object." The valid twin proves
# the multiply-classified reference is accepted and survives verbatim; the
# invalid twin pins the by-value refusal a lenient server would skip.
cnf.directory.with_items:
  source: fixtures/directory/with_items.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity: { verdict: valid }
  provenance: "derived 2026-08-01 from cnf.directory.root_only by adding two sibling FOLDERs whose `items` lists carry OBJECT_REFs (RM common UML/classes/org.openehr.rm.common.folder.adoc §Attributes: items: List<OBJECT_REF>, 0..1): ONE target (1e0a7f34-…) is referenced from BOTH siblings — the multiple-classification shape RM common master05-directory_package.adoc §Overview and RM ehr master04-ehr_package.adoc §Folders describe — beside one distinct second target (7c4d2b81-…). The refs are `local`/VERSIONED_COMPOSITION with HIER_OBJECT_ID ids (BASE base_types UML/classes/org.openehr.base.base_types.object_ref.adoc §Attributes: namespace `local`, type = the referenced class, id = a globally unique OBJECT_ID); no released sentence makes target existence a precondition of the reference, so the ids stand free"
cnf.directory.invalid.root_archetype_id_mismatch:
  source: fixtures/directory/root_archetype_id_mismatch.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity:
    verdict: invalid
    defect: "RM: a root FOLDER whose archetype_node_id (openEHR-EHR-FOLDER.generic.v1) contradicts its archetype_details.archetype_id (openEHR-EHR-FOLDER.other.v1) — an archetype root carries its archetype identifier AS its node id"
    spec_ref: "RM common UML/classes/org.openehr.rm.common.locatable.adoc §Attributes (archetype_node_id) + §Invariants Archetyped_valid"
  provenance: "derived 2026-08-04 from cnf.directory.root_only by adding an ARCHETYPED archetype_details whose archetype_id names a DIFFERENT archetype than the root archetype_node_id, leaving the payload well-formed and convertible with exactly ONE semantic defect — the 422-class twin beside the seam's 400-class fixtures"
cnf.directory.invalid.items_by_value:
  source: fixtures/directory/items_by_value.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity:
    verdict: invalid
    defect: "RM: a FOLDER whose items member is a COMPOSITION by value — FOLDER.items is typed List<OBJECT_REF>"
    spec_ref: "RM common UML/classes/org.openehr.rm.common.folder.adoc §Attributes (items: List<OBJECT_REF>, 0..1); RM common master05-directory_package.adoc §Overview; RM ehr master04-ehr_package.adoc §Folders (\"Folder structures do not contain Compositions, only references to them\")"
  provenance: "derived 2026-08-01 from cnf.directory.root_only by adding an `items` list whose single member is the corpus's own valid COMPOSITION cnf.composition.minimal_persistent.v1 embedded BY VALUE, leaving the payload well-formed JSON with exactly ONE defect — the member is a full RM-valid COMPOSITION, so the only thing wrong with it is that it sits in the reference slot instead of an OBJECT_REF to it; the accepting twin is cnf.directory.with_items"
# The FOLDER.items ID-WIDTH pair. cnf.directory.with_items covers the ordinary
# HIER_OBJECT_ID reference; these two cover the rest of the width the released
# sources admit in that slot, so the accepted width is ASSERTED rather than
# incidental. BASE base_types UML/classes/org.openehr.base.base_types.object_ref.adoc
# §Attributes types `id` as `OBJECT_ID` (1..1) — the abstract root of the
# six-member concrete family (HIER_OBJECT_ID, OBJECT_VERSION_ID, ARCHETYPE_ID,
# TEMPLATE_ID, TERMINOLOGY_ID, GENERIC_ID; see each class table's *Inherit*
# row) — and the ITS-JSON RM schema's OBJECT_REF.id enumerates exactly those
# six `_type` values. The released OAS narrows the same slot to two
# (Folder.yaml `items` -> UObjectRefOfUidBasedId -> UUidBasedId `oneOf`
# {HIER_OBJECT_ID, OBJECT_VERSION_ID}); register AMB-186 carries that
# narrowing and the wide-acceptance adjudication.
cnf.directory.versioned_id_items:
  source: fixtures/directory/versioned_id_items.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity: { verdict: valid }
  provenance: "derived 2026-08-02 from cnf.directory.root_only by adding an `items` list whose single member is a `local`/COMPOSITION OBJECT_REF carrying a THREE-PART OBJECT_VERSION_ID — the version-pinned reference form BASE base_types UML/classes/org.openehr.base.base_types.object_version_id.adoc §Description defines (lexical form `object_id '::' creating_system_id '::' version_tree_id`) and the released ITS-REST specifications/schemas/base_types/ObjectRef.yaml carries as its OWN example; the id value is that example's value verbatim (fb458d9c-1323-42bc-b7f8-787f3660a0b5::openEHRSys.example.com::1, type COMPOSITION). As with cnf.directory.with_items the target need not exist: BASE object_ref.adoc §Description says the referenced object 'may exist locally or be maintained outside the current namespace'"
cnf.directory.wide_id_items:
  source: fixtures/directory/wide_id_items.json
  format: canonical-json
  rm_versions: [">=1.0.2"]
  validity: { verdict: valid }
  provenance: "derived 2026-08-02 from cnf.directory.root_only by adding an `items` list whose single member is an OBJECT_REF whose id is a GENERIC_ID — the widest member of the OBJECT_ID family, 'Generic identifier type for identifiers whose format is otherwise unknown to openEHR' with its mandatory 1..1 `scheme` (BASE base_types UML/classes/org.openehr.base.base_types.generic_id.adoc §Description + §Attributes). `type` is `ANY`, which BASE object_ref.adoc §Attributes states outright for this case: 'The type name ANY can be used to indicate that any type is accepted (e.g. if the type is unknown)'. This is the fixture that makes the accepted id width assertable beyond the two subtypes the released OAS enumerates (register AMB-186)"
