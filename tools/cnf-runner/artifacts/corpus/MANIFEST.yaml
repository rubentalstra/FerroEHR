  rm_versions: [">=1.0.2"]
  validity:
    verdict: invalid
    defect: "the DV_QUANTITY object writes its magnitude member TWICE"
    spec_ref: "RFC 8259 §4 (<https://www.rfc-editor.org/rfc/rfc8259#section-4>): the names within an object SHOULD be unique, and 'when the names within an object are not unique, the behavior of software that receives such an object is unpredictable' + ITS-REST specifications/docs/overview/Resources.md §JSON Format (every attribute is written once, in BMM declaration order, so no conformant producer can have meant a repeated member)"
  provenance: "authored 2026-08-04 for #1725 — cnf.composition.minimal_event.v1 with its magnitude line repeated once and nothing else changed (the two files differ by exactly that one line). Carried as raw-json because the defect is BYTE-level: serde_json and every other Value parser silently resolve a repeated member last-wins, so a canonical-json data set would normalise the defect away before it reached the SUT. The in-process twin of this refusal is crates/openehr-its/tests/it/fixture_twins.rs a_repeated_member_is_refused"
