# The declared-slot-type invalid twin (#1655, adjudicated with the typed
# commit seam): a DV_TEXT member inside COMPOSITION.content contradicts the
# slot's declared List<CONTENT_ITEM>. Typed construction refuses it at parse
# — the 400 row of overview Requests_and_responses §HTTP status codes
# ("could not be parsed or is invalid"; owner ruling 2026-08-03) — where the
# pre-seam behaviour surfaced it from the post-parse slot-conformance rule as
# a 422. The valid twin is every accepted minimal_event commit.
id: I_EHR_COMPOSITION.create_composition-foreign_type_in_content
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION commit carrying a DV_TEXT member inside content (declared
  List<CONTENT_ITEM>) cannot be constructed as a COMPOSITION and is refused
  as malformed content (the 400 parse class); nothing is committed.
description: "create_composition with a foreign-typed content member is a 400"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "RM ehr master05-composition_package §Class Descriptions"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.dv_text_in_content]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.dv_text_in_content}" }
    expect: bad_request                   # the 400 row — a DV_TEXT is not a CONTENT_ITEM; construction refuses
postconditions:
  - { assert: version, count: 0 }
