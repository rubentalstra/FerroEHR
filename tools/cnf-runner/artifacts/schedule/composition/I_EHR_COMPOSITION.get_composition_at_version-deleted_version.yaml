# Reading a logically deleted COMPOSITION on the BARE resource route, by the
# deleted version's own explicit version_uid: there is no content to
# represent, so the read is fulfilled with no body.
#
# SPEC SILENCE, adjudicated as AMB-74 (fixed_handling): the bare route's one
# deleted branch is textually scoped to the at-time addressing form, and this
# explicit-version form has no assigned branch. What decides it is what a
# deleted version IS: RM common master06 §Logical Deletion commits a version
# whose `_data_` is deleted and whose `_lifecycle_state_` is the code for
# deleted, and the bare route serves the COMPOSITION (the VERSION's data) —
# which no longer exists. ITS-REST overview Requests_and_responses.md §HTTP
# status codes assigns that state its row: "204 | No Content | The request has
# been fulfilled and there is no additional content to send in the response
# payload body". The read is not a miss — the version is right there, and its
# envelope is still served in full on the versioned_composition route (the
# sibling deleted_version_envelope case), which is exactly why 404 would be
# the wrong answer here.
id: I_EHR_COMPOSITION.get_composition_at_version-deleted_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_version
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-74]
test_purpose: >-
  A bare-route COMPOSITION read addressing a logically deleted version by its
  explicit version_uid is fulfilled with no content.
description: "Get COMPOSITION at the explicitly addressed deleted version"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources §Identifier types"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_version"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }   # AMB-75: the new 523|deleted| version
  - step: 3                              # the deleted version, addressed explicitly
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${deleted_uid}" }
    expect: ok_empty
