# The upper edge on the composition ENVELOPE route: an instant after the
# newest commit still names the newest VERSION and is answered.
#
# No released text closes a version's extancy interval at the next commit or
# leaves it open — RM common versioned_object.adoc gives only
# `version_at_time (a_time): VERSION` with `Pre: has_version_at_time
# (a_time)`. Register AMB-70 carries the adjudicated fixed handling this case
# pins: a future T is a 200 carrying the newest version, never a 404.
#
# The envelope's own identifier is normative and not in dispute — RM common
# master06 §Version Identification: "`VERSION` objects are identified by a
# `_uid_` attribute of type `OBJECT_VERSION_ID`" — so the served uid names the
# version exactly. The queried instant is a FIXED literal in the extended
# ISO 8601 form Resources.md §Datetime format requires, never a clock reading.
id: I_EHR_COMPOSITION.get_versioned_composition-at_time_future
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  A versioned-COMPOSITION version read for an instant later than every
  committed version serves the newest VERSION rather than refusing the
  request.
description: "Get COMPOSITION VERSION at time, future instant"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "ITS-REST overview Resources §Datetime format"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: get_versioned_composition
    variant: at_time
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      a_time: "2099-01-01T00:00:00Z"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${v2_uid}" }
