# The UNRESOLVABLE bound value set, fail-CLOSED half (register AMB-172).
#
# The sibling of …-terminology_binding_unresolvable_fail_open: identical
# payload, identical unresolvable binding, opposite deployment posture. BASE
# docs/architecture_overview/master12-terminology.adoc §"Binding Terminology
# Value-sets to Archetypes" puts the bound query in an external "terminology
# query server" and is silent on what follows when it cannot be answered, so a
# deployment that treats an unverifiable constrained value as non-conformant is
# as conformant as one that lets it through — and a running server realizes
# exactly ONE of the two.
#
# Both branches are therefore tested against the deployments that realize them,
# in the ONE record: this case addresses the SECOND deployment the ferroehr
# pipeline composes (`on: sut_pgp`), whose ixit instance declares
# `terminology.posture: fail_closed` alongside its own signing posture —
# postures are independent properties of a deployment. A party that runs only
# one terminology posture declares only that one, and the other case is
# not-applicable with the citation instead of being driven against a server
# that legitimately behaves the other way.
id: I_EHR_COMPOSITION.create_composition-terminology_binding_unresolvable_fail_closed
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [ArchetypeValidation]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  On a deployment declaring the fail-closed posture, a COMPOSITION whose bound
  value set cannot be resolved (the terminology server is unreachable) is
  rejected and nothing is committed.
description: "Unresolvable bound value set, fail-closed deployment: the commit is refused"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "BASE architecture_overview §Terminology in openEHR"
  - "ITS-REST ehr §422_Composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.tpl.dv_coded_text_binding_tsdown]
  ehr: { commits: none }                 # mints ${ehr_id} on the addressed deployment
  terminology:
    posture: fail_closed
    unreachable:
      - "cnf-ts-down"                    # the terminology id the ontology binding declares
      - "http://cnf.example.test/fhir/ValueSet/ts-down-set"
data_sets: [cnf.composition.terminology_binding_tsdown]
flow:
  - step: 1
    call: create_composition
    on: sut_pgp
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.terminology_binding_tsdown}"
    expect: validation_failed             # "information about the errors in the provided COMPOSITION"
    assert:
      - { assert: message_exemplar, text: "information about the errors in the provided COMPOSITION" }
postconditions:
  - { assert: version, count: 0 }        # nothing committed
ambiguities: [AMB-172]
