# The shape of the VERSIONED_COMPOSITION container itself — the resource the
# /versioned_composition route serves, as distinct from the VERSION envelopes
# it holds.
#
# Three of the four facts are normative RM, quoted from RM common
# UML/classes/org.openehr.rm.common.versioned_object.adoc §Attributes:
#   * the served object is a VERSIONED_COMPOSITION (ITS-REST overview
#     Resources.md §Resources names it first among the "versioned entities:
#     VERSIONED_COMPOSITION, VERSIONED_EHR_STATUS, etc.");
#   * `uid`: HIER_OBJECT_ID — "Unique identifier of this version container in
#     the form of a UID with no extension", so the container id carries NO
#     `::system::n` version coordinate (contrast VERSION.uid, the three-part
#     OBJECT_VERSION_ID of RM common master06 §Version Identification);
#   * `time_created`: DV_DATE_TIME 1..1 — "Time of initial creation of this
#     versioned object".
#
# The fourth — the WIRE VALUES of `owner_id` — is stated by no released text.
# RM types it OBJECT_REF 1..1 and says only that it refers to "the id of the
# containing EHR or other relevant owning entity"; BASE constrains the
# namespace lexically but assigns no value; the ITS-REST docs text never
# mentions owner_id. Register AMB-69 carries the adjudicated fixed handling
# this case pins: namespace "local", type "EHR", id.value the owning ehr_id —
# the same handling the VERSIONED_EHR_STATUS container case pins, on the
# resource whose owner is a container inside the EHR rather than the EHR's own
# singleton.
#
# The header pair rides the same SHOULD as every other versioned-object read
# (overview Requests_and_responses.md §"ETag and Last-Modified": "Both `ETag`
# and `Last-Modified` SHOULD be included in responses for VERSION,
# VERSIONED_OBJECT, or other resources that have versioning or unique state
# identifiers") and is asserted by the binding's declarations; the identifier
# INSIDE the entity tag stays unconstrained because the same section makes its
# source a choice.
id: I_EHR_COMPOSITION.get_versioned_composition-container_shape
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-69]
test_purpose: >-
  The VERSIONED_COMPOSITION container read serves a VERSIONED_COMPOSITION whose
  uid is an extension-less container id, whose owner_id references the owning
  EHR, and which carries its creation time.
description: "Get VERSIONED_COMPOSITION container shape"
spec_refs:
  - "RM common §versioned_object (uid / owner_id / time_created)"
  - "RM common §change_control (master06 — the three-part VERSION uid the container uid is NOT)"
  - "ITS-REST overview Resources §Resources"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_versioned_composition
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: VERSIONED_COMPOSITION }
      # "a UID with no extension" — no `::creating_system_id::version_tree_id`
      - { assert: field, path: "uid/value", matches: "^[^:]+$" }
      # AMB-69 fixed handling — the owning EHR, as a local EHR reference
      - { assert: field, path: "owner_id/namespace", equals: "local" }
      - { assert: field, path: "owner_id/type", equals: "EHR" }
      - { assert: field, path: "owner_id/id/value", equals: "${ehr_id}" }
      # "Time of initial creation of this versioned object" (1..1)
      - { assert: field, path: "time_created/value", exists: true }
