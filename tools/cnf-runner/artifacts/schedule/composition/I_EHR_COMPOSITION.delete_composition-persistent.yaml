# Delete a persistent COMPOSITION: a logical delete creating a second VERSION
# whose lifecycle_state is openehr::523|deleted| (master07 NOTE). The
# preceding_version_uid is realized as the path uid_based_id (AMB-3).
id: I_EHR_COMPOSITION.delete_composition-persistent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.delete_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  delete_composition on an existing persistent COMPOSITION creates a second
  VERSION with lifecycle_state openehr::523|deleted| (logical delete).
description: "Delete persistent COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.delete_composition"
  - "CNF platform_test_schedule master07 §delete_composition-persistent"
  - "RM common §change_control (VERSION.commit_audit.change_type, lifecycle_state)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_persistent]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_persistent.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_persistent.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
  - { assert: version, of: "${deleted_uid}", change_type: DELETED, lifecycle_state: "openehr::523|deleted|" }
ambiguities: [AMB-3, AMB-11]
