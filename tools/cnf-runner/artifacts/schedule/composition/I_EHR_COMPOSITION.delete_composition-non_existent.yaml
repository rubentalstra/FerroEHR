# Delete with a random preceding_version_uid: negative, the COMPOSITION does not
# exist (404 not_found). The preceding_version_uid is realized as the path
# uid_based_id (ITS-REST overview §If-Match).
id: I_EHR_COMPOSITION.delete_composition-non_existent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.delete_composition
capabilities: [Versioning]
profiles: [CORE]
test_purpose: >-
  delete_composition with a random preceding_version_uid on an EHR without
  commits is rejected: the COMPOSITION does not exist.
description: "Delete non-existent COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.delete_composition"
  - "CNF platform_test_schedule master07 §delete_composition-non_existent"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # "An EHR ... should have no commits" — mints ${ehr_id}
flow:
  - step: 1
    call: delete_composition
    with:
      ehr_id: "${ehr_id}"
      preceding_version_uid: "11111111-1111-4111-8111-111111111111::cnf.example.org::1"
    expect: not_found                     # "error related to the non-existent COMPOSITION"
