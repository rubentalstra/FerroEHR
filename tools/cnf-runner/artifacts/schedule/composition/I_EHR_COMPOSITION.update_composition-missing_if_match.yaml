# The other half of the precondition rule: the COMPOSITION PUT expects
# If-Match, so a request that omits it is refused rather than applied
# unconditionally.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "When the service expects `If-Match`
# for an operation, but the client does not provide it, the service SHOULD
# respond with `400 Bad Request`." That the COMPOSITION PUT is such an
# operation comes from the same section's scope sentence — the header is
# required "by a small set of versioned resources in this specification, when
# the `preceding_version_uid` is not part of the endpoint path segment" — and
# PUT /ehr/{ehr_id}/composition/{versioned_object_uid} carries the version
# CONTAINER id in its path, never the preceding VERSION uid.
#
# The omission is expressed by the `no_if_match` VARIANT binding, which simply
# does not declare the header; the request is otherwise byte-identical to the
# accepted update, so a red row localizes to the precondition alone.
#
# The postcondition shows the refusal really refused: the versioned object
# still holds its single created version.
id: I_EHR_COMPOSITION.update_composition-missing_if_match
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION update sent without the If-Match precondition header is
  refused as a client error and commits no version.
description: "Update a COMPOSITION without the If-Match precondition"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: no_if_match                 # the variant binding omits the header entirely
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
    expect: precondition_missing
postconditions:
  # no version was committed without a precondition
  - { assert: version, count: 1 }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
