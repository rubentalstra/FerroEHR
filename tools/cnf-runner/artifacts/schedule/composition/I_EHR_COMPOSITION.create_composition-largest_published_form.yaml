# The scale branch of the ordinary create_composition contract: a valid
# COMPOSITION instantiating the LARGEST OPT the official CKM publishes
# (Congenital syphilis case investigation form, cid 1013.26.977, ~5.2 MB of
# OPT 1.4 XML) commits and reads back content-equal. The released text
# defines the create_composition success and error branches with NO
# payload-size condition anywhere (the overview status table carries no
# 413/size-conditioned branch and no maximum-length rule appears in the
# release), so an implementation cap that refuses, truncates, or corrupts a
# large valid COMPOSITION is a conformance defect — this row is the asserted
# probe for that failure class (#1462). One behaviour per case: the subject
# is size-independence of the commit + faithful storage at scale; the
# ordinary first-version semantics are already pinned by
# create_composition-event.
#
# The payload is the committed example skeleton of that template (generated
# once via scripts/generate-ckm-examples.sh, the same deterministic payload
# ground the measured hospital simulation commits), and the read-back is
# compared against it modulo the binding's declared server-assigned set —
# scale must not change what is stored.
id: I_EHR_COMPOSITION.create_composition-largest_published_form
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  create_composition with a valid COMPOSITION of the largest published CKM
  form creates a first VERSION whose stored content equals the committed
  payload — the released contract carries no payload-size condition, so no
  implementation cap may refuse, truncate, or corrupt it.
description: "Create a COMPOSITION of the largest published CKM form"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (no size-conditioned branch exists in the release)"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.ckm.syphilis_investigation]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.ckm.syphilis_investigation.example]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.ckm.syphilis_investigation.example}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: version, of: "${version_uid}", uid_pattern: "${versioned_object_uid}::<system>::1" }
      # Faithful storage at scale: the stored resource equals the committed
      # payload modulo the binding's declared server-assigned set.
      - { assert: equivalent, to: committed, ignoring: server_assigned }
postconditions:
  - { assert: version, count: 1 }
  - { assert: version, of: "${version_uid}", change_type: CREATE }
