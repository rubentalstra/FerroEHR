# Create an invalid event COMPOSITION: rejected with errors about the content;
# nothing is committed. The fixture's EVALUATION carries no `data`, a member
# the release's own request-body schema declares mandatory (ITS-REST OAS
# `schemas/ehr/Evaluation.yaml` `required: [data]`).
#
# WHICH BRANCH THE REFUSAL TAKES: `responses/400.yaml` scopes 400 to
# "syntactically invalid header, parameter or content"; `responses/422.yaml`
# scopes 422 to content that "could be converted to a resource" and then fails
# semantic validation. A body missing a `required` member never converts, so
# it is the 400 row.
id: I_EHR_COMPOSITION.create_composition-invalid_event
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  create_composition with a semantically invalid event COMPOSITION is rejected
  and returns information about the errors in the content.
description: "Create new invalid event COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "CNF platform_test_schedule master07 §create_composition-invalid_event"
  - "ITS-REST OAS schemas/ehr/Evaluation.yaml §required (data)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.invalid_structure]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.invalid_structure}" }
    expect: bad_request                   # the `required: [data]` member is absent — the body never converts
    assert:
      - { assert: message_exemplar, text: "information about the errors in the provided COMPOSITION" }
postconditions:
  - { assert: version, count: 0 }        # nothing committed
