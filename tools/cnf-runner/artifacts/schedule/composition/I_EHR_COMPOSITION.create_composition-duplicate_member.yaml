# A canonical-JSON body that writes the SAME object member twice is refused at
# the composition-CREATE seam. This is a BYTE-level defect, not a value one:
# every Value-based parser resolves a repeated member last-wins and the
# document that reaches the model is indistinguishable from a correct one, so
# the refusal only exists if the reader sees the original bytes. The data set
# is therefore `raw-json` (delivered verbatim, #1725) rather than
# canonical-json, which the runner would normalise before sending.
#
# WHY THE REPETITION IS REFUSED rather than resolved: RFC 8259 §4
# (<https://www.rfc-editor.org/rfc/rfc8259#section-4>) says the names within an
# object "SHOULD be unique" and that "when the names within an object are not
# unique, the behavior of software that receives such an object is
# unpredictable" — it is UNDEFINED, not permitted. ITS-REST
# specifications/docs/overview/Resources.md §JSON Format has every attribute
# written once, in BMM declaration order, so a repeated member is not a shape
# any conformant producer can have meant. Refusing it is the never-lax reading
# of an undefined behaviour; silently letting one occurrence win would commit a
# clinical value the client never unambiguously sent.
#
# WHICH BRANCH: the bytes do not parse to a resource under a strict reader, so
# ITS-REST `responses/400.yaml` — "syntactically invalid ... content" — owns
# it; `responses/422.yaml` presupposes content that "could be converted to a
# resource".
#
# The ACCEPTING twin is create_composition-single_member, whose body is
# byte-identical apart from the repetition.
id: I_EHR_COMPOSITION.create_composition-duplicate_member
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose DV_QUANTITY writes its magnitude member twice is refused
  as invalid content, and nothing is committed — the repetition is not
  silently resolved to one of the two values.
description: "Repeated JSON object member refused (400)"
spec_refs:
  - "ITS-REST overview Resources §JSON Format"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.duplicate_member]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.duplicate_member}" }
    expect: bad_request
postconditions:
  - { assert: version, count: 0 }        # neither occurrence won: nothing was committed
