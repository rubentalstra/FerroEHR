# The refusal-SYMMETRY row: the same invariant-violating content must get the
# same conformance answer over canonical XML as over canonical JSON.
#
# The payload is the codec-derived canonical-XML twin of the JSON fixture the
# `-setting_invalid` case commits (identical single defect: EVENT_CONTEXT.
# setting 999, no member of the `setting` group — TERM SupportTerminology
# §Vocabularies; RM ehr EVENT_CONTEXT Setting_valid). ITS-REST overview
# `Resources.md` §"Data representation": "Services MUST support at least one
# of the openEHR **XML** or **JSON** canonical formats" — the FORMAT is
# negotiable, the semantics are not, so a server refusing this content in one
# canonical format and committing it in the other answers conformance
# differently for the same instance (the #1431 escape presented exactly that
# split: XML 422, JSON 201). The 422 itself derives from the RM invariant +
# Requests_and_responses §HTTP status codes (422 "well-formed but was unable
# to be followed due to semantic errors").
id: I_EHR_COMPOSITION.create_composition-setting_invalid_xml
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  The canonical-XML twin of an out-of-group EVENT_CONTEXT.setting COMPOSITION
  is rejected 422 exactly like its canonical-JSON twin — refusal symmetry
  across the canonical formats.
description: "Reject the canonical-XML twin of the out-of-group setting (422)"
spec_refs:
  - "TERM SupportTerminology §Vocabularies (setting)"
  - "RM ehr §EVENT_CONTEXT (Setting_valid)"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (422)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.setting_invalid.xml]
flow:
  - step: 1
    call: create_composition
    format: canonical-xml              # Content-Type: application/xml on the request body
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.setting_invalid.xml}" }
    expect: validation_failed
    assert:
      - { assert: message_exemplar, text: "information about the errors in the provided COMPOSITION" }
postconditions:
  - { assert: version, count: 0 }      # nothing committed
