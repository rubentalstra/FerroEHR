# The DIRECT route reaches the same deletion SHAPE rule as the CONTRIBUTION
# route: a content-carrying PUT may not claim the `523|deleted|` state.
#
# RM common master06-change_control_package.adoc §Logical Deletion fixes
# deletion as ONE procedure — "create a new Version in the normal way; delete
# its `_data_` …; set the `_lifecycle_state_` value to the code for `deleted`;
# commit in the normal way" — so the state and the data-Void belong to the same
# act. A PUT carries content by definition (ITS-REST
# `operations/composition_update.yaml` declares a required body), so a PUT
# whose `openehr-version` header says `deleted` asks the server to store
# content under a version that says the item is gone.
#
# The header is the released committal channel — overview
# `Requests_and_responses.md` §"openehr-version and openehr-audit-details":
# "services MUST accept `openehr-version` … custom request headers" on the
# direct `PUT`/`POST`/`DELETE` commits, and "whatever is provided it MUST be
# merged" — so the value cannot simply be dropped; a merge that cannot be
# honoured is refused instead.
#
# The code is the overview's 422 row ("The request was well-formed but was
# unable to be followed due to semantic errors"). The CONTRIBUTION-route twin
# is I_EHR_CONTRIBUTION.commit_contribution-deleted_lifecycle_with_data; the
# accepting twin is step 3, the identical PUT under the default state.
id: I_EHR_COMPOSITION.update_composition-deleted_lifecycle_header
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION update whose openehr-version header claims lifecycle_state
  523|deleted| is rejected, and the composition stays at its previous version.
description: "Update a COMPOSITION with a contradictory deleted lifecycle header"
spec_refs:
  - "RM common §change_control (master06 §Logical Deletion — delete its data, set lifecycle_state to deleted, one procedure)"
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      v1_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: version_lifecycle           # sends openehr-version: lifecycle_state.code_string="523"
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${v1_uid}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      lifecycle_state: "523"             # 523|deleted| — contradicts the content the PUT carries
    expect: validation_failed
  - step: 3                              # the accepting twin: the same channel, a live state
    call: update_composition
    variant: version_lifecycle
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${v1_uid}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      lifecycle_state: "532"             # 532|complete| — the state a content-carrying PUT may claim
    expect: updated
postconditions:
  - assert: state
    text: >-
      The rejected update committed nothing: the accepted twin in step 3 is
      the container's SECOND version
  - { assert: version, count: 2 }
