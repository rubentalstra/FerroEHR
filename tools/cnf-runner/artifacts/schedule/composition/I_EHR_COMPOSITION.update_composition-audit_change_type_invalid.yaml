# An out-of-group change_type token is a 422: RM common master04
# `AUDIT_DETAILS.Change_type_valid` requires change_type.defining_code to be a
# member of the openEHR audit_change_type group (TERM group audit_change_type)
# — "999" is no member, so the commit is semantically unprocessable.
#
# Derived from the RM invariant + the ITS-REST status table
# (Requests_and_responses.md: 422 "well-formed but was unable to be followed
# due to semantic errors"), not from any SUT.
id: I_EHR_COMPOSITION.update_composition-audit_change_type_invalid
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps, ChangeSets]
profiles: [CORE]
test_purpose: >-
  A client-supplied change_type outside the audit_change_type group is
  rejected 422 (Change_type_valid), and no new version is committed.
description: "Reject an out-of-group change_type token (422)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §generic (AUDIT_DETAILS.Change_type_valid)"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: audit_change_type
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
      audit_change_type: "999"
    expect: validation_failed        # Change_type_valid violation (422; the binding kind is shared with the AMB-54 mismatch family)
postconditions:
  - { assert: version, count: 1 }
