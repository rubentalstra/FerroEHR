# The BARE deprecated committal header name still works: the §"Deprecated
# headers" table (Requests_and_responses.md) maps `openEHR-AUDIT_DETAILS` ->
# `openehr-audit-details` and states "the deprecated headers remain available
# for backward compatibility". A 1.0.x client using the bare deprecated name
# gets its description merged into the commit audit.
#
# Derived from the docs text, not from any SUT. NOTE the deprecated name
# lowercases to `openehr-audit_details` (underscore), a genuinely different
# header name than the Release-1.1.0 `openehr-audit-details`.
id: I_EHR_COMPOSITION.update_composition-audit_bare_deprecated
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps, ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committal metadata supplied under the deprecated openEHR-AUDIT_DETAILS
  header name is accepted and merged into the committed VERSION's
  AUDIT_DETAILS.
description: "Accept the deprecated openEHR-AUDIT_DETAILS header name"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Deprecated headers"
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: audit_bare_deprecated
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: field, path: "commit_audit/description/value", equals: "from a 1.0.x client" }
postconditions:
  - { assert: version, count: 2 }
