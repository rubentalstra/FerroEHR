# Get at time on a non-existent EHR errors on the missing EHR (404 not_found).
id: I_EHR_COMPOSITION.get_composition_at_time-bad_ehr
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
capabilities: [Versioning]
profiles: [CORE]
test_purpose: >-
  get_composition_at_time on a random ehr_id when no EHRs exist is rejected as
  not found (the EHR does not exist).
description: "Get COMPOSITION at time on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_time"
  - "CNF platform_test_schedule master07 §get_composition_at_time-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "There are no EHRs on the server"
flow:
  - step: 1
    call: get_composition_at_time
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      versioned_object_uid: "22222222-2222-4222-8222-222222222222"
      a_time: "2026-07-21T00:00:00Z"     # "current time"
    expect: not_found                     # "error indicating non-existence of the EHR"
