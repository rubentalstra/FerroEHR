# A group code that CONTRADICTS the operation is a 400 change-control
# mismatch: 249|creation| supplied on an update of an existing object.
#
# Derived from the ITS-REST docs text + RM, not from any SUT:
#   Requests_and_responses.md §"openehr-version and openehr-audit-details"
#   scopes the merge to the commit the operation performs; RM common master06
#   §Contributions defines 249|creation| as the FIRST version of a versioned
#   object — an update commits against an existing object, so creation cannot
#   describe it, and the rejection is REQUIRED. The released docs text
#   assigns NO status code to that rejection — the adjudicated AMB-54
#   silence (registers/ambiguities.yaml): the binding outcome accepts both
#   codes the overview's status table defines (400 / 422).
id: I_EHR_COMPOSITION.update_composition-audit_change_type_mismatch
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps, ChangeSets]
profiles: [CORE]
test_purpose: >-
  A client-supplied change_type of 249|creation| on an update of an existing
  COMPOSITION is rejected as a 400 change-control mismatch, and no new
  version is committed.
description: "Reject creation change_type on an update (400)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (§Contributions: 249 creation = first version)"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: audit_change_type
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
      audit_change_type: "249"
    expect: validation_failed        # AMB-54: the rejection code is spec-unassigned (400/422 both accepted by the binding)
postconditions:
  - { assert: version, count: 1 }
