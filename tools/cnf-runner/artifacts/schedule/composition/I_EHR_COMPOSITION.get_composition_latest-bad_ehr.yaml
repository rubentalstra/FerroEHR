# Get latest on a non-existent EHR errors on the missing EHR (404 not_found).
id: I_EHR_COMPOSITION.get_composition_latest-bad_ehr
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  get_composition_latest on a random ehr_id when no EHRs exist is rejected as
  not found (the EHR does not exist).
description: "Get COMPOSITION latest on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "CNF platform_test_schedule master07 §get_composition_latest-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "There are no EHRs on the server"
flow:
  - step: 1
    call: get_composition_latest
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      versioned_object_uid: "22222222-2222-4222-8222-222222222222"
    expect: not_found                     # "error related to the non existence of the EHR"
