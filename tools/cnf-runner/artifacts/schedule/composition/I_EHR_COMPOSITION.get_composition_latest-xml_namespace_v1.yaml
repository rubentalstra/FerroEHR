# ICS-conditional canonical-XML LINEAGE selection: the composition read
# returns the ITS-XML **v1** namespace when the request asks for it — the
# NON-DEFAULT direction of the selection mechanism since the served default
# flipped to v2 (owner ruling 2026-08-03, issue #1666; AMB-169 handling
# records the flip). The sibling …-xml_namespace_v1 case pins the other
# direction; without this row the v1 branch of the declared mechanism would
# have no executable case at all.
#
# WHY THIS IS AN OPTION AND NOT A REQUIREMENT. Released ITS-REST names no XML
# namespace and no way to select one: overview Resources.md §"XML Format" says
# only that request payloads and responses "MUST conform to the [published
# XSDs]" and gives one media type for all of them, and §"Data representation"
# requires a service to support "at least one of the openEHR **XML** or
# **JSON** canonical formats". The two lineages are an ITS-XML fact
# (README.adoc §"Releases and IM Versions": Release-2.0.0 changed "the
# internal namespace used in the schemas … to `http://schemas.openehr.org/v2`"
# and is marked TRIAL; Release-1.0.2 remains the STABLE bundle) with no wire
# mechanism attached. So which lineage a service serves — and whether a client
# may choose — is implementation-defined: register AMB-169, option_select.
# This case is the `xml-namespace-negotiated` branch; a party declaring
# `xml-namespace-fixed` is not judged by it — deselection rides the AMB-169
# option gate plus the canonical-xml format axis, not the tier.
#
# WHAT THE ROW ASSERTS is deliberately the narrowest thing that is true of the
# declared branch and of nothing else: that the response document declares the
# namespace the request selected. The root element name is the released floor
# already gated by the sibling I_EHR_COMPOSITION.get_composition_latest-xml
# (§"XML Format" + the ITS-XML schema's single globally declared `composition`
# element), so it is not re-asserted here. `Content-Type: application/xml` on
# the response is the released §"XML Format" MUST and is executed by the
# binding's `negotiated` matcher, which compares media tokens with parameters
# stripped — so the row makes no claim about whether a service echoes the
# parameter back, which nothing released governs.
#
# The `version` media-type parameter itself is the declaring party's OWN
# design/extension — no openEHR spec governs namespace selection on the REST
# wire — and AMB-169 records that so it can never be read as a released
# mechanism.
id: I_EHR_COMPOSITION.get_composition_latest-xml_namespace_v1
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [CompositionOps]
profiles: [CORE]                         # the anchoring capability's tier; the row still never gates a non-negotiating or XML-less party — the AMB-169 option gate and the canonical-xml format axis deselect it first
option: xml-namespace-negotiated         # AMB-169 option_select branch
ambiguities: [AMB-169]
formats: [canonical-xml]                 # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  On a server that lets a client select the canonical-XML schema lineage, a
  composition read asking for the v1 lineage returns a document declaring the
  v1 openEHR XML namespace.
description: "Get latest COMPOSITION in the negotiated ITS-XML v1 namespace"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-XML README.adoc §Releases and IM Versions (the v1/v2 lineages)"
applies: { rm: ">=1.0.2" }
guards:
  - "Canonical-XML lineage selection is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-169); released ITS-REST names no XML namespace and no selection mechanism"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json               # precondition only — the branch under test is step 2
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: get_composition_latest
    variant: xml_namespace_v1            # sends Accept: application/xml; version=1
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, matches: 'xmlns="http://schemas\.openehr\.org/v1"' }
