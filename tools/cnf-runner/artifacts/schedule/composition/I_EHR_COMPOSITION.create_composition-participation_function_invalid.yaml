# PARTICIPATION.Function_valid — the guarded half of the participation
# terminology rules, which the sibling mode case cannot reach.
#
# THE INVARIANT IS CONDITIONAL, verbatim (RM common
# UML/classes/org.openehr.rm.common.participation.adoc §Invariants):
# "__Function_valid__: `function.generating_type.is_equal ("DV_CODED_TEXT")
# implies terminology (Terminology_id_openehr).has_code_for_group_id
# (Group_id_participation_function, function.defining_code)`". The antecedent is
# the ATTRIBUTE'S RUNTIME TYPE: `function` is declared `DV_TEXT` (1..1) and the
# class table says it "should be coded, but cannot be limited to the
# HL7v3:ParticipationFunction vocabulary", so a PLAIN `DV_TEXT` function — what
# every other minimal_event.v1 commit carries, and the accepting twin of this
# case — is unconstrained and correct. The rule bites only once the value IS a
# `DV_CODED_TEXT`, so THIS fixture tags the node `_type: DV_CODED_TEXT`
# explicitly; a fixture without that tag would prove nothing.
#
# THE FIXTURE'S code is `240`, a REAL openEHR code — of the ATTESTATION REASON
# group (TERM SupportTerminology §Vocabularies). The openEHR
# `participation function` group is published as exactly {253 unknown}, so a
# server that only checked "is this a known openEHR code", or that skipped the
# guarded invariant because the antecedent needed evaluating, accepts it; only
# one that resolves `Group_id_participation_function` refuses.
#
# THE STATUS is the docs text's 422 row (ITS-REST overview
# Requests_and_responses.md §HTTP status codes, verbatim: "The request was
# well-formed but was unable to be followed due to semantic errors") — a
# terminology-binding violation is exactly semantic: every token parses.
id: I_EHR_COMPOSITION.create_composition-participation_function_invalid
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose EVENT_CONTEXT participation carries a DV_CODED_TEXT
  function whose defining_code is no member of the openEHR participation
  function group is rejected 422, and nothing is committed.
description: "Reject an out-of-group coded PARTICIPATION.function (422)"
spec_refs:
  - "RM common §PARTICIPATION (Function_valid — generating_type DV_CODED_TEXT implies group membership)"
  - "TERM SupportTerminology §Vocabularies (participation function)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (422)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.participation_function_out_of_group]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.participation_function_out_of_group}"
    expect: validation_failed
postconditions:
  - { assert: version, count: 0 }        # nothing committed
