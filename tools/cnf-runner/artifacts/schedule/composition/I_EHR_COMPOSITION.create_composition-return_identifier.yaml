# The `Prefer: return=identifier` representation branch of a change-controlled
# write. Decisive docs-text sentences (ITS-REST overview
# Requests_and_responses.md §"Prefer only identifier"): "This is a variant of
# preference that implies minimal response semantics, but with a non-empty
# response body (i.e., the status will be `201 Created` or `200 OK`, never
# `204 No Content`)." and "The response body SHOULD contain only the identifier
# of the affected resource formatted according to the `Accept` request header.
# For example, when `application/json` is requested as above, the response body
# will be a single JSON object with a single `uid` attribute."
#
# One behaviour per case: the same valid COMPOSITION every create case commits,
# distinguished only by the `Prefer` value the return_identifier variant
# binding pins. The two observable facts are asserted: the status is the
# created 201 (never the 204 the minimal preference may answer), and the body
# is the identifier object — `uid` present, and none of the full
# representation's own attributes (`archetype_node_id`, `content`) rendered
# beside it.
id: I_EHR_COMPOSITION.create_composition-return_identifier
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION commit sent with Prefer: return=identifier answers a non-empty
  identifier body at a created status — never 204 No Content — and the body
  carries the affected resource's uid alone.
description: "Prefer: return=identifier honoured on COMPOSITION create"
spec_refs:
  - "ITS-REST overview Requests_and_responses (Prefer only identifier)"
  - "ITS-REST overview Requests_and_responses (Representation details negotiation)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # `Prefer: return=identifier` arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-50) + Requests_and_responses.md §Prefer only identifier
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    variant: return_identifier           # pins Prefer: return=identifier
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created                      # "201 Created or 200 OK, never 204 No Content"
    capture: { version_uid: created.version_uid }
    assert:
      # "a single JSON object with a single `uid` attribute"
      - { assert: field, path: "uid", exists: true }
      # "only the identifier of the affected resource" — not the full representation
      - { assert: field, path: "archetype_node_id", absent: true }
      - { assert: field, path: "content", absent: true }
