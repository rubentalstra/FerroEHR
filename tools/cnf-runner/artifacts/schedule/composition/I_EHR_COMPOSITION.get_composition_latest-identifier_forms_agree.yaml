# The two addressing forms of the same head resource agree.
#
# Derived from the ITS-REST docs text (specifications/docs/overview/
# Resources.md §"Multiple identifiers for the same resource"), not from any
# SUT: "There are circumstances when openEHR resources can be uniquely
# identified by two different identifiers. For example, if a
# VERSIONED_COMPOSITION container has the _versioned_object_uid_ identifier
# `8849182c-82ad-4088-a07f-48ead4180515`, and the latest version is `5` (taken
# from _version_tree_id_), then the COMPOSITION can be accessed using either"
# the **explicit version reference** (the `version_uid` URI) or the **implicit
# latest version reference** (the `versioned_object_uid` URI) — "However, the
# implicit URI will only resolve to the same resource as the explicit versioned
# URI as long as no new versions are created (i.e. the latest version remains
# `5`)."
#
# Both URIs in that section are the SAME endpoint with a different uid form,
# which is exactly how the two bindings realize them
# (I_EHR_COMPOSITION.get_composition_latest on
# `/ehr/{ehr_id}/composition/{versioned_object_uid}`,
# I_EHR_COMPOSITION.get_composition_at_version on
# `/ehr/{ehr_id}/composition/{version_uid}`). Each is already exercised alone;
# what no case asserted until now is the EQUIVALENCE the section states.
#
# Why two versions: the section's own example has a head at version 5, and a
# single-version container cannot discriminate. With v2 as the head, a server
# that resolves the explicit head-version URI to the wrong version (or the
# implicit URI to a non-head version) returns v1 content and fails the content
# check, so the case localizes to the agreement itself.
#
# The section's proviso — the two forms diverge once a NEW version is created —
# is the complement of this law and is already gated by the pair
# I_EHR_COMPOSITION.get_composition_latest (implicit URI follows the head) and
# I_EHR_COMPOSITION.get_composition_version (explicit URI stays on its
# version); this case asserts only the agreement while the head is unchanged.
id: I_EHR_COMPOSITION.get_composition_latest-identifier_forms_agree
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [CompositionOps]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  While no new version intervenes, the implicit versioned_object_uid URI and
  the explicit version_uid URI of the same head version resolve to the
  identical COMPOSITION.
description: "The implicit and explicit identifier forms resolve to the same resource"
spec_refs:
  - "ITS-REST overview Resources.md §Multiple identifiers for the same resource"
  - "ITS-REST overview Resources.md §Identifier types"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_version"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
    capture: { head_version_uid: updated.version_uid }
  - step: 3
    call: get_composition_latest         # the IMPLICIT latest version reference
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v2}", ignoring: server_assigned }
  - step: 4
    call: get_composition_at_version     # the EXPLICIT version reference, same head version
    with: { ehr_id: "${ehr_id}", version_uid: "${head_version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # the same content the implicit URI served in step 3 — "the implicit URI
      # will only resolve to the same resource as the explicit versioned URI as
      # long as no new versions are created", and none has been
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v2}", ignoring: server_assigned }
postconditions:
  - { assert: version, count: 2 }
