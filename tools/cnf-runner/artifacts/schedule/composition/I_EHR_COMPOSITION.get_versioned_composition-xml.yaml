# The canonical-XML RESPONSE branch of get_versioned_composition: the
# VERSIONED_COMPOSITION container read as canonical XML.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to specify
# the expected XML response format. If the service cannot fulfill this aspect of
# the request, it MUST respond with HTTP status code `406 Not Acceptable`.
# Proper header `Content-Type: application/xml` MUST be present in the response
# of the service unless the response has no content body (HTTP status code
# `204`)." The binding's `Content-Type: negotiated` matcher executes that MUST
# against the `Accept` this step sends, and the binding's `ETag`/`Last-Modified`
# matchers are representation-independent.
#
# BODY FLOOR — deliberately weaker than the COMPOSITION rows. The same section's
# "both request payloads and responses MUST conform to the [published XSDs]"
# constrains the CONTENT MODEL, and the published ITS-XML schema does define the
# VERSIONED_OBJECT/VERSIONED_COMPOSITION complexTypes (RM Common.xsd) — but it
# declares NO global element for them (the only globally declared document
# elements are `composition`, `version`, `extract`, `extract_request`,
# `versioned_object` and `items`), so no released sentence assigns this
# response's document ROOT NAME. The row therefore asserts only what the
# release does state: an `application/xml` entity, i.e. an XML document
# (RFC 7303 §3, "application/xml"). Naming a root here would be inventing an
# expectation the release withholds.
#
# §"Data representation" leaves XML support to the service, hence the
# `canonical-xml` format axis.
id: I_EHR_COMPOSITION.get_versioned_composition-xml
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  get_versioned_composition requested with `Accept: application/xml` returns the
  VERSIONED_COMPOSITION container as an XML document typed
  `Content-Type: application/xml`.
description: "Get VERSIONED_COMPOSITION as canonical XML"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "RM common §VERSIONED_OBJECT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json             # precondition only — the XML branch under test is step 2
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_versioned_composition
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      # An XML document entity, nothing more — see the BODY FLOOR note above.
      - { assert: returns, matches: '^\s*<' }
