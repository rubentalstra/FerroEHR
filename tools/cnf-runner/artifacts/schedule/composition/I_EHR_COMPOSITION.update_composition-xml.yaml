# The canonical-XML REQUEST-payload branch of update_composition: the same
# second-version commit as -event, with the new COMPOSITION serialized as
# canonical XML.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "When resources are serialized in **canonical XML** format, both request
# payloads and responses MUST conform to the [published XSDs]" and "A client MAY
# use the header `Content-Type: application/xml` in the requests to specify the
# XML payload format." §"Data representation" leaves XML support to the service
# ("Services MUST support at least one of the openEHR **XML** or **JSON**
# canonical formats"), hence the `canonical-xml` format axis.
#
# The precondition version is committed in canonical JSON so that exactly ONE
# behaviour — the XML update payload — is under test on this row; the If-Match
# realization of `preceding_version_uid` is unchanged (ITS-REST overview
# §If-Match).
id: I_EHR_COMPOSITION.update_composition-xml
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  update_composition with a canonical-XML COMPOSITION request payload creates a
  second VERSION whose stored content equals the canonical-JSON twin of the
  same COMPOSITION.
description: "Update an event COMPOSITION from a canonical-XML payload"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Requests_and_responses.md §If-Match and accidental overwrites"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2.xml, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    format: canonical-json             # precondition only — the XML branch under test is step 2
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    format: canonical-xml              # Content-Type: application/xml on the request body
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2.xml}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (overview §If-Match)
    expect: updated
    capture: { v2_uid: updated.version_uid }
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: version, of: "${v2_uid}", uid_pattern: "${versioned_object_uid}::<system>::2" }
      # Format changed, content did not: the stored resource must equal the
      # canonical-JSON twin of the XML payload, modulo server-assigned.
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v2}", ignoring: server_assigned }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${v2_uid}", change_type: MODIFY }
