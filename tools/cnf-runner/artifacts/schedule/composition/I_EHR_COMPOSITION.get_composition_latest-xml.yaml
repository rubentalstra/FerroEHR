# The canonical-XML RESPONSE branch of get_composition_latest: the latest
# version of a two-version VERSIONED_COMPOSITION, retrieved as canonical XML.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to specify
# the expected XML response format. If the service cannot fulfill this aspect of
# the request, it MUST respond with HTTP status code `406 Not Acceptable`.
# Proper header `Content-Type: application/xml` MUST be present in the response
# of the service unless the response has no content body (HTTP status code
# `204`)." The `Content-Type: negotiated` matcher the binding already declares
# executes exactly that MUST against the `Accept` this step sends.
#
# What the row asserts about the BODY is deliberately the released floor: the
# same section's "both request payloads and responses MUST conform to the
# [published XSDs]" plus the ITS-XML schema's ONE globally declared document
# element for this resource (RM documents/Composition.xsd:
# `<xs:element name="composition" type="COMPOSITION"/>`) fix the document root's
# local name; nothing released fixes a namespace prefix, so the pattern accepts
# any. No `instance_of` assertion is possible or appropriate here — that
# assertion reads the canonical-JSON `_type` self-tag, which the XML
# representation does not carry (the XML typing convention is `xsi:type`).
#
# §"Data representation" leaves XML support to the service ("Services MUST
# support at least one of the openEHR **XML** or **JSON** canonical formats"),
# hence the `canonical-xml` format axis: an XML-less party is not judged here.
id: I_EHR_COMPOSITION.get_composition_latest-xml
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [CompositionOps]
exercises: [Versioning]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  get_composition_latest requested with `Accept: application/xml` returns the
  latest COMPOSITION version as a canonical-XML document typed
  `Content-Type: application/xml`.
description: "Get latest COMPOSITION as canonical XML"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-XML components §RM documents/Composition.xsd (the globally declared `composition` element)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    format: canonical-json             # precondition only — the XML branch under test is step 3
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    format: canonical-json             # precondition only
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (overview §If-Match)
    expect: updated
  - step: 3
    call: get_composition_latest
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, matches: '<([A-Za-z_][A-Za-z0-9_.-]*:)?composition[\s/>]' }
