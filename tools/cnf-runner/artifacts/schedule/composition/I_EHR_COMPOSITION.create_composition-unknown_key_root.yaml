# An undeclared member on the COMPOSITION root is REFUSED, not ignored.
#
# The canonical-JSON reader is strict over the generated RM model: a wire key
# the class does not declare is a refusal naming the path and the offending
# key. Grounded on the released artifacts, in the wire-oracle order —
# ITS-REST overview Resources.md L75 requires an XML payload to validate
# against the ITS-XML schemas, which are wildcard-free (an undeclared element
# cannot validate), and L87 states the same for the JSON encoding at SHOULD
# strength; openEHR's own published ITS-JSON schemas close 128 of their 134
# object definitions with `additionalProperties: false`. Refusing is the only
# reading under which the JSON and XML encodings share ONE data model.
# Enforcing at a SHOULD anchor is our own decision, recorded at the reader and
# reported upstream as the two-artifact contradiction it exposes (#1696).
#
# Derived from the RM class attribute set + the ITS-REST status table, never
# from a SUT. The payload is cnf.composition.minimal_event.v1 (the committed,
# SUT-accepted valid twin) with ONE undeclared member added at the ROOT —
# one defect, one case; the nested-position sibling is
# `create_composition-unknown_key_nested`.
id: I_EHR_COMPOSITION.create_composition-unknown_key_root
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose ROOT carries a member the RM does not declare is
  rejected, and nothing is committed.
description: "Reject an undeclared member on the COMPOSITION root"
spec_refs:
  - "ITS-REST overview Resources.md §XML Format / §JSON Format (the payload must validate against the published ITS schemas)"
  - "RM ehr §COMPOSITION (org.openehr.rm.composition.composition.adoc §Attributes)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.unknown_key_root]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.unknown_key_root}" }
    expect: bad_request
postconditions:
  - { assert: version, count: 0 }        # nothing committed
