# The RELEASED version read of a version this repository did NOT create.
#
# RM common master06-change_control_package.adoc §Copying fixes what the
# receiver holds: "An `IMPORTED_VERSION` instance is then created, its `_item_`
# set to the received `ORIGINAL_VERSION`, and it is committed in the normal way
# (i.e. as part of a Contribution)", while "the `ORIGINAL_VERSION` instance is
# never modified - it remains a faithful copy of its original". So one version
# resource carries TWO acts of committal: the wrapper's own (this repository's
# import) and the wrapped original's (the source system's), and the read must
# keep them apart.
#
# The read is the SUBJECT here; the import is precondition state
# (`requires.import`), because the import route is an EXTENSION this product
# serves and the released read is not (the realization-scope law: a case whose
# subject is a released operation must not evidence an extension one).
#
# The served IMPORTED_VERSION shape is adjudicated in register AMB-198: the RM
# types `uid`, `preceding_version_uid`, `lifecycle_state` and `data` as
# `(effected)` FUNCTIONS over `item` — not serialized attributes — and ITS-XML
# agrees (`IMPORTED_VERSION` extends `VERSION` with `item` alone), so a served
# wrapper carries no top-level `data`; the assertions below pin exactly that.
#
# The Last-Modified DERIVATION rides on the same split: ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" says the value "should
# be derived from `VERSION.commit_audit.time_committed.value`", and the VERSION
# served here is the WRAPPER — whose commit_audit is the local import, never
# the source system's committal the fixture carries. The header's presence and
# the ETag's weak form are asserted by the binding's own matchers on every row;
# the body facts they must be derived from are asserted here.
id: I_EHR_COMPOSITION.get_versioned_composition-imported_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps, EhrExtract]
profiles: [CORE]
ambiguities: [AMB-198]
test_purpose: >-
  The released version read of an imported COMPOSITION version serves an
  IMPORTED_VERSION wrapping the received ORIGINAL_VERSION verbatim, with the
  local act of committal on the wrapper and the source system's on the wrapped
  original.
description: "Get the IMPORTED_VERSION envelope of a received COMPOSITION version"
spec_refs:
  - "RM common §change_control (master06 §Copying — the IMPORTED_VERSION wrapper; the received ORIGINAL_VERSION is never modified)"
  - "RM common UML/classes/org.openehr.rm.common.imported_version.adoc (§Attributes: item only; §Functions: uid / lifecycle_state / data effected)"
  - "RM common §change_control (master06 §Distributed Versioning — the creating system id of a version)"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
  # master06 §Copying Case 2 — the container lands in the provisioned EHR;
  # mints ${imported_versioned_object_uid} + ${imported_version_uid}
  import:
    extract: cnf.messaging.ehr_extract.imported_composition
    container: X_VERSIONED_COMPOSITION
flow:
  - step: 1
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${imported_versioned_object_uid}"
      version_uid: "${imported_version_uid}"
    expect: ok
    assert:
      # the discriminator: a received version is not served as a local one
      - { assert: instance_of, rm_type: IMPORTED_VERSION }
      # AMB-198: the wrapper's serialized state is item + its own provenance
      - { assert: field, path: "data", absent: true }
      - { assert: field, path: "uid", absent: true }
      - { assert: field, path: "lifecycle_state", absent: true }
      # the wrapped original, verbatim: its identity, its lifecycle, its content
      - { assert: field, path: "item/_type", equals: "ORIGINAL_VERSION" }
      - { assert: field, path: "item/uid/value", equals: "${imported_version_uid}" }
      - { assert: field, path: "item/lifecycle_state/defining_code/code_string", equals: "532" }
      - { assert: field, path: "item/data/_type", equals: "COMPOSITION" }
      # the provenance split: the source system's committal stays on the
      # wrapped original ...
      - { assert: field, path: "item/commit_audit/system_id", equals: "cnf.source.openehr.org" }
      - { assert: field, path: "item/commit_audit/time_committed/value", equals: "2026-07-20T08:00:00Z" }
      # ... while the wrapper carries THIS repository's act of committal, which
      # is what Last-Modified must be derived from
      - { assert: field, path: "commit_audit/system_id", equals: "${ixit:system_id}" }
      - { assert: field, path: "commit_audit/time_committed/value", not_equals: "2026-07-20T08:00:00Z" }
      # each has its own CONTRIBUTION (imported_version.adoc: "providing
      # imported versions with their own audit trail and Contribution,
      # distinct from those of the imported ORIGINAL_VERSION")
      - { assert: field, path: "item/contribution/id/value", equals: "b71c9e04-2a58-4d63-8f19-6c0a37e2d915" }
      - { assert: field, path: "contribution/id/value", not_equals: "b71c9e04-2a58-4d63-8f19-6c0a37e2d915" }
