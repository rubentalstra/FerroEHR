# The canonical-XML RESPONSE DOCUMENT of a VERSION read: the root element the
# published XSDs declare for the resource, qualified with a published openEHR
# ITS-XML target namespace, AND naming its concrete class with `xsi:type`.
#
# DECISIVE RELEASED SENTENCE (ITS-REST overview `Resources.md` §"XML Format"):
# "When resources are serialized in **canonical XML** format, both request
# payloads and responses MUST conform to the [published XSDs]." Conforming to a
# schema is not satisfied by matching a complexType; the instance's root must be
# a globally declared element of the schema set, and — where that element's
# declared type is ABSTRACT — the instance must additionally select a
# non-abstract derived type, because XML Schema Part 1 forbids an element
# instance from using an abstract type directly: "the `xsi:type` attribute …
# allows an element to explicitly assert its type" and an abstract type "cannot
# be used as the {type definition} of an element information item"
# (https://www.w3.org/TR/xmlschema-1/#xsi_type, §2.6.1 + §3.4.6).
#
# WHAT THE SCHEMAS DECLARE for this resource, verified first-hand in BOTH
# vendored bundles: one document element, over an abstract type —
# `<xs:element name="version" type="VERSION"/>` above
# `<xs:complexType name="VERSION" abstract="true">`
# (nsv1 `ALL/Version.xsd`; nsv2 `RM/latest/documents/Version.xsd` declares the
# element and `RM/latest/Common.xsd` the abstract type). `ORIGINAL_VERSION` and
# `IMPORTED_VERSION` are complexTypes DERIVED from `VERSION` and NEITHER has a
# document element of its own, in either lineage. So the conforming response to
# a version read is `<version … xsi:type="ORIGINAL_VERSION">` — the concrete
# class reaches the wire through the attribute, never through a root element
# named after the subtype.
#
# WHY THIS IS ITS OWN CASE, next to I_EHR_COMPOSITION.get_versioned_composition-xml
# (which asserts only that the CONTAINER read answers with an XML entity — that
# resource has no published document element at all, register AMB-167). This row
# is about the version SUB-RESOURCE, which AMB-167 classifies as DOCUMENTED:
# "every VERSION sub-resource read of any container (`version`, whose
# ORIGINAL_VERSION.data is `xs:anyType`, so the payload type is unconstrained)".
# A DOCUMENTED resource needs no ICS option — what an offered XML response must
# conform to is released, not statement-declared.
#
# WHICH LINEAGE is deliberately NOT asserted: ITS-XML publishes the v1 and v2
# namespaces as two bundles of otherwise identical declarations and no released
# ITS-REST sentence assigns one to the wire (register AMB-169), so
# `openehr-published` is the assertion — either published target namespace
# conforms, an absent or foreign one does not. The `xsi:type` QName is judged the
# same way: the ITS-XML complexTypes are declared in each schema's own
# `targetNamespace`, so the type name resolves into the lineage the root is in.
#
# §"Data representation" still leaves the OFFER to the service ("Services MUST
# support at least one of the openEHR **XML** or **JSON** canonical formats for
# resource representation"), which is the `canonical-xml` format axis: an
# XML-less party is not judged by this row.
id: I_EHR_COMPOSITION.get_versioned_composition-version_xml_root
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
ambiguities: [AMB-169]                 # which of the two published lineages is served is implementation-defined, so the row asserts neither
test_purpose: >-
  A locally-created COMPOSITION version served as canonical XML is the document
  the published XSDs declare: the root element is `version`, qualified with a
  published openEHR ITS-XML target namespace, and it names its concrete class
  `ORIGINAL_VERSION` with `xsi:type` as an instance of the abstract `VERSION`
  type must.
description: "Canonical-XML version read: published root element, namespace and concrete type"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-XML components §RM documents/Version.xsd (the globally declared `version` element over the abstract VERSION type)"
  - "ITS-XML README.adoc §Releases and IM Versions (the v1/v2 lineages)"
  - "RM common §change_control (master06 §Version and its Subtypes — ORIGINAL_VERSION and IMPORTED_VERSION are the concrete VERSION classes)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json             # precondition only — the XML document under test is step 2
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
      version_uid: created.version_uid
  - step: 2
    call: get_versioned_composition
    variant: version
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: xml_root, name: version, namespace: openehr-published, xsi_type: ORIGINAL_VERSION }
