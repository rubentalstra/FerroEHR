# A CLUSTER with no items is refused: RM data_structures declares
# `CLUSTER.items: List<ITEM>` with multiplicity `1..*`
# (`org.openehr.rm.data_structures.cluster.adoc` §Attributes), and the
# release's own request-body schema says the same — ITS-REST OAS
# `schemas/data_structures/Clstr.yaml` `required: [items]`.
#
# WHICH BRANCH THE REFUSAL TAKES: a body missing a member the release
# declares `required` is invalid CONTENT, so it never becomes a resource.
# `responses/400.yaml` scopes 400 to "syntactically invalid header, parameter
# or content"; `responses/422.yaml` scopes 422 to content that "could be
# converted to a resource" and then fails semantic validation. This body
# cannot be converted — the 400 row.
#
# The payload is the CKM generic-lab-test-result example (the committed valid
# twin) with the single specimen CLUSTER's `items` deleted — one defect.
id: I_EHR_COMPOSITION.create_composition-cluster_no_items
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION containing a CLUSTER without its RM-mandatory 1..* items is
  rejected as invalid content, and nothing is committed.
description: "Reject a CLUSTER with no items (400)"
spec_refs:
  - "RM data_structures §CLUSTER (items: List<ITEM> 1..*)"
  - "ITS-REST OAS schemas/data_structures/Clstr.yaml §required (items)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.ckm.lab_result]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.lab_result.cluster_no_items]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.lab_result.cluster_no_items}" }
    expect: bad_request                   # the `required: [items]` member is absent — the body never converts
    assert:
      - { assert: message_exemplar, text: "information about the errors in the provided COMPOSITION" }
postconditions:
  - { assert: version, count: 0 }        # nothing committed
