# Deleting a COMPOSITION whose trunk head is ALREADY the 523|deleted| version:
# there is nothing left to delete, so the repeat is refused as a client error.
#
# The addressed identifier is the head — the uid the FIRST delete's ETag
# returned (AMB-75: the 204 carries the new deleted version's uid) — so this
# is neither a miss (404) nor a not-latest conflict (409): the request is
# well-formed, addresses the current state, and asks for a transition that has
# already happened. ITS-REST overview Requests_and_responses.md §HTTP status
# codes assigns that residue to 400: "Status code `400` indicates normally a
# bad request, as well as a generic client-side error, used when no other
# `4xx` error code is appropriate. The client SHOULD NOT repeat the request
# without modifications."
#
# RM common master06 §Logical Deletion is what makes the state final: the
# delete "create[s] a new Version in the normal way", deletes its data and
# sets `_lifecycle_state_` to deleted — deleting that version again would
# commit a second data-less version over a data-less one, adding nothing the
# medicolegal record can use.
#
# The repeat deliberately addresses the NEW deleted version (not the original
# v1 uid, which would be the 409 not-latest branch the sibling case covers),
# so a red row here names the already-deleted branch alone.
id: I_EHR_COMPOSITION.delete_composition-already_deleted
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.delete_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-75]
test_purpose: >-
  A second delete_composition addressing the version the first delete created
  is refused as a client error and commits no further version.
description: "Delete an already-deleted COMPOSITION"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "SM openehr_platform §I_EHR_COMPOSITION.delete_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }   # AMB-75: the ETag names the NEW deleted version
  - step: 3                              # the head is already 523|deleted|
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${deleted_uid}" }
    expect: already_deleted
postconditions:
  # the refused repeat added nothing: the created version + the one delete
  - { assert: version, count: 2 }
  - { assert: version, of: "${deleted_uid}", change_type: DELETED, lifecycle_state: "openehr::523|deleted|" }
