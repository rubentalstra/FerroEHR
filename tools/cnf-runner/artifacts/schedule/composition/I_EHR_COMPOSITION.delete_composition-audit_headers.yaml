# A DELETE is a commit on a change-controlled resource, so the committal
# request headers are accepted and merged there too.
#
# Derived from the ITS-REST docs text (Requests_and_responses.md
# §"openehr-version and openehr-audit-details"), not from any SUT:
#   "services MUST also allow PUT, POST and DELETE methods directly on these
#   change-controlled resources. However, these operations MUST internally be
#   executed using the 'native' way." and "services MUST accept
#   openehr-version and openehr-audit-details custom request headers."
# The delete commits a 523|deleted| VERSION (RM common master06 §Logical
# Deletion) whose AUDIT_DETAILS carries the supplied description/committer.
id: I_EHR_COMPOSITION.delete_composition-audit_headers
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.delete_composition
capabilities: [Versioning]
exercises: [CompositionOps, ChangeSets]
profiles: [CORE]
test_purpose: >-
  A DELETE carrying openehr-audit-details merges the supplied description and
  committer into the 523|deleted| commit audit.
description: "DELETE accepts and merges committal headers"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "SM openehr_platform §I_EHR_COMPOSITION.delete_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_composition
    variant: audit_headers
    with:
      ehr_id: "${ehr_id}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }
  - step: 3
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${deleted_uid}"
    expect: ok
    assert:
      - { assert: field, path: "commit_audit/change_type/defining_code/code_string", equals: "523" }
      - { assert: field, path: "commit_audit/description/value", equals: "retracted per patient request" }
      - { assert: field, path: "commit_audit/committer/name", equals: "Dr Chart" }
postconditions:
  - { assert: version, count: 2 }
