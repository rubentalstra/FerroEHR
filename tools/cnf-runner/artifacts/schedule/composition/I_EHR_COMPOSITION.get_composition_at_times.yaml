# Get at time across several times over a VERSIONED_COMPOSITION with two
# versions committed at t0 and t1 (t0 < t1): before t0 -> no version (error);
# between t0 and t1 -> the version committed at t0; after t1 -> the version
# committed at t1. The commit instants are captured; the closed temporal forms
# fix the queried instants.
# Schedule heading "get_composition_at_times" maps to the resolvable SM
# operation get_composition_at_time (AMB-49, the AMB-13 rule — official id unchanged).
id: I_EHR_COMPOSITION.get_composition_at_times
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  get_composition_at_time returns no version before the first commit, the first
  version between the two commits, and the second version after the second
  commit.
description: "Get existing COMPOSITION at time, cover different times"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_time"
  - "CNF platform_test_schedule master07 §get_composition_at_times"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
      t0: created.commit_time
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (AMB-3)
    expect: updated
    capture: { t1: updated.commit_time }
  - step: 3
    call: get_composition_at_time
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}", a_time: "${time:before(t0)}" }
    expect: not_found                     # "the COMPOSITION not existing at that time"
  - step: 4
    call: get_composition_at_time
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}", a_time: "${time:between(t0,t1)}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
  - step: 5
    call: get_composition_at_time
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}", a_time: "${time:after(t1)}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v2}", ignoring: server_assigned }
ambiguities: [AMB-3]
