# A released version read AT A BRANCH version uid — `object_id::system::N.M.K`.
#
# RM common master06-change_control_package.adoc §Version Identification fixes
# the identifier form: an `OBJECT_VERSION_ID` is
# `object_id::creating_system_id::version_tree_id`, and the `VERSION_TREE_ID`
# of a branch version carries the three-part `trunk.branch_number.branch_version`
# form (BASE base_types master05 §Identification: "1.2.1" is the example of a
# branch identifier). §Semantics in Distributed Systems is what puts one in a
# received tree at all: "branching version identifiers [are] used when local
# modifications are made to versions copied from elsewhere", by a system that
# is not this one.
#
# ITS-REST overview `Resources.md` §Resource identification makes such a
# version addressable on the wire: a VERSION is retrieved by its `version_uid`,
# "the explicit version reference", with no restriction to trunk positions. So
# a branch uid is a legitimate path segment and the read must serve THAT
# version — not the trunk tip, and not a 404.
#
# The branch is precondition state (`requires.import` of a CLOSED trunk+branch
# extract — the branch's preceding trunk version travels with it), because
# nothing on the released write wire can create a branch: a local commit always
# continues the trunk.
id: I_EHR_COMPOSITION.get_versioned_composition-branch_version_uid
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps, EhrExtract]
profiles: [CORE]
test_purpose: >-
  The released version read addressed with a BRANCH version uid
  (object_id::system::N.M.K) serves that branch version, distinct from the
  trunk version it descends from.
description: "Get a COMPOSITION version by its branch version_uid"
spec_refs:
  - "RM common §change_control (master06 §Version Identification — object_id::creating_system_id::version_tree_id)"
  - "RM common §change_control (master06 §Semantics in Distributed Systems — branch identifiers for versions modified elsewhere)"
  - "BASE base_types §identification (master05 — VERSION_TREE_ID trunk.branch_number.branch_version)"
  - "ITS-REST overview Resources §Resource identification (the explicit version reference)"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
  # mints ${imported_version_uid} (the trunk ::1) and
  # ${imported_branch_version_uid} (the branch ::1.1.1 descending from it)
  import:
    extract: cnf.messaging.ehr_extract.branch_read
    container: X_VERSIONED_COMPOSITION
flow:
  - step: 1
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${imported_versioned_object_uid}"
      version_uid: "${imported_branch_version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: IMPORTED_VERSION }
      # the addressed version, at its branch position — not the trunk tip
      - { assert: field, path: "item/uid/value", equals: "${imported_branch_version_uid}" }
      - { assert: field, path: "item/uid/value", not_equals: "${imported_version_uid}" }
      # the branch was made by a DIFFERENT creating system (§Distributed
      # Versioning: the branching system records its own id)
      - { assert: field, path: "item/commit_audit/system_id", equals: "cnf.branchsys.openehr.org" }
      # a branch descends from the version it was taken off
      - { assert: field, path: "item/preceding_version_uid/value", equals: "${imported_version_uid}" }
  - step: 2                              # the trunk position is still its own version
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${imported_versioned_object_uid}"
      version_uid: "${imported_version_uid}"
    expect: ok
    assert:
      - { assert: field, path: "item/uid/value", equals: "${imported_version_uid}" }
      - { assert: field, path: "item/commit_audit/system_id", equals: "cnf.source.openehr.org" }
