# Get at version on a non-existent EHR errors on the missing EHR (404 not_found).
id: I_EHR_COMPOSITION.get_composition_version-bad_ehr
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_version
capabilities: [Versioning]
profiles: [CORE]
test_purpose: >-
  get_composition_at_version on a random ehr_id and version id when no EHRs
  exist is rejected as not found (the EHR does not exist).
description: "Get COMPOSITION at version, EHR doesn't exist"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_version"
  - "CNF platform_test_schedule master07 §get_composition_version-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The system doesn't have any EHRs"
flow:
  - step: 1
    call: get_composition_at_version
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      version_uid: "22222222-2222-4222-8222-222222222222::cnf.example.org::1"
    expect: not_found                     # "error related to the non-existent EHR"
