# The DELETE addresses a version that EXISTS but is no longer the latest: the
# delete is refused, and the refusal names the version that IS latest.
#
# The addressed identifier is not a miss — it is a live version of the very
# container being addressed — so the not-found family cannot apply: ITS-REST
# overview Requests_and_responses.md §HTTP status codes reserves 404 for "The
# origin service did not find the target resource or is not willing to
# disclose that one exists", while the row that describes this exchange is
# 409: "Indicates that the request could not be processed because it might
# generate a duplicate or a conflict". Deleting a superseded version would
# fork the version trunk RM common master06 §change_control defines — the
# conflict is real, not a naming quibble.
#
# The ETag on the refusal is the same lost-update courtesy the overview
# attaches to a failed precondition (§ETag and Last-Modified: the value
# "changes as soon as the resource changes (i.e. when a new version is
# created)"), so the client can retry against the current state; the binding's
# `latest-version-uid` matcher compares it against the version step 2 created.
#
# Staleness is manufactured in-flow: step 1 creates v1, step 2 commits v2, and
# step 3 addresses v1 — a version that exists and is not the head.
id: I_EHR_COMPOSITION.delete_composition-not_latest_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.delete_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-77]                    # the SM interface declares no counterpart for this wire conflict (editorial, #1521)
test_purpose: >-
  delete_composition addressing an existing but superseded version is refused
  as a conflict carrying the latest version uid, and deletes nothing.
description: "Delete a COMPOSITION addressing a version that is not the latest"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "RM common §change_control (master06 — the version trunk and its head)"
  - "SM openehr_platform §I_EHR_COMPOSITION.delete_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # v2 — v1 is now a superseded, still-existing version
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3                              # address v1, which is not the head
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: conflict
postconditions:
  # nothing was deleted: the two committed versions, and no 523|deleted| third
  - { assert: version, count: 2 }
  - { assert: version, of: "${v2_uid}", change_type: MODIFY }
