# Create an event COMPOSITION referencing an OPT that is not on the server:
# rejected with information about the non-existent OPT. No template is
# provisioned, so the composition's referenced OPT (cnf.absent_template.v99) is absent.
id: I_EHR_COMPOSITION.create_composition-event_bad_opt
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  create_composition whose COMPOSITION references an OPT absent from the server
  is rejected: the referenced OPT does not exist.
description: "Create new event COMPOSITION, referenced OPT doesn't exist"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "CNF platform_test_schedule master07 §create_composition-event_bad_opt"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, but NO OPT is provisioned — mints ${ehr_id}
data_sets: [cnf.composition.unknown_template]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.unknown_template}" }
    expect: template_not_found            # "information about the non-existent OPT"
    assert:
      - { assert: message_exemplar, text: "information about the non-existent OPT" }
