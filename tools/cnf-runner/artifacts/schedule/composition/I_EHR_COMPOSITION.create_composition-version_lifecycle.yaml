# A client-supplied VERSION.lifecycle_state travels through the
# `openehr-version` committal header and survives to the persisted
# ORIGINAL_VERSION.
#
# Derived from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"), not from any SUT:
#   "In order to allow clients to provide committal metadata, services MUST
#   accept `openehr-version` and `openehr-audit-details` custom request
#   headers."; the worked example's first line is
#   `openehr-version: lifecycle_state.code_string="532"`; and
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime."
# The same section pins the value set: "The list of `code_string` values and
# their meaning is specified by the Audit Change Type and Version Lifecycle
# State openEHR terminology vocabularies" (TERM SupportTerminology §Version
# Lifecycle State: 532|complete|, 553|incomplete|, 523|deleted|,
# 800|inactive|, 801|abandoned|).
#
# The supplied code is 553|incomplete| rather than the example's 532, because
# 532 is the DEFAULT: RM common master06-change_control_package.adoc
# §"Incomplete Content" — "Usually content will be committed in the `complete`
# state. However, in some circumstances, e.g. because the author has run out of
# time or due to an emergency, it may be committed as `incomplete`". A case
# supplying 532 could not tell a merging server from one that ignores the
# header; 553 can. `incomplete` is legal on this FIRST commit specifically:
# the same section's transition table lists no `complete` -> `incomplete`
# transition, so the state is authored at creation, never as an update. The
# payload is fully valid content, which the `incomplete` state also admits
# ("In the `incomplete` state, a limited form of invalidity is allowed" — the
# state relaxes lower limits, it never adds requirements).
#
# The sibling case for the DEPRECATED spelling of the same header is
# I_EHR_COMPOSITION.create_composition-version_bare_deprecated; the sibling for
# the other committal header of the section is
# I_EHR_COMPOSITION.update_composition-audit_amendment.
id: I_EHR_COMPOSITION.create_composition-version_lifecycle
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [Versioning]
exercises: [CompositionOps, ChangeSets]
profiles: [CORE]
test_purpose: >-
  A client-supplied lifecycle_state of 553|incomplete| on the `openehr-version`
  committal header is merged into the committed VERSION instead of being
  overwritten by the 532|complete| default.
description: "Commit a COMPOSITION with a client-supplied VERSION lifecycle_state"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (ORIGINAL_VERSION.lifecycle_state; Incomplete Content)"
  - "TERM SupportTerminology §Version Lifecycle State"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    variant: version_lifecycle           # sends openehr-version: lifecycle_state.code_string="553"
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
      lifecycle_state: "553"             # 553|incomplete| — the non-default code (TERM §Version Lifecycle State)
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "553" }
