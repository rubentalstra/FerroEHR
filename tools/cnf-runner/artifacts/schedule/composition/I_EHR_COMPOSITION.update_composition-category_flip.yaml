# The VERSIONED_COMPOSITION.Persistent_validity refusal twin (RM EHR ch.4,
# issue #2486): every version of one container must share the first
# version's persistence (versioned_composition.adoc §Invariants:
# `for_all v in all_versions | v.is_persistent =
# all_versions.first.data.is_persistent`). The update body is VALID
# standalone (431|persistent| is a composition_category member and the
# category-free template constrains nothing about it), so the cross-version
# flip is the only rejectable defect. The 422 status follows the
# body_uid_mismatch adjudication shape: the payload converts, what fails is
# a semantic rule of the addressed container.
id: I_EHR_COMPOSITION.update_composition-category_flip
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION update that flips the container's persistence — an
  event-category container updated with a persistent-category body — is
  refused, and the container keeps its single version.
description: "Update a COMPOSITION flipping its category across versions"
spec_refs:
  - "RM UML/classes/org.openehr.rm.ehr.versioned_composition.adoc §Invariants (Persistent_validity: for_all v in all_versions | v.is_persistent = all_versions.first.data.is_persistent)"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes (the semantic 422 branch)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.history_open_cat.v1]
  ehr: { commits: none }
data_sets: [cnf.composition.history_open_cat.event, cnf.composition.history_open_cat.persistent]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.history_open_cat.event}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.history_open_cat.persistent}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: validation_failed
postconditions:
  - { assert: version, count: 1 }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
