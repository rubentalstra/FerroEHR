# PARTY_SELF REFERRAL SCHEME 3 — external_ref set on a PARTY_SELF inside the
# EHR content, not only in EHR_STATUS.subject.
#
# WHY THIS CASE EXISTS: RM common master04-generic_package.adoc §"PARTY_SELF and
# Referring to the Patient from the EHR" names THREE schemes for referring to the
# record subject from within the EHR, and closes with "All three schemes are
# supported by the openEHR model, and will probably all find use in different
# settings and EHR deployment types." Two of them already have catalogue
# evidence: scheme 1 ("The external_ref attribute is not set on any instances of
# PARTY_SELF, i.e. nowhere in the EHR") is what every plain composition fixture
# commits, and scheme 2 ("The external_ref attribute is set once only in
# EHR_STATUS._subject_") is the ehr_status.with_subject family. Scheme 3 —
# "Setting the external_ref in every instance of PARTY_SELF; this solution makes
# the patient external_ref visible in every instance of PARTY_SELF, which is
# reasonable in a secure environment, and convenient for copying parts of the
# record around locally" — had none. A server that treated a populated
# PARTY_SELF.external_ref inside content as redundant (dropping it, or refusing
# the composition because "the subject is the EHR's") would pass the whole
# catalogue while rejecting a spec-supported deployment style.
#
# WHAT THE RM REQUIRES: `PARTY_PROXY.external_ref` is `PARTY_REF [0..1]`
# (RM common UML/classes/org.openehr.rm.common.party_proxy.adoc §Attributes) and
# PARTY_SELF adds no constraint on it — master04 §Referring to Demographic
# Entities: "in stricter environments ... `PARTY_PROXY._external_ref_` will be
# non-Void, while in other environments, it will be empty". The reference here is
# a complete PARTY_REF: an `id` OBJECT_ID (HIER_OBJECT_ID), a `namespace`, and a
# `type` of PERSON, which `PARTY_REF.Type_validity` admits (BASE base_types
# UML/classes/org.openehr.base.base_types.party_ref.adoc §Invariants).
#
# WHY THE INTERIOR ENTRY: `ENTRY._subject_` is `1..1 PARTY_PROXY` (RM ehr
# master08-entry_package.adoc §The Entry class), so the ENTRY is where a
# per-instance PARTY_SELF actually occurs in content — below the abstract
# `COMPOSITION.content` slot, which is also where a server that stops applying RM
# rules once it descends into polymorphic content would lose the reference.
#
# One behaviour per case: the commit itself is a plain valid create; every
# assertion is about the external_ref surviving the round trip verbatim.
id: I_EHR_COMPOSITION.create_composition-subject_external_ref
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose interior ENTRY carries a PARTY_SELF subject with a complete
  external_ref PARTY_REF is committed, and that reference — id, namespace and
  type — reads back unchanged at the committed version.
description: "Commit and read back a COMPOSITION whose ENTRY subject is a PARTY_SELF with external_ref"
spec_refs:
  - "RM common §PARTY_SELF and Referring to the Patient from the EHR (the third referral scheme)"
  - "RM common §PARTY_PROXY (external_ref: PARTY_REF, 0..1)"
  - "RM ehr §The Entry class (subject: PARTY_PROXY, 1..1)"
  - "BASE base_types §PARTY_REF (Type_validity)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.subject_external_ref.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.subject_external_ref.v1}"
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2                              # the reference survived the round trip
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # The subject is still a PARTY_SELF — not silently promoted to another
      # PARTY_PROXY subtype because it now carries a reference.
      - { assert: field, path: "content[0]/subject/_type", equals: "PARTY_SELF" }
      # All three parts of the PARTY_REF, verbatim.
      - { assert: field, path: "content[0]/subject/external_ref/id/value", equals: "8f2d5a1e-6b47-4c9d-a3e8-70b1c2d4e6f9" }
      - { assert: field, path: "content[0]/subject/external_ref/id/_type", equals: "HIER_OBJECT_ID" }
      - { assert: field, path: "content[0]/subject/external_ref/namespace", equals: "DEMOGRAPHIC" }
      - { assert: field, path: "content[0]/subject/external_ref/type", equals: "PERSON" }
postconditions:
  - { assert: version, count: 1 }
