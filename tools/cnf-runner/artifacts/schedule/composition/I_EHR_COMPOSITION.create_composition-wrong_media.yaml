# The request-side media-type branch of the canonical COMPOSITION commit: a
# POST that DECLARES a payload media type the endpoint has no representation
# for — `text/plain` — cannot be processed and is refused 415, not with a
# parse or validation error. Decisive docs-text sentence (ITS-REST overview
# Resources.md §JSON Format): "If the service cannot process the request
# payload as JSON format, it MUST respond with HTTP status code `415
# Unsupported Media Type`"; §XML Format states the mirror rule for a payload
# the service cannot process as XML, and §Simplified Formats for the
# simplified types — so no representation of this resource can consume a
# `text/plain` body.
#
# One behaviour per case (the I_DEFINITION_ADL14.upload_opt-wrong_media
# precedent): the body is the same valid canonical COMPOSITION the
# create_composition-event case commits, so only the declared media type
# distinguishes this exchange. Unlike the legacy/deprecated media-type cases
# this one is NOT option-gated: `text/plain` is not among the alternative
# formats Resources.md §Alternative data formats enumerates, so there is no
# implementation-defined branch on which it could be processable.
id: I_EHR_COMPOSITION.create_composition-wrong_media
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION commit declaring an unprocessable payload media type
  (text/plain) is refused as unsupported_media, leaving the EHR untouched.
description: "COMPOSITION commit with a plain-wrong Content-Type"
spec_refs:
  - "ITS-REST overview Resources.md §JSON Format"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 415 Unsupported Media Type)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    variant: wrong_media_type            # sends Content-Type: text/plain on the canonical commit
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: unsupported_media            # Resources.md §JSON Format MUST
