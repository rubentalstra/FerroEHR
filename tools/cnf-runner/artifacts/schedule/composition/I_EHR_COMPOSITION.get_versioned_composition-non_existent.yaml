# Get a VERSIONED_COMPOSITION for a random uid on an EHR without commits:
# negative, the VERSIONED_COMPOSITION does not exist (404 not_found).
id: I_EHR_COMPOSITION.get_versioned_composition-non_existent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
profiles: [CORE]
test_purpose: >-
  get_versioned_composition for a random versioned_object_uid on an EHR without
  commits is rejected: the VERSIONED_COMPOSITION does not exist.
description: "Get non-existent VERSIONED_COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
  - "CNF platform_test_schedule master07 §get_versioned_composition-non_existent"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # "The EHR doesn't have any commits" — mints ${ehr_id}
flow:
  - step: 1
    call: get_versioned_composition
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "11111111-1111-4111-8111-111111111111"
    expect: not_found                     # "the non-existence of the VERSIONED_COMPOSITION"
