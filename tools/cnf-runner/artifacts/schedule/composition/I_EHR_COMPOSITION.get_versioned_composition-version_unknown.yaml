# The negative half of the by-version envelope read: a well-formed
# OBJECT_VERSION_ID that names no version of this VERSIONED_COMPOSITION.
#
# The addressed value has the lexical form ITS-REST overview Resources.md
# §Identifier types fixes — "`object_id :: creating_system_id ::
# version_tree_id`" — so the request is not refused for shape; it is refused
# because RM common versioned_object.adoc's `Pre: has_version_id
# (a_version_uid)` is false. ITS-REST overview Requests_and_responses.md §HTTP
# status codes assigns that state its row: "404 | Not Found | The origin
# service did not find the target resource or is not willing to disclose that
# one exists".
#
# The CONTAINER in the path is real (step 1 created it), so this row isolates
# the version coordinate: an unknown-container 404 is a different case.
id: I_EHR_COMPOSITION.get_versioned_composition-version_unknown
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A versioned-COMPOSITION version read for a well-formed version_uid that
  names no version of the addressed container is refused as not found.
description: "Get COMPOSITION VERSION by an unknown version_uid"
spec_refs:
  - "ITS-REST overview Resources §Identifier types"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §versioned_object (version_with_id / has_version_id)"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "11111111-1111-4111-8111-111111111111::cnf.example.org::1"
    expect: not_found
