# The lower edge of the bare-route at-time branch, pinned to a FIXED instant:
# below the first commit there is no version of this COMPOSITION.
#
# RM common versioned_object.adoc §Functions guards the accessor with
# `Pre: has_version_at_time (a_time)` — below the first commit the
# precondition is false, so there is no VERSION whose data the route could
# serve — and ITS-REST overview Requests_and_responses.md §HTTP status codes
# assigns that state its row: "404 | Not Found | The origin service did not
# find the target resource or is not willing to disclose that one exists".
#
# The sibling get_composition_at_times case walks the same edge with the
# CAPTURED commit instants (`${time:before(t0)}`); this one is the
# clock-independent form: a fixed literal in the extended ISO 8601 shape
# Resources.md §Datetime format requires, deterministic without any capture
# because the runner seeds a freshly composed, empty SUT and every commit in
# the run is later than the year 2000.
id: I_EHR_COMPOSITION.get_composition_at_time-before_first_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  A COMPOSITION at-time read for an instant earlier than the first committed
  version finds no version and is refused as not found.
description: "Get COMPOSITION at time, before the first version"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "ITS-REST overview Resources §Datetime format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_time"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_composition_at_time
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      a_time: "2000-01-01T00:00:00Z"
    expect: not_found
