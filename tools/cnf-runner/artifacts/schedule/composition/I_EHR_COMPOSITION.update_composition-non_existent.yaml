# Update with a random preceding_version_uid: negative, the preceding version
# does not exist (version_not_found). The REST binding realizes
# preceding_version_uid as If-Match (AMB-3); an unknown preceding version is a
# 404 (version_not_found), distinct from a stale one (precondition_failed).
id: I_EHR_COMPOSITION.update_composition-non_existent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
profiles: [CORE]
test_purpose: >-
  update_composition with a random (non-existent) preceding_version_uid is
  rejected: the preceding version does not exist.
description: "Update a non-existing COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
  - "CNF platform_test_schedule master07 §update_composition-non_existent"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
      versioned_object_uid: "11111111-1111-4111-8111-111111111111"
      preceding_version_uid: "11111111-1111-4111-8111-111111111111::cnf.example.org::1"
    expect: not_found                    # unknown PATH uid -> 404 (Requests_and_responses §HTTP status codes; 412 is reserved for a false If-Match condition on an EXISTING resource)             # "the non-existence of the preceding_version_id"
ambiguities: [AMB-3]
