# Get a COMPOSITION at the current time: the latest version, if it exists, is
# returned (master07 NOTE). The commit instant is captured and the query time
# is one instant after it (${time:after(t0)}), which resolves to the latest.
id: I_EHR_COMPOSITION.get_composition_at_time
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  get_composition_at_time at (a time at/after) the current time returns the
  latest COMPOSITION version, whose content matches the committed COMPOSITION.
description: "Get existing COMPOSITION at time"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_time"
  - "CNF platform_test_schedule master07 §get_composition_at_time"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
      t0: created.commit_time
  - step: 2
    call: get_composition_at_time
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      a_time: "${time:after(t0)}"        # "current time" -> the last version
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: equivalent, to: committed, ignoring: server_assigned }
