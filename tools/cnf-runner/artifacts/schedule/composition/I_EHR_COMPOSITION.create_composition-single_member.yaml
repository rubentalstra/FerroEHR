# The ACCEPTING twin of create_composition-duplicate_member: the same body,
# byte-identical except that the repeated `magnitude` member is written ONCE.
# It commits.
#
# WHY THE PAIR IS THE TEST: without this half, a server that refused the
# raw-json body for any other reason — an unsupported media type, a rejected
# byte encoding, a reader that cannot take verbatim bytes at all — would pass
# the refusal case for the wrong reason. Both halves travel the same verbatim
# `raw-json` path (#1725), so the ONLY difference between an accepted and a
# refused request here is the repetition itself.
id: I_EHR_COMPOSITION.create_composition-single_member
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  The byte-identical twin of the repeated-member body, with the member written
  once, is accepted and committed — proving the refusal is about the
  repetition and nothing else about the raw-bytes path.
description: "Deduplicated twin of the repeated-member body is accepted (201)"
spec_refs:
  - "ITS-REST overview Resources §JSON Format"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.single_member]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.single_member}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # it really is stored
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
postconditions:
  - { assert: version, count: 1 }
