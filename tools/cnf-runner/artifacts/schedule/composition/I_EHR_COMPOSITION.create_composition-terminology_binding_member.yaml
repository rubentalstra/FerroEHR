# Commit-time resolution of an archetype CONSTRAINT BINDING, the acceptance
# direction.
#
# BASE docs/architecture_overview/master12-terminology.adoc §"Binding
# Terminology Value-sets to Archetypes": where a terminology is the appropriate
# source of values, "an internal code is defined, in this case an 'ac' code
# ('ac' = archetype constraint), and this is bound to queries to one or more
# external terminologies, whose result would be a (possibly structured) value
# set from that terminology"; the archetype "simply hold[s] an identifier for a
# query; the query itself is defined within a 'terminology query server'". AM
# docs/AOM1.4/master04-constraint_model_package.adoc §Reference Objects states
# the constraint-model half: a CONSTRAINT_REF is "a proxy for a set of
# constraints … expressed in the binding of the constraint reference (e.g.
# 'ac0004') to a query … into an external service (e.g. a terminology
# service)".
#
# So the permitted values at this node are exactly the result of that query,
# and a committed code the query's value set CONTAINS satisfies the constraint.
# This case is the positive ground; its non-member twin is the refusal.
#
# NOT posture-dependent: the binding RESOLVES here, so `fail_on_error` (the
# unresolvable branch, register AMB-172) has nothing to decide — which is why
# this case states only that a reachable server answers for the namespaces.
id: I_EHR_COMPOSITION.create_composition-terminology_binding_member
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [ArchetypeValidation]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose coded value is a MEMBER of the value set bound to the
  template's archetype constraint code is accepted and committed.
description: "Commit accepted: the coded value is in the bound terminology value set"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "BASE architecture_overview §Terminology in openEHR"
  - "AM AOM1.4 §Reference Objects"
  - "ITS-REST ehr §201_Composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.tpl.dv_coded_text_binding_sct]
  ehr: { commits: none }                 # mints ${ehr_id}
  terminology:
    served:
      - "cnf-sct-shaped"                 # the terminology id the ontology binding declares
      - "http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders"
data_sets: [cnf.composition.terminology_binding_sct_member]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.terminology_binding_sct_member}"
    expect: created
    capture:
      version_uid: created.version_uid
    assert:
      - { assert: version, of: "${version_uid}", change_type: CREATE }
postconditions:
  - { assert: version, count: 1 }        # the composition is in the EHR
