# The canonical-XML RESPONSE branch of get_composition_at_version: a known
# VERSION.uid read back as canonical XML.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to specify
# the expected XML response format. If the service cannot fulfill this aspect of
# the request, it MUST respond with HTTP status code `406 Not Acceptable`.
# Proper header `Content-Type: application/xml` MUST be present in the response
# of the service unless the response has no content body (HTTP status code
# `204`)." The binding's `Content-Type: negotiated` matcher executes that MUST
# against the `Accept` this step sends.
#
# The body floor is the same section's XSD sentence plus the ITS-XML schema's
# single globally declared document element for this resource (RM
# documents/Composition.xsd: `<xs:element name="composition" type="COMPOSITION"/>`),
# which fixes the root's local name only.
#
# §"Data representation" leaves XML support to the service, hence the
# `canonical-xml` format axis.
id: I_EHR_COMPOSITION.get_composition_at_version-xml
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_version
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  get_composition_at_version requested with `Accept: application/xml` returns
  the addressed VERSION's COMPOSITION as a canonical-XML document typed
  `Content-Type: application/xml`.
description: "Get COMPOSITION at version as canonical XML"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_version"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-XML components §RM documents/Composition.xsd (the globally declared `composition` element)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json             # precondition only — the XML branch under test is step 2
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: returns, matches: '<([A-Za-z_][A-Za-z0-9_.-]*:)?composition[\s/>]' }
