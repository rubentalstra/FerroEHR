# has_composition on an EHR with no CONTRIBUTIONs, probing a random VERSION.uid,
# returns FALSE — realized as a 404 (not_found) of the version GET.
# "A random VERSION.uid" is a fixed arbitrary OBJECT_VERSION_ID literal that
# cannot exist on an EHR with no commits.
id: I_EHR_COMPOSITION.has_composition-bad_composition
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.has_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  has_composition for a random VERSION.uid on an EHR without commits reports
  the composition does not exist.
description: "Has COMPOSITION, COMPOSITION doesn't exist"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.has_composition"
  - "CNF platform_test_schedule master07 §has_composition-bad_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # "The EHR has no CONTRIBUTIONs" — mints ${ehr_id}
flow:
  - step: 1
    call: has_composition
    with:
      ehr_id: "${ehr_id}"
      version_uid: "11111111-1111-4111-8111-111111111111::cnf.example.org::1"
    expect: not_found                     # negative: "The result must be FALSE"
