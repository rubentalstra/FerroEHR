# Get the VERSIONED_COMPOSITION container of an existing composition; the
# result is a valid VERSIONED_COMPOSITION referencing the VERSION it contains.
# The container is created in-flow so its uid is known.
id: I_EHR_COMPOSITION.get_versioned_composition
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  get_versioned_composition for a known versioned_object_uid returns a valid
  VERSIONED_COMPOSITION object.
description: "Get existing VERSIONED_COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
  - "CNF platform_test_schedule master07 §get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_versioned_composition
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: VERSIONED_COMPOSITION }
