# The miss branch of the COMPOSITION revision-history read: a well-formed
# container id that names no VERSIONED_COMPOSITION, inside an EHR that exists.
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 404 row verbatim): "The
# origin service did not find the target resource or is not willing to disclose
# that one exists." The released OAS assigns the same code to this operation —
# operations/versioned_composition_revision_history.yaml declares '404' ->
# responses/404_unknown_ehr_id_or_versioned_object_uid.yaml.
#
# The selector is well-formed, so nothing here is the malformed-identifier
# branch (register AMB-76): the id is a syntactically valid UUID that was simply
# never minted.
id: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history-unknown_container
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION revision-history read naming a version container that does not
  exist is a miss.
description: "COMPOSITION revision history for an unknown container (404)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }                 # the EHR exists; the container does not
flow:
  - step: 1
    call: versioned_composition_revision_history
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "00000000-0000-4000-8000-0000000005c1"
    expect: not_found
