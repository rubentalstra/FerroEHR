# The `Prefer: return=identifier` branch on a COMPOSITION UPDATE — the very
# exchange the docs text uses as its worked example of the preference.
#
# Decisive docs-text sentences (ITS-REST overview Requests_and_responses.md
# §"Prefer only identifier", whose example request is
# `PUT …/composition/8849182c-…::openEHRSys.example.com::2` with
# `Prefer: return=identifier`): "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`)." and "The
# response body SHOULD contain only the identifier of the affected resource
# formatted according to the `Accept` request header. For example, when
# `application/json` is requested as above, the response body will be a single
# JSON object with a single `uid` attribute." An update creates no resource,
# so the permitted status is the 200 half — never the 204 the default
# `return=minimal` may answer.
#
# "the identifier of the AFFECTED resource" is asserted, not merely the
# presence of a uid: the body's `uid` must be the very version this update
# created, which the response's own ETag names (§ETag and Last-Modified: the
# value "is usually taken from e.g. VERSIONED_OBJECT.uid.value,
# VERSION.uid.value" and "changes as soon as the resource changes (i.e. when a
# new version is created)"). The version-tree coordinate is checked too, so a
# body echoing the PRECEDING version's identifier cannot pass.
#
# `Preference-Applied: return=identifier` appears in the same section's
# response example, but the header itself is a MAY ("The service MAY include a
# `Preference-Applied` header in the response …", §Representation details
# negotiation), and the closed header-matcher vocabulary has no
# if-present-then-equals form — so the binding declares `present?` and the
# value stays the standing `header-preference-applied` wire_surface boundary
# rather than an over-claimed assertion.
id: I_EHR_COMPOSITION.update_composition-return_identifier
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION update sent with Prefer: return=identifier answers a non-empty
  identifier body at 200 — never 204 — and that identifier is the version the
  update created, not the full COMPOSITION.
description: "Prefer: return=identifier honoured on COMPOSITION update"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer only identifier"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: return_identifier           # pins Prefer: return=identifier
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated                      # "201 Created or 200 OK, never 204 No Content"
    capture: { v2_uid: updated.version_uid }
    assert:
      # "a single JSON object with a single `uid` attribute", and it is the
      # identifier of the AFFECTED resource — the version this update created.
      # the docs-text response example is `{ "uid": "8849182c-…::…::3" }` —
      # the bare identifier string, not a nested OBJECT_VERSION_ID object.
      - { assert: field, path: "uid", equals: "${v2_uid}" }
      # "only the identifier of the affected resource" — not the COMPOSITION,
      # whose archetype_node_id is mandatory in any served representation.
      - { assert: field, path: "archetype_node_id", absent: true }
postconditions:
  # the identifier really named the NEW version (…::2), not the preceding one
  - { assert: version, of: "${v2_uid}", uid_pattern: "${versioned_object_uid}::<system>::2" }
