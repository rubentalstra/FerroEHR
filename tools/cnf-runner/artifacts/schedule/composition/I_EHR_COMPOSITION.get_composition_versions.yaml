# Get at version across the two versions of a VERSIONED_COMPOSITION: v1 returns
# the first committed content, v2 returns the second (master07 content check per
# version). The two versions are built in-flow so both version ids are known.
# Schedule heading "get_composition_versions" maps to the resolvable SM
# operation get_composition_at_version.
id: I_EHR_COMPOSITION.get_composition_versions
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_version
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  get_composition_at_version returns the first version's content for version id
  v1 and the second version's content for version id v2.
description: "Get COMPOSITION at version, cover different versions"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_version"
  - "CNF platform_test_schedule master07 §get_composition_versions"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      v1_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${v1_uid}"                  # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${v1_uid}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
  - step: 4
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${v2_uid}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v2}", ignoring: server_assigned }
