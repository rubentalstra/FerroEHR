# has_composition on an existing VERSION returns TRUE. ITS-REST has no
# composition-existence probe, so has_composition is realized as a GET of the
# version (200 = exists); the VERSION to probe is created in-flow so its uid is
# known (the schedule's "CONTRIBUTION with a VERSION with known uid" precondition).
id: I_EHR_COMPOSITION.has_composition
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.has_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  has_composition for an EHR and an existing COMPOSITION VERSION.uid reports
  the composition exists.
description: "Has existing COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.has_composition"
  - "CNF platform_test_schedule master07 §has_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition             # precondition: a CONTRIBUTION with a VERSION of known uid
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: has_composition
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok                            # positive: "The result must be TRUE"
ambiguities: [AMB-48]
