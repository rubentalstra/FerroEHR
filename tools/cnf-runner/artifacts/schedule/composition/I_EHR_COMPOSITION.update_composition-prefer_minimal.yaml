# The `Prefer: return=minimal` verbosity branch of the COMPOSITION update,
# stated explicitly rather than left to the default.
#
# The status comes from register AMB-62's re-adjudication: the docs text states
# two answers for the minimal branch and settles on neither, so the released OAS
# fills the silence per operation family — an UPDATE declares both 200 and 204
# and splits them by preference, `responses/204_version_updated.yaml` reading
# "`204 No Content` is returned when the update operation was successful and the
# `Prefer` header is missing or is set to `return=minimal`". So the update
# answers 204, not the 200-with-a-body its representation sibling answers.
#
# A 204 carries no body, so the new version's identity travels in the entity tag
# alone; step 3 dereferences it, which is what proves the empty answer still
# committed the version.
#
# One behaviour per case: the same valid update the accepted PUT performs,
# distinguished only by the Prefer value the variant binding pins.
id: I_EHR_COMPOSITION.update_composition-prefer_minimal
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [CompositionOps]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-62]
test_purpose: >-
  A COMPOSITION update sent with Prefer: return=minimal answers 204 No Content
  with the new version identity in the ETag, and the version is committed.
description: "Prefer: return=minimal honoured on COMPOSITION update"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: return_minimal              # pins Prefer: return=minimal
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated                      # 204 No Content
    capture: { v2_uid: updated.version_uid }
  - step: 3                              # the empty answer still committed the version the ETag names
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${v2_uid}" }
    expect: ok
postconditions:
  - { assert: version, count: 2 }
