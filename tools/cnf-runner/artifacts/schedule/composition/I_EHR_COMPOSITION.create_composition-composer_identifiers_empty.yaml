# A COMPOSITION whose composer PARTY_IDENTIFIED carries a present-but-empty `identifiers` list is refused at the composition-CREATE seam.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM `UML/classes/org.openehr.rm.common.party_identified.adoc` §Invariants
# states `Identifiers_valid: identifiers /= Void implies not
# identifiers.is_empty` — the attribute is OPTIONAL, so the present-empty
# list is precisely the shape it forbids, so a present-but-EMPTY list is the one shape the bound
# forbids — the way to say "none" is to omit an optional container, never
# to send [].
#
# WHICH BRANCH: a mandatory list cannot be constructed empty, so the body
# never converts to the resource. ITS-REST `responses/400.yaml` scopes 400 to
# "syntactically invalid ... content"; `responses/422.yaml` scopes 422 to
# content that "could be converted to a resource" and then fails semantic
# validation. This body cannot be converted — the 400 row.
#
# The ACCEPTING twin is the populated `identifiers` list on
# cnf.demographic.person.v1 / the composer of cnf.composition.minimal_event.v1.
id: I_EHR_COMPOSITION.create_composition-composer_identifiers_empty
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose composer carries an explicitly empty identifiers list is refused as invalid content, and nothing is committed.
description: "PARTY_IDENTIFIED with an empty identifiers list refused (400)"
spec_refs:
  - "RM common §PARTY_IDENTIFIED (Identifiers_valid)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.composer_identifiers_empty]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.composer_identifiers_empty}" }
    expect: bad_request
postconditions:
  - { assert: version, count: 0 }
