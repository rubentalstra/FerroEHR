# The other half of the deactivated-EHR refusal: the SAME RM rule names
# Compositions first, so the COMPOSITION create must refuse for the same reason
# the directory create does.
#
# The rule is RM, stated outright (RM ehr master04-ehr_package.adoc §EHR Active
# Status): "The `EHR_STATUS._is_modifiable_` attribute is used to indicate
# whether _the contents of an EHR_ are modifiable, and is set to `True` if the
# EHR is considered _active_. An EHR's 'contents' consist of everything other
# than the `EHR_STATUS` object, i.e. its Compositions (Versioned objects
# referred to by the `_compositions_` attribute), its hierarchical Folders …".
#
# SPEC SILENCE on the CODE, adjudicated as AMB-82 (fixed_handling): the
# ITS-REST docs text never mentions `is_modifiable` outside the EHR-creation
# defaults, and no composition operation declares a branch for a deactivated
# EHR. The register's fixed handling is 409, the row ITS-REST overview
# Requests_and_responses.md §HTTP status codes describes as "Indicates that the
# request could not be processed because it might generate a duplicate or a
# conflict".
#
# Two sibling cases, not one, because the rule enumerates two content kinds and
# a server can easily enforce it on one route only — the whole point of the RM
# sentence naming both. Step 4 keeps the refusal honest: the EHR holds no
# COMPOSITION, so the refused create really committed nothing.
id: I_EHR_COMPOSITION.create_composition-ehr_not_modifiable
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [EhrStatus]
profiles: [CORE]
ambiguities: [AMB-82]
test_purpose: >-
  Creating a COMPOSITION in an EHR whose EHR_STATUS.is_modifiable is false is
  refused as a conflict with the EHR's deactivated state, and commits nothing.
description: "Create a COMPOSITION in a deactivated EHR"
spec_refs:
  - "RM ehr §EHR Active Status (master04 — is_modifiable scopes to Compositions and hierarchical Folders)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "SM openehr_platform §I_EHR_STATUS.clear_ehr_modifiable"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_modifiable = true
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status    # the payload the PUT modifies + the If-Match precondition
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2                              # deactivate: is_modifiable -> false
    call: I_EHR_STATUS.clear_ehr_modifiable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: conflict
postconditions:
  - assert: state
    text: >-
      The refused create committed nothing: the deactivated EHR holds no
      COMPOSITION version
  - { assert: version, count: 0 }
