# The `Prefer: return=minimal` verbosity branch of the COMPOSITION create,
# stated explicitly rather than left to the default.
#
# The status/body pair comes from register AMB-62's re-adjudication: the docs
# text states two answers for the minimal branch and settles on neither
# ("typically `201 Created`" is descriptive; "If no response body is returned,
# the service SHOULD use `204 No Content`" is conditional on a fact nothing
# assigns), so the released OAS fills the silence per operation family — a
# CREATE declares one success status and its response file closes "If the
# `Prefer` header is missing or set to `return=minimal`, the body is empty"
# (`responses/201_COMPOSITION.yaml`). Created, with nothing in the body.
#
# The `Location` SHOULD from the docs text (§Prefer minimal — "The response
# SHOULD include a `Location` header pointing to the newly created or updated
# resource") is executed by the variant binding, and step 2 dereferences the
# version identity the empty-bodied response carries: a minimal answer is only
# useful if what it does carry addresses the created resource.
#
# One behaviour per case: the same valid COMPOSITION the accepted create uses,
# distinguished only by the Prefer value the variant binding pins.
id: I_EHR_COMPOSITION.create_composition-prefer_minimal
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-62]
test_purpose: >-
  A COMPOSITION create sent with Prefer: return=minimal answers the created
  status with an empty body and a Location header addressing the new resource.
description: "Prefer: return=minimal honoured on COMPOSITION create"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    variant: return_minimal              # pins Prefer: return=minimal
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created                      # 201 with an empty body
    capture: { version_uid: created.version_uid }
  - step: 2                              # the identity the empty-bodied response carries addresses the COMPOSITION
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
postconditions:
  - { assert: version, count: 1 }
