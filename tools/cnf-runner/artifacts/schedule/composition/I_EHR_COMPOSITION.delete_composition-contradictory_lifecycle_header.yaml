# A DELETE whose committal header names a lifecycle other than `523|deleted|`
# is refused rather than silently overridden.
#
# The header is accepted on this method — ITS-REST overview
# `Requests_and_responses.md` §"openehr-version and openehr-audit-details":
# "services MUST also allow `PUT`, `POST` and `DELETE` methods directly on
# these change-controlled resources" and "services MUST accept
# `openehr-version` and `openehr-audit-details` custom request headers" — and
# the section states the merge as a MUST: "whatever is provided it MUST be
# merged with the default VERSION and `VERSION.audit_details` attributes on
# commit runtime".
#
# That merge cannot be honoured for a non-deleted state, because a DELETE IS
# the logical-deletion procedure and that procedure fixes the state: RM common
# master06 §Logical Deletion — "set the `_lifecycle_state_` value to the code
# for `deleted`". Discarding the supplied value would leave the client
# believing an instruction was followed that was not; the refusal says so.
#
# The code is the SHAPE class the released `400_CONTRIBUTION.yaml` enumerates
# for the commit family — "syntactically invalid header, parameter or content".
# The accepting twins are the sibling delete cases (no lifecycle header at all)
# and step 3 here, which states the `523|deleted|` the operation commits.
id: I_EHR_COMPOSITION.delete_composition-contradictory_lifecycle_header
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.delete_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION delete whose openehr-version header names a lifecycle other
  than 523|deleted| is refused, while the same delete stating 523 succeeds.
description: "Delete a COMPOSITION with a contradictory lifecycle header"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (master06 §Logical Deletion — set the lifecycle_state value to the code for deleted)"
  - "ITS-REST OAS responses/400_CONTRIBUTION.yaml"
  - "SM openehr_platform §I_EHR_COMPOSITION.delete_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      v1_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_composition
    variant: version_lifecycle
    with:
      ehr_id: "${ehr_id}"
      preceding_version_uid: "${v1_uid}"
      lifecycle_state: "532"             # 532|complete| — contradicts the deletion the method performs
    expect: bad_request
  - step: 3                              # the accepting twin: the state the operation does commit
    call: delete_composition
    variant: version_lifecycle
    with:
      ehr_id: "${ehr_id}"
      preceding_version_uid: "${v1_uid}"
      lifecycle_state: "523"
    expect: deleted
postconditions:
  - assert: state
    text: >-
      The refused delete committed nothing: the composition was still live for
      the accepting twin in step 3 to delete
  - { assert: version, count: 2 }
