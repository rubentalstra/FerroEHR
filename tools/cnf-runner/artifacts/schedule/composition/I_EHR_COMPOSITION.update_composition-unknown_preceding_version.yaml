# The third member of the If-Match family on the COMPOSITION PUT, kept apart
# from its two siblings: the URL addresses a container that REALLY EXISTS, and
# the precondition names a version of that container that NEVER existed.
#
#   * -non_existent  — unknown PATH uid            -> 404 (addressing fails first)
#   * -stale_if_match — a version that DID exist and was superseded -> 412
#   * this case      — a version of the right container that never existed -> 412
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "If a service receives this header,
# and the condition evaluates to `false`, it MUST NOT perform the requested
# method. Instead, it MUST respond with HTTP status code `412 Precondition
# Failed`, and SHOULD return also latest `version_uid` in the `ETag` response
# headers." A version_tree_id the container never issued cannot equal its
# current version, so the condition evaluates false and the MUST applies — the
# 404 family stays reserved for an unresolvable PATH id, which this URL is not.
#
# The offered uid is well-formed and correctly shaped for THIS container: it is
# the created container's own object_id with version_tree_id `99` (ITS-REST
# overview Resources.md §Identifier types — "`object_id :: creating_system_id ::
# version_tree_id`", and the object_id "matches the VERSIONED_OBJECT
# identifier"). So nothing about the identifier's SYNTAX can be the reason for
# a rejection; only the condition can.
#
# MUST NOT perform: the postcondition counts versions — the refused PUT
# committed no second one.
id: I_EHR_COMPOSITION.update_composition-unknown_preceding_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION update whose If-Match names a version the addressed container
  never issued is refused as a failed precondition, not as a miss, and commits
  no version.
description: "Update a COMPOSITION with an If-Match naming a version that never existed"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "ITS-REST overview Resources.md §Identifier types"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # the container is real; version 99 of it is not
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${versioned_object_uid}::cnf.example.org::99"
    expect: version_not_found
postconditions:
  # "it MUST NOT perform the requested method" — one version, not two.
  - { assert: version, count: 1 }
