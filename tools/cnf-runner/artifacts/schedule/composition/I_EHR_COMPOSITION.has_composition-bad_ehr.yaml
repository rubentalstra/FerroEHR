# has_composition on a non-existent EHR errors on the missing EHR — realized as
# a 404 (not_found). "A random ehr_id" is a fixed arbitrary UUID literal absent
# on an empty server.
id: I_EHR_COMPOSITION.has_composition-bad_ehr
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.has_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  has_composition on a random ehr_id when no EHRs exist is rejected as not
  found (the EHR does not exist).
description: "Has COMPOSITION on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.has_composition"
  - "CNF platform_test_schedule master07 §has_composition-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "There are no EHRs on the server"
flow:
  - step: 1
    call: has_composition
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      version_uid: "22222222-2222-4222-8222-222222222222::cnf.example.org::1"
    expect: not_found                     # "error related to the non existence of the EHR"
ambiguities: [AMB-48]
