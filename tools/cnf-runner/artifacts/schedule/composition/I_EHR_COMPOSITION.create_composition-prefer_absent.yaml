# The DEFAULT verbosity branch of the COMPOSITION create: NO `Prefer` header at
# all. This is the other half of the minimal branch — the one a client gets by
# saying nothing — and it is the half no case exercised.
#
# DECISIVE DOCS TEXT (ITS-REST overview Requests_and_responses.md
# §Representation details negotiation): "If no `Prefer` header is provided, the
# default behavior is assumed to be `return=minimal`." The released response
# file names both forms in one breath — `responses/201_COMPOSITION.yaml`: "If
# the `Prefer` header is missing or set to `return=minimal`, the body is empty"
# (cited AS the OAS; the docs text assigns the branch no status, register
# AMB-62).
#
# So the assertion is the IDENTITY of the two: this case expects exactly what
# the explicit `-prefer_minimal` sibling expects, from a request that states
# nothing. Running them as separate rows is what makes a server that honours the
# explicit header but not the default visible.
id: I_EHR_COMPOSITION.create_composition-prefer_absent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-62]
test_purpose: >-
  A COMPOSITION create sent with no Prefer header defaults to the minimal
  branch: the created status with an empty body and a Location header.
description: "No Prefer header defaults to return=minimal on COMPOSITION create"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    variant: prefer_absent               # sends NO Prefer header
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created                      # 201 with an empty body — the assumed default
    capture: { version_uid: created.version_uid }
  - step: 2                              # the identity the empty-bodied response carries addresses the COMPOSITION
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
postconditions:
  - { assert: version, count: 1 }
