# The IDENTITY half of the committal system_id rule: the value the server
# defaults into AUDIT_DETAILS.system_id is the server's OWN CONFIGURED system
# identifier, not merely some server-set non-blank token.
#
# The released sentence (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §"openehr-version and openehr-audit-details"):
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime. In particular, when `system_id` is not provided by the
#   client, the server MUST set it to its own configured system identifier."
#
# WHY THIS NEEDS AN IXIT FACT. "its own configured system identifier" is a
# deployment fact, and no released operation discloses it: the System API is a
# one-operation conformance manifest and no response carries the value. So the
# identity half is not derivable from the wire — a case can only check it
# against a value the PARTY declares. `${ixit:system_id}` reads exactly that
# declaration; a party that declares none records this case not-applicable with
# that citation rather than the runner guessing an identifier.
#
# ONE BEHAVIOUR. The checkable-without-a-declaration halves — a client-supplied
# system_id is merged verbatim, and the defaulted value is present, non-blank
# and not the client token — are the sibling case
# I_EHR_COMPOSITION.update_composition-audit_system_id, which stays runnable on
# every party. This case adds only the identity claim, so a party that declares
# the fact gains the assertion and one that does not loses nothing.
id: I_EHR_COMPOSITION.create_composition-audit_system_id_declared
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A commit that supplies no AUDIT_DETAILS system_id carries the server's own
  configured system identifier — the value the party declares its SUT is
  configured with, not merely a non-blank token.
description: "The defaulted commit-audit system_id equals the declared SUT identifier"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (AUDIT_DETAILS.system_id)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the audit-details `system_id` attribute arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECPR-472)
guards:
  - "the identity half is only checkable against a party declaration — no released ITS-REST operation discloses a server's configured system identifier, so a party whose ixit omits system_id records this case not-applicable (ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details states the MUST but no read surface for the value)"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                              # variant-less: NO committal header at all
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      # "the server MUST set it to its own configured system identifier"
      - { assert: field, path: "commit_audit/system_id", equals: "${ixit:system_id}" }
