# The STRUCTURED REQUEST-payload branch of update_composition: a second VERSION
# committed from a Simplified Structured JSON body — the PUT counterpart of the
# POST branch SF-STRUCTURED-commit_roundtrip exercises.
#
# Decisive released sentences:
#  * ITS-REST overview `Resources.md` §"Simplified Formats" — clients and
#    servers "MUST use: … `application/openehr.wt.structured+json` for the
#    Simplified Structured JSON format"; "A client MAY use the header
#    `Content-Type` in the requests to specify the simplified payload format."
#  * ITS-REST overview `Requests_and_responses.md` §openehr-template-id — "The
#    `openehr-template-id` request header MUST be used whenever committing
#    COMPOSITION (via `PUT` or `POST` methods) using a Simplified Format which
#    does not support TEMPLATE_ID value under an equivalent
#    `LOCATABLE.archetype_details.template_id` attribute of contained data."
#  * ITS-REST overview `Requests_and_responses.md` §"If-Match and accidental
#    overwrites" — the `preceding_version_uid` realization is unchanged by the
#    payload format.
#
# The second commit carries the SAME STRUCTURED content as the first: nothing
# released requires a new version's content to differ (RM common
# §change_control types a VERSION's data as the committed content, with no
# distinctness rule), and holding the content fixed isolates the one behaviour
# under test — the update route accepting the STRUCTURED payload and versioning
# it.
#
# Simplified-Format support is SHOULD-level (Resources.md §"Data
# representation"), so the row rides the SimplifiedFormats capability and never
# gates CORE/STANDARD.
id: I_EHR_COMPOSITION.update_composition-structured
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [SimplifiedFormats]
exercises: [CompositionOps, Versioning]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  update_composition with a Simplified Structured JSON request payload and the
  `openehr-template-id` header creates a second VERSION with change_type
  MODIFY.
description: "Update a COMPOSITION from a STRUCTURED payload"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Requests_and_responses.md §openehr-template-id"
  - "ITS-REST simplified_formats master04 §Structured format"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.structured.vitals.minimal]
flow:
  - step: 1
    call: create_composition
    format: wt-structured              # precondition: the container to update; binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.structured.vitals.minimal}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    format: wt-structured              # Content-Type: application/openehr.wt.structured+json on the request body
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.structured.vitals.minimal}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (overview §If-Match)
    expect: updated
    capture: { v2_uid: updated.version_uid }
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: version, of: "${v2_uid}", uid_pattern: "${versioned_object_uid}::<system>::2" }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${v2_uid}", change_type: MODIFY }
