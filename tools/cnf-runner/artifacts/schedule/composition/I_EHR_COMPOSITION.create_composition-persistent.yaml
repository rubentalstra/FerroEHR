# Create the first version of a new persistent COMPOSITION: positive, version 1.
id: I_EHR_COMPOSITION.create_composition-persistent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  create_composition with a valid persistent COMPOSITION compliant with an
  existing persistent OPT creates a first VERSION (version number 1).
description: "Create new persistent COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "CNF platform_test_schedule master07 §create_composition-persistent"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_persistent]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_persistent.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_persistent.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: version, of: "${version_uid}", uid_pattern: "${versioned_object_uid}::<system>::1" }
postconditions:
  - { assert: version, count: 1 }        # "A new persistent COMPOSITION exists in the EHR"
  - { assert: version, of: "${version_uid}", change_type: CREATE }
