# The COMPOSITION revision history after two commits: one REVISION_HISTORY_ITEM
# per committed version, in the order the RM's own postconditions fix, each item
# carrying its version identity and at least one audit.
#
# WHAT THE SERVED RESOURCE MUST BE (RM common
# UML/classes/org.openehr.rm.common.revision_history.adoc §Attributes): `items`
# is a `List<REVISION_HISTORY_ITEM>` at 1..1, and RM common
# UML/classes/org.openehr.rm.common.revision_history_item.adoc §Attributes gives
# each item `version_id: OBJECT_VERSION_ID [1..1]` — "Version identifier for
# this revision" — and `audits: List<AUDIT_DETAILS> [1..1]`, with the invariant
# `Audit_valid: not audits.is_empty` and the Meaning "there will always be at
# least one commit audit".
#
# THE ORDER IS THE RM'S, NOT A CHOICE. The same class table contradicts itself —
# the Purpose row says "The list is in most-recent-first order" while the `items`
# Meaning says "most-recent-last order" — and its two function postconditions
# settle it: `most_recent_version` is `Result.is_equal
# (items.last.version_id.value)` and `most_recent_version_time_committed` is
# `Result.is_equal (items.last.audits.first.time_committed.value)`. The most
# recent item is `items.last`, so the wire is oldest-first. Register AMB-68
# carries that adjudication and its upstream report (UPR-30); this case is what
# pins it on the wire.
#
# ANCHOR: `I_ITS_REST_REVISION_HISTORY` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM declares no
# revision-history operation on any interface. It is pinned in
# NON_SM_REST_OPERATIONS (tools/cnf-runner/src/validate.rs), so the route is
# enumerated by Axis 1 and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the route has no CNF chapter of its own, so the
# case takes the chapter of the resource whose history it serves.
id: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history-two_versions
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-68]
test_purpose: >-
  The VERSIONED_COMPOSITION revision history lists one item per committed
  version, oldest first, each naming its version and carrying a commit audit.
description: "COMPOSITION revision history after two commits"
spec_refs:
  - "RM common §revision_history (items 1..1; the items.last postconditions)"
  - "RM common §revision_history_item (version_id / audits; Audit_valid)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      v1_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # the second revision, so the history has an order to get wrong
    call: I_EHR_COMPOSITION.update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${v1_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: versioned_composition_revision_history
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: REVISION_HISTORY }
      # oldest first — the items.last postconditions (AMB-68)
      - { assert: field, path: "items[0]/version_id/value", equals: "${v1_uid}" }
      - { assert: field, path: "items[1]/version_id/value", equals: "${v2_uid}" }
      - { assert: field, path: "items[2]", absent: true }
      # "there will always be at least one commit audit" (Audit_valid)
      - { assert: field, path: "items[0]/audits[0]/time_committed/value", exists: true }
      - { assert: field, path: "items[1]/audits[0]/time_committed/value", exists: true }
postconditions:
  - { assert: version, count: 2 }
