# The canonical-XML twin of the RELEASED read of a version this repository did
# NOT create: the SAME published document element, discriminated to the other
# concrete class.
#
# DECISIVE RELEASED SENTENCE (ITS-REST overview `Resources.md` §"XML Format"):
# "When resources are serialized in **canonical XML** format, both request
# payloads and responses MUST conform to the [published XSDs]." The schemas
# publish ONE document element for a VERSION —
# `<xs:element name="version" type="VERSION"/>` over
# `<xs:complexType name="VERSION" abstract="true">` (nsv1 `ALL/Version.xsd`;
# nsv2 `RM/latest/documents/Version.xsd` + `RM/latest/Common.xsd`) — and BOTH
# concrete classes extend that abstract type there: `ORIGINAL_VERSION` adds
# `uid`/`data`/`lifecycle_state`/…, `IMPORTED_VERSION` adds `item`. Neither has
# a document element of its own in either lineage, so an instance of the
# abstract type selects its class with `xsi:type`
# (https://www.w3.org/TR/xmlschema-1/#xsi_type, §2.6.1 + §3.4.6).
#
# WHY BOTH TWINS ARE AUTHORED. The attribute is the ONLY thing that tells the
# two responses apart on this wire: same root, same namespace, same operation.
# A server that hard-codes one concrete type into every version document passes
# the ORIGINAL_VERSION row (…-version_xml_root) and serves a wrong-typed —
# schema-INVALID — document for an imported version. RM common master06
# §Copying is what makes the distinction load-bearing: "An `IMPORTED_VERSION`
# instance is then created, its `_item_` set to the received `ORIGINAL_VERSION`,
# and it is committed in the normal way", so the receiver holds a different
# class, not a differently-populated one.
#
# The read is the SUBJECT here; the import is precondition state
# (`requires.import`), because the import route is an EXTENSION this product
# serves and the released read is not (the realization-scope law: a case whose
# subject is a released operation must not evidence an extension one). The JSON
# twin of this read — the served IMPORTED_VERSION shape, adjudicated in register
# AMB-198 — is I_EHR_COMPOSITION.get_versioned_composition-imported_version;
# this row asserts the XML DOCUMENT the same resource is serialized into, and
# nothing else, so a defect localizes to one of the two.
#
# WHICH LINEAGE is deliberately NOT asserted: register AMB-169 — no released
# ITS-REST sentence assigns one of the two published target namespaces to the
# wire, so `openehr-published` accepts either and the `xsi:type` QName is judged
# into that same lineage (the complexTypes are declared in each schema's own
# `targetNamespace`).
#
# §"Data representation" leaves the OFFER to the service, hence the
# `canonical-xml` format axis.
id: I_EHR_COMPOSITION.get_versioned_composition-imported_version_xml_root
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps, EhrExtract]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
ambiguities: [AMB-169]                 # which of the two published lineages is served is implementation-defined, so the row asserts neither
test_purpose: >-
  The released version read of an IMPORTED COMPOSITION version, served as
  canonical XML, is the same published `version` document element as a locally
  created one — naming `IMPORTED_VERSION` with `xsi:type`, since the published
  schemas declare no document element for either concrete VERSION class.
description: "Canonical-XML imported-version read: published root element and concrete type"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-XML components §RM documents/Version.xsd (the globally declared `version` element over the abstract VERSION type; IMPORTED_VERSION extends it with `item`)"
  - "ITS-XML README.adoc §Releases and IM Versions (the v1/v2 lineages)"
  - "RM common §change_control (master06 §Copying — the IMPORTED_VERSION wrapper the receiver commits)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
  # master06 §Copying Case 2 — the container lands in the provisioned EHR;
  # mints ${imported_versioned_object_uid} + ${imported_version_uid}
  import:
    extract: cnf.messaging.ehr_extract.imported_composition
    container: X_VERSIONED_COMPOSITION
flow:
  - step: 1
    call: get_versioned_composition
    variant: version
    format: canonical-xml                # Accept: application/xml on a bodyless read
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${imported_versioned_object_uid}"
      version_uid: "${imported_version_uid}"
    expect: ok
    assert:
      - { assert: xml_root, name: version, namespace: openehr-published, xsi_type: IMPORTED_VERSION }
