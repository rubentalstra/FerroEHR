# A wrong-KIND version uid on the COMPOSITION resource read: the EHR's own
# EHR_STATUS version uid is real, current, and owned by the addressed EHR —
# but it is not a representation of the COMPOSITION resource, so the read is
# the released 404 ("did not find a current representation of the target
# resource"), never a 200 serving the other kind's body. The kind-confusion
# twin on the EHR_STATUS route is
# I_EHR_STATUS.get_ehr_status_at_version-composition_uid_kind_mismatch; found
# live (#2559) as a 200 carrying `"_type":"EHR_STATUS"` from the composition
# route.
id: I_EHR_COMPOSITION.get_composition_at_version-status_uid_kind_mismatch
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_version
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A syntactically valid version uid of ANOTHER RM kind (the EHR's own
  EHR_STATUS) addressed on the COMPOSITION resource is refused not-found,
  never served as the other kind's body.
description: "Get COMPOSITION addressed with an EHR_STATUS version uid"
spec_refs:
  - "ITS-REST specifications/responses/404_unknown_ehr_id_or_uid_based_id.yaml (the target-resource 404 — cited as the OAS; docs text silent)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (the 404 row: 'did not find the target resource')"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_version"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 exists
flow:
  - step: 1                              # the OTHER kind's real, current version uid
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${status_version_uid}" }
    expect: not_found                    # a real uid of the wrong kind is not this resource
