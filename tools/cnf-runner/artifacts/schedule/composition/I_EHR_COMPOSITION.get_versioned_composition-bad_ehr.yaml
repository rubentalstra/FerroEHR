# Get a VERSIONED_COMPOSITION on a non-existent EHR errors on the missing EHR
# (404 not_found).
id: I_EHR_COMPOSITION.get_versioned_composition-bad_ehr
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
profiles: [CORE]
test_purpose: >-
  get_versioned_composition on a random ehr_id when no EHRs exist is rejected as
  not found (the EHR does not exist).
description: "Get VERSIONED_COMPOSITION, EHR doesn't exist"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
  - "CNF platform_test_schedule master07 §get_versioned_composition-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The system doesn't have any EHRs"
flow:
  - step: 1
    call: get_versioned_composition
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      versioned_object_uid: "22222222-2222-4222-8222-222222222222"
    expect: not_found                     # "the non-existence of the EHR"
