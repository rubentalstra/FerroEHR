# Backward compatibility of the DEPRECATED custom-header spellings, template-id
# row. The §"Deprecated headers" table (ITS-REST overview
# Requests_and_responses.md) maps `openEHR-TEMPLATE_ID` -> `openehr-template-id`
# and states: "While the deprecated headers remain available for backward
# compatibility, their use is strongly discouraged." The two names are
# genuinely different HTTP field names — case-insensitive folding turns
# `openEHR-TEMPLATE_ID` into `openehr-template_id`, an underscore where the
# Release-1.1.0 name has a hyphen — so a server reading only the new name
# silently loses the template identity and rejects the commit.
#
# One behaviour per case: the same valid FLAT payload, the same template, the
# only difference being which of the two header names carries the template id.
# The sibling case for the openEHR-AUDIT_DETAILS row is
# I_EHR_COMPOSITION.update_composition-audit_bare_deprecated.
id: I_EHR_COMPOSITION.create_composition-deprecated_template_id
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [SimplifiedFormats]
profiles: [CORE]
test_purpose: >-
  A Simplified-Format COMPOSITION commit that identifies its template under the
  deprecated openEHR-TEMPLATE_ID header name is accepted exactly as one using
  the Release-1.1.0 openehr-template-id name.
description: "Accept the deprecated openEHR-TEMPLATE_ID header name"
spec_refs:
  - "ITS-REST overview Requests_and_responses (Deprecated headers)"
  - "ITS-REST overview Requests_and_responses (openehr-template-id)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat
    variant: deprecated_template_id      # sends openEHR-TEMPLATE_ID instead of openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: created                      # §Deprecated headers: "remain available for backward compatibility"
    capture: { version_uid: created.version_uid }
postconditions:
  - { assert: version, of: "${version_uid}", change_type: CREATE }
