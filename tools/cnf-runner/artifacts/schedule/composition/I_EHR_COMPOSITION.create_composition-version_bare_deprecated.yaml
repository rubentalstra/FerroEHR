# Backward compatibility of the DEPRECATED custom-header spellings,
# openEHR-VERSION row. The §"Deprecated headers" table (ITS-REST overview
# Requests_and_responses.md) maps `openEHR-VERSION` -> `openehr-version` and
# states: "While the deprecated headers remain available for backward
# compatibility, their use is strongly discouraged." What the header carries is
# assigned by §"openehr-version and openehr-audit-details": "whatever is
# provided it MUST be merged with the default VERSION and
# VERSION.audit_details attributes on commit runtime" — so the committal
# lifecycle_state must reach the persisted VERSION under the old spelling too.
#
# Unlike the two deprecated rows already cased
# (I_EHR_COMPOSITION.create_composition-deprecated_template_id and
# I_EHR_COMPOSITION.update_composition-audit_bare_deprecated, whose names fold
# to UNDERSCORE field names and are therefore genuinely different headers),
# `openEHR-VERSION` folds to exactly `openehr-version`: RFC 9110 §5.1 makes
# HTTP field names case-insensitive, so a conformant server reaches the same
# handler. The row is cased rather than assumed because the released table
# makes the old spelling normative, and a server matching custom field names
# case-sensitively drops the committal metadata SILENTLY — the commit still
# succeeds, only with the wrong lifecycle_state, which is exactly what the read
# in step 2 catches.
#
# One behaviour per case: identical to
# I_EHR_COMPOSITION.create_composition-version_lifecycle in every respect
# except which of the two header spellings carries the metadata.
id: I_EHR_COMPOSITION.create_composition-version_bare_deprecated
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [Versioning]
exercises: [CompositionOps, ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committal VERSION metadata supplied under the deprecated openEHR-VERSION
  header name is accepted and merged into the committed VERSION exactly as
  under the Release-1.1.0 openehr-version name.
description: "Accept the deprecated openEHR-VERSION header name"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Deprecated headers"
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "TERM SupportTerminology §Version Lifecycle State"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    variant: version_bare_deprecated     # sends openEHR-VERSION instead of openehr-version
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
      lifecycle_state: "553"             # 553|incomplete| — the non-default code (TERM §Version Lifecycle State)
    expect: created                      # §Deprecated headers: "remain available for backward compatibility"
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "553" }
