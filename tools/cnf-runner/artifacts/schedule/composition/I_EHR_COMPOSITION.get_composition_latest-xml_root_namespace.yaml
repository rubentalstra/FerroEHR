# The canonical-XML RESPONSE DOCUMENT of a COMPOSITION read: its root element
# is the one the published XSDs declare for the resource, AND that root is
# namespace-qualified with a published openEHR ITS-XML target namespace.
#
# DECISIVE RELEASED SENTENCE (ITS-REST overview `Resources.md` §"XML Format"):
# "When resources are serialized in **canonical XML** format, both request
# payloads and responses MUST conform to the [published XSDs]." Conforming to a
# schema is not satisfied by matching a complexType. An instance is valid
# against a schema set only if its ROOT is a globally declared element of that
# set, and the ITS-XML schemas declare their elements inside a target
# namespace with qualified form: RM `documents/Composition.xsd` opens
# `<xs:schema … targetNamespace="http://schemas.openehr.org/v1"
# elementFormDefault="qualified" …>` and declares exactly one document element
# for this resource, `<xs:element name="composition" type="COMPOSITION"/>`
# (the 2.0.0 lineage is the same declaration under `.../v2` — ITS-XML
# README.adoc §"Releases and IM Versions": Release-2.0.0 changed "the internal
# namespace used in the schemas"). So a conforming COMPOSITION response is
# `composition` IN one of those two namespaces — never in no namespace at all.
#
# WHY THIS IS ITS OWN CASE, next to I_EHR_COMPOSITION.get_composition_latest-xml.
# That sibling asserts the root's LOCAL NAME with a text pattern, which a
# document carrying the right name in the WRONG namespace (or in none) passes —
# so the §XML Format MUST above has a half nothing executes. This row asserts
# the missing half on the same released sentence, one behaviour per case, so a
# namespace defect localizes here and a name defect localizes there.
#
# WHICH LINEAGE is deliberately NOT asserted: ITS-XML publishes the v1 and v2
# namespaces as two bundles of otherwise identical schemas and no released
# ITS-REST sentence assigns one to the wire, so the served lineage is
# implementation-defined (register AMB-169). `openehr-published` is therefore
# the assertion — either published target namespace conforms, an absent or
# foreign one does not. The row that DOES pin a lineage is the ICS-gated
# I_EHR_COMPOSITION.get_composition_latest-xml_namespace_v2, judged only
# against a party declaring the selection mechanism.
#
# The COMPOSITION family is the DOCUMENTED case of register AMB-167 — a
# published global element exists — so unlike the EHR / EHR_STATUS / FOLDER /
# PARTY families this row needs no ICS option: what an offered XML response
# must conform to is released, not statement-declared. §"Data representation"
# still leaves the OFFER to the service ("Services MUST support at least one of
# the openEHR **XML** or **JSON** canonical formats"), which is the
# `canonical-xml` format axis: an XML-less party is not judged by this row.
id: I_EHR_COMPOSITION.get_composition_latest-xml_root_namespace
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [CompositionOps]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  A COMPOSITION served as canonical XML is the document the published XSDs
  declare: the root element is `composition` and it is qualified with a
  published openEHR ITS-XML target namespace.
description: "Canonical-XML COMPOSITION read: published root element and namespace"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-XML components §RM documents/Composition.xsd (targetNamespace + the globally declared `composition` element)"
  - "ITS-XML README.adoc §Releases and IM Versions (the v1/v2 lineages)"
applies: { rm: ">=1.0.2" }
ambiguities: [AMB-169]                 # which of the two published lineages is served is implementation-defined, so the row asserts neither
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json             # precondition only — the XML document under test is step 2
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: get_composition_latest
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: xml_root, name: composition, namespace: openehr-published }
