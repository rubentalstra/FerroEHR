# The two Simplified-Format RESPONSE branches of get_composition_latest: the
# latest version of a two-version VERSIONED_COMPOSITION served as FLAT and as
# STRUCTURED. An intrinsic-format case — the format is a fixed role per step —
# on the SF-EXAMPLE-accept_forms precedent.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"Simplified
# Formats"): clients and servers "MUST use: `application/openehr.wt.flat+json`
# for the Simplified Flat JSON format, `application/openehr.wt.structured+json`
# for the Simplified Structured JSON format"; "The client SHOULD use the
# `Accept` request header to specify the expected simplified response format. If
# the service cannot fulfill this aspect of the request, it MUST respond with
# HTTP status code `406 Not Acceptable`. Proper header `Content-Type` MUST be
# present in the response of the service unless the response has no content body
# (HTTP status code `204`)." The binding's `Content-Type: negotiated` matcher
# executes that MUST against the `Accept` each step sends.
#
# The FLAT<->STRUCTURED value equality asserted on step 4 is the released
# conversion guarantee (ITS-REST simplified_formats master04 §"Conversion
# Between Formats") — the same assertion SF-FLAT-commit_roundtrip_ctx_defaults
# and SF-STRUCTURED-commit_roundtrip carry on the at-version read.
#
# Simplified-Format support is SHOULD-level (Resources.md §"Data
# representation": "the **Simplified Formats** format SHOULD be supported"), so
# the row rides the SimplifiedFormats capability and never gates CORE/STANDARD.
id: I_EHR_COMPOSITION.get_composition_latest-simplified_forms
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [SimplifiedFormats]
exercises: [CompositionOps, Versioning]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  get_composition_latest served under each Simplified-Format `Accept` returns
  the latest COMPOSITION version in the negotiated form, with the FLAT and
  STRUCTURED projections carrying equal values.
description: "Get latest COMPOSITION as FLAT and as STRUCTURED"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST simplified_formats master04 §Conversion Between Formats"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    format: canonical-json             # precondition only — the simplified branches are steps 3-4
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    format: canonical-json             # precondition only
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (overview §If-Match)
    expect: updated
  - step: 3
    call: get_composition_latest
    format: wt-flat                    # Accept: application/openehr.wt.flat+json
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    capture: { flat_readback: ok.body }
  - step: 4
    call: get_composition_latest
    format: wt-structured              # Accept: application/openehr.wt.structured+json
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${flat_readback}", ignoring: [] }   # master04 §Conversion Between Formats
