# The upper edge of the bare-route at-time branch: an instant after the newest
# commit still names a version — the newest one — and is answered, not
# refused.
#
# No released text states this: RM common versioned_object.adoc gives only
# `version_at_time (a_time): VERSION` with `Pre: has_version_at_time (a_time)`
# and never says whether a version's extancy interval closes at the next
# commit or runs open-ended. Register AMB-70 carries the adjudicated fixed
# handling this case pins — a version is extant from its own commit instant
# until the next commit, so the newest version is extant at every later
# instant and a future T is a 200, never a 404.
#
# "The newest one" is proved by content, not by trust: two versions are
# committed with different leaf values, and the served COMPOSITION must equal
# the SECOND one (the master07 content check, modulo the operation's
# server-assigned set). The queried instant is a FIXED literal in the extended
# ISO 8601 form Resources.md §Datetime format requires — never a clock
# reading, so two runners query the same instant.
id: I_EHR_COMPOSITION.get_composition_at_time-future
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  A COMPOSITION at-time read for an instant later than every committed version
  serves the newest version rather than refusing the request.
description: "Get COMPOSITION at time, future instant"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "ITS-REST overview Resources §Datetime format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_time"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
  - step: 3
    call: get_composition_at_time
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      a_time: "2099-01-01T00:00:00Z"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v2}", ignoring: server_assigned }
