# The AUDIT_DETAILS.system_id committal rule, both arms, on one server.
#
# Derived from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"), not from any SUT:
#   "Through the `openehr-audit-details` header, clients MAY supply values for
#   the AUDIT_DETAILS attributes `change_type`, `description`, `committer` and
#   `system_id`."
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime. In particular, when `system_id` is not provided by the
#   client, the server MUST set it to its own configured system identifier."
# Two MUSTs, one rule: SUPPLIED is merged verbatim (v2), ABSENT is filled from
# the server's own configuration (v3). Splitting them into separate cases would
# lose the discrimination — the second arm is only checkable against a value
# the first arm establishes cannot be what a conformant server stores.
#
# How the ABSENT arm discriminates: the client token
# `cnf.client.system.example` is, by construction, a client-invented value no
# server has as its "own configured system identifier". A server that leaks the
# previous commit's client-supplied value into the header-less commit therefore
# fails, as does one that stores nothing at all (an absent path fails a
# `not_equals`, and the non-blank pattern rejects an empty identifier).
#
# What this case does NOT claim: WHICH identifier the server is configured
# with. The released ITS-REST surfaces no endpoint from which a client can
# learn a server's configured system id, so the identity half of the MUST is
# not wire-checkable — see the `header-committal-system-id-server-value`
# wire-surface element for that honest boundary.
#
# The sibling cases for the other attributes of the same header are
# I_EHR_COMPOSITION.update_composition-audit_amendment (change_type) and
# I_EHR_COMPOSITION.update_composition-audit_bare_deprecated (description).
id: I_EHR_COMPOSITION.update_composition-audit_system_id
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps, ChangeSets]
profiles: [CORE]
test_purpose: >-
  A client-supplied AUDIT_DETAILS system_id is merged into the committed
  VERSION verbatim, and a later commit that supplies none carries the server's
  own system identifier rather than the earlier client value or nothing.
description: "Merge a client-supplied commit-audit system_id; default it when absent"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (AUDIT_DETAILS.system_id)"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: audit_system_id             # sends openehr-audit-details: system_id="…"
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
      audit_system_id: "cnf.client.system.example"
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      # supplied arm: "whatever is provided it MUST be merged"
      - { assert: field, path: "commit_audit/system_id", equals: "cnf.client.system.example" }
  - step: 4
    call: update_composition             # variant-less: NO committal header at all
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${v2_uid}"
    expect: updated
    capture: { v3_uid: updated.version_uid }
  - step: 5
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v3_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      # absent arm: "the server MUST set it to its own configured system
      # identifier" — never the previous commit's client value …
      - { assert: field, path: "commit_audit/system_id", not_equals: "cnf.client.system.example" }
      # … and never blank: a configured identifier is a token, not emptiness
      - { assert: field, path: "commit_audit/system_id", matches: '^\S' }
postconditions:
  - { assert: version, count: 3 }
