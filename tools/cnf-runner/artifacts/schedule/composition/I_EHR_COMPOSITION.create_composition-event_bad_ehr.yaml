# Create an event COMPOSITION for a non-existent EHR: the OPT exists but the
# EHR does not; rejected with information about the non-existent EHR.
# "A random ehr_id" is a fixed arbitrary UUID literal absent on the server.
id: I_EHR_COMPOSITION.create_composition-event_bad_ehr
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  create_composition with a valid event COMPOSITION for a random ehr_id when no
  matching EHR exists is rejected: the EHR does not exist.
description: "Create new event COMPOSITION, EHR doesn't exist"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "CNF platform_test_schedule master07 §create_composition-event_bad_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]     # "The OPT ... exists on the server"
  ehr: none                              # "The server doesn't have any EHRs" (no EHR minted)
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: not_found                     # "information about the non-existent EHR"
