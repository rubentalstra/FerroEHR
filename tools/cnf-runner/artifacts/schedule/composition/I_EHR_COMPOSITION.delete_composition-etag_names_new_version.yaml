# WHICH version identity the successful delete's ETag carries — the addressed
# (preceding) version, or the 523|deleted| version the delete just created.
#
# SPEC SILENCE, adjudicated as AMB-75 (fixed_handling): no released sentence
# says which. What IS released decides it by construction: RM common master06
# §Logical Deletion makes the delete a COMMIT — "create a new Version in the
# normal way; delete its `_data_`; set the `_lifecycle_state_` value to the
# code for `deleted`; commit in the normal way" — and ITS-REST overview
# Requests_and_responses.md §"ETag and Last-Modified" says the entity tag
# names the resource's current state: it "acts as a unique identifier for a
# specific version of a resource" and "changes as soon as the resource changes
# (i.e. when a new version is created)". After the delete, the current state
# IS the new deleted version, so the ETag names it.
#
# The assertion is structural, not a re-read of the same value: the captured
# ETag identifier must be version 2 of the addressed container
# (`<versioned_object_uid>::<system>::2`), which the addressed v1 uid cannot
# satisfy — so an ETag echoing the addressed version fails the case. The
# lifecycle assertion then confirms the version it names is the deleted one.
id: I_EHR_COMPOSITION.delete_composition-etag_names_new_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.delete_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-75]
test_purpose: >-
  The 204 of a successful delete_composition carries the uid of the NEW
  523|deleted| version the delete committed, not the addressed preceding one.
description: "Delete COMPOSITION: the ETag names the new deleted version"
spec_refs:
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "SM openehr_platform §I_EHR_COMPOSITION.delete_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid          # …::1, the addressed version
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }         # read from the 204's ETag
    assert:
      # the entity tag names version 2 — the version the delete committed —
      # which the addressed …::1 uid cannot be
      - { assert: version, of: "${deleted_uid}", uid_pattern: "${versioned_object_uid}::<system>::2" }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${deleted_uid}", change_type: DELETED, lifecycle_state: "openehr::523|deleted|" }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
