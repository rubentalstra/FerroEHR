# LOCATABLE.Archetype_node_id_valid on a node type outside the
# ENTRY / CLUSTER / ELEMENT set.
#
# RM common UML/classes/org.openehr.rm.common.locatable.adoc §Invariants states
# the rule verbatim: `Archetype_node_id_valid: not archetype_node_id.is_empty`.
# `archetype_node_id` is 1..1 (§Attributes) and LOCATABLE is the root of every
# archetypable RM class (§Description), so the invariant binds EVERY concrete
# descendant — including the ITEM_STRUCTURE family (ITEM_TREE / ITEM_LIST /
# ITEM_SINGLE), which is the data container of every ENTRY. A committed
# COMPOSITION carrying `"archetype_node_id": ""` on such a node asserts a value
# the invariant forbids.
#
# The complementary case to create_composition-root_archetype_id_mismatch (the
# root node-id IDENTITY rule) and create_composition-links_empty (the sibling
# LOCATABLE invariant): this one pins the node-id EMPTINESS rule on an inner
# node, so a server that realizes the invariant only on the node types it
# happens to have hand-written fails it.
#
# DECISIVE DOCS TEXT for the wire (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim): "The
# request was well-formed but was unable to be followed due to semantic
# errors."
#
# One behaviour per case: the payload is cnf.composition.minimal_event.v1 with
# ONE string changed — the EVALUATION.data ITEM_TREE node id emptied.
id: I_EHR_COMPOSITION.create_composition-item_node_id_empty
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose inner ITEM_TREE carries an empty archetype_node_id is
  refused as a semantic error, and nothing is committed.
description: "Reject a COMPOSITION with an empty archetype_node_id on an ITEM_TREE (422)"
spec_refs:
  - "RM common §LOCATABLE (Archetype_node_id_valid: not archetype_node_id.is_empty)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (422)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.item_node_id_empty]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.item_node_id_empty}"
    expect: validation_failed             # overview §HTTP status codes, the 422 row
postconditions:
  - { assert: version, count: 0 }         # nothing committed
