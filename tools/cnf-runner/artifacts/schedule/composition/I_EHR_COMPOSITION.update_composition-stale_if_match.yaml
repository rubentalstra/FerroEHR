# The lost-update guard on the COMPOSITION PUT: an If-Match naming a version
# that is no longer the latest is refused, and the refusal tells the client
# which version IS current.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "If a service receives this header,
# and the condition evaluates to `false`, it MUST NOT perform the requested
# method. Instead, it MUST respond with HTTP status code `412 Precondition
# Failed`, and SHOULD return also latest `version_uid` in the `ETag` response
# headers."
#
# The staleness is manufactured, not assumed: step 1 creates v1, step 2 commits
# v2 with v1's uid as the precondition, and step 3 re-offers that SAME v1 uid —
# now superseded. The binding's `ETag: latest-version-uid` matcher compares the
# returned entity tag against the version step 2 actually created (RM common
# master06 §change_control fixes that uid as an OBJECT_VERSION_ID; BASE
# master05 §Composite Identifiers and Case makes the comparison
# case-insensitive).
#
# "MUST NOT perform": the postcondition counts versions — the refused PUT
# committed no third one.
id: I_EHR_COMPOSITION.update_composition-stale_if_match
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION update whose If-Match names a superseded version is refused
  with a precondition failure carrying the latest version uid, and commits no
  version.
description: "Update a COMPOSITION with a stale If-Match precondition"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # v2 — this is what makes the step-1 uid stale
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3                              # the SAME (now superseded) uid offered as the precondition
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: precondition_failed
postconditions:
  # "it MUST NOT perform the requested method" — two versions, not three.
  - { assert: version, count: 2 }
  - { assert: version, of: "${v2_uid}", uid_pattern: "${versioned_object_uid}::<system>::2" }
