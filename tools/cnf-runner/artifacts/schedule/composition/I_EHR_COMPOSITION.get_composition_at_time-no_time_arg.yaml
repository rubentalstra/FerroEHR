# Get a COMPOSITION at time WITHOUT a time argument: the latest version is
# returned. Built with two versions so "latest" is observable — the retrieved
# content must match the second committed COMPOSITION.
id: I_EHR_COMPOSITION.get_composition_at_time-no_time_arg
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  get_composition_at_time with no time argument returns the latest version of a
  COMPOSITION that has multiple versions.
description: "Get existing COMPOSITION at time, without a given time"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_time"
  - "CNF platform_test_schedule master07 §get_composition_at_time-no_time_arg"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
  - step: 3
    call: get_composition_at_time         # no a_time argument -> latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v2}", ignoring: server_assigned }
