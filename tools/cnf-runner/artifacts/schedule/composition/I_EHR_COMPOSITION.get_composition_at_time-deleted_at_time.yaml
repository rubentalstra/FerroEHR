# The third addressing form of the deleted read, and the ONE the released
# text assigns outright: the bare route with a `version_at_time` at which the
# extant version is the logically deleted one.
#
# The branch itself is not in dispute — the operation's own deleted response
# is textually scoped to exactly this form ("at specified `version_at_time`")
# — and ITS-REST overview Requests_and_responses.md §HTTP status codes gives
# it its meaning: "204 | No Content | The request has been fulfilled and there
# is no additional content to send in the response payload body". There is
# nothing to send because RM common master06 §Logical Deletion deletes the
# version's `_data_`.
#
# The queried instant is the delete's own commit window, advanced by the
# closed temporal form `${time:after(t_del)}`, so the extant version at T is
# the deleted one by the AMB-70 extancy handling (a version is extant from its
# commit instant until the next commit; nothing follows the delete here).
# Registered under AMB-74 too: the sibling explicit-version and
# implicit-latest forms resolve the same way, and this case is the anchor the
# other two are read against.
id: I_EHR_COMPOSITION.get_composition_at_time-deleted_at_time
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-70, AMB-74]
test_purpose: >-
  A bare-route COMPOSITION read at a time whose extant version is a logically
  deleted version is fulfilled with no content.
description: "Get COMPOSITION at a time whose version is deleted"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources §Datetime format"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "RM common §versioned_object (version_at_time)"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_time"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { t_del: deleted.commit_time }
  - step: 3                              # an instant at which the deleted version is the extant one
    call: get_composition_at_time
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      a_time: "${time:after(t_del)}"
    expect: ok_empty
