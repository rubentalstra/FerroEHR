# The DEFAULT verbosity branch of the COMPOSITION update: NO `Prefer` header at
# all — the update half of the default-when-absent behaviour.
#
# DECISIVE DOCS TEXT (ITS-REST overview Requests_and_responses.md
# §Representation details negotiation): "If no `Prefer` header is provided, the
# default behavior is assumed to be `return=minimal`." The released response
# file names both forms in one breath —
# `responses/204_version_updated.yaml`: "`204 No Content` is returned when the
# update operation was successful and the `Prefer` header is missing or is set
# to `return=minimal`" (cited AS the OAS; the docs text assigns the branch no
# status, register AMB-62).
#
# So the assertion is the IDENTITY of the two: this case expects exactly what
# the explicit `-prefer_minimal` sibling expects, from a request that states
# nothing — and a server that honours the explicit header but silently returns a
# representation on the default is a distinct red row rather than a hidden one.
id: I_EHR_COMPOSITION.update_composition-prefer_absent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [CompositionOps]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-62]
test_purpose: >-
  A COMPOSITION update sent with no Prefer header defaults to the minimal
  branch: 204 No Content with the new version identity in the ETag.
description: "No Prefer header defaults to return=minimal on COMPOSITION update"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: prefer_absent               # sends NO Prefer header
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated                      # 204 No Content — the assumed default
    capture: { v2_uid: updated.version_uid }
  - step: 3                              # the empty answer still committed the version the ETag names
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${v2_uid}" }
    expect: ok
postconditions:
  - { assert: version, count: 2 }
