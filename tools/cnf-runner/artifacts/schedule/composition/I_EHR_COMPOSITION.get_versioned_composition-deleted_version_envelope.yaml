# The other side of the deleted read: the VERSION-envelope route still serves
# the deleted version in full — uid, commit_audit, lifecycle_state — with only
# the data gone.
#
# SPEC SILENCE, adjudicated as AMB-74 (fixed_handling): the versioned_composition
# routes declare no deleted branch at all, and the overview never mentions
# logical deletion. RM decides the CONTENT: RM common master06 §Logical
# Deletion says the delete "create[s] a new Version in the normal way",
# deletes "its `_data_`" and sets "the `_lifecycle_state_` value to the code
# for `deleted`" — the version object survives with its audit trail intact,
# which is the whole medicolegal point ("it must always be possible to revert
# back to a previous state of the record"). RM common
# original_version.adoc types `data` 0..1, so a data-less ORIGINAL_VERSION is
# a valid instance, and ITS-REST overview Requests_and_responses.md §HTTP
# status codes gives the read its row: "200 | OK | The request succeeded,
# payload sent in a 200 response depends on the request method". Answering 204
# here would suppress exactly what this route exists to expose.
#
# The lifecycle code is the openEHR terminology's, not a literal invented
# here: RM common version.adoc's `Lifecycle_state_valid` invariant binds
# `lifecycle_state.defining_code` to the `version lifecycle state` group,
# whose deleted code is 523.
id: I_EHR_COMPOSITION.get_versioned_composition-deleted_version_envelope
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-74]
test_purpose: >-
  The VERSION-envelope read of a logically deleted COMPOSITION version serves
  the ORIGINAL_VERSION with lifecycle_state 523|deleted| and no data.
description: "Get the ORIGINAL_VERSION envelope of a deleted COMPOSITION version"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "RM common §version (Lifecycle_state_valid)"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }
  - step: 3
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${deleted_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${deleted_uid}" }
      # "set the `_lifecycle_state_` value to the code for `deleted`"
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "523" }
      # "delete its `_data_`" — ORIGINAL_VERSION.data is 0..1, so absence is the served state
      - { assert: field, path: "data", absent: true }
      # the audit trail survives — the medicolegal reason logical deletion exists
      - { assert: field, path: "commit_audit/time_committed/value", exists: true }
