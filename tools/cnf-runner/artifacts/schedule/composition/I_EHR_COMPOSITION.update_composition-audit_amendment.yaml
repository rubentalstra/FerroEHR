# A legal DIVERGENT client change_type is honoured, not overwritten: an update
# committed with `openehr-audit-details: change_type.code_string="250"` stores
# a 250|amendment| commit audit.
#
# Derived from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"), not from any SUT:
#   "clients MAY supply values for the AUDIT_DETAILS attributes change_type,
#   description, committer and system_id"; "whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime."
# Both 250|amendment| and 251|modification| are legal update codes in the
# openEHR audit_change_type group (RM common master06 §Contributions; TERM
# group audit_change_type), so the client's amendment MUST survive to the
# persisted ORIGINAL_VERSION.commit_audit.
id: I_EHR_COMPOSITION.update_composition-audit_amendment
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps, ChangeSets]
profiles: [CORE]
test_purpose: >-
  A client-supplied change_type of 250|amendment| on an update is merged into
  the committed VERSION's AUDIT_DETAILS instead of being overwritten by the
  operation default 251|modification|.
description: "Update a COMPOSITION with a client-supplied amendment change_type"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (AUDIT_DETAILS.change_type; audit_change_type group)"
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    variant: audit_change_type
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
      audit_change_type: "250"
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "commit_audit/change_type/defining_code/code_string", equals: "250" }
postconditions:
  - { assert: version, count: 2 }
