# Create a persistent COMPOSITION for the same persistent OPT twice: the first
# succeeds, the second is rejected (only one persistent COMPOSITION per OPT per
# EHR under the current criteria). This uniqueness rule is under SEC debate
# (AMB-5, report_only): the verdict is reported but excluded from profile
# computation until resolved.
# NOTE: the create_composition binding maps the persistent-uniqueness conflict
# to 409 (ITS-REST overview §HTTP status codes: 409 = conflict).
id: I_EHR_COMPOSITION.create_composition-same_opt_twice
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A second create_composition for the same persistent OPT in the same EHR is
  rejected as a uniqueness/state conflict.
description: "Create persistent COMPOSITION for the same OPT twice"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "CNF platform_test_schedule master07 §create_composition-same_opt_twice"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_persistent]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_persistent.v1, cnf.composition.minimal_persistent.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_persistent.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: version, of: "${version_uid}", uid_pattern: "${versioned_object_uid}::<system>::1" }
  - step: 2
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_persistent.v2}" }
    expect: conflict                      # "trying to create a persistent COMPOSITION for the same persistent OPT that already has a first version"
postconditions:
  - { assert: version, count: 1 }        # only the first create succeeded
  - { assert: version, of: "${version_uid}", change_type: CREATE }
ambiguities: [AMB-5]
