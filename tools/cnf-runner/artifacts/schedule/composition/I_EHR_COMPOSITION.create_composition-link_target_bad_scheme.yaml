# A COMPOSITION whose LINK target is not an `ehr://` URI is refused, and nothing
# is committed.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM common UML/classes/org.openehr.rm.common.link.adoc §Attributes types
# `target` as `DV_EHR_URI` at 1..1, and RM data_types
# UML/classes/org.openehr.rm.data_types.dv_ehr_uri.adoc §Invariants states the
# rule verbatim — `Scheme_valid: scheme.is_equal (Ehr_scheme)` — over the
# symbolic definition `_Ehr_scheme_: String = "ehr"` (RM data_types
# master10-uri_package.adoc §Definitions). The class description says the same
# in prose: "A `DV_EHR_URI` is a `DV_URI` which has the scheme name 'ehr', and
# which can only reference items in EHRs." An `http://` target is therefore not
# a legal DV_EHR_URI value.
#
# The fixture is cnf.composition.minimal_event.links.v1 with ONLY that scheme
# changed, so the payload stays well-formed JSON, keeps a non-empty `links` list
# (LOCATABLE.Links_valid satisfied) and keeps all three 1..1 LINK attributes
# present. The defect is placed on the INTERIOR ENTRY's link rather than the
# root's, so a server that stopped applying the inherited LOCATABLE/DV rules
# once it descended through the abstract `content` slot accepts the payload and
# fails here.
#
# WHY THE REFUSAL IS REQUIRED (not merely permitted): SM
# i_ehr_composition.adoc §create_composition carries
# `Pre_content_valid: valid_content (a_comp)` and declares the error
# `content_invalid`, and SM i_validity_checker.adoc §content_valid defines the
# predicate as "Return `True` if the content structure is a valid instance of
# the relevant RM classes" — a DV_EHR_URI violating its own class invariant is
# not one.
#
# WHICH BRANCH THE REFUSAL TAKES (ITS-REST overview
# specifications/docs/overview/Requests_and_responses.md §HTTP status codes):
# "422 | Unprocessable Entity | The request was well-formed but was unable to be
# followed due to semantic errors". The 400 row of the same table is scoped to
# "malformed request syntax, syntactically invalid content", which this
# well-formed body is not.
#
# The refusal is proved to have refused, not just answered: the postcondition
# asks whether anything was committed at all.
id: I_EHR_COMPOSITION.create_composition-link_target_bad_scheme
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose interior ENTRY carries a LINK with an http:// target is
  rejected as a semantic error, and nothing is committed.
description: "Reject a COMPOSITION whose LINK target is not an ehr:// URI (422)"
spec_refs:
  - "RM common §LINK (target: DV_EHR_URI, 1..1)"
  - "RM data_types §DV_EHR_URI (Scheme_valid: scheme.is_equal (Ehr_scheme))"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (422)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.link_target_bad_scheme]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.link_target_bad_scheme}"
    expect: validation_failed             # overview §HTTP status codes, the 422 row
postconditions:
  - { assert: version, count: 0 }         # nothing committed
