# The canonical-XML REQUEST-payload branch of create_composition: the same
# first-version commit as -event, with the COMPOSITION serialized as canonical
# XML instead of canonical JSON.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "When resources are serialized in **canonical XML** format, both request
# payloads and responses MUST conform to the [published XSDs]" and "A client MAY
# use the header `Content-Type: application/xml` in the requests to specify the
# XML payload format. If the service cannot process the request payload as XML
# format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
# §"Data representation" makes XML support a per-service choice ("Services MUST
# support at least one of the openEHR **XML** or **JSON** canonical formats"),
# which is why the case declares the `canonical-xml` format axis: a party whose
# tech profile does not list canonical-xml is not judged by this row.
#
# The payload is the codec-derived XML twin of the JSON fixture the -event case
# commits, so the read-back can be compared against the JSON twin: a server that
# ingested the XML correctly stores exactly what the JSON commit stores. The
# response is negotiated canonical JSON (the request sends
# `Accept: application/json`, the default for a body-carrying step), so the
# response-side XML branch belongs to the read cases, not here.
id: I_EHR_COMPOSITION.create_composition-xml
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  create_composition with a canonical-XML COMPOSITION request payload creates a
  first VERSION whose stored content equals the canonical-JSON twin of the same
  COMPOSITION.
description: "Create an event COMPOSITION from a canonical-XML payload"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-XML components §RM documents/Composition.xsd (the globally declared `composition` element)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1.xml, cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-xml              # Content-Type: application/xml on the request body
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1.xml}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: version, of: "${version_uid}", uid_pattern: "${versioned_object_uid}::<system>::1" }
      # The XML payload is the codec-derived twin of the JSON fixture, so the
      # stored resource must equal that JSON fixture modulo the binding's
      # declared server-assigned set — the format changed, the content did not.
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
postconditions:
  - { assert: version, count: 1 }
  - { assert: version, of: "${version_uid}", change_type: CREATE }
