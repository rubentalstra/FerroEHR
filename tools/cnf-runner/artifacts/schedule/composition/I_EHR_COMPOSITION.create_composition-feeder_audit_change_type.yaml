# The AMB-176 refusal twin: RM common master03 §Structural Correspondence
# instructs a converter to set a FEEDER_AUDIT `change_type` to "synthesised",
# but the FEEDER_AUDIT class model defines no such attribute (its five
# members carry no change_type) — so a client following the released
# instruction literally sends a member the released model does not admit,
# and a strict reader refuses the undeclared key. The contradiction is the
# register's report_only subject (AMB-176, upstream #1610); THIS case pins
# the refusal so a reader that silently drops or stores the member is
# caught (the both-twins coverage law) — the accepting twin over the five
# MODELLED attributes is -feeder_audit_roundtrip.
id: I_EHR_COMPOSITION.create_composition-feeder_audit_change_type
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-176]
test_purpose: >-
  A COMPOSITION whose FEEDER_AUDIT carries the change_type member the
  released prose instructs but the released class model does not define is
  refused as invalid content, and nothing is committed.
description: "Commit COMPOSITION whose FEEDER_AUDIT carries the unmodelled change_type"
spec_refs:
  - "RM common §FEEDER_AUDIT (five attributes, no change_type)"
  - "RM common master03-archetyped_package §Structural Correspondence (the synthesised instruction)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.feeder_audit.change_type]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.feeder_audit.change_type}"
    expect: bad_request                  # the strict reader refuses the undeclared key at parse (the 400-class shape check)
postconditions:
  - { assert: version, count: 0 }        # nothing committed
