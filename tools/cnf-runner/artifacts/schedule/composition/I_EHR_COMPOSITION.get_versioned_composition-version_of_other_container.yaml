# A version_uid that is perfectly well-formed AND really exists — but in
# ANOTHER VERSIONED_COMPOSITION of the SAME EHR — is not reachable through
# this container's route. The two path segments must cohere.
#
# The incoherence is structural, not a policy choice. RM common master06
# §Version Identification: the `_uid_` of every contained VERSION uses "the
# `VERSIONED_OBJECT._uid_` value … as the `_object_id()_` part", and RM common
# version.adoc makes it an invariant — `Owner_id_valid`:
# `owner_id.value.is_equal (uid.object_id.value)`. So container B's version
# uid carries B's object_id; served under container A's URL it would be a
# VERSION whose owner is not the container that produced it. ITS-REST overview
# Resources.md §Identifier types says the same thing from the wire side: a
# version_uid's "`object_id` matches the VERSIONED_OBJECT identifier, taken
# from VERSIONED_OBJECT.uid.value (i.e. the `versioned_object_uid`)" — here it
# does not. RM common versioned_object.adoc's `Pre: has_version_id
# (a_version_uid)` is therefore false for the addressed container, and
# ITS-REST overview Requests_and_responses.md §HTTP status codes assigns that
# state its row: "404 | Not Found | The origin service did not find the target
# resource or is not willing to disclose that one exists".
#
# This is the isolation a random-uid 404 cannot prove: the uid here is a real,
# live version of the same EHR, so a server that resolved version ids per-EHR
# (or globally) instead of within the addressed container would answer 200 and
# serve a version the URL does not name.
id: I_EHR_COMPOSITION.get_versioned_composition-version_of_other_container
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A live COMPOSITION version_uid belonging to a different versioned container
  of the same EHR is not served through this container's versioned_composition
  route.
description: "Get COMPOSITION VERSION addressed by another container's version_uid"
spec_refs:
  - "ITS-REST overview Resources §Identifier types"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §version (Owner_id_valid)"
  - "RM common §change_control (master06 §Version Identification)"
  - "RM common §versioned_object (version_with_id / has_version_id)"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1                              # container A — the one the URL will address
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { container_a: created.versioned_object_uid }
  - step: 2                              # container B — a second, independent VERSIONED_COMPOSITION
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v2}" }
    expect: created
    capture: { container_b_version_uid: created.version_uid }
  - step: 3                              # B's version uid, addressed under A
    call: get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${container_a}"
      version_uid: "${container_b_version_uid}"
    expect: not_found
