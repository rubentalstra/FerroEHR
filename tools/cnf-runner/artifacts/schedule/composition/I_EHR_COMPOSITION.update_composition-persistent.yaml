# Update an existing persistent COMPOSITION with the correct
# preceding_version_uid: a second VERSION (change_type MODIFY) in the same
# VERSIONED_OBJECT. The REST binding realizes preceding_version_uid as If-Match
# (AMB-3).
id: I_EHR_COMPOSITION.update_composition-persistent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.update_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  Updating an existing persistent COMPOSITION with the correct
  preceding_version_uid creates a second VERSION with change_type MODIFY.
description: "Update an existing persistent COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.update_composition"
  - "CNF platform_test_schedule master07 §update_composition-persistent"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_persistent]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_persistent.v1, cnf.composition.minimal_persistent.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_persistent.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_persistent.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (AMB-3)
    expect: updated
    capture: { v2_uid: updated.version_uid }
    assert:
      - { assert: version, of: "${v2_uid}", uid_pattern: "${versioned_object_uid}::<system>::2" }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
  - { assert: version, of: "${v2_uid}", change_type: MODIFY }
ambiguities: [AMB-3]
