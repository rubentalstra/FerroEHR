# Commit-time resolution of an archetype CONSTRAINT BINDING, the refusal
# direction — the behaviour the whole external-terminology surface exists for.
#
# BASE docs/architecture_overview/master12-terminology.adoc §"Binding
# Terminology Value-sets to Archetypes" makes the bound query's RESULT the
# value set: the ac code "is bound to queries to one or more external
# terminologies, whose result would be a (possibly structured) value set from
# that terminology", and AM docs/AOM1.4/master04-constraint_model_package.adoc
# §Reference Objects calls the CONSTRAINT_REF "a proxy for a set of constraints
# … expressed in the binding of the constraint reference (e.g. 'ac0004') to a
# query … into an external service". A value outside that set therefore
# violates a constraint the template states, which is the same kind of defect
# as any other archetype-constraint violation.
#
# WHY THIS IS NOT THE AMBIGUOUS BRANCH. The binding RESOLVES here: the
# terminology server answers, and the answer is "not a member". Register
# AMB-172 covers only the case where the query cannot be answered at all, so
# this case is gating and posture-independent — a deployment's fail-open
# setting is about SERVICE FAILURE, never about a constraint that was actually
# evaluated and not met. The seeded code system deliberately DEFINES the code
# and the seeded value set deliberately EXCLUDES it, so nothing but value-set
# membership can be the reason.
id: I_EHR_COMPOSITION.create_composition-terminology_binding_non_member
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [ArchetypeValidation]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose coded value is NOT in the value set bound to the
  template's archetype constraint code is rejected with information about the
  errors, and nothing is committed.
description: "Commit refused: the coded value is outside the bound terminology value set"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "BASE architecture_overview §Terminology in openEHR"
  - "AM AOM1.4 §Reference Objects"
  - "ITS-REST ehr §422_Composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.tpl.dv_coded_text_binding_sct]
  ehr: { commits: none }                 # mints ${ehr_id}
  terminology:
    served:
      - "cnf-sct-shaped"                 # the terminology id the ontology binding declares
      - "http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders"
data_sets: [cnf.composition.terminology_binding_sct_non_member]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.terminology_binding_sct_non_member}"
    expect: validation_failed             # "information about the errors in the provided COMPOSITION"
    assert:
      - { assert: message_exemplar, text: "information about the errors in the provided COMPOSITION" }
postconditions:
  - { assert: version, count: 0 }        # nothing committed
