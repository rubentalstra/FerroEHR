# The omitted-parameter branch on the composition ENVELOPE route: with no
# `version_at_time`, /versioned_composition/{uid}/version serves the VERSION
# envelope of the latest version.
#
# The identity is assertable without touching the contained-uid question
# (AMB-65/AMB-67): RM common master06 §Version Identification fixes the
# envelope's OWN identifier — "`VERSION` objects are identified by a `_uid_`
# attribute of type `OBJECT_VERSION_ID`" — so comparing the served
# `uid/value` against the uid the second commit returned proves exactly which
# version was served. Register AMB-70 carries the adjudicated reading of
# "latest" (the current trunk version), which no released sentence picks
# between `latest_version()` and `latest_trunk_version()`.
id: I_EHR_COMPOSITION.get_versioned_composition-at_time_omitted
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  A versioned-COMPOSITION version read that supplies no version_at_time serves
  the VERSION envelope of the latest version.
description: "Get COMPOSITION VERSION at time, version_at_time omitted"
spec_refs:
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "RM common §versioned_object (latest_version)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # a second version, so "latest" is a distinguishable state
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: get_versioned_composition
    variant: at_time                     # the at-time version route, parameter omitted
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${v2_uid}" }
