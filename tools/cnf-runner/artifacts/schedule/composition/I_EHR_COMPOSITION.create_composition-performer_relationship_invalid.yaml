# PARTY_RELATED.Relationship_valid on a participation PERFORMER — the
# terminology rule of the party proxy, reached through the participation it
# performs.
#
# THE INVARIANT IS UNCONDITIONAL, verbatim (RM common
# UML/classes/org.openehr.rm.common.party_related.adoc §Invariants):
# "__Relationship_valid__: `terminology (Terminology_id_openehr).
# has_code_for_group_id (Group_id_subject_relationship,
# relationship.defining_code)`". Unlike the sibling `PARTICIPATION.function`
# rule there is NO `generating_type` antecedent to satisfy: `relationship` is
# declared `DV_CODED_TEXT` at `1..1` ("Relationship of subject of this ENTRY to
# the subject of the record. May be coded. If it is the patient, coded as
# self"), so every PARTY_RELATED instance on the wire is bound.
#
# WHERE IT SITS: `PARTICIPATION.performer` is a `PARTY_PROXY` (1..1, RM common
# participation.adoc §Attributes) and PARTY_RELATED is one of its subtypes
# (…party_related.adoc §Inherit: PARTY_IDENTIFIED, itself a PARTY_PROXY), so
# the refusal here also proves the invariant is applied to a party that appears
# as a POLYMORPHIC SLOT VALUE inside content, not only to a root-level party.
# The accepting twin is every minimal_event.v1 commit: that fixture's
# performer is the same PARTY_RELATED with `10|mother|`, an in-group code — so
# this fixture differs from an accepted one in the code string alone, and the
# refusal cannot be about the PARTY_RELATED shape.
#
# THE FIXTURE'S code is `240`, a REAL openEHR code of the ATTESTATION REASON
# group (TERM SupportTerminology §Vocabularies), so a server that checked only
# that the code exists accepts it.
#
# THE STATUS is the docs text's 422 row (ITS-REST overview
# Requests_and_responses.md §HTTP status codes, verbatim: "The request was
# well-formed but was unable to be followed due to semantic errors").
id: I_EHR_COMPOSITION.create_composition-performer_relationship_invalid
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose participation performer is a PARTY_RELATED carrying a
  relationship code outside the openEHR subject relationship group is rejected
  422, and nothing is committed.
description: "Reject an out-of-group PARTY_RELATED performer relationship (422)"
spec_refs:
  - "RM common §PARTY_RELATED (Relationship_valid — has_code_for_group_id (Group_id_subject_relationship, relationship.defining_code))"
  - "RM common §PARTICIPATION (performer: PARTY_PROXY, 1..1)"
  - "TERM SupportTerminology §Vocabularies (subject relationship)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (422)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.performer_relationship_out_of_group]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.performer_relationship_out_of_group}"
    expect: validation_failed
postconditions:
  - { assert: version, count: 0 }        # nothing committed
