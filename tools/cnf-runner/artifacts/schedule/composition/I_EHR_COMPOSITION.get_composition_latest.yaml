# Get latest of a VERSIONED_COMPOSITION with two VERSIONs; the retrieved
# content must equal the latest committed content (master07 content check).
# The two-version precondition is built in-flow (create then update) so the
# versioned_object_uid is known.
id: I_EHR_COMPOSITION.get_composition_latest
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [CompositionOps]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  get_composition_latest for a VERSIONED_COMPOSITION with two versions returns
  the latest version, whose content matches the second committed COMPOSITION.
description: "Get existing COMPOSITION latest"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "CNF platform_test_schedule master07 §get_composition_latest"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
  - step: 3
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # content check: latest == second committed content, modulo server-assigned
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v2}", ignoring: server_assigned }
