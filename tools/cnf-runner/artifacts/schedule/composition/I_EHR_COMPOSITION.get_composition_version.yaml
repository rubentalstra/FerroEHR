# Get a COMPOSITION at a known VERSION id; the retrieved content must match the
# committed COMPOSITION (master07 content check). The VERSION is created in-flow
# so its version id is known.
# Schedule heading "get_composition_version" maps to the resolvable SM
# operation get_composition_at_version (the SM I_EHR_COMPOSITION interface has no
# get_composition_version — AMB-13 precedent; see REQUIREMENTS.md).
id: I_EHR_COMPOSITION.get_composition_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_version
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  get_composition_at_version for a known VERSION id returns that version, whose
  content matches the committed COMPOSITION.
description: "Get existing COMPOSITION at version"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_version"
  - "CNF platform_test_schedule master07 §get_composition_version"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: equivalent, to: committed, ignoring: server_assigned }
