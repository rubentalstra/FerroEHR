# Lexical preservation of body datetimes through the canonical-JSON commit →
# read-back round trip. Decisive docs-text sentences (ITS-REST overview
# Resources.md §Datetime format): "Any date, datetime or time value provided as
# part of the HTTP message body, when creating or updating a resource (e.g. a
# DV_DATE_TIME value inside the COMPOSITION content), will be preserved as it
# was sent by the client, and passed to the underlying backend engine as is."
# and "Retrieval or querying those resources SHOULD return date, datetime, or
# time values in the (original) format provided by underlying backend engine,
# avoiding any format change."
#
# The committed COMPOSITION carries `2021-09-21T21:52:31.927-03:00` as its
# EVENT_CONTEXT.start_time: an extended ISO 8601 datetime with a NON-UTC offset
# and millisecond precision. Every normalization a server might apply is
# therefore observable in one value — shifting to UTC (`…T00:52:31.927Z`),
# widening or dropping the fractional seconds, or re-rendering the offset —
# and each is a "format change" the second sentence forbids.
#
# The SF-MAP-temporal case pins the same rule on the FLAT ingest path
# (simplified_formats master05 leaf mapping); this case pins it through the
# CANONICAL JSON path, which the Simplified-Formats mapping cases never touch.
# `context/start_time` is a member of the ctx_defaults ignore-set the FLAT
# `equivalent` comparison drops, so a direct field assertion is the only
# instrument that observes it.
id: I_EHR_COMPOSITION.create_composition-datetime_lexical
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: DV_DATE_TIME
capabilities: [CompositionOps]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  A DV_DATE_TIME supplied in the canonical-JSON request body is read back
  byte-identical — the client's offset and fractional-second precision survive
  the commit unchanged.
description: "Body datetime lexical form preserved (canonical JSON)"
spec_refs:
  - "ITS-REST overview Resources.md §Datetime format"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "RM data_types §DV_DATE_TIME"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # The committed lexical form, verbatim — offset and .sss precision intact.
      - { assert: field, path: "context/start_time/value", equals: "2021-09-21T21:52:31.927-03:00" }
