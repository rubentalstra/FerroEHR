# The lower edge on the composition ENVELOPE route: below the first commit
# there is no VERSION to envelope.
#
# RM common versioned_object.adoc §Functions guards the accessor with
# `Pre: has_version_at_time (a_time)`; ITS-REST overview
# Requests_and_responses.md §HTTP status codes assigns the absent-target state
# its row: "404 | Not Found | The origin service did not find the target
# resource or is not willing to disclose that one exists".
#
# The queried instant is a FIXED literal in the extended ISO 8601 form the
# Resources.md §Datetime format MUST requires; the runner seeds a freshly
# composed, empty SUT, so every commit in the run is later than the year 2000.
# The container itself EXISTS (step 1 created it), so a 404 here is the
# no-version-at-time branch, not an unknown-container miss.
id: I_EHR_COMPOSITION.get_versioned_composition-at_time_before_first_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  A versioned-COMPOSITION version read for an instant earlier than the first
  committed version finds no version and is refused as not found.
description: "Get COMPOSITION VERSION at time, before the first version"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "ITS-REST overview Resources §Datetime format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_versioned_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_versioned_composition
    variant: at_time
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      a_time: "2000-01-01T00:00:00Z"
    expect: not_found
