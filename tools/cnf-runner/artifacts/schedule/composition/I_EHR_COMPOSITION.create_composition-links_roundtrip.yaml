# POPULATED LINKS — the accepting side of the LOCATABLE.links rules, at two
# depths of one COMPOSITION.
#
# WHY THIS CASE EXISTS: the catalogue already carries the two refusals
# (create_composition-links_empty for LOCATABLE.Links_valid, and
# create_composition-link_target_bad_scheme for DV_EHR_URI.Scheme_valid). Both
# would also pass on a server that refused every `links` list outright — the
# catalogue would then certify over-rejection as conformance. This case pins the
# opposite direction: a COMPOSITION carrying COMPLETE links is stored and read
# back with them intact.
#
# WHAT THE RM REQUIRES: `LOCATABLE.links` is `0..1 List<LINK>` (RM common
# UML/classes/org.openehr.rm.common.locatable.adoc §Attributes: "Links to other
# archetyped structures (data whose root object inherits from `ARCHETYPED`, such
# as `ENTRY`, `SECTION` and so on). Links may be to structures in other
# compositions"), and every LOCATABLE inherits it. Each member carries all three
# 1..1 LINK attributes — `meaning: DV_TEXT`, `type: DV_TEXT`,
# `target: DV_EHR_URI` (…common.link.adoc §Attributes) — with an `ehr://` target
# satisfying `DV_EHR_URI.Scheme_valid` (RM data_types
# UML/classes/org.openehr.rm.data_types.dv_ehr_uri.adoc §Invariants).
#
# WHY TWO DEPTHS: the sibling directory case
# (I_EHR_DIRECTORY.create_directory-folder_with_link) exercises links on a
# resource ROOT only. Here the payload also carries one on the interior
# EVALUATION, because `COMPOSITION.content` is declared `List<CONTENT_ITEM>` —
# an abstract slot — so a server that only honoured links at the root, or that
# stopped applying the inherited LOCATABLE rules once it descended into
# polymorphic content, still reads back a composition missing the second link.
# Step 2 asserts both targets by path, so such a server fails here.
#
# One behaviour per case: the commit itself is a plain valid create; every
# assertion is about the links surviving the round trip.
id: I_EHR_COMPOSITION.create_composition-links_roundtrip
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION carrying a complete LINK at the root and a second on an interior
  ENTRY is committed, and both links — with their meaning, type and DV_EHR_URI
  target — read back unchanged at the committed version.
description: "Commit and read back a COMPOSITION carrying root and ENTRY LINKs"
spec_refs:
  - "RM common §LOCATABLE (links: List<LINK>, 0..1)"
  - "RM common §LINK (meaning/type/target, 1..1)"
  - "RM data_types §DV_EHR_URI (Scheme_valid)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.links.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.links.v1}"
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2                              # both links survived the round trip
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # The root LINK — all three 1..1 attributes, verbatim.
      - { assert: field, path: "links[0]/meaning/value", equals: "follow up on the referral" }
      - { assert: field, path: "links[0]/type/value", equals: "issue" }
      - { assert: field, path: "links[0]/target/value", equals: "ehr://ehr.example.org/6f1d3a0c-3d2c-4a9c-9d0b-9f6a1d2e4c77" }
      # The interior LINK on the EVALUATION, below the abstract `content` slot.
      - { assert: field, path: "content[0]/links[0]/meaning/value", equals: "follow up on the referral" }
      - { assert: field, path: "content[0]/links[0]/type/value", equals: "issue" }
      - { assert: field, path: "content[0]/links[0]/target/value", equals: "ehr://ehr.example.org/2a4b7f61-58a1-4a08-9a2f-1c53c6e0f9b4" }
postconditions:
  - { assert: version, count: 1 }
