# PARTICIPATION.time — the interval attribute, at both depths and in both of
# its shapes.
#
# WHAT THE RM DECLARES: `PARTICIPATION.time` is
# `0..1 DV_INTERVAL<DV_DATE_TIME>` — "The time interval during which the
# participation took place, if it is used in an observational context (i.e.
# recording facts about the past); or the intended time interval of the
# participation when used in future contexts, such as EHR Instructions" (RM
# common UML/classes/org.openehr.rm.common.participation.adoc §Attributes).
# `DV_INTERVAL` inherits BASE `Interval<T>`, whose four boundary booleans
# (`lower_unbounded`/`upper_unbounded`/`lower_included`/`upper_included`) are
# each `1..1` (BASE UML/classes/org.openehr.base.foundation_types.interval.adoc
# §Attributes), so a ONE-SIDED interval is a first-class value of the
# attribute, not a degenerate encoding of a missing one.
#
# WHY BOTH SHAPES AND BOTH DEPTHS: the payload carries a BOUNDED interval on
# `EVENT_CONTEXT.participations[0]` (RM ehr event_context.adoc §Attributes) and
# an OPEN-ENDED one — lower bound only, `upper_unbounded: true` with
# `upper_included: false` per `Upper_included_valid`
# (`upper_unbounded implies not upper_included`) — on the interior EVALUATION's
# `other_participations[0]` (RM common ENTRY §Attributes: "Other participations
# at `ENTRY` level"). A store that kept only a start/end pair, or that applied
# participations at composition level only, reads back one of the two wrong.
# Step 2 asserts every boundary flag and both bounds, so a silently normalized
# interval (an invented `upper`, a flipped `upper_unbounded`) fails here.
#
# SIMPLIFIED-FORMATS BOUNDARY (read first-hand, ITS-REST
# docs/simplified_formats/master06-context_information.adoc §Participation):
# the `ctx/` participation vocabulary is exactly `participation_name`,
# `participation_function`, `participation_mode`, `participation_id` and
# `participation_identifiers` — the chapter defines NO participation-time key,
# so `PARTICIPATION.time` is not expressible through `ctx/` and the canonical
# wire exercised here is the covered path.
#
# One behaviour per case: the commit is a plain valid create (the accepting
# participation shapes themselves are already covered by every
# minimal_event.v1 commit); every assertion is about the time intervals
# surviving the round trip.
id: I_EHR_COMPOSITION.create_composition-participation_time_roundtrip
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose EVENT_CONTEXT participation carries a bounded
  DV_INTERVAL<DV_DATE_TIME> time and whose ENTRY-level other participation
  carries an open-ended one is committed, and both intervals read back
  verbatim at the committed version.
description: "Round-trip bounded and open-ended PARTICIPATION.time intervals"
spec_refs:
  - "RM common §PARTICIPATION (time: DV_INTERVAL<DV_DATE_TIME>, 0..1)"
  - "RM common §ENTRY (other_participations: List<PARTICIPATION>, 0..1)"
  - "BASE foundation_types §Interval (lower/upper_unbounded + lower/upper_included, 1..1; Upper_included_valid)"
  - "RM data_types §DV_INTERVAL (Limits_consistent)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.participation_time]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.participation_time}"
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2                              # both intervals survived, verbatim
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # The BOUNDED interval on the composition-level participation.
      - { assert: field, path: "context/participations[0]/time/lower/value", equals: "2021-09-21T21:40:00-03:00" }
      - { assert: field, path: "context/participations[0]/time/upper/value", equals: "2021-09-21T22:05:00-03:00" }
      - { assert: field, path: "context/participations[0]/time/lower_unbounded", equals: false }
      - { assert: field, path: "context/participations[0]/time/upper_unbounded", equals: false }
      - { assert: field, path: "context/participations[0]/time/lower_included", equals: true }
      - { assert: field, path: "context/participations[0]/time/upper_included", equals: true }
      # The OPEN-ENDED interval on the ENTRY-level other participation.
      - { assert: field, path: "content[0]/other_participations[0]/time/lower/value", equals: "2021-09-21T21:55:00-03:00" }
      - { assert: field, path: "content[0]/other_participations[0]/time/upper", absent: true }
      - { assert: field, path: "content[0]/other_participations[0]/time/lower_unbounded", equals: false }
      - { assert: field, path: "content[0]/other_participations[0]/time/upper_unbounded", equals: true }
      - { assert: field, path: "content[0]/other_participations[0]/time/lower_included", equals: true }
      - { assert: field, path: "content[0]/other_participations[0]/time/upper_included", equals: false }
postconditions:
  - { assert: version, count: 1 }
