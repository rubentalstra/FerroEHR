# Get at version for a random version id on an EHR without commits: negative,
# the COMPOSITION with that version id does not exist (404 not_found). ITS-REST
# returns the same 404 whether the EHR or the version id is unknown; the get
# binding maps not_found (a distinct version_not_found kind is a binding-extension
# candidate — see REQUIREMENTS.md).
id: I_EHR_COMPOSITION.get_composition_version-bad_version
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_version
capabilities: [Versioning]
profiles: [CORE]
test_purpose: >-
  get_composition_at_version for a random version id on an EHR without commits
  is rejected: no COMPOSITION with that version id exists.
description: "Get COMPOSITION at version, VERSION doesn't exist"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_version"
  - "CNF platform_test_schedule master07 §get_composition_version-bad_version"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # "An EHR ... doesn't have any commits" — mints ${ehr_id}
flow:
  - step: 1
    call: get_composition_at_version
    with:
      ehr_id: "${ehr_id}"
      version_uid: "11111111-1111-4111-8111-111111111111::cnf.example.org::1"
    expect: not_found                     # "the non-existent COMPOSITION with the version id"
