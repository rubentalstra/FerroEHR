# The UNRESOLVABLE bound value set, fail-OPEN half (register AMB-172).
#
# BASE docs/architecture_overview/master12-terminology.adoc §"Binding
# Terminology Value-sets to Archetypes" places the resolver outside openEHR
# altogether — "Currently there is no standard for such queries. This does not
# affect archetypes directly, since they simply hold an identifier for a query;
# the query itself is defined within a 'terminology query server'" — and never
# says what a service does when that query cannot be answered. Accepting the
# composition and refusing it are both consistent with the released text, so
# the branch is a DEPLOYMENT posture the ixit declares, and both branches are
# tested against the deployments that realize them (AMB-172; the same treatment
# the two version-signing modes get under RM common master06 §Digital
# Signature).
#
# HOW "THE TERMINOLOGY SERVER IS DOWN" IS PRODUCED: not by stopping anything
# mid-run. The party declares a terminology server `reachable: false` in its
# ixit, wired for the whole run to an address nothing answers on, and the
# template's ac code is bound into that server's namespace. The condition is
# therefore identical on every attempt and no case mutates the deployment it
# tests.
#
# The payload itself is intrinsically VALID (every RM invariant and every
# archetype constraint the template states is satisfied), so acceptance here
# rests solely on the declared posture, never on the data.
id: I_EHR_COMPOSITION.create_composition-terminology_binding_unresolvable_fail_open
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [ArchetypeValidation]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  On a deployment declaring the fail-open posture, a COMPOSITION whose bound
  value set cannot be resolved (the terminology server is unreachable) is
  accepted and committed.
description: "Unresolvable bound value set, fail-open deployment: the commit is accepted"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "BASE architecture_overview §Terminology in openEHR"
  - "ITS-REST ehr §201_Composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.tpl.dv_coded_text_binding_tsdown]
  ehr: { commits: none }                 # mints ${ehr_id}
  terminology:
    posture: fail_open
    unreachable:
      - "cnf-ts-down"                    # the terminology id the ontology binding declares
      - "http://cnf.example.test/fhir/ValueSet/ts-down-set"
data_sets: [cnf.composition.terminology_binding_tsdown]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.terminology_binding_tsdown}"
    expect: created
    capture:
      version_uid: created.version_uid
    assert:
      - { assert: version, of: "${version_uid}", change_type: CREATE }
postconditions:
  - { assert: version, count: 1 }        # the composition is in the EHR
ambiguities: [AMB-172]
