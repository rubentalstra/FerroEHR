# Get latest for a random VERSIONED_COMPOSITION uid on an EHR with no
# CONTRIBUTIONs: empty result with an error that the composition does not exist
# (realized as 404 not_found).
id: I_EHR_COMPOSITION.get_composition_latest-bad_composition
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  get_composition_latest for a random versioned_object_uid on an EHR without
  commits is rejected: the composition does not exist in the EHR.
description: "Get COMPOSITION latest, COMPOSITION doesn't exist"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "CNF platform_test_schedule master07 §get_composition_latest-bad_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # "An EHR ... has no CONTRIBUTIONs" — mints ${ehr_id}
flow:
  - step: 1
    call: get_composition_latest
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "11111111-1111-4111-8111-111111111111"
    expect: not_found                     # "the COMPOSITION uid doesn't exist in the EHR"
