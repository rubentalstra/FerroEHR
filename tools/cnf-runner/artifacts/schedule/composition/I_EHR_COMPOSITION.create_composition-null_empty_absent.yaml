# Canonical-JSON serialization discipline: RM attributes that are Null or an
# empty list are ABSENT from the serialized resource — never rendered as
# `null` or `[]`. Decisive docs-text sentence (ITS-REST overview Resources.md
# §JSON Format): "The RM attributes (even required ones) that are `Null` or an
# empty list (array) SHOULD be absent when serialized as JSON."
#
# One behaviour per case: a valid canonical COMPOSITION is committed and read
# back, and the assertions name only attributes the committed instance leaves
# unset — the optional LOCATABLE.links list (root and on the contained ENTRY),
# LOCATABLE.feeder_audit, and EVENT_CONTEXT.other_context. A conformant
# canonical-JSON response omits each; rendering `"links": []` or
# `"other_context": null` violates the sentence above. (An explicitly EMPTY
# links list cannot be committed to probe the same rule from the request side:
# RM common LOCATABLE `Links_valid` — "links /= Void implies not links.is_empty"
# — makes an empty list an invalid instance, so absence-on-serialization is the
# only wire-observable half of the rule.)
id: I_EHR_COMPOSITION.create_composition-null_empty_absent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  RM attributes that are Null or an empty list on the committed COMPOSITION are
  absent from the canonical-JSON representation read back, never serialized as
  a JSON null or an empty array.
description: "Null / empty-list RM attributes absent in canonical JSON"
spec_refs:
  - "ITS-REST overview Resources.md §JSON Format"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "RM common §LOCATABLE (links, feeder_audit)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    format: canonical-json
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # LOCATABLE.links is unset on the committed instance: absent, not `[]`.
      - { assert: field, path: "links", absent: true }
      - { assert: field, path: "content[0]/links", absent: true }
      # LOCATABLE.feeder_audit is unset: absent, not `null`.
      - { assert: field, path: "feeder_audit", absent: true }
      - { assert: field, path: "content[0]/feeder_audit", absent: true }
      # EVENT_CONTEXT.other_context is unset: absent, not `null`.
      - { assert: field, path: "context/other_context", absent: true }
