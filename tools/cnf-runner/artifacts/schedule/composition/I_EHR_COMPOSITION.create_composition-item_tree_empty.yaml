# The OTHER side of the empty-list split, and the reason the split has to be
# pinned from both ends: an ITEM_TREE whose `items` list is present but EMPTY
# is VALID and MUST be accepted. A server that refused it would be over-strict
# in exactly the way the sibling CLUSTER case makes it easy to become.
#
# WHY IT IS VALID, first-hand: RM
# `UML/classes/org.openehr.rm.data_structures.item_tree.adoc` §Attributes types
# `ITEM_TREE.items` at **0..1** and its Meaning column says so outright — "The
# items comprising the `ITEM_TREE`. Can include **0 or more** CLUSTERs and/or 0
# or more individual ELEMENTs." The class declares NO invariants section at
# all, so nothing bounds the list below zero.
#
# THE CONTRAST: `CLUSTER.items` is 1..1 (a mandatory list), so an empty one
# never converts and is refused 400 — pinned by
# create_composition-cluster_no_items against the very same COMPOSITION and
# template. Same wire, same reader, two different RM cardinalities, two
# different outcomes: that pair is the behaviour under test.
#
# NOTE: the #1858 candidate list predicted 422 here on an "invariant class"
# reading; the RM text above refutes it — ITEM_TREE declares no invariant and
# its multiplicity is 0..1, so acceptance is the only conformant answer.
id: I_EHR_COMPOSITION.create_composition-item_tree_empty
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION whose ITEM_TREE carries a present-but-empty items list is
  ACCEPTED and committed — the 0..1 container the RM explicitly allows to hold
  zero items, against which the 1..1 CLUSTER refusal is the contrast.
description: "ITEM_TREE with an empty items list is accepted (201)"
spec_refs:
  - "RM data_structures §ITEM_TREE (items: List<ITEM>, 0..1 — 'Can include 0 or more')"
  - "RM data_structures §CLUSTER (items: List<ITEM>, 1..1)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.item_tree_empty]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.item_tree_empty}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # it really is stored, not silently dropped
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
postconditions:
  - { assert: version, count: 1 }
