# A version_at_time value outside the ISO 8601 grammar is refused as a client
# error on the BARE composition route — it is never silently ignored (which
# would answer the latest version) and never resolved to some arbitrary
# instant.
#
# Decisive docs-text sentences: ITS-REST overview Resources.md §Datetime format
# — "HTTP query parameters and path segments that are dates, datetimes, or
# times, MUST always use the _extended_ ISO 8601 format. The general form of a
# datetime is `YYYY-MM-DDThh:mm:ss.sss[Z|±hh:mm]`" — and overview
# Requests_and_responses.md §HTTP status codes, row 400: "The service cannot
# or will not process the request due to something that is perceived to be a
# client error (e.g., malformed request syntax, syntactically invalid
# content)". The literal below is not a datetime in any format, so no
# tolerance reading reaches it.
#
# The composition EXISTS, so the refusal cannot be confused with the
# no-version-at-time 404 the sibling before_first_version case pins.
id: I_EHR_COMPOSITION.get_composition_at_time-malformed
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION at-time read whose version_at_time is not an ISO 8601 datetime
  is rejected as a client error rather than served.
description: "Get COMPOSITION at time, malformed version_at_time"
spec_refs:
  - "ITS-REST overview Resources §Datetime format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_at_time"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_composition_at_time
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      a_time: "not-a-datetime"
    expect: bad_request
