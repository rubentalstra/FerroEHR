# The implicit-latest form of the same deleted read: no version coordinate at
# all, and the trunk head is the 523|deleted| version.
#
# SPEC SILENCE, adjudicated as AMB-74 (fixed_handling): the bare route's
# deleted branch is textually scoped to the at-time addressing form, so the
# implicit-latest form has no assigned branch. It resolves the same way,
# because it resolves to the same version: ITS-REST overview Resources.md
# §Multiple identifiers for the same resource makes the two URIs
# interchangeable — the "implicit latest version reference" resolves to the
# same resource as the explicit one "as long as no new versions are created" —
# and the resource that version holds is gone (RM common master06 §Logical
# Deletion: the delete commits a version whose `_data_` is deleted). ITS-REST
# overview Requests_and_responses.md §HTTP status codes: "204 | No Content |
# The request has been fulfilled and there is no additional content to send in
# the response payload body".
#
# The container itself is NOT gone — the sibling envelope case reads the very
# same version back in full on the versioned_composition route — so a 404 here
# would deny a resource the service holds.
id: I_EHR_COMPOSITION.get_composition_latest-deleted_head
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.get_composition_latest
capabilities: [Versioning]
exercises: [CompositionOps]
profiles: [CORE]
ambiguities: [AMB-74]
test_purpose: >-
  A bare-route COMPOSITION read with no version coordinate, whose trunk head
  is a logically deleted version, is fulfilled with no content.
description: "Get latest COMPOSITION when the trunk head is deleted"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources §Multiple identifiers for the same resource"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "RM common §versioned_object (latest_version)"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
  - step: 3                              # no version coordinate: the implicit latest
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok_empty
