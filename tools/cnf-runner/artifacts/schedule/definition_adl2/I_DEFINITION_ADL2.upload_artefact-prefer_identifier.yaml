# The `Prefer: return=identifier` verbosity branch of the ADL2 artefact upload
# — the ADL2 twin of I_DEFINITION_ADL14.upload_opt-prefer_identifier.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §"Prefer only
# identifier"): "This is a variant of preference that implies minimal response
# semantics, but with a non-empty response body (i.e., the status will be `201
# Created` or `200 OK`, never `204 No Content`)." and "The response body SHOULD
# contain only the identifier of the affected resource formatted according to
# the `Accept` request header." The ADL2 upload's own 201 text names the
# identifier body for this preference ("if is `return=identifier`, only its
# unique identifier is included"), rendered as the `{ "template_id": … }`
# object under `application/json`.
#
# Two observable facts, both asserted: the body carries the resolved artefact
# identifier and not the artefact source, and that identifier addresses the
# uploaded artefact (step 2 reads it back). Register: AMB-110.
id: I_DEFINITION_ADL2.upload_artefact-prefer_identifier
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.upload_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  An ADL2 artefact upload sent with Prefer: return=identifier answers a
  non-empty identifier body at the created status — never 204 No Content — and
  the returned template_id addresses the uploaded artefact.
description: "Prefer: return=identifier honoured on ADL2 artefact upload"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer only identifier"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_DEFINITION_ADL2.upload_artefact"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # `Prefer: return=identifier` arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-50) + Requests_and_responses.md §Prefer only identifier
requires: { server: any }
data_sets: [cnf.adl2.opt.minimal_g]
flow:
  - step: 1
    call: upload_artefact
    variant: return_identifier           # pins Prefer: return=identifier
    with: { opt_adl2: "${ds:cnf.adl2.opt.minimal_g}" }
    expect: created                      # "201 Created or 200 OK, never 204 No Content"
    capture: { template_id: created.template_id }
    assert:
      # "only the identifier of the affected resource" — the TemplateIdentifier object
      - { assert: field, path: "template_id", exists: true }
  - step: 2                              # the identifier addresses the resource it names
    call: get_artefact
    with: { template_id: "${template_id}" }
    expect: ok
ambiguities: [AMB-110]
