# The ABSENT-`version` branch: the listing collapses each family to its
# latest release — "if missing, then only the latest version will be
# returned" (the RELEASED OAS grounds docs-text silence, cited AS the OAS:
# specifications/parameters/query/filter_version.yaml). The explicit-filter
# branches are the filter_version-variant siblings.
id: I_DEFINITION_ADL2.list_opts-absent_version_latest_only
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_opts
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  Listing ADL2 OPTs without a `version` filter returns only the latest
  release of each family.
description: "list ADL2 OPTs with `version` absent — latest per family"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_opts"
  - "ITS-REST OAS parameters/query/filter_version.yaml (docs-text-silent ground): \"if missing, then only the latest version will be returned\""
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.adl2.opt.versioned_v100, cnf.adl2.opt.versioned_v110]
data_sets: [cnf.adl2.opt.versioned_v100, cnf.adl2.opt.versioned_v110]
flow:
  - step: 1
    call: list_opts                        # the variant-less binding: no query parameters, the absent-version branch
    expect: ok
    assert:
      - { assert: returns, matches: "cnf_adl2_versioned\\.v1\\.1\\.0", omits: "cnf_adl2_versioned\\.v1\\.0\\.0" }
