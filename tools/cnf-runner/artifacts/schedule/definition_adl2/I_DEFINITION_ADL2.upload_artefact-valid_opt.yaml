# SM I_DEFINITION_ADL2.upload_artefact positive: a valid ADL2 operational
# template validates (Pre_valid: valid_artefact) and is stored (Post_has_artefact:
# has_artefact(id)), becoming retrievable. Re-adjudicated from the retired
# ECC-ADL2-001 row (upload → 201 + Location; the Prefer triad rides the wire
# binding, not the protocol-neutral case).
id: I_DEFINITION_ADL2.upload_artefact-valid_opt
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.upload_artefact
capabilities: [Adl2OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [OPTIONS]
test_purpose: "Valid ADL2 OPTs are accepted, stored as uploaded, and become retrievable by template_id."
description: "upload valid ADL2 operational templates"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.upload_artefact"
  - "AM ADL2 §Templates (operational template form)"
  - "AM AOM2 §Validity (an uploaded artefact must validate)"
  - "ITS-REST OAS operations/definition_template_adl2_upload.yaml §responses ('201')"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.adl2.opt.minimal_b, expected: created }
    - { data_set: cnf.adl2.opt.minimal_c, expected: created }
flow:
  - step: 1
    call: upload_artefact
    with: { opt_adl2: "${ds:fixture}" }
    expect: "${fixture.expected}"
postconditions:
  - assert: state
    text: "A new OPT with the given template_id is loaded and retrievable (Post_has_artefact)"
    verified_by: I_DEFINITION_ADL2.get_artefact-retrieve
verified_by: [I_DEFINITION_ADL2.get_artefact-retrieve, I_DEFINITION_ADL2.has_artefact-existing]
