# SM I_DEFINITION_ADL2.get_artefact via the DEPRECATED ADL2 "Get a template at
# version" endpoint. Anchored to get_artefact with `variant: version`. The
# endpoint is deprecated in the OAS (SPECITS-87); the case is guarded so it is
# skipped where a SUT has withdrawn the deprecated surface. Re-adjudicated from
# the retired ECC-ADL2-008 row (exact SEMVER + major-prefix resolution ride the
# wire binding's path/version handling).
id: I_DEFINITION_ADL2.get_artefact-version_get
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.get_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "Retrieving a loaded ADL2 OPT at a specific version (deprecated endpoint) returns the artefact."
description: "get an ADL2 OPT at a specific version (deprecated)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.get_artefact"
  - "ITS-REST OAS operations/definition_template_adl2_version_get.yaml §responses ('200')"
guards:
  - "ADL2 Get-template-at-version is deprecated in ITS-REST 1.1.0 (deprecated: true) — ITS-REST definition_template_adl2_version_get; SPECITS-87 (skip where the deprecated surface is withdrawn)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.adl2.opt.minimal]   # the upload ground — provisioned, 409-tolerant on a shared world
data_sets: [cnf.adl2.opt.minimal]
flow:
  - step: 1
    call: get_artefact
    variant: version
    with: { template_id: "openEHR-EHR-COMPOSITION.cnf_minimal.v1.0.0", version: "1.0.0" }
    expect: ok
