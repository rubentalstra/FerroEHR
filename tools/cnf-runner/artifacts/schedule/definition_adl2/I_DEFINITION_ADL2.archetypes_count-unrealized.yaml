# SM I_DEFINITION_ADL2.archetypes_count: total count of archetypes. ITS-REST
# 1.1.0 surfaces no count endpoint and no archetype provisioning at all
# (AMB-37), so the its-rest binding declares the operation unrealized and this
# case is not-applicable WITH CITATION.
id: I_DEFINITION_ADL2.archetypes_count-unrealized
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.archetypes_count
capabilities: [Adl2ArchetypeProvisioning]
profiles: [OPTIONS]
test_purpose: "archetypes_count returns the total number of archetypes (zero on an empty server)."
description: "count all ADL2 archetypes"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.archetypes_count"
  - "AM AOM2 §Archetypes (AUTHORED_ARCHETYPE)"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: archetypes_count
    expect: ok
    assert:
      - { assert: returns, equals: 0 }   # empty server -> zero archetypes
ambiguities: [AMB-37]
