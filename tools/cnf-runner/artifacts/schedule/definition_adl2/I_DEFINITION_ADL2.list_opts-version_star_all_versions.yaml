# The explicit-`version` branch with `*`: every stored version of the family
# is listed, no latest-only collapse — "use `*` for all versions" (the
# RELEASED OAS grounds docs-text silence, cited AS the OAS:
# specifications/parameters/query/filter_version.yaml). The absent-version
# branch is the sibling list_opts-absent_version_latest_only case.
id: I_DEFINITION_ADL2.list_opts-version_star_all_versions
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_opts
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  Listing ADL2 OPTs with `version=*` returns every stored version of a
  versioned family, not just the latest.
description: "list ADL2 OPTs with `version=*` — every stored version"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_opts"
  - "ITS-REST OAS parameters/query/filter_version.yaml (docs-text-silent ground): \"use `*` for all versions\""
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.adl2.opt.versioned_v100, cnf.adl2.opt.versioned_v110]
data_sets: [cnf.adl2.opt.versioned_v100, cnf.adl2.opt.versioned_v110]
flow:
  - step: 1
    call: list_opts
    variant: filter_version
    with: { version: "*" }
    expect: ok
    assert:
      - { assert: returns, matches: "cnf_adl2_versioned\\.v1\\.0\\.0" }
      - { assert: returns, matches: "cnf_adl2_versioned\\.v1\\.1\\.0" }
