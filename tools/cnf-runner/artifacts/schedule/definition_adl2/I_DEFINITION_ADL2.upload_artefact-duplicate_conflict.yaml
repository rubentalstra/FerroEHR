# SM I_DEFINITION_ADL2.upload_artefact duplicate-identity behaviour. The SM
# says "If an artefact with the same physical identifier and namespace exists,
# replace it"; ITS-REST 1.1.0 instead rejects a same-template_id re-upload with
# 409 Conflict (409_template_already_exists.yaml). Re-adjudicated from the
# retired ECC-ADL2-002 row: the CONFORMANCE expectation is the wire's already_exists,
# and the SM replace-semantics divergence is noted (AMB-37).
id: I_DEFINITION_ADL2.upload_artefact-duplicate_conflict
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.upload_artefact
capabilities: [Adl2OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [OPTIONS]
test_purpose: "Re-uploading an ADL2 OPT with an already-present template_id is rejected as a conflict on ITS-REST 1.1.0."
description: "upload the same ADL2 OPT twice"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.upload_artefact"
  - "AM AOM2 §Identification (archetype/template HRID uniqueness)"
  - "ITS-REST OAS operations/definition_template_adl2_upload.yaml §responses ('409')"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.adl2.opt.minimal_d]
flow:
  - step: 1
    call: upload_artefact
    with: { opt_adl2: "${ds:cnf.adl2.opt.minimal_d}" }
    expect: created
    capture: { template_id: created.template_id }
  - step: 2
    call: upload_artefact
    with: { opt_adl2: "${ds:cnf.adl2.opt.minimal_d}" }
    expect: already_exists
postconditions:
  - assert: state
    text: "The originally uploaded OPT remains loaded (verified via retrieval)"
    verified_by: I_DEFINITION_ADL2.get_artefact-retrieve
verified_by: [I_DEFINITION_ADL2.get_artefact-retrieve]
ambiguities: [AMB-37, AMB-105]
