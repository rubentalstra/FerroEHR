# SM I_DEFINITION_ADL2.valid_artefact positive: a valid ADL2 artefact tests
# valid. ITS-REST 1.1.0 exposes no dedicated artefact-validation endpoint, so
# validity is realized via upload_artefact (AMB-37; the same precedent as the
# ADL 1.4 validate_opt chapter): a valid artefact is accepted.
id: I_DEFINITION_ADL2.valid_artefact-valid
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.valid_artefact
capabilities: [Adl2OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [OPTIONS]
test_purpose: "A valid ADL2 artefact validates positively (realized via upload on ITS-REST 1.1.0)."
description: "valid_artefact for a valid ADL2 OPT"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.valid_artefact"
  - "AM AOM2 §Validity (a valid artefact satisfies the AOM2 validity rules)"
  - "ITS-REST OAS operations/definition_template_adl2_upload.yaml §responses ('201')"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.adl2.opt.minimal_e, expected: created }
    - { data_set: cnf.adl2.opt.minimal_f, expected: created }
flow:
  - step: 1
    call: upload_artefact
    with: { opt_adl2: "${ds:fixture}" }
    expect: "${fixture.expected}"
ambiguities: [AMB-37]
