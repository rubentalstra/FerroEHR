# SM I_DEFINITION_ADL2.list_matching_artefacts positive: list artefacts whose
# identifiers match a pattern. ITS-REST 1.1.0 realizes this via the ADL2 list's
# filter_template_id query, which matches with WILDCARDS (`*`), not the SM's
# regex (AMB-37; the SM invalid_id_pattern negative has no wire error path).
id: I_DEFINITION_ADL2.list_matching_artefacts-filter
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_matching_artefacts
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "Listing ADL2 artefacts by an id pattern returns the matching operational templates."
description: "list ADL2 artefacts matching an id pattern"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_matching_artefacts"
  - "ITS-REST OAS operations/definition_template_adl2_list.yaml §responses ('200')"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.adl2.opt.minimal]   # the upload ground — provisioned, 409-tolerant on a shared world
data_sets: [cnf.adl2.opt.minimal]
flow:
  - step: 1
    call: list_matching_artefacts
    with: { id_pattern: "openEHR-EHR-COMPOSITION.cnf_minimal*" }
    expect: ok
postconditions:
  - assert: state
    text: "The filtered list contains the loaded OPT whose id matches the pattern"
    verified_by: I_DEFINITION_ADL2.get_artefact-retrieve
ambiguities: [AMB-37, AMB-107]
