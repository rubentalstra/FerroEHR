# SM I_DEFINITION_ADL2.delete_artefact: deleting a non-existing artefact is
# rejected and leaves the server unchanged.
#
# REALIZATION, re-derived first-hand 2026-07-29 (#637): ITS-REST 1.1.0 still
# surfaces no ADL 2 archetype/artefact resource — its ADL 2 group is
# /definition/template/adl2* alone (register AMB-37) — but this product SERVES
# the operation on a declared extension route, so the case is EXECUTED against
# that route instead of resolving excused. It gates the
# Adl2ArchetypeProvisioning capability only; no openEHR profile tier and no
# ITS-REST wire-conformance claim rests on it.
id: I_DEFINITION_ADL2.delete_artefact-non_existing
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.delete_artefact
capabilities: [Adl2ArchetypeProvisioning, Adl2OptProvisioning]
profiles: [OPTIONS]
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the ADL 2 archetype/artefact routes (/definition/archetype/adl2*, /definition/artefact/adl2*); our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-37. The row gates the Adl2ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: "Deleting a non-existing ADL2 artefact is rejected and leaves the server unchanged."
description: "delete a non-existing ADL2 artefact"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.delete_artefact"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: delete_artefact
    on: admin                              # ADMIN-role principal (ixit) — the delete carries the Admin operation class
    with: { template_id: "openEHR-EHR-COMPOSITION.cnf_absent.v1.0.0" }
    expect: not_found
postconditions:
  - assert: state
    text: "No artefacts are loaded on the system"
    verified_by: I_DEFINITION_ADL2.list_opts-empty
verified_by: [I_DEFINITION_ADL2.list_opts-empty]
ambiguities: [AMB-37]
