# SM I_DEFINITION_ADL2.list_archetypes: list artefacts whose concrete type is
# AUTHORED_ARCHETYPE. ITS-REST 1.1.0 provisions only operational templates and
# surfaces no archetype-listing wire (AMB-37), so the its-rest binding declares
# the operation unrealized and this case is not-applicable WITH CITATION; it
# activates when ADL2 archetype provisioning lands in a later ITS release.
id: I_DEFINITION_ADL2.list_archetypes-unrealized
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_archetypes
capabilities: [Adl2ArchetypeProvisioning]
profiles: [OPTIONS]
test_purpose: "Listing ADL2 archetypes returns the loaded AUTHORED_ARCHETYPEs."
description: "list all ADL2 archetypes"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_archetypes"
  - "AM AOM2 §Archetypes (AUTHORED_ARCHETYPE)"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: list_archetypes
    expect: ok
ambiguities: [AMB-37]
