# The SYNTACTIC rejection branch of the ADL2 artefact upload, isolated from the
# semantic one (I_DEFINITION_ADL2.upload_artefact-invalid_artefacts, which
# keeps the rows that parse but are not valid artefacts). The ADL2 twin of
# I_DEFINITION_ADL14.upload_opt-unparseable_opt.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §HTTP status codes,
# row 400): "The service cannot or will not process the request due to
# something that is perceived to be a client error (e.g., malformed request
# syntax, syntactically invalid content)" — against row 422, "The request was
# well-formed but was unable to be followed due to semantic errors". Neither
# fixture here is well-formed: a source with a truncated cADL block and a
# source with no content at all both fail the AM `adl_operational_template`
# production before any validity rule can run (AM `OPT2/master03-opt_raw.adoc`
# §Artefact Structure), so both are the row-400 case.
#
# Both rows are phase-UNAMBIGUOUS. The boundary defects — a source that parses
# up to a MISSING mandatory section, which the AM grammar and the AOM2
# validation catalogue both claim — are held out and registered as AMB-116.
# Register: AMB-110 (the branch split).
id: I_DEFINITION_ADL2.upload_artefact-unparseable_artefact
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.upload_artefact
capabilities: [Adl2OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [OPTIONS]
test_purpose: >-
  An ADL2 upload whose body does not parse as an operational template is
  refused as a client error at the syntactic branch, not the semantic one, and
  leaves the artefact store untouched.
description: "upload unparseable ADL2 sources"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.upload_artefact"
  - "AM ADL2 §Syntax (a well-formed artefact must parse)"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.adl2.opt.invalid.unparseable, expected: bad_request, defect: "malformed cADL block — the source does not parse" }
    - { data_set: cnf.adl2.opt.invalid.empty, expected: bad_request, defect: "empty source — no artefact production at all" }
flow:
  - step: 1
    call: upload_artefact
    variant: unparseable                 # pins the 400 realization
    with: { opt_adl2: "${ds:fixture}" }
    expect: "${fixture.expected}"        # §HTTP status codes row 400 — syntactically invalid content
postconditions:
  - assert: state
    text: "No artefacts are loaded on the system (the rejected upload left state unchanged)"
    verified_by: I_DEFINITION_ADL2.list_opts-empty
verified_by: [I_DEFINITION_ADL2.list_opts-empty]
ambiguities: [AMB-110]
