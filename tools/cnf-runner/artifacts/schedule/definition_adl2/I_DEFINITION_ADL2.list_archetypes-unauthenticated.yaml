# The AUTHENTICATION boundary of the ADL 2 archetype/artefact surface.
#
# The census showed this battery proving only ok / deleted / not_found — no
# refusal-by-principal row at all — and a battery that never sees a refused
# request cannot catch a server that serves this surface to anyone. One
# behaviour, swept across all five routes the capability serves (the two
# listings, the two counts and the delete), the same way
# SEC-AUTHENTICATED_ACCESS sweeps the core operations: the property is
# route-table-wide, so five separate cases would say one thing five times.
#
# EXTENSION ROUTES (register AMB-37): the outcome mapping is UNIVERSAL, not
# per-binding (vocab/selectors.yaml universal_outcomes: unauthenticated -> 401,
# route-table-wide). The refusal is the served routes' own documented contract
# (their `#[utoipa::path]` declares the 401 branch); no openEHR spec governs
# these routes.
id: I_DEFINITION_ADL2.list_archetypes-unauthenticated
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_archetypes
capabilities: [Adl2ArchetypeProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  Every ADL 2 archetype/artefact route refuses a request that carries no valid
  authentication — both listings, both counts and the delete alike, and
  regardless of whether the addressed artefact exists.
description: "Unauthenticated requests to the ADL 2 archetype/artefact routes are refused"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_archetypes"
  - "SM openehr_platform §I_DEFINITION_ADL2.archetypes_count"
  - "SM openehr_platform §I_DEFINITION_ADL2.list_artefacts"
  - "SM openehr_platform §I_DEFINITION_ADL2.artefacts_count"
  - "SM openehr_platform §I_DEFINITION_ADL2.delete_artefact"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the ADL 2 archetype/artefact routes (/definition/archetype/adl2*, /definition/artefact/adl2*); our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-37. The row gates the Adl2ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
flow:
  - step: 1
    call: list_archetypes
    on: unauthenticated
    expect: unauthenticated              # universal 401 (route-table-wide)
  - step: 2
    call: archetypes_count
    on: unauthenticated
    expect: unauthenticated
  - step: 3
    call: list_artefacts
    on: unauthenticated
    expect: unauthenticated
  - step: 4
    call: artefacts_count
    on: unauthenticated
    expect: unauthenticated
  - step: 5
    call: delete_artefact
    on: unauthenticated
    with: { template_id: "openEHR-EHR-COMPOSITION.cnf_absent.v1.0.0" }
    expect: unauthenticated
ambiguities: [AMB-37]
