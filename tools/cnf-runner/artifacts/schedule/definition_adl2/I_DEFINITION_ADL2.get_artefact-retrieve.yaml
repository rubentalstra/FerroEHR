# SM I_DEFINITION_ADL2.get_artefact positive (Pre_artefact_exists: has_artefact).
# Retrieve a loaded OPT by template_id and check it is the artefact that was
# uploaded. The flow includes the upload so there is something to retrieve.
# Re-adjudicated from the retired ECC-ADL2-006 row (representation forms ride
# the wire binding's content negotiation, not the protocol-neutral case).
id: I_DEFINITION_ADL2.get_artefact-retrieve
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.get_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "Retrieving a loaded ADL2 OPT by template_id returns the artefact that was uploaded."
description: "retrieve a single ADL2 OPT"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.get_artefact"
  - "AM ADL2 §Templates (operational template form)"
  - "ITS-REST definition_template_adl2_get §200 OK"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.adl2.opt.minimal]
flow:
  - step: 1
    call: upload_artefact
    with: { opt_adl2: "${ds:cnf.adl2.opt.minimal}" }
    expect: created
    capture: { template_id: created.template_id }
  - step: 2
    call: get_artefact
    with: { template_id: "${template_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: committed }   # the retrieved OPT is the uploaded one
