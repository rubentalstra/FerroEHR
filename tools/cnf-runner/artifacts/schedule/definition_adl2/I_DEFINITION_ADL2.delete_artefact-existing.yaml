# SM I_DEFINITION_ADL2.delete_artefact positive: deleting an existing artefact
# succeeds and it is no longer retrievable. ITS-REST 1.1.0 surfaces no wire for
# delete_artefact (AMB-37), so the its-rest binding declares the operation
# unrealized and this case is not-applicable WITH CITATION on this ITS; it
# activates when a later ITS release adds an ADL2 DELETE.
id: I_DEFINITION_ADL2.delete_artefact-existing
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.delete_artefact
capabilities: [Adl2ArchetypeProvisioning, Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "Deleting an existing ADL2 artefact succeeds and the artefact is no longer retrievable."
description: "delete an existing ADL2 artefact"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.delete_artefact"
  - "ITS-REST definition_template_adl2_get §404 Not Found"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.adl2.opt.minimal]
flow:
  - step: 1
    call: upload_artefact
    with: { opt_adl2: "${ds:cnf.adl2.opt.minimal}" }
    expect: created
    capture: { template_id: created.template_id }
  - step: 2
    call: delete_artefact
    with: { template_id: "${template_id}" }
    expect: deleted
  - step: 3
    call: get_artefact
    with: { template_id: "${template_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: "The deleted artefact is no longer retrievable (verified by step 3)"
ambiguities: [AMB-37]
