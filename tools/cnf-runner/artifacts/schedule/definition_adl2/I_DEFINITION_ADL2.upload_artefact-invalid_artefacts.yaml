# SM I_DEFINITION_ADL2.upload_artefact negative sweep, SEMANTIC half: artefacts
# that PARSE but fail the Pre_valid (valid_artefact) precondition and are
# rejected (SM Errors: `invalid artefact`), leaving the server state unchanged.
#
# SCOPE (re-adjudicated 2026-07-27, group-10 audit): this case owns only the
# semantic branch. The released 400 trigger is confined to input that does not
# parse — ITS-REST overview `Requests_and_responses.md` §HTTP status codes,
# row 400: "The service cannot or will not process the request due to something
# that is perceived to be a client error (e.g., malformed request syntax,
# syntactically invalid content)" — so it cannot own a source that parses. The
# semantic branch has no status either upload operation declares at all, and
# AMB-110 fixes it at 422 on the same table's row 422: "The request was
# well-formed but was unable to be followed due to semantic errors". The
# syntactic half moved to its own isolated case,
# I_DEFINITION_ADL2.upload_artefact-unparseable_artefact.
#
# FIXTURE CHOICE: the row is a defect the AM catalogues place unambiguously in
# the VALIDATION phase — VARDT, "check match of root RM type with RM type
# mentioned in identifier" (AM `AOM2/master08-validation.adoc` §Phase 1 - Basic
# Integrity §Basic checks). The former `missing_description` /
# `missing_definition` rows are NOT phase-unambiguous: a missing mandatory
# section is both a missing production of the `adl_operational_template`
# grammar (AM `OPT2/master03-opt_raw.adoc` §Artefact Structure) and a named
# validation check in that same §Basic checks list ("any missing mandatory
# parts, e.g. `terminology` section (STCNT)"), so they are held out of the
# catalogue and registered as AMB-116 rather than pinned to a status the
# released text does not settle.
id: I_DEFINITION_ADL2.upload_artefact-invalid_artefacts
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.upload_artefact
capabilities: [Adl2OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [OPTIONS]
test_purpose: "ADL2 artefacts that parse but are not valid are rejected as semantically invalid and leave the server state unchanged."
description: "upload semantically invalid ADL2 artefacts"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.upload_artefact"
  - "AM AOM2 §Validation (Phase 1 - Basic Integrity)"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.adl2.opt.invalid.rm_type_mismatch, expected: validation_failed, defect: "root RM type contradicts the identifier (VARDT)" }
flow:
  - step: 1
    call: upload_artefact
    with: { opt_adl2: "${ds:fixture}" }
    expect: "${fixture.expected}"
postconditions:
  - assert: state
    text: "No artefacts are loaded on the system (the rejected upload left state unchanged)"
    verified_by: I_DEFINITION_ADL2.list_opts-empty
verified_by: [I_DEFINITION_ADL2.list_opts-empty]
ambiguities: [AMB-110, AMB-116]
