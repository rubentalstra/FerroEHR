# SM I_DEFINITION_ADL2.list_templates positive: list artefacts whose concrete
# type is TEMPLATE. ITS-REST 1.1.0 exposes only ONE ADL2 list endpoint that
# returns operational templates and does not distinguish bare TEMPLATEs from
# OPTs (AMB-37), so this realizes via the same GET /definition/template/adl2.
id: I_DEFINITION_ADL2.list_templates-non_empty
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_templates
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "Listing ADL2 templates returns the loaded templates (conflated with OPTs on ITS-REST 1.1.0)."
description: "list ADL2 templates when some are loaded"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_templates"
  - "AM AOM2 §Templates (TEMPLATE vs OPERATIONAL_TEMPLATE)"
  - "ITS-REST definition_template_adl2_list §200 OK"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.adl2.opt.minimal]
flow:
  - step: 1
    call: upload_artefact
    with: { opt_adl2: "${ds:cnf.adl2.opt.minimal}" }
    expect: created
  - step: 2
    call: list_templates
    expect: ok
postconditions:
  - assert: state
    text: "The list contains the loaded template (retrievable by template_id)"
    verified_by: I_DEFINITION_ADL2.get_artefact-retrieve
ambiguities: [AMB-37]
