# SM I_DEFINITION_ADL2.has_artefact negative: False when no artefact with the
# given id exists. Realized via the list-by-filter GET (AMB-37): an empty
# filtered list means absent — a 200 with no entries, not an error.
id: I_DEFINITION_ADL2.has_artefact-non_existing
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.has_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "has_artefact reports false for an unknown ADL2 template_id."
description: "has_artefact for a non-existing ADL2 OPT"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.has_artefact"
  - "ITS-REST definition_template_adl2_list §200 OK"
applies: { rm: ">=1.0.2" }
requires: { server: exclusive }    # global-state ground — shared instances N/A
flow:
  - step: 1
    call: has_artefact
    with: { template_id: "openEHR-EHR-COMPOSITION.cnf_absent.v1.0.0" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }    # the LIST-filter realization: an empty match set IS the Boolean false (binding NOTE)   # has_artefact: Boolean False for an absent artefact
ambiguities: [AMB-37]
