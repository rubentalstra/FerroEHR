# The request-side media-type branch of the ADL2 artefact upload — the mirror
# of I_DEFINITION_ADL14.upload_opt-wrong_media on the other Definition
# interface. The ADL2 upload carries exactly one body type (the ADL2 source as
# text/plain), so a request that DECLARES another payload media type cannot be
# processed and is refused with 415, not with the parser's generic client
# error.
#
# DOCS TEXT (ITS-REST overview `Resources.md` §XML Format): "If the service
# cannot process the request payload as XML format, it MUST respond with HTTP
# status code `415 Unsupported Media Type`"; §JSON Format states the mirror
# rule for a payload the service cannot process as JSON. One behaviour per
# case: the body is the same valid ADL2 source the accepted upload uses, so
# only the declared media type distinguishes this exchange.
id: I_DEFINITION_ADL2.upload_artefact-wrong_media
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.upload_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  An ADL2 artefact upload declaring a media type the operation does not accept
  is refused as unsupported_media, leaving the artefact store untouched.
description: "ADL2 artefact upload with a non-text/plain Content-Type"
spec_refs:
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §JSON Format"
  - "SM openehr_platform §I_DEFINITION_ADL2.upload_artefact"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
data_sets: [cnf.adl2.opt.vitals]
flow:
  - step: 1
    call: upload_artefact
    variant: wrong_media_type            # sends Content-Type: application/xml on the text/plain-only upload
    with: { opt_adl2: "${ds:cnf.adl2.opt.vitals}" }
    expect: unsupported_media            # Resources.md §XML Format MUST
