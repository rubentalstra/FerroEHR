# The ROLE-CLASS boundary of the ADL 2 archetype/artefact surface: the artefact
# DELETE carries the coarse `Admin` operation class while the four listings and
# counts stay `Clinical`, so an authenticated, non-read-only principal holding
# only the ordinary clinical role is refused on the delete alone.
#
# The class split is OUR OWN DESIGN on the blast radius of destroying a
# deployment-wide definition artefact, and the specification hands the choice
# over rather than being silent on it: SM openehr_platform master02-overview.adoc
# §Functional Style lists "approach to access control and authorisation" among
# the dimensions where "different choices will be made", and states that
# "Authentication and authorisation is assumed to have been dealt with before
# any particular call has been made … and role-based access control".
#
# The listing control is what makes the row a statement about the DELETE rather
# than about the principal: this family serves no other write (its remaining
# four routes are all GETs), so the control is necessarily a read.
#
# EXTENSION ROUTES (register AMB-37): the outcome mapping is UNIVERSAL
# (vocab/selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide).
id: I_DEFINITION_ADL2.delete_artefact-clinical_forbidden
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.delete_artefact
capabilities: [Adl2ArchetypeProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated principal holding only the clinical role is refused on the
  ADL 2 artefact DELETE and served on the artefact listing — the delete's Admin
  operation class is enforced, and only against the delete.
description: "A clinical-role principal is forbidden from deleting an ADL 2 artefact"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.delete_artefact"
  - "SM openehr_platform §I_DEFINITION_ADL2.list_artefacts"
  - "SM openehr_platform master02-overview §Functional Style"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the ADL 2 archetype/artefact routes (/definition/archetype/adl2*, /definition/artefact/adl2*); our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-37. The row gates the Adl2ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
  - "addresses the ixit `sut` instance — the ordinary authenticated principal, which carries no ADMIN role; a party whose default principal IS an administrator cannot drive this boundary and records the case not-applicable with that citation (ISO/IEC 9646 test selection)"
requires: { server: any }
flow:
  # Addressed at an id the store does not hold: the refusal is a role decision
  # taken before the store is consulted, so a server that answered not_found
  # here would be admitting the caller to the operation.
  - step: 1
    call: delete_artefact
    with: { template_id: "openEHR-EHR-COMPOSITION.cnf_absent.v1.0.0" }
    expect: forbidden                    # universal 403 (route-table-wide)
  # The control: the same principal reads the surface it may not destroy.
  - step: 2
    call: list_artefacts
    expect: ok
ambiguities: [AMB-37]
