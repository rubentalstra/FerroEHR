# The `Prefer: return=minimal` verbosity branch of the ADL2 artefact upload,
# stated explicitly rather than left to the default — the ADL2 twin of
# I_DEFINITION_ADL14.upload_opt-prefer_minimal.
#
# The status/body pair is assigned by the upload's own 201 text: "`201 Created`
# is returned when the template has been successfully uploaded. … If the
# `Prefer` header is missing or set to `return=minimal`, the body is empty." So
# the minimal upload answers the created status with NO body — not the 204 the
# overview's general default suggests for a body-less write ("If no response
# body is returned, the service SHOULD use `204 No Content`",
# Requests_and_responses.md §Prefer minimal, identifier or full representation
# response), because that SHOULD governs writes whose own operation text
# assigns nothing. Registered as AMB-110(b).
#
# The `Location` SHOULD from the same overview section is executed by the
# variant binding, and step 2 dereferences it.
id: I_DEFINITION_ADL2.upload_artefact-prefer_minimal
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.upload_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  An ADL2 artefact upload sent with Prefer: return=minimal answers the created
  status with an empty body and a Location header addressing the uploaded
  artefact.
description: "Prefer: return=minimal honoured on ADL2 artefact upload"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_DEFINITION_ADL2.upload_artefact"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: any }
data_sets: [cnf.adl2.opt.minimal_h]
flow:
  - step: 1
    call: upload_artefact
    variant: return_minimal              # pins Prefer: return=minimal
    with: { opt_adl2: "${ds:cnf.adl2.opt.minimal_h}" }
    expect: created                      # the upload's 201 text
    capture: { template_id: created.template_id }
  - step: 2                              # the Location the empty-bodied response carries addresses the artefact
    call: get_artefact
    with: { template_id: "${template_id}" }
    expect: ok
ambiguities: [AMB-110]
