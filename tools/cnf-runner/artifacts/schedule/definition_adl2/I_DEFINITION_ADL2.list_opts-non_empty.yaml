# SM I_DEFINITION_ADL2.list_opts positive: list all operational templates whose
# concrete type is OPERATIONAL_TEMPLATE. The flow loads two OPTs first so the
# list is non-empty. Re-adjudicated from the retired ECC-ADL2-012 row (the
# TemplateMetadata fields — template_id/concept/archetype_id/created_timestamp —
# ride the wire binding's list schema).
id: I_DEFINITION_ADL2.list_opts-non_empty
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_opts
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "Listing ADL2 OPTs returns the loaded operational templates."
description: "list ADL2 OPTs when some are loaded"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_opts"
  - "ITS-REST OAS operations/definition_template_adl2_list.yaml §responses ('200')"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.adl2.opt.minimal, cnf.adl2.opt.vitals]   # the upload ground — provisioned, 409-tolerant on a shared world
data_sets: [cnf.adl2.opt.minimal, cnf.adl2.opt.vitals]
flow:
  - step: 1
    call: list_opts
    expect: ok
postconditions:
  - assert: state
    text: "The list contains the two loaded OPTs (each retrievable by template_id)"
    verified_by: I_DEFINITION_ADL2.get_artefact-retrieve
