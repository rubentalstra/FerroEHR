# The explicit-`version` branch with an EXACT release: `version=1.0.0`
# returns only the family member whose HRID carries that release_version —
# the filter's subject is the id's VERSION AXIS, "taken from `template_id`"
# (the RELEASED OAS grounds docs-text silence, cited AS the OAS:
# specifications/parameters/query/filter_version.yaml). Found shipped
# matching the WHOLE id — every non-`*` filter answered empty (#2567); this
# case pins the exact-axis branch on the ADL2 list.
id: I_DEFINITION_ADL2.list_opts-version_exact_axis
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_opts
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  Listing ADL2 OPTs with an exact `version` returns only the family member
  carrying that release_version.
description: "list ADL2 OPTs with `version=1.0.0` — the v1.0.0 member alone"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_opts"
  - "ITS-REST OAS parameters/query/filter_version.yaml (docs-text-silent ground): \"Filter by version …, taken from `template_id`\""
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.adl2.opt.versioned_v100, cnf.adl2.opt.versioned_v110]   # the versioned pair — provisioned, 409-tolerant on a shared world
data_sets: [cnf.adl2.opt.versioned_v100, cnf.adl2.opt.versioned_v110]
flow:
  - step: 1
    call: list_opts
    variant: filter_version
    with: { version: "1.0.0" }
    expect: ok
    assert:
      - { assert: returns, matches: "cnf_adl2_versioned\\.v1\\.0\\.0", omits: "cnf_adl2_versioned\\.v1\\.1\\.0" }
