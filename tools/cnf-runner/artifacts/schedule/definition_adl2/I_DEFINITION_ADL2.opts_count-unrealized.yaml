# SM I_DEFINITION_ADL2.opts_count: total count of operational templates.
# ITS-REST 1.1.0 surfaces no count endpoint (AMB-37; derivable client-side from
# the ADL2 list length), so the its-rest binding declares the operation
# unrealized and this case is not-applicable WITH CITATION.
id: I_DEFINITION_ADL2.opts_count-unrealized
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.opts_count
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "opts_count returns the total number of operational templates (zero on an empty server)."
description: "count all ADL2 OPTs"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.opts_count"
  - "AM AOM2 §Templates (OPERATIONAL_TEMPLATE)"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: opts_count
    expect: ok
    assert:
      - { assert: returns, equals: 0 }   # empty server -> zero OPTs
ambiguities: [AMB-37]
