# PARTIAL-prefix resolution on the ADL2 "Get a template at version" endpoint:
# a `{version}` segment that is a `{major}` prefix rather than an exact SEMVER
# must resolve to the HIGHEST matching version, not to an arbitrary member of
# the family.
#
# Decisive released sentence (ITS-REST
# specifications/parameters/path/version.yaml, the `{version}` path parameter
# of definition_template_adl2_version_get): "A SEMVER version number. This can
# be an exact version (e.g. `1.7.1`), or a pattern as partial prefix, in a form
# of `{major}` or `{major}.{minor}` (e.g. `1` or `1.0`), in which case the
# highest (latest) version matching the prefix will be considered." The
# artefact is addressed by the version-less HRID, which
# parameters/path/template_id.yaml admits ("Template identifier or partial
# reference").
#
# The resolution is OBSERVABLE through the entity tag: the overview's §"ETag
# and Last-Modified" makes it the resource's unique state identifier, which for
# an ADL2 operational template is its versioned ARCHETYPE_HRID (AM am24 —
# `release_version` is the artefact's SEMVER; register AMB-112). Step 2
# captures the HRID the higher upload minted and the variant binding's matcher
# compares the served tag against it, so resolving to the LOWER member fails
# the row rather than passing silently.
#
# The endpoint is deprecated (SPECITS-87) and still fully specified, so it is
# served; the guard lets a SUT that withdrew the surface skip rather than fail
# (register AMB-113, which also carries the pre-release-SEMVER position).
# One behaviour per case: the exact-version sibling is
# I_DEFINITION_ADL2.get_artefact-version_get.
id: I_DEFINITION_ADL2.get_artefact-version_prefix
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.get_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
guards:
  - "ADL2 Get-template-at-version is deprecated in ITS-REST 1.1.0 (deprecated: true) — ITS-REST definition_template_adl2_version_get; SPECITS-87 (skip where the deprecated surface is withdrawn)"
test_purpose: >-
  A {major} version prefix on the ADL2 version GET resolves to the highest
  matching release of that artefact, not to a lower member of the family.
description: "get an ADL2 OPT by a partial {major} version prefix"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.get_artefact"
  - "ITS-REST definition_template_adl2_version_get §200 OK"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: any }
data_sets: [cnf.adl2.opt.versioned_v100, cnf.adl2.opt.versioned_v110]
flow:
  - step: 1
    call: upload_artefact
    with: { opt_adl2: "${ds:cnf.adl2.opt.versioned_v100}" }   # ...cnf_adl2_versioned.v1.0.0
    expect: created
  - step: 2
    call: upload_artefact
    with: { opt_adl2: "${ds:cnf.adl2.opt.versioned_v110}" }   # ...cnf_adl2_versioned.v1.1.0 — the highest match
    expect: created
    capture: { resolved_hrid: created.template_id }
  - step: 3
    call: get_artefact
    variant: version_prefix
    with:
      template_id: "openEHR-EHR-COMPOSITION.cnf_adl2_versioned"   # the artefact, version-less
      version: "1"                                               # the {major} prefix form
    expect: ok                            # "the highest (latest) version matching the prefix will be considered"
ambiguities: [AMB-113]
