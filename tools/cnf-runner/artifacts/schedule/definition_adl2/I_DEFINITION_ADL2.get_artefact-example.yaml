# ITS-REST ADL2 "Get example data by template": generate an example LOCATABLE
# (COMPOSITION) instance from a loaded OPT. The SM I_DEFINITION_ADL2 defines NO
# example-generation operation, so this case anchors to the closest SM op,
# get_artefact, and selects the example wire via `variant: example` (AMB-37).
# Re-adjudicated from the retired ECC-ADL2-009 / ECC-ADL2-010 rows (the detail
# levels + Accept negotiation ride the wire binding).
id: I_DEFINITION_ADL2.get_artefact-example
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.get_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "An example data instance is generated from a loaded ADL2 OPT and returned in the negotiated LOCATABLE format."
description: "get example data by ADL2 template"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.get_artefact"
  - "AM AOM2 §Templates (an OPT constrains a COMPOSITION instance)"
  - "ITS-REST OAS operations/definition_template_adl2_example_get.yaml §responses ('200')"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.adl2.opt.minimal]   # the upload ground — provisioned, 409-tolerant on a shared world
data_sets: [cnf.adl2.opt.minimal]
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
flow:
  - step: 1
    call: get_artefact
    variant: example
    with: { template_id: "openEHR-EHR-COMPOSITION.cnf_minimal.v1.0.0" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }   # the example is a COMPOSITION rooted at the OPT
ambiguities: [AMB-37]
