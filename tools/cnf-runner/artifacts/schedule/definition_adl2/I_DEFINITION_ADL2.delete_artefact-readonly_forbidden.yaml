# The AUTHORIZATION boundary of the ADL 2 archetype/artefact surface — the
# separate half of the -unauthenticated sibling: this principal IS
# authenticated, and is refused anyway.
#
# One behaviour: an authenticated principal whose authorization is read-only is
# refused on the capability's one mutating route (the artefact delete) and
# served on its reads. The read step is the control that makes the row a
# statement about the ROUTE rather than about the principal.
#
# EXTENSION ROUTES (register AMB-37): the outcome mapping is UNIVERSAL
# (vocab/selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide).
# OPERATION CLASSES on this family are SPLIT: the four listings and counts carry
# the coarse `Clinical` class, while the artefact DELETE carries `Admin` despite
# not sitting under /admin/, so this principal is refused by the role gate
# before the read-only restriction is reached — both refusals hold, and the row
# no longer ISOLATES the restriction. The class assignment is our own design on
# the delete's blast radius; SM openehr_platform master02-overview.adoc
# §Functional Style lists "approach to access control and authorisation" among
# the implementation choices and assumes authorisation "dealt with before any
# particular call has been made … and role-based access control", so no released
# clause governs it. Because the delete was this family's only write, the
# restriction is unobservable here and is pinned instead on the ADL 2 surface's
# remaining Clinical write, the released template upload
# (I_DEFINITION_ADL2.upload_artefact-readonly_forbidden); the delete's Admin
# branch has its own row (I_DEFINITION_ADL2.delete_artefact-clinical_forbidden).
id: I_DEFINITION_ADL2.delete_artefact-readonly_forbidden
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.delete_artefact
capabilities: [Adl2ArchetypeProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated read-only principal is refused on the ADL 2 artefact delete
  and served on the artefact listing — authorization is enforced separately
  from authentication, and only against the mutating half.
description: "A read-only principal is forbidden from deleting an ADL 2 artefact"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.delete_artefact"
  - "SM openehr_platform §I_DEFINITION_ADL2.list_artefacts"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the ADL 2 archetype/artefact routes (/definition/archetype/adl2*, /definition/artefact/adl2*); our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-37. The row gates the Adl2ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
flow:
  - step: 1
    call: delete_artefact
    on: readonly
    with: { template_id: "openEHR-EHR-COMPOSITION.cnf_absent.v1.0.0" }
    expect: forbidden                    # universal 403 (route-table-wide)
  # The control: the same principal reads the surface it may not write.
  - step: 2
    call: list_artefacts
    on: readonly
    expect: ok
ambiguities: [AMB-37]
