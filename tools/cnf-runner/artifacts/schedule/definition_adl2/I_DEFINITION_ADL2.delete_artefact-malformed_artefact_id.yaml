# The MALFORMED-IDENTIFIER branch of the ADL 2 artefact delete.
#
# DERIVATION (resolved against the route's own documented contract, not
# invented): the served delete declares exactly two answers, 204 and 404, and
# imposes NO syntactic gate on the path segment — the AOM2 artefact HRID is an
# opaque store key matched case-insensitively (BASE master05 §"Composite
# Identifiers and Case"), so a segment that is not a well-formed HRID is simply
# an id nothing is stored under. The honest answer is the same `not_found` a
# well-formed-but-absent id gets, and the case pins it: a server that answered
# 204 (deleting nothing while reporting success), 400 or 500 on junk input
# would be caught, and so would one that let the junk reach the store.
#
# Contrast kept explicit by the sibling: `delete_artefact-non_existing`
# addresses a WELL-FORMED HRID the store does not hold. Same outcome, different
# input class — two rows because a server could handle one and not the other.
#
# The chosen segment carries no rm-entity structure and no `.vN.n.n` version
# part, so it cannot be a legal AOM2 HRID under any reading.
id: I_DEFINITION_ADL2.delete_artefact-malformed_artefact_id
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.delete_artefact
capabilities: [Adl2ArchetypeProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  Deleting an ADL 2 artefact through a path segment that is not a well-formed
  HRID answers not_found — the id is opaque to the store, so an unparseable one
  names nothing rather than faulting or reporting a phantom delete.
description: "delete an ADL 2 artefact by a malformed HRID"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.delete_artefact"
  - "BASE master05 §Composite Identifiers and Case"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the ADL 2 archetype/artefact routes (/definition/archetype/adl2*, /definition/artefact/adl2*); our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-37. The row gates the Adl2ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
flow:
  - step: 1
    call: delete_artefact
    on: admin                              # ADMIN-role principal (ixit) — the delete carries the Admin operation class
    with: { template_id: "not-an-artefact-hrid" }
    expect: not_found
ambiguities: [AMB-37]
