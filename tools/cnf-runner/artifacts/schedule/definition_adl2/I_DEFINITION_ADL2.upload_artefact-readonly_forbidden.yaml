# The READ-ONLY boundary of the ADL 2 definition surface, on the one Clinical
# write that surface still has.
#
# The artefact DELETE used to carry it, but that route now carries the coarse
# `Admin` operation class, so a read-only principal is refused there by the role
# gate before the restriction is reached — the restriction became unobservable
# on the whole ADL 2 extension family, whose remaining four routes are GETs
# (vocab/wire_surface.yaml family adl2-archetype). The released operational-
# template upload is the surviving Clinical write of the ADL 2 group, so the
# assertion moves here rather than being dropped. Class assignment is our own
# design: SM openehr_platform master02-overview.adoc §Functional Style lists
# "approach to access control and authorisation" among the implementation
# choices and assumes authorisation "dealt with before any particular call has
# been made … and role-based access control".
#
# HONEST SCOPE of the row: the outcome mapping is UNIVERSAL
# (vocab/selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide)
# and the wire does not disclose WHICH read-only control refused — under the
# SMART posture the ixit's read-only instance also holds a read-only scope
# grant. Both are read-only authorization; the asserted property is that a
# read-only principal cannot write this surface and can still read it.
id: I_DEFINITION_ADL2.upload_artefact-readonly_forbidden
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.upload_artefact
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated read-only principal is refused on the ADL 2 operational-
  template upload and served on the template listing — authorization is
  enforced separately from authentication, and only against the mutating half.
description: "A read-only principal is forbidden from uploading an ADL 2 operational template"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.upload_artefact"
  - "SM openehr_platform §I_DEFINITION_ADL2.list_opts"
  - "SM openehr_platform master02-overview §Functional Style"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 403 — forbidden)"
applies: { rm: ">=1.0.2" }
requires: { server: any }
data_sets: [cnf.adl2.opt.minimal]
flow:
  - step: 1
    call: upload_artefact
    on: readonly
    with: { opt_adl2: "${ds:cnf.adl2.opt.minimal}" }
    expect: forbidden                    # universal 403 (route-table-wide)
  # The control: the same principal reads the surface it may not write.
  - step: 2
    call: list_opts
    on: readonly
    expect: ok
