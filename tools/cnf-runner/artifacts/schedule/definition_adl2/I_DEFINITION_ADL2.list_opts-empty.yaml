# SM I_DEFINITION_ADL2.list_opts on an empty server: returns an empty set and
# does not fail. Also the read side of the upload_artefact-invalid_artefacts
# unchanged-state postcondition.
id: I_DEFINITION_ADL2.list_opts-empty
kind: functional
component: DEFINITION_ADL2
sm_operation: I_DEFINITION_ADL2.list_opts
capabilities: [Adl2OptProvisioning]
profiles: [OPTIONS]
test_purpose: "Listing ADL2 OPTs on an empty server returns an empty set and does not fail."
description: "list ADL2 OPTs when none is loaded"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL2.list_opts"
  - "ITS-REST OAS operations/definition_template_adl2_list.yaml §responses ('200')"
applies: { rm: ">=1.0.2" }
requires: { server: exclusive }    # global-state ground (empty listing) — shared instances N/A
flow:
  - step: 1
    call: list_opts
    expect: ok
    assert:
      - { assert: returns, equals: [] }   # empty server -> empty set, not a failure
