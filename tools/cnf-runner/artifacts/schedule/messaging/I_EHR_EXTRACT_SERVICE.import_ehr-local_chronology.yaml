# ONE behaviour: the chronology an imported version CONTAINER reports is the
# LOCAL act of committal, never the source system's.
#
# RM common master06-change_control §Copying states the rule outright: "An
# important consequence of the way IMPORTED_VERSION is modelled is that in the
# Version containers resulting from copy operations, the commit times always
# reflect the local (more recent) act of committal, not the original committal
# of the information to the container where it was created. This ensures that a
# query for the state of a Version container at earlier commit times correctly
# returns what information existed at that time in that container, rather than
# giving the illusion that recently copied Versions were there earlier than the
# time of local committal."
#
# The wire fact that carries it here: `X_VERSIONED_OBJECT.time_created` is
# "Creation time of original VERSIONED_OBJECT"
# (UML/classes/org.openehr.rm.ehr_extract.x_versioned_object.adoc §Attributes),
# i.e. the `VERSIONED_OBJECT.time_created` of the container being exported —
# "Time of initial creation of this versioned object"
# (UML/classes/org.openehr.rm.common.versioned_object.adoc §Attributes). The
# container in THIS repository was created by the import, so its time_created is
# the import instant. The fixture's SOURCE container declares
# 2020-01-02T03:04:05Z, an instant that appears nowhere else in it, so a single
# `omits` predicate catches a re-export that leaked the source chronology.
#
# The control in the same step: the wrapped ORIGINAL_VERSION's own committal
# (2026-07-28T09:00:00Z) MUST still be present — master06 §Committal and Audits
# keeps "the knowledge of the original Contribution and committal … inside the
# wrapped ORIGINAL_VERSION instance". Without it the `omits` would also pass on
# a server that simply discarded the source provenance, which is the opposite
# defect.
#
# Both steps ride the extension route (register AMB-34), as the whole messaging
# family does — the row gates the EhrExtract CAPABILITY only.
id: I_EHR_EXTRACT_SERVICE.import_ehr-local_chronology
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: >-
  An imported version container reports the local act of committal as its
  time_created, never the source system's earlier creation instant, while the
  wrapped original's own committal is retained inside it.
description: "An imported container reports the LOCAL commit chronology"
spec_refs:
  - "RM common master06-change_control §Copying"
  - "RM common master06-change_control §Committal and Audits"
  - "RM common UML/classes/org.openehr.rm.common.versioned_object.adoc"
  - "RM ehr_extract UML/classes/org.openehr.rm.ehr_extract.x_versioned_object.adoc"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.messaging.ehr_extract.imported_local_chronology]
flow:
  - step: 1
    call: import_ehr
    with: { an_extract: "${ds:cnf.messaging.ehr_extract.imported_local_chronology}" }
    expect: created
    capture: { ehr_id: created.ehr_id }
  - step: 2
    call: export_ehrs
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      # The SOURCE container creation instant must not be reported back.
      - { assert: returns, omits: "2020-01-02T03:04:05Z" }
      # …while the wrapped original's own committal is retained.
      - { assert: returns, matches: "2026-07-28T09:00:00Z" }
ambiguities: [AMB-34]
