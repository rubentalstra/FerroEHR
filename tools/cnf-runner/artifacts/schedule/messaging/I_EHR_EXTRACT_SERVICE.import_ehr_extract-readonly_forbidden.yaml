# The AUTHORIZATION boundary of the message extract surface — the separate half
# of the -unauthenticated sibling: this principal IS authenticated, and is
# refused anyway.
#
# One behaviour: an authenticated read-only principal is refused on the
# surface's unambiguous WRITE — importing an EXTRACT's versions into an
# existing EHR — and served on its unambiguous READ. The read step is the
# control that makes the row a statement about the write rather than about the
# principal.
#
# WHY import_ehr_extract carries the write probe: it is the unambiguous WRITE
# of `SM/docs/UML/classes/i_ehr_extract_service.adoc` — the interface's exports
# select held content and commit nothing, its imports commit. The read half of
# the same boundary is the sibling
# -readonly_allowed case (`export_ehr_extracts` served to the same principal),
# so between them the pair says the gate separates the interface by what an
# operation DOES rather than by its HTTP verb.
#
# EXTENSION ROUTES (register AMB-34): the outcome mapping is UNIVERSAL
# (vocab/selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide);
# the routes carry the coarse `Clinical` class — NOT under /admin/, no ADMIN
# role — so the read-only restriction is the only documented role class here.
# No openEHR spec governs role semantics on a route it does not define.
id: I_EHR_EXTRACT_SERVICE.import_ehr_extract-readonly_forbidden
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr_extract
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated read-only principal is refused when importing an EXTRACT
  into an existing EHR, and served when exporting one — authorization is
  enforced separately from authentication.
description: "A read-only principal is forbidden from importing an EXTRACT"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr_extract"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { ehr: { commits: none } }       # mints ${ehr_id}
data_sets: [cnf.messaging.ehr_extract.folder]
flow:
  - step: 1
    call: import_ehr_extract
    on: readonly
    with:
      an_ehr_id: "${ehr_id}"
      an_extract: "${ds:cnf.messaging.ehr_extract.folder}"
    expect: forbidden                      # universal 403 (route-table-wide)
  # The control: the same principal reads the EHR it may not write into.
  - step: 2
    call: export_ehrs
    on: readonly
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      # The refusal committed nothing: the read-back carries no FOLDER, which
      # the extract would have added had step 1 leaked a write.
      - { assert: returns, omits: "X_VERSIONED_FOLDER" }
ambiguities: [AMB-34]
