# The ACCEPT side of the extract_type validation — the row that keeps the
# refusal honest.
#
# RM ehr_extract `master04-common_package.adoc` §Content Criteria Specification
# names five extract types by example: "_extract_type_: what kind of Extract
# this is, e.g. `|openehr-ehr|`, `|openehr-demographic|`,
# `|openehr-synchronisation|`, `|openehr-generic|`, `|generic-emr|`, etc". A
# service that validates the attribute against a NARROWER set would be refusing
# what the RM itself names — the mirror defect of leniency, and one a battery
# of refusal rows alone cannot see. This row drives `openehr-generic`, a code
# the RM names and the openEHR-EHR default is not, and requires it to be
# served.
#
# Together with `-unknown_extract_type` (a code outside any reading, refused)
# the pair pins BOTH edges of the validation, so neither can drift.
id: I_EHR_EXTRACT_SERVICE.export_ehr_extracts-spec_named_extract_type
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehr_extracts
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: >-
  An EXTRACT_SPEC carrying an extract_type the RM names by example
  (openehr-generic) is accepted and exported — the validation may not narrow
  the attribute below what the spec itself lists.
description: "Export by an EXTRACT_SPEC with the RM-named extract_type openehr-generic"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehr_extracts"
  - "RM ehr_extract master04-common_package §Content Criteria Specification (extract_type)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { ehr: { commits: any } }        # mints ${ehr_id}
flow:
  - step: 1
    call: export_ehr_extracts
    with:
      extract_spec:
        _type: EXTRACT_SPEC
        extract_type:
          _type: DV_CODED_TEXT
          value: openehr-generic
          defining_code:
            _type: CODE_PHRASE
            terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
            code_string: openehr-generic
        include_multimedia: false
        priority: 0
        link_depth: 0
        criteria: []
        manifest:
          _type: EXTRACT_MANIFEST
          entities:
            - _type: EXTRACT_ENTITY_MANIFEST
              extract_id_key: "${ehr_id}"
              ehr_id: "${ehr_id}"
              other_ids: []
              item_list: []
    expect: ok
ambiguities: [AMB-34]
