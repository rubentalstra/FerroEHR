# The request-side MEDIA-TYPE branch of the whole-EHR import.
#
# The route's body is a canonical RM `EXTRACT`, read through the shared
# canonical decoder, which accepts the two canonical representations and
# refuses any OTHER declared payload type with 415 before parsing. One
# behaviour per case: the body is the same VALID EXTRACT the -new success case
# imports, so only the declared media type distinguishes this exchange, and a
# server answering 400 (the parse branch) or 201 here would be caught.
#
# EXTENSION ROUTE (register AMB-34): released ITS-REST 1.1.0 publishes no
# message API, so this is NOT a released MUST — it is the served route's own
# documented contract (`#[utoipa::path]`: "The request `Content-Type` is
# neither `application/json` nor `application/xml`."). The status mapping is
# universal (vocab/selectors.yaml universal_outcomes: unsupported_media -> 415).
id: I_EHR_EXTRACT_SERVICE.import_ehr-wrong_media
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: >-
  A whole-EHR import declaring a non-canonical payload media type is refused as
  unsupported_media, and no EHR is created.
description: "Import an EHR with a non-canonical Content-Type"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.messaging.ehr_extract.v1]
flow:
  - step: 1
    call: import_ehr
    variant: wrong_media_type            # sends Content-Type: text/plain on the canonical-RM import
    with: { an_extract: "${ds:cnf.messaging.ehr_extract.v1}" }
    expect: unsupported_media
# NO state proof, deliberately: the media-type gate answers before the body is
# decoded, so this refusal has no path to a write. The state proofs in this
# battery ride the refusals that COULD have committed — the batch-atomicity row
# is the one that needs one.
ambiguities: [AMB-34]
