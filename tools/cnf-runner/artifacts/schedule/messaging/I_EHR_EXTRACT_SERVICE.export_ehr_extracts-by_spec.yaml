# Official master13 case (chapter TBD; NATURAL family id). The chapter cites
# I_EHR_EXTRACT.export_ehr()/export_ehr_extract(), but the vendored SM declares
# I_EHR_EXTRACT_SERVICE with export_ehrs/export_ehr_extracts/import_ehr/
# import_ehr_extract — the SM is the operation-resolution oracle, so cases
# anchor to its real operations (see REQUIREMENTS.md). ITS-REST 1.1.0 exposes NO
# message/extract API, so the its-rest binding is unrealized (AMB-34) and this
# case is not-applicable with citation until a MESSAGE API release lands.
id: I_EHR_EXTRACT_SERVICE.export_ehr_extracts-by_spec
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehr_extracts
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: "Exporting an EXTRACT for one or more EHRs by an EXTRACT_SPEC yields the specified content."
description: "Export an EXTRACT by EXTRACT_SPEC"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehr_extracts"
  - "CNF platform_test_schedule master13 §export_ehr_extracts (chapter: export_ehr_extract)"
applies: { rm: ">=1.0.2" }
requires: { ehr: { commits: any } }
data_sets: [cnf.messaging.extract_spec.v1]
flow:
  - step: 1
    call: export_ehr_extracts
    with: { extract_spec: "${ds:cnf.messaging.extract_spec.v1}" }
    expect: ok
ambiguities: [AMB-34]
