# The request-side MEDIA-TYPE branch of the SINGLE TDD import.
#
# The route carries exactly one body form — the TDD XML document — so a request
# DECLARING another payload media type cannot be processed and is refused 415,
# not through the XML well-formedness branch (422) and not through the
# template-conformance branch (400). One behaviour per case: the body is the
# same VALID TDD the -valid case imports, so only the declared media type
# distinguishes this exchange.
#
# Paired with the batch sibling `import_tdds-wrong_media`, which declares the
# OPPOSITE wrong type: the single import takes XML and refuses JSON, the batch
# takes JSON and refuses XML, so neither rule can stand in for the other.
#
# EXTENSION ROUTE (register AMB-34): released ITS-REST 1.1.0 publishes no TDD
# API, so this is NOT a released MUST — it is the served route's own documented
# contract (`#[utoipa::path]`: "The request `Content-Type` is not
# `application/xml`."). The status mapping is universal (vocab/selectors.yaml
# universal_outcomes: unsupported_media -> 415).
id: I_TDD_SERVICE.import_tdd-wrong_media
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdd
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: >-
  A single TDD import declaring a non-XML payload media type is refused as
  unsupported_media, and nothing is committed.
description: "TDD import with a non-XML Content-Type"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdd"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
requires:
  ehr: { commits: none }                   # mints ${ehr_id} — a real target, so the 415 cannot be a 404 in disguise
  templates: [cnf.opt.minimal_persistent]
data_sets: [cnf.messaging.tdd.v1]
flow:
  - step: 1
    call: import_tdd
    variant: wrong_media_type              # sends Content-Type: application/json on the XML-only import
    with:
      an_ehr_id: "${ehr_id}"
      tdd: "${ds:cnf.messaging.tdd.v1}"
    expect: unsupported_media
ambiguities: [AMB-34]
