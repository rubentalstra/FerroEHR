# master06 §Copying's third receiving situation over a BRANCHED version tree:
# the container the extract addresses is already held AND already carries a
# branch made by another system.
#
# RM common master06-change_control_package.adoc §Copying gives one procedure
# regardless of what the container already holds — "If some version of the item
# had already been received, this step will have already occurred, and the
# requisite VERSIONED_OBJECT would already exist", after which "An
# IMPORTED_VERSION instance is then created … and it is committed in the normal
# way". §Semantics in Distributed Systems has the trunk and each branch as
# COEXISTING lineages ("branching version identifiers … used when local
# modifications are made to versions copied from elsewhere"), so a later TRUNK
# version lands beside the branch rather than colliding with it or replacing
# it: the appended trunk version and the branch must both be held afterwards.
#
# The already-branched state is the PRECONDITION (`requires.import` of the
# trunk+branch fixture); the flow's import is the subject. The precondition
# fixture is CLOSED: the branch names its trunk ancestor as
# preceding_version_uid and that ancestor travels with it, so the receiver is
# never asked to hold a branch whose ancestor it was never sent.
#
# REALIZATION: ITS-REST 1.1.0 publishes no MESSAGE / EHR-Extract API in either
# the docs text or the OAS (register AMB-34); this product SERVES the operation
# on a declared extension route, so the case is EXECUTED there and gates the
# CAPABILITY verdicts named below only — no openEHR profile tier and no
# ITS-REST wire-conformance claim rests on it.
id: I_EHR_EXTRACT_SERVICE.import_ehr_extract-into_branched_lineage
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr_extract
capabilities: [EhrExtract]
exercises: [Versioning]
profiles: [OPTIONS]
test_purpose: >-
  A later trunk version imported into a container whose version tree already
  carries a branch appends to the trunk lineage and leaves the branch intact.
description: "Import a later trunk version into an already-branched container"
spec_refs:
  - "RM common master06-change_control §Copying (the already-received container; committed in the normal way)"
  - "RM common master06-change_control §Semantics in Distributed Systems (branch identifiers; coexisting lineages)"
  - "RM common §change_control (master06 §Version Identification — object_id::creating_system_id::version_tree_id)"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr_extract"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
  # the first receipt: trunk ::1 plus the branch ::1.1.1 that descends from it
  import:
    extract: cnf.messaging.ehr_extract.branch_lineage_v1
    container: X_VERSIONED_COMPOSITION
data_sets: [cnf.messaging.ehr_extract.branch_lineage_v2]
flow:
  - step: 1                              # the append onto a branched tree
    call: import_ehr_extract
    with:
      an_ehr_id: "${ehr_id}"
      an_extract: "${ds:cnf.messaging.ehr_extract.branch_lineage_v2}"
    expect: updated
  # The verification stays on the EXTENSION surface: this case's subject is an
  # extension operation, so it must not drive a released read to evidence it
  # (the realization-scope law). The released read AT a branch uid is its own
  # case — I_EHR_COMPOSITION.get_versioned_composition-branch_version_uid.
  # The default export is LATEST-ONLY by spec (RM ehr_extract
  # extract_version_spec.adoc §Description: "By default, only latest versions
  # are included in the Extract"), so proving all three positions are HELD
  # drives the spec's own full-stack switch,
  # EXTRACT_VERSION_SPEC.include_all_versions ("forces all versions to be
  # included").
  - step: 2                              # all three positions are held
    call: export_ehr_extracts
    with:
      extract_spec:
        _type: EXTRACT_SPEC
        extract_type:
          _type: DV_CODED_TEXT
          value: openehr-ehr
          defining_code:
            _type: CODE_PHRASE
            terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
            code_string: openehr-ehr
        include_multimedia: false
        priority: 0
        link_depth: 0
        criteria: []
        version_spec:
          _type: EXTRACT_VERSION_SPEC
          # All three Booleans are 1..1 (extract_version_spec.adoc
          # §Attributes); include_data true is "the default".
          include_all_versions: true
          include_revision_history: false
          include_data: true
        manifest:
          _type: EXTRACT_MANIFEST
          entities:
            - _type: EXTRACT_ENTITY_MANIFEST
              extract_id_key: "${ehr_id}"
              ehr_id: "${ehr_id}"
              other_ids: []
              item_list: []
    expect: ok
    assert:
      - { assert: returns, matches: "8b52e0c9-6d31-4f74-a09e-2c47b1d5836f::cnf\\.source\\.openehr\\.org::1" }
      - { assert: returns, matches: "8b52e0c9-6d31-4f74-a09e-2c47b1d5836f::cnf\\.source\\.openehr\\.org::2" }
      - { assert: returns, matches: "8b52e0c9-6d31-4f74-a09e-2c47b1d5836f::cnf\\.branchsys\\.openehr\\.org::1\\.1\\.1" }
