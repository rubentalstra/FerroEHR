# The request-side MEDIA-TYPE branch of the BATCH TDD import — deliberately the
# MIRROR of the single-import sibling.
#
# The batch body is the SM `List<String>` as a JSON array, so its one accepted
# declaration is `application/json` and the wrong declaration to probe is
# `application/xml` — the exact type the single import requires. Driving the
# opposite direction on each route is what proves the two rules are separately
# enforced rather than one lenient "any of the two" check standing in for both.
#
# One behaviour per case: the array carries the same VALID TDD the batch
# success case imports, so only the declared media type distinguishes this
# exchange, and the refusal precedes the array parse.
#
# EXTENSION ROUTE (register AMB-34): released ITS-REST 1.1.0 publishes no TDD
# API, so this is NOT a released MUST — it is the served route's own documented
# contract (`#[utoipa::path]`: "The request `Content-Type` is not
# `application/json`."). The status mapping is universal (vocab/selectors.yaml
# universal_outcomes: unsupported_media -> 415).
id: I_TDD_SERVICE.import_tdds-wrong_media
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdds
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: >-
  A TDD batch import declaring a non-JSON payload media type is refused as
  unsupported_media, and nothing is committed.
description: "TDD batch import with a non-JSON Content-Type"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdds"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
requires:
  ehr: { commits: none }                   # mints ${ehr_id} — a real target, so the 415 cannot be a 404 in disguise
  templates: [cnf.opt.minimal_persistent]
data_sets: [cnf.messaging.tdd.v1]
flow:
  - step: 1
    call: import_tdds
    variant: wrong_media_type              # sends Content-Type: application/xml on the JSON-only batch
    with:
      an_ehr_id: "${ehr_id}"
      tdds:
        - "${ds:cnf.messaging.tdd.v1}"
    expect: unsupported_media
ambiguities: [AMB-34]
