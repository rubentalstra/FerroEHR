# The AUTHORIZATION boundary of the TDD import surface — the separate half of
# the -unauthenticated sibling: this principal IS authenticated, and is refused
# anyway.
#
# One behaviour: an authenticated read-only principal is refused on both TDD
# imports. Both routes are unambiguous writes (each commits a COMPOSITION
# through the ordinary validated path), so no control read is needed to
# disambiguate the row the way the archetype and extract siblings need one —
# the capability has no read at all.
#
# EXTENSION ROUTES (register AMB-34): the outcome mapping is UNIVERSAL
# (vocab/selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide);
# the routes carry the coarse `Clinical` class — NOT under /admin/, no ADMIN
# role — so the read-only restriction is the only documented role class here.
# No openEHR spec governs role semantics on a route it does not define.
id: I_TDD_SERVICE.import_tdd-readonly_forbidden
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdd
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated read-only principal is refused on both TDD imports, before
  the document is read — a TDD import commits a COMPOSITION, so it is a write
  whatever the payload turns out to be.
description: "A read-only principal is forbidden from importing a TDD"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdd"
  - "SM openehr_platform §I_TDD_SERVICE.import_tdds"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
requires:
  ehr: { commits: none }                   # mints ${ehr_id} — a real target, so the refusal cannot be a 404 in disguise
  templates: [cnf.opt.minimal_persistent]  # …and a provisioned template, likewise
data_sets: [cnf.messaging.tdd.v1]
flow:
  - step: 1
    call: import_tdd
    on: readonly
    with:
      an_ehr_id: "${ehr_id}"
      tdd: "${ds:cnf.messaging.tdd.v1}"
    expect: forbidden                      # universal 403 (route-table-wide)
  - step: 2
    call: import_tdds
    on: readonly
    with:
      an_ehr_id: "${ehr_id}"
      tdds:
        - "${ds:cnf.messaging.tdd.v1}"
    expect: forbidden
ambiguities: [AMB-34]
