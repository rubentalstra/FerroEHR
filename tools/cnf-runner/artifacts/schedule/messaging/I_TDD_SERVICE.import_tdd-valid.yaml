# Official master13 case (chapter TBD; NATURAL family id). Anchored to the
# vendored SM I_TDD_SERVICE (i_tdd_service.adoc).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#659): ITS-REST 1.1.0 still
# publishes no TDD API in either the docs text or the OAS (register AMB-34) —
# but this product SERVES the operation on a declared extension route under
# /message/tdd/, so the case is EXECUTED against that route instead of
# resolving excused. It gates the Tds capability only; no openEHR profile tier
# and no ITS-REST wire-conformance claim rests on it.
id: I_TDD_SERVICE.import_tdd-valid
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdd
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: "Importing a well-formed TDD into an existing EHR converts it against its operational template and commits the COMPOSITION."
description: "Import a valid TDD"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdd"
  - "AM OPT2 master02-overview §Purpose of the OPT"
  - "CNF platform_test_schedule master13 §import_tdd"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
# The operational template the TDD names is PROVISIONED STATE, not a flow step:
# `requires.templates` uploads it through the released DEFINITION wire before
# the flow opens, so the case's own evidence stays about `import_tdd` alone.
# The previous fixture named `minimal_evaluation.en.v1`, which no corpus entry
# provisions and no server therefore holds — the reason the case was
# unexecutable.
requires:
  ehr: { commits: none }                   # mints ${ehr_id}
  templates: [cnf.opt.minimal_persistent]
data_sets: [cnf.messaging.tdd.v1]
flow:
  - step: 1
    call: import_tdd
    with:
      an_ehr_id: "${ehr_id}"
      tdd: "${ds:cnf.messaging.tdd.v1}"
    expect: created
ambiguities: [AMB-34]
