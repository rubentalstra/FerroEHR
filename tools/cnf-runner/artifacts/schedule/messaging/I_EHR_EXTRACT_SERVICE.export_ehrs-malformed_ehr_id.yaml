# The MALFORMED-IDENTIFIER branch of the whole-EHR export.
#
# The sibling `-export_unknown` addresses a WELL-FORMED UUID no EHR carries and
# gets `not_found`. This row addresses a segment that is not an EHR identifier
# at all, and the two must NOT collapse: a malformed identifier is refused
# before any lookup, so the answer says nothing about what the store holds,
# while a 404 asserts an absence the service actually checked. Conflating them
# would let a service answer 404 for input it never parsed — and, worse, let a
# fabricated key reach the store.
#
# EXTENSION ROUTE (register AMB-34): released ITS-REST 1.1.0 publishes no
# message API, so the 400 is not a released MUST — it is the served route's own
# documented contract (`#[utoipa::path]`: "`ehr_id` is not a well-formed UUID —
# SM `precondition_violation`"), realizing the SM error of the same name.
id: I_EHR_EXTRACT_SERVICE.export_ehrs-malformed_ehr_id
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehrs
capabilities: [EhrExtract, MessageApi]
profiles: [OPTIONS]
test_purpose: >-
  Exporting through an `ehr_id` path segment that is not a well-formed EHR
  identifier is refused as a malformed request — distinct from the not_found
  the absent-but-well-formed id gets.
description: "Export an EHR by a malformed ehr_id"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { server: any }
flow:
  - step: 1
    call: export_ehrs
    with: { ehr_id: "not-a-uuid" }
    expect: bad_request
ambiguities: [AMB-34]
