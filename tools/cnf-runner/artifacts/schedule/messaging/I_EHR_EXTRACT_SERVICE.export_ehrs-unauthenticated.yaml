# The AUTHENTICATION boundary of the whole MESSAGE extract surface.
#
# The EHR-Extract battery proved fourteen behaviours and not one refusal by
# principal, so nothing in it could catch a deployment serving whole EHRs to an
# anonymous caller — the single worst leniency this surface can have, since
# `export_ehrs` returns every versioned object of an EHR in one response. One
# behaviour, swept across all four routes of the group (both exports, both
# imports), the way SEC-AUTHENTICATED_ACCESS sweeps the core operations.
#
# EXTENSION ROUTES (register AMB-34): the outcome mapping is UNIVERSAL, not
# per-binding (vocab/selectors.yaml universal_outcomes: unauthenticated -> 401,
# route-table-wide). The refusal is the served routes' own documented contract
# (each `#[utoipa::path]` declares the 401 branch); no openEHR spec governs
# these routes.
id: I_EHR_EXTRACT_SERVICE.export_ehrs-unauthenticated
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehrs
capabilities: [EhrExtract, MessageApi]
profiles: [OPTIONS]
test_purpose: >-
  Every route of the message extract surface refuses a request that carries no
  valid authentication — both exports and both imports, and regardless of
  whether the addressed EHR exists.
description: "Unauthenticated requests to the message extract routes are refused"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehrs"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehr_extracts"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr_extract"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.messaging.ehr_extract.v1, cnf.messaging.extract_spec.empty_manifest]
flow:
  - step: 1
    call: export_ehrs
    on: unauthenticated
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: unauthenticated              # universal 401 (route-table-wide)
  - step: 2
    call: export_ehr_extracts
    on: unauthenticated
    with: { extract_spec: "${ds:cnf.messaging.extract_spec.empty_manifest}" }
    expect: unauthenticated
  - step: 3
    call: import_ehr
    on: unauthenticated
    with: { an_extract: "${ds:cnf.messaging.ehr_extract.v1}" }
    expect: unauthenticated
  - step: 4
    call: import_ehr_extract
    on: unauthenticated
    with:
      an_ehr_id: "11111111-1111-4111-8111-111111111111"
      an_extract: "${ds:cnf.messaging.ehr_extract.v1}"
    expect: unauthenticated
ambiguities: [AMB-34]
