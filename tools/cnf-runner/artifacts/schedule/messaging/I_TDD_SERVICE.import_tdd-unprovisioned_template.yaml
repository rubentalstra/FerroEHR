# Official master13 case (chapter TBD; NATURAL family id). Anchored to the
# vendored SM I_TDD_SERVICE (i_tdd_service.adoc).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#659): ITS-REST 1.1.0 still
# publishes no TDD API in either the docs text or the OAS (register AMB-34) —
# but this product SERVES the operation on a declared extension route under
# /message/tdd/, so the case is EXECUTED against that route instead of
# resolving excused. It gates the Tds capability only; no openEHR profile tier
# and no ITS-REST wire-conformance claim rests on it.
id: I_TDD_SERVICE.import_tdd-unprovisioned_template
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdd
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: "Importing a TDD whose operational template the server does not hold is rejected as not found."
description: "Import a TDD naming an unprovisioned template"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdd"
  - "SM openehr_platform §DEFINITION_CALL_STATUS_TYPE.template_does_not_exist"
  - "CNF platform_test_schedule master13 §import_tdd"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
# A TDD is "an instance of the template-derived TDS" (AM OPT2
# master02-overview.adoc §Purpose of the OPT), so it cannot be interpreted
# without its operational template: an unheld `template_id` is
# `template_does_not_exist`. NO `requires.templates` here, and the TDD names
# the never-provisioned `cnf.absent_template.v99` identity — absence of a
# SPECIFIC provisioned template is not a stable ground on a shared world (the
# sibling success cases provision `persistent_minimal.en.v1`, which is exactly
# how the 2026-07-29 run observed `created`); the never-provisioned identity is
# the ground that holds. The absence IS the
# precondition under test.
requires: { ehr: { commits: none } }
data_sets: [cnf.messaging.tdd.absent_template]
flow:
  - step: 1
    call: import_tdd
    with:
      an_ehr_id: "${ehr_id}"
      tdd: "${ds:cnf.messaging.tdd.absent_template}"
    expect: template_not_found
ambiguities: [AMB-34]
