# Official master13 case (chapter TBD; NATURAL family id). The chapter cites
# I_EHR_EXTRACT.export_ehr()/export_ehr_extract(), but the vendored SM declares
# I_EHR_EXTRACT_SERVICE with export_ehrs/export_ehr_extracts/import_ehr/
# import_ehr_extract — the SM is the operation-resolution oracle, so cases
# anchor to its real operations (AMB-34).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#659): ITS-REST 1.1.0 still
# publishes no MESSAGE / EHR-Extract / TDD API in either the docs text or the
# OAS (register AMB-34) — but this product SERVES the operation on a declared
# extension route under /message/, so the case is EXECUTED against that route
# instead of resolving excused. It gates the CAPABILITY verdicts named below
# only; no openEHR profile tier and no ITS-REST wire-conformance claim rests
# on it.
id: I_EHR_EXTRACT_SERVICE.export_ehr_extracts-unresolvable_entity
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehr_extracts
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: "A manifest entity carrying no identifier the receiver can locate it by is rejected as a precondition violation."
description: "Export an EXTRACT_SPEC naming an unlocatable entity"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehr_extracts"
  - "RM ehr_extract master04-common_package §EXTRACT_ENTITY_MANIFEST"
  - "CNF platform_test_schedule master13 §export_ehr_extracts (chapter: export_ehr_extract)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
# extract_entity_manifest.adoc: "Various identifiers may be provided for the
# entity; these are to be used by the receiver system to locate the entity" —
# `extract_id_key` is only "the identifier that will be used throughout the
# Extract for this entity" and may be "something else, including a simple
# integer", so an entity carrying it ALONE gives the receiver nothing to locate
# by. Locating is a precondition of exporting the entity, hence
# `precondition_violation`.
requires: { server: any }
flow:
  - step: 1
    call: export_ehr_extracts
    with:
      extract_spec:
        _type: EXTRACT_SPEC
        extract_type:
          _type: DV_CODED_TEXT
          value: openehr-ehr
          defining_code:
            _type: CODE_PHRASE
            terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
            code_string: openehr-ehr
        include_multimedia: false
        priority: 0
        link_depth: 0
        criteria: []
        manifest:
          _type: EXTRACT_MANIFEST
          entities:
            - _type: EXTRACT_ENTITY_MANIFEST
              extract_id_key: "1"
    expect: bad_request
ambiguities: [AMB-34]
