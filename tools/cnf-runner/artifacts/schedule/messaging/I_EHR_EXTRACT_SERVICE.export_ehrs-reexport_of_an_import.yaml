# ONE behaviour: re-exporting an EHR that was imported reproduces the RECEIVED
# ORIGINAL_VERSION, not this system's wrapper around it.
#
# Two independent grounds, both first-hand:
#   * RM ehr_extract UML/classes/org.openehr.rm.ehr_extract.x_versioned_object.adoc
#     §Attributes types `versions` as `List<ORIGINAL_VERSION<T>>` — an
#     IMPORTED_VERSION is not an admissible member of an EXTRACT's versions
#     list, so the export must unwrap.
#   * RM common master06-change_control §Copying: "In this operation, the
#     ORIGINAL_VERSION instance is never modified - it remains a faithful copy
#     of its original, no matter how many systems it may be copied through",
#     and §Committal and Audits: "Original versions can be copied any number of
#     times; in each system into which they are imported, an IMPORTED_VERSION is
#     created as a wrapper." The wrapper is per-system; what travels is the
#     original.
#
# So the re-export must still carry the SOURCE contribution reference
# (2f6b41d8-0e37-4b95-a0c2-7d918e35b4a5) and the SOURCE commit instant, and must
# carry no IMPORTED_VERSION at all. Both halves of the row ride the extension
# route (register AMB-34, as the whole messaging family does).
id: I_EHR_EXTRACT_SERVICE.export_ehrs-reexport_of_an_import
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehrs
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: >-
  Exporting an EHR whose content arrived by import reproduces the received
  ORIGINAL_VERSION verbatim — its own source contribution and commit audit —
  and never this system's IMPORTED_VERSION wrapper.
description: "Re-exporting an imported EHR reproduces the received ORIGINAL_VERSION"
spec_refs:
  - "RM ehr_extract UML/classes/org.openehr.rm.ehr_extract.x_versioned_object.adoc"
  - "RM common master06-change_control §Copying"
  - "RM common master06-change_control §Committal and Audits"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.messaging.ehr_extract.imported_reexport]
flow:
  - step: 1
    call: import_ehr
    with: { an_extract: "${ds:cnf.messaging.ehr_extract.imported_reexport}" }
    expect: created
    capture: { ehr_id: created.ehr_id }
  - step: 2
    call: export_ehrs
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      # The SOURCE contribution reference survived the round trip.
      - { assert: returns, matches: "2f6b41d8-0e37-4b95-a0c2-7d918e35b4a5" }
      # …with the SOURCE commit instant beside it.
      - { assert: returns, matches: "2026-07-28T09:00:00Z" }
      # …and no wrapper travels: `versions` is List<ORIGINAL_VERSION<T>>.
      - { assert: returns, omits: "IMPORTED_VERSION" }
ambiguities: [AMB-34]
