# Official master13 case (chapter TBD; NATURAL family id). The chapter cites
# I_EHR_EXTRACT.export_ehr()/export_ehr_extract(), but the vendored SM declares
# I_EHR_EXTRACT_SERVICE with export_ehrs/export_ehr_extracts/import_ehr/
# import_ehr_extract — the SM is the operation-resolution oracle, so cases
# anchor to its real operations (AMB-34).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#659): ITS-REST 1.1.0 still
# publishes no MESSAGE / EHR-Extract / TDD API in either the docs text or the
# OAS (register AMB-34) — but this product SERVES the operation on a declared
# extension route under /message/, so the case is EXECUTED against that route
# instead of resolving excused. It gates the CAPABILITY verdicts named below
# only; no openEHR profile tier and no ITS-REST wire-conformance claim rests
# on it.
id: I_EHR_EXTRACT_SERVICE.export_ehr_extracts-empty_manifest
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehr_extracts
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: "An EXTRACT_SPEC whose manifest names no entity is refused — EXTRACT_MANIFEST.entities is 1..*, so the shape is not a valid EXTRACT_SPEC."
description: "Export an EXTRACT_SPEC with an empty manifest is refused"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehr_extracts (extract_spec: EXTRACT_SPEC[1] — a mandatory, well-formed spec)"
  - "RM ehr_extract UML/classes/org.openehr.rm.ehr_extract.extract_manifest.adoc §Attributes (entities 1..1 List<EXTRACT_ENTITY_MANIFEST>)"
  - "RM BMM (1.0.4/1.1.0/1.2.0) EXTRACT_MANIFEST.entities cardinality {lower: 1, upper_unbounded} — the item-count bound (LANG bmm_container_property.adoc §Attributes: cardinality is the container's item count, distinct from existence)"
  - "CNF platform_test_schedule master13 §export_ehr_extracts (chapter: export_ehr_extract)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
# RE-GROUNDED 2026-07-29 (#659), RE-ADJUDICATED 2026-08-03 (phase-close
# triage). The 2026-07-29 derivation read only the attribute prose ("List of
# entity manifests ... included in the Extract") and concluded a manifest
# with no entity is fulfilled with no content — but it never read the
# MULTIPLICITY in the same class table: EXTRACT_MANIFEST.entities is 1..1
# List with item-cardinality {lower: 1, upper_unbounded} in every published
# BMM generation (1.0.4 / released 1.1.0 / 1.2.0), so an empty entity list
# is not a valid EXTRACT_MANIFEST and the posted body is not a valid
# EXTRACT_SPEC — the SM signature demands one (extract_spec:
# EXTRACT_SPEC[1]). This case is therefore the REFUSAL twin; the acceptance
# twin is the `-by_spec` sibling (byte-identical shape with one entity).
# The criteria-only request master04-common_package §Content Specification
# contemplates is unrepresentable under that model — a spec-internal
# tension registered separately (see the ambiguity register), and not this
# fixture's case anyway (it carries no criteria).
requires: { server: any }
data_sets: [cnf.messaging.extract_spec.empty_manifest]
flow:
  - step: 1
    call: export_ehr_extracts
    with: { extract_spec: "${ds:cnf.messaging.extract_spec.empty_manifest}" }
    expect: bad_request
ambiguities: [AMB-34]
