# Official master13 case (chapter TBD; NATURAL family id). The chapter cites
# I_EHR_EXTRACT.export_ehr()/export_ehr_extract(), but the vendored SM declares
# I_EHR_EXTRACT_SERVICE with export_ehrs/export_ehr_extracts/import_ehr/
# import_ehr_extract — the SM is the operation-resolution oracle, so cases
# anchor to its real operations (AMB-34). ITS-REST 1.1.0 exposes NO
# message/extract API, so the its-rest binding is unrealized (AMB-34) and this
# case is not-applicable with citation until a MESSAGE API release lands.
id: I_EHR_EXTRACT_SERVICE.import_ehr-with_id
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: "Importing a whole EHR with a fixed EHR id creates the EHR under that identifier (patient-id matching)."
description: "Import a whole EHR with a fixed id"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr"
  - "CNF platform_test_schedule master13 §import_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.messaging.ehr_extract.v1]
flow:
  - step: 1
    call: import_ehr
    with: { an_ehr_id: "7d44b88c-4199-4bad-97dc-d78268e01398", an_extract: "${ds:cnf.messaging.ehr_extract.v1}" }
    expect: created
ambiguities: [AMB-34]
