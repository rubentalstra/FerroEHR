# An EXTRACT_CONTENT_ITEM declaring is_masked while carrying its item is
# refused at the EHR-Extract IMPORT seam (RM ehr_extract ch.4):
# `Item_validity: is_masked xor item /= Void`
# (extract_content_item.adoc §Invariants) — masking MEANS the item was
# withheld, so both-present is the xor's forbidden state. One defect
# (derived from the accepted folder extract with only is_masked flipped),
# so a red row names one thing. The route's refusal vocabulary is
# bad_request (its own adjudicated set — no released wire governs the
# /message/* routes, register AMB-34).
id: I_EHR_EXTRACT_SERVICE.import_ehr_extract-masked_with_item
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr_extract
capabilities: [EhrExtract]
profiles: [OPTIONS]
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
test_purpose: >-
  An extract whose content item declares is_masked while still carrying its
  item is refused at import, and nothing is committed.
description: "EXTRACT_CONTENT_ITEM with is_masked AND a present item refused (the import seam)"
spec_refs:
  - "RM UML/classes/org.openehr.rm.ehr_extract.extract_content_item.adoc §Invariants (Item_validity: is_masked xor item /= Void)"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr_extract"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }
data_sets: [cnf.messaging.ehr_extract.masked_with_item]
flow:
  - step: 1
    call: import_ehr_extract
    with:
      an_ehr_id: "${ehr_id}"
      an_extract: "${ds:cnf.messaging.ehr_extract.masked_with_item}"
    expect: bad_request
