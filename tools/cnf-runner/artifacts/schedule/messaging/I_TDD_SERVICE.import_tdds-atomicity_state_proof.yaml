# THE ATOMICITY STATE PROOF of the TDD batch — the row that makes the
# all-or-nothing claim checkable instead of merely stated.
#
# `import_tdds-nonconforming_body` already proves that a batch containing a
# non-conforming document is REFUSED. That is only half the contract: a server
# can refuse the request and still have committed the members it processed
# before reaching the bad one, which is the worst possible outcome — the client
# is told nothing landed while clinical content silently did. Nothing in the
# battery could see that, because no row ever looked at the EHR afterwards.
#
# So this row drives the same refusal and then READS THE TARGET EHR BACK. The
# batch is ordered VALID-then-NONCONFORMING deliberately: the valid member is
# the one a non-atomic implementation would have committed by the time it
# reached the bad one, so its absence in the read-back is the proof. The
# read-back is `export_ehrs`, the extension surface's own whole-EHR read, which
# returns every versioned object of the EHR — an EHR carrying only its
# EHR_STATUS cannot mention the template the valid TDD names.
#
# Kept separate from `-nonconforming_body` rather than folded into it: one
# behaviour per case, and these are two — "the batch is refused" and "the
# refused batch left nothing behind".
#
# EXTENSION ROUTES (register AMB-34): both the drive and the proof are served
# extension routes, so the row gates the Tds capability only.
id: I_TDD_SERVICE.import_tdds-atomicity_state_proof
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdds
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: >-
  A batch whose second member does not conform to its operational template is
  refused with NOTHING committed — the first, valid member included, proven by
  reading the target EHR back after the refusal.
description: "Mid-batch non-conforming TDD leaves nothing committed"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdds"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehrs"
  - "AM OPT2 master02-overview §Purpose of the OPT"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (families message-tdd + message-extract) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
requires:
  ehr: { commits: none }                   # mints ${ehr_id} — an EHR holding only its EHR_STATUS
  templates: [cnf.opt.minimal_persistent]
data_sets: [cnf.messaging.tdd.v1, cnf.messaging.tdd.nonconforming]
flow:
  - step: 1
    call: import_tdds
    with:
      an_ehr_id: "${ehr_id}"
      tdds:
        - "${ds:cnf.messaging.tdd.v1}"          # VALID — convertible, committable
        - "${ds:cnf.messaging.tdd.nonconforming}"
    expect: bad_request
  # THE STATE PROOF: the whole-EHR read must not mention the template the valid
  # member names, because no COMPOSITION was committed under it.
  - step: 2
    call: I_EHR_EXTRACT_SERVICE.export_ehrs
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: returns, omits: "persistent_minimal" }
      - { assert: returns, omits: "X_VERSIONED_COMPOSITION" }
postconditions:
  - assert: state
    text: >-
      The refused batch committed no COMPOSITION: the target EHR still holds
      only its EHR_STATUS
ambiguities: [AMB-34]
