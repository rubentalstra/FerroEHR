# The AUTHENTICATION boundary of the TDD import surface.
#
# A TDD import commits a COMPOSITION through the ordinary validated commit
# path, so an unauthenticated import would write clinical content with no
# attributable committer. The battery proved nine behaviours and no refusal by
# principal; this is that one behaviour, over both routes the capability serves
# (the single import and the batch), the way SEC-AUTHENTICATED_ACCESS sweeps
# the core operations.
#
# EXTENSION ROUTES (register AMB-34): the outcome mapping is UNIVERSAL, not
# per-binding (vocab/selectors.yaml universal_outcomes: unauthenticated -> 401,
# route-table-wide). The refusal is the served routes' own documented contract
# (each `#[utoipa::path]` declares the 401 branch); no openEHR spec governs
# these routes.
id: I_TDD_SERVICE.import_tdd-unauthenticated
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdd
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: >-
  Both TDD import routes refuse a request that carries no valid authentication,
  before the document is read and regardless of whether the addressed EHR
  exists.
description: "Unauthenticated requests to the TDD import routes are refused"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdd"
  - "SM openehr_platform §I_TDD_SERVICE.import_tdds"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.messaging.tdd.v1]
flow:
  - step: 1
    call: import_tdd
    on: unauthenticated
    with:
      an_ehr_id: "11111111-1111-4111-8111-111111111111"
      tdd: "${ds:cnf.messaging.tdd.v1}"
    expect: unauthenticated              # universal 401 (route-table-wide)
  - step: 2
    call: import_tdds
    on: unauthenticated
    with:
      an_ehr_id: "11111111-1111-4111-8111-111111111111"
      tdds:
        - "${ds:cnf.messaging.tdd.v1}"
    expect: unauthenticated
ambiguities: [AMB-34]
