# A present-but-empty `EXTRACT_MANIFEST.entities` is refused at the EHR-Extract IMPORT seam.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM `UML/classes/org.openehr.rm.ehr_extract.extract_manifest.adoc`
# §Attributes types `EXTRACT_MANIFEST.entities` at 1..1 — a MANDATORY list, so a present-but-EMPTY list is the one shape the bound
# forbids — the way to say "none" is to omit an optional container, never
# to send [].
#
# WHICH BRANCH: a mandatory list cannot be constructed empty, so the body
# never converts to the resource. ITS-REST `responses/400.yaml` scopes 400 to
# "syntactically invalid ... content"; `responses/422.yaml` scopes 422 to
# content that "could be converted to a resource" and then fails semantic
# validation. This body cannot be converted — the 400 row.
#
# The ACCEPTING twin is `cnf.messaging.ehr_extract.v1`, whose EXTRACT_MANIFEST carries
# one EXTRACT_ENTITY_MANIFEST and imports (import_ehr_extract-valid).
id: I_EHR_EXTRACT_SERVICE.import_ehr_extract-manifest_no_entities
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr_extract
capabilities: [EhrExtract]
profiles: [OPTIONS]
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
test_purpose: >-
  An EXTRACT whose specification manifest carries an empty entities list is refused as invalid content, and nothing is imported.
description: "EXTRACT_MANIFEST with an empty entities list refused (400)"
spec_refs:
  - "RM ehr_extract §EXTRACT_MANIFEST (entities, 1..1)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
data_sets: [cnf.messaging.ehr_extract.manifest_no_entities]
flow:
  - step: 1
    call: import_ehr_extract
    with:
      an_ehr_id: "${ehr_id}"
      an_extract: "${ds:cnf.messaging.ehr_extract.manifest_no_entities}"
    expect: bad_request
