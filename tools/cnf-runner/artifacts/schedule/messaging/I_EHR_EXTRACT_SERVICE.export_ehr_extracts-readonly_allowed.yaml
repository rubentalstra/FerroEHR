# THE READ HALF of the extract surface's authorization boundary: an
# authenticated READ-ONLY principal exports by EXTRACT_SPEC and is SERVED.
#
# `export_ehr_extracts` commits nothing. SM
# `SM/docs/UML/classes/i_ehr_extract_service.adoc` declares it beside the two
# import operations: the exports SELECT held content — the selector here is a
# whole `EXTRACT_SPEC` (RM ehr_extract `master04-common_package.adoc`
# §EXTRACT_SPEC), a specification of WHAT to extract — while `import_ehr` /
# `import_ehr_extract` are the mutating half of the same interface. A principal
# refused only writes must therefore be served here; refusing it would deny a
# read on the strength of its HTTP verb alone, which is exactly the shape the
# released ad-hoc AQL read (`POST /query/aql`) already rules out for the
# specified surface.
#
# The sibling -readonly_forbidden case (on import_ehr_extract) is the write
# half of the same boundary; together they say the gate separates the interface
# by what an operation DOES, not by its verb.
#
# EXTENSION ROUTES (register AMB-34): the outcome mapping is UNIVERSAL
# (vocab/selectors.yaml universal_outcomes); the routes carry the coarse
# `Clinical` class — NOT under /admin/, no ADMIN role — so the read-only
# restriction is the only documented role class here. No openEHR spec governs
# role semantics on a route it does not define.
id: I_EHR_EXTRACT_SERVICE.export_ehr_extracts-readonly_allowed
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehr_extracts
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated read-only principal exporting by EXTRACT_SPEC is served —
  the operation selects held content and commits nothing, so the read-only
  restriction does not reach it.
description: "A read-only principal may export an EXTRACT by EXTRACT_SPEC"
spec_refs:
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.export_ehr_extracts"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr_extract (the mutating half of the same interface)"
  - "RM ehr_extract master04-common_package §EXTRACT_SPEC"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { ehr: { commits: any } }        # mints ${ehr_id}
flow:
  - step: 1
    call: export_ehr_extracts
    on: readonly
    with:
      extract_spec:
        _type: EXTRACT_SPEC
        extract_type:
          _type: DV_CODED_TEXT
          value: openehr-ehr
          defining_code:
            _type: CODE_PHRASE
            terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
            code_string: openehr-ehr
        include_multimedia: false
        priority: 0
        link_depth: 0
        criteria: []
        manifest:
          _type: EXTRACT_MANIFEST
          entities:
            - _type: EXTRACT_ENTITY_MANIFEST
              extract_id_key: "${ehr_id}"
              ehr_id: "${ehr_id}"
              other_ids: []
              item_list: []
    expect: ok
ambiguities: [AMB-34]
