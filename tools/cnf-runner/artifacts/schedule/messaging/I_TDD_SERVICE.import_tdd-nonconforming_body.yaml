# Official master13 case (chapter TBD; NATURAL family id). Anchored to the
# vendored SM I_TDD_SERVICE (i_tdd_service.adoc).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#659): ITS-REST 1.1.0 still
# publishes no TDD API in either the docs text or the OAS (register AMB-34) —
# but this product SERVES the operation on a declared extension route under
# /message/tdd/, so the case is EXECUTED against that route instead of
# resolving excused. It gates the Tds capability only; no openEHR profile tier
# and no ITS-REST wire-conformance claim rests on it.
id: I_TDD_SERVICE.import_tdd-nonconforming_body
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdd
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: "A well-formed TDD whose body does not conform to the operational template it names is rejected as a precondition violation."
description: "Import a TDD whose body does not conform to its template"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdd"
  - "AM OPT2 master02-overview §Purpose of the OPT"
  - "CNF platform_test_schedule master13 §import_tdd"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
# The THIRD distinct failure of a TDD import, after "not a Template Data
# Document" and "not well-formed XML": the envelope is intact, the template is
# provisioned, and the XML parses — but a content node names something the
# template does not define. A TDD carries no archetype-node-ids and no RM
# structural attribute names (AM OPT2 master02-overview §Purpose of the OPT
# makes the OPT the supplier of that skeleton), so an unknown node name cannot
# be resolved at all: the conversion's precondition fails, ahead of any
# COMPOSITION to validate.
requires:
  ehr: { commits: none }
  templates: [cnf.opt.minimal_persistent]
data_sets: [cnf.messaging.tdd.nonconforming]
flow:
  - step: 1
    call: import_tdd
    with:
      an_ehr_id: "${ehr_id}"
      tdd: "${ds:cnf.messaging.tdd.nonconforming}"
    expect: bad_request
ambiguities: [AMB-34]
