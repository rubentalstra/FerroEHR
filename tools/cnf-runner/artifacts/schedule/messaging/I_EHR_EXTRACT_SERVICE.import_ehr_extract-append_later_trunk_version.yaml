# The THIRD receiving situation of master06 §Copying: "an EHR exists, and
# previous copies have been made for the item in question".
#
# RM common master06-change_control_package.adoc §Copying §The Copy Operation
# enumerates four situations a receiver dispatches on and supplies the
# procedure for this one in the container-creation sentence: "If it is the
# first time any version of the item logically identified by its
# ORIGINAL_VERSION._uid.object_id()_ … was received from the originating
# system, a new VERSIONED_OBJECT<T> … is created … If some version of the item
# had already been received, this step will have already occurred, and the
# requisite VERSIONED_OBJECT would already exist." The import proper is
# unchanged either way — "An IMPORTED_VERSION instance is then created, its
# item set to the received ORIGINAL_VERSION, and it is committed in the normal
# way".
#
# So a second extract carrying a LATER trunk version of a container the
# receiver already holds must APPEND to that container, not be refused as a
# duplicate and not clone a second container under the same uid. The two
# fixtures share one version-container uid and differ only in version position
# (::1 then ::2, the second naming the first as its preceding_version_uid), so
# the case isolates exactly that behaviour: the first import is the first
# receipt, the second is the append.
#
# The chronology control rides along: both source commits predate the local
# imports, and §Copying requires that "the commit times always reflect the
# local (more recent) act of committal" — so the re-export's container
# time_created must be local while both wrapped originals keep their own
# (2026-07-28T09:30:00Z and 2026-07-28T11:45:00Z).
#
# REALIZATION: ITS-REST 1.1.0 publishes no MESSAGE / EHR-Extract API in either
# the docs text or the OAS (register AMB-34); this product SERVES the operation
# on a declared extension route, so the case is EXECUTED there and gates the
# CAPABILITY verdicts named below only — no openEHR profile tier and no
# ITS-REST wire-conformance claim rests on it.
id: I_EHR_EXTRACT_SERVICE.import_ehr_extract-append_later_trunk_version
kind: functional
component: MESSAGING
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr_extract
capabilities: [EhrExtract]
profiles: [OPTIONS]
test_purpose: >-
  A second extract carrying a later trunk version of an already-received
  container appends to that container, and the appended version keeps its own
  source committal while the container reports the local chronology.
description: "Import a later trunk version into an already-cloned container"
spec_refs:
  - "RM common master06-change_control §Copying (the four receiving situations; the already-received container)"
  - "RM common master06-change_control §Copying (local commit times)"
  - "RM ehr_extract UML/classes/org.openehr.rm.ehr_extract.x_versioned_object.adoc"
  - "SM openehr_platform §I_EHR_EXTRACT_SERVICE.import_ehr_extract"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-extract) and adjudicated by register AMB-34. The row gates the CAPABILITY verdicts only, never ITS-REST wire conformance"
requires: { ehr: { commits: any } }        # mints ${ehr_id}
data_sets:
  - cnf.messaging.ehr_extract.append_trunk_v1
  - cnf.messaging.ehr_extract.append_trunk_v2
flow:
  - step: 1                                # first receipt — the container is cloned
    call: import_ehr_extract
    with:
      an_ehr_id: "${ehr_id}"
      an_extract: "${ds:cnf.messaging.ehr_extract.append_trunk_v1}"
    expect: updated
  - step: 2                                # the append — same container, later trunk version
    call: import_ehr_extract
    with:
      an_ehr_id: "${ehr_id}"
      an_extract: "${ds:cnf.messaging.ehr_extract.append_trunk_v2}"
    expect: updated
  # The default export is LATEST-ONLY by spec (RM ehr_extract
  # extract_version_spec.adoc §Description: "By default, only latest versions
  # are included in the Extract"; master04-common_package §Version
  # Specification: "'latest available version' for each matched item"), so
  # proving both positions are HELD needs the spec's own full-stack switch —
  # EXTRACT_VERSION_SPEC.include_all_versions ("the former forces all
  # versions to be included").
  - step: 3
    call: export_ehr_extracts
    with:
      extract_spec:
        _type: EXTRACT_SPEC
        extract_type:
          _type: DV_CODED_TEXT
          value: openehr-ehr
          defining_code:
            _type: CODE_PHRASE
            terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
            code_string: openehr-ehr
        include_multimedia: false
        priority: 0
        link_depth: 0
        criteria: []
        version_spec:
          _type: EXTRACT_VERSION_SPEC
          include_all_versions: true
        manifest:
          _type: EXTRACT_MANIFEST
          entities:
            - _type: EXTRACT_ENTITY_MANIFEST
              extract_id_key: "${ehr_id}"
              ehr_id: "${ehr_id}"
              other_ids: []
              item_list: []
    expect: ok
    assert:
      # both trunk positions of the ONE container are held
      - { assert: returns, matches: "d4e2b0c8-3a17-4f6d-8c92-5b71e04af238::cnf\\.source\\.openehr\\.org::1" }
      - { assert: returns, matches: "d4e2b0c8-3a17-4f6d-8c92-5b71e04af238::cnf\\.source\\.openehr\\.org::2" }
      # each wrapped original keeps its OWN source committal
      - { assert: returns, matches: "2026-07-28T09:30:00Z" }
      - { assert: returns, matches: "2026-07-28T11:45:00Z" }
ambiguities: [AMB-34]
