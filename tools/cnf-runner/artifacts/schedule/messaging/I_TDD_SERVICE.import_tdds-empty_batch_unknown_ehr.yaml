# THE LENIENCY PROBE of the empty batch: an empty list must not buy a pass on
# the operation's own precondition.
#
# `an_ehr_id` is a parameter of the OPERATION, not of its members
# (`i_tdd_service.adoc` puts it on the signature), so `ehr_id_does_not_exist`
# is owed for every batch — including one with no member to carry the check
# through. An implementation that resolves the EHR per document rather than per
# call answers success here, having verified nothing: exactly the shape of
# leniency a happy-path battery cannot see, since the empty-batch success row
# and the unknown-EHR row both pass while their INTERSECTION is wrong.
#
# The sibling `-unknown_ehr` drives the same 404 with a POPULATED batch. Two
# rows, because the code paths genuinely differ — one reaches the check through
# a member, this one has to reach it without.
id: I_TDD_SERVICE.import_tdds-empty_batch_unknown_ehr
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdds
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: >-
  An empty TDD batch addressed to an EHR that does not exist is refused as not
  found — the operation's target precondition holds for every batch, the empty
  one included.
description: "Bulk-import an empty TDD batch into a non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdds"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
flow:
  - step: 1
    call: import_tdds
    with:
      an_ehr_id: "00000000-0000-0000-0000-000000000000"
      tdds: []
    expect: not_found
ambiguities: [AMB-34]
