# Official master13 case (chapter TBD; NATURAL family id). Anchored to the
# vendored SM I_TDD_SERVICE (i_tdd_service.adoc).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#659): ITS-REST 1.1.0 still
# publishes no TDD API in either the docs text or the OAS (register AMB-34) —
# but this product SERVES the operation on a declared extension route under
# /message/tdd/, so the case is EXECUTED against that route instead of
# resolving excused. It gates the Tds capability only; no openEHR profile tier
# and no ITS-REST wire-conformance claim rests on it.
id: I_TDD_SERVICE.import_tdds-bulk_valid
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdds
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: "Bulk-importing a set of well-formed TDDs is accepted and all their content is committed."
description: "Bulk-import valid TDDs"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdds"
  - "CNF platform_test_schedule master13 §import_tdds"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
# The batch names TWO DIFFERENT templates on purpose:
# `persistent_minimal.en.v1` is category `431|persistent|` (RM ehr master04
# §COMPOSITION category), of which an EHR holds exactly one, so a two-document
# batch of that single template could never succeed and would prove nothing
# about batching. `nested.en.v1` is `433|event|`.
requires:
  ehr: { commits: none }
  templates: [cnf.opt.minimal_persistent, cnf.opt.nested]
data_sets: [cnf.messaging.tdd.v1, cnf.messaging.tdd.nested]
flow:
  - step: 1
    call: import_tdds
    with:
      an_ehr_id: "${ehr_id}"
      tdds:
        - "${ds:cnf.messaging.tdd.v1}"
        - "${ds:cnf.messaging.tdd.nested}"
    expect: created
ambiguities: [AMB-34]
