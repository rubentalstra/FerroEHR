# The EMPTY-BATCH branch of the TDD batch import.
#
# The SM names `import_tdds` without a signature, so the batch form is this
# product's flagged extension of the interface and the empty-list case is ours
# to define. DERIVED, not invented: an empty `List<String>` converts nothing
# and commits nothing, so the request is fulfilled and carries an empty result
# list — but it is NOT a creation. RFC 9110 §15.3.2 assigns 201 to a request
# that "has been fulfilled and has resulted in one or more new resources being
# created", which this has not; §15.3.1's 200 is the fulfilled-with-a-
# representation answer, and the served route declares exactly that. A server
# answering 201 here would be reporting a creation that did not happen.
#
# The catalogue models the same distinction on the extract side already:
# `export_ehr_extracts` maps an empty manifest to `ok_empty`, not to `ok` with
# a fabricated member.
#
# The state side is trivial by construction — nothing was sent to commit — so
# the row carries no read-back; the atomicity sibling owns the proof that a
# REFUSED batch leaves nothing behind.
id: I_TDD_SERVICE.import_tdds-empty_batch
kind: functional
component: MESSAGING
sm_operation: I_TDD_SERVICE.import_tdds
capabilities: [Tds]
profiles: [OPTIONS]
test_purpose: >-
  An empty TDD batch against an existing EHR is a fulfilled no-op: the answer
  carries an empty list of created version ids and reports no creation.
description: "Bulk-import an empty TDD batch"
spec_refs:
  - "SM openehr_platform §I_TDD_SERVICE.import_tdds"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /message/tdd/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family message-tdd) and adjudicated by register AMB-34. The row gates the Tds CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { ehr: { commits: none } }       # mints ${ehr_id} — the precondition the empty batch must still satisfy
flow:
  - step: 1
    call: import_tdds
    with:
      an_ehr_id: "${ehr_id}"
      tdds: []
    expect: ok_empty
    assert:
      - { assert: returns, equals: [] }
ambiguities: [AMB-34]
