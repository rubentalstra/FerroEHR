# Signing capability (Platform, STANDARD, required: false) — signatures on
# EHR_STATUS versions. RM common master06 §Digital Signature signs "each Version
# of any logical item", not only COMPOSITION: the EHR_STATUS is a versioned
# object, so its committed ORIGINAL_VERSION carries a signature over the version
# canonical form. Wire-asserted by reading the EHR_STATUS version envelope back
# (get_versioned_ehr_status variant:version) and asserting present + verifiable
# — the #274 breadth (every versioned object, not just COMPOSITION).
id: SIG-VERSION-ehr_status_signature
kind: functional
component: SECURITY
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [Signing]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  The EHR's committed EHR_STATUS ORIGINAL_VERSION carries a digital signature
  over the version canonical form — present, and verifiable against the declared
  signing posture.
description: "Committed EHR_STATUS VERSION carries a verifiable signature"
spec_refs:
  - "RM common §change_control (Digital Signature: ORIGINAL_VERSION.signature over the canonical form — each Version of any logical item)"
  - "ITS-REST overview Resources.md §Resource identification (VERSIONED_EHR_STATUS / its contained VERSION instances)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id} with its initial EHR_STATUS version
flow:
  - step: 1
    call: get_ehr_status                   # the EHR's current EHR_STATUS version (its uid + versioned-object uid)
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture:
      status_version_uid: ok.status_version_uid
  - step: 2
    call: get_versioned_ehr_status         # RM VERSIONED_OBJECT.version_with_id (EHR_STATUS is a per-EHR singleton)
    variant: version                        # -> /versioned_ehr_status/version/{vuid} (ORIGINAL_VERSION envelope)
    with:
      ehr_id: "${ehr_id}"
      version_uid: "${status_version_uid}"
    expect: ok
    assert:
      - { assert: signature, of: "${status_version_uid}", present: true }
      - { assert: signature, of: "${status_version_uid}", verifiable: true }
