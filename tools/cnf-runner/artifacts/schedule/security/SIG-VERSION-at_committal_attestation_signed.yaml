# Signing capability (Platform, STANDARD, required: false).
#
# WHAT THE VERSION SIGNATURE COVERS when the committed version carries
# attestations. RM common master06-change_control_package.adoc §Digital
# Signature states the serialisation rule verbatim: "The serialisation process
# works by the simple rule of serialising the entire Version object (note that
# the signature attribute will be Void at this point)". `signature` is the ONLY
# attribute the rule excludes, and `ORIGINAL_VERSION.attestations` is one of the
# attributes the class declares
# (UML/classes/org.openehr.rm.common.original_version.adoc §Attributes:
# `attestations: List<ATTESTATION>` 0..1). So an attestation that is ON the
# version at the act of committal is INSIDE the signed canonical form.
#
# THAT SUCH AN ATTESTATION EXISTS AT COMMITTAL is the wire fact this case rests
# on: master06 §Attestation's first listed use is "Signing content at
# committal", and the client-supplied commit envelope carries the list — SM
# UML/classes/update_version.adoc §Attributes gives `UPDATE_VERSION` an
# `attestations: List<ATTESTATION>` at 0..1 ("Set of attestations relating to
# this version"), and ITS-REST specifications/schemas/common/UpdateVersion.yaml
# declares the same member. The fixture is committed as a pre-built
# ORIGINAL_VERSION member so the attestation reaches the wire unrepaired.
#
# WHY THIS IS OBSERVABLE AND NOT A STATE GUESS: the read-back envelope carries
# BOTH the completed ATTESTATION and the `signature`, and the framework's
# canonical form is the RFC 8785 (JCS) serialisation of exactly that envelope
# minus `signature` (see SIG-VERSION-verifiable for the full contract). A server
# that signed an attestation-free form and then serves the attestation cannot
# make those bytes agree, so the `verifiable` assertion fails — the failure is
# the one behaviour this case exists to catch.
#
# NOT DUPLICATED FOR openPGP (the selection rule SIG-VERSION-verifiable-pgp
# states): what varies here is the SET OF ATTRIBUTES entering the canonical
# form, which is mode-independent; the mode-dispatch of `verifiable` is already
# grounded by the -verifiable / -verifiable-pgp pair.
#
# THE COMPLEMENT — an attestation added AFTER committal ("Attestations can be
# added at any time after committal of the content being attested",
# §Attestation; §Contributions: "a new ATTESTATION is added to the attestations
# list of an existing ORIGINAL_VERSION") — post-dates the signature and cannot
# be inside it. That direction is NOT assertable on this wire: the served
# `attestations` list carries both kinds undistinguished, so a reader
# reconstructing the canonical form cannot exclude the later ones, and no
# released text defines a wire discriminator. It is covered where it is
# observable, in the server's own strict verify-on-read behaviour, and the
# split itself is an implementation-visible rule the released text does not
# state on the wire.
id: SIG-VERSION-at_committal_attestation_signed
kind: functional
component: SECURITY
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [Signing]
exercises: [ChangeSets, Versioning]
profiles: [STANDARD]
test_purpose: >-
  The signature stored on a committed ORIGINAL_VERSION covers the attestations
  the version carried at committal: the served envelope, attestations included,
  verifies against the declared key material.
description: "Committed VERSION signature covers its at-committal attestations"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "SM update_version.adoc §Attributes (UPDATE_VERSION.attestations: List<ATTESTATION> 0..1)"
  - "RM common §change_control (master06 §Digital Signature — the entire Version object is serialised, signature alone Void; §Attestation — Signing content at committal)"
  - "RM common §original_version (ORIGINAL_VERSION.attestations)"
  - "RM common §attestation (ATTESTATION.reason / is_pending; Reason_valid)"
  - "TERM SupportTerminology §attestation reason (648 witnessed)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
guards:
  - "requires ixit-declared signing key material — the verifying key is a statement/ixit input, not a wire value (RM common §change_control Digital Signature)"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.security.attested_version]
flow:
  - step: 1                              # commit the version WITH its attestation
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.security.attested_version}", change_type: creation }
    expect: created
    capture:
      version_uids: created.version_uids[]
      version_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: CREATE }
  - step: 2                              # the ORIGINAL_VERSION envelope, attestation and signature together
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version                     # -> /versioned_composition/{vo}/version/{vuid}
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      # the attestation committed WITH the version is served on it, completed
      # with the server-owned AUDIT_DETAILS parts (ITS-REST overview
      # Requests_and_responses.md §"openehr-version and openehr-audit-details":
      # "The `time_committed` attribute is always set by the server")
      - { assert: field, path: "attestations[0]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "attestations[0]/reason/defining_code/code_string", equals: "648" }
      - { assert: field, path: "attestations[0]/change_type/defining_code/code_string", equals: "666" }
      - { assert: field, path: "attestations[1]", absent: true }
      # and the signature verifies over THAT envelope — attestation included
      - { assert: signature, of: "${version_uid}", verifiable: true }
postconditions:
  - assert: state
    text: >-
      The committed version carries exactly the one attestation it was committed
      with, and its stored signature is over the serialisation that includes it.
  - { assert: version, count: 1 }
