# Signing capability (Platform, STANDARD, required: false).
# Re-adjudicates the retired ECC ground sig/client-verbatim (ECC-SIG-004).
# When a client commits a VERSION that already carries a signature, the server
# stores that signature verbatim rather than re-generating one (RM common: the
# signature is an attribute of the committed Version object; an IMPORTED_VERSION
# carries its own signature signifying the act of importing an ORIGINAL_VERSION
# created elsewhere). The committed content is supplied as an ORIGINAL_VERSION
# envelope that already carries the client signature.
# Wire-asserted: the committed ORIGINAL_VERSION envelope is read back
# (get_versioned_composition variant:version) and the `signature` assertion
# checks its `signature` member equals the client-supplied value byte-for-byte.
id: SIG-VERSION-client_supplied_verbatim
kind: functional
component: SECURITY
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [Signing]
exercises: [ChangeSets, Versioning]
profiles: [STANDARD]
test_purpose: >-
  A client-supplied signature on a committed VERSION is stored verbatim, not
  replaced by a server-generated one.
description: "Client-supplied VERSION signature is stored verbatim"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §change_control (Digital Signature; ORIGINAL_VERSION.signature; Copying — imported versions carry their own signature)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.security.signed_version]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.security.signed_version}", change_type: creation }
    expect: created
    capture:
      version_uids: created.version_uids[]
      version_uid: created.first_version_uid                # scalar: the single committed VERSION
      versioned_object_uid: created.first_versioned_object_uid
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: CREATE }
  - step: 2
    call: I_EHR_COMPOSITION.get_versioned_composition   # cross-interface: read the committed COMPOSITION's version envelope
    variant: version                          # -> /versioned_composition/{vo}/version/{vuid} (ORIGINAL_VERSION envelope)
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: signature, of: "${version_uid}", equals: "${ds:cnf.security.signed_version#signature}" }  # stored byte-for-byte
