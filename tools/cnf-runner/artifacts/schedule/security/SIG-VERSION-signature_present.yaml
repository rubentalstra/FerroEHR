# Signing capability (Platform, STANDARD, required: false).
# Re-adjudicates the retired ECC ground sig/digest-present (ECC-SIG-001).
# When the SUT declares Signing, a committed ORIGINAL_VERSION carries a
# signature over the version data's canonical form (RM common: at committal a
# digital signature of the serialised Version object can be made and written
# back into the signature attribute).
# The ECC digest wire format (sha256:+base64) is an ENGINE EXTENSION and is NOT
# asserted here; the spec-groundable fact is that a signature is present on the
# committed VERSION. Reading ORIGINAL_VERSION.signature back is not expressible
# with the current bindings + typed assertions, so the presence check is carried
# as a `state` postcondition and recorded in REQUIREMENTS.md as a `signature`
# assertion-family + version-read binding candidate.
id: SIG-VERSION-signature_present
kind: functional
component: SECURITY
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [Signing]
exercises: [CompositionOps, Versioning]
profiles: [STANDARD]
test_purpose: >-
  A COMPOSITION committed as a new ORIGINAL_VERSION carries a digital signature
  over the version data's canonical form.
description: "Committed VERSION carries a signature"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "RM common §change_control (Digital Signature: ORIGINAL_VERSION.signature over the serialised Version canonical form)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
guards:
  - "not-applicable when the SUT declares no Signing capability — CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: version, of: "${version_uid}", change_type: CREATE }
postconditions:
  - assert: state
    text: >-
      The committed ORIGINAL_VERSION identified by ${version_uid} carries a
      non-empty signature over its canonical serialisation. The presence check
      cannot be expressed with the current bindings (no operation returns
      ORIGINAL_VERSION.signature) or typed assertions — see REQUIREMENTS.md
      (`signature` assertion family + a version-read binding candidate).
