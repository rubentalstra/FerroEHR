# Signing capability (Platform, STANDARD, required: false).
# Re-adjudicates the retired ECC ground sig/digest-present (ECC-SIG-001).
# When the SUT declares Signing, a committed ORIGINAL_VERSION carries a
# signature over the version data's canonical form (RM common: at committal a
# digital signature of the serialised Version object can be made and written
# back into the signature attribute).
# The presence fact is mode-agnostic (digest OR openPGP), so this case asserts
# only that a signature is present; the verifiable fact is SIG-VERSION-verifiable.
# Wire-asserted: the committed ORIGINAL_VERSION envelope is read back
# (get_versioned_composition variant:version) and the `signature` assertion
# runs against its `signature` member.
id: SIG-VERSION-signature_present
kind: functional
component: SECURITY
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [Signing]
exercises: [CompositionOps, Versioning]
profiles: [STANDARD]
test_purpose: >-
  A COMPOSITION committed as a new ORIGINAL_VERSION carries a digital signature
  over the version data's canonical form.
description: "Committed VERSION carries a signature"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "RM common §change_control (Digital Signature: ORIGINAL_VERSION.signature over the serialised Version canonical form)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: version, of: "${version_uid}", change_type: CREATE }
  - step: 2
    call: get_versioned_composition          # RM VERSIONED_OBJECT.version_with_id
    variant: version                          # -> /versioned_composition/{vo}/version/{vuid} (ORIGINAL_VERSION envelope)
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: signature, of: "${version_uid}", present: true }
