# Security family, SEC-BASIC tier — AuthorizationSeparation.
# Re-adjudicates the retired ECC ground sec/forbidden-role-403 (ECC-SEC-002).
# An ixit-declared, authenticated but read-only principal is refused
# (forbidden) on every write operation. The wire mapping is UNIVERSAL
# (selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide).
# NOTE: there is no ADMIN operation binding yet, so authorization separation is
# exercised through write operations a read-only principal must not perform
# (create_ehr, create_composition, upload_opt) rather than an admin-only route.
id: SEC-AUTHORIZATION_SEPARATION-readonly_write_denied
kind: functional
component: SECURITY
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [AuthorizationSeparation]
exercises: [EhrOperations, CompositionOps, Adl14OptProvisioning]
profiles: [SEC-BASIC]
test_purpose: >-
  An authenticated principal whose authorization is read-only is refused
  (forbidden) on every write operation — creating an EHR, committing a
  COMPOSITION, and uploading an OPT — proving authorization is enforced
  separately from authentication.
description: "A read-only principal is forbidden from write operations"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 403 — forbidden)"
  - "CNF 2.0 security schedule §SEC-BASIC Authorization separation (this proposal; 2017 schedule Security BASIC lineage)"
applies: { rm: ">=1.0.2" }
guards:
  - "applies only when the SUT declares the SEC-BASIC security tier — CNF 2.0 security schedule (this proposal; 2017 schedule Security BASIC lineage)"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # provisioned out-of-band (as an authorized principal); mints ${ehr_id}
flow:
  - step: 1
    call: I_EHR_SERVICE.create_ehr
    on: readonly
    expect: forbidden                     # universal 403 (route-table-wide)
  - step: 2
    call: I_EHR_COMPOSITION.create_composition
    on: readonly
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: forbidden
  - step: 3
    call: I_DEFINITION_ADL14.upload_opt
    on: readonly
    with: { opt: "${ds:cnf.opt.minimal_event}" }
    expect: forbidden
