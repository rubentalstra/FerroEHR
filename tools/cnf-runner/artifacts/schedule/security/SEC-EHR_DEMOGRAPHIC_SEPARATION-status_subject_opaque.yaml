# Security family, SEC-BASIC tier — EhrDemographicSeparation.
# EHR_STATUS.subject is a PARTY_SELF: by RM structure it carries no demographic
# identifying content, only (optionally) an opaque external PARTY_REF. A default
# EHR (no subject supplied) reads back with a PARTY_SELF subject and no
# external_ref — the clinical record exposes no demographic identity, keeping
# the demographic and EHR domains separate.
id: SEC-EHR_DEMOGRAPHIC_SEPARATION-status_subject_opaque
kind: functional
component: SECURITY
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [EhrDemographicSeparation]
exercises: [EhrOperations, EhrStatus]
profiles: [SEC-BASIC]
test_purpose: >-
  An EHR's EHR_STATUS.subject is a PARTY_SELF exposing no demographic
  identifying content — for a default EHR the subject is present with no opaque
  external reference, confirming demographic identity is held separately.
description: "EHR_STATUS.subject exposes only opaque refs / PARTY_SELF"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status"
  - "RM ehr §EHR Status (EHR_STATUS.subject is a PARTY_SELF; anonymous form carries no identifier, otherwise an opaque external ref)"
  - "CNF profiles master03-profiles §Non-Functional (the Security & Privacy product attribute; the SEC-BASIC tier is our own extension — no released openEHR spec defines it)"
applies: { rm: ">=1.0.2" }
guards:
  - "applies only when the SUT declares the SEC-BASIC security tier — CNF profiles master03-profiles §Non-Functional (the Security & Privacy product attribute; the SEC-BASIC tier is our own extension — no released openEHR spec defines it)"
requires:
  server: any
flow:
  - step: 1
    call: I_EHR_SERVICE.create_ehr        # default EHR_STATUS => PARTY_SELF subject
    expect: created
    capture: { new_ehr_id: created.ehr_id }
  - step: 2
    call: get_ehr_status
    with: { ehr_id: "${new_ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR_STATUS }
      - { assert: field, path: "subject", exists: true }
      - { assert: field, path: "subject/external_ref", absent: true }
postconditions:
  - assert: state
    text: >-
      The subject is a PARTY_SELF with no external reference and, by RM
      structure, no name or demographic detail — the EHR_STATUS exposes no
      demographic identifying content.
