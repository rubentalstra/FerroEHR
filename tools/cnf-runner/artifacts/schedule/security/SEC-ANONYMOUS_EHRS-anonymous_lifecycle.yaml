# Security family, SEC-BASIC tier — AnonymousEhrs.
# Re-adjudicates the retired ECC ground ehr/create-anonymous-ehr (ECC-EHR-013).
# An EHR created with NO demographic identity (EHR_STATUS omitted -> the server
# default subject = PARTY_SELF, the anonymous form) is fully operable: a
# COMPOSITION commits into it and an ad-hoc query retrieves that content.
id: SEC-ANONYMOUS_EHRS-anonymous_lifecycle
kind: functional
component: SECURITY
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [AnonymousEhrs]
exercises: [EhrOperations, CompositionOps, AqlBasic]
profiles: [SEC-BASIC]
test_purpose: >-
  An EHR created without any subject identity (default EHR_STATUS, subject =
  anonymous PARTY_SELF) supports the full clinical lifecycle: a COMPOSITION can
  be committed into it and retrieved by ad-hoc query.
description: "Anonymous (subject-less) EHR is fully operable"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
  - "RM ehr §EHR Status (EHR_STATUS.subject = PARTY_SELF; the anonymous form allows completely anonymous EHRs)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Anonymous EHRs)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
guards:
  - "applies only when the SUT declares the SEC-BASIC security tier — CNF profiles master03-profiles §Non-Functional (the Security & Privacy product attribute; the SEC-BASIC tier is our own extension — no released openEHR spec defines it)"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
flow:
  - step: 1
    call: I_EHR_SERVICE.create_ehr        # EHR_STATUS omitted => default anonymous PARTY_SELF subject
    expect: created
    capture: { new_ehr_id: created.ehr_id }
  - step: 2
    call: I_EHR_COMPOSITION.create_composition
    with:
      ehr_id: "${new_ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture: { version_uid: created.version_uid }
    assert:
      - { assert: version, of: "${version_uid}", change_type: CREATE }
  - step: 3
    call: I_QUERY_SERVICE.execute_ad_hoc_query
    with:
      q: "SELECT c/uid/value FROM EHR e[ehr_id/value='${new_ehr_id}'] CONTAINS COMPOSITION c"
      fetch: 10
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }
postconditions:
  - assert: state
    text: >-
      The anonymous EHR holds one committed COMPOSITION and answers queries over
      it — the absence of a subject identity does not restrict operability.
