# Signing capability (Platform, STANDARD, required: false) — the openPGP half
# of the distinct-signature-per-version ground (see
# SIG-VERSION-distinct_per_version for the digest original and the full
# canonical-form derivation).
#
# SELECTION (mode sensitivity): the pair asserted on the modification version
# is `verifiable` + `distinct_from`, and `verifiable` is the assertion whose
# meaning DISPATCHES on the mode (digest recompute versus RFC 4880 detached
# verification against the declared public key). It is also the assertion that
# carries the pair: an openPGP signature embeds a creation timestamp, so
# distinctness ALONE would be satisfiable by a content-independent signer —
# only verification over the second version's own canonical form (which
# includes `uid` and `preceding_version_uid`, RM common master06 §Digital
# Signature: "serialising the entire Version object (note that the signature
# attribute will be Void at this point)") binds the signature to the content
# it claims. That makes this pairing genuinely mode-sensitive, so it gets a
# pgp sibling; the presence-only cases (SIG-VERSION-signature_present,
# -across_version_kinds, -directory_signature_present) do not.
#
# The steps address the ixit's `sut_pgp` instance — the second deployment of
# the same server running `signing.mode = pgp`. A party declaring no such
# instance records this case not-applicable with that citation.
id: SIG-VERSION-distinct_per_version-pgp
kind: functional
component: SECURITY
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [Signing]
exercises: [CompositionOps, Versioning]
profiles: [STANDARD]
test_purpose: >-
  Under openPGP signing, two distinct committed versions of the same versioned
  object carry distinct signatures, and the second verifies as an RFC 4880
  signature over its own canonical form.
description: "Distinct versions carry distinct, openPGP-verifiable signatures (pgp posture)"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "RM common §change_control (Digital Signature: the entire Version object minus signature is serialised and hashed, the signature generated per openPGP RFC 4880; VERSION.canonical_form)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id} on the addressed deployment
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    on: sut_pgp
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
  - step: 2
    call: get_versioned_composition          # read the creation VERSION envelope
    on: sut_pgp
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${preceding_version_uid}"
    expect: ok
    capture:
      sig_first: ok.signature
    assert:
      - { assert: signature, of: "${preceding_version_uid}", present: true }
  - step: 3
    call: update_composition
    on: sut_pgp
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
    capture: { v2_uid: updated.version_uid }
    assert:
      - { assert: version, of: "${v2_uid}", change_type: MODIFY }
  - step: 4
    call: get_versioned_composition          # read the modification VERSION envelope
    on: sut_pgp
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: signature, of: "${v2_uid}", present: true, verifiable: true }
      - { assert: signature, of: "${v2_uid}", distinct_from: "${sig_first}" }
