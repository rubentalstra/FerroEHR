# Signing capability (Platform, STANDARD, required: false) — the openPGP half.
#
# RM common master06 §Digital Signature defines TWO depths of one mechanism
# over the same canonical form: "If only the hashing step is done, the digest
# acts as a data integrity check … If the signing step is carried out, it
# authenticates the user as the author of the content", and "The signature, if
# present, is generated according to the openPGP standard (IETF RFC 4880)".
# A product claiming both must be tested in both, so the pgp siblings address
# a SECOND deployment of the
# same server running `signing.mode = pgp` — the ixit's `sut_pgp` instance,
# whose own `signing` block carries the verifying public key. A party that
# declares no such instance records these cases not-applicable with that
# citation (ISO/IEC 9646 test selection), exactly like every other undeclared
# topology fact.
#
# SELECTION (why this case has a pgp sibling and most SIG cases do not): only
# the assertions whose MEANING changes with the mode are duplicated. `present`
# is mode-agnostic (a non-empty signature member either is or is not there),
# so SIG-VERSION-signature_present / -across_version_kinds /
# -directory_signature_present stay single. `verifiable` is the assertion that
# DISPATCHES on the mode — digest recompute versus RFC 4880 detached-signature
# verification against the declared key — and this case is its primary ground.
#
# Everything else is SIG-VERSION-verifiable verbatim; see that file for the
# canonical-form contract (RFC 8785 JCS of the version minus `signature`).
id: SIG-VERSION-verifiable-pgp
kind: functional
component: SECURITY
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [Signing]
exercises: [CompositionOps, Versioning]
profiles: [STANDARD]
test_purpose: >-
  The signature stored on a committed ORIGINAL_VERSION by a deployment running
  openPGP signing verifies as an RFC 4880 signature over the canonical
  serialisation of that version, against the declared public key.
description: "Committed VERSION signature is openPGP-verifiable (pgp posture)"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "RM common §change_control (Digital Signature: signature generated per openPGP from the hash of the canonical Version serialisation)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id} on the addressed deployment
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    on: sut_pgp
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: version, of: "${version_uid}", change_type: CREATE }
  - step: 2
    call: get_versioned_composition          # RM VERSIONED_OBJECT.version_with_id
    on: sut_pgp
    variant: version                          # -> /versioned_composition/{vo}/version/{vuid} (ORIGINAL_VERSION envelope)
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: signature, of: "${version_uid}", verifiable: true }
