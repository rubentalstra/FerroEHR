# Security family, SEC-BASIC tier — AuthenticatedAccess, the RESPONSE-HEADER
# half of the refusal. The SEC-AUTHENTICATED_ACCESS-unauthenticated_sweep case
# proves that protected operations are refused; this sibling proves the refusal
# is a well-formed HTTP authentication challenge rather than a bare 401.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §Authentication and authorization): "If authentication and authorization are
# required, services MUST properly use the `WWW-Authenticate` and/or
# `Proxy-Authenticate` response headers, returning `403 Forbidden`, `401
# Unauthorized` or `407 Proxy Authentication` as applicable." On a `401` from
# the origin service the applicable header is `WWW-Authenticate` — RFC 9110
# §15.5.2, the authority §HTTP headers names for the standard headers ("The
# server generating a 401 response MUST send a WWW-Authenticate header field
# … containing at least one challenge applicable to the target resource");
# `Proxy-Authenticate` belongs to the `407` branch (RFC 9110 §15.5.8).
#
# One behaviour per case: the target resource id is a syntactically valid but
# absent ehr_id, so the refusal cannot be confused with a resource outcome —
# the 401 is reached before any resource processing (the same construction the
# sweep uses). The challenge assertion is the executed
# `WWW-Authenticate: present` matcher on the get_ehr binding's
# `unauthenticated` outcome; the challenge SCHEME is deliberately not asserted,
# the released text mandating no particular authentication scheme
# ("this specification does not mandate a specific authentication scheme").
id: SEC-AUTHENTICATED_ACCESS-www_authenticate_challenge
kind: functional
component: SECURITY
sm_operation: I_EHR_SERVICE.get_ehr
capabilities: [AuthenticatedAccess]
exercises: [EhrOperations]
profiles: [SEC-BASIC]
test_purpose: >-
  A request that carries no valid authentication is refused with an
  authentication challenge — the refusal response carries the
  WWW-Authenticate response header, not a bare status.
description: "Unauthenticated refusal carries the WWW-Authenticate challenge"
spec_refs:
  - "ITS-REST overview Requests_and_responses (Authentication and authorization: services MUST properly use the WWW-Authenticate and/or Proxy-Authenticate response headers)"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 401 — lacks valid authentication credentials for the target resource)"
  - "SM openehr_platform §I_EHR_SERVICE.get_ehr"
  - "CNF 2.0 security schedule §SEC-BASIC Authenticated access (this proposal; 2017 schedule Security BASIC lineage)"
applies: { rm: ">=1.0.2" }
guards:
  - "applies only when the SUT declares the SEC-BASIC security tier — CNF 2.0 security schedule (this proposal; 2017 schedule Security BASIC lineage)"
  - "the challenge is mandated only when the service requires authentication — ITS-REST overview Requests_and_responses §Authentication and authorization ('If authentication and authorization are required'); a service declaring no authentication framework is not in scope"
requires:
  server: any
flow:
  - step: 1
    call: get_ehr
    on: unauthenticated
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: unauthenticated              # 401 + the WWW-Authenticate matcher on the binding's unauthenticated outcome
