# Signing capability (Platform, STANDARD, required: false) — the openPGP half
# of client-supplied-signature verbatim storage (see
# SIG-VERSION-client_supplied_verbatim for the digest original).
#
# SELECTION (mode sensitivity): the assertion text is the same, but the
# behaviour it pins is materially different under openPGP. RM common master06
# §Digital Signature makes the stored signature a fact ABOUT THE COMMITTED
# VERSION — "all attributes of the object are serialised and then used to
# generate a signature … the IMPORTED_VERSION instance will carry its own
# signature which signifies the act of importing" — so a signature that
# arrived with the content is the author's, not the server's, and the server
# neither replaces nor re-derives it. On a digest-posture deployment a foreign
# signature is trivially distinguishable from a server digest by shape; on a
# pgp-posture deployment the corpus fixture's client signature is ITSELF an
# RFC 4880 armored block, so shape distinguishes nothing and only a recorded
# provenance fact can keep the server from judging a signature it never made.
# That is the mode-sensitive behaviour this sibling exists for, and why the
# presence-only cases get no pgp sibling.
#
# The steps address the ixit's `sut_pgp` instance — the second deployment of
# the same server running `signing.mode = pgp`. A party declaring no such
# instance records this case not-applicable with that citation.
id: SIG-VERSION-client_supplied_verbatim-pgp
kind: functional
component: SECURITY
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [Signing]
exercises: [ChangeSets, Versioning]
profiles: [STANDARD]
test_purpose: >-
  A client-supplied signature on a committed VERSION is stored and served
  verbatim by a deployment that itself signs with openPGP — neither replaced by
  a server-generated signature nor judged against the server's own key.
description: "Client-supplied VERSION signature is stored verbatim (pgp posture)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §change_control (Digital Signature; ORIGINAL_VERSION.signature; Copying — imported versions carry their own signature)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
guards:
  - "not-applicable when the party declares no openPGP-posture instance (`sut_pgp`) — the mode a deployment runs is an ixit declaration, not a wire value (RM common §change_control Digital Signature)"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id} on the addressed deployment
data_sets: [cnf.security.signed_version]
flow:
  - step: 1
    call: commit_contribution
    on: sut_pgp
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.security.signed_version}", change_type: creation }
    expect: created
    capture:
      version_uids: created.version_uids[]
      version_uid: created.first_version_uid                # scalar: the single committed VERSION
      versioned_object_uid: created.first_versioned_object_uid
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: CREATE }
  - step: 2
    call: I_EHR_COMPOSITION.get_versioned_composition   # cross-interface: read the committed COMPOSITION's version envelope
    on: sut_pgp
    variant: version                          # -> /versioned_composition/{vo}/version/{vuid} (ORIGINAL_VERSION envelope)
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: signature, of: "${version_uid}", equals: "${ds:cnf.security.signed_version#signature}" }  # stored byte-for-byte
