# Signing capability (Platform, STANDARD, required: false).
# Re-adjudicates the retired ECC ground sig/all-kinds (ECC-SIG-003).
# When the SUT declares Signing, every committed VERSION carries a signature
# regardless of version kind — the first creation, a subsequent modification,
# and a logical deletion each produce a signed ORIGINAL_VERSION (RM common: a
# signature of the object can be made at the time of committal of a Version).
# Signature presence per kind is not expressible with the current bindings +
# typed assertions (no operation returns ORIGINAL_VERSION.signature); the
# lineage is asserted with the `version` family and the per-kind signature fact
# is carried as a `state` postcondition — see REQUIREMENTS.md.
id: SIG-VERSION-across_version_kinds
kind: functional
component: SECURITY
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [Signing]
exercises: [CompositionOps, Versioning]
profiles: [STANDARD]
test_purpose: >-
  Every committed VERSION carries a signature across all version kinds — a
  creation (change_type CREATE), a modification (MODIFY), and a logical deletion
  (DELETED, lifecycle_state deleted).
description: "Signing applies across create/update/delete version kinds"
spec_refs:
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "RM common §change_control (Digital Signature; Version Lifecycle: change_type CREATE/MODIFY/DELETED)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
guards:
  - "not-applicable when the SUT declares no Signing capability — CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
  - step: 2
    call: update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (AMB-3)
    expect: updated
    capture: { v2_uid: updated.version_uid }
    assert:
      - { assert: version, of: "${v2_uid}", change_type: MODIFY }
  - step: 3
    call: delete_composition
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${v2_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }
    assert:
      - { assert: version, of: "${deleted_uid}", change_type: DELETED, lifecycle_state: "openehr::523|deleted|" }
postconditions:
  - { assert: version, count: 3 }
  - { assert: signature, of: "${preceding_version_uid}", present: true }
  - { assert: signature, of: "${v2_uid}", present: true }
  - { assert: signature, of: "${deleted_uid}", present: true }
ambiguities: [AMB-3]
