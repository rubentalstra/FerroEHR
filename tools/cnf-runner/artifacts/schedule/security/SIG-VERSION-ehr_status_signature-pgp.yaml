# Signing capability (Platform, STANDARD, required: false) — the openPGP half
# of the EHR_STATUS version signature (see SIG-VERSION-ehr_status_signature
# for the digest original).
#
# SELECTION (mode sensitivity): RM common master06 §Digital Signature applies
# to "a Version object (an ORIGINAL_VERSION or IMPORTED_VERSION)" — every
# versioned object, not only COMPOSITION. The `verifiable` assertion is the
# one whose meaning DISPATCHES on the mode, and this case is where it is
# asserted for a versioned object the server mints itself (the EHR's initial
# EHR_STATUS, committed with no client-supplied content), so the openPGP
# signer must be reached on that path too. The `present` half is mode-agnostic
# and is already covered by the digest original.
#
# The steps address the ixit's `sut_pgp` instance — the second deployment of
# the same server running `signing.mode = pgp`. A party declaring no such
# instance records this case not-applicable with that citation.
id: SIG-VERSION-ehr_status_signature-pgp
kind: functional
component: SECURITY
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [Signing]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  Under openPGP signing, the EHR's committed EHR_STATUS ORIGINAL_VERSION carries
  a signature that verifies as an RFC 4880 signature over the version canonical
  form against the declared public key.
description: "Committed EHR_STATUS VERSION signature is openPGP-verifiable (pgp posture)"
spec_refs:
  - "RM common §change_control (Digital Signature: ORIGINAL_VERSION.signature over the canonical form, generated per openPGP RFC 4880 — each Version of any logical item)"
  - "ITS-REST overview Resources.md §Resource identification (VERSIONED_EHR_STATUS / its contained VERSION instances)"
  - "CNF profiles master03-profiles.adoc §Non-Functional (Security & Privacy: Signing)"
applies: { rm: ">=1.0.2" }
guards:
  - "not-applicable when the party declares no openPGP-posture instance (`sut_pgp`) — the mode a deployment runs is an ixit declaration, not a wire value (RM common §change_control Digital Signature)"
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id} (with its initial EHR_STATUS version) on the addressed deployment
flow:
  - step: 1
    call: get_ehr_status                   # the EHR's current EHR_STATUS version (its uid + versioned-object uid)
    on: sut_pgp
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture:
      status_version_uid: ok.status_version_uid
  - step: 2
    call: get_versioned_ehr_status         # RM VERSIONED_OBJECT.version_with_id (EHR_STATUS is a per-EHR singleton)
    on: sut_pgp
    variant: version                        # -> /versioned_ehr_status/version/{vuid} (ORIGINAL_VERSION envelope)
    with:
      ehr_id: "${ehr_id}"
      version_uid: "${status_version_uid}"
    expect: ok
    assert:
      - { assert: signature, of: "${status_version_uid}", verifiable: true }
