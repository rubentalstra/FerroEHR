# Security family, SEC-BASIC tier — AuthenticatedAccess.
# Re-adjudicates the retired ECC ground sec/unauthenticated-401 (ECC-SEC-001).
# A representative sweep of core operations from an ixit-declared instance that
# carries NO credentials: every protected operation is refused before any
# resource processing. The wire mapping is UNIVERSAL (selectors.yaml
# universal_outcomes: unauthenticated -> 401, route-table-wide) — no per-binding
# outcome edit is needed, so the sweep may span interfaces freely.
id: SEC-AUTHENTICATED_ACCESS-unauthenticated_sweep
kind: functional
component: SECURITY
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [AuthenticatedAccess]
exercises: [EhrOperations, CompositionOps, AqlBasic, Adl14OptProvisioning]
profiles: [SEC-BASIC]
test_purpose: >-
  A request that carries no valid authentication is refused (unauthenticated)
  for every protected core operation — EHR creation, composition retrieval,
  ad-hoc query, and OPT upload — regardless of the target resource's existence.
description: "Unauthenticated requests to protected operations are refused"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 401 — unauthenticated)"
  - "CNF 2.0 security schedule §SEC-BASIC Authenticated access (this proposal; 2017 schedule Security BASIC lineage)"
applies: { rm: ">=1.0.2" }
guards:
  - "applies only when the SUT declares the SEC-BASIC security tier — CNF 2.0 security schedule (this proposal; 2017 schedule Security BASIC lineage)"
requires:
  server: any
flow:
  - step: 1
    call: I_EHR_SERVICE.create_ehr
    on: unauthenticated
    expect: unauthenticated              # universal 401 (route-table-wide)
  - step: 2
    call: I_EHR_COMPOSITION.get_composition_at_version
    on: unauthenticated
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      version_uid: "22222222-2222-4222-8222-222222222222::example.openehr.systemid::1"
    expect: unauthenticated
  - step: 3
    call: I_QUERY_SERVICE.execute_ad_hoc_query
    on: unauthenticated
    with:
      q: "SELECT e/ehr_id/value FROM EHR e"
      fetch: 1
    expect: unauthenticated
  - step: 4
    call: I_DEFINITION_ADL14.upload_opt
    on: unauthenticated
    with: { opt: "${ds:cnf.opt.minimal_event}" }
    expect: unauthenticated
