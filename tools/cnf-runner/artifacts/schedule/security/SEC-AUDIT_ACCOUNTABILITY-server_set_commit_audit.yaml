# Security family, SEC-BASIC tier — AuditAccountability.
# Every change-controlled commit carries a commit audit recording the committer
# identity and a server-set time_committed. The client supplies an
# openehr-audit-details committer and (deliberately) a time_committed value; on
# readback the CONTRIBUTION audit exposes the committer identity and a
# time_committed the server set — the client-supplied time is authoritative
# only on the server side (RM common: time_committed is computed on the server;
# ITS-REST overview: openehr-audit-details lets clients supply only change_type,
# description, committer and system_id — never time_committed).
id: SEC-AUDIT_ACCOUNTABILITY-server_set_commit_audit
kind: functional
component: SECURITY
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [AuditAccountability]
exercises: [ChangeSets, Versioning]
profiles: [SEC-BASIC]
test_purpose: >-
  A change-controlled commit records an AUDIT_DETAILS with the committer
  identity and a time_committed set by the server; a client-supplied
  time_committed does not become the recorded committal time.
description: "Commit audit records committer and a server-set time_committed"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §change_control (Committal and Audits: AUDIT_DETAILS.committer, time_committed computed on the server)"
  - "ITS-REST overview Requests_and_responses (openehr-audit-details: client MAY supply change_type/description/committer/system_id; time_committed is server-set)"
  - "CNF profiles master03-profiles §Non-Functional (the Security & Privacy product attribute; the SEC-BASIC tier is our own extension — no released openEHR spec defines it)"
applies: { rm: ">=1.0.2" }
guards:
  - "applies only when the SUT declares the SEC-BASIC security tier — CNF profiles master03-profiles §Non-Functional (the Security & Privacy product attribute; the SEC-BASIC tier is our own extension — no released openEHR spec defines it)"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
      audit:                              # client-supplied committal metadata, incl. a time the server MUST ignore
        committer:
          _type: PARTY_IDENTIFIED
          name: "Dr Example"
          external_ref:
            _type: PARTY_REF
            namespace: "demographic"
            type: "PERSON"
            id: { _type: GENERIC_ID, value: "audit-committer-001", scheme: "example-scheme" }
        time_committed: "1990-01-01T00:00:00Z"
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      version_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: CREATE }
  - step: 2
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      - { assert: field, path: "audit/committer", exists: true }
      - { assert: field, path: "audit/time_committed", exists: true }
      - { assert: field, path: "audit/time_committed", not_equals: "1990-01-01T00:00:00Z" }   # the client value MUST be ignored (server-set)
postconditions:
  - assert: state
    text: >-
      The committed CONTRIBUTION audit carries the committer identity and a
      server-set time_committed (verified in step 2: the client-supplied
      instant was not recorded).
