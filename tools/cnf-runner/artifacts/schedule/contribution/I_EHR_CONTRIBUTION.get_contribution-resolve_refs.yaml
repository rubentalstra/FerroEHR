# The CONTRIBUTION read asked to RESOLVE its member references: with
# `Prefer: return=representation, resolve_refs` the versions[] entries come back
# as full ORIGINAL_VERSIONs instead of the OBJECT_REFs the default read serves.
#
# DOCS TEXT for the mechanism (ITS-REST overview `Requests_and_responses.md`
# §"Prefer resolving Object references", quoted whole): "Clients MAY request
# that object references (e.g., OBJECT_REF) be resolved into full or partial
# representations by specifying: `Prefer: return=representation, resolve_refs`".
# That sentence defines the REQUEST and nothing else — it assigns no service
# obligation and names no resource, which is why the cross-cutting element
# carries no general gating case.
#
# WHAT BINDS IT ON THIS OPERATION is register AMB-57 (fixed_handling): the
# released contribution read promises an inner-payload serialization its own
# declared body cannot express — the §Simplified Formats paragraph says "only
# each `versions[i].data` payload is serialized in the requested FLAT or
# STRUCTURED form", while the declared 200 body carries `versions` as
# OBJECT_REFs and has no `versions[i].data` at all. The register resolves the
# conflict by binding that inner serialization to the one resolution mechanism
# the docs text does define, so `resolve_refs` is the request under which
# versions[i] inline as full ORIGINAL_VERSIONs.
#
# ASSERTED: the resolved member is an ORIGINAL_VERSION (its `_type`, not an
# OBJECT_REF's), and it carries the per-version `commit_audit` that only the
# full version envelope has — the two facts that distinguish a resolved member
# from a reference. The default (unresolved) shape is the sibling
# -version_ref_shape case, so the two representations are exercised against
# each other rather than either being assumed.
id: I_EHR_CONTRIBUTION.get_contribution-resolve_refs
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-57]
test_purpose: >-
  A CONTRIBUTION read sent with Prefer: return=representation, resolve_refs
  inlines its versions[] members as full ORIGINAL_VERSIONs carrying their own
  commit_audit, rather than as OBJECT_REFs.
description: "Get CONTRIBUTION with resolve_refs: members inline as ORIGINAL_VERSIONs"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer resolving Object references"
  - "ITS-REST specifications §operations/contribution_get (the Simplified Formats paragraph: only each versions[i].data payload is serialized in the requested form)"
  - "RM common §change_control (master06 — ORIGINAL_VERSION carries its own commit_audit)"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: get_contribution
    variant: resolve_refs                # pins Prefer: return=representation, resolve_refs
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      # the member is the resolved VERSION, not a reference to it
      - { assert: field, path: "versions[0]/_type", equals: "ORIGINAL_VERSION" }
      # …and it carries what only the full envelope has
      - { assert: field, path: "versions[0]/commit_audit", exists: true }
      - { assert: field, path: "versions[0]/uid/value", exists: true }
