# A commit addressed at an EHR that does not exist: the route's own miss
# branch, the one commit rejection that is about ADDRESSING rather than about
# the change set.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §HTTP status codes,
# the 404 row verbatim): "The origin service did not find the target resource
# or is not willing to disclose that one exists". The `ehr_id` here is a
# perfectly well-formed identifier that simply names nothing, which is the
# well-formed-but-absent side of the boundary register AMB-76 draws (its
# malformed side is 400 — the sibling get_contribution-malformed_contribution_uid
# case).
#
# One behaviour per case: the payload is the same valid single-COMPOSITION
# change set the accepted commits use, so the only variable is the EHR that
# does not exist.
id: I_EHR_CONTRIBUTION.commit_contribution-non_existing_ehr
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION to a well-formed but non-existent ehr_id is
  rejected as not found.
description: "Commit CONTRIBUTION to a non-existing EHR"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]     # the template exists, so the miss is the EHR alone
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: not_found
