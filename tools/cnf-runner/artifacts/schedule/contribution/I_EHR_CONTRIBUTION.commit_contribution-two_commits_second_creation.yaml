# C.9 — commit a persistent COMPOSITION, then a second CONTRIBUTION with
# change_type = creation against the same COMPOSITION: rejected for the wrong
# change type (only one create is allowed for a persistent COMPOSITION; further
# operations must be modification — master08 C.9 NOTE). Only the first VERSION
# remains. Per RM master06 §Contributions a 249|creation| is a first
# ORIGINAL_VERSION (preceding_version_uid Void); a creation member naming a
# preceding version is that change_type mismatch, rejected — the status code is
# spec-unassigned (AMB-54: 400|422). commit 1 commits one VERSION, so
# ${v1_uids} is the single precedent uid; the contribution wire carries it IN
# the member body (SM update_version.adoc: UPDATE_VERSION.preceding_version_uid).
id: I_EHR_CONTRIBUTION.commit_contribution-two_commits_second_creation
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A second CONTRIBUTION with change_type = creation against an existing
  persistent COMPOSITION is rejected for the wrong change type; only the first
  VERSION remains.
description: "Commit two CONTRIBUTIONs on same COMPOSITION with second creation"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-two_commits_second_creation"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_persistent]   # provides persistent_minimal.en.v1 — the template both persistent data sets reference
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.persistent.v1, cnf.composition.persistent.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.persistent.v1}", change_type: creation }
    expect: created
    capture:
      v1_uids: created.version_uids[]
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.persistent.v2}"
          change_type: creation                 # wrong: the object already exists
          preceding_version_uid: "${v1_uids}"   # body property: RM VERSION.preceding_version_uid (SM update_version.adoc)
    expect: validation_failed             # RM master06 §Contributions: a creation is a first version — a creation naming a preceding version is a change_type mismatch, rejected; the status code is spec-unassigned (AMB-54: 400|422)
postconditions:
  - { assert: version, count: 1 }        # only the first VERSION remains
ambiguities: [AMB-54]
