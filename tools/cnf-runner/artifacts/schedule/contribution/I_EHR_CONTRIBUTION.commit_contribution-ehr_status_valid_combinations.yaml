# The official EHR_STATUS accepted-combination matrix (master08 §EHR_STATUS
# CONTRIBUTION Commit Data Sets, Accepted Cases): "CONTRIBUTIONs with VERSION
# where VERSION.commit_audit.change_type IN [modification, amendment] and valid
# EHR_STATUS, should be accepted", over the is_modifiable × is_queryable ×
# subject.external_ref combination table (the table prints 15 rows with three
# duplicated false/true triples — 12 unique combinations, all encoded here).
# The external_ref axis: HIER_OBJECT_ID | GENERIC_ID | NULL (row sentinel
# `absent` omits the field — PARTY_PROXY.external_ref is 0..1, RM common).
# Each ref row carries a distinct id value: no openEHR spec governs subject
# uniqueness — single-EHR-per-subject SUTs reject a reused subject ref
# (SUT-policy accommodation, the cnf.ehr_status.with_subject.alt precedent).
# The chapter NOTE recommending archetype_id variation on top of this table is
# a recommendation ("It is recommended to test..."), not a required row set.
# The modification member names the current status VERSION in the member body
# (SM update_version.adoc: UPDATE_VERSION.preceding_version_uid).
id: I_EHR_CONTRIBUTION.commit_contribution-ehr_status_valid_combinations
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION that modifies the EHR_STATUS with a valid
  EHR_STATUS is accepted for every is_modifiable × is_queryable ×
  subject.external_ref combination of the official accepted-cases table.
description: "Commit CONTRIBUTION containing EHR_STATUS: the accepted combination matrix"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §EHR_STATUS CONTRIBUTION Commit Data Sets (Accepted Cases)"
  - "RM ehr (EHR_STATUS: is_modifiable, is_queryable, subject; PARTY_PROXY.external_ref 0..1)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR with the default EHR_STATUS; mints ${ehr_id}
parameters:
  iteration: reset_per_row
  matrix:
    columns: [is_modifiable, is_queryable, external_ref]
    rows:
      - [true, true, { _type: PARTY_REF, id: { _type: HIER_OBJECT_ID, value: "cnf-status-mx-01" }, namespace: "cnf", type: "PERSON" }]
      - [true, true, { _type: PARTY_REF, id: { _type: GENERIC_ID, value: "cnf-status-mx-02", scheme: "cnf-scheme" }, namespace: "cnf", type: "PERSON" }]
      - [true, true, absent]
      - [true, false, { _type: PARTY_REF, id: { _type: HIER_OBJECT_ID, value: "cnf-status-mx-04" }, namespace: "cnf", type: "PERSON" }]
      - [true, false, { _type: PARTY_REF, id: { _type: GENERIC_ID, value: "cnf-status-mx-05", scheme: "cnf-scheme" }, namespace: "cnf", type: "PERSON" }]
      - [true, false, absent]
      - [false, true, { _type: PARTY_REF, id: { _type: HIER_OBJECT_ID, value: "cnf-status-mx-07" }, namespace: "cnf", type: "PERSON" }]
      - [false, true, { _type: PARTY_REF, id: { _type: GENERIC_ID, value: "cnf-status-mx-08", scheme: "cnf-scheme" }, namespace: "cnf", type: "PERSON" }]
      - [false, true, absent]
      - [false, false, { _type: PARTY_REF, id: { _type: HIER_OBJECT_ID, value: "cnf-status-mx-10" }, namespace: "cnf", type: "PERSON" }]
      - [false, false, { _type: PARTY_REF, id: { _type: GENERIC_ID, value: "cnf-status-mx-11", scheme: "cnf-scheme" }, namespace: "cnf", type: "PERSON" }]
      - [false, false, absent]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: EHR_STATUS
            archetype_node_id: "openEHR-EHR-EHR_STATUS.generic.v1"
            # An EHR_STATUS is unconditionally an archetype root (RM ehr
            # ehr_status.adoc Is_archetype_root), and a root without
            # ARCHETYPED violates RM common locatable.adoc Archetyped_valid
            # (is_archetype_root xor archetype_details = Void) — so the block
            # is mandatory on every valid payload.
            archetype_details:
              _type: ARCHETYPED
              archetype_id: { _type: ARCHETYPE_ID, value: "openEHR-EHR-EHR_STATUS.generic.v1" }
              rm_version: "1.2.0"
            name: { value: "EHR Status" }
            subject:
              _type: PARTY_SELF
              external_ref: "${row.external_ref}"
            is_modifiable: "${row.is_modifiable}"
            is_queryable: "${row.is_queryable}"
          change_type: modification
          preceding_version_uid: "${status_version_uid}"   # body property: OAS UpdateVersion.preceding_version_uid
    expect: created
    capture:
      version_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: MODIFY }
postconditions:
  - { assert: version, count: 2 }        # default EHR_STATUS + the row's modification
