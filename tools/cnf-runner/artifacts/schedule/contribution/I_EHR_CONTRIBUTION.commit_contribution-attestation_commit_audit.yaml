# A version committed WITH an ATTESTATION as its own commit_audit — the first
# object of the two-object pattern, in the form the RM states it.
#
# RM common master04-generic_package.adoc §Attestation, verbatim: "When an
# attestation is required, the most common scenario will be that a Composition
# Version will be committed with a `_commit_audit_` of type `ATTESTATION`,
# rather than just `AUDIT_DETAILS`; the `_is_pending_` flag will be set to True
# to indicate that the committed information needs to be signed by another
# person." master06-change_control_package.adoc §Attestation states the same
# case from the change-control side ("Marking content for review and signing …
# this will cause `ORIGINAL_VERSION._commit_audit_` to be of type `ATTESTATION`,
# but in this case, the Attestation will have its `_is_pending_` flag set True"),
# and §Committal and Audits types the slot for both classes at once: audits are
# "instances of the class `AUDIT_DETAILS` … or its subtype `ATTESTATION`, which
# adds a number of other attributes".
#
# So the fact under test is that the commit audit's CONCRETE CLASS and the
# subtype's own attributes survive the commit: the version this contribution
# writes is an ordinary content modification (change_type 251|modification|,
# data carried, a new VERSION produced) whose commit_audit happens to be an
# ATTESTATION. That is what distinguishes this case from the sibling
# attestation_only / attestation_pending_then_final cases, whose members are
# `666|attestation|` and commit NO version: there the ATTESTATION is a separate
# object appended to an existing version's attestations list; here it IS the
# version's commit_audit, read back on the version envelope and as the first
# audit of that version's revision-history item ("there will always be at least
# one commit audit", master04 §Revision History).
#
# The commit audit carries no `proof`: this is the pending half — "the
# appropriate proof supplied" belongs to the later signing (ATTESTATION.proof
# is 0..1, RM common UML/classes/org.openehr.rm.common.attestation.adoc
# §Attributes).
#
# The released commit schema admits only the flat class for this attribute
# (schemas/common/UpdateAudit.yaml enumerates UPDATE_AUDIT / AUDIT_DETAILS /
# omitted, and UpdateVersion.commit_audit $refs it alone), while the docs text
# points the native commit at the RM that admits both — AMB-179, resolved the
# same way as the deletion member the same schema cannot express (AMB-85).
id: I_EHR_CONTRIBUTION.commit_contribution-attestation_commit_audit
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning, CompositionOps]
profiles: [CORE]
test_purpose: >-
  A COMPOSITION modification whose commit_audit is of type ATTESTATION with
  is_pending true and a coded reason is accepted, and the committed version
  reports that concrete class and those attributes on both its version envelope
  and its revision-history commit audit.
description: "Commit CONTRIBUTION whose version commit_audit is an ATTESTATION"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §generic (master04 §Attestation — a Version committed with a commit_audit of type ATTESTATION, is_pending True)"
  - "RM common §change_control (master06 §Committal and Audits — AUDIT_DETAILS or its subtype ATTESTATION; §Attestation — signing/marking content at committal)"
  - "RM common §attestation (ATTESTATION.reason 1..1 + Reason_valid; is_pending 1..1; proof 0..1)"
  - "TERM SupportTerminology §attestation reason (648 witnessed)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets:
  - cnf.composition.minimal_event.v1
  - cnf.composition.minimal_event.v2
  - cnf.audit.attestation_commit_audit
flow:
  - step: 1                              # the content that will be amended
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2                              # a NEW version whose commit_audit is an ATTESTATION
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          preceding_version_uid: "${v1_uid}"
          commit_audit: "${ds:cnf.audit.attestation_commit_audit}"
    expect: created
    capture:
      v2_uid: created.first_version_uid
  - step: 3                              # the version envelope reports the concrete class
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: field, path: "commit_audit/_type", equals: "ATTESTATION" }
      - { assert: field, path: "commit_audit/is_pending", equals: true }
      - { assert: field, path: "commit_audit/reason/defining_code/code_string", equals: "648" }
      - { assert: field, path: "commit_audit/proof", absent: true }   # not signed yet (proof 0..1)
      # The INHERITED AUDIT_DETAILS attributes are still there and still the
      # server's (master06 §Committal: time_committed is computed on the server)
      - { assert: field, path: "commit_audit/change_type/defining_code/code_string", equals: "251" }
      - { assert: field, path: "commit_audit/time_committed/value", exists: true }
      # This is the version's OWN commit audit, not an appended attestation
      - { assert: field, path: "attestations", absent: true }
  - step: 4                              # and the revision history reports it too
    call: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "items[0]/audits[0]/_type", equals: "AUDIT_DETAILS" }
      - { assert: field, path: "items[1]/version_id/value", equals: "${v2_uid}" }
      - { assert: field, path: "items[1]/audits[0]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "items[1]/audits[0]/is_pending", equals: true }
      - { assert: field, path: "items[1]/audits[1]", absent: true }
postconditions:
  - { assert: version, count: 2 }        # the ATTESTATION commit audit committed a VERSION
  - assert: state
    text: >-
      The second VERSION's commit_audit is an ATTESTATION carrying is_pending
      true and its coded reason — the concrete class survives the commit.
ambiguities: [AMB-179]
