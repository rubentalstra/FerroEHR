# The REFUSAL twin of -incomplete_missing_mandatory: the identical content at
# `532|complete|` is rejected.
#
# RM common master06-change_control_package.adoc §Incomplete Content states the
# rule in the indicative: "One of the consequences of accepting content that is
# semantically incomplete … is that it might also be technically 'incomplete',
# i.e. it may be missing mandatory data fields with respect to its generating
# archetypes. If being committed in the `complete` state, such data would be
# treated as invalid by the repository and rejected by the API."
#
# SPEC SILENCE on the code, registered as AMB-194: no released sentence assigns
# a status to this rejection. The register's fixed handling is 422 — the
# overview's own row for a well-formed request whose semantics cannot be
# followed, and the code the released `422.yaml` assigns to invalid
# committed content.
#
# The ONLY difference from the accepting sibling is the lifecycle code, so a red
# row localizes to the relaxation's scope and nothing else.
id: I_EHR_CONTRIBUTION.commit_contribution-complete_missing_mandatory
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-194]
test_purpose: >-
  A CONTRIBUTION version carrying lifecycle_state 532|complete| whose content
  is missing mandatory attributes is rejected, and nothing is committed.
description: "Commit CONTRIBUTION with a complete (532) version missing mandatory attributes"
spec_refs:
  - "RM common §change_control (master06 §Incomplete Content — content missing mandatory data committed as complete is treated as invalid and rejected)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.missing_mandatory]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:                          # the same member, at the DEFAULT complete state
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "complete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "creation"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.missing_mandatory}"
    expect: validation_failed
postconditions:
  - { assert: version, count: 0 }
