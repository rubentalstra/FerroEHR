# WHAT the CONTRIBUTION read's conditional headers carry: the entity tag is the
# contribution uid — the same identity the create's 201 already returned — and
# Last-Modified is present.
#
# SPEC SILENCE, adjudicated as AMB-87 (fixed_handling). The overview SHOULDs
# both headers "for VERSION, VERSIONED_OBJECT, or other resources that have
# versioning or unique state identifiers" (`Requests_and_responses.md` §"ETag
# and Last-Modified"), while Resources.md classifies CONTRIBUTION among the
# NON-versioned resources — so whether the SHOULD reaches this response is left
# open, and the released 200 response declares neither header. The register's
# fixed handling: a CONTRIBUTION is immutable and carries a unique identifier,
# which IS a unique state identifier, so the tag is that identifier and
# Last-Modified is the one instant the resource was ever "modified" — its
# committal (the same section: the value "should be derived from
# VERSION.commit_audit.time_committed.value").
#
# WHAT IS EXECUTED: step 1 captures the identity from BOTH sides of the create
# — the envelope's `uid.value` and the 201's entity tag — and asserts they are
# the same string, so the ETag identity claim is anchored before the read.
# Step 2's headers are asserted by the binding's `ok` matchers: the entity tag
# resolves to `W/"<contribution_uid>"` against that captured uid, and
# Last-Modified must be present. `Location` is asserted absent on the same
# outcome (§Location: "MUST NOT be used to indicate an alternate representation
# of an existing resource (e.g. via `GET` method)").
id: I_EHR_CONTRIBUTION.get_contribution-header_identity
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
profiles: [CORE]
ambiguities: [AMB-87]
test_purpose: >-
  A CONTRIBUTION read carries the weak entity tag holding the contribution uid
  — the identity the create's response already named — together with a
  Last-Modified instant.
description: "Get CONTRIBUTION: the read carries the uid ETag and Last-Modified"
spec_refs:
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "ITS-REST overview Requests_and_responses §Deprecated headers"
  - "ITS-REST overview Resources §Resources"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      contribution_uid: created.contribution_uid            # from the envelope body
      contribution_etag_uid: created.contribution_etag_uid  # from the 201 entity tag
    assert:
      # the create's entity tag already holds the contribution's identity
      - { assert: field, path: "uid/value", equals: "${contribution_etag_uid}" }
  - step: 2
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok                           # ETag = W/"${contribution_uid}", Last-Modified present, Location absent (binding matchers)
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      - { assert: field, path: "uid/value", equals: "${contribution_uid}" }
