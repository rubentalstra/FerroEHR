# The SHAPE of an unresolved CONTRIBUTION member: what a `versions[i]`
# OBJECT_REF actually says about the version it points at.
#
# SPEC TENSION, adjudicated as AMB-88 (fixed_handling). RM common defines the
# refs as "Set of references to Versions causing changes", and BASE types
# OBJECT_REF.type as the "Name of the class … of object to which this
# identifier type refers" — which for an OBJECT_VERSION_ID id argues for a
# VERSION type. But the RM's own next sentence names "items of types such as
# COMPOSITION and FOLDER", and the released CONTRIBUTION schema example emits
# exactly that: `type: COMPOSITION` / `type: FOLDER` beside an
# OBJECT_VERSION_ID `id`. The register follows the released example — the ref
# carries the DATA class as `type`, `namespace: local`, and the full
# OBJECT_VERSION_ID (self-identified by its `_type`) as `id`.
#
# The target is deliberately an EHR_STATUS commit, the third data class of the
# three the members can carry: the two the released example already shows are
# COMPOSITION and FOLDER, so a server hard-coding the example's own two type
# names would pass on them and fail here.
#
# The three-part id matters as much as the type: RM common master06
# §change_control identifies VERSION objects "by a `_uid_` attribute of type
# `OBJECT_VERSION_ID`", so a ref carrying a bare object id would name the
# container rather than the version that caused the change.
#
# The resolved counterpart of the same member is the sibling -resolve_refs
# case.
id: I_EHR_CONTRIBUTION.get_contribution-version_ref_shape
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
exercises: [Versioning, EhrStatus]
profiles: [CORE]
ambiguities: [AMB-88]
test_purpose: >-
  A served CONTRIBUTION's versions[i] reference carries the committed DATA
  class as its type, the local namespace, and the full OBJECT_VERSION_ID of the
  version that caused the change.
description: "Get CONTRIBUTION: the versions[] OBJECT_REF shape"
spec_refs:
  - "RM common §contribution (versions — references to the Versions causing changes; items of types such as COMPOSITION and FOLDER)"
  - "BASE base_types §object_ref (type — name of the class of object referred to)"
  - "RM common §change_control (master06 — VERSION objects are identified by a uid of type OBJECT_VERSION_ID)"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.ehr_status.minimal]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status    # the status version the modification names as preceding
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.ehr_status.minimal}"
          change_type: modification
          preceding_version_uid: "${status_version_uid}"
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      committed_version_uid: created.first_version_uid
  - step: 3
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      # the DATA class, not a VERSION type name
      - { assert: field, path: "versions[0]/type", equals: "EHR_STATUS" }
      - { assert: field, path: "versions[0]/namespace", equals: "local" }
      # the id is the three-part version identifier, self-identified
      - { assert: field, path: "versions[0]/id/_type", equals: "OBJECT_VERSION_ID" }
      - { assert: field, path: "versions[0]/id/value", equals: "${committed_version_uid}" }
postconditions:
  - { assert: version, count: 2 }        # the default EHR_STATUS + the modification
