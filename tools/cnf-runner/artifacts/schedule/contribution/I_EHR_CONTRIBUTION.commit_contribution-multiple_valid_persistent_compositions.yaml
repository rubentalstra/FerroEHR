# The official multi-version combination B (master08 §Combinations of data
# sets: "Creating two valid, complete persistent COMPOSITIONs in one commit
# should be accepted"). Per the combination's NOTE — "some servers might not
# accept the second COMPOSITION if both COMPOSITIONs reference the same
# persistent OPT. So this test case considers both COMPOSITIONs reference
# different persistent OPTs" — the two members reference persistent_minimal.en.v1
# and persistent_minimal_2.en.v1 (both official Robot-corpus persistent OPTs).
id: I_EHR_CONTRIBUTION.commit_contribution-multiple_valid_persistent_compositions
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION bundling two valid, complete persistent COMPOSITIONs that
  reference different persistent OPTs (both change_type = creation) is
  accepted; both VERSIONs are created in the one CONTRIBUTION.
description: "One commit, two valid persistent COMPOSITIONs on different OPTs — accepted (combination B)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §Combinations of data sets (multiple versions, combination B + its different-OPTs NOTE)"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_persistent, cnf.opt.persistent_minimal_2]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.persistent.v1, cnf.composition.persistent_2.v1]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:                          # two creation members, DIFFERENT persistent OPTs (the combination-B NOTE)
        - { data: "${ds:cnf.composition.persistent.v1}", change_type: creation }
        - { data: "${ds:cnf.composition.persistent_2.v1}", change_type: creation }
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      version_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: CREATE, uid_pattern: "<uuid>::<system>::1" }
postconditions:
  - { assert: version, count: 2 }        # two new VERSIONed objects, one CONTRIBUTION
