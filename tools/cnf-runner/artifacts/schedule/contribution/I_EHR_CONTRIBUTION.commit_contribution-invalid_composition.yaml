# C.2 — commit a CONTRIBUTION carrying one invalid VERSION<COMPOSITION>: the
# commit is rejected and nothing is created.
id: I_EHR_CONTRIBUTION.commit_contribution-invalid_composition
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION containing an invalid VERSION<COMPOSITION> is
  rejected with information about the errors, and no VERSION is created.
description: "Commit CONTRIBUTION with invalid COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-invalid_composition"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.invalid_structure]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.invalid_structure}", change_type: creation }
    expect: validation_failed
postconditions:
  - { assert: version, count: 0 }        # nothing committed
