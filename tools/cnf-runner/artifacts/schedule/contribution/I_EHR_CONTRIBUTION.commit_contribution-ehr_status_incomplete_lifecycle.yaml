# The `553|incomplete|` acceptance reaches EHR_STATUS: RM common master06
# §Version Lifecycle codes lifecycle_state from the version lifecycle state
# group (532|complete|, 553|incomplete|, 523|deleted|) and §Incomplete Content
# specifies the incomplete-commit semantics generically — no released text
# excludes any content type from the incomplete state. The CNF guide's reject
# lean (master08 §EHR_STATUS CONTRIBUTION Commit Data Sets, reject case 2)
# rests on its own open problem report (SPECPR-368), and the released
# component wins over the stalled guide, so this case GATES acceptance.
#
# The member is a pre-built ORIGINAL_VERSION (the verbatim member seam) so
# lifecycle_state 553|incomplete| rides an otherwise-valid modification member
# naming the current status VERSION — isolating the lifecycle axis: the same
# content at 532|complete| is the ordinary update path.
id: I_EHR_CONTRIBUTION.commit_contribution-ehr_status_incomplete_lifecycle
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION whose EHR_STATUS member carries lifecycle_state =
  incomplete is accepted — master06 defines the incomplete state generically
  and no released text excludes EHR_STATUS — and the committed status version
  really carries the incomplete state.
description: "Commit CONTRIBUTION containing EHR_STATUS with lifecycle_state = incomplete"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §change_control (master06 §Version Lifecycle — the version lifecycle state group)"
  - "RM common §change_control (master06 §Incomplete Content — the incomplete-commit semantics, defined with no content-type exclusion)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR with the default EHR_STATUS; mints ${ehr_id}
data_sets: [cnf.ehr_status.minimal]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:                            # pre-built ORIGINAL_VERSION member: lifecycle 553|incomplete| on a valid modification
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${status_version_uid}" }
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "incomplete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "553"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.ehr_status.minimal}"
    expect: created
    capture:
      new_status_version_uid: created.first_version_uid
  - step: 3                                # the state really is the one committed
    call: I_EHR_STATUS.get_versioned_ehr_status
    variant: version
    with:
      ehr_id: "${ehr_id}"
      version_uid: "${new_status_version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "553" }
postconditions:
  - { assert: version, count: 2 }          # the default EHR_STATUS plus the accepted incomplete modification
