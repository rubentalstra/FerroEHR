# A present-but-empty `CLUSTER.items` is refused at the CONTRIBUTION-commit seam, inside a committed version's data.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM `UML/classes/org.openehr.rm.data_structures.cluster.adoc` §Attributes types
# `CLUSTER.items: List<ITEM>` at 1..1 — a MANDATORY list — and ITS-REST OAS
# the BMM declares `items` at cardinality 1..* (a mandatory NON-EMPTY container — the OAS `required` keyword alone would admit `[]`), so a present-but-EMPTY list is the one shape the bound
# forbids — the way to say "none" is to omit an optional container, never
# to send [].
#
# WHICH BRANCH: a mandatory list cannot be constructed empty, so the body
# never converts to the resource. ITS-REST `responses/400.yaml` scopes 400 to
# "syntactically invalid ... content"; `responses/422.yaml` scopes 422 to
# content that "could be converted to a resource" and then fails semantic
# validation. This body cannot be converted — the 400 row.
#
# The ACCEPTING twin is `cnf.composition.lab_result.v1`, whose specimen CLUSTER carries
# a populated `items` list and commits (create_composition-lab_result).
id: I_EHR_CONTRIBUTION.commit_contribution-cluster_no_items
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  A body carrying a CLUSTER whose mandatory items list is present but empty is refused as invalid content at this seam, and nothing is committed.
description: "CLUSTER with an empty items list refused (the CONTRIBUTION-commit seam)"
spec_refs:
  - "RM data_structures cluster.adoc §Attributes (items 1..1, cardinality 1..* — the BMM-declared non-empty bound; the OAS required keyword does not state it)"
  - "RM data_structures §CLUSTER (items: List<ITEM>, 1..1)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.ckm.lab_result]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.lab_result.cluster_items_empty]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.lab_result.cluster_items_empty}"
          change_type: creation
      audit:
        change_type:
          _type: DV_CODED_TEXT
          value: creation
          defining_code:
            _type: CODE_PHRASE
            terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
            code_string: "249"
        committer:
          _type: PARTY_IDENTIFIED
          name: "Dr Conformant"
    expect: bad_request
postconditions:
  - { assert: version, count: 0 }        # the refused commit stored nothing
