# The contribution route's PRECONDITION family: a member whose
# `preceding_version_uid` names a version that is no longer the container's
# latest — the lost-update guard, expressed in the member body rather than in
# an `If-Match` header, because this route has no version segment and no
# `If-Match` parameter at all.
#
# SPEC SILENCE on the code, adjudicated as AMB-54(b) (fixed_handling): the
# overview's 412 row is written for HEADER preconditions ("One or more
# conditions given in the request header fields evaluated to false when tested
# on the server") and §"If-Match and accidental overwrites" scopes its 412 to
# that header, while the contribution's precondition travels inside
# `UpdateVersion.preceding_version_uid`. No released sentence assigns the
# branch. The register's fixed handling is the 412 the direct routes answer for
# the identical semantic failure, carrying the current-latest version uid in
# the weak `ETag` — mirroring the same section's "SHOULD return also latest
# `version_uid` in the `ETag` response headers".
#
# WHY the version identity in the tag is assertable here: step 2 commits the
# second version and its uid is captured as `latest_version_uid`, which the
# binding's ETag pattern resolves. Step 3 then names the SUPERSEDED first
# version — so a server echoing the request's own stale uid, or omitting the
# header, is a red row rather than a silent pass.
#
# Contrast kept honest by the siblings: a CREATION member that names a
# preceding version is 422, not 412 (-creation_with_preceding_version), and a
# first-version MODIFICATION is 400 (-one_commit_invalid_change_types) — three
# distinct change-control failures, three distinct answers.
id: I_EHR_CONTRIBUTION.commit_contribution-stale_preceding_version
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-54]
test_purpose: >-
  A CONTRIBUTION member whose preceding_version_uid names a superseded version
  fails its precondition, the response names the container's current latest
  version, and nothing is committed.
description: "Commit CONTRIBUTION with a stale preceding_version_uid"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "RM common §change_control (master06 §Version tree — a new Version supersedes the one it names as preceding)"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { stale_version_uid: created.first_version_uid }   # …::1, superseded by step 2
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          preceding_version_uid: "${stale_version_uid}"
    expect: created
    capture: { latest_version_uid: created.first_version_uid }  # …::2, the container's current latest
  - step: 3                              # the same precondition again — now false
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          preceding_version_uid: "${stale_version_uid}"
    expect: precondition_failed          # ETag = W/"${latest_version_uid}" (asserted by the binding)
postconditions:
  - assert: state
    text: >-
      The failed precondition committed no third version: the COMPOSITION's
      latest remains the version step 2 created
  - { assert: version, count: 2 }
