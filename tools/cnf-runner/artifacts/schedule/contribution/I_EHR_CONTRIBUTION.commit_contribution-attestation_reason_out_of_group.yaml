# The refusal twin that a merely-well-formed reason cannot pass: a coded
# `ATTESTATION.reason` whose code is a REAL openEHR code but belongs to the
# wrong group.
#
# RM common UML/classes/org.openehr.rm.common.attestation.adoc §Invariants,
# verbatim: "__Reason_valid__: `(reason.generating_type.is_equal
# (“DV_CODED_TEXT”) implies terminology (Terminology_id_openehr).
# has_code_for_group_id (Group_id_attestation_reason, reason.defining_code))`".
# The group is named in the class table's own `reason` row — "Optionally coded
# by the openEHR Terminology group  attestation reason ; includes values like
# authorisation , witness etc." — and master04-generic_package.adoc §Attestation
# repeats it: "The `_reason_` attribute … is coded using the openEHR
# Terminology group \"attestation reason\"". TERM SupportTerminology publishes
# that group as exactly {240 signed, 648 witnessed}.
#
# THE FIXTURE'S code is `249`, which IS an openEHR code — of the AUDIT CHANGE
# TYPE group. So a server that only checked "is this a known openEHR code", or
# that checked no group at all, accepts it; only a server that resolves the
# invariant's `Group_id_attestation_reason` refuses. That is what makes this a
# distinct behaviour from the missing-reason twin rather than a variation of it.
#
# THE STATUS is the docs text's 422 row (overview Requests_and_responses.md
# §HTTP status codes, verbatim: "The request was well-formed but was unable to
# be followed due to semantic errors") — a terminology-binding violation is
# precisely a semantic one: every token parses.
id: I_EHR_CONTRIBUTION.commit_contribution-attestation_reason_out_of_group
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A 666|attestation| member whose coded ATTESTATION.reason names a code outside
  the openEHR attestation reason group is rejected, even though the code exists
  in another openEHR group.
description: "Commit CONTRIBUTION attesting with an out-of-group reason code"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §attestation (Reason_valid — has_code_for_group_id (Group_id_attestation_reason, reason.defining_code))"
  - "RM common §generic (master04 §Attestation — reason is coded using the openEHR Terminology group attestation reason)"
  - "TERM SupportTerminology §attestation reason (240 signed, 648 witnessed)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.attestation.invalid.reason_out_of_group]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation
          preceding_version_uid: "${v1_uid}"
          attestation: "${ds:cnf.attestation.invalid.reason_out_of_group}"
    expect: validation_failed
  - step: 3
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "attestations[0]", absent: true }
postconditions:
  - assert: state
    text: >-
      The rejected attestation attached nothing: the version carries no
      ATTESTATION and no version was added.
  - { assert: version, count: 1 }
