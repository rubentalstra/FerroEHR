# C.3 — commit a CONTRIBUTION with no content (empty versions list): rejected
# with an error indicating the empty VERSION list; nothing is created.
#
# SPEC SILENCE on the ground AND the code, adjudicated as AMB-84
# (fixed_handling): nothing released requires the list to be non-empty on the
# COMMIT side — the commit schema declares no minItems (while the READ schema
# declares minItems 1, an asymmetry), the RM CONTRIBUTION class declares no
# invariants at all, and no operation branch covers an empty change set. The
# register's fixed handling rejects it in the overview's 422 row
# (`Requests_and_responses.md` §HTTP status codes, verbatim: "The request was
# well-formed but was unable to be followed due to semantic errors"): the
# envelope parses, and a change set that changes nothing cannot be followed as
# a CONTRIBUTION — RM common master06 §Contributions has it exist to list "the
# affected VERSION objects".
id: I_EHR_CONTRIBUTION.commit_contribution-empty
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION whose versions list is empty is rejected with an
  error indicating the empty VERSION list.
description: "Commit CONTRIBUTION with no content"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-empty"
  - "RM common §contribution (versions — the affected VERSION objects; the class declares no invariants)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
ambiguities: [AMB-84]
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions: []                        # empty CONTRIBUTION
    expect: validation_failed
postconditions:
  - { assert: version, count: 0 }
