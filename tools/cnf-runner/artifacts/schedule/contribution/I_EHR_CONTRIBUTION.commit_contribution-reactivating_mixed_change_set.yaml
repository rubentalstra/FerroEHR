# The ACCEPTANCE twin of -ehr_not_modifiable: a mixed CONTRIBUTION whose
# EHR_STATUS member REACTIVATES the EHR (is_modifiable -> true) may carry
# content members into a deactivated EHR.
#
# The RM grounds the two halves separately: the EHR_STATUS member is always
# committable ("The `EHR_STATUS` object itself can always be written to" — RM
# ehr_status.adoc §Attributes; master04 §EHR Creation: "the `EHR_STATUS`
# object itself is always modifiable" — the stated purpose being "to change
# the status of the EHR as a whole"), and the commit is one atomic act with
# no observable intermediate states (RM common master06 §Committal and
# Audits: "similar to nested transactions"). NO released text assigns the
# `versions` list an application order (its own description calls it a "Set
# of references"), so the gate is evaluated order-independently over the
# whole change set — the content member is listed FIRST here on purpose.
# Per-member gate timing is spec-silent (AMB-82's mechanics side);
# adjudicated in-repo on issue #2673: content is refused exactly when the
# EHR is deactivated AND the change set does not reactivate it.
id: I_EHR_CONTRIBUTION.commit_contribution-reactivating_mixed_change_set
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [EhrStatus]
profiles: [CORE]
ambiguities: [AMB-82]
test_purpose: >-
  A CONTRIBUTION carrying a content member beside an EHR_STATUS member that
  sets is_modifiable = true is accepted against a deactivated EHR, atomically
  reactivating it and committing the content; the member order is
  insignificant (content listed first).
description: "Commit reactivating mixed CONTRIBUTION into a deactivated EHR"
spec_refs:
  - "RM ehr §EHR Active Status (master04 — the EHR_STATUS object itself is always modifiable)"
  - "RM common §Committal and Audits (master06 — the commit is one atomic act)"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_modifiable = true
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status    # the payload the PUT modifies + the If-Match precondition
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2                              # deactivate through the wire: is_modifiable -> false
    call: I_EHR_STATUS.clear_ehr_modifiable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
    capture: { status_version_uid: updated.status_version_uid }
  - step: 3                              # content FIRST, the reactivating status member SECOND
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
        - data:
            _type: EHR_STATUS
            archetype_node_id: "openEHR-EHR-EHR_STATUS.generic.v1"
            archetype_details:
              _type: ARCHETYPED
              archetype_id: { _type: ARCHETYPE_ID, value: "openEHR-EHR-EHR_STATUS.generic.v1" }
              rm_version: "1.2.0"
            name: { value: "EHR Status" }
            subject: { _type: PARTY_SELF }
            is_modifiable: true
            is_queryable: true
          change_type: modification
          preceding_version_uid: "${status_version_uid}"   # body property: OAS UpdateVersion.preceding_version_uid
    expect: created
  - step: 4                              # the EHR is active again: plain content goes through
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
postconditions:
  - assert: state
    text: >-
      The reactivating mixed commit landed atomically: the EHR holds the
      reactivated EHR_STATUS lineage and both COMPOSITIONs
  - { assert: version, count: 5 }        # 3 EHR_STATUS versions (default, deactivation, reactivation) + 2 COMPOSITIONs
