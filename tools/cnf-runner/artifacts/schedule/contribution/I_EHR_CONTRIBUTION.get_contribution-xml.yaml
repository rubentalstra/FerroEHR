# The canonical-XML RESPONSE branch of get_contribution: a committed
# CONTRIBUTION retrieved as canonical XML.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to specify
# the expected XML response format. If the service cannot fulfill this aspect of
# the request, it MUST respond with HTTP status code `406 Not Acceptable`.
# Proper header `Content-Type: application/xml` MUST be present in the response
# of the service unless the response has no content body (HTTP status code
# `204`)." The binding's `Content-Type: negotiated` matcher executes that MUST
# against the `Accept` this step sends. The released OAS corroborates that the
# type is on offer for this operation: `operations/contribution_get.yaml`
# references `parameters/header/Accept_LOCATABLE.yaml`, whose enum contains
# `application/xml`, and its description names "the canonical
# `application/json` / `application/xml`".
#
# BODY FLOOR. The section's "both request payloads and responses MUST conform to
# the [published XSDs]" constrains the CONTENT MODEL, and the published ITS-XML
# schema does define the CONTRIBUTION complexType (RM Common.xsd: `uid`,
# `versions` as OBJECT_REF, `audit`) — but it declares NO global element for it
# (the only globally declared document elements are `composition`, `version`,
# `extract`, `extract_request`, `versioned_object` and `items`), so no released
# sentence assigns this response's document ROOT NAME. The row asserts only what
# the release does state: an `application/xml` entity, i.e. an XML document
# (RFC 7303 §3, "application/xml"). Naming a root here would invent an
# expectation the release withholds.
#
# §"Data representation" leaves XML support to the service ("Services MUST
# support at least one of the openEHR **XML** or **JSON** canonical formats"),
# hence the `canonical-xml` format axis.
id: I_EHR_CONTRIBUTION.get_contribution-xml
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  get_contribution requested with `Accept: application/xml` returns the
  CONTRIBUTION as an XML document typed `Content-Type: application/xml`.
description: "Get an existing CONTRIBUTION as canonical XML"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "RM common §CONTRIBUTION"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution          # precondition: a CONTRIBUTION of known uid
    format: canonical-json             # the commit envelope stays JSON — see the commit_contribution
                                       # canonical-xml adjudication in vocab/wire_surface.yaml
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: get_contribution
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      # An XML document entity, nothing more — see the BODY FLOOR note above.
      - { assert: returns, matches: '^\s*<' }
