# D.4 — commit a CONTRIBUTION carrying an invalid EHR_STATUS (change_type
# modification): rejected with an error about the invalid EHR_STATUS; nothing is
# committed.
id: I_EHR_CONTRIBUTION.commit_contribution-invalid_ehr_status
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION with an invalid EHR_STATUS is rejected with an error
  about the invalid EHR_STATUS; no VERSION is created.
description: "Commit CONTRIBUTION containing invalid EHR_STATUS"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-invalid_ehr_status"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR with the default EHR_STATUS; mints ${ehr_id}
data_sets: [cnf.ehr_status.invalid]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.ehr_status.invalid}", change_type: modification }
    expect: validation_failed
postconditions:
  - { assert: version, count: 1 }        # only the pre-existing default EHR_STATUS remains
