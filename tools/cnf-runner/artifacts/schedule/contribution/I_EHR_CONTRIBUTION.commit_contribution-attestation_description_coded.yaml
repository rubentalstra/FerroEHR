# A CODED description on a `666|attestation|` member survives the commit whole.
#
# ATTESTATION is an AUDIT_DETAILS subtype (RM common
# UML/classes/org.openehr.rm.common.attestation.adoc §Class — "Inherit
# AUDIT_DETAILS"), so it inherits `description`, which
# UML/classes/org.openehr.rm.common.audit_details.adoc §Attributes types
# `DV_TEXT` at 0..1 ("Reason for committal"). DV_CODED_TEXT is a DV_TEXT subtype
# carrying a `defining_code` (RM data_types
# UML/classes/org.openehr.rm.data_types.dv_coded_text.adoc), and the released
# wire says the same: ITS-REST specifications/schemas/common/
# UpdateAttestation.yaml extends UpdateAudit, whose `description` is `UDvText`
# — a `oneOf` over DV_TEXT and DV_CODED_TEXT (schemas/common/UDvText.yaml).
#
# So a coded reason-for-committal is a representable value HERE TOO, and the
# fact under test is that all of it comes back off the attestation seam: the
# `_type`, the display `value`, and the whole `defining_code` (code_string +
# terminology_id). This is the attestation-path twin of
# commit_contribution-audit_description_coded, which pins the same fact on a
# version's own commit_audit. The two travel different code: an attestation
# member commits no version, so its UPDATE_ATTESTATION is completed into a full
# ATTESTATION on its own seam — a server that flattens the description to its
# `value` string there loses the code silently while the version path stays
# correct, and the commit and the read both still succeed. Only an assertion on
# the code itself catches it.
#
# No openEHR terminology group binds this attribute, so the code is
# archetype-local and only its SURVIVAL is asserted, never its membership. The
# attestation's `reason` stays the group-bound 648|witnessed| of the sibling
# valid fixtures (ATTESTATION.Reason_valid), so any refusal can only be about
# the description.
id: I_EHR_CONTRIBUTION.commit_contribution-attestation_description_coded
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning, CompositionOps]
profiles: [CORE]
test_purpose: >-
  A 666|attestation| member whose description is a DV_CODED_TEXT is accepted,
  and the attestation reports that description back with its _type, value and
  defining_code intact on both the version envelope and the revision history.
description: "Commit an ATTESTATION with a DV_CODED_TEXT description"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §attestation (ATTESTATION inherits AUDIT_DETAILS)"
  - "RM common §audit_details (AUDIT_DETAILS.description: DV_TEXT 0..1)"
  - "RM data_types §dv_coded_text (DV_CODED_TEXT.defining_code — the coded DV_TEXT subtype)"
  - "RM common §change_control (master06 §Contributions — the 666|attestation| change kind)"
  - "RM common §revision_history_item (audits — further attestations)"
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.attestation.description_coded]
flow:
  - step: 1                              # the content to attest
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2                              # the attestation-only change set
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation       # no data, no lifecycle_state — no new version
          preceding_version_uid: "${v1_uid}"
          attestation: "${ds:cnf.attestation.description_coded}"
    expect: created
  - step: 3                              # the whole DV_CODED_TEXT comes back on the version
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "attestations[0]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "attestations[0]/description/_type", equals: "DV_CODED_TEXT" }
      - { assert: field, path: "attestations[0]/description/value", equals: "countersigned at ward round" }
      - { assert: field, path: "attestations[0]/description/defining_code/code_string", equals: "at0007" }
      - { assert: field, path: "attestations[0]/description/defining_code/terminology_id/value", equals: "local" }
  - step: 4                              # and on the revision history's attestation audit
    call: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "items[0]/audits[1]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "items[0]/audits[1]/description/_type", equals: "DV_CODED_TEXT" }
      - { assert: field, path: "items[0]/audits[1]/description/defining_code/code_string", equals: "at0007" }
      - { assert: field, path: "items[0]/audits[1]/description/defining_code/terminology_id/value", equals: "local" }
postconditions:
  - { assert: version, count: 1 }        # the attestation created no version
  - assert: state
    text: >-
      The stored ATTESTATION carries the whole DV_CODED_TEXT description — the
      defining_code is not flattened away when the wire partial is completed.
