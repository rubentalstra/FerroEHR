# The `retrieve` transition of the master06 §Abandoned and Inactive States
# table: `abandoned` -> `incomplete`.
#
# The prose: "If circumstances change again and the abandoned item once more
# becomes relevant, it may be transitioned back to the `incomplete` state via
# the `retrieve` transition." The table's row: "`abandoned` | `retrieve` |
# `incomplete` | Patient returns to rehab and care is resumed; the abandoned
# draft care plan is therefore brought back into use."
#
# Steps 1-2 provision the `abandoned` state (its only arrival is `abandon` from
# `incomplete`); the behaviour under test is step 3. The sibling
# -lifecycle_illegal_transition pins the refusal of the `abandoned` ->
# `complete` shortcut the table does not list.
#
# No named wire operation exists for the transition (register AMB-195).
id: I_EHR_CONTRIBUTION.commit_contribution-lifecycle_retrieve
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-195]
test_purpose: >-
  An abandoned (801) version transitions back to incomplete (553) through a new version, and the served version carries the incomplete state.
description: "Commit CONTRIBUTION transitioning an abandoned version back to incomplete (retrieve)"
spec_refs:
  - "RM common §change_control (master06 §Version Lifecycle — any transition requires the commit of a new version)"
  - "RM common §change_control (master06 §Abandoned and Inactive States — the transition table)"
  - "TERM SupportTerminology §Version Lifecycle State"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "incomplete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "553"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "creation"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      v1_uid: created.first_version_uid
  - step: 2                              # abandon (provisioning)
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${v1_uid}" }
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "abandoned"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "801"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.composition.minimal_event.v2}"
    expect: created
    capture:
      v2_uid: created.first_version_uid
  - step: 3                              # retrieve — the behaviour under test
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${v2_uid}" }
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "incomplete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "553"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      v3_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 4
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v3_uid}"
    expect: ok
    assert:
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "553" }
postconditions:
  - { assert: version, count: 3 }
