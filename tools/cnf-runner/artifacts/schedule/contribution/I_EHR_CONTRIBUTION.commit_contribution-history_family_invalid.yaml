# The History-package refusal twins (RM data_structures ch.6, issue #2471):
# the accepting twin is cnf.composition.history_open.interval_events; these
# rows pin the three falsifiable History invariants, one defect each, under
# the deliberately open cnf.opt.history_open.v1 template (abstract EVENT +
# ITEM_STRUCTURE slots), so each refusal is single-cause — the archetype
# admits every event individually and only the RM rule is violated.
id: I_EHR_CONTRIBUTION.commit_contribution-history_family_invalid
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: "A committed HISTORY violating the History family — events of diverging structural types, an out-of-group math_function code, or an off-period event offset — is refused as invalid content, and no version is created."
description: "commit compositions with History-package invariant defects"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM data_structures/master06-history_package.adoc §Basic Semantics (the generic types force the type of the data in each Event to be the same)"
  - "RM UML/classes/org.openehr.rm.data_structures.history.adoc §Invariants (Period_consistency) + org.openehr.rm.data_structures.interval_event.adoc §Invariants (Math_function_validity)"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes (the semantic 422 branch)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.history_open.v1]
  ehr: { commits: none }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.composition.history_open.mixed_structures, expected: validation_failed, defect: "two events with diverging ITEM_STRUCTURE subtypes in one HISTORY (the same-structural-type rule)" }
    - { data_set: cnf.composition.history_open.out_of_group_math_function, expected: validation_failed, defect: "math_function code outside the openEHR event math function group (Math_function_validity)" }
    - { data_set: cnf.composition.history_open.off_period_offset, expected: validation_failed, defect: "an event offset that is not a whole multiple of the period (Period_consistency)" }
flow:
  - step: 1
    call: commit_contribution
    with:
      versions: "${ds:fixture}"
      audit: { change_type: creation, committer: { name: "conformance tester" } }
    expect: "${fixture.expected}"
postconditions:
  - assert: version
    count: 0
