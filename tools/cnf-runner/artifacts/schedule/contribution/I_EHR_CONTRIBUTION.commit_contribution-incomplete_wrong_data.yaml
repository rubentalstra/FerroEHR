# The LIMIT of the incomplete relaxation: `553|incomplete|` admits data that is
# MISSING, never data that is WRONG.
#
# RM common master06-change_control_package.adoc §Incomplete Content, NOTE,
# verbatim: "All other validity requirements must be satisfied. In other words,
# in an `incomplete` commit, data may be missing, but it may not be wrong."
#
# The data set is the accepting sibling's content with ONE further edit: the
# COMPOSITION.category code replaced by `999`, which is not a member of the
# openEHR composition category group. That is not an absence the state relaxes
# — it is a coded value the RM class invariant `COMPOSITION.Category_validity`
# forbids — so the commit is refused even at 553.
#
# The accepting twin is -incomplete_missing_mandatory (the same absences,
# without the wrong code).
id: I_EHR_CONTRIBUTION.commit_contribution-incomplete_wrong_data
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION version carrying lifecycle_state 553|incomplete| whose content
  is WRONG (a coded value outside its RM-mandated terminology group) is
  rejected — the incomplete state relaxes absence, never invalidity.
description: "Commit CONTRIBUTION with an incomplete (553) version carrying wrong data"
spec_refs:
  - "RM common §change_control (master06 §Incomplete Content — \"data may be missing, but it may not be wrong\")"
  - "RM composition §COMPOSITION (Category_validity)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.missing_mandatory_and_wrong_category]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "incomplete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "553"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "creation"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.missing_mandatory_and_wrong_category}"
    expect: validation_failed
postconditions:
  - { assert: version, count: 0 }
