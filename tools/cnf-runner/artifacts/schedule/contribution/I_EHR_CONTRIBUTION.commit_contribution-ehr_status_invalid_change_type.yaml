# D.3 — commit a CONTRIBUTION carrying an EHR_STATUS with an invalid change_type
# (creation or deleted): rejected, because the EHR_STATUS already exists for the
# EHR and cannot be re-created or deleted. Nothing is committed.
id: I_EHR_CONTRIBUTION.commit_contribution-ehr_status_invalid_change_type
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION with an EHR_STATUS whose change_type is creation or
  deleted is rejected, because the EHR_STATUS already exists and cannot be
  re-created or deleted.
description: "Commit CONTRIBUTION containing EHR_STATUS with invalid change type"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-ehr_status_invalid_change_type"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR with the default EHR_STATUS; mints ${ehr_id}
data_sets: [cnf.ehr_status.minimal]
parameters:
  iteration: reset_per_row
  matrix:
    columns: [change_type]               # the two invalid change types (creation, deleted)
    rows:
      - [creation]                         # the deleted row is the sibling case (-deleted): its wire needs the current status version as preceding
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.ehr_status.minimal}", change_type: "${row.change_type}" }
    expect: conflict                      # EHR_STATUS already exists for the EHR
postconditions:
  - { assert: version, count: 1 }        # only the pre-existing default EHR_STATUS remains
