# Split 2026-07-22 from ehr_status_invalid_change_type: the `deleted` change
# type needs the current status version as its preceding target before the
# SUT can adjudicate it — and the adjudication is a CONFLICT: EHR.ehr_status
# is mandatory (RM ehr, EHR class, 1..1), so the status cannot be deleted.
id: I_EHR_CONTRIBUTION.commit_contribution-ehr_status_invalid_change_type_deleted
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION whose member deletes the EHR_STATUS is refused: the status
  is mandatory on the EHR, so the delete member is a version conflict.
description: "Commit CONTRIBUTION deleting the EHR_STATUS (invalid change type)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution (invalid EHR_STATUS change types)"
  - "RM ehr (EHR class: ehr_status 1..1)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                   # mints ${ehr_id}; the default EHR_STATUS exists
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: deleted
          preceding_version_uid: "${status_version_uid}"
    expect: conflict                       # the mandatory status cannot be deleted
postconditions:
  - { assert: version, count: 1 }          # only the pre-existing default EHR_STATUS remains
