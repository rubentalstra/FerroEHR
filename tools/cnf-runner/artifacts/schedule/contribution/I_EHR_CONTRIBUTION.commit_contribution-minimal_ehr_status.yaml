# D.1 — commit a CONTRIBUTION modifying an EHR's EHR_STATUS (the EHR carries the
# default EHR_STATUS). For EHR_STATUS the change_type is always modification or
# amendment; the commit is accepted and a new EHR_STATUS VERSION is created.
# The official flow step 3 "Verify expected CONTRIBUTION uids and CONTRIBUTION
# count" is realized for its uid half (capture + get_contribution); the count
# half has no ITS-REST 1.1.0 wire (list_contributions — AMB-22; the SM
# contribution_count is likewise unwired) and is carried by the register tag.
# NOTE: the modification member names the EHR's current status VERSION in the
# member body (SM update_version.adoc: UPDATE_VERSION.preceding_version_uid;
# OAS UpdateVersion.preceding_version_uid), captured via get_ehr_status.
id: I_EHR_CONTRIBUTION.commit_contribution-minimal_ehr_status
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION that modifies the EHR's default EHR_STATUS with a
  valid EHR_STATUS succeeds and creates a new EHR_STATUS VERSION.
description: "Commit CONTRIBUTION containing minimal EHR_STATUS"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-minimal_ehr_status"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR with the default EHR_STATUS; mints ${ehr_id}
data_sets: [cnf.ehr_status.minimal]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.ehr_status.minimal}"
          change_type: modification
          preceding_version_uid: "${status_version_uid}"   # RM common §change_control: a modification member names its preceding version
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      version_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: MODIFY }
  - step: 3
    call: get_contribution                 # official step 3, uid half: "Verify expected CONTRIBUTION uids"
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
postconditions:
  - { assert: version, count: 2 }        # default EHR_STATUS + the modification
  - assert: state
    text: >-
      The CONTRIBUTION count for the EHR is 2 (the EHR-creation CONTRIBUTION +
      this commit) — unverifiable on ITS-REST 1.1.0: no list_contributions
      wire (AMB-22) and no contribution_count wire exists.
    verified_by: I_EHR_CONTRIBUTION.list_contributions-post_commit
ambiguities: [AMB-22]
