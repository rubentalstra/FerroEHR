# The mirror of the first-version-MODIFICATION rejection: a member whose
# change_type is 249|creation| but which ALSO names a preceding version. A
# creation starts a version tree; it cannot have a predecessor.
#
# The RULE is RM, an invariant (RM common
# UML/classes/org.openehr.rm.common.version.adoc, VERSION
# §Invariants — `Preceding_version_uid_validity`): the preceding version uid is
# valid only for a version that HAS one, i.e. one that is not the first of its
# tree. master06 §Contributions states the same change-kind law from the audit
# side — 249|creation| is "the creation of a new Item".
#
# SPEC SILENCE on the CODE, adjudicated as AMB-54(a) (fixed_handling): the
# released 400 trigger assigns only the OTHER half of the mismatch family —
# "the modification type does not match the operation - i.e. first version of a
# MODIFICATION" — and no released sentence covers a creation that names a
# predecessor. The register's fixed handling places it in the overview's 422
# row (`Requests_and_responses.md` §HTTP status codes, verbatim: "The request
# was well-formed but was unable to be followed due to semantic errors"): the
# envelope parses, and what cannot be followed is its change-control meaning.
#
# One behaviour per case: the payload and the preceding uid are both genuine —
# the sole defect is the change_type paired with them.
id: I_EHR_CONTRIBUTION.commit_contribution-creation_with_preceding_version
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-54]
test_purpose: >-
  A CONTRIBUTION member carrying change_type 249|creation| together with a
  preceding_version_uid is rejected as semantically unfollowable, and nothing
  is committed.
description: "Commit CONTRIBUTION with a creation member naming a preceding version"
spec_refs:
  - "RM common §change_control (master06 §Contributions — the change-kind law; 249|creation| creates a new Item)"
  - "RM common §version (Preceding_version_uid_validity)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1                              # a real version to point at
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { existing_version_uid: created.first_version_uid }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: creation          # a creation cannot have a predecessor
          preceding_version_uid: "${existing_version_uid}"
    expect: validation_failed
postconditions:
  - assert: state
    text: >-
      The rejected commit added no version: the EHR still holds only the
      COMPOSITION version step 1 created
  - { assert: version, count: 1 }
