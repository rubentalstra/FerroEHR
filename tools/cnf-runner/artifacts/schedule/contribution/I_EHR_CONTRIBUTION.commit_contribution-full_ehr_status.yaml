# D.2 — as D.1 but with the full EHR_STATUS (all optional information set,
# incl. subject.external_ref). REALIZATION NOTE (official-precondition
# divergence, stated openly): the official D.2 precondition 2 reads "The EHR
# contains a full EHR_STATUS (all the optional information is set, i.e.
# subject.external_ref etc)" — an EHR whose EXISTING status is already full.
# The provisioning vocabulary (requires.ehr: none | { commits: none|any })
# can only mint an EHR with the DEFAULT status, so this case realizes the
# full-status axis on the COMMITTED PAYLOAD instead: the tested modification
# itself carries the full EHR_STATUS (the D.2 title "Commit CONTRIBUTION
# containing full EHR_STATUS" and its flow "Invoke commit ... with the valid
# data sets" are satisfied; the starting-state-full reading of precondition 2
# is NOT established). The official flow step 3 uid half is realized via
# get_contribution; the count half is unwired (AMB-22), as in D.1.
# NOTE: the modification member names the EHR's current status VERSION in the
# member body (SM update_version.adoc: UPDATE_VERSION.preceding_version_uid;
# OAS UpdateVersion.preceding_version_uid), captured via get_ehr_status.
id: I_EHR_CONTRIBUTION.commit_contribution-full_ehr_status
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION that modifies the EHR_STATUS with a full, valid
  EHR_STATUS (subject.external_ref set) succeeds and creates a new EHR_STATUS
  VERSION. Realization: the full status is the committed payload — the
  official D.2 precondition of a pre-existing full EHR_STATUS is not
  establishable via the provisioning vocabulary (the EHR starts with the
  default status).
description: "Commit CONTRIBUTION containing full EHR_STATUS"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-full_ehr_status"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR with the DEFAULT status; the full status is the committed payload (see the realization note above)
data_sets: [cnf.ehr_status.with_subject.alt]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.ehr_status.with_subject.alt}"
          change_type: modification
          preceding_version_uid: "${status_version_uid}"   # RM common §change_control: a modification member names its preceding version
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      version_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: MODIFY }
  - step: 3
    call: get_contribution                 # official step 3, uid half: "Verify expected CONTRIBUTION uids"
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
postconditions:
  - { assert: version, count: 2 }        # default EHR_STATUS + the modification
  - assert: state
    text: >-
      The CONTRIBUTION count for the EHR is 2 (the EHR-creation CONTRIBUTION +
      this commit) — unverifiable on ITS-REST 1.1.0: no list_contributions
      wire (AMB-22) and no contribution_count wire exists.
    verified_by: I_EHR_CONTRIBUTION.list_contributions-post_commit
ambiguities: [AMB-22]
