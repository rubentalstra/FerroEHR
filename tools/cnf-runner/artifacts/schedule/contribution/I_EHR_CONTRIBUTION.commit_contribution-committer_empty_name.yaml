# PARTY_IDENTIFIED.Name_valid on the COMMIT AUDIT's committer — the invariant
# its sibling Basic_validity case cannot reach.
#
# THE INVARIANT, verbatim (RM common
# UML/classes/org.openehr.rm.common.party_identified.adoc §Invariants):
# "__Name_valid__: `name /= Void implies not name.is_empty`". This payload
# SATISFIES `Basic_validity` — `name` is present, so the "at least one of
# name, identifier or external_ref" test passes — and fails only on emptiness.
# ABSENCE AND EMPTINESS ARE DIFFERENT STATES: `name` is `0..1 String` (§
# Attributes: "Optional human-readable name (in String form)"), so omitting it
# is legal whenever another identifying attribute is present, while an empty
# string is a party that claims a name and supplies none. A server that treated
# `""` as "no name" would pass this case only by ALSO failing Basic_validity
# for the wrong reason, which the sibling case pins separately — the two cases
# together fix which invariant fired.
#
# WHY THE COMMITTER SEAT: `AUDIT_DETAILS.committer` is a `PARTY_PROXY` at
# `1..1` (RM common UML/classes/org.openehr.rm.common.audit_details.adoc
# §Attributes) and the ITS-REST commit DTO types it the same way
# (specifications/schemas/common/UpdateAudit.yaml: `committer: PartyProxy`,
# `required`). The audit object sits beside the committed content, so a server
# whose invariant pass only descends the composition writes the empty-named
# committer through, permanently.
#
# THE ACCEPTING TWIN is every other contribution case in this directory (the
# runner's default `PARTY_IDENTIFIED` committer carries a non-empty `name`).
#
# THE STATUS is the docs text's 422 row (ITS-REST overview
# Requests_and_responses.md §HTTP status codes, verbatim: "The request was
# well-formed but was unable to be followed due to semantic errors").
id: I_EHR_CONTRIBUTION.commit_contribution-committer_empty_name
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION whose commit_audit committer is a PARTY_IDENTIFIED with an
  empty name is rejected, and nothing is committed.
description: "Commit CONTRIBUTION with an empty-named PARTY_IDENTIFIED committer"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §PARTY_IDENTIFIED (Name_valid: name /= Void implies not name.is_empty)"
  - "RM common §AUDIT_DETAILS (committer: PARTY_PROXY, 1..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (422)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets:
  - cnf.composition.minimal_event.v1
  - cnf.audit.committer_empty_name
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: creation
          commit_audit: "${ds:cnf.audit.committer_empty_name}"
    expect: validation_failed
postconditions:
  # The change set was refused whole: no version and no audit were written.
  - { assert: version, count: 0 }
