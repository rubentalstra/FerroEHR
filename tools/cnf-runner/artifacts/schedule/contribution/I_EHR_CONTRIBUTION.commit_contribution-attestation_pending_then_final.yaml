# The TWO-OBJECT attestation pattern, on the wire.
#
# RM common master04-generic_package.adoc §Attestation states it as a single
# sequence, verbatim: "the `_is_pending_` flag will be set to True to indicate
# that the committed information needs to be signed by another person. When
# signing occurs, it will cause a new `ATTESTATION` object to be added to the
# `VERSION._attestations_` list, this time with `_is_pending_` set to False,
# and the appropriate proof supplied. Thus, the common situation in which
# content is committed to the record and needs later review and signing by a
# senior person will cause the creation of **two** `ATTESTATION` objects."
#
# So the fact under test is RETENTION: the pending object is not replaced,
# amended or superseded by the completed one — both stay in the list, in
# committal order, because each "records the witnessing of exactly the content
# displayed at the time of witnessing" (master04 §Attestation) and an
# `ORIGINAL_VERSION` is indelible (master06 §Contributions: a versioned
# repository "is by definition indelible").
#
# Both members are `666|attestation|`, so neither commits a version (the
# sibling attestation_only case carries that ground and its member shape); this
# case adds only the second attestation and the retention assertions. The
# revision history is re-read for the same reason it is read there: it is the
# machine proof that TWO attestation commits still leave ONE version.
#
# The pending attestation carries no `proof` — `ATTESTATION.proof` is 0..1 (RM
# common UML/classes/org.openehr.rm.common.attestation.adoc §Attributes) and
# the signing that produces it has not happened yet; the completed one carries
# it, which is what "the appropriate proof supplied" asserts.
id: I_EHR_CONTRIBUTION.commit_contribution-attestation_pending_then_final
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning, CompositionOps]
profiles: [CORE]
test_purpose: >-
  A pending attestation (is_pending true) followed by a completed one
  (is_pending false, with proof) on the same COMPOSITION version leaves BOTH
  ATTESTATION objects on that version, in committal order, and still one
  version.
description: "Commit CONTRIBUTION attesting pending then final on one version"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §generic (master04 §Attestation — the pending-then-signed two-object pattern)"
  - "RM common §attestation (ATTESTATION.is_pending / proof / items; Items_valid)"
  - "RM common §change_control (master06 §Contributions — an indelible repository; attestations add no Version)"
  - "TERM SupportTerminology §attestation reason (648 witnessed, 240 signed)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets:
  - cnf.composition.minimal_event.v1
  - cnf.attestation.pending
  - cnf.attestation.signed
flow:
  - step: 1                              # the content that needs signing
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2                              # "marked for review": is_pending true
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation
          preceding_version_uid: "${v1_uid}"
          attestation: "${ds:cnf.attestation.pending}"
    expect: created
    assert:
      - { assert: field, path: "versions[0]/id/value", equals: "${v1_uid}" }
  - step: 3                              # "when signing occurs": is_pending false + proof
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation
          preceding_version_uid: "${v1_uid}"
          attestation: "${ds:cnf.attestation.signed}"
    expect: created
    assert:
      - { assert: field, path: "versions[0]/id/value", equals: "${v1_uid}" }
  - step: 4                              # BOTH objects survive, in committal order
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "attestations[0]/is_pending", equals: true }
      - { assert: field, path: "attestations[0]/reason/defining_code/code_string", equals: "648" }
      - { assert: field, path: "attestations[0]/proof", absent: true }   # not signed yet (proof 0..1)
      - { assert: field, path: "attestations[1]/is_pending", equals: false }
      - { assert: field, path: "attestations[1]/reason/defining_code/code_string", equals: "240" }
      - { assert: field, path: "attestations[1]/proof", exists: true }   # "the appropriate proof supplied"
      # Items_valid on the accepting side: a present items list is non-empty
      - { assert: field, path: "attestations[1]/items[0]/value", exists: true }
      - { assert: field, path: "attestations[2]", absent: true }         # exactly two
  - step: 5                              # two attestation commits, still one version
    call: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "items[0]/version_id/value", equals: "${v1_uid}" }
      - { assert: field, path: "items[1]", absent: true }
      - { assert: field, path: "items[0]/audits[1]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "items[0]/audits[2]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "items[0]/audits[3]", absent: true }
postconditions:
  - assert: state
    text: >-
      The version carries both ATTESTATION objects — the pending one is
      retained, not superseded by the completed one.
  - { assert: version, count: 1 }
