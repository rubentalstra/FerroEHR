# C.1 — commit a CONTRIBUTION carrying one valid VERSION<COMPOSITION>, over the
# official B.2 valid COMPOSITION data-set rows (minimal event, maximal, time
# series, alternative types, DV_CODED_TEXT on a DV_TEXT node, null_flavour).
# Each commit is accepted; the created VERSION id matches change_type =
# creation (version number 1 — the uid_pattern's trailing ::1 encodes the
# official cell; the object-id and creating-system segments are server-minted,
# so the pattern's <uuid>/<system> segments are placeholders, not captures).
id: I_EHR_CONTRIBUTION.commit_contribution-valid_composition
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION containing a single valid VERSION<COMPOSITION>
  succeeds and returns the CONTRIBUTION with the created VERSION id (version
  number 1).
description: "Successfully commit CONTRIBUTION of COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-valid_composition"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates:
    - cnf.opt.minimal_event
    - cnf.opt.maximal
    - cnf.opt.time_series.v2       # fresh-id copy; the canonical time_series.en.v1 is owned by the master04 upload_opt DEFINITION exemplar
    - cnf.opt.alternative_types
    - cnf.opt.obs_admin.v2         # fresh-id copy; the canonical obs_admin.en.v1 is owned by the master04 validate_opt DEFINITION exemplar
  ehr: { commits: none }                 # mints ${ehr_id}
parameters:
  iteration: reset_per_row
  fixture_set:                           # the official B.2 valid COMPOSITION data-set rows
    - { data_set: cnf.composition.minimal_event.v1, expected: created, defect: "minimal event COMPOSITION" }
    - { data_set: cnf.composition.maximal, expected: created, defect: "maximal COMPOSITION" }
    - { data_set: cnf.composition.time_series, expected: created, defect: "time-series COMPOSITION (B.2.d: observation with many events)" }
    - { data_set: cnf.composition.alternative_types, expected: created, defect: "COMPOSITION with alternative types (B.2.e)" }
    - { data_set: cnf.composition.coded_text_on_text, expected: created, defect: "DV_CODED_TEXT instance on a node declared DV_TEXT in the OPT (B.2.f)" }
    - { data_set: cnf.composition.null_flavour, expected: created, defect: "empty ELEMENT.value with non-empty ELEMENT.null_flavour (B.2.g)" }
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:fixture}", change_type: creation }
    expect: "${fixture.expected}"
    capture:
      contribution_uid: created.contribution_uid
      version_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: CREATE, uid_pattern: "<uuid>::<system>::1" }
postconditions:
  - assert: state
    text: >-
      The EHR has a new CONTRIBUTION and the created VERSION id(s) are correct
      (version number 1 for a creation) and can be used to retrieve a
      VERSION<COMPOSITION>.
    verified_by: I_EHR_CONTRIBUTION.get_contribution-existing
