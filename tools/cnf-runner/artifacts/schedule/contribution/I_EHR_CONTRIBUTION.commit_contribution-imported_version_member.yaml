# The commit wire declares NO import shape, so a member carrying the identity
# of a version this repository did not create is refused.
#
# RM common master06-change_control_package.adoc §Copying puts the import
# behind its own container operation: "An IMPORTED_VERSION instance is then
# created, its item set to the received ORIGINAL_VERSION, and it is committed
# in the normal way (i.e. as part of a Contribution)", realized by
# VERSIONED_OBJECT.commit_imported_version whose description is "Details of
# version id etc come from the ORIGINAL_VERSION"
# (UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions). The
# released WRITE wire has no shape for it: ITS-REST
# `schemas/ehr/UpdateVersion.yaml` declares exactly six properties
# (preceding_version_uid, signature, lifecycle_state, attestations, data,
# commit_audit) and `schemas/ehr/NewContribution.yaml` types `versions` items
# as `UpdateVersion` with no `oneOf` and no `_type` discriminator — so no
# member can name its own `uid`, and none can carry the `item` an
# IMPORTED_VERSION wraps. `schemas/ehr/ImportedVersion.yaml` is referenced only
# from the READ unions.
#
# Registered as AMB-89 — the same absence AMB-196 records for merge provenance,
# one property over. Accepting these keys would commit a DECLARED FOREIGN
# version as a locally created ORIGINAL_VERSION under a freshly minted local
# uid, silently discarding the identity and provenance the client declared.
# The distributed-import capability is realized by the EHR-Extract import
# route, which carries a foreign ORIGINAL_VERSION verbatim.
#
# The accepting twin is step 4: the identical member without those keys, whose
# served version is an ORIGINAL_VERSION wrapping nothing.
#
# The third refused key — a member `_type` naming a class other than
# UPDATE_VERSION / ORIGINAL_VERSION — is the sibling case
# -imported_version_type, which posts `_type: IMPORTED_VERSION` through the
# member-level `_type` override and keeps its accepting twin
# (`_type: UPDATE_VERSION`) beside it. A legal self-tag
# (`_type: ORIGINAL_VERSION`) is what every other case in this family already
# sends, so its acceptance is covered throughout.
#
# THAT SELF-TAG AND THE `uid` REFUSAL ARE NOT IN TENSION — steps 3 and 5 pin
# both halves. The two admitted tags name ONE wire shape, the six-property
# commit-wire partial `schemas/ehr/UpdateVersion.yaml` declares, so tagging a
# member ORIGINAL_VERSION names the class it BECOMES (the `_type` rule is about
# the RM type "whenever polymorphism is involved", overview Resources.md
# §Resource representation), not a complete RM instance the request may supply.
# `ORIGINAL_VERSION.uid` is 1..1
# (UML/classes/org.openehr.rm.common.original_version.adoc §Attributes) and is
# satisfied by the repository's allocation, visible on the READ (step 5) — the
# only moment at which a version identity exists.
id: I_EHR_CONTRIBUTION.commit_contribution-imported_version_member
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-89]
test_purpose: >-
  A CONTRIBUTION member declaring a foreign version identity — the `item` an
  IMPORTED_VERSION wraps, or its own `uid` — is refused, while the same member
  without them commits as a locally created ORIGINAL_VERSION wrapping nothing.
description: "Commit CONTRIBUTION whose member declares a foreign version identity"
spec_refs:
  - "RM common §change_control (master06 §Copying; IMPORTED_VERSION wraps the received ORIGINAL_VERSION)"
  - "RM common UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions (commit_imported_version)"
  - "RM common UML/classes/org.openehr.rm.common.imported_version.adoc (item is its sole own attribute)"
  - "ITS-REST OAS schemas/ehr/UpdateVersion.yaml + schemas/ehr/NewContribution.yaml (no import shape; no uid, no item)"
  - "ITS-REST OAS responses/400_CONTRIBUTION.yaml"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { v1_uid: created.first_version_uid }
  - step: 2                              # the wrapped foreign ORIGINAL_VERSION
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${v1_uid}" }
            item:
              _type: ORIGINAL_VERSION
              uid:
                _type: OBJECT_VERSION_ID
                value: "8849182c-82ad-4088-a07f-48ead4180515::sysA.example.org::3"
              data: "${ds:cnf.composition.minimal_event.v2}"
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "complete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.composition.minimal_event.v2}"
    expect: bad_request
  - step: 3                              # the member naming its own version id
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${v1_uid}" }
            uid:
              _type: OBJECT_VERSION_ID
              value: "8849182c-82ad-4088-a07f-48ead4180515::sysA.example.org::3"
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "complete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.composition.minimal_event.v2}"
    expect: bad_request
  - step: 4                              # the accepting twin: neither key
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          preceding_version_uid: "${v1_uid}"
    expect: created
    capture:
      v2_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 5                              # a locally committed version wraps nothing
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "item", absent: true }
      # ORIGINAL_VERSION.uid is 1..1
      # (UML/classes/org.openehr.rm.common.original_version.adoc §Attributes),
      # and THIS is where it is satisfied: the member is the commit-wire
      # partial, so the mandatory identifier is the one the repository
      # allocated — the same value its own ETag named — never one the request
      # carried (step 3).
      - { assert: field, path: "uid/value", equals: "${v2_uid}" }
postconditions:
  - { assert: version, count: 2 }
