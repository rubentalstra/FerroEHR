# A `666|attestation|` CONTRIBUTION attaching an ATTESTATION to an EXISTING
# COMPOSITION version. This is the one change kind that commits NO new version.
#
# RM common master06-change_control_package.adoc §Contributions, verbatim:
# "all logical changes including deletions, additions, modifications …,
# importing and attestations of existing items, are achieved by physically
# committing new Versions, **or for attestations, new Attestation objects to
# existing Versions**", and the change-kind row: "attestation of item: a new
# `ATTESTATION` is added to the attestations list of an existing
# `ORIGINAL_VERSION`; the `ATTESTATION._commit_audit_._change_type_` is set to
# the code `666|attestation|`". §Attestation adds the timing rule the flow
# relies on: "Attestations can be added at any time after committal of the
# content being attested."
#
# THE MEMBER SHAPE follows from that: an attestation member carries no `data`
# (nothing is created) and no version `lifecycle_state` (no version comes into
# being); it names its target with `preceding_version_uid` and its
# `commit_audit` IS the UPDATE_ATTESTATION (ITS-REST
# specifications/schemas/common/UpdateAttestation.yaml — UPDATE_AUDIT plus the
# required `reason` and `is_pending`). This is the same data-less-member ground
# the sibling delete case rests on: the released
# specifications/schemas/ehr/UpdateVersion.yaml lists `data` under `required`,
# but the RM — which the docs text points at for the native committal
# (overview Requests_and_responses.md §openehr-version and
# openehr-audit-details: "The 'native' way of committing is to use a
# CONTRIBUTION and wrap the content as a VERSION") — defines change kinds that
# have no content to carry, and the docs text wins every conflict.
#
# THE AGGREGATE is fixed by the same section: "`666|attestation|`: used when the
# only changes are attestation of one or more of the member versions."
#
# WHAT IS ASSERTED, and why each is a wire fact and not a state guess:
#  - the 201 CONTRIBUTION lists the ATTESTED (pre-existing) version, not a new
#    one, and reports the 666 aggregate;
#  - the REVISION_HISTORY still holds exactly ONE item — the machine proof that
#    no version was created — whose `audits` now carry the commit audit AND the
#    attestation (RM common
#    UML/classes/org.openehr.rm.common.revision_history_item.adoc §Attributes:
#    `audits` is "The audits for this version … there may also be further
#    attestations");
#  - the ORIGINAL_VERSION envelope serves the completed ATTESTATION in its
#    `attestations` list, with the server-owned AUDIT_DETAILS parts filled in
#    (overview Requests_and_responses.md §openehr-version and
#    openehr-audit-details: "The `time_committed` attribute is always set by the
#    server"; "when `system_id` is not provided by the client, the server MUST
#    set it to its own configured system identifier").
id: I_EHR_CONTRIBUTION.commit_contribution-attestation_only
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning, CompositionOps]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION whose only member is a 666|attestation| of an existing
  COMPOSITION version is accepted, creates no new version, and the attestation
  becomes visible on that version.
description: "Commit CONTRIBUTION attesting an existing COMPOSITION version"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §change_control (master06 §Contributions — attestations commit Attestation objects to existing Versions, never a new Version; the 666|attestation| aggregate)"
  - "RM common §generic (master04 §Attestation — attestations can be added at any time after committal)"
  - "RM common §attestation (ATTESTATION.reason / is_pending; Reason_valid)"
  - "RM common §revision_history_item (audits — further attestations)"
  - "TERM SupportTerminology §attestation reason (648 witnessed)"
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.attestation.witnessed]
flow:
  - step: 1                              # the content to attest
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
    assert:
      - { assert: version, of: "${v1_uid}", change_type: CREATE }
  - step: 2                              # the attestation-only change set
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation       # no data, no lifecycle_state — no new version
          preceding_version_uid: "${v1_uid}"
          attestation: "${ds:cnf.attestation.witnessed}"
    expect: created
    assert:
      # the change set lists the version it attested, NOT a new one
      - { assert: field, path: "versions[0]/id/value", equals: "${v1_uid}" }
      - { assert: field, path: "versions[1]", absent: true }
      # "666|attestation|: used when the only changes are attestation of one or
      # more of the member versions"
      - { assert: field, path: "audit/change_type/defining_code/code_string", equals: "666" }
  - step: 3                              # the machine proof that no version was created
    call: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: REVISION_HISTORY }
      - { assert: field, path: "items[0]/version_id/value", equals: "${v1_uid}" }
      - { assert: field, path: "items[1]", absent: true }     # still ONE version
      # the commit audit, then the attestation (revision_history_item §audits)
      - { assert: field, path: "items[0]/audits[0]/_type", equals: "AUDIT_DETAILS" }
      - { assert: field, path: "items[0]/audits[1]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "items[0]/audits[2]", absent: true }
  - step: 4                              # the attestation on the version it attests
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version                     # -> the ORIGINAL_VERSION envelope
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "uid/value", equals: "${v1_uid}" }
      - { assert: field, path: "attestations[0]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "attestations[0]/change_type/defining_code/code_string", equals: "666" }
      - { assert: field, path: "attestations[0]/reason/defining_code/code_string", equals: "648" }
      - { assert: field, path: "attestations[0]/is_pending", equals: false }
      - { assert: field, path: "attestations[1]", absent: true }
      # the inherited AUDIT_DETAILS parts the server owns
      - { assert: field, path: "attestations[0]/time_committed/value", exists: true }
      - { assert: field, path: "attestations[0]/system_id", exists: true }
postconditions:
  - assert: state
    text: >-
      The attestation added no version: the VERSIONED_COMPOSITION still holds
      the single version step 1 committed, now carrying one ATTESTATION.
  - { assert: version, count: 1 }
