# F.2 — list CONTRIBUTIONs of an existing EHR with no CONTRIBUTIONs: the result
# is an empty list.
# ITS-REST 1.1.0 surfaces no list_contributions wire (unrealized binding,
# AMB-22) — not-applicable with citation on this ITS.
id: I_EHR_CONTRIBUTION.list_contributions-empty
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.list_contributions
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Listing CONTRIBUTIONs of an EHR with no CONTRIBUTIONs returns an empty list.
description: "List CONTRIBUTIONs of existing EHR with no CONTRIBUTIONs"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.list_contributions"
  - "CNF platform_test_schedule master08 §list_contributions-empty"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR with no CONTRIBUTIONs; mints ${ehr_id}
flow:
  - step: 1
    call: list_contributions
    with: { ehr_id: "${ehr_id}" }
    expect: ok                            # a positive, empty list
