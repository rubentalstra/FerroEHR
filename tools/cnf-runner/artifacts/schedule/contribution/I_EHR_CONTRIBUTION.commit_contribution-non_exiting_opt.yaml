# C.10 — commit a COMPOSITION that references an OPT not loaded on the server:
# rejected with an error about the missing OPT; nothing is created.
# NOTE: the commit_contribution binding maps template_not_found to 422
# (ITS-REST overview §HTTP status codes — 422 = semantic errors; 422.yaml names
# "the underlying template is not known" verbatim); the kind is distinguished by
# the fixture (cnf.composition.unknown_template references the reserved-absent id
# cnf.absent_template.v99).
id: I_EHR_CONTRIBUTION.commit_contribution-non_exiting_opt
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION whose COMPOSITION references an OPT not loaded on the
  server is rejected; no VERSION is created.
description: "Commit CONTRIBUTION with COMPOSITION referencing a non existing OPT"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-non_exiting_opt"
applies: { rm: ">=1.0.2" }
requires:
  server: any                            # "There are no OPTs loaded on the server" (no templates provisioned)
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.unknown_template]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.unknown_template}", change_type: creation }
    expect: template_not_found             # missing-OPT reject (ITS-REST overview §HTTP status codes — 422 = semantic errors; 422.yaml: "the underlying template is not known")
postconditions:
  - { assert: version, count: 0 }
