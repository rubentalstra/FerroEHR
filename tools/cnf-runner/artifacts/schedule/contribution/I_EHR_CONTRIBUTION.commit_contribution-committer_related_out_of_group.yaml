# PARTY_RELATED.Relationship_valid on the COMMIT AUDIT's committer.
#
# THE INVARIANT, verbatim (RM common
# UML/classes/org.openehr.rm.common.party_related.adoc §Invariants):
# "__Relationship_valid__: `terminology (Terminology_id_openehr).
# has_code_for_group_id (Group_id_subject_relationship,
# relationship.defining_code)`". It is unconditional — `relationship` is
# declared `DV_CODED_TEXT` at `1..1` — so every PARTY_RELATED on the wire is
# bound to the openEHR `subject relationship` group (TERM SupportTerminology
# §Vocabularies), regardless of the seat it occupies.
#
# WHY THE COMMITTER SEAT: `AUDIT_DETAILS.committer` is a `PARTY_PROXY` at
# `1..1` (RM common UML/classes/org.openehr.rm.common.audit_details.adoc
# §Attributes) and PARTY_RELATED is one of its subtypes (…party_related.adoc
# §Inherit: PARTY_IDENTIFIED, itself a PARTY_PROXY); the released commit DTO
# admits it explicitly (ITS-REST specifications/schemas/common/UpdateAudit.yaml
# `committer: PartyProxy`, whose `PartyProxy` discriminator maps
# `PARTY_RELATED`). The audit object sits BESIDE the committed content, so a
# server whose invariant walk descends only the composition stores an
# out-of-group relationship on the audit — permanently, since audits are never
# rewritten. The sibling composition case
# (create_composition-performer_relationship_invalid) pins the same invariant
# on a party inside CONTENT; this one pins the audit seat, and a server can
# fail either alone.
#
# THE FIXTURE'S code is `240`, a REAL openEHR code — of the ATTESTATION REASON
# group — so a server that only checked that the code exists accepts it. Its
# ACCEPTING TWIN is commit_contribution-committer_related, the same
# PARTY_RELATED committer with the in-group `10|mother|`, so nothing but the
# code string separates the two and this case cannot be passed by a server
# that refuses PARTY_RELATED committers wholesale.
#
# THE STATUS is the docs text's 422 row (ITS-REST overview
# Requests_and_responses.md §HTTP status codes, verbatim: "The request was
# well-formed but was unable to be followed due to semantic errors").
id: I_EHR_CONTRIBUTION.commit_contribution-committer_related_out_of_group
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION whose commit_audit committer is a PARTY_RELATED carrying a
  relationship code outside the openEHR subject relationship group is
  rejected, and nothing is committed.
description: "Commit CONTRIBUTION with an out-of-group PARTY_RELATED committer"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §PARTY_RELATED (Relationship_valid — has_code_for_group_id (Group_id_subject_relationship, relationship.defining_code))"
  - "RM common §AUDIT_DETAILS (committer: PARTY_PROXY, 1..1)"
  - "TERM SupportTerminology §Vocabularies (subject relationship)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (422)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets:
  - cnf.composition.minimal_event.v1
  - cnf.audit.committer_related_out_of_group
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: creation
          commit_audit: "${ds:cnf.audit.committer_related_out_of_group}"
    expect: validation_failed
postconditions:
  # The change set was refused whole: no version and no audit were written.
  - { assert: version, count: 0 }
