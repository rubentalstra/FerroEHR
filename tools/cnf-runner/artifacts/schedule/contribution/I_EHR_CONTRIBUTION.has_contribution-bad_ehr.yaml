# G.3 — has_contribution on a non-existent EHR errors on the missing EHR —
# realized as a 404 (not_found). Fixed arbitrary UUID literals absent on an empty
# server.
id: I_EHR_CONTRIBUTION.has_contribution-bad_ehr
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.has_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  has_contribution on a random ehr_id when no EHRs exist is rejected as not
  found (the EHR does not exist).
description: "Test presence of CONTRIBUTIONs on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.has_contribution"
  - "CNF platform_test_schedule master08 §has_contribution-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "There are no EHRs on the server"
flow:
  - step: 1
    call: has_contribution
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      contribution_uid: "22222222-2222-4222-8222-222222222222"
    expect: not_found                     # "the EHR with ehr_id doesn't exist"
