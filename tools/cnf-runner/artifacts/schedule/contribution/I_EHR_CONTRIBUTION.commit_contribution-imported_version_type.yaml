# The THIRD AMB-89 refusal branch: a CONTRIBUTION member self-tagging as a
# class this wire does not commit.
#
# `_type` is legitimate on a member. ITS-REST `specifications/docs/overview/
# Resources.md` §Resource representation makes it a general metadata attribute
# — "the `_type` attribute, which should be used to specify the RM type
# whenever polymorphism is involved … The value of this attribute MUST be the
# uppercase class name from the RM specification" — and the docs text outranks
# the OAS, so a member MAY announce its class. What it may announce is bounded
# by what the wire commits: `schemas/ehr/NewContribution.yaml` types `versions`
# items as `UpdateVersion` with no `oneOf` and no discriminator, and
# `schemas/ehr/UpdateVersion.yaml` declares six properties and no `item`, so
# the only classes in play are the one that schema titles (UPDATE_VERSION) and
# the RM class such a member becomes when committed (ORIGINAL_VERSION).
#
# `IMPORTED_VERSION` is neither. RM common master06-change_control_package.adoc
# §Copying puts the import behind its own container operation —
# `VERSIONED_OBJECT.commit_imported_version`, "Details of version id etc come
# from the ORIGINAL_VERSION" — and the release gives that operation no wire
# shape at all (register AMB-89). A member declaring it is asking for a commit
# whose defining attribute (`item`, the wrapped foreign version) the wire
# cannot even carry; accepting it would silently commit a DECLARED FOREIGN
# version as a locally created ORIGINAL_VERSION under a freshly minted local
# uid. Refused as the shape failure it is (`400_CONTRIBUTION`: "syntactically
# invalid header, parameter or content").
#
# The accepting twin is step 3: the same member self-tagging as UPDATE_VERSION,
# the class the released member schema titles, which commits normally — so this
# case pins the boundary in both directions rather than only the refusal. (The
# sibling -imported_version_member owns the `item` and `uid` branches; the
# distributed-import capability itself is realized by the EHR-Extract import
# route, whose landed IMPORTED_VERSIONs the released reads serve —
# I_EHR_COMPOSITION.get_versioned_composition-imported_version.)
id: I_EHR_CONTRIBUTION.commit_contribution-imported_version_type
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-89]
test_purpose: >-
  A CONTRIBUTION member self-tagging as IMPORTED_VERSION — a class the commit
  wire declares no shape for — is refused, while the same member self-tagging
  as UPDATE_VERSION commits.
description: "Commit CONTRIBUTION whose member self-tags as a class the wire does not commit"
spec_refs:
  - "ITS-REST overview Resources §Resource representation (the _type attribute; the uppercase RM class name)"
  - "RM common §change_control (master06 §Copying; commit_imported_version has no released wire)"
  - "RM common UML/classes/org.openehr.rm.common.imported_version.adoc (item is its sole own attribute)"
  - "ITS-REST OAS schemas/ehr/UpdateVersion.yaml + schemas/ehr/NewContribution.yaml (UpdateVersion is the only member schema)"
  - "ITS-REST OAS responses/400_CONTRIBUTION.yaml"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { v1_uid: created.first_version_uid }
  - step: 2                              # the class the wire commits no shape for
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          preceding_version_uid: "${v1_uid}"
          _type: IMPORTED_VERSION
    expect: bad_request
  - step: 3                              # the accepting twin: the member schema's own class
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          preceding_version_uid: "${v1_uid}"
          _type: UPDATE_VERSION
    expect: created
    capture:
      v2_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 4                              # what it became: a locally created version
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "item", absent: true }
postconditions:
  - { assert: version, count: 2 }
