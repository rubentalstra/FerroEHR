# The canonical-XML branch of the has_contribution existence probe. ITS-REST
# surfaces no dedicated CONTRIBUTION-existence probe, so the SM Boolean is
# realized as the CONTRIBUTION GET (200 = TRUE) — the realization the
# variant-less binding records; this row asks that question with
# `Accept: application/xml`.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to specify
# the expected XML response format. If the service cannot fulfill this aspect of
# the request, it MUST respond with HTTP status code `406 Not Acceptable`.
# Proper header `Content-Type: application/xml` MUST be present in the response
# of the service unless the response has no content body (HTTP status code
# `204`)." The existence answer is the STATUS, so a conformant service must not
# turn an XML `Accept` into a different existence verdict: 200 still means TRUE.
# The binding's `Content-Type: negotiated` matcher executes the media-type MUST.
#
# BODY FLOOR — as on the sibling get_contribution-xml row: the published ITS-XML
# schema defines the CONTRIBUTION complexType (RM Common.xsd) but declares no
# global element for it, so the release assigns no document ROOT NAME and the
# row asserts only that the payload is an XML document entity (RFC 7303 §3,
# "application/xml").
#
# §"Data representation" leaves XML support to the service, hence the
# `canonical-xml` format axis.
id: I_EHR_CONTRIBUTION.has_contribution-xml
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.has_contribution
capabilities: [ChangeSets]
profiles: [CORE]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
test_purpose: >-
  has_contribution for an existing CONTRIBUTION uid still reports the
  CONTRIBUTION exists when the probe is made with `Accept: application/xml`,
  answering in canonical XML.
description: "Has existing CONTRIBUTION, probed as canonical XML"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.has_contribution"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "RM common §CONTRIBUTION"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution          # precondition: a CONTRIBUTION of known uid
    format: canonical-json             # the commit envelope stays JSON — see the commit_contribution
                                       # canonical-xml adjudication in vocab/wire_surface.yaml
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: has_contribution
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok                          # the existence answer is the status: TRUE
    assert:
      - { assert: returns, matches: '^\s*<' }
