# The CONTRIBUTION envelope's OPTIONAL client-supplied `uid`, both halves of
# the one released sentence that governs it (ITS-REST
# specifications/operations/contribution_create.yaml, the relaxed-envelope
# list): "`uid`: when provided, it will be accepted in case is not in-use,
# otherwise error will be returned".
#
# The ACCEPT half is step 1 + step 3: a commit naming a free uid is created
# UNDER THAT UID — proven by reading the contribution back through the
# client-chosen identifier rather than a server-minted one. The REFUSE half is
# step 2: the identical envelope replayed while the uid is in use.
#
# WHICH error the refusal is comes from the overview status table (ITS-REST
# `Requests_and_responses.md` §HTTP status codes, the 409 row verbatim):
# "Indicates that the request could not be processed because it might generate
# a duplicate or a conflict". A second CONTRIBUTION under an identifier already
# in use is precisely the duplicate that row names; no other 4xx row describes
# a colliding identifier.
#
# The envelope is authored INLINE rather than through the runner's bundled
# `versions:` construct because that construct mints the envelope itself and
# has no place for a client uid — the whole point of this case. Every value in
# it is a fixed literal, so two runs of the case send byte-identical bodies.
#
# Step 4 keeps the refusal honest: the EHR still holds exactly the one
# COMPOSITION step 1 committed, so the rejected replay committed nothing (the
# commit is one transaction — RM common master06 §Contributions).
id: I_EHR_CONTRIBUTION.commit_contribution-client_uid_in_use
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION committed with a client-supplied envelope uid that is free is
  accepted under that uid; a second commit naming the same uid is refused as a
  duplicate identifier and commits nothing.
description: "Commit CONTRIBUTION with a client-supplied uid already in use"
spec_refs:
  - "ITS-REST specifications §operations/contribution_create (the relaxed envelope: uid accepted when not in-use, otherwise an error)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §change_control (master06 §Contributions — a CONTRIBUTION is committed as a whole)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                              # the accept half: the uid is free
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      contribution:                      # the whole envelope, verbatim (carries the client uid)
        _type: CONTRIBUTION
        uid: { _type: HIER_OBJECT_ID, value: "7c0f5a52-9b1e-4d0a-8f26-000000000701" }
        versions:
          - _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: complete
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: creation
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.v1}"
        audit:
          _type: AUDIT_DETAILS
          committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
          change_type:
            _type: DV_CODED_TEXT
            value: creation
            defining_code:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
              code_string: "249"
    expect: created
  - step: 2                              # the refuse half: the same uid, now in use
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      contribution:
        _type: CONTRIBUTION
        uid: { _type: HIER_OBJECT_ID, value: "7c0f5a52-9b1e-4d0a-8f26-000000000701" }
        versions:
          - _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: complete
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: creation
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.v1}"
        audit:
          _type: AUDIT_DETAILS
          committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
          change_type:
            _type: DV_CODED_TEXT
            value: creation
            defining_code:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
              code_string: "249"
    expect: conflict
  - step: 3                              # the accepted uid IS the client's, not a server-minted one
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "7c0f5a52-9b1e-4d0a-8f26-000000000701" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      - { assert: field, path: "uid/value", equals: "7c0f5a52-9b1e-4d0a-8f26-000000000701" }
postconditions:
  - assert: state
    text: >-
      The refused replay committed nothing: the EHR holds the single
      COMPOSITION version of the accepted commit (verified by step 3 reading
      the one CONTRIBUTION that owns the uid)
  - { assert: version, count: 1 }
