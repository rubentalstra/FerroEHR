# C.8 — commit a valid COMPOSITION, then a second CONTRIBUTION modifying the
# same COMPOSITION with invalid content: the second commit is rejected and only
# the first VERSION remains.
# NOTE: commit 1 commits one VERSION, so ${v1_uids} is the single precedent uid
# (AMB-3 → If-Match).
id: I_EHR_CONTRIBUTION.commit_contribution-two_commits_second_invalid
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A second CONTRIBUTION modifying an existing COMPOSITION with invalid content is
  rejected; only the first VERSION remains.
description: "Commit two CONTRIBUTIONs on same COMPOSITION with second invalid"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-two_commits_second_invalid"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.invalid_structure]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uids: created.version_uids[]
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.invalid_structure}"
          change_type: modification
          preceding_version_uid: "${v1_uids}"   # ITS-REST: If-Match (AMB-3)
    expect: validation_failed
postconditions:
  - { assert: version, count: 1 }        # only the first VERSION remains
ambiguities: [AMB-3]
