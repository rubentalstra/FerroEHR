# F.5 — list CONTRIBUTIONs after committing a CONTRIBUTION containing a
# VERSION<FOLDER> (directory): the result is a list with one CONTRIBUTION
# containing a FOLDER.
# ITS-REST 1.1.0 surfaces no list_contributions wire (unrealized binding,
# AMB-22) — not-applicable with citation on this ITS.
id: I_EHR_CONTRIBUTION.list_contributions-ehr_containing_directory
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.list_contributions
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Listing CONTRIBUTIONs after a directory commit returns a list with one
  CONTRIBUTION containing a FOLDER.
description: "List CONTRIBUTIONs post commit of CONTRIBUTION containing a directory"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.list_contributions"
  - "CNF platform_test_schedule master08 §list_contributions-ehr_containing_directory"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.folder.minimal          # a CONTRIBUTION with a VERSION<FOLDER>
flow:
  - step: 1
    call: list_contributions
    with: { ehr_id: "${ehr_id}" }
    expect: ok
postconditions:
  - assert: state
    text: "The list has one CONTRIBUTION containing a FOLDER."
    verified_by: I_EHR_CONTRIBUTION.get_contribution-existing
