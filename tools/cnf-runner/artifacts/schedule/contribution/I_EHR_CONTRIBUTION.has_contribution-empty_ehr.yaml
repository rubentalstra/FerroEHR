# G.2 — has_contribution on an EHR with no CONTRIBUTIONs, probing a random
# CONTRIBUTION uid, reports the CONTRIBUTION does not exist (FALSE) — realized as
# a 404 (not_found) of the CONTRIBUTION GET (the registered realization).
# "A random CONTRIBUTION uid" is a fixed arbitrary UUID literal that cannot
# exist on an EHR with no commits.
id: I_EHR_CONTRIBUTION.has_contribution-empty_ehr
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.has_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  has_contribution for a random CONTRIBUTION uid on an EHR without CONTRIBUTIONs
  reports the CONTRIBUTION does not exist.
description: "Test presence of CONTRIBUTIONs on empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.has_contribution"
  - "CNF platform_test_schedule master08 §has_contribution-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # "The EHR doesn't have any CONTRIBUTIONs"; mints ${ehr_id}
flow:
  - step: 1
    call: has_contribution
    with:
      ehr_id: "${ehr_id}"
      contribution_uid: "11111111-1111-4111-8111-111111111111"
    expect: not_found                     # negative: "The result must be FALSE"
