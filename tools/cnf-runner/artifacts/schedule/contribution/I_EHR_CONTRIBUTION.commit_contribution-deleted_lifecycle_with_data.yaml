# The other half of the deletion SHAPE rule, on the LIFECYCLE axis: a member
# that carries data may not claim the `523|deleted|` STATE.
#
# RM common master06-change_control_package.adoc §Logical Deletion states
# deletion as ONE indivisible procedure: "create a new Version in the normal
# way; delete its `_data_` (which will by default be a copy of the data of the
# previous Version); set the `_lifecycle_state_` value to the code for
# `deleted`; commit in the normal way". The state and the data-Void are two
# steps of the same act, so a data-carrying version in the `deleted` state is
# not producible by the spec's own procedure. A server that accepts it answers
# the resource read as deleted while the content stays stored and queryable.
#
# The sibling -deleted_member_with_data pins the CHANGE-TYPE axis of the same
# rule (a 523|deleted| change type carrying data); this case pins the LIFECYCLE
# axis, which a member can reach independently by pairing a content-carrying
# change type (251|modification|) with the deleted lifecycle. The member is a
# pre-built ORIGINAL_VERSION because that pairing is not expressible through
# the generated member form.
#
# The code is the overview's 422 row (`Requests_and_responses.md` §HTTP status
# codes, verbatim: "The request was well-formed but was unable to be followed
# due to semantic errors"): the envelope parses, and what cannot be followed is
# the deletion the lifecycle claims.
id: I_EHR_CONTRIBUTION.commit_contribution-deleted_lifecycle_with_data
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION member whose lifecycle_state is 523|deleted| while it carries
  data is rejected, and the target composition is still live.
description: "Commit CONTRIBUTION whose data-carrying member claims the deleted lifecycle"
spec_refs:
  - "RM common §change_control (master06 §Logical Deletion — delete its data, set lifecycle_state to deleted, one procedure)"
  - "RM common §original_version (data 0..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { v1_uid: created.first_version_uid }
  - step: 2                              # content-carrying change type + deleted lifecycle
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${v1_uid}" }
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "deleted"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "523"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.composition.minimal_event.v2}"
    expect: validation_failed
  - step: 3                              # the composition is still live, not deleted
    call: I_EHR_COMPOSITION.get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${v1_uid}" }
    expect: ok
postconditions:
  - assert: state
    text: >-
      No version was committed from the data-carrying deleted member: the
      composition is still live (verified by step 3)
  - { assert: version, count: 1 }
