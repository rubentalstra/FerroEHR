# A PARTY_RELATED committer is committed and read back whole — the accepting
# twin of commit_contribution-committer_related_out_of_group.
#
# WHY THIS CASE EXISTS: the refusal twin alone would also pass on a server
# that rejected EVERY PARTY_RELATED committer, which would certify
# over-rejection as conformance. `AUDIT_DETAILS.committer` is a `PARTY_PROXY`
# at `1..1` (RM common UML/classes/org.openehr.rm.common.audit_details.adoc
# §Attributes) and PARTY_RELATED is one of its subtypes (RM common
# UML/classes/org.openehr.rm.common.party_related.adoc §Inherit:
# PARTY_IDENTIFIED, itself a PARTY_PROXY) — "Proxy type for identifying a
# party and its relationship to the subject of the record. Use where the
# relationship between the party and the subject of the record must be known"
# — so it is a legal committer, and the released commit DTO says the same
# (ITS-REST specifications/schemas/common/UpdateAudit.yaml `committer:
# PartyProxy`, whose `PartyProxy` discriminator maps `PARTY_RELATED`).
#
# WHAT IS ASSERTED: the committer comes back as the SUBTYPE it was sent as,
# with its `relationship` `DV_CODED_TEXT` intact. `10|mother|` is a member of
# the openEHR `subject relationship` group (TERM SupportTerminology
# §Vocabularies), so `Relationship_valid` holds. A server that widened the
# stored committer to PARTY_IDENTIFIED, or that flattened the coded
# relationship to its display string, still commits successfully — only the
# read-back assertions catch it.
id: I_EHR_CONTRIBUTION.commit_contribution-committer_related
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning, CompositionOps]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION whose commit_audit committer is a PARTY_RELATED with an
  in-group relationship code is accepted, and the committed version reports
  that committer back with its _type and coded relationship intact.
description: "Commit CONTRIBUTION with a PARTY_RELATED committer"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §PARTY_RELATED (relationship: DV_CODED_TEXT, 1..1; Relationship_valid)"
  - "RM common §AUDIT_DETAILS (committer: PARTY_PROXY, 1..1)"
  - "TERM SupportTerminology §Vocabularies (subject relationship)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets:
  - cnf.composition.minimal_event.v1
  - cnf.audit.committer_related
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: creation
          commit_audit: "${ds:cnf.audit.committer_related}"
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2                              # the subtype and its coded relationship survived
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "commit_audit/committer/_type", equals: "PARTY_RELATED" }
      - { assert: field, path: "commit_audit/committer/name", equals: "Alexandra Alamo" }
      - { assert: field, path: "commit_audit/committer/relationship/value", equals: "mother" }
      - { assert: field, path: "commit_audit/committer/relationship/defining_code/code_string", equals: "10" }
      - { assert: field, path: "commit_audit/committer/relationship/defining_code/terminology_id/value", equals: "openehr" }
postconditions:
  - assert: state
    text: >-
      The stored commit audit carries the PARTY_RELATED committer whole — the
      subtype is not widened and the coded relationship is not flattened.
  - { assert: version, count: 1 }
