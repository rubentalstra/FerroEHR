# The CONTRIBUTION an import creates, read through the released contribution
# endpoint.
#
# RM common master06-change_control_package.adoc §Copying commits a received
# version "in the normal way (i.e. as part of a Contribution)", and
# §Contributions defines what that CONTRIBUTION is: "a CONTRIBUTION object will
# be created, listing the affected VERSION objects", with "import of item" one
# of the changes a Contribution records. The wrapper's own contribution is
# therefore a first-class local CONTRIBUTION — distinct from the SOURCE
# contribution the wrapped ORIGINAL_VERSION still names
# (`imported_version.adoc`: "providing imported versions with their own audit
# trail and Contribution, distinct from those of the imported
# ORIGINAL_VERSION") — and it must list the version that landed.
#
# The contribution uid is not knowable in advance (the local commit allocates
# it), so the flow reads it off the version envelope the import produced and
# then addresses the released contribution route with it. Both steps are
# released wire; the import itself stays precondition state.
id: I_EHR_CONTRIBUTION.get_contribution-import_contribution
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
exercises: [Versioning, EhrExtract]
profiles: [CORE]
test_purpose: >-
  The CONTRIBUTION an EHR-Extract import creates is retrievable and lists the
  imported version among the versions it affected.
description: "Get the CONTRIBUTION an EHR-Extract import created"
spec_refs:
  - "RM common §change_control (master06 §Copying — committed in the normal way, as part of a Contribution)"
  - "RM common §change_control (master06 §Contributions — a CONTRIBUTION lists the affected VERSION objects; 'import of item')"
  - "RM common UML/classes/org.openehr.rm.common.imported_version.adoc (the wrapper's own audit trail and Contribution)"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
  import:
    extract: cnf.messaging.ehr_extract.imported_contribution
    container: X_VERSIONED_COMPOSITION
flow:
  - step: 1                              # the local CONTRIBUTION the import created
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${imported_versioned_object_uid}"
      version_uid: "${imported_version_uid}"
    expect: ok
    capture: { contribution_uid: ok.contribution_uid }
    assert:
      # the wrapped original still names the SOURCE contribution, so the
      # capture above is demonstrably not it
      - { assert: field, path: "item/contribution/id/value", equals: "4d81f6a5-7e23-49c0-b18f-05c6d3e94a72" }
  - step: 2
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      # "listing the affected VERSION objects" — the imported version is the one
      - { assert: field, path: "versions[0]/id/value", equals: "${imported_version_uid}" }
      # the local act of committal, not the source's
      - { assert: field, path: "audit/system_id", equals: "${ixit:system_id}" }
