# The official [[one_commit]] single-version matrix, event rows (master08
# §Combinations of data sets): on a first commit (no previous commits) every
# change_type other than creation is rejected ("All change types but creation
# should fail on the first commit, since other change types need a previous
# commit"), and creation with lifecycle_state = deleted is rejected ("the first
# commit can't be change_type = deleted or ... the lifecycle_state ... can't be
# with change_type = deleted"). The two ACCEPTED rows (creation|complete,
# event/persistent) are carried by -valid_composition (C.1) and
# -persistent_composition (C.6) step 1. Each row commits a pre-built
# ORIGINAL_VERSION member (the verbatim member seam) so the change_type ×
# lifecycle_state pair is controlled independently, exactly as the matrix
# columns demand; no preceding_version_uid is sent — this IS the first commit.
# Codes per the openEHR Terminology: audit change type 249|creation|,
# 250|amendment|, 251|modification|, 523|deleted|; version lifecycle state
# 532|complete|, 523|deleted| (RM common master06 §change_control).
id: I_EHR_CONTRIBUTION.commit_contribution-one_commit_invalid_change_types
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  On the first commit into an empty EHR, a single-version CONTRIBUTION whose
  member carries a non-creation change_type, or a deleted lifecycle_state, is
  rejected; nothing is created (the official one_commit matrix, event rows).
description: "One commit, single version: non-creation change types and deleted lifecycle rejected (event)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §Combinations of data sets ([[one_commit]] matrix)"
  - "RM common §change_control (VERSION.commit_audit.change_type; lifecycle_state)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # "no previous commits were done"; mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
parameters:
  iteration: reset_per_row
  matrix:
    columns: [change_code, change_label, life_code, life_label]
    rows:                                  # the official reject rows, event category, valid content
      - ["250", "amendment", "532", "complete"]
      - ["251", "modification", "532", "complete"]
      - ["523", "deleted", "532", "complete"]
      - ["249", "creation", "523", "deleted"]
      - ["250", "amendment", "523", "deleted"]
      - ["251", "modification", "523", "deleted"]
      - ["523", "deleted", "523", "deleted"]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:                            # pre-built ORIGINAL_VERSION member: row-controlled change_type × lifecycle_state
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "${row.life_label}"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "${row.life_code}"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "${row.change_label}"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "${row.change_code}"
            data: "${ds:cnf.composition.minimal_event.v1}"
    expect: validation_failed              # 400_CONTRIBUTION verbatim: "the modification type does not match the operation - i.e. first version of a MODIFICATION"
postconditions:
  - { assert: version, count: 0 }          # nothing committed on any row
