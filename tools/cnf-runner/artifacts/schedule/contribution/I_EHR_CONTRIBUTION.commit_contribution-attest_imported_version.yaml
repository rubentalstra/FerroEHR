# The REFUSAL half of the `VERSIONED_OBJECT.commit_attestation` precondition:
# a `666|attestation|` member naming an IMPORTED_VERSION target is refused.
#
# RM common UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions,
# verbatim: `commit_attestation(…) Pre: has_version_id(a_ver_id) and
# is_original_version(a_ver_id)` — "Add a new attestation to a specified
# original version. Attestations can only be added to Original versions." The
# reason is §Copying's immutability rule (master06: "the `ORIGINAL_VERSION`
# instance is never modified - it remains a faithful copy of its original"): an
# IMPORTED_VERSION wraps a foreign original that must stay byte-verbatim, so
# it is not an attestable target.
#
# The target is provisioned via `requires.import` (the extract import is the
# AMB-34 extension; provisioning may drive an extension route where the
# release surfaces no wire for the precondition). The refusal itself is the
# well-formed-but-semantically-unfollowable class → `validation_failed` (422).
# The ACCEPTING twin — a 666 member naming an ORIGINAL_VERSION — is the
# sibling `-attestation_only` case.
id: I_EHR_CONTRIBUTION.commit_contribution-attest_imported_version
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A 666|attestation| CONTRIBUTION member naming an IMPORTED_VERSION target is
  refused — attestations can only be added to Original versions.
description: "Attesting an IMPORTED_VERSION via CONTRIBUTION is refused"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions (commit_attestation Pre: has_version_id and is_original_version; 'Attestations can only be added to Original versions')"
  - "RM common §change_control (master06 §Copying — 'the ORIGINAL_VERSION instance is never modified')"
  - "TERM SupportTerminology §attestation reason (648 witnessed)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
  import:
    extract: cnf.messaging.ehr_extract.imported_status
    container: X_VERSIONED_EHR_STATUS
data_sets: [cnf.attestation.witnessed]
flow:
  - step: 1                              # the attestation names the IMPORTED target
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation       # no data, no lifecycle_state
          preceding_version_uid: "${imported_version_uid}"
          attestation: "${ds:cnf.attestation.witnessed}"
    expect: validation_failed
ambiguities: [AMB-34]
