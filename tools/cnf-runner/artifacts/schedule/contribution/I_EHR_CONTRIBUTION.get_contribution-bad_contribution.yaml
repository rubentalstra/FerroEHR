# H.4 — get_contribution on an EHR that has CONTRIBUTIONs, for a random,
# non-existing uid, is rejected as not found (the CONTRIBUTION does not exist).
# The "EHR has CONTRIBUTIONs" precondition is established by the requires.commit
# provisioning (the single composition fixture commits as a one-item set through
# create_composition, which mints a CONTRIBUTION).
id: I_EHR_CONTRIBUTION.get_contribution-bad_contribution
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  get_contribution for a random, non-existing CONTRIBUTION uid on an EHR that has
  CONTRIBUTIONs is rejected as not found.
description: "Test get CONTRIBUTION from EHR with non-existing CONTRIBUTION"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
  - "CNF platform_test_schedule master08 §get_contribution-bad_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: any }                  # mints ${ehr_id}
  commit: [cnf.composition.minimal_event.v1]   # "The EHR has CONTRIBUTIONs"
flow:
  - step: 1
    call: get_contribution
    with:
      ehr_id: "${ehr_id}"
      contribution_uid: "33333333-3333-4333-8333-333333333333"
    expect: not_found                     # "the non-existing CONTRIBUTION"
