# G.4 — has_contribution on an EHR that has CONTRIBUTIONs, probing a random,
# non-existing CONTRIBUTION uid, reports the CONTRIBUTION does not exist (FALSE) —
# realized as a 404 (not_found) of the CONTRIBUTION GET (the registered realization). The "EHR has CONTRIBUTIONs" precondition is established by the
# requires.commit provisioning (the single composition fixture commits as a
# one-item set through create_composition, which mints a CONTRIBUTION).
id: I_EHR_CONTRIBUTION.has_contribution-bad_contribution
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.has_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  has_contribution for a random, non-existing CONTRIBUTION uid on an EHR that has
  CONTRIBUTIONs reports the CONTRIBUTION does not exist.
description: "Test presence of CONTRIBUTION that doesn't exist"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.has_contribution"
  - "CNF platform_test_schedule master08 §has_contribution-bad_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: any }                  # mints ${ehr_id}
  commit: [cnf.composition.minimal_event.v1]   # "The EHR has CONTRIBUTIONs"
flow:
  - step: 1
    call: has_contribution
    with:
      ehr_id: "${ehr_id}"
      contribution_uid: "33333333-3333-4333-8333-333333333333"
    expect: not_found                     # negative: "The result must be FALSE"
