# C.5 — commit an event COMPOSITION, then a second CONTRIBUTION modifying it
# (change_type = modification, preceding_version_uid = the version created in
# commit 1). The second version is version 2 of the same VERSIONED_OBJECT.
# NOTE: commit 1 commits exactly one VERSION, so ${v1_uids} resolves to that
# single version uid for the modification's preceding_version_uid — carried IN
# the member body on the contribution wire (SM update_version.adoc:
# UPDATE_VERSION.preceding_version_uid "Current version in service for which
# this version is an update"; OAS UpdateVersion.preceding_version_uid).
id: I_EHR_CONTRIBUTION.commit_contribution-event_composition
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A creation then a modification of an event COMPOSITION, committed via two
  CONTRIBUTIONs, produce two VERSIONs of the same VERSIONED_OBJECT (version 1 =
  creation, version 2 = modification).
description: "Commit CONTRIBUTION with event COMPOSITION"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-event_composition"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${v1_uids}", change_type: CREATE }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          preceding_version_uid: "${v1_uids}"   # body property: OAS UpdateVersion.preceding_version_uid
    expect: created
    capture:
      v2_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${v2_uids}", change_type: MODIFY }
postconditions:
  - { assert: version, count: 2 }        # two VERSIONs of the same COMPOSITION
