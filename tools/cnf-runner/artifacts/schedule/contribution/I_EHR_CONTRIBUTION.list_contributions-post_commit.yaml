# F.1 — list CONTRIBUTIONs after a successful COMPOSITION commit: the result is a
# list with one CONTRIBUTION containing a VERSION<COMPOSITION>.
# ITS-REST 1.1.0 surfaces no list_contributions wire (unrealized binding,
# AMB-22), so this case is not-applicable with citation on this ITS and activates
# when a later ITS-REST release adds the collection endpoint.
id: I_EHR_CONTRIBUTION.list_contributions-post_commit
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.list_contributions
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Listing CONTRIBUTIONs after one COMPOSITION commit returns a list with one
  CONTRIBUTION containing a VERSION<COMPOSITION>.
description: "List CONTRIBUTIONs following successful commit"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.list_contributions"
  - "CNF platform_test_schedule master08 §list_contributions-post_commit"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: any }                  # mints ${ehr_id}
  commit: [cnf.composition.minimal_event.v1]   # one CONTRIBUTION with a VERSION<COMPOSITION>
flow:
  - step: 1
    call: list_contributions
    with: { ehr_id: "${ehr_id}" }
    expect: ok
postconditions:
  - assert: state
    text: "The list has one CONTRIBUTION containing a VERSION<COMPOSITION>."
    verified_by: I_EHR_CONTRIBUTION.get_contribution-existing
ambiguities: [AMB-22]
