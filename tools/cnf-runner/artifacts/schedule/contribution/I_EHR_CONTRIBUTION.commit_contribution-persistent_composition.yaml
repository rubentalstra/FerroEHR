# C.6 — commit a persistent COMPOSITION, then a second CONTRIBUTION modifying it
# (change_type = modification). The second version is version 2 of the same
# VERSIONED_OBJECT.
# NOTE: commit 1 commits exactly one VERSION, so ${v1_uids} resolves to that
# single version uid for the modification's preceding_version_uid (AMB-3).
id: I_EHR_CONTRIBUTION.commit_contribution-persistent_composition
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A creation then a modification of a persistent COMPOSITION, committed via two
  CONTRIBUTIONs, produce two VERSIONs of the same VERSIONED_OBJECT (version 1 =
  creation, version 2 = modification).
description: "Commit CONTRIBUTION with persistent COMPOSITIONs"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-persistent_composition"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_persistent]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.persistent.v1, cnf.composition.persistent.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.persistent.v1}", change_type: creation }
    expect: created
    capture:
      v1_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${v1_uids}", change_type: CREATE }
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.persistent.v2}"
          change_type: modification
          preceding_version_uid: "${v1_uids}"   # ITS-REST: If-Match (AMB-3)
    expect: created
    capture:
      v2_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${v2_uids}", change_type: MODIFY }
postconditions:
  - { assert: version, count: 2 }        # two VERSIONs of the same COMPOSITION
ambiguities: [AMB-3]
