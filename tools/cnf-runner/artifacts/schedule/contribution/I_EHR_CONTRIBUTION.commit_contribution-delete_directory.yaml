# The official [[folder_commit]] deleted row (master08 §FOLDER CONTRIBUTION
# Commit Data Sets: "deleted | deleted | valid | accepted"): a CONTRIBUTION
# deleting the EHR directory (root FOLDER) via change_type = deleted against
# the current directory VERSION is accepted. The delete member carries NO data
# (RM common master06 §2.4: "a new ORIGINAL_VERSION whose data attribute is set
# to Void ... change_type ... 523|deleted|") — the RM-correct data-less
# deletion; the lifecycle code openehr::523|deleted| is spec-defined (RM common
# master06 §Version lifecycle + TERM Version Lifecycle State list 523|deleted|). The logical-delete effect is under-specified in the SM
# (AMB-10) — the state postcondition reports but does not gate.
id: I_EHR_CONTRIBUTION.commit_contribution-delete_directory
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION with change_type = deleted and lifecycle_state =
  deleted against the EHR's current directory VERSION is accepted; the root
  FOLDER gains a deletion VERSION (the official folder_commit deleted row).
description: "Commit CONTRIBUTION deleting the EHR directory"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §FOLDER CONTRIBUTION Commit Data Sets ([[folder_commit]] deleted row)"
  - "RM common §change_control (deletion of existing item; lifecycle_state 523|deleted|)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.folder.minimal          # "The EHR has a directory (root FOLDER)"
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: deleted                            # data-less member (RM common master06 §2.4 Void data)
          preceding_version_uid: "${directory_version_uid}"   # body property: OAS UpdateVersion.preceding_version_uid; bound by the requires.directory provisioning
    expect: created
    capture:
      version_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: DELETED, lifecycle_state: "523" }
postconditions:
  - { assert: version, count: 2 }        # the created directory VERSION + the deletion VERSION
  - assert: state
    text: >-
      The EHR's directory (root FOLDER) is logically deleted (effect
      under-specified in the SM — AMB-10; reported, not gating).
ambiguities: [AMB-10]
