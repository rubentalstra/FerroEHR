# The `revert` transition out of `deleted`, pinned as implemented while the
# released text remains in conflict with itself.
#
# The normative state machine image (RM-version_lifecycle.svg, referenced from
# master06 §Version Lifecycle) carries a `revert` transition from `deleted`
# back to `incomplete` and `complete`. The PROSE of §Logical Deletion describes
# deletion one-way ("information can only ever be logically deleted"), and the
# released wire refuses a re-delete of an already-deleted resource
# (`400_already_deleted.yaml`) without saying anything about restoring one.
# The two readings are not reconcilable from released text; the conflict is
# carried upstream, and until it resolves the IMPLEMENTED reading needs its
# asserted pin rather than silence — a change of behaviour here must be a
# deliberate, visible one.
#
# The restoring commit carries `816|restoration|` from the openEHR
# `audit_change_type` group (TERM SupportTerminology §Audit Change Type), the
# code whose meaning is exactly this act, and the `complete` lifecycle the
# diagram's `revert` arrow arrives at.
#
# Registered as AMB-195 (the transition-status silence this case's family
# shares).
id: I_EHR_CONTRIBUTION.commit_contribution-lifecycle_restore_from_deleted
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-195]
test_purpose: >-
  A logically deleted version can be restored by a subsequent 816|restoration| commit carrying a live lifecycle state, and the restored version is served.
description: "Commit CONTRIBUTION restoring a logically deleted version (816)"
spec_refs:
  - "RM common §change_control (master06 §Version Lifecycle — any transition requires the commit of a new version)"
  - "RM common §change_control (master06 §Abandoned and Inactive States — the transition table)"
  - "TERM SupportTerminology §Version Lifecycle State"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "TERM SupportTerminology §Audit Change Type (816|restoration|)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: creation
          lifecycle_state: complete
    expect: created
    capture:
      v1_uid: created.first_version_uid
  - step: 2                              # the logical delete (data-less, 523|deleted|)
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: deleted
          preceding_version_uid: "${v1_uid}"
    expect: created
    capture: { v2_uid: created.first_version_uid }
  - step: 3                              # restore
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: restoration
          lifecycle_state: complete
          preceding_version_uid: "${v2_uid}"
    expect: created
    capture:
      v3_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 4                              # the restored content is served again
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v3_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "532" }
      - { assert: field, path: "commit_audit/change_type/defining_code/code_string", equals: "816" }
postconditions:
  - { assert: version, count: 3 }
