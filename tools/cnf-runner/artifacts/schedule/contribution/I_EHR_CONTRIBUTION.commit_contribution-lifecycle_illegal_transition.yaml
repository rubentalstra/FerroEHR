# The transition table is CLOSED: a transition it does not list is refused.
#
# RM common master06-change_control_package.adoc §Abandoned and Inactive States
# introduces the table as "The transitions related to the `abandoned` and
# `inactive` states are as follows", and the only arrival it gives `abandoned`
# is `abandon` FROM `incomplete`. A `complete` -> `abandoned` commit therefore
# asserts a transition the state machine does not define; a server that accepts
# it has no state machine at all, only a free-text code field.
#
# SPEC SILENCE on the code, registered as AMB-195: no released sentence assigns
# a status to an illegal lifecycle transition (the released wire has no named
# transition operations either, so it declares no error branch for them). The
# register's fixed handling is 422 — the overview's own row for a well-formed
# request whose semantics cannot be followed.
#
# The accepting twins are the four transition siblings
# (-lifecycle_deactivate / -reactivate / -abandon / -retrieve), each of which
# commits a transition the table DOES list.
id: I_EHR_CONTRIBUTION.commit_contribution-lifecycle_illegal_transition
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-195]
test_purpose: >-
  A CONTRIBUTION version asserting a lifecycle transition the master06 state machine does not list (complete -> abandoned) is rejected, and the version tree is unchanged.
description: "Commit CONTRIBUTION asserting an unlisted lifecycle transition"
spec_refs:
  - "RM common §change_control (master06 §Version Lifecycle — any transition requires the commit of a new version)"
  - "RM common §change_control (master06 §Abandoned and Inactive States — the transition table)"
  - "TERM SupportTerminology §Version Lifecycle State"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "complete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "creation"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      v1_uid: created.first_version_uid
  - step: 2                              # complete -> abandoned: not in the table
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${v1_uid}" }
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "abandoned"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "801"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.composition.minimal_event.v2}"
    expect: validation_failed
postconditions:
  - assert: state
    text: >-
      The rejected transition committed no second version
  - { assert: version, count: 1 }
