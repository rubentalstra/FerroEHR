# The refusal twin of commit_contribution-attestation_only: the SAME
# attestation-only change set, whose sole defect is the omitted mandatory
# `reason`.
#
# `ATTESTATION._reason_` is 1..1 (RM common
# UML/classes/org.openehr.rm.common.attestation.adoc §Attributes: "*1..1* |
# *reason*: DV_TEXT | Reason of this attestation"), and the wire form repeats
# it — ITS-REST specifications/schemas/common/UpdateAttestation.yaml lists
# `reason` under `required` (cited AS the OAS: the docs text does not spell the
# UPDATE_ATTESTATION member set).
#
# THE STATUS is assigned by the DOCS TEXT, not inferred: overview
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim — "The
# request was well-formed but was unable to be followed due to semantic
# errors". The envelope parses; what cannot be followed is a mandatory RM
# attribute that is not there. The binding's `validation_failed` kind carries
# that row.
#
# One behaviour per case: the target version is real and the change_type is
# right — only the attestation content is defective — and the postcondition
# pins that a refused attestation leaves the record exactly as it was.
id: I_EHR_CONTRIBUTION.commit_contribution-attestation_missing_reason
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A 666|attestation| member whose ATTESTATION omits the mandatory reason is
  rejected as semantically unfollowable, and nothing is attached or committed.
description: "Commit CONTRIBUTION attesting without a reason"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §attestation (ATTESTATION.reason 1..1)"
  - "RM common §change_control (master06 §Contributions — the 666|attestation| change kind)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.attestation.invalid.no_reason]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation
          preceding_version_uid: "${v1_uid}"
          attestation: "${ds:cnf.attestation.invalid.no_reason}"
    expect: validation_failed
  - step: 3                              # the record is untouched
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "attestations[0]", absent: true }
postconditions:
  - assert: state
    text: >-
      The rejected attestation attached nothing: the version carries no
      ATTESTATION and no version was added.
  - { assert: version, count: 1 }
