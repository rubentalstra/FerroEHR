# H.2 — get_contribution on an EHR with no CONTRIBUTIONs, for a random uid, is
# rejected as not found (the CONTRIBUTION does not exist). Fixed arbitrary UUID
# literal.
id: I_EHR_CONTRIBUTION.get_contribution-empty_ehr
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  get_contribution for a random CONTRIBUTION uid on an EHR without CONTRIBUTIONs
  is rejected as not found.
description: "Test get CONTRIBUTION from empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
  - "CNF platform_test_schedule master08 §get_contribution-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # "The EHR doesn't have any CONTRIBUTIONs"; mints ${ehr_id}
flow:
  - step: 1
    call: get_contribution
    with:
      ehr_id: "${ehr_id}"
      contribution_uid: "11111111-1111-4111-8111-111111111111"
    expect: not_found                     # "the non-existing CONTRIBUTION"
