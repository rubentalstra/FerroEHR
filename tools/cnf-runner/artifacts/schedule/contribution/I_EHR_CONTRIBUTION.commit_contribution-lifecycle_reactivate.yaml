# The `reactivate` transition of the master06 §Abandoned and Inactive States
# table: `inactive` -> `complete`.
#
# The table's row is verbatim: "`inactive` | `reactivate` | `complete` |
# Patient is readmitted after discharge and the care plan is reactivated."
#
# Driven as a two-transition flow because `inactive` is only reachable through
# `deactivate` (the table lists no other arrival), and each transition is its
# own commit — §Version Lifecycle: "transitions through a number of successive
# states entails a number of commits, each recording one transition". The
# behaviour under test is the SECOND transition; the first is provisioning.
#
# No named wire operation exists for either (register AMB-195).
id: I_EHR_CONTRIBUTION.commit_contribution-lifecycle_reactivate
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-195]
test_purpose: >-
  An inactive (800) version transitions back to complete (532) through a new version, and the served version carries the complete state.
description: "Commit CONTRIBUTION transitioning an inactive version back to complete (reactivate)"
spec_refs:
  - "RM common §change_control (master06 §Version Lifecycle — any transition requires the commit of a new version)"
  - "RM common §change_control (master06 §Abandoned and Inactive States — the transition table)"
  - "TERM SupportTerminology §Version Lifecycle State"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: creation
          lifecycle_state: complete
    expect: created
    capture:
      v1_uid: created.first_version_uid
  - step: 2                              # deactivate (provisioning)
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          lifecycle_state: inactive
          preceding_version_uid: "${v1_uid}"
    expect: created
    capture:
      v2_uid: created.first_version_uid
  - step: 3                              # reactivate — the behaviour under test
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: modification
          lifecycle_state: complete
          preceding_version_uid: "${v2_uid}"
    expect: created
    capture:
      v3_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 4
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v3_uid}"
    expect: ok
    assert:
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "532" }
postconditions:
  - { assert: version, count: 3 }
