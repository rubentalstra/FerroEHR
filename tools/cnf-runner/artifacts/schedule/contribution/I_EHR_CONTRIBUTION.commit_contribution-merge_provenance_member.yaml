# The commit wire declares NO merge shape, so a member carrying
# `other_input_version_uids` is refused.
#
# RM common master06-change_control_package.adoc §Version Merging defines the
# attribute (`ORIGINAL_VERSION.other_input_version_uids`, with the derived
# `is_merged` and the `Is_merged_validity` invariant), and the released READ
# side declares it: ITS-REST OAS `schemas/ehr/OriginalVersion.yaml`. The WRITE
# side does not: `schemas/ehr/UpdateVersion.yaml` declares no such property and
# `schemas/ehr/NewContribution.yaml` types `versions` items as `UpdateVersion`,
# with no `oneOf` and no `_type` discriminator. Merge provenance is therefore
# PRODUCE-only on this wire — the same absence register entry AMB-89 records
# for the import commit, whose shape the release likewise never defines.
#
# Registered as AMB-196. Accepting the member would let a client stamp
# provenance the repository never performed onto a version, feeding
# `Is_merged_validity` and (where the server signs) the VERSION signature.
#
# The accepting twin is the identical member WITHOUT the undeclared property
# (step 3), which commits and serves no merge provenance.
id: I_EHR_CONTRIBUTION.commit_contribution-merge_provenance_member
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-196]
test_purpose: >-
  A CONTRIBUTION member carrying other_input_version_uids — a property the
  released commit wire does not declare — is refused, while the same member
  without it commits and serves no merge provenance.
description: "Commit CONTRIBUTION whose member carries undeclared merge provenance"
spec_refs:
  - "RM common §change_control (master06 §Version Merging; ORIGINAL_VERSION.other_input_version_uids + Is_merged_validity)"
  - "ITS-REST OAS schemas/ehr/UpdateVersion.yaml + schemas/ehr/NewContribution.yaml (no merge shape) vs schemas/ehr/OriginalVersion.yaml (declared on reads)"
  - "ITS-REST OAS responses/400_CONTRIBUTION.yaml"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { v1_uid: created.first_version_uid }
  - step: 2                              # the undeclared property on the write wire
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${v1_uid}" }
            other_input_version_uids:
              - { _type: OBJECT_VERSION_ID, value: "8849182c-82ad-4088-a07f-48ead4180515::sysA.example.org::3" }
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "complete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.composition.minimal_event.v2}"
    expect: bad_request
  - step: 3                              # the accepting twin: the same member without it
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v2}"
          change_type: modification
          preceding_version_uid: "${v1_uid}"
    expect: created
    capture:
      v2_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 4                              # a locally committed version is never a merge
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "other_input_version_uids", absent: true }
postconditions:
  - { assert: version, count: 2 }
