# The SHAPE of a deletion member: a 523|deleted| member that CARRIES data is
# not a deletion at all, and is refused.
#
# The rule is RM, a procedure (RM common master06-change_control_package.adoc
# §Logical Deletion): a logical delete is performed by "create a new Version in
# the normal way; delete its `_data_`; set the `_lifecycle_state_` value to the
# code for `deleted`; commit in the normal way". An absent `_data_` is what
# makes the version a deletion — ORIGINAL_VERSION types `data` 0..1 precisely
# so the deleted version can carry none. A member that sets the deleted
# lifecycle AND ships content contradicts its own change kind: it would leave
# the repository holding data under a version that says the item is gone.
#
# SPEC TENSION, adjudicated as AMB-85 (fixed_handling): the released commit
# schema makes the member's `data` REQUIRED with no null form, so
# delete-through-contribution is not representable as the RM describes it. The
# register follows the RM — a 523|deleted| member MUST omit data, and one
# carrying data is rejected — and the code is the overview's 422 row
# (`Requests_and_responses.md` §HTTP status codes, verbatim: "The request was
# well-formed but was unable to be followed due to semantic errors"): the
# envelope parses, and what cannot be followed is the deletion it claims to be.
#
# The positive shape — the data-LESS deletion the RM procedure describes — is
# the sibling -delete_directory case, which tags the same register entry.
#
# The target is the EHR directory because the provisioning vocabulary can
# establish one with a known current version uid, so the ONLY defect in the
# member is the data it should not carry.
id: I_EHR_CONTRIBUTION.commit_contribution-deleted_member_with_data
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-85]
test_purpose: >-
  A CONTRIBUTION member with change_type/lifecycle 523|deleted| that also
  carries data is rejected as semantically unfollowable, and the target is not
  deleted.
description: "Commit CONTRIBUTION whose deleted member carries data"
spec_refs:
  - "RM common §change_control (master06 §Logical Deletion — delete its data, set lifecycle_state to deleted)"
  - "RM common §original_version (data 0..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.folder.minimal          # a directory with a known current VERSION uid
data_sets: [cnf.folder.updated]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: deleted           # 523|deleted| — the RM procedure deletes the data
          data: "${ds:cnf.folder.updated}"   # …but this member ships content
          preceding_version_uid: "${directory_version_uid}"
    expect: validation_failed
  - step: 2                              # the directory is still live, not deleted
    call: I_EHR_DIRECTORY.get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
postconditions:
  - assert: state
    text: >-
      No deletion version was committed from a data-carrying member: the
      directory is still live (verified by step 2)
  - { assert: version, count: 1 }        # only the provisioned directory VERSION
