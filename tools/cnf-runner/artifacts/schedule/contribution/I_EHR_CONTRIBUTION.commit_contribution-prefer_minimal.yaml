# The `Prefer: return=minimal` verbosity branch of the CONTRIBUTION commit.
#
# The status/body pair comes from register AMB-62's re-adjudication: the docs
# text states two answers for the minimal branch and settles on neither, so the
# released OAS fills the silence per operation family —
# `operations/contribution_create.yaml` maps success to a single `'201'` and
# `responses/201_CONTRIBUTION.yaml` closes "If the `Prefer` header is missing or
# set to `return=minimal`, the body is empty". Created, with nothing in the
# body.
#
# The `Location` SHOULD from the docs text (§Prefer minimal — "The response
# SHOULD include a `Location` header pointing to the newly created or updated
# resource") is executed by the variant binding, and step 2 dereferences the
# contribution identity the empty-bodied response carries: a change set that
# reports nothing is only useful if what it does report addresses the
# CONTRIBUTION it committed.
id: I_EHR_CONTRIBUTION.commit_contribution-prefer_minimal
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-62]
test_purpose: >-
  A CONTRIBUTION commit sent with Prefer: return=minimal answers the created
  status with an empty body and a Location header addressing the CONTRIBUTION.
description: "Prefer: return=minimal honoured on CONTRIBUTION commit"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    variant: return_minimal              # pins Prefer: return=minimal
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created                      # 201 with an empty body
    capture: { contribution_uid: created.contribution_uid }
  - step: 2                              # the identity the empty-bodied response carries addresses the CONTRIBUTION
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
