# The official multi-version combination A (master08 §Combinations of data
# sets: "Creating two valid, complete event COMPOSITIONs in one commit should
# be accepted"): one CONTRIBUTION bundling two creation members, both event,
# both valid — the change-set capability's defining positive. Both VERSIONs
# are created atomically in the one CONTRIBUTION (SM i_ehr_contribution:
# commit_contribution takes "any number of UPDATE_VERSION objects").
id: I_EHR_CONTRIBUTION.commit_contribution-multiple_valid_event_compositions
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION bundling two valid, complete event COMPOSITIONs (both
  change_type = creation) is accepted; both VERSIONs are created in the one
  CONTRIBUTION.
description: "One commit, two valid event COMPOSITIONs — accepted (combination A)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §Combinations of data sets (multiple versions, combination A)"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:                          # the bundled change set: two creation members
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
        - { data: "${ds:cnf.composition.minimal_event.v2}", change_type: creation }
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      version_uids: created.version_uids[]
    assert:
      - { assert: version, for_each: "${version_uids}", change_type: CREATE, uid_pattern: "<uuid>::<system>::1" }
postconditions:
  - { assert: version, count: 2 }        # two new VERSIONed objects, one CONTRIBUTION
