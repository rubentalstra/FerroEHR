# ATTESTATION.attested_view — the visual record of what was signed, kept whole.
#
# THE ATTRIBUTE (RM common
# UML/classes/org.openehr.rm.common.attestation.adoc §Attributes):
# "*0..1* *attested_view*: `DV_MULTIMEDIA` — Optional visual representation of
# content attested e.g. screen image." It is the one ATTESTATION attribute
# carrying an encapsulated binary, and its value must satisfy the DV_MULTIMEDIA
# invariants (RM data_types
# UML/classes/org.openehr.rm.data_types.dv_multimedia.adoc §Invariants):
# "__Media_type_valid__: `media_type /= Void and then code_set
# (Code_set_id_media_types).has_code (media_type)`" — mandatory, and bound to
# the openEHR `media types` code set, "interface for the IANA MIME types code
# set" (§Attributes; TERM SupportTerminology §Code Sets) — plus
# "__Not_empty__: `is_inline or is_external`" and "__Size_valid__: `size >= 0`".
# The fixture is INLINE (`data`, base64 — a 70-byte PNG) with `media_type`
# `image/png` and the matching `size`, so all three hold with a tiny payload.
#
# WHY IT NEEDS ITS OWN CASE: the sibling attestation cases never populate this
# attribute, and it is the one whose loss is invisible from a commit's status
# code — an encapsulated binary that is silently dropped still leaves a
# well-formed ATTESTATION with reason, is_pending and proof. The wire is the
# released `UPDATE_ATTESTATION` (ITS-REST specifications/schemas/common/
# UpdateAttestation.yaml, which declares `attested_view: DvMultimedia`), and the
# attestation member commits NO new version (RM common
# master06-change_control_package.adoc §Contributions: "all logical changes …
# are achieved by physically committing new Versions, or for attestations, new
# Attestation objects to existing Versions"), so the attribute travels the
# attestation completion seam alone.
#
# WHAT IS ASSERTED: every modelled attribute of the multimedia value returns —
# the coded `media_type` with its terminology, the `size`, the base64 `data`
# verbatim, and the `alternate_text` ("Text to display in lieu of multimedia
# display/replay") — on the version envelope and again on the revision history,
# because the two rendering paths are distinct code.
id: I_EHR_CONTRIBUTION.commit_contribution-attestation_attested_view
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning, CompositionOps]
profiles: [CORE]
test_purpose: >-
  A 666|attestation| member carrying an inline DV_MULTIMEDIA attested_view is
  accepted, and the stored ATTESTATION reports that attested_view back with its
  media_type, size, inline data and alternate_text intact.
description: "Commit an ATTESTATION carrying an inline DV_MULTIMEDIA attested_view"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §attestation (attested_view: DV_MULTIMEDIA, 0..1)"
  - "RM data_types §dv_multimedia (Media_type_valid, Not_empty, Size_valid)"
  - "RM common §change_control (master06 §Contributions — the 666|attestation| change kind)"
  - "TERM SupportTerminology §Code Sets (media types / IANA_media-types)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.attestation.attested_view]
flow:
  - step: 1                              # the content to attest
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2                              # the attestation-only change set
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation       # no data, no lifecycle_state — no new version
          preceding_version_uid: "${v1_uid}"
          attestation: "${ds:cnf.attestation.attested_view}"
    expect: created
  - step: 3                              # the whole DV_MULTIMEDIA comes back on the version
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "attestations[0]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "attestations[0]/attested_view/_type", equals: "DV_MULTIMEDIA" }
      - { assert: field, path: "attestations[0]/attested_view/media_type/code_string", equals: "image/png" }
      - { assert: field, path: "attestations[0]/attested_view/media_type/terminology_id/value", equals: "IANA_media-types" }
      - { assert: field, path: "attestations[0]/attested_view/size", equals: 70 }
      - { assert: field, path: "attestations[0]/attested_view/alternate_text", equals: "screen image of the attested composition" }
      - assert: field
        path: "attestations[0]/attested_view/data"
        equals: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
  - step: 4                              # and on the revision history's attestation audit
    call: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "items[0]/audits[1]/_type", equals: "ATTESTATION" }
      - { assert: field, path: "items[0]/audits[1]/attested_view/media_type/code_string", equals: "image/png" }
      - { assert: field, path: "items[0]/audits[1]/attested_view/size", equals: 70 }
postconditions:
  - { assert: version, count: 1 }        # the attestation created no version
  - assert: state
    text: >-
      The stored ATTESTATION carries the whole DV_MULTIMEDIA attested_view —
      the inline data and its media type are not dropped at completion.
