# The official multi-version combination D, remaining orderings (master08
# §Combinations of data sets: "If any COMPOSITION is invalid in a CONTRIBUTION,
# the whole commit should fail. It doesn't matter if it is complete or
# incomplete, event or persistent"). The event/event ordering is C.4
# (-valid_invalid_compositions); this case carries the three remaining official
# orderings — persistent valid + persistent invalid, event valid + persistent
# invalid, and event invalid + persistent valid (the invalid-first ordering) —
# each rejected atomically against the same EHR, so nothing is ever created.
id: I_EHR_CONTRIBUTION.commit_contribution-valid_invalid_compositions_orderings
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION bundling a valid and an invalid COMPOSITION is rejected
  atomically regardless of category mix and member order (persistent/persistent,
  event/persistent, invalid-first); no VERSION of either member is created.
description: "One commit, valid+invalid member orderings — all rejected (combination D)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §Combinations of data sets (multiple versions, combination D + the C.4 transaction NOTE)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event, cnf.opt.minimal_persistent]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets:
  - cnf.composition.minimal_event.v1
  - cnf.composition.minimal_event.invalid_structure
  - cnf.composition.persistent.v1
  - cnf.composition.minimal_persistent.invalid_structure
flow:
  - step: 1
    call: commit_contribution              # persistent valid + persistent invalid
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.persistent.v1}", change_type: creation }
        - { data: "${ds:cnf.composition.minimal_persistent.invalid_structure}", change_type: creation }
    expect: validation_failed
  - step: 2
    call: commit_contribution              # event valid + persistent invalid
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
        - { data: "${ds:cnf.composition.minimal_persistent.invalid_structure}", change_type: creation }
    expect: validation_failed
  - step: 3
    call: commit_contribution              # event INVALID first + persistent valid
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.invalid_structure}", change_type: creation }
        - { data: "${ds:cnf.composition.persistent.v1}", change_type: creation }
    expect: validation_failed
postconditions:
  - { assert: version, count: 0 }        # atomicity across every ordering: nothing was committed
