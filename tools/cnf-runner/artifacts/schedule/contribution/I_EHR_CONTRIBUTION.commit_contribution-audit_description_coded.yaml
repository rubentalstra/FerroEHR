# A CODED commit-audit description survives the commit whole.
#
# RM common UML/classes/org.openehr.rm.common.audit_details.adoc §Attributes
# types `description` a `DV_TEXT` at 0..1 ("Reason for committal. This may be
# used to qualify the value in the `_change_type_` field"), and `DV_CODED_TEXT`
# is a `DV_TEXT` subtype carrying a `defining_code` (RM data_types
# UML/classes/org.openehr.rm.data_types.dv_coded_text.adoc). The released wire
# says the same: ITS-REST specifications/schemas/common/UpdateAudit.yaml types
# `description` as `UDvText`, whose schema (schemas/common/UDvText.yaml) is a
# `oneOf` over DV_TEXT and DV_CODED_TEXT.
#
# So a coded reason-for-committal is a representable value of the attribute,
# and the fact under test is that ALL of it comes back — `_type`, the display
# `value`, and the whole `defining_code` (code_string + terminology_id). A store
# that flattens the attribute to its `value` string loses the code silently: the
# commit still succeeds and the read still shows a description, so nothing but
# an assertion on the code itself catches it. No openEHR terminology group binds
# this attribute, so the code is archetype-local and only its SURVIVAL is
# asserted, never its membership.
#
# The sibling audit cases carry the plain spelling: the header-borne
# `description.value="…"` form (create_ehr-committal_headers,
# delete_composition-audit_headers) and the deprecated bare header
# (update_composition-audit_bare_deprecated). See AMB-179 for the commit
# audit's class + description narrowing in the released commit schema.
id: I_EHR_CONTRIBUTION.commit_contribution-audit_description_coded
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning, CompositionOps]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION member whose commit_audit.description is a DV_CODED_TEXT is
  accepted, and the committed version reports that description back with its
  _type, value and defining_code intact.
description: "Commit CONTRIBUTION with a DV_CODED_TEXT commit_audit description"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §audit_details (AUDIT_DETAILS.description: DV_TEXT 0..1)"
  - "RM data_types §dv_coded_text (DV_CODED_TEXT.defining_code — the coded DV_TEXT subtype)"
  - "ITS-REST Requests_and_responses §openehr-version and openehr-audit-details"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets:
  - cnf.composition.minimal_event.v1
  - cnf.audit.description_coded
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: creation
          commit_audit: "${ds:cnf.audit.description_coded}"
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2                              # the whole DV_CODED_TEXT comes back
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "commit_audit/description/_type", equals: "DV_CODED_TEXT" }
      - { assert: field, path: "commit_audit/description/value", equals: "amended after multidisciplinary review" }
      - { assert: field, path: "commit_audit/description/defining_code/code_string", equals: "at0004" }
      - { assert: field, path: "commit_audit/description/defining_code/terminology_id/value", equals: "local" }
  - step: 3                              # and on the revision history's commit audit
    call: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "items[0]/audits[0]/description/_type", equals: "DV_CODED_TEXT" }
      - { assert: field, path: "items[0]/audits[0]/description/defining_code/code_string", equals: "at0004" }
postconditions:
  - assert: state
    text: >-
      The stored commit audit carries the whole DV_CODED_TEXT description — the
      defining_code is not flattened away at committal.
ambiguities: [AMB-179]
