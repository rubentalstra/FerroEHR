# The refusal twin of the completed attestation in
# commit_contribution-attestation_pending_then_final: the SAME attestation with
# its `items` list emptied.
#
# RM common UML/classes/org.openehr.rm.common.attestation.adoc §Invariants,
# verbatim: "__Items_valid__: `items /= Void implies not items.is_empty`".
#
# WHY THIS IS NOT PEDANTRY — absence and emptiness carry DIFFERENT meanings
# here, so the two states cannot be conflated. RM common
# master04-generic_package.adoc §Attestation, verbatim: "references to items in
# the record being attested to (`ATTESTATION._items_`); **if this list is
# empty, the attestation is for the entire object** (usually the content of an
# `ORIGINAL_VERSION`) to which the attestation is attached, otherwise the list
# must contain a set of paths to items within the item to which the attestation
# is attached". The class invariant is what makes that unambiguous on the wire:
# the whole-object attestation is the one whose `items` is VOID (the shape
# cnf.attestation.witnessed / cnf.attestation.pending carry and the sibling
# cases accept), so a present-but-empty list states nothing at all and is
# refused rather than silently read as "the entire object".
#
# THE STATUS is the docs text's 422 row (overview Requests_and_responses.md
# §HTTP status codes, verbatim: "The request was well-formed but was unable to
# be followed due to semantic errors"): `items: []` is well-formed JSON and a
# well-formed array; what it violates is the class invariant.
id: I_EHR_CONTRIBUTION.commit_contribution-attestation_empty_items
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A 666|attestation| member whose ATTESTATION carries a present-but-empty items
  list is rejected, rather than read as the whole-version attestation an ABSENT
  items list expresses.
description: "Commit CONTRIBUTION attesting with an empty items list"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §attestation (Items_valid: items /= Void implies not items.is_empty)"
  - "RM common §generic (master04 §Attestation — an absent items list means the entire object)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.attestation.invalid.empty_items]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      v1_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - change_type: attestation
          preceding_version_uid: "${v1_uid}"
          attestation: "${ds:cnf.attestation.invalid.empty_items}"
    expect: validation_failed
  - step: 3
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "attestations[0]", absent: true }
postconditions:
  - assert: state
    text: >-
      The rejected attestation attached nothing: the version carries no
      ATTESTATION and no version was added.
  - { assert: version, count: 1 }
