# The `553|incomplete|` ACCEPTANCE branch: a commit whose content is missing
# mandatory data is accepted, and the stored version really carries the
# incomplete state.
#
# RM common master06-change_control_package.adoc §Incomplete Content, NOTE,
# verbatim: "In the `incomplete` state, a limited form of invalidity is
# allowed: mandatory attributes may be absent. Concretely, single-valued
# attributes may have null values and container attributes may be empty, even
# though they may have minimum existence and cardinality respectively of one.
# All other validity requirements must be satisfied." — and, on the
# implementation form: incomplete data "respects the same template and
# archetype(s), but with all existence and cardinality lower limits set to
# zero".
#
# The data set removes TWO mandatory single-valued attributes and nothing else
# (COMPOSITION.composer at the root, ENTRY.subject on the contained
# EVALUATION), so the ONLY axis this case varies against its siblings is the
# lifecycle state. The member is a pre-built ORIGINAL_VERSION (the verbatim
# member seam), because the generated member form fixes the lifecycle from the
# change type.
#
# The two twins that bound this acceptance are siblings:
# -complete_missing_mandatory (the same content at 532|complete| — refused) and
# -incomplete_wrong_data (content that is WRONG rather than missing, at
# 553|incomplete| — still refused).
id: I_EHR_CONTRIBUTION.commit_contribution-incomplete_missing_mandatory
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION version carrying lifecycle_state 553|incomplete| is accepted
  even though mandatory attributes of its content are absent, and the committed
  version carries the incomplete state.
description: "Commit CONTRIBUTION with an incomplete (553) version missing mandatory attributes"
spec_refs:
  - "RM common §change_control (master06 §Incomplete Content — mandatory attributes may be absent; all existence and cardinality lower limits set to zero)"
  - "RM common §change_control (master06 §Version Lifecycle — the five version_lifecycle_state values)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.missing_mandatory]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:                          # pre-built ORIGINAL_VERSION member: lifecycle 553|incomplete|
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "incomplete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "553"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "creation"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.missing_mandatory}"
    expect: created
    capture:
      version_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 2                              # the state really is the one committed
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "553" }
postconditions:
  - { assert: version, count: 1 }
