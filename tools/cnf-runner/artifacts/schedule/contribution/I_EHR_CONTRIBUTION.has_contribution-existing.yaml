# G.1 — has_contribution for an EHR and an existing CONTRIBUTION uid reports the
# CONTRIBUTION exists (TRUE). ITS-REST has no CONTRIBUTION-existence probe, so
# has_contribution is realized as a GET of the CONTRIBUTION (200 = exists); the
# CONTRIBUTION to probe is committed in-flow so its uid is known.
id: I_EHR_CONTRIBUTION.has_contribution-existing
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.has_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  has_contribution for an EHR and an existing CONTRIBUTION uid reports the
  CONTRIBUTION exists.
description: "Test presence of CONTRIBUTION post commit"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.has_contribution"
  - "CNF platform_test_schedule master08 §has_contribution-existing"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution             # precondition: a CONTRIBUTION of known uid
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: has_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok                            # positive: "The result must be TRUE"
