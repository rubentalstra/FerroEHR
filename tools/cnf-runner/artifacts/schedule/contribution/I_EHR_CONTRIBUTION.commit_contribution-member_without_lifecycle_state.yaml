# `UPDATE_VERSION.lifecycle_state` is REQUIRED on the commit wire, and a member
# that omits it is refused rather than silently defaulted.
#
# SM `master03-common_package.adoc` §Version Update Semantics, verbatim: "The
# `_lifecycle_state_` must be supplied in all cases, which is a value such as
# `532|complete|`, `553|incomplete|`, `523|deleted|`, etc from the openEHR
# terminology." The ITS-REST docs text is SILENT on the member's required
# properties, so the RELEASED OAS grounds the wire fact and is cited as the
# OAS: `schemas/ehr/UpdateVersion.yaml` lists `lifecycle_state` under
# `required` (beside `data` and `commit_audit`), and
# `schemas/ehr/NewContribution.yaml` types `versions` items as `UpdateVersion`.
#
# A missing required member is a SHAPE failure, not a semantic one, so the code
# is the released `400_CONTRIBUTION.yaml`, verbatim: "`400 Bad Request` is
# returned when the request could not be parsed or is invalid (e.g. malformed
# request URL syntax, missing required header or parameter, or syntactically
# invalid header, parameter or content …)".
#
# The accepting twin is every other commit case in this chapter, each of which
# states its member's lifecycle explicitly.
id: I_EHR_CONTRIBUTION.commit_contribution-member_without_lifecycle_state
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION version that omits the required lifecycle_state is refused as
  a malformed request, not accepted with a defaulted state.
description: "Commit CONTRIBUTION whose version omits the required lifecycle_state"
spec_refs:
  - "SM openehr_platform master03 §Version Update Semantics (the lifecycle_state must be supplied in all cases)"
  - "ITS-REST OAS schemas/ehr/UpdateVersion.yaml §required (lifecycle_state) + schemas/ehr/NewContribution.yaml §versions"
  - "ITS-REST OAS responses/400_CONTRIBUTION.yaml"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:                          # pre-built member with NO lifecycle_state
        - data:
            _type: ORIGINAL_VERSION
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "creation"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.v1}"
    expect: bad_request
postconditions:
  - { assert: version, count: 0 }
