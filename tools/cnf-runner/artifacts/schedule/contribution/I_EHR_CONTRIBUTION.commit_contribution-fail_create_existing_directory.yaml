# E.2 — commit a CONTRIBUTION with change_type = creation for the EHR directory
# when a directory already exists: rejected for the wrong change_type (the root
# FOLDER already exists). Nothing new is committed.
id: I_EHR_CONTRIBUTION.commit_contribution-fail_create_existing_directory
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION with change_type = creation for the EHR directory
  when one already exists is rejected for the wrong change_type.
description: "Commit CONTRIBUTION attempting to create an existing EHR directory"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-fail_create_existing_directory"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.folder.minimal          # "The EHR has a directory (root FOLDER)"
data_sets: [cnf.folder.minimal]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.folder.minimal}", change_type: creation }
    expect: conflict                      # the root FOLDER already exists
