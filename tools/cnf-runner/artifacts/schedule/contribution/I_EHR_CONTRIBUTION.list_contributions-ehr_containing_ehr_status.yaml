# F.4 — list CONTRIBUTIONs after committing a CONTRIBUTION containing a
# VERSION<EHR_STATUS>: the result is a list with one CONTRIBUTION containing an
# EHR_STATUS. The precondition CONTRIBUTION is established IN-FLOW through the
# EHR_STATUS modification path (the D.1 pattern: get the current status
# VERSION, commit a modification member naming it — RM common master06
# §Contributions; the bulk requires.commit vocabulary routes through
# create_composition and cannot commit an EHR_STATUS).
# ITS-REST 1.1.0 surfaces no list_contributions wire (unrealized binding,
# AMB-22) — not-applicable with citation on this ITS.
id: I_EHR_CONTRIBUTION.list_contributions-ehr_containing_ehr_status
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.list_contributions
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Listing CONTRIBUTIONs after an EHR_STATUS commit returns a list with one
  CONTRIBUTION containing an EHR_STATUS.
description: "List CONTRIBUTIONs post commit of CONTRIBUTION containing EHR_STATUS"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.list_contributions"
  - "CNF platform_test_schedule master08 §list_contributions-ehr_containing_ehr_status"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; the status CONTRIBUTION is committed in-flow
data_sets: [cnf.ehr_status.minimal]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: commit_contribution              # precondition: a CONTRIBUTION with a VERSION<EHR_STATUS>, known uid
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.ehr_status.minimal}"
          change_type: modification
          preceding_version_uid: "${status_version_uid}"   # body property: OAS UpdateVersion.preceding_version_uid
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 3
    call: list_contributions
    with: { ehr_id: "${ehr_id}" }
    expect: ok
postconditions:
  - assert: state
    text: "The list contains the captured CONTRIBUTION uid; that CONTRIBUTION contains an EHR_STATUS."
    verified_by: I_EHR_CONTRIBUTION.get_contribution-existing
ambiguities: [AMB-22]
