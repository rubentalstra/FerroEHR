# The EHR CONTRIBUTION's kind scope, refusal half two: the released request
# schema admits ONLY the EHR family — schemas/ehr/UVersionable.yaml is a
# oneOf + discriminator over COMPOSITION/EHR_STATUS/FOLDER (the demographic
# file's comment says it exists precisely to redefine the set) — so a member
# whose data is a PERSON asserts a kind the route cannot mean. The refusal
# is released-assigned; the STATUS rides AMB-131's fixed handling (422).
id: I_EHR_CONTRIBUTION.commit_contribution-demographic_kind_in_ehr
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
ambiguities: [AMB-131]
test_purpose: >-
  An EHR CONTRIBUTION whose member data is a PERSON — a demographic-family
  kind the EHR UVersionable schema does not admit — is refused, and nothing
  is committed.
description: "Commit EHR CONTRIBUTION carrying a demographic PERSON member"
spec_refs:
  - "ITS-REST OAS schemas/ehr/UVersionable.yaml (the three-type discriminator — cited as the OAS; docs text silent)"
  - "SM openehr_platform §UV_PARTY (demographic version content specific to PARTY)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (the 422 row)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.demographic.person.v1}", change_type: creation }
    expect: validation_failed              # AMB-131 (a): a body the route cannot mean
postconditions:
  - { assert: version, count: 0 }          # nothing committed
