# The CONTRIBUTION COMMIT response carries Last-Modified beside its entity tag,
# under the default `Prefer: return=representation` binding.
#
# THE SENTENCE — overview `Requests_and_responses.md` §"ETag and
# Last-Modified": "Both `ETag` and `Last-Modified` SHOULD be included in
# responses for VERSION, VERSIONED_OBJECT, or other resources that have
# versioning or unique state identifiers", and "For openEHR resources, this
# value should be derived from `VERSION.commit_audit.time_committed.value`".
#
# THE OPENNESS is register AMB-87: Resources.md classifies CONTRIBUTION among
# the NON-versioned resources, and the released `201_CONTRIBUTION.yaml`
# declares ETag / Location / Content-Type and is SILENT on this header. The
# register's fixed handling — scope-extended from the read to the commit —
# resolves it: the 201's own entity tag names the CONTRIBUTION's unique
# identifier, so the resource has the unique state identifier the sentence
# scopes to, and its committal is the one instant it was ever "modified".
#
# WHAT IS EXECUTED: the binding's `created` matchers assert the header trio
# (weak ETag, Location, Last-Modified); this case's own assertion closes the
# VALUE loop that a presence matcher cannot — the served CONTRIBUTION's
# `audit.time_committed` exists, so the header has a stored instant behind it
# rather than a response-time clock reading. The `return=minimal` twin, where
# the header is the ONLY channel the instant has, is
# `I_EHR_CONTRIBUTION.commit_contribution-last_modified_minimal`.
id: I_EHR_CONTRIBUTION.commit_contribution-last_modified
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-87]
test_purpose: >-
  A CONTRIBUTION commit answered with the full representation carries
  Last-Modified beside the weak entity tag, and the committed envelope reports
  the audit instant the header is derived from.
description: "Commit CONTRIBUTION: the 201 carries Last-Modified"
spec_refs:
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "ITS-REST overview Resources §Resources"
  - "RM common master06 §Committal and Audits"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution            # default binding — Prefer: return=representation
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created                      # ETag + Location + Last-Modified (binding matchers)
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      # the instant the header is derived from is the one the envelope reports
      - { assert: field, path: "audit/time_committed/value", exists: true }
