# The `Prefer: return=minimal` twin of
# `I_EHR_CONTRIBUTION.commit_contribution-last_modified`: the commit instant
# still reaches the client, on the branch that returns no body to carry it.
#
# THE SENTENCE — overview `Requests_and_responses.md` §"ETag and
# Last-Modified": "Both `ETag` and `Last-Modified` SHOULD be included in
# responses for VERSION, VERSIONED_OBJECT, or other resources that have
# versioning or unique state identifiers", the value "derived from
# `VERSION.commit_audit.time_committed.value`". Nothing in that section
# conditions the pair on the representation preference, and the released
# `201_CONTRIBUTION.yaml` — which closes "If the `Prefer` header is missing or
# set to `return=minimal`, the body is empty" — declares the entity tag on the
# very response whose body it empties, so the header channel is the one this
# branch is expected to speak through.
#
# THE OPENNESS is register AMB-87 (scope-extended from the CONTRIBUTION read to
# the commit): Resources.md classifies CONTRIBUTION as non-versioned while the
# 201 names its unique identifier in the entity tag. Fixed handling: the
# identifier IS a unique state identifier and the committal IS its one
# modification instant.
#
# WHAT IS EXECUTED: the `return_minimal` binding's `created` matchers assert the
# empty body AND the header set (weak ETag, Location, Last-Modified); step 2
# dereferences the captured identity and asserts the served envelope reports the
# audit instant — the value the header of step 1 had to be derived from, which
# a headers-only response cannot show on its own.
id: I_EHR_CONTRIBUTION.commit_contribution-last_modified_minimal
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-87, AMB-62]
test_purpose: >-
  A CONTRIBUTION commit sent with Prefer: return=minimal carries Last-Modified
  on its headers-only response, and the CONTRIBUTION it identifies reports the
  audit instant that header is derived from.
description: "Commit CONTRIBUTION (return=minimal): the 201 carries Last-Modified"
spec_refs:
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "RM common master06 §Committal and Audits"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    variant: return_minimal              # pins Prefer: return=minimal
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created                      # empty body + ETag/Location/Last-Modified (binding matchers)
    capture: { contribution_uid: created.contribution_uid }
  - step: 2                              # the instant the header of step 1 is derived from
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "audit/time_committed/value", exists: true }
