# E.3 — commit a CONTRIBUTION with change_type = modification for an EHR
# directory that does not exist (random preceding_version_uid): rejected for the
# wrong change_type, because there is nothing to modify.
id: I_EHR_CONTRIBUTION.commit_contribution-fail_modify_non_existing_directory
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Committing a CONTRIBUTION with change_type = modification for an EHR directory
  that does not exist is rejected for the wrong change_type.
description: "Commit CONTRIBUTION attempting to modify a non-existing EHR directory"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §commit_contribution-fail_modify_non_existing_directory"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
  # No `directory:` requirement — "The EHR has no directory (root FOLDER)".
data_sets: [cnf.folder.minimal]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.folder.minimal}"
          change_type: modification
          preceding_version_uid: "00000000-0000-4000-8000-000000000000::cnf.example.org::1"
    expect: conflict                      # nothing to modify — wrong change_type
