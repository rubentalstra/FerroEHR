# A CONTRIBUTION read requested as canonical XML is refused as not acceptable
# — the release publishes no CONTRIBUTION XML document, so the request cannot
# be fulfilled in conformance by ANY server (triage 2026-07-28; register
# AMB-165, extended to the READ side).
#
# Decisive released sentences (ITS-REST overview Resources.md §"XML Format"):
# "If the service cannot fulfill this aspect of the request, it MUST respond
# with HTTP status code `406 Not Acceptable`" — and the fulfillment bar the
# same section sets: "both request payloads and responses MUST conform to the
# [published XSDs]". The published XSDs declare global document elements only
# for composition, version, items, template, extract, extract_request,
# versioned_object and archetype; CONTRIBUTION exists only as a complexType
# (RM Common.xsd), so a CONTRIBUTION XML response has no published document to
# conform to — serving one would breach the conformance MUST, which makes the
# 406 branch the release's own designated answer, unconditionally (the same
# shape as I_DEFINITION_QUERY.list_queries-xml_not_acceptable). The released
# OAS's Accept_LOCATABLE enum listing `application/xml` against a JSON-only
# `content:` map is the internal inconsistency UPR-125 reports upstream.
#
# No format axis: this row asserts the JSON-side refusal discipline, which
# every party is judged on regardless of its XML technology profile.
id: I_EHR_CONTRIBUTION.get_contribution-xml_not_acceptable
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION read requested with `Accept: application/xml` is refused with
  406 rather than answered with an XML document the release never defined or
  a representation the client did not ask for.
description: "Get a CONTRIBUTION with Accept: application/xml (406)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
ambiguities: [AMB-165]
flow:
  - step: 1
    call: commit_contribution          # precondition: a CONTRIBUTION of known uid
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: get_contribution
    format: canonical-xml              # the unfulfillable Accept
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: not_acceptable
