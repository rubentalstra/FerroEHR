# The REFUSAL arm of the CONTRIBUTION family's canonical-XML question: a server
# that does not serve the CONTRIBUTION read in XML refuses the unfulfillable
# `Accept` with 406 (register AMB-167; the read half of the AMB-165 question,
# re-adjudicated 2026-07-28).
#
# Decisive released sentences (ITS-REST overview Resources.md §"XML Format"):
# "If the service cannot fulfill this aspect of the request, it MUST respond
# with HTTP status code `406 Not Acceptable`" — and the fulfillment bar the
# same section sets: "both request payloads and responses MUST conform to the
# [published XSDs]". The published XSDs declare global document elements only
# for composition, version, items, template, extract, extract_request,
# versioned_object and archetype; CONTRIBUTION exists only as a complexType
# (RM Common.xsd), so no CONTRIBUTION XML DOCUMENT is published and no
# released sentence assigns this response a document root name.
#
# WHY THIS IS AN ARM AND NOT A UNIVERSAL RULE (corrected 2026-07-28, register
# AMB-167): §"Data representation" leaves canonical XML to the service
# ("Services MUST support at least one of the openEHR **XML** or **JSON**
# canonical formats"), and the published complexType DOES describe the content
# of a committed CONTRIBUTION — only the root name is withheld. Serving the
# read in XML under a root name the release does not assign is therefore as
# conformant as refusing it, so this row is judged only against a statement
# that declares `contribution-xml-unsupported`. (The COMMIT side is a
# different question and stays unexercised: its envelope carries each new
# version's data inline and has no XSD counterpart at all — AMB-165.) The
# released OAS's Accept_LOCATABLE enum listing `application/xml` against a
# JSON-only `content:` map is the internal inconsistency UPR-125 reports
# upstream; the document-element inventory itself is UPR-127.
#
# No format axis: this row asserts the refusal discipline itself, which is
# judged on a declaring party regardless of its XML technology profile.
id: I_EHR_CONTRIBUTION.get_contribution-xml_not_acceptable
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
profiles: [CORE]
option: contribution-xml-unsupported   # AMB-167 option_select branch
test_purpose: >-
  On a server that declares no canonical-XML support for the CONTRIBUTION
  reads, a CONTRIBUTION read requested with `Accept: application/xml` is
  refused with 406 rather than answered with an XML document the release never
  gave a root name, or a representation the client did not ask for.
description: "Get a CONTRIBUTION with Accept: application/xml (406)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }               # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
ambiguities: [AMB-165, AMB-167]
flow:
  - step: 1
    call: commit_contribution          # precondition: a CONTRIBUTION of known uid
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: get_contribution
    format: canonical-xml              # the unfulfillable Accept
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: not_acceptable
