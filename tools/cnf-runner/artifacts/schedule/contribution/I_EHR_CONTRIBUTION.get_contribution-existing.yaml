# H.1 — get_contribution for an EHR and an existing CONTRIBUTION uid returns the
# CONTRIBUTION. The CONTRIBUTION to retrieve is committed in-flow so its uid is
# known.
id: I_EHR_CONTRIBUTION.get_contribution-existing
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  get_contribution for an EHR and an existing CONTRIBUTION uid returns that
  CONTRIBUTION.
description: "Test get CONTRIBUTION from EHR with existing CONTRIBUTION"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
  - "CNF platform_test_schedule master08 §get_contribution-existing"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution             # precondition: a CONTRIBUTION of known uid
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
