# H.3 — get_contribution on a non-existent EHR errors on the missing EHR
# (404 not_found). Fixed arbitrary UUID literals absent on an empty server.
id: I_EHR_CONTRIBUTION.get_contribution-bad_ehr
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  get_contribution on a random ehr_id when no EHRs exist is rejected as not found
  (the EHR does not exist).
description: "Test get CONTRIBUTION from non-existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
  - "CNF platform_test_schedule master08 §get_contribution-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "There are no EHRs on the server"
flow:
  - step: 1
    call: get_contribution
    with:
      ehr_id: "11111111-1111-4111-8111-111111111111"
      contribution_uid: "22222222-2222-4222-8222-222222222222"
    expect: not_found                     # "the EHR with ehr_id doesn't exist"
