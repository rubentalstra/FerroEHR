# The request-side media-type branch of the CONTRIBUTION commit: a POST that
# DECLARES a payload media type the endpoint has no representation for —
# `text/plain` — cannot be processed and is refused 415, not with a parse or
# validation error.
#
# Decisive docs-text sentence (ITS-REST overview Resources.md §JSON Format):
# "If the service cannot process the request payload as JSON format, it MUST
# respond with HTTP status code `415 Unsupported Media Type`"; §XML Format
# states the mirror rule and §Simplified Formats a third for the simplified
# types — and since SPECITS-84 the four representations this operation admits
# are exactly canonical JSON/XML plus the two simplified inner-payload forms,
# so no representation of this resource can consume a `text/plain` body.
#
# One behaviour per case (the I_EHR_COMPOSITION.create_composition-wrong_media
# precedent): the body is the same valid canonical CONTRIBUTION envelope the
# -valid_composition case commits, so only the declared media type
# distinguishes this exchange. Not option-gated: `text/plain` is not among the
# alternative formats Resources.md §Alternative data formats enumerates, so
# there is no implementation-defined branch on which it could be processable.
id: I_EHR_CONTRIBUTION.commit_contribution-wrong_media
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION commit declaring an unprocessable payload media type
  (text/plain) is refused as unsupported_media, leaving the EHR untouched.
description: "CONTRIBUTION commit with a plain-wrong Content-Type"
spec_refs:
  - "ITS-REST overview Resources.md §JSON Format"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 415 Unsupported Media Type)"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    variant: wrong_media_type            # sends Content-Type: text/plain on the canonical commit
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: unsupported_media            # Resources.md §JSON Format MUST
