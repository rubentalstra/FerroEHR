# PARTY_IDENTIFIED.Basic_validity on the COMMIT AUDIT's committer.
#
# THE INVARIANT, verbatim (RM common
# UML/classes/org.openehr.rm.common.party_identified.adoc §Invariants):
# "__Basic_validity__: `name /= Void or identifiers /= Void or external_ref /=
# Void`". The class description states the same requirement in prose — "There
# must be at least one of name, identifier or external_ref present" — so a
# PARTY_IDENTIFIED carrying none of the three is not an under-specified party,
# it is an invalid one.
#
# WHY THE COMMITTER SEAT SPECIFICALLY: `AUDIT_DETAILS.committer` is a
# `PARTY_PROXY` at `1..1` (RM common
# UML/classes/org.openehr.rm.common.audit_details.adoc §Attributes), and the
# ITS-REST commit DTO types it the same way (specifications/schemas/common/
# UpdateAudit.yaml: `committer: PartyProxy`, listed under `required`). A party
# in CONTENT is reached by the RM-invariant walk over the composition; the
# commit audit is a SEPARATE object beside the content, so a server whose
# invariant pass only descends the committed data accepts this payload with an
# identity-less committer and writes an unattributable audit — permanently,
# since audits are never rewritten. Only a server that applies the same class
# invariants to the audit object refuses.
#
# THE ACCEPTING TWIN is every other contribution case in this directory: they
# all commit with the runner's default `PARTY_IDENTIFIED` committer carrying a
# `name`, so this fixture differs from an accepted one by the ABSENCE of the
# three attributes and nothing else.
#
# THE STATUS is the docs text's 422 row (ITS-REST overview
# Requests_and_responses.md §HTTP status codes, verbatim: "The request was
# well-formed but was unable to be followed due to semantic errors") — the
# payload parses; only the class invariant fails.
id: I_EHR_CONTRIBUTION.commit_contribution-committer_no_identity
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION whose commit_audit committer is a PARTY_IDENTIFIED carrying
  none of name, identifiers or external_ref is rejected, and nothing is
  committed.
description: "Commit CONTRIBUTION with an identity-less PARTY_IDENTIFIED committer"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §PARTY_IDENTIFIED (Basic_validity: name /= Void or identifiers /= Void or external_ref /= Void)"
  - "RM common §AUDIT_DETAILS (committer: PARTY_PROXY, 1..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (422)"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets:
  - cnf.composition.minimal_event.v1
  - cnf.audit.committer_no_identity
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data: "${ds:cnf.composition.minimal_event.v1}"
          change_type: creation
          commit_audit: "${ds:cnf.audit.committer_no_identity}"
    expect: validation_failed
postconditions:
  # The change set was refused whole: no version and no audit were written.
  - { assert: version, count: 0 }
