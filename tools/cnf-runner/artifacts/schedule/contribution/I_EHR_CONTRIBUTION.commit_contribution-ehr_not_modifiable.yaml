# The deactivated-EHR refusal on the NATIVE write route. The COMPOSITION and
# directory creates already gate it (the two content kinds the RM sentence
# enumerates); this is the third way in, and the one that matters most —
# `POST /ehr/{ehr_id}/contribution` is the primary commit route, and a server
# that enforces `is_modifiable` only in the convenience handlers leaves the
# deactivation trivially bypassable.
#
# The rule is RM, stated outright (RM ehr master04-ehr_package.adoc §EHR Active
# Status): "The `EHR_STATUS._is_modifiable_` attribute is used to indicate
# whether _the contents of an EHR_ are modifiable, and is set to `True` if the
# EHR is considered _active_. An EHR's 'contents' consist of everything other
# than the `EHR_STATUS` object, i.e. its Compositions (Versioned objects
# referred to by the `_compositions_` attribute), its hierarchical Folders
# (Versioned objects referred to by the `_folders_` attribute) and any other
# content that may be added in later releases of this specification." The rule
# is about the CONTENT, not the route, so committing that content through a
# CONTRIBUTION cannot escape it.
#
# SPEC SILENCE on the CODE, adjudicated as AMB-82 (fixed_handling), whose scope
# was extended to the native CONTRIBUTION commit: the ITS-REST docs text never
# mentions `is_modifiable` outside the EHR-creation defaults, and
# contribution_create declares no branch for a deactivated EHR. The register's
# fixed handling is the overview's 409 row (`Requests_and_responses.md` §HTTP
# status codes, verbatim): "Indicates that the request could not be processed
# because it might generate a duplicate or a conflict" — the request conflicts
# with the resource's current state.
#
# The deactivation is performed through the wire, not assumed: ITS-REST has no
# field-level setter, so `clear_ehr_modifiable` is the read-modify-write of the
# whole EHR_STATUS. That the EHR_STATUS itself stays writable while the EHR is
# deactivated is the RM's own carve-out ("everything other than the
# `EHR_STATUS` object") and is what makes the flow expressible at all.
id: I_EHR_CONTRIBUTION.commit_contribution-ehr_not_modifiable
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [EhrStatus]
profiles: [CORE]
ambiguities: [AMB-82]
test_purpose: >-
  Committing a CONTRIBUTION carrying content into an EHR whose
  EHR_STATUS.is_modifiable is false is refused as a conflict with the EHR's
  deactivated state, and commits nothing.
description: "Commit CONTRIBUTION into a deactivated EHR"
spec_refs:
  - "RM ehr §EHR Active Status (master04 — is_modifiable scopes to Compositions and hierarchical Folders)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "SM openehr_platform §I_EHR_STATUS.clear_ehr_modifiable"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_modifiable = true
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status    # the payload the PUT modifies + the If-Match precondition
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2                              # deactivate: is_modifiable -> false
    call: I_EHR_STATUS.clear_ehr_modifiable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: conflict
postconditions:
  - assert: state
    text: >-
      The refused commit added no content: the deactivated EHR holds no
      COMPOSITION version, only its two EHR_STATUS versions
  - { assert: version, count: 2 }        # the default EHR_STATUS + the deactivating modification
