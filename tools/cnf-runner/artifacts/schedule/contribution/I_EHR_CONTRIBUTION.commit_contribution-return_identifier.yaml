# The `Prefer: return=identifier` representation branch on the CONTRIBUTION
# commit — the third verbosity preference of the same write, after
# return=representation (every other commit case) and the minimal default.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §"Prefer only
# identifier"): "This is a variant of preference that implies minimal response
# semantics, but with a non-empty response body (i.e., the status will be `201
# Created` or `200 OK`, never `204 No Content`)." and "The response body SHOULD
# contain only the identifier of the affected resource formatted according to
# the `Accept` request header. For example, when `application/json` is
# requested as above, the response body will be a single JSON object with a
# single `uid` attribute."
#
# Three observable facts, all asserted: the status is the created 201 (never
# the 204 the minimal preference may answer — the binding pins it); the body is
# the identifier object, `uid` present and none of the full CONTRIBUTION's own
# attributes (`versions`, `audit`) rendered beside it; and the returned
# identifier really IS the affected resource's — step 2 reads the CONTRIBUTION
# back through it.
#
# One behaviour per case: the same valid single-COMPOSITION change set every
# accepted commit uses, distinguished only by the `Prefer` value the
# return_identifier variant binding pins.
id: I_EHR_CONTRIBUTION.commit_contribution-return_identifier
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  A CONTRIBUTION commit sent with Prefer: return=identifier answers a non-empty
  identifier body at a created status — never 204 No Content — and the returned
  uid addresses the committed CONTRIBUTION.
description: "Prefer: return=identifier honoured on CONTRIBUTION commit"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer only identifier"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # `Prefer: return=identifier` arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-50) + Requests_and_responses.md §Prefer only identifier
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: commit_contribution
    format: canonical-json
    variant: return_identifier           # pins Prefer: return=identifier
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created                      # "201 Created or 200 OK, never 204 No Content"
    capture: { contribution_uid: created.contribution_uid }
    assert:
      # "a single JSON object with a single `uid` attribute"
      - { assert: field, path: "uid", exists: true }
      # "only the identifier of the affected resource" — not the full representation
      - { assert: field, path: "versions", absent: true }
      - { assert: field, path: "audit", absent: true }
  - step: 2                              # the identifier addresses the resource it names
    call: get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      - { assert: field, path: "uid/value", equals: "${contribution_uid}" }
