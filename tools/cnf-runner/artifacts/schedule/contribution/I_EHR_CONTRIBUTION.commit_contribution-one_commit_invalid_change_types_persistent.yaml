# The official [[one_commit]] single-version matrix, persistent rows (master08
# §Combinations of data sets): a first commit of a PERSISTENT composition with
# change_type amendment | modification | deleted (lifecycle complete, valid
# content) is rejected — "All change types but creation should fail on the
# first commit". The accepted persistent row (creation|complete) is carried by
# -persistent_composition (C.6) step 1; the lifecycle-deleted block of the
# matrix is event-typed and carried by the sibling
# -one_commit_invalid_change_types case. Each row commits a pre-built
# ORIGINAL_VERSION member (the verbatim member seam) so the change_type ×
# lifecycle_state pair is controlled independently; no preceding_version_uid —
# this IS the first commit. Codes per the openEHR Terminology (RM common
# master06 §change_control).
id: I_EHR_CONTRIBUTION.commit_contribution-one_commit_invalid_change_types_persistent
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  On the first commit into an empty EHR, a single-version CONTRIBUTION whose
  persistent-COMPOSITION member carries a non-creation change_type is rejected;
  nothing is created (the official one_commit matrix, persistent rows).
description: "One commit, single version: non-creation change types rejected (persistent)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "CNF platform_test_schedule master08 §Combinations of data sets ([[one_commit]] matrix)"
  - "RM common §change_control (VERSION.commit_audit.change_type; lifecycle_state)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_persistent]
  ehr: { commits: none }                 # "no previous commits were done"; mints ${ehr_id}
data_sets: [cnf.composition.persistent.v1]
parameters:
  iteration: reset_per_row
  matrix:
    columns: [change_code, change_label]
    rows:                                  # the official persistent reject rows (lifecycle complete, valid content)
      - ["250", "amendment"]
      - ["251", "modification"]
      - ["523", "deleted"]
flow:
  - step: 1
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:                            # pre-built ORIGINAL_VERSION member: row-controlled change_type, lifecycle 532|complete|
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "complete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "${row.change_label}"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "${row.change_code}"
            data: "${ds:cnf.composition.persistent.v1}"
    expect: validation_failed              # 400_CONTRIBUTION verbatim: "the modification type does not match the operation - i.e. first version of a MODIFICATION"
postconditions:
  - { assert: version, count: 0 }          # nothing committed on any row
