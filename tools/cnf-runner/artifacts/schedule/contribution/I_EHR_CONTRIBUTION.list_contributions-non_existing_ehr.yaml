# F.3 — list CONTRIBUTIONs of a non-existing EHR (any content type): rejected
# with an error indicating the EHR does not exist. "A random ehr_id" is a fixed
# arbitrary UUID literal absent on an empty server.
# ITS-REST 1.1.0 surfaces no list_contributions wire (unrealized binding,
# AMB-22) — not-applicable with citation on this ITS.
id: I_EHR_CONTRIBUTION.list_contributions-non_existing_ehr
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.list_contributions
capabilities: [ChangeSets]
profiles: [CORE]
test_purpose: >-
  Listing CONTRIBUTIONs of a random ehr_id when no EHRs exist is rejected as not
  found (the EHR does not exist).
description: "List CONTRIBUTIONs of non-existing EHR (ANY)"
spec_refs:
  - "SM openehr_platform §I_EHR_CONTRIBUTION.list_contributions"
  - "CNF platform_test_schedule master08 §list_contributions-non_existing_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "There are no EHRs on the server"
flow:
  - step: 1
    call: list_contributions
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: not_found                     # "EHR with ehr_id doesn't exist"
ambiguities: [AMB-22]
