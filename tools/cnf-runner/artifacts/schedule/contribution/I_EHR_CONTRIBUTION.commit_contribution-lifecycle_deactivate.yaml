# The `deactivate` transition of the master06 §Abandoned and Inactive States
# table: `complete` -> `inactive`.
#
# The table's row is verbatim: "`complete` | `deactivate` | `inactive` | A care
# plan (the version content) is in active use. Subsequently, the patient is
# discharged and the care plan is no longer actively maintained." The
# surrounding prose adds why the state exists: "An Original version may also be
# marked as being in the `inactive` state. This allows content that is
# understood as informationally valid with respect to the real world activities
# it represents - regardless of completion status - to be marked as no longer
# valid for use."
#
# §Version Lifecycle fixes the mechanism this case verifies through the version
# count: "any transition requires the commit of a _new version_, even if the
# content is otherwise unchanged".
#
# There is NO named wire operation for the transition — the released surface
# offers only the open `lifecycle_state` channel (register AMB-195) — so the
# case drives it as a pre-built ORIGINAL_VERSION member, the one shape that can
# carry an arbitrary state code.
id: I_EHR_CONTRIBUTION.commit_contribution-lifecycle_deactivate
kind: functional
component: EHR_CONTRIBUTION
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [ChangeSets]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-195]
test_purpose: >-
  A committed complete (532) version transitions to inactive (800) through a new version, and the served version carries the inactive state.
description: "Commit CONTRIBUTION transitioning a complete version to inactive (deactivate)"
spec_refs:
  - "RM common §change_control (master06 §Version Lifecycle — any transition requires the commit of a new version)"
  - "RM common §change_control (master06 §Abandoned and Inactive States — the transition table)"
  - "TERM SupportTerminology §Version Lifecycle State"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1                              # the complete first version
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "complete"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "creation"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "249"
            data: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      v1_uid: created.first_version_uid
  - step: 2                              # deactivate
    call: commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - data:
            _type: ORIGINAL_VERSION
            preceding_version_uid: { _type: OBJECT_VERSION_ID, value: "${v1_uid}" }
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "inactive"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                code_string: "800"
            commit_audit:
              _type: AUDIT_DETAILS
              system_id: "cnf-runner"
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "modification"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: "openehr" }
                  code_string: "251"
            data: "${ds:cnf.composition.minimal_event.v2}"
    expect: created
    capture:
      v2_uid: created.first_version_uid
      versioned_object_uid: created.first_versioned_object_uid
  - step: 3
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v2_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "800" }
postconditions:
  - assert: state
    text: >-
      The transition committed a NEW version rather than mutating the existing one
  - { assert: version, count: 2 }
