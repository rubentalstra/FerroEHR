# The VERSIONED_PARTY version-at-time sub-resource, both arms of its own
# released rule: "If `version_at_time` is supplied, retrieves the VERSION
# extant _at specified time_, otherwise retrieves the _latest_ VERSION."
#
# Step 3 supplies a time between the two commits and must be served the FIRST
# version; step 4 omits the parameter entirely and must be served the SECOND
# (latest). One case, because the two arms are one sentence and the omission
# arm is only meaningful against a version tree deep enough to distinguish it.
#
# The served object is the ORIGINAL_VERSION envelope, not the bare PARTY —
# which is exactly why this route has no SM counterpart (`I_PARTY`'s reads all
# return a `PARTY`). The anchor is the AMB-127 catalogue naming convention
# recorded in register AMB-136, not a claim that SM defines the operation.
#
# Header discipline (ITS-REST specifications/docs/overview/
# Requests_and_responses.md): §"ETag and Last-Modified" — both "SHOULD be
# included in responses for VERSION, VERSIONED_OBJECT, or other resources that
# have versioning or unique state identifiers", the value "derived from
# VERSION.commit_audit.time_committed.value"; §Location — "It MUST NOT be used
# to indicate an alternate representation of an existing resource (e.g. via
# `GET` method)". The matchers are EXECUTED assertions (#403).
#
# Extancy semantics (which instant anchors a version's extancy, and what a
# time at or after the newest commit returns) are register AMB-70's fixed
# handling; this case exercises them on the demographic side.
id: I_DEMOGRAPHIC_SERVICE.versioned_party_version_at_time
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party_at_version
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released versioned_party version-at-time rule + the ITS-REST overview header rules; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  The versioned_party version-at-time read serves the VERSION extant at the
  supplied instant, and the latest VERSION when the parameter is omitted, both
  as ORIGINAL_VERSION envelopes with the versioning headers.
description: "Read a VERSIONED_PARTY VERSION at time, and with version_at_time omitted"
spec_refs:
  - "ITS-REST overview Resources.md §Resource identification"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "SM openehr_platform §I_PARTY.get_party_at_version"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      first_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
      t0: created.commit_time
  - step: 2
    call: I_PARTY.update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "${first_version_uid}"
    expect: updated
    capture:
      second_version_uid: updated.version_uid
      t1: updated.commit_time
  - step: 3                              # supplied: the version extant between the commits
    call: get_party_at_version
    variant: versioned_party_at_time
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_at_time: "${time:between(t0,t1)}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${first_version_uid}" }
  - step: 4                              # omitted: "otherwise retrieves the latest VERSION"
    call: get_party_at_version
    variant: versioned_party_at_time
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${second_version_uid}" }
postconditions:
  - { assert: version, count: 2 }
