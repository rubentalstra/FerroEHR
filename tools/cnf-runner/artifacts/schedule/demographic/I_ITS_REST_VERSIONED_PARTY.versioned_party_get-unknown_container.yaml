# The miss branch of the VERSIONED_PARTY container read: a well-formed container
# id that names no VERSIONED_PARTY.
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 404 row verbatim): "The
# origin service did not find the target resource or is not willing to disclose
# that one exists." The released OAS assigns the same code to this operation —
# operations/versioned_party_get.yaml declares '404' -> responses/404.yaml,
# whose own wording repeats it ("the server did not find a current
# representation of a target resource, or is not willing to disclose that one
# exists").
#
# The selector is well-formed, so nothing here is the malformed-identifier
# branch (register AMB-76).
id: I_ITS_REST_VERSIONED_PARTY.versioned_party_get-unknown_container
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_VERSIONED_PARTY.versioned_party_get
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview status-code table + the demographic operation file; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A VERSIONED_PARTY container read naming a container that does not exist is a
  miss.
description: "Get VERSIONED_PARTY for an unknown container (404)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires: { server: empty }              # nothing committed, so the literal below cannot resolve
flow:
  - step: 1
    call: versioned_party_get
    with: { versioned_object_uid: "00000000-0000-4000-8000-0000000005c3" }
    expect: not_found
