# The UPDATE half of the PARTY_RELATIONSHIP content check — the create half is
# I_DEMOGRAPHIC_SERVICE.create_party_relationship-bbbb, using the same fixture.
# The refused content is spec-grounded independently of the route: RM
# demographic §PARTY_RELATIONSHIP declares `source` and `target` as mandatory
# PARTY_REFs and the fixture omits `target`, so the SM operation's declared
# `content_invalid` error is the outcome. Step 3 keeps the refusal honest: the
# container still holds exactly the one accepted version.
#
# REALIZATION (#623, 2026-07-28): the released ITS surfaces no
# PARTY_RELATIONSHIP resource (register AMB-32); this executes over the declared
# extension route the product serves.
id: I_DEMOGRAPHIC_SERVICE.update_party_relationship-invalid_body
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY_RELATIONSHIP.update_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM demographic §PARTY_RELATIONSHIP (source/target mandatory) + SM I_PARTY_RELATIONSHIP.update_party_relationship .Errors content_invalid; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  A relationship update whose payload omits the mandatory `target` PARTY_REF is
  refused as a semantic error, and no new VERSION is created.
description: "Update a PARTY_RELATIONSHIP with an invariant-breaching body"
spec_refs:
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.update_party_relationship"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1, cnf.demographic.party_relationship.invalid]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party_relationship
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party_relationship: "${ds:cnf.demographic.party_relationship.invalid}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: validation_failed
  - step: 3                              # the stored relationship is untouched
    call: I_PARTY_RELATIONSHIP.get_party_relationship
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "uid/value", equals: "${preceding_version_uid}" }
postconditions:
  - { assert: version, count: 1 }
