# The demographic CONTRIBUTION commit: one change set carrying one PARTY
# version, committed through POST /demographic/contribution and then read back
# both as the CONTRIBUTION it created and as the PARTY it committed.
#
# The route realizes NO SM operation (SM has no demographic contribution
# interface at all — register AMB-136); the anchor is the AMB-127 catalogue
# naming convention under `variant: demographic`, not a claim that SM defines
# it. The ENVELOPE is canonical JSON only, per register AMB-134.
#
# What the released prose assigns, and this case asserts:
#   - the whole commit is one transaction (RM common
#     master06-change_control_package.adoc §Contributions: "all logical changes
#     … are achieved by physically committing new Versions" as one
#     CONTRIBUTION), so the created contribution lists the version it committed;
#   - `audit.time_committed` is server-set (the operation's own relaxed-envelope
#     prose: "`audit.time_committed`: server will always set it");
#   - the committed PARTY is a real, readable party under its own route, whose
#     uid is the version identifier the commit minted (RM demographic master02
#     §Party Identification; register AMB-129).
id: I_EHR_CONTRIBUTION.commit_contribution-demographic
kind: functional
component: DEMOGRAPHIC
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "the demographic CONTRIBUTION routes realize no SM operation (register AMB-136); the I_EHR_CONTRIBUTION anchor with variant `demographic` is a catalogue naming convention, never an SM claim"
test_purpose: >-
  A CONTRIBUTION committed on the demographic route creates the PARTY versions
  it carries in one transaction, is retrievable by its own uid, and the
  committed PARTY is readable under its version container.
description: "Commit a demographic CONTRIBUTION creating a PARTY"
spec_refs:
  - "RM common §change_control (master06 §Contributions)"
  - "RM demographic master02 §Party Identification"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: commit_contribution
    variant: demographic
    with:
      versions:
        - { data: "${ds:cnf.demographic.person.v1}", change_type: creation }
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      first_version_uid: created.first_version_uid
      first_versioned_object_uid: created.first_versioned_object_uid
  - step: 2                              # the change set is retrievable by its own uid
    call: get_contribution
    variant: demographic
    with: { contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      - { assert: field, path: "uid/value", equals: "${contribution_uid}" }
      # server-set per the operation's relaxed-envelope prose
      - { assert: field, path: "audit/time_committed/value", exists: true }
  - step: 3                              # the committed PARTY really exists
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${first_versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
      - { assert: field, path: "uid/value", equals: "${first_version_uid}" }
postconditions:
  - { assert: version, count: 1 }
