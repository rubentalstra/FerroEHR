# DEMOGRAPHIC ARCHETYPE VALIDATION — the archetype-root rule.
#
# A PARTY is UNCONDITIONALLY an archetype root: RM demographic
# UML/classes/org.openehr.rm.demographic.party.adoc §Invariants declares
# `Is_archetype_root: is_archetype_root` with no antecedent, exactly as
# COMPOSITION, ENTRY, EHR_STATUS and EHR_ACCESS do. RM common
# UML/classes/org.openehr.rm.common.locatable.adoc §Invariants then fixes what
# that costs the instance: `Archetyped_valid: is_archetype_root xor
# archetype_details = Void` — a root whose ARCHETYPED block is absent
# satisfies neither side of the xor, so it is not a legal PARTY.
#
# DECISIVE DOCS TEXT for the wire (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim): "The
# request was well-formed but was unable to be followed due to semantic
# errors." The payload parses and is well-formed JSON — every other attribute
# is the accepted cnf.demographic.person.v1 content — so the 400 row
# ("malformed request syntax, syntactically invalid content") does not
# describe it; what fails is the model constraint.
#
# One behaviour per case: nothing but the missing ARCHETYPED block
# distinguishes this exchange from a successful create.
id: I_DEMOGRAPHIC_SERVICE.create_party-archetype_root_missing
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic + RM common class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A committed PARTY carrying no archetype_details is refused as a semantic
  error, because a PARTY is unconditionally an archetype root and a root
  without an ARCHETYPED block breaks LOCATABLE.Archetyped_valid.
description: "Commit a PARTY that is not archetype-rooted (422)"
spec_refs:
  - "RM demographic §PARTY (Is_archetype_root)"
  - "RM common §LOCATABLE (Archetyped_valid)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "CNF profiles master03-profiles.adoc §Functional (Demographic Persistence: Archetype validation)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.person.no_archetype_details]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.no_archetype_details}" }
    expect: validation_failed            # overview §HTTP status codes, the 422 row
# No postcondition: the refusal IS the whole behaviour, and the rejected
# request carries no identifier a follow-up read could address.
