# The AUTHORIZATION boundary of the PARTY_RELATIONSHIP surface — the separate
# half of the -unauthenticated sibling: this principal IS authenticated, and is
# refused anyway.
#
# One behaviour: an authenticated read-only principal is refused on the
# capability's WRITES (create, delete) and served on its reads. The read step
# is the control that makes the row a statement about the writes rather than
# about the principal — a server that refused this principal everything would
# otherwise pass a write-only probe for the wrong reason.
#
# EXTENSION ROUTES (register AMB-32): the outcome mapping is UNIVERSAL
# (vocab/selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide);
# the routes carry the coarse `Clinical` class — NOT under /admin/, no ADMIN
# role — so the read-only restriction is the only documented role class here.
# No openEHR spec governs role semantics on a route it does not define; the
# refusal is the served routes' own documented contract (their
# `#[utoipa::path]` declares the 403 branch on create/update/delete and not on
# the reads).
id: I_DEMOGRAPHIC_SERVICE.create_party_relationship-readonly_forbidden
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  An authenticated read-only principal is refused when creating or deleting a
  PARTY_RELATIONSHIP and served when reading one — authorization is enforced
  separately from authentication, and only against the mutating half.
description: "A read-only principal is forbidden from writing PARTY_RELATIONSHIPs"
spec_refs:
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party_relationship"
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.delete_party_relationship"
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.get_party_relationship"
applies: { rm: ">=1.0.2" }
requires: { server: any }
data_sets: [cnf.demographic.party_relationship.v1]
flow:
  - step: 1
    call: create_party_relationship
    on: readonly
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: forbidden                    # universal 403 (route-table-wide)
  - step: 2
    call: I_PARTY_RELATIONSHIP.delete_party_relationship
    on: readonly
    with:
      version_uid: "11111111-1111-4111-8111-111111111111::example.openehr.systemid::1"
    expect: forbidden
  # The control: the same principal reads the surface it may not write. The
  # target is absent, so the read's own answer is not_found — which is the
  # point: it is NOT the 403 the writes get, so the refusal above is about the
  # WRITE and not about the principal being shut out wholesale.
  - step: 3
    call: I_PARTY_RELATIONSHIP.get_party_relationship
    on: readonly
    with: { versioned_object_uid: "11111111-1111-4111-8111-111111111111" }
    expect: not_found
