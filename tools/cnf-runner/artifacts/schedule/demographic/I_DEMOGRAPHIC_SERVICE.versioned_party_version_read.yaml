# The VERSIONED_PARTY version sub-resource serves the ORIGINAL_VERSION
# envelope with the versioning headers — the demographic twin of the EHR
# group's /versioned_composition/{uid}/version/{version_uid} read.
#
# Derived from the ITS-REST docs text, not from any SUT:
#   overview Resources.md §Resource identification (a VERSION is retrievable
#   by version_uid); overview Requests_and_responses.md §"ETag and
#   Last-Modified" (both SHOULD accompany VERSION responses; Last-Modified
#   from VERSION.commit_audit.time_committed.value) and §Location (MUST NOT
#   mark an alternate representation on a GET).
# The header assertions execute via the #403 evaluator.
id: I_DEMOGRAPHIC_SERVICE.versioned_party_version_read
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party_at_version
capabilities: [PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_PARTY.get_party_at_version semantics + released ITS-REST demographic docs; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  The versioned_party version read returns the ORIGINAL_VERSION envelope of
  the addressed VERSION with the weak ETag and commit-time Last-Modified, and
  without a Location.
description: "Read an ORIGINAL_VERSION via /demographic/versioned_party/{uid}/version/{version_uid}"
spec_refs:
  - "ITS-REST overview Resources.md §Resource identification"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "SM openehr_platform §I_PARTY.get_party_at_version"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: get_party_at_version
    variant: versioned_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${version_uid}" }
postconditions:
  - { assert: version, count: 1 }
