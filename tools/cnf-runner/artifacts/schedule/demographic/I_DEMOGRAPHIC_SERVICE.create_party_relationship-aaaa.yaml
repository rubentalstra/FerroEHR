# master10 case "aaaa" under I_DEMOGRAPHIC_SERVICE.create_party_relationship() —
# the schedule entry is TBD; authored as the success/happy path from the SM
# operation semantics. create_party_relationship is genuinely on
# I_DEMOGRAPHIC_SERVICE.
#
# REALIZATION, re-derived first-hand 2026-07-28 (#623): ITS-REST 1.1.0 still
# surfaces no PARTY_RELATIONSHIP resource (the docs text never names one; the
# released demographic.openapi.yaml declares no such path) — register AMB-32 —
# but this product SERVES the operation on a declared extension route, so the
# case is EXECUTED against that route instead of resolving excused. It gates the
# PartyRelationshipOperations capability only; no openEHR profile tier and no
# ITS-REST wire-conformance claim rests on it.
id: I_DEMOGRAPHIC_SERVICE.create_party_relationship-aaaa
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY_RELATIONSHIP operation semantics (declared meaning + Errors); master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  Creating the first version of a new PARTY_RELATIONSHIP from a valid data set
  succeeds, causing server-side creation of a new VERSIONED_OBJECT,
  ORIGINAL_VERSION and CONTRIBUTION.
description: "Create a new PARTY_RELATIONSHIP (success)"
spec_refs:
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party_relationship"
  - "CNF platform_test_schedule master10 §create_party_relationship"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1]
flow:
  - step: 1
    call: create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      - { assert: instance_of, rm_type: PARTY_RELATIONSHIP }
      - { assert: version, of: "${version_uid}", uid_pattern: "${versioned_object_uid}::<system>::1" }
postconditions:
  - { assert: version, count: 1 }
  - { assert: version, of: "${version_uid}", change_type: CREATE }
  - assert: state
    text: "The created PARTY_RELATIONSHIP exists and is retrievable"
    verified_by: I_DEMOGRAPHIC_SERVICE.get_party_relationship-aaaa
verified_by: [I_DEMOGRAPHIC_SERVICE.get_party_relationship-aaaa]
