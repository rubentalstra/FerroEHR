# master10 case "aaaa" under I_DEMOGRAPHIC_SERVICE.delete_party_relationship() —
# the schedule entry is TBD; authored as the success/happy path from the SM
# operation semantics (Post_relationship_deleted: not has_party_relationship).
# Resolvable SM operation is I_PARTY_RELATIONSHIP.delete_party_relationship.
#
# REALIZATION (#623, 2026-07-28): the released ITS surfaces no
# PARTY_RELATIONSHIP resource (register AMB-32); the product serves the delete
# on a declared extension route that carries the preceding version IN THE PATH.
# The delete is LOGICAL (a deletion VERSION is committed), so the SM
# postcondition is verified through the RM change_control version facts — which
# are unambiguous regardless of what the route answers to a later read.
id: I_DEMOGRAPHIC_SERVICE.delete_party_relationship-aaaa
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY_RELATIONSHIP.delete_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY_RELATIONSHIP operation semantics (declared meaning + Errors); master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  delete_party_relationship on an existing PARTY_RELATIONSHIP succeeds, adding a
  second VERSION with change_type DELETED (logical delete); the created version
  keeps change_type CREATE.
description: "Delete an existing PARTY_RELATIONSHIP (success)"
spec_refs:
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.delete_party_relationship"
  - "CNF platform_test_schedule master10 §delete_party_relationship"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_party_relationship
    with: { version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
  - { assert: version, of: "${deleted_uid}", change_type: DELETED }
