# The space-wide demographic aggregate reaches a tag placed on a PARTY target.
#
# GROUND: ITS-REST operations/demographic_tags_get.yaml — "Retrieves the list of
# ITEM_TAG resources associated with any target VERSION or VERSIONED_PARTY
# within the Demographic space" and "In case no such parameter is provided then
# all ITEM_TAG resources will be retrieved". The route takes NO path parameter
# and declares no 404, which is exactly what distinguishes it from its EHR twin;
# its unbounded scope is adjudicated in register AMB-138 (served whole, under
# the deployment's own authorization layer — no invented cap or paging).
#
# The three filter parameters are NOT exercised: their semantics are unstated on
# both list routes (register AMB-94), so the unfiltered call — the one the
# release does define — is what is driven. The listing is asserted by
# CONTAINMENT, not whole-list equality: the space is shared with whatever else a
# non-exclusive run has committed, and nothing released bounds it.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported", ITS-REST overview Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag), so the `ItemTags` capability may never gate
# CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.demographic_tags_get-space_wide_listing
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_ITEM_TAGS.demographic_tags_get
capabilities: [ItemTags]
exercises: [DemographicApi]
profiles: [OPTIONS]
ambiguities: [AMB-94, AMB-138]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  The unfiltered demographic-space tag listing includes a tag associated with a
  PARTY target in that space.
description: "Demographic space-wide tag listing reaches a PARTY tag"
spec_refs:
  - "ITS-REST demographic_tags_get.yaml §description"
  - "RM common master07-tags.adoc §Semantics"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires: { server: any }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_ITS_REST_ITEM_TAGS.person_tags_update
    with:
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "space-wide-probe", value: "seen" }
    expect: updated
  - step: 3
    call: demographic_tags_get
    expect: ok
    assert:
      - { assert: returns, matches: "space-wide-probe" }
