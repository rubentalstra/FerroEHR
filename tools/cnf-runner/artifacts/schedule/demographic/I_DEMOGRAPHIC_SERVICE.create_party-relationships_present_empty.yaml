# DEMOGRAPHIC ARCHETYPE VALIDATION — a cardinality rule of the demographic
# model: RM demographic UML/classes/org.openehr.rm.demographic.party.adoc
# §Invariants, `Relationships_validity: relationships /= Void implies (not
# relationships.is_empty and then relationships.for_all (r | r.source =
# self))`. The attribute is optional (0..1 List<PARTY_RELATIONSHIP>), so the
# way to say "no relationships" is to OMIT it; an explicitly present, empty
# list is the one shape the invariant's first arm forbids. Only that arm is
# under test — the source-identity arm needs a committed uid to compare
# against, which a create body does not carry.
#
# WHICH BRANCH: `responses/400.yaml` scopes 400 to "syntactically invalid
# header, parameter or content"; `responses/422.yaml` scopes 422 to content
# that "could be converted to a resource". An optional list carrying its
# non-empty bound cannot be constructed empty, so the body never converts —
# the same 400 the contacts_present_empty and roles_present_empty siblings
# take.
#
# The ACCEPTING twin is create_party-inline_relationships_verbatim, which
# commits a PERSON with one populated by-value PARTY_RELATIONSHIP and reads it
# back unchanged.
#
# One behaviour per case: the payload is cnf.demographic.person.v1 plus one
# empty list.
id: I_DEMOGRAPHIC_SERVICE.create_party-relationships_present_empty
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A committed PARTY whose optional relationships list is present but empty is
  refused (PARTY.Relationships_validity).
description: "Commit a PARTY with an empty relationships list (400)"
spec_refs:
  - "RM demographic §PARTY (Relationships_validity)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "CNF profiles master03-profiles.adoc §Functional (Demographic Persistence: Archetype validation)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.person.relationships_empty]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.relationships_empty}" }
    expect: bad_request                  # an optional list with a non-empty bound cannot be constructed empty — the body never converts
