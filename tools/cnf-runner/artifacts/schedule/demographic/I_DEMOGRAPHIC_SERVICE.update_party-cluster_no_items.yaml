# A present-but-empty `CLUSTER.items` is refused at the demographic-UPDATE seam, inside `PARTY_IDENTITY.details`.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM `UML/classes/org.openehr.rm.data_structures.cluster.adoc` §Attributes types
# `CLUSTER.items: List<ITEM>` at 1..1 — a MANDATORY list — and ITS-REST OAS
# the BMM declares `items` at cardinality 1..* (a mandatory NON-EMPTY container — the OAS `required` keyword alone would admit `[]`), so a present-but-EMPTY list is the one shape the bound
# forbids — the way to say "none" is to omit an optional container, never
# to send [].
#
# WHICH BRANCH: a mandatory list cannot be constructed empty, so the body
# never converts to the resource. ITS-REST `responses/400.yaml` scopes 400 to
# "syntactically invalid ... content"; `responses/422.yaml` scopes 422 to
# content that "could be converted to a resource" and then fails semantic
# validation. This body cannot be converted — the 400 row.
#
# The ACCEPTING twin is `cnf.composition.lab_result.v1`, whose specimen CLUSTER carries
# a populated `items` list and commits (create_composition-lab_result).
id: I_DEMOGRAPHIC_SERVICE.update_party-cluster_no_items
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A body carrying a CLUSTER whose mandatory items list is present but empty is refused as invalid content at this seam, and nothing is committed.
description: "CLUSTER with an empty items list refused (the demographic-UPDATE seam)"
spec_refs:
  - "RM data_structures cluster.adoc §Attributes (items 1..1, cardinality 1..* — the BMM-declared non-empty bound; the OAS required keyword does not state it)"
  - "RM data_structures §CLUSTER (items: List<ITEM>, 1..1)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.cluster_no_items]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.cluster_no_items}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: bad_request
  - step: 3                              # the stored party is untouched
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "uid/value", equals: "${preceding_version_uid}" }
postconditions:
  - { assert: version, count: 1 }
