# The third member of the If-Match family on the PARTY PUT, kept apart from
# its two siblings: the URL addresses a container that REALLY EXISTS, and the
# precondition names a version OF THAT CONTAINER that never existed.
#
#   * -unknown_container   — the container itself is unknown        -> 404
#   * -weak_etag_stale     — a foreign container's version offered   -> 412
#   * this case            — this container, a version it never issued -> 412
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "If a service receives this header,
# and the condition evaluates to `false`, it MUST NOT perform the requested
# method. Instead, it MUST respond with HTTP status code `412 Precondition
# Failed`, and SHOULD return also latest `version_uid` in the `ETag` response
# headers." A version_tree_id the container never issued cannot equal its
# current version, so the condition evaluates false and the MUST applies. The
# 404 family stays reserved for an unresolvable PATH id — and this PATH id
# resolves, which is exactly what separates this case from -unknown_container.
#
# The offered uid is well-formed and correctly shaped for THIS container: its
# object_id is the created container's own, with version_tree_id `99` (ITS-REST
# overview Resources.md §Identifier types — "`object_id :: creating_system_id ::
# version_tree_id`", the object_id "matches the VERSIONED_OBJECT identifier").
# Nothing about the identifier's syntax can be the reason for a rejection.
#
# master10 anchors demographic cases under I_DEMOGRAPHIC_SERVICE; the
# resolvable SM operation is I_PARTY.update_party.
id: I_DEMOGRAPHIC_SERVICE.update_party-unknown_preceding_version
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview §If-Match + §Identifier types; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party update whose If-Match names a version the addressed container never
  issued is refused as a failed precondition, not as a miss, and commits no
  version.
description: "Update a PARTY with an If-Match naming a version that never existed"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "ITS-REST overview Resources.md §Identifier types"
  - "SM openehr_platform §I_PARTY.update_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2                              # the container is real; version 99 of it is not
    call: update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "${versioned_object_uid}::openEHRSys.example.com::99"
    expect: version_not_found
postconditions:
  # "it MUST NOT perform the requested method" — one version, not two.
  - { assert: version, count: 1 }
