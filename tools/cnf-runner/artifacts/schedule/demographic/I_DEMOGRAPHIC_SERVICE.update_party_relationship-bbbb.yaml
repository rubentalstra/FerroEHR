# master10 case "bbbb" under I_DEMOGRAPHIC_SERVICE.update_party_relationship() —
# the schedule entry is TBD; authored as the primary versioning-error path from
# the SM operation semantics (.Errors: object_version_does_not_exist). Resolvable
# SM operation is I_PARTY_RELATIONSHIP.update_party_relationship.
#
# REALIZATION (#623, 2026-07-28): the released ITS surfaces no
# PARTY_RELATIONSHIP resource (register AMB-32); the product serves the update
# on a declared extension route that realizes preceding_version_uid as
# `If-Match`, so a preceding version the container never issued makes the
# precondition evaluate FALSE and the write is refused. The relationship is
# provisioned in-flow so the container exists and only the version is wrong —
# one behaviour per case.
id: I_DEMOGRAPHIC_SERVICE.update_party_relationship-bbbb
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY_RELATIONSHIP.update_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY_RELATIONSHIP operation semantics (declared meaning + Errors); master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  update_party_relationship with a preceding_version_uid the container never
  issued is refused (object_version_does_not_exist), and commits nothing.
description: "Update an existing PARTY_RELATIONSHIP with a wrong preceding version (rejected)"
spec_refs:
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.update_party_relationship"
  - "CNF platform_test_schedule master10 §update_party_relationship"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1, cnf.demographic.party_relationship.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture:
      first_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party_relationship
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party_relationship: "${ds:cnf.demographic.party_relationship.v2}"
      preceding_version_uid: "00000000-0000-4000-8000-0000000000ff::openEHRSys.example.com::1"
    expect: precondition_failed
postconditions:
  - { assert: version, count: 1 }
  - { assert: version, of: "${first_version_uid}", change_type: CREATE }
