# master10 case "aaaa" under I_DEMOGRAPHIC_SERVICE.get_party_relationship_at_time()
# — the schedule entry is TBD; authored as the success/happy path from the SM
# operation semantics. Resolvable SM operation is
# I_PARTY_RELATIONSHIP.get_party_relationship_at_time.
#
# REALIZATION (#623, 2026-07-28): the released ITS surfaces no
# PARTY_RELATIONSHIP resource (register AMB-32); the product serves the at-time
# read as the `version_at_time` query of its own extension route, so the case
# provisions the relationship in-flow and executes the read against it.
id: I_DEMOGRAPHIC_SERVICE.get_party_relationship_at_time-aaaa
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY_RELATIONSHIP.get_party_relationship_at_time
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY_RELATIONSHIP operation semantics (declared meaning + Errors); master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  get_party_relationship_at_time for an existing versioned PARTY_RELATIONSHIP
  returns the version current at the supplied time.
description: "Get an existing PARTY_RELATIONSHIP at time (success)"
spec_refs:
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.get_party_relationship_at_time"
  - "CNF platform_test_schedule master10 §get_party_relationship_at_time"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture:
      created_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
      t0: created.commit_time
  - step: 2
    call: get_party_relationship_at_time
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_at_time: "${time:after(t0)}"   # after the captured commit window -> the created version
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PARTY_RELATIONSHIP }
      - { assert: field, path: "uid/value", equals: "${created_version_uid}" }
