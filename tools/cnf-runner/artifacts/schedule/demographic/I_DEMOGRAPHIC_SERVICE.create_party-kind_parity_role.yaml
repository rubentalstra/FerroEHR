# KIND PARITY, ROLE: the demographic API declares five parallel route
# families over one abstract class, and the released quintets are structurally
# identical — same parameters, same response sets, same header contracts. This
# case proves the claim WHERE IT IS OBSERVABLE (a create followed by the read
# of what was created) instead of re-running the whole PERSON battery on each
# kind, which would assert the same behaviour five times and localize nothing.
# The PERSON family carries the full battery; the other four carry this pair.
#
# The read-back also carries the demographic uid rule: RM demographic
# master02-demographic_package.adoc §Party Identification — "Identifiers of
# Party instances in the system are provided in the same way as identifiers of
# Compositions in the EHR: via the `_uid_` attribute (type `OBJECT_VERSION_ID`)
# of the containing `VERSION`" — with `PARTY.Uid_mandatory` making the
# attribute an invariant rather than a recommendation. The client cannot supply
# that value on a create, so the server mints it; register AMB-129 carries the
# adjudication and AMB-67's recommendation-strength reading is excluded for
# PARTY. The assertion is the observable consequence: the served uid IS the
# version identifier the create's own `ETag` named.
id: I_DEMOGRAPHIC_SERVICE.create_party-kind_parity_role
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY operation semantics + released ITS-REST demographic docs; master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
test_purpose: >-
  The ROLE route family realizes the same create/read contract as the PERSON
  family: a valid ROLE is created with a weak version ETag and a Location, and
  the created party is retrievable under its version container with the
  server-minted uid.
description: "Kind parity: create and read a ROLE"
spec_refs:
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "SM openehr_platform §I_PARTY.get_party"
  - "RM demographic §ROLE"
  - "RM demographic master02 §Party Identification"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.role.v1]
flow:
  - step: 1
    call: create_party
    variant: role
    with: { party: "${ds:cnf.demographic.role.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_PARTY.get_party
    variant: role
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ROLE }
      # the server-minted identity, in the containing VERSION's OBJECT_VERSION_ID
      # form (RM demographic master02 §Party Identification; register AMB-129)
      - { assert: field, path: "uid/value", equals: "${version_uid}" }
postconditions:
  - { assert: version, count: 1 }
