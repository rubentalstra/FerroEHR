# A well-formed `uid_based_id` that resolves to a version container of ANOTHER
# PARTY KIND is a MISS on this route — the WITHIN-DEMOGRAPHIC-space direction of
# the route-kind rule, on GET.
#
# GROUND: RM common master06-change_control_package.adoc §Typing makes a version
# container SINGLE-TYPED — "This ensures that all versions in a given
# `VERSIONED_OBJECT` are of the same type" — and RM demographic master02
# §Versioning Semantics adds "Every Party is stored in its own Version
# container", so no ORGANISATION exists under a PERSON's uid. The released 404
# says exactly that and no more: "`404 Not Found` is returned when the
# `uid_based_id` does not exist"
# (ITS-REST responses/404_unknown_uid_based_id.yaml), which is the
# status table's 404 row verbatim ("The origin service did not find the target
# resource or is not willing to disclose that one exists"). Register AMB-91
# adjudicates the kind mismatch as that miss, on GET, PUT and DELETE alike;
# this case is the GET arm. The demographic half has NO RM
# containment rule to lean on (register AMB-137 records that silence), so the
# discipline rests on the route typing plus AMB-91.
#
# The final step keeps the refusal honest: the PERSON's own tag route is
# untouched.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported", ITS-REST overview Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag), so the `ItemTags` capability may never gate
# CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.organisation_tags_get-wrong_kind_uid
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_ITEM_TAGS.organisation_tags_get
capabilities: [ItemTags]
exercises: [DemographicApi, PartyOperations]
profiles: [OPTIONS]
ambiguities: [AMB-91]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A PERSON container uid presented on the ORGANISATION tag GET route is a
  miss, and leaves the PERSON's own tag collection reachable.
description: "ORGANISATION tag GET through the wrong kind's route (404)"
spec_refs:
  - "RM common §change_control (master06 §Typing)"
  - "RM demographic master02 §Versioning Semantics"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST organisation_tags_get.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
formats: [canonical-json]
requires: { server: any }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # a PERSON container uid on the ORGANISATION tag route
    call: organisation_tags_get
    with: { uid_based_id: "${versioned_object_uid}" }
    expect: not_found
  - step: 3                                       # the PERSON's own tag route still answers
    call: I_ITS_REST_ITEM_TAGS.person_tags_get
    with: { uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
