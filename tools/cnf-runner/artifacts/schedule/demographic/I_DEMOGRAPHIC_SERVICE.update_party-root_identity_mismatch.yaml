# The SEMANTIC (422-class) twin of create_party_relationship-bbbb: after the
# structural refusals moved to the 400 parse class (owner ruling 2026-08-03),
# this case keeps the operation's validation_failed branch exercised with a
# body that CONSTRUCTS fine and fails the semantic pass — the archetype root's
# node_id disagrees with its archetype_details.archetype_id.
id: I_DEMOGRAPHIC_SERVICE.update_party-root_identity_mismatch
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY_RELATIONSHIP operation semantics (declared meaning + Errors); master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  Updating a PERSON so its archetype root carries an
  archetype_details.archetype_id disagreeing with its own archetype_node_id would carry an
  archetype_details.archetype_id disagreeing with its own archetype_node_id is
  refused as a semantic error (the 422 class — the body converts to the
  resource, then fails validation), and no relationship is created.
description: "Update a PERSON (root identity mismatch, 422)"
spec_refs:
  - "SM openehr_platform §I_PARTY.update_party"
  - "RM common UML/classes/org.openehr.rm.common.locatable.adoc §Attributes"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.archetype_node_id_mismatch]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.archetype_node_id_mismatch}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: validation_failed            # the 422 semantic class — converts, then fails the invariant pass
postconditions:
  - { assert: version, count: 1 }        # the create only; the mismatched update committed nothing
