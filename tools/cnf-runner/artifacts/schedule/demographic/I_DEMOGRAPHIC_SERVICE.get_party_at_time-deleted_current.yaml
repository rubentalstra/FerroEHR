# Reading a party whose current version is the LOGICAL DELETION, addressed by
# time. The released party get declares exactly one deleted branch and scopes
# it textually to this addressing form — "`204 No Content` is returned when the
# resource identified by the request parameters (at specified `version_at_time`)
# time has been deleted" — which is the one arm the catalogue can assert
# without over-reading. Register AMB-74 (scope extended to the party family)
# carries the adjudication of the other two addressing forms.
#
# The deleted version has no `_data_` to represent (RM common
# master06-change_control_package.adoc §Logical Deletion: "create a new Version
# in the normal way; delete its `_data_`; set the `_lifecycle_state_` value to
# the code for `deleted`; commit in the normal way"; ORIGINAL_VERSION.data is
# 0..1), which is why an empty success and not a representation is the answer.
#
# The time supplied is AFTER the deletion commit (captured as `t_del`), so the
# version extant at that instant IS the deleted one.
id: I_DEMOGRAPHIC_SERVICE.get_party_at_time-deleted_current
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party_at_time
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM common master06 §Logical Deletion + the released party get's own deleted branch; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party read at a time after its logical deletion is a fulfilled request with
  no content — the deleted version has no data to represent.
description: "Read a logically deleted PARTY at time (no content)"
spec_refs:
  - "RM common §change_control (master06 §Logical Deletion)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_PARTY.get_party_at_time"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_PARTY.delete_party
    with: { version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture:
      deleted_uid: deleted.version_uid
      t_del: deleted.commit_time
  - step: 3
    call: get_party_at_time
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_at_time: "${time:after(t_del)}"   # after the deletion commit -> the deleted version is extant
    expect: ok_empty
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${deleted_uid}", change_type: DELETED }
