# The canonical-XML REQUEST-payload branch of create_party: the same PERSON
# create as -aaaa, with the PARTY serialized as canonical XML.
#
# WHY THIS ROW IS THE REFUSAL ARM AND NOT THE OFFER ARM (register AMB-167,
# re-adjudicated 2026-07-29). The published XSDs declare no document element
# for any demographic PARTY type: the STABLE 1.0.2-nsv1 bundle ships no
# Demographic.xsd at all, so PERSON has no complexType there either, and the
# 2.0.0-nsv2 bundle types it as a LOCATABLE subtype with no element of its own.
# A WRITE row must commit to one request root element, and ITS-REST overview
# Resources.md §"XML Format" opens with "When resources are serialized in
# **canonical XML** format, both request payloads and responses MUST conform to
# the [published XSDs]" — a payload whose root no published schema declares
# does not conform, so requiring a service to accept it would mark a conformant
# validating service non-conformant. (A READ row escapes this because the
# SERVER picks the document and the row can assert the released conduct — the
# negotiated `Content-Type` and an XML document entity — without naming a root;
# those party reads are unchanged and keep `party-xml-supported`.)
#
# What IS released here is the other half of the same section: "A client MAY
# use the header `Content-Type: application/xml` in the requests to specify the
# XML payload format. If the service cannot process the request payload as XML
# format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
# A party declaring `party-xml-unsupported` declares exactly the antecedent, so
# the MUST is enforceable against it — and it fires on the MEDIA TYPE, before
# any document is parsed, which is why the row keeps the codec-derived fixture:
# the payload's root name is not part of what is asserted, and picking the
# generic `items`+`xsi:type` spelling instead would be the catalogue endorsing
# a wire form the release withholds.
#
# The released OAS corroborates that the media type is declared for the request
# even though the document is not: `operations/person_create.yaml` references
# `parameters/header/ContentType_LOCATABLE.yaml`, whose enum contains
# `application/xml`, while its `requestBody.content` map carries
# `application/json` alone.
#
# §"Data representation" leaves XML support to the service ("Services MUST
# support at least one of the openEHR **XML** or **JSON** canonical formats"),
# hence the `canonical-xml` format axis.
id: I_DEMOGRAPHIC_SERVICE.create_party-xml
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
option: party-xml-write-refused     # AMB-167 option_select branch (the refusal arm)
ambiguities: [AMB-167]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY operation semantics (declared meaning + Errors) + released ITS-REST demographic docs; master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "Canonical-XML support for this resource family is statement-declared, not spec-mandated — the published XSDs declare no document element for PERSON and ITS-REST overview Resources.md §Data representation leaves the format to the service, so this row judges only a party that declares it cannot process such a payload (register AMB-167)"
test_purpose: >-
  On a service that declares it cannot process canonical-XML request payloads
  for the PARTY family, create_party refuses an `application/xml` PERSON
  payload as unsupported media.
description: "create_party refuses a canonical-XML PERSON payload as unsupported media"
spec_refs:
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "RM demographic §PERSON"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1.xml]
flow:
  - step: 1
    call: create_party
    format: canonical-xml              # Content-Type: application/xml on the request body
    with: { party: "${ds:cnf.demographic.person.v1.xml}" }
    expect: unsupported_media          # Resources.md §XML Format 415 MUST
# No postcondition: the refusal IS the whole behaviour, and the request carries
# no identifier a follow-up read could address, so any "nothing was committed"
# assertion would have to invent one — the
# I_DEMOGRAPHIC_SERVICE.create_party-simplified_content_type shape. One
# behaviour per case.
