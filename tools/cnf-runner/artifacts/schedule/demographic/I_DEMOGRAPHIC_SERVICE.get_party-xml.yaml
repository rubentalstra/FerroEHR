# The canonical-XML RESPONSE branch of get_party: the current PERSON version
# retrieved as canonical XML.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to specify
# the expected XML response format. If the service cannot fulfill this aspect of
# the request, it MUST respond with HTTP status code `406 Not Acceptable`.
# Proper header `Content-Type: application/xml` MUST be present in the response
# of the service unless the response has no content body (HTTP status code
# `204`)." The binding's `Content-Type: negotiated` matcher executes that MUST
# against the `Accept` this step sends. The released OAS corroborates the type
# is on offer: `operations/person_get.yaml` references
# `parameters/header/Accept_LOCATABLE.yaml`, whose enum contains
# `application/xml`.
#
# BODY FLOOR. The same section's "both request payloads and responses MUST
# conform to the [published XSDs]" constrains the CONTENT MODEL, and the
# published ITS-XML schema does define the PERSON complexType (RM
# Demographic.xsd) — but it declares NO global element for it (the only globally
# declared document elements are `composition`, `version`, `extract`,
# `extract_request`, `versioned_object` and `items`), so no released sentence
# assigns this response's document ROOT NAME. The row asserts only what the
# release does state: an `application/xml` entity, i.e. an XML document
# (RFC 7303 §3, "application/xml"). `instance_of` is likewise unavailable — it
# reads the canonical-JSON `_type` self-tag, which XML expresses as `xsi:type`.
#
# §"Data representation" leaves XML support to the service, hence the
# `canonical-xml` format axis.
#
# ENFORCEABILITY — this row is judged only against a statement that DECLARES
# canonical-XML support for the PERSON family (register AMB-167,
# adjudicated 2026-07-28). ITS-REST overview Resources.md §"Data
# representation" makes the format a service choice ("Services MUST support
# at least one of the openEHR **XML** or **JSON** canonical formats"), and
# the published XSDs declare no document element for any demographic PARTY
# type (PERSON and its siblings are LOCATABLE-derived complexTypes in
# ITS-XML RM Demographic.xsd, so only the generic abstract `items` root
# could carry them, and no released sentence assigns that root here).
# The release therefore DECLARES `application/xml` for this resource and
# WITHHOLDS the document it would carry: serving the representation (under a
# root name no released sentence assigns) and refusing it under the §XML
# Format 406 MUST are BOTH conformant. The opposite arm is the mirror case
# I_DEMOGRAPHIC_SERVICE.get_party-xml_not_acceptable, gated
# on `party-xml-unsupported`.
id: I_DEMOGRAPHIC_SERVICE.get_party-xml
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
option: party-xml-supported       # AMB-167 option_select branch
ambiguities: [AMB-167]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY operation semantics (declared meaning + Errors) + released ITS-REST demographic docs; master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "Canonical-XML support for this resource family is statement-declared, not spec-mandated — the published XSDs declare no document element for PERSON and ITS-REST overview Resources.md §Data representation leaves the format to the service, so offering and refusing are both conformant (register AMB-167)"
test_purpose: >-
  get_party requested with `Accept: application/xml` returns the current PARTY
  version as an XML document typed `Content-Type: application/xml`.
description: "Get an existing PARTY as canonical XML"
spec_refs:
  - "SM openehr_platform §I_PARTY.get_party"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "RM demographic §PARTY"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    format: canonical-json             # precondition only — the XML branch under test is step 2
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_party
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      # An XML document entity, nothing more — see the BODY FLOOR note above.
      - { assert: returns, matches: '^\s*<' }
