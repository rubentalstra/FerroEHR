# master10 case "aaaa" under I_DEMOGRAPHIC_SERVICE.update_party() — the schedule
# entry is TBD; authored as the success/happy path from the SM operation
# semantics. Resolvable SM operation is I_PARTY.update_party (the AMB-13 rule; see
# REQUIREMENTS.md). Updating with the correct preceding_version_uid creates a
# second VERSION with change_type MODIFY (RM common §change_control), the same
# version-assertion family as update_composition. The ITS-REST binding realizes
# preceding_version_uid as If-Match (AMB-3).
id: I_DEMOGRAPHIC_SERVICE.update_party-aaaa
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "master10 (DEMOGRAPHIC) is a schedule stub — every test case is TBD (aaaa/bbbb); this case is authored from the SM operation semantics (declared meaning + Errors)"
test_purpose: >-
  update_party with the correct preceding_version_uid creates a second VERSION
  of the PARTY with change_type MODIFY.
description: "Update an existing PARTY (success)"
spec_refs:
  - "SM openehr_platform §I_PARTY.update_party"
  - "CNF platform_test_schedule master10 §update_party"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
  - "RM demographic §PARTY"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (AMB-3)
    expect: updated
    capture: { v2_uid: updated.version_uid }
    assert:
      - { assert: version, of: "${v2_uid}", uid_pattern: "${versioned_object_uid}::<system>::2" }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
  - { assert: version, of: "${v2_uid}", change_type: MODIFY }
ambiguities: [AMB-3]
