# master10 case "aaaa" under I_DEMOGRAPHIC_SERVICE.get_party_at_time() — the
# schedule entry is TBD; authored as the success/happy path from the SM operation
# semantics. Resolvable SM operation is I_PARTY.get_party_at_time. The versioned party is created in-flow.
id: I_DEMOGRAPHIC_SERVICE.get_party_at_time-aaaa
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party_at_time
capabilities: [PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY operation semantics (declared meaning + Errors) + released ITS-REST demographic docs; master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
test_purpose: >-
  get_party_at_time for an existing versioned PARTY returns the PARTY version
  current at the supplied time.
description: "Get an existing PARTY at time (success)"
spec_refs:
  - "SM openehr_platform §I_PARTY.get_party_at_time"
  - "CNF platform_test_schedule master10 §get_party_at_time"
  - "RM demographic §PARTY"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
      t0: created.commit_time
  - step: 2
    call: get_party_at_time
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_at_time: "${time:after(t0)}"   # after the captured commit window -> the created version
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
