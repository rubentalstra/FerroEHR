# Deleting a party whose addressed version is ALREADY the logical deletion.
# Step 2 deletes; step 3 replays the delete against the SAME (now superseded)
# version uid.
#
# The status is the released 400 row (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, verbatim): "The service cannot
# or will not process the request due to something that is perceived to be a
# client error", read with the sentence below the table — "Status code `400`
# indicates normally a bad request, as well as a generic client-side error,
# used when no other `4xx` error code is appropriate." No other 4xx row fits:
# the container and the version both exist (not 404), nothing is duplicated and
# no state conflicts in the uniqueness sense (not 409), and the request carries
# no precondition header to fail (not 412).
#
# The deletion itself is LOGICAL, per RM common master06-change_control_package.adoc
# §Logical Deletion ("create a new Version in the normal way; delete its
# `_data_`; set the `_lifecycle_state_` value to the code for `deleted`; commit
# in the normal way") and §Contributions ("Since a versioned repository … is by
# definition indelible"), which is why the postconditions count two versions and
# why SM's `Post_party_deleted: not has_party(…)` loses to the RM here
# (register AMB-135, defect 7).
id: I_DEMOGRAPHIC_SERVICE.delete_party-already_deleted
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.delete_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM common master06 §Logical Deletion + the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  Replaying a party delete against an already-deleted version is refused, and
  the version tree is unchanged by the refusal.
description: "Delete an already-deleted PARTY version"
spec_refs:
  - "RM common §change_control (master06 §Logical Deletion)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_PARTY.delete_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_party
    with: { version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }
  - step: 3                              # the replay
    call: delete_party
    with: { version_uid: "${deleted_uid}" }
    expect: already_deleted
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${deleted_uid}", change_type: DELETED }
