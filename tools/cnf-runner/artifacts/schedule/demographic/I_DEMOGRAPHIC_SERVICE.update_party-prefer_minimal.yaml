# The `Prefer: return=minimal` verbosity branch of the party update.
#
# The status comes from register AMB-62's re-adjudication: the docs text states
# two answers for the minimal branch and settles on neither, so the released OAS
# fills the silence per operation family — `operations/person_update.yaml`
# declares both 200 and 204, and `responses/204_version_updated.yaml` reads
# "`204 No Content` is returned when the update operation was successful and the
# `Prefer` header is missing or is set to `return=minimal`".
#
# A 204 carries no body, so the new PARTY version's identity travels in the
# entity tag alone; step 3 dereferences it, which is what proves the empty
# answer still committed the version.
id: I_DEMOGRAPHIC_SERVICE.update_party-prefer_minimal
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations]
exercises: [Versioning]
profiles: [OPTIONS]
ambiguities: [AMB-62]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview Prefer sections + the demographic operation/response files; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party update sent with Prefer: return=minimal answers 204 No Content with
  the new version identity in the ETag, and the version is committed.
description: "Prefer: return=minimal honoured on PARTY update"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_PARTY.update_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
formats: [canonical-json]
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party
    variant: return_minimal              # pins Prefer: return=minimal
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated                      # 204 No Content
    capture: { v2_uid: updated.version_uid }
  - step: 3                              # the empty answer still committed the version the ETag names
    call: get_party_at_version
    # The read is version-addressed: GET /demographic/person/{version_uid}
    # takes the OBJECT_VERSION_ID alone (person_get.yaml), so the version uid
    # the 204's ETag named is the whole argument.
    with:
      version_uid: "${v2_uid}"
    expect: ok
postconditions:
  - { assert: version, count: 2 }
