# DEMOGRAPHIC ARCHETYPE VALIDATION — the value-TYPE arm.
#
# RM demographic UML/classes/org.openehr.rm.demographic.party_identity.adoc
# §Attributes types the archetyped payload of an identity exactly: `1..1
# details: ITEM_STRUCTURE` ("The value of the identity. This will often taken
# the form of a parseable string or a small structure of strings"). A DV_TEXT
# is a DATA_VALUE, not an ITEM_STRUCTURE, so an identity carrying one is not a
# legal PARTY_IDENTITY however well-formed the JSON is — the archetyped
# substructure of a PARTY is validated against the model, not merely parsed.
#
# DECISIVE DOCS TEXT for the wire (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim): "The
# request was well-formed but was unable to be followed due to semantic
# errors." The document parses as JSON and every attribute name is a real RM
# attribute; only the declared TYPE of one value is wrong, which is the
# semantic half, not the 400 row's "malformed request syntax, syntactically
# invalid content".
#
# One behaviour per case: the sibling `identity_details_missing` covers the
# ABSENCE of the same mandatory attribute; this one covers a present value of
# the wrong type. Two different model rules, two different refusals.
id: I_DEMOGRAPHIC_SERVICE.create_party-identity_details_wrong_type
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A committed PARTY whose PARTY_IDENTITY.details carries a DV_TEXT where the
  model declares an ITEM_STRUCTURE is refused as a semantic error.
description: "Commit a PARTY whose identity details is the wrong RM type (422)"
spec_refs:
  - "RM demographic §PARTY_IDENTITY (details: ITEM_STRUCTURE)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "CNF profiles master03-profiles.adoc §Functional (Demographic Persistence: Archetype validation)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.person.identity_details_wrong_type]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.identity_details_wrong_type}" }
    expect: validation_failed            # overview §HTTP status codes, the 422 row
