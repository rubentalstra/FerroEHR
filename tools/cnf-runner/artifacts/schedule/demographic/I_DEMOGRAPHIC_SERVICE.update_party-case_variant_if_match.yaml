# A case-VARIANT If-Match names the same version and MUST satisfy the
# precondition: an OBJECT_VERSION_ID is a composite identifier, and BASE
# base_types master05-identification_package.adoc §"Composite Identifiers and
# Case" makes two identifiers "identical apart from case ... identify the
# same thing". ITS-REST overview Requests_and_responses.md §"If-Match and
# accidental overwrites" requires a 412 ONLY when "the condition evaluates to
# false" — a case-flipped token naming the same version evaluates TRUE.
#
# The uppercase capture transform (#403) makes this expressible: the create
# captures the server-emitted version_uid with its ASCII case flipped, and
# the update replays it as the precondition. Derived from the spec text, not
# from any SUT. master10 anchors demographic cases under
# I_DEMOGRAPHIC_SERVICE; the resolvable SM operation is I_PARTY.update_party.
id: I_DEMOGRAPHIC_SERVICE.update_party-case_variant_if_match
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from BASE base_types master05 §Composite Identifiers and Case + ITS-REST overview Requests_and_responses §If-Match and accidental overwrites; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  update_party with the preceding_version_uid supplied in a case-flipped form
  of the server-emitted version_uid satisfies the If-Match precondition and
  commits the second VERSION — never a spurious 412.
description: "Update a PARTY with a case-variant If-Match (same version, flipped case)"
spec_refs:
  - "BASE base_types master05 §Composite Identifiers and Case"
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "SM openehr_platform §I_PARTY.update_party"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_upper: created.version_uid_upper
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "${preceding_upper}"
    expect: updated
    capture: { v2_uid: updated.version_uid }
postconditions:
  - { assert: version, count: 2 }
