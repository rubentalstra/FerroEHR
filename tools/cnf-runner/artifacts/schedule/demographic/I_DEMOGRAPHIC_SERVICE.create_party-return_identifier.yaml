# The `Prefer: return=identifier` representation branch of the party create —
# the second of the preference triad this catalogue can assert. (The
# `return=representation` branch is every other create case; the
# `return=minimal` branch is deliberately NOT asserted, because register
# AMB-62 records that the released text assigns it no status at all.)
#
# DOCS TEXT (ITS-REST specifications/docs/overview/Requests_and_responses.md
# §"Prefer only identifier"): "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`)." and "The
# response body SHOULD contain only the identifier of the affected resource
# formatted according to the `Accept` request header. For example, when
# `application/json` is requested as above, the response body will be a single
# JSON object with a single `uid` attribute."
#
# Three observable facts, all asserted: the status is the created 201 (never
# the 204 the minimal preference may answer — the binding pins it); the body is
# the identifier object, `uid` present with none of the full PARTY's own
# attributes rendered beside it; and the returned identifier really IS the
# created party's — step 2 reads it back through its version container.
id: I_DEMOGRAPHIC_SERVICE.create_party-return_identifier
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview representation-negotiation rules; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party create sent with Prefer: return=identifier answers a non-empty
  identifier body at a created status — never 204 No Content — and the returned
  identifier addresses the created party.
description: "Prefer: return=identifier honoured on a party create"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer only identifier"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: create_party
    variant: return_identifier           # pins Prefer: return=identifier
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created                      # "201 Created or 200 OK, never 204 No Content"
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
    assert:
      # "a single JSON object with a single `uid` attribute"
      - { assert: field, path: "uid", exists: true }
      # "only the identifier of the affected resource" — not the full representation
      - { assert: field, path: "identities", absent: true }
      - { assert: field, path: "archetype_node_id", absent: true }
  - step: 2                              # the identifier addresses the resource it names
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
      - { assert: field, path: "uid/value", equals: "${version_uid}" }
postconditions:
  - { assert: version, count: 1 }
