# master10 case "aaaa" under
# I_DEMOGRAPHIC_SERVICE.get_party_relationship_at_version() — the schedule entry is
# TBD; authored as the success/happy path from the SM operation semantics.
# Resolvable SM operation is
# I_PARTY_RELATIONSHIP.get_party_relationship_at_version.
#
# REALIZATION (#623, 2026-07-28): the released ITS surfaces no
# PARTY_RELATIONSHIP resource (register AMB-32); the product serves the
# version-addressed read as the OBJECT_VERSION_ID form of its extension route,
# so the case provisions the relationship in-flow and reads back the exact
# version it created.
id: I_DEMOGRAPHIC_SERVICE.get_party_relationship_at_version-aaaa
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY_RELATIONSHIP.get_party_relationship_at_version
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY_RELATIONSHIP operation semantics (declared meaning + Errors); master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  get_party_relationship_at_version for a known PARTY_RELATIONSHIP version id
  returns that version.
description: "Get an existing PARTY_RELATIONSHIP at version (success)"
spec_refs:
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.get_party_relationship_at_version"
  - "CNF platform_test_schedule master10 §get_party_relationship_at_version"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_party_relationship_at_version
    with: { version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PARTY_RELATIONSHIP }
      - { assert: field, path: "uid/value", equals: "${version_uid}" }
