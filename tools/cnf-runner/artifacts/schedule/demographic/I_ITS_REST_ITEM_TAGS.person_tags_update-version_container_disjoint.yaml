# The container-addressed and VERSION-addressed tag collections of the same
# PARTY are DISJOINT — the demographic half of the one RM rule.
#
# THE LAW: RM common item_tag.adoc §Attributes types ITEM_TAG.target a
# UID_BASED_ID and glosses it "Identifier of target, which may be a
# `VERSIONED_OBJECT<T>` or a `VERSION<T>`". The released party tag operations
# carry the same split in their addressing paragraph: the OBJECT_VERSION_ID
# form "is used to get the tags of a particular (target) version of the PERSON
# version …, whereas the latter … is be used to get the tags of the target
# VERSIONED_PARTY container" (ITS-REST operations/person_tags_get.yaml). (That
# the update sibling says "VERSIONED_OBJECT.uid.value" where the get says
# "VERSIONED_PARTY.uid.value" is a wording split over ONE resource, registered
# in AMB-97.)
#
# The single-member expectation on each read is what makes the disjointness
# executable without depending on list order.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported", ITS-REST overview Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag), so the `ItemTags` capability may never gate
# CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.person_tags_update-version_container_disjoint
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_ITEM_TAGS.person_tags_update
capabilities: [ItemTags]
exercises: [DemographicApi, PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  Tags written against a PARTY's version uid and against its container uid form
  two disjoint collections; each read returns only its own.
description: "PERSON tags: version and container collections are disjoint"
spec_refs:
  - "RM common master07-tags.adoc §Semantics"
  - "RM item_tag.adoc §Attributes"
  - "ITS-REST person_tags_get.yaml §description"
  - "ITS-REST person_tags_update.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires: { server: any }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # container-addressed write
    call: person_tags_update
    with:
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "scope", value: "container" }
    expect: updated
  - step: 3                                       # VERSION-addressed write
    call: person_tags_update
    with:
      uid_based_id: "${version_uid}"
      tags:
        - { key: "scope", value: "version" }
    expect: updated
  - step: 4
    call: person_tags_get
    with: { uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/value", equals: "container" }
      - { assert: field, path: "[1]", absent: true }
  - step: 5
    call: person_tags_get
    with: { uid_based_id: "${version_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/value", equals: "version" }
      - { assert: field, path: "[1]", absent: true }
