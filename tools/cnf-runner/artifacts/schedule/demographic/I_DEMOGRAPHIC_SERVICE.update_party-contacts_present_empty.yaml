# A party update whose payload violates a released RM invariant: the fixture is
# a PERSON with an EMPTY `identities` list, which breaches RM demographic
# UML/classes/org.openehr.rm.demographic.party.adoc §Invariants
# `Identities_valid: not identities.is_empty` (the attribute is `1..1
# List<PARTY_IDENTITY>`).
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim): "The
# request was well-formed but was unable to be followed due to semantic
# errors." The payload parses; what fails is the model constraint.
#
# The UPDATE half of the invariant check — the create half is
# I_DEMOGRAPHIC_SERVICE.create_party-bbbb, using the same fixture. Step 3 keeps
# the refusal honest: the container still holds exactly the one accepted
# version, so the rejected update committed nothing.
id: I_DEMOGRAPHIC_SERVICE.update_party-contacts_present_empty
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM demographic §PARTY Identities_valid + the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party update whose body converts to the resource but carries a
  present-but-empty contacts list is refused as a semantic error
  (PARTY.Contacts_valid — the 422 class), and no new VERSION is created.
description: "Update a PARTY with an invariant-breaching body (422)"
spec_refs:
  - "RM demographic §PARTY (Identities_valid)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_PARTY.update_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.contacts_empty]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.contacts_empty}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: bad_request                  # parse class since #1730 (Option<NonEmptyVec>; the #1727 ruling)            # the 422 semantic class — converts, then fails PARTY.Contacts_valid
  - step: 3                              # the stored party is untouched
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "uid/value", equals: "${preceding_version_uid}" }
postconditions:
  - { assert: version, count: 1 }
