# A party update addressing a version container that does not exist. The
# identifier is a well-formed UUID (so this is not the malformed-identifier
# branch — register AMB-76, whose fixed handling makes an unparseable segment
# 400 and a well-formed-but-unknown one 404), and the `If-Match` value is a
# well-formed OBJECT_VERSION_ID over that same non-existent container.
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 404 row verbatim): "The
# origin service did not find the target resource or is not willing to disclose
# that one exists."
#
# WHY 404 rather than 412: §"If-Match and accidental overwrites" conditions its
# 412 on a CONDITION that "evaluates to `false`" — a comparison against the
# resource's current version — and there is no resource here to hold a current
# version, so the request fails at addressing before any precondition can be
# evaluated. The stale-precondition branch over an EXISTING container is
# -weak_etag_stale (412), which keeps the two apart.
id: I_DEMOGRAPHIC_SERVICE.update_party-unknown_container
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview status-code table + §If-Match; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party update addressing an unknown version container is a miss, not a
  failed precondition.
description: "Update an unknown PARTY (404)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "SM openehr_platform §I_PARTY.update_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v2]
flow:
  - step: 1
    call: update_party
    with:
      versioned_object_uid: "00000000-0000-4000-8000-0000000000e1"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "00000000-0000-4000-8000-0000000000e1::openEHRSys.example.com::1"
    expect: not_found
