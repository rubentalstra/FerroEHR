# The demographic CONTRIBUTION envelope's OPTIONAL client-supplied `uid`, both
# halves of the one released sentence that governs it (the operation's own
# relaxed-envelope list): "`uid`: when provided, it will be accepted in case is
# not in-use, otherwise error will be returned".
#
# The ACCEPT half is step 1 + step 3: a commit naming a free uid is created
# UNDER THAT UID, proven by reading it back through the client-chosen
# identifier. The REFUSE half is step 2: the identical envelope replayed while
# the uid is in use.
#
# WHICH error the refusal is, from the released status table (ITS-REST
# specifications/docs/overview/Requests_and_responses.md §HTTP status codes,
# the 409 row verbatim): "Indicates that the request could not be processed
# because it might generate a duplicate or a conflict." A second CONTRIBUTION
# under an identifier already in use is precisely that duplicate; no other 4xx
# row describes a colliding identifier.
#
# Note the deliberate contrast with the PARTY create (register AMB-132): a
# CONTRIBUTION uid is a HIER_OBJECT_ID naming the change set, which a client
# CAN choose, whereas a PARTY uid is derived from the version the server mints,
# which a client cannot. Same word, different identity.
#
# The envelope is authored INLINE rather than through the runner's bundled
# `versions:` construct because that construct mints the envelope itself and
# has no place for a client uid — the whole point of this case. Every value is
# a fixed literal, so two runs send byte-identical bodies.
id: I_EHR_CONTRIBUTION.commit_contribution-demographic_client_uid
kind: functional
component: DEMOGRAPHIC
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "the demographic CONTRIBUTION routes realize no SM operation — SM openehr_platform master06-demographic_service.adoc defines no contribution interface (register AMB-136); the I_EHR_CONTRIBUTION anchor with variant `demographic` is a catalogue naming convention, never an SM claim"
test_purpose: >-
  A demographic CONTRIBUTION committed with a client-supplied envelope uid that
  is free is accepted under that uid; a second commit naming the same uid is
  refused as a duplicate identifier and commits nothing.
description: "Commit a demographic CONTRIBUTION with a client-supplied uid already in use"
spec_refs:
  - "ITS-REST specifications §operations/demographic_contribution_create (the relaxed envelope: uid accepted when not in-use, otherwise an error)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §change_control (master06 §Contributions)"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1                              # the accept half: the uid is free
    call: commit_contribution
    variant: demographic
    with:
      contribution:
        _type: CONTRIBUTION
        uid: { _type: HIER_OBJECT_ID, value: "5d2e8a41-0000-4000-8000-0000000009c1" }
        versions:
          - _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: complete
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: creation
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "249"
            data: "${ds:cnf.demographic.person.v1}"
        audit:
          _type: AUDIT_DETAILS
          committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
          change_type:
            _type: DV_CODED_TEXT
            value: creation
            defining_code:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
              code_string: "249"
    expect: created
  - step: 2                              # the refuse half: the same uid, now in use
    call: commit_contribution
    variant: demographic
    with:
      contribution:
        _type: CONTRIBUTION
        uid: { _type: HIER_OBJECT_ID, value: "5d2e8a41-0000-4000-8000-0000000009c1" }
        versions:
          - _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: complete
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "532"
            commit_audit:
              _type: AUDIT_DETAILS
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: creation
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "249"
            data: "${ds:cnf.demographic.person.v1}"
        audit:
          _type: AUDIT_DETAILS
          committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
          change_type:
            _type: DV_CODED_TEXT
            value: creation
            defining_code:
              _type: CODE_PHRASE
              terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
              code_string: "249"
    expect: conflict
  - step: 3                              # the accepted uid IS the client's
    call: get_contribution
    variant: demographic
    with: { contribution_uid: "5d2e8a41-0000-4000-8000-0000000009c1" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }
      - { assert: field, path: "uid/value", equals: "5d2e8a41-0000-4000-8000-0000000009c1" }
postconditions:
  - assert: state
    text: >-
      The refused replay committed nothing: exactly the one PARTY version of
      the accepted commit exists (verified by step 3 reading the single
      CONTRIBUTION that owns the uid)
  - { assert: version, count: 1 }
