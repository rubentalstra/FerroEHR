# DEMOGRAPHIC ARCHETYPE VALIDATION — the root node-id identity rule.
#
# RM common UML/classes/org.openehr.rm.common.locatable.adoc §archetype_node_id
# fixes the value at a root verbatim: "At an archetype root point, the value of
# this attribute is always the stringified form of the `_archetype_id_` found
# in the `_archetype_details_` object." RM demographic
# UML/classes/org.openehr.rm.demographic.party.adoc §Invariants makes every
# PARTY such a root (`Is_archetype_root: is_archetype_root`, no antecedent), so
# a PARTY whose root archetype_node_id names a DIFFERENT archetype than its own
# ARCHETYPED block contradicts the model: the two archetype identities of one
# root node disagree, and no archetype-driven validation of the instance can
# resolve which one governs it.
#
# DECISIVE DOCS TEXT for the wire (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim): "The
# request was well-formed but was unable to be followed due to semantic
# errors."
#
# One behaviour per case: the payload is cnf.demographic.person.v1 with one
# string changed — the root archetype_node_id.
id: I_DEMOGRAPHIC_SERVICE.create_party-archetype_node_id_mismatch
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic + RM common class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A committed PARTY whose root archetype_node_id is not the stringified form of
  its own archetype_details.archetype_id is refused as a semantic error.
description: "Commit a PARTY whose root archetype_node_id contradicts its ARCHETYPED block (422)"
spec_refs:
  - "RM common §LOCATABLE (archetype_node_id at an archetype root)"
  - "RM demographic §PARTY (Is_archetype_root)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "CNF profiles master03-profiles.adoc §Functional (Demographic Persistence: Archetype validation)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.person.archetype_node_id_mismatch]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.archetype_node_id_mismatch}" }
    expect: validation_failed            # overview §HTTP status codes, the 422 row
