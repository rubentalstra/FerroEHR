# The party DELETE carries its precondition IN THE PATH: the `uid_based_id`
# must be the last (most recent) VERSION uid. This case addresses a SUPERSEDED
# version — step 2 updates the party, so the version step 1 created is no
# longer the trunk head — and the delete is refused.
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 409 row verbatim):
# "Indicates that the request could not be processed because it might generate
# a duplicate or a conflict." A delete of a version that is no longer current
# conflicts with the resource's present state.
#
# WHY NOT 412: §"If-Match and accidental overwrites" scopes its 412 to a
# "condition given in the request header fields" — the party delete declares no
# `If-Match` parameter at all and carries the preceding version in the path
# instead, so there is no header condition to evaluate. The distinction is the
# same one the EHR side draws: a version-in-the-path delete conflicts, a
# version-in-If-Match delete fails its precondition (the DIRECTORY delete).
#
# Step 3 makes the refusal observable rather than assumed: the version tree
# still holds exactly the two versions steps 1 and 2 created, so the rejected
# delete committed nothing.
id: I_DEMOGRAPHIC_SERVICE.delete_party-stale_version_conflict
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.delete_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview status-code table + §If-Match scope; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party delete addressing a superseded version uid is refused as a conflict,
  and commits nothing.
description: "Delete a PARTY at a superseded version uid (conflict)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "RM common §change_control (master06 §Version Identification)"
  - "SM openehr_platform §I_PARTY.delete_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      first_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # supersede it
    call: I_PARTY.update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "${first_version_uid}"
    expect: updated
    capture: { second_version_uid: updated.version_uid }
  - step: 3                              # delete at the SUPERSEDED uid
    call: delete_party
    with: { version_uid: "${first_version_uid}" }
    expect: conflict
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${second_version_uid}", change_type: MODIFY }
