# The canonical-XML representation branch of the VERSIONED_PARTY container read.
#
# Decisive released sentences (ITS-REST overview Resources.md §XML Format): "The
# client SHOULD use the `Accept: application/xml` request header to specify the
# expected XML response format. If the service cannot fulfill this aspect of the
# request, it MUST respond with HTTP status code `406 Not Acceptable`." and
# "Proper header `Content-Type: application/xml` MUST be present in the response
# of the service unless the response has no content body (HTTP status code
# `204`)." The binding's `Content-Type: negotiated` matcher is what asserts the
# representation; an XML body is not JSON, so the RM-level assertions the
# canonical-JSON sibling carries (-container_shape) cannot apply here and are
# deliberately absent.
#
# UNLIKE THE BARE PARTY READS, THIS BRANCH IS NOT OPTION-GATED. The same
# section's "both request payloads and responses MUST conform to the [published
# XSDs]" constrains the content model, and for a VERSIONED_* container the
# published schema DOES declare a document element (`versioned_object`) — the
# classification register AMB-167 records as "DOCUMENTED", where "offering XML
# is fully released behaviour and the §XML Format MUSTs are enforceable as
# written". The demographic PARTY types themselves are in the register's
# UNDEFINED class and their XML cases are option-gated
# (I_DEMOGRAPHIC_SERVICE.get_party-xml on `party-xml-supported`); the container
# above them is not.
#
# Technology-profile scope: canonical XML is OPTIONAL support — Resources.md
# §Data representation, "Services MUST support at least one of the openEHR
# **XML** or **JSON** canonical formats for resource representation" — so the
# case declares the canonical-xml format axis and is counted only against a
# statement whose technology profile declares that format.
id: I_ITS_REST_VERSIONED_PARTY.versioned_party_get-xml
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_VERSIONED_PARTY.versioned_party_get
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
ambiguities: [AMB-167]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview Resources.md §XML Format + the demographic operation file; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  The VERSIONED_PARTY container, requested as canonical XML, is answered in the
  negotiated XML representation.
description: "Get VERSIONED_PARTY with Accept: application/xml"
spec_refs:
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "RM demographic §versioned_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-xml]
option: versioned-party-xml-supported   # AMB-167 offering arm (finding 4, 2026-07-28): §Data representation makes offering XML a service choice even on a DOCUMENTED resource
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    format: canonical-json               # precondition only — the XML branch under test is step 2
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: versioned_party_get
    format: canonical-xml                # Accept: application/xml on a bodyless read
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
