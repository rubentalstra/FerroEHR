# THE COMMITTAL MERGE HAS TWO HALVES ON A DIRECT PARTY WRITE, AND THIS CASE
# PINS THE ONE THE BODY CANNOT CARRY.
#
# ITS-REST specifications/docs/overview/Requests_and_responses.md
# §"openehr-version and openehr-audit-details" states the duty:
#   "In order to allow clients to provide committal metadata, services MUST
#   accept `openehr-version` and `openehr-audit-details` custom request
#   headers." — the worked example's first line is literally
#   `openehr-version: lifecycle_state.code_string="532"` — and
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime."
# The VERSION attributes are named FIRST in that sentence, so the
# `lifecycle_state` half is as much of the MUST as the audit half. The same
# section extends the direct methods to change-controlled resources: "services
# MUST also allow `PUT`, `POST` and `DELETE` methods directly on these
# change-controlled resources".
#
# A demographic PARTY is such a resource — RM demographic
# master02-demographic_package.adoc §Versioning Semantics: "Every Party is
# stored in its own Version container" — and its `UPDATE_VERSION` envelope
# never travels in the request body (the body IS the party), so the committal
# headers are the ONLY channel the merge can arrive through on this route. A
# server that threads the audit half alone silently drops half of a stated MUST
# and makes a `553|incomplete|` party reachable only through a CONTRIBUTION.
#
# The supplied code is 553|incomplete| rather than the example's 532, exactly
# as the COMPOSITION twin (create_composition-version_lifecycle) reasons: 532 is
# the default, so a case supplying it could not tell a merging server from one
# that ignores the header. RM common master06-change_control_package.adoc
# §"Incomplete Content" makes `incomplete` legal on a FIRST commit ("Usually
# content will be committed in the `complete` state. However, in some
# circumstances, e.g. because the author has run out of time or due to an
# emergency, it may be committed as `incomplete`"), and the payload is fully
# valid content, which that state also admits (it relaxes lower limits, it never
# adds requirements). The value set is the terminology the section pins (TERM
# SupportTerminology §Version Lifecycle State).
id: I_DEMOGRAPHIC_SERVICE.create_party-version_lifecycle
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations, DemographicApi]
exercises: [Versioning]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the ITS-REST overview committal-header section + RM common master06 §Incomplete Content; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A client-supplied lifecycle_state of 553|incomplete| on the `openehr-version`
  committal header is merged into the VERSION a direct party create commits,
  instead of being dropped in favour of the 532|complete| default.
description: "Commit a PARTY with a client-supplied VERSION lifecycle_state (direct route)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (master06 §Version Lifecycle / §Incomplete Content)"
  - "RM demographic master02 §Versioning Semantics (every Party is stored in its own Version container)"
  - "TERM SupportTerminology §Version Lifecycle State"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: create_party
    variant: version_lifecycle           # sends openehr-version: lifecycle_state.code_string="553"
    with:
      party: "${ds:cnf.demographic.person.v1}"
      lifecycle_state: "553"             # 553|incomplete| — the non-default code (TERM §Version Lifecycle State)
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_PARTY.get_party_at_version
    variant: versioned_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "lifecycle_state/defining_code/code_string", equals: "553" }
postconditions:
  - { assert: version, count: 1 }
