# master10 case "aaaa" under I_DEMOGRAPHIC_SERVICE.delete_party() — the schedule
# entry is TBD; authored as the success/happy path from the SM operation
# semantics (Post_party_deleted: not has_party). Resolvable SM operation is
# I_PARTY.delete_party (the AMB-13 rule). delete_party
# realizes the preceding_version_uid as the path uid_based_id (ITS-REST overview §If-Match); the
# ITS-REST person_delete is a logical delete adding a deleted VERSION, so the
# result is verified by the RM change_control version facts (the delete_composition
# precedent), which are unambiguous regardless of the get-after-delete wire code.
id: I_DEMOGRAPHIC_SERVICE.delete_party-aaaa
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.delete_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY operation semantics (declared meaning + Errors) + released ITS-REST demographic docs; master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
test_purpose: >-
  delete_party on an existing PARTY succeeds, adding a second VERSION with
  change_type DELETED (logical delete); the created version keeps change_type
  CREATE.
description: "Delete an existing PARTY (success)"
spec_refs:
  - "SM openehr_platform §I_PARTY.delete_party"
  - "CNF platform_test_schedule master10 §delete_party"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
  - "RM demographic §PARTY"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_party
    with: { version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
  - { assert: version, of: "${deleted_uid}", change_type: DELETED }
