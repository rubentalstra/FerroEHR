# An AGENT tag GET against a `uid_based_id` that names nothing is a miss —
# NOT an empty list.
#
# GROUND, verbatim: ITS-REST responses/404_unknown_uid_based_id.yaml,
# referenced by operations/agent_tags_get.yaml — "`404 Not Found` is returned
# when the `uid_based_id` does not exist". The empty list is reserved for the
# OTHER case, which the same operation states outright: "This will return an
# empty list when there is no ITEM_TAG associated with the given target"
# (agent_tags_get.yaml §description) — i.e. an EXISTING but untagged target.
# The two must not be conflated, which is exactly what this case pins. The uid
# below is a well-formed UUID (BASE base_types master05 §Identification), so
# the 400 branch is not in play.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# PER-FAMILY, NOT REDUNDANT: the five demographic party tag families are five
# SEPARATE released operations over five separate routes, each with its own
# target-kind guard (register AMB-91 makes a wrong-kind uid a 404 on every one
# of them), so a case driven on PERSON leaves the other four families
# unexercised. This case is one of the battery that retires this family's
# `coverage_gap` rows in vocab/wire_surface.yaml — coverage ratchets up.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.agent_tags_get-unknown_container
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_ITEM_TAGS.agent_tags_get
capabilities: [ItemTags]
exercises: [DemographicApi, PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  An AGENT tag GET against a uid_based_id that does not exist is not found,
  never an empty list.
description: "AGENT tag GET against an unknown container (404)"
spec_refs:
  - "ITS-REST agent_tags_get.yaml §description"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "BASE base_types master05 §Identification"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
formats: [canonical-json]
requires: { server: any }
flow:
  - step: 1
    call: agent_tags_get
    with: { uid_based_id: "33333333-3333-4333-8333-333333333333" }
    expect: not_found
