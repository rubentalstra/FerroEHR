# THE SOURCE-IDENTITY ARM IS CONTAINER-SCOPED, NOT VERSION-SCOPED. Two RM
# sentences fix the two levels this case holds apart:
#
#   - the party's identity is a VERSION id. RM demographic
#     master02-demographic_package.adoc §Party Identification: "Identifiers of
#     Party instances in the system are provided in the same way as identifiers
#     of Compositions in the EHR: via the `_uid_` attribute (type
#     `OBJECT_VERSION_ID`) of the containing `VERSION`" — so a served party's
#     body carries the three-part id, and a client that reads a party, edits it
#     and writes it back sends that id.
#   - a relationship reference is a CONTAINER id. The same document §Party
#     Relationships (L44): the refs are "`OBJECT_REFs` containing
#     `HIER_OBJECT_IDs` to denote the Version container of a Party, rather than
#     `OBJECT_VERSION_IDs`, which would denote particular versions".
#
# `PARTY.Relationships_validity` (`relationships.for_all (r | r.source = self)`,
# UML/classes/org.openehr.rm.demographic.party.adoc §Invariants) relates those
# two: `r.source` denotes the party, and the party is the continuant the
# container identifies. The join is the `object_id` part of the version id —
# BASE master05-identification_package.adoc §Syntaxes, `object_version_id =
# object_id, '::', creating_system_id, '::', version_tree_id`, with RM common
# master06-change_control_package.adoc §Version Identification stating that the
# `object_id` "is a copy of the `_uid_` of the owning `VERSIONED_OBJECT`". A
# server that compares `source` against the WHOLE version id can never satisfy
# the invariant for a round-tripped party, because L44 forbids the only value
# that would match.
#
# One behaviour per case: the payload is the inline-relationship party plus its
# own uid; the foreign-source twin
# (create_party-relationship_source_foreign_container) is the refusal half.
id: I_DEMOGRAPHIC_SERVICE.create_party-relationship_source_is_the_container
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation, PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM demographic master02 §Party Identification + §Party Relationships and BASE master05 §Syntaxes; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party whose body carries a three-part OBJECT_VERSION_ID uid and an inline
  relationship sourced at the version CONTAINER that uid names satisfies
  PARTY.Relationships_validity and is committed — the round-trip shape a client
  produces by reading a served party, adding a relationship and writing it back.
description: "Party with an inline relationship sourced at its own version container (accepted)"
spec_refs:
  - "RM demographic master02 §Party Identification (the party's uid is the containing VERSION's OBJECT_VERSION_ID)"
  - "RM demographic master02 §Party Relationships (source/target are OBJECT_REFs over HIER_OBJECT_IDs denoting the Version container, rather than OBJECT_VERSION_IDs)"
  - "RM demographic §PARTY (Relationships_validity: relationships.for_all (r | r.source = self))"
  - "BASE master05-identification_package.adoc §Syntaxes (object_version_id = object_id, '::', creating_system_id, '::', version_tree_id)"
  - "RM common master06 §Version Identification (object_id is a copy of the owning VERSIONED_OBJECT's uid)"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.round_trip_relationship]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.round_trip_relationship}" }
    expect: created                      # the invariant holds at the container level
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
      # the by-value list survived the commit with its container-scoped ref
      - { assert: field, path: "relationships[0]/source/id/_type", equals: "HIER_OBJECT_ID" }
      - { assert: field, path: "relationships[0]/source/id/value", equals: "3b6c9f18-0000-4000-8000-0000000005c1" }
postconditions:
  - { assert: version, count: 1 }
  - { assert: version, of: "${version_uid}", change_type: CREATE }
