# The REQUEST half of the Simplified-Formats scope question on the party
# routes: a party create declaring one of the two Simplified MIME types as its
# payload type is refused 415. (The RESPONSE half — a Simplified-only `Accept`
# on a party read -> 406 — is SF-SCOPE-demographic_no_simplified.)
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/Resources.md
# §Simplified Formats): "If the service cannot process the request payload as
# the simplified format is not supported, it MUST respond with HTTP status code
# `415 Unsupported Media Type`."
#
# WHY the service cannot process it, from the released text rather than from
# this server's behaviour: the Simplified Formats are template-derived by
# definition (docs/simplified_formats/master02-overview.adoc §Introduction —
# "Template-specific: Field identifiers are specific to each operational
# template"; §"Relationship to Other Specifications" — "field identifiers are
# generated from OPT definitions"), their RM-mapping chapter maps COMPOSITION
# and no demographic PARTY root (master05-rm_mapping.adoc), and the header that
# names the template on a Simplified commit is scoped by a MUST to one class
# (Requests_and_responses.md §openehr-template-id: "MUST be used whenever
# committing COMPOSITION … using a Simplified Format") and is declared by none
# of the party create/update operations. A FLAT party commit therefore has no
# way to identify the template its field identifiers would come from. Register
# AMB-128 carries the adjudication.
#
# One behaviour per case: the body is the same valid PERSON the happy-path
# create uses, so only the declared payload media type distinguishes the
# exchange.
id: I_DEMOGRAPHIC_SERVICE.create_party-simplified_content_type
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview negotiation rules + the Simplified Formats sub-specification; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party create declaring a Simplified Formats payload media type is refused
  as unsupported_media; no party is created.
description: "Party create with a Simplified Formats Content-Type (415)"
spec_refs:
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "ITS-REST simplified_formats master02 §Overview"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: create_party
    format: wt-flat                      # declares Content-Type: application/openehr.wt.flat+json
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: unsupported_media            # Resources.md §Simplified Formats MUST
# No postcondition: the refusal IS the whole behaviour, and the request carries
# no identifier a follow-up read could address, so any "nothing was committed"
# assertion would have to invent one. One behaviour per case.
