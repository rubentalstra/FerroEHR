# The SEMANTIC (422-class) twin of update_party_relationship-invalid_body:
# keeps the operation's validation_failed branch exercised after the
# structural refusals moved to the 400 parse class (owner ruling 2026-08-03).
id: I_DEMOGRAPHIC_SERVICE.update_party_relationship-root_identity_mismatch
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY_RELATIONSHIP.update_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY_RELATIONSHIP operation semantics (declared meaning + Errors); master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  A relationship update whose body converts to the resource but carries an
  archetype root identity mismatch is refused as a semantic error (the 422
  class), and no new VERSION is created.
description: "Update a PARTY_RELATIONSHIP (root identity mismatch, 422)"
spec_refs:
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.update_party_relationship"
  - "RM common UML/classes/org.openehr.rm.common.locatable.adoc §Attributes"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1, cnf.demographic.party_relationship.root_identity_mismatch]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party_relationship
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party_relationship: "${ds:cnf.demographic.party_relationship.root_identity_mismatch}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: validation_failed            # the 422 semantic class — converts, then fails the invariant pass
  - step: 3                              # the stored relationship is untouched
    call: I_PARTY_RELATIONSHIP.get_party_relationship
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "uid/value", equals: "${preceding_version_uid}" }
postconditions:
  - { assert: version, count: 1 }
