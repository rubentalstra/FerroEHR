# A PARTY_RELATIONSHIP has TWO modelled representations, and no released text
# reconciles them — register AMB-187 carries the adjudication, this case pins
# the half that rides inside a PARTY.
#
# THE BY-VALUE REPRESENTATION IS RM-NORMATIVE. RM demographic
# docs/demographic/master02-demographic_package.adoc §Party Relationships (L44):
# "`PARTY_RELATIONSHIPs` are stored as part of the data of the `PARTY`
# designated as the source. This means that the relationships attribute is by
# value, while the `PARTY_RELATIONSHIP._source_` and `_target_` are represented
# by references. The actual kind of reference is via the use of `OBJECT_REFs`
# containing `HIER_OBJECT_IDs` to denote the Version container of a Party,
# rather than `OBJECT_VERSION_IDs`". §Versioning Semantics (L48): "A Version of
# a `PARTY` includes all the compositional parts, such as identities, contacts,
# Party relationships of which it is the source." So an inline `relationships`
# member is ordinary party content: it must be ACCEPTED and it must come back
# as committed, like every other compositional part.
#
# THE CONTAINER REPRESENTATION IS SM-NORMATIVE, AND SEPARATE. SM
# UML/classes/i_party_relationship.adoc keys all six operations by
# `a_versioned_party_rel_id`, has `update_party_relationship` "Cause[] server-
# side creation of a new `ORIGINAL_VERSION` and `CONTRIBUTION`", and declares
# `versioned_object_does_not_exist` — an independently-addressed version
# container. The RM declares no `VERSIONED_PARTY_RELATIONSHIP` class for it.
#
# WHAT THIS CASE ASSERTS, AND WHY THE NEGATIVE HALF IS NOT HERE. The inline list
# survives the commit unchanged: the created PERSON reads back with the same
# one-element `relationships` list, the same relationship `name`, and `source` /
# `target` PARTY_REFs whose ids are the container HIER_OBJECT_IDs L44 requires —
# no rewriting, no re-pointing, no dropping. The disjointness that AMB-187 fixes
# is the other direction of the same fact: committing this party does NOT mint a
# relationship container, so nothing here addresses one. That negative is not
# expressible as an assertion on this route — a container id that was never
# minted cannot be named in a request — so it is stated by the register and by
# the absence of any provisioning here, and the container half is exercised by
# the create_party_relationship battery instead. This case is the by-value half
# only, per one-behaviour-per-case.
#
# THE REFERENTS ARE FIXED LITERALS and are not asserted to resolve: nothing
# released requires a demographic reference to name an existing party (the same
# authoring choice cnf.demographic.party_relationship.v1 and
# cnf.demographic.role.v1 already make). `PARTY.Relationships_validity`'s
# source-identity arm (`r.source = self`) is therefore NOT the subject here: the
# create body carries no uid for a server to compare a source against, and the
# identifier that would satisfy it is minted by this very request.
id: I_DEMOGRAPHIC_SERVICE.create_party-inline_relationships_verbatim
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
ambiguities: [AMB-187]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM demographic master02 §Party Relationships + §Versioning Semantics contrasted with SM i_party_relationship.adoc; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party committed with an inline PARTY_RELATIONSHIP in its `relationships`
  list is accepted, and that by-value relationship is served back verbatim as
  part of the party's content — the representation the RM makes compositional
  data of the source party, held separately from the service-managed
  relationship containers.
description: "Party create with an inline by-value relationship (served verbatim)"
spec_refs:
  - "RM demographic master02 §Party Relationships (relationships by value; source/target are OBJECT_REFs over HIER_OBJECT_IDs)"
  - "RM demographic master02 §Versioning Semantics (a PARTY Version includes the relationships it is the source of)"
  - "RM demographic §PARTY (relationships: List<PARTY_RELATIONSHIP>; Relationships_validity)"
  - "SM openehr_platform §I_PARTY_RELATIONSHIP (the independently-versioned container representation)"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.inline_relationships]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.inline_relationships}" }
    expect: created                      # by-value relationships are ordinary PARTY content
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
      # the by-value list survives the commit, unchanged and unexpanded:
      # exactly the one member that was committed, no more
      - { assert: field, path: "relationships[0]/_type", equals: "PARTY_RELATIONSHIP" }
      - { assert: field, path: "relationships[1]", absent: true }
      - { assert: field, path: "relationships[0]/name/value", equals: "inline relationship" }
      - { assert: field, path: "relationships[0]/archetype_node_id", equals: "openEHR-DEMOGRAPHIC-PARTY_RELATIONSHIP.relationship.v1" }
      # "OBJECT_REFs containing HIER_OBJECT_IDs ... rather than OBJECT_VERSION_IDs"
      - { assert: field, path: "relationships[0]/source/id/_type", equals: "HIER_OBJECT_ID" }
      - { assert: field, path: "relationships[0]/source/id/value", equals: "11111111-1111-4111-8111-111111111111" }
      - { assert: field, path: "relationships[0]/target/id/_type", equals: "HIER_OBJECT_ID" }
      - { assert: field, path: "relationships[0]/target/id/value", equals: "22222222-2222-4222-8222-222222222222" }
postconditions:
  - { assert: version, count: 1 }
  - { assert: version, of: "${version_uid}", change_type: CREATE }
