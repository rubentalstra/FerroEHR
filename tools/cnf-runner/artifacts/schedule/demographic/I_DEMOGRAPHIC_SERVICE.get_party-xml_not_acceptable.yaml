# The REFUSAL arm of the PARTY family's canonical-XML question (register
# AMB-167): a server that does not serve the demographic party resources in XML
# answers the unfulfillable `Accept` with 406 rather than with a representation
# the client did not ask for.
#
# Decisive released sentences (ITS-REST overview Resources.md §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to
# specify the expected XML response format. If the service cannot fulfill this
# aspect of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`." Corroborated by docs/overview/Requests_and_responses.md §"HTTP
# status codes", row `406 Not Acceptable`: "The target resource does not have a
# current representation that would be acceptable to the user".
#
# WHY THIS IS AN ARM AND NOT A UNIVERSAL RULE: §"Data representation" leaves
# canonical XML to the service ("Services MUST support at least one of the
# openEHR **XML** or **JSON** canonical formats"), and the published XSDs
# declare no document element for any demographic party type — PERSON and its
# siblings are LOCATABLE-derived complexTypes in ITS-XML RM Demographic.xsd, so
# only the generic abstract `items` root could carry them, and no released
# sentence assigns that root here. Serving the resource in XML under a root
# name no released sentence assigns is therefore as conformant as refusing it,
# and neither may be asserted of every server. The opposite arm is the mirror
# case I_DEMOGRAPHIC_SERVICE.get_party-xml, gated on `party-xml-supported`.
# One option covers all five party types: the demographic routes share one
# binding family and one document question.
#
# No format axis: this row asserts the refusal discipline itself, which is
# judged on a party regardless of its XML technology profile.
id: I_DEMOGRAPHIC_SERVICE.get_party-xml_not_acceptable
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
option: party-xml-unsupported          # AMB-167 option_select branch
ambiguities: [AMB-167]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "Whether the demographic party resources are served in canonical XML is statement-declared, not spec-mandated — the published XSDs declare no document element for PERSON or its siblings and ITS-REST overview Resources.md §Data representation leaves the format to the service, so offering and refusing are both conformant (register AMB-167)"
test_purpose: >-
  On a server that declares no canonical-XML support for the demographic party
  resources, a PARTY read requested with `Accept: application/xml` is refused
  with 406 rather than answered in a representation the client did not accept.
description: "Get a PARTY with Accept: application/xml on an XML-less PARTY resource (406)"
spec_refs:
  - "SM openehr_platform §I_PARTY.get_party"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    format: canonical-json             # precondition only — the XML branch under test is step 2
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_party
    format: canonical-xml              # the unfulfillable Accept
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: not_acceptable
