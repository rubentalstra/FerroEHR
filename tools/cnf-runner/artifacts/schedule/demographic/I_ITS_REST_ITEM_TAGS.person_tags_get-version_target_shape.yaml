# A VERSION-addressed PARTY tag carries `target` as the bare OBJECT_VERSION_ID
# of the addressed VERSION — the other form of the one RM shape rule.
#
# GROUND: RM common item_tag.adoc §Attributes, `target`: `1..1 UID_BASED_ID`,
# "Identifier of target, which may be a `VERSIONED_OBJECT<T>` or a
# `VERSION<T>`". ITS-REST names the same form as the request addressing: "an
# OBJECT_VERSION_ID identifier taken from VERSION.uid.value (i.e. a
# `version_uid`) … used to get the tags of a particular (target) version of the
# PERSON version" (operations/person_tags_get.yaml). No released example
# anywhere shows a VERSION-targeted tag (register AMB-97), so the shape is read
# off the RM class that types the attribute.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported", ITS-REST overview Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag), so the `ItemTags` capability may never gate
# CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.person_tags_get-version_target_shape
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_ITEM_TAGS.person_tags_get
capabilities: [ItemTags]
exercises: [DemographicApi, PartyOperations]
profiles: [OPTIONS]
ambiguities: [AMB-202]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A VERSION-addressed PERSON tag serves target as the bare OBJECT_VERSION_ID of
  the addressed version, with no OBJECT_REF wrapper.
description: "PERSON version tag: target is a bare OBJECT_VERSION_ID"
spec_refs:
  - "RM item_tag.adoc §Attributes"
  - "RM common master07-tags.adoc §Class Descriptions"
  - "ITS-REST person_tags_get.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
formats: [canonical-json]
requires: { server: any }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
  - step: 2
    call: I_ITS_REST_ITEM_TAGS.person_tags_update
    with:
      uid_based_id: "${version_uid}"
      tags:
        - { key: "shape" }
    expect: updated
  - step: 3
    call: person_tags_get
    with: { uid_based_id: "${version_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/target/value", equals: "${version_uid}" }
      - { assert: field, path: "[0]/target/id", absent: true }
