# master10 case "aaaa" under I_DEMOGRAPHIC_SERVICE.get_party_at_version() — the
# schedule entry is TBD; authored as the success/happy path from the SM operation
# semantics. Resolvable SM operation is I_PARTY.get_party_at_version. The PARTY version is created in-flow so its
# version_uid is known.
id: I_DEMOGRAPHIC_SERVICE.get_party_at_version-aaaa
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party_at_version
capabilities: [PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY operation semantics (declared meaning + Errors) + released ITS-REST demographic docs; master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
test_purpose: >-
  get_party_at_version for a known PARTY version id returns that version.
description: "Get an existing PARTY at version (success)"
spec_refs:
  - "SM openehr_platform §I_PARTY.get_party_at_version"
  - "CNF platform_test_schedule master10 §get_party_at_version"
  - "RM demographic §PARTY"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_party_at_version
    with: { version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
