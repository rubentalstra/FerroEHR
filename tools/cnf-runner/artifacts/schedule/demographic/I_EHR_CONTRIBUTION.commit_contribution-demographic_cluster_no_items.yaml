# A present-but-empty `CLUSTER.items` is refused at the demographic
# CONTRIBUTION seam (issue #1939: the no_items matrix drove parties only
# through the direct create/update routes, leaving this lane's refusal
# class unpinned).
#
# WHAT MAKES THE PAYLOAD INVALID (one defect): the BMM declares
# `CLUSTER.items` at cardinality 1..* — a MANDATORY NON-EMPTY container
# (RM `UML/classes/org.openehr.rm.data_structures.cluster.adoc`
# §Attributes) — so a present-but-empty list is the one shape the bound
# forbids.
#
# WHICH BRANCH: a mandatory non-empty list cannot be constructed empty, so
# the body never converts to the resource — the 400 parse-refusal class,
# exactly as adjudicated for the direct demographic routes (#1933) and the
# EHR contribution lane.
#
# The route realizes NO SM operation (register AMB-136); the
# I_EHR_CONTRIBUTION anchor with variant `demographic` is the AMB-127
# catalogue naming convention.
id: I_EHR_CONTRIBUTION.commit_contribution-demographic_cluster_no_items
kind: functional
component: DEMOGRAPHIC
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "the demographic CONTRIBUTION routes realize no SM operation — SM openehr_platform master06-demographic_service.adoc defines no contribution interface (register AMB-136); the I_EHR_CONTRIBUTION anchor with variant `demographic` is a catalogue naming convention, never an SM claim"
test_purpose: >-
  A demographic CONTRIBUTION whose PARTY carries a present-but-empty
  CLUSTER.items is refused in the parse class (400), and no contribution or
  party is created.
description: "Commit a demographic CONTRIBUTION with an empty CLUSTER.items (parse refusal)"
spec_refs:
  - "RM data_structures cluster.adoc §Attributes (items 1..1, cardinality 1..* — the BMM-declared non-empty bound; the OAS required keyword does not state it)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
data_sets: [cnf.demographic.agent.cluster_no_items]
flow:
  - step: 1
    call: commit_contribution
    variant: demographic
    with:
      versions:
        - { data: "${ds:cnf.demographic.agent.cluster_no_items}", change_type: creation }
    expect: bad_request
