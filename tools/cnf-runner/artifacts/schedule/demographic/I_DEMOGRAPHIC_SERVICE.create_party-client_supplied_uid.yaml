# A party create whose BODY carries a `uid`. The released party create has no
# branch for it — it declares no conflict response and no sentence says whether
# a supplied uid is honoured, ignored, or refused — while the CONTRIBUTION
# create states the rule for the same shape and the party UPDATE states a
# match rule. Register AMB-132 carries the adjudication: server-minted identity
# wins and the body value does not survive.
#
# The ground is RM demographic master02-demographic_package.adoc §Party
# Identification — "Identifiers of Party instances in the system are provided
# in the same way as identifiers of Compositions in the EHR: via the `_uid_`
# attribute (type `OBJECT_VERSION_ID`) of the containing `VERSION`" — read with
# RM common master06-change_control_package.adoc §Version Identification, whose
# `object_id()` part "is a copy of the `_uid_` of the owning `VERSIONED_OBJECT`".
# The value a client could supply is therefore the identifier of a version
# container that does not exist until this very request creates one, so there
# is nothing for the client value to be the identifier OF.
#
# What is OBSERVABLE, and all this case asserts: the create is accepted (no
# released branch refuses it), and the served uid is the identifier the
# create's own `ETag` named — not the one the body carried. Step 3 makes the
# negative half concrete: the client's own value addresses nothing.
id: I_DEMOGRAPHIC_SERVICE.create_party-client_supplied_uid
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM demographic master02 §Party Identification + RM common master06 §Version Identification; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party create carrying a client-chosen uid succeeds, and the created party's
  identity is the server-minted version identifier; the client's value does not
  survive and addresses nothing.
description: "Party create with a client-supplied uid (server identity wins)"
spec_refs:
  - "RM demographic master02 §Party Identification"
  - "RM common §change_control (master06 §Version Identification)"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.client_uid]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.client_uid}" }
    expect: created                      # no released branch refuses a body uid on the create
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # the served identity is the server's
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
      - { assert: field, path: "uid/value", equals: "${version_uid}" }
  - step: 3                              # the client's value addresses nothing
    call: I_PARTY.get_party
    with: { versioned_object_uid: "3b6c9f18-0000-4000-8000-0000000004c1" }
    expect: not_found
postconditions:
  - { assert: version, count: 1 }
