# The demographic twin of the EHR-side one-commit change-type matrix: on a
# FIRST commit into an empty demographic repository, every change_type other
# than creation needs a previous commit it does not have, and a creation
# carrying the deleted lifecycle contradicts itself.
#
# The grounds are the change-control model, not a route rule. RM common
# master06-change_control_package.adoc §Contributions enumerates how each
# logical change is achieved by committing new Versions, and §Logical Deletion
# fixes what a deletion IS: "create a new Version in the normal way; delete its
# `_data_`; set the `_lifecycle_state_` value to the code for `deleted`; commit
# in the normal way" — a procedure that presupposes a previous Version. RM
# common master04 (`AUDIT_DETAILS.Change_type_valid`) binds the change_type
# codes to the openEHR Audit Change Type vocabulary: 249|creation|,
# 250|amendment|, 251|modification|, 523|deleted|; the lifecycle codes are
# 532|complete| and 523|deleted| (master06 §Version Lifecycle).
#
# The refusal status follows the released table (ITS-REST
# specifications/docs/overview/Requests_and_responses.md §HTTP status codes):
# the envelope is well-formed and its members parse, so the failure is semantic
# — row 422, "The request was well-formed but was unable to be followed due to
# semantic errors" — while the structurally-mismatched modification-type shapes
# fall under row 400, "malformed request syntax, syntactically invalid
# content". The binding's `validation_failed` outcome carries both, exactly as
# the EHR-side binding does, because no released sentence splits them
# per-shape.
#
# Each row commits a PRE-BUILT ORIGINAL_VERSION member so the change_type ×
# lifecycle_state pair is controlled independently; no preceding_version_uid is
# sent — this IS the first commit.
id: I_EHR_CONTRIBUTION.commit_contribution-demographic_invalid_change_types
kind: functional
component: DEMOGRAPHIC
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [PartyOperations, DemographicApi]
exercises: [Versioning]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "the demographic CONTRIBUTION routes realize no SM operation — SM openehr_platform master06-demographic_service.adoc defines no contribution interface (register AMB-136); the I_EHR_CONTRIBUTION anchor with variant `demographic` is a catalogue naming convention, never an SM claim"
test_purpose: >-
  On the first demographic commit, a single-version CONTRIBUTION whose member
  carries a non-creation change_type, or a deleted lifecycle_state, is
  rejected; nothing is created.
description: "First demographic commit: non-creation change types and deleted lifecycle rejected"
spec_refs:
  - "RM common §change_control (master06 §Contributions; §Logical Deletion; §Version Lifecycle)"
  - "RM common §change_control (AUDIT_DETAILS Change_type_valid)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
parameters:
  iteration: reset_per_row
  matrix:
    columns: [change_code, change_label, life_code, life_label]
    rows:
      - ["250", "amendment", "532", "complete"]
      - ["251", "modification", "532", "complete"]
      - ["523", "deleted", "532", "complete"]
      - ["249", "creation", "523", "deleted"]
flow:
  - step: 1
    call: commit_contribution
    variant: demographic
    with:
      versions:
        - data:
            _type: ORIGINAL_VERSION
            lifecycle_state:
              _type: DV_CODED_TEXT
              value: "${row.life_label}"
              defining_code:
                _type: CODE_PHRASE
                terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                code_string: "${row.life_code}"
            commit_audit:
              _type: AUDIT_DETAILS
              committer: { _type: PARTY_IDENTIFIED, name: "cnf runner" }
              change_type:
                _type: DV_CODED_TEXT
                value: "${row.change_label}"
                defining_code:
                  _type: CODE_PHRASE
                  terminology_id: { _type: TERMINOLOGY_ID, value: openehr }
                  code_string: "${row.change_code}"
            data: "${ds:cnf.demographic.person.v1}"
    expect: validation_failed
postconditions:
  - { assert: version, count: 0 }
