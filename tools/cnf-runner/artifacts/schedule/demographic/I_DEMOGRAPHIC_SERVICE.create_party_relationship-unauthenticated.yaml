# The AUTHENTICATION boundary of the PARTY_RELATIONSHIP surface.
#
# VERIFIED FIRST-HAND 2026-07-29 before authoring: the fifteen existing
# PartyRelationshipOperations rows cover create / read / read-at-time /
# read-at-version / update / delete and their precondition families, and NOT
# ONE of them addresses a principal — no `on:` selector appears anywhere in the
# battery. So the refusal-by-principal class was genuinely absent, not merely
# spread thin, and this row and its `-readonly_forbidden` sibling close it.
#
# One behaviour, swept across the CRUD routes the capability serves, the way
# SEC-AUTHENTICATED_ACCESS sweeps the core operations: the property is
# route-table-wide, so four cases would say it four times.
#
# EXTENSION ROUTES (register AMB-32): the outcome mapping is UNIVERSAL, not
# per-binding (vocab/selectors.yaml universal_outcomes: unauthenticated -> 401,
# route-table-wide). The refusal is the served routes' own documented contract
# (each `#[utoipa::path]` declares the 401 branch); no openEHR spec governs
# these routes.
id: I_DEMOGRAPHIC_SERVICE.create_party_relationship-unauthenticated
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  Every PARTY_RELATIONSHIP route refuses a request that carries no valid
  authentication — create, read, update and delete alike, and regardless of
  whether the addressed relationship exists.
description: "Unauthenticated requests to the PARTY_RELATIONSHIP routes are refused"
spec_refs:
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party_relationship"
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.get_party_relationship"
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.update_party_relationship"
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.delete_party_relationship"
applies: { rm: ">=1.0.2" }
requires: { server: any }
data_sets: [cnf.demographic.party_relationship.v1]
flow:
  - step: 1
    call: create_party_relationship
    on: unauthenticated
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: unauthenticated              # universal 401 (route-table-wide)
  - step: 2
    call: I_PARTY_RELATIONSHIP.get_party_relationship
    on: unauthenticated
    with: { versioned_object_uid: "11111111-1111-4111-8111-111111111111" }
    expect: unauthenticated
  - step: 3
    call: I_PARTY_RELATIONSHIP.update_party_relationship
    on: unauthenticated
    with:
      versioned_object_uid: "11111111-1111-4111-8111-111111111111"
      preceding_version_uid: "11111111-1111-4111-8111-111111111111::example.openehr.systemid::1"
      party_relationship: "${ds:cnf.demographic.party_relationship.v1}"
    expect: unauthenticated
  - step: 4
    call: I_PARTY_RELATIONSHIP.delete_party_relationship
    on: unauthenticated
    with:
      version_uid: "11111111-1111-4111-8111-111111111111::example.openehr.systemid::1"
    expect: unauthenticated
