# DEMOGRAPHIC ARCHETYPE VALIDATION — the mandatory-attribute arm.
#
# RM demographic UML/classes/org.openehr.rm.demographic.party_identity.adoc
# §Attributes declares `1..1 details: ITEM_STRUCTURE`. An identity without it
# has no value at all — the class exists to carry that structure — so a PARTY
# whose identity omits it is not a legal instance of the model the demographic
# archetypes constrain.
#
# DECISIVE DOCS TEXT for the wire (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim): "The
# request was well-formed but was unable to be followed due to semantic
# errors." The JSON is well-formed and carries no unknown attribute; a
# mandatory one is simply absent, which is the semantic half of the table.
id: I_DEMOGRAPHIC_SERVICE.create_party-identity_details_missing
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A committed PARTY whose PARTY_IDENTITY carries no details (the model
  declares details 1..1) cannot be constructed and is refused as malformed
  content (the 400 parse class).
description: "Commit a PARTY whose identity carries no details (422)"
spec_refs:
  - "RM demographic §PARTY_IDENTITY (details: ITEM_STRUCTURE, 1..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "CNF profiles master03-profiles.adoc §Functional (Demographic Persistence: Archetype validation)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.person.identity_details_missing]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.identity_details_missing}" }
    expect: bad_request                  # the 400 parse class (overview Requests_and_responses §HTTP status codes 400 row; typed construction refuses — owner ruling 2026-08-03)
