# The ADDRESSING twin of the wrong-subtype body: a `uid_based_id` that names a
# version container which EXISTS but holds another PARTY kind. Step 1 creates a
# PERSON; step 2 addresses its `versioned_object_uid` through the ORGANISATION
# route family.
#
# The identifier is well-formed and resolves to a real container, so this is
# not the malformed-identifier branch (register AMB-76). It is a miss, because
# RM common master06-change_control_package.adoc §Typing makes a version
# container SINGLE-TYPED — "This ensures that all versions in a given
# `VERSIONED_OBJECT` are of the same type, such as `COMPOSITION`, `FOLDER`, or
# `PARTY` and that the version container itself is properly typed" — with RM
# demographic master02 §Versioning Semantics adding "Every Party is stored in
# its own Version container". An ORGANISATION with that uid therefore does not
# exist, which is the 404 row of the released status table verbatim (ITS-REST
# specifications/docs/overview/Requests_and_responses.md §HTTP status codes):
# "The origin service did not find the target resource or is not willing to
# disclose that one exists." Register AMB-131 carries the adjudication.
#
# Step 3 keeps the refusal honest: the PERSON is untouched and still readable
# through its own route, so the 404 is a route-scope decision and not a
# deletion.
id: I_DEMOGRAPHIC_SERVICE.get_party-wrong_kind_container
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM common master06 §Typing + the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party read addressing an existing version container through the route
  family of a DIFFERENT PARTY kind is a miss, and leaves the stored party
  readable through its own route.
description: "Party read through the wrong kind's route family (404)"
spec_refs:
  - "RM common §change_control (master06 §Typing)"
  - "RM demographic master02 §Versioning Semantics"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_PARTY.get_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: get_party
    variant: organisation                # GET /demographic/organisation/{uid_based_id}
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: not_found                    # RM master06 §Typing — no ORGANISATION container has that uid
  - step: 3                              # the party itself is untouched
    call: get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
postconditions:
  - { assert: version, count: 1 }
