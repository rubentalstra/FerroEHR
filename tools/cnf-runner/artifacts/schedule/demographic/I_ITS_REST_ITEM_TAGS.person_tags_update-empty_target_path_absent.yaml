# An empty-string `target_path` on a posted PARTY tag is stored and served as
# ABSENT — the demographic arm of register AMB-96, whose handling is fixed
# "identically on the EHR and demographic families".
#
# WHY THE DEMOGRAPHIC ARM IS THE SHARPER ONE: the released examples that write
# `target_path: ""` are FIVE demographic schemas
# (schemas/demographic/ItemTagOf{Person,Agent,Group,Organisation,Role}.yaml)
# plus schemas/ehr/ItemTagOfEhrStatus.yaml; the only released example carrying
# a real path is the COMPOSITION one. A client following the demographic
# examples emits `""` as a matter of course, so this is the family where the
# normalization actually bites.
#
# THE GROUND. `target_path` is half the ITEM_TAG identity ("uniquely
# identified by their `key` and `target_path` pair attributes" — ITS-REST
# overview Requests_and_responses.md §openehr-item-tag and
# openehr-version-item-tag, repeated verbatim in
# operations/person_tags_update.yaml), and the RM types it `String[0..1]` with
# no non-empty invariant (RM
# UML/classes/org.openehr.rm.common.item_tag.adoc §Attributes / §Invariants —
# the invariants cover `key` and `value` only). Nothing released says whether
# `""` is a path or no path; AMB-96 fixes it: "`\"\"` normalizes to ABSENT at
# the service seam — one identity, not two; served tags never carry an empty
# target_path."
#
# The DELETE step is the consequence: the released delete route carries only
# `{key}`, so a tag whose stored path were `""` rather than absent must still
# be reachable — this pins that it is, on the demographic seam.
#
# The EHR-family arm is
# I_ITS_REST_ITEM_TAGS.composition_tags_update-empty_target_path_absent.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.person_tags_update-empty_target_path_absent
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_ITEM_TAGS.person_tags_update
capabilities: [ItemTags]
exercises: [DemographicApi, PartyOperations]
profiles: [OPTIONS]
ambiguities: [AMB-96]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A PARTY tag posted with an empty-string target_path — the spelling the
  released demographic examples use — is served with no target_path at all and
  stays addressable by the key-scoped DELETE.
description: "PERSON tag with target_path \"\" is stored as absent"
spec_refs:
  - "RM item_tag.adoc §Attributes"
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST person_tags_update.yaml §requestBody"
  - "ITS-REST person_tags_delete.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
formats: [canonical-json]
requires: { server: any }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: person_tags_update
    with:
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "alpha", value: "a", target_path: "" }   # the spelling the released PERSON example uses
    expect: updated
  - step: 3
    call: I_ITS_REST_ITEM_TAGS.person_tags_get
    with: { uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "alpha" }
      - { assert: field, path: "[0]/target_path", absent: true }   # normalized away, never served as ""
      - { assert: field, path: "[1]", absent: true }
  - step: 4                                       # and it is reachable by the key-only DELETE route
    call: I_ITS_REST_ITEM_TAGS.person_tags_delete
    with: { uid_based_id: "${versioned_object_uid}", key: "alpha" }
    expect: deleted
  - step: 5
    call: I_ITS_REST_ITEM_TAGS.person_tags_get
    with: { uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
