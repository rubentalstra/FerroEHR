# The ACCEPTING twin of the ROLE UPDATE route: a well-formed ROLE committed
# behind a correct If-Match creates a new version.
#
# WHY THE ROUTE NEEDS ITS OWN ACCEPTANCE: the three refusal cases on this same
# variant (identities_empty / contact_addresses_empty /
# cluster_no_items) would all pass against a server that answered 400 to
# EVERY ROLE update — including well-formed ones. This case is what makes the
# refusals mean "the empty list was refused" rather than "the route is
# broken".
#
# The route is released: the OAS declares `operations/role_update.yaml`
# alongside `person_update.yaml`, with 200 on success (204 under
# `Prefer: return=minimal`).
id: I_DEMOGRAPHIC_SERVICE.update_party-role_valid
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A well-formed ROLE update behind a correct If-Match is accepted and commits
  a second version of the same container.
description: "Update a ROLE with a valid body (200)"
spec_refs:
  - "SM openehr_platform §I_PARTY.update_party"
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "RM demographic §ROLE"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.role.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    variant: role
    with: { party: "${ds:cnf.demographic.role.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: update_party
    variant: role
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.role.v1}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
postconditions:
  - { assert: version, count: 2 }
