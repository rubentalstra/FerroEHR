# The `Prefer: return=minimal` verbosity branch of the party create.
#
# The status/body pair comes from register AMB-62's re-adjudication, which
# WITHDREW the former position that this branch had no assertable status: the
# docs text states two answers and settles on neither, so the released OAS fills
# the silence per operation family — `operations/person_create.yaml` declares
# one success status and `responses/201_PERSON.yaml` closes "If the `Prefer`
# header is missing or set to `return=minimal`, the body is empty". Created,
# with nothing in the body.
#
# The `Location` SHOULD from the docs text (§Prefer minimal — "The response
# SHOULD include a `Location` header pointing to the newly created or updated
# resource") is executed by the variant binding, and step 2 dereferences the
# identity the empty-bodied response carries.
id: I_DEMOGRAPHIC_SERVICE.create_party-prefer_minimal
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
ambiguities: [AMB-62]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview Prefer sections + the demographic operation/response files; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party create sent with Prefer: return=minimal answers the created status
  with an empty body and a Location header addressing the new resource.
description: "Prefer: return=minimal honoured on PARTY create"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
formats: [canonical-json]
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: create_party
    variant: return_minimal              # pins Prefer: return=minimal
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created                      # 201 with an empty body
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2                              # the identity the empty-bodied response carries addresses the PARTY
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
postconditions:
  - { assert: version, count: 1 }
