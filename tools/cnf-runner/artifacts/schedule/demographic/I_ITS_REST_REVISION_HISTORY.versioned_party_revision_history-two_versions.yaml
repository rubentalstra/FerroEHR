# The PARTY revision history after two commits — the demographic twin of the two
# EHR-side revision-history cases. Same RM resource, same ordering rule; only
# the container family differs.
#
# WHAT THE SERVED RESOURCE MUST BE (RM common
# UML/classes/org.openehr.rm.common.revision_history.adoc §Attributes): `items`
# is a `List<REVISION_HISTORY_ITEM>` at 1..1; RM common
# UML/classes/org.openehr.rm.common.revision_history_item.adoc §Attributes gives
# each item `version_id: OBJECT_VERSION_ID [1..1]` and `audits:
# List<AUDIT_DETAILS> [1..1]` with the invariant `Audit_valid: not
# audits.is_empty`.
#
# THE ORDER IS THE RM'S: the class table's Purpose row ("most-recent-first") and
# its `items` Meaning ("most-recent-last") contradict each other, and the two
# function postconditions settle it on `items.last`. Oldest-first on the wire;
# register AMB-68 carries the adjudication and UPR-30 the upstream report.
#
# ANCHOR: `I_ITS_REST_REVISION_HISTORY` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation. Register AMB-136 records why this
# route in particular has no SM home: `I_PARTY` declares no revision-history
# operation and no container read. That entry left the route unanchored, which
# PRE-DATES the AMB-161 mechanism; the re-adjudication of 2026-07-28 extends the
# mechanism here, and the operation is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs).
id: I_ITS_REST_REVISION_HISTORY.versioned_party_revision_history-two_versions
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_REVISION_HISTORY.versioned_party_revision_history
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
ambiguities: [AMB-68, AMB-161]   # AMB-161 = the pseudo-interface anchor (fixed_handling — gates); the SM-gap report AMB-136 stays header-cited only (finding 8, 2026-07-28)
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM REVISION_HISTORY class table + the released ITS-REST demographic operation files; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  The VERSIONED_PARTY revision history lists one item per committed version,
  oldest first, each naming its version and carrying a commit audit.
description: "PARTY revision history after two commits"
spec_refs:
  - "RM common §revision_history (items 1..1; the items.last postconditions)"
  - "RM common §revision_history_item (version_id / audits; Audit_valid)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      v1_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # the second revision, so the history has an order to get wrong
    call: I_PARTY.update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "${v1_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: versioned_party_revision_history
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: REVISION_HISTORY }
      # oldest first — the items.last postconditions (AMB-68)
      - { assert: field, path: "items[0]/version_id/value", equals: "${v1_uid}" }
      - { assert: field, path: "items[1]/version_id/value", equals: "${v2_uid}" }
      - { assert: field, path: "items[2]", absent: true }
      # "there will always be at least one commit audit" (Audit_valid)
      - { assert: field, path: "items[0]/audits[0]/time_committed/value", exists: true }
      - { assert: field, path: "items[1]/audits[0]/time_committed/value", exists: true }
postconditions:
  - { assert: version, count: 2 }
