# A container-addressed PARTY tag carries `target` as the BARE RM UID_BASED_ID
# — the same one RM class the EHR side serves — and `owner_id` in the shape the
# five released demographic examples show.
#
# TARGET: RM common item_tag.adoc §Attributes types `target` `1..1
# UID_BASED_ID` ("Identifier of target, which may be a `VERSIONED_OBJECT<T>` or
# a `VERSION<T>`"). ITEM_TAG is ONE class, so the served shape cannot differ by
# space. The released OAS ItemTag schema types `target` as the OBJECT_REF-shaped
# `UObjectRefOfUidBasedId` and every ItemTagOf<Party> example writes a
# `{id, namespace, type}` triple — a released OAS-vs-RM divergence in which the
# RELEASED RM wins. `target/id` ABSENT is the discriminator: an OBJECT_REF
# wrapper necessarily carries `id`, a bare UID_BASED_ID never can.
#
# OWNER_ID: `owner_id` IS `1..1 OBJECT_REF` per the same RM class, but its
# Meaning is only the gloss "Identifier of owner object, such as EHR", and the
# RM demographic package declares NO tag containment at all — so outside an EHR
# the release states no owner. Register AMB-137 fixes the handling on the only
# released signal there is: all five demographic ItemTagOf<T> examples give
# `owner_id` an OBJECT_REF with `namespace: local` and `type: SYSTEM`. That is
# what this case asserts, and it is the exact assertion the register's
# disposition binds the catalogue to.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported", ITS-REST overview Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag), so the `ItemTags` capability may never gate
# CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.person_tags_get-container_target_shape
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_ITEM_TAGS.person_tags_get
capabilities: [ItemTags]
exercises: [DemographicApi, PartyOperations]
profiles: [OPTIONS]
ambiguities: [AMB-137, AMB-202]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A container-addressed PERSON tag serves target as the bare HIER_OBJECT_ID of
  the addressed VERSIONED_PARTY, with no OBJECT_REF wrapper, and owner_id in
  the released local/SYSTEM shape.
description: "PERSON container tag: bare UID_BASED_ID target, local/SYSTEM owner_id"
spec_refs:
  - "RM item_tag.adoc §Attributes"
  - "RM common master07-tags.adoc §Class Descriptions"
  - "ITS-REST person_tags_get.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
formats: [canonical-json]
requires: { server: any }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_ITS_REST_ITEM_TAGS.person_tags_update
    with:
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "shape" }
    expect: updated
  - step: 3
    call: person_tags_get
    with: { uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/target/value", equals: "${versioned_object_uid}" }
      - { assert: field, path: "[0]/target/id", absent: true }   # no OBJECT_REF wrapper — RM types target UID_BASED_ID
      - { assert: field, path: "[0]/owner_id/namespace", equals: "local" }
      - { assert: field, path: "[0]/owner_id/type", equals: "SYSTEM" }
