# The demographic API is five parallel TYPED route families over one abstract
# class, so a body can name a different concrete PARTY subtype than the route
# it is posted to. This case posts a valid ROLE to `/demographic/person`.
#
# The request is well-formed JSON and a well-formed RM object — the same ROLE
# the kind-parity case commits successfully to its own route — so the 400 row
# does not describe it (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, row 400 verbatim: "malformed
# request syntax, syntactically invalid content"). What cannot be followed is
# the SEMANTIC contradiction between the resource the route creates and the
# class the body declares, which is the 422 row verbatim: "The request was
# well-formed but was unable to be followed due to semantic errors." Register
# AMB-131 carries the adjudication of this and of its addressing twin
# (a uid whose container holds another kind -> 404).
#
# One behaviour per case: nothing but the body's `_type` and the route's kind
# distinguish this exchange from a successful create.
id: I_DEMOGRAPHIC_SERVICE.create_party-wrong_subtype_body
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview status-code table + the RM demographic class model; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A body declaring a different concrete PARTY subtype than the addressed typed
  route cannot be converted to the addressed resource and is refused as
  malformed content (the 400 parse class); no party is created.
description: "Party create with a wrong-subtype body (ROLE on the PERSON route)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM demographic §PARTY"
  - "RM demographic §ROLE"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.role.v1]
flow:
  - step: 1
    call: create_party                   # the variant-less binding: POST /demographic/person
    with: { party: "${ds:cnf.demographic.role.v1}" }
    expect: bad_request                  # overview Requests_and_responses §HTTP status codes, the 400 row — the parse class (typed construction refuses; owner ruling 2026-08-03 on the strict commit seam)
# No postcondition: the refusal IS the whole behaviour, and the request carries
# no identifier a follow-up read could address. One behaviour per case.
