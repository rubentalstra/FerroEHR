# The miss branch of the two VERSIONED_PARTY VERSION reads: a well-formed but
# unknown selector under a KNOWN container. Step 2 asks for a version_uid that
# was never minted; step 3 asks for an instant BEFORE the container's first
# commit, when no version was extant.
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 404 row verbatim): "The
# origin service did not find the target resource or is not willing to disclose
# that one exists." Both selectors name a VERSION that does not exist; the
# container is present, so nothing here is the malformed-identifier branch
# (register AMB-76) and nothing is a precondition failure.
#
# The before-first-commit arm is the demographic twin of the composition
# `get_versioned_composition-at_time_before_first_version` case, and rests on
# the same RM sentence: `version_at_time (a_time): VERSION` carries
# `Pre: has_version_at_time (a_time)` (RM common
# UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions), so below
# the first commit there is no version to serve. Register AMB-70's fixed
# handling makes that arm the miss.
id: I_DEMOGRAPHIC_SERVICE.versioned_party_version_unknown
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party_at_version
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from RM common §versioned_object (has_version_at_time) + the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A VERSIONED_PARTY version read naming a version that does not exist — by uid,
  or by an instant before the container's first commit — is a miss.
description: "VERSIONED_PARTY version reads with an unknown selector (404)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "SM openehr_platform §I_PARTY.get_party_at_version"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
      t0: created.commit_time
  - step: 2                              # a version_uid that was never minted
    call: get_party_at_version
    variant: versioned_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "00000000-0000-4000-8000-00000000021f::openEHRSys.example.com::7"
    expect: not_found
  - step: 3                              # an instant before the first commit
    call: get_party_at_version
    variant: versioned_party_at_time
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_at_time: "${time:before(t0)}"
    expect: not_found
postconditions:
  - { assert: version, count: 1 }
