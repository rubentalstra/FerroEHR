# master10 case "bbbb" under I_DEMOGRAPHIC_SERVICE.create_party_relationship() —
# the schedule entry is TBD; authored as the primary declared-error path from the
# SM operation semantics (.Errors: definition_unknown, content_invalid).
#
# REALIZATION (#623, 2026-07-28): the released ITS surfaces no
# PARTY_RELATIONSHIP resource (register AMB-32), but the product serves the
# operation on a declared extension route, so this refusal is EXECUTED there.
# The refused content is spec-grounded regardless of the route: RM demographic
# §PARTY_RELATIONSHIP declares `source` and `target` as mandatory PARTY_REFs,
# and the fixture omits `target`.
id: I_DEMOGRAPHIC_SERVICE.create_party_relationship-bbbb
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY_RELATIONSHIP operation semantics (declared meaning + Errors); master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  Creating a PARTY_RELATIONSHIP from an invalid data set (no target) is rejected
  — the create_party_relationship content precondition fails (content_invalid),
  and no relationship is created.
description: "Create a new PARTY_RELATIONSHIP (content_invalid)"
spec_refs:
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party_relationship"
  - "CNF platform_test_schedule master10 §create_party_relationship"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.invalid]
flow:
  - step: 1
    call: create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.invalid}" }
    expect: bad_request                  # the 400 parse class (overview Requests_and_responses §HTTP status codes 400 row; typed construction refuses — owner ruling 2026-08-03)
postconditions:
  - { assert: version, count: 0 }
