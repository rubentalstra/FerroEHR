# The canonical-XML RESPONSE branch of get_party_at_time: the PARTY version
# current at a supplied instant, retrieved as canonical XML.
#
# Decisive released sentences (ITS-REST overview `Resources.md` §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to specify
# the expected XML response format. If the service cannot fulfill this aspect of
# the request, it MUST respond with HTTP status code `406 Not Acceptable`.
# Proper header `Content-Type: application/xml` MUST be present in the response
# of the service unless the response has no content body (HTTP status code
# `204`)." The binding's `Content-Type: negotiated` matcher executes that MUST
# against the `Accept` this step sends.
#
# BODY FLOOR — as on the sibling get_party-xml row: the published ITS-XML schema
# defines the PERSON complexType (RM Demographic.xsd) but declares no global
# element for it, so the release assigns no document ROOT NAME and the row
# asserts only that the payload is an XML document entity (RFC 7303 §3,
# "application/xml").
#
# §"Data representation" leaves XML support to the service, hence the
# `canonical-xml` format axis.
id: I_DEMOGRAPHIC_SERVICE.get_party_at_time-xml
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.get_party_at_time
capabilities: [PartyOperations]
profiles: [OPTIONS]
formats: [canonical-xml]               # tech-profile axis: XML-less parties are not judged by this row
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_DEMOGRAPHIC_SERVICE / I_PARTY operation semantics (declared meaning + Errors) + released ITS-REST demographic docs; master10 (DEMOGRAPHIC) is a stalled schedule stub (all cases TBD aaaa/bbbb) — a coverage guide only, not the authority"
test_purpose: >-
  get_party_at_time requested with `Accept: application/xml` returns the PARTY
  version current at the supplied time as an XML document typed
  `Content-Type: application/xml`.
description: "Get an existing PARTY at time as canonical XML"
spec_refs:
  - "SM openehr_platform §I_PARTY.get_party_at_time"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "RM demographic §PARTY"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    format: canonical-json             # precondition only — the XML branch under test is step 2
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
      t0: created.commit_time
  - step: 2
    call: get_party_at_time
    format: canonical-xml              # Accept: application/xml on a bodyless read
    with:
      versioned_object_uid: "${versioned_object_uid}"
      version_at_time: "${time:after(t0)}"   # after the captured commit window -> the created version
    expect: ok
    assert:
      - { assert: returns, matches: '^\s*<' }
