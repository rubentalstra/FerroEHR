# ITEM_TAG identity is the (key, target_path) PAIR on the DEMOGRAPHIC seam too:
# two tags sharing a key but differing in target_path coexist on one
# VERSIONED_PARTY and both survive a PUT round-trip.
#
# THE LAW, released and repeated verbatim on this family: "More than one
# ITEM_TAG may be associated with a single target PERSON or VERSIONED_PARTY, in
# which case they are uniquely identified by their `key` and `target_path` pair
# attributes" (ITS-REST operations/person_tags_get.yaml; the same sentence in
# person_tags_update.yaml and in overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag). The RM makes the pair
# meaningful: `target_path` is an "Optional archetype (i.e. AQL) or RM path
# within `_target_`, used to tag a fine-grained element" (RM common
# item_tag.adoc §Attributes) — one class, shared by both spaces.
#
# WHY A SEPARATE CASE FROM THE COMPOSITION TWIN: the released surface has two
# stores, not one; the demographic tag routes are a distinct service seam whose
# addressing behaved differently from the EHR side until it was fixed. The
# assertions are order-free for the same reason as on the EHR side (list
# ordering is unstated — register AMB-97): both members carry the shared key
# and there is no third, which a key-only identity cannot satisfy.
#
# The four remaining party kinds share this seam and are tracked as per-binding
# coverage_gap entries in vocab/wire_surface.yaml.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported", ITS-REST overview Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag), so the `ItemTags` capability may never gate
# CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.person_tags_update-key_target_path_identity
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_ITEM_TAGS.person_tags_update
capabilities: [ItemTags]
exercises: [DemographicApi, PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  Two ITEM_TAGs sharing a key but differing in target_path coexist on one
  VERSIONED_PARTY and both survive the PUT round-trip.
description: "PERSON tags: (key, target_path) is the identity"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST person_tags_update.yaml §description"
  - "ITS-REST person_tags_get.yaml §description"
  - "RM common master07-tags.adoc §Semantics"
  - "RM item_tag.adoc §Attributes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
formats: [canonical-json]
requires: { server: any }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: person_tags_update
    with:
      uid_based_id: "${versioned_object_uid}"     # the HIER_OBJECT_ID form — the VERSIONED_PARTY container
      tags:
        - { key: "flag", value: "on-details", target_path: "/details" }
        - { key: "flag", value: "on-identities", target_path: "/identities" }
    expect: updated
  - step: 3
    call: person_tags_get
    with: { uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "flag" }
      - { assert: field, path: "[1]/key", equals: "flag" }
      - { assert: field, path: "[2]", absent: true }
      - { assert: returns, matches: "/identities" }
      - { assert: returns, matches: "/details" }
