# DEMOGRAPHIC ARCHETYPE VALIDATION — the ACCEPT half of the battery.
#
# A validator that refuses everything it does not recognize would pass every
# rejection case in this family and still be wrong, so the capability owes a
# case proving the opposite direction: a PARTY that populates EVERY archetyped
# substructure the demographic model offers is COMMITTED and read back with
# those substructures intact.
#
# What the payload exercises, each from the RM class model:
#   - PARTY.identities  1..1 List<PARTY_IDENTITY>, whose `details` is an
#     ITEM_STRUCTURE (party.adoc, party_identity.adoc);
#   - PARTY.contacts    0..1 List<CONTACT>, whose `addresses` is a
#     1..1 List<ADDRESS>, whose `details` is an ITEM_STRUCTURE
#     (party.adoc, contact.adoc, address.adoc);
#   - PARTY.details     0..1 ITEM_STRUCTURE (party.adoc: "All other details
#     for this Party");
#   - ACTOR.languages   0..1 List<DV_TEXT> (actor.adoc).
# Every one of those is an archetypable node — "Actual structure is
# archetyped" (party_identity.adoc, contact.adoc §Description) — so accepting
# them intact is precisely the demographic counterpart of the CONT- family's
# accept rows.
#
# The read-back asserts the substructures survived rather than comparing the
# whole document: the server mints the PARTY `uid` (RM demographic master02
# §Party Identification; register AMB-129), so a whole-document comparison
# would be asserting the identity rule this battery does not own.
id: I_DEMOGRAPHIC_SERVICE.create_party-archetyped_content_accepted
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST demographic operations; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A PARTY populating every archetyped substructure the demographic model
  defines is accepted, and each substructure is retrievable unchanged — the
  demographic content validator passes valid archetyped content.
description: "Commit a fully archetyped PARTY and read its substructures back"
spec_refs:
  - "RM demographic §PARTY (identities, contacts, details)"
  - "RM demographic §ACTOR (languages)"
  - "RM demographic §PARTY_IDENTITY (details: ITEM_STRUCTURE)"
  - "RM demographic §CONTACT (addresses: List<ADDRESS>)"
  - "RM demographic §ADDRESS (details: ITEM_STRUCTURE)"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "SM openehr_platform §I_PARTY.get_party"
  - "CNF profiles master03-profiles.adoc §Functional (Demographic Persistence: Archetype validation)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.person.archetyped_full]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.archetyped_full}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_PARTY.get_party
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: PERSON }
      # the archetype root survived intact
      - { assert: field, path: "archetype_details/archetype_id/value", equals: "openEHR-DEMOGRAPHIC-PERSON.person.v1" }
      # PARTY.identities[].details — the archetyped identity structure
      - { assert: field, path: "identities[0]/details/items[0]/value/value", equals: "Person Archetyped" }
      # PARTY.contacts[].addresses[].details — the archetyped address structure
      - { assert: field, path: "contacts[0]/addresses[0]/details/items[0]/value/value", equals: "+31 10 000 0000" }
      # PARTY.details — the party's own archetyped ITEM_STRUCTURE
      - { assert: field, path: "details/items[0]/value/value", equals: "1980-01-01" }
      # ACTOR.languages
      - { assert: field, path: "languages[0]/value", equals: "en" }
