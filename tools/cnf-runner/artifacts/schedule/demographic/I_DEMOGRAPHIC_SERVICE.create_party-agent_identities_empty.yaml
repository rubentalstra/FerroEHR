# A present-but-empty `PARTY.identities` is refused on the AGENT create route.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM `UML/classes/org.openehr.rm.demographic.party.adoc` §Attributes types
# `PARTY.identities: List<PARTY_IDENTITY>` at 1..1, and §Invariants states
# `Identities_valid: not identities.is_empty` outright, so a present-but-EMPTY list is the one shape the bound
# forbids — the way to say "none" is to omit an optional container, never
# to send [].
#
# WHICH BRANCH: a mandatory list cannot be constructed empty, so the body
# never converts to the resource. ITS-REST `responses/400.yaml` scopes 400 to
# "syntactically invalid ... content"; `responses/422.yaml` scopes 422 to
# content that "could be converted to a resource" and then fails semantic
# validation. This body cannot be converted — the 400 row.
#
# FIVE WIRE SURFACES, NOT ONE: the release routes each concrete party
# subtype to its own path (`/demographic/agent`), so each carries the
# refusal independently — a server could run the strict reader on one
# route and not another.
#
# The ACCEPTING twin is the populated `identities` list on every valid party fixture
# (cnf.demographic.<kind>.v1, committed by the kind-parity cases).
id: I_DEMOGRAPHIC_SERVICE.create_party-agent_identities_empty
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A AGENT whose PARTY.identities list is present but empty is refused as invalid content, and no party is created.
description: "AGENT with an empty identities list refused (400)"
spec_refs:
  - "RM demographic §PARTY (identities 1..1; Identities_valid)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.agent.identities_empty]
flow:
  - step: 1
    call: create_party
    variant: agent
    with: { party: "${ds:cnf.demographic.agent.identities_empty}" }
    expect: bad_request
