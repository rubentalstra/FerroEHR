# The relationship update sent WITHOUT the precondition header the route
# requires — the ABSENT-header arm, paired with -bbbb's PRESENT-but-false arm.
# One behaviour per case: the body is the same valid v2 payload, and only the
# header's absence distinguishes the exchange.
#
# REALIZATION (#623, 2026-07-28): the released ITS surfaces no
# PARTY_RELATIONSHIP resource (register AMB-32), so nothing released assigns
# this status; the route this product serves of its own design carries the
# version CONTAINER id on its path and requires the preceding VERSION uid in
# `If-Match`, and it follows the released convention for the absent-precondition
# refusal. The convention it follows is a choice, not an inherited obligation —
# this row can never gate ITS-REST wire conformance.
id: I_DEMOGRAPHIC_SERVICE.update_party_relationship-missing_if_match
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY_RELATIONSHIP.update_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_PARTY_RELATIONSHIP.update_party_relationship (Pre_has_relationship) + the served extension route's declared precondition; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  A relationship update sent without the required preceding-version precondition
  is refused as a missing precondition, and no new VERSION is created.
description: "Update a PARTY_RELATIONSHIP without the preceding-version precondition"
spec_refs:
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.update_party_relationship"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1, cnf.demographic.party_relationship.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: update_party_relationship
    variant: missing_if_match            # sends no If-Match at all
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party_relationship: "${ds:cnf.demographic.party_relationship.v2}"
    expect: precondition_missing
postconditions:
  - { assert: version, count: 1 }
