# The party update omits the `If-Match` header the operation requires.
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §"If-Match and accidental overwrites"): "When the
# service expects `If-Match` for an operation, but the client does not provide
# it, the service SHOULD respond with `400 Bad Request`." The party update is
# exactly the shape that section scopes itself to — "This is only required by a
# small set of versioned resources in this specification, when the
# `preceding_version_uid` is not part of the endpoint path segment": the party
# PUT carries the version CONTAINER id on its path, never the preceding VERSION
# uid.
#
# The pair with -weak_etag_stale keeps the two rejections apart: a PRESENT
# precondition that evaluates false is 412, an ABSENT one is 400. One behaviour
# per case — the body is the same valid update payload, and only the header's
# absence distinguishes the exchange.
id: I_DEMOGRAPHIC_SERVICE.update_party-missing_if_match
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITS-REST overview If-Match rules; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A party update sent without the required If-Match header is refused as a
  missing precondition, and no new VERSION is created.
description: "Update a PARTY without If-Match (missing precondition)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "SM openehr_platform §I_PARTY.update_party"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: update_party
    variant: missing_if_match            # sends no If-Match at all
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
    expect: precondition_missing
postconditions:
  - { assert: version, count: 1 }
