# The refusal arm of the VERSIONED_PARTY container's XML offering (register
# AMB-167, the two-armed option gate — finding 4 of the 2026-07-28 posture
# run): a service that does not offer canonical XML on this resource answers
# the §XML Format 406 MUST rather than serving a representation the client
# did not ask for. Resources.md §"XML Format": "If the service cannot fulfill
# this aspect of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`"; §"Data representation": "Services MUST support at least one
# of the openEHR XML or JSON canonical formats" — offering XML per resource
# is the service's choice, so the refusal is the release's own designated
# answer on a JSON-only resource, exercised here instead of merely tolerated.
id: I_ITS_REST_VERSIONED_PARTY.versioned_party_get-xml_not_acceptable
kind: functional
component: DEMOGRAPHIC
sm_operation: I_ITS_REST_VERSIONED_PARTY.versioned_party_get
capabilities: [PartyOperations]
profiles: [OPTIONS]
option: versioned-party-xml-unsupported
ambiguities: [AMB-161, AMB-167]
test_purpose: >-
  A VERSIONED_PARTY container read requested as canonical XML on a service
  that does not offer XML for this resource is refused with 406, never
  answered in a representation the client did not ask for.
description: "versioned_party_get with Accept: application/xml (406)"
spec_refs:
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    format: canonical-json
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { party_uid: created.versioned_object_uid }
  - step: 2
    call: versioned_party_get
    format: canonical-xml              # the unfulfillable Accept
    with: { versioned_object_uid: "${party_uid}" }
    expect: not_acceptable
