# The relationship DELETE carries its precondition IN THE PATH: the addressed
# uid must be the last (most recent) VERSION uid. This case addresses a
# SUPERSEDED version — step 2 updates the relationship, so the version step 1
# created is no longer the trunk head — and the delete is refused. Step 4 makes
# the refusal observable rather than assumed: the version tree still holds
# exactly the two versions steps 1 and 2 created.
#
# REALIZATION (#623, 2026-07-28): the released ITS surfaces no
# PARTY_RELATIONSHIP resource (register AMB-32), so nothing released assigns
# this status. The route this product serves of its own design follows the
# released party-delete convention for a stale-version address — a convention it
# chose, never an obligation it inherits, so this row can never gate ITS-REST
# wire conformance. Its SPEC content is the SM postcondition it protects: a
# delete that does not apply to the current version must commit nothing.
id: I_DEMOGRAPHIC_SERVICE.delete_party_relationship-stale_version_conflict
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY_RELATIONSHIP.delete_party_relationship
capabilities: [PartyRelationshipOperations]
profiles: [OPTIONS]
ambiguities: [AMB-32]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from SM I_PARTY_RELATIONSHIP.delete_party_relationship (Pre_has_relationship, Post_relationship_deleted) + RM common master06 §Version Identification; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
  - "EXTENSION ROUTE — no openEHR spec governs /demographic/party_relationship; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-32. The row gates the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire conformance"
test_purpose: >-
  A relationship delete addressing a superseded version uid is refused as a
  conflict, and commits nothing.
description: "Delete a PARTY_RELATIONSHIP at a superseded version uid (conflict)"
spec_refs:
  - "SM openehr_platform §I_PARTY_RELATIONSHIP.delete_party_relationship"
  - "RM common §change_control (master06 §Version Identification)"
  - "RM demographic §PARTY_RELATIONSHIP"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.party_relationship.v1, cnf.demographic.party_relationship.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party_relationship
    with: { party_relationship: "${ds:cnf.demographic.party_relationship.v1}" }
    expect: created
    capture:
      first_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # supersede it
    call: I_PARTY_RELATIONSHIP.update_party_relationship
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party_relationship: "${ds:cnf.demographic.party_relationship.v2}"
      preceding_version_uid: "${first_version_uid}"
    expect: updated
    capture: { second_version_uid: updated.version_uid }
  - step: 3                              # delete at the SUPERSEDED uid
    call: delete_party_relationship
    with: { version_uid: "${first_version_uid}" }
    expect: conflict
  - step: 4                              # the head is untouched
    call: I_PARTY_RELATIONSHIP.get_party_relationship
    with: { versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "uid/value", equals: "${second_version_uid}" }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${second_version_uid}", change_type: MODIFY }
