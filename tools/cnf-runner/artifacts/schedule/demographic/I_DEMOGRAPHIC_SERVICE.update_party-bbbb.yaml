# master10 case "bbbb" under I_DEMOGRAPHIC_SERVICE.update_party() — the schedule
# entry is TBD; authored as the primary versioning-error path from the SM
# operation semantics (.Errors: object_version_does_not_exist). Resolvable SM
# operation is I_PARTY.update_party (the AMB-13 rule; see REQUIREMENTS.md). An
# update carrying a stale/wrong preceding_version_uid is rejected — the ITS-REST
# binding realizes preceding_version_uid as If-Match, so a mismatch is
# precondition_failed (AMB-3).
id: I_DEMOGRAPHIC_SERVICE.update_party-bbbb
kind: functional
component: DEMOGRAPHIC
sm_operation: I_PARTY.update_party
capabilities: [PartyOperations]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "master10 (DEMOGRAPHIC) is a schedule stub — every test case is TBD (aaaa/bbbb); this case is authored from the SM operation semantics (declared meaning + Errors)"
test_purpose: >-
  update_party with a wrong preceding_version_uid is rejected
  (object_version_does_not_exist / precondition failed) and no new VERSION is
  created.
description: "Update an existing PARTY with a wrong preceding version (rejected)"
spec_refs:
  - "SM openehr_platform §I_PARTY.update_party"
  - "CNF platform_test_schedule master10 §update_party"
  - "RM common §change_control (VERSION.commit_audit.change_type)"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.demographic.person.v1, cnf.demographic.person.v2]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { versioned_object_uid: created.versioned_object_uid }
  - step: 2
    call: update_party
    with:
      versioned_object_uid: "${versioned_object_uid}"
      party: "${ds:cnf.demographic.person.v2}"
      preceding_version_uid: "00000000-0000-4000-8000-0000000000ff::openEHRSys.example.com::1"
    expect: precondition_failed
ambiguities: [AMB-3]
