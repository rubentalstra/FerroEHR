# The miss branch of the demographic CONTRIBUTION read: a well-formed but
# unknown `contribution_uid`.
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 404 row verbatim): "The
# origin service did not find the target resource or is not willing to disclose
# that one exists."
#
# The uid is a well-formed UUID, so this is not the malformed-identifier
# branch: register AMB-76's repo-wide fixed handling makes an unparseable
# identifier segment 400 and a well-formed-but-unknown one 404, and its scope
# names `contribution_uid` explicitly.
#
# Unlike its EHR sibling this route has NO `ehr_id` path scope, so an unknown
# `contribution_uid` is its only miss — the demographic CONTRIBUTION is
# addressed globally. Register AMB-136 records that the route realizes no SM
# operation; the anchor is the AMB-127 naming convention.
id: I_EHR_CONTRIBUTION.get_contribution-demographic_unknown
kind: functional
component: DEMOGRAPHIC
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [PartyOperations, DemographicApi]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "the demographic CONTRIBUTION routes realize no SM operation — SM openehr_platform master06-demographic_service.adoc defines no contribution interface (register AMB-136); the I_EHR_CONTRIBUTION anchor with variant `demographic` is a catalogue naming convention, never an SM claim"
test_purpose: >-
  A demographic CONTRIBUTION read naming a uid that does not exist is a miss.
description: "Read an unknown demographic CONTRIBUTION (404)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
flow:
  - step: 1
    call: get_contribution
    variant: demographic
    with: { contribution_uid: "00000000-0000-4000-8000-00000000073a" }
    expect: not_found
