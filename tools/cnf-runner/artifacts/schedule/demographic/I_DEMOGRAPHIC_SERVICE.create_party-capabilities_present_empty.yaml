# DEMOGRAPHIC ARCHETYPE VALIDATION — the ROLE arm of the cardinality family:
# RM demographic UML/classes/org.openehr.rm.demographic.role.adoc §Invariants,
# `Capabilities_valid: capabilities /= Void implies not capabilities.empty`.
# The attribute (0..1 List<CAPABILITY>) exists only on ROLE, so this rule is
# unreachable through the PERSON route family — the case addresses the ROLE
# route with `variant: role`, which is the ONLY reason it is not folded into
# the contacts/roles siblings.
#
# DECISIVE DOCS TEXT for the wire (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim): "The
# request was well-formed but was unable to be followed due to semantic
# errors." The released role_create operation declares the 422 response
# (crates/openehr-its/vendor/rest-oas/demographic-validation.openapi.yaml,
# `/demographic/role` post responses), so the branch the binding maps is the
# released one, not an invented status.
id: I_DEMOGRAPHIC_SERVICE.create_party-capabilities_present_empty
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A committed ROLE whose optional capabilities list is present but empty is
  refused as a semantic error (ROLE.Capabilities_valid).
description: "Commit a ROLE with an empty capabilities list (422)"
spec_refs:
  - "RM demographic §ROLE (Capabilities_valid)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "CNF profiles master03-profiles.adoc §Functional (Demographic Persistence: Archetype validation)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.role.capabilities_empty]
flow:
  - step: 1
    call: create_party
    variant: role                        # the ROLE route family: CAPABILITY lives only here
    with: { party: "${ds:cnf.demographic.role.capabilities_empty}" }
    expect: bad_request                  # parse class since #1730: Option<NonEmptyVec> — the body "could not be parsed or is invalid" (overview §HTTP status codes, the 400 row; the #1727 ruling)
