# THE REFUSAL HALF of create_party-relationship_source_is_the_container. The
# body is byte-identical except the inline relationship's `source` container id,
# which names a DIFFERENT party — so `PARTY.Relationships_validity`
# (`relationships /= Void implies (not relationships.is_empty and then
# relationships.for_all (r | r.source = self)`, RM demographic
# UML/classes/org.openehr.rm.demographic.party.adoc §Invariants) is violated:
# the list would store, as this party's data, a relationship the party is not
# the source of — which RM demographic master02-demographic_package.adoc §Party
# Relationships forbids by construction ("`PARTY_RELATIONSHIPs` are stored as
# part of the data of the `PARTY` designated as the source").
#
# DECISIVE DOCS TEXT for the wire (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 422 row verbatim): "The
# request was well-formed but was unable to be followed due to semantic
# errors." The payload parses; the model constraint is what fails.
#
# Keeping this twin beside the accepting one is what makes the accepting case
# safe: a server that satisfies the round-trip shape by dropping the
# source-identity arm altogether fails HERE.
id: I_DEMOGRAPHIC_SERVICE.create_party-relationship_source_foreign_container
kind: functional
component: DEMOGRAPHIC
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
capabilities: [DemographicArchetypeValidation]
profiles: [OPTIONS]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the RM demographic class model and the released ITS-REST overview status-code table; master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A committed PARTY whose inline relationship is sourced at another party's
  version container is refused as a semantic error
  (PARTY.Relationships_validity).
description: "Commit a PARTY whose inline relationship is sourced elsewhere (422)"
spec_refs:
  - "RM demographic §PARTY (Relationships_validity: relationships.for_all (r | r.source = self))"
  - "RM demographic master02 §Party Relationships (relationships are stored as part of the data of the PARTY designated as the source)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEMOGRAPHIC_SERVICE.create_party"
  - "CNF profiles master03-profiles.adoc §Functional (Demographic Persistence: Archetype validation)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the Demographic API arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-70)
requires: { server: any }
data_sets: [cnf.demographic.person.round_trip_relationship.foreign_source]
flow:
  - step: 1
    call: create_party
    with: { party: "${ds:cnf.demographic.person.round_trip_relationship.foreign_source}" }
    expect: validation_failed            # overview §HTTP status codes, the 422 row
