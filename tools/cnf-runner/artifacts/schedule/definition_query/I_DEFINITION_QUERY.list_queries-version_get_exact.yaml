# The single-definition read at an EXACT version serves that definition, whole
# and verbatim — never the latest of the name.
#
# Ground (ITS-REST docs text): docs/query/Qualified_query_name.md — "The
# `version` identifier is in the format specified by SEMVER style (i.e.
# `major.minor.patch`)"; the prefix rule that follows applies only "When only a
# partial `version` pattern is supplied", so an exact selector never falls
# through. The operation itself: specifications/operations/
# definition_query_version_get.yaml, "Retrieves the definition of a particular
# stored query (at specified version) and its associated metadata."
#
# A HIGHER version is stored first, so a server that ignored the selector and
# served the latest fails the row. The `q` assertion is the round-trip fidelity
# position of register AMB-126 (verbatim): the served definition is compared
# against the exact text the flow stored.
#
# ANCHOR NOTE: the SM declares no get-a-query operation, so this released read
# is bound as the `version_get` variant of the closest SM read
# (`list_queries`) — a catalogue naming convention, recorded as the ITS→SM half
# of register AMB-127, not a claim that the SM defines it.
id: I_DEFINITION_QUERY.list_queries-version_get_exact
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A stored query read at an exact SEMVER serves that version's definition,
  verbatim and with its declared metadata, even when a higher version exists.
description: "get a stored query at an exact version (verbatim definition)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "ITS-REST query Qualified_query_name.md §Qualified query name (the version identifier)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_exact"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_1_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_exact"
      version: "2.0.0"                   # the latest — must NOT be served for an exact 1.0.0
      query: "SELECT c/uid/value AS v_2_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 3
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::vget_exact"
      version: "1.0.0"
    expect: ok
    assert:
      - { assert: field, path: "name", equals: "org.openehr.cnf::vget_exact" }
      - { assert: field, path: "version", equals: "1.0.0" }
      - { assert: field, path: "q", equals: "SELECT c/uid/value AS v_1_0_0 FROM EHR e CONTAINS COMPOSITION c" }
      - { assert: field, path: "type", exists: true }     # the required formalism member
      - { assert: field, path: "saved", exists: true }    # the required registration timestamp
ambiguities: [AMB-126, AMB-127]
