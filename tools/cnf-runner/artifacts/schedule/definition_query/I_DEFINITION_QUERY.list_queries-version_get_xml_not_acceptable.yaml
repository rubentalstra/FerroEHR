# The single stored-query read has one representation, so an XML `Accept` is
# refused rather than silently answered in JSON.
#
# Decisive released sentence (ITS-REST docs/overview/Resources.md §"XML
# Format"): "The client SHOULD use the `Accept: application/xml` request header
# to specify the expected XML response format. If the service cannot fulfill
# this aspect of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`." Corroborated by docs/overview/Requests_and_responses.md
# §"HTTP status codes", row `406 Not Acceptable`: "The target resource does not
# have a current representation that would be acceptable to the user".
#
# The query IS registered, so the refusal is about the representation and not
# about the resource's existence.
id: I_DEFINITION_QUERY.list_queries-version_get_xml_not_acceptable
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A stored-query definition requested as XML is refused as not acceptable, even
  when the definition exists.
description: "get a stored query with Accept: application/xml (406)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_xml"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_xml FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: list_queries
    variant: version_get
    format: canonical-xml                # the unfulfillable Accept
    with:
      qualified_query_name: "org.openehr.cnf::vget_xml"
      version: "1.0.0"
    expect: not_acceptable
