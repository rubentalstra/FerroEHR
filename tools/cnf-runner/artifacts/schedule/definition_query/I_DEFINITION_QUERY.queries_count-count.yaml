# SM I_DEFINITION_QUERY.queries_count: "Return total count of queries."
# ITS-REST 1.1.0 surfaces no count resource under /definition/query, and the
# count is not derivable from the released listing either — its
# `qualified_query_name` is a REQUIRED path parameter, so no request enumerates
# the whole registry (register AMB-127; the unreachable empty-pattern wildcard
# clause is AMB-124(d)). The its-rest binding therefore declares the operation
# unrealized and this case is NOT-APPLICABLE WITH CITATION on this ITS.
#
# The flow states the SM contract on a known population: two registered queries
# on an otherwise empty server count as two.
id: I_DEFINITION_QUERY.queries_count-count
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.queries_count
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  The registered-query count reports the total number of queries registered on
  the system.
description: "count all registered queries (SM contract)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.queries_count"
applies: { rm: ">=1.0.2" }
requires: { server: exclusive }          # a GLOBAL count — only an exclusively-owned SUT can ground it
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::count_one"
      query: "SELECT c/uid/value AS v_one FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::count_two"
      query: "SELECT c/uid/value AS v_two FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 3
    call: queries_count
    expect: ok
    assert:
      - { assert: returns, equals: 2 }   # two registered queries on an empty server
ambiguities: [AMB-127]
