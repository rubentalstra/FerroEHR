  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::valid_query"
      query: "SELECT c FROM EHR e CONTAINS COMPOSITION c"
      query_type: "AQL"
    expect: stored                       # valid formalism -> Pre_valid_query holds, query stored
