# Official master05 case. Cells are TBD placeholders ("xx") -> # (REQUIREMENTS.md). Flow derived from the SM list_queries ("List all
# registered queries") and the stored-query list-by-name REST endpoint: on an
# empty server the listing returns an empty set and does not fail.
id: I_DEFINITION_QUERY.list_queries-empty
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: "Listing registered queries on an empty server returns an empty set and does not fail."
description: "list_queries on an empty server (schedule cells TBD; SM-derived)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "CNF platform_test_schedule master05 §list_queries-empty"
guards:
  - "master05 is TBD upstream: flows derived from the SM operation semantics and the stored-query Definitions API — CNF platform_test_schedule master05 (all cells xx/TBD); AMB-38"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # no stored queries registered
flow:
  - step: 1
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf" }   # pattern matching nothing on the empty server
    expect: ok
    assert:
      - { assert: returns, equals: [] }  # empty set, no failure
