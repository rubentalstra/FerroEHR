# A prefix matching nothing on a POPULATED registry is a fulfilled request
# answering an EMPTY list — not a not-found.
#
# The listing declares one branch only (ITS-REST
# specifications/operations/definition_query_list.yaml: a single `200`), and
# the released 404 trigger is a missing target resource —
# docs/overview/Requests_and_responses.md §"HTTP status codes", row `404 Not
# Found`: "The origin service did not find the target resource or is not
# willing to disclose that one exists". The list resource exists; only its
# result is empty. The released text never says so outright, so the position is
# adjudicated in register AMB-124(a).
#
# Distinct from I_DEFINITION_QUERY.list_queries-empty, which asks the same
# question of an EMPTY server: here the registry HOLDS a query, and the
# non-matching prefix must still answer `[]` rather than falling back to
# listing something.
id: I_DEFINITION_QUERY.list_queries-no_match_empty_list
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A qualified-name prefix that matches no stored query answers an empty list,
  even when other queries are registered.
description: "list by a non-matching prefix on a populated registry (empty list)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf.present::registered"
      query: "SELECT c/uid/value AS v_present FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf.absent" }   # matches nothing
    expect: ok
    assert:
      - { assert: returns, equals: [] }
ambiguities: [AMB-124]
