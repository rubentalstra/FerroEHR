# A {major} version PREFIX resolves to the highest matching version inside that
# major line — and never crosses into another major.
#
# Decisive released sentence (ITS-REST docs/query/Qualified_query_name.md):
# "When only a partial `version` pattern is supplied, or when `version` is not
# supplied at all, the system must use the latest `version` with the supplied
# prefix - i.e. if only `major` or `major.minor` is used, then the latest query
# version matching supplied prefix will be used." A MUST.
#
# The registry holds 1.0.0, 1.4.2 and 2.0.0, so the selector `1` discriminates
# three wrong answers at once: the lowest match, an arbitrary match, and the
# name's overall latest (2.0.0, outside the prefix).
id: I_DEFINITION_QUERY.list_queries-version_get_major_prefix
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A {major} version prefix on the stored-query read resolves to the highest
  version inside that major, not to a lower match and not across majors.
description: "get a stored query by a {major} version prefix"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "ITS-REST query Qualified_query_name.md §Qualified query name (the version identifier)"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_major"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_1_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_major"
      version: "1.4.2"                   # the highest inside major 1 — the expected match
      query: "SELECT c/uid/value AS v_1_4_2 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 3
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_major"
      version: "2.0.0"                   # higher overall, outside the prefix
      query: "SELECT c/uid/value AS v_2_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 4
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::vget_major"
      version: "1"                       # the {major} prefix form
    expect: ok
    assert:
      - { assert: field, path: "version", equals: "1.4.2" }
