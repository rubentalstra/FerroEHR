# The listing matches the qualified name as a PREFIX and returns EVERY stored
# version of EVERY match, ordered by name then version ascending.
#
# Decisive released text — ITS-REST
# specifications/operations/definition_query_list.yaml: "Retrieves list of all
# stored queries on the system matched by `qualified_query_name` as pattern",
# with the worked example "`GET …/v1/definition/query/org.openehr` will list
# all versions of all queries with names starting with `org.openehr`". Two
# names sharing one prefix, one of them with two versions, is the smallest
# shape that discriminates all three claims (prefix, all versions, all
# matches) at once.
#
# The BODY SHAPE the `[i]/name` assertions address is not chosen either. The
# docs text does not describe the listing's representation, so the shape comes
# from the RELEASED OAS, cited AS the OAS: definition_query_list.yaml's `'200'`
# $refs responses/200_QueryList.yaml → schemas/definition/QueryList.yaml, which
# is `type: array` of schemas/query/StoredQuery.yaml, and StoredQuery lists
# `name` first among its `required` members. A 200 whose body is not an array
# of objects carrying `name` is therefore outside the released shape.
#
# ORDER is spec-silent and adjudicated in register AMB-124: name, then version
# SEMVER-ascending — the order the released QueryList example itself shows
# (`1.0.1` before `1.1.7` under one name). The trailing absent-row assertion
# pins the cardinality, so a listing that also returned unrelated queries, or
# dropped a version, is a red row rather than a pass.
id: I_DEFINITION_QUERY.list_queries-prefix_all_versions
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A qualified-name prefix lists every stored version of every query whose name
  starts with it, ordered by name then SEMVER ascending.
description: "list by prefix: all matches, all versions, name + SEMVER order"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "ITS-REST query Qualified_query_name.md §Qualified query name (the version identifier)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf.listp::alpha"
      version: "1.1.0"                   # stored FIRST, listed SECOND (order is by version, not by arrival)
      query: "SELECT c/uid/value AS a_1_1_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf.listp::alpha"
      version: "1.0.0"
      query: "SELECT c/uid/value AS a_1_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 3
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf.listp::beta"
      version: "1.0.0"
      query: "SELECT c/uid/value AS b_1_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 4
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf.listp" }   # the PREFIX, not a whole name
    expect: ok
    assert:
      - { assert: field, path: "[0]/name", equals: "org.openehr.cnf.listp::alpha" }
      - { assert: field, path: "[0]/version", equals: "1.0.0" }
      - { assert: field, path: "[1]/name", equals: "org.openehr.cnf.listp::alpha" }
      - { assert: field, path: "[1]/version", equals: "1.1.0" }
      - { assert: field, path: "[2]/name", equals: "org.openehr.cnf.listp::beta" }
      - { assert: field, path: "[2]/version", equals: "1.0.0" }
      - { assert: field, path: "[3]", absent: true }         # exactly the three matches
ambiguities: [AMB-124]
