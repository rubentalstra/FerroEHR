# The request-side media-type branch of the stored-query store: a PUT that
# DECLARES `Content-Type: application/json` carries a payload the service
# cannot process as the declared format, and is refused as unsupported media —
# not with the parser's generic client error.
#
# Decisive released sentence (ITS-REST docs/overview/Resources.md §"JSON
# Format"): "A client MAY use the header `Content-Type: application/json` in
# the requests to specify the JSON payload format. If the service cannot
# process the request payload as JSON format, it MUST respond with HTTP status
# code `415 Unsupported Media Type`." An AQL statement is not a JSON document,
# so the declared format cannot be honoured. Corroborated by
# docs/overview/Requests_and_responses.md §"HTTP status codes", row `415`.
#
# One behaviour per case: the body is the same valid AQL the positive store
# uses, so only the declared media type distinguishes this exchange (the same
# discipline as I_DEFINITION_ADL14.upload_opt-wrong_media).
id: I_DEFINITION_QUERY.store_query-wrong_media
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A stored-query PUT declaring a payload media type the service cannot process
  is refused as unsupported_media, leaving the registry untouched.
description: "stored-query store with a non-matching Content-Type"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST overview Resources.md §JSON Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: any }
flow:
  - step: 1
    call: store_query
    variant: wrong_media_type            # sends Content-Type: application/json on the query-text body
    with:
      qualified_query_name: "org.openehr.cnf::wrong_media"
      query: "SELECT c/uid/value AS v_media FROM EHR e CONTAINS COMPOSITION c"
    expect: unsupported_media            # Resources.md §JSON Format MUST
  - step: 2
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf::wrong_media" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }  # the refusal registered nothing
