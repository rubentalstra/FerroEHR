# SM I_DEFINITION_QUERY.list_matching_queries: "List all registered queries
# matching an identifier pattern (regex) and an artefact identifier pattern
# (regex) for artefacts referenced in the query. Either pattern may be the
# regex for 'match any'." ITS-REST 1.1.0 realizes no such operation — its one
# listing matches a name PREFIX, has no artefact-reference filter and no paging
# (register AMB-121) — so the its-rest binding declares the operation
# unrealized and this case is NOT-APPLICABLE WITH CITATION on this ITS rather
# than silently absent.
#
# The flow states the SM contract: two queries are registered, one matching the
# identifier regex, and the listing must return that one. The `invalid_id_pattern`
# error is deliberately NOT encoded — no released wire branch carries it, and
# authoring one would invent both a pattern language and a status (AMB-121).
id: I_DEFINITION_QUERY.list_matching_queries-id_pattern
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_matching_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  Listing registered queries by an identifier regex returns exactly the queries
  whose qualified names the pattern matches.
description: "list registered queries matching an identifier regex (SM contract)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_matching_queries"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::matching_probe"
      query: "SELECT c/uid/value AS v_match FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    with:
      qualified_query_name: "org.openehr.other::unmatched_probe"
      query: "SELECT c/uid/value AS v_other FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 3
    call: list_matching_queries
    with:
      id_pattern: "^org\\.openehr\\.cnf::matching_.*$"   # PERL regex on the query identifier
      artefact_id_pattern: ".*"                          # the SM's 'match any'
    expect: ok
    assert:
      - { assert: message_exemplar, text: "only the query whose qualified name matches the identifier regex is listed" }
ambiguities: [AMB-121]
