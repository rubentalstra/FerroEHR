# A second VERSION-LESS store of the same name UPDATES the definition in place:
# it is not refused, and it does not accumulate a second version.
#
# Decisive released sentence — ITS-REST
# specifications/operations/definition_query_store.yaml: "Stores a new query,
# or updates an existing query on the system." The operation declares 200 and
# 400 only: no conflict branch exists for it to reach, in contrast with its
# version-addressed sibling, which declares one. Register AMB-117 resolves the
# apparent clash with the immutability prose BY FORM — the version-less store
# is the overwriting form, writing the one default slot.
#
# The observable consequences are both asserted: the second store succeeds
# (no 409), and the listing afterwards holds exactly ONE row, at the same
# version, carrying the SECOND definition's text (the list order and shape are
# the released QueryList; register AMB-124 for the ordering).
id: I_DEFINITION_QUERY.store_query-update_in_place
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A second version-less store under an existing name updates the stored
  definition in place — accepted, one row remains, and it carries the new text.
description: "version-less re-store updates the default slot (no conflict, no new version)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Qualified_query_name.md §version identifier"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::update_in_place"
      query: "SELECT c/uid/value AS v_first FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::update_in_place"
      query: "SELECT c/uid/value AS v_second FROM EHR e CONTAINS COMPOSITION c"
    expect: stored                       # "or updates an existing query" — no conflict branch exists
  - step: 3
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf::update_in_place" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/version", equals: "1.0.0" }
      - { assert: field, path: "[0]/q", equals: "SELECT c/uid/value AS v_second FROM EHR e CONTAINS COMPOSITION c" }
      - { assert: field, path: "[1]", absent: true }   # exactly one row: the slot was updated, not added to
ambiguities: [AMB-117]
