# SM I_DEFINITION_QUERY.delete_query: "Delete query with name `_a_query_name_`",
# `Pre_has_query`: `has_query(a_query_name)`, `Post_query_deleted`:
# `not has_query (a_query_name)`. ITS-REST 1.1.0 surfaces no DELETE on any
# /definition/query path (register AMB-127), so the its-rest binding declares
# the operation unrealized and this case is NOT-APPLICABLE WITH CITATION on
# this ITS — never silently absent — and activates unchanged when a later
# release adds the endpoint.
#
# The flow encodes the SM contract exactly: the precondition is established by
# registering the query, the operation is invoked BY NAME, and the
# postcondition is read back through the existence probe. Our admin
# `DELETE /admin/query/{qualified_query_name}/{version}` is deliberately not
# used here: it removes one (name, version) row and so cannot establish
# `not has_query(a_query_name)` (no openEHR spec governs that admin route —
# our own extension).
id: I_DEFINITION_QUERY.delete_query-delete_existing
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.delete_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  Deleting a registered query by name succeeds and the query is no longer
  registered under that name.
description: "delete a registered stored query by name (SM contract)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.delete_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.has_query"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::delete_probe"
      query: "SELECT c/uid/value AS v_delete FROM EHR e CONTAINS COMPOSITION c"
    expect: stored                       # establishes Pre_has_query
  - step: 2
    call: delete_query
    with: { qualified_query_name: "org.openehr.cnf::delete_probe" }
    expect: deleted
  - step: 3
    call: has_query
    with: { qualified_query_name: "org.openehr.cnf::delete_probe" }
    expect: ok
    # Post_query_deleted: `not has_query (a_query_name)`. The existence probe is
    # realized as the name-keyed list read, which answers a fulfilled 200 either
    # way (register AMB-124(a)), so the FALSE half is observable only in the
    # body: an empty QueryList is the wire form of "not registered".
    assert:
      - { assert: returns, equals: [] }
postconditions:
  - assert: state
    text: "The deleted query is no longer registered under its name (verified by step 3)"
ambiguities: [AMB-127]
