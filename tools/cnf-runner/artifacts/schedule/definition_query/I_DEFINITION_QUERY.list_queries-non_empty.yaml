# Official master05 case. Cells are TBD placeholders ("xx") -> status: draft
# (REQUIREMENTS.md). Flow derived from the SM list_queries: after registering a
# query, the listing returns it.
id: I_DEFINITION_QUERY.list_queries-non_empty
kind: functional
status: draft
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [StoredQueries]
profiles: [STANDARD]
test_purpose: "Listing registered queries returns every registered query."
description: "list_queries on a populated server (schedule cells TBD; draft)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "CNF platform_test_schedule master05 §list_queries-non_empty"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::listed_query"
      query: "SELECT c FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf::listed_query" }
    expect: ok
    assert:
      - { assert: message_exemplar, text: "the registered query is returned in the list" }
