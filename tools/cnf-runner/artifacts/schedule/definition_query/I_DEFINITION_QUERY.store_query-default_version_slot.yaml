# The VERSION-LESS store writes a version, and the response says which one.
#
# Ground: the released store takes no `version`, and no released sentence says
# which one it mints — `Qualified_query_name.md`'s absent/partial-version rule
# is a rule for USING a stored query ("the system must use the latest `version`
# with the supplied prefix"), not for creating one. Adjudicated in register
# AMB-117: the version-less form writes the constant `1.0.0` default slot.
# What the released text DOES assign is the response header that names it —
# ITS-REST docs/overview/Requests_and_responses.md §"Representation details
# negotiation" ("If no `Prefer` header is provided, the default behavior is
# assumed to be `return=minimal`"; this operation declares no `Prefer`
# parameter) + §"Prefer minimal…": "The response SHOULD include a `Location`
# header pointing to the newly created or updated resource." So the Location
# must name the version this PUT actually wrote, which step 2 then reads back
# at that exact coordinate. The Location matcher lives on the store binding.
#
# One behaviour per case: the update-in-place half is -update_in_place and the
# higher-version-present probe is -default_slot_with_higher_version.
id: I_DEFINITION_QUERY.store_query-default_version_slot
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A version-less stored-query PUT registers the definition at the default
  version slot and answers a Location naming that written version, at which the
  definition is then retrievable.
description: "version-less store: 200 + Location naming the written version"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "ITS-REST query Qualified_query_name.md §version identifier"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::default_slot"
      query: "SELECT c/uid/value AS v_default FROM EHR e CONTAINS COMPOSITION c"
    expect: stored                       # 200 + Location …/1.0.0 (asserted by the binding matcher)
  - step: 2
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::default_slot"
      version: "1.0.0"                   # the slot the store wrote
    expect: ok
    assert:
      - { assert: field, path: "version", equals: "1.0.0" }
      - { assert: field, path: "name", equals: "org.openehr.cnf::default_slot" }
ambiguities: [AMB-117, AMB-119]
