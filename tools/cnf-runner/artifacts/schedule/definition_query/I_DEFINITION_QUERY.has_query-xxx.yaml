# Official master05 case (id verbatim, including the schedule's -xxx suffix).
# The master05 test-case cells are TBD placeholders (Description/Pre/Post/Flow
# all "xx"), so this case is status: draft — validated in shape but never
# verdict-bearing — until the upstream schedule authors the specifics (recorded
# in REQUIREMENTS.md). The flow is derived from the SM has_query (Boolean:
# "True if the query identified by a_query_name is registered") and realized
# via the stored-query definitions REST API: a query is registered (store),
# then its presence is checked.
id: I_DEFINITION_QUERY.has_query-xxx
kind: functional
status: draft
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.has_query
capabilities: [StoredQueries]
profiles: [STANDARD]
test_purpose: "has_query reports true for a registered stored query."
description: "has_query for a registered query (schedule cells TBD; draft)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.has_query"
  - "CNF platform_test_schedule master05 §has_query-xxx"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::has_query_probe"
      query: "SELECT c FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: has_query
    with: { qualified_query_name: "org.openehr.cnf::has_query_probe" }
    expect: ok
    assert:
      - { assert: returns, equals: true }   # has_query: Boolean True for a registered query
ambiguities: [AMB-19]
