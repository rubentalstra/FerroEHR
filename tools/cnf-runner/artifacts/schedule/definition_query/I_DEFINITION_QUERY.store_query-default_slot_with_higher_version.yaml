# The version-less store's Location names the version it WROTE, not the
# highest version of the name.
#
# The discriminating shape: a HIGHER version (2.0.0) is stored first, then a
# version-less store writes the default slot. Under register AMB-117 the
# version-less form writes `1.0.0` regardless of what else exists, so the
# `Location` must end `/1.0.0` — a server that reports the name's latest
# version instead answers `/2.0.0` and sends the client to a definition this
# request did not store. The header's value is assigned by the released text:
# ITS-REST docs/overview/Requests_and_responses.md §"Prefer minimal, identifier
# or full representation response", `return=minimal` (the default per
# §"Representation details negotiation", the store declaring no `Prefer`
# parameter) — "The response SHOULD include a `Location` header pointing to the
# newly created or updated resource."
#
# Step 3 confirms the write landed where the header said, and step 4 that the
# pre-existing higher version is untouched by it.
id: I_DEFINITION_QUERY.store_query-default_slot_with_higher_version
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  With a higher version already stored, a version-less store still writes the
  default slot and its Location names that slot, leaving the higher version
  unchanged.
description: "version-less store beside a higher stored version (Location names the written version)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "ITS-REST query Qualified_query_name.md §version identifier"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::higher_present"
      version: "2.0.0"
      query: "SELECT c/uid/value AS v_2_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::higher_present"
      query: "SELECT c/uid/value AS v_default FROM EHR e CONTAINS COMPOSITION c"
    expect: stored                       # Location must end /1.0.0 — the WRITTEN version (binding matcher)
  - step: 3
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::higher_present"
      version: "1.0.0"
    expect: ok
    assert:
      - { assert: field, path: "q", equals: "SELECT c/uid/value AS v_default FROM EHR e CONTAINS COMPOSITION c" }
  - step: 4
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::higher_present"
      version: "2.0.0"
    expect: ok
    assert:
      - { assert: field, path: "q", equals: "SELECT c/uid/value AS v_2_0_0 FROM EHR e CONTAINS COMPOSITION c" }
ambiguities: [AMB-117]
