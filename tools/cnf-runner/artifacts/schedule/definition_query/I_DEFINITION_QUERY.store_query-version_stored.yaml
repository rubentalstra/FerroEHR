# The VERSION-ADDRESSED store registers the definition at the named version and
# answers 200 with a Location for it.
#
# Ground (ITS-REST docs text): the version coordinate — docs/query/
# Qualified_query_name.md, "Stored queries are identified by their name, used
# as `qualified_query_name`, and an optional `version` number… The `version`
# identifier is in the format specified by SEMVER style (i.e.
# `major.minor.patch`)"; the status — docs/overview/Requests_and_responses.md
# §"HTTP status codes", row `200 OK`; the header — §"Prefer minimal, identifier
# or full representation response", `return=minimal` (the default per
# §"Representation details negotiation"): "The response SHOULD include a
# `Location` header pointing to the newly created or updated resource."
#
# One behaviour per case: the immutability of the pair is
# -version_duplicate_conflict, and the version grammar the write accepts is the
# -version_*_rejected trio.
id: I_DEFINITION_QUERY.store_query-version_stored
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A stored-query PUT naming an exact SEMVER registers the definition at that
  version, answers 200 with a Location, and the definition is retrievable
  there.
description: "versioned store: 200 + Location, retrievable at the named version"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Qualified_query_name.md §Qualified query name (the version identifier)"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_stored"
      version: "1.2.3"
      query: "SELECT c/uid/value AS v_1_2_3 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored                       # 200 + Location (binding matcher)
  - step: 2
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::version_stored"
      version: "1.2.3"
    expect: ok
    assert:
      - { assert: field, path: "version", equals: "1.2.3" }
ambiguities: [AMB-119]
