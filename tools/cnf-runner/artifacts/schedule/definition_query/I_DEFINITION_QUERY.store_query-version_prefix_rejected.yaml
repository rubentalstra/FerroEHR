# A PARTIAL version prefix is not a version a store can write.
#
# The `{version}` path parameter is described once, for the reads and the write
# alike, and only in resolution terms — "a pattern as partial prefix, in a form
# of `{major}` or `{major}.{minor}` …, in which case the highest (latest)
# version matching the prefix will be considered". A prefix selects among
# versions that already exist, so on a STORE it names nothing: the released
# text assigns the write no outcome for it, and register AMB-122 adjudicates
# the write-side grammar as an exact `major.minor.patch`, everything else
# refused on the operation's own declared 400 —
# docs/overview/Requests_and_responses.md §"HTTP status codes", row `400 Bad
# Request`: "The service cannot or will not process the request due to
# something that is perceived to be a client error (e.g., malformed request
# syntax, syntactically invalid content)".
#
# Step 2 discriminates a refusal from a silent store under the literal prefix:
# nothing may be registered at `1` (which would also poison the read-side
# prefix algebra, where `1` must RESOLVE to a full version).
id: I_DEFINITION_QUERY.store_query-version_prefix_rejected
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A versioned store whose version segment is a partial prefix rather than an
  exact major.minor.patch is refused, and nothing is registered under it.
description: "versioned store: a {major} prefix is not a writable version"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Qualified_query_name.md §version identifier"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: any }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_prefix_write"
      version: "1"                       # a READ-side prefix form, not a version
      query: "SELECT c/uid/value AS v_prefix FROM EHR e CONTAINS COMPOSITION c"
    expect: bad_request
  - step: 2
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf::version_prefix_write" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }  # the refusal registered nothing
ambiguities: [AMB-122]
