# Official master05 case. Cells are TBD placeholders ("xx") -> status: draft
# (REQUIREMENTS.md). The SM list_queries carries item_offset/items_to_fetch
# pagination, but ITS-REST 1.1.0 definition_query_list exposes no offset/fetch
# query parameters (specifications/operations/definition_query_list.yaml), so
# item-selection is not wire-realizable on ITS-REST 1.1.0; the draft flow lists
# without pagination. The wire gap is recorded in REQUIREMENTS.md.
id: I_DEFINITION_QUERY.list_queries-select_items
kind: functional
status: draft
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [StoredQueries]
profiles: [STANDARD]
test_purpose: "Listing registered queries with item selection (pagination) returns the selected window."
description: "list_queries with item selection (schedule cells TBD; draft; pagination not wire-exposed in ITS-REST 1.1.0)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "CNF platform_test_schedule master05 §list_queries-select_items"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    with:
      qualified_query_name: "org.openehr.cnf::select_items"
      query: "SELECT c FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf::select_items" }
    expect: ok
    assert:
      - { assert: message_exemplar, text: "item_offset/items_to_fetch selection: SM-defined, not exposed by ITS-REST 1.1.0 definition_query_list" }
ambiguities: [AMB-20]
