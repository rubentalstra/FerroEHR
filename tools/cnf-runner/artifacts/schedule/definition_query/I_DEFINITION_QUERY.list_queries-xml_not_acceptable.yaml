# The stored-query listing has one representation, so an XML `Accept` cannot be
# fulfilled and is refused rather than silently answered in JSON.
#
# Decisive released sentence (ITS-REST docs/overview/Resources.md §"XML
# Format"): "The client SHOULD use the `Accept: application/xml` request header
# to specify the expected XML response format. If the service cannot fulfill
# this aspect of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`." The released stored-query listing offers the JSON QueryList
# only, so the request cannot be fulfilled. Corroborated by
# docs/overview/Requests_and_responses.md §"HTTP status codes", row `406 Not
# Acceptable`: "The target resource does not have a current representation that
# would be acceptable to the user".
id: I_DEFINITION_QUERY.list_queries-xml_not_acceptable
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A stored-query listing requested as XML is refused as not acceptable, never
  answered in a representation the client did not ask for.
description: "list stored queries with Accept: application/xml (406)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: any }
flow:
  - step: 1
    call: list_queries
    format: canonical-xml                # the unfulfillable Accept
    with: { qualified_query_name: "org.openehr.cnf" }
    expect: not_acceptable
