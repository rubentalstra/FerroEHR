# A MALFORMED version segment is refused by the store.
#
# `v1.x` is neither the released exact form — ITS-REST
# docs/query/Qualified_query_name.md, "The `version` identifier is in the
# format specified by SEMVER style (i.e. `major.minor.patch`)" — nor one of the
# `{major}` / `{major}.{minor}` read prefixes the `{version}` parameter
# defines. Unlike the prefix and pre-release siblings it IS malformed outright,
# so the `400 Bad Request` row of
# docs/overview/Requests_and_responses.md §"HTTP status codes" assigns it
# directly: "The service cannot or will not process the request due to
# something that is perceived to be a client error (e.g., malformed request
# syntax, syntactically invalid content)". Register AMB-122 carries the
# write-side grammar for all three (and the generic-client-error sentence
# below that same table, which assigns the two well-formed-but-unwritable
# tokens); the READ side of the same token family is register AMB-102 (404,
# because a read addresses a resource that does not exist, while a write
# cannot address one at all).
id: I_DEFINITION_QUERY.store_query-version_malformed_rejected
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A versioned store whose version segment is neither an exact SEMVER nor a
  legal prefix is refused, and nothing is registered under it.
description: "versioned store: a malformed version (v1.x) is refused"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Qualified_query_name.md §version identifier"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires: { server: any }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_malformed_write"
      version: "v1.x"                    # not a SEMVER and not a legal prefix
      query: "SELECT c/uid/value AS v_bad FROM EHR e CONTAINS COMPOSITION c"
    expect: bad_request
  - step: 2
    call: list_queries
    with: { qualified_query_name: "org.openehr.cnf::version_malformed_write" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }  # the refusal registered nothing
ambiguities: [AMB-122]
