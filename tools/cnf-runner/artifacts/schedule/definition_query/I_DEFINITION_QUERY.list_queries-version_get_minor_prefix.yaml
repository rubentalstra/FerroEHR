# A {major}.{minor} version PREFIX resolves to the highest matching version
# inside that minor line — and never crosses into another minor.
#
# Decisive released sentence (ITS-REST docs/query/Qualified_query_name.md):
# "When only a partial `version` pattern is supplied … if only `major` or
# `major.minor` is used, then the latest query version matching supplied prefix
# will be used." A MUST.
#
# The registry holds 1.0.0, 1.0.7 and 1.1.0, so the selector `1.0` fails three
# wrong answers: the lowest match, an arbitrary match, and the major's latest
# (1.1.0, outside the minor prefix). One behaviour per case: the {major} form
# is -version_get_major_prefix.
id: I_DEFINITION_QUERY.list_queries-version_get_minor_prefix
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A {major}.{minor} version prefix on the stored-query read resolves to the
  highest version inside that minor line, not across it.
description: "get a stored query by a {major}.{minor} version prefix"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "ITS-REST query Qualified_query_name.md §version identifier"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_minor"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_1_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_minor"
      version: "1.0.7"                   # the highest inside 1.0 — the expected match
      query: "SELECT c/uid/value AS v_1_0_7 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 3
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_minor"
      version: "1.1.0"                   # higher inside the major, outside the minor prefix
      query: "SELECT c/uid/value AS v_1_1_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 4
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::vget_minor"
      version: "1.0"                     # the {major}.{minor} prefix form
    expect: ok
    assert:
      - { assert: field, path: "version", equals: "1.0.7" }
