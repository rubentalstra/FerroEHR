# A version selector that matches nothing is not found — and never falls back
# to another version of the same name.
#
# Decisive released sentence — docs/overview/Requests_and_responses.md §"HTTP
# status codes", row `404 Not Found`: "The origin service did not find the
# target resource or is not willing to disclose that one exists". The
# stored-query read's own 404 states the trigger in the same terms ("a stored
# query with `qualified_query_name` and `version` does not exist"). The
# fall-back reading is excluded by docs/query/Qualified_query_name.md, whose
# latest-matching rule fires only "When only a partial `version` pattern is
# supplied": an out-of-range exact selector matches no version and resolves to
# nothing.
#
# The name IS registered (at 1.0.0), so the 404 attaches to the version
# coordinate rather than to an unknown name. The unmatchable-selector family on
# the execution side is register AMB-102.
id: I_DEFINITION_QUERY.list_queries-version_get_unknown
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.list_queries
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  Reading a registered stored query at a version it does not have is not found,
  not a fall-back to another version.
description: "get a stored query at an unknown version (404)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.list_queries"
  - "ITS-REST query Qualified_query_name.md §version identifier"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::vget_unknown"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_1_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::vget_unknown"
      version: "9.9.9"                   # a well-formed selector matching no stored version
    expect: not_found
ambiguities: [AMB-102]
