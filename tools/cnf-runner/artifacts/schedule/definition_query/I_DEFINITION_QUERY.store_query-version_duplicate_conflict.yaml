# A version-ADDRESSED definition is immutable: re-storing an existing
# (name, version) pair is refused, and the stored definition is untouched.
#
# Decisive released text: the versioned store's own 409 —
# specifications/responses/409_StoredQuery_version.yaml, "`409 Conflict` is
# returned when a query with the given `qualified_query_name` and `version`
# already exists on the server" — reading on
# docs/overview/Requests_and_responses.md §"HTTP status codes", row `409
# Conflict`: "Indicates that the request could not be processed because it
# might generate a duplicate or a conflict". Corroborated by
# specifications/tags/StoredQuery_schema.md: stored queries "provide a
# reusable, immutable way to identify a specific AQL statement". Register
# AMB-117 records why this coexists with the version-less store's
# "or updates an existing query".
#
# The second store carries DIFFERENT text, so step 3 discriminates a genuine
# refusal from a silent overwrite that happened to answer 409.
id: I_DEFINITION_QUERY.store_query-version_duplicate_conflict
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  Storing a second definition at an existing (name, version) pair is refused as
  a conflict and leaves the original definition in place.
description: "versioned store: duplicate (name, version) is a conflict"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST query Qualified_query_name.md §version identifier"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::dup_version"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_original FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::dup_version"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_replacement FROM EHR e CONTAINS COMPOSITION c"
    expect: conflict                     # 409 — the pair already exists
  - step: 3
    call: list_queries
    variant: version_get
    with:
      qualified_query_name: "org.openehr.cnf::dup_version"
      version: "1.0.0"
    expect: ok
    assert:
      - { assert: field, path: "q", equals: "SELECT c/uid/value AS v_original FROM EHR e CONTAINS COMPOSITION c" }
ambiguities: [AMB-117]
