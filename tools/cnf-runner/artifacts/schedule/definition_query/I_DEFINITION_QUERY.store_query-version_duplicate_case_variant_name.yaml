# Stored-query identity is CASE-INSENSITIVE: a name differing only in case is
# the same query, so re-storing it at the same version is the same conflict.
#
# Decisive released sentence — BASE base_types master05
# §"Composite Identifiers and Case": all composite identifiers should be
# "case-insensitive - two identifiers identical apart from case are considered
# to be identical, and therefore to identify the same thing" (and
# "case-preserving - not change case due to persistence, copying, transfer or
# other computation processes"). A qualified query name is a composite
# identifier (`[{namespace}::]{query-name}` — ITS-REST
# docs/query/Qualified_query_name.md), so the conflict trigger "a query with
# the given `qualified_query_name` and `version` already exists" is met by the
# case variant. The same rule is why the reserved-name NOTE is explicitly
# case-insensitive.
#
# One behaviour per case: the same-spelling conflict is
# -version_duplicate_conflict; this case adds only the case axis.
id: I_DEFINITION_QUERY.store_query-version_duplicate_case_variant_name
kind: functional
component: DEFINITION_QUERY
sm_operation: I_DEFINITION_QUERY.store_query
capabilities: [QueryProvisioning]
profiles: [STANDARD]
test_purpose: >-
  A stored-query name differing only in letter case identifies the same query,
  so storing it at an existing version is refused as a conflict.
description: "versioned store: a case-variant name is the same identity (conflict)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "BASE base_types master05 §Composite Identifiers and Case"
  - "ITS-REST query Qualified_query_name.md"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
flow:
  - step: 1
    call: store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::Case_Variant"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_case FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: store_query
    variant: version
    with:
      qualified_query_name: "ORG.OPENEHR.CNF::case_variant"     # same identifier apart from case
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_case_other FROM EHR e CONTAINS COMPOSITION c"
    expect: conflict
ambiguities: [AMB-117]
