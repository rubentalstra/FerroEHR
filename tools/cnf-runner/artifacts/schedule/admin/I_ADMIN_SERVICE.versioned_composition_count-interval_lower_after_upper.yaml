# The `Interval` TYPE invariant, not a route rule: BASE
# org.openehr.base.foundation_types.interval.adoc §Invariants declares
# `Limits_consistent: (not upper_unbounded and not lower_unbounded) implies
# lower <= upper`. The `time_interval` argument is an
# `Interval<Iso8601_date_time>` (i_admin_service.adoc), so a both-bounded pair
# with its lower bound AFTER its upper bound is not an Interval at all and the
# call violates its own precondition.
#
# This is exactly the leniency shape a refusal battery exists to catch: an
# inverted range selects nothing, so a lenient server answers `0` and the caller
# reads a truthful-looking count for a window that was never asked for.
# EXTENSION ROUTE (register AMB-33): the row gates the ActivityReport
# CAPABILITY verdict only.
id: I_ADMIN_SERVICE.versioned_composition_count-interval_lower_after_upper
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.versioned_composition_count
capabilities: [ActivityReport]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A report request whose `time_interval` is bounded on both sides with
  `lower > upper` is refused as a precondition violation, never answered with
  the empty count such a range would select.
description: "Report over an interval whose lower bound is after its upper bound"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.versioned_composition_count"
  - "BASE foundation_types §Interval (invariant Limits_consistent)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/report/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the ActivityReport CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: versioned_composition_count
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { a_service: "Ehr", time_interval: "2026-12-31T00:00:00Z/2020-01-01T00:00:00Z" }
    expect: bad_request
ambiguities: [AMB-33]
