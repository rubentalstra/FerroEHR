# Official master12 case (chapter TBD — AMB-33; NATURAL family ids).
# ITS-REST 1.1.0 has no dump/load wire, so I_ADMIN_DUMP_LOAD.export_ehrs is
# declared unrealized (AMB-33). SM export_ehrs writes an archive to a
# file-system location — a fulfilled operation returning no resource body (ok).
id: I_ADMIN_DUMP_LOAD.export_ehrs-export_all
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: "Exporting all EHRs to a writable file-system location succeeds."
description: "Export all EHRs to a file-system location"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "CNF platform_test_schedule master12 §export_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: export_ehrs
    with: { file_sys_loc: "/var/openehr/export" }
    expect: ok
ambiguities: [AMB-33]
