# PAYLOAD-FORM DETECTION, canonical XML. `load_ehrs(file_sys_loc)` takes
# exactly ONE parameter (i_admin_dump_load.adoc) — it is never told which
# EXPORT_FORMAT the export used, so it must read the payload form out of the
# archive itself, exactly as the three `-container_*` / `-load_archive` cases
# make it detect the COMPRESSION_FORMAT container. This case closes that loop
# for the `export_format.adoc` member `openehr_canonical_xml`: the export
# externalizes every version payload as an ORIGINAL_VERSION document and the
# format-less load reads it back.
#
# The producing export is a DRIVEN step, not provisioning: `load_ehrs` reads
# "an export archive on file system" and the only operation that produces one
# is `export_ehrs`. Both steps drive the SAME extension family, so the case
# stays extension-only for the realization-scope gate.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrDumpLoad CAPABILITY
# verdict only.
id: I_ADMIN_DUMP_LOAD.load_ehrs-logical_format_xml
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.load_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A load against a location holding a canonical-XML export is fulfilled: the
  format-less operation reads the payload form out of the archive and reports
  the duplicate EHR ids per entity.
description: "Load a canonical-XML export archive"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.load_ehrs"
  - "SM openehr_platform UML export_format.adoc (the openehr_canonical_xml member)"
  - "SM openehr_platform §DUMP_LOAD_FAIL_REPORT"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: export_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with:
      file_sys_loc: "${ixit:dump_location}/logical_format_xml_round_trip"
      logical_fmt: "openehr_canonical_xml"
      segment_split_size: 1024
    expect: ok
  - step: 2
    call: load_ehrs
    on: admin
    with:
      file_sys_loc: "${ixit:dump_location}/logical_format_xml_round_trip"
    expect: ok
    # The same leniency refusal the `-load_archive` sibling makes: loading a
    # repository's own archive back into it makes EVERY archived EHR a
    # duplicate, and the SM makes that a PER-ENTITY failure carried in the
    # `List<DUMP_LOAD_FAIL_REPORT>` return ("Repository need not be empty, but
    # import EHRs with duplicate EHR ids will fail" —
    # dump_load_fail_report.adoc: entity_type, entity_id, dump_status, error).
    # A fulfilled call with an EMPTY report would mean the duplicates were
    # silently overwritten or dropped. `error` is free text
    # (dump_load_fail_report.adoc gives it no vocabulary), so nothing asserts
    # its wording; the CONTENT fidelity of the canonical-XML transit —
    # storage-JSON -> RM -> XML -> RM -> storage-JSON byte-equal at the served
    # version — is not observable over this wire either and is proved
    # in-process instead (app/ehrbase/tests/service_dump_load.rs).
    assert:
      - { assert: returns, matches: '"entity_type"\s*:\s*"EHR"' }
      - { assert: returns, matches: '"dump_status"\s*:\s*false' }
      - { assert: returns, matches: '"entity_id"\s*:\s*"' }
ambiguities: [AMB-33]
