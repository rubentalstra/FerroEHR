# The ADMIN gate's AUTHORIZATION half on the archive extension family: the
# party's ordinary `sut` principal is authenticated and holds no administrative
# authorization, so its refusal here IS the 403. EXTENSION ROUTE (register
# AMB-33): the row gates the EhrArchive CAPABILITY verdict only. The 403
# mapping is UNIVERSAL (selectors.yaml universal_outcomes: forbidden -> 403,
# route-table-wide).
id: I_ADMIN_ARCHIVE.archive_ehrs-forbidden
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_ehrs
capabilities: [EhrArchive]
exercises: [AdminApi, AuthorizationSeparation]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated principal without administrative authorization cannot move
  an existing EHR to archival storage.
description: "A non-administrative principal is forbidden from archiving EHRs"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_ehrs"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 403 — forbidden)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }        # mints ${ehr_id} — a REAL target, so 403 cannot be a disguised 404
flow:
  - step: 1
    call: archive_ehrs
    on: sut                                # authenticated, NOT administrative
    with: { ehr_ids: ["${ehr_id}"] }
    expect: forbidden                      # universal 403 (route-table-wide)
postconditions:
  - assert: state
    text: >-
      The named EHR is not archived; the object stays addressable to the
      administrative principal, which the -archive_twice sibling drives.
    verified_by: I_ADMIN_ARCHIVE.archive_ehrs-archive_twice
ambiguities: [AMB-33]
