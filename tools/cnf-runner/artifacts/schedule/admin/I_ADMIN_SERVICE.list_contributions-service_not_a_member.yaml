# The mandatory `a_service` argument is typed `PLATFORM_SERVICE`
# (i_admin_service.adoc), a CLOSED enumeration whose members
# platform_service.adoc spells out. A value naming no member is not a
# "service that holds nothing" — it is not a PLATFORM_SERVICE at all, so the
# call violates its own precondition and must be refused rather than answered
# with the empty listing an unknown service would otherwise produce.
# EXTENSION ROUTE (register AMB-33): the row gates the ActivityReport
# CAPABILITY verdict only.
id: I_ADMIN_SERVICE.list_contributions-service_not_a_member
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.list_contributions
capabilities: [ActivityReport]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A report request whose `a_service` names no PLATFORM_SERVICE member is
  refused as a precondition violation, never silently answered as an empty
  report.
description: "Report for a service outside the PLATFORM_SERVICE enumeration"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.list_contributions"
  - "SM openehr_platform UML platform_service.adoc (the closed member set)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/report/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the ActivityReport CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: list_contributions
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    # `Terminology` is a plausible-looking service name that platform_service.adoc
    # does NOT declare — the enumeration is Admin / Definitions / Ehr /
    # Ehr_index / Demographic / Message / Query / System_log.
    with: { a_service: "Terminology" }
    expect: bad_request
ambiguities: [AMB-33]
