# Official master12 case (chapter TBD — AMB-33; NATURAL family ids).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#659): ITS-REST 1.1.0 still
# realizes only admin_ehr_delete / admin_ehr_delete_all of the SM Admin surface
# and nothing in the release reads or writes a file-system archive (register
# AMB-33) — but this product SERVES the operation on a declared extension route
# under /admin/, so the case is EXECUTED against that route instead of resolving
# excused. It gates the EhrDumpLoad capability only; no openEHR profile tier and
# no ITS-REST wire-conformance claim rests on it.
id: I_ADMIN_DUMP_LOAD.export_ehrs-export_formats
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: "Exporting all EHRs honouring an explicitly requested logical format and compression format succeeds."
description: "Export all EHRs with explicit logical + compression formats"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "SM openehr_platform §EXPORT_SPEC"
  - "SM UML/classes/export_format.adoc §EXPORT_FORMAT"
  - "SM openehr_platform §COMPRESSION_FORMAT"
  - "CNF platform_test_schedule master12 §export_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
# LITERALS RE-DERIVED first-hand 2026-07-29 (#659) against the vendored
# enumerations, replacing three ungrounded ones:
#   * `logical_fmt: canonical_json` -> `openehr_canonical_json`. export_format.adoc
#     spells the two EXPORT_FORMAT members `openehr_canonical_xml` and
#     `openehr_canonical_json`; `canonical_json` is not one of them.
#   * `comp_fmt: zip` STANDS — compression_format.adoc declares exactly `zip`
#     and `7z`, so the literal was already a member. Each of the other declared
#     members now drives a case of its own, so the two enumerations are
#     exercised member by member rather than only at this row's pair:
#     `-compression_7z` for COMPRESSION_FORMAT `7z`, `-logical_format_xml` for
#     EXPORT_FORMAT `openehr_canonical_xml`.
#   * `enc_format: utf_8` is DELETED, not corrected. encoding_format.adoc
#     declares ENCODING_FORMAT with NO members at all, so no text names one and
#     no value is representable; a case sending any would be testing a
#     refusal the spec does not define. The refusal branch it would have
#     exercised lives on the `-encoding_unrepresentable` sibling case, whose
#     expectation IS derivable: an argument outside its declared type is SM
#     `precondition_violation`.
# `file_sys_loc` is a location on the SUT's OWN file system, and which paths a
# deployment can write is a property of its image and mounts that no operation
# discloses — so it is an IXIT declaration (`${ixit:dump_location}`), never a
# runner guess. A party that declares none makes this case not-applicable with
# that citation.
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: export_ehrs
    on: admin
    with:
      file_sys_loc: "${ixit:dump_location}/export_formats"
      logical_fmt: "openehr_canonical_json"
      comp_fmt: "zip"
      segment_split_size: 1024
    expect: ok
ambiguities: [AMB-33]
