# Official master12 case (chapter TBD; NATURAL family id — see REQUIREMENTS.md).
# Unrealized on ITS-REST 1.1.0 (AMB-33). Exercises the optional logical/
# compression/encoding format enums of the SM export_ehrs signature.
id: I_ADMIN_DUMP_LOAD.export_ehrs-export_formats
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: "Exporting all EHRs honouring the requested logical, compression and encoding formats succeeds."
description: "Export all EHRs with explicit logical/compression/encoding formats"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "CNF platform_test_schedule master12 §export_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: export_ehrs
    with:
      file_sys_loc: "/var/openehr/export"
      logical_fmt: "canonical_json"
      comp_fmt: "zip"
      enc_format: "utf_8"
    expect: ok
ambiguities: [AMB-33]
