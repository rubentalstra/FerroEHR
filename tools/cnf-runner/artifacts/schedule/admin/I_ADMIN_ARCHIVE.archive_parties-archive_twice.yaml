# What "archived" means on the read wire for the demographic half, proven
# inside the extension surface — the mirror of the archive_ehrs sibling.
#
# `archive_parties` "Move[s] selected Parties and relationships to archival
# storage" (i_admin_archive.adoc) and its ONLY declared error is
# `party_id_does_not_exist`. A FULFILLED second archiving of an
# already-archived Party is therefore the wire statement that the Party is
# still a known Party root: archival is a lifecycle marker, not an erasure, and
# the move is idempotent. The released-read half of the same fact is HTTP-tested
# in-process (the extension battery may not drive released wire — the
# realization-scope law), and the boundary is recorded on the admin-archive
# family in vocab/wire_surface.yaml.
id: I_ADMIN_ARCHIVE.archive_parties-archive_twice
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_parties
capabilities: [DemographicArchive]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  Archiving an already-archived Party is fulfilled, not refused as unknown — an
  archived Party remains an addressable Party root, and the move is idempotent.
description: "Archive the same party twice"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_parties"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the DemographicArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires:
  server: any
  party: cnf.demographic.person.v1         # mints ${party_id}
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: archive_parties
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { party_ids: ["${party_id}"] }
    expect: ok
  - step: 2
    call: archive_parties
    on: admin
    with: { party_ids: ["${party_id}"] }
    expect: ok                             # NOT not_found — the archived Party is still known
ambiguities: [AMB-33]
