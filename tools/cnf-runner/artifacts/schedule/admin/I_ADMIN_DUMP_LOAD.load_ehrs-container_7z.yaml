# CONTAINER DETECTION, 7z — the LOAD half of the member the
# -export_ehrs-compression_7z case only exports. `compression_format.adoc`
# declares exactly two members (zip, 7z); an export a load cannot read back is
# a dead archive, so each member's round trip is its own case.
# `load_ehrs(file_sys_loc)` is told no format (i_admin_dump_load.adoc), so
# reading a 7z archive is entirely a detection fact.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrDumpLoad CAPABILITY
# verdict only.
id: I_ADMIN_DUMP_LOAD.load_ehrs-container_7z
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.load_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A load against a location holding a 7z-compressed export is fulfilled: the
  format-less operation detects the packed container and reads the archive.
description: "Load a 7z-compressed export archive"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.load_ehrs"
  - "SM UML/classes/compression_format.adoc (the 7z member)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: export_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with:
      file_sys_loc: "${ixit:dump_location}/container_7z"
      logical_fmt: "openehr_canonical_json"
      comp_fmt: "7z"
      segment_split_size: 1024
    expect: ok
  - step: 2
    call: load_ehrs
    on: admin
    with:
      file_sys_loc: "${ixit:dump_location}/container_7z"
    expect: ok
ambiguities: [AMB-33]
