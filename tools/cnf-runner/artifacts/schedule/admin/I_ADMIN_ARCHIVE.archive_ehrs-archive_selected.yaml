# Official master12 case (chapter TBD — AMB-33; NATURAL family ids).
# ITS-REST 1.1.0 has no archive wire, so I_ADMIN_ARCHIVE.archive_ehrs is
# declared unrealized (AMB-33). archive_ehrs moves selected EHRs to archival
# storage — a fulfilled operation returning no resource body (ok).
id: I_ADMIN_ARCHIVE.archive_ehrs-archive_selected
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_ehrs
capabilities: [EhrArchive]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: "Archiving a selected set of existing EHRs moves them to archival storage."
description: "Archive selected EHRs"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_ehrs"
  - "CNF platform_test_schedule master12 §archive_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }        # mints ${ehr_id}
flow:
  - step: 1
    call: archive_ehrs
    with: { ehr_ids: ["${ehr_id}"] }
    expect: ok
ambiguities: [AMB-33]
