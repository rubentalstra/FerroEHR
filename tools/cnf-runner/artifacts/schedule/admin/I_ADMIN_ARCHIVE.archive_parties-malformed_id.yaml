# The syntactic half of the id boundary on the demographic archive, distinct
# from -archive_unknown (a WELL-FORMED id that resolves to no Party root). A
# member that is not a well-formed identifier names nothing at all, so the
# request cannot be carried out — a precondition violation rather than the SM's
# `party_id_does_not_exist`, which asserts about a real identifier. The list
# also carries a valid, existing member so the all-or-nothing law is what the
# case actually tests.
# EXTENSION ROUTE (register AMB-33): the row gates the DemographicArchive
# CAPABILITY verdict only.
id: I_ADMIN_ARCHIVE.archive_parties-malformed_id
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_parties
capabilities: [DemographicArchive]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A set containing a malformed Party id is refused as a precondition violation,
  and the well-formed member alongside it is not archived either.
description: "Archive a set containing a malformed party id"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_parties"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the DemographicArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires:
  server: any
  party: cnf.demographic.person.v1         # mints ${party_id} — the well-formed member
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: archive_parties
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { party_ids: ["${party_id}", "not-an-identifier"] }
    expect: bad_request
postconditions:
  - assert: state
    text: >-
      Neither member is archived (all-or-nothing); that the well-formed member
      stays addressable is what the -archive_twice sibling drives.
    verified_by: I_ADMIN_ARCHIVE.archive_parties-archive_twice
ambiguities: [AMB-33]
