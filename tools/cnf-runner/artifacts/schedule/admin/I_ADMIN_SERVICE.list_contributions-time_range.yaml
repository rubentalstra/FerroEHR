# Official master12 case (chapter TBD — AMB-33; NATURAL family ids).
# The SM list_contributions carries an optional time_interval; this sibling
# exercises the supplied-range form. Unrealized on ITS-REST 1.1.0 (AMB-33).
id: I_ADMIN_SERVICE.list_contributions-time_range
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.list_contributions
capabilities: [ActivityReport]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  Listing Contribution ids with an explicit time range returns only the
  Contributions committed within that interval.
description: "List contributions within a time range"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.list_contributions"
  - "CNF platform_test_schedule master12 §list_contributions"
applies: { rm: ">=1.0.2" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: list_contributions
    with: { a_service: "ehr", time_interval: "2020-01-01T00:00:00Z/2026-12-31T00:00:00Z" }
    expect: ok
ambiguities: [AMB-33]
