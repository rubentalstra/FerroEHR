# Official master12 case (chapter TBD; NATURAL family id — see REQUIREMENTS.md).
# The ONE master12 operation ITS-REST 1.1.0 realizes: physical_ehr_delete is
# wired as DELETE /admin/ehr/{ehr_id} (admin_ehr_delete). Physical deletion is
# a HARD delete producing no VERSION, so the success kind is ok_empty
# (fulfilled with no content — a 204/202), NOT `deleted` (whose vocab meaning
# is a logical delete producing a new VERSION with lifecycle_state deleted).
id: I_ADMIN_SERVICE.physical_ehr_delete-delete_existing
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.physical_ehr_delete
capabilities: [PhysicalDeletion, AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  Physically deleting an existing EHR succeeds with no content and the EHR is
  no longer retrievable (verified by the has_ehr step).
description: "Physically delete an existing EHR"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.physical_ehr_delete"
  - "CNF platform_test_schedule master12 §physical_ehr_delete"
  - "ITS-REST admin §admin_ehr_delete (DELETE /admin/ehr/{ehr_id})"
applies: { rm: ">=1.0.2" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }        # mints ${ehr_id}
flow:
  - step: 1
    call: physical_ehr_delete
    on: admin                              # ADMIN-role principal (ixit)
    with: { ehr_id: "${ehr_id}" }
    expect: ok_empty                        # 204 No Content (or 202 Accepted, async) — hard delete
  - step: 2
    call: I_EHR_SERVICE.has_ehr             # verify the EHR is physically gone
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: "The physically deleted EHR and all its owned resources are gone (verified by step 2)"
