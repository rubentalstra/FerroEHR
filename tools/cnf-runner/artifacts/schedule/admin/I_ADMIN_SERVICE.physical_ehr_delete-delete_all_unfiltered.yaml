# The BULK physical delete with NO `ehr_id` parameter: the released operation's
# "all EHRs" form. Grounded on two released sentences —
# operations/admin_ehr_delete_all.yaml ("Deletes all or multiple EHRs, or a
# specified subset of EHRs identified using the `ehr_id` query parameter") and
# parameters/query/ehr_id_Admin.yaml ("An optional parameter to perform the
# operation on a subset of EHRs") — which together make an ABSENT parameter the
# whole set, not an error and not a no-op.
#
# The success kind is `ok_empty`, never `deleted`: a physical delete produces no
# VERSION, while the closed vocabulary's `deleted` means "Logical delete
# performed (a new version, lifecycle_state = openehr::523|deleted|)". Register
# AMB-10 carries the released RM-indelibility-versus-physical-deletion
# contradiction and the route-family split that decides it; AMB-33 carries the
# fact that this route realizes no SM operation (the `delete_all` variant anchor
# is a catalogue naming convention, never an SM claim).
#
# THE EMPTINESS PROBE is the point of the case: the released text promises the
# EHRs are gone, and the only released way to observe that is a read of each id
# (there is no EHR listing in the API). Two EHRs are established — one by
# provisioning, one in-flow — so the probe distinguishes "deleted the one I
# named" from "deleted all of them". `requires.server: exclusive` is mandatory
# here and not a convenience: the call destroys EVERY EHR on the instance, so
# its ground holds only on an exclusively owned SUT, and the runner both orders
# exclusive cases first and marks them not-applicable on a shared instance.
id: I_ADMIN_SERVICE.physical_ehr_delete-delete_all_unfiltered
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.physical_ehr_delete
capabilities: [PhysicalDeletion, AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  The bulk delete called with no ehr_id parameter deletes every EHR on the
  server and succeeds with no content; both previously existing EHRs are
  afterwards unreadable.
description: "Physically delete all EHRs (no ehr_id parameter)"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.physical_ehr_delete"
  - "ITS-REST admin §admin_ehr_delete_all (DELETE /admin/ehr/all — absent ehr_id = all EHRs)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # admin EHR deletion arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-80)
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — docs/admin/Description.md §Status: \"This specification is in the `DEVELOPMENT` state\", and docs/overview/Preface.md §Conformance is \"tbd.\"; guarded until the Admin API stabilises"
  - "admin_ehr_delete_all realizes NO SM operation — I_ADMIN_SERVICE.physical_ehr_delete takes a single `an_ehr_id: UUID [1]` and the I_ADMIN_ARCHIVE list operations archive rather than delete (register AMB-33); the `delete_all` variant anchor is a catalogue naming convention, never an SM claim"
  - "the async `202 Accepted` branch the operation declares — ITS-REST specifications/operations/admin_ehr_delete_all.yaml (\"The server may execute this operation asynchronously (e.g. in batches), in which case returns status `202 Accepted`\") — is a MAY on the SERVICE with no request form behind it, so THIS case cannot require or distinguish it: the binding declares `accepted` as its own kind (the 2026-07-28 schedule release, #544) while `ok_empty` deliberately keeps `alt_status: [202]`, because the emptiness probe below asserts the deletion HAPPENED and must not refute a conformant asynchronous server (register AMB-139)"
requires:
  server: exclusive                      # destroys every EHR — global-state ground; mints ${ehr_id}
  ehr: { commits: none }
flow:
  - step: 1                              # a second EHR, so "all" is distinguishable from "one"
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { second_ehr_id: created.ehr_id }
  - step: 2
    call: physical_ehr_delete
    variant: delete_all                  # DELETE /admin/ehr/all with no query parameter
    on: admin                            # ADMIN-role principal (ixit)
    expect: ok_empty                     # 204 No Content; alt_status 202 kept so an async server is not refused (AMB-139)
  - step: 3                              # emptiness probe (a): the provisioned EHR is gone
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
  - step: 4                              # emptiness probe (b): the in-flow EHR is gone too
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${second_ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: >-
      No EHR that existed before the call is retrievable afterwards — the
      absent ehr_id parameter selected the full set, not an empty one
      (verified by steps 3 and 4).
