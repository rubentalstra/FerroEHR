# THE BULK ROUTE'S CASCADE. The released sentence the case asserts is the one
# both admin operations carry verbatim: "All resources associated with or owned
# by the targeted EHRs (such as COMPOSITION, EHR_STATUS, ITEM_TAG, CONTRIBUTION,
# and their historical versions) will also be **permanently** and physically
# deleted, in compliance with applicable data protection regulations (e.g., the
# GDPR in the European Union)" — so the bulk form's promise is not merely that
# the EHR row disappears but that everything it owned goes with it.
#
# One CONTRIBUTION carrying one COMPOSITION is committed first, giving two owned
# resources with known ids on two different routes; after the bulk delete both
# are unreachable.
#
# WHAT THIS CAN AND CANNOT OBSERVE, stated plainly: the released wire has no way
# to look inside a deleted EHR, so a 404 on a composition of a destroyed EHR
# cannot be distinguished from a 404 for the destroyed EHR itself — both reads
# are EHR-scoped by path. Reachability is therefore the strongest observable
# form of the promise, and it is exactly what the case asserts. The
# storage-level closure (nodes, attestations, contributions, the orphaned audit
# rows, externalized blobs) is our own design over our own schema — no openEHR
# spec governs the FK graph — and is proven by DB-backed tests, not here.
# Register AMB-143 carries both the missing postcondition and the "such as"
# open-endedness; AMB-33 carries the route's missing SM anchor.
#
# The subset selector is used rather than the unfiltered form so the case
# destroys only what it created (`requires.server: any`); the unfiltered form
# has its own exclusive-server case.
id: I_ADMIN_SERVICE.physical_ehr_delete-delete_all_cascade
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.physical_ehr_delete
capabilities: [PhysicalDeletion, AdminApi]
exercises: [ChangeSets, CompositionOps]
profiles: [OPTIONS]
test_purpose: >-
  The bulk delete destroys the targeted EHR's owned resources, not merely the
  EHR: a COMPOSITION and the CONTRIBUTION that committed it are both
  unreachable afterwards.
description: "Bulk physical delete cascades to the targeted EHR's owned resources"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.physical_ehr_delete"
  - "ITS-REST admin §admin_ehr_delete_all (the owned-resource cascade sentence)"
  - "RM common §change_control (master06 §Contributions — every change is a CONTRIBUTION carrying its VERSIONs)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — docs/admin/Description.md §Status: \"This specification is in the `DEVELOPMENT` state\", and docs/overview/Preface.md §Conformance is \"tbd.\"; guarded until the Admin API stabilises"
  - "admin_ehr_delete_all realizes NO SM operation — SM i_admin_service.adoc §physical_ehr_delete takes a single `an_ehr_id: UUID [1]` and the I_ADMIN_ARCHIVE list operations archive rather than delete (register AMB-33); the `delete_all` variant anchor is a catalogue naming convention, never an SM claim"
  - "the cascade list is exemplary (\"such as\") and the operation states no postcondition at all — register AMB-143; what is asserted here is the released promise's observable form, unreachability, since no released read can see inside a destroyed EHR"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                              # one change set carrying one COMPOSITION
    call: I_EHR_CONTRIBUTION.commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      composition_uid: created.first_versioned_object_uid
  - step: 2
    call: physical_ehr_delete
    variant: delete_all                  # DELETE /admin/ehr/all?ehr_id=${ehr_id}
    on: admin
    with: { ehr_id_subset: "${ehr_id}" }
    expect: ok_empty
  - step: 3                              # the EHR itself
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
  - step: 4                              # the owned COMPOSITION
    call: I_EHR_COMPOSITION.get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${composition_uid}" }
    expect: not_found
  - step: 5                              # the owned CONTRIBUTION
    call: I_EHR_CONTRIBUTION.get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: not_found
postconditions:
  - assert: state
    text: >-
      Nothing the deleted EHR owned is reachable: neither the COMPOSITION
      committed into it nor the CONTRIBUTION that committed it (verified by
      steps 4 and 5).
