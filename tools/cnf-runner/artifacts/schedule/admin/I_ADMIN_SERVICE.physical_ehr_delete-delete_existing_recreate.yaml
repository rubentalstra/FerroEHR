# POST-DELETE OBSERVABILITY: after a physical delete the `ehr_id` is free again.
#
# No released sentence states this, which is exactly why it is registered
# (AMB-143) and then gated rather than assumed. The two facts that decide it are
# released: `responses/404_unknown_ehr_id.yaml` — "`404 Not Found` is returned
# when an EHR with `ehr_id` does not exist" — so a destroyed EHR reads as absent;
# and the create-with-id operation's only conflict branch,
# `responses/409_EHR.yaml` — "Unable to create a new EHR due to a conflict with
# an already existing EHR with the same subject id, namespace pair" — plus SM
# i_ehr_service.adoc §create_ehr_with_id's `Pre_no_duplicate`: `not has_ehr
# (an_ehr_id)`, which after a physical delete is TRUE. So the second create is
# not a duplicate of anything: refusing it would require the server to remember
# an identifier it was told to destroy permanently, which contradicts the very
# operation that destroyed it (register AMB-10).
#
# The id is the deterministic per-case/per-row value the `provided` matrix
# sentinel mints, so two runners choose the same id and no other case collides.
id: I_ADMIN_SERVICE.physical_ehr_delete-delete_existing_recreate
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.physical_ehr_delete
capabilities: [PhysicalDeletion, AdminApi]
exercises: [EhrOperations]
profiles: [OPTIONS]
test_purpose: >-
  A physically deleted EHR reads as absent and its ehr_id is reusable: creating
  an EHR under the same client-supplied identifier afterwards succeeds rather
  than conflicting.
description: "A physically deleted ehr_id is free for re-creation"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.physical_ehr_delete"
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr_with_id"
  - "ITS-REST admin §admin_ehr_delete (hard delete; 404_unknown_ehr_id)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # admin EHR deletion arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-80)
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — docs/admin/Description.md §Status: \"This specification is in the `DEVELOPMENT` state\", and docs/overview/Preface.md §Conformance is \"tbd.\"; guarded until the Admin API stabilises"
  - "no released sentence states the post-delete contract — SM i_admin_service.adoc §physical_ehr_delete declares `Pre_has_ehr` and NO postcondition, unlike SM i_definition_query.adoc §delete_query's `Post_query_deleted`; the position asserted here is the adjudicated one in register AMB-143"
requires: { server: any }
parameters:
  iteration: reset_per_row
  matrix: { columns: [ehr_id], rows: [[provided]] }
flow:
  - step: 1
    call: I_EHR_SERVICE.create_ehr
    variant: with_ehr_id                 # PUT /ehr/{ehr_id} — the client chooses the identifier
    with: { ehr_id: "${row.ehr_id}" }
    expect: created
  - step: 2
    call: physical_ehr_delete            # DELETE /admin/ehr/{ehr_id}
    on: admin                            # ADMIN-role principal (ixit)
    with: { ehr_id: "${row.ehr_id}" }
    expect: ok_empty
  - step: 3                              # the deleted id reads as ABSENT, not as a tombstone
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${row.ehr_id}" }
    expect: not_found
  - step: 4                              # …and is therefore free: Pre_no_duplicate holds again
    call: I_EHR_SERVICE.create_ehr
    variant: with_ehr_id
    with: { ehr_id: "${row.ehr_id}" }
    expect: created
    capture: { recreated_ehr_id: created.ehr_id }
  - step: 5
    call: I_EHR_SERVICE.get_ehr
    with: { ehr_id: "${row.ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
      - { assert: field, path: "ehr_id/value", equals: "${recreated_ehr_id}" }
postconditions:
  - assert: state
    text: >-
      The physical delete released the identifier: the id read as absent and
      then carried a newly created EHR (verified by steps 3 to 5).
