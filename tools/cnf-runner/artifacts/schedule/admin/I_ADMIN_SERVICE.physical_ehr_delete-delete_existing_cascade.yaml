# THE SINGLE-EHR ROUTE'S CASCADE — the sibling of
# I_ADMIN_SERVICE.physical_ehr_delete-delete_existing, which proves only that
# the SM precondition `has_ehr` has become false. That is the operation's
# postcondition-by-inference and nothing more; the released text promises far
# more, and until now nothing asserted it.
#
# The sentence asserted here is operations/admin_ehr_delete.yaml's own: "All
# resources associated with or owned by the specified EHR (such as COMPOSITION,
# EHR_STATUS, ITEM_TAG, CONTRIBUTION, and their historical versions) will also
# be **permanently** and physically deleted, in compliance with applicable data
# protection regulations (e.g., the GDPR in the European Union)" — read together
# with responses/204_deleted_hard.yaml ("the resource(s) identified by the
# request parameters has been physically deleted (i.e. hard-delete)").
#
# WHAT THIS CAN AND CANNOT OBSERVE: the released reads for a COMPOSITION and a
# CONTRIBUTION are both EHR-scoped by path, so a 404 after the delete cannot be
# separated from the EHR's own absence. Unreachability is the strongest
# observable form of the promise and is exactly what is asserted; the
# storage-level closure is our own design over our own schema (no openEHR spec
# governs the FK graph) and is proven by DB-backed tests. ITEM_TAG, the third
# class the sentence names, has no runner verb yet (#288) and is therefore not
# probed here — the tag family's own wire_surface elements carry that.
# Register AMB-143 carries the missing postcondition and the "such as"
# open-endedness; AMB-10 carries why this delete is physical at all.
id: I_ADMIN_SERVICE.physical_ehr_delete-delete_existing_cascade
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.physical_ehr_delete
capabilities: [PhysicalDeletion, AdminApi]
exercises: [ChangeSets, CompositionOps]
profiles: [OPTIONS]
test_purpose: >-
  Physically deleting one EHR destroys what that EHR owned, not just the EHR:
  a COMPOSITION and the CONTRIBUTION that committed it are both unreachable
  afterwards.
description: "Single-EHR physical delete cascades to the EHR's owned resources"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.physical_ehr_delete"
  - "ITS-REST admin §admin_ehr_delete (the owned-resource cascade sentence; 204_deleted_hard)"
  - "RM common §change_control (master06 §Contributions — every change is a CONTRIBUTION carrying its VERSIONs)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # admin EHR deletion arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-80)
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — docs/admin/Description.md §Status: \"This specification is in the `DEVELOPMENT` state\", and docs/overview/Preface.md §Conformance is \"tbd.\"; guarded until the Admin API stabilises"
  - "the cascade list is exemplary (\"such as\") and the SM operation states a precondition but no postcondition — register AMB-143; what is asserted here is the released promise's observable form, unreachability, since no released read can see inside a destroyed EHR"
  - "ITEM_TAG, the third owned class the cascade sentence of ITS-REST operations/admin_ehr_delete.yaml names — RM common master07-tags.adoc — has no runner verb yet, so it is not probed here; the tag family's own wire_surface elements carry that surface"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                              # one change set carrying one COMPOSITION
    call: I_EHR_CONTRIBUTION.commit_contribution
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      composition_uid: created.first_versioned_object_uid
  - step: 2
    call: physical_ehr_delete            # DELETE /admin/ehr/{ehr_id}
    on: admin                            # ADMIN-role principal (ixit)
    with: { ehr_id: "${ehr_id}" }
    expect: ok_empty                     # 204 No Content — hard delete, no VERSION produced
  - step: 3                              # the EHR itself (the has_ehr postcondition the sibling case covers)
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
  - step: 4                              # the owned COMPOSITION
    call: I_EHR_COMPOSITION.get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${composition_uid}" }
    expect: not_found
  - step: 5                              # the owned CONTRIBUTION
    call: I_EHR_CONTRIBUTION.get_contribution
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: not_found
postconditions:
  - assert: state
    text: >-
      Nothing the deleted EHR owned is reachable: neither the COMPOSITION
      committed into it nor the CONTRIBUTION that committed it (verified by
      steps 4 and 5).
