# The BULK physical delete whose `ehr_id` selector carries ONE malformed id
# beside a well-formed one: the whole call is refused as a client error, and
# nothing is deleted — a typo in one id cannot silently destroy the well-formed
# ones in the same request.
#
# THE REFUSAL. DOCS TEXT (ITS-REST overview Requests_and_responses.md §"HTTP
# status codes", the 400 row verbatim): "The service cannot or will not process
# the request due to something that is perceived to be a client error (e.g.,
# malformed request syntax, syntactically invalid content)", with the clause
# below the table — "Status code `400` indicates normally a bad request, as
# well as a generic client-side error, used when no other `4xx` error code is
# appropriate". The selector is an EHR identifier
# (parameters/query/ehr_id_Admin.yaml: "An optional parameter to perform the
# operation on a subset of EHRs") and SM i_admin_service.adoc
# §physical_ehr_delete types it `an_ehr_id: UUID [1]`, so a token that parses
# as no identifier form at all is syntactically invalid content.
#
# THE ORDERING — validate the whole list, then act — has no released sentence
# and is adjudicated in register AMB-140. It is what step 3 checks: the
# well-formed companion id survives, so the refusal happened BEFORE any
# deletion rather than after a partial one.
#
# The outcome kind is `bad_request`, added by the 2026-07-28 schedule release
# (#544); before it the closed taxonomy had no malformed-request kind
# (`precondition_missing` means an absent If-Match version precondition, not a
# syntactically invalid identifier), which is why this behaviour was carried as
# the `admin-bulk-delete-malformed-id-rejection` ledger exception.
#
# `requires.server: any` — like the -delete_all_subset sibling and unlike
# -delete_all_unfiltered, the call names a subset, so it needs no exclusively
# owned instance. Its refusal deletes nothing at all.
id: I_ADMIN_SERVICE.physical_ehr_delete-delete_all_malformed_id
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.physical_ehr_delete
capabilities: [PhysicalDeletion, AdminApi]
profiles: [OPTIONS]
ambiguities: [AMB-140]
test_purpose: >-
  A bulk delete whose ehr_id selector carries one malformed id beside a
  well-formed one is refused as a client error, and the well-formed EHR is
  still retrievable afterwards.
description: "Physically delete a subset with one malformed ehr_id (nothing is deleted)"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.physical_ehr_delete"
  - "ITS-REST admin §admin_ehr_delete_all (DELETE /admin/ehr/all?ehr_id= — the subset selector)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "BASE base_types §identification (mutually exclusive UID string patterns)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # admin EHR deletion arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-80)
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — docs/admin/Description.md §Status: \"This specification is in the `DEVELOPMENT` state\", and docs/overview/Preface.md §Conformance is \"tbd.\"; guarded until the Admin API stabilises"
  - "admin_ehr_delete_all realizes NO SM operation — SM i_admin_service.adoc §physical_ehr_delete takes a single `an_ehr_id: UUID [1]` and the I_ADMIN_ARCHIVE list operations archive rather than delete (register AMB-33); the `delete_all` variant anchor is a catalogue naming convention, never an SM claim"
  - "the VALIDATE-THEN-ACT ordering step 2 checks rests on the AMB-140 adjudication — ITS-REST specifications/operations/admin_ehr_delete_all.yaml states only the subset semantics and parameters/query/ehr_id_Admin.yaml only that the selector is optional, so no released sentence orders validation against deletion; a server that deleted the well-formed id and then reported 400 breaches no quoted rule"
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id} — the well-formed companion that must survive
flow:
  - step: 1
    call: physical_ehr_delete
    variant: delete_all                  # DELETE /admin/ehr/all?ehr_id=<uuid>&ehr_id=not-an-ehr-id
    on: admin                            # ADMIN-role principal (ixit)
    with:
      ehr_id_subset: "${ehr_id}"         # well-formed
      ehr_id_subset_2: "not-an-ehr-id"   # a UID of no kind (BASE §identification)
    expect: bad_request                  # §HTTP status codes row 400
  - step: 2                              # the well-formed id in the SAME call survives — AMB-140's validate-then-act
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${ehr_id}" }
    expect: ok
postconditions:
  - assert: state
    text: >-
      The refused call deleted nothing: the well-formed EHR named alongside the
      malformed token is still retrievable (verified by step 2).
