# The ADMIN gate's authentication half on the demographic archive half — the
# mirror of the archive_ehrs sibling. EXTENSION ROUTE (register AMB-33): the
# row gates the DemographicArchive CAPABILITY verdict only. The 401 mapping is
# UNIVERSAL (selectors.yaml universal_outcomes: unauthenticated -> 401,
# route-table-wide).
id: I_ADMIN_ARCHIVE.archive_parties-unauthenticated
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_parties
capabilities: [DemographicArchive]
exercises: [AdminApi, AuthenticatedAccess]
profiles: [OPTIONS]
test_purpose: >-
  A request carrying no valid authentication is refused before an existing
  Party is moved to archival storage.
description: "Unauthenticated party archiving is refused"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_parties"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 401 — unauthenticated)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the DemographicArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires:
  server: any
  party: cnf.demographic.person.v1         # mints ${party_id} — a REAL target, so 401 is no disguised 404
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: archive_parties
    on: unauthenticated
    with: { party_ids: ["${party_id}"] }
    expect: unauthenticated                # universal 401 (route-table-wide)
postconditions:
  - assert: state
    text: >-
      The named Party is not archived; that it stays addressable is what the
      -archive_twice sibling drives.
    verified_by: I_ADMIN_ARCHIVE.archive_parties-archive_twice
ambiguities: [AMB-33]
