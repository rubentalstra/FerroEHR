# WHAT "ARCHIVED" MEANS ON THE READ WIRE, proven inside the extension surface.
#
# `archive_ehrs` "Move[s] selected EHRs to archival storage"
# (i_admin_archive.adoc) and its ONLY declared error is
# `ehr_id_does_not_exist`. So the second archiving of an already-archived EHR
# decides the post-archive question by itself: if archival removed the EHR from
# the addressable set, the repeat would raise that error; a FULFILLED repeat is
# the wire statement that an archived EHR is still a known EHR — archival is a
# lifecycle marker, not an erasure, and the operation is idempotent.
#
# This is deliberately the whole post-archive read proof this battery carries.
# A fuller one would read the archived EHR back through a RELEASED operation,
# which an extension-only battery must not do (the realization-scope law: a
# case whose subject is an extension operation must not drive released wire, or
# the realization it evidences stops being the one it is about). That
# released-read half is HTTP-tested in-process instead
# (app/ehrbase-rest/tests/admin_extension_http.rs
# `archiving_an_ehr_is_read_neutral_and_idempotent`), and the boundary is
# recorded on the admin-archive family in vocab/wire_surface.yaml.
id: I_ADMIN_ARCHIVE.archive_ehrs-archive_twice
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_ehrs
capabilities: [EhrArchive]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  Archiving an already-archived EHR is fulfilled, not refused as unknown — an
  archived EHR remains an addressable EHR, and the move is idempotent.
description: "Archive the same EHR twice"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }        # mints ${ehr_id}
flow:
  - step: 1
    call: archive_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { ehr_ids: ["${ehr_id}"] }
    expect: ok
  - step: 2
    call: archive_ehrs
    on: admin
    with: { ehr_ids: ["${ehr_id}"] }
    expect: ok                             # NOT not_found — the archived EHR is still known
ambiguities: [AMB-33]
