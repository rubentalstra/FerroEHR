# Official master12 case (chapter is TBD: the vendored master12 lists this SM
# operation with two placeholder test cases `aaaa`/`bbbb` and no content, so
# the id is a NATURAL family id derived from the resolvable SM operation —
# AMB-33). ITS-REST 1.1.0 surfaces no wire for
# I_ADMIN_SERVICE.list_contributions (the only admin_* operations are
# admin_ehr_delete / admin_ehr_delete_all), so the its-rest binding declares
# the operation unrealized (AMB-33) and this case is not-applicable with
# citation on this ITS, activating when a later ITS release adds the endpoint.
id: I_ADMIN_SERVICE.list_contributions-all
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.list_contributions
capabilities: [ActivityReport]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  Listing all Contribution ids on the system returns the ids of every
  Contribution held (no time range supplied).
description: "List all contributions (no time range)"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.list_contributions"
  - "CNF platform_test_schedule master12 §list_contributions"
applies: { rm: ">=1.0.2" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }        # commits exist so there is something to list
flow:
  - step: 1
    call: list_contributions
    with: { a_service: "ehr" }
    expect: ok
ambiguities: [AMB-33]
