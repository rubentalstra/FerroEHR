# Official master12 case (chapter TBD; NATURAL family id — see REQUIREMENTS.md).
# ITS-REST 1.1.0 has no admin party-delete wire (only admin_ehr_delete*), so
# the its-rest binding declares physical_party_delete unrealized (AMB-33).
# Physical deletion is a HARD delete producing no VERSION => ok_empty. Party
# provisioning has no `requires` vocabulary (a demographic-service concern), so
# the precondition is stated as a populated system.
id: I_ADMIN_SERVICE.physical_party_delete-delete_existing
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.physical_party_delete
capabilities: [PhysicalDeletion]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  Physically deleting an existing Party removes the Party and its related
  Party relationships with no content.
description: "Physically delete an existing party and its relationships"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.physical_party_delete"
  - "CNF platform_test_schedule master12 §physical_party_delete"
applies: { rm: ">=1.0.2" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: physical_party_delete
    with: { a_party_id: "11111111-1111-1111-1111-111111111111" }
    expect: ok_empty
ambiguities: [AMB-33]
