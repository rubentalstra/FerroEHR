# The SM `COMPRESSION_FORMAT.7z` member (compression_format.adoc declares
# exactly `zip` and `7z`), realized by this product 2026-07-29 (owner
# approval; the `sevenz-rust2` writer/reader pair) — the sibling of the
# `-export_formats` case's `zip` row. EXTENSION ROUTE (register AMB-33): no
# openEHR spec governs the wire; the case gates the EhrDumpLoad CAPABILITY
# only, never ITS-REST wire conformance, and is party-scoped at selection.
# `file_sys_loc` is a location on the SUT's OWN file system — an IXIT
# declaration (`${ixit:dump_location}`), never a runner guess.
id: I_ADMIN_DUMP_LOAD.export_ehrs-compression_7z
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
profiles: [OPTIONS]
test_purpose: >-
  An export requesting the SM 7z compression member is fulfilled: the
  archive lands as one packed container at the declared location.
description: "Export with COMPRESSION_FORMAT 7z"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "SM openehr_platform UML compression_format.adoc (the 7z member)"
applies: { rm: ">=1.0.2" }
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: export_ehrs
    on: admin
    with:
      file_sys_loc: "${ixit:dump_location}/export_7z"
      logical_fmt: "openehr_canonical_json"
      comp_fmt: "7z"
      segment_split_size: 1024
    expect: ok
ambiguities: [AMB-33]
