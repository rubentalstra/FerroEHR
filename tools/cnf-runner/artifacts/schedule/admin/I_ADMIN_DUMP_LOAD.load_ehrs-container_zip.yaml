# CONTAINER DETECTION, zip. `load_ehrs(file_sys_loc)` takes exactly ONE
# parameter (i_admin_dump_load.adoc) — it is never told which
# COMPRESSION_FORMAT the export used, so it must DETECT the container from what
# the location holds. This case closes the detection loop for the
# `compression_format.adoc` member `zip`: the export writes the packed
# container, and the format-less load reads it back.
#
# The -compression_7z sibling exercises the OTHER member the enumeration
# declares, and -load_archive the uncompressed (loose-entry) form: three
# containers, three cases, one detection law.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrDumpLoad CAPABILITY
# verdict only.
id: I_ADMIN_DUMP_LOAD.load_ehrs-container_zip
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.load_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A load against a location holding a zip-compressed export is fulfilled: the
  format-less operation detects the packed container and reads the archive.
description: "Load a zip-compressed export archive"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.load_ehrs"
  - "SM openehr_platform UML compression_format.adoc (the zip member)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
# The producing export is a DRIVEN step, not provisioning: `load_ehrs` reads
# "an export archive on file system" and the only operation that produces one
# is `export_ehrs`. Both steps drive the SAME extension family, so the case
# stays extension-only for the realization-scope gate.
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: export_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with:
      file_sys_loc: "${ixit:dump_location}/container_zip"
      logical_fmt: "openehr_canonical_json"
      comp_fmt: "zip"
      segment_split_size: 1024
    expect: ok
  - step: 2
    call: load_ehrs
    on: admin
    with:
      file_sys_loc: "${ixit:dump_location}/container_zip"
    expect: ok
ambiguities: [AMB-33]
