# The ADMIN gate's AUTHORIZATION half, on the activity-report extension family
# — the sibling of the -unauthenticated case. EXTENSION ROUTE (register
# AMB-33): the row gates the ActivityReport CAPABILITY verdict only.
#
# The probing principal is the party's ORDINARY `sut` instance: it is
# authenticated, and it holds no ADMIN authorization, so its refusal on an
# admin-gated route IS the 403 — authorization enforced separately from
# authentication (the same two-principal shape the SEC-AUTHORIZATION_SEPARATION
# case uses on the released write surface). The 403 mapping is UNIVERSAL
# (selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide).
id: I_ADMIN_SERVICE.contribution_count-forbidden
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.contribution_count
capabilities: [ActivityReport]
exercises: [AdminApi, AuthorizationSeparation]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated principal without administrative authorization is refused on
  EVERY activity-report route, so the report discloses no repository statistics
  to an ordinary caller.
description: "A non-administrative principal is forbidden from the activity report"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.contribution_count"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 403 — forbidden)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/report/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the ActivityReport CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: list_contributions
    on: sut                                # authenticated, NOT administrative
    with: { a_service: "Ehr" }
    expect: forbidden                      # universal 403 (route-table-wide)
  - step: 2
    call: contribution_count
    on: sut
    with: { a_service: "Ehr" }
    expect: forbidden
  - step: 3
    call: versioned_composition_count
    on: sut
    with: { a_service: "Ehr" }
    expect: forbidden
  - step: 4
    call: composition_version_count
    on: sut
    with: { a_service: "Ehr" }
    expect: forbidden
ambiguities: [AMB-33]
