# Official master12 case (chapter TBD — AMB-33; NATURAL family ids).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#637): ITS-REST 1.1.0 still
# realizes only admin_ehr_delete / admin_ehr_delete_all of the SM Admin surface
# and surfaces no reporting resource (register AMB-33) — but this product SERVES
# the operation on a declared extension route under /admin/report/, so the case
# is EXECUTED against that route instead of resolving excused. It gates the
# ActivityReport capability only; no openEHR profile tier and no ITS-REST
# wire-conformance claim rests on it.
id: I_ADMIN_SERVICE.composition_version_count-time_range
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.composition_version_count
capabilities: [ActivityReport]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: "Counting COMPOSITION versions within an explicit time range returns the count for that interval only."
description: "Count composition versions within a time range"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.composition_version_count"
  - "CNF platform_test_schedule master12 §composition_version_count"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/report/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the ActivityReport CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: composition_version_count
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { a_service: "ehr", time_interval: "2020-01-01T00:00:00Z/2026-12-31T00:00:00Z" }
    expect: ok
ambiguities: [AMB-33]
