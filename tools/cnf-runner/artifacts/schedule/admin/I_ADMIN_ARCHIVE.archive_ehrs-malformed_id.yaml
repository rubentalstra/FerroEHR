# The syntactic half of the id boundary, distinct from -archive_unknown (which
# names a WELL-FORMED id that resolves to nothing). A member that is not a
# well-formed identifier resolves to nothing NAMEABLE, so the request cannot be
# carried out at all — a precondition violation rather than the SM's
# `ehr_id_does_not_exist`, which is an assertion about a real identifier.
#
# The list also carries a VALID, existing id, which is the whole point: the
# operation is all-or-nothing (every member is checked before any marker is
# written), so one malformed member must refuse the WHOLE request rather than
# archive the good half.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrArchive CAPABILITY
# verdict only.
id: I_ADMIN_ARCHIVE.archive_ehrs-malformed_id
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_ehrs
capabilities: [EhrArchive]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A set containing a malformed EHR id is refused as a precondition violation,
  and the well-formed member alongside it is not archived either.
description: "Archive a set containing a malformed EHR id"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }        # mints ${ehr_id} — the well-formed member of the mixed list
flow:
  - step: 1
    call: archive_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { ehr_ids: ["${ehr_id}", "not-an-identifier"] }
    expect: bad_request
postconditions:
  - assert: state
    text: >-
      Neither member is archived (all-or-nothing). Archival is read-neutral by
      design, so the marker's absence is not disclosed on the wire; what the
      wire does prove is that the well-formed member stays addressable, which
      the -archive_twice sibling drives.
    verified_by: I_ADMIN_ARCHIVE.archive_ehrs-archive_twice
ambiguities: [AMB-33]
