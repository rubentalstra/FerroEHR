# `EXPORT_SPEC.segment_split_size: Integer [1..1]` is "Size in kb of segment
# size on file system to split the export into" (export_spec.adoc). A size of
# zero or less is not a segment size — no split is expressible at it — so the
# export specification cannot be satisfied and the call is refused rather than
# quietly falling back to some other size, which would write an archive laid
# out differently from the one that was asked for.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrDumpLoad CAPABILITY
# verdict only.
#
# NO STATE PROOF is authorable for the no-write half — see the
# -format_not_a_member sibling: observing what a location holds means loading
# it, and the "no readable archive" answer is a 5xx with no outcome kind. The
# no-write effect is proved in-process (app/ferroehr/tests/service_dump_load.rs).
id: I_ADMIN_DUMP_LOAD.export_ehrs-segment_split_size_non_positive
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  An export whose `segment_split_size` is not a positive kb size is refused as
  a precondition violation, never silently re-sized.
description: "Export with a non-positive segment split size"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "SM openehr_platform UML export_spec.adoc (segment_split_size, kb)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: export_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with:
      file_sys_loc: "${ixit:dump_location}/split_size_zero"
      logical_fmt: "openehr_canonical_json"
      segment_split_size: 0
    expect: bad_request
ambiguities: [AMB-33]
