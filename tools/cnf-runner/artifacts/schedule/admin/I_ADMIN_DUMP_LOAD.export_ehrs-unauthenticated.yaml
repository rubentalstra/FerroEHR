# The ADMIN gate's authentication half on the dump/load extension family, over
# BOTH halves in one sweep — the pair is the highest-value target on the whole
# admin surface: `export_ehrs` "Export[s] ALL EHRs to a file-system location"
# (i_admin_dump_load.adoc), so an unauthenticated export would be a
# whole-repository disclosure, and `load_ehrs` "Populate[s] EHR repository from
# export archive", so an unauthenticated load would be a whole-repository
# injection.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrDumpLoad CAPABILITY
# verdict only. The 401 mapping is UNIVERSAL (selectors.yaml
# universal_outcomes: unauthenticated -> 401, route-table-wide).
#
# Both refusals land at the group gate, before any file-system or repository
# work — but neither no-write effect is authorable as a wire state proof:
# observing what a location holds means loading it, and the "no readable
# archive" answer is the SM's `file_not_writable`, a 5xx the closed outcome
# vocabulary has no kind for (the boundary recorded on the admin-dump-load
# family in vocab/wire_surface.yaml). Proved in-process instead
# (app/ehrbase-rest/tests/admin_extension_http.rs).
id: I_ADMIN_DUMP_LOAD.export_ehrs-unauthenticated
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi, AuthenticatedAccess]
profiles: [OPTIONS]
test_purpose: >-
  A request carrying no valid authentication is refused on both dump/load
  halves, so neither the whole-repository export nor the whole-archive import
  is reachable without credentials.
description: "Unauthenticated dump and load are refused"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.load_ehrs"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 401 — unauthenticated)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
# `file_sys_loc` is a location on the SUT's OWN file system, which no operation
# discloses — an IXIT declaration (`${ixit:dump_location}`), never a runner
# guess. A party that declares none makes this case not-applicable.
requires: { server: any }
flow:
  - step: 1
    call: export_ehrs
    on: unauthenticated
    with: { file_sys_loc: "${ixit:dump_location}/unauthenticated" }
    expect: unauthenticated                # universal 401 (route-table-wide)
  - step: 2
    call: load_ehrs
    on: unauthenticated
    with: { file_sys_loc: "${ixit:dump_location}/unauthenticated" }
    expect: unauthenticated
ambiguities: [AMB-33]
