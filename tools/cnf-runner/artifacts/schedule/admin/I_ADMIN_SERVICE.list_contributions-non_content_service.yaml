# The other side of the `a_service` boundary, and the reason the out-of-member
# case above must NOT be answered emptily: `a_service` is "Name of a versioned
# content service" (i_admin_service.adoc), and platform_service.adoc declares
# members that are NOT versioned-content services (Query, Admin, Definitions,
# Ehr_index, Message, System_log). A DECLARED member that holds no versioned
# content is a legitimate argument and reports the empty listing — it is not a
# refusal, and conflating the two would make an enumeration typo look like a
# real answer.
# EXTENSION ROUTE (register AMB-33): the row gates the ActivityReport
# CAPABILITY verdict only.
id: I_ADMIN_SERVICE.list_contributions-non_content_service
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.list_contributions
capabilities: [ActivityReport]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A report for a declared PLATFORM_SERVICE member that holds no versioned
  content is fulfilled with an empty listing, not refused.
description: "Report for a declared service that holds no versioned content"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.list_contributions"
  - "SM openehr_platform UML platform_service.adoc (the closed member set)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/report/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the ActivityReport CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }        # committed content exists — the empty answer is scope, not emptiness
flow:
  - step: 1
    call: list_contributions
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { a_service: "Query" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }    # the querying service holds no CONTRIBUTIONs of its own
ambiguities: [AMB-33]
