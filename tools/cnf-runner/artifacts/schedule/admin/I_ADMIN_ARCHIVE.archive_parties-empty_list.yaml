# The empty-selection boundary on the demographic half. `archive_parties`
# takes a `List<String>` (i_admin_archive.adoc) and its only declared error is
# `party_id_does_not_exist` — an error ABOUT a named id. An empty list names no
# id, so nothing can be not-found and the operation has nothing to move:
# fulfilled, not refused.
# EXTENSION ROUTE (register AMB-33): the row gates the DemographicArchive
# CAPABILITY verdict only.
id: I_ADMIN_ARCHIVE.archive_parties-empty_list
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_parties
capabilities: [DemographicArchive]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  Archiving an EMPTY set of Parties is fulfilled and moves nothing — an empty
  List names no target for the operation's only declared error.
description: "Archive an empty set of parties"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_parties"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the DemographicArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: archive_parties
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { party_ids: [] }
    expect: ok
ambiguities: [AMB-33]
