# `logical_fmt` is typed `EXPORT_FORMAT [0..1]` (i_admin_dump_load.adoc) and
# export_format.adoc declares exactly two members
# (openehr_canonical_xml, openehr_canonical_json). A value naming no member is
# not an EXPORT_FORMAT, so the argument cannot be constructed and the export is
# refused — never silently dropped to the default, which would write the
# archive in a format the caller did not ask for and believe they had.
#
# Distinct from the -export_formats sibling (which drives DECLARED members) and
# from -encoding_unrepresentable (whose enumeration has no members at all).
#
# NO STATE PROOF is authorable for the no-write half: the only way to observe
# what a location holds is `load_ehrs`, and its "no readable archive" answer is
# the SM's `file_not_writable`, a 5xx the closed outcome vocabulary has no kind
# for (the boundary recorded on the admin-dump-load family in
# vocab/wire_surface.yaml). The refusal's no-write effect is proved in-process
# instead (app/ferroehr/tests/service_dump_load.rs).
# EXTENSION ROUTE (register AMB-33): the row gates the EhrDumpLoad CAPABILITY
# verdict only.
id: I_ADMIN_DUMP_LOAD.export_ehrs-format_not_a_member
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  An export whose `logical_fmt` names no EXPORT_FORMAT member is refused as a
  precondition violation, never written in a substituted format.
description: "Export with a logical format outside the EXPORT_FORMAT enumeration"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "SM openehr_platform UML export_format.adoc (the closed member set)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: export_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with:
      file_sys_loc: "${ixit:dump_location}/format_not_a_member"
      # `canonical_json` LOOKS like the member and is not it: export_format.adoc
      # spells it `openehr_canonical_json`.
      logical_fmt: "canonical_json"
      segment_split_size: 1024
    expect: bad_request
ambiguities: [AMB-33]
