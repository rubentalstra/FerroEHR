# The ADMIN gate's authentication half, on the activity-report extension
# family. EXTENSION ROUTE (register AMB-33): no openEHR spec governs
# /admin/report/*, so the row gates the ActivityReport CAPABILITY verdict only.
# The 401 mapping itself is UNIVERSAL (selectors.yaml universal_outcomes:
# unauthenticated -> 401, route-table-wide), so no per-binding outcome carries
# it and the sweep may span the family's four operations freely — which is the
# point: the gate is written once, and this case proves no reporting route
# escapes it.
id: I_ADMIN_SERVICE.contribution_count-unauthenticated
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.contribution_count
capabilities: [ActivityReport]
exercises: [AdminApi, AuthenticatedAccess]
profiles: [OPTIONS]
test_purpose: >-
  A request carrying no valid authentication is refused on EVERY activity-report
  route, before any parameter is read or any repository content is counted.
description: "Unauthenticated activity-report requests are refused"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.contribution_count"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 401 — unauthenticated)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/report/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the ActivityReport CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: list_contributions
    on: unauthenticated
    with: { a_service: "Ehr" }
    expect: unauthenticated               # universal 401 (route-table-wide)
  - step: 2
    call: contribution_count
    on: unauthenticated
    with: { a_service: "Ehr" }
    expect: unauthenticated
  - step: 3
    call: versioned_composition_count
    on: unauthenticated
    with: { a_service: "Ehr" }
    expect: unauthenticated
  - step: 4
    call: composition_version_count
    on: unauthenticated
    with: { a_service: "Ehr" }
    expect: unauthenticated
ambiguities: [AMB-33]
