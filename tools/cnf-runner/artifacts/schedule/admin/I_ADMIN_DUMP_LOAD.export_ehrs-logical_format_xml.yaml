# The SM `EXPORT_FORMAT.openehr_canonical_xml` member (export_format.adoc
# declares exactly `openehr_canonical_xml` and `openehr_canonical_json`),
# realized by this product 2026-07-29 — the sibling of the `-export_formats`
# case's `openehr_canonical_json` row, so the enumeration is driven member by
# member instead of only at its default.
#
# WHAT THE MEMBER MEANS HERE, re-derived first-hand and adjudicated on register
# AMB-33: `EXPORT_SPEC.logical_format` is "logical format to use, i.e. flavour
# of XML, JSON etc." (export_spec.adoc), so it governs the exported CONTENT.
# The archive's own envelope has no XML form to target — the published ITS-XML
# bundles declare NO global element for EHR, CONTRIBUTION or a standalone
# AUDIT_DETAILS in either lineage — so it stays JSON in both members, while
# each version's payload becomes a complete ORIGINAL_VERSION document under
# `ALL/Version.xsd`'s published `<version>` root.
#
# EXTENSION ROUTE (register AMB-33): no openEHR spec governs the wire; the case
# gates the EhrDumpLoad CAPABILITY only, never ITS-REST wire conformance.
# `file_sys_loc` is a location on the SUT's OWN file system — an IXIT
# declaration (`${ixit:dump_location}`), never a runner guess.
id: I_ADMIN_DUMP_LOAD.export_ehrs-logical_format_xml
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  An export requesting the SM openehr_canonical_xml logical format is
  fulfilled: the archive lands at the declared location with its version
  payloads in canonical XML.
description: "Export with EXPORT_FORMAT openehr_canonical_xml"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "SM openehr_platform §EXPORT_SPEC (logical_format: flavour of XML, JSON etc.)"
  - "SM UML/classes/export_format.adoc (the openehr_canonical_xml member)"
  - "ITS-XML components/RM/Release-1.0.2/documents §Validating documents (Version.xsd — the globally declared `version` element over an ABSTRACT VERSION type)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: export_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with:
      file_sys_loc: "${ixit:dump_location}/logical_format_xml"
      logical_fmt: "openehr_canonical_xml"
      segment_split_size: 1024
    expect: ok
ambiguities: [AMB-33]
