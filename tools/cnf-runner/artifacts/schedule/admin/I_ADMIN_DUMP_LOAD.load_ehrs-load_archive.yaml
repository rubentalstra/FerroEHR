# Official master12 case (chapter TBD — AMB-33; NATURAL family ids).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#659): ITS-REST 1.1.0 still
# realizes only admin_ehr_delete / admin_ehr_delete_all of the SM Admin surface
# and nothing in the release reads or writes a file-system archive (register
# AMB-33) — but this product SERVES the operation on a declared extension route
# under /admin/, so the case is EXECUTED against that route instead of resolving
# excused. It gates the EhrDumpLoad capability only; no openEHR profile tier and
# no ITS-REST wire-conformance claim rests on it.
id: I_ADMIN_DUMP_LOAD.load_ehrs-load_archive
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.load_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: "Loading an export archive back into the repository it came from succeeds and reports the duplicate EHR ids per entity, never fatally."
description: "Load an export archive into a non-empty repository"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.load_ehrs"
  - "SM openehr_platform §DUMP_LOAD_FAIL_REPORT"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
# TWO driven steps, and the first is NOT provisioning that belongs in
# `requires`: `load_ehrs` reads "an export archive on file system", and the ONLY
# operation that produces one is `export_ehrs` — there is no precondition
# vocabulary for an on-SUT archive and inventing one would express the same
# call under another name. Both steps drive the SAME extension family, so the
# case stays extension-only for the realization-scope gate.
#
# The expectation is the SM's own sentence: "Repository need not be empty, but
# import EHRs with duplicate EHR ids will fail" — a PER-ENTITY failure carried
# in the `List<DUMP_LOAD_FAIL_REPORT>` return, not an operation failure. So
# re-loading a repository's own archive is FULFILLED.
# `file_sys_loc` is a location on the SUT's OWN file system, and which paths a
# deployment can write is a property of its image and mounts that no operation
# discloses — so it is an IXIT declaration (`${ixit:dump_location}`), never a
# runner guess. A party that declares none makes this case not-applicable with
# that citation.
requires: { ehr: { commits: any } }
flow:
  - step: 1
    call: export_ehrs
    on: admin
    with:
      file_sys_loc: "${ixit:dump_location}/round_trip"
    expect: ok
  - step: 2
    call: load_ehrs
    on: admin
    with:
      file_sys_loc: "${ixit:dump_location}/round_trip"
    expect: ok
ambiguities: [AMB-33]
