# Official master12 case (chapter TBD — AMB-33; NATURAL family ids).
#
# REALIZATION, re-derived first-hand 2026-07-29 (#637): ITS-REST 1.1.0 still
# realizes only admin_ehr_delete / admin_ehr_delete_all of the SM Admin surface
# and nothing in the release moves a resource to archival storage (register
# AMB-33) — but this product SERVES the operation on a declared extension route
# under /admin/archive/, so the case is EXECUTED against that route instead of
# resolving excused. It gates the EhrArchive capability only; no openEHR profile tier
# and no ITS-REST wire-conformance claim rests on it.
id: I_ADMIN_ARCHIVE.archive_ehrs-archive_unknown
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_ehrs
capabilities: [EhrArchive]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: "Archiving a set that names a non-existent EHR is rejected as not found."
description: "Archive a set naming an unknown EHR"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_ehrs"
  - "CNF platform_test_schedule master12 §archive_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: empty }
flow:
  - step: 1
    call: archive_ehrs
    with: { ehr_ids: ["00000000-0000-0000-0000-000000000000"] }
    expect: not_found
ambiguities: [AMB-33]
