# `time_interval` carries the SM `Interval<Iso8601_date_time>`
# (i_admin_service.adoc) as the `<lower>/<upper>` bound PAIR — an Interval is
# two bounds (BASE org.openehr.base.foundation_types.interval.adoc §Attributes:
# `lower`, `upper`, each optional for an open side). A value naming a single
# instant with no separator is therefore not an Interval, and which bound it
# was meant to be is unknowable: reading it as either one would answer over a
# window the caller never named. Refused instead.
# EXTENSION ROUTE (register AMB-33): the row gates the ActivityReport
# CAPABILITY verdict only.
id: I_ADMIN_SERVICE.composition_version_count-interval_not_a_pair
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.composition_version_count
capabilities: [ActivityReport]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A report request whose `time_interval` carries a single instant instead of a
  bound pair is refused as a precondition violation, never guessed into a
  half-open interval.
description: "Report over a time_interval that is not a bound pair"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.composition_version_count"
  - "BASE foundation_types §Interval (lower/upper bound pair)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/report/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the ActivityReport CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: composition_version_count
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { a_service: "Ehr", time_interval: "2020-01-01T00:00:00Z" }
    expect: bad_request
ambiguities: [AMB-33]
