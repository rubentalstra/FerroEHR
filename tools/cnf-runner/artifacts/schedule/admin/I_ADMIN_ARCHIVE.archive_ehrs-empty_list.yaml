# The empty-selection boundary. `archive_ehrs` takes a `List<String>`
# (i_admin_archive.adoc) and its only declared error is
# `ehr_id_does_not_exist` — an error ABOUT a named id. An empty list names no
# id, so no declared error can arise and the operation has simply nothing to
# move: fulfilled, not refused.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrArchive CAPABILITY
# verdict only.
id: I_ADMIN_ARCHIVE.archive_ehrs-empty_list
kind: functional
component: ADMIN
sm_operation: I_ADMIN_ARCHIVE.archive_ehrs
capabilities: [EhrArchive]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  Archiving an EMPTY set of EHRs is fulfilled and moves nothing — an empty
  List names no target for the operation's only declared error.
description: "Archive an empty set of EHRs"
spec_refs:
  - "SM openehr_platform §I_ADMIN_ARCHIVE.archive_ehrs"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/archive/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrArchive CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: archive_ehrs
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { ehr_ids: [] }
    expect: ok
ambiguities: [AMB-33]
