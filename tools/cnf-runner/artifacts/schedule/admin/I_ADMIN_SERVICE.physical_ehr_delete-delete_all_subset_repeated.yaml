# The BULK physical delete with a TWO-MEMBER `ehr_id` subset selector, sent in
# the released RFC 6570 exploded form (`?ehr_id=a&ehr_id=b`): BOTH named EHRs
# are destroyed and an unnamed one survives.
#
# Why this form and not a comma-joined value: the released path template is
# `/admin/ehr/all{?ehr_id*}` (admin.openapi.yaml — the only RFC 6570 query
# expansion in the whole released API) and parameters/query/ehr_id_Admin.yaml
# declares `style: form`, `explode: true` with a `multiple` example listing two
# identifiers. The operation's own prose fixes only that a subset is
# "identified using the `ehr_id` query parameter" and no serialization form at
# all, so the exploded form is the one the released artifacts actually
# describe; a comma-joined value would assert a serialization nothing states.
#
# What the one-member sibling (…-delete_all_subset) cannot show: that EVERY
# named id is deleted rather than only the first one the server happens to
# parse. That is the whole point of this case, and it is why the survivor probe
# is kept as well — together the three probes say "exactly the named set".
#
# `requires.server: any` — like the one-member sibling this call destroys only
# what it names, so it needs no exclusively owned instance.
id: I_ADMIN_SERVICE.physical_ehr_delete-delete_all_subset_repeated
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.physical_ehr_delete
capabilities: [PhysicalDeletion, AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  The bulk delete called with a two-member ehr_id subset selector in the
  repeated query form deletes BOTH named EHRs and leaves an unnamed EHR
  retrievable.
description: "Physically delete a two-id ehr_id subset sent as ?ehr_id=a&ehr_id=b"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.physical_ehr_delete"
  - "ITS-REST admin §admin_ehr_delete_all (DELETE /admin/ehr/all?ehr_id= — the subset selector)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "ITS-REST Admin API is DEVELOPMENT-stage — docs/admin/Description.md §Status: \"This specification is in the `DEVELOPMENT` state\", and docs/overview/Preface.md §Conformance is \"tbd.\"; guarded until the Admin API stabilises"
  - "admin_ehr_delete_all realizes NO SM operation — SM i_admin_service.adoc §physical_ehr_delete takes a single `an_ehr_id: UUID [1]` and the I_ADMIN_ARCHIVE list operations archive rather than delete (register AMB-33); the `delete_all` variant anchor is a catalogue naming convention, never an SM claim"
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id} — the first EHR to delete
flow:
  - step: 1                              # the SECOND EHR the selector names
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { second_ehr_id: created.ehr_id }
  - step: 2                              # the EHR that must SURVIVE the call
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { survivor_ehr_id: created.ehr_id }
  - step: 3
    call: physical_ehr_delete
    variant: delete_all                  # DELETE /admin/ehr/all?ehr_id=<a>&ehr_id=<b>
    on: admin                            # ADMIN-role principal (ixit)
    with:
      ehr_id_subset: "${ehr_id}"
      ehr_id_subset_2: "${second_ehr_id}"
    expect: ok_empty                     # 204 No Content; alt_status 202 kept so an async server is not refused (AMB-139)
  - step: 4                              # the first named EHR is gone
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
  - step: 5                              # the second named EHR is gone too — the repeated-form law
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${second_ehr_id}" }
    expect: not_found
  - step: 6                              # the unnamed EHR is untouched
    call: I_EHR_SERVICE.has_ehr
    with: { ehr_id: "${survivor_ehr_id}" }
    expect: ok
postconditions:
  - assert: state
    text: >-
      Every id the repeated selector named was deleted — not merely the first —
      and nothing else was (verified by steps 4, 5 and 6).
