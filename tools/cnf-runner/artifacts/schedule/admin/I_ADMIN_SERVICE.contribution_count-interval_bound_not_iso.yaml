# The optional `time_interval` argument is typed
# `Interval<Iso8601_date_time>` (i_admin_service.adoc). A bound that is not an
# ISO 8601 date-time is not an `Iso8601_date_time` value (BASE
# org.openehr.base.foundation_types.time §Iso8601_date_time), so the argument
# cannot be constructed and the call is refused — never coerced, defaulted, or
# dropped to the open interval, any of which would silently report a window the
# caller did not ask for.
# EXTENSION ROUTE (register AMB-33): the row gates the ActivityReport
# CAPABILITY verdict only.
id: I_ADMIN_SERVICE.contribution_count-interval_bound_not_iso
kind: functional
component: ADMIN
sm_operation: I_ADMIN_SERVICE.contribution_count
capabilities: [ActivityReport]
exercises: [AdminApi]
profiles: [OPTIONS]
test_purpose: >-
  A report request whose `time_interval` bound is not an ISO 8601 date-time is
  refused as a precondition violation, never answered over a substituted window.
description: "Report over an interval whose bound is not an ISO 8601 date-time"
spec_refs:
  - "SM openehr_platform §I_ADMIN_SERVICE.contribution_count"
  - "BASE foundation_types §Iso8601_date_time"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /admin/report/* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the ActivityReport CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: contribution_count
    on: admin                              # ADMIN-role principal (ixit) — the route is admin-gated
    with: { a_service: "Ehr", time_interval: "not-a-date/2026-12-31T00:00:00Z" }
    expect: bad_request
ambiguities: [AMB-33]
