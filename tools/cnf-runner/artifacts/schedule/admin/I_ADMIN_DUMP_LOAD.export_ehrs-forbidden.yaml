# The ADMIN gate's AUTHORIZATION half on the dump/load extension family: the
# party's ordinary `sut` principal is authenticated and holds no administrative
# authorization, so its refusal on both halves IS the 403 — an ordinary
# clinical caller can neither export the whole repository nor import into it.
# EXTENSION ROUTE (register AMB-33): the row gates the EhrDumpLoad CAPABILITY
# verdict only. The 403 mapping is UNIVERSAL (selectors.yaml
# universal_outcomes: forbidden -> 403, route-table-wide).
#
# As on the -unauthenticated sibling, the no-write half of both refusals is not
# authorable as a wire state proof (the "no readable archive" answer is a 5xx
# with no outcome kind) and is proved in-process instead.
id: I_ADMIN_DUMP_LOAD.export_ehrs-forbidden
kind: functional
component: ADMIN
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
capabilities: [EhrDumpLoad]
exercises: [AdminApi, AuthorizationSeparation]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated principal without administrative authorization is refused on
  both dump/load halves.
description: "A non-administrative principal is forbidden from dump and load"
spec_refs:
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.export_ehrs"
  - "SM openehr_platform §I_ADMIN_DUMP_LOAD.load_ehrs"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 403 — forbidden)"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs /admin/dump or /admin/load; our own design/extension, declared in vocab/wire_surface.yaml served_extensions and adjudicated by register AMB-33. The row gates the EhrDumpLoad CAPABILITY verdict only, never ITS-REST wire conformance"
  - "ITS-REST Admin API is DEVELOPMENT-stage — admin.openapi.yaml carries x-status: DEVELOPMENT (not STABLE); guarded until the Admin API stabilises"
requires: { server: any }
flow:
  - step: 1
    call: export_ehrs
    on: sut                                # authenticated, NOT administrative
    with: { file_sys_loc: "${ixit:dump_location}/forbidden" }
    expect: forbidden                      # universal 403 (route-table-wide)
  - step: 2
    call: load_ehrs
    on: sut
    with: { file_sys_loc: "${ixit:dump_location}/forbidden" }
    expect: forbidden
ambiguities: [AMB-33]
