# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D3).
# Verdicts recomputed against AOM1.4 C_ATTRIBUTE.existence and the RM
# OBSERVATION / CARE_ENTRY classes. Realization (OBSERVATION synth family):
# "data absent" is realized at the event level (the committed EVENT omits its
# RM-mandatory data) — the RM/schema rejection fires either way.
id: CONT-OBS-state_ex_mand-protocol_ex_mand
kind: content
component: CONTENT
rm_class: OBSERVATION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  OBSERVATION state existence 1..1, protocol existence 1..1: a committed
  OBSERVATION is accepted only with data, state and protocol all present; every
  absence rejects (RM-mandatory data; archetype-mandated state and protocol).
description: "OBSERVATION data (RM mandatory) + archetype-mandated state and protocol"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-OBS-state_ex_mand-protocol_ex_mand"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM ehr §OBSERVATION (data: HISTORY, existence 1..1; state: HISTORY, existence 0..1)"
  - "RM ehr §CARE_ENTRY (protocol: ITEM_STRUCTURE, existence 0..1)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_ATTRIBUTE.existence: state and protocol both tightened to 1..1.
  template: cnf.tpl.ecc_observation_state_protocol_existence
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]"
  constraint_columns: ["state_existence", "protocol_existence"]
decision_table:
  columns: [state_existence, protocol_existence, data_committed, state_committed, protocol_committed, expected, violates]
  rows:
    - ["mandatory", "mandatory", "absent", "absent", "absent", rejected, ["rm_schema: OBSERVATION.data is mandatory (existence 1..1)", "constraint(C_ATTRIBUTE.existence): protocol is mandated by the archetype (existence 1..1) but absent", "constraint(C_ATTRIBUTE.existence): state is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", "mandatory", "absent", "absent", "present", rejected, ["rm_schema: OBSERVATION.data is mandatory (existence 1..1)", "constraint(C_ATTRIBUTE.existence): state is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", "mandatory", "absent", "present", "absent", rejected, ["rm_schema: OBSERVATION.data is mandatory (existence 1..1)", "constraint(C_ATTRIBUTE.existence): protocol is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", "mandatory", "absent", "present", "present", rejected, ["rm_schema: OBSERVATION.data is mandatory (existence 1..1)"]]
    - ["mandatory", "mandatory", "present", "absent", "absent", rejected, ["constraint(C_ATTRIBUTE.existence): protocol is mandated by the archetype (existence 1..1) but absent", "constraint(C_ATTRIBUTE.existence): state is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", "mandatory", "present", "absent", "present", rejected, ["constraint(C_ATTRIBUTE.existence): state is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", "mandatory", "present", "present", "absent", rejected, ["constraint(C_ATTRIBUTE.existence): protocol is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", "mandatory", "present", "present", "present", accepted, []]
