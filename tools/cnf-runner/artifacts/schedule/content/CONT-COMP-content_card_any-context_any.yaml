# OFFICIAL master15 test case (rebuilt 2026-07-24, catalogue audit D1): the
# 2026-07-21 claim that master15 carries no test-case headings was false — the
# chapter defines 12 CONT-COMP-* cases with full decision tables. Verdicts
# recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality and the RM
# COMPOSITION invariants (incl. Content_valid, which exists). Full official
# table (all three context blocks) encoded 2026-07-24 via the three-state
# context_committed data axis.
# Realization (COMPOSITION x cardinality synth family):
# - context is unconstrained by the template (this case's "no constraint over
#   context" — anything RM-valid is allowed, per the master15 implementation
#   notes); the context_committed axis drives the committed instance: absent =
#   the official "no context" data set, present = "context without
#   other_context", present_with_other = "context with other_context" (a
#   valid EVENT_CONTEXT carrying an ITEM_TREE other_context).
# - content_count 0 omits the content attribute entirely (never an empty
#   list), so RM Content_valid (content /= Void implies not content.is_empty)
#   is not violated by the 0 rows.
id: CONT-COMP-content_card_any-context_any
kind: content
component: CONTENT
rm_class: COMPOSITION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  COMPOSITION content cardinality 0..*, no constraint over context: a committed
  COMPOSITION is accepted for any content item count (0, 1, 3 — all border and
  success cases of the official data sets) under all three official context
  conditions (no context, context without other_context, context with
  other_context).
description: "COMPOSITION.content count under an unconstrained (0..*) cardinality, context unconstrained"
spec_refs:
  - "CNF platform_test_schedule master15 §Test Case CONT-COMP-content_card_any-context_any"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "RM ehr §COMPOSITION (content: List<CONTENT_ITEM>, existence 0..1; context: EVENT_CONTEXT, existence 0..1; invariants Category_validity, Territory_valid, Language_valid, Content_valid, Is_archetype_root)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality 0..* on COMPOSITION.content.
  template: cnf.tpl.ecc_composition_content_cardinality
  path: "/content"
  constraint_columns: ["cardinality"]
decision_table:
  # cardinality: fixed "any" (0..*) per the official case heading.
  # context_committed: the official context data-set blocks (context is
  # unconstrained, so the blocks carry identical verdicts).
  # content_count: 0 / 1 / 3 = the official no/one/three-entries data sets.
  columns: [cardinality, context_committed, content_count, expected, violates]
  rows:
    - ["any", "absent", 0, accepted, []]
    - ["any", "absent", 1, accepted, []]
    - ["any", "absent", 3, accepted, []]
    - ["any", "present", 0, accepted, []]
    - ["any", "present", 1, accepted, []]
    - ["any", "present", 3, accepted, []]
    - ["any", "present_with_other", 0, accepted, []]
    - ["any", "present_with_other", 1, accepted, []]
    - ["any", "present_with_other", 3, accepted, []]
