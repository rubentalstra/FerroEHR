# Re-adjudicated 2026-07-21 from the retired ECC structural battery
# (ECC-VAL-001..012 content-cardinality axis) against AOM1.4 + RM spec text.
# The official CNF content chapter master15 carries no test-case headings, so
# the cardinality-constraint x committed-instance-count matrix is grounded
# ENTIRELY in the AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality semantics and the RM
# COMPOSITION.content definition. `ecc-` id namespace pending upstream adoption.
id: CONT-COMPOSITION-content_cardinality
kind: content
component: CONTENT
rm_class: COMPOSITION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed COMPOSITION is accepted iff the number of COMPOSITION.content
  items lies within the archetype's C_MULTIPLE_ATTRIBUTE.cardinality interval.
  RM COMPOSITION carries no invariant on content, so the archetype cardinality
  is the sole governing constraint (content is a List, RM existence 0..1).
description: "COMPOSITION.content committed-item count against the archetype cardinality interval"
spec_refs:
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "AM AOM1.4 §C_ATTRIBUTE (existence)"
  - "RM ehr §COMPOSITION (content: List<CONTENT_ITEM>, existence 0..1; Category_validity/Territory_valid only, no content invariant)"
  - "CNF platform_test_schedule master15 (content COMPOSITION chapter — no test-case headings; re-adjudicated to AOM/RM)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality on COMPOSITION.content, varied per row
  # (any=0..*, 1plus=1..*, 3plus=3..*, opt=0..1, mand=1..1, 3to5=3..5).
  template: cnf.tpl.ecc_composition_content_cardinality
  path: "/content"
decision_table:
  # cardinality: the C_MULTIPLE_ATTRIBUTE.cardinality interval token.
  # content_count: number of COMPOSITION.content items committed.
  columns: [cardinality, content_count, expected, violates]
  rows:
    - ["any", 0, accepted, []]
    - ["any", 1, accepted, []]
    - ["any", 3, accepted, []]
    - ["any", 6, accepted, []]
    - ["1plus", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)"]]
    - ["1plus", 1, accepted, []]
    - ["1plus", 3, accepted, []]
    - ["1plus", 6, accepted, []]
    - ["3plus", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (3)"]]
    - ["3plus", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (3)"]]
    - ["3plus", 3, accepted, []]
    - ["3plus", 6, accepted, []]
    - ["opt", 0, accepted, []]
    - ["opt", 1, accepted, []]
    - ["opt", 3, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
    - ["opt", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
    - ["mand", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)"]]
    - ["mand", 1, accepted, []]
    - ["mand", 3, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
    - ["mand", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
    - ["3to5", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (3)"]]
    - ["3to5", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (3)"]]
    - ["3to5", 3, accepted, []]
    - ["3to5", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (5)"]]
