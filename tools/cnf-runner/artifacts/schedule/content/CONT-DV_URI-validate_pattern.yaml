id: CONT-DV_URI-validate_pattern
kind: content
component: CONTENT
rm_class: DV_URI
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_URI is accepted iff its value matches the C_STRING.pattern constraint."
description: "DV_URI against a C_STRING.pattern (https://.*)"
spec_refs:
  - "CNF platform_test_schedule master17.7 \u00a7CONT-DV_URI-validate_pattern"
  - "RM data_types \u00a7DV_URI"
  - "AM AOM1.4 \u00a7C_STRING"
constraint_context:
  template: cnf.tpl.dv_uri_c_string
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
decision_table:
  columns: ["value", "C_STRING.pattern", "expected", "violates"]
  rows:
    - ["xyz", "https://.*", "rejected", ["constraint(C_STRING.pattern): value does not match the pattern"]]
    - ["https://cabolabs.com", "https://.*", "accepted", []]
