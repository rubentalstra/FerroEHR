id: CONT-DV_DATE-validate_range
kind: content
component: CONTENT
rm_class: DV_DATE
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DATE is accepted iff it falls within the C_DATE range; value and range limits must share precision."
description: "DV_DATE against C_DATE range constraints"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DATE-validate_range"
  - "RM data_types \u00a7DV_DATE"
  - "AM AOM1.4 \u00a7C_DATE"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.dv_date_c_date
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["range.lower", "range.upper"]
decision_table:
  columns: ["value", "range.lower", "range.upper", "expected", "violates"]
  rows:
    - ["2021", "1900", "2030", "accepted", []]
    - ["2021", "2022", "2030", "rejected", ["constraint(C_DATE.range): value is outside the C_DATE.range interval"]]
    - ["2021", "1900", "2020", "rejected", ["constraint(C_DATE.range): value is outside the C_DATE.range interval"]]
    - ["2021-10", "1900-03", "2030-07", "accepted", []]
    - ["2021-10", "2022-03", "2030-07", "rejected", ["constraint(C_DATE.range): value is outside the C_DATE.range interval"]]
    - ["2021-10", "1900-03", "2020-07", "rejected", ["constraint(C_DATE.range): value is outside the C_DATE.range interval"]]
    - ["2021-10-24", "1900-03-13", "2030-07-09", "accepted", []]
    - ["2021-10-24", "2022-03-13", "2030-07-09", "rejected", ["constraint(C_DATE.range): value is outside the C_DATE.range interval"]]
    - ["2021-10-24", "1900-03-13", "2020-07-09", "rejected", ["constraint(C_DATE.range): value is outside the C_DATE.range interval"]]
