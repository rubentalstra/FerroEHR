id: CONT-DV_CODED_TEXT-validate_ext_term
kind: content
component: CONTENT
rm_class: DV_CODED_TEXT
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_CODED_TEXT constrained by a CONSTRAINT_REF (C_CODE_REFERENCE) is accepted iff both fields are present and the terminology_id resolves against a constraint_binding for the acNNNN code."
description: "DV_CODED_TEXT against a CONSTRAINT_REF with a constraint_binding"
spec_refs:
  - "CNF platform_test_schedule master17.2 \u00a7CONT-DV_CODED_TEXT-validate_ext_term"
  - "RM data_types \u00a7DV_CODED_TEXT"
  - "AM AOM1.4 \u00a7C_CODE_PHRASE"
  - "AM AOM1.4 \u00a7CONSTRAINT_REF"
  - "RM data_types dv_text.adoc \u00a7Invariants (Valid_value: not value.is_empty)"
constraint_context:
  template: cnf.tpl.dv_coded_text_constraint_ref
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
decision_table:
  columns: ["code_string", "terminology_id", "value", "CONSTRAINT_REF.reference", "constraint_bindings", "expected", "violates"]
  rows:
    - [null, null, null, "ac0001", "[SNOMED_CT]", "rejected", ["rm_schema: code_string and terminology_id are both mandatory"]]
    - ["ABC", null, null, "ac0001", "[SNOMED_CT]", "rejected", ["rm_schema: terminology_id is mandatory"]]
    - [null, "local", null, "ac0001", "[SNOMED_CT]", "rejected", ["rm_schema: code_string is mandatory"]]
    # Re-adjudicated 2026-07-22: AOM1.4 §Reference Objects defines
    # CONSTRAINT_REF as a proxy resolved through constraint_bindings to an
    # EXTERNAL terminology query; the spec is silent on commit-time
    # enforcement when no binding covers the instance terminology, so an
    # unmatched code is not rejectable from spec text — the row asserts
    # acceptance (VATDF/VACDF constrain the TEMPLATE, not the data).
    - ["ABC", "local", null, "ac0001", "[SNOMED_CT]", "accepted", []]
    - ["82272006", "SNOMED-CT", null, "ac0001", "[SNOMED_CT]", "accepted", []]
    # Value dimension (acceptance direction): with a present defining_code the
    # only RM invariant governing value is dv_text.adoc Valid_value — an
    # arbitrary non-empty value and a raw-code value are accepted (no
    # value==rubric invariant, AMB-55; a CONSTRAINT_REF rubric would come from
    # the external service, not the archetype ontology), only an empty value is
    # rejected.
    - ["ABC", "local", "an arbitrary display label", "ac0001", "[SNOMED_CT]", "accepted", []]
    - ["ABC", "local", "ABC", "ac0001", "[SNOMED_CT]", "accepted", []]
    - ["ABC", "local", "", "ac0001", "[SNOMED_CT]", "rejected", ["rm_invariant(Valid_value): not value.is_empty"]]
ambiguities: [AMB-46, AMB-55]
