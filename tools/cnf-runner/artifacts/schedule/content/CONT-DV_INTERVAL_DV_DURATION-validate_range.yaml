id: CONT-DV_INTERVAL_DV_DURATION-validate_range
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DURATION> is accepted iff each limit DV_DURATION
  value falls within its C_DURATION.range constraint; the four interval bound
  flags are constant (lower_unbounded=false, upper_unbounded=false,
  lower_included=true, upper_included=true) and are omitted.
description: "DV_INTERVAL<DV_DURATION> limits against C_DURATION.range"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DURATION-validate_range"
  - "AM AOM1.4 §C_DURATION"
  - "RM data_types §DV_INTERVAL"
constraint_context:
  template: cnf.tpl.interval_duration_range
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, range_lower_for_lower, range_upper_for_lower, range_lower_for_upper, range_upper_for_upper, expected, violates]
  rows:
    - ["P1Y", "P2Y", "P1Y", "P3Y", "P1Y", "P3Y", accepted, []]
    - ["P1Y", "P2Y", "P2Y", "P3Y", "P1Y", "P3Y", rejected, ["constraint(C_DURATION.range): range.lower for lower"]]
    - ["P1Y", "P2Y", "P1Y", "P3Y", "P3Y", "P4Y", rejected, ["constraint(C_DURATION.range): range.lower for upper"]]
    - ["P5Y", "P10Y", "P2Y", "P3Y", "P5Y", "P15Y", rejected, ["constraint(C_DURATION.range): range.upper for lower"]]
    - ["P5Y", "P10Y", "P1Y", "P9Y", "P3Y", "P9Y", rejected, ["constraint(C_DURATION.range): range.upper for upper"]]
    - ["P5Y4M", "P10Y", "P1Y", "P9Y", "P3Y", "P15Y", accepted, []]
    - ["P5Y4M", "P10Y", "P6Y", "P9Y", "P3Y", "P15Y", rejected, ["constraint(C_DURATION.range): range.lower for lower"]]
    - ["P5Y4M", "P10Y", "P5Y4M2D", "P9Y", "P3Y", "P15Y", rejected, ["constraint(C_DURATION.range): range.lower for lower"]]
    - ["P5Y4M20D", "P10Y", "P1Y", "P9Y", "P3Y", "P15Y", accepted, []]
    - ["P5Y4M20D", "P10Y", "P5Y6M", "P9Y", "P3Y", "P15Y", rejected, ["constraint(C_DURATION.range): range.lower for lower"]]
