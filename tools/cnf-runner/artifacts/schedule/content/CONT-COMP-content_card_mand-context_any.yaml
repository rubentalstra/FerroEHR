# OFFICIAL master15 test case (rebuilt 2026-07-24, catalogue audit D1).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality and the
# RM COMPOSITION invariants. Realization (COMPOSITION x cardinality synth
# family): instance context is always an EVENT_CONTEXT without other_context —
# these rows realize the official "context without other_context" block
# (context unconstrained here, identical verdicts in the other blocks);
# content_count 0 omits the content attribute entirely (never an empty list;
# the synthesized template pairs the 1..1 cardinality with content existence
# 1..1 so the omitted container rejects — the official cell attributes the
# rejection to cardinality.lower).
# TODO: encode the official "no context" / "context with other_context"
#       data-set rows once the content synth vocabulary carries a per-row
#       context data axis.
id: CONT-COMP-content_card_mand-context_any
kind: content
component: CONTENT
rm_class: COMPOSITION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  COMPOSITION content cardinality 1..1, no constraint over context: no entries
  is rejected (lower bound), one entry is accepted (border case), three entries
  are rejected (upper bound).
description: "COMPOSITION.content count against a 1..1 cardinality, context unconstrained"
spec_refs:
  - "CNF platform_test_schedule master15 §Test Case CONT-COMP-content_card_mand-context_any"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "RM ehr §COMPOSITION (content: List<CONTENT_ITEM>, existence 0..1; invariants Category_validity, Territory_valid, Language_valid, Content_valid, Is_archetype_root)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality 1..1 on COMPOSITION.content.
  template: cnf.tpl.ecc_composition_content_cardinality
  path: "/content"
  constraint_columns: ["cardinality"]
decision_table:
  columns: [cardinality, content_count, expected, violates]
  rows:
    - ["mand", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)"]]
    - ["mand", 1, accepted, []]
    - ["mand", 3, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
