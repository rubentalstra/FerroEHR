# Re-adjudicated 2026-07-22 twice (issue #228): (1) the bounded-flag-with-
# absent-limits row is spec-silent — the BASE and RM interval Limits_consistent
# invariants are underivable on Void limits (AMB-43, re-grounded 2026-08-21)
# — and goes through the
# register (AMB-43: accepted); (2) the inverted-limits row (lower > upper,
# both bounded) IS invalid under the BASE §Interval Limits_consistent
# invariant ("(not upper_unbounded and not lower_unbounded) implies
# lower <= upper" — DV_ORDINAL orders by value, RM data_types §DV_ORDINAL)
# — the first re-adjudication over-corrected it to accepted; restored to
# rejected. Partial-null-ordinal rows stay rejected (DV_ORDINAL.symbol and
# .value are 1..1 — RM data_types §DV_ORDINAL).
id: CONT-DV_INTERVAL_DV_ORDINAL-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_ORDINAL> against an open constraint ({*}) is accepted
  iff both limits carry symbol and value and the limits are comparable.
description: "DV_INTERVAL<DV_ORDINAL> open ({*}): symbol/value mandatory, comparable limits"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_ORDINAL-validate_open"
  - "AM AOM1.4 §C_DV_ORDINAL"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
guards:
  - "modeling tool supports representing DV_INTERVAL<DV_ORDINAL> — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_ordinal_open    # DV_INTERVAL<DV_ORDINAL> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower_symbol, lower_value, upper_symbol, upper_value, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, null, null, false, false, true, true, accepted, []]   # AMB-43: no RM invariant requires a bound value when *_unbounded=false
    - [null, 1, null, 5, false, false, true, true, rejected, ["rm_schema: symbol is mandatory for lower and upper"]]
    - ["local::at0005", null, "local::at0003", null, false, false, true, true, rejected, ["rm_schema: value is mandatory for lower and upper"]]
    - ["local::at0005", 1, "local::at0002", 5, false, false, true, true, accepted, []]
    - ["local::at0004", 666, "local::at0003", 777, false, false, true, true, accepted, []]
    - ["local::at0003", 777, "local::at0004", 666, false, false, true, true, rejected, ["rm_invariant(Limits_consistent): lower (777) > upper (666) — BASE foundation_types §Interval"]]
ambiguities: [AMB-43]
