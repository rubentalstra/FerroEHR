# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D6).
# Verdicts recomputed against AOM1.4 C_OBJECT.rm_type_name and the RM EVENT
# hierarchy (the committed INTERVAL_EVENT is well-formed — RM-mandatory width
# + math_function carried — so the rejection is purely the type constraint).
id: CONT-EVENT-type_point_event
kind: content
component: CONTENT
rm_class: EVENT
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  EVENT is POINT_EVENT: an archetype slot narrowed to POINT_EVENT accepts a
  POINT_EVENT and rejects an INTERVAL_EVENT (class not allowed).
description: "HISTORY.events object type against a POINT_EVENT-narrowed archetype slot"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-EVENT-type_point_event"
  - "AM AOM1.4 §C_OBJECT (rm_type_name) — the reference-model type a node constrains"
  - "RM data_structures §EVENT / §POINT_EVENT / §INTERVAL_EVENT (abstract EVENT; INTERVAL_EVENT.width 1..1, .math_function 1..1)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_OBJECT.rm_type_name = POINT_EVENT on the HISTORY.events slot.
  template: cnf.tpl.ecc_event_type_narrowing
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events"
  constraint_columns: ["slot_type"]
decision_table:
  columns: [slot_type, committed_type, expected, violates]
  rows:
    - ["POINT_EVENT", "POINT_EVENT", accepted, []]
    - ["POINT_EVENT", "INTERVAL_EVENT", rejected, ["constraint(C_OBJECT.rm_type_name): INTERVAL_EVENT is not an allowed type for a POINT_EVENT-narrowed slot"]]
