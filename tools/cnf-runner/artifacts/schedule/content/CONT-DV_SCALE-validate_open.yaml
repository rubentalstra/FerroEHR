id: CONT-DV_SCALE-validate_open
kind: content
component: CONTENT
rm_class: DV_SCALE
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_SCALE against an open constraint (DV_SCALE matches {*}) is
  accepted iff both its symbol and value are present. DV_SCALE exists only from
  RM 1.1.0.
description: "DV_SCALE against an open C_DV_SCALE ({*}): symbol/value mandatory"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_SCALE-validate_open"
  - "AM ADL2 master04.4-cadl_second_order §Tuple Constraints (no released AM generation defines C_DV_SCALE; the C_DV_ORDINAL-analogous reading is the schedule's own NOTE)"
  - "RM data_types §DV_SCALE"
applies: { rm: ">=1.1.0" }
constraint_context:
  template: cnf.tpl.scale_open    # DV_SCALE matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [symbol, value, expected, violates]
  rows:
    - [null, null, rejected, ["rm_schema: value and symbol are mandatory"]]
    - [null, 1.5, rejected, ["rm_schema: symbol is mandatory"]]
    - ["local::at0005", null, rejected, ["rm_schema: value is mandatory"]]
    - ["local::at0005", 1.5, accepted, []]
    - ["local::at0005", 666, accepted, []]
