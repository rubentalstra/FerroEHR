# Re-adjudicated 2026-07-22 (issue #228): the previously-rejected rows rested on
# invariants the openEHR RM does NOT define. BASE foundation_types §Interval
# defines only Lower_included_valid / Upper_included_valid / Limits_consistent /
# Limits_comparable — there is no bound-value-required-when-not-unbounded
# invariant, and partial-precision comparability is an acknowledged open
# discussion (the table's own violates text flagged it). A conformant server
# therefore accepts all of these; expectations corrected rejected -> accepted.
id: CONT-DV_INTERVAL_DV_DURATION-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DURATION> against an open constraint ({*}) is
  accepted iff its own interval invariants hold: a bounded limit must carry a
  value, and lower must not exceed upper (component-wise, avoiding normalization
  ambiguity).
description: "DV_INTERVAL<DV_DURATION> open ({*}): interval invariants"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DURATION-validate_open"
  - "AM AOM1.4 §C_COMPLEX_OBJECT"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
guards:
  - "duration limit comparison follows the component-wise convention (each lower component <= the corresponding upper component) to avoid normalization ambiguity; any month=30-days assumption is stated in the SUT Conformance Statement — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_duration_open    # DV_INTERVAL<DV_DURATION> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
    - [null, "PT2H", false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
    - ["PT1H", null, false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
    - ["PT1H", "PT2H", false, false, true, true, accepted, []]
    - ["PT1H", "PT2H", false, false, true, true, accepted, []]
    - ["P1Y7M3D", "P1Y8M3D", false, false, true, true, accepted, []]
    - ["P1M5DT3H", "P10M", false, false, true, true, accepted, []]
    - ["P2M", "P1M", false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
    - ["P10M", "P1M5DT3H", false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
