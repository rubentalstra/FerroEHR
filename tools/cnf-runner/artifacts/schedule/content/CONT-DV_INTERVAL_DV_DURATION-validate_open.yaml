# Re-adjudicated 2026-07-22 twice (issue #228): (1) bounded-flag-with-absent-
# limits rows are spec-silent — the BASE and RM interval Limits_consistent
# invariants are underivable on Void limits (AMB-43, re-grounded 2026-08-21)
# — and go through the
# register (AMB-43: accepted); (2) the inverted-limits rows (lower > upper,
# both bounded) ARE invalid under the BASE §Interval Limits_consistent
# invariant ("(not upper_unbounded and not lower_unbounded) implies
# lower <= upper"; DV_DURATION orders by magnitude — RM data_types
# §DV_DURATION) — the first re-adjudication over-corrected them to
# accepted; restored to rejected.
id: CONT-DV_INTERVAL_DV_DURATION-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DURATION> against an open constraint ({*}) is
  accepted iff its own interval invariants hold: a bounded limit must carry a
  value, and lower must not exceed upper (component-wise, avoiding normalization
  ambiguity).
description: "DV_INTERVAL<DV_DURATION> open ({*}): interval invariants"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DURATION-validate_open"
  - "AM AOM1.4 §C_COMPLEX_OBJECT"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
guards:
  - "duration limit comparison follows the component-wise convention (each lower component <= the corresponding upper component) to avoid normalization ambiguity; any month=30-days assumption is stated in the SUT Conformance Statement — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_duration_open    # DV_INTERVAL<DV_DURATION> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, false, false, true, true, accepted, []]   # AMB-43
    - [null, "PT2H", false, false, true, true, accepted, []]   # AMB-43
    - ["PT1H", null, false, false, true, true, accepted, []]   # AMB-43
    - ["PT1H", "PT2H", false, false, true, true, accepted, []]
    - ["PT1H", "PT2H", false, false, true, true, accepted, []]
    - ["P1Y7M3D", "P1Y8M3D", false, false, true, true, accepted, []]
    - ["P1M5DT3H", "P10M", false, false, true, true, accepted, []]
    - ["P2M", "P1M", false, false, true, true, rejected, ["rm_invariant(Limits_consistent): lower (P2M) > upper (P1M) — BASE foundation_types §Interval; DV_DURATION magnitude order, RM data_types §DV_DURATION"]]
    - ["P10M", "P1M5DT3H", false, false, true, true, rejected, ["rm_invariant(Limits_consistent): lower (P10M) > upper (P1M5DT3H) — BASE foundation_types §Interval; DV_DURATION magnitude order, RM data_types §DV_DURATION"]]
ambiguities: [AMB-43]
