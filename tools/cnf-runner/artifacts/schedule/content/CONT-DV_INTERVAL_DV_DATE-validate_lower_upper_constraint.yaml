id: CONT-DV_INTERVAL_DV_DATE-validate_lower_upper_constraint
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DATE> is accepted iff both limit DV_DATE values
  satisfy the C_DATE month/day component-validity constraints; the four
  interval bound flags are constant across this table (lower_unbounded=false,
  upper_unbounded=false, lower_included=true, upper_included=true) and are
  omitted.
description: "DV_INTERVAL<DV_DATE> limits against C_DATE month/day component validity"
guards:
  - "CNF master17.3 §CONT-DV_INTERVAL_DV_DATE-validate_lower_upper_constraint NOTE: this test case does not include all possible combinations of lower/upper data and constraints; an exhaustive set is left to a future schedule revision."
  - "CNF master17.3 §CONT-DV_INTERVAL_DV_DATE-validate_lower_upper_constraint NOTE: the C_DATE higher-/lower-precision optional/prohibited invariants are an archetype/template-editor concern (not data validation); these rows assume those rules hold without re-checking them."
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DATE-validate_lower_upper_constraint"
  - "AM AOM1.4 §C_DATE"
  - "RM data_types §DV_INTERVAL"
constraint_context:
  template: cnf.tpl.interval_date_field_validity
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, month_validity_lower, day_validity_lower, month_validity_upper, day_validity_upper, expected, violates]
  rows:
    - ["2021", "2022", "mandatory", "mandatory", "mandatory", "mandatory", rejected, ["constraint(month_validity): month component required for lower", "constraint(day_validity): day component required for lower", "constraint(month_validity): month component required for upper", "constraint(day_validity): day component required for upper"]]
    - ["2021", "2022", "mandatory", "optional", "mandatory", "optional", rejected, ["constraint(month_validity): month component required for lower", "constraint(month_validity): month component required for upper"]]
    - ["2021", "2022", "optional", "optional", "optional", "optional", accepted, []]
    - ["2021", "2022", "mandatory", "prohibited", "mandatory", "prohibited", rejected, ["constraint(month_validity): month component required for lower", "constraint(month_validity): month component required for upper"]]
    - ["2021", "2022", "prohibited", "prohibited", "prohibited", "prohibited", accepted, []]
    - ["2021-10", "2022-10", "mandatory", "mandatory", "mandatory", "mandatory", rejected, ["constraint(day_validity): day component required for lower", "constraint(day_validity): day component required for upper"]]
    - ["2021-10", "2022-10", "mandatory", "optional", "mandatory", "optional", accepted, []]
    - ["2021-10", "2022-10", "optional", "optional", "optional", "optional", accepted, []]
