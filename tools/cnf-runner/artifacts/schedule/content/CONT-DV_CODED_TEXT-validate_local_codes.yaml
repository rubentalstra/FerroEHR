id: CONT-DV_CODED_TEXT-validate_local_codes
kind: content
component: CONTENT
rm_class: DV_CODED_TEXT
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_CODED_TEXT is accepted iff code_string and terminology_id are present and the terminology_id matches the C_CODE_PHRASE constraint (local codes)."
description: "DV_CODED_TEXT against a local-codes C_CODE_PHRASE ([ABC, OPQ] @ local)"
spec_refs:
  - "CNF platform_test_schedule master17.2 \u00a7CONT-DV_CODED_TEXT-validate_local_codes"
  - "RM data_types \u00a7DV_CODED_TEXT"
  - "RM data_types dv_text.adoc \u00a7Invariants (Valid_value: not value.is_empty)"
  - "AM AOM1.4 \u00a7C_CODE_PHRASE"
constraint_context:
  template: cnf.tpl.dv_coded_text_c_code_phrase
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
# The synthesized OPT binds a rubric for each local constraint code in the
# component ontology (term_definitions), so a value=bound-rubric commit has a
# real rubric to match (opt_synth::build_coded_text; RM dv_text.adoc \u00a7value
# \u2014 "For DV_CODED_TEXT, this is the rubric of the complete term"). Row for
# ABC binds rubric "Rubric for ABC".
decision_table:
  columns: ["code_string", "terminology_id", "value", "C_CODE_PHRASE.code_list", "C_CODE_PHRASE.terminology_id", "expected", "violates"]
  rows:
    # defining_code presence (C_CODE_PHRASE membership + RM mandatory fields).
    - [null, null, null, "[ABC, OPQ]", "local", "rejected", ["rm_schema: code_string and terminology_id are both mandatory"]]
    - ["ABC", null, null, "[ABC, OPQ]", "local", "rejected", ["rm_schema: terminology_id is mandatory"]]
    - [null, "local", null, "[ABC, OPQ]", "local", "rejected", ["rm_schema: code_string is mandatory"]]
    - ["ABC", "local", null, "[ABC, OPQ]", "local", "accepted", []]
    - ["82272006", "SNOMED-CT", null, "[ABC, OPQ]", "local", "rejected", ["constraint(C_CODE_PHRASE.terminology_id): terminology_id does not match the constrained terminology"]]
    # Value dimension (acceptance direction): with a valid defining_code the
    # only RM invariant on value is dv_text.adoc Valid_value (not value.is_empty)
    # \u2014 the "value must be the rubric" text is dv_coded_text.adoc Description
    # prose, not an invariant (AMB-55), so value=rubric, value\u2260rubric, and
    # value=code are all accepted; only an empty value is rejected.
    - ["ABC", "local", "Rubric for ABC", "[ABC, OPQ]", "local", "accepted", []]
    - ["ABC", "local", "an arbitrary display label", "[ABC, OPQ]", "local", "accepted", []]
    - ["ABC", "local", "ABC", "[ABC, OPQ]", "local", "accepted", []]
    - ["ABC", "local", "", "[ABC, OPQ]", "local", "rejected", ["rm_invariant(Valid_value): not value.is_empty"]]
ambiguities: [AMB-55]
