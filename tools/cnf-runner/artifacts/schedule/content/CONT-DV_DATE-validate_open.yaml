id: CONT-DV_DATE-validate_open
kind: content
component: CONTENT
rm_class: DV_DATE
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DATE is accepted iff its value is a valid openEHR ISO 8601 date (at least the year; month 01..12; day 01..31)."
description: "DV_DATE value against the openEHR ISO 8601 date grammar"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DATE-validate_open"
  - "RM data_types \u00a7DV_DATE"
  - "AM AOM1.4 \u00a7C_DATE"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.dv_date_open
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
decision_table:
  columns: ["value", "expected", "violates"]
  rows:
    - [null, "rejected", ["rm_schema: value is mandatory"]]
    - ["", "rejected", ["iso8601(year_required): at least the year is required"]]
    - ["", "rejected", ["iso8601(year_required): openEHR RM/AOM requires at least the year"]]
    - ["2021", "accepted", []]
    - ["2021-10", "accepted", []]
    - ["2021-00", "rejected", ["iso8601(month_range): month must be in 01..12"]]
    - ["2021-13", "rejected", ["iso8601(month_range): month must be in 01..12"]]
    - ["2021-10-24", "accepted", []]
    - ["2021-10-00", "rejected", ["iso8601(day_range): day must be in 01..31"]]
    - ["2021-10-32", "rejected", ["iso8601(day_range): day must be in 01..31"]]
