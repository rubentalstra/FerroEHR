id: CONT-DV_INTERVAL_DV_SCALE-validate_constraint
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_SCALE> is accepted iff each limit's value|symbol
  tuple matches an entry of that limit's list (constraint assumed analogous to
  C_DV_ORDINAL). The per-limit lists vary per row. DV_SCALE exists only from
  RM 1.1.0.
description: "DV_INTERVAL<DV_SCALE> with per-limit C_DV_ORDINAL.list constraints (real values)"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_SCALE-validate_constraint"
  - "AM ADL2 master04.4-cadl_second_order §Tuple Constraints (no released AM generation defines C_DV_SCALE; the C_DV_ORDINAL-analogous reading is the schedule's own NOTE)"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.1.0" }
guards:
  - "modeling tool supports representing DV_INTERVAL<DV_SCALE>, whose limit constraint is assumed analogous to C_DV_ORDINAL — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_scale_list    # C_DV_ORDINAL.list on both limits; real-valued tuples vary per row
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
  constraint_columns: ["lower_c_dv_ordinal_list", "upper_c_dv_ordinal_list"]
decision_table:
  columns: [lower_symbol, lower_value, upper_symbol, upper_value, lower_unbounded, upper_unbounded, lower_included, upper_included, lower_c_dv_ordinal_list, upper_c_dv_ordinal_list, expected, violates]
  rows:
    - ["local::at0005", 1.5, "local::at0002", 5.3, false, false, true, true, "[1.5|[local::at0005], 2.4|[local::at0006]]", "[5.3|[local::at0002], 2.4|[local::at0006]]", accepted, []]
    - ["local::at0004", 666.1, "local::at0003", 777.1, false, false, true, true, "[8.9|[local::at0004], 2.4|[local::at0006]]", "[9.7|[local::at0003], 2.4|[local::at0006]]", rejected, ["constraint(C_DV_ORDINAL.list): no matching value for lower and upper"]]
    - ["local::at0666", 1.5, "local::at0777", 2.4, false, false, true, true, "[1.5|[local::at0005], 2.4|[local::at0006]]", "[1.5|[local::at0005], 2.4|[local::at0006]]", rejected, ["constraint(C_DV_ORDINAL.list): no matching symbol for lower and upper"]]
    - ["local::at0004", 666.1, "local::at0003", 777.1, false, false, true, true, "[8.9|[local::at0004], 2.4|[local::at0006]]", "[777.1|[local::at0003], 2.4|[local::at0006]]", rejected, ["constraint(C_DV_ORDINAL.list): no matching value for lower"]]
    - ["local::at0666", 1.5, "local::at0777", 2.4, false, false, true, true, "[1.5|[local::at0005], 2.4|[local::at0006]]", "[1.5|[local::at0005], 2.4|[local::at0777]]", rejected, ["constraint(C_DV_ORDINAL.list): no matching symbol for lower"]]
    - ["local::at0004", 666.1, "local::at0003", 777.1, false, false, true, true, "[666.1|[local::at0004], 2.4|[local::at0006]]", "[9.7|[local::at0003], 2.4|[local::at0006]]", rejected, ["constraint(C_DV_ORDINAL.list): no matching value for upper"]]
    - ["local::at0005", 1.5, "local::at0777", 5.3, false, false, true, true, "[1.5|[local::at0005], 2.4|[local::at0006]]", "[1.5|[local::at0005], 5.3|[local::at0999]]", rejected, ["constraint(C_DV_ORDINAL.list): no matching symbol for upper"]]
