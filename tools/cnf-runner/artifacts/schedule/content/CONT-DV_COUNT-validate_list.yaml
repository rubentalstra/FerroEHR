id: CONT-DV_COUNT-validate_list
kind: content
component: CONTENT
rm_class: DV_COUNT
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_COUNT is accepted iff its magnitude is present and is one of the
  C_INTEGER.list = [10,15,20] values.
description: "DV_COUNT against C_INTEGER.list = [10,15,20]"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_COUNT-validate_list"
  - "AM AOM1.4 §C_INTEGER"
  - "RM data_types §DV_COUNT"
applies: { rm: ">=1.0.2" }
guards:
  - "modeling tool supports C_INTEGER list constraints — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.count_list    # C_INTEGER.list = [10,15,20]
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [magnitude, expected, violates]
  rows:
    - [null, rejected, ["rm_schema: magnitude is mandatory"]]
    - [0, rejected, ["constraint(C_INTEGER.list): magnitude not in list"]]
    - [1, rejected, ["constraint(C_INTEGER.list): magnitude not in list"]]
    - [15, accepted, []]
    - [30, rejected, ["constraint(C_INTEGER.list): magnitude not in list"]]
