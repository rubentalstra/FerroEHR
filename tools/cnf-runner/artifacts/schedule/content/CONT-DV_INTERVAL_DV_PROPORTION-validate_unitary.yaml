id: CONT-DV_INTERVAL_DV_PROPORTION-validate_unitary
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With C_INTEGER.list = [1] on the type of each limit, a committed
  DV_INTERVAL<DV_PROPORTION> is accepted iff both limits are unitary (type 1).
description: "DV_INTERVAL<DV_PROPORTION>: type C_INTEGER.list = [1] on both limits"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_PROPORTION-validate_unitary"
  - "AM AOM1.4 §C_INTEGER"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
guards:
  - "modeling tool supports representing DV_INTERVAL<DV_PROPORTION> — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_proportion_type_unitary    # type C_INTEGER.list = [1] on both limits
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower_type, lower_numerator, lower_denominator, lower_precision, upper_type, upper_numerator, upper_denominator, upper_precision, expected, violates]
  rows:
    - [1, 10, 1, 0, 1, 20, 1, 0, accepted, []]
    - [0, 10, 500, 0, 0, 20, 500, 0, rejected, ["constraint(C_INTEGER.list): type not in allowed list for lower and upper"]]
