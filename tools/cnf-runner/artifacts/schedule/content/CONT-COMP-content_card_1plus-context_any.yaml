# OFFICIAL master15 test case (rebuilt 2026-07-24, catalogue audit D1).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality and the
# RM COMPOSITION invariants. Full official table (all three context blocks)
# encoded 2026-07-24 via the three-state context_committed data axis.
# Realization (COMPOSITION x cardinality synth family): context is
# unconstrained by the template (anything RM-valid allowed, per the master15
# implementation notes); the context_committed axis drives the committed
# instance — absent = the official "no context" data set, present = "context
# without other_context", present_with_other = "context with other_context".
# content_count 0 omits the content attribute entirely (never an empty list;
# the synthesized template pairs the 1..* cardinality with content existence
# 1..1 so the omitted container rejects — the official cell attributes the
# rejection to cardinality.lower).
id: CONT-COMP-content_card_1plus-context_any
kind: content
component: CONTENT
rm_class: COMPOSITION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  COMPOSITION content cardinality 1..*, no constraint over context: a committed
  COMPOSITION with no entries is rejected (cardinality lower bound); one or
  three entries are accepted — under all three official context conditions
  alike.
description: "COMPOSITION.content count against a 1..* cardinality, context unconstrained"
spec_refs:
  - "CNF platform_test_schedule master15 §Test Case CONT-COMP-content_card_1plus-context_any"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "RM ehr §COMPOSITION (content: List<CONTENT_ITEM>, existence 0..1; context: EVENT_CONTEXT, existence 0..1; invariants Category_validity, Territory_valid, Language_valid, Content_valid, Is_archetype_root)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality 1..* on COMPOSITION.content.
  template: cnf.tpl.ecc_composition_content_cardinality
  path: "/content"
  constraint_columns: ["cardinality"]
decision_table:
  # context_committed: the official context data-set blocks (context is
  # unconstrained, so the blocks carry identical verdicts).
  columns: [cardinality, context_committed, content_count, expected, violates]
  rows:
    - ["1plus", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)"]]
    - ["1plus", "absent", 1, accepted, []]
    - ["1plus", "absent", 3, accepted, []]
    - ["1plus", "present", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)"]]
    - ["1plus", "present", 1, accepted, []]
    - ["1plus", "present", 3, accepted, []]
    - ["1plus", "present_with_other", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)"]]
    - ["1plus", "present_with_other", 1, accepted, []]
    - ["1plus", "present_with_other", 3, accepted, []]
