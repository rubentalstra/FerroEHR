id: CONT-DV_QUANTITY-validate_property_units
kind: content
component: CONTENT
rm_class: DV_QUANTITY
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_QUANTITY is accepted iff magnitude and units are present, the
  units are a length unit, and the units are one of the C_DV_QUANTITY list units
  [cm, m].
description: "DV_QUANTITY against C_DV_QUANTITY property=openehr::122 (length), list=[cm, m]"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_QUANTITY-validate_property_units"
  - "AM ADL2 master04.4-cadl_second_order §Tuple Constraints (the ADL 1.4 Archetype Profile C_DV_QUANTITY the tuple constraint replaced; the oAP itself is not part of the released AM)"
  - "RM data_types §DV_QUANTITY"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.quantity_property_units    # C_DV_QUANTITY: property=openehr::122, list=[cm, m]
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [magnitude, units, expected, violates]
  rows:
    - [null, null, rejected, ["rm_schema: both magnitude and units are mandatory"]]
    - [null, "cm", rejected, ["rm_schema: magnitude is mandatory"]]
    - [1.0, null, rejected, ["rm_schema: units is mandatory"]]
    - [0.0, "mg", rejected, ["constraint(C_DV_QUANTITY.property): mg is not a length unit"]]
    - [0.0, "cm", accepted, []]
    - [0.0, "km", rejected, ["constraint(C_DV_QUANTITY.list): km is not allowed"]]
    - [1.0, "cm", accepted, []]
    - [5.7, "cm", accepted, []]
    - [10.0, "cm", accepted, []]
