# OFFICIAL master15 test case (authored 2026-07-24, combined synth families).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality /
# C_ATTRIBUTE.existence and the RM COMPOSITION invariants. The official
# constraint "context occurrences 1..1" is realized as C_ATTRIBUTE.existence
# 1..1 on COMPOSITION.context (equivalent for a single-valued attribute: the
# attribute's target object must exist).
# Realization (COMPOSITION x cardinality+context-existence combined synth
# family): ONE template constrains both axes — content cardinality 1..1
# (existence follows the token, so the omitted container rejects; the official
# cell attributes the rejection to cardinality.lower) and context existence
# 1..1 with an OPTIONAL other_context (ITEM_TREE at0011). The three-state
# context_committed axis realizes the official "no context" (absent) /
# "context without other_context" (present) / "context with other_context"
# (present_with_other) blocks; content_count 0 omits the content attribute
# entirely (never an empty list).
id: CONT-COMP-content_card_mand-context_mand
kind: content
component: CONTENT
rm_class: COMPOSITION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  COMPOSITION content cardinality 1..1, context occurrences 1..1: an absent
  context always rejects (archetype-mandated); zero entries additionally
  reject on the cardinality lower bound and three entries on the upper bound;
  one entry with a valid context (with or without other_context) is accepted
  (border case).
description: "COMPOSITION.content count against a 1..1 cardinality with an archetype-mandated context"
spec_refs:
  - "CNF platform_test_schedule master15 §Test Case CONT-COMP-content_card_mand-context_mand"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM ehr §COMPOSITION (content: List<CONTENT_ITEM>, existence 0..1; context: EVENT_CONTEXT, existence 0..1; invariants Category_validity, Territory_valid, Language_valid, Content_valid, Is_archetype_root — none couples category to context)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality 1..1 on COMPOSITION.content AND
  # C_ATTRIBUTE.existence 1..1 on COMPOSITION.context in one template.
  template: cnf.tpl.ecc_composition_content_cardinality
  path: "/content"
  constraint_columns: ["cardinality", "context_existence"]
decision_table:
  # context_committed: absent = the official "no context" data set; present =
  # "context without other_context"; present_with_other = "context with
  # other_context" (all context structures valid).
  columns: [cardinality, context_existence, context_committed, content_count, expected, violates]
  rows:
    - ["mand", "mandatory", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)", "constraint(C_ATTRIBUTE.existence): context is mandated by the archetype (existence 1..1) but absent"]]
    - ["mand", "mandatory", "absent", 1, rejected, ["constraint(C_ATTRIBUTE.existence): context is mandated by the archetype (existence 1..1) but absent"]]
    - ["mand", "mandatory", "absent", 3, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)", "constraint(C_ATTRIBUTE.existence): context is mandated by the archetype (existence 1..1) but absent"]]
    - ["mand", "mandatory", "present", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)"]]
    - ["mand", "mandatory", "present", 1, accepted, []]
    - ["mand", "mandatory", "present", 3, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
    - ["mand", "mandatory", "present_with_other", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count below the interval lower bound (1)"]]
    - ["mand", "mandatory", "present_with_other", 1, accepted, []]
    - ["mand", "mandatory", "present_with_other", 3, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
