id: CONT-DV_INTERVAL_DV_QUANTITY-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_QUANTITY> against an open constraint ({*}) is
  accepted iff its interval invariants (included/unbounded consistency, limit
  ordering) hold.
description: "DV_INTERVAL<DV_QUANTITY> open ({*}): interval semantics"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_QUANTITY-validate_open"
  - "AM AOM1.4 §C_COMPLEX_OBJECT"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.interval_quantity_open    # DV_INTERVAL<DV_QUANTITY> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, true, true, false, false, accepted, []]
    - [null, "100 mg", true, false, false, false, accepted, []]
    - [null, "100 mg", true, false, false, true, accepted, []]
    - ["0 mg", null, false, true, false, false, accepted, []]
    - ["0 mg", null, false, true, true, false, accepted, []]
    - ["0 mg", "100 mg", false, false, true, true, accepted, []]
    - ["10 mg", "100 mg", false, false, true, true, accepted, []]
    - [null, null, true, true, true, false, rejected, ["rm_invariant(lower_included_valid): lower_included must be false when lower is unbounded"]]
    - ["0 mg", null, false, true, false, true, rejected, ["rm_invariant(upper_included_valid): upper_included must be false when upper is unbounded"]]
    - ["200 mg", "100 mg", false, false, true, true, rejected, ["rm_invariant(limits_consistent): lower must not exceed upper"]]
    - [null, "100 mg", false, false, false, true, rejected, ["rm_schema: lower bound absent while lower_unbounded is false (BASE Interval: a false unbounded flag asserts a finite bound; ITS-JSON requires the boundary flags)"]]
    - ["0 mg", null, false, false, true, false, rejected, ["rm_schema: upper bound absent while upper_unbounded is false (BASE Interval: a false unbounded flag asserts a finite bound; ITS-JSON requires the boundary flags)"]]
