id: CONT-DV_COUNT-validate_open
kind: content
component: CONTENT
rm_class: DV_COUNT
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_COUNT against an open constraint (DV_COUNT matches {*}, no
  C_INTEGER in the OPT) is accepted iff its magnitude is present.
description: "DV_COUNT against an open constraint ({*}): magnitude mandatory"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_COUNT-validate_open"
  - "AM AOM1.4 §C_INTEGER"
  - "RM data_types §DV_COUNT"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.count_open    # DV_COUNT matches {*} (no C_INTEGER)
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [magnitude, expected, violates]
  rows:
    - [null, rejected, ["rm_schema: magnitude is mandatory"]]
    - [0, accepted, []]
    - [1, accepted, []]
    - [15, accepted, []]
    - [30, accepted, []]
