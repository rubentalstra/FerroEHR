id: CONT-DV_MULTIMEDIA-validate_open
kind: content
component: CONTENT
rm_class: DV_MULTIMEDIA
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_MULTIMEDIA is accepted iff media_type and size are present and media_type is in the openEHR media type code set."
description: "DV_MULTIMEDIA with mandatory media_type/size and code-set membership"
spec_refs:
  - "CNF platform_test_schedule master17.6 \u00a7CONT-DV_MULTIMEDIA-validate_open"
  - "RM data_types \u00a7DV_MULTIMEDIA"
  - "AM AOM1.4 \u00a7C_CODE_PHRASE"
constraint_context:
  template: cnf.tpl.dv_multimedia_constraints
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
decision_table:
  columns: ["media_type", "size", "expected", "violates"]
  rows:
    - [null, null, "rejected", ["rm_schema: media_type and size are both mandatory"]]
    - ["abc", null, "rejected", ["rm_invariant(Media_type_valid): media_type 'abc' is not in the openEHR media type code set", "rm_schema: size is mandatory"]]
    - [null, 123, "rejected", ["rm_schema: media_type is mandatory"]]
    - ["application/dicom", 123, "accepted", []]
