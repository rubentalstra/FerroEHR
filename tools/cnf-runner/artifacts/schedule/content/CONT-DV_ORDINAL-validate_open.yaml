id: CONT-DV_ORDINAL-validate_open
kind: content
component: CONTENT
rm_class: DV_ORDINAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_ORDINAL against an open constraint (DV_ORDINAL matches {*}) is
  accepted iff both its symbol and value are present.
description: "DV_ORDINAL against an open C_DV_ORDINAL ({*}): symbol/value mandatory"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_ORDINAL-validate_open"
  - "AM AOM1.4 §C_DV_ORDINAL"
  - "RM data_types §DV_ORDINAL"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.ordinal_open    # DV_ORDINAL matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [symbol, value, expected, violates]
  rows:
    - [null, null, rejected, ["rm_schema: value and symbol are mandatory"]]
    - [null, 1, rejected, ["rm_schema: symbol is mandatory"]]
    - ["local::at0005", null, rejected, ["rm_schema: value is mandatory"]]
    - ["local::at0005", 1, accepted, []]
    - ["local::at0005", 666, accepted, []]
