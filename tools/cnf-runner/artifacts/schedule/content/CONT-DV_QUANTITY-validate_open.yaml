id: CONT-DV_QUANTITY-validate_open
kind: content
component: CONTENT
rm_class: DV_QUANTITY
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_QUANTITY against an open constraint (DV_QUANTITY matches {*}, no
  C_DV_QUANTITY in the OPT) is accepted iff both its magnitude and units are
  present.
description: "DV_QUANTITY against an open constraint ({*}): magnitude/units mandatory"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_QUANTITY-validate_open"
  - "AM AOM1.4 §C_DV_QUANTITY"
  - "RM data_types §DV_QUANTITY"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.quantity_open    # DV_QUANTITY matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [magnitude, units, expected, violates]
  rows:
    - [null, null, rejected, ["rm_schema: both magnitude and units are mandatory"]]
    - [null, "cm", rejected, ["rm_schema: magnitude is mandatory"]]
    - [1.0, null, rejected, ["rm_schema: units is mandatory"]]
    - [0.0, "cm", accepted, []]
    - [1.0, "cm", accepted, []]
    - [5.7, "cm", accepted, []]
    - [10.0, "cm", accepted, []]
