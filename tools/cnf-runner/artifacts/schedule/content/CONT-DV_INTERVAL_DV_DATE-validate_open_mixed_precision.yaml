# Split 2026-07-24 (#231 audit) from CONT-DV_INTERVAL_DV_DATE-validate_open:
# the schedule's mixed-precision row ("2021" .. "2021-10", the forum-note
# "IMO should fail" cell) is genuinely undecidable under the vendored specs —
# RM dv_date.adoc answers comparability (is_strictly_comparable_to: "True,
# for any two Dates"), but Limits_consistent then orders by magnitude(),
# whose value for a partial date the RM leaves open (register AMB-29): a
# floor-extension reading orders 2021 <= 2021-10 while a
# ceiling-extension reading does not. Neither accepted nor rejected is
# derivable, so the row rides AMB-29's report_only disposition in its own
# case, keeping the parent's derivable rows gating.
id: CONT-DV_INTERVAL_DV_DATE-validate_open_mixed_precision
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DATE> whose bounds carry different precisions
  ("2021" .. "2021-10") — ordering under Limits_consistent is open upstream
  (register AMB-29, upstream #1493); the verdict is reported per SUT and never gates.
description: "DV_INTERVAL<DV_DATE> open ({*}): mixed-precision bounds (report_only)"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DATE-validate_open"
  - "BASE foundation_types §Interval (Limits_consistent — guarded ordering)"
  - "RM data_types §DV_DATE (is_strictly_comparable_to; magnitude)"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.interval_date_open    # DV_INTERVAL<DV_DATE> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - ["2021", "2021-10", false, false, true, true, accepted, []]
ambiguities: [AMB-29]
