id: CONT-DV_PARSABLE-validate_value_formalism
kind: content
component: CONTENT
rm_class: DV_PARSABLE
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_PARSABLE is accepted iff both value and formalism satisfy their per-field C_STRING pattern/list constraints."
description: "DV_PARSABLE value and formalism against per-field C_STRING constraints"
spec_refs:
  - "CNF platform_test_schedule master17.6 \u00a7CONT-DV_PARSABLE-validate_value_formalism"
  - "RM data_types \u00a7DV_PARSABLE"
  - "AM AOM1.4 \u00a7C_STRING"
constraint_context:
  template: cnf.tpl.dv_parsable_c_string
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["C_STRING.pattern (value)", "C_STRING.list (value)", "C_STRING.pattern (formalism)", "C_STRING.list (formalism)"]
decision_table:
  columns: ["value", "formalism", "C_STRING.pattern (value)", "C_STRING.list (value)", "C_STRING.pattern (formalism)", "C_STRING.list (formalism)", "expected", "violates"]
  rows:
    - ["xxx", "abc", "x*", null, "abc", null, "accepted", []]
    - ["xxx", "abc", "a*", null, "abc", null, "rejected", ["constraint(C_STRING.pattern (value)): value does not match its C_STRING.pattern"]]
    - ["xxx", "abc", "x*", null, "x*", null, "rejected", ["constraint(C_STRING.pattern (formalism)): formalism does not match its C_STRING.pattern"]]
    - ["xxx", "abc", null, "[xxx, yyy, zzz]", "abc", null, "accepted", []]
    - ["xxx", "abc", null, "[yyy, zzz]", "abc", null, "rejected", ["constraint(C_STRING.list (value)): value is not in its C_STRING.list"]]
    - ["xxx", "abc", null, "[xxx, yyy, zzz]", null, "[abc, bbb, aaa]", "accepted", []]
    - ["xxx", "abc", null, "[xxx, yyy, zzz]", null, "[bbb, aaa]", "rejected", ["constraint(C_STRING.list (formalism)): formalism is not in its C_STRING.list"]]
