id: CONT-DV_TEXT-validate_open
kind: content
component: CONTENT
rm_class: DV_TEXT
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_TEXT is accepted when value is present and satisfies the C_STRING constraint; a runtime DV_CODED_TEXT value must still comply. Merges the schedule's two duplicate-heading validate_open tables (open, then C_STRING.pattern) \u2014 see AMB-28."
description: "DV_TEXT open ({*}) and against a C_STRING.pattern"
spec_refs:
  - "CNF platform_test_schedule master17.2 \u00a7CONT-DV_TEXT-validate_open"
  - "RM data_types \u00a7DV_TEXT"
  - "AM AOM1.4 \u00a7C_STRING"
constraint_context:
  template: cnf.tpl.dv_text_c_string
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["C_STRING.pattern", "C_STRING.list"]
decision_table:
  columns: ["value", "C_STRING.pattern", "C_STRING.list", "expected", "violates"]
  rows:
    - [null, null, null, "rejected", ["rm_schema: value is mandatory"]]
    - ["ABC", null, null, "accepted", []]
    - ["XYZ", null, null, "accepted", []]
    - [null, "XYZ", null, "rejected", ["rm_schema: value is mandatory"]]
    - ["ABC", "XYZ", null, "rejected", ["constraint(C_STRING.pattern): value does not match the C_STRING.pattern constraint"]]
    - ["XYZ", "XYZ", null, "accepted", []]
ambiguities: [AMB-28]
