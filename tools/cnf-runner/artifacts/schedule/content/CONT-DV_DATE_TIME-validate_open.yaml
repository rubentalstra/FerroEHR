id: CONT-DV_DATE_TIME-validate_open
kind: content
component: CONTENT
rm_class: DV_DATE_TIME
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DATE_TIME is accepted iff its value is a valid openEHR ISO 8601 date-time (partial expressions allowed; field ranges enforced)."
description: "DV_DATE_TIME value against the openEHR ISO 8601 date-time grammar"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DATE_TIME-validate_open"
  - "RM data_types \u00a7DV_DATE_TIME"
  - "AM AOM1.4 \u00a7C_DATE_TIME"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.dv_date_time_open
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
decision_table:
  columns: ["value", "expected", "violates"]
  rows:
    - [null, "rejected", ["rm_schema: value is mandatory"]]
    - ["", "rejected", ["iso8601(year_required): openEHR RM/AOM requires at least the year"]]
    - ["2021", "accepted", []]
    - ["2021-10", "accepted", []]
    - ["2021-00", "rejected", ["iso8601(month_range): month must be in 01..12"]]
    - ["2021-13", "rejected", ["iso8601(month_range): month must be in 01..12"]]
    - ["2021-10-24", "accepted", []]
    - ["2021-10-00", "rejected", ["iso8601(day_range): day must be in 01..31"]]
    - ["2021-10-32", "rejected", ["iso8601(day_range): day must be in 01..31"]]
    - ["2021-10-24T10", "accepted", []]
    - ["2021-10-24T48", "rejected", ["iso8601(hour_range): hours must be in 0..23"]]
    - ["2021-10-24T10:30", "accepted", []]
    - ["2021-10-24T10:95", "rejected", ["iso8601(minute_range): minutes must be in 0..59"]]
    - ["2021-10-24T10:30:47", "accepted", []]
    - ["2021-10-24T10:30:78", "rejected", ["iso8601(second_range): seconds must be in 0..59"]]
    - ["2021-10-24T10:30:47.5", "accepted", []]
    - ["2021-10-24T10:30:47.333", "accepted", []]
    - ["2021-10-24T10:30:47.333333", "accepted", []]
    - ["2021-10-24T10:30:47Z", "accepted", []]
    - ["2021-10-24T10:30:78Z", "rejected", ["iso8601(second_range): seconds must be in 0..59"]]
    - ["2021-10-24T10:30:47.5Z", "accepted", []]
    - ["2021-10-24T10:30:47.333Z", "accepted", []]
    - ["2021-10-24T10:30:47.333333Z", "accepted", []]
    - ["2021-10-24T10:30:47-03:00", "accepted", []]
    - ["2021-10-24T10:30:78-03:00", "rejected", ["iso8601(second_range): seconds must be in 0..59"]]
    - ["2021-10-24T10:30:47.5-03:00", "accepted", []]
    - ["2021-10-24T10:30:47.333-03:00", "accepted", []]
    - ["2021-10-24T10:30:47.333333-03:00", "accepted", []]
