id: CONT-DV_MULTIMEDIA-validate_media_type
kind: content
component: CONTENT
rm_class: DV_MULTIMEDIA
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_MULTIMEDIA is accepted iff media_type satisfies its C_CODE_PHRASE and size satisfies its C_INTEGER list/range constraints; violations accumulate."
description: "DV_MULTIMEDIA against C_CODE_PHRASE (media_type) and C_INTEGER (size) constraints"
spec_refs:
  - "CNF platform_test_schedule master17.6 \u00a7CONT-DV_MULTIMEDIA-validate_media_type"
  - "RM data_types \u00a7DV_MULTIMEDIA"
  - "AM AOM1.4 \u00a7C_CODE_PHRASE"
  - "AM AOM1.4 \u00a7C_INTEGER"
constraint_context:
  template: cnf.tpl.dv_multimedia_constraints
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["C_CODE_PHRASE", "C_INTEGER.list", "C_INTEGER.range"]
decision_table:
  columns: ["media_type", "size", "C_CODE_PHRASE", "C_INTEGER.list", "C_INTEGER.range", "expected", "violates"]
  rows:
    - ["application/dicom", 123, null, "[10, 100, 1000]", null, "rejected", ["constraint(C_INTEGER.list): size is not in the allowed C_INTEGER.list"]]
    - ["application/dicom", 100, null, "[10, 100, 1000]", null, "accepted", []]
    - ["application/dicom", 123, null, null, "0..1000", "accepted", []]
    - ["application/dicom", 123, null, null, "200..1000", "rejected", ["constraint(C_INTEGER.range): size is outside the C_INTEGER.range"]]
    - ["application/dicom", 100, "[application/dicom, text/plain, text/html]", "[10, 100, 1000]", null, "accepted", []]
    - ["application/dicom", 100, "[text/plain, text/html]", "[10, 100, 1000]", null, "rejected", ["constraint(C_CODE_PHRASE): media_type is not in the constrained code list"]]
    - ["application/dicom", 100, "[application/dicom, text/plain, text/html]", null, "0..1000", "accepted", []]
    - ["application/dicom", 100, "[text/plain, text/html]", null, "200..1000", "rejected", ["constraint(C_CODE_PHRASE): media_type is not in the constrained code list", "constraint(C_INTEGER.range): size is outside the C_INTEGER.range"]]
