# Re-adjudicated 2026-07-21 from the retired ECC structural battery
# (ECC-VAL-017..028 events-cardinality axis) against AOM1.4 + RM spec text.
# The events axis is isolated by keeping HISTORY.summary absent throughout;
# the RM HISTORY.Events_valid invariant then couples the 0-events row (it
# rejects even where the archetype cardinality would permit 0). The summary
# axis is carried by ecc-CONT-HISTORY-summary_existence.
# `ecc-` id namespace pending upstream adoption.
id: CONT-HISTORY-events_cardinality
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With HISTORY.summary absent, a committed HISTORY is accepted iff the number of
  events lies within the archetype C_MULTIPLE_ATTRIBUTE.cardinality interval AND
  the RM HISTORY.Events_valid invariant holds (at least one event OR a summary).
  Events_valid is spec-authoritative: 0 events + absent summary rejects even
  under an unconstrained (0..*) cardinality.
description: "HISTORY.events committed count against the archetype cardinality interval and the RM Events_valid invariant (summary absent)"
spec_refs:
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "RM data_structures §HISTORY (events: List<EVENT>, existence 0..1; summary: ITEM_STRUCTURE 0..1; Events_valid: (events not empty) or summary present)"
  - "CNF platform_test_schedule master16 (content ENTRY chapter — no test-case headings; re-adjudicated to AOM/RM)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality on HISTORY.events, varied per row
  # (any=0..*, 1plus=1..*, 3plus=3..*, opt=0..1, mand=1..1, 3to5=3..5).
  template: cnf.tpl.ecc_history_events_cardinality
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data"
  constraint_columns: ["cardinality"]
decision_table:
  # cardinality: the C_MULTIPLE_ATTRIBUTE.cardinality interval token.
  # summary_committed: fixed absent (isolates the events axis).
  # events_count: number of HISTORY.events committed.
  columns: [cardinality, summary_committed, events_count, expected, violates]
  rows:
    - ["any", "absent", 0, rejected, ["rm_invariant(Events_valid): no events and no summary"]]
    - ["any", "absent", 1, accepted, []]
    - ["any", "absent", 3, accepted, []]
    - ["any", "absent", 6, accepted, []]
    - ["1plus", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (1)", "rm_invariant(Events_valid): no events and no summary"]]
    - ["1plus", "absent", 1, accepted, []]
    - ["1plus", "absent", 3, accepted, []]
    - ["1plus", "absent", 6, accepted, []]
    - ["3plus", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)", "rm_invariant(Events_valid): no events and no summary"]]
    - ["3plus", "absent", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)"]]
    - ["3plus", "absent", 3, accepted, []]
    - ["3plus", "absent", 6, accepted, []]
    - ["opt", "absent", 0, rejected, ["rm_invariant(Events_valid): no events and no summary"]]
    - ["opt", "absent", 1, accepted, []]
    - ["opt", "absent", 3, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count above the interval upper bound (1)"]]
    - ["opt", "absent", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count above the interval upper bound (1)"]]
    - ["mand", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (1)", "rm_invariant(Events_valid): no events and no summary"]]
    - ["mand", "absent", 1, accepted, []]
    - ["mand", "absent", 3, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count above the interval upper bound (1)"]]
    - ["mand", "absent", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count above the interval upper bound (1)"]]
    - ["3to5", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)", "rm_invariant(Events_valid): no events and no summary"]]
    - ["3to5", "absent", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)"]]
    - ["3to5", "absent", 3, accepted, []]
    - ["3to5", "absent", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count above the interval upper bound (5)"]]
