# OFFICIAL master16 test case (authored 2026-07-24, combined synth families).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality /
# C_ATTRIBUTE.existence and the RM HISTORY class (0-events + absent-summary
# row: the cardinality and existence rejections are joined by the RM
# Events_valid invariant).
# Realization (HISTORY x cardinality+summary-existence combined synth family):
# ONE template constrains both axes — events cardinality 3..* and summary
# existence archetype-tightened to 1..1 (ITEM_TREE at0007); the
# summary_committed and events_count data axes drive the committed instance.
id: CONT-HIST-events_card_3plus-summary_ex_mand
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  HISTORY events cardinality 3..*, summary existence 1..1: an absent summary
  always rejects (archetype-mandated); zero or one events additionally reject
  on the cardinality lower bound; three events with a summary are accepted
  (border case).
description: "HISTORY.events count against a 3..* cardinality with an archetype-mandated summary"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-HIST-events_card_3plus-summary_ex_mand"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM data_structures §HISTORY (events: List<EVENT>, existence 0..1; summary: ITEM_STRUCTURE 0..1; invariant Events_valid: (events /= Void and then not events.is_empty) or summary /= Void)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality 3..* on HISTORY.events AND
  # C_ATTRIBUTE.existence 1..1 on HISTORY.summary in one template.
  template: cnf.tpl.ecc_history_events_cardinality
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data"
  constraint_columns: ["cardinality", "summary_existence"]
decision_table:
  columns: [cardinality, summary_existence, summary_committed, events_count, expected, violates]
  rows:
    - ["3plus", "mandatory", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)", "constraint(C_ATTRIBUTE.existence): summary is mandated by the archetype (existence 1..1) but absent", "rm_invariant(Events_valid): no events and no summary"]]
    - ["3plus", "mandatory", "absent", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)", "constraint(C_ATTRIBUTE.existence): summary is mandated by the archetype (existence 1..1) but absent"]]
    - ["3plus", "mandatory", "absent", 3, rejected, ["constraint(C_ATTRIBUTE.existence): summary is mandated by the archetype (existence 1..1) but absent"]]
    - ["3plus", "mandatory", "present", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)"]]
    - ["3plus", "mandatory", "present", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)"]]
    - ["3plus", "mandatory", "present", 3, accepted, []]
