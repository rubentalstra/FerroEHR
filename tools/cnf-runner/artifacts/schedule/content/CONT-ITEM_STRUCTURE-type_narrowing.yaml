# Re-adjudicated 2026-07-21 from the retired ECC structural battery
# (ECC-VAL-034..038) against AOM1.4 + RM spec text. master16 (ENTRY) is empty;
# the ITEM_STRUCTURE type-narrowing rows are grounded in AOM1.4
# C_OBJECT.rm_type_name (the polymorphic-slot type constraint) and the RM
# ITEM_STRUCTURE hierarchy (abstract ITEM_STRUCTURE; ITEM_TREE/ITEM_LIST/
# ITEM_TABLE/ITEM_SINGLE subtypes). `ecc-` id namespace pending upstream adoption.
id: CONT-ITEM_STRUCTURE-type_narrowing
kind: content
component: CONTENT
rm_class: ITEM_STRUCTURE
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed ITEM_STRUCTURE object is accepted iff its RM type conforms to the
  archetype slot's C_OBJECT.rm_type_name: an open (abstract ITEM_STRUCTURE) slot
  accepts any of the four subtypes; a slot narrowed to one subtype rejects any
  sibling subtype (class not allowed).
description: "EVALUATION.data object type against the archetype C_OBJECT.rm_type_name constraint"
spec_refs:
  - "AM AOM1.4 §C_OBJECT (rm_type_name) — the reference-model type a node constrains"
  - "RM data_structures §ITEM_STRUCTURE / §ITEM_TREE / §ITEM_LIST / §ITEM_TABLE / §ITEM_SINGLE (abstract ITEM_STRUCTURE + four subtypes)"
  - "CNF platform_test_schedule master16 (content ENTRY chapter — no test-case headings; re-adjudicated to AOM/RM)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_OBJECT.rm_type_name on an EVALUATION.data (ITEM_STRUCTURE) slot, varied per
  # row (ITEM_STRUCTURE = abstract/open; the four subtypes = narrowed). Each
  # committed object is a well-formed instance of its RM subtype.
  template: cnf.tpl.ecc_item_structure_type_narrowing
  path: "/content[openEHR-EHR-EVALUATION.minimal.v1]/data"
  constraint_columns: ["slot_type"]
decision_table:
  # slot_type: the archetype C_OBJECT.rm_type_name for the data slot.
  # committed_type: the RM type of the committed ITEM_STRUCTURE object.
  columns: [slot_type, committed_type, expected, violates]
  rows:
    - ["ITEM_STRUCTURE", "ITEM_TREE", accepted, []]
    - ["ITEM_STRUCTURE", "ITEM_LIST", accepted, []]
    - ["ITEM_STRUCTURE", "ITEM_TABLE", accepted, []]
    - ["ITEM_STRUCTURE", "ITEM_SINGLE", accepted, []]
    - ["ITEM_TREE", "ITEM_TREE", accepted, []]
    - ["ITEM_TREE", "ITEM_LIST", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_LIST is not an allowed type for an ITEM_TREE-narrowed slot"]]
    - ["ITEM_LIST", "ITEM_LIST", accepted, []]
    - ["ITEM_LIST", "ITEM_TREE", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_TREE is not an allowed type for an ITEM_LIST-narrowed slot"]]
    - ["ITEM_TABLE", "ITEM_TABLE", accepted, []]
    - ["ITEM_TABLE", "ITEM_TREE", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_TREE is not an allowed type for an ITEM_TABLE-narrowed slot"]]
    - ["ITEM_SINGLE", "ITEM_SINGLE", accepted, []]
    - ["ITEM_SINGLE", "ITEM_TREE", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_TREE is not an allowed type for an ITEM_SINGLE-narrowed slot"]]
