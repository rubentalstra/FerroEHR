# Re-adjudicated 2026-07-21 from the retired ECC structural battery
# (ECC-VAL-031..033) against AOM1.4 + RM spec text. master16 (ENTRY) is empty;
# the EVENT type-narrowing rows are grounded in AOM1.4 C_OBJECT.rm_type_name
# (the polymorphic-slot type constraint) and the RM EVENT hierarchy
# (abstract EVENT; POINT_EVENT/INTERVAL_EVENT subtypes; INTERVAL_EVENT.width and
# .math_function are RM-mandatory). `ecc-` id namespace pending upstream adoption.
id: CONT-EVENT-type_narrowing
kind: content
component: CONTENT
rm_class: EVENT
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed EVENT object is accepted iff its RM type conforms to the archetype
  slot's C_OBJECT.rm_type_name: an open (abstract EVENT) slot accepts both
  POINT_EVENT and a well-formed INTERVAL_EVENT; a slot narrowed to one subtype
  rejects the sibling subtype (class not allowed).
description: "HISTORY.events object type against the archetype C_OBJECT.rm_type_name constraint"
spec_refs:
  - "AM AOM1.4 §C_OBJECT (rm_type_name) — the reference-model type a node constrains"
  - "RM data_structures §EVENT / §POINT_EVENT / §INTERVAL_EVENT (abstract EVENT; INTERVAL_EVENT.width 1..1, .math_function 1..1)"
  - "CNF platform_test_schedule master16 (content ENTRY chapter — no test-case headings; re-adjudicated to AOM/RM)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_OBJECT.rm_type_name on the HISTORY.events slot, varied per row
  # (EVENT = abstract/open; POINT_EVENT / INTERVAL_EVENT = narrowed subtype).
  # A committed INTERVAL_EVENT always carries its RM-mandatory width + math_function.
  template: cnf.tpl.ecc_event_type_narrowing
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events"
  constraint_columns: ["slot_type"]
decision_table:
  # slot_type: the archetype C_OBJECT.rm_type_name for the events slot.
  # committed_type: the RM type of the committed EVENT object.
  columns: [slot_type, committed_type, expected, violates]
  rows:
    - ["EVENT", "POINT_EVENT", accepted, []]
    - ["EVENT", "INTERVAL_EVENT", accepted, []]
    - ["POINT_EVENT", "POINT_EVENT", accepted, []]
    - ["POINT_EVENT", "INTERVAL_EVENT", rejected, ["constraint(C_OBJECT.rm_type_name): INTERVAL_EVENT is not an allowed type for a POINT_EVENT-narrowed slot"]]
    - ["INTERVAL_EVENT", "INTERVAL_EVENT", accepted, []]
    - ["INTERVAL_EVENT", "POINT_EVENT", rejected, ["constraint(C_OBJECT.rm_type_name): POINT_EVENT is not an allowed type for an INTERVAL_EVENT-narrowed slot"]]
