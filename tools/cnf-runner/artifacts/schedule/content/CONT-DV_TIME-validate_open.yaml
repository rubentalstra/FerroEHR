id: CONT-DV_TIME-validate_open
kind: content
component: CONTENT
rm_class: DV_TIME
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_TIME is accepted iff its value is a valid openEHR ISO 8601 time (partial times allowed; no fractional hours/minutes; field ranges enforced)."
description: "DV_TIME value against the openEHR ISO 8601 time grammar"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_TIME-validate_open"
  - "RM data_types \u00a7DV_TIME"
  - "AM AOM1.4 \u00a7C_TIME"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.dv_time_open
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
# time literals corrected 2026-07-22: ISO 8601 / BASE foundation_types time syntax carries no leading T designator (T marks the date-time separator and duration components only)
decision_table:
  columns: ["value", "expected", "violates"]
  rows:
    - [null, "rejected", ["rm_schema: value is mandatory"]]
    - ["", "rejected", ["iso8601(hours_required): at least hours are required"]]
    - ["10", "accepted", []]
    - ["48", "rejected", ["iso8601(hour_range): hours must be in 0..23"]]
    - ["10:30", "accepted", []]
    - ["10:95", "rejected", ["iso8601(minute_range): minutes must be in 0..59"]]
    - ["10:30:47", "accepted", []]
    - ["10:30:78", "rejected", ["iso8601(second_range): seconds must be in 0..59"]]
    - ["10:30:47.5", "accepted", []]
    - ["10:30:47.333", "accepted", []]
    - ["10:30:47.333333", "accepted", []]
    - ["10:30:47Z", "accepted", []]
    - ["10:30:78Z", "rejected", ["iso8601(second_range): seconds must be in 0..59"]]
    - ["10:30:47.5Z", "accepted", []]
    - ["10:30:47.333Z", "accepted", []]
    - ["10:30:47.333333Z", "accepted", []]
    - ["10:30:47-03:00", "accepted", []]
    - ["10:30:78-03:00", "rejected", ["iso8601(second_range): seconds must be in 0..59"]]
    - ["10:30:47.5-03:00", "accepted", []]
    - ["10:30:47.333-03:00", "accepted", []]
    - ["10:30:47.333333-03:00", "accepted", []]
    - ["10.5", "rejected", ["iso8601(no_fractional_hours): openEHR does not allow fractional hours in partial time expressions"]]
    - ["10:05.5", "rejected", ["iso8601(no_fractional_minutes): openEHR does not allow fractional minutes in partial time expressions"]]
ambiguities: [AMB-44]
