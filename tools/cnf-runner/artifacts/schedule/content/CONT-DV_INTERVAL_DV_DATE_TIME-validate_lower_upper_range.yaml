id: CONT-DV_INTERVAL_DV_DATE_TIME-validate_lower_upper_range
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DATE_TIME> is accepted iff both its lower and upper
  values fall within the per-bound C_DATE_TIME.range interval constraining that
  bound; the four interval bound flags are constant across every row
  (lower_unbounded=false, upper_unbounded=false, lower_included=true,
  upper_included=true) and are dropped from the table.
description: "DV_INTERVAL<DV_DATE_TIME> lower/upper against per-bound C_DATE_TIME.range constraints"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DATE_TIME-validate_lower_upper_range"
  - "AM AOM1.4 §C_DATE_TIME"
  - "RM data_types §DV_INTERVAL"
constraint_context:
  template: cnf.tpl.interval_date_time_range
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
  constraint_columns: ["c_date_time_range_lower", "c_date_time_range_upper"]
decision_table:
  columns: [lower, upper, c_date_time_range_lower, c_date_time_range_upper, expected, violates]
  rows:
    - ["2021", "2022", "2020..2030", "2020..2030", accepted, []]
    - ["2021", "2022", "2000..2010", "2020..2030", rejected, ["constraint(C_DATE_TIME.range): lower out of range"]]
    - ["2021", "2022", "2020..2030", "2020..2021", rejected, ["constraint(C_DATE_TIME.range): upper out of range"]]
