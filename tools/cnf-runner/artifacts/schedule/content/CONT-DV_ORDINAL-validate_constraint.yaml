id: CONT-DV_ORDINAL-validate_constraint
kind: content
component: CONTENT
rm_class: DV_ORDINAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_ORDINAL is accepted iff its value|symbol tuple matches one of
  the C_DV_ORDINAL.list entries.
description: "DV_ORDINAL against C_DV_ORDINAL.list = 1|[local::at0005], 2|[local::at0006]"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_ORDINAL-validate_constraint"
  - "AM AOM1.4 §C_DV_ORDINAL"
  - "RM data_types §DV_ORDINAL"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.ordinal_list    # C_DV_ORDINAL.list = 1|[local::at0005], 2|[local::at0006]
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [symbol, value, expected, violates]
  rows:
    - ["local::at0005", 1, accepted, []]
    - ["local::at0005", 666, rejected, ["constraint(C_DV_ORDINAL.list): no matching value"]]
    - ["local::at0666", 1, rejected, ["constraint(C_DV_ORDINAL.list): no matching symbol"]]
