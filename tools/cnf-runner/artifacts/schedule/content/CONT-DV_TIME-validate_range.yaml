id: CONT-DV_TIME-validate_range
kind: content
component: CONTENT
rm_class: DV_TIME
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_TIME is accepted iff it falls within the C_TIME range. The single schedule 'C_TIME.range' interval cell is decomposed into inclusive range.lower / range.upper columns (null = unbounded) because the literal grammar's range production requires numeric bounds \u2014 see REQUIREMENTS-rest.md."
description: "DV_TIME against C_TIME range constraints (closed and open-ended)"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_TIME-validate_range"
  - "RM data_types \u00a7DV_TIME"
  - "AM AOM1.4 \u00a7C_TIME"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.dv_time_c_time
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["range.lower", "range.upper"]
# time literals corrected 2026-07-22: ISO 8601 / BASE foundation_types time syntax carries no leading T designator (T marks the date-time separator and duration components only)
