id: CONT-DV_INTERVAL_DV_QUANTITY-validate_upper_lower
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With C_DV_QUANTITY constraints (property temperature, allowed range 0..100 Cel)
  on both limits, a committed DV_INTERVAL<DV_QUANTITY> is accepted iff each
  present limit lies within the temperature range. Temperature is used so
  negative values are meaningful.
description: "DV_INTERVAL<DV_QUANTITY>: C_DV_QUANTITY.list = [Cel 0..100] on lower and upper (temperature)"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_QUANTITY-validate_upper_lower"
  - "AM AOM1.4 §C_DV_QUANTITY"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.interval_quantity_temp    # C_DV_QUANTITY.list = [Cel 0..100] on both limits
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, true, true, false, false, accepted, []]
    - ["0 Cel", null, false, true, true, false, accepted, []]
    - [null, "100 Cel", true, false, false, true, accepted, []]
    - ["0 Cel", "100 Cel", false, false, true, true, accepted, []]
    - ["-10 Cel", "100 Cel", false, false, true, true, rejected, ["constraint(C_DV_QUANTITY.list): lower not in range"]]
    - ["0 Cel", "200 Cel", false, false, true, true, rejected, ["constraint(C_DV_QUANTITY.list): upper not in range"]]
    - ["-10 Cel", "200 Cel", false, false, true, true, rejected, ["constraint(C_DV_QUANTITY.list): lower not in range", "constraint(C_DV_QUANTITY.list): upper not in range"]]
