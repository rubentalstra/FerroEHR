id: CONT-DV_COUNT-validate_range
kind: content
component: CONTENT
rm_class: DV_COUNT
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_COUNT is accepted iff its magnitude is present and lies within
  the C_INTEGER.range = 10..20.
description: "DV_COUNT against C_INTEGER.range = 10..20"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_COUNT-validate_range"
  - "AM AOM1.4 §C_INTEGER"
  - "RM data_types §DV_COUNT"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.count_range    # C_INTEGER.range = 10..20
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [magnitude, expected, violates]
  rows:
    - [null, rejected, ["rm_schema: magnitude is mandatory"]]
    - [0, rejected, ["constraint(C_INTEGER.range): magnitude not in range"]]
    - [1, rejected, ["constraint(C_INTEGER.range): magnitude not in range"]]
    - [15, accepted, []]
    - [30, rejected, ["constraint(C_INTEGER.range): magnitude not in range"]]
