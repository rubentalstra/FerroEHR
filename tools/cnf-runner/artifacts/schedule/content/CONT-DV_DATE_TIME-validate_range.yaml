id: CONT-DV_DATE_TIME-validate_range
kind: content
component: CONTENT
rm_class: DV_DATE_TIME
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DATE_TIME is accepted iff it falls within the C_DATE_TIME range; a reduced-precision limit is interpreted as its full interval (e.g. 1900..2021 = 1900-01-01..2021-12-31). The single schedule range cell is decomposed into inclusive range.lower / range.upper columns \u2014 see REQUIREMENTS-rest.md."
description: "DV_DATE_TIME against C_DATE_TIME range constraints (year/month/day/date-time precision)"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DATE_TIME-validate_range"
  - "RM data_types \u00a7DV_DATE_TIME"
  - "AM AOM1.4 \u00a7C_DATE_TIME"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.dv_date_time_c_date_time
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["range.lower", "range.upper"]
# datetime rows re-anchored 2026-07-22: the T-precision rows compare value vs range on the SAME calendar date (1900-03-13) — the earlier 2021-10-24T10 value made the authored hour-window expectations arithmetically wrong (BASE foundation_types §Interval has/contains is a total-order comparison on the full datetime, not the time-of-day)
decision_table:
  columns: ["value", "range.lower", "range.upper", "expected", "violates"]
  rows:
    - ["2021", "1900", "2030", "accepted", []]
    - ["2021", "2022", "2030", "rejected", ["constraint(C_DATE_TIME.range): value is outside the C_DATE_TIME.range interval"]]
    - ["2021", "1900", "2020", "rejected", ["constraint(C_DATE_TIME.range): value is outside the C_DATE_TIME.range interval"]]
    - ["2021-10", "1900-03", "2030-07", "accepted", []]
    - ["2021-10", "2022-03", "2030-07", "rejected", ["constraint(C_DATE_TIME.range): value is outside the C_DATE_TIME.range interval"]]
    - ["2021-10", "1900-03", "2020-07", "rejected", ["constraint(C_DATE_TIME.range): value is outside the C_DATE_TIME.range interval"]]
    - ["2021-10-24", "1900-03-13", "2030-07-09", "accepted", []]
    - ["2021-10-24", "2022-03-13", "2030-07-09", "rejected", ["constraint(C_DATE_TIME.range): value is outside the C_DATE_TIME.range interval"]]
    - ["2021-10-24", "1900-03-13", "2020-07-09", "rejected", ["constraint(C_DATE_TIME.range): value is outside the C_DATE_TIME.range interval"]]
    - ["2021-05", "1900", "2030", "accepted", []]
    - ["2021-05", "2022", "2030", "rejected", ["constraint(C_DATE_TIME.range): value is outside the C_DATE_TIME.range interval"]]
    - ["2021-05", "1900", "2021", "accepted", []]
    - ["2021", "2020-07", "2022-03", "accepted", []]
    - ["1900-03-13T10", "1900-03-13T00", "1900-03-13T23", "accepted", []]
    - ["1900-03-13T10", "1900-03-13T00:00", "1900-03-13T23:59", "accepted", []]
