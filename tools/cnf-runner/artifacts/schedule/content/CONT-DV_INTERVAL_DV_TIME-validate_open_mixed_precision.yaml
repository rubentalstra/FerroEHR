# Split 2026-07-24 (#231 audit) from CONT-DV_INTERVAL_DV_TIME-validate_open:
# the schedule's mixed-precision row ("10" .. "10:45:00", the forum-note
# "IMO should fail" cell) is genuinely undecidable under the vendored specs —
# RM dv_time.adoc answers comparability (is_strictly_comparable_to: "True,
# for any two Times"), but Limits_consistent then orders by magnitude(),
# whose value for a partial time the RM leaves open (register AMB-29): a floor-extension reading orders 10:00:00 <= 10:45:00
# while a ceiling-extension reading does not. Neither accepted nor rejected
# is derivable, so the row rides AMB-29's report_only disposition in its own
# case, keeping the parent's derivable rows gating. Time literals follow the
# BASE Iso8601_time syntax (no leading T) per AMB-44.
id: CONT-DV_INTERVAL_DV_TIME-validate_open_mixed_precision
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_TIME> whose bounds carry different precisions
  ("10" .. "10:45:00") — ordering under Limits_consistent is open upstream
  (register AMB-29, upstream #1493); the verdict is reported per SUT and never gates.
description: "DV_INTERVAL<DV_TIME> open ({*}): mixed-precision bounds (report_only)"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_TIME-validate_open"
  - "BASE foundation_types §Interval (Limits_consistent — guarded ordering)"
  - "RM data_types §DV_TIME (is_strictly_comparable_to; magnitude)"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.interval_time_open    # DV_INTERVAL<DV_TIME> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - ["10", "10:45:00", false, false, true, true, accepted, []]
ambiguities: [AMB-29, AMB-44]
