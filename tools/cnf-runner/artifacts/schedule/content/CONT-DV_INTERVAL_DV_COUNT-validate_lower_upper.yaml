id: CONT-DV_INTERVAL_DV_COUNT-validate_lower_upper
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With C_INTEGER.range = 0..100 on both limits, a committed DV_INTERVAL<DV_COUNT>
  is accepted iff each present limit lies within the range (limits are optional).
description: "DV_INTERVAL<DV_COUNT>: C_INTEGER.range = 0..100 on lower and upper"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_COUNT-validate_lower_upper"
  - "AM AOM1.4 §C_INTEGER"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.interval_count_range    # C_INTEGER.range = 0..100 on both limits
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, true, true, false, false, accepted, []]
    - [0, null, false, true, true, false, accepted, []]
    - [null, 100, true, false, false, true, accepted, []]
    - [0, 100, false, false, true, true, accepted, []]
    - [-10, 100, false, false, true, true, rejected, ["constraint(C_INTEGER.range): lower not in range"]]
    - [0, 200, false, false, true, true, rejected, ["constraint(C_INTEGER.range): upper not in range"]]
    - [-10, 200, false, false, true, true, rejected, ["constraint(C_INTEGER.range): lower not in range", "constraint(C_INTEGER.range): upper not in range"]]
