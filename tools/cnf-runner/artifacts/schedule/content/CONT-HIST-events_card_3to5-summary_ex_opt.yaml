# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D7).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality and the
# RM HISTORY class (0-events + absent-summary row: the cardinality rejection
# is joined by the RM Events_valid invariant). Full official table (both
# summary blocks) encoded 2026-07-24 via the summary_committed data axis on
# the cardinality synth family.
# Realization (HISTORY x cardinality synth family): the archetype leaves
# summary unconstrained (= RM existence 0..1, this case's summary_ex_opt);
# the summary_committed axis drives the committed instance — the
# summary-present rows commit a valid ITEM_TREE summary.
# The official data sets stop at 3 events, so the 3..5 UPPER bound is never
# crossed by this table — the count-6 upper-bound row lives in the
# CONT-HISTORY-events_cardinality_count6 catalogue extension.
id: CONT-HIST-events_card_3to5-summary_ex_opt
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  HISTORY events cardinality 3..5, summary existence 0..1: zero or one events
  reject on the cardinality lower bound (with summary absent and present
  alike); three events are accepted (border case).
description: "HISTORY.events count against a 3..5 cardinality, summary optional"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-HIST-events_card_3to5-summary_ex_opt"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "RM data_structures §HISTORY (events: List<EVENT>, existence 0..1; summary: ITEM_STRUCTURE 0..1; invariant Events_valid: (events /= Void and then not events.is_empty) or summary /= Void)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality 3..5 on HISTORY.events.
  template: cnf.tpl.ecc_history_events_cardinality
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data"
  constraint_columns: ["cardinality"]
decision_table:
  columns: [cardinality, summary_committed, events_count, expected, violates]
  rows:
    - ["3to5", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)", "rm_invariant(Events_valid): no events and no summary"]]
    - ["3to5", "absent", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)"]]
    - ["3to5", "absent", 3, accepted, []]
    - ["3to5", "present", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)"]]
    - ["3to5", "present", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)"]]
    - ["3to5", "present", 3, accepted, []]
