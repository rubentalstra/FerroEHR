# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D5): the
# 2026-07-21 claim that master16 carries no test-case headings was false.
# Verdicts recomputed against AOM1.4 C_ATTRIBUTE.existence and the RM EVENT
# class (data: T, existence 1..1; state: ITEM_STRUCTURE, existence 0..1).
id: CONT-EVENT-state_ex_opt
kind: content
component: CONTENT
rm_class: EVENT
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  EVENT state existence 0..1: a committed EVENT is rejected iff its
  RM-mandatory data is absent; state may be freely present or absent.
description: "EVENT data (RM mandatory) with state archetype-optional"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-EVENT-state_ex_opt"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM data_structures §EVENT (data: T, existence 1..1; state: ITEM_STRUCTURE, existence 0..1)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_ATTRIBUTE.existence on EVENT.state at the RM default 0..1.
  template: cnf.tpl.ecc_event_state_existence
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events"
  constraint_columns: ["state_existence"]
decision_table:
  columns: [state_existence, data_committed, state_committed, expected, violates]
  rows:
    - ["optional", "absent", "absent", rejected, ["rm_schema: EVENT.data is mandatory (existence 1..1)"]]
    - ["optional", "absent", "present", rejected, ["rm_schema: EVENT.data is mandatory (existence 1..1)"]]
    - ["optional", "present", "absent", accepted, []]
    - ["optional", "present", "present", accepted, []]
