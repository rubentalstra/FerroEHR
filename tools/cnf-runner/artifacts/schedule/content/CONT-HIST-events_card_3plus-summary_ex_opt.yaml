# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D7).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality and the
# RM HISTORY class (0-events row: the cardinality rejection is joined by the
# RM Events_valid invariant since summary is absent).
# Realization (HISTORY x cardinality synth family): summary is never committed
# by this family, so the rows realize the official summary-absent block; the
# archetype leaves summary unconstrained (= RM existence 0..1).
# TODO: encode the official summary-present rows once the content synth
#       vocabulary drives the summary data axis alongside the events
#       cardinality constraint.
id: CONT-HIST-events_card_3plus-summary_ex_opt
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  HISTORY events cardinality 3..*, summary existence 0..1: with summary absent,
  zero or one events reject on the cardinality lower bound; three events are
  accepted (border case).
description: "HISTORY.events count against a 3..* cardinality, summary optional and absent"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-HIST-events_card_3plus-summary_ex_opt"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "RM data_structures §HISTORY (events: List<EVENT>, existence 0..1; summary: ITEM_STRUCTURE 0..1; invariant Events_valid: (events /= Void and then not events.is_empty) or summary /= Void)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality 3..* on HISTORY.events.
  template: cnf.tpl.ecc_history_events_cardinality
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data"
  constraint_columns: ["cardinality"]
decision_table:
  columns: [cardinality, summary_committed, events_count, expected, violates]
  rows:
    - ["3plus", "absent", 0, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)", "rm_invariant(Events_valid): no events and no summary"]]
    - ["3plus", "absent", 1, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (3)"]]
    - ["3plus", "absent", 3, accepted, []]
