id: CONT-DV_INTERVAL_DV_TIME-validate_lower_upper_range
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_TIME> is accepted iff both limit DV_TIME values
  fall within their C_TIME.range constraints; the interval bound flags vary in
  this table (rows with an unbounded limit) and are retained.
description: "DV_INTERVAL<DV_TIME> limits against C_TIME.range (with unbounded-limit rows)"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_TIME-validate_lower_upper_range"
  - "AM AOM1.4 §C_TIME"
  - "RM data_types §DV_INTERVAL"
constraint_context:
  template: cnf.tpl.interval_time_range
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
  constraint_columns: ["c_time_range_lower", "c_time_range_upper"]
# time literals corrected 2026-07-22: ISO 8601 / BASE foundation_types time syntax carries no leading T designator (T marks the date-time separator and duration components only)
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, c_time_range_lower, c_time_range_upper, expected, violates]
  rows:
    - ["10", "11", false, false, true, true, "[09, 11]", "[10, 12]", accepted, []]
    - ["10:00", "11:00", false, false, true, true, "[09:00, 11:00]", "[10:00, 12:00]", accepted, []]
    - ["10:00:00", "11:00:00", false, false, true, true, "[09:00:00, 11:00:00]", "[10:00:00, 12:00:00]", accepted, []]
    - ["10:00:00.5", "11:00:00.5", false, false, true, true, "[09:00:00.0, 11:00:00.0]", "[10:00:00.0, 12:00:00.0]", accepted, []]
    - ["10:00:00.5Z", "11:00:00.5Z", false, false, true, true, "[09:00:00.0, 11:00:00.0Z]", "[10:00:00.0Z, 12:00:00.0Z]", accepted, []]
    - ["10", "11", false, false, true, true, "[11, 12]", "[11, 12]", rejected, ["constraint(C_TIME.range): lower out of range"]]
    - ["10", "12", false, false, true, true, "[10, 11]", "[10, 11]", rejected, ["constraint(C_TIME.range): upper out of range"]]
    - [null, "11", true, false, false, true, "[09, 11]", "[10, 12]", accepted, []]   # re-adjudicated 2026-07-22: the lower bound is ABSENT (unbounded side) and the interval OPT constrains lower with existence 0..1 — a domain constraint on an absent optional attribute cannot be violated (AM AOM1.4 master04 §existence: existence says whether the object is there; conformance checks apply to present objects)
    - ["10", null, false, true, true, false, "[09, 11]", "[10, 12]", accepted, []]
ambiguities: [AMB-27, AMB-44]
