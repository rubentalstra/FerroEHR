id: CONT-DV_INTERVAL_DV_SCALE-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_SCALE> against an open constraint ({*}) is accepted
  iff both limits carry symbol and value and the limits are comparable. DV_SCALE
  exists only from RM 1.1.0.
description: "DV_INTERVAL<DV_SCALE> open ({*}): symbol/value mandatory, comparable limits"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_SCALE-validate_open"
  - "AM AOM1.4 §C_DV_SCALE"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.1.0" }
guards:
  - "modeling tool supports representing DV_INTERVAL<DV_SCALE> — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_scale_open    # DV_INTERVAL<DV_SCALE> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower_symbol, lower_value, upper_symbol, upper_value, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, null, null, false, false, true, true, rejected, ["rm_schema: value and symbol are mandatory for lower and upper"]]
    - [null, 1.5, null, 5.3, false, false, true, true, rejected, ["rm_schema: symbol is mandatory for lower and upper"]]
    - ["local::at0005", null, "local::at0003", null, false, false, true, true, rejected, ["rm_schema: value is mandatory for lower and upper"]]
    - ["local::at0005", 1.5, "local::at0002", 5.3, false, false, true, true, accepted, []]
    - ["local::at0004", 666.1, "local::at0003", 777.1, false, false, true, true, accepted, []]
    - ["local::at0003", 777.1, "local::at0004", 666.1, false, false, true, true, rejected, ["rm_invariant(limits_comparable): interval limits are not comparable"]]
