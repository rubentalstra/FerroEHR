id: CONT-DV_PROPORTION-validate_ratio_range
kind: content
component: CONTENT
rm_class: DV_PROPORTION
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With type constrained to C_INTEGER.list = [0] (ratio) and C_REAL.range on the
  numerator (5..20) and denominator (200..600), a committed proportion is
  accepted iff its type is a ratio and both numerator and denominator lie in
  their ranges.
description: "DV_PROPORTION ratio with C_REAL.range numerator=5..20, denominator=200..600"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_PROPORTION-validate_ratio_range"
  - "AM AOM1.4 §C_REAL"
  - "RM data_types §DV_PROPORTION"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.proportion_ratio_range    # type=[0]; numerator C_REAL.range=5..20; denominator C_REAL.range=200..600
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [type, numerator, denominator, precision, expected, violates]
  rows:
    - [0, 10, 500, 0, accepted, []]
    - [0, 10, 1, 0, rejected, ["constraint(C_REAL.range): denominator not in range"]]
    - [0, 30, 500, 0, rejected, ["constraint(C_REAL.range): numerator not in range"]]
    - [0, 3, 1000, 0, rejected, ["constraint(C_REAL.range): numerator not in range", "constraint(C_REAL.range): denominator not in range"]]
