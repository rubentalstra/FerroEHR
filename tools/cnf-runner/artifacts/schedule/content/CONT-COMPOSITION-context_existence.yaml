# REALIZATION COMPLEMENT (rebuilt 2026-07-24, catalogue audit D1/D2): carries
# the official master15 "one entry | no context | accepted" cell realized on
# the context-existence synth family, with the archetype at the RM default
# (0..1 = the official case's "no constraint over context") and the instance
# committing exactly one content entry with no context. Since 2026-07-24 the
# cardinality synth family drives the context per row (context_committed), so
# CONT-COMP-content_card_any-context_any encodes this cell too — this file is
# retained as the distinct-family (existence-template) realization of the same
# cell. The former ad-hoc rows of this case are otherwise covered: (optional,
# present) by CONT-COMP-content_card_any-context_any; (mandatory,
# present/absent) by CONT-COMP-content_card_any-context_mand.
id: CONT-COMPOSITION-context_existence
kind: content
component: CONTENT
rm_class: COMPOSITION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  Realization complement for master15 CONT-COMP-content_card_any-context_any:
  a committed COMPOSITION with one entry and NO context is accepted when the
  archetype leaves COMPOSITION.context at its RM existence (0..1) — the
  official "no context" data-set row.
description: "COMPOSITION with no context accepted under the RM-default (0..1) context existence"
spec_refs:
  - "CNF platform_test_schedule master15 §Test Case CONT-COMP-content_card_any-context_any (the 'no context' data set)"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM ehr §COMPOSITION (context: EVENT_CONTEXT, existence 0..1; invariants Category_validity, Territory_valid, Language_valid, Content_valid, Is_archetype_root — none couples category to context)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_ATTRIBUTE.existence on COMPOSITION.context at the RM default 0..1.
  template: cnf.tpl.ecc_composition_context_existence
  path: "/context"
  constraint_columns: ["context_existence"]
decision_table:
  columns: [context_existence, context_committed, expected, violates]
  rows:
    - ["optional", "absent", accepted, []]
