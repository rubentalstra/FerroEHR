id: CONT-DV_INTERVAL_DV_DATE-validate_lower_upper_range
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DATE> is accepted iff both limit DV_DATE values
  fall within their C_DATE.range constraints; the four interval bound flags are
  constant (lower_unbounded=false, upper_unbounded=false, lower_included=true,
  upper_included=true) and are omitted.
description: "DV_INTERVAL<DV_DATE> limits against C_DATE.range"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DATE-validate_lower_upper_range"
  - "AM AOM1.4 §C_DATE"
  - "RM data_types §DV_INTERVAL"
constraint_context:
  template: cnf.tpl.interval_date_range
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, c_date_range_lower, c_date_range_upper, expected, violates]
  rows:
    - ["2021", "2022", "1900..2030", "1900..2030", accepted, []]
    - ["2021", "2022", "2022..2030", "1900..2030", rejected, ["constraint(C_DATE.range): lower out of range"]]
    - ["2021", "2022", "1900..2030", "2023..2030", rejected, ["constraint(C_DATE.range): upper out of range"]]
    - ["2021", "2022", "2022..2030", "2023..2030", rejected, ["constraint(C_DATE.range): lower out of range", "constraint(C_DATE.range): upper out of range"]]
