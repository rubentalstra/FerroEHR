# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D3): the
# 2026-07-21 claim that master16 carries no test-case headings was false — the
# chapter defines 26 official cases with full decision tables. Verdicts
# recomputed against AOM1.4 C_ATTRIBUTE.existence and the RM OBSERVATION
# (data: HISTORY 1..1, state: HISTORY 0..1) / CARE_ENTRY (protocol:
# ITEM_STRUCTURE 0..1) classes.
# Realization (OBSERVATION synth family): "data absent" is realized by the
# instance builder at the event level (the committed EVENT omits its
# RM-mandatory data, existence 1..1) — the RM/schema rejection the official
# NOTE requires fires either way; state/protocol absence is realized at the
# OBSERVATION level exactly as tabled.
id: CONT-OBS-state_ex_opt-protocol_ex_opt
kind: content
component: CONTENT
rm_class: OBSERVATION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  OBSERVATION state existence 0..1, protocol existence 0..1: a committed
  OBSERVATION is rejected iff its RM-mandatory data is absent; state and
  protocol may be freely present or absent.
description: "OBSERVATION data (RM mandatory) with state/protocol both archetype-optional"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-OBS-state_ex_opt-protocol_ex_opt"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM ehr §OBSERVATION (data: HISTORY, existence 1..1; state: HISTORY, existence 0..1)"
  - "RM ehr §CARE_ENTRY (protocol: ITEM_STRUCTURE, existence 0..1)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_ATTRIBUTE.existence on OBSERVATION.state and OBSERVATION.protocol,
  # both at the RM default 0..1 for this case.
  template: cnf.tpl.ecc_observation_state_protocol_existence
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]"
  constraint_columns: ["state_existence", "protocol_existence"]
decision_table:
  columns: [state_existence, protocol_existence, data_committed, state_committed, protocol_committed, expected, violates]
  rows:
    - ["optional", "optional", "absent", "absent", "absent", rejected, ["rm_schema: OBSERVATION.data is mandatory (existence 1..1)"]]
    - ["optional", "optional", "absent", "absent", "present", rejected, ["rm_schema: OBSERVATION.data is mandatory (existence 1..1)"]]
    - ["optional", "optional", "absent", "present", "absent", rejected, ["rm_schema: OBSERVATION.data is mandatory (existence 1..1)"]]
    - ["optional", "optional", "absent", "present", "present", rejected, ["rm_schema: OBSERVATION.data is mandatory (existence 1..1)"]]
    - ["optional", "optional", "present", "absent", "absent", accepted, []]
    - ["optional", "optional", "present", "absent", "present", accepted, []]
    - ["optional", "optional", "present", "present", "absent", accepted, []]
    - ["optional", "optional", "present", "present", "present", accepted, []]
