# CATALOGUE ADDITION beyond the official master16 cells (rebuilt 2026-07-24,
# catalogue audit D7): the official CONT-HIST-events_card_*-summary_ex_* data
# sets stop at three events, so a count above every tested bound — in
# particular the 3..5 UPPER bound, which no official cell ever crosses — is
# untested upstream. These count-6 rows are derivable extensions: each verdict
# follows directly from AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality interval
# membership (6 within 0..*/1..*/3..*; 6 above the 0..1/1..1 upper bound 1 and
# the 3..5 upper bound 5); summary is absent throughout and six events satisfy
# the RM Events_valid invariant on their own. Carried over from the retired
# ad-hoc CONT-HISTORY-events_cardinality case (its official-cell rows moved to
# the CONT-HIST-events_card_*-summary_ex_opt files).
id: CONT-HISTORY-events_cardinality_count6
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  Catalogue addition beyond the official master16 cells: a committed HISTORY
  with six events (summary absent) is accepted under the unbounded
  cardinalities (0..*, 1..*, 3..*) and rejected above the bounded upper limits
  (0..1, 1..1, 3..5) — the 3..5 upper bound is exercised nowhere in the
  official tables.
description: "HISTORY.events count 6 against every official cardinality interval (upper-bound extension)"
spec_refs:
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "RM data_structures §HISTORY (events: List<EVENT>, existence 0..1; summary: ITEM_STRUCTURE 0..1; invariant Events_valid: (events /= Void and then not events.is_empty) or summary /= Void)"
  - "CNF platform_test_schedule master16 §HISTORY Test Cases (the official data sets: no/one/three events — count 6 is beyond every official cell)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality on HISTORY.events, varied per row
  # (any=0..*, 1plus=1..*, 3plus=3..*, opt=0..1, mand=1..1, 3to5=3..5).
  template: cnf.tpl.ecc_history_events_cardinality
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data"
  constraint_columns: ["cardinality"]
decision_table:
  columns: [cardinality, summary_committed, events_count, expected, violates]
  rows:
    - ["any", "absent", 6, accepted, []]
    - ["1plus", "absent", 6, accepted, []]
    - ["3plus", "absent", 6, accepted, []]
    - ["opt", "absent", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count above the interval upper bound (1)"]]
    - ["mand", "absent", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count above the interval upper bound (1)"]]
    - ["3to5", "absent", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count above the interval upper bound (5)"]]
