id: CONT-DV_PROPORTION-validate_open
kind: content
component: CONTENT
rm_class: DV_PROPORTION
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_PROPORTION against an open constraint is accepted iff its
  intrinsic type/numerator/denominator/precision invariants hold. The
  meaning (kind) label column is dropped (redundant with type).
description: "DV_PROPORTION intrinsic invariants (type, numerator, denominator, precision)"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_PROPORTION-validate_open"
  - "AM AOM1.4 §C_COMPLEX_OBJECT"
  - "RM data_types §DV_PROPORTION"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.proportion_open    # DV_PROPORTION matches {*} (internal invariants only)
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [type, numerator, denominator, precision, expected, violates]
  rows:
    - [0, 10, 500, 0, accepted, []]
    - [0, 10, 0, 0, rejected, ["rm_invariant(valid_denominator): denominator must be non-zero"]]
    - [1, 10, 1, 0, accepted, []]
    - [1, 10, 0, 0, rejected, ["rm_invariant(valid_denominator): denominator must be non-zero"]]
    - [1, 10, 500, 0, rejected, ["rm_invariant(unitary_validity): unitary denominator must be 1"]]
    - [2, 10, 0, 0, rejected, ["rm_invariant(valid_denominator): denominator must be non-zero"]]
    - [2, 10, 100, 0, accepted, []]
    - [2, 10, 500, 0, rejected, ["rm_invariant(percent_validity): percent denominator must be 100"]]
    - [3, 10, 0, 0, rejected, ["rm_invariant(valid_denominator): denominator must be non-zero"]]
    - [3, 10, 100, 0, accepted, []]
    - [3, 10, 500, 1, rejected, ["rm_invariant(fraction_validity): fraction precision must be 0"]]
    - [3, 10.5, 500, 1, rejected, ["rm_invariant(is_integral_validity): fraction numerator must be integral"]]
    - [3, 10, 500.5, 1, rejected, ["rm_invariant(is_integral_validity): fraction denominator must be integral"]]
    - [4, 10, 0, 0, rejected, ["rm_invariant(valid_denominator): denominator must be non-zero"]]
    - [4, 10, 100, 0, accepted, []]
    - [4, 10, 500, 1, rejected, ["rm_invariant(fraction_validity): fraction precision must be 0"]]
    - [4, 10.5, 500, 1, rejected, ["rm_invariant(is_integral_validity): fraction numerator must be integral"]]
    - [4, 10, 500.5, 1, rejected, ["rm_invariant(is_integral_validity): fraction denominator must be integral"]]
    - [666, 10, 500, 0, rejected, ["rm_invariant(type_validity): type must be in 0..4"]]
