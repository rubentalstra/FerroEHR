id: CONT-DV_IDENTIFIER-validate_all_pattern
kind: content
component: CONTENT
rm_class: DV_IDENTIFIER
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "Each DV_IDENTIFIER string attribute (issuer, assigner, id, type) is checked against its C_STRING.pattern; id is additionally mandatory in the RM. Errors accumulate across attributes."
description: "DV_IDENTIFIER attributes against a C_STRING.pattern constraint (XYZ.*)"
spec_refs:
  - "CNF platform_test_schedule master17.1 \u00a7CONT-DV_IDENTIFIER-validate_all_pattern"
  - "RM data_types \u00a7DV_IDENTIFIER"
  - "AM AOM1.4 \u00a7C_STRING"
constraint_context:
  template: cnf.tpl.dv_identifier_c_string
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["attribute", "C_STRING.pattern", "C_STRING.list"]
decision_table:
  columns: ["attribute", "value", "C_STRING.pattern", "C_STRING.list", "expected", "violates"]
  rows:
    - ["issuer", null, "XYZ.*", null, "rejected", ["constraint(C_STRING.pattern): value does not match the C_STRING.pattern constraint"]]
    - ["issuer", "ABC", "XYZ.*", null, "rejected", ["constraint(C_STRING.pattern): value does not match the C_STRING.pattern constraint"]]
    - ["issuer", "XYZ", "XYZ.*", null, "accepted", []]
    - ["assigner", null, "XYZ.*", null, "rejected", ["constraint(C_STRING.pattern): value does not match the C_STRING.pattern constraint"]]
    - ["assigner", "ABC", "XYZ.*", null, "rejected", ["constraint(C_STRING.pattern): value does not match the C_STRING.pattern constraint"]]
    - ["assigner", "XYZ", "XYZ.*", null, "accepted", []]
    - ["id", null, "XYZ.*", null, "rejected", ["rm_schema: id is mandatory in the RM"]]
    - ["id", "ABC", "XYZ.*", null, "rejected", ["constraint(C_STRING.pattern): value does not match the C_STRING.pattern constraint"]]
    - ["id", "XYZ", "XYZ.*", null, "accepted", []]
    - ["type", null, "XYZ.*", null, "rejected", ["constraint(C_STRING.pattern): value does not match the C_STRING.pattern constraint"]]
    - ["type", "ABC", "XYZ.*", null, "rejected", ["constraint(C_STRING.pattern): value does not match the C_STRING.pattern constraint"]]
    - ["type", "XYZ", "XYZ.*", null, "accepted", []]
