id: CONT-DV_INTERVAL_DV_PROPORTION-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_PROPORTION> against an open constraint ({*}) is
  accepted iff its interval invariants hold: both limits share the same
  proportion kind and lower does not exceed upper. Each schedule data set is one
  row (lower/upper proportion columns); the meaning (kind) label is dropped.
description: "DV_INTERVAL<DV_PROPORTION> open ({*}): Limits_consistent invariant"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_PROPORTION-validate_open"
  - "AM AOM1.4 §C_COMPLEX_OBJECT"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
guards:
  - "modeling tool supports representing DV_INTERVAL<DV_PROPORTION> — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_proportion_open    # DV_INTERVAL<DV_PROPORTION> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower_type, lower_numerator, lower_denominator, lower_precision, upper_type, upper_numerator, upper_denominator, upper_precision, expected, violates]
  rows:
    - [0, 10, 500, 0, 0, 20, 500, 0, accepted, []]
    - [0, 10, 1, 0, 0, 10, 500, 0, rejected, ["rm_invariant(limits_consistent): interval limits must share the same proportion kind and be ordered"]]
    - [0, 10, 500, 0, 0, 5, 500, 0, rejected, ["rm_invariant(limits_consistent): lower must not exceed upper"]]
