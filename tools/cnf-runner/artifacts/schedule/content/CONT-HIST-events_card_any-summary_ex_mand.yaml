# OFFICIAL master16 test case (authored 2026-07-24, combined synth families).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality /
# C_ATTRIBUTE.existence and the RM HISTORY class. With the summary present,
# the RM invariant Events_valid ((events /= Void and then not events.is_empty)
# or summary /= Void) holds via its second disjunct, so the zero-events row is
# accepted — the 0..* cardinality admits 0 — matching the official cell.
# Realization (HISTORY x cardinality+summary-existence combined synth family):
# ONE template constrains both axes — events cardinality 0..* and summary
# existence archetype-tightened to 1..1 (ITEM_TREE at0007); the
# summary_committed and events_count data axes drive the committed instance.
id: CONT-HIST-events_card_any-summary_ex_mand
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  HISTORY events cardinality 0..*, summary existence 1..1: an absent summary
  always rejects (archetype-mandated); with a summary present, zero, one or
  three events are all accepted (the unconstrained cardinality admits every
  count and Events_valid holds via the summary).
description: "HISTORY.events count under an unconstrained (0..*) cardinality with an archetype-mandated summary"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-HIST-events_card_any-summary_ex_mand"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM data_structures §HISTORY (events: List<EVENT>, existence 0..1; summary: ITEM_STRUCTURE 0..1; invariant Events_valid: (events /= Void and then not events.is_empty) or summary /= Void)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality 0..* on HISTORY.events AND
  # C_ATTRIBUTE.existence 1..1 on HISTORY.summary in one template.
  template: cnf.tpl.ecc_history_events_cardinality
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data"
  constraint_columns: ["cardinality", "summary_existence"]
decision_table:
  columns: [cardinality, summary_existence, summary_committed, events_count, expected, violates]
  rows:
    - ["any", "mandatory", "absent", 0, rejected, ["constraint(C_ATTRIBUTE.existence): summary is mandated by the archetype (existence 1..1) but absent", "rm_invariant(Events_valid): no events and no summary"]]
    - ["any", "mandatory", "absent", 1, rejected, ["constraint(C_ATTRIBUTE.existence): summary is mandated by the archetype (existence 1..1) but absent"]]
    - ["any", "mandatory", "absent", 3, rejected, ["constraint(C_ATTRIBUTE.existence): summary is mandated by the archetype (existence 1..1) but absent"]]
    - ["any", "mandatory", "present", 0, accepted, []]
    - ["any", "mandatory", "present", 1, accepted, []]
    - ["any", "mandatory", "present", 3, accepted, []]
