id: CONT-DV_DURATION-validate_range
kind: content
component: CONTENT
rm_class: DV_DURATION
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DURATION is accepted iff its magnitude() falls within the C_DURATION range [lower..upper]."
description: "DV_DURATION against a C_DURATION range constraint"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DURATION-validate_range"
  - "RM data_types \u00a7DV_DURATION"
  - "AM AOM1.4 \u00a7C_DURATION"
applies: { rm: ">=1.0.2" }
guards:
  - "C_DURATION.magnitude() comparison uses Average_days_in_year / Average_days_in_month approximations; a SUT computing magnitude() differently must state it in its Conformance Statement \u2014 CNF platform_test_schedule master17.4 \u00a7DV_DURATION"
constraint_context:
  template: cnf.tpl.dv_duration_c_duration
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["range.lower", "range.upper"]
decision_table:
  columns: ["value", "range.lower", "range.upper", "expected", "violates"]
  rows:
    - ["P1Y", "P0Y", "P50Y", "accepted", []]
    - ["P1Y", "P1Y", "P50Y", "accepted", []]
    - ["P1Y", "P2Y", "P50Y", "rejected", ["constraint(C_DURATION.range.lower): value is below the range lower bound"]]
    - ["P1M", "P0M", "P50M", "accepted", []]
    - ["P1M", "P1M", "P50M", "accepted", []]
    - ["P1M", "P2M", "P50M", "rejected", ["constraint(C_DURATION.range.lower): value is below the range lower bound"]]
    - ["P1D", "P0D", "P50D", "accepted", []]
    - ["P1D", "P1D", "P50D", "accepted", []]
    - ["P1D", "P2D", "P50D", "rejected", ["constraint(C_DURATION.range.lower): value is below the range lower bound"]]
    - ["P1Y2M", "P0Y", "P50Y", "accepted", []]
    - ["P1Y2M", "P1Y", "P50Y", "accepted", []]
    - ["P1Y2M", "P2Y", "P50Y", "rejected", ["constraint(C_DURATION.range.lower): value is below the range lower bound"]]
    - ["P1Y20M", "P0Y", "P50Y", "accepted", []]
    - ["P1Y20M", "P1Y", "P50Y", "accepted", []]
    - ["P1Y20M", "P2Y", "P50Y", "accepted", []]
    - ["P2W", "P0W", "P3W", "accepted", []]
    - ["P2W", "P2W", "P3W", "accepted", []]
    - ["P2W", "P3W", "P3W", "rejected", ["constraint(C_DURATION.range.lower): value is below the range lower bound"]]
    - ["P2W3D", "P3W", "P4W", "rejected", ["constraint(C_DURATION.range.lower): value is below the range lower bound"]]
    - ["P2W8D", "P3W", "P4W", "accepted", []]
    - ["P2W15D", "P3W", "P4W", "rejected", ["constraint(C_DURATION.range.upper): value is above the range upper bound"]]
