id: CONT-DV_DURATION-validate_fields_range
kind: content
component: CONTENT
rm_class: DV_DURATION
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DURATION is accepted iff it satisfies both the C_DURATION allowed-field flags and the range; violations accumulate. Verbatim from the schedule, including its C_DURATION.lower clause-name typos \u2014 see REQUIREMENTS-rest.md."
description: "DV_DURATION against combined C_DURATION allowed-fields + range constraints"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DURATION-validate_fields_range"
  - "RM data_types \u00a7DV_DURATION"
  - "AM AOM1.4 \u00a7C_DURATION"
applies: { rm: ">=1.0.2" }
guards:
  - "C_DURATION.magnitude() comparison uses Average_days_in_year / Average_days_in_month approximations; a SUT computing magnitude() differently must state it in its Conformance Statement \u2014 CNF platform_test_schedule master17.4 \u00a7DV_DURATION"
constraint_context:
  template: cnf.tpl.dv_duration_c_duration
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
decision_table:
  columns: ["value", "years_allowed", "months_allowed", "weeks_allowed", "days_allowed", "hours_allowed", "minutes_allowed", "seconds_allowed", "fractional_seconds_allowed", "range.lower", "range.upper", "expected", "violates"]
  rows:
    - ["P1Y", true, true, true, true, true, true, true, true, "P0Y", "P50Y", "accepted", []]
    - ["P1Y", true, true, true, true, true, true, true, true, "P2Y", "P50Y", "rejected", ["constraint(C_DURATION.range.lower): value is below the range lower bound"]]
    - ["P1Y", false, true, true, true, true, true, true, true, "P0Y", "P50Y", "rejected", ["constraint(C_DURATION.years_allowed): the years field is present but not allowed by C_DURATION"]]
    - ["P1Y", false, true, true, true, true, true, true, true, "P2Y", "P50Y", "rejected", ["constraint(C_DURATION.years_allowed): the years field is present but not allowed by C_DURATION", "constraint(C_DURATION.range.lower): value is below the range lower bound"]]
    - ["P1Y3M", true, true, true, true, true, true, true, true, "P1Y", "P50Y", "accepted", []]
    - ["P1Y3M", true, false, true, true, true, true, true, true, "P1Y", "P50Y", "rejected", ["constraint(C_DURATION.months_allowed): the months field is present but not allowed by C_DURATION"]]
    - ["P1Y3M", true, true, true, true, true, true, true, true, "P3Y", "P50Y", "rejected", ["constraint(C_DURATION.lower): value is below the range lower bound"]]
    - ["P1Y3M", true, false, true, true, true, true, true, true, "P3Y", "P50Y", "rejected", ["constraint(C_DURATION.months_allowed): the months field is present but not allowed by C_DURATION", "constraint(C_DURATION.lower): value is below the range lower bound"]]
    - ["PT2M43.5S", true, true, true, true, true, true, true, false, "PT1M", "PT60M", "rejected", ["constraint(C_DURATION.fractional_seconds_allowed): the fractional_seconds field is present but not allowed by C_DURATION"]]
