# Re-adjudicated 2026-07-22 (issue #228): the previously-rejected rows rested on
# invariants the openEHR RM does NOT define. BASE foundation_types §Interval
# defines exactly Lower_included_valid, Upper_included_valid, Limits_consistent
# ((not upper_unbounded and not lower_unbounded) implies lower <= upper) and
# Limits_comparable — and RM DV_INTERVAL carries its own guarded
# Limits_consistent (re-grounded 2026-08-21, AMB-43): the invariants are
# UNDERIVABLE on Void limits (the released text states no Void-call
# semantics), and strictly_comparable for partial dates of differing
# precision is an acknowledged open discussion. A conformant SUT
# therefore accepts all of these; expectations corrected rejected -> accepted.
id: CONT-DV_INTERVAL_DV_DATE-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DATE> against an open constraint ({*}) is accepted
  whenever the BASE Interval invariants that the RM actually defines hold
  (Lower/Upper_included_valid, Limits_consistent). The RM defines no
  value-present-when-bounded invariant (AMB-43). The mixed-precision bound
  pair lives in the report_only sibling case (AMB-29).
description: "DV_INTERVAL<DV_DATE> open ({*}): the RM-defined interval invariants"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DATE-validate_open"
  - "AM AOM1.4 §C_COMPLEX_OBJECT"
  - "BASE foundation_types §Interval (Lower_included_valid / Upper_included_valid / Limits_consistent / Limits_comparable — the complete invariant set; no bound-value-required invariant)"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.interval_date_open    # DV_INTERVAL<DV_DATE> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, false, false, true, true, accepted, []]
    - [null, "2022", false, false, true, true, accepted, []]
    - ["2021", null, false, false, true, true, accepted, []]
    - ["2021", "2022", false, false, true, true, accepted, []]
    - ["2021-01", "2022-08", false, false, true, true, accepted, []]
    - ["2021-01-20", "2022-08-11", false, false, true, true, accepted, []]
    - [null, null, true, true, false, false, accepted, []]
ambiguities: [AMB-43]
