# CATALOGUE ADDITION beyond the official master15 cells (rebuilt 2026-07-24,
# catalogue audit D1): the official CONT-COMP-content_card_*-context_any data
# sets stop at three entries, so a count above every tested bound — in
# particular the 3..5 UPPER bound, which no official cell ever crosses — is
# untested upstream. These count-6 rows are derivable extensions: each verdict
# follows directly from AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality interval
# membership (6 within 0..*/1..*/3..*; 6 above the 0..1/1..1 upper bound 1 and
# the 3..5 upper bound 5). Carried over from the retired ad-hoc
# CONT-COMPOSITION-content_cardinality case (its official-cell rows moved to
# the CONT-COMP-content_card_*-context_any files).
# Realization (COMPOSITION x cardinality synth family): instance context is
# always an EVENT_CONTEXT without other_context; context is unconstrained.
id: CONT-COMPOSITION-content_cardinality_count6
kind: content
component: CONTENT
rm_class: COMPOSITION
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  Catalogue addition beyond the official master15 cells: a committed
  COMPOSITION with six content items is accepted under the unbounded
  cardinalities (0..*, 1..*, 3..*) and rejected above the bounded upper limits
  (0..1, 1..1, 3..5) — the 3..5 upper bound is exercised nowhere in the
  official tables.
description: "COMPOSITION.content count 6 against every official cardinality interval (upper-bound extension)"
spec_refs:
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "RM ehr §COMPOSITION (content: List<CONTENT_ITEM>, existence 0..1; invariants Category_validity, Territory_valid, Language_valid, Content_valid, Is_archetype_root)"
  - "CNF platform_test_schedule master15 §COMPOSITION Test Cases (the official data sets: no/one/three entries — count 6 is beyond every official cell)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_MULTIPLE_ATTRIBUTE.cardinality on COMPOSITION.content, varied per row
  # (any=0..*, 1plus=1..*, 3plus=3..*, opt=0..1, mand=1..1, 3to5=3..5).
  template: cnf.tpl.ecc_composition_content_cardinality
  path: "/content"
  constraint_columns: ["cardinality"]
decision_table:
  columns: [cardinality, content_count, expected, violates]
  rows:
    - ["any", 6, accepted, []]
    - ["1plus", 6, accepted, []]
    - ["3plus", 6, accepted, []]
    - ["opt", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
    - ["mand", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (1)"]]
    - ["3to5", 6, rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): content count above the interval upper bound (5)"]]
