# Re-adjudicated 2026-07-21 from the retired ECC structural battery
# (ECC-VAL-017..028 summary-existence axis) against AOM1.4 + RM spec text.
# The summary axis is isolated by committing one event throughout (so RM
# HISTORY.Events_valid is satisfied by the event, never by the summary); the
# events cardinality axis is carried by ecc-CONT-HISTORY-events_cardinality.
# `ecc-` id namespace pending upstream adoption.
id: CONT-HISTORY-summary_existence
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With one event committed (RM HISTORY.Events_valid already satisfied), a
  committed HISTORY is accepted when the archetype leaves HISTORY.summary at its
  RM existence (0..1) and rejected when the archetype tightens
  C_ATTRIBUTE.existence to 1..1 and no summary is committed.
description: "HISTORY.summary presence against the archetype C_ATTRIBUTE.existence constraint (one event committed)"
spec_refs:
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM data_structures §HISTORY (summary: ITEM_STRUCTURE, existence 0..1; Events_valid: (events not empty) or summary present)"
  - "CNF platform_test_schedule master16 (content ENTRY chapter — no test-case headings; re-adjudicated to AOM/RM)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_ATTRIBUTE.existence on HISTORY.summary, varied per row
  # (optional=0..1 = RM default; mandatory=1..1 = archetype-tightened).
  template: cnf.tpl.ecc_history_summary_existence
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data"
decision_table:
  # summary_existence: the archetype C_ATTRIBUTE.existence constraint token.
  # events_count: fixed 1 (Events_valid satisfied by the event, isolating summary).
  # summary_committed: whether a HISTORY.summary object is committed.
  columns: [summary_existence, events_count, summary_committed, expected, violates]
  rows:
    - ["optional", 1, "absent", accepted, []]
    - ["optional", 1, "present", accepted, []]
    - ["mandatory", 1, "absent", rejected, ["constraint(C_ATTRIBUTE.existence): summary is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", 1, "present", accepted, []]
