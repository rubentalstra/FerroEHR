# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D5).
# Verdicts recomputed against AOM1.4 C_ATTRIBUTE.existence and the RM EVENT
# class (data: T, existence 1..1; state: ITEM_STRUCTURE, existence 0..1).
id: CONT-EVENT-state_ex_mand
kind: content
component: CONTENT
rm_class: EVENT
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  EVENT state existence 1..1: a committed EVENT is rejected when its
  RM-mandatory data is absent or when the archetype-mandated state is absent;
  it is accepted only with both present.
description: "EVENT data (RM mandatory) with state archetype-mandated"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-EVENT-state_ex_mand"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM data_structures §EVENT (data: T, existence 1..1; state: ITEM_STRUCTURE, existence 0..1)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_ATTRIBUTE.existence on EVENT.state tightened to 1..1.
  template: cnf.tpl.ecc_event_state_existence
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events"
  constraint_columns: ["state_existence"]
decision_table:
  columns: [state_existence, data_committed, state_committed, expected, violates]
  rows:
    - ["mandatory", "absent", "absent", rejected, ["rm_schema: EVENT.data is mandatory (existence 1..1)", "constraint(C_ATTRIBUTE.existence): state is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", "absent", "present", rejected, ["rm_schema: EVENT.data is mandatory (existence 1..1)"]]
    - ["mandatory", "present", "absent", rejected, ["constraint(C_ATTRIBUTE.existence): state is mandated by the archetype (existence 1..1) but absent"]]
    - ["mandatory", "present", "present", accepted, []]
