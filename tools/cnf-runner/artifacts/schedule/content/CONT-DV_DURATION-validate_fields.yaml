id: CONT-DV_DURATION-validate_fields
kind: content
component: CONTENT
rm_class: DV_DURATION
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DURATION is accepted iff every component it carries is permitted by the C_DURATION allowed-field flags."
description: "DV_DURATION against C_DURATION allowed-field constraints"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DURATION-validate_fields"
  - "RM data_types \u00a7DV_DURATION"
  - "AM AOM1.4 \u00a7C_DURATION"
applies: { rm: ">=1.0.2" }
guards:
  - "fractional_seconds_allowed is under-specified: ISO 8601 permits a fraction on the lowest-order component and some parsers reject fractions outside seconds \u2014 CNF platform_test_schedule master17.4 \u00a7CONT-DV_DURATION-validate_fields"
constraint_context:
  template: cnf.tpl.dv_duration_c_duration
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["years_allowed", "months_allowed", "weeks_allowed", "days_allowed", "hours_allowed", "minutes_allowed", "seconds_allowed", "fractional_seconds_allowed"]
decision_table:
  columns: ["value", "years_allowed", "months_allowed", "weeks_allowed", "days_allowed", "hours_allowed", "minutes_allowed", "seconds_allowed", "fractional_seconds_allowed", "expected", "violates"]
  rows:
    - ["P1Y", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P1Y", false, true, true, true, true, true, true, true, "rejected", ["constraint(C_DURATION.years_allowed): the years field is present but not allowed by C_DURATION"]]
    - ["P1Y3M", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P1Y3M", true, false, true, true, true, true, true, true, "rejected", ["constraint(C_DURATION.months_allowed): the months field is present but not allowed by C_DURATION"]]
    - ["P1Y3M15D", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P1Y3M15D", true, true, true, false, true, true, true, true, "rejected", ["constraint(C_DURATION.days_allowed): the days field is present but not allowed by C_DURATION"]]
    - ["P1W", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P7W", true, true, false, true, true, true, true, true, "rejected", ["constraint(C_DURATION.weeks_allowed): the weeks field is present but not allowed by C_DURATION"]]
    - ["P1Y3M15DT23H", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P1Y3M15DT23H", true, true, true, true, false, true, true, true, "rejected", ["constraint(C_DURATION.hours_allowed): the hours field is present but not allowed by C_DURATION"]]
    - ["P1Y3M15DT23H35M", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P1Y3M15DT23H35M", true, true, true, true, true, false, true, true, "rejected", ["constraint(C_DURATION.minutes_allowed): the minutes field is present but not allowed by C_DURATION"]]
    - ["P1Y3M15DT23H35M22S", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P1Y3M15DT23H35M22S", true, true, true, true, true, true, false, true, "rejected", ["constraint(C_DURATION.seconds_allowed): the seconds field is present but not allowed by C_DURATION"]]
    - ["P1Y3M15DT23H35M22.5S", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P1Y3M15DT23H35M22.5S", true, true, true, true, true, true, true, false, "rejected", ["constraint(C_DURATION.fractional_seconds_allowed): the fractional_seconds field is present but not allowed by C_DURATION"]]
    - ["P1W3D", true, true, true, true, true, true, true, true, "accepted", []]
    - ["P1W3D", true, true, false, true, true, true, true, true, "rejected", ["constraint(C_DURATION.weeks_allowed): the weeks field is present but not allowed by C_DURATION"]]
