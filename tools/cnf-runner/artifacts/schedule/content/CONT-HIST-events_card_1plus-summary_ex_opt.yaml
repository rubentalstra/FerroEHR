# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D7).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality /
# C_ATTRIBUTE.existence and the RM HISTORY class.
# Realization (HISTORY x summary-existence synth family): this family's
# synthesized template fixes the events cardinality at exactly this case's
# 1..* AND drives both the events count and the summary presence per row, so
# the FULL official table (both summary blocks) is realizable — the archetype
# leaves summary at the RM existence 0..1 (this case's summary_ex_opt).
id: CONT-HIST-events_card_1plus-summary_ex_opt
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  HISTORY events cardinality 1..*, summary existence 0..1: zero events reject
  on the cardinality lower bound (with summary absent additionally on the RM
  Events_valid invariant); one or three events are accepted with summary absent
  or present alike.
description: "HISTORY.events count against a 1..* cardinality, summary optional"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-HIST-events_card_1plus-summary_ex_opt"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
  - "AM AOM1.4 §C_ATTRIBUTE (existence) — whether the attribute field must be present"
  - "RM data_structures §HISTORY (events: List<EVENT>, existence 0..1; summary: ITEM_STRUCTURE 0..1; invariant Events_valid: (events /= Void and then not events.is_empty) or summary /= Void)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # events cardinality 1..* (fixed by the synth family = this case's token);
  # C_ATTRIBUTE.existence on HISTORY.summary at the RM default 0..1.
  template: cnf.tpl.ecc_history_summary_existence
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data"
  constraint_columns: ["summary_existence"]
decision_table:
  columns: [summary_existence, events_count, summary_committed, expected, violates]
  rows:
    - ["optional", 0, "absent", rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (1)", "rm_invariant(Events_valid): no events and no summary"]]
    - ["optional", 1, "absent", accepted, []]
    - ["optional", 3, "absent", accepted, []]
    - ["optional", 0, "present", rejected, ["constraint(C_MULTIPLE_ATTRIBUTE.cardinality): events count below the interval lower bound (1)"]]
    - ["optional", 1, "present", accepted, []]
    - ["optional", 3, "present", accepted, []]
