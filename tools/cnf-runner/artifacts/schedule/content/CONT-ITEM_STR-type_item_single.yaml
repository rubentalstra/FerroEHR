# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D4).
# Verdicts recomputed against AOM1.4 C_OBJECT.rm_type_name and the RM
# ITEM_STRUCTURE hierarchy (the committed ITEM_SINGLE carries its RM-mandatory
# item, so the sibling rejections are purely the type constraint).
id: CONT-ITEM_STR-type_item_single
kind: content
component: CONTENT
rm_class: ITEM_STRUCTURE
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  ITEM_STRUCTURE is ITEM_SINGLE: an archetype slot narrowed to ITEM_SINGLE
  accepts an ITEM_SINGLE and rejects the ITEM_TREE / ITEM_LIST / ITEM_TABLE
  siblings (class not allowed).
description: "EVALUATION.data object type against an ITEM_SINGLE-narrowed archetype slot"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-ITEM_STR-type_item_single"
  - "AM AOM1.4 §C_OBJECT (rm_type_name) — the reference-model type a node constrains"
  - "RM data_structures §ITEM_STRUCTURE / §ITEM_TREE / §ITEM_LIST / §ITEM_TABLE / §ITEM_SINGLE (abstract ITEM_STRUCTURE + four subtypes)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_OBJECT.rm_type_name = ITEM_SINGLE on the EVALUATION.data slot.
  template: cnf.tpl.ecc_item_structure_type_narrowing
  path: "/content[openEHR-EHR-EVALUATION.minimal.v1]/data"
  constraint_columns: ["slot_type"]
decision_table:
  columns: [slot_type, committed_type, expected, violates]
  rows:
    - ["ITEM_SINGLE", "ITEM_TREE", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_TREE is not an allowed type for an ITEM_SINGLE-narrowed slot"]]
    - ["ITEM_SINGLE", "ITEM_LIST", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_LIST is not an allowed type for an ITEM_SINGLE-narrowed slot"]]
    - ["ITEM_SINGLE", "ITEM_TABLE", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_TABLE is not an allowed type for an ITEM_SINGLE-narrowed slot"]]
    - ["ITEM_SINGLE", "ITEM_SINGLE", accepted, []]
