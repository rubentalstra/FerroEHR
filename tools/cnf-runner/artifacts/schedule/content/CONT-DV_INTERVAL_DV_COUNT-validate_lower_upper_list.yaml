id: CONT-DV_INTERVAL_DV_COUNT-validate_lower_upper_list
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With C_INTEGER.list = [0,5,10,100] on both limits, a committed
  DV_INTERVAL<DV_COUNT> is accepted iff each present limit is one of the list
  values.
description: "DV_INTERVAL<DV_COUNT>: C_INTEGER.list = [0,5,10,100] on lower and upper"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_COUNT-validate_lower_upper_list"
  - "AM AOM1.4 §C_INTEGER"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
guards:
  - "modeling tool supports C_INTEGER list constraints on DV_INTERVAL lower/upper attributes — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_count_list    # C_INTEGER.list = [0,5,10,100] on both limits
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, true, true, false, false, accepted, []]
    - [0, null, false, true, true, false, accepted, []]
    - [null, 100, true, false, false, true, accepted, []]
    - [0, 100, false, false, true, true, accepted, []]
    - [-10, 100, false, false, true, true, rejected, ["constraint(C_INTEGER.list): lower not in list"]]
    - [0, 200, false, false, true, true, rejected, ["constraint(C_INTEGER.list): upper not in list"]]
    - [-10, 200, false, false, true, true, rejected, ["constraint(C_INTEGER.list): lower not in list", "constraint(C_INTEGER.list): upper not in list"]]
