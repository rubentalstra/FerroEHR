# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D7).
# Verdicts recomputed against AOM1.4 C_MULTIPLE_ATTRIBUTE.cardinality and the
# RM HISTORY class. Row 1 diverges from the official cell BY REGISTER ENTRY
# AMB-51: the official table verdicts "no events | absent | accepted" (zero is
# within the 0..1 cardinality), but the RM invariant Events_valid forces
# rejection of a HISTORY with zero events and no summary — the row follows the
# RM-derivable verdict.
# Realization (HISTORY x cardinality synth family): summary is never committed
# by this family, so the rows realize the official summary-absent block; the
# archetype leaves summary unconstrained (= RM existence 0..1).
# TODO: encode the official summary-present rows once the content synth
#       vocabulary drives the summary data axis alongside the events
#       cardinality constraint.
id: CONT-HIST-events_card_opt-summary_ex_opt
kind: content
component: CONTENT
rm_class: HISTORY
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  HISTORY events cardinality 0..1, summary existence 0..1: with summary absent,
  one event is accepted; three events reject on the cardinality upper bound;
  zero events reject on the RM Events_valid invariant (the official cell's
  `accepted` is the registered AMB-51 defect).
description: "HISTORY.events count against a 0..1 cardinality, summary optional and absent"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-HIST-events_card_opt-summary_ex_opt"
  - "AM AOM1.4 §C_MULTIPLE_ATTRIBUTE (cardinality) — container membership bounds"
