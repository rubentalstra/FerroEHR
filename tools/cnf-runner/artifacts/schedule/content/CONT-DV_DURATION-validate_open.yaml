id: CONT-DV_DURATION-validate_open
kind: content
component: CONTENT
rm_class: DV_DURATION
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DURATION is accepted iff its value is a valid openEHR ISO 8601 duration (the openEHR exceptions \u2014 leading '-', mixed 'W' \u2014 are valid; fractions are only allowed on seconds)."
description: "DV_DURATION value against the openEHR ISO 8601 duration grammar"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DURATION-validate_open"
  - "RM data_types \u00a7DV_DURATION"
  - "AM AOM1.4 \u00a7C_DURATION"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.dv_duration_c_duration
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
decision_table:
  columns: ["value", "expected", "violates"]
  rows:
    - [null, "rejected", ["rm_schema: value is mandatory"]]
    - ["1Y", "rejected", ["iso8601(designator_required): duration must begin with the 'P' designator"]]
    - ["P1Y", "accepted", []]
    - ["P1Y3M", "accepted", []]
    - ["P1W", "accepted", []]
    - ["P1Y3M4D", "accepted", []]
    - ["P1Y3M4DT2H", "accepted", []]
    - ["P1Y3M4DT2H14M", "accepted", []]
    - ["P1Y3M4DT2H14M5S", "accepted", []]
    - ["P1Y3M4DT2H14M15.5S", "accepted", []]
    - ["P1Y3M4DT2H14.5M", "rejected", ["iso8601(no_fractional_minutes): fractions for minutes are not allowed in openEHR"]]
    - ["P1Y3M4DT2.5H", "rejected", ["iso8601(no_fractional_hours): fractions for hours are not allowed in openEHR"]]
    - ["P3M1W", "accepted", []]
    - ["-P2M", "accepted", []]
