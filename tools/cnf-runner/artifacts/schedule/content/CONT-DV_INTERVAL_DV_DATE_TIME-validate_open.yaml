id: CONT-DV_INTERVAL_DV_DATE_TIME-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DATE_TIME> against an open constraint ({*}) is
  accepted iff each present limit carries a value and each date-time value is a
  valid ISO 8601 expression. All rows use bounded, both-limits-included
  intervals.
description: "DV_INTERVAL<DV_DATE_TIME> open ({*}): value mandatory + ISO 8601 component validity"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DATE_TIME-validate_open"
  - "AM AOM1.4 §C_COMPLEX_OBJECT"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.interval_date_time_open    # DV_INTERVAL<DV_DATE_TIME> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, false, false, true, true, rejected, ["rm_schema: value is mandatory for lower and upper"]]
    - [null, "", false, false, true, true, rejected, ["rm_schema: value is mandatory for lower", "iso8601(year_required): at least year is required for upper"]]
    - ["", null, false, false, true, true, rejected, ["iso8601(year_required): at least year is required for lower", "rm_schema: value is mandatory for upper"]]
    - ["2021", null, false, false, true, true, rejected, ["rm_schema: value is mandatory for upper"]]
    - [null, "2022", false, false, true, true, rejected, ["rm_schema: value is mandatory for lower"]]
    - ["2021", "2022", false, false, true, true, accepted, []]
    - ["2021-00", "2022-01", false, false, true, true, rejected, ["iso8601(month_range): month in 01..12 for lower"]]
    - ["2021-01", "2022-01", false, false, true, true, accepted, []]
    - ["2021-01-00", "2022-01-01", false, false, true, true, rejected, ["iso8601(day_range): day in 01..31 for lower"]]
    - ["2021-01-32", "2022-01-01", false, false, true, true, rejected, ["iso8601(day_range): day in 01..31 for lower"]]
    - ["2021-01-01", "2022-01-00", false, false, true, true, rejected, ["iso8601(day_range): day in 01..31 for upper"]]
    - ["2021-01-30", "2022-01-00", false, false, true, true, rejected, ["iso8601(day_range): day in 01..31 for upper"]]
    - ["2021-01-30", "2022-01-15", false, false, true, true, accepted, []]
    - ["2021-10-24T48", "2022-01-15T10", false, false, true, true, rejected, ["iso8601(hour_range): hours in 00..23 for lower"]]
    - ["2021-10-24T21", "2022-01-15T73", false, false, true, true, rejected, ["iso8601(hour_range): hours in 00..23 for upper"]]
    - ["2021-10-24T05", "2022-01-15T10", false, false, true, true, accepted, []]
    - ["2021-10-24T05:95", "2022-01-15T10:45", false, false, true, true, rejected, ["iso8601(minute_range): minutes in 00..59 for lower"]]
    - ["2021-10-24T05:30", "2022-01-15T10:61", false, false, true, true, rejected, ["iso8601(minute_range): minutes in 00..59 for upper"]]
    - ["2021-10-24T05:30", "2022-01-15T10:45", false, false, true, true, accepted, []]
    - ["2021-10-24T05:30:78", "2022-01-15T10:45:13", false, false, true, true, rejected, ["iso8601(second_range): seconds in 00..59 for lower"]]
    - ["2021-10-24T05:30:47", "2022-01-15T10:45:69", false, false, true, true, rejected, ["iso8601(second_range): seconds in 00..59 for upper"]]
    - ["2021-10-24T05:30:47", "2022-01-15T10:45:13", false, false, true, true, accepted, []]
    - ["2021-10-24T05:30:47.5", "2022-01-15T10:45:13.6", false, false, true, true, accepted, []]
    - ["2021-10-24T05:30:47.333", "2022-01-15T10:45:13.555", false, false, true, true, accepted, []]
    - ["2021-10-24T05:30:47.333333", "2022-01-15T10:45:13.555555", false, false, true, true, accepted, []]
    - ["2021-10-24T05:30:47Z", "2022-01-15T10:45:13Z", false, false, true, true, accepted, []]
