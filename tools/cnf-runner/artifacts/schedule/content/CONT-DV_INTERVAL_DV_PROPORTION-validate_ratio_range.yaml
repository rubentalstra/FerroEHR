id: CONT-DV_INTERVAL_DV_PROPORTION-validate_ratio_range
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With C_INTEGER.list = [0] (ratio) on the type of each limit and per-limit
  C_REAL.range on numerator and denominator, a committed DV_INTERVAL<DV_PROPORTION>
  is accepted iff both limits are ratios with numerator and denominator in range.
  The per-limit C_REAL ranges vary per data set and are carried as columns.
description: "DV_INTERVAL<DV_PROPORTION>: type=[0] with per-limit C_REAL.range on numerator/denominator"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_PROPORTION-validate_ratio_range"
  - "AM AOM1.4 §C_REAL"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
guards:
  - "modeling tool supports representing DV_INTERVAL<DV_PROPORTION> — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_proportion_ratio_range    # type C_INTEGER.list=[0]; numerator/denominator C_REAL.range per limit (per row)
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [lower_type, lower_numerator, lower_denominator, lower_precision, upper_type, upper_numerator, upper_denominator, upper_precision, lower_num_range, lower_den_range, upper_num_range, upper_den_range, expected, violates]
  rows:
    - [0, 10, 500, 0, 0, 20, 500, 0, "0..15", "100..1000", "0..50", "100..1000", accepted, []]
    - [0, 10, 500, 0, 0, 20, 500, 0, "0..5", "100..1000", "0..50", "100..1000", rejected, ["constraint(C_REAL.range): numerator not in range for lower"]]
    - [0, 10, 500, 0, 0, 20, 500, 0, "0..15", "100..1000", "0..10", "100..1000", rejected, ["constraint(C_REAL.range): numerator not in range for upper"]]
