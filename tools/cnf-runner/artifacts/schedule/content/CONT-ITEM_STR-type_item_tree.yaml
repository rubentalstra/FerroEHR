# OFFICIAL master16 test case (rebuilt 2026-07-24, catalogue audit D4): the
# official narrowed tables reject ALL THREE sibling subtypes (the retired
# ad-hoc case tested only one sibling per narrowed type).
# Verdicts recomputed against AOM1.4 C_OBJECT.rm_type_name and the RM
# ITEM_STRUCTURE hierarchy.
id: CONT-ITEM_STR-type_item_tree
kind: content
component: CONTENT
rm_class: ITEM_STRUCTURE
status: active
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  ITEM_STRUCTURE is ITEM_TREE: an archetype slot narrowed to ITEM_TREE accepts
  an ITEM_TREE and rejects the ITEM_LIST / ITEM_TABLE / ITEM_SINGLE siblings
  (class not allowed).
description: "EVALUATION.data object type against an ITEM_TREE-narrowed archetype slot"
spec_refs:
  - "CNF platform_test_schedule master16 §Test Case CONT-ITEM_STR-type_item_tree"
  - "AM AOM1.4 §C_OBJECT (rm_type_name) — the reference-model type a node constrains"
  - "RM data_structures §ITEM_STRUCTURE / §ITEM_TREE / §ITEM_LIST / §ITEM_TABLE / §ITEM_SINGLE (abstract ITEM_STRUCTURE + four subtypes)"
applies: { rm: ">=1.0.2" }
constraint_context:
  # C_OBJECT.rm_type_name = ITEM_TREE on the EVALUATION.data slot.
  template: cnf.tpl.ecc_item_structure_type_narrowing
  path: "/content[openEHR-EHR-EVALUATION.minimal.v1]/data"
  constraint_columns: ["slot_type"]
decision_table:
  columns: [slot_type, committed_type, expected, violates]
  rows:
    - ["ITEM_TREE", "ITEM_TREE", accepted, []]
    - ["ITEM_TREE", "ITEM_LIST", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_LIST is not an allowed type for an ITEM_TREE-narrowed slot"]]
    - ["ITEM_TREE", "ITEM_TABLE", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_TABLE is not an allowed type for an ITEM_TREE-narrowed slot"]]
    - ["ITEM_TREE", "ITEM_SINGLE", rejected, ["constraint(C_OBJECT.rm_type_name): ITEM_SINGLE is not an allowed type for an ITEM_TREE-narrowed slot"]]
