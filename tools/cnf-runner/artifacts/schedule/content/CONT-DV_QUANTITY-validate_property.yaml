id: CONT-DV_QUANTITY-validate_property
kind: content
component: CONTENT
rm_class: DV_QUANTITY
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_QUANTITY against a C_DV_QUANTITY carrying only a physical
  property (no C_QUANTITY_ITEM list) is accepted iff magnitude and units are
  present and the units are a valid unit of that property (UCUM).
description: "DV_QUANTITY against C_DV_QUANTITY property=openehr::122 (length), no units list"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_QUANTITY-validate_property"
  - "AM AOM1.4 §C_DV_QUANTITY"
  - "RM data_types §DV_QUANTITY"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.quantity_property    # C_DV_QUANTITY: property=openehr::122 (length), no list
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [magnitude, units, expected, violates]
  rows:
    - [null, null, rejected, ["rm_schema: both magnitude and units are mandatory"]]
    - [null, "cm", rejected, ["rm_schema: magnitude is mandatory"]]
    - [1.0, null, rejected, ["rm_schema: units is mandatory"]]
    - [0.0, "mg", rejected, ["constraint(C_DV_QUANTITY.property): mg is not a length unit"]]
    - [0.0, "cm", accepted, []]
    - [1.0, "cm", accepted, []]
    - [5.7, "cm", accepted, []]
    - [10.0, "cm", accepted, []]
