id: CONT-DV_PROPORTION-validate_fraction
kind: content
component: CONTENT
rm_class: DV_PROPORTION
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  With a C_INTEGER.list = [3] on the DV_PROPORTION type, a committed proportion
  is accepted iff its type is 3 (fraction).
description: "DV_PROPORTION type constrained to C_INTEGER.list = [3] (fraction)"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_PROPORTION-validate_fraction"
  - "AM AOM1.4 §C_INTEGER"
  - "RM data_types §DV_PROPORTION"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.proportion_type_fraction    # type C_INTEGER.list = [3]
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [type, numerator, denominator, precision, expected, violates]
  rows:
    - [0, 10, 500, 0, rejected, ["constraint(C_INTEGER.list): type not in allowed list"]]
    - [1, 10, 1, 0, rejected, ["constraint(C_INTEGER.list): type not in allowed list"]]
    - [2, 10, 100, 0, rejected, ["constraint(C_INTEGER.list): type not in allowed list"]]
    - [3, 10, 500, 0, accepted, []]
    - [4, 10, 500, 0, rejected, ["constraint(C_INTEGER.list): type not in allowed list"]]
