# Re-adjudicated 2026-07-22 (issue #228): the previously-rejected rows rested on
# invariants the openEHR RM does NOT define. BASE foundation_types §Interval
# defines only Lower_included_valid / Upper_included_valid / Limits_consistent /
# Limits_comparable — there is no bound-value-required-when-not-unbounded
# invariant, and partial-precision comparability is an acknowledged open
# discussion (the table's own violates text flagged it). A conformant server
# therefore accepts all of these; expectations corrected rejected -> accepted.
id: CONT-DV_INTERVAL_DV_TIME-validate_open
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_TIME> against an open constraint ({*}) is accepted
  iff its own interval invariants hold: a bounded limit must carry a value, and
  the limits must be strictly comparable.
description: "DV_INTERVAL<DV_TIME> open ({*}): interval invariants"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_TIME-validate_open"
  - "AM AOM1.4 §C_COMPLEX_OBJECT"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.interval_time_open    # DV_INTERVAL<DV_TIME> matches {*}
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
# time literals corrected 2026-07-22: ISO 8601 / BASE foundation_types time syntax carries no leading T designator (T marks the date-time separator and duration components only)
decision_table:
  columns: [lower, upper, lower_unbounded, upper_unbounded, lower_included, upper_included, expected, violates]
  rows:
    - [null, null, false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
    - [null, "11:00:00", false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
    - ["10:00:00", null, false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
    - ["10", "11", false, false, true, true, accepted, []]
    - ["10:00", "11:00", false, false, true, true, accepted, []]
    - ["10:00:00", "11:00:00", false, false, true, true, accepted, []]
    - ["10", "10:45:00", false, false, true, true, accepted, []]   # re-adjudicated: no RM invariant grounds the rejection (see header)
    - [null, null, true, true, false, false, accepted, []]
