id: CONT-DV_DATE-validate_constraint
kind: content
component: CONTENT
rm_class: DV_DATE
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "A committed DV_DATE is accepted iff its month and day components satisfy the C_DATE validity-kind flags."
description: "DV_DATE against C_DATE month/day validity constraints"
spec_refs:
  - "CNF platform_test_schedule master17.4 \u00a7CONT-DV_DATE-validate_constraint"
  - "RM data_types \u00a7DV_DATE"
  - "AM AOM1.4 \u00a7C_DATE"
applies: { rm: ">=1.0.2" }
constraint_context:
  template: cnf.tpl.dv_date_c_date
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items[at0001]/value"
  constraint_columns: ["month_validity", "day_validity"]
decision_table:
  columns: ["value", "month_validity", "day_validity", "expected", "violates"]
  rows:
    - ["2021", "mandatory", "mandatory", "rejected", ["constraint(month_validity): the month component does not satisfy its validity kind", "constraint(day_validity): the day component does not satisfy its validity kind"]]
    - ["2021", "mandatory", "optional", "rejected", ["constraint(month_validity): the month component does not satisfy its validity kind"]]
    - ["2021", "optional", "optional", "accepted", []]
    - ["2021", "mandatory", "prohibited", "rejected", ["constraint(month_validity): the month component does not satisfy its validity kind"]]
    - ["2021", "prohibited", "prohibited", "accepted", []]
    - ["2021-10", "mandatory", "mandatory", "rejected", ["constraint(day_validity): the day component does not satisfy its validity kind"]]
    - ["2021-10", "mandatory", "optional", "accepted", []]
    - ["2021-10", "optional", "optional", "accepted", []]
    - ["2021-10", "mandatory", "prohibited", "accepted", []]
    - ["2021-10", "prohibited", "prohibited", "rejected", ["constraint(month_validity): the month component does not satisfy its validity kind"]]
    - ["2021-10-24", "mandatory", "mandatory", "accepted", []]
    - ["2021-10-24", "mandatory", "optional", "accepted", []]
    - ["2021-10-24", "optional", "optional", "accepted", []]
    - ["2021-10-24", "mandatory", "prohibited", "rejected", ["constraint(day_validity): the day component does not satisfy its validity kind"]]
    - ["2021-10-24", "prohibited", "prohibited", "rejected", ["constraint(month_validity): the month component does not satisfy its validity kind", "constraint(day_validity): the day component does not satisfy its validity kind"]]
