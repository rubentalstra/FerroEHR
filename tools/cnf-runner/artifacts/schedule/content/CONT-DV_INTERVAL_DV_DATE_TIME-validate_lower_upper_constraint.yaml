id: CONT-DV_INTERVAL_DV_DATE_TIME-validate_lower_upper_constraint
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DATE_TIME> whose lower and upper C_DATE_TIME each
  constrain the presence (mandatory | optional | prohibited) of the month, day,
  hour, minute, second, millisecond and timezone components is accepted iff both
  values satisfy every per-component validity constraint; the four interval bound
  flags are constant across every row (lower_unbounded=false, upper_unbounded=false,
  lower_included=true, upper_included=true) and are dropped from the table.
description: "DV_INTERVAL<DV_DATE_TIME> lower/upper against C_DATE_TIME per-component (month/day/hour/minute/second/millisecond/timezone) mandatory/optional/prohibited validity"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DATE_TIME-validate_lower_upper_constraint"
  - "AM AOM1.4 §C_DATE_TIME"
  - "RM data_types §DV_INTERVAL"
guards:
  - "C_DATE_TIME higher/lower precision component validity is checked by the archetype/template editor, not data validation — CNF platform_test_schedule master17.3 NOTE"
  - "when multiple precision components fail the mandatory constraint, only the highest-precision violation need be reported — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.interval_date_time_field_validity
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
  constraint_columns: ["month_validity_lower", "day_validity_lower", "month_validity_upper", "day_validity_upper", "hour_validity_lower", "minute_validity_lower", "second_validity_lower", "millisecond_validity_lower", "timezone_validity_lower", "hour_validity_upper", "minute_validity_upper", "second_validity_upper", "millisecond_validity_upper", "timezone_validity_upper"]
decision_table:
