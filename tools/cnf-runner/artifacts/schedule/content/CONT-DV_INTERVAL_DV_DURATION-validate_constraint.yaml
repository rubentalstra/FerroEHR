id: CONT-DV_INTERVAL_DV_DURATION-validate_constraint
kind: content
component: CONTENT
rm_class: DV_INTERVAL
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_INTERVAL<DV_DURATION> is accepted iff both limit DV_DURATION
  values use only the components allowed by C_DURATION; the four interval bound
  flags are constant (lower_unbounded=false, upper_unbounded=false,
  lower_included=true, upper_included=true) and are omitted.
description: "DV_INTERVAL<DV_DURATION> limits against C_DURATION component-allowed flags"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_INTERVAL_DV_DURATION-validate_constraint"
  - "AM AOM1.4 §C_DURATION"
  - "RM data_types §DV_INTERVAL"
constraint_context:
  template: cnf.tpl.interval_duration_allowed
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
  constraint_columns: ["years_allowed_lower", "months_allowed_lower", "weeks_allowed_lower", "days_allowed_lower", "hours_allowed_lower", "minutes_allowed_lower", "seconds_allowed_lower", "fractional_seconds_allowed_lower", "years_allowed_upper", "months_allowed_upper", "weeks_allowed_upper", "days_allowed_upper", "hours_allowed_upper", "minutes_allowed_upper", "seconds_allowed_upper", "fractional_seconds_allowed_upper"]
decision_table:
  columns: [lower, upper, years_allowed_lower, months_allowed_lower, weeks_allowed_lower, days_allowed_lower, hours_allowed_lower, minutes_allowed_lower, seconds_allowed_lower, fractional_seconds_allowed_lower, years_allowed_upper, months_allowed_upper, weeks_allowed_upper, days_allowed_upper, hours_allowed_upper, minutes_allowed_upper, seconds_allowed_upper, fractional_seconds_allowed_upper, expected, violates]
  rows:
    - ["P1Y", "P2Y", true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, accepted, []]
    - ["P3W", "P5W", true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, accepted, []]
    - ["P1Y", "P2Y", false, true, true, true, true, true, true, true, true, true, true, true, true, true, true, true, rejected, ["constraint(years_allowed): years component not allowed for lower"]]
    - ["P1Y", "P2Y", true, true, true, true, true, true, true, true, false, true, true, true, true, true, true, true, rejected, ["constraint(years_allowed): years component not allowed for upper"]]
    - ["P1Y1M1DT1H1M1.5S", "P2Y", true, false, true, true, true, true, true, true, true, true, true, true, true, true, true, true, rejected, ["constraint(months_allowed): months component not allowed for lower"]]
    - ["P2W", "P2Y", true, true, false, true, true, true, true, true, true, true, true, true, true, true, true, true, rejected, ["constraint(weeks_allowed): weeks component not allowed for lower"]]
    - ["P1Y1M1DT1H1M1.5S", "P2Y", true, true, true, false, true, true, true, true, true, true, true, true, true, true, true, true, rejected, ["constraint(days_allowed): days component not allowed for lower"]]
    - ["P1Y1M1DT1H1M1.5S", "P2Y", true, true, true, true, false, true, true, true, true, true, true, true, true, true, true, true, rejected, ["constraint(hours_allowed): hours component not allowed for lower"]]
    - ["P1Y1M1DT1H1M1.5S", "P2Y", true, true, true, true, true, false, true, true, true, true, true, true, true, true, true, true, rejected, ["constraint(minutes_allowed): minutes component not allowed for lower"]]
    - ["P1Y1M1DT1H1M1.5S", "P2Y", true, true, true, true, true, true, false, true, true, true, true, true, true, true, true, true, rejected, ["constraint(seconds_allowed): seconds component not allowed for lower"]]
    - ["P1Y1M1DT1H1M1.5S", "P2Y", true, true, true, true, true, true, true, false, true, true, true, true, true, true, true, true, rejected, ["constraint(fractional_seconds_allowed): fractional_seconds component not allowed for lower"]]
ambiguities: [AMB-42]
