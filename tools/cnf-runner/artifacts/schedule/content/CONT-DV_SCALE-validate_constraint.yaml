id: CONT-DV_SCALE-validate_constraint
kind: content
component: CONTENT
rm_class: DV_SCALE
capabilities: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  A committed DV_SCALE is accepted iff its value|symbol tuple matches one of the
  C_DV_SCALE.list entries (constraint assumed analogous to C_DV_ORDINAL).
  DV_SCALE exists only from RM 1.1.0.
description: "DV_SCALE against C_DV_SCALE.list = 1.5|[local::at0005], 2.0|[local::at0006]"
spec_refs:
  - "CNF platform_test_schedule master17.3 §CONT-DV_SCALE-validate_constraint"
  - "AM AOM1.4 §C_DV_SCALE"
  - "RM data_types §DV_SCALE"
applies: { rm: ">=1.1.0" }
guards:
  - "no current C_DV_SCALE constraint exists in the AM 1.4 Archetype Profile; modeling tools do not yet support it and the constraint is assumed analogous to C_DV_ORDINAL — CNF platform_test_schedule master17.3 NOTE"
constraint_context:
  template: cnf.tpl.scale_list    # C_DV_SCALE.list = 1.5|[local::at0005], 2.0|[local::at0006]
  path: "/content[openEHR-EHR-OBSERVATION.minimal.v1]/data/events/data/items/value"
decision_table:
  columns: [symbol, value, expected, violates]
  rows:
    - ["local::at0005", 1.5, accepted, []]
    - ["local::at0005", 66.6, rejected, ["constraint(C_DV_ORDINAL.list): no matching value"]]
    - ["local::at0666", 1.5, rejected, ["constraint(C_DV_ORDINAL.list): no matching symbol"]]
