# The scale branch of the ordinary upload_opt contract: the LARGEST OPT the
# official CKM publishes (Congenital syphilis case investigation form,
# cid 1013.26.977, ~5.2 MB of OPT 1.4 XML) is accepted exactly like any other
# valid OPT. The released text defines the upload_opt success and error
# branches with NO payload-size condition anywhere (the overview status table
# carries no 413/size-conditioned branch and no maximum-length rule appears in
# the release), so an implementation-imposed size cap that refuses or
# truncates a valid OPT is a conformance defect — this row is the asserted
# probe for that failure class (#1462). One behaviour per case: the subject
# is the size-independence of the acceptance branch; the ordinary acceptance
# semantics are already pinned by upload_opt-valid_opt.
id: I_DEFINITION_ADL14.upload_opt-largest_published
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  upload_opt accepts a valid OPT at the largest scale the official CKM
  publishes (~5.2 MB) — the released contract carries no payload-size
  condition, so no implementation size cap may refuse or truncate it.
description: "upload the largest published CKM OPT (~5.2 MB)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (no size-conditioned branch exists in the release)"
applies: { rm: ">=1.0.2" }
requires: { server: exclusive }          # global-state ground: the created branch needs the template GLOBALLY absent (its re-upload is the -valid_opt_twice_conflict branch), and the same OPT is provisioned by the create_composition-largest_published_form case — exclusive-ordered so this runs first on the fresh SUT
data_sets: [cnf.ckm.syphilis_investigation]
flow:
  - step: 1
    call: upload_opt
    with: { opt: "${ds:cnf.ckm.syphilis_investigation}" }
    expect: created
postconditions:
  - assert: state
    text: "The largest published OPT is loaded and retrievable by template_id"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all]
