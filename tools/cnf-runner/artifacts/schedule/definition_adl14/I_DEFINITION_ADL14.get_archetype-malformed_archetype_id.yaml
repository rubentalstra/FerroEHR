# The MALFORMED-IDENTIFIER branch of the ADL 1.4 archetype read.
#
# DERIVATION (the branch class the census flagged, resolved against the route's
# own documented contract rather than invented): the served read declares
# exactly two answers, 200 and 404, and imposes NO syntactic gate on the path
# segment — the archetype store key is an opaque string matched
# case-insensitively (BASE master05 §"Composite Identifiers and Case"), so a
# segment that is not a well-formed ARCHETYPE_ID is simply an id nothing is
# stored under. The honest answer is therefore the same `not_found` a
# well-formed-but-absent id gets, and the case exists to pin that: a server
# that answered 200, 400 or 500 on junk input would be caught, and so would one
# that let the junk reach the store as a fabricated lookup key.
#
# Contrast kept explicit by the sibling: `get_archetype-non_existing` addresses
# a WELL-FORMED id the store does not hold. Same outcome, different input
# class — two rows because a server could easily handle one and not the other.
#
# The chosen segment carries no `.vN` version part and no rm-entity structure,
# so it cannot be a legal ARCHETYPE_ID under any reading.
id: I_DEFINITION_ADL14.get_archetype-malformed_archetype_id
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_archetype
capabilities: [Adl14ArchetypeProvisioning]
profiles: [CORE]
test_purpose: >-
  Reading an ADL 1.4 archetype through a path segment that is not a well-formed
  ARCHETYPE_ID answers not_found — the id is opaque to the store, so an
  unparseable one names nothing rather than faulting.
description: "get an ADL 1.4 archetype by a malformed ARCHETYPE_ID"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.get_archetype"
  - "BASE master05 §Composite Identifiers and Case"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /definition/archetype/adl1.4* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family adl14-archetype) and adjudicated by register AMB-41. The row gates the Adl14ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
flow:
  - step: 1
    call: get_archetype
    with: { archetype_id: "not-an-archetype-id" }
    expect: not_found
ambiguities: [AMB-41]
