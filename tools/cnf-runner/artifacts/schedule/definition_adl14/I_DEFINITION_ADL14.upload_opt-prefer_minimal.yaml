# The `Prefer: return=minimal` verbosity branch of the ADL 1.4 OPT upload,
# stated explicitly rather than left to the default.
#
# The status/body pair is assigned by the upload's own 201 text: "`201 Created`
# is returned when the template has been successfully uploaded. … If the
# `Prefer` header is missing or set to `return=minimal`, the body is empty." So
# a minimal upload answers the created status with NO body — not the 204 the
# overview's general default suggests for a body-less write ("If no response
# body is returned, the service SHOULD use `204 No Content`",
# Requests_and_responses.md §Prefer minimal, identifier or full representation
# response), because that SHOULD governs writes whose own operation text
# assigns nothing and this one assigns directly. The conflict and this reading
# are registered as AMB-110(b), which also records that it resolves AMB-62's
# unassigned minimal status for the two template uploads only.
#
# The `Location` SHOULD from the same overview section is executed by the
# variant binding, and step 2 dereferences it: an empty-bodied response is only
# useful if the header it does carry addresses the created resource. One
# behaviour per case: the same valid OPT the accepted upload uses,
# distinguished only by the Prefer value the variant binding pins.
id: I_DEFINITION_ADL14.upload_opt-prefer_minimal
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  An OPT upload sent with Prefer: return=minimal answers the created status
  with an empty body and a Location header addressing the uploaded template.
description: "Prefer: return=minimal honoured on ADL 1.4 OPT upload"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
applies: { rm: ">=1.0.2" }
requires: { server: any }
data_sets: [cnf.opt.time_series.v4]
flow:
  - step: 1
    call: upload_opt
    variant: return_minimal              # pins Prefer: return=minimal
    with: { opt: "${ds:cnf.opt.time_series.v4}" }
    expect: created                      # the upload's 201 text
    capture: { template_id: created.template_id }
  - step: 2                              # the Location the empty-bodied response carries addresses the template
    call: get_opt
    with: { template_id: "${template_id}" }
    expect: ok
ambiguities: [AMB-110]
