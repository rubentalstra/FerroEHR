# The EXACT-MATCH reading of ADL 1.4 template addressing: with no released
# grammar for a legacy template_id, every supplied id is COMPLETE, so an id
# that names a family rather than a stored template matches nothing and the
# request is not-found.
#
# Released text (ITS-REST specifications/parameters/path/template_id.yaml):
# "Template identifier or partial reference. A partial `template_id` will
# resolve to 'latest' major version of that template" — but no released
# component defines the format of an ADL 1.4 template_id (AM ADL 1.4
# master02-overview.adoc §Templates gives templates no identification or
# versioning semantics), so nothing says which part of `test_versioned.en.v1`
# is the family and which the version. Under this reading no id is
# IDENTIFIABLE as partial, the promise is kept vacuously, and the unmatched id
# takes the operation's declared not-found branch
# (specifications/operations/definition_template_adl1.4_get.yaml, response
# '404'; ITS-REST overview `Requests_and_responses.md` §HTTP status codes, row
# 404: "The origin service did not find the target resource or is not willing
# to disclose that one exists").
#
# Register AMB-104. This case carries `option: adl14-partial-id-exact`; the
# sibling reading is I_DEFINITION_ADL14.get_opt-retrieve_latest_version under
# `option: adl14-partial-id-latest`. The ICS options declaration selects, so a
# server that resolves partial ids is never failed by this case and vice versa.
#
# One behaviour per case: the same two-version family the latest-resolution
# sibling loads, addressed by the same family name — only the expected outcome
# differs, which is exactly the latitude under test. The unrelated
# unknown-template branch (an id naming no family at all) is
# I_DEFINITION_ADL14.get_opt-retrieve_fail.
id: I_DEFINITION_ADL14.get_opt-partial_template_id_no_match
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
option: adl14-partial-id-exact
test_purpose: >-
  Where ADL 1.4 template ids are treated as complete, a template_id naming a
  family rather than a stored template resolves to nothing and answers
  not-found.
description: "retrieve an OPT by a family-name template_id under exact matching"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
  - "ITS-REST specifications §definition_template_adl1.4_get"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.versioned.v1, cnf.opt.versioned.v2]   # the two-version family, provisioned (409-tolerant)
flow:
  - step: 1
    call: get_opt
    with: { template_id: "test_versioned" }   # names the family; no template carries this exact id
    expect: not_found
ambiguities: [AMB-104]
