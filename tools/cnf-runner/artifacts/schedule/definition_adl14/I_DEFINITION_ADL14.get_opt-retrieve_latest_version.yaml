# The PARTIAL-id branch of ADL 1.4 template retrieval: a template_id that names
# a family rather than a member resolves to that family's latest version.
#
# Released promise (ITS-REST specifications/parameters/path/template_id.yaml):
# "Template identifier or partial reference. A partial `template_id` will
# resolve to 'latest' major version of that template". For an ADL 1.4 id that
# promise has no grammar behind it — no released component defines the format
# of a legacy template_id, so which part is the family and which the version is
# underivable — which makes this one of two conformant readings. Register
# AMB-104: this case carries `option: adl14-partial-id-latest`; the sibling
# reading, that every supplied id is COMPLETE so a family name matches nothing,
# is I_DEFINITION_ADL14.get_opt-partial_template_id_no_match under
# `option: adl14-partial-id-exact`. The ICS options declaration selects.
#
# RE-ADJUDICATED 2026-07-27 (group-10 audit): the option tag was
# `adl14-duplicate-versioned`, which conflated this RETRIEVAL question with the
# duplicate-UPLOAD question AMB-4 now owns alone.
id: I_DEFINITION_ADL14.get_opt-retrieve_latest_version
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
option: adl14-partial-id-latest
test_purpose: "Retrieving a versioned OPT by a partial template_id returns its latest version."
description: "retrieve last version of versioned OPT"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
  - "ITS-REST OAS operations/definition_template_adl1.4_get.yaml §responses"
  - "CNF platform_test_schedule master04 §get_opt-retrieve_latest_version"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.versioned.v1, cnf.opt.versioned.v2]   # the two-version ground (master04: includes the Upload OPT flows; provisioned, 409-tolerant)
data_sets: [cnf.opt.versioned.v1, cnf.opt.versioned.v2]
flow:
  - step: 1
    call: get_opt
    with: { template_id: "test_versioned" }   # partial template_id -> latest version
    expect: ok                           # "the correct OPT will be returned, and will be the last version"
    assert:
      - { assert: equivalent, to: "${ds:cnf.opt.versioned.v2}" }
ambiguities: [AMB-104]
