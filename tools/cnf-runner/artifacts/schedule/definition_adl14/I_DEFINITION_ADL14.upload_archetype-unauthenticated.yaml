# The AUTHENTICATION boundary of the ADL 1.4 archetype-provisioning surface.
#
# A battery that only proves the happy path cannot catch a LENIENT server:
# accepting what must be refused is as non-conformant as refusing what must be
# accepted, and the archetype routes carried no refusal-by-principal row at
# all. This case is the one behaviour "every route of this capability refuses a
# request that carries no valid authentication" — swept across all four routes
# the capability serves, exactly as SEC-AUTHENTICATED_ACCESS sweeps the core
# operations, because the property is route-table-wide and a per-route case
# would say the same thing four times.
#
# THE OTHER SIDE — this row also fences the routes: a request refused before it
# reaches the resource cannot be a lookup with a fabricated id, so the upload
# step carries the same VALID archetype the round-trip case uses and the read /
# delete steps address ids the store may or may not hold. The refusal must not
# depend on either.
#
# EXTENSION ROUTES (register AMB-41): the outcome mapping is UNIVERSAL, not
# per-binding (vocab/selectors.yaml universal_outcomes: unauthenticated -> 401,
# route-table-wide), so no binding outcome is added for it. The refusal itself
# is the served routes' own documented contract (their `#[utoipa::path]`
# declares the 401 branch); no openEHR spec governs these routes.
id: I_DEFINITION_ADL14.upload_archetype-unauthenticated
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_archetype
capabilities: [Adl14ArchetypeProvisioning]
profiles: [CORE]
test_purpose: >-
  Every ADL 1.4 archetype-provisioning route refuses a request that carries no
  valid authentication — the upload, the listing, the read and the delete
  alike, and regardless of whether the addressed archetype exists.
description: "Unauthenticated requests to the ADL 1.4 archetype routes are refused"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_archetype"
  - "SM openehr_platform §I_DEFINITION_ADL14.list_archetypes"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_archetype"
  - "SM openehr_platform §I_DEFINITION_ADL14.delete_archetype"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /definition/archetype/adl1.4* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family adl14-archetype) and adjudicated by register AMB-41. The row gates the Adl14ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.archetype.adl14.medication]
flow:
  - step: 1
    call: upload_archetype
    on: unauthenticated
    with: { archetype_adl14: "${ds:cnf.archetype.adl14.medication}" }
    expect: unauthenticated              # universal 401 (route-table-wide)
  - step: 2
    call: list_archetypes
    on: unauthenticated
    expect: unauthenticated
  - step: 3
    call: get_archetype
    on: unauthenticated
    with: { archetype_id: "openEHR-EHR-INSTRUCTION.medication.v1" }
    expect: unauthenticated
  - step: 4
    call: delete_archetype
    on: unauthenticated
    with: { archetype_id: "openEHR-EHR-INSTRUCTION.medication.v1" }
    expect: unauthenticated
ambiguities: [AMB-41]
