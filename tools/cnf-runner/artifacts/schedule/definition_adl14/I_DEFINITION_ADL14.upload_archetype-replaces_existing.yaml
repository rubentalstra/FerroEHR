# The REPLACE half of the SM upload_archetype contract, as its own case.
#
# SM `i_definition_adl14.adoc` declares the operation replace-or-create: "If an
# archetype with the same id already exists, replace it. The archetype must be
# valid to succeed." So a re-upload under an id the store already holds is NOT
# a conflict — it succeeds with the same `created` outcome as the first upload,
# and afterwards the store serves the SECOND source.
#
# This is documented behaviour, not a refusal — and it belongs in a refusal
# closure precisely because the alternative failure modes are the interesting
# ones: a server that answered `already_exists` (the ADL 2 upload's own
# duplicate branch) would be refusing what must be accepted, and a server that
# answered `created` while still serving the FIRST source would be accepting
# without doing. Only the read-back separates the two.
#
# The two sources differ in exactly one description `other_details` value, so
# the read-back assertion names a marker that can only come from the second
# upload and the omission assertion names one that can only come from the
# first.
id: I_DEFINITION_ADL14.upload_archetype-replaces_existing
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_archetype
capabilities: [Adl14ArchetypeProvisioning]
profiles: [CORE]
test_purpose: >-
  Re-uploading an ADL 1.4 archetype under an id the store already holds
  REPLACES it — the second upload succeeds like the first, and the read-back
  serves the second source, not the first.
description: "re-upload an existing ADL 1.4 archetype id (replace-or-create)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_archetype"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_archetype"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /definition/archetype/adl1.4* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family adl14-archetype) and adjudicated by register AMB-41. The row gates the Adl14ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.archetype.adl14.medication, cnf.archetype.adl14.revised]
flow:
  - step: 1
    call: upload_archetype
    with: { archetype_adl14: "${ds:cnf.archetype.adl14.medication}" }
    expect: created
  # The same ARCHETYPE_ID again, carrying a different source: replace-or-create,
  # so this is a success and not a duplicate conflict.
  - step: 2
    call: upload_archetype
    with: { archetype_adl14: "${ds:cnf.archetype.adl14.revised}" }
    expect: created
  # The proof that the replace actually happened: the store serves the SECOND
  # source's marker and no longer the first's.
  - step: 3
    call: get_archetype
    with: { archetype_id: "openEHR-EHR-INSTRUCTION.medication.v1" }
    expect: ok
    assert:
      - { assert: returns, matches: "CNF-REUPLOAD-REVISION-2", omits: "924CFA7763035B1B943B52502FA037A5" }
ambiguities: [AMB-41]
