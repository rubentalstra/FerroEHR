# The request-side MEDIA-TYPE branch of the ADL 1.4 archetype upload.
#
# The route carries exactly one body form — ADL 1.4 source text — so a request
# DECLARING another payload media type cannot be processed as ADL and is
# refused 415, not with the parser's generic client error. One behaviour per
# case: the body is the same VALID archetype the round-trip case uploads, so
# only the declared media type distinguishes this exchange from a success, and
# a server that answered 422 (or 201) here would be caught.
#
# EXTENSION ROUTE (register AMB-41): released ITS-REST 1.1.0 surfaces no ADL
# 1.4 archetype resource at all, so the 415 is NOT a released MUST — it is the
# served route's own documented contract (`#[utoipa::path]`: "The request
# declares a `Content-Type` other than `text/plain`; the body cannot be
# processed as ADL source."). The status mapping is universal
# (vocab/selectors.yaml universal_outcomes: unsupported_media -> 415).
id: I_DEFINITION_ADL14.upload_archetype-wrong_media
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_archetype
capabilities: [Adl14ArchetypeProvisioning]
profiles: [CORE]
test_purpose: >-
  An ADL 1.4 archetype upload declaring a non-text payload media type is
  refused as unsupported_media, leaving the archetype store untouched.
description: "ADL 1.4 archetype upload with a non-text Content-Type"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_archetype"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /definition/archetype/adl1.4* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family adl14-archetype) and adjudicated by register AMB-41. The row gates the Adl14ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.archetype.adl14.medication]
flow:
  - step: 1
    call: upload_archetype
    variant: wrong_media_type            # sends Content-Type: application/json on the text-only upload
    with: { archetype_adl14: "${ds:cnf.archetype.adl14.medication}" }
    expect: unsupported_media
ambiguities: [AMB-41]
