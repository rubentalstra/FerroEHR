# Fixture-set iteration with per-fixture defects; postcondition = unchanged
# server. SCOPE (re-adjudicated 2026-07-27, group-10 audit): this case now owns
# only the SEMANTIC rejection branch — bodies that PARSE as XML but are not
# valid operational templates. The released 400 trigger is confined to input
# that does not parse ("the request could not be parsed or is invalid (e.g.
# malformed request URL syntax, missing required header or parameter, or
# syntactically invalid header, parameter or content)" —
# specifications/responses/400.yaml), so it cannot own these rows; the semantic
# branch has no status the operation declares at all, and AMB-110 fixes it at
# 422 on the overview's own definition of that code ("The request was
# well-formed but was unable to be followed due to semantic errors" —
# docs/overview/Requests_and_responses.md §HTTP status codes). The syntactic
# half moved to its own isolated case,
# I_DEFINITION_ADL14.upload_opt-unparseable_opt (one behaviour per case).
id: I_DEFINITION_ADL14.upload_opt-invalid_opt
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "OPTs that parse but are not valid operational templates are rejected as semantically invalid and leave the server state unchanged."
description: "upload semantically invalid OPTs"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
  - "AM ADL1.4 master08-adl.adoc §Coded Term Validity (VATDF/VACDF)"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
  - "CNF platform_test_schedule master04 §upload_opt data sets"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
parameters:
  iteration: reset_per_row
  fixture_set:                 # the official invalid-OPT data-set rows, one per SEMANTIC defect
    - { data_set: cnf.opt.invalid.empty_template_id, expected: validation_failed, defect: "empty template_id" }
    - { data_set: cnf.opt.invalid.removed_mandatory, expected: validation_failed, defect: "removed mandatory elements" }
    - { data_set: cnf.opt.invalid.multiple_elements, expected: validation_failed, defect: "multiple elements where upper bound is 1" }
    # The valid+invalid-twins row (owner hard rule 2026-07-29): the shape the
    # 2026-07-29 triage adjudicated spec-invalid — a constraint_bindings key
    # whose ac-code the ontology never DEFINES (ADL1.4 master08-adl.adoc
    # §Coded Term Validity VATDF/VACDF; master05 §Placeholder Constraints) —
    # preserved as a refusal row beside its corrected valid twin
    # (cnf.tpl.dv_coded_text_binding_sct), so a lenient server fails here.
    - { data_set: cnf.opt.invalid.undefined_constraint_code, expected: validation_failed, defect: "constraint binding key ac0001 is never defined in constraint_definitions" }
flow:
  - step: 1
    call: upload_opt
    with: { opt: "${ds:fixture}" }
    expect: "${fixture.expected}"
postconditions:
  - assert: state
    text: "No OPTs are loaded on the system"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts]
ambiguities: [AMB-110]
