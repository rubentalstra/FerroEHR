# Official master04 case: retrieve all loaded OPTs. The case id keeps the
# schedule's get_opts family while sm_operation carries the resolvable
# list_opts (the SM I_DEFINITION_ADL14 defines list_opts, not get_opts). For versioned OPTs, only the latest version is listed.
id: I_DEFINITION_ADL14.get_opts-retrieve_all
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.list_opts
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: "Listing all OPTs on a populated server returns every loaded OPT (latest version only for versioned OPTs)."
description: "retrieve all loaded OPTs"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.list_opts"
  - "CNF platform_test_schedule master04 §get_opts-retrieve_all"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_all_entries, cnf.opt.maximal]   # "All valid OPTs should be loaded" — provisioned, 409-tolerant on a shared world
data_sets: [cnf.opt.minimal_all_entries, cnf.opt.maximal]
flow:
  - step: 1
    call: list_opts
    expect: ok                           # "All the loaded OPTs should be returned"
    assert:
      # realized as containment: the listing includes every loaded OPT
      # (whole-list equality holds only on a single-case pristine world)
      - { assert: returns, matches: "obs_act\\.en\\.v1" }
      - { assert: returns, matches: "test_all_types\\.en\\.v1" }
