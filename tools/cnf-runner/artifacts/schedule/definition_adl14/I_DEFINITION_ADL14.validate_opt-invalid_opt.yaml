# Official master04 case. sm_operation carries the resolvable valid_opt (the
# schedule anchors validate_opt(), which the vendored SM does not define — see
# REQUIREMENTS.md, AMB-13 precedent). Validation is realized via upload per the
# master04 §validate_opt NOTE: an invalid OPT is rejected and nothing loads, so
# the state-unchanged post-condition is verifiable via get_opts on the empty
# server.
id: I_DEFINITION_ADL14.validate_opt-invalid_opt
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.valid_opt
capabilities: [Adl14OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "Invalid OPTs validate negatively and leave the server state unchanged."
description: "Validate invalid OPTs"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.valid_opt"
  - "CNF platform_test_schedule master04 §validate_opt-invalid_opt"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
parameters:
  iteration: reset_per_row
  fixture_set:                           # the master04 invalid-OPT data sets
    - { data_set: cnf.opt.invalid.empty_file, expected: validation_failed, defect: "empty file" }
    - { data_set: cnf.opt.invalid.empty_template_id, expected: validation_failed, defect: "empty template_id" }
    - { data_set: cnf.opt.invalid.removed_mandatory, expected: validation_failed, defect: "removed mandatory elements" }
    - { data_set: cnf.opt.invalid.multiple_elements, expected: validation_failed, defect: "multiple elements where upper bound is 1" }
flow:
  - step: 1
    call: upload_opt
    with: { opt: "${ds:fixture}" }
    expect: "${fixture.expected}"        # negative: "the result should be negative ... OPT is invalid"
postconditions:
  - assert: state
    text: "Validation does not change the state of the system (no OPTs loaded)"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts]
ambiguities: [AMB-16]
