# Official master04 case. SM defines delete_opt; ITS-REST 1.1.0 surfaces no
# wire for it (AMB-17) — the its-rest binding declares the operation
# unrealized, so this case is not-applicable with citation on that ITS and
# activates when a later ITS release adds the endpoint.
# Re-aligned 2026-07-24 (#231 audit): the official cell's ground is the
# VERSION-LESS delete — master04 §delete_opt-delete_latest_version NOTE:
# "for versioned OPTs, when no version parameter is present when invoking
# the delete OPT service, all the versions of the OPT will be deleted",
# and the official flow ends by including "retrieve all loaded OPTs when
# none is loaded". The former encoding (delete v2, prior version remains)
# tested a ground the official cell does not state, against stub-era
# template ids no manifest entry carries.
id: I_DEFINITION_ADL14.delete_opt-delete_latest_version
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.delete_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  Deleting a versioned OPT with no version parameter deletes ALL its
  versions (master04 NOTE); afterwards the OPT is no longer retrievable.
description: "Delete a versioned OPT without a version parameter (all versions)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.delete_opt"
  - "CNF platform_test_schedule master04 §delete_opt-delete_latest_version (incl. the no-version-parameter NOTE)"
applies: { rm: ">=1.0.2" }
requires:
  server: empty
  templates: [cnf.opt.versioned.v1, cnf.opt.versioned.v2]
flow:
  - step: 1
    call: delete_opt
    with: { template_id: "test_versioned" }    # version-less: deletes every version (the NOTE)
    expect: deleted
  - step: 2
    call: get_opt
    with: { template_id: "test_versioned" }
    expect: not_found
postconditions:
  - assert: state
    text: "No version of the OPT remains retrievable (verified by step 2)"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts]
ambiguities: [AMB-17]
