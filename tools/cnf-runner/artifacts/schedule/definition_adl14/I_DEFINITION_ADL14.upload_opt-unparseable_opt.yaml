# The SYNTACTIC rejection branch of the ADL 1.4 OPT upload, isolated from the
# semantic one (I_DEFINITION_ADL14.upload_opt-invalid_opt, which keeps the rows
# that parse but are not valid operational templates).
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §HTTP status codes,
# row 400): "The service cannot or will not process the request due to
# something that is perceived to be a client error (e.g., malformed request
# syntax, syntactically invalid content)" — against row 422, "The request was
# well-formed but was unable to be followed due to semantic errors". An EMPTY
# request body is not well-formed XML by any reading, so it is the row-400 case
# and cannot be the row-422 one; nothing about it is semantic.
#
# One behaviour per case: a single fixture, the empty file, sent with the
# correct declared Content-Type so nothing but the unparseability of the
# content distinguishes the exchange (the media-type branch is
# upload_opt-wrong_media). Register: AMB-110.
id: I_DEFINITION_ADL14.upload_opt-unparseable_opt
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [CORE]
test_purpose: >-
  An OPT upload whose body is not well-formed XML is refused as a client error
  at the syntactic branch, not the semantic one, and leaves the template store
  untouched.
description: "upload an unparseable OPT body"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
  - "CNF platform_test_schedule master04 §upload_opt data sets"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: empty }
data_sets: [cnf.opt.invalid.empty_file]
flow:
  - step: 1
    call: upload_opt
    variant: unparseable                 # pins the 400 realization
    with: { opt: "${ds:cnf.opt.invalid.empty_file}" }
    expect: validation_failed            # §HTTP status codes row 400 — syntactically invalid content
postconditions:
  - assert: state
    text: "No OPTs are loaded on the system"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts]
ambiguities: [AMB-110]
