# Two uploads of DISTINCT template_ids both succeed and both templates end up
# loaded — the base fact every conformant server shares, and the control against
# which the duplicate-upload latitude (AMB-4) is read.
#
# The two fixtures are separate templates (`test_versioned.en.v3` and
# `test_versioned.en.v4`), not two versions of one: nothing in the released text
# relates two template_id strings to each other, and the only duplicate rule the
# ITS declares keys on equality of `template_id` ("`409 Conflict` is returned
# when a template with same `template_id` already exists" —
# responses/409_template_already_exists.yaml). Different ids therefore never
# collide under EITHER branch of AMB-4, so this case carries no option tag and
# gates for every server. RE-ADJUDICATED 2026-07-27 (group-10 audit): it used to
# carry `option: adl14-duplicate-versioned` on the reading that the two uploads
# were one template at two versions supplied through a version parameter — a
# mechanism the released ADL 1.4 upload does not have (its parameters are
# Prefer, Accept and Content-Type; the only version parameter ever released, on
# the ADL2 upload, is deprecated under SPECITS-87).
id: I_DEFINITION_ADL14.upload_opt-valid_opt_twice_no_conflict
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "Uploading two OPTs with distinct template_ids succeeds both times; both templates are loaded."
description: "upload two valid OPTs with distinct template_ids (no conflict)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
  - "ITS-REST definition_template_adl1.4_upload §409 Conflict (the duplicate branch keys on same template_id)"
  - "CNF platform_test_schedule master04 §upload_opt-valid_opt_twice_no_conflict"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "No OPTs should be loaded on the system"
data_sets: [cnf.opt.versioned.v3, cnf.opt.versioned.v4]
flow:
  - step: 1
    call: upload_opt
    with: { opt: "${ds:cnf.opt.versioned.v3}" }   # template_id test_versioned.en.v3
    expect: created                      # "the result should be positive (the server accepted the OPT)"
  - step: 2
    call: upload_opt
    with: { opt: "${ds:cnf.opt.versioned.v4}" }   # template_id test_versioned.en.v4 — a different id
    expect: created                      # "the result should be positive (the server accepted the OPT)"
postconditions:
  - assert: state
    text: "Two OPTs with distinct template_ids are loaded"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all]
