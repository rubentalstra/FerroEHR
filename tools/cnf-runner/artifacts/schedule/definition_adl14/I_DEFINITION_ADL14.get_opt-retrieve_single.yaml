# Official master04 case: retrieve a single OPT by template_id and check it is
# byte-for-byte the uploaded OPT. The flow includes the upload flow (master04
# NOTE: "the flows of this test case will include flows from the Upload OPT
# test case") so there is something to retrieve.
id: I_DEFINITION_ADL14.get_opt-retrieve_single
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: "Retrieving a loaded OPT by template_id returns exactly the OPT that was uploaded."
description: "Retrieve a single OPT"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
  - "CNF platform_test_schedule master04 §get_opt-retrieve_single"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_all_entries]   # the upload ground (master04: the flow includes the Upload OPT flow; provisioned, 409-tolerant on a shared world)
data_sets: [cnf.opt.minimal_all_entries]
flow:
  - step: 1
    call: get_opt
    with: { template_id: "obs_act.en.v1" }     # the provisioned OPT's template_id (corpus manifest)
    expect: ok                           # "the correct OPT will be returned"
    assert:
      - { assert: equivalent, to: "${ds:cnf.opt.minimal_all_entries}" }   # "the retrieved OPT should be exactly the same as the uploaded one"
