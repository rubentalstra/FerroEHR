# The request-side media-type branch of the OPT upload: the ADL 1.4 upload
# carries exactly one body type (the canonical OPT XML), so a request that
# DECLARES another payload media type cannot be processed and is refused with
# 415 — not with the parser's generic client error. Decisive docs-text
# sentence (ITS-REST overview Resources.md §XML Format): "If the service
# cannot process the request payload as XML format, it MUST respond with HTTP
# status code `415 Unsupported Media Type`"; §JSON Format states the mirror
# rule for a payload the service cannot process as JSON. One behaviour per
# case: the body is the same valid OPT the upload_opt-valid_opt case uses, so
# only the declared media type distinguishes this exchange.
id: I_DEFINITION_ADL14.upload_opt-wrong_media
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  An OPT upload declaring a non-XML payload media type is refused as
  unsupported_media, leaving the template store untouched.
description: "OPT upload with a non-XML Content-Type"
spec_refs:
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §JSON Format"
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
applies: { rm: ">=1.0.2" }
requires:
  server: any
data_sets: [cnf.opt.minimal_action]
flow:
  - step: 1
    call: upload_opt
    variant: wrong_media_type            # sends Content-Type: application/json on the XML-only upload
    with: { opt: "${ds:cnf.opt.minimal_action}" }
    expect: unsupported_media            # Resources.md §XML Format MUST
