# Official master04 case. The schedule anchors I_DEFINITION_ADL14.validate_opt(),
# but the vendored SM I_DEFINITION_ADL14 defines valid_opt (there is no
# validate_opt operation) — sm_operation carries the resolvable valid_opt while
# the case id keeps the schedule's validate_opt family verbatim (AMB-13
# precedent; recorded as an ambiguity-register candidate in REQUIREMENTS.md).
# ITS-REST 1.1.0 exposes no dedicated OPT-validation endpoint, so validation is
# realized via upload per the master04 §validate_opt NOTE; iteration:
# reset_per_row restores the empty server between rows.
id: I_DEFINITION_ADL14.validate_opt-valid_opt
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.valid_opt
capabilities: [Adl14OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "Valid OPTs validate positively (realized via upload on ITS-REST 1.1.0, per the master04 validate_opt NOTE)."
description: "Validate valid OPTs"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.valid_opt"
  - "CNF platform_test_schedule master04 §validate_opt-valid_opt"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
parameters:
  iteration: reset_per_row               # "the pre-conditions and post-conditions apply to the run for X"
  fixture_set:                           # the master04 valid-OPT data sets
    - { data_set: cnf.opt.minimal_all_entries, expected: created }
    - { data_set: cnf.opt.versioned.v1, expected: created }
    - { data_set: cnf.opt.maximal, expected: created }
flow:
  - step: 1
    call: upload_opt
    with: { opt: "${ds:fixture}" }
    expect: "${fixture.expected}"        # positive: "the result should be positive ... OPT is valid"
ambiguities: [AMB-16]
