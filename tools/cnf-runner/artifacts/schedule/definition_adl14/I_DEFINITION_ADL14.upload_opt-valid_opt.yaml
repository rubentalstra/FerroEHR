# Official master04 case: valid OPTs are accepted and loaded, and each loaded
# OPT is retrievable by template_id (the post-condition is verified through the
# get_opt-retrieve_single / get_opts-retrieve_all read cases).
id: I_DEFINITION_ADL14.upload_opt-valid_opt
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning, DefinitionApi]   # the API-presence capability is evidenced by this chapter exemplar (CNF profiles master03 §Functional REST APIs)
exercises: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "Valid OPTs are accepted, stored as uploaded, and become retrievable by template_id."
description: "upload valid OPTs"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
  - "CNF platform_test_schedule master04 §upload_opt-valid_opt"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "No OPTs should be loaded on the system"
parameters:
  iteration: reset_per_row               # "the pre-conditions and post-conditions apply to the run for X"
  fixture_set:                           # the master04 valid-OPT data sets
    - { data_set: cnf.opt.obs_inst, expected: created }
    - { data_set: cnf.opt.nested, expected: created }
    - { data_set: cnf.opt.time_series, expected: created }
flow:
  - step: 1
    call: upload_opt
    with: { opt: "${ds:fixture}" }
    expect: "${fixture.expected}"        # "the result should be positive, the server accepted the OPT"
postconditions:
  - assert: state
    text: "A new OPT with the given template_id is loaded and retrievable by template_id"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all, I_DEFINITION_ADL14.get_opt-retrieve_single]
