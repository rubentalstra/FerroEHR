# Official master04 case. SM defines delete_opt; ITS-REST 1.1.0 surfaces no
# wire for it (AMB-17) — the its-rest binding declares the operation
# unrealized, so this case is not-applicable with citation on that ITS and
# activates when a later ITS release adds the endpoint.
id: I_DEFINITION_ADL14.delete_opt-delete_non_existing
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.delete_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  Deleting a non-existing OPT is rejected and leaves the server unchanged.
description: "Delete a non-existing OPT"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.delete_opt"
  - "CNF platform_test_schedule master04 §delete_opt-delete_non_existing"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
flow:
  - step: 1
    call: delete_opt
    with: { template_id: "cnf.does_not_exist" }
    expect: not_found
postconditions:
  - assert: state
    text: "No OPTs are loaded on the system"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts]
ambiguities: [AMB-17]
