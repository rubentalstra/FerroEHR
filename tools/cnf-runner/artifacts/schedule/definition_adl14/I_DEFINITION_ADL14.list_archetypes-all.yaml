# The ADL 1.4 archetype-provisioning battery — EXTENSION ROUTES (register
# AMB-41): released ITS-REST 1.1.0 surfaces no ADL 1.4 archetype resource, so
# these cases drive the routes this product serves of its own design
# (/definition/archetype/adl1.4**) and gate the Adl14ArchetypeProvisioning
# CAPABILITY only, never ITS-REST wire conformance. Party-scoped at
# selection: a party claiming nothing of this capability gets
# not-applicable-with-citation. Owner adjudication 2026-07-29: full
# implementation over an excused claim (the book-CORE required marker drops
# with the register derivation).
id: I_DEFINITION_ADL14.list_archetypes-all
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.list_archetypes
capabilities: [Adl14ArchetypeProvisioning]
profiles: [CORE]
test_purpose: "Listing ADL 1.4 archetypes returns the uploaded archetype ids."
description: "list ADL 1.4 archetypes after an upload"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.list_archetypes"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /definition/archetype/adl1.4* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family adl14-archetype) and adjudicated by register AMB-41. The row gates the Adl14ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
requires: { server: any }
data_sets: [cnf.archetype.adl14.medication]
flow:
  - step: 1
    call: upload_archetype
    with: { archetype_adl14: "${ds:cnf.archetype.adl14.medication}" }
    expect: created
  - step: 2
    call: list_archetypes
    expect: ok
    assert:
      - { assert: returns, matches: "openEHR-EHR-INSTRUCTION\\.medication\\.v1" }
ambiguities: [AMB-41]
