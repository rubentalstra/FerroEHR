# Official master04 case. SM defines delete_opt; ITS-REST 1.1.0 surfaces no
# wire for it (AMB-17) — the its-rest binding declares the operation
# unrealized, so this case is not-applicable with citation on that ITS and
# activates when a later ITS release adds the endpoint.
id: I_DEFINITION_ADL14.delete_opt-delete_existing
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.delete_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  Deleting an existing OPT succeeds and the OPT is no longer retrievable.
description: "Delete an existing OPT"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.delete_opt"
  - "CNF platform_test_schedule master04 §delete_opt-delete_existing"
applies: { rm: ">=1.0.2" }
requires:
  server: empty
  templates: [cnf.opt.minimal_event]
flow:
  - step: 1
    call: delete_opt
    with: { template_id: "cnf.minimal_event" }
    expect: deleted
  - step: 2
    call: get_opt
    with: { template_id: "cnf.minimal_event" }
    expect: not_found
postconditions:
  - assert: state
    text: "The deleted OPT is no longer retrievable (verified by step 2)"
ambiguities: [AMB-17]
