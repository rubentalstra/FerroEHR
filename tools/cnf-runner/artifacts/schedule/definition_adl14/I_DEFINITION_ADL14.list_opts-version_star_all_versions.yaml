# The explicit-`version` branch of the template listing: `version=*` lists
# EVERY stored version of a versioned OPT family. The ITS-REST docs text is
# silent on template-list version filtering, so the RELEASED OAS grounds the
# behaviour (oracle order 2026-07-28 — the OAS fills docs-text silence, cited
# AS the OAS): "Filter by version (e.g. `1.2.*` or use `*` for all
# versions)" (specifications/parameters/query/filter_version.yaml). The
# absent-version branch is the sibling list_opts-absent_version_latest_only
# case.
id: I_DEFINITION_ADL14.list_opts-version_star_all_versions
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.list_opts
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  Listing templates with `version=*` returns every stored version of a
  versioned OPT family, not just the latest.
description: "list templates with `version=*` — every stored version"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.list_opts"
  - "ITS-REST OAS parameters/query/filter_version.yaml (docs-text-silent ground): \"use `*` for all versions\""
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.versioned.v1, cnf.opt.versioned.v2]   # two versions of the one family — provisioned, 409-tolerant on a shared world
data_sets: [cnf.opt.versioned.v1, cnf.opt.versioned.v2]
flow:
  - step: 1
    call: list_opts
    variant: filter_version
    with: { version: "*" }
    expect: ok
    assert:
      - { assert: returns, matches: "test_versioned\\.en\\.v1" }
      - { assert: returns, matches: "test_versioned\\.en\\.v2" }
