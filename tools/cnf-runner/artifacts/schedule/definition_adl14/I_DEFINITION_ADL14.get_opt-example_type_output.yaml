# The non-default `type` value of the template-example endpoint. The
# variant-less example coverage exercises the released defaults
# (`type=input`, `detail_level=required`); this case exercises the OTHER
# declared member of the same enum, so both branches of a two-valued released
# parameter are covered rather than only the default.
#
# DOCS TEXT (ITS-REST definition_template_adl1.4_example_get — the operation
# `description:` prose is the released docs text for this API group, whose
# `docs/definition/` chapter carries no operation semantics): "The generated
# example can be either of type `input` (i.e., ready to be submitted to the
# repository) or `output` (as it would appear when retrieved from the
# repository). This behavior is controlled by the `type` query parameter."
#
# WHAT IS ASSERTED: the request is fulfilled and the body is a COMPOSITION
# instance. What the two types DIFFER in is not asserted — the same operation
# carries "> NOTE: The implementation and completeness of these examples are
# not specified, and vendors may produce different results", so any content
# comparison would be an invention. Register: AMB-115.
id: I_DEFINITION_ADL14.get_opt-example_type_output
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]           # the tier of Adl14OptProvisioning (vocab/capability_matrix.yaml)
test_purpose: >-
  Requesting an output-type template example is fulfilled and returns a
  COMPOSITION instance in the negotiated format.
description: "get a template example with type=output"
spec_refs:
  - "ITS-REST specifications §definition_template_adl1.4_example_get"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example_output
    format: canonical-json
    with: { template_id: "minimal_action.en.v1" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
ambiguities: [AMB-115]
