# The `Prefer: return=identifier` verbosity branch of the ADL 1.4 OPT upload —
# the second of the three preferences the released upload names, after the
# minimal default (upload_opt-prefer_minimal) and beside the representation
# form.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §"Prefer only
# identifier"): "This is a variant of preference that implies minimal response
# semantics, but with a non-empty response body (i.e., the status will be `201
# Created` or `200 OK`, never `204 No Content`)." and "The response body SHOULD
# contain only the identifier of the affected resource formatted according to
# the `Accept` request header." The upload's own 201 text names WHICH
# identifier for this preference: "if is `return=identifier`, only its unique
# identifier is included" — the `{ "template_id": … }` object under
# `application/json`.
#
# Two observable facts, both asserted: the body carries the template_id and
# none of the full template's own content, and the returned identifier really
# addresses the uploaded template (step 2 reads it back through it). One
# behaviour per case: the same valid OPT the accepted upload uses,
# distinguished only by the Prefer value the variant binding pins.
# Register: AMB-110.
id: I_DEFINITION_ADL14.upload_opt-prefer_identifier
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  An OPT upload sent with Prefer: return=identifier answers a non-empty
  identifier body at the created status — never 204 No Content — and the
  returned template_id addresses the uploaded template.
description: "Prefer: return=identifier honoured on ADL 1.4 OPT upload"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer only identifier"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: any }
data_sets: [cnf.opt.time_series.v3]
flow:
  - step: 1
    call: upload_opt
    variant: return_identifier           # pins Prefer: return=identifier
    with: { opt: "${ds:cnf.opt.time_series.v3}" }
    expect: created                      # "201 Created or 200 OK, never 204 No Content"
    capture: { template_id: created.template_id }
    assert:
      # "only the identifier of the affected resource" — the TemplateIdentifier object
      - { assert: field, path: "template_id", exists: true }
      # not the full representation: none of the template's own content is rendered beside it
      - { assert: field, path: "definition", absent: true }
  - step: 2                              # the identifier addresses the resource it names
    call: get_opt
    with: { template_id: "${template_id}" }
    expect: ok
ambiguities: [AMB-110]
