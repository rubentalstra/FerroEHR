# The ROLE-CLASS boundary of the ADL 1.4 archetype surface: the archetype
# DELETE carries the coarse `Admin` operation class while the upload and the
# reads stay `Clinical`, so an authenticated, non-read-only principal holding
# only the ordinary clinical role is refused on the delete alone.
#
# The class split is OUR OWN DESIGN on the blast radius of destroying a
# deployment-wide definition artefact, and the specification hands the choice
# over rather than being silent on it: SM openehr_platform master02-overview.adoc
# §Functional Style lists "approach to access control and authorisation" among
# the dimensions where "different choices will be made", and states that
# "Authentication and authorisation is assumed to have been dealt with before
# any particular call has been made … and role-based access control".
#
# The upload control is what makes the row a statement about the DELETE's
# class: the same principal WRITES the same family successfully, so the refusal
# cannot be read as the principal being unable to write at all.
#
# EXTENSION ROUTES (register AMB-41): the outcome mapping is UNIVERSAL
# (vocab/selectors.yaml universal_outcomes: forbidden -> 403, route-table-wide).
id: I_DEFINITION_ADL14.delete_archetype-clinical_forbidden
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.delete_archetype
capabilities: [Adl14ArchetypeProvisioning]
profiles: [CORE]
test_purpose: >-
  An authenticated principal holding only the clinical role is refused on the
  ADL 1.4 archetype DELETE and served on the upload — the delete's Admin
  operation class is enforced, and only against the delete.
description: "A clinical-role principal is forbidden from deleting an ADL 1.4 archetype"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.delete_archetype"
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_archetype"
  - "SM openehr_platform master02-overview §Functional Style"
applies: { rm: ">=1.0.2" }
guards:
  - "EXTENSION ROUTE — no openEHR spec governs the /definition/archetype/adl1.4* routes; our own design/extension, declared in vocab/wire_surface.yaml served_extensions (family adl14-archetype) and adjudicated by register AMB-41. The row gates the Adl14ArchetypeProvisioning CAPABILITY verdict only, never ITS-REST wire conformance"
  - "addresses the ixit `sut` instance — the ordinary authenticated principal, which carries no ADMIN role; a party whose default principal IS an administrator cannot drive this boundary and records the case not-applicable with that citation (ISO/IEC 9646 test selection)"
requires: { server: any }
data_sets: [cnf.archetype.adl14.medication]
flow:
  # Addressed at an id the store does not hold: the refusal is a role decision
  # taken before the store is consulted, so a server that answered not_found
  # here would be admitting the caller to the operation.
  - step: 1
    call: delete_archetype
    with: { archetype_id: "openEHR-EHR-EVALUATION.cnf_absent.v99" }
    expect: forbidden                    # universal 403 (route-table-wide)
  # The control: the same principal writes the surface it may not destroy.
  - step: 2
    call: upload_archetype
    with: { archetype_adl14: "${ds:cnf.archetype.adl14.medication}" }
    expect: created
ambiguities: [AMB-41]
