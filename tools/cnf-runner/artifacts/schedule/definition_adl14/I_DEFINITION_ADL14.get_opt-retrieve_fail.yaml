# Official master04 case: retrieving an OPT by an unknown template_id on an
# empty server returns a not-found error.
id: I_DEFINITION_ADL14.get_opt-retrieve_fail
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: "Retrieving a non-existent OPT returns an error identifying the OPT as not present."
description: "Empty server OPT retrieve fail test"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
  - "CNF platform_test_schedule master04 §get_opt-retrieve_fail"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "No OPTs should be loaded on the system"
flow:
  - step: 1
    call: get_opt
    with: { template_id: "cnf.does_not_exist.v1" }   # a random template_id
    expect: not_found                    # "an error related to the non existence of the requested OPT"
    assert:
      - { assert: message_exemplar, text: "information about the non-existent OPT" }
