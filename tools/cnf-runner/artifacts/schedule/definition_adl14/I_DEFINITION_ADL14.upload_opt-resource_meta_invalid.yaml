# The RM common ch.8 resource-package rows over the OPT's own meta-data
# header. The OPT root is AUTHORED_RESOURCE-shaped (ITS-XML v1 AM Template.xsd
# declares language/is_controlled/description/revision_history and its own
# annotation says the operational template "will inherit" from
# AUTHORED_RESOURCE), so the RM class invariants bind the uploaded artefact's
# meta-data; each row carries exactly one defect. The root declares no
# translations element, so Translations_valid/Description_valid (antecedent
# `translations /= Void`) are not expressible at this seam — the ADL 1.4
# source seam carries that family
# (I_DEFINITION_ADL14.upload_archetype-translation_restates_original).
id: I_DEFINITION_ADL14.upload_opt-resource_meta_invalid
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.upload_opt
capabilities: [Adl14OptProvisioning]
exercises: [ArchetypeValidation]
profiles: [CORE]
test_purpose: "OPTs whose own meta-data violates the RM resource-package class invariants are rejected as semantically invalid and leave the server state unchanged."
description: "upload OPTs with RM ch.8 resource-meta defects"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.upload_opt"
  - "RM common master08-resource_package.adoc (the resource package governs ADL 1.4 artefact meta-data)"
  - "RM UML/classes/org.openehr.rm.common.authored_resource.adoc §Invariants; …resource_description.adoc §Invariants; …resource_description_item.adoc §Invariants"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes (the semantic 422 branch, AMB-110)"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.opt.invalid.template_language_not_in_code_set, expected: validation_failed, defect: "root language outside the openEHR languages code set (Original_language_valid)" }
    - { data_set: cnf.opt.invalid.controlled_without_revision_history, expected: validation_failed, defect: "is_controlled without revision_history (Revision_history_valid)" }
    - { data_set: cnf.opt.invalid.description_without_original_author, expected: validation_failed, defect: "description without original_author (Original_author_valid)" }
    - { data_set: cnf.opt.invalid.description_empty_lifecycle_state, expected: validation_failed, defect: "empty lifecycle_state (Lifecycle_state_valid)" }
    - { data_set: cnf.opt.invalid.description_without_details, expected: validation_failed, defect: "description without details (Details_valid)" }
    - { data_set: cnf.opt.invalid.description_duplicate_detail_language, expected: validation_failed, defect: "two details with the same language (details are keyed by language)" }
    - { data_set: cnf.opt.invalid.description_empty_purpose, expected: validation_failed, defect: "empty detail purpose (Purpose_valid)" }
    - { data_set: cnf.opt.invalid.description_item_language_not_in_code_set, expected: validation_failed, defect: "detail language outside the openEHR languages code set (RESOURCE_DESCRIPTION_ITEM.Language_valid)" }
flow:
  - step: 1
    call: upload_opt
    with: { opt: "${ds:fixture}" }
    expect: "${fixture.expected}"
postconditions:
  - assert: state
    text: "No OPTs are loaded on the system"
    verified_by: I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts
verified_by: [I_DEFINITION_ADL14.get_opts-retrieve_all_no_opts]
ambiguities: [AMB-110]
