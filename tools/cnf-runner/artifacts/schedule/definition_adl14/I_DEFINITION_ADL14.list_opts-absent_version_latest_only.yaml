# The ABSENT-`version` branch of the template listing: only the latest
# version of a versioned OPT is listed. The ITS-REST docs text is silent on
# template-list version filtering, so the RELEASED OAS grounds the behaviour
# (oracle order 2026-07-28 — the OAS fills docs-text silence, cited AS the
# OAS): "if missing, then only the latest version will be returned"
# (specifications/parameters/query/filter_version.yaml). The explicit-filter
# branch is the sibling list_opts-version_star_all_versions case.
id: I_DEFINITION_ADL14.list_opts-absent_version_latest_only
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.list_opts
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  Listing templates without a version parameter collapses a versioned OPT
  family to its latest version only.
description: "list templates with `version` absent — latest version only"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.list_opts"
  - "ITS-REST OAS parameters/query/filter_version.yaml (docs-text-silent ground): \"if missing, then only the latest version will be returned\""
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.versioned.v1, cnf.opt.versioned.v2]   # two versions of the one family — provisioned, 409-tolerant on a shared world
data_sets: [cnf.opt.versioned.v1, cnf.opt.versioned.v2]
flow:
  - step: 1
    call: list_opts                        # the variant-less binding: no query parameters, the absent-version branch
    expect: ok
    assert:
      - { assert: returns, matches: "test_versioned\\.en\\.v2", omits: "test_versioned\\.en\\.v1\\b" }
