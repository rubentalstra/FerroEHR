# The two non-default `detail_level` values of the template-example endpoint.
# The default level (`required`) is exercised by the variant-less example
# coverage; this case covers the remaining two declared members, so the whole
# released enum is exercised rather than only its default.
#
# DOCS TEXT (ITS-REST definition_template_adl1.4_example_get — the operation
# `description:` prose is the released docs text for this API group): "The
# level of detail in the generated example can be customized using the
# `detail_level` query parameter. … The supported values are: `required`: a
# minimal composition including only mandatory data points …; `medium`: a
# fairly realistic set of data points, including some optional RM attributes
# and elements; intended to be committable …; `complete`: a full
# representation of all possible data points; not expected to be committable or
# realistic …".
#
# WHAT IS ASSERTED: each declared level is FULFILLED (200) and returns a
# COMPOSITION instance. The level's content characteristics are NOT asserted —
# the same operation states "> NOTE: The implementation and completeness of
# these examples are not specified, and vendors may produce different results",
# so a size/optionality comparison between levels would be an authored
# expectation, not a released one. Register: AMB-115.
id: I_DEFINITION_ADL14.get_opt-example_detail_levels
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [TemplateExamples]
profiles: [OPTIONS]        # the tier of TemplateExamples (#545: example generation never gates CORE)
test_purpose: >-
  Both non-default detail levels of the template example (medium, complete) are
  fulfilled and return a COMPOSITION instance in the negotiated format.
description: "get a template example at detail_level medium and complete"
spec_refs:
  - "ITS-REST specifications §definition_template_adl1.4_example_get"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example_detail_medium
    format: canonical-json
    with: { template_id: "minimal_action.en.v1" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
  - step: 2
    call: get_opt
    variant: example_detail_complete
    format: canonical-json
    with: { template_id: "minimal_action.en.v1" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
ambiguities: [AMB-115]
