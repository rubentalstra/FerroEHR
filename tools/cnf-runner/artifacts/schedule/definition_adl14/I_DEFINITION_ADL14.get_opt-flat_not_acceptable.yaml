# An OPT read asking for the Simplified FLAT representation cannot be
# fulfilled — that format is a COMPOSITION data format, not a template
# definition — so it is refused rather than answered in a representation the
# client did not ask for.
#
# Decisive released sentence (ITS-REST docs/overview/Resources.md §"Simplified
# Formats"): "The client SHOULD use the `Accept` request header to specify the
# expected simplified response format. If the service cannot fulfill this
# aspect of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`."
#
# That the request cannot be fulfilled comes from the SAME section's own
# media-type roster, which assigns each simplified type its subject:
# "`application/openehr.wt.flat+json` for the Simplified Flat JSON format,
# `application/openehr.wt.structured+json` for the Simplified Structured JSON
# format, `application/openehr.wt+json` for the Operational Template
# definition as Web Template JSON format". Exactly ONE of the three names the
# Operational Template, and it is not the flat one — so an OPT resource has no
# `application/openehr.wt.flat+json` representation to serve. Corroborated by
# docs/overview/Requests_and_responses.md §"HTTP status codes", row `406 Not
# Acceptable`: "The target resource does not have a current representation that
# would be acceptable to the user".
#
# The template IS provisioned, so a 404 would be the wrong answer and the case
# bites on a server that ignores the Accept and serves the OPT XML anyway. The
# fulfillable siblings are SF-WT-web_template_get (`wt`, the named template
# representation) and get_opt-retrieve_single (the canonical OPT XML).
id: I_DEFINITION_ADL14.get_opt-flat_not_acceptable
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [Adl14OptProvisioning]
profiles: [CORE]
test_purpose: >-
  An OPT retrieval requested in the Simplified Flat JSON format is refused as
  not acceptable, never answered in a representation the client did not ask
  for.
description: "Retrieve an OPT with Accept: application/openehr.wt.flat+json (406)"
spec_refs:
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    format: wt-flat                      # the unfulfillable Accept: application/openehr.wt.flat+json
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: not_acceptable
