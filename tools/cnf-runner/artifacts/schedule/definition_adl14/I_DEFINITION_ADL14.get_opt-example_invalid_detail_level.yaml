# A `detail_level` value OUTSIDE the declared enum is a client error, not a
# silently substituted level.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §HTTP status codes,
# row 400): "The service cannot or will not process the request due to
# something that is perceived to be a client error (e.g., malformed request
# syntax, syntactically invalid content)", reinforced by the same section's
# "Status code `400` indicates normally a bad request, as well as a generic
# client-side error, used when no other `4xx` error code is appropriate". The
# released `detail_level` parameter declares a CLOSED enum ([required, medium,
# complete], default required), so `verbose` is a syntactically invalid
# parameter value and the operation's declared 400 branch is the answer.
#
# This is distinct from the operation's fall-back latitude ("When the server
# does not support the requested `type` or `detail_level`, it will fall back to
# the closest supported level, or it may return an error (typically `400 Bad
# Request`)"), which concerns an enum member a server has not IMPLEMENTED; an
# out-of-enum value has no closest supported level to fall back to. Our
# position on the latitude itself — the error branch, never a silent
# substitution — is register entry AMB-115.
#
# One behaviour per case: the same loaded template and the same default `type`
# the fulfilled example cases use, so only the out-of-enum value distinguishes
# this exchange.
id: I_DEFINITION_ADL14.get_opt-example_invalid_detail_level
kind: functional
component: DEFINITION_ADL14
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [TemplateExamples]
profiles: [OPTIONS]        # the tier of TemplateExamples (#545: example generation never gates CORE)
test_purpose: >-
  A template-example request naming a detail_level outside the declared enum is
  refused as a client error rather than answered with a substituted level.
description: "get a template example with an out-of-enum detail_level"
spec_refs:
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
  - "ITS-REST specifications §definition_template_adl1.4_example_get"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # the template `/example` sub-resource arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-58)
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example_invalid_detail_level
    with: { template_id: "minimal_action.en.v1" }
    expect: bad_request            # §HTTP status codes row 400 — syntactically invalid parameter
ambiguities: [AMB-115]
