# The class-S sustained hospital-simulation case — conformance-by-
# measurement. The offered load is OPEN-LOOP (a seeded arrival schedule,
# never closed-loop users) so coordinated omission cannot hide stalls; the
# class floors are the published population-anchored defaults (upstream
# ratification owns changes); p99 <= 1 s is the standard SLO the committed
# knee-ladder methodology already publishes.
#
# The workload is journey-structured: arrival_rate stays aggregate
# OPERATION arrivals (the class floor's unit, 100k-population floor); the journey
# shares decompose it through vocab/journey_catalogue.yaml into the full
# platform surface (ADT, demographic administration, order->result, eMAR,
# monitoring, review, analytics, folders, corrections, audit, tags,
# templates + examples + ADL 2, Simplified Formats, version provenance,
# client bootstrap, access-control boundary), write share reconciled to the
# 10:1..50:1 derivation band (validator-enforced).
id: PERF-hospital_sim-class_S
kind: performance
component: PERFORMANCE
description: "Class-S sustained hospital-simulation workload"
test_purpose: >-
  Under the class-S normative offered load, decomposed into clinical
  journeys over the whole claimed platform surface, the platform sustains
  the class-S latency and throughput thresholds on every operation.
spec_refs: ["CNF 2.0 performance schedule §classes (this proposal; 2017 schedule lineage)"]
class: S
corpus: cnf.scale.100k
workload:
  arrival_rate: 15/s
  warmup: PT5M
  duration: PT1H
  journeys:
    chart_review: 52.6%
    ward_dashboard: 12%
    vitals_round: 6%
    audit_review: 4%
    integration_poll: 4%
    correction: 3%
    tagging: 2%
    signature_review: 2%
    analytics_review: 1.5%
    medication_round: 1.5%
    medicines_reconciliation: 1.5%
    lab_pipeline: 1.5%
    specialist_report: 1.5%
    registry_submission: 1.5%
    imaging_pipeline: 1%
    admission: 0.8%
    discharge: 0.8%
    platform_probe: 0.5%
    simplified_formats_exchange: 0.5%
    access_control_probe: 0.5%
    demographic_admission: 0.4%
    public_health_notification: 0.3%
    case_investigation: 0.3%
    deletion: 0.3%
thresholds:
  - { metric: latency_p99, max: 1000 }
  - { metric: error_rate, max: 0 }
  - { metric: offered_load_sustained, min: 15 }
# environment: bound to the mandatory ixit.json environment block
