# The RELEASED System API's one operation, exercised at the only depth the
# released docs text supports: OPTIONS on the API base path answers 200 and
# carries the `Allow` header.
#
# ANCHOR: `I_ITS_REST_SYSTEM.options` is a reserved catalogue pseudo-interface
# (register AMB-160), not an SM operation — the SM defines no System component.
# It is pinned in NON_SM_REST_OPERATIONS (tools/cnf-runner/src/validate.rs), the
# ITS-side half of the Axis-1 enumeration domain, so this operation is
# enumerated and held to the same coverage obligation as an SM one.
#
# COMPONENT: `SYSTEM` is not a token of the case-core component vocabulary — the
# component axis IS the CNF Platform Test Schedule's chapter taxonomy and that
# schedule has no System chapter (its functional chapters are master04-master13).
# `ADMIN` (master12) is the closest legal chapter: a service-level operation
# about the deployment itself rather than about EHR content. The token is
# taxonomy only — the runner reads `component` for no functional purpose outside
# PERFORMANCE — and the conformance visuals derive their chapter from the case
# id, which puts this case in "Other".
#
# TIER: OPTIONS, honestly. The System API is STABLE
# (specifications/docs/system/Description.md §Status: "This specification is in
# the `STABLE` state"), but the CNF Profiles book's REST-APIs table has no
# SYSTEM row at all (CNF profiles master03-profiles.adoc §Functional lists
# DEFINITION, EHR, DEMOGRAPHIC, QUERY, ADMIN, MESSAGE), and the one released
# sentence about the method is descriptive, not an RFC 2119 requirement
# (specifications/docs/overview/Requests_and_responses.md §HTTP Methods:
# "| OPTIONS | Describe the communication options for the target resource. |").
# So no released MUST binds a service to serve it, and the capability may not
# gate CORE or STANDARD — the same reasoning the matrix records on SystemApi.
#
# SCOPE: 200 + `Allow` and nothing more. The response BODY (the Options
# conformance manifest) and the resource the operation is served on are
# described by no released sentence — register AMB-159 carries that silence and
# its upstream report — so this case asserts neither.
id: I_ITS_REST_SYSTEM.options-conformance_manifest
kind: functional
component: ADMIN
sm_operation: I_ITS_REST_SYSTEM.options
capabilities: [SystemApi]
profiles: [OPTIONS]
test_purpose: >-
  OPTIONS on the API base path answers 200 and carries the Allow header,
  describing the communication options for that resource.
description: "System API OPTIONS answers 200 with Allow"
spec_refs:
  - "ITS-REST system Description.md §Status"
  - "ITS-REST overview Requests_and_responses §HTTP Methods"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
ambiguities: [AMB-159, AMB-160]
flow:
  - step: 1
    call: options
    expect: ok
