# A present-but-empty `DV_PARAGRAPH.items` is refused at the directory-UPDATE seam, inside `FOLDER.details`.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM `UML/classes/org.openehr.rm.data_types.dv_paragraph.adoc` §Attributes
# types `DV_PARAGRAPH.items: List<DV_TEXT>` at 1..1 — a MANDATORY list, so a present-but-EMPTY list is the one shape the bound
# forbids — the way to say "none" is to omit an optional container, never
# to send [].
#
# WHICH BRANCH: a mandatory list cannot be constructed empty, so the body
# never converts to the resource. ITS-REST `responses/400.yaml` scopes 400 to
# "syntactically invalid ... content"; `responses/422.yaml` scopes 422 to
# content that "could be converted to a resource" and then fails semantic
# validation. This body cannot be converted — the 400 row.
#
# The ACCEPTING twin is the populated DV_TEXT leaf every valid composition fixture
# carries (cnf.composition.minimal_event.v1, committed by dozens of cases).
id: I_EHR_DIRECTORY.update_directory-paragraph_no_items
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.update_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  A body carrying a DV_PARAGRAPH whose mandatory items list is present but empty is refused as invalid content at this seam, and nothing is committed.
description: "DV_PARAGRAPH with an empty items list refused (the directory-UPDATE seam)"
spec_refs:
  - "RM data_types §DV_PARAGRAPH (items: List<DV_TEXT>, 1..1)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.paragraph_no_items]
flow:
  - step: 1                              # v1 — gives the update a real preceding version
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2                              # correct If-Match, unconvertible content
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.paragraph_no_items}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: bad_request
  - step: 3                              # nothing was committed by the refused request
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
