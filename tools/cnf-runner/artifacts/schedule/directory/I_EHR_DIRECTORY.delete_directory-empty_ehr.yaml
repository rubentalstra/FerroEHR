# delete_directory on an EHR with no directory errors: there is no directory to
# delete (SM Pre_has_directory). Realized as a 404. The wire-required If-Match
# IS sent (a synthetic value; the OAS marks the header required) — RFC 9110
# §13.2.2 precedence makes the missing-resource 404 win over precondition
# evaluation (AMB-26).
id: I_EHR_DIRECTORY.delete_directory-empty_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.delete_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  delete_directory on an EHR that has no directory is rejected: there is no
  directory to delete.
description: "Test delete_directory on empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.delete_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.delete_directory-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
flow:
  - step: 1
    call: delete_directory
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "11111111-1111-4111-8111-111111111111::cnf.fake::1" }   # wire-required If-Match value; the negative is the unknown ehr
    expect: not_found                     # "the non existent directory" (SM Pre_has_directory; AMB-26)
ambiguities: [AMB-26]
