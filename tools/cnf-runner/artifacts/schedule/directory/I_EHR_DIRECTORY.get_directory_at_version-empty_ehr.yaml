# get_directory_at_version on an EHR with no directory, for a random version uid,
# errors: the directory version does not exist. Realized as a 404.
id: I_EHR_DIRECTORY.get_directory_at_version-empty_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_version
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  get_directory_at_version for a random version uid on an EHR without a directory
  is rejected: the directory version does not exist.
description: "Test get_directory_at_version on empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_version"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_version-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
flow:
  - step: 1
    call: get_directory_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "11111111-1111-4111-8111-111111111111::cnf.example.org::1" }
    expect: version_not_found             # "the non-existence of the EHR directory version"
