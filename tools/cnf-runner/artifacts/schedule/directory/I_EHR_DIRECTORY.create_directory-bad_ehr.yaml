# create_directory on a non-existent EHR errors on the missing EHR (SM
# Pre_has_ehr) — realized as a 404.
id: I_EHR_DIRECTORY.create_directory-bad_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory on a random ehr_id when no EHRs exist is rejected: the EHR
  does not exist.
description: "Test create_directory on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.create_directory-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty"
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "11111111-1111-4111-8111-111111111111", directory: "${ds:cnf.directory.root_only}" }
    expect: not_found                     # "the EHR that doesn't exist"
