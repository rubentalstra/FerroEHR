# WHICH version identity the successful directory delete's 204 carries — the
# addressed (preceding) version, or the 523|deleted| version the delete just
# created — and that the 204 carries the commit instant alongside it.
#
# SPEC SILENCE, adjudicated as AMB-75 (fixed_handling): the released response
# file for this branch (204_deleted.yaml) is one sentence about the status code
# and declares no headers at all. What IS released decides it by construction:
# RM common master06 §Logical Deletion makes the delete a COMMIT — "create a
# new Version in the normal way; delete its `_data_`; set the
# `_lifecycle_state_` value to the code for `deleted`; commit in the normal
# way" — and ITS-REST overview Requests_and_responses.md §"ETag and
# Last-Modified" says the entity tag names the resource's CURRENT state: it
# "acts as a unique identifier for a specific version of a resource" and
# "changes as soon as the resource changes (i.e. when a new version is
# created)". After the delete, the current state IS the new deleted version, so
# the ETag names it. The same section carries the companion header — "Both
# `ETag` and `Last-Modified` SHOULD be included in responses for VERSION,
# VERSIONED_OBJECT, or other resources that have versioning or unique state
# identifiers", with `Last-Modified` "derived from
# VERSION.commit_audit.time_committed.value" — which the delete supplies,
# because it just committed one.
#
# What is EXECUTED here: the binding's `deleted` outcome matchers assert the
# weak entity-tag shape over THIS container (`W/"<versioned_object_uid>::…"`,
# the weakness indicator being the §Deprecated headers MUST) and
# `Last-Modified: present`. The version-2 discrimination rides the uid_pattern
# postcondition below, and — independently and executably — the sibling
# get_directory_at_version-deleted_version case, which reads the captured uid
# back and gets 204: had the ETag echoed the addressed v1 uid, that read would
# return v1's live content with a 200 instead.
id: I_EHR_DIRECTORY.delete_directory-etag_names_new_version
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.delete_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-75]
test_purpose: >-
  The 204 of a successful directory delete carries the uid of the NEW
  523|deleted| version the delete committed — not the addressed preceding one —
  together with the commit instant in Last-Modified.
description: "Delete the directory: the 204 names the new deleted version"
spec_refs:
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "SM openehr_platform §I_EHR_DIRECTORY.delete_directory"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid          # …::1, the addressed version
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: delete_directory
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }         # read from the 204's ETag
    assert:
      # the entity tag names version 2 — the version the delete committed —
      # which the addressed …::1 uid cannot be
      - { assert: version, of: "${deleted_uid}", uid_pattern: "${versioned_object_uid}::<system>::2" }
postconditions:
  - { assert: version, count: 2 }
  - { assert: version, of: "${deleted_uid}", change_type: DELETED, lifecycle_state: "openehr::523|deleted|" }
  - { assert: version, of: "${preceding_version_uid}", change_type: CREATE }
