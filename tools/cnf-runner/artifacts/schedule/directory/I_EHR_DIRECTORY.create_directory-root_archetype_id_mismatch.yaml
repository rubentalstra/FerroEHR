# The SEMANTIC refusal twin on the directory-CREATE seam: the same
# root-identity defect as the update-seam sibling — the FOLDER converts
# (every slot decodes to its declared RM type) and fails the archetype-root
# identity rule, `responses/422.yaml`'s "could be converted to a resource,
# but there are semantic validation errors" branch. Ground: RM common
# UML/classes/org.openehr.rm.common.locatable.adoc §Attributes
# (`archetype_node_id` … "at archetype root points, this is the archetype
# identifier") + §Invariants Archetyped_valid; SM i_ehr_directory.adoc
# §create_directory Pre_content_valid over SM i_validity_checker.adoc
# §content_valid. The unconvertible 400 half is the -invalid_folder sibling.
id: I_EHR_DIRECTORY.create_directory-root_archetype_id_mismatch
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a root FOLDER whose archetype_node_id contradicts its
  archetype_details.archetype_id is rejected as a semantic error and no
  directory comes into existence.
description: "Create the directory from a FOLDER whose root archetype identity is contradictory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "RM common §locatable (archetype_node_id; Archetyped_valid)"
  - "RM common master05-directory_package §Overview"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.invalid.root_archetype_id_mismatch]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.invalid.root_archetype_id_mismatch}" }
    expect: validation_failed
  - step: 2                              # the refused create left no directory
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: >-
      No directory exists on the EHR: the refused create committed nothing
      (verified by step 2)
