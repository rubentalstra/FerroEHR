# A DEACTIVATED EHR refuses content writes — and its hierarchical Folders are
# content.
#
# The rule is RM, stated outright (RM ehr master04-ehr_package.adoc §EHR Active
# Status): "The `EHR_STATUS._is_modifiable_` attribute is used to indicate
# whether _the contents of an EHR_ are modifiable, and is set to `True` if the
# EHR is considered _active_. An EHR's 'contents' consist of everything other
# than the `EHR_STATUS` object, i.e. its Compositions (Versioned objects
# referred to by the `_compositions_` attribute), its hierarchical Folders
# (Versioned objects referred to by the `_folders_` attribute) and any other
# content that may be added in later releases of this specification." Folders
# are named explicitly, so the directory is in scope of the refusal.
#
# SPEC SILENCE on the CODE, adjudicated as AMB-82 (fixed_handling): the
# ITS-REST docs text never mentions `is_modifiable` at all outside the
# EHR-creation defaults (grep of specifications/docs/**: zero hits), and no
# directory operation declares a branch for a deactivated EHR. The register's
# fixed handling is 409, the row ITS-REST overview Requests_and_responses.md
# §HTTP status codes describes as "Indicates that the request could not be
# processed because it might generate a duplicate or a conflict" — the request
# conflicts with the resource's current state.
#
# The deactivation is performed through the wire, not assumed: ITS-REST has no
# field-level setter, so `clear_ehr_modifiable` is the read-modify-write of the
# whole EHR_STATUS. That EHR_STATUS itself stays writable while the EHR is
# deactivated is the RM's own carve-out ("everything other than the
# `EHR_STATUS` object") and is what makes the flow expressible at all —
# otherwise no client could ever reactivate an EHR.
#
# Step 4 keeps the refusal honest: the create really committed nothing, so the
# EHR still has no directory (404, not the 204 a deleted one would give).
id: I_EHR_DIRECTORY.create_directory-ehr_not_modifiable
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
exercises: [EhrStatus]
profiles: [STANDARD]
ambiguities: [AMB-82]
test_purpose: >-
  Creating a directory in an EHR whose EHR_STATUS.is_modifiable is false is
  refused as a conflict with the EHR's deactivated state, and commits nothing.
description: "Create a directory in a deactivated EHR"
spec_refs:
  - "RM ehr §EHR Active Status (master04 — is_modifiable scopes to Compositions and hierarchical Folders)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_EHR_STATUS.clear_ehr_modifiable"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_modifiable = true
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status    # the payload the PUT modifies + the If-Match precondition
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2                              # deactivate: is_modifiable -> false
    call: I_EHR_STATUS.clear_ehr_modifiable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: conflict
  - step: 4                              # nothing was committed: the EHR still has no directory
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: >-
      The refused create committed no directory version: the deactivated EHR
      still has no directory at all (verified by step 4)
