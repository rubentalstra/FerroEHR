# has_directory on a non-existent EHR errors on the missing EHR — realized as a
# 404 (not_found). "A random non-existent ehr_id" is a fixed arbitrary UUID
# absent on an empty server.
id: I_EHR_DIRECTORY.has_directory-bad_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  has_directory on a random ehr_id when no EHRs exist is rejected: the EHR does
  not exist.
description: "Test has_directory on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_directory-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "There are no EHRs on the server"
flow:
  - step: 1
    call: has_directory
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: not_found                     # "error ... that the EHR doesn't exist"
