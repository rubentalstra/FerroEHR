# get_versioned_directory on a non-existent EHR errors on the missing EHR.
# ITS-REST 1.1.0 surfaces no versioned_directory endpoint, so the its-rest
# binding is unrealized and this case verdicts not-applicable-with-citation on
# this ITS (AMB-24).
id: I_EHR_DIRECTORY.get_versioned_directory-bad_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_versioned_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  get_versioned_directory on a random ehr_id when no EHRs exist is rejected: the
  EHR does not exist.
description: "Test get_versioned_directory on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_versioned_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_versioned_directory-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server doesn't have any EHRs"
flow:
  - step: 1
    call: get_versioned_directory
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: not_found                     # "the non existence of the EHR"
