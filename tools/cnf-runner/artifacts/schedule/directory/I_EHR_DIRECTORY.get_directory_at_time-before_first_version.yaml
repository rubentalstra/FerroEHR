# The lower edge of the directory at-time branch, pinned to a FIXED instant:
# below the first commit there is no version of this directory.
#
# RM common versioned_object.adoc §Functions guards the accessor with
# `Pre: has_version_at_time (a_time)` — below the first commit the precondition
# is false, so there is no VERSION whose data the route could serve — and the
# operation's own 404 response file says the same from the wire side: "`404 Not
# Found` is returned when an EHR with `ehr_id` does not exist, or when a
# directory does not exist at the specified `version_at_time`, or when `path`
# does not exist within the directory." ITS-REST overview
# Requests_and_responses.md §HTTP status codes gives the row its meaning:
# "404 | Not Found | The origin service did not find the target resource or is
# not willing to disclose that one exists".
#
# The sibling ehr_with_directory_versions case walks the same edge with the
# CAPTURED commit instants (`${time:before(t0)}`); this one is the
# clock-independent form: a fixed literal in the extended ISO 8601 shape
# Resources.md §Datetime format requires, deterministic without any capture
# because the runner seeds a freshly composed, empty SUT and every commit in
# the run is later than the year 2000. Register AMB-70 carries the extancy
# handling both forms pin.
id: I_EHR_DIRECTORY.get_directory_at_time-before_first_version
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-70]
test_purpose: >-
  A directory at-time read for an instant earlier than the first committed
  version finds no version and is refused as not found.
description: "Get the directory at time, before the first version"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "ITS-REST overview Resources §Datetime format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
  - step: 2
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}", a_time: "2000-01-01T00:00:00Z" }
    expect: not_found
