# get_directory on an EHR with no directory. The schedule expects an empty
# structure, "NOTE: in a REST API implementation, the result could be an error
# status instead" (AMB-8). ITS-REST 1.1.0 has no 200 empty-structure body for a
# missing directory, so the realized branch is the error one
# (option: directory-empty-error -> 404).
id: I_EHR_DIRECTORY.get_directory-empty_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
option: directory-empty-error
test_purpose: >-
  get_directory on an EHR without a directory yields the empty-directory
  outcome; on ITS-REST that is the error branch (no directory to return).
description: "Test get_directory on empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
flow:
  - step: 1
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found                     # AMB-8 error branch: no directory (empty-structure branch is unrealized on ITS-REST 1.1.0)
ambiguities: [AMB-8]
