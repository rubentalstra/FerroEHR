# update_directory on an EHR with a directory replaces its structure with a new
# complete FOLDER, creating a new ORIGINAL_VERSION and CONTRIBUTION. The
# directory is created in-flow so its version uid is known (the required
# If-Match / preceding_version_uid). The update is verified through get_directory.
id: I_EHR_DIRECTORY.update_directory-ehr_with_directory
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.update_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  update_directory on an EHR with a directory and the correct preceding version
  succeeds and the EHR then has the updated directory structure.
description: "Test update_directory on EHR with directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.update_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.update_directory-ehr_with_directory"
  - "RM common §change_control (new ORIGINAL_VERSION and CONTRIBUTION)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
  - step: 3
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.v2}", ignoring: server_assigned }
postconditions:
  - assert: state
    text: "The EHR ehr_id has an updated directory structure (verified by step 3)"
