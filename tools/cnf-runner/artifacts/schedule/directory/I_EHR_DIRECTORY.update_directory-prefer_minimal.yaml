# The `Prefer: return=minimal` verbosity branch of the directory update.
#
# The status comes from register AMB-62's re-adjudication: the docs text states
# two answers for the minimal branch and settles on neither, so the released OAS
# fills the silence per operation family — `operations/directory_update.yaml`
# declares both 200 and 204, and `responses/204_version_updated.yaml` reads
# "`204 No Content` is returned when the update operation was successful and the
# `Prefer` header is missing or is set to `return=minimal`".
#
# A 204 carries no body, so step 3 reads the directory back and finds the new
# structure — the empty answer still committed the version.
id: I_EHR_DIRECTORY.update_directory-prefer_minimal
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.update_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-62]
test_purpose: >-
  A directory update sent with Prefer: return=minimal answers 204 No Content and
  the new structure is committed.
description: "Prefer: return=minimal honoured on directory update"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_EHR_DIRECTORY.update_directory"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: update_directory
    variant: return_minimal              # pins Prefer: return=minimal
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated                      # 204 No Content
  - step: 3                              # the empty answer still committed the new structure
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.v2}", ignoring: server_assigned }
