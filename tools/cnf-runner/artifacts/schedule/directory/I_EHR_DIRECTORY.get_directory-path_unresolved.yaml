# The declared failure trigger of the same parameter: a `path` that resolves to
# no FOLDER is a miss, not an empty success and not a silent fallback to the
# root.
#
# Decisive docs-text sentence, the operation's own 404 response file (ITS-REST
# specifications/responses/404_directory_unknown_ehr_id_or_no_version_at_time_
# or_no_path.yaml): "`404 Not Found` is returned when an EHR with `ehr_id` does
# not exist, or when a directory does not exist at the specified
# `version_at_time`, or when `path` does not exist within the directory." The
# third clause is this case. ITS-REST overview Requests_and_responses.md §HTTP
# status codes gives the row its meaning: "404 | Not Found | The origin service
# did not find the target resource or is not willing to disclose that one
# exists".
#
# The path is deliberately a DEEP miss whose PREFIX exists — `/emergency` is a
# real sub-folder of the reference tree, `episode_z` is not its child — so the
# case separates "the whole path resolved" from "some prefix resolved". A
# server that stopped at the deepest resolvable ancestor and served
# `/emergency` would answer 200 here and go red, which is the silent-fallback
# failure mode the sibling path_sub_folder case cannot catch on its own.
# Register AMB-81 carries the fixed handling: navigate folders only, answer 404
# for an unresolved path (the declared trigger).
id: I_EHR_DIRECTORY.get_directory-path_unresolved
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
ambiguities: [AMB-81]
test_purpose: >-
  A latest-directory read carrying a `path` that does not exist within the
  directory is refused as not found, never answered with an ancestor folder.
description: "Get the directory narrowed by an unresolvable path"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
applies: { rm: ">=1.0.2" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.reference_structure   # the reference tree; /emergency exists, /emergency/episode_z does not
flow:
  - step: 1
    call: get_directory
    variant: path                        # the variant binding adds the `path` query parameter
    with: { ehr_id: "${ehr_id}", a_path: "/emergency/episode_z" }
    expect: not_found
