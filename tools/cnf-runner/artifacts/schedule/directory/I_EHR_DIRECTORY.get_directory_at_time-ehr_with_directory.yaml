# get_directory_at_time at the current time on an EHR with a one-version
# directory returns the current directory. The directory is created in-flow so
# its commit instant t0 anchors the "current time" query (${time:after(t0)}).
id: I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  get_directory_at_time at the current time on an EHR with a one-version
  directory returns that directory.
description: "Test get_directory_at_time on EHR with directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { t0: created.commit_time }
  - step: 2
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}", a_time: "${time:after(t0)}" }   # current time -> the latest version
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: committed, ignoring: server_assigned }
