# get_directory_at_time with empty (omitted) time on an EHR with no directory.
# Empty time -> latest; on an EHR with no directory this is the AMB-8
# empty-vs-error case, realized as the error branch (404) on ITS-REST.
id: I_EHR_DIRECTORY.get_directory_at_time-empty_ehr_empty_time
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
option: directory-empty-error
test_purpose: >-
  get_directory_at_time with empty time on an EHR without a directory yields the
  empty-directory outcome; on ITS-REST that is the error branch.
description: "Test get_directory_at_time on empty EHR with empty time"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_time-empty_ehr_empty_time"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
flow:
  - step: 1
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}" }         # empty time -> version_at_time omitted
    expect: not_found                     # AMB-8 error branch: no directory
ambiguities: [AMB-8]
