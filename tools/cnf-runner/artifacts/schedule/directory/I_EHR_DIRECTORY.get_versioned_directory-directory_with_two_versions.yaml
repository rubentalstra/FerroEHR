# get_versioned_directory on an EHR whose directory has two versions returns the
# VERSIONED_FOLDER container referencing both versions. Both versions are created
# in-flow. ITS-REST 1.1.0 surfaces no versioned_directory endpoint, so the
# its-rest binding is unrealized and this case verdicts
# not-applicable-with-citation on this ITS (AMB-24).
id: I_EHR_DIRECTORY.get_versioned_directory-directory_with_two_versions
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_versioned_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  get_versioned_directory returns the VERSIONED_FOLDER referencing the two
  existing directory versions.
description: "Test get_versioned_directory on EHR that has two versions of directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_versioned_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_versioned_directory-directory_with_two_versions"
  - "RM common §change_control (VERSIONED_OBJECT / VERSIONED_FOLDER)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (AMB-3)
    expect: updated
  - step: 3
    call: get_versioned_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: VERSIONED_FOLDER }
ambiguities: [AMB-3]
