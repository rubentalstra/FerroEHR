# The `path` query parameter NAVIGATES: supplied on the latest-directory read,
# it changes WHAT IS SERVED — the addressed sub-FOLDER, not the root.
#
# Decisive docs-text sentence, the operation's own description (ITS-REST
# specifications/operations/directory_get_at_time.yaml): "If `path` is
# supplied, retrieves from the directory only the sub-FOLDER that is associated
# with that path."
#
# The GRAMMAR of the parameter is spec-silent beyond one sentence — "consists
# of slash-separated values of the name attribute of FOLDERs in the directory"
# (parameters/query/path.yaml), with the example `episodes/a/b/c` — which
# leaves unstated whether a leading slash is permitted, whether the root
# FOLDER's own name is a segment, how duplicate sibling names disambiguate, and
# how a slash inside a name escapes. Register AMB-81 (fixed_handling) resolves
# it root-implicitly: segments name SUB-folders, the root's own name is not a
# segment, a leading slash is tolerated. This case pins that reading with the
# two-segment path `/emergency/episode_x` against the reference tree, whose
# root FOLDER is named `root` — so a server treating the root name as segment 1
# would find nothing and answer 404 instead.
#
# The assertions prove NAVIGATION rather than mere success. A server that
# ignored `path` and served the whole directory would return 200 with
# `name/value` = "root" and `folders[0]/name/value` = "emergency"; both
# assertions would go red. Asserting the sub-folder's own CHILD as well pins
# that the served node is the sub-tree rooted at `episode_x`, not a stripped
# stub carrying only its name.
id: I_EHR_DIRECTORY.get_directory-path_sub_folder
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
ambiguities: [AMB-81]
test_purpose: >-
  A latest-directory read carrying a `path` naming a nested sub-FOLDER serves
  that sub-FOLDER as the response body, not the directory root.
description: "Get the directory narrowed by a path to a nested sub-folder"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM ehr §FOLDER (name, folders)"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.reference_structure   # the reference tree (provisioned; root -> emergency -> episode_x -> summary_compo_x)
flow:
  - step: 1
    call: get_directory
    variant: path                        # the variant binding adds the `path` query parameter
    with: { ehr_id: "${ehr_id}", a_path: "/emergency/episode_x" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      # the served node IS the addressed sub-folder …
      - { assert: field, path: "name/value", equals: "episode_x" }
      # … carrying its own sub-tree, so it is the real node, not a stub
      - { assert: field, path: "folders[0]/name/value", equals: "summary_compo_x" }
