# The ID-WIDTH sibling of create_directory-with_items: a FOLDER whose `items`
# reference is VERSION-PINNED — an OBJECT_REF to a COMPOSITION whose id is a
# three-part OBJECT_VERSION_ID — is accepted and reads back with all three
# parts intact.
#
# WHY THIS IS A REQUIRED BEHAVIOUR. RM common
# UML/classes/org.openehr.rm.common.folder.adoc §Attributes types `items` as
# `List<OBJECT_REF>` (0..1), and BASE base_types
# UML/classes/org.openehr.base.base_types.object_ref.adoc §Attributes types the
# member's `id` as `OBJECT_ID` (1..1) — the abstract root, not one chosen
# subtype. OBJECT_VERSION_ID is a concrete member of that family (its own class
# table's *Inherit* row: `UID_BASED_ID`, which inherits `OBJECT_ID`) and is
# defined precisely as the version-pinned form: "Globally unique identifier for
# one version of a versioned object; lexical form: `object_id '::'
# creating_system_id '::' version_tree_id`"
# (…base_types.object_version_id.adoc §Description). So a directory that
# classifies ONE PARTICULAR VERSION of a composition — rather than its version
# container — is an ordinary instance of the released model, and the released
# ITS-REST schema for the very same slot carries exactly that shape as its own
# example: specifications/schemas/base_types/ObjectRef.yaml `example` is
# `{id: {_type: OBJECT_VERSION_ID, value: 'fb458d9c-…::openEHRSys.example.com::1'},
# namespace, type: COMPOSITION}` — the id value this fixture uses verbatim
# (the namespace is `openEHRSys.example.com`, the creating system the id
# itself names: re-adjudicated 2026-08-18, issue #1951, register AMB-211 —
# a foreign reference's target stands free; a THIS-system claim must resolve,
# pinned by create_directory-local_dangling_item).
#
# WHAT A NON-CONFORMANT SERVER DOES HERE, and why the case is worth its row:
# the plausible narrow implementation stores a folder reference as a bare UUID
# (the shape cnf.directory.with_items uses) and either REFUSES the three-part
# value as malformed or silently TRUNCATES it to its leading object_id —
# destroying the version coordinate that was the whole point of the reference.
# The refusal is caught by step 1, the truncation by step 2: `equivalent`
# against the committed payload fails on any rewriting anywhere in the tree,
# and the `field` assertions name the two halves — the `_type` discriminator
# and the full three-part `value` — so a red row says "the version pin was not
# preserved" rather than "the directory came back different".
#
# The narrowing the RELEASED OAS applies to this slot (`Folder.yaml` `items` ->
# `UObjectRefOfUidBasedId` -> `UUidBasedId`, a `oneOf` of HIER_OBJECT_ID and
# OBJECT_VERSION_ID only) is registered as AMB-186; it does not bear on this
# case, because OBJECT_VERSION_ID is inside BOTH readings. The wide half of
# that register entry is asserted by create_directory-wide_id_items.
#
# As in cnf.directory.with_items, nothing here asserts that the target exists:
# BASE object_ref.adoc §Description states the referenced object "may exist
# locally or be maintained outside the current namespace, e.g. in another
# service", so the id stands free.
id: I_EHR_DIRECTORY.create_directory-versioned_id_items
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a FOLDER whose items reference carries a three-part
  OBJECT_VERSION_ID succeeds and the stored directory reads back with the
  version-pinned reference intact.
description: "Create a directory whose items reference is version-pinned (OBJECT_VERSION_ID)"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
  - "RM common §folder (items: List<OBJECT_REF>, 0..1)"
  - "BASE base_types §OBJECT_REF (id: OBJECT_ID, 1..1)"
  - "BASE base_types §OBJECT_VERSION_ID (object_id '::' creating_system_id '::' version_tree_id)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.versioned_id_items]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.versioned_id_items}" }
    expect: created
    assert:
      - { assert: instance_of, rm_type: FOLDER }
  - step: 2                              # the version pin survived the round trip
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.versioned_id_items}", ignoring: server_assigned }
      # The discriminator and the full three-part value, named separately, so a
      # truncation to the leading object_id localizes to this behaviour.
      - { assert: field, path: "items[0]/id/_type", equals: "OBJECT_VERSION_ID" }
      - { assert: field, path: "items[0]/id/value", equals: "fb458d9c-1323-42bc-b7f8-787f3660a0b5::openEHRSys.example.com::1" }
