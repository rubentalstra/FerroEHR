# The same navigation on the OTHER directory GET route: the `path` parameter is
# declared on the by-version operation too, so a client can address a
# sub-FOLDER of a SPECIFIC directory version.
#
# Decisive docs-text sentence, the operation's own description (ITS-REST
# specifications/operations/directory_get_by_version_id.yaml): "If `path` is
# supplied, retrieves from the directory only the sub-FOLDER that is associated
# with that path." The operation lists `../parameters/query/path.yaml` among
# its parameters, so the pairing is symmetric with the at-time route rather
# than inferred from it — which is exactly why it needs its own case: a server
# that wired `path` into only one of the two GET handlers passes the sibling
# get_directory-path_sub_folder case and fails here.
#
# The version coordinate is the provisioned tree's own version uid
# (`${directory_version_uid}`, published by the requires.directory
# provisioning), so the case addresses a real version rather than the implicit
# latest — the two coordinates coincide here, and it is the ROUTE, not the
# version selection, that this case isolates.
#
# The grammar the path assumes is the AMB-81 fixed handling (root-implicit
# segments, leading slash tolerated); the assertions prove navigation the same
# way the sibling does — a server ignoring `path` would serve `root` with
# `emergency` as its first child and go red on both.
id: I_EHR_DIRECTORY.get_directory_at_version-path_sub_folder
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_version
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-81]
test_purpose: >-
  A by-version directory read carrying a `path` naming a nested sub-FOLDER
  serves that sub-FOLDER of the addressed version, not the directory root.
description: "Get a directory version narrowed by a path to a nested sub-folder"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources §Identifier types"
  - "RM ehr §FOLDER (name, folders)"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_version"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.reference_structure   # provisioned; publishes ${directory_version_uid}
flow:
  - step: 1
    call: get_directory_at_version
    variant: path                        # the variant binding adds the `path` query parameter
    with:
      ehr_id: "${ehr_id}"
      version_uid: "${directory_version_uid}"
      a_path: "/hospitalization"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: field, path: "name/value", equals: "hospitalization" }
      - { assert: field, path: "folders[0]/name/value", equals: "summary_compo_z" }
