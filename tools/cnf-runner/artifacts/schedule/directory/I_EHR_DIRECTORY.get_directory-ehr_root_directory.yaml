# get_directory on an EHR whose directory is a single empty root FOLDER returns
# that FOLDER. The directory is provisioned as a precondition; the returned
# content is checked against the provisioned tree.
id: I_EHR_DIRECTORY.get_directory-ehr_root_directory
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  get_directory returns the EHR.directory structure — an empty root FOLDER — for
  an EHR whose directory is a single empty FOLDER.
description: "Test get_directory on EHR with a root directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory-ehr_root_directory"
applies: { rm: ">=1.0.2" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.root_only     # a single empty root FOLDER (provisioned)
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
