# get_directory_at_version on an EHR whose directory has two versions returns the
# corresponding FOLDER for each version uid. Both versions are created in-flow so
# their uids are known.
id: I_EHR_DIRECTORY.get_directory_at_version-directory_with_two_versions
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_version
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  get_directory_at_version returns the first version for the first version uid and
  the second version for the second version uid.
description: "Test get_directory_at_version on EHR that has two versions of directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_version"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_version-directory_with_two_versions"
  - "RM common §change_control (VERSIONED_OBJECT versions)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      v1_uid: created.version_uid
  - step: 2
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: get_directory_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${v1_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
  - step: 4
    call: get_directory_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${v2_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.v2}", ignoring: server_assigned }
