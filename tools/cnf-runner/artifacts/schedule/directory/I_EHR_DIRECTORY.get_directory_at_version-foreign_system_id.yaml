# A version_uid that is perfectly well-formed, whose object_id names the REAL
# directory container of THIS EHR and whose version_tree_id is a real version
# number — but whose creating_system_id names a system that minted nothing
# here. All three parts must cohere; matching two of them is not a match.
#
# The identity is compositional, and the released text says so. ITS-REST
# overview Resources.md §Identifier types: "The `version_uid` uniquely
# identifies a VERSION, in the lexical form of `object_id ::
# creating_system_id :: version_tree_id`. Here, the `object_id` matches the
# VERSIONED_OBJECT identifier, taken from VERSIONED_OBJECT.uid.value (i.e. the
# `versioned_object_uid`)." The sentence pins ONE part to the container and
# leaves the other two as the rest of the identifier — so a uid agreeing only
# on the pinned part is a different identifier, naming no version this service
# holds. RM common versioned_object.adoc guards the accessor with `Pre:
# has_version_id (a_ver_id)`, false here, and ITS-REST overview
# Requests_and_responses.md §HTTP status codes assigns that state its row:
# "404 | Not Found | The origin service did not find the target resource or is
# not willing to disclose that one exists".
#
# This is the isolation a random-uid 404 cannot give. The object_id is the LIVE
# container's own, captured in step 1, so a server that resolved a version by
# its object_id and version number while ignoring the creating_system_id would
# answer 200 and serve a version the URL does not name. The malformed-token
# sibling holds the other end of the range: garbage is 400, a coherent-looking
# but non-matching identifier is 404.
id: I_EHR_DIRECTORY.get_directory_at_version-foreign_system_id
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_version
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  A well-formed directory version_uid whose creating_system_id names a foreign
  system is not served, even when its object_id and version number match a live
  version of the addressed EHR's directory.
description: "Get a directory version by a uid with a fabricated creating_system_id"
spec_refs:
  - "ITS-REST overview Resources §Identifier types"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §change_control (master06 §Version Identification)"
  - "RM common §versioned_object (version_with_id / has_version_id)"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_version"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                              # the live container and version number, a system id that minted nothing
    call: get_directory_at_version
    with:
      ehr_id: "${ehr_id}"
      version_uid: "${versioned_object_uid}::cnf.foreign.example.org::1"
    expect: version_not_found
  - step: 3                              # control: the genuine uid IS served, so step 2's 404 is the system id
    call: get_directory_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
