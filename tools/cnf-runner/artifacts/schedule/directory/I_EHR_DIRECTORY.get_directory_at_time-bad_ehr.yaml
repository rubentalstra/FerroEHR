# get_directory_at_time on a non-existent EHR errors on the missing EHR — 404.
id: I_EHR_DIRECTORY.get_directory_at_time-bad_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  get_directory_at_time at the current time on a random ehr_id when no EHRs
  exist is rejected: the EHR does not exist.
description: "Test get_directory_at_time on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_time-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server is empty"
flow:
  - step: 1
    call: get_directory_at_time
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }   # current time -> version_at_time omitted
    expect: not_found                     # "error indicating non-existent EHR"
