# The accepting twin of create_directory-items_by_value: a FOLDER tree whose
# `items` lists carry OBJECT_REFs is accepted, and the directory exists
# afterwards.
#
# Both halves matter. Without this case a server that refused every populated
# `items` list outright would pass the by-value refusal case, and the catalogue
# would certify leniency's opposite — over-rejection — as conformance. The
# reference slot is not an optional extra: it is what a directory IS. RM common
# UML/classes/org.openehr.rm.common.folder.adoc §Attributes types
# `items: List<OBJECT_REF>` at 0..1 — "The list of references to other (usually)
# versioned objects logically in this folder" — and
# master05-directory_package.adoc §Overview says the same in prose ("A FOLDER
# instance contains more FOLDERs and/or items, which are _references_ to other
# (usually versioned) objects. A FOLDER structure is therefore like a directory
# containing references to objects").
#
# The fixture's members are complete OBJECT_REFs: `namespace` "my.system.id"
# (a FOREIGN system — the namespace the CNF Robot corpus's own directory
# fixtures carry), `type` the referenced class, and `id` a HIER_OBJECT_ID
# (BASE base_types UML/classes/org.openehr.base.base_types.object_ref.adoc
# §Attributes — the three attributes are each 1..1, and the value is an
# ordinary match of the namespace regex the same section states).
#
# WHAT THIS CASE DOES NOT ASSERT: that the targets exist. No released sentence
# makes target existence a precondition of a FOREIGN reference — SM
# i_ehr_directory.adoc §create_directory's precondition is
# `Pre_content_valid: valid_content(a_dir_struct)`, and SM
# i_validity_checker.adoc §content_valid is "Return `True` if the content
# structure is a valid instance of the relevant RM classes", which an
# OBJECT_REF with all three attributes is regardless of what it points at. The
# BASE OBJECT_REF description makes the point directly: the referenced object
# "may exist locally or be maintained outside the current namespace, e.g. in
# another service". So the fixture's foreign ids stand free, and a server that
# dereferenced them and refused would be refusing something the release admits.
# The refs claim a foreign system ON PURPOSE (re-adjudicated 2026-08-18, issue
# #1951, register AMB-211): a reference claiming THIS system that does not
# resolve here is outside the distributed-referencing sentence, and its
# refusal is pinned by the twin create_directory-local_dangling_item.
#
# The acceptance is proved to have created, not just answered: step 2 asks
# whether the EHR has a directory at all — the mirror of the refusal twin's
# step 2. The multiple-classification round trip is the separate subject of
# get_directory-multiply_classified_items.
id: I_EHR_DIRECTORY.create_directory-with_items
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a FOLDER tree whose items lists carry OBJECT_REFs
  succeeds and the EHR has a directory afterwards.
description: "Create a directory from a FOLDER tree carrying OBJECT_REF items"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "RM common §folder (items: List<OBJECT_REF>, 0..1)"
  - "RM common master05-directory_package §Overview"
  - "BASE base_types §OBJECT_REF (namespace/type/id, 1..1)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.with_items]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.with_items}" }
    expect: created
    assert:
      - { assert: instance_of, rm_type: FOLDER }
  - step: 2                              # the accepted create really created
    call: has_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: returns, equals: true }
