# has_directory_version on an EHR whose directory has two versions returns TRUE
# for each version uid. Both versions are created in-flow so their uids are known;
# realized as GET of each version (200 = exists = TRUE).
id: I_EHR_DIRECTORY.has_directory_version-directory_with_two_versions
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_directory_version
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  has_directory_version reports true for the version uid of each of the two
  directory versions.
description: "Test has_directory_version on EHR that has two versions of directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_directory_version"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_directory_version-directory_with_two_versions"
  - "RM common §change_control (VERSIONED_OBJECT versions)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      v1_uid: created.version_uid
  - step: 2
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 3
    call: has_directory_version
    with: { ehr_id: "${ehr_id}", version_uid: "${v1_uid}" }
    expect: ok                            # first version exists -> true
    assert: [ { assert: returns, equals: true } ]
  - step: 4
    call: has_directory_version
    with: { ehr_id: "${ehr_id}", version_uid: "${v2_uid}" }
    expect: ok                            # second version exists -> true
    assert: [ { assert: returns, equals: true } ]
