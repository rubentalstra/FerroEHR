# Reading a logically deleted directory on the BY-VERSION route, by the deleted
# version's own explicit version_uid: there is no content to represent, so the
# read is fulfilled with no body.
#
# SPEC SILENCE, adjudicated as AMB-74 (fixed_handling): the by-version
# operation (directory_get_by_version_id) declares 200 and 404 only — no
# deleted branch at all — while its at-time sibling on the same resource
# declares the 204. What decides it is what a deleted version IS: RM common
# master06 §Logical Deletion commits a version whose `_data_` is deleted and
# whose `_lifecycle_state_` is the code for deleted, and this route serves the
# FOLDER (the VERSION's data) — which no longer exists. ITS-REST overview
# Requests_and_responses.md §HTTP status codes assigns that state its row:
# "204 | No Content | The request has been fulfilled and there is no additional
# content to send in the response payload body". The read is not a miss — the
# version is right there, addressed by its own uid.
#
# This case is also the EXECUTED discrimination behind AMB-75 (which identity
# the delete's 204 carries): the addressed uid here is the one the DELETE
# returned. Had the server echoed the preceding v1 uid instead of the new
# deleted one, this read would serve v1's live FOLDER with a 200 and the row
# would go red — so the two cases together pin the identity without needing a
# capture-to-capture comparison the assertion vocabulary cannot express.
id: I_EHR_DIRECTORY.get_directory_at_version-deleted_version
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_version
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-74, AMB-75]
test_purpose: >-
  A by-version directory read addressing a logically deleted version by its
  explicit version_uid is fulfilled with no content.
description: "Get the directory at the explicitly addressed deleted version"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources §Identifier types"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_version"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: delete_directory
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { deleted_uid: deleted.version_uid }   # AMB-75: the new 523|deleted| version
  - step: 3                              # the deleted version, addressed explicitly
    call: get_directory_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${deleted_uid}" }
    expect: ok_empty
