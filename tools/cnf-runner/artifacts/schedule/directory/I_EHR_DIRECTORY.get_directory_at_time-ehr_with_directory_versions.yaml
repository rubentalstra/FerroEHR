# get_directory_at_time over an EHR.directory with two versions committed at t0
# and t1 (t0 < t1): before t0 -> no version (error branch); between t0 and t1 ->
# the first version; current time (after t1) -> the second version. The commit
# instants are captured and the closed temporal forms fix the queried instants.
id: I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory_versions
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  get_directory_at_time returns no version before the first directory commit, the
  first version between the two commits, and the second version at the current
  time.
description: "Test get_directory_at_time on EHR with directory containing multiple versions"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory_versions"
  - "RM common §change_control (VERSIONED_OBJECT versions over time)"
  - "ITS-REST ehr OAS §404 directory (no directory exists at the specified version_at_time)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      t0: created.commit_time
  - step: 2
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
    capture: { t1: updated.commit_time }
  - step: 3
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}", a_time: "${time:before(t0)}" }
    expect: not_found                     # before(t0) stands in for G.5's "before EHR.time_created" (no version extant either way); the OAS-defined 404: no directory at version_at_time
  - step: 4
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}", a_time: "${time:between(t0,t1)}" }
    expect: ok                            # the first version
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
  - step: 5
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}", a_time: "${time:after(t1)}" }
    expect: ok                            # current time -> the second version
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.v2}", ignoring: server_assigned }
