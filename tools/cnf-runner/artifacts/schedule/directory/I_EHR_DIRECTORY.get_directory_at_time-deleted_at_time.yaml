# The addressing form of the deleted directory read that the released text
# assigns OUTRIGHT: the bare route with a `version_at_time` at which the extant
# version is the logically deleted one.
#
# The branch itself is not in dispute — directory_get_at_time declares a 204
# whose response file (204_deleted_at_time.yaml) is textually scoped to exactly
# this form — and ITS-REST overview Requests_and_responses.md §HTTP status
# codes gives it its meaning: "204 | No Content | The request has been
# fulfilled and there is no additional content to send in the response payload
# body". There is nothing to send because RM common master06 §Logical Deletion
# deletes the version's `_data_`.
#
# The queried instant is the delete's own commit window, advanced by the closed
# temporal form `${time:after(t_del)}`, so the extant version at T is the
# deleted one by the AMB-70 extancy handling (a version is extant from its
# commit instant until the next commit; nothing follows the delete here).
# Registered under AMB-74 too: this case is the ANCHOR its two siblings — the
# implicit-latest and explicit-version forms, which the released text leaves
# unassigned — are read against.
id: I_EHR_DIRECTORY.get_directory_at_time-deleted_at_time
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-70, AMB-74]
test_purpose: >-
  A bare-route directory read at a time whose extant version is a logically
  deleted version is fulfilled with no content.
description: "Get the directory at a time whose version is deleted"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources §Datetime format"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "RM common §versioned_object (version_at_time)"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: delete_directory
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
    capture: { t_del: deleted.commit_time }
  - step: 3                              # an instant at which the deleted version is the extant one
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}", a_time: "${time:after(t_del)}" }
    expect: ok_empty
