# The declared failure trigger of the `path` parameter on the by-version route.
#
# Decisive docs-text sentence, the operation's own 404 response file (ITS-REST
# specifications/responses/404_directory_unknown_ehr_id_or_no_version_uid_or_
# no_path.yaml): "`404 Not Found` is returned when an EHR with `ehr_id` does
# not exist, or when a directory with `version_uid` does not exist, or when
# `path` does not exist within the directory." The third clause is this case,
# and it is a DIFFERENT response file from the at-time route's — the two
# routes each declare the trigger for themselves, so each needs its own case.
#
# Both other clauses of the same 404 are held FIXED so only the path clause can
# fire: the ehr_id is a real provisioned EHR and the version_uid is the
# provisioned tree's own live version. A red row here therefore means the path
# clause specifically — either an unresolved path served an ancestor (the
# silent-fallback failure mode) or it was reported through a different branch.
# The path's prefix `/emergency` exists in the reference tree; `episode_z` does
# not. Register AMB-81 carries the fixed handling.
id: I_EHR_DIRECTORY.get_directory_at_version-path_unresolved
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_version
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-81]
test_purpose: >-
  A by-version directory read carrying a `path` that does not exist within the
  addressed version is refused as not found, never answered with an ancestor
  folder.
description: "Get a directory version narrowed by an unresolvable path"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources §Identifier types"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_version"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.reference_structure   # provisioned; publishes ${directory_version_uid}
flow:
  - step: 1
    call: get_directory_at_version
    variant: path                        # the variant binding adds the `path` query parameter
    with:
      ehr_id: "${ehr_id}"
      version_uid: "${directory_version_uid}"
      a_path: "/emergency/episode_z"
    expect: not_found
