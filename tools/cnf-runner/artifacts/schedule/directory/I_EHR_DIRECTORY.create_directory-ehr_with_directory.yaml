# create_directory on an EHR that already has a directory fails (the directory
# already exists — SM Pre_no_directory). The directory is created in-flow so the
# second create is exercised against real existing state.
id: I_EHR_DIRECTORY.create_directory-ehr_with_directory
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory on an EHR that already has a directory is rejected: the EHR
  directory already exists.
description: "Test create_directory on EHR with directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.create_directory-ehr_with_directory"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory               # precondition: the EHR gains a directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
  - step: 2
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: already_exists                # "the EHR directory already exists" (SM Pre_no_directory)
