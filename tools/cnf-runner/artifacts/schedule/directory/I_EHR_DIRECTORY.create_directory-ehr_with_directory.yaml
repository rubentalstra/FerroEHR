# create_directory on an EHR that already has a directory fails: the slot is
# occupied. The directory is created in-flow so the second create is exercised
# against real existing state.
#
# The RULE is SM, and it is unambiguous — I_EHR_DIRECTORY.create_directory
# declares `Pre_no_directory`: `not has_directory (ehr_id)` — and RM ehr
# ehr.adoc types `EHR.directory` 0..1, so a second live directory is not a
# representable state.
#
# SPEC SILENCE on the CODE, adjudicated as AMB-79 (fixed_handling): the
# released ITS-REST directory_create operation declares 201/400/404 only, the
# status table's 409 row is bound to no directory operation, and the docs text
# never mentions the case. The register's fixed handling is 409, taken from
# that row's own text (ITS-REST overview Requests_and_responses.md §HTTP status
# codes): "Indicates that the request could not be processed because it might
# generate a duplicate or a conflict". The disposition is fixed_handling, so
# the case GATES.
#
# GROUNDING NOTE: this case previously cited the CNF platform test schedule as
# the authority for its 409. The schedule never released stable and is a GUIDE
# to which behaviours to cover, never the correct answer (and the Robot suite
# that asserts 409 carries the in-file admission that it "is not (yet) in the
# SPEC"), so the expectation is re-grounded on SM + RM + the register.
id: I_EHR_DIRECTORY.create_directory-ehr_with_directory
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory on an EHR that already has a directory is rejected: the EHR
  directory already exists.
description: "Test create_directory on EHR with directory"
ambiguities: [AMB-79]
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory (Pre_no_directory)"
  - "RM ehr §EHR (directory 0..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory               # precondition: the EHR gains a directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
  - step: 2
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: already_exists                # "the EHR directory already exists" (SM Pre_no_directory)
