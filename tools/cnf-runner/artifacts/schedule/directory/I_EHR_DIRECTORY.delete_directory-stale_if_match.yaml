# The lost-update guard on the directory DELETE: an If-Match naming a version
# that is no longer the latest is refused, and the refusal tells the client
# which version IS current.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "If a service receives this header,
# and the condition evaluates to `false`, it MUST NOT perform the requested
# method. Instead, it MUST respond with HTTP status code `412 Precondition
# Failed`, and SHOULD return also latest `version_uid` in the `ETag` response
# headers."
#
# THE CONTRAST WORTH STATING: this is a DELETE, and it is 412 — not the 409
# the COMPOSITION delete answers for a stale version. The two differ because
# the same section scopes the header by ADDRESSING: it is required "when the
# `preceding_version_uid` is not part of the endpoint path segment".
# DELETE /ehr/{ehr_id}/directory has no version segment, so the version
# travels in `If-Match` and a stale value is a failed PRECONDITION;
# DELETE /ehr/{ehr_id}/composition/{uid_based_id} carries the version in the
# path, so a stale value there is a state CONFLICT instead. A directory delete
# answering 409 would be applying the composition's rule to a route the scope
# sentence puts on the other side of the line.
#
# The staleness is manufactured, not assumed: step 1 creates v1, step 2 commits
# v2 with v1's uid, and step 3 offers that SAME v1 uid to the delete. The
# binding's `ETag: latest-version-uid` matcher compares the returned entity tag
# against the version step 2 actually created (BASE master05 §Composite
# Identifiers and Case makes the comparison case-insensitive).
#
# "MUST NOT perform": step 4 reads the directory and finds it still LIVE with
# the v2 structure — a 200, not the 204 a performed delete would leave.
id: I_EHR_DIRECTORY.delete_directory-stale_if_match
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.delete_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  A directory delete whose If-Match names a superseded version is refused with a
  precondition failure carrying the latest version uid, and the directory
  remains live.
description: "Delete the directory with a stale If-Match precondition"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "SM openehr_platform §I_EHR_DIRECTORY.delete_directory"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2                              # v2 — this is what makes the step-1 uid stale
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
  - step: 3                              # the SAME (now superseded) uid offered as the precondition
    call: delete_directory
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: precondition_failed
  - step: 4                              # "it MUST NOT perform the requested method" — still live, not 204
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.v2}", ignoring: server_assigned }
postconditions:
  - assert: state
    text: >-
      The refused delete committed no deleted version: the directory is still
      live and holds the v2 structure (verified by step 4)
