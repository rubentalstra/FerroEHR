# get_directory_at_time with empty (omitted) time on an EHR with a one-version
# directory returns the current directory (empty time -> latest).
id: I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory_empty_time
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  get_directory_at_time with empty time on an EHR with a one-version directory
  returns the current directory.
description: "Test get_directory_at_time on EHR with directory with empty time"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory_empty_time"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
  - step: 2
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}" }         # empty time -> version_at_time omitted -> latest
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: committed, ignoring: server_assigned }
