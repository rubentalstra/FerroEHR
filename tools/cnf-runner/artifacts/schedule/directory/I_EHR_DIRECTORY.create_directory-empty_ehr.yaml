# create_directory on an EHR that has no directory succeeds: a new
# VERSIONED_FOLDER / ORIGINAL_VERSION / CONTRIBUTION is created. The created
# directory is verified through a separate get_directory read.
id: I_EHR_DIRECTORY.create_directory-empty_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a valid FOLDER structure on an EHR without a directory
  succeeds and the EHR then has a directory.
description: "Test create_directory on empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.create_directory-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.reference_structure]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.reference_structure}" }
    expect: created                       # "a positive result indicating the directory created"
    assert:
      - { assert: instance_of, rm_type: FOLDER }
postconditions:
  - assert: state
    text: "The EHR ehr_id now has a directory (verified by get_directory)"
    verified_by: I_EHR_DIRECTORY.get_directory-directory_with_structure
verified_by: [I_EHR_DIRECTORY.get_directory-directory_with_structure]
