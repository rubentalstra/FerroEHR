# has_directory on an EHR that has a directory returns TRUE. Realized as a GET of
# the directory (200 = a directory exists = TRUE).
id: I_EHR_DIRECTORY.has_directory-ehr_with_directory
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  has_directory on an EHR that has a directory reports the directory exists
  (true).
description: "Test has_directory on EHR containing a directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_directory-ehr_with_directory"
applies: { rm: ">=1.0.2" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.root_only     # the EHR has a directory (provisioned tree; mints no handle)
flow:
  - step: 1
    call: has_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok                            # "The result must be true"
    assert:
      - { assert: returns, equals: true } # has_directory: Boolean TRUE
