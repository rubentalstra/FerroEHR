# get_directory on an EHR whose directory has an internal sub-structure returns
# the full FOLDER tree. The reference structure is provisioned as a precondition;
# the returned content is checked against it.
id: I_EHR_DIRECTORY.get_directory-directory_with_structure
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  get_directory returns the full EHR.directory structure for an EHR whose
  directory has an internal sub-structure.
description: "Test get_directory on EHR with a directory containing sub-structure"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory-directory_with_structure"
applies: { rm: ">=1.0.2" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.reference_structure   # the reference tree (provisioned)
data_sets: [cnf.directory.reference_structure]
flow:
  - step: 1
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.reference_structure}", ignoring: server_assigned }
