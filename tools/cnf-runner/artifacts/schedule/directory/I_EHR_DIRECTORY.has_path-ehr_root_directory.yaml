# has_path on an EHR whose directory is a single empty root FOLDER: the root
# path '/' exists (true), a random path does not (false). Realized as GET of the
# directory with the `path` query parameter (200 = exists, 404 = absent).
id: I_EHR_DIRECTORY.has_path-ehr_root_directory
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_path
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  has_path returns true for the root path '/' and false for a random path on an
  EHR with an empty root directory.
description: "Test has_path on EHR with just root directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_path"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_path-ehr_root_directory"
applies: { rm: ">=1.0.2" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.root_only     # a single empty root FOLDER (provisioned; mints no handle)
flow:
  - step: 1
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/" }
    expect: ok                            # $path '/' -> $result true
    assert:
      - { assert: returns, equals: true }
  - step: 2
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/random-8c31" }
    expect: not_found                     # random() -> $result false
