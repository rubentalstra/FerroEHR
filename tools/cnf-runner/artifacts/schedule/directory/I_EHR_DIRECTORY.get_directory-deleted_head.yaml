# The implicit-latest form of the deleted directory read: no version
# coordinate at all, and the trunk head is the 523|deleted| version.
#
# SPEC SILENCE, adjudicated as AMB-74 (fixed_handling): the bare route's one
# deleted branch (204_deleted_at_time.yaml) is textually scoped to "at
# specified `version_at_time`", so the implicit-latest form — the same route
# with the parameter omitted — has no assigned branch of its own. It resolves
# the same way, because it resolves to the same version: ITS-REST overview
# Resources.md §"Multiple identifiers for the same resource" makes the two URIs
# interchangeable (the "implicit latest version reference" reaches the same
# resource as the explicit one), and the resource that version holds is gone
# (RM common master06 §Logical Deletion: the delete commits a version whose
# `_data_` is deleted). ITS-REST overview Requests_and_responses.md §HTTP
# status codes: "204 | No Content | The request has been fulfilled and there is
# no additional content to send in the response payload body".
#
# The container itself is NOT gone — the sibling at-time case reads the very
# same state through the branch the text DOES assign — so a 404 here would deny
# a resource the service holds.
#
# This is the ISOLATED case for the branch: the delete_directory-ehr_with_
# directory case also happens to traverse it, but as incidental verification of
# the delete it exercises, with no AMB-74 grounding and no way to localize a
# failure to the read.
id: I_EHR_DIRECTORY.get_directory-deleted_head
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-74]
test_purpose: >-
  A bare-route directory read with no version coordinate, whose trunk head is a
  logically deleted version, is fulfilled with no content.
description: "Get the latest directory when the trunk head is deleted"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources §Multiple identifiers for the same resource"
  - "RM common §change_control (master06 §Logical Deletion)"
  - "RM common §versioned_object (latest_version)"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: delete_directory
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }
    expect: deleted
  - step: 3                              # no version coordinate: the implicit latest
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok_empty
