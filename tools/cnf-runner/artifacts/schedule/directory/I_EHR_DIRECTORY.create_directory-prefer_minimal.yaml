# The `Prefer: return=minimal` verbosity branch of the directory create.
#
# The status/body pair comes from register AMB-62's re-adjudication: the docs
# text states two answers for the minimal branch and settles on neither, so the
# released OAS fills the silence per operation family — a CREATE declares one
# success status and its response file closes "If the `Prefer` header is missing
# or set to `return=minimal`, the body is empty"
# (`responses/201_directory.yaml`). Created, with nothing in the body.
#
# The `Location` SHOULD from the docs text (§Prefer minimal — "The response
# SHOULD include a `Location` header pointing to the newly created or updated
# resource") is executed by the variant binding, and step 2 proves the directory
# the empty answer created is really there.
id: I_EHR_DIRECTORY.create_directory-prefer_minimal
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
ambiguities: [AMB-62]
test_purpose: >-
  A directory create sent with Prefer: return=minimal answers the created status
  with an empty body and a Location header, and the directory exists afterwards.
description: "Prefer: return=minimal honoured on directory create"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    variant: return_minimal              # pins Prefer: return=minimal
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created                      # 201 with an empty body
  - step: 2                              # the empty answer still created the directory
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
