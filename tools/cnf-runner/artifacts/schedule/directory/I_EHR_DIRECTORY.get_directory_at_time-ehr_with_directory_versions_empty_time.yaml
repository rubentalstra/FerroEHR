# get_directory_at_time with empty (omitted) time over an EHR.directory with two
# versions returns the current (latest) version.
id: I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory_versions_empty_time
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  get_directory_at_time with empty time over an EHR.directory with two versions
  returns the current latest directory.
description: "Test get_directory_at_time on EHR with directory containing multiple versions with empty time"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_time-ehr_with_directory_versions_empty_time"
  - "RM common §change_control (VERSIONED_OBJECT latest version)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (AMB-3)
    expect: updated
  - step: 3
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}" }         # empty time -> version_at_time omitted -> latest
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.v2}", ignoring: server_assigned }
ambiguities: [AMB-3]
