# The upper edge of the directory at-time branch: an instant after the newest
# commit still names a version — the newest one — and is answered, not refused.
#
# No released text states this: RM common versioned_object.adoc gives only
# `version_at_time (a_time): VERSION` with `Pre: has_version_at_time (a_time)`
# and never says whether a version's extancy interval closes at the next commit
# or runs open-ended. Register AMB-70 carries the adjudicated fixed handling
# this case pins — a version is extant from its own commit instant until the
# next commit, so the newest version is extant at every later instant and a
# future T is a 200, never a 404.
#
# "The newest one" is proved by content, not by trust: two versions are
# committed with different structures, and the served FOLDER must equal the
# SECOND one. The queried instant is a FIXED literal in the extended ISO 8601
# form Resources.md §Datetime format requires ("HTTP query parameters and path
# segments that are dates, datetimes, or times, MUST always use the _extended_
# ISO 8601 format") — never a clock reading, so two runners query the same
# instant.
#
# The existing ehr_with_directory_versions walk reaches the newest version too,
# but only through the captured-instant form `${time:after(t1)}`, which lands
# just past the second commit; this case is the clock-independent far-future
# form, and the two fail differently (a server closing extancy at some window
# would still pass the first).
id: I_EHR_DIRECTORY.get_directory_at_time-future
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
ambiguities: [AMB-70]
test_purpose: >-
  A directory at-time read for an instant later than every committed version
  serves the newest version rather than refusing the request.
description: "Get the directory at time, future instant"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "ITS-REST overview Resources §Datetime format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
  - step: 3
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}", a_time: "2099-01-01T00:00:00Z" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.v2}", ignoring: server_assigned }
