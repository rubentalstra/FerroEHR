# The accepting twin of create_directory-link_missing_meaning: a FOLDER whose
# LOCATABLE.links carries one COMPLETE LINK is accepted and reads back
# unchanged.
#
# Both halves matter. Without this case a server that refused every `links`
# list outright would pass the refusal case, and the catalogue would certify
# leniency's opposite — over-rejection — as conformance. LOCATABLE.links is
# `0..1 List<LINK>` (RM common UML/classes/org.openehr.rm.common.locatable.adoc
# §Attributes: "Links to other archetyped structures … Links may be to
# structures in other compositions"), and the member here carries all three
# 1..1 LINK attributes (`…common.link.adoc` §Attributes) with an `ehr://`
# DV_EHR_URI target, so it is a valid FOLDER and must be stored as given.
#
# The read-back is the point of step 2: `equivalent` against the committed
# payload proves the LINK survived the round trip rather than being silently
# dropped on the way in or out. `ignoring: server_assigned` covers only the
# uid the binding declares the server assigns.
id: I_EHR_DIRECTORY.create_directory-folder_with_link
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a FOLDER carrying a complete LINK succeeds and the
  stored directory reads back with the LINK intact.
description: "Create a directory from a FOLDER carrying a complete LINK"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
  - "RM common §locatable (links: List<LINK>, 0..1)"
  - "RM common §link (meaning/type/target, 1..1)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.root_with_link]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_with_link}" }
    expect: created
    assert:
      - { assert: instance_of, rm_type: FOLDER }
  - step: 2                              # the LINK survived the round trip
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.root_with_link}", ignoring: server_assigned }
