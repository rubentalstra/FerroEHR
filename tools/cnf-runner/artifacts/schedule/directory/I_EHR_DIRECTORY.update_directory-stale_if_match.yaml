# The lost-update guard on the directory PUT: an If-Match naming a version that
# is no longer the latest is refused, and the refusal tells the client which
# version IS current.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "If a service receives this header,
# and the condition evaluates to `false`, it MUST NOT perform the requested
# method. Instead, it MUST respond with HTTP status code `412 Precondition
# Failed`, and SHOULD return also latest `version_uid` in the `ETag` response
# headers."
#
# The staleness is manufactured, not assumed: step 1 creates v1, step 2 commits
# v2 with v1's uid as the precondition, and step 3 re-offers that SAME v1 uid —
# now superseded. The binding's `ETag: latest-version-uid` matcher compares the
# returned entity tag against the version step 2 actually created (RM common
# master06 §change_control fixes that uid as an OBJECT_VERSION_ID; BASE
# master05 §Composite Identifiers and Case makes the comparison
# case-insensitive).
#
# "MUST NOT perform": step 4 reads the directory back and finds the v2
# structure intact — the refused PUT did not slip the v1 payload through.
id: I_EHR_DIRECTORY.update_directory-stale_if_match
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.update_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  A directory update whose If-Match names a superseded version is refused with a
  precondition failure carrying the latest version uid, and the stored directory
  is left unchanged.
description: "Update the directory with a stale If-Match precondition"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "SM openehr_platform §I_EHR_DIRECTORY.update_directory"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2                              # v2 — this is what makes the step-1 uid stale
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: updated
  - step: 3                              # the SAME (now superseded) uid offered as the precondition
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.root_only}"
      preceding_version_uid: "${preceding_version_uid}"
    expect: precondition_failed
  - step: 4                              # "it MUST NOT perform the requested method"
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.v2}", ignoring: server_assigned }
postconditions:
  - assert: state
    text: >-
      The refused update committed no version: the directory still holds the
      structure the last accepted update left (verified by step 4)
