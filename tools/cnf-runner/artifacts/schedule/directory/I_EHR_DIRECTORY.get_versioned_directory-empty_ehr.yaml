# get_versioned_directory on an EHR without a versioned directory. The schedule
# expects an error, "NOTE: depending on the implementation, a valid result could
# also be returning an empty result instead of an error" (AMB-8). ITS-REST 1.1.0
# surfaces no versioned_directory endpoint, so the its-rest binding declares the
# operation unrealized and this case verdicts not-applicable-with-citation on
# this ITS (AMB-24).
id: I_EHR_DIRECTORY.get_versioned_directory-empty_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_versioned_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
option: directory-empty-error
test_purpose: >-
  get_versioned_directory on an EHR without a directory yields the
  empty-directory outcome (error branch).
description: "Test get_versioned_directory on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_versioned_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_versioned_directory-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
flow:
  - step: 1
    call: get_versioned_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found                     # AMB-8 error branch: no versioned directory
ambiguities: [AMB-8]
