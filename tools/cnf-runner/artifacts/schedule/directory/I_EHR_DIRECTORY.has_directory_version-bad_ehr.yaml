# has_directory_version on a non-existent EHR errors on the missing EHR — 404.
id: I_EHR_DIRECTORY.has_directory_version-bad_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_directory_version
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  has_directory_version on a random ehr_id and version uid when no EHRs exist is
  rejected: the EHR does not exist.
description: "Test has_directory_version on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_directory_version"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_directory_version-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server doesn't have EHRs"
flow:
  - step: 1
    call: has_directory_version
    with: { ehr_id: "11111111-1111-4111-8111-111111111111", version_uid: "22222222-2222-4222-8222-222222222222::cnf.example.org::1" }
    expect: not_found                     # "error related with the non-existence of the EHR"
