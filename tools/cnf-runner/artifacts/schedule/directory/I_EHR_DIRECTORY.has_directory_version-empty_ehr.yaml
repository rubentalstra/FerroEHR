# has_directory_version on an EHR with no directory, probing a random version
# uid, returns FALSE. Realized as GET of that directory version (404 = no such
# version = FALSE), mirroring I_EHR_COMPOSITION.has_composition.
id: I_EHR_DIRECTORY.has_directory_version-empty_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_directory_version
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  has_directory_version for a random version uid on an EHR without a directory
  reports the version does not exist (false).
description: "Test has_directory_version on empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_directory_version"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_directory_version-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
flow:
  - step: 1
    call: has_directory_version
    with: { ehr_id: "${ehr_id}", version_uid: "11111111-1111-4111-8111-111111111111::cnf.example.org::1" }
    expect: not_found                     # "The service should return false" — realized as 404
