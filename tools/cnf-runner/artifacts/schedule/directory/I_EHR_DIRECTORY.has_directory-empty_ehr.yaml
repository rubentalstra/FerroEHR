# has_directory on an EHR with no directory returns FALSE. ITS-REST 1.1.0 has no
# directory-existence probe, so has_directory is realized as GET of the directory
# (404 = no directory = FALSE), mirroring I_EHR_COMPOSITION.has_composition.
id: I_EHR_DIRECTORY.has_directory-empty_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  has_directory on an EHR that has no directory reports the directory does not
  exist (false).
description: "Test has_directory on empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_directory-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
flow:
  - step: 1
    call: has_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found                     # "The result must be false" — realized as 404 (no directory)
