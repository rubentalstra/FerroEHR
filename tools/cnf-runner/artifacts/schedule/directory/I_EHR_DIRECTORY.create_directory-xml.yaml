# The canonical-XML REQUEST-payload branch of directory creation: POST
# /ehr/{ehr_id}/directory carrying the FOLDER as canonical XML.
#
# WHY THIS ROW IS THE REFUSAL ARM AND NOT THE OFFER ARM (register AMB-167,
# re-adjudicated 2026-07-29). The published XSDs declare no document element
# for FOLDER: both vendored bundles type it as a LOCATABLE subtype
# (Structure.xsd) with no element of its own. A WRITE row must commit to one
# request root element, and ITS-REST overview Resources.md §"XML Format" opens
# with "When resources are serialized in **canonical XML** format, both request
# payloads and responses MUST conform to the [published XSDs]" — a payload
# whose root no published schema declares does not conform, so requiring a
# service to accept it would mark a conformant validating service
# non-conformant. (A READ row escapes this because the SERVER picks the
# document and the row can assert the released conduct — the negotiated
# `Content-Type` and an XML document entity — without naming a root; those
# directory reads are unchanged and keep `directory-xml-supported`.)
#
# What IS released here is the other half of the same section: "A client MAY
# use the header `Content-Type: application/xml` in the requests to specify the
# XML payload format. If the service cannot process the request payload as XML
# format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
# A party declaring `directory-xml-unsupported` declares exactly the
# antecedent, so the MUST is enforceable against it — and it fires on the MEDIA
# TYPE, before any document is parsed, which is why the row keeps the
# codec-derived fixture: the payload's root name is not part of what is
# asserted, and picking the generic `items`+`xsi:type` spelling instead would
# be the catalogue endorsing a wire form the release withholds.
#
# Step 2 is the state proof: the refusal may not have created a directory, so
# the EHR's directory slot must still be empty (ITS-REST overview
# Requests_and_responses.md §HTTP status codes, row 404 — "The requested
# resource could not be found but may be available in the future").
#
# Technology-profile scope: canonical XML is OPTIONAL support — Resources.md
# §Data representation, "Services MUST support at least one of the openEHR
# **XML** or **JSON** canonical formats for resource representation" — so the
# case declares the canonical-xml format axis and is counted only against a
# statement whose technology profile declares that format.
id: I_EHR_DIRECTORY.create_directory-xml
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
option: directory-xml-write-refused     # AMB-167 option_select branch (the refusal arm)
ambiguities: [AMB-167]
test_purpose: >-
  On a service that declares it cannot process canonical-XML request payloads
  for the FOLDER family, create_directory refuses an `application/xml` FOLDER
  payload as unsupported media and no directory is created.
description: "create_directory refuses a canonical-XML FOLDER payload as unsupported media"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
guards:
  - "Canonical-XML support for this resource family is statement-declared, not spec-mandated — the published XSDs declare no document element for FOLDER and ITS-REST overview Resources.md §Data representation leaves the format to the service, so this row judges only a party that declares it cannot process such a payload (register AMB-167)"
formats: [canonical-xml]
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.root_only.xml]
flow:
  - step: 1
    call: create_directory
    format: canonical-xml                # Content-Type: application/xml
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only.xml}" }
    expect: unsupported_media            # Resources.md §XML Format 415 MUST
  - step: 2                              # the refusal created nothing
    call: get_directory
    format: canonical-json
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: >-
      The EHR ehr_id still has no directory — the canonical-XML payload was
      refused as unsupported media before any version was committed (verified
      by step 2)
