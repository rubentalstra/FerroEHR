# A FOLDER carrying a LINK that is missing its mandatory meaning is refused at
# the directory-create seam, and the EHR is left with no directory.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM common UML/classes/org.openehr.rm.common.link.adoc §Attributes types all
# three of `meaning: DV_TEXT`, `type: DV_TEXT` and `target: DV_EHR_URI` at
# 1..1. The fixture is cnf.directory.root_with_link with exactly `meaning`
# removed, so it stays well-formed JSON, keeps a non-empty `links` list
# (LOCATABLE.Links_valid is satisfied) and keeps the other two LINK attributes.
# The defect is therefore inside a LINK, two levels below the resource root.
#
# WHY THE REFUSAL IS REQUIRED (not merely permitted): SM i_ehr_directory.adoc
# §create_directory carries `Pre_content_valid: valid_content(a_dir_struct)`
# and declares the error `content_invalid`, and SM i_validity_checker.adoc
# §content_valid defines the predicate as "Return `True` if the content
# structure is a valid instance of the relevant RM classes" — a LINK missing a
# 1..1 attribute is not one.
#
# WHICH BRANCH THE REFUSAL TAKES (ITS-REST overview Requests_and_responses.md
# §HTTP status codes): "422 | Unprocessable Entity | The request was
# well-formed but was unable to be followed due to semantic errors". The 400
# row of the same table is scoped to "malformed request syntax, syntactically
# invalid content", which this well-formed body is not.
#
# The refusal is proved to have refused, not just answered: step 2 asks whether
# the EHR has a directory at all.
id: I_EHR_DIRECTORY.create_directory-link_missing_meaning
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a FOLDER whose LINK is missing the mandatory meaning is
  rejected as a semantic error and creates no directory.
description: "Create a directory from a FOLDER carrying an incomplete LINK"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "RM common §link (meaning: DV_TEXT, 1..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.invalid.link_missing_meaning]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.invalid.link_missing_meaning}" }
    expect: validation_failed
  - step: 2                              # nothing was created by the refused request
    call: has_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: "The EHR still has no directory: the refused create committed nothing (verified by step 2)"
