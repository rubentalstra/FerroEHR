# A FOLDER IS a taggable target: the `openehr-item-tag` wrapper header on a
# DIRECTORY commit stores a tag against the VERSIONED_FOLDER, and the EHR-wide
# listing returns it.
#
# THE LAW — ITS-REST overview Requests_and_responses.md §openehr-item-tag and
# openehr-version-item-tag, the DOCS TEXT, which names the resource type
# outright: the headers "provide a lightweight mechanism for associating tags
# with change-controlled resources (e.g. COMPOSITION, EHR_STATUS, FOLDER,
# etc.)"; and §Usage in Requests: "When used as request headers for creation or
# update operations (`PUT`, `POST`), the header instructs the system which
# ITEM_TAG list should be associated with the target VERSION or
# VERSIONED_OBJECT resource (depending on the header name)." `openehr-item-tag`
# "applies to *VERSIONED_OBJECT* targets", which for the DIRECTORY is the
# VERSIONED_FOLDER at RM ehr master04-ehr_package.adoc `EHR.directory`.
#
# WHY THE READ-BACK IS `ehr_tags_get`: the release defines no dedicated
# /directory tag operations — the twenty-three tag operations cover COMPOSITION,
# EHR_STATUS and the five party kinds only — so a FOLDER tag is reachable
# through the EHR-scoped aggregate, which is defined over "any target VERSION or
# VERSIONED_OBJECT within the EHR identified by `ehr_id`"
# (operations/ehr_tags_get.yaml). A server may NOT close that asymmetry by
# inventing routes, and this case deliberately does not ask it to: the absence
# of a /directory tag route is the released surface, the ABILITY to tag a FOLDER
# is the released behaviour, and only the second is under test.
#
# The `target` assertion is what proves the tag landed on the FOLDER CONTAINER
# and not somewhere else: it is the bare UID_BASED_ID of the VERSIONED_FOLDER
# (RM common UML/classes/org.openehr.rm.common.item_tag.adoc §Attributes,
# `target`: "Identifier of target, which may be a `VERSIONED_OBJECT<T>` or a
# `VERSION<T>`"; the bare-identifier shape is register AMB-202).
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported"), so the `ItemTags` capability may never gate CORE or STANDARD.
id: I_EHR_DIRECTORY.create_directory-item_tag_wrapper_header
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [ItemTags]
exercises: [EhrApi, DirectoryOps]
profiles: [OPTIONS]
ambiguities: [AMB-166, AMB-202]
test_purpose: >-
  A DIRECTORY commit carrying the openehr-item-tag wrapper header stores the
  tag against the VERSIONED_FOLDER, and the EHR-wide tag listing returns it
  with that container as its target.
description: "Wrapper header on a DIRECTORY commit tags the VERSIONED_FOLDER"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST ehr_tags_get.yaml §description"
  - "RM ehr master04-ehr_package §EHR.directory"
  - "RM common item_tag.adoc §Attributes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    variant: item_tag_headers            # sends openehr-item-tag
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_ITS_REST_ITEM_TAGS.ehr_tags_get
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "folder-scope" }
      - { assert: field, path: "[0]/value", equals: "clinical" }
      - { assert: field, path: "[0]/target/value", equals: "${versioned_object_uid}" }
      - { assert: field, path: "[1]", absent: true }
