# has_path over the master09 reference FOLDER structure: each existing path
# returns true (GET path -> 200), each fully- or partly-missing path returns
# false (GET path -> 404). The 12 probes are the schedule's $path/$result data
# set, verbatim (existing paths, partial paths, and a random top-level path).
id: I_EHR_DIRECTORY.has_path-folder_structure
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_path
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  has_path returns true for every existing FOLDER/COMPOSITION path in the
  reference directory structure and false for partial or random paths.
description: "Test has_path on EHR with folder structure"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_path"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_path-folder_structure"
applies: { rm: ">=1.0.2" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.reference_structure   # the reference tree (provisioned; mints no handle)
flow:
  - step: 1
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/" }
    expect: ok
    assert: [ { assert: returns, equals: true } ]
  - step: 2
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/emergency" }
    expect: ok
    assert: [ { assert: returns, equals: true } ]
  - step: 3
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/emergency/episode-x" }
    expect: ok
    assert: [ { assert: returns, equals: true } ]
  - step: 4
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/emergency/episode-x/summary-composition-x" }
    expect: ok
    assert: [ { assert: returns, equals: true } ]
  - step: 5
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/emergency/episode-y" }
    expect: ok
    assert: [ { assert: returns, equals: true } ]
  - step: 6
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/emergency/episode-y/summary-composition-y" }
    expect: ok
    assert: [ { assert: returns, equals: true } ]
  - step: 7
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/hospitalization" }
    expect: ok
    assert: [ { assert: returns, equals: true } ]
  - step: 8
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/hospitalization/summary-composition-z" }
    expect: ok
    assert: [ { assert: returns, equals: true } ]
  - step: 9
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/random-a1" }        # '/' + random() -> false
    expect: not_found
  - step: 10
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/emergency/random-b2" }   # '/emergency/' + random() -> false
    expect: not_found
  - step: 11
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/emergency/episode-x/random-c3" }   # '/emergency/episode-x/' + random() -> false
    expect: not_found
  - step: 12
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "random-d4" }         # random() -> false
    expect: not_found
