# A FOLDER whose `items` slot holds content BY VALUE instead of a reference is
# refused at the directory-create seam, and the EHR is left with no directory.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM common UML/classes/org.openehr.rm.common.folder.adoc §Attributes types
# `items: List<OBJECT_REF>` at 0..1 — "The list of references to other
# (usually) versioned objects logically in this folder" — and
# master05-directory_package.adoc §Overview says the same in prose ("A FOLDER
# instance contains more FOLDERs and/or items, which are _references_ to other
# (usually versioned) objects"). RM ehr master04-ehr_package.adoc §Folders
# states the prohibition outright: "In the openEHR model, *Folder structures do
# not contain Compositions, only references to them*." A COMPOSITION is a
# LOCATABLE, not an OBJECT_REF, so the fixture is cnf.directory.root_only with
# exactly that one slot violated — still well-formed JSON, still carrying its
# mandatory `name` and `archetype_node_id`.
#
# The embedded member is the corpus's OWN valid COMPOSITION
# (cnf.composition.minimal_persistent.v1) reproduced verbatim, so nothing is
# wrong with it as a COMPOSITION: the single defect is that it sits in the
# reference slot instead of an OBJECT_REF pointing at it.
#
# WHY THE REFUSAL IS REQUIRED (not merely permitted): SM i_ehr_directory.adoc
# §create_directory carries `Pre_content_valid: valid_content(a_dir_struct)`
# and declares the error `content_invalid`, and SM i_validity_checker.adoc
# §content_valid defines the predicate as "Return `True` if the content
# structure is a valid instance of the relevant RM classes" — which a FOLDER
# whose declared `List<OBJECT_REF>` slot holds a COMPOSITION is not.
#
# WHICH BRANCH THE REFUSAL TAKES: the docs-text status table does not say
# where "invalid content" ends and "semantic error" begins; the released OAS
# does. `schemas/ehr/Folder.yaml` types `items` as an array of
# `base_types/UObjectRefOfUidBasedId.yaml`, whose OBJECT_REF form declares
# `required: [namespace, type, id]` — none of which a COMPOSITION carries.
# `responses/400.yaml` scopes 400 to "syntactically invalid header, parameter
# or content"; `responses/422.yaml` scopes 422 to content that "could be
# converted to a resource". This body never converts — the 400 row.
#
# The ACCEPTING twin is cnf.directory.with_items, driven by
# create_directory-with_items and read back by
# get_directory-multiply_classified_items — so the catalogue proves both that a
# populated reference list survives the round trip and that content by value in
# the same slot is refused.
#
# The refusal is proved to have refused, not just answered: step 2 asks whether
# the EHR has a directory at all.
id: I_EHR_DIRECTORY.create_directory-items_by_value
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a FOLDER whose items slot holds a COMPOSITION by value
  instead of an OBJECT_REF is rejected as invalid content and creates no
  directory.
description: "Create a directory from a FOLDER holding content by value in items"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "RM common §folder (items: List<OBJECT_REF>, 0..1)"
  - "RM common master05-directory_package §Overview"
  - "RM ehr master04-ehr_package §Folders"
  - "ITS-REST OAS schemas/ehr/Folder.yaml §items (array of UObjectRefOfUidBasedId)"
  - "ITS-REST OAS schemas/base_types/ObjectRef.yaml §required (namespace, type, id)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.invalid.items_by_value]
flow:
  - step: 1
    call: create_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.invalid.items_by_value}"
    expect: bad_request                    # a COMPOSITION is not the declared OBJECT_REF — the body never converts
  - step: 2                              # nothing was created by the refused request
    call: has_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: "The EHR still has no directory: the refused create committed nothing (verified by step 2)"
