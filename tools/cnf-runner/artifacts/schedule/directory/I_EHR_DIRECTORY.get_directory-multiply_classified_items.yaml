# The multiple-classification round trip: a directory in which TWO sibling
# FOLDERs reference the SAME target object reads back with BOTH references
# intact.
#
# WHY THIS IS A REQUIRED BEHAVIOUR, not an accident of storage: RM common
# master05-directory_package.adoc §Overview makes the repeated reference the
# POINT of the abstraction — "A FOLDER instance contains more FOLDERs and/or
# items, which are _references_ to other (usually versioned) objects. A FOLDER
# structure is therefore like a directory containing references to objects.
# Since they are references, multiple references to the same object are
# possible, allowing the structure to be used to mutiply classify other
# objects. If it is used with `VERSIONED_COMPOSITIONs` for example, the folders
# might be used to represent episodes and at the same time problem groups." RM
# ehr master04-ehr_package.adoc §Folders states the consequence in one
# sentence: "Folder structures do not contain Compositions, only references to
# them. _More than one Folder can therefore refer to the same Composition_ or
# other target object."
#
# So a server that de-duplicated the target across the tree — the plausible
# lenient implementation, since a naive store keyed by target id would collapse
# the two — would destroy exactly the classification the release describes. The
# fixture is built for that: `folders[0]` ("episodes") and `folders[1]`
# ("problems") both carry an OBJECT_REF to 1e0a7f34-…, and "episodes" carries a
# second, distinct target beside it, so a collapse in either direction (drop
# the duplicate, or merge the two lists) is visible.
#
# The whole-payload `equivalent` is the primary assertion — it fails on any
# reordering, dropping or rewriting anywhere in the tree. The two `field`
# assertions name the duplicate explicitly, so a red row says
# "multiple classification" rather than "the directory came back different":
# the two paths address the same target id under two different siblings.
# `ignoring: server_assigned` covers only the attributes the binding declares
# the server assigns.
id: I_EHR_DIRECTORY.get_directory-multiply_classified_items
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  get_directory returns a directory whose two sibling FOLDERs reference the
  same target object with both references intact — the multiple-classification
  shape RM common master05 §Overview describes.
description: "Test get_directory preserves multiple references to the same object"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
  - "RM common master05-directory_package §Overview"
  - "RM ehr master04-ehr_package §Folders"
  - "RM common §folder (items: List<OBJECT_REF>, 0..1)"
applies: { rm: ">=1.0.2" }
requires:
  ehr: { commits: any }                  # mints ${ehr_id}
  directory: cnf.directory.with_items    # the multiply-classified tree (provisioned)
data_sets: [cnf.directory.with_items]
flow:
  - step: 1
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.with_items}", ignoring: server_assigned }
      # The same target, reached under two different sibling folders.
      - { assert: field, path: "folders[0]/items[0]/id/value", equals: "1e0a7f34-9c62-4d5b-8f21-3b6c9d0e5a17" }
      - { assert: field, path: "folders[1]/items[0]/id/value", equals: "1e0a7f34-9c62-4d5b-8f21-3b6c9d0e5a17" }
      # …and the distinct second reference beside it, so a merge of the two
      # lists is caught as well as a drop.
      - { assert: field, path: "folders[0]/items[1]/id/value", equals: "7c4d2b81-5e39-46af-9d08-2fa1c6b73e94" }
