# has_path on a non-existent EHR errors on the missing EHR — realized as a 404.
id: I_EHR_DIRECTORY.has_path-bad_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_path
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  has_path on a random ehr_id and path when no EHRs exist is rejected: the EHR
  does not exist.
description: "Test has_path on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_path"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_path-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server is empty"
flow:
  - step: 1
    call: has_path
    with: { ehr_id: "11111111-1111-4111-8111-111111111111", a_path: "/random-9e2b" }
    expect: not_found                     # "the EHR doesn't exist"
