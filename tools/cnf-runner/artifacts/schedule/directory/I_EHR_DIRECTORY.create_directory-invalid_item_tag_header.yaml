# A wrapper-header tag that breaks an RM ITEM_TAG invariant refuses the whole
# write — and the CONTENT IS NOT COMMITTED.
#
# WHAT MAKES THE HEADER INVALID (one defect, so a red row names one thing):
# `openehr-item-tag: key=" padded "`. RM common
# UML/classes/org.openehr.rm.common.item_tag.adoc §Invariants declares
# `Inv_key_valid: not key.is_empty and key.is_justified`, and the same file's
# Meaning column for `key` says what that means: "May not be empty or contain
# leading or trailing whitespace". The FOLDER body is the valid
# cnf.directory.root_only fixture, untouched — so a red row here is about the
# tag and nothing else.
#
# WHY THE REFUSAL IS REQUIRED: the header is declared "a convenient wrapper
# around the dedicated ITEM_TAG operations" (ITS-REST overview
# Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag), and
# those operations carry the same ITEM_TAG payload — a wrapper cannot admit what
# the operation it wraps refuses. Register AMB-93 assigns the branch (422; the
# release leaves the invariant-violation status unassigned on all seven tag
# PUTs, and the docs-text §HTTP status codes row that describes it is "422 |
# Unprocessable Entity | The request was well-formed but was unable to be
# followed due to semantic errors").
#
# WHY STEP 2 IS THE POINT OF THIS CASE: whether the CONTENT survives a refused
# tag list is undefined by the release — §Usage in Requests states what the
# header means and nothing about atomicity, and no operation carrying the
# header declares a tag-specific failure branch. Register AMB-204 carries the
# fixed handling: the tag list is judged BEFORE the content commit, so a refused
# request commits nothing. Without this step the case would prove only that a
# status came back; with it, the case refutes the alternative reading — a 4xx
# for a request whose VERSION is already durable, whose response therefore
# carries no ETag and no Location, leaving a client whose only recovery is to
# re-POST and duplicate clinical content.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported"), so the `ItemTags` capability may never gate CORE or STANDARD.
id: I_EHR_DIRECTORY.create_directory-invalid_item_tag_header
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [ItemTags]
exercises: [EhrApi, DirectoryOps]
profiles: [OPTIONS]
ambiguities: [AMB-93, AMB-204]
test_purpose: >-
  A DIRECTORY commit whose openehr-item-tag header carries a tag breaking
  ITEM_TAG.Inv_key_valid is refused as a semantic error, and the EHR is left
  with no directory.
description: "An invalid wrapper tag refuses the commit and creates nothing"
spec_refs:
  - "RM common item_tag.adoc §Invariants (Inv_key_valid)"
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    variant: invalid_item_tag_header     # sends openehr-item-tag: key=" padded "
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: validation_failed
  - step: 2                              # nothing was created by the refused request
    call: has_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: "The EHR still has no directory: the tag list was judged before the content commit, so the refused request committed nothing (verified by step 2)"
