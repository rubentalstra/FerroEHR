# The WIDE half of the FOLDER.items id-width battery: an `items` reference
# whose id is a GENERIC_ID — a member of the OBJECT_ID family that lies OUTSIDE
# the two subtypes the released OAS enumerates for this slot — is accepted and
# reads back intact.
#
# WHY THE WIDE FORM IS THE RELEASED SHAPE. RM common
# UML/classes/org.openehr.rm.common.folder.adoc §Attributes types `items` as
# `List<OBJECT_REF>` (0..1); BASE base_types
# UML/classes/org.openehr.base.base_types.object_ref.adoc §Attributes types the
# member's `id` as `OBJECT_ID` (1..1) — the ABSTRACT root. Its concrete family
# has six members, each declaring `OBJECT_ID` (directly or through
# `UID_BASED_ID`) in its own class table's *Inherit* row: HIER_OBJECT_ID,
# OBJECT_VERSION_ID, ARCHETYPE_ID, TEMPLATE_ID, TERMINOLOGY_ID and GENERIC_ID.
# The ITS-JSON RM schema types the same slot the same way — its `OBJECT_REF.id`
# enumerates exactly those six `_type` values. GENERIC_ID is the widest of
# them: "Generic identifier type for identifiers whose format is otherwise
# unknown to openEHR", carrying a mandatory 1..1 `scheme` naming the foreign
# scheme (…base_types.generic_id.adoc §Description + §Attributes). The
# member's `type` is `ANY`, which BASE object_ref.adoc §Attributes sanctions in
# terms: "The type name `ANY` can be used to indicate that any type is accepted
# (e.g. if the type is unknown)" — the natural companion of an identifier whose
# format openEHR does not model.
#
# WHY IT NEEDS ITS OWN ROW. The RELEASED OAS narrows this slot to two subtypes
# — `Folder.yaml` `items` -> `UObjectRefOfUidBasedId` -> `UUidBasedId`, a
# `oneOf` of HIER_OBJECT_ID and OBJECT_VERSION_ID — so a server generated
# straight from that schema would REFUSE this payload, and the catalogue would
# never notice, because every other directory case rides an id the narrow
# reading also admits. Register AMB-186 carries the adjudication (the docs text
# points the native commit at the RM, and the RM/ITS-JSON width is what the
# model states), and this case is what makes the resulting acceptance ASSERTED
# rather than incidental: without it, a silent narrowing to the OAS reading
# would be invisible to the whole battery.
#
# Step 2's `equivalent` proves the foreign identifier survived the round trip
# rather than being coerced into a UUID-shaped one on the way in or out, and
# the two `field` assertions name the discriminator and the mandatory `scheme`,
# so a red row localizes to the id width rather than to the tree.
#
# As in cnf.directory.with_items, nothing here asserts that the target exists:
# BASE object_ref.adoc §Description states the referenced object "may exist
# locally or be maintained outside the current namespace, e.g. in another
# service" — which is precisely the situation a GENERIC_ID describes, and why
# the reference claims a foreign system (`legacy.pas.example.org` — a scheme
# openEHR does not model lives outside this system; re-adjudicated
# 2026-08-18, issue #1951, register AMB-211).
id: I_EHR_DIRECTORY.create_directory-wide_id_items
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a FOLDER whose items reference carries a GENERIC_ID —
  an OBJECT_ID subtype outside the two the released OAS enumerates for the
  slot — succeeds and the reference reads back intact.
description: "Create a directory whose items reference carries a GENERIC_ID"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
  - "RM common §folder (items: List<OBJECT_REF>, 0..1)"
  - "BASE base_types §OBJECT_REF (id: OBJECT_ID, 1..1; type ANY when unknown)"
  - "BASE base_types §GENERIC_ID (scheme, 1..1)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.wide_id_items]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.wide_id_items}" }
    expect: created
    assert:
      - { assert: instance_of, rm_type: FOLDER }
  - step: 2                              # the foreign identifier survived intact
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: FOLDER }
      - { assert: equivalent, to: "${ds:cnf.directory.wide_id_items}", ignoring: server_assigned }
      - { assert: field, path: "items[0]/id/_type", equals: "GENERIC_ID" }
      - { assert: field, path: "items[0]/id/scheme", equals: "local_ehr_scheme" }
