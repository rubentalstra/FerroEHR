# The other half of the precondition rule on the DELETE: the directory delete
# expects If-Match, so a request that omits it is refused rather than performed
# unconditionally.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "When the service expects `If-Match`
# for an operation, but the client does not provide it, the service SHOULD
# respond with `400 Bad Request`." That the directory DELETE is such an
# operation comes from the same section's scope sentence — the header is
# required "by a small set of versioned resources in this specification, when
# the `preceding_version_uid` is not part of the endpoint path segment" — and
# DELETE /ehr/{ehr_id}/directory carries no version segment at all.
#
# The refusal is 400, NOT the 409 the composition delete uses for its own
# stale-version branch: the two routes address their version differently (see
# the sibling delete_directory-stale_if_match case), so the directory delete's
# precondition family is 412/400 throughout.
#
# The omission is expressed by the `no_if_match` VARIANT binding, which simply
# does not declare the header; the request is otherwise byte-identical to the
# accepted delete, so a red row localizes to the precondition alone.
#
# Step 3 shows the refusal really refused: the directory is still LIVE (200
# with its content), not the 204 a performed delete would leave.
id: I_EHR_DIRECTORY.delete_directory-missing_if_match
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.delete_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  A directory delete sent without the If-Match precondition header is refused as
  a client error and the directory remains live.
description: "Delete the directory without the If-Match precondition"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "SM openehr_platform §I_EHR_DIRECTORY.delete_directory"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
  - step: 2
    call: delete_directory
    variant: no_if_match                 # the variant binding omits the header entirely
    with: { ehr_id: "${ehr_id}" }
    expect: precondition_missing
  - step: 3                              # the unconditional DELETE did not land
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
postconditions:
  - assert: state
    text: >-
      No deleted version was committed without a precondition: the directory is
      still live (verified by step 3)
