# An RM-invalid FOLDER is refused at the directory-UPDATE seam, and the stored
# directory is left on its last accepted version.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM common UML/classes/org.openehr.rm.common.locatable.adoc §Attributes types
# `name: DV_TEXT` at 1..1, and FOLDER is a LOCATABLE — the fixture is
# cnf.directory.root_only with exactly that attribute removed, so it stays
# well-formed JSON and keeps its mandatory `archetype_node_id`.
#
# WHY THE REFUSAL IS REQUIRED (not merely permitted): SM i_ehr_directory.adoc
# §update_directory carries `Pre_content_valid: valid_content(a_dir_struct)`
# and declares the error `content_invalid`, and SM i_validity_checker.adoc
# §content_valid defines the predicate as "Return `True` if the content
# structure is a valid instance of the relevant RM classes" — which a FOLDER
# missing a 1..1 attribute is not.
#
# WHICH BRANCH THE REFUSAL TAKES (ITS-REST overview Requests_and_responses.md
# §HTTP status codes): "422 | Unprocessable Entity | The request was
# well-formed but was unable to be followed due to semantic errors". The 400
# row of the same table is scoped to "malformed request syntax, syntactically
# invalid content", which this well-formed body is not.
#
# THE PRECONDITION IS NOT THE VARIABLE UNDER TEST: step 1 creates v1 and step 2
# offers that uid as the If-Match, so the precondition evaluates TRUE and the
# only thing left to refuse is the content — this case isolates
# validation_failed from the 412/400 precondition branches the -stale_if_match
# and -missing_if_match siblings own.
#
# The refusal is proved to have refused, not just answered: step 3 reads the
# directory back and finds the v1 structure intact.
id: I_EHR_DIRECTORY.update_directory-invalid_folder
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.update_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  update_directory with a FOLDER that breaks a mandatory RM attribute, offered
  behind a valid precondition, is rejected as a semantic error and commits no
  new version.
description: "Update the directory from an RM-invalid FOLDER"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.update_directory"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "RM common §locatable (name: DV_TEXT, 1..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.invalid.missing_name]
flow:
  - step: 1                              # v1 — gives the update a real preceding version
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2                              # correct If-Match, invalid content
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.invalid.missing_name}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: validation_failed
  - step: 3                              # nothing was committed by the refused request
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
postconditions:
  - assert: state
    text: >-
      The directory still holds the structure the accepted create left: the
      refused update committed no version (verified by step 3)
