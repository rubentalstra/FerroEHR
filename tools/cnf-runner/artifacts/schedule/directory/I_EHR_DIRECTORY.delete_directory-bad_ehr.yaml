# delete_directory on a non-existent EHR errors on the missing EHR — 404.
id: I_EHR_DIRECTORY.delete_directory-bad_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.delete_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  delete_directory on a random ehr_id when no EHRs exist is rejected: the EHR
  does not exist.
description: "Test delete_directory on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.delete_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.delete_directory-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server is empty"
flow:
  - step: 1
    call: delete_directory
    with: { ehr_id: "11111111-1111-4111-8111-111111111111", preceding_version_uid: "11111111-1111-4111-8111-111111111111::cnf.fake::1" }   # wire-required If-Match value; the negative is the unknown ehr
    expect: not_found                     # "the non existent EHR"
