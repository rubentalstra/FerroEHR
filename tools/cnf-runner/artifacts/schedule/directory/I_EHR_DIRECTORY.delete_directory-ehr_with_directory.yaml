# delete_directory on an EHR with a directory logically deletes it: a new
# (deleted) VERSION is created (VERSION.lifecycle_state = deleted). The directory
# is created in-flow so its version uid is known (the required If-Match); the
# delete is verified through get_directory returning the logically deleted
# (empty) response.
id: I_EHR_DIRECTORY.delete_directory-ehr_with_directory
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.delete_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  delete_directory on an EHR with a directory logically deletes it (a new deleted
  VERSION) and the EHR then has no active directory.
description: "Test delete_directory on EHR with directory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.delete_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.delete_directory-ehr_with_directory"
  - "RM common §change_control (logical delete: new version, lifecycle_state deleted)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: delete_directory
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${preceding_version_uid}" }   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: deleted                       # "a positive result related with the deleted directory"
  - step: 3
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok_empty                      # latest is now a logically deleted version (204)
postconditions:
  - assert: state
    text: "The EHR ehr_id has no active directory; the directory exists as a new deleted VERSION (lifecycle_state deleted) (verified by step 3)"
