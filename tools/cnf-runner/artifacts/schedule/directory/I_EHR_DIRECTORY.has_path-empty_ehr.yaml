# has_path on an EHR with no directory returns FALSE for any path. Realized as a
# GET of the directory with the `path` query parameter (404 = the path/directory
# does not exist = FALSE).
id: I_EHR_DIRECTORY.has_path-empty_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.has_path
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  has_path with a random FOLDER path on an EHR that has no directory reports the
  path does not exist (false).
description: "Test has_path on empty EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.has_path"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.has_path-empty_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
flow:
  - step: 1
    call: has_path
    with: { ehr_id: "${ehr_id}", a_path: "/random-2f7a" }
    expect: not_found                     # "The result must be false" — realized as 404
