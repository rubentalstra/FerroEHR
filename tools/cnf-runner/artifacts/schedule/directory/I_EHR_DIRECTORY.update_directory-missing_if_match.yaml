# The other half of the precondition rule: the directory PUT expects If-Match,
# so a request that omits it is refused rather than applied unconditionally.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "When the service expects `If-Match`
# for an operation, but the client does not provide it, the service SHOULD
# respond with `400 Bad Request`." That the directory PUT is such an operation
# comes from the same section's scope sentence — the header is required "by a
# small set of versioned resources in this specification, when the
# `preceding_version_uid` is not part of the endpoint path segment" — and
# PUT /ehr/{ehr_id}/directory carries no version segment at all.
#
# The omission is expressed by the `no_if_match` VARIANT binding, which simply
# does not declare the header; the request is otherwise byte-identical to the
# accepted update, so a red row localizes to the precondition alone.
#
# Step 3 shows the refusal really refused: the directory still holds the v1
# structure, so no version was committed without a precondition.
id: I_EHR_DIRECTORY.update_directory-missing_if_match
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.update_directory
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  A directory update sent without the If-Match precondition header is refused as
  a client error and commits no version.
description: "Update the directory without the If-Match precondition"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "SM openehr_platform §I_EHR_DIRECTORY.update_directory"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2
    call: update_directory
    variant: no_if_match                 # the variant binding omits the header entirely
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
    expect: precondition_missing
  - step: 3                              # the unconditional PUT did not land
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
postconditions:
  - assert: state
    text: >-
      No version was committed without a precondition: the directory still holds
      its single created structure (verified by step 3)
