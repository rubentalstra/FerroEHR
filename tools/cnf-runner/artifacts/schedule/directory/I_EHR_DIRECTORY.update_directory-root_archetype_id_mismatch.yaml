# The SEMANTIC refusal twin on the directory-UPDATE seam: a FOLDER that
# carries every member the release's request-body schemas declare `required`,
# CONVERTS (every slot decodes to its declared RM type), and then fails an RM
# rule. The stored directory is left on its last accepted version.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect): the root FOLDER carries
# ARCHETYPED details naming `openEHR-EHR-FOLDER.other.v1` while its
# `archetype_node_id` says `openEHR-EHR-FOLDER.generic.v1`. An archetype root
# (`is_archetype_root`: `archetype_details /= Void`) must carry its
# archetype id AS its node id — RM common
# UML/classes/org.openehr.rm.common.locatable.adoc §Attributes
# (`archetype_node_id` … "at archetype root points, this is the archetype
# identifier") + §Invariants Archetyped_valid.
#
# WHY THE REFUSAL IS REQUIRED: SM i_ehr_directory.adoc §update_directory
# carries `Pre_content_valid: valid_content(a_dir_struct)` and declares the
# error `content_invalid`; SM i_validity_checker.adoc §content_valid defines
# the predicate as "Return `True` if the content structure is a valid
# instance of the relevant RM classes".
#
# WHICH BRANCH: `responses/422.yaml` scopes 422 to content that "could be
# converted to a resource, but there are semantic validation errors" — every
# member here decodes to its declared type, so the body converts and the
# identity rule is the semantic failure. (The unconvertible half is the
# -invalid_folder sibling, `responses/400.yaml`.)
#
# THE PRECONDITION IS NOT THE VARIABLE UNDER TEST: step 1 creates v1 and
# step 2 offers that uid as the If-Match, so the precondition evaluates TRUE
# and the only thing left to refuse is the content. Step 3 proves nothing was
# committed.
id: I_EHR_DIRECTORY.update_directory-root_archetype_id_mismatch
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.update_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  update_directory with a root FOLDER whose archetype_node_id contradicts its
  archetype_details.archetype_id, offered behind a valid precondition, is
  rejected as a semantic error and commits no new version.
description: "Update the directory from a FOLDER whose root archetype identity is contradictory"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.update_directory"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "RM common §locatable (archetype_node_id; Archetyped_valid)"
  - "RM common master05-directory_package §Overview"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.invalid.root_archetype_id_mismatch]
flow:
  - step: 1                              # v1 — gives the update a real preceding version
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture: { preceding_version_uid: created.version_uid }
  - step: 2                              # correct If-Match, semantically invalid content
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.invalid.root_archetype_id_mismatch}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: validation_failed
  - step: 3                              # nothing was committed by the refused request
    call: get_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
postconditions:
  - assert: state
    text: >-
      The directory still holds the structure the accepted create left: the
      refused update committed no version (verified by step 3)
