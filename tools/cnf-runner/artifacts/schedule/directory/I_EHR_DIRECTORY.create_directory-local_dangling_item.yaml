# The refusal twin of create_directory-with_items after the AMB-211
# re-adjudication (issue #1951): an `items` OBJECT_REF whose `namespace`
# claims THIS system (`local`, or the deployment's own system id) and does
# not resolve to a versioned object in the EHR is refused as invalid
# content, naming the reference at its tree path.
#
# THE GROUND, honestly split. No released sentence constrains the
# resolvability of a FOLDER.items reference in either direction: ITS-REST
# declares no semantic branch on the directory operations beyond the generic
# 422 row of the overview status table, FOLDER declares no invariants at all,
# and SM i_validity_checker.adoc §content_valid reaches only RM-class
# structural validity. BASE object_ref.adoc §Description grounds the
# ACCEPTANCE side for DISTRIBUTED references — the target "may exist locally
# or be maintained outside the current namespace, e.g. in another service",
# and `namespace` "unknown" is legal — which is why the accepting twins
# (with_items, versioned_id_items, wide_id_items) all reference FOREIGN
# namespaces and their ids stand free. A reference that claims THIS system
# and does not resolve HERE is outside that sentence: refusing it is this
# server's own-design safety net (register AMB-211 carries the adjudication
# and the upstream report of the silence), and this case is what makes the
# refusal ASSERTED — a server that silently persisted the dangling claim
# would go red here, exactly as a server that refused the foreign twins
# would go red there.
#
# The resolvable-local ACCEPTANCE half (a `local` reference to a versioned
# object the EHR really holds) is pinned by the owning crate's integration
# suite (app/ferroehr/tests/it/directory_item_refs.rs): the catalogue's
# fixtures are static bodies, and a repository-allocated uid cannot be known
# to a committed fixture.
#
# The refusal is proved to have refused, not just answered: step 2 asks
# whether the EHR has a directory at all.
id: I_EHR_DIRECTORY.create_directory-local_dangling_item
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a FOLDER whose items reference claims this system
  (namespace local) but resolves to no versioned object in the EHR is
  refused as invalid content and creates no directory.
description: "Create a directory whose local-claiming item reference does not resolve"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "RM common §folder (items: List<OBJECT_REF>, 0..1)"
  - "BASE base_types §OBJECT_REF (namespace/type/id, 1..1)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.invalid.local_dangling_item]
flow:
  - step: 1
    call: create_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.invalid.local_dangling_item}"
    expect: validation_failed
    assert:
      - { assert: message_exemplar, text: "does not resolve to a versioned object" }
  - step: 2                              # nothing was created by the refused request
    call: has_directory
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: returns, equals: false }
