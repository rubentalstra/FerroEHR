# A FOLDER whose `details` slot holds something that is not an ITEM_STRUCTURE
# is refused at the directory-create seam, and the EHR is left with no
# directory.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM common UML/classes/org.openehr.rm.common.folder.adoc §Attributes types
# `details: ITEM_STRUCTURE` at 0..1 — "Archetypable meta-data for FOLDER" —
# and master05-directory_package.adoc §Overview says the same in prose ("Any
# individual Folder may contain meta-data in its `details` attribute (type
# `ITEM_STRUCTURE`)"). ITEM_STRUCTURE is abstract, its concrete descendants
# being ITEM_TREE / ITEM_LIST / ITEM_SINGLE / ITEM_TABLE (RM data_structures
# master04-representation_package.adoc §Item Structures). A DV_TEXT is a
# DATA_VALUE, not an ITEM_STRUCTURE, so the fixture is cnf.directory.root_only
# with exactly that one slot violated — still well-formed JSON, still carrying
# its mandatory `name` and `archetype_node_id`.
#
# WHY THE REFUSAL IS REQUIRED (not merely permitted): SM i_ehr_directory.adoc
# §create_directory carries `Pre_content_valid: valid_content(a_dir_struct)`
# and declares the error `content_invalid`, and SM i_validity_checker.adoc
# §content_valid defines the predicate as "Return `True` if the content
# structure is a valid instance of the relevant RM classes" — which a FOLDER
# whose declared ITEM_STRUCTURE slot holds a DATA_VALUE is not.
#
# WHICH BRANCH THE REFUSAL TAKES (ITS-REST overview Requests_and_responses.md
# §HTTP status codes): "422 | Unprocessable Entity | The request was
# well-formed but was unable to be followed due to semantic errors". The 400
# row of the same table is scoped to "malformed request syntax, syntactically
# invalid content", which this well-formed body is not.
#
# The ACCEPTING twin is cnf.directory.v2, whose `details` is a populated
# ITEM_TREE that the update/get cases read back with `equivalent` — so the
# catalogue proves both that a well-typed details survives the round trip and
# that a wrongly-typed one is refused.
#
# The refusal is proved to have refused, not just answered: step 2 asks whether
# the EHR has a directory at all.
id: I_EHR_DIRECTORY.create_directory-details_not_item_structure
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.create_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  create_directory with a FOLDER whose details slot holds a DATA_VALUE instead
  of an ITEM_STRUCTURE is rejected as a semantic error and creates no
  directory.
description: "Create a directory from a FOLDER whose details is not an ITEM_STRUCTURE"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.create_directory"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "RM common §folder (details: ITEM_STRUCTURE, 0..1)"
  - "RM common master05-directory_package §Overview"
  - "RM data_structures master04-representation_package §Item Structures"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # EHR exists, no directory — mints ${ehr_id}
data_sets: [cnf.directory.invalid.details_not_item_structure]
flow:
  - step: 1
    call: create_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.invalid.details_not_item_structure}"
    expect: validation_failed
  - step: 2                              # nothing was created by the refused request
    call: has_directory
    with: { ehr_id: "${ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: "The EHR still has no directory: the refused create committed nothing (verified by step 2)"
