# get_directory_at_time at a time AFTER the first directory version but BEFORE
# the second returns the first version.
id: I_EHR_DIRECTORY.get_directory_at_time-multiple_versions_first
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
capabilities: [DirectoryOps]
exercises: [Versioning]
profiles: [STANDARD]
test_purpose: >-
  get_directory_at_time for a time between the first and second directory commits
  returns the first version of the directory.
description: "Test get_directory_at_time on EHR with directory with multiple versions first version"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory_at_time"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.get_directory_at_time-multiple_versions_first"
  - "RM common §change_control (version extant at a time)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.directory.root_only, cnf.directory.v2]
flow:
  - step: 1
    call: create_directory
    with: { ehr_id: "${ehr_id}", directory: "${ds:cnf.directory.root_only}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      t0: created.commit_time
  - step: 2
    call: update_directory
    with:
      ehr_id: "${ehr_id}"
      directory: "${ds:cnf.directory.v2}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (AMB-3)
    expect: updated
    capture: { t1: updated.commit_time }
  - step: 3
    call: get_directory_at_time
    with: { ehr_id: "${ehr_id}", a_time: "${time:between(t0,t1)}" }
    expect: ok                            # after the first version, before the second
    assert:
      - { assert: equivalent, to: "${ds:cnf.directory.root_only}", ignoring: server_assigned }
ambiguities: [AMB-3]
