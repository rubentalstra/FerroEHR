# update_directory on a non-existent EHR errors on the missing EHR — 404.
id: I_EHR_DIRECTORY.update_directory-bad_ehr
kind: functional
component: EHR_DIRECTORY
sm_operation: I_EHR_DIRECTORY.update_directory
capabilities: [DirectoryOps]
profiles: [STANDARD]
test_purpose: >-
  update_directory on a random ehr_id when no EHRs exist is rejected: the EHR
  does not exist.
description: "Test update_directory on non-existent EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.update_directory"
  - "CNF platform_test_schedule master09 §I_EHR_DIRECTORY.update_directory-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server is empty"
data_sets: [cnf.directory.root_only]
flow:
  - step: 1
    call: update_directory
    with: { ehr_id: "11111111-1111-4111-8111-111111111111", preceding_version_uid: "11111111-1111-4111-8111-111111111111::cnf.fake::1", directory: "${ds:cnf.directory.root_only}" }
    expect: not_found                     # "the non existent ehr_id"
