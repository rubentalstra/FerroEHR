# ICS-conditional deprecated-media-type support — the UNSUPPORTED branch
# (simplified_formats master02 §MIME Types + the SDT-rename NOTE). The sibling
# of SF-DEPRECATED-media_supported: on a server that does NOT support the
# pre-1.1.0 SDT-era simplified-format media types, a FLAT commit sent with a
# deprecated media type is refused with unsupported_media (the Content-Type is
# not an accepted upload media type). Statement-declared behaviour (AMB-39, an
# option_select candidate): this is the sf-deprecated-types-unsupported branch.
# ECC-SF-004/005 ground.
#
# TODO: `variant` now selects the binding, but a HEADER-MUTATION variant
#       (deprecated_media_type = send a pre-1.1.0 SDT-era simplified-format
#       Content-Type) is not yet implemented in the driver; without it the runner
#       sends the current wt.flat Content-Type and the SUT correctly creates.
#       Needs a driver mechanism to override the request Content-Type per step
#       variant.
id: SF-DEPRECATED-media_unsupported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: sf-deprecated-types-unsupported  # AMB-39 option_select branch (registered at integration)
ambiguities: [AMB-39]
test_purpose: >-
  On a server that does not support the deprecated (pre-1.1.0 SDT-era)
  simplified-format media types, a FLAT COMPOSITION commit sent with a
  deprecated media type is refused as unsupported_media.
description: "Deprecated simplified-format media type refused (unsupported branch)"
spec_refs:
  - "ITS-REST simplified_formats master02 §MIME Types"
  - "ITS-REST simplified_formats master02 §Overview"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources.md §Simplified Formats (deprecated media types NOTE)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "Deprecated-media-type support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-39); ITS-REST simplified_formats master02 defines only the current wt.flat/wt.structured MIME types"
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat
    variant: deprecated_media_type        # instructs the interpreter to send a deprecated (SDT-era) simplified-format media type
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: unsupported_media              # unsupported branch: create_composition binding 415
