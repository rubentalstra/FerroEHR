# SPECITS-84 on the READ side, FLAT arm: a CONTRIBUTION requested with the FLAT
# MIME type is still served as a CANONICAL CONTRIBUTION envelope — the
# simplified serialization reaches `versions[i].data` and nothing else.
#
# GROUND. DOCS TEXT — docs/overview/Amendment_record.md, the SPECITS-84 row
# verbatim: "accept the Simplified Formats MIME types on CONTRIBUTION
# endpoints; the Simplified Formats serialization applies to `versions[].data`
# only, the CONTRIBUTION envelope remains canonical"; docs/overview/
# Resources.md §Simplified Formats fixes the `Accept` negotiation ("The client
# SHOULD use the `Accept` request header to specify the expected simplified
# response format") and the MIME types. The per-operation statement is
# docs-text-silent and grounded on the RELEASED OAS (cited AS the OAS — owner
# ruling 2026-07-28): operations/contribution_get.yaml §"Simplified Formats" —
# "When a Simplified Formats MIME type is requested, the **CONTRIBUTION
# envelope itself is still returned as canonical JSON** (`uid`, `versions[]`
# metadata, `audit`)."
#
# ONE BEHAVIOUR: the envelope's canonicity under a simplified `Accept`. The
# CONTRIBUTION is committed CANONICALLY in step 1, so the read is the only
# simplified thing in the exchange; what the inner payload then looks like in
# FLAT form is the COMPOSITION-route SF-FLAT/SF-MAP groups' subject, not this
# case's — asserting a FLAT key here would duplicate them and blur the row.
id: SF-CONTRIB-flat_read
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [SimplifiedFormats, ChangeSets]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A CONTRIBUTION read with Accept set to the FLAT MIME type is answered with
  the canonical CONTRIBUTION envelope — uid, versions[] metadata and audit
  unchanged by the simplified negotiation.
description: "Get CONTRIBUTION with a FLAT Accept, canonical envelope"
spec_refs:
  - "ITS-REST overview Amendment_record §SPECITS-84"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST simplified_formats master02 §MIME Types"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
  - "RM common §change_control (CONTRIBUTION.audit)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                              # precondition: a CONTRIBUTION of known uid, committed CANONICALLY
    call: commit_contribution
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: get_contribution
    format: wt-flat                      # Accept: application/openehr.wt.flat+json
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }   # the envelope stays canonical
      - { assert: field, path: "uid/value", equals: "${contribution_uid}" }
      - { assert: field, path: "audit/time_committed/value", exists: true }
