# A ctx participation with no function is refused (the negative twin of
# SF-CTX-participations_forms).
#
# `ctx/participation_*` keys set EVENT_CONTEXT.participations (ITS-REST
# simplified_formats master06 §Participation), and the RM types
# `PARTICIPATION.function` a DV_TEXT at 1..1
# (RM/docs/UML/classes/org.openehr.rm.common.participation.adoc §Attributes:
# "The function of the Party in this participation"). master06 §Participation
# supplies `participation_function:<i>` in every example it gives — for both the
# compact and the expanded identifier form — and says nothing about omitting it,
# so the class table governs: the FLAT document cannot populate a mandatory
# attribute it does not carry.
#
# The commit therefore has to fail rather than succeed with a fabricated empty
# function: an accepted commit would store a PARTICIPATION whose mandatory
# attribute carries no information, and every later read of that COMPOSITION
# would report a participation with a blank function as though the client had
# meant it. Simplified Formats is an OPTIONS capability, so this reject never
# gates CORE/STANDARD.
id: SF-CTX-participation_missing_function
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit whose ctx begins a participation (name + identifiers) but omits
  ctx/participation_function is rejected: the mandatory PARTICIPATION.function
  cannot be populated.
description: "FLAT commit with a ctx participation lacking its function is rejected"
spec_refs:
  - "RM common §participation (PARTICIPATION.function: DV_TEXT 1..1)"
  - "ITS-REST simplified_formats master06 §Participation"
  - "ITS-REST simplified_formats master04 §Validation"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.participation_no_function]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.participation_no_function}" }
    expect: validation_failed             # create_composition binding: 422
    assert:
      - { assert: message_exemplar, text: "ctx/participation_function:0 is required" }
