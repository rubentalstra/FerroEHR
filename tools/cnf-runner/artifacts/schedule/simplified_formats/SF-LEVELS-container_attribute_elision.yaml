# Level removal, part 1 (simplified_formats master04 §Container Attributes
# Elided from Paths). The container-attribute names of LOCATABLE-to-LOCATABLE
# relationships are NEVER present as path segments in FLAT — the parent connects
# directly to the child via the child's archetype node-id alias. Exercised
# functionally on the official Test_all_types template (cnf.opt.maximal): the
# FLAT keys carry no content/data/events/items segments; committing and reading
# back canonical proves those container attributes are present in the RM (elided
# only from the simplified path), reconstituting the full container chain.
id: SF-LEVELS-container_attribute_elision
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: LOCATABLE
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The container attributes elided from FLAT paths (COMPOSITION.content,
  OBSERVATION.data, HISTORY.events, EVENT.data, ITEM_TREE.items, CLUSTER.items)
  are present in the canonical RM after a collapsed-path FLAT commit.
description: "Container-attribute names elided from simplified paths, present in RM (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Container Attributes Elided from Paths"
  - "ITS-REST simplified_formats master04 §Level Removal"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # COMPOSITION.content elided from FLAT, present in RM (master04 §Container Attributes Elided)
      - { assert: field, path: "content[0]", exists: true }
      # OBSERVATION.data / HISTORY.events / EVENT.data / ITEM_TREE.items all elided, present in RM
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]", exists: true }
      # CLUSTER.items elided, present in RM (content[1] EVALUATION items[5] CLUSTER chain)
      - { assert: field, path: "content[1]/data/items[5]/items[0]", exists: true }
