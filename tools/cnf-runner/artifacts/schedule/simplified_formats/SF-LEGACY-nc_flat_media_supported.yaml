# ICS-conditional LEGACY alternative-format support — the SUPPORTED branch of
# the AMB-61 option pair, and the ACCEPTING TWIN the four legacy refusal
# cases require. ITS-REST overview Resources.md §Data representation makes
# the alternative formats a MAY ("Services MUST support at least one of the
# openEHR **XML** or **JSON** canonical formats ... while other alternative
# formats MAY be supported as well"), and §Alternative data formats
# enumerates `application/openehr.nc.flat+json` among them — so a server that
# DOES support the legacy type must accept the commit rather than refuse it.
# Nothing in the release forbids the support; that is exactly why the branch
# is statement-declared (register AMB-61, option_select) and not a fixed
# refusal.
#
# Without this case the legacy family would carry refusals only, and a server
# that answered 415 to EVERYTHING — including the types it declares support
# for — would pass. The sibling AMB-39 pair already carries its supported
# branch (SF-DEPRECATED-media_supported); this closes the same hole for
# AMB-61.
#
# One behaviour per case: the body is the same valid FLAT payload the
# unsupported-branch sibling sends, so only the ICS declaration selects which
# of the two runs.
id: SF-LEGACY-nc_flat_media_supported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: legacy-alt-formats-supported     # AMB-61 option_select branch
ambiguities: [AMB-61]
test_purpose: >-
  On a server that declares support for the legacy ECISFLAT media type, a
  COMPOSITION commit declaring application/openehr.nc.flat+json is accepted
  and created.
description: "Legacy ECISFLAT media type accepted (supported branch, 201)"
spec_refs:
  - "ITS-REST overview Resources.md §Alternative data formats"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
guards:
  - "Legacy alternative-format support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-61); ITS-REST overview Resources.md §Data representation makes the alternative formats a MAY"
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat
    variant: legacy_nc_flat_media        # sends Content-Type: application/openehr.nc.flat+json
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: created                      # supported branch: the legacy media type is accepted
