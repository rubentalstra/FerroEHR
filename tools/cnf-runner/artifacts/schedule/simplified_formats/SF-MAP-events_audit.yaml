# Per-RM-type suffix mapping: events + audit + link — INTERVAL_EVENT,
# POINT_EVENT, FEEDER_AUDIT, FEEDER_AUDIT_DETAILS, LINK (simplified_formats
# master05 §INTERVAL_EVENT, §POINT_EVENT, §FEEDER_AUDIT, §FEEDER_AUDIT_DETAILS,
# §LINK). original_content (DV_PARSABLE) and original_content_multimedia
# (DV_MULTIMEDIA) are mutually exclusive on FEEDER_AUDIT. Vectors: the
# INTERVAL_EVENT blocks (+sample_count), the POINT_EVENT block, the FEEDER_AUDIT
# minimal+full blocks, the FEEDER_AUDIT_DETAILS minimal+full blocks, and the
# LINK block.
id: SF-MAP-events_audit
kind: content
component: SIMPLIFIED_FORMATS
rm_class: FEEDER_AUDIT
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  INTERVAL_EVENT, POINT_EVENT, FEEDER_AUDIT, FEEDER_AUDIT_DETAILS and LINK map
  their FLAT suffixes to the documented RM paths, including the mutually
  exclusive original_content vs original_content_multimedia FEEDER_AUDIT leaves.
description: "INTERVAL_EVENT/POINT_EVENT/FEEDER_AUDIT(_DETAILS)/LINK mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §FEEDER_AUDIT"
  - "ITS-REST simplified_formats master05 §FEEDER_AUDIT_DETAILS"
  - "ITS-REST simplified_formats master05 §INTERVAL_EVENT"
  - "ITS-REST simplified_formats master05 §POINT_EVENT"
  - "ITS-REST simplified_formats master05 §LINK"
  - "RM common §FEEDER_AUDIT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "FEEDER_AUDIT.original_content and original_content_multimedia are mutually exclusive — only one may be set (master05 §FEEDER_AUDIT)"
constraint_context:
  template: cnf.opt.vitals
  path: "/content[openEHR-EHR-OBSERVATION.body_temperature.v1]/data/events"
decision_table:
  columns: ["rm_type", "suffix", "rm_path", "flat_type", "required"]
  rows:
    - ["INTERVAL_EVENT", "/width", "width", "DV_DURATION", "yes"]
    - ["INTERVAL_EVENT", "/math_function", "math_function", "DV_CODED_TEXT", "yes"]
    - ["INTERVAL_EVENT", "|sample_count", "sample_count", "INTEGER", "no"]
    - ["POINT_EVENT", "/time", "time", "DV_DATE_TIME", "yes"]
    - ["FEEDER_AUDIT", "/originating_system_audit", "originating_system_audit", "FEEDER_AUDIT_DETAILS", "yes"]
    - ["FEEDER_AUDIT", "/feeder_system_audit", "feeder_system_audit", "FEEDER_AUDIT_DETAILS", "no"]
    - ["FEEDER_AUDIT", "/originating_system_item_id:i", "originating_system_item_ids", "DV_IDENTIFIER", "no"]
    - ["FEEDER_AUDIT", "/feeder_system_item_id:i", "feeder_system_item_ids", "DV_IDENTIFIER", "no"]
    - ["FEEDER_AUDIT", "/original_content", "original_content", "DV_PARSABLE", "no"]
    - ["FEEDER_AUDIT", "/original_content_multimedia", "original_content", "DV_MULTIMEDIA", "no"]
    - ["FEEDER_AUDIT_DETAILS", "|system_id", "system_id", "String", "yes"]
    - ["FEEDER_AUDIT_DETAILS", "|version_id", "version_id", "String", "no"]
    - ["FEEDER_AUDIT_DETAILS", "|time", "time.value", "String", "no"]
    - ["FEEDER_AUDIT_DETAILS", "/subject", "subject", "PARTY_PROXY", "no"]
    - ["FEEDER_AUDIT_DETAILS", "/provider", "provider", "PARTY_IDENTIFIED", "no"]
    - ["FEEDER_AUDIT_DETAILS", "/location", "location", "PARTY_IDENTIFIED", "no"]
    - ["LINK", "|type", "type.value", "String", "yes"]
    - ["LINK", "|meaning", "meaning.value", "String", "yes"]
    - ["LINK", "|target", "target.value", "String", "yes"]
