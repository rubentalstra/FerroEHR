# FEEDER_AUDIT suffix mapping (simplified_formats master05 §FEEDER_AUDIT +
# §FEEDER_AUDIT_DETAILS). A FLAT commit carries a representative `_feeder_audit`
# key set on the body_temperature OBSERVATION (feeder_audit is a LOCATABLE
# attribute; master05 shows it on both the OBSERVATION and the EVENT), and the
# canonical read-back proves each master05 Flat-Path landed at its documented RM
# path: originating_system_audit|system_id (required) + |version_id;
# feeder_system_audit|system_id; and an originating_system_item_id:i DV_IDENTIFIER
# (|id + |issuer). Every asserted key traces to the master05 FEEDER_AUDIT /
# FEEDER_AUDIT_DETAILS mapping tables.
#
# Scope note: the placeholder decision-table also enumerated INTERVAL_EVENT,
# POINT_EVENT and LINK suffixes. Those are DROPPED here — the vitals carrier has
# no INTERVAL_EVENT/LINK vector, and POINT_EVENT time is already witnessed by the
# functional event cases (SF-INDEX-*). This case is the FEEDER_AUDIT witness; a
# dedicated interval-event/link template would carry the others.
id: SF-MAP-events_audit
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit carrying a _feeder_audit key set on an OBSERVATION round-trips to
  canonical JSON with a FEEDER_AUDIT whose originating/feeder system audits and
  originating_system_item_ids map to their documented RM paths.
description: "FLAT _feeder_audit commit, canonical FEEDER_AUDIT read-back (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §FEEDER_AUDIT"
  - "ITS-REST simplified_formats master05 §FEEDER_AUDIT_DETAILS"
  - "ITS-REST simplified_formats master05 §DV_IDENTIFIER"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM common §FEEDER_AUDIT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "master05 FEEDER_AUDIT table types `/originating_system_audit` as `<<PARTY_IDENTIFIED,PARTY_IDENTIFIED>>` (required yes) — an upstream editorial defect; RM common §FEEDER_AUDIT declares originating_system_audit as FEEDER_AUDIT_DETAILS, and the read-back is asserted against that correct RM type here"
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.feeder_audit]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.feeder_audit}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # FEEDER_AUDIT.originating_system_audit (required) -> FEEDER_AUDIT_DETAILS.system_id/version_id
      - { assert: field, path: "content[0]/feeder_audit/originating_system_audit/system_id", equals: "orig-sys" }
      - { assert: field, path: "content[0]/feeder_audit/originating_system_audit/version_id", equals: "v1.2" }
      # FEEDER_AUDIT.feeder_system_audit -> FEEDER_AUDIT_DETAILS.system_id
      - { assert: field, path: "content[0]/feeder_audit/feeder_system_audit/system_id", equals: "feeder-sys" }
      # FEEDER_AUDIT.originating_system_item_ids[i] -> DV_IDENTIFIER (id/issuer)
      - { assert: field, path: "content[0]/feeder_audit/originating_system_item_ids[0]/id", equals: "item-id-1" }
      - { assert: field, path: "content[0]/feeder_audit/originating_system_item_ids[0]/issuer", equals: "issuer1" }
