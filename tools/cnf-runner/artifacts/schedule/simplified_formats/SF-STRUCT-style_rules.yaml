# Structured-format style rules (simplified_formats master04 §Structured format).
# In Structured output the hierarchy is nested objects, attribute suffixes are
# pipe-prefixed properties, context is grouped under a ctx object, arrays are
# used throughout (even at 0..1 / 1..1), and empty objects are omitted.
# NOTE: functional wt-structured commit + read-back against cnf.opt.vitals; each
#       assertion below pins one master04 Structured syntax rule on the observed
#       read-back (verified live against the composed SUT). Instance indexing is
#       realised as array position (rule: arrays throughout), so a single
#       cardinality node still reads back as a one-element array — the
#       resolution of master04's own Rule-2-vs-Rule-5 conflict, adjudicated in
#       register AMB-153 (both master04's and master03's worked examples render
#       repeating nodes as array elements with no `:i` in the property name;
#       an explicit `:i` property is still ACCEPTED on input and folds into
#       array position).
id: SF-STRUCT-style_rules
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
ambiguities: [AMB-153]
test_purpose: >-
  The Structured output holds its syntax rules: nested-object hierarchy,
  pipe-prefixed suffix properties, ctx grouping, arrays throughout (even at
  single cardinality), and empty-object omission.
description: "Structured-format syntax rules (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Structured format"
  - "ITS-REST simplified_formats master04 §Conversion Between Formats"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.structured.vitals.minimal]
flow:
  - step: 1
    call: create_composition
    format: wt-structured                # intrinsic role; binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.structured.vitals.minimal}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version     # SM I_EHR_COMPOSITION.get_composition_at_version
    format: wt-structured
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      # nested-object hierarchy — vitals is a nested object down to the leaf
      - { assert: field, path: "vitals/body_temperature[0]/any_event[0]/temperature[0]", exists: true }
      # arrays used throughout even at single cardinality — COMPOSITION.category
      # is RM-mandatory (1..1) yet reads back array-wrapped (the [0] resolves)
      # with a pipe-prefixed coded suffix (rules 3 + 5)
      - { assert: field, path: "vitals/category[0]/|code", exists: true }
      # attribute suffixes are pipe-prefixed properties
      - { assert: field, path: "vitals/body_temperature[0]/any_event[0]/temperature[0]/|unit", equals: "Cel" }
      # context grouped under the ctx object
      - { assert: field, path: "ctx/language", equals: "en" }
      # empty objects omitted — the unpopulated optional Symptom ELEMENT is absent
      - { assert: field, path: "vitals/body_temperature[0]/any_event[0]/symptom", absent: true }
