# Structured-format style rules (simplified_formats master04 §Structured format
# — the six syntax rules). In the Structured format the hierarchy is nested
# objects, instance indices stay in property names, attribute suffixes are
# pipe-prefixed properties, context is grouped under a ctx object, arrays are
# used throughout (even at 0..1 / 1..1), and empty objects are omitted. This
# content decision table encodes each rule. Vector: the master04 Structured
# format example JSON block.
# TODO: convert this content decision table to a live-verified functional
#       STRUCTURED commit + wt-structured read-back against cnf.opt.vitals
#       asserting the six master04 Structured syntax rules; the fixture paths
#       exist in the re-authored cnf.opt.vitals carrier.
id: SF-STRUCT-style_rules
kind: content
component: SIMPLIFIED_FORMATS
rm_class: COMPOSITION
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The Structured format holds its six syntax rules: nested-object hierarchy,
  indices in property names, pipe-prefixed suffix properties, ctx grouping,
  arrays throughout, and empty-object omission.
description: "Structured-format six syntax rules (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Structured format"
  - "ITS-REST simplified_formats master04 §Conversion Between Formats"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
constraint_context:
  template: cnf.opt.vitals
  path: "/"
decision_table:
  columns: ["rule", "requirement", "holds"]
  rows:
    - ["hierarchy_nested_objects", "hierarchy_represented_by_nested_objects", "yes"]
    - ["indices_in_property_names", "instance_indices_remain_in_property_names", "yes"]
    - ["suffix_pipe_prefix", "attribute_suffixes_use_pipe_prefix", "yes"]
    - ["ctx_grouping", "context_grouped_under_ctx_property", "yes"]
    - ["arrays_throughout", "arrays_used_even_when_cardinality_single", "yes"]
    - ["empty_object_omission", "empty_objects_should_be_omitted", "yes"]
