# Structured-format empty-object omission + ctx grouping (simplified_formats
# master04 §Structured format rules 4 and 6). Context data is grouped under a
# `ctx` object; empty objects are omitted rather than serialised as `{}`;
# populated leaves are arrays of objects even at single cardinality.
# NOTE: functional wt-structured commit + read-back against cnf.opt.vitals. The
#       template's ITEM_TREE defines three ELEMENTs (at0004 Temperature =
#       DV_QUANTITY, at0005 Symptom = DV_CODED_TEXT, at0006 Body exposure =
#       DV_CODED_TEXT); the minimal fixture populates only Temperature, so the
#       two unpopulated optional ELEMENTs read back OMITTED (not serialised as
#       empty objects) — the master04 rule-6 proof. Read-back shape verified
#       live against the composed SUT.
id: SF-STRUCT-empty_object_omission
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  In Structured output, context is grouped under the ctx property, populated
  leaves are arrays of objects even at single cardinality, and unpopulated
  optional nodes are omitted rather than serialised as empty objects.
description: "Structured empty-object omission and ctx grouping (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Structured format"
  - "ITS-REST simplified_formats master06 §Context Information"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.structured.vitals.minimal]
flow:
  - step: 1
    call: create_composition
    format: wt-structured                # intrinsic role; binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.structured.vitals.minimal}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version     # SM I_EHR_COMPOSITION.get_composition_at_version
    format: wt-structured
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      # rule 4 — context grouped under the ctx object (composer_self carried there)
      - { assert: field, path: "ctx", exists: true }
      - { assert: field, path: "ctx/composer_self", exists: true }
      # populated leaf is an array of objects even at single (1..1) cardinality
      # (the [0] chain only resolves through the array-wrapped nodes)
      - { assert: field, path: "vitals/body_temperature[0]/any_event[0]/temperature[0]/|magnitude", exists: true }
      # rule 6 — the unpopulated optional ELEMENTs (at0005 Symptom, at0006 Body
      # exposure) are omitted, NOT serialised as empty objects
      - { assert: field, path: "vitals/body_temperature[0]/any_event[0]/symptom", absent: true }
      - { assert: field, path: "vitals/body_temperature[0]/any_event[0]/body_exposure", absent: true }
