# Per-RM-type suffix mapping: DV_MULTIMEDIA and DV_PARSABLE
# (simplified_formats master05 §DV_MULTIMEDIA, §DV_PARSABLE). Exercised
# functionally on the official Test_all_types template (cnf.opt.maximal): a FLAT
# commit carrying the multimedia_any (bare uri + |mediatype) and parsable_any
# (bare value + |formalism) leaves is read back canonical and the mapped RM
# paths asserted. Leaves: content[0] OBSERVATION items[12] DV_MULTIMEDIA
# (at0019), items[13] DV_PARSABLE (at0020).
id: SF-MAP-multimedia_parsable
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: DV_MULTIMEDIA
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  DV_MULTIMEDIA maps its bare value to uri/value and |mediatype to
  media_type/code_string; DV_PARSABLE maps the bare value to value and
  |formalism to formalism.
description: "DV_MULTIMEDIA + DV_PARSABLE suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_MULTIMEDIA"
  - "ITS-REST simplified_formats master05 §DV_PARSABLE"
  - "RM data_types §DV_MULTIMEDIA"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # DV_MULTIMEDIA bare value -> uri/value; |mediatype -> media_type/code_string (master05 §DV_MULTIMEDIA)
      - { assert: field, path: "content[0]/data/events[0]/data/items[12]/value/_type", equals: "DV_MULTIMEDIA" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[12]/value/uri/value", equals: "http://med.tube.com/sample" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[12]/value/media_type/code_string", equals: "video/mp4" }
      # DV_PARSABLE |value -> value; |formalism -> formalism (master05 §DV_PARSABLE)
      - { assert: field, path: "content[0]/data/events[0]/data/items[13]/value/_type", equals: "DV_PARSABLE" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[13]/value/value", equals: "instructions" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[13]/value/formalism", equals: "GLIF 1.0" }
