# |raw canonical embedding (simplified_formats master04 §Raw canonical JSON).
# The `|raw` suffix embeds a fully-formed canonical openEHR RM object (carrying
# its `_type`) directly into a FLAT input, bypassing attribute decomposition.
# The master04 example embeds a DV_QUANTITY via `.../systolic|raw`. This
# functional case commits the FLAT `|raw` DV_QUANTITY, reads the composition
# back as canonical JSON, and asserts the embedded object decomposed correctly
# into magnitude/units on the RM leaf.
id: SF-RAW-embedding
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit embedding a canonical DV_QUANTITY via the |raw suffix (with its
  _type present) round-trips to canonical JSON with the RM leaf carrying the
  embedded magnitude and units.
description: "FLAT |raw DV_QUANTITY embedding, canonical read-back decomposition"
spec_refs:
  - "ITS-REST simplified_formats master04 §Raw canonical JSON"
  - "ITS-REST simplified_formats master05 §DV_QUANTITY"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM data_types §DV_QUANTITY"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.raw_quantity]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.raw_quantity}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/magnitude", exists: true }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/units", exists: true }
