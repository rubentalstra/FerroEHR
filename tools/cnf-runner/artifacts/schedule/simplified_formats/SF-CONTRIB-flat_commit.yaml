# SPECITS-84 on the COMMIT side, FLAT arm: a canonical CONTRIBUTION envelope
# whose single member's `versions[].data` is a FLAT payload is accepted, and
# the version it creates reads back as a canonical COMPOSITION.
#
# GROUND. DOCS TEXT — docs/overview/Amendment_record.md, the SPECITS-84 row
# verbatim: "Add support for FLAT/SDT to Contribution REST API calls - accept
# the Simplified Formats MIME types on CONTRIBUTION endpoints; the Simplified
# Formats serialization applies to `versions[].data` only, the CONTRIBUTION
# envelope remains canonical"; docs/overview/Resources.md §Simplified Formats
# fixes the MIME type ("clients and servers MUST use: `application/
# openehr.wt.flat+json` for the Simplified Flat JSON format") and its
# `Content-Type` negotiation. The per-operation statement of the split is
# docs-text-silent and grounded on the RELEASED OAS (cited AS the OAS — owner
# ruling 2026-07-28): operations/contribution_create.yaml §"Simplified
# Formats" ("Only the inner versioned payload - each `versions[i].data` … - is
# serialized in the chosen FLAT or STRUCTURED form"). The
# `openehr-template-id` header the binding adds is ITS-REST overview
# Requests_and_responses.md §openehr-template-id.
#
# ONE BEHAVIOUR: that the inner FLAT payload is understood inside the
# CONTRIBUTION envelope. The carrier is the OFFICIAL Robot FLAT payload
# cnf.flat.vitals.minimal_ctx against cnf.opt.minimal_action — the same
# fixture/template pair SF-FLAT-commit_roundtrip_ctx_defaults and
# SF-MAP-instruction_details commit through the COMPOSITION route — so nothing
# about the payload is new here and a red row localizes to the CONTRIBUTION
# seam alone. The read-back is CANONICAL by design: the point is that the
# simplified INPUT produced a real RM COMPOSITION, not that any read
# negotiation works (that is SF-CONTRIB-flat_read).
id: SF-CONTRIB-flat_commit
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [SimplifiedFormats]        # the verdict-bearing capability; the tier axis is OPTIONS
exercises: [ChangeSets]                  # the CONTRIBUTION surface the case drives (no tier of its own)
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A CONTRIBUTION committed with the FLAT MIME type, whose canonical envelope
  carries a FLAT versions[].data payload, is accepted and the created VERSION
  reads back as a canonical COMPOSITION.
description: "CONTRIBUTION commit with FLAT versions[].data, canonical read-back"
spec_refs:
  - "ITS-REST overview Amendment_record §SPECITS-84"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST simplified_formats master02 §MIME Types"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
  - "RM common §change_control (CONTRIBUTION.versions)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: commit_contribution
    format: wt-flat                      # inner-payload role; binding adds openehr-template-id
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.flat.vitals.minimal_ctx}", change_type: creation }
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      first_version_uid: created.first_version_uid
    assert:
      # The envelope came back canonical — the SPECITS-84 half that a
      # simplified Content-Type must NOT change.
      - { assert: instance_of, rm_type: CONTRIBUTION }
  - step: 2
    call: I_EHR_COMPOSITION.get_composition_at_version   # cross-interface: the anchor is I_EHR_CONTRIBUTION
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${first_version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "context/start_time", exists: true }          # ctx/time -> now() (master06 default)
      - assert: field
        path: "content[0]/ism_transition/current_state/defining_code/code_string"
        equals: "${ds:cnf.flat.vitals.minimal_ctx#current_state_code}"       # named view (ACTION leaf)
postconditions:
  - assert: state
    text: >-
      The EHR carries a CONTRIBUTION whose single VERSION holds the COMPOSITION
      the FLAT inner payload described (verified by step 2).
