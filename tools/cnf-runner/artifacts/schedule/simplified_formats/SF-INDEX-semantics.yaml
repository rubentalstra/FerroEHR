# Instance-index / counter semantics (simplified_formats master04 §Instance
# Indexing). Repeating nodes (max>1 or max=-1) are indexed with zero-based
# colon notation (:0, :1, ...) appended after the node id and before the next
# separator, and the index applies at EVERY level. master04 §Instance Indexing
# gives the two worked forms this case commits: "Multiple observations in a
# composition" (body_temperature:0 / body_temperature:1) and "Multiple events
# in an observation" (any_event:0 / any_event:1). A single FLAT composition
# carries both levels with per-instance-distinct temperatures, and the
# canonical read-back proves each :i maps to a distinct RM instance: content[0]
# and content[1] are two OBSERVATIONs, each with two EVENTs, and the four
# temperature magnitudes land at their indexed positions.
id: SF-INDEX-semantics
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
ambiguities: [AMB-156]
test_purpose: >-
  A FLAT commit exercising zero-based colon indices at two levels
  (body_temperature:0/:1, each any_event:0/:1) round-trips to canonical JSON
  with two distinct OBSERVATIONs each holding two distinct EVENTs, the
  per-instance temperatures landing at the index-mapped positions.
description: "FLAT commit of multi-level indexed instances, canonical read-back"
spec_refs:
  - "ITS-REST simplified_formats master04 §Instance Indexing"
  - "ITS-REST simplified_formats master04 §Flat format"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM data_structures §HISTORY"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.index_semantics]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.index_semantics}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # body_temperature:0 -> content[0], body_temperature:1 -> content[1]
      # (multiple observations in a composition, master04 §Instance Indexing)
      - { assert: field, path: "content[1]", exists: true }
      # any_event:i -> events[i] within each observation, per-index temperature
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/magnitude", equals: 36.1 }
      - { assert: field, path: "content[0]/data/events[1]/data/items[0]/value/magnitude", equals: 36.2 }
      - { assert: field, path: "content[1]/data/events[0]/data/items[0]/value/magnitude", equals: 37.1 }
      - { assert: field, path: "content[1]/data/events[1]/data/items[0]/value/magnitude", equals: 37.2 }
