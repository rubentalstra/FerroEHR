# Re-adjudicated ECC-SF-006 (sf/flat-missing-template-id). A FLAT COMPOSITION
# commit carries no template identification: a FLAT payload never carries
# archetype_details.template_id, and the openehr-template-id header is omitted,
# so the server cannot resolve a template -> missing_template_id. The OPT IS
# provisioned, so the failure is purely the missing identification, not
# template_not_found.
id: SF-FLAT-missing_template_id
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT COMPOSITION commit with no openehr-template-id header (and a FLAT
  payload, which cannot carry archetype_details.template_id) cannot resolve a
  template and is rejected as missing_template_id.
description: "FLAT commit without template identification"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "ITS-REST simplified_formats master02 §MIME Types"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]            # the OPT exists — the failure is the missing header, not a missing OPT
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat
    variant: no_template_id              # instructs the interpreter to omit the otherwise-required openehr-template-id header
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: missing_template_id          # create_composition binding: 422 (openehr-template-id §)
    assert:
      - { assert: message_exemplar, text: "openehr-template-id required to resolve the template for a simplified COMPOSITION commit" }
# NOTE: `variant: no_template_id` selects the no_template_id binding, whose
#       format_headers omit the otherwise-required openehr-template-id header;
#       the SUT cannot resolve a template and rejects the commit 422. Verified
#       live against the composed SUT.
