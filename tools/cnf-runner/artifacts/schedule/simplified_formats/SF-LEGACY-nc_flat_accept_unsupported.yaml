# ICS-conditional LEGACY alternative-format support — the response-side
# (Accept) UNSUPPORTED branch for `application/openehr.nc.flat+json`, the
# mirror of SF-LEGACY-nc_flat_media_unsupported (the request-side
# Content-Type cell), so the ECISFLAT type is pinned on BOTH negotiation
# axes. ITS-REST overview Resources.md §Alternative data formats enumerates
# it under "Legacy or experimental formats":
# "`application/openehr.nc.flat+json` based on the ECISFLAT format".
# §Data representation makes support optional ("other alternative formats MAY
# be supported as well"), so whether a server serves it is
# implementation-defined — register AMB-61, option_select.
#
# Decisive docs-text sentence (Resources.md §Simplified Formats): "If the
# service cannot fulfill this aspect of the request, it MUST respond with
# HTTP status code `406 Not Acceptable`".
#
# The ACCEPTING twin of the option pair is
# SF-LEGACY-nc_flat_media_supported.
id: SF-LEGACY-nc_flat_accept_unsupported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: legacy-alt-formats-unsupported   # AMB-61 option_select branch
ambiguities: [AMB-61]
test_purpose: >-
  On a server that does not support the legacy ECISFLAT media type,
  requesting a template example with Accept: application/openehr.nc.flat+json
  cannot be fulfilled and is refused as not_acceptable.
description: "Legacy ECISFLAT Accept refused (unsupported branch, 406)"
spec_refs:
  - "ITS-REST overview Resources.md §Alternative data formats"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
guards:
  - "Legacy alternative-format support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-61); ITS-REST overview Resources.md §Data representation makes the alternative formats a MAY"
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example_legacy_nc_flat_accept   # sends Accept: application/openehr.nc.flat+json
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: not_acceptable               # Resources.md §Simplified Formats 406 MUST
