# Instance-index round-trip: multiple events in one observation
# (simplified_formats master04 §Instance Indexing — "Multiple events in an
# observation"). A FLAT commit carrying any_event:0 and any_event:1 under one
# body_temperature observation round-trips to canonical JSON with two EVENT
# entries under the observation history — proving the zero-based per-level index
# expands to distinct RM instances.
# NOTE: cnf.opt.vitals is the body_temperature carrier whose EVENT at0002 is
#       unbounded, so cnf.sf.flat.multi_event any_event:0/:1 expand to two
#       distinct EVENTs; verified live against the composed SUT (the step-2
#       events[1]/time/value field assertion is the proof).
id: SF-INDEX-multi_event_commit
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
ambiguities: [AMB-156]
test_purpose: >-
  A FLAT commit with any_event:0 and any_event:1 under one observation
  round-trips to canonical JSON with two events present under the history.
description: "FLAT commit of two indexed events, canonical read-back"
spec_refs:
  - "ITS-REST simplified_formats master04 §Instance Indexing"
  - "ITS-REST simplified_formats master04 §Flat format"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM data_structures §HISTORY"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.multi_event]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.multi_event}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "content[0]/data/events[1]/time/value", exists: true }
