# The master05 §INSTRUCTION_DETAILS mapping, driven through the wire: a FLAT
# commit carrying the three suffixes on the `_instruction_details` node itself,
# read back as canonical JSON with the RM attributes populated.
#
# THE THREE ROWS (ITS-REST simplified_formats master05-rm_mapping.adoc
# §INSTRUCTION_DETAILS, the mapping table and its example block, which agree):
#   `|path`            STRING  -> instruction_id.path     (Required: yes)
#   `|composition_uid` STRING  -> instruction_id.id       (Required: yes)
#   `|activity_id`     STRING  -> activity_id             (Required: yes)
# and §ACTION's `/_instruction_details` row, which types the node
# INSTRUCTION_DETAILS. The suffixes sit on the NODE — the section's own example
# spells all three as `…/conformance_action/_instruction_details|<suffix>` —
# not on a nested `instruction_id` child. The RM side is RM ehr
# §INSTRUCTION_DETAILS (`instruction_id`: LOCATABLE_REF 1..1, `activity_id`:
# String 1..1), whose LOCATABLE_REF carries the `path` and the `id`.
#
# The fixture uses the section's OWN example values, so each asserted value
# traces to a released line rather than to anything this catalogue invented.
# `namespace` and `type` on the LOCATABLE_REF are deliberately NOT asserted: no
# released row maps a flat suffix to either, so what a builder puts there is
# unassigned and asserting it would resolve a silence privately.
#
# CARRIER: cnf.opt.minimal_action is the one committed OPT with an ACTION arm
# (openEHR-EHR-ACTION.minimal.v1 under openEHR-EHR-COMPOSITION.minimal.v1), and
# cnf.flat.action_instruction_details is the official Robot FLAT payload for it
# plus the three suffixes — so ACTION's RM-mandatory `time` and `ism_transition`
# are satisfied by the known-good base rather than by anything new.
id: SF-MAP-instruction_details
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit carrying _instruction_details|path, |composition_uid and
  |activity_id round-trips to canonical JSON with INSTRUCTION_DETAILS
  instruction_id.path, instruction_id.id and activity_id populated.
description: "FLAT commit of ACTION _instruction_details, canonical read-back"
spec_refs:
  - "ITS-REST simplified_formats master05 §INSTRUCTION_DETAILS"
  - "ITS-REST simplified_formats master05 §ACTION"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM ehr §instruction_details"
  - "RM common §locatable_ref"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.action_instruction_details]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.action_instruction_details}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "content[0]/_type", equals: "ACTION" }
      # `|path` -> instruction_id.path
      - { assert: field, path: "content[0]/instruction_details/instruction_id/path", equals: "/content[openEHR-EHR-SECTION.conformance_section.v0]/items[openEHR-EHR-INSTRUCTION.conformance_instruction.v0]" }
      # `|composition_uid` -> instruction_id.id
      - { assert: field, path: "content[0]/instruction_details/instruction_id/id/value", equals: "4cdc3017-d8c5-4cd3-9900-f3bb7171d006" }
      # `|activity_id` -> activity_id (a bare String on the RM class)
      - { assert: field, path: "content[0]/instruction_details/activity_id", equals: "activities[at0001]" }
