# Per-RM-type suffix mapping: the text family — DV_TEXT, CODE_PHRASE,
# DV_CODED_TEXT (simplified_formats master05 §DV_TEXT, §CODE_PHRASE,
# §DV_CODED_TEXT). Exercised functionally on the official Test_all_types
# template (cnf.opt.maximal): a FLAT commit carrying the text/coded_text/
# coded_text_terminology leaves is read back canonical, and the RM paths the
# |value/|code/|terminology suffixes map to are asserted. Leaves: content[0]
# OBSERVATION items[0] DV_TEXT (at0004), items[1] DV_CODED_TEXT (at0005,
# terminology local), items[2] DV_CODED_TEXT (at0006, terminology SNOMED-CT).
id: SF-MAP-dv_text_coded
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: DV_CODED_TEXT
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The DV_TEXT and DV_CODED_TEXT FLAT suffixes map to their documented RM paths:
  DV_TEXT |value -> value; DV_CODED_TEXT |value -> value, |code ->
  defining_code/code_string, |terminology -> defining_code/terminology_id/value.
description: "Text-family (DV_TEXT/DV_CODED_TEXT/CODE_PHRASE) suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_CODED_TEXT"
  - "ITS-REST simplified_formats master05 §DV_TEXT"
  - "ITS-REST simplified_formats master05 §CODE_PHRASE"
  - "RM data_types §DV_CODED_TEXT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # DV_TEXT |value -> value (master05 §DV_TEXT)
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/_type", equals: "DV_TEXT" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/value", equals: "text value" }
      # DV_CODED_TEXT |code/|value/|terminology (master05 §DV_CODED_TEXT + §CODE_PHRASE)
      - { assert: field, path: "content[0]/data/events[0]/data/items[1]/value/_type", equals: "DV_CODED_TEXT" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[1]/value/value", equals: "N.84 label" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[1]/value/defining_code/code_string", equals: "N.84" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[2]/value/defining_code/terminology_id/value", equals: "SNOMED-CT" }
