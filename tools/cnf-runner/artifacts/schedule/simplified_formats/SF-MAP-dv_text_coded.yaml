# Per-RM-type suffix mapping: the text family — DV_TEXT, CODE_PHRASE,
# TERM_MAPPING, DV_CODED_TEXT (simplified_formats master05 §DV_TEXT,
# §CODE_PHRASE, §TERM_MAPPING, §DV_CODED_TEXT + §When a DV_CODED_TEXT becomes a
# DV_TEXT). Vectors: the DV_TEXT blocks (value; +formatting/_language/_encoding/
# _mapping), CODE_PHRASE blocks (code/terminology; +preferred_term),
# TERM_MAPPING blocks (match/target; +purpose), DV_CODED_TEXT blocks
# (value/code/terminology; +preferred_term/formatting/mappings; and the |other
# free-text open-value-set block).
id: SF-MAP-dv_text_coded
kind: content
component: SIMPLIFIED_FORMATS
rm_class: DV_CODED_TEXT
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The DV_TEXT/CODE_PHRASE/TERM_MAPPING/DV_CODED_TEXT FLAT suffixes map to their
  documented RM paths, including the |other open-value-set suffix that
  serialises the leaf as DV_TEXT.
description: "Text-family (DV_TEXT/CODE_PHRASE/TERM_MAPPING/DV_CODED_TEXT) suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_CODED_TEXT"
  - "ITS-REST simplified_formats master05 §DV_TEXT"
  - "ITS-REST simplified_formats master05 §CODE_PHRASE"
  - "ITS-REST simplified_formats master05 §TERM_MAPPING"
  - "ITS-REST simplified_formats master04 §Open Value-Sets and the |other Suffix"
  - "RM data_types §DV_CODED_TEXT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
constraint_context:
  template: cnf.opt.vitals
  path: "/content[openEHR-EHR-OBSERVATION.body_temperature.v1]/data/events/state/items/value"
decision_table:
  columns: ["rm_type", "suffix", "rm_path", "required"]
  rows:
    - ["DV_TEXT", "|value", "value", "yes"]
    - ["DV_TEXT", "|formatting", "formatting", "no"]
    - ["DV_TEXT", "/_language", "language", "no"]
    - ["DV_TEXT", "/_encoding", "encoding", "no"]
    - ["DV_TEXT", "/_mapping:i", "mappings", "no"]
    - ["CODE_PHRASE", "|code", "code_string", "yes"]
    - ["CODE_PHRASE", "|terminology", "terminology_id.value", "yes"]
    - ["CODE_PHRASE", "|preferred_term", "preferred_term", "no"]
    - ["TERM_MAPPING", "|match", "match", "yes"]
    - ["TERM_MAPPING", "/target", "target", "yes"]
    - ["TERM_MAPPING", "/purpose", "purpose", "no"]
    - ["DV_CODED_TEXT", "|code", "defining_code.code_string", "yes"]
    - ["DV_CODED_TEXT", "|value", "value", "conditional"]
    - ["DV_CODED_TEXT", "|terminology", "defining_code.terminology_id.value", "conditional"]
    - ["DV_CODED_TEXT", "|preferred_term", "defining_code.preferred_term", "no"]
    - ["DV_CODED_TEXT", "|other", "value_as_DV_TEXT", "no"]
    - ["DV_CODED_TEXT", "|formatting", "formatting", "no"]
    - ["DV_CODED_TEXT", "/_mapping:i", "mappings", "no"]
