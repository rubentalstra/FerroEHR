# ICS-conditional LEGACY alternative-format support — the request-side
# (Content-Type) UNSUPPORTED branch for `application/openehr.tds2+xml`, the
# mirror of SF-LEGACY-tds2_accept_unsupported (the response-side Accept
# cell), so the TDS2 type is pinned on BOTH negotiation axes. ITS-REST
# overview Resources.md §Alternative data formats enumerates it under "Legacy
# or experimental formats": "`application/openehr.tds2+xml` for TDS
# simplification of RM as XML". §Data representation makes support optional
# ("other alternative formats MAY be supported as well"), so whether a server
# accepts it is implementation-defined — register AMB-61, option_select.
#
# Decisive docs-text sentence (Resources.md §XML Format): "If the service
# cannot process the request payload ... it MUST respond with HTTP status
# code `415 Unsupported Media Type`" — the same MUST §Simplified Formats
# states for the simplified types.
#
# One behaviour per case: the body is the same valid canonical-XML
# COMPOSITION the create_composition-xml case commits, so only the declared
# media type distinguishes this exchange. The ACCEPTING twin of the option
# pair is SF-LEGACY-nc_flat_media_supported.
id: SF-LEGACY-tds2_media_unsupported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: legacy-alt-formats-unsupported   # AMB-61 option_select branch
ambiguities: [AMB-61]
test_purpose: >-
  On a server that does not support the legacy TDS2 media type, a COMPOSITION
  commit declaring application/openehr.tds2+xml is refused as
  unsupported_media.
description: "Legacy TDS2 media type refused (unsupported branch, 415)"
spec_refs:
  - "ITS-REST overview Resources.md §Alternative data formats"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 415 Unsupported Media Type)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
guards:
  - "Legacy alternative-format support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-61); ITS-REST overview Resources.md §Data representation makes the alternative formats a MAY"
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1.xml]
flow:
  - step: 1
    call: create_composition
    format: canonical-xml                 # the BODY role; the binding's format_headers sends the TDS2 media type
    variant: legacy_tds2_media            # sends Content-Type: application/openehr.tds2+xml
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1.xml}" }
    expect: unsupported_media             # Resources.md §XML Format 415 MUST
