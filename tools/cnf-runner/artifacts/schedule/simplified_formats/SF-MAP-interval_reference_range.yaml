# Per-RM-type suffix mapping: DV_INTERVAL and REFERENCE_RANGE
# (simplified_formats master05 §DV_INTERVAL, §REFERENCE_RANGE). Both carry
# /lower and /upper (typed T) plus the four boundary-flag suffixes; a
# REFERENCE_RANGE additionally requires /meaning (DV_TEXT). Boundary flags
# default (unbounded=false, included=true) and appear on output only when they
# differ from the default. Vectors: the DV_INTERVAL lower/upper blocks (+bound
# flags) and the REFERENCE_RANGE single- and two-range blocks.
id: SF-MAP-interval_reference_range
kind: content
component: SIMPLIFIED_FORMATS
rm_class: DV_INTERVAL
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  DV_INTERVAL and REFERENCE_RANGE map /lower, /upper and the four boundary-flag
  suffixes to their RM paths (REFERENCE_RANGE's under range.*), with
  REFERENCE_RANGE additionally carrying the required /meaning DV_TEXT.
description: "DV_INTERVAL + REFERENCE_RANGE lower/upper/boundary-flag mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_INTERVAL"
  - "ITS-REST simplified_formats master05 §REFERENCE_RANGE"
  - "RM data_types §DV_INTERVAL"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
constraint_context:
  template: cnf.opt.vitals
  path: "/content[openEHR-EHR-OBSERVATION.body_temperature.v1]/data/events/data/items/value"
decision_table:
  columns: ["rm_type", "suffix", "rm_path", "flat_type", "required"]
  rows:
    - ["DV_INTERVAL", "/lower", "lower", "T", "no"]
    - ["DV_INTERVAL", "/upper", "upper", "T", "no"]
    - ["DV_INTERVAL", "|lower_unbounded", "lower_unbounded", "Boolean", "no"]
    - ["DV_INTERVAL", "|upper_unbounded", "upper_unbounded", "Boolean", "no"]
    - ["DV_INTERVAL", "|lower_included", "lower_included", "Boolean", "no"]
    - ["DV_INTERVAL", "|upper_included", "upper_included", "Boolean", "no"]
    - ["REFERENCE_RANGE", "/lower", "range.lower", "T", "no"]
    - ["REFERENCE_RANGE", "/upper", "range.upper", "T", "no"]
    - ["REFERENCE_RANGE", "|lower_unbounded", "range.lower_unbounded", "Boolean", "no"]
    - ["REFERENCE_RANGE", "|upper_unbounded", "range.upper_unbounded", "Boolean", "no"]
    - ["REFERENCE_RANGE", "|lower_included", "range.lower_included", "Boolean", "no"]
    - ["REFERENCE_RANGE", "|upper_included", "range.upper_included", "Boolean", "no"]
    - ["REFERENCE_RANGE", "/meaning", "meaning", "DV_TEXT", "yes"]
