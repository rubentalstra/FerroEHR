# Per-RM-type suffix mapping: the context types — EVENT_CONTEXT, PARTICIPATION,
# ISM_TRANSITION (simplified_formats master05 §EVENT_CONTEXT, §PARTICIPATION,
# §ISM_TRANSITION). Exercised functionally on the official minimal_action
# template (cnf.opt.minimal_action), whose FLAT instance (cnf.flat.vitals.minimal_ctx)
# carries ctx/time, ctx/setting, ctx/participation_* and an ACTION
# ism_transition: the commit is read back canonical and the mapped RM paths
# asserted.
id: SF-MAP-context
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: EVENT_CONTEXT
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  EVENT_CONTEXT ctx/time -> context/start_time and ctx/setting ->
  context/setting; PARTICIPATION |function -> participations/function; and
  ISM_TRANSITION /current_state -> ism_transition/current_state map to the
  documented RM paths.
description: "EVENT_CONTEXT/PARTICIPATION/ISM_TRANSITION mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §EVENT_CONTEXT"
  - "ITS-REST simplified_formats master05 §PARTICIPATION"
  - "ITS-REST simplified_formats master05 §ISM_TRANSITION"
  - "ITS-REST simplified_formats master06 §time + §setting"
  - "RM composition §EVENT_CONTEXT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # EVENT_CONTEXT: ctx/time -> start_time (master06 default), ctx/setting -> setting (master05 §EVENT_CONTEXT)
      - { assert: field, path: "context/_type", equals: "EVENT_CONTEXT" }
      - { assert: field, path: "context/start_time", exists: true }
      - { assert: field, path: "context/setting/defining_code/code_string", equals: "238" }
      # PARTICIPATION |function -> participations/function (master05 §PARTICIPATION)
      - { assert: field, path: "context/participations[0]/function/value", equals: "requester" }
      # ISM_TRANSITION /current_state -> ism_transition/current_state (master05 §ISM_TRANSITION)
      - { assert: field, path: "content[0]/ism_transition/current_state/defining_code/code_string", equals: "532" }
