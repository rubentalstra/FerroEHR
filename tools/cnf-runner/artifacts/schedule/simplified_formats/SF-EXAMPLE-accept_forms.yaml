# Re-adjudicated ECC-SF-010 (sf/template-example-accept-forms). GET a template
# example (the "Get example data by template" endpoint) in each of the four
# Accept_LOCATABLE forms — canonical JSON, canonical XML, FLAT, STRUCTURED —
# each returning the example instance in the negotiated format. The example
# endpoint has no SM operation (grep of SM i_definition_adl14.adoc: no example
# op), so the case anchors to the closest genuine SM operation get_opt per the
# The wire realization is the distinct `variant: example`
# binding (path .../example). An intrinsic-format case: one get step per form.
id: SF-EXAMPLE-accept_forms
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  Retrieving a template example under each of the four LOCATABLE Accept forms
  (canonical JSON/XML and the FLAT/STRUCTURED simplified forms) returns the
  example COMPOSITION instance in the negotiated format.
description: "GET a template example in each of the four Accept forms"
spec_refs:
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST simplified_formats master05 §COMPOSITION"
  - "ITS-REST specifications §definition_template_adl1.4_example_get"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example                      # selects the example-generation realization of get_opt
    format: canonical-json
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
  - step: 2
    call: get_opt
    variant: example
    format: canonical-xml
    with: { template_id: "minimal_action.en.v1" }
    expect: ok
  - step: 3
    call: get_opt
    variant: example
    format: wt-flat
    with: { template_id: "minimal_action.en.v1" }
    expect: ok
  - step: 4
    call: get_opt
    variant: example
    format: wt-structured
    with: { template_id: "minimal_action.en.v1" }
    expect: ok
