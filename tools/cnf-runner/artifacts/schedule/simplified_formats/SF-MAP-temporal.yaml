# Per-RM-type suffix mapping: the temporal family — DV_DATE, DV_DATE_TIME,
# DV_TIME, DV_DURATION (simplified_formats master05 §DV_DATE, §DV_DATE_TIME,
# §DV_TIME, §DV_DURATION). Vectors: the bare-value blocks and the full blocks
# (status/_accuracy/normal_range/other_reference_ranges) for each type. The bare
# (empty-suffix) value carries the ISO 8601 lexical form; DV_DATE/DATE_TIME/TIME
# carry /_accuracy as a DV_DURATION.
id: SF-MAP-temporal
kind: content
component: SIMPLIFIED_FORMATS
rm_class: DV_DATE_TIME
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The DV_DATE, DV_DATE_TIME, DV_TIME and DV_DURATION FLAT suffixes map to their
  documented RM paths: the bare value (ISO 8601), the /_accuracy DV_DURATION on
  the date/time types, DV_DURATION's numeric accuracy, and the shared range
  attributes.
description: "Temporal-family (DV_DATE/DATE_TIME/TIME/DURATION) suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_DATE_TIME"
  - "ITS-REST simplified_formats master05 §DV_DATE"
  - "ITS-REST simplified_formats master05 §DV_TIME"
  - "ITS-REST simplified_formats master05 §DV_DURATION"
  - "RM data_types §DV_DATE_TIME"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
constraint_context:
  template: cnf.opt.vitals
  path: "/content[openEHR-EHR-OBSERVATION.body_temperature.v1]/data/events/time"
decision_table:
  columns: ["rm_type", "suffix", "rm_path", "flat_type", "required"]
  rows:
    - ["DV_DATE", "", "value", "String", "yes"]
    - ["DV_DATE", "/_accuracy", "accuracy", "DV_DURATION", "no"]
    - ["DV_DATE", "|magnitude_status", "magnitude_status", "String", "no"]
    - ["DV_DATE", "|normal_status", "normal_status.code_string", "String", "no"]
    - ["DV_DATE", "/_normal_range", "normal_range", "DV_INTERVAL<DV_DATE>", "no"]
    - ["DV_DATE", "/_other_reference_ranges:i", "_other_reference_ranges", "REFERENCE_RANGE<DV_DATE>", "no"]
    - ["DV_DATE_TIME", "", "value", "String", "yes"]
    - ["DV_DATE_TIME", "/_accuracy", "accuracy", "DV_DURATION", "no"]
    - ["DV_DATE_TIME", "|magnitude_status", "magnitude_status", "String", "no"]
    - ["DV_DATE_TIME", "|normal_status", "normal_status.code_string", "String", "no"]
    - ["DV_DATE_TIME", "/_normal_range", "normal_range", "DV_INTERVAL<DV_DATE_TIME>", "no"]
    - ["DV_DATE_TIME", "/_other_reference_ranges:i", "_other_reference_ranges", "REFERENCE_RANGE<DV_DATE_TIME>", "no"]
    - ["DV_TIME", "", "value", "String", "yes"]
    - ["DV_TIME", "/_accuracy", "accuracy", "DV_DURATION", "no"]
    - ["DV_TIME", "|magnitude_status", "magnitude_status", "String", "no"]
    - ["DV_TIME", "|normal_status", "normal_status.code_string", "String", "no"]
    - ["DV_TIME", "/_normal_range", "normal_range", "DV_INTERVAL<DV_TIME>", "no"]
    - ["DV_TIME", "/_other_reference_ranges:i", "_other_reference_ranges", "REFERENCE_RANGE<DV_TIME>", "no"]
    - ["DV_DURATION", "", "value", "String", "yes"]
    - ["DV_DURATION", "|accuracy", "accuracy", "Real", "no"]
    - ["DV_DURATION", "|accuracy_is_percent", "accuracy_is_percent", "Boolean", "no"]
    - ["DV_DURATION", "|magnitude_status", "magnitude_status", "String", "no"]
    - ["DV_DURATION", "|normal_status", "normal_status.code_string", "String", "no"]
    - ["DV_DURATION", "/_normal_range", "normal_range", "DV_INTERVAL<DV_DURATION>", "no"]
    - ["DV_DURATION", "/_other_reference_ranges:i", "_other_reference_ranges", "REFERENCE_RANGE<DV_DURATION>", "no"]
