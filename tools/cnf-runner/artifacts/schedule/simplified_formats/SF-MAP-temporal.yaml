# Per-RM-type suffix mapping: the temporal family — DV_DATE, DV_DATE_TIME,
# DV_TIME, DV_DURATION (simplified_formats master05 §DV_DATE, §DV_DATE_TIME,
# §DV_TIME, §DV_DURATION). Exercised functionally on the official Test_all_types
# template (cnf.opt.maximal): a FLAT commit carrying the date/datetime/time/
# duration_any leaves (bare ISO 8601 lexical values) is read back canonical and
# the bare value -> RM `value` mapping is asserted per type. Leaves: content[0]
# OBSERVATION items[5] DV_DATE (at0009), items[6] DV_DATE_TIME (at0010), items[8]
# DV_TIME (at0012), items[11] DV_DURATION (at0018).
id: SF-MAP-temporal
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: DV_DATE_TIME
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The DV_DATE, DV_DATE_TIME, DV_TIME and DV_DURATION FLAT bare (empty-suffix)
  values map to the RM `value` attribute carrying the ISO 8601 lexical form.
description: "Temporal-family (DV_DATE/DATE_TIME/TIME/DURATION) suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_DATE_TIME"
  - "ITS-REST simplified_formats master05 §DV_DATE"
  - "ITS-REST simplified_formats master05 §DV_TIME"
  - "ITS-REST simplified_formats master05 §DV_DURATION"
  - "RM data_types §DV_DATE_TIME"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # DV_DATE bare value -> value (master05 §DV_DATE)
      - { assert: field, path: "content[0]/data/events[0]/data/items[5]/value/_type", equals: "DV_DATE" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[5]/value/value", equals: "2019-03-22" }
      # DV_DATE_TIME bare value -> value (master05 §DV_DATE_TIME)
      - { assert: field, path: "content[0]/data/events[0]/data/items[6]/value/_type", equals: "DV_DATE_TIME" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[6]/value/value", equals: "2019-03-22T22:36:25.23+01:00" }
      # DV_TIME bare value -> value (master05 §DV_TIME)
      - { assert: field, path: "content[0]/data/events[0]/data/items[8]/value/_type", equals: "DV_TIME" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[8]/value/value", equals: "22:36:25.23" }
      # DV_DURATION bare value -> value (master05 §DV_DURATION)
      - { assert: field, path: "content[0]/data/events[0]/data/items[11]/value/_type", equals: "DV_DURATION" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[11]/value/value", equals: "P2DT7H16M" }
