# ctx composer: composer_self (simplified_formats master06 §Composer). Setting
# `ctx/composer_self: true` sets the COMPOSITION.composer to PARTY_SELF. This
# functional case commits a FLAT composition carrying ctx/composer_self, reads
# it back as canonical JSON, and asserts the composer is a PARTY_SELF (the
# composer_self branch of the master06 composer default rules).
id: SF-CTX-composer_self
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit with ctx/composer_self:true round-trips to canonical JSON with
  COMPOSITION.composer typed PARTY_SELF.
description: "ctx/composer_self:true sets the composer to PARTY_SELF"
spec_refs:
  - "ITS-REST simplified_formats master06 §Composer"
  - "ITS-REST simplified_formats master05 §PARTY_SELF"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM common §PARTY_SELF"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "composer/_type", equals: "PARTY_SELF" }
