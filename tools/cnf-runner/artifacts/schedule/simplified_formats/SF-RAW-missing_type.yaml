# |raw canonical embedding — the _type requirement (simplified_formats master04
# §Raw canonical JSON: "The raw JSON value must include the `_type` property
# indicating the openEHR type"). A FLAT commit whose `|raw` object omits `_type`
# cannot be resolved to a concrete RM class and is rejected as invalid content.
# Simplified Formats is an OPTIONS capability, so this reject never gates
# CORE/STANDARD.
id: SF-RAW-missing_type
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit whose |raw embedded object omits the mandatory _type property is
  rejected: the embedded canonical object cannot be typed to a concrete RM class.
description: "FLAT |raw embedding without _type is rejected"
spec_refs:
  - "ITS-REST simplified_formats master04 §Raw canonical JSON"
  - "ITS-REST simplified_formats master04 §Validation"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.raw_no_type]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.raw_no_type}" }
    expect: validation_failed             # create_composition binding: 422
    assert:
      - { assert: message_exemplar, text: "|raw embedded canonical object must carry _type" }
