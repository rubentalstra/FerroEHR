# ctx participation-identifier input forms (simplified_formats master06
# §Participation). ctx/participation_* keys set EVENT_CONTEXT.participations; the
# performer identifiers may be given COMPACTLY (one key holding the
# semicolon-separated `issuer::assigner::id::type` quad) or EXPANDED (one indexed
# key per component: `|issuer:j` / `|assigner:j` / `|id:j` / `|type:j`) — master06
# §Participation: "participation_identifiers can be set in a compact or non
# compact form." This case commits both forms carrying the SAME identifier data
# and reads each back canonically, proving both resolve to identical
# EVENT_CONTEXT.participations[0].performer.identifiers (DV_IDENTIFIER
# id/issuer/assigner/type) with the base function on the participation.
id: SF-CTX-participations_forms
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The compact (semicolon-quad) and expanded (one-key-per-component) ctx
  participation_identifiers forms both commit and read back to the same
  EVENT_CONTEXT.participations performer identifiers.
description: "ctx participations: compact vs expanded identifier forms (master06)"
spec_refs:
  - "ITS-REST simplified_formats master06 §Participation"
  - "ITS-REST simplified_formats master05 §PARTICIPATION"
  - "ITS-REST simplified_formats master05 §DV_IDENTIFIER"
  - "RM ehr §EVENT_CONTEXT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.participation_compact, cnf.sf.flat.participation_expanded]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.participation_compact}" }
    expect: created
    capture: { compact_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${compact_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "context/participations[0]/function/value", equals: "requester" }
      - { assert: field, path: "context/participations[0]/performer/identifiers[0]/id", equals: "id1" }
      - { assert: field, path: "context/participations[0]/performer/identifiers[0]/issuer", equals: "issuer1" }
      - { assert: field, path: "context/participations[0]/performer/identifiers[0]/assigner", equals: "assigner1" }
      - { assert: field, path: "context/participations[0]/performer/identifiers[0]/type", equals: "PERSON" }
  - step: 3
    call: create_composition
    format: wt-flat
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.participation_expanded}" }
    expect: created
    capture: { expanded_uid: created.version_uid }
  - step: 4
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${expanded_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # identical RM effect to the compact form (master06 §Participation)
      - { assert: field, path: "context/participations[0]/function/value", equals: "requester" }
      - { assert: field, path: "context/participations[0]/performer/identifiers[0]/id", equals: "id1" }
      - { assert: field, path: "context/participations[0]/performer/identifiers[0]/issuer", equals: "issuer1" }
      - { assert: field, path: "context/participations[0]/performer/identifiers[0]/assigner", equals: "assigner1" }
      - { assert: field, path: "context/participations[0]/performer/identifiers[0]/type", equals: "PERSON" }
