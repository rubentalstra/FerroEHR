# Re-adjudicated ECC-SF-008 (sf/flat-reject-other-with-code). A FLAT commit
# combining |other with |code (and |value) on one coded leaf is rejected.
# master04 §Open Value-Sets is a MUST ("|other is mutually exclusive with
# |code, |value and |terminology on the same leaf path; servers MUST reject
# combinations"), so the reject is normatively mandated (verified at OPTIONS
# tier, since Simplified Formats is an OPTIONS capability).
#
# WHICH BRANCH: no released text assigns the reject a status — register
# AMB-207 adjudicates 400. The suffix conflict is decidable from the submitted
# document alone, without an Operational Template, so the body never reaches
# the "could be converted to a resource" stage `responses/422.yaml` describes;
# it is the unconvertible half `responses/400.yaml` owns.
id: SF-FLAT-reject_other_with_code
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
ambiguities: [AMB-207]
test_purpose: >-
  A FLAT COMPOSITION commit that carries the |other suffix together with |code
  (and |value) on the same coded leaf path is rejected: the suffixes are
  mutually exclusive and servers MUST reject the combination.
description: "FLAT commit with |other and |code on one coded leaf"
spec_refs:
  - "ITS-REST simplified_formats master04 §Open Value-Sets and the |other Suffix"
  - "ITS-REST simplified_formats master05 §DV_CODED_TEXT"
  - "RM data_types §DV_CODED_TEXT"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Resources §Simplified Formats"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.other_with_code]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.other_with_code}" }
    expect: bad_request                   # template-INDEPENDENT format violation — register AMB-207
    assert:
      - { assert: message_exemplar, text: "|other is mutually exclusive with |code, |value and |terminology on the same leaf" }
