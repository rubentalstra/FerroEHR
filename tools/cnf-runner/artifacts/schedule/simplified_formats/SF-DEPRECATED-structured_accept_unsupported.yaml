# ICS-conditional DEPRECATED simplified-format support — the response-side
# (Accept) UNSUPPORTED branch for
# `application/openehr.wt.structured.schema+json`, the STRUCTURED twin of
# SF-DEPRECATED-accept_unsupported (which drives the FLAT `.schema+json`
# type). ITS-REST overview Resources.md §Simplified Formats deprecates the
# two together: "The `application/openehr.wt.flat.schema+json` and
# `application/openehr.wt.structured.schema+json` which were historically
# available in earlier versions of this specification, are now deprecated and
# will be removed in a future version of the specification."
#
# Decisive docs-text sentence (same section): "If the service cannot fulfill
# this aspect of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`". Whether the deprecated support still exists is
# statement-declared (register AMB-39, option_select); this is the
# unsupported branch, whose ACCEPTING twin is the option pair's
# supported branch (SF-DEPRECATED-media_supported).
id: SF-DEPRECATED-structured_accept_unsupported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: sf-deprecated-types-unsupported  # AMB-39 option_select branch
ambiguities: [AMB-39]
test_purpose: >-
  On a server that does not serve the deprecated STRUCTURED representation,
  requesting a template example with
  Accept: application/openehr.wt.structured.schema+json cannot be fulfilled
  and is refused as not_acceptable.
description: "Deprecated STRUCTURED Accept refused (unsupported branch, 406)"
spec_refs:
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Resources.md §Data representation"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
guards:
  - "Deprecated pre-1.1.0 simplified media-type support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-39); the release marks the types deprecated, not forbidden"
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example_deprecated_structured_accept   # sends Accept: application/openehr.wt.structured.schema+json
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: not_acceptable                # Resources.md §Simplified Formats 406 MUST
