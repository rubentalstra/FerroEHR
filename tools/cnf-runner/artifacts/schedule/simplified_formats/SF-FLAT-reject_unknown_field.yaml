# Re-adjudicated ECC-SF-007 (sf/flat-reject-unknown-field). A FLAT commit
# carrying a field identifier that resolves to no Web Template node is rejected.
# master04 §Validation is SHOULD-level ("Implementations SHOULD validate ...
# Field identifiers match WT metadata structure"); Simplified Formats is an
# OPTIONS capability, so this SHOULD-level reject never gates CORE/STANDARD.
id: SF-FLAT-reject_unknown_field
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT COMPOSITION commit whose payload carries a field identifier that maps
  to no Web Template node is rejected as semantically invalid content.
description: "FLAT commit with an unknown field identifier"
spec_refs:
  - "ITS-REST simplified_formats master04 §Validation"
  - "ITS-REST simplified_formats master04 §Field Identifiers"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.unknown_field]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.unknown_field}" }
    expect: validation_failed             # create_composition binding: 422
    assert:
      - { assert: message_exemplar, text: "field identifier does not match the Web Template metadata structure" }
