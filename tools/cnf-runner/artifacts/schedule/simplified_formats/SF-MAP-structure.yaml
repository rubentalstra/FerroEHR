# Per-RM-type suffix mapping: the structural nodes — ELEMENT, CLUSTER
# (simplified_formats master05 §ELEMENT, §CLUSTER). Exercised functionally on
# the official Test_all_types template (cnf.opt.maximal): a FLAT commit is read
# back canonical and the ELEMENT (leaf name + value) and nested-CLUSTER
# structural mappings are asserted. Leaves: content[0] OBSERVATION items[0]
# ELEMENT (at0004); content[1] EVALUATION items[5] CLUSTER (at0006) nesting
# cluster_2/cluster_3/text_2 down to a DV_TEXT leaf.
id: SF-MAP-structure
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: ELEMENT
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  ELEMENT maps its FLAT leaf to an ELEMENT carrying name + value; nested CLUSTER
  path segments map to nested CLUSTER RM nodes terminating in a leaf ELEMENT.
description: "ELEMENT/CLUSTER structural mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §ELEMENT"
  - "ITS-REST simplified_formats master05 §CLUSTER"
  - "RM data_structures §ELEMENT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # ELEMENT wraps name + value (master05 §ELEMENT)
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/_type", equals: "ELEMENT" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/name/value", exists: true }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/value", equals: "text value" }
      # Nested CLUSTER path -> nested CLUSTER RM nodes (master05 §CLUSTER)
      - { assert: field, path: "content[1]/data/items[5]/_type", equals: "CLUSTER" }
      - { assert: field, path: "content[1]/data/items[5]/items[0]/items[0]/items[0]/value/value", equals: "text 2 3" }
