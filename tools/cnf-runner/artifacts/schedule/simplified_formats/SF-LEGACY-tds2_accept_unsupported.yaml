# ICS-conditional LEGACY alternative-format support — the response-side
# (Accept) UNSUPPORTED branch for `application/openehr.tds2+xml`. ITS-REST
# overview Resources.md §Alternative data formats enumerates it under "Legacy
# or experimental formats": "`application/openehr.tds2+xml` for TDS
# simplification of RM as XML". §Data representation makes support optional
# ("other alternative formats MAY be supported as well"), so whether a server
# serves it is implementation-defined — register AMB-61, option_select. This
# case is the legacy-alt-formats-unsupported branch.
#
# Decisive docs-text sentence (Resources.md §XML Format): "The client SHOULD
# use the `Accept: application/xml` request header to specify the expected XML
# response format. If the service cannot fulfill this aspect of the request, it
# MUST respond with HTTP status code `406 Not Acceptable`" — §Simplified
# Formats and §JSON Format state the same MUST for their own Accept values, so
# an Accept the service cannot fulfil is 406 whatever the requested type.
#
# Mirror of SF-LEGACY-nc_flat_media_unsupported (request side, 415) and sibling
# of SF-DEPRECATED-accept_unsupported, which covers the DEPRECATED pre-1.1.0
# SDT-era `.schema+json` Accept (AMB-39).
id: SF-LEGACY-tds2_accept_unsupported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: legacy-alt-formats-unsupported   # AMB-61 option_select branch
ambiguities: [AMB-61]
test_purpose: >-
  On a server that does not support the legacy TDS2 media type, requesting a
  template example with Accept: application/openehr.tds2+xml cannot be
  fulfilled and is refused as not_acceptable.
description: "Legacy TDS2 Accept refused (unsupported branch, 406)"
spec_refs:
  - "ITS-REST overview Resources.md §Alternative data formats"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §XML Format"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
guards:
  - "Legacy alternative-format support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-61); ITS-REST overview Resources.md §Data representation makes the alternative formats a MAY"
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example_legacy_tds2_accept  # sends Accept: application/openehr.tds2+xml
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: not_acceptable               # Resources.md §XML Format 406 MUST
