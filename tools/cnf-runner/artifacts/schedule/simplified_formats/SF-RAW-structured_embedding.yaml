# |raw canonical embedding in the Structured format (simplified_formats
# master04 §Raw canonical JSON + §Structured format). The |raw bypass applies
# in both variants; in Structured the embedded canonical object sits under a
# `|raw` property of the leaf's array element. This functional case commits a
# STRUCTURED composition with a |raw DV_QUANTITY, reads it back as canonical
# JSON, and asserts the embedded object decomposed onto the RM leaf.
# NOTE: the cnf.sf.structured.raw_quantity fixture targets
#       vitals/body_temperature/any_event/temperature paths in the cnf.opt.vitals
#       carrier; verified live against the composed SUT (the step-2
#       value/magnitude field assertion proves the |raw object decomposed onto
#       the RM leaf).
id: SF-RAW-structured_embedding
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
# master04 §Raw canonical JSON assigns the bypass to "flat or structured
# format inputs" — its EXISTENCE in STRUCTURED is released text — while the
# section's one example is FLAT, so only the PLACEMENT is open; register
# AMB-155 carries it (§Structured format rule 3 already makes an attribute
# suffix a pipe-prefixed property, so the bypass is a "|raw" property of the
# leaf's array element).
ambiguities: [AMB-155]
test_purpose: >-
  A STRUCTURED commit embedding a canonical DV_QUANTITY via |raw round-trips to
  canonical JSON with the RM leaf carrying the embedded magnitude and units.
description: "STRUCTURED |raw DV_QUANTITY embedding, canonical read-back"
spec_refs:
  - "ITS-REST simplified_formats master04 §Raw canonical JSON"
  - "ITS-REST simplified_formats master04 §Structured format"
  - "ITS-REST simplified_formats master05 §DV_QUANTITY"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.structured.raw_quantity]
flow:
  - step: 1
    call: create_composition
    format: wt-structured                 # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.structured.raw_quantity}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/magnitude", exists: true }
