# Per-RM-type suffix mapping: the COMPOSITION + ENTRY types — COMPOSITION,
# OBSERVATION, EVALUATION (simplified_formats master05 §COMPOSITION,
# §OBSERVATION, §EVALUATION). Exercised functionally on the official
# Test_all_types template (cnf.opt.maximal), which carries an OBSERVATION
# (content[0]) and an EVALUATION (content[1]): the FLAT commit is read back
# canonical and the COMPOSITION mandatory context leaves (language/territory/
# category/composer) plus the ENTRY-type discrimination are asserted.
id: SF-MAP-entries
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: COMPOSITION
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  COMPOSITION maps /language, /territory, /category and /composer to the RM
  attributes, and the ENTRY subtypes (OBSERVATION with data:HISTORY, EVALUATION)
  round-trip as their RM types under content.
description: "COMPOSITION + ENTRY-type (OBSERVATION/EVALUATION) suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §COMPOSITION"
  - "ITS-REST simplified_formats master05 §OBSERVATION"
  - "ITS-REST simplified_formats master05 §EVALUATION"
  - "RM ehr §COMPOSITION"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # COMPOSITION mandatory context leaves (master05 §COMPOSITION)
      - { assert: field, path: "language/code_string", equals: "en" }
      - { assert: field, path: "territory/code_string", equals: "US" }
      - { assert: field, path: "category/defining_code/code_string", equals: "433" }
      - { assert: field, path: "composer/_type", equals: "PARTY_IDENTIFIED" }
      # ENTRY subtype discrimination (master05 §OBSERVATION, §EVALUATION)
      - { assert: field, path: "content[0]/_type", equals: "OBSERVATION" }
      - { assert: field, path: "content[0]/data/_type", equals: "HISTORY" }
      - { assert: field, path: "content[1]/_type", equals: "EVALUATION" }
