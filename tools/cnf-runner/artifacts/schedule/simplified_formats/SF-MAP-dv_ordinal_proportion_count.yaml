# Per-RM-type suffix mapping: the numeric-with-ranges family — DV_ORDINAL,
# DV_PROPORTION, DV_COUNT (simplified_formats master05 §DV_ORDINAL,
# §DV_PROPORTION, §DV_COUNT). Exercised functionally on the official
# Test_all_types template (cnf.opt.maximal): a FLAT commit carrying the
# ordinal/proportion_any/count leaves is read back canonical and the RM paths
# the |code/|value/|ordinal, |numerator/|denominator/|type and bare-magnitude
# suffixes map to are asserted. Leaves: content[0] OBSERVATION items[9]
# DV_ORDINAL (at0013), items[15] DV_PROPORTION (at0022), items[4] DV_COUNT
# (at0008).
id: SF-MAP-dv_ordinal_proportion_count
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: DV_ORDINAL
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The DV_ORDINAL, DV_PROPORTION and DV_COUNT FLAT suffixes map to their
  documented RM paths: DV_ORDINAL |ordinal -> value and |code ->
  symbol/defining_code/code_string; DV_PROPORTION |numerator/|denominator/|type;
  DV_COUNT bare value -> magnitude.
description: "DV_ORDINAL/DV_PROPORTION/DV_COUNT suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_ORDINAL"
  - "ITS-REST simplified_formats master05 §DV_PROPORTION"
  - "ITS-REST simplified_formats master05 §DV_COUNT"
  - "RM data_types §DV_ORDINAL"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # DV_ORDINAL |ordinal -> value; |code -> symbol/defining_code/code_string (master05 §DV_ORDINAL)
      - { assert: field, path: "content[0]/data/events[0]/data/items[9]/value/_type", equals: "DV_ORDINAL" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[9]/value/value", equals: 0 }
      - { assert: field, path: "content[0]/data/events[0]/data/items[9]/value/symbol/defining_code/code_string", equals: "at0014" }
      # DV_PROPORTION |numerator/|denominator/|type (master05 §DV_PROPORTION)
      - { assert: field, path: "content[0]/data/events[0]/data/items[15]/value/_type", equals: "DV_PROPORTION" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[15]/value/numerator", equals: 90.07 }
      - { assert: field, path: "content[0]/data/events[0]/data/items[15]/value/denominator", equals: 50.85 }
      # DV_COUNT bare value -> magnitude (master05 §DV_COUNT)
      - { assert: field, path: "content[0]/data/events[0]/data/items[4]/value/_type", equals: "DV_COUNT" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[4]/value/magnitude", equals: 6 }
