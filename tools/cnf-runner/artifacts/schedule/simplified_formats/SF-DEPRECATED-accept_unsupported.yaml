# ICS-conditional deprecated-media-type support — the RESPONSE-side (Accept)
# UNSUPPORTED branch. Mirror of SF-DEPRECATED-media_unsupported (which covers
# the request-side Content-Type -> 415): here the client requests the
# DEPRECATED pre-1.1.0 SDT-era simplified representation via
# Accept: application/openehr.wt.flat.schema+json. On a server that does not
# support the deprecated media type, the Accept cannot be fulfilled and the
# response is not_acceptable (406). Statement-declared behaviour (AMB-39,
# option_select): the sf-deprecated-types-unsupported branch. ECC-SF-004 ground
# (the 406 response-side companion to ECC-SF-005's 415 request-side).
#
# NOTE: `variant: example_deprecated_accept` selects the binding that pins the
#       deprecated Accept on the example endpoint; the SUT on the unsupported
#       branch refuses it 406 (Resources.md §Simplified Formats 406 MUST rule).
id: SF-DEPRECATED-accept_unsupported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: sf-deprecated-types-unsupported  # AMB-39 option_select branch
ambiguities: [AMB-39]
test_purpose: >-
  On a server that does not support the deprecated (pre-1.1.0 SDT-era)
  simplified-format media types, requesting a template example with
  Accept: application/openehr.wt.flat.schema+json cannot be fulfilled and is
  refused as not_acceptable.
description: "Deprecated simplified-format Accept refused (unsupported branch, 406)"
spec_refs:
  - "ITS-REST overview Resources.md §Simplified Formats (Accept cannot be fulfilled -> 406 MUST)"
  - "ITS-REST overview Resources.md §Alternative data formats (deprecated application/openehr.wt.flat.schema+json)"
  - "ITS-REST simplified_formats master02 §MIME Types"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "Deprecated-media-type support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-39); ITS-REST simplified_formats master02 §MIME Types defines only the current wt.flat/wt.structured MIME types"
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example_deprecated_accept    # sends Accept: application/openehr.wt.flat.schema+json (deprecated)
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: not_acceptable                # unsupported branch: example binding 406
