# Node-ID generation deepening (simplified_formats master04 §Node ID
# Generation Rules). The master04 worked-examples table becomes a content
# decision table: each row is one archetype node name and the node id the
# 7-step algorithm (normalisation -> underscore consolidation -> lowercase ->
# trim -> empty-id fallback -> digit-prefix `a` -> sibling-uniqueness `_N`)
# produces. Grounded on the vitals template as the representative COMPOSITION
# context (the algorithm is template-independent; the constraint_context names
# a real corpus template so the row set is anchored to a WT the runner can
# build). This is a mapping/derivation decision table (no accepted/rejected
# verdict): each row asserts the generated id for the given name.
id: SF-NODEID-generation_rules
kind: content
component: SIMPLIFIED_FORMATS
rm_class: WEB_TEMPLATE_NODE
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The node-id generation algorithm maps each archetype node name to the
  documented generated id: character normalisation, underscore consolidation,
  lowercasing, trimming, empty-id fallback, digit-prefix `a`, and sibling
  uniqueness suffixing.
description: "Node-id generation worked examples (master04 7-step algorithm)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Node ID Generation Rules"
  - "ITS-REST simplified_formats master04 §Web Template Metadata"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "Step 5 (empty result -> \"id\") has no worked example in the master04 table — the empty-id-fallback row below is synthesised from the algorithm text (master04 §Node ID Generation Rules)"
constraint_context:
  template: cnf.opt.vitals
  path: "/"                             # the WT root: node ids are generated per node under the template tree
decision_table:
  columns: ["original_name", "generated_id", "algorithm_step"]
  rows:
    - ["Body temperature", "body_temperature", "normalise_lowercase_trim"]
    - ["Problem/diagnosis", "problem_diagnosis", "normalise_nonword_to_underscore"]
    - ["Tests (1, 2, 3)", "tests_1_2_3", "normalise_consolidate_underscores"]
    - ["1st visit", "a1st_visit", "digit_prefix_prepend_a"]
    - ["Blood Pressure", "blood_pressure", "normalise_lowercase"]
    - ["Blood Pressure", "blood_pressure_1", "sibling_uniqueness_suffix"]
    - ["((()))", "id", "empty_id_fallback"]
