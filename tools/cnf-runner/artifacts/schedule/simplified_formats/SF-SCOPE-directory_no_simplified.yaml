# The simplified formats define mappings for COMPOSITION content only —
# DIRECTORY (FOLDER) has no simplified representation, so requesting one is
# an unfulfillable Accept (406). Re-adjudicated 2026-07-21 from the retired
# ECC simplified-formats battery against the STABLE Simplified Formats spec;
# the silence itself is adjudicated in register AMB-152 (the released
# contribution_create prose promises FLAT/STRUCTURED for an embedded FOLDER
# while master05 defines no FOLDER mapping and field identifiers are
# OPT-derived, which a directory FOLDER has no OPT to derive from).
id: SF-SCOPE-directory_no_simplified
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_DIRECTORY.get_directory
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]
ambiguities: [AMB-152]
test_purpose: >-
  Requesting a DIRECTORY in a simplified format is refused: no simplified
  mapping exists for non-COMPOSITION resources.
description: "DIRECTORY has no simplified representation (406)"
spec_refs:
  - "SM openehr_platform §I_EHR_DIRECTORY.get_directory"
  - "ITS-REST simplified_formats master02 §MIME Types (COMPOSITION scope)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (unfulfillable Accept)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
  directory: cnf.directory.root_only
flow:
  - step: 1
    call: get_directory
    format: wt-flat                      # the forbidden cell of the media-type matrix
    with: { ehr_id: "${ehr_id}" }
    expect: not_acceptable
