# Level removal, worked example (simplified_formats master04 §Level Removal +
# §Example). The master04 worked example maps a full canonical RM path to its
# FLAT form, applying container-attribute elision, wrapper collapse, node
# retention under archetype-id aliases, and value->suffix replacement. Exercised
# functionally on the nested-CLUSTER chain of the official Test_all_types
# template (cnf.opt.maximal) — the exemplar type is the EVALUATION cluster_1 ->
# cluster_2 -> cluster_3 -> text_2 chain rather than the master04 lab-panel
# archetype (not vendored), the same Level-Removal principle: the FLAT key
# `test_all_types/test_all_types_1:0/cluster_1/cluster_2/cluster_3/text_2`
# reconstitutes to the full canonical container chain on read-back.
id: SF-LEVELS-lab_panel_example
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: CLUSTER
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A nested-CLUSTER FLAT path (cluster_1/cluster_2/cluster_3/text_2, all
  container attributes elided and node ids retained as aliases) reconstitutes on
  canonical read-back to the full EVALUATION -> CLUSTER -> CLUSTER -> CLUSTER ->
  ELEMENT container chain carrying the leaf value.
description: "Level-removal worked example: nested-CLUSTER FLAT path -> canonical chain (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Level Removal"
  - "ITS-REST simplified_formats master04 §Container Attributes Elided from Paths"
  - "ITS-REST simplified_formats master05 §CLUSTER"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # Nested-CLUSTER chain reconstituted: EVALUATION items[5] -> CLUSTER -> CLUSTER -> CLUSTER -> ELEMENT
      - { assert: field, path: "content[1]/data/items[5]/_type", equals: "CLUSTER" }
      - { assert: field, path: "content[1]/data/items[5]/items[0]/_type", equals: "CLUSTER" }
      - { assert: field, path: "content[1]/data/items[5]/items[0]/items[0]/_type", equals: "CLUSTER" }
      - { assert: field, path: "content[1]/data/items[5]/items[0]/items[0]/items[0]/_type", equals: "ELEMENT" }
      - { assert: field, path: "content[1]/data/items[5]/items[0]/items[0]/items[0]/value/value", equals: "text 2 3" }
