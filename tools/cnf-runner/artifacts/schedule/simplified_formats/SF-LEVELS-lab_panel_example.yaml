# Level removal, worked example (simplified_formats master04 §Example — the
# laboratory-result-panel measurement). The master04 example maps a full
# canonical RM path to its FLAT form; this content decision table encodes that
# path decomposition segment-by-segment: container attributes elided, the
# HISTORY and ITEM_TREE wrappers collapsed, the EVENT conditionally collapsed
# (max=1), the OBSERVATION and two CLUSTER nodes retained under their
# archetype-id aliases (the inner CLUSTER repeating -> `:0`), and ELEMENT.value
# replaced by the `|magnitude` attribute suffix.
id: SF-LEVELS-lab_panel_example
kind: content
component: SIMPLIFIED_FORMATS
rm_class: OBSERVATION
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The master04 laboratory-panel canonical path flattens to
  laboratory_test_report/laboratory_test/laboratory_test_panel/laboratory_result:0/result_value|magnitude,
  applying container-attribute elision, wrapper collapse, conditional EVENT
  collapse, node retention under aliases, and the value->suffix replacement.
description: "Level-removal worked example: canonical path -> FLAT path (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Level Removal"
  - "ITS-REST simplified_formats master04 §Container Attributes Elided from Paths"
  - "ITS-REST simplified_formats master04 §Conditionally Collapsed Wrapper Types"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
constraint_context:
  template: cnf.opt.vitals
  path: "/content[openEHR-EHR-OBSERVATION.laboratory_test_result.v1]"
decision_table:
  columns: ["canonical_segment", "rm_type", "disposition", "flat_result"]
  rows:
    - ["/content[openEHR-EHR-OBSERVATION.laboratory_test_result.v1]", "OBSERVATION", "container_elided_node_retained", "laboratory_test"]
    - ["/data[at0001]", "HISTORY", "wrapper_collapsed", "(dropped)"]
    - ["/events[at0002]", "EVENT", "conditionally_collapsed_max_1", "(dropped)"]
    - ["/data[at0003]", "ITEM_TREE", "wrapper_collapsed", "(dropped)"]
    - ["/items[openEHR-EHR-CLUSTER.laboratory_test_panel.v1]", "CLUSTER", "container_elided_node_retained", "laboratory_test_panel"]
    - ["/items[openEHR-EHR-CLUSTER.laboratory_test_analyte.v1]", "CLUSTER", "container_elided_node_retained_repeats", "laboratory_result:0"]
    - ["/items[at0001]", "ELEMENT", "container_elided_element_is_value", "result_value"]
    - ["/value", "DV_QUANTITY", "value_replaced_by_suffix", "result_value|magnitude"]
