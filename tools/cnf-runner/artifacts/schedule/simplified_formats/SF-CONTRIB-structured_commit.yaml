# SPECITS-84 on the COMMIT side, STRUCTURED arm — the isolated sibling of
# SF-CONTRIB-flat_commit: the same envelope law with the other simplified MIME
# type, so a red row names which of the two forms broke.
#
# GROUND. DOCS TEXT — docs/overview/Amendment_record.md, the SPECITS-84 row
# verbatim: "Add support for FLAT/SDT to Contribution REST API calls - accept
# the Simplified Formats MIME types on CONTRIBUTION endpoints; the Simplified
# Formats serialization applies to `versions[].data` only, the CONTRIBUTION
# envelope remains canonical"; docs/overview/Resources.md §Simplified Formats
# fixes the MIME type ("`application/openehr.wt.structured+json` for the
# Simplified Structured JSON format") and its `Content-Type` negotiation. The
# per-operation statement of the split is docs-text-silent and grounded on the
# RELEASED OAS (cited AS the OAS — owner ruling 2026-07-28):
# operations/contribution_create.yaml §"Simplified Formats".
#
# Carrier: cnf.structured.vitals.minimal against cnf.opt.vitals — the same
# fixture/template pair SF-STRUCTURED-commit_roundtrip commits through the
# COMPOSITION route, so only the CONTRIBUTION seam is new.
id: SF-CONTRIB-structured_commit
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
capabilities: [SimplifiedFormats]        # the verdict-bearing capability; the tier axis is OPTIONS
exercises: [ChangeSets]                  # the CONTRIBUTION surface the case drives (no tier of its own)
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A CONTRIBUTION committed with the STRUCTURED MIME type, whose canonical
  envelope carries a STRUCTURED versions[].data payload, is accepted and the
  created VERSION reads back as a canonical COMPOSITION.
description: "CONTRIBUTION commit with STRUCTURED versions[].data, canonical read-back"
spec_refs:
  - "ITS-REST overview Amendment_record.md §Amendment Record (the SPECITS-84 row)"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST simplified_formats master04 §Structured format"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.commit_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.structured.vitals.minimal]
flow:
  - step: 1
    call: commit_contribution
    format: wt-structured                # inner-payload role; binding adds openehr-template-id
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.structured.vitals.minimal}", change_type: creation }
    expect: created
    capture:
      contribution_uid: created.contribution_uid
      first_version_uid: created.first_version_uid
    assert:
      # The envelope came back canonical — the SPECITS-84 half that a
      # simplified Content-Type must NOT change.
      - { assert: instance_of, rm_type: CONTRIBUTION }
  - step: 2
    call: I_EHR_COMPOSITION.get_composition_at_version   # cross-interface: the anchor is I_EHR_CONTRIBUTION
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${first_version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # The STRUCTURED inner payload became a real COMPOSITION: the fixture's
      # one clinical datum survives to the canonical read-back. (A
      # context/start_time assertion was DROPPED at the 2026-07-28 triage:
      # this fixture's ctx carries language/territory/composer only, no
      # event-context content, and no released sentence obliges a server to
      # CREATE an EVENT_CONTEXT — RM composition.adoc puts context at 0..1;
      # master06's time default is a VALUE rule for nodes that exist. The
      # ctx/time default is covered on grounded fixtures by SF-MAP-context
      # and SF-CONTRIB-flat_commit.)
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/magnitude", equals: 37.2 }
postconditions:
  - assert: state
    text: >-
      The EHR carries a CONTRIBUTION whose single VERSION holds the COMPOSITION
      the STRUCTURED inner payload described (verified by step 2).
