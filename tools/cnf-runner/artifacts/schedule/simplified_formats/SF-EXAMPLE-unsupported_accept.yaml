# Re-adjudicated ECC-SF-011 (sf/template-example-unsupported-accept). GET a
# template example with an Accept outside the four LOCATABLE forms: the Web
# Template media type (application/openehr.wt+json) is the OPT-as-web-template
# representation, NOT a LOCATABLE instance representation, so the example
# endpoint cannot satisfy it -> not_acceptable. This is the spec-grounded
# unsupported-negotiation case (Resources.md 406 MUST rule) — asserted for a
# genuinely-unacceptable Accept, per the assert-expected-code discipline (assert the expected
# code for the expected outcome, never enumerate-reject).
id: SF-EXAMPLE-unsupported_accept
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  Retrieving a template example with Accept application/openehr.wt+json (the
  Web Template document media type, not a LOCATABLE instance representation) is
  rejected as not_acceptable.
description: "GET a template example with an unsupported Accept"
spec_refs:
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST simplified_formats master04 §Web Template Metadata"
  - "ITS-REST specifications §definition_template_adl1.4_example_get"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    variant: example                      # selects the example-generation realization of get_opt
    format: wt                            # application/openehr.wt+json — not a LOCATABLE instance form
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: not_acceptable                # example binding: 406
    assert:
      - { assert: message_exemplar, text: "the Web Template media type is not a LOCATABLE example representation" }
