# Reject rule: |other on a closed value-set (simplified_formats master04 §Open
# Value-Sets and the |other Suffix: "|other MUST be rejected when the constraint
# is closed (listOpen: false)"). The |other free-text branch is only legal when
# the coded leaf's constraint is open; applying it to a closed-list leaf is a
# MUST-reject. Distinct from the exemplar SF-FLAT-reject_other_with_code (which
# rejects |other combined with |code/|value on an OPEN leaf).
id: SF-FLAT-reject_other_closed_list
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit using the |other suffix on a coded leaf whose archetype
  constraint is a closed list (listOpen:false) is rejected: |other is legal only
  for open value-sets.
description: "FLAT commit with |other on a closed-list coded leaf is rejected"
spec_refs:
  - "ITS-REST simplified_formats master04 §Open Value-Sets and the |other Suffix"
  - "ITS-REST simplified_formats master05 §DV_CODED_TEXT"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM data_types §DV_CODED_TEXT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.other_closed_list]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.other_closed_list}" }
    expect: validation_failed             # create_composition binding: 422
    assert:
      - { assert: message_exemplar, text: "|other must be rejected when the coded constraint is closed (listOpen:false)" }
