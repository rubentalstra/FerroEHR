# SPECITS-84 on the READ side, STRUCTURED arm — the isolated sibling of
# SF-CONTRIB-flat_read, so a red row names which simplified `Accept` broke.
#
# GROUND. DOCS TEXT — docs/overview/Amendment_record.md, the SPECITS-84 row
# verbatim: "accept the Simplified Formats MIME types on CONTRIBUTION
# endpoints; the Simplified Formats serialization applies to `versions[].data`
# only, the CONTRIBUTION envelope remains canonical"; docs/overview/
# Resources.md §Simplified Formats fixes the `Accept` negotiation and the MIME
# type `application/openehr.wt.structured+json`. The per-operation statement is
# docs-text-silent and grounded on the RELEASED OAS (cited AS the OAS — owner
# ruling 2026-07-28): operations/contribution_get.yaml §"Simplified Formats".
id: SF-CONTRIB-structured_read
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_CONTRIBUTION.get_contribution
capabilities: [SimplifiedFormats]        # the verdict-bearing capability; the tier axis is OPTIONS
exercises: [ChangeSets]                  # the CONTRIBUTION surface the case drives (no tier of its own)
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A CONTRIBUTION read with Accept set to the STRUCTURED MIME type is answered
  with the canonical CONTRIBUTION envelope — uid, versions[] metadata and
  audit unchanged by the simplified negotiation.
description: "Get CONTRIBUTION with a STRUCTURED Accept, canonical envelope"
spec_refs:
  - "ITS-REST overview Amendment_record.md §Amendment Record (the SPECITS-84 row)"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST simplified_formats master04 §Structured format"
  - "SM openehr_platform §I_EHR_CONTRIBUTION.get_contribution"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                              # precondition: a CONTRIBUTION of known uid, committed CANONICALLY
    call: commit_contribution
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      versions:
        - { data: "${ds:cnf.composition.minimal_event.v1}", change_type: creation }
    expect: created
    capture: { contribution_uid: created.contribution_uid }
  - step: 2
    call: get_contribution
    format: wt-structured                # Accept: application/openehr.wt.structured+json
    with: { ehr_id: "${ehr_id}", contribution_uid: "${contribution_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: CONTRIBUTION }   # the envelope stays canonical
      - { assert: field, path: "uid/value", equals: "${contribution_uid}" }
      - { assert: field, path: "audit/time_committed/value", exists: true }
