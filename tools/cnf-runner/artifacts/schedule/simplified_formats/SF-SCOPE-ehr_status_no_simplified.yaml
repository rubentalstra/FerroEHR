# The simplified formats define mappings for COMPOSITION content only —
# EHR_STATUS has no simplified representation, so requesting one is an
# unfulfillable Accept (406). Re-adjudicated 2026-07-21 from the retired ECC
# simplified-formats battery against the STABLE Simplified Formats spec.
id: SF-SCOPE-ehr_status_no_simplified
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]
test_purpose: >-
  Requesting an EHR_STATUS in a simplified format is refused: no simplified
  mapping exists for non-COMPOSITION resources.
description: "EHR_STATUS has no simplified representation (406)"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status"
  - "ITS-REST simplified_formats master02 §MIME Types (COMPOSITION scope)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (unfulfillable Accept)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status
    format: wt-flat                      # the forbidden cell of the media-type matrix
    with: { ehr_id: "${ehr_id}" }
    expect: not_acceptable
ambiguities: [AMB-7]
