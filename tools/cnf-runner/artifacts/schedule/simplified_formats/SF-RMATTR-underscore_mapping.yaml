# Underscore-prefixed RM attributes (simplified_formats master04 §RM Attributes
# prefix). Optional RM attributes not constrained in the template are accessed
# with an underscore prefix (`_attributeName`), reaching RM structure the web
# template does not surface as a field. Exercised functionally on the official
# Test_all_types template (cnf.opt.maximal): the FLAT key
# `test_all_types/test_all_types:0/quantity/_normal_range/...` supplies the
# optional DV_ORDERED.normal_range (a DV_INTERVAL<DV_QUANTITY>) that the template
# does not constrain, and canonical read-back proves the underscore prefix
# reached DV_QUANTITY.normal_range.lower/upper.
id: SF-RMATTR-underscore_mapping
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: LOCATABLE
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  An underscore-prefixed FLAT path (`_normal_range`) maps to the optional RM
  attribute it names (DV_ORDERED.normal_range) on its owning DV_QUANTITY leaf,
  reaching RM structure not surfaced as a template field.
description: "Underscore-prefixed RM-attribute path mapping (master04 §RM Attributes prefix)"
spec_refs:
  - "ITS-REST simplified_formats master04 §RM Attributes prefix"
  - "ITS-REST simplified_formats master04 §Field Identifiers"
  - "ITS-REST simplified_formats master05 §DV_QUANTITY"
  - "RM common §LOCATABLE"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # _normal_range underscore prefix -> DV_QUANTITY.normal_range (an optional RM attribute)
      - { assert: field, path: "content[0]/data/events[0]/data/items[3]/value/normal_range/lower/magnitude", equals: 60.0 }
      - { assert: field, path: "content[0]/data/events[0]/data/items[3]/value/normal_range/upper/magnitude", equals: 80.0 }
