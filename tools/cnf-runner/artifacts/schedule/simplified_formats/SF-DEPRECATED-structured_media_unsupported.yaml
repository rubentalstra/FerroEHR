# ICS-conditional DEPRECATED simplified-format support — the request-side
# (Content-Type) UNSUPPORTED branch for
# `application/openehr.wt.structured.schema+json`, the STRUCTURED twin of
# SF-DEPRECATED-media_unsupported (which drives the FLAT `.schema+json`
# type). The release deprecates the two together in one sentence, so each
# needs its own wire cell — ITS-REST overview Resources.md §Simplified
# Formats: "The `application/openehr.wt.flat.schema+json` and
# `application/openehr.wt.structured.schema+json` which were historically
# available in earlier versions of this specification, are now deprecated and
# will be removed in a future version of the specification."
#
# Decisive docs-text sentence (same section): "If the service cannot process
# the request payload as the simplified format is not supported, it MUST
# respond with HTTP status code `415 Unsupported Media Type`". Whether the
# deprecated support still exists is statement-declared (register AMB-39,
# option_select); this is the unsupported branch.
#
# One behaviour per case: the body is the same valid STRUCTURED payload the
# supported-branch sibling commits, so only the declared media type
# distinguishes this exchange. The ACCEPTING twin of the option pair is
# SF-DEPRECATED-media_supported.
id: SF-DEPRECATED-structured_media_unsupported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: sf-deprecated-types-unsupported  # AMB-39 option_select branch
ambiguities: [AMB-39]
test_purpose: >-
  On a server that does not accept the deprecated STRUCTURED media type, a
  COMPOSITION commit declaring application/openehr.wt.structured.schema+json
  is refused as unsupported_media.
description: "Deprecated STRUCTURED media type refused (unsupported branch, 415)"
spec_refs:
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 415 Unsupported Media Type)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
guards:
  - "Deprecated pre-1.1.0 simplified media-type support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-39); the release marks the types deprecated, not forbidden"
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.structured.vitals.minimal]
flow:
  - step: 1
    call: create_composition
    format: wt-structured                 # the binding's STRUCTURED format_headers cell
    variant: deprecated_media_type        # sends Content-Type: application/openehr.wt.structured.schema+json
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.structured.vitals.minimal}" }
    expect: unsupported_media             # Resources.md §Simplified Formats 415 MUST
