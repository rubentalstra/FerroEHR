# The full ctx/ vocabulary and its default-mapping table (simplified_formats
# master06 §Context Information + all its sub-sections). Every ctx/ key sets a
# default value in the RM tree; language + territory are mandatory; ctx/time
# defaults to now() and ctx/setting to openehr::238 (other care) when not set.
# This content decision table encodes the master06 default-mapping table
# verbatim — one row per ctx/ key with its RM target and default rule. Vectors:
# every master06 JSON block (the comprehensive block plus every per-key block).
id: SF-CTX-vocabulary_mapping
kind: content
component: SIMPLIFIED_FORMATS
rm_class: EVENT_CONTEXT
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  Each ctx/ key maps to the RM attribute(s) it defaults, with language and
  territory mandatory, ctx/time defaulting to now(), and ctx/setting defaulting
  to openehr::238 (other care).
description: "Full ctx/ vocabulary -> RM default mapping (master06)"
spec_refs:
  - "ITS-REST simplified_formats master06 §Context Information"
  - "ITS-REST simplified_formats master04 §Context"
  - "RM ehr §EVENT_CONTEXT"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
constraint_context:
  template: cnf.opt.vitals
  path: "/context"
decision_table:
  columns: ["ctx_key", "rm_target", "default_rule"]
  rows:
    - ["ctx/language", "ENTRY.language and COMPOSITION.language", "mandatory"]
    - ["ctx/territory", "COMPOSITION.territory", "mandatory"]
    - ["ctx/time", "COMPOSITION.context.start_time; ACTION.time; OBSERVATION.history.origin", "default_now"]
    - ["ctx/end_time", "COMPOSITION.context.end_time", "none"]
    - ["ctx/history_origin", "OBSERVATION.history.origin", "none"]
    - ["ctx/action_time", "ACTION.time", "none"]
    - ["ctx/activity_timing", "ACTIVITY.timing", "none"]
    - ["ctx/setting", "COMPOSITION.context.setting", "default_setting_238"]
    - ["ctx/location", "COMPOSITION.context.location", "none"]
    - ["ctx/composer_name", "composer.name (PARTY_IDENTIFIED)", "none"]
    - ["ctx/composer_self", "composer (PARTY_SELF)", "none"]
    - ["ctx/composer_id", "composer.external_ref.id.value", "none"]
    - ["ctx/id_namespace", "OBJECT_REF.namespace", "default_namespace"]
    - ["ctx/id_scheme", "OBJECT_REF.id.scheme", "default_scheme"]
    - ["ctx/health_care_facility", "COMPOSITION.context.health_care_facility", "none"]
    - ["ctx/work_flow_id", "ENTRY.workflow_id", "none"]
    - ["ctx/participation", "EVENT_CONTEXT.participations and ENTRY.other_participations", "none"]
    - ["ctx/provider", "ENTRY.provider (PARTY_IDENTIFIED)", "none"]
    - ["ctx/instruction_narrative", "INSTRUCTION.narrative", "none"]
    - ["ctx/action_ism_transition_current_state", "ACTION.ism_transition.current_state", "none"]
    - ["ctx/link", "LOCATABLE.links", "none"]
