# The simplified formats define mappings for COMPOSITION content only —
# demographic resources have no simplified representation, so requesting one
# is an unfulfillable Accept (406). Re-adjudicated 2026-07-21 from the
# retired ECC simplified-formats battery against the STABLE Simplified
# Formats spec.
id: SF-SCOPE-demographic_no_simplified
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_PARTY.get_party
capabilities: [SimplifiedFormats]
exercises: [PartyOperations]
profiles: [OPTIONS]
test_purpose: >-
  Requesting a demographic PARTY in a simplified format is refused: no
  simplified mapping exists for non-COMPOSITION resources.
description: "Demographic resources have no simplified representation (406)"
spec_refs:
  - "SM openehr_platform §I_PARTY.get_party"
  - "ITS-REST simplified_formats master02 §MIME Types (COMPOSITION scope)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes (unfulfillable Accept)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
requires:
  server: any
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture: { party_uid: created.versioned_object_uid }
  - step: 2
    call: get_party
    format: wt-flat                      # the forbidden cell of the media-type matrix
    with: { versioned_object_uid: "${party_uid}" }   # get_party path param (HIER_OBJECT_ID)
    expect: not_acceptable
