# Re-adjudicated ECC-SF-009 (sf/template-web-template-get). GET a provisioned
# OPT as a Web Template JSON document (Accept application/openehr.wt+json). The
# wt+json representation IS a negotiated get_opt (Resources.md §Simplified
# Formats: "application/openehr.wt+json for the Operational Template definition
# as Web Template JSON format" — the same OPT resource, negotiated), so the
# case anchors to the genuine SM operation I_DEFINITION_ADL14.get_opt and the
# step carries the intrinsic `wt` format role. Realized by the existing plain
# get_opt binding (path /definition/template/adl1.4/{template_id}); the
# example variant of get_opt is a distinct binding not selected here.
id: SF-WT-web_template_get
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  Retrieving a loaded OPT with Accept application/openehr.wt+json returns the
  Operational Template as a Web Template JSON document in the negotiated format.
description: "GET a template as a Web Template document"
spec_refs:
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST simplified_formats master04 §Node ID Generation Rules"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.vitals]            # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    format: wt                            # Accept application/openehr.wt+json (Web Template document)
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.vitals
    expect: ok
    assert:
      - { assert: field, path: "templateId", exists: true }
      - { assert: field, path: "tree", exists: true }
ambiguities: [AMB-31]
