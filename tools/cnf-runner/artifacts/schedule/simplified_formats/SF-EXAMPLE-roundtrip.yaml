# Template-example round-trip (re-adjudicated ECC-TPL-017). The "Get example
# data by template" endpoint generates an example COMPOSITION instance for a
# template; a conformant server's generated example is itself a valid
# COMPOSITION for that template, so committing it back via create_composition
# must succeed. A functional round-trip: get example -> commit -> created.
# The example is retrieved as canonical JSON (the example is a LOCATABLE
# instance, negotiable across the LOCATABLE forms) and re-submitted verbatim
# as the create_composition body (captured `example_body`).
#
# NOTE: the example endpoint has no dedicated SM operation (grep of SM
#       i_definition_adl14.adoc: no example op), so it anchors to the closest
#       genuine SM operation get_opt via `variant: example`.
id: SF-EXAMPLE-roundtrip
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # example generation is SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The example COMPOSITION generated by the "Get example data by template"
  endpoint is a valid instance for its template and commits back cleanly via
  create_composition (created).
description: "GET a template example (canonical JSON) and commit it back"
spec_refs:
  - "ITS-REST specifications §definition_template_adl1.4_example_get (Get example data by template)"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_opt
    variant: example                      # selects the example-generation realization of get_opt
    format: canonical-json
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: ok
    capture: { example_body: ok.body }
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
  - step: 2
    call: I_EHR_COMPOSITION.create_composition   # cross-interface: the example commits as a COMPOSITION
    format: canonical-json
    with: { ehr_id: "${ehr_id}", composition: "${example_body}" }
    expect: created
    capture: { version_uid: created.version_uid }
