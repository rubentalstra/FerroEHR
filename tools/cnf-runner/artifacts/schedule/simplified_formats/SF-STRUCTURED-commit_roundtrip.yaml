# Re-adjudicated ECC-SF-002 (sf/structured-commit-read-back). The STRUCTURED
# counterpart of the exemplar SF-FLAT round-trip: a STRUCTURED composition
# committed round-trips to canonical JSON and FLAT with equal clinical leaves.
# An intrinsic-format case: format is a fixed role per step.
# TODO: re-verify this flow once live against the composed SUT — the
#       cnf.structured.vitals.minimal fixture targets paths that exist in the
#       re-authored cnf.opt.vitals carrier. The step-2 `equivalent to: committed`
#       assertion carries the same ctx-representation residual as
#       SF-FLAT-commit_roundtrip_ctx_defaults and is resolved together with it.
id: SF-STRUCTURED-commit_roundtrip
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A STRUCTURED composition committed against an existing OPT round-trips to
  canonical JSON (a COMPOSITION) and to FLAT with the DV_QUANTITY leaf equal,
  proving the FLAT<->STRUCTURED value-equality of the RM mapping.
description: "STRUCTURED commit, three-format read-back"
spec_refs:
  - "ITS-REST simplified_formats master02 §MIME Types"
  - "ITS-REST simplified_formats master04 §Structured format, §Conversion Between Formats"
  - "ITS-REST simplified_formats master05 §COMPOSITION"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.structured.vitals.minimal]
flow:
  - step: 1
    call: create_composition
    format: wt-structured                # intrinsic role; binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.structured.vitals.minimal}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version     # SM I_EHR_COMPOSITION.get_composition_at_version
    format: wt-structured
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    capture: { structured_readback: ok.body }
    assert:
      - { assert: equivalent, to: committed, ignoring: [ctx_defaults, server_assigned] }
  - step: 3
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
  - step: 4
    call: get_composition_at_version
    format: wt-flat
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${structured_readback}", ignoring: [] }   # STRUCTURED<->FLAT value-equality (master04)
