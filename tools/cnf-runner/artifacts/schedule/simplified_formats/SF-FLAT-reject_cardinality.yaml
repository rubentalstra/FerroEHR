# Reject rule: cardinality violation (simplified_formats master04 §Validation:
# "Cardinality constraints are satisfied"). A FLAT commit that supplies a second
# instance (`:1`) of a node whose template maximum occurrence is 1 exceeds the
# cardinality constraint and is rejected. Simplified Formats is OPTIONS, so this
# never gates CORE/STANDARD.
id: SF-FLAT-reject_cardinality
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit providing a second indexed instance of a max=1 node exceeds the
  template cardinality and is rejected.
description: "FLAT commit exceeding a max=1 cardinality is rejected"
spec_refs:
  - "ITS-REST simplified_formats master04 §Validation"
  - "ITS-REST simplified_formats master04 §Instance Indexing"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.cardinality_violation]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.cardinality_violation}" }
    expect: validation_failed             # create_composition binding: 422
    assert:
      - { assert: message_exemplar, text: "instance count exceeds the template cardinality for the node" }
