# Per-RM-type suffix mapping: bare-value + identifier types — DV_BOOLEAN,
# DV_URI, DV_IDENTIFIER (simplified_formats master05 §DV_BOOLEAN, §DV_URI,
# §DV_IDENTIFIER). Exercised functionally on the official Test_all_types
# template (cnf.opt.maximal): a FLAT commit carrying the boolean (bare),
# identifier (bare id) and EVALUATION uri (bare) leaves is read back canonical
# and the bare value -> RM `value`/`id` mapping asserted. Leaves: content[0]
# OBSERVATION items[10] DV_BOOLEAN (at0017), items[14] DV_IDENTIFIER (at0021);
# content[1] EVALUATION items[0] DV_URI (at0002).
id: SF-MAP-simple_values
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: DV_IDENTIFIER
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  DV_BOOLEAN and DV_URI carry their value as the bare (empty-suffix) leaf value
  mapping to RM `value`; DV_IDENTIFIER maps the bare leaf value to its `id` field.
description: "DV_BOOLEAN/DV_URI/DV_IDENTIFIER suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_IDENTIFIER"
  - "ITS-REST simplified_formats master05 §DV_BOOLEAN"
  - "ITS-REST simplified_formats master05 §DV_URI"
  - "RM data_types §DV_IDENTIFIER"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # DV_BOOLEAN bare value -> value (master05 §DV_BOOLEAN)
      - { assert: field, path: "content[0]/data/events[0]/data/items[10]/value/_type", equals: "DV_BOOLEAN" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[10]/value/value", equals: true }
      # DV_IDENTIFIER bare value -> id (master05 §DV_IDENTIFIER)
      - { assert: field, path: "content[0]/data/events[0]/data/items[14]/value/_type", equals: "DV_IDENTIFIER" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[14]/value/id", equals: "35e4059a-e6f4-4ba1-befe-e2493bce3991" }
      # DV_URI bare value -> value (master05 §DV_URI)
      - { assert: field, path: "content[1]/data/items[0]/value/_type", equals: "DV_URI" }
      - { assert: field, path: "content[1]/data/items[0]/value/value", equals: "http://example.com/path/resource" }
