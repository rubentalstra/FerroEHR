# Field-identifier structure (simplified_formats master04 §Field Identifiers).
# Simplified-format field identifiers compose six ingredients: generated node
# ids, forward-slash path separators, colon instance indicators, pipe attribute
# suffixes, the underscore RM-attribute prefix, and the |raw canonical-JSON
# embedding. This content decision table encodes each ingredient and its marker.
# Vector: the master04 §Field Identifiers example identifier-structure block.
id: SF-FIELDID-structure
kind: content
component: SIMPLIFIED_FORMATS
rm_class: LOCATABLE
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A simplified-format field identifier composes generated node ids, `/` path
  separators, `:N` instance indicators, `|suffix` attribute suffixes, the `_`
  RM-attribute prefix, and the `|raw` canonical-embedding marker.
description: "Field-identifier structure ingredients and markers (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Field Identifiers"
  - "ITS-REST simplified_formats master04 §Path Construction"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
constraint_context:
  template: cnf.opt.vitals
  path: "/"
decision_table:
  columns: ["ingredient", "role", "marker"]
  rows:
    - ["node_ids", "generated_from_archetype_node_names", "identifier"]
    - ["path_separator", "between_hierarchy_levels", "/"]
    - ["instance_indicator", "repeating_elements", ":0"]
    - ["attribute_suffix", "rm_attribute_of_leaf", "|magnitude"]
    - ["rm_attribute_prefix", "optional_rm_attributes_not_in_template", "_attributeName"]
    - ["raw_canonical_json", "embed_canonical_json", "|raw"]
