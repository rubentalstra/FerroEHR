# Mandatory ctx fields (simplified_formats master04 §Validation: "Mandatory
# context fields (language, territory) are present" + master04 §Context:
# "Mandatory: language, territory"). A FLAT commit that omits ctx/territory
# cannot populate the mandatory COMPOSITION.territory and is rejected. Simplified
# Formats is an OPTIONS capability, so this reject never gates CORE/STANDARD.
#
# WHICH BRANCH: no released text assigns the reject a status — register
# AMB-208 adjudicates 422 for the template-MEDIATED half, since master04
# §Validation states the check against the Operational Template and
# `responses/422.yaml` names exactly that trigger ("the underlying template
# … is not validating the supplied resource").
id: SF-CTX-missing_mandatory
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
ambiguities: [AMB-208]
test_purpose: >-
  A FLAT commit omitting the mandatory ctx/territory context field is refused
  as a semantic error (the 422 class): the document is well-formed FLAT, and
  the template-driven conversion cannot populate COMPOSITION.territory.
description: "FLAT commit without mandatory ctx/territory is rejected"
spec_refs:
  - "ITS-REST simplified_formats master04 §Validation"
  - "ITS-REST simplified_formats master04 §Context"
  - "ITS-REST simplified_formats master06 §Language and Territory"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Resources §Simplified Formats"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.missing_territory]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.missing_territory}" }
    expect: validation_failed             # create_composition binding: 422
    assert:
      - { assert: message_exemplar, text: "mandatory ctx field territory is required" }
