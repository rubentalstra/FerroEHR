# ICS-conditional deprecated-media-type support — the SUPPORTED branch
# (simplified_formats master02 §MIME Types + the NOTE: "Prior to Release 1.1.0
# the openEHR specification used the name 'Simplified Data Template (SDT)'").
# Some servers still accept the pre-1.1.0 SDT-era simplified-format media types
# alongside the current application/openehr.wt.flat+json. Whether that legacy
# support exists is statement-declared (AMB-39, an option_select candidate):
# this sibling is the sf-deprecated-types-supported branch — a FLAT commit sent
# with a deprecated media type is accepted. ECC-SF-004/005 ground.
#
# TODO: the flow-step `variant` (deprecated_media_type) is not yet consumed by
#       the interpreter; the deprecated Content-Type override for this case
#       depends on interpreter support for `variant` (same gap as
#       SF-FLAT-missing_template_id).
id: SF-DEPRECATED-media_supported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: sf-deprecated-types-supported   # AMB-39 option_select branch (registered at integration)
ambiguities: [AMB-39]
test_purpose: >-
  On a server that declares support for the deprecated (pre-1.1.0 SDT-era)
  simplified-format media types, a FLAT COMPOSITION commit sent with a
  deprecated media type is accepted and created.
description: "Deprecated simplified-format media type accepted (supported branch)"
spec_refs:
  - "ITS-REST simplified_formats master02 §MIME Types"
  - "ITS-REST simplified_formats master02 §Overview"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Resources.md §Simplified Formats (deprecated media types NOTE)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "Deprecated-media-type support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-39); ITS-REST simplified_formats master02 defines only the current wt.flat/wt.structured MIME types"
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat
    variant: deprecated_media_type        # instructs the interpreter to send a deprecated (SDT-era) simplified-format media type
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: created                        # supported branch: legacy media type accepted
    capture: { version_uid: created.version_uid }
