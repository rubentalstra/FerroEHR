# The SYNTAX twin of the FLAT input split (owner adjudication 2026-08-03): a
# key breaking master04's field-identifier grammar means the document is not
# readable AS FLAT — the 400 row of overview Requests_and_responses §HTTP
# status codes ("malformed request syntax … could not be parsed") — where a
# template-/RM-mediated conversion failure (SF-CTX-missing_mandatory) stays
# the 422 class. Simplified Formats is an OPTIONS capability, so this reject
# never gates CORE/STANDARD.
id: SF-FLAT-malformed_path
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit whose document carries a key breaking the master04
  field-identifier grammar (an empty path segment, a bare trailing pipe) is
  refused as malformed content (the 400 class): the document is not readable
  as FLAT, before any template is consulted.
description: "FLAT commit with a syntactically malformed key is a 400"
spec_refs:
  - "ITS-REST simplified_formats master04 §Flat Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.malformed_path]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.malformed_path}" }
    expect: bad_request                   # the 400 row — not readable AS FLAT (template-independent)
postconditions:
  - { assert: version, count: 0 }
