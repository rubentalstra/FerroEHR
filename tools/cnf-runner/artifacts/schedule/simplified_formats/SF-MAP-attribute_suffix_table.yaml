# Attribute-suffix overview table (simplified_formats master04 §Attribute
# Suffixes). master04 gives a small cross-type overview of pipe suffixes before
# the exhaustive per-type tables of master05. Exercised functionally on the
# official Test_all_types template (cnf.opt.maximal): a FLAT commit carrying the
# |magnitude/|unit (DV_QUANTITY) and |code/|value/|terminology (DV_CODED_TEXT)
# suffixes is read back canonical and the mapped RM paths asserted. Leaves:
# content[0] OBSERVATION items[3] DV_QUANTITY (at0007), items[1] DV_CODED_TEXT
# (at0005).
id: SF-MAP-attribute_suffix_table
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: DATA_VALUE
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The master04 attribute-suffix overview maps each pipe suffix (|magnitude,
  |unit for DV_QUANTITY; |code, |value, |terminology for DV_CODED_TEXT) to its
  RM meaning, verified by canonical read-back of a FLAT commit.
description: "master04 attribute-suffix overview table"
spec_refs:
  - "ITS-REST simplified_formats master04 §Attribute Suffixes"
  - "ITS-REST simplified_formats master05 §DV_QUANTITY"
  - "ITS-REST simplified_formats master05 §DV_CODED_TEXT"
  - "RM data_types §DATA_VALUE"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # DV_QUANTITY |magnitude/|unit (master04 §Attribute Suffixes)
      - { assert: field, path: "content[0]/data/events[0]/data/items[3]/value/magnitude", equals: 68.07 }
      - { assert: field, path: "content[0]/data/events[0]/data/items[3]/value/units", equals: "mg" }
      # DV_CODED_TEXT |code/|value/|terminology (master04 §Attribute Suffixes)
      - { assert: field, path: "content[0]/data/events[0]/data/items[1]/value/defining_code/code_string", equals: "N.84" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[1]/value/value", equals: "N.84 label" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[1]/value/defining_code/terminology_id/value", equals: "local" }
