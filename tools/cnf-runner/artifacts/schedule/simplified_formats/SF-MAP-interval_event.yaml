# The master05 §INTERVAL_EVENT mapping, driven through the wire: a FLAT commit
# carrying the section's three rows on one event node, read back as canonical
# JSON with the RM attributes populated.
#
# THE THREE ROWS (ITS-REST simplified_formats master05-rm_mapping.adoc
# §INTERVAL_EVENT, the mapping table and its second worked example, which
# agree):
#   `/width`          DV_DURATION     -> width          (Required: yes)
#   `/math_function`  DV_CODED_TEXT   -> math_function  (Required: yes)
#   `|sample_count`   INTEGER         -> sample_count   (Required: no)
# `/width` and `/math_function` are SUB-PATHS; `|sample_count` is a datum
# suffix on the EVENT NODE ITSELF — the section's example spells it
# `…/any_event:0|sample_count: 5`, not a sub-path, which is the one shape
# distinction this case exists to gate. The RM side is RM data_structures
# §INTERVAL_EVENT (`width`: DV_DURATION 1..1, `math_function`: DV_CODED_TEXT
# 1..1, `sample_count`: Integer 0..1).
#
# The fixture uses the section's OWN example values (P30D; openehr::146|mean|;
# 5), so each asserted value traces to a released line rather than to anything
# this catalogue invented.
#
# CARRIER: cnf.tpl.sf_interval_event, authored for this case. No previously
# committed functional-corpus template constrains an EVENT to a concrete
# INTERVAL_EVENT — cnf.opt.vitals types its `any_event` as the ABSTRACT EVENT,
# which a builder must concretise to a default subtype, so the interval rows
# are unreachable there — and a FLAT commit cannot conjure an interval event
# the template does not declare. The new OPT is the committed
# cnf.tpl.ecc_event_type_narrowing skeleton with its one events slot narrowed
# to INTERVAL_EVENT instead of POINT_EVENT (AM 1.4 C_OBJECT.rm_type_name),
# emitted by the same generator builder, so nothing about the carrier's shape
# is new either. `width` and `math_function` are left UNCONSTRAINED in the OPT
# on purpose, exactly as `time` is on the POINT_EVENT siblings: master05 makes
# an RM-mandatory attribute addressable even where the compacted web template
# carries no child for it, and constraining them would test the template
# author rather than the mapping.
id: SF-MAP-interval_event
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit carrying /width, /math_function and |sample_count on an
  INTERVAL_EVENT node round-trips to canonical JSON with the INTERVAL_EVENT
  width, math_function and sample_count attributes populated.
description: "FLAT commit of INTERVAL_EVENT width/math_function/sample_count, canonical read-back"
spec_refs:
  - "ITS-REST simplified_formats master05 §INTERVAL_EVENT"
  - "ITS-REST simplified_formats master05 §DV_DURATION, §DV_CODED_TEXT"
  - "ITS-REST simplified_formats master04 §Field Identifiers"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM data_structures §INTERVAL_EVENT"
  - "AM AOM1.4 §C_OBJECT.rm_type_name (the events-slot narrowing the carrier declares)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.tpl.sf_interval_event]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.interval_event_sample_count]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.interval_event_sample_count}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # the events slot the OPT narrowed really produced the concrete subtype
      - { assert: field, path: "content[0]/data/events[0]/_type", equals: "INTERVAL_EVENT" }
      # `/width` -> width (DV_DURATION)
      - { assert: field, path: "content[0]/data/events[0]/width/value", equals: "P30D" }
      # `/math_function` -> math_function (DV_CODED_TEXT)
      - { assert: field, path: "content[0]/data/events[0]/math_function/defining_code/code_string", equals: "146" }
      - { assert: field, path: "content[0]/data/events[0]/math_function/defining_code/terminology_id/value", equals: "openehr" }
      # `|sample_count` -> sample_count (a bare Integer on the RM class)
      - { assert: field, path: "content[0]/data/events[0]/sample_count", equals: 5 }
