# Node-ID generation grounded in the served Web Template document
# (simplified_formats master04 §Web Template Metadata + §Node ID Generation
# Rules). The master04 WT example (the Blood_Pressure_Demo web template) is a
# JSON block whose `tree` carries the generated `id` node ids for every node.
# This functional case provisions an OPT, retrieves it as a Web Template JSON
# document (Accept application/openehr.wt+json), and asserts the tree carries
# generated node ids — the read-side counterpart of the SF-NODEID worked
# examples. Anchored to I_DEFINITION_ADL14.get_opt with the intrinsic `wt`
# format role (the web-template representation rides the negotiated
# get_opt binding).
id: SF-NODEID-web_template_ids
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
ambiguities: [AMB-156]
test_purpose: >-
  Retrieving a provisioned OPT as a Web Template JSON document returns a tree
  whose nodes carry generated node ids (the master04 node-id algorithm output),
  with the root templateId and the child tree present.
description: "Generated node ids present in the served Web Template tree"
spec_refs:
  - "ITS-REST simplified_formats master04 §Web Template Metadata"
  - "ITS-REST simplified_formats master04 §Node ID Generation Rules"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    format: wt                            # Accept application/openehr.wt+json (Web Template document)
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: ok
    assert:
      - { assert: field, path: "templateId", exists: true }
      - { assert: field, path: "tree/id", exists: true }
      - { assert: field, path: "tree/children", exists: true }
