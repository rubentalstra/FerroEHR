# Structured arrays even at single cardinality (simplified_formats master04
# §Structured format rule 5: "Arrays MUST be used for data values, even when
# cardinality is 0..1 or 1..1"). A STRUCTURED composition whose 1..1 leaf is
# wrapped in a single-element array commits and round-trips to canonical JSON
# and back to Structured with the value equal — proving the mandatory-array
# rule is honoured on read as well as write.
# NOTE: the step-3 `equivalent to: committed` assertion is reconciled by the
#       fold_flat_ctx ctx normalisation + the ctx_defaults ignore-set (ITS-REST
#       simplified_formats master06 §Context Information), as in
#       SF-FLAT-commit_roundtrip_ctx_defaults. Verified live green against the
#       composed SUT.
id: SF-STRUCT-arrays_single_cardinality
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
ambiguities: [AMB-153]
test_purpose: >-
  A STRUCTURED commit whose single-cardinality leaf is an array round-trips to
  canonical JSON (a COMPOSITION) and back to STRUCTURED with the value equal.
description: "STRUCTURED single-cardinality array commit, canonical + structured read-back"
spec_refs:
  - "ITS-REST simplified_formats master04 §Structured format"
  - "ITS-REST simplified_formats master04 §Conversion Between Formats"
  - "ITS-REST simplified_formats master05 §COMPOSITION"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.structured.vitals.minimal]
flow:
  - step: 1
    call: create_composition
    format: wt-structured                 # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.structured.vitals.minimal}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
  - step: 3
    call: get_composition_at_version
    format: wt-structured
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: equivalent, to: committed, ignoring: [ctx_defaults, server_assigned] }
