# Per-RM-type suffix mapping: the PARTY_PROXY family — PARTY_IDENTIFIED
# (simplified_formats master05 §PARTY_PROXY, §PARTY_IDENTIFIED). Exercised
# functionally on the official minimal_action template (cnf.opt.minimal_action): the
# FLAT instance (cnf.flat.vitals.minimal_ctx) sets ctx/composer_name (->
# COMPOSITION.composer PARTY_IDENTIFIED) and ctx/participation_* whose performer
# is a PARTY_IDENTIFIED with an external_ref; the commit is read back canonical
# and the mapped RM paths asserted.
id: SF-MAP-party
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: PARTY_PROXY
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  PARTY_IDENTIFIED maps its FLAT suffixes to the documented RM paths: the
  composer |name -> composer/name and a participation performer's |name ->
  performer/name with |id -> performer/external_ref/id/value.
description: "PARTY_PROXY family (PARTY_IDENTIFIED) suffix mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §PARTY_IDENTIFIED"
  - "ITS-REST simplified_formats master05 §PARTY_PROXY"
  - "ITS-REST simplified_formats master06 §Composer"
  - "RM common §PARTY_PROXY"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # composer |name -> PARTY_IDENTIFIED/name (master05 §PARTY_IDENTIFIED, master06 §Composer)
      - { assert: field, path: "composer/_type", equals: "PARTY_IDENTIFIED" }
      - { assert: field, path: "composer/name", equals: "Silvia Blake" }
      # participation performer PARTY_IDENTIFIED |name/|id (master05 §PARTY_IDENTIFIED)
      - { assert: field, path: "context/participations[0]/performer/_type", equals: "PARTY_IDENTIFIED" }
      - { assert: field, path: "context/participations[0]/performer/name", equals: "Dr. Marcus Johnson" }
      - { assert: field, path: "context/participations[0]/performer/external_ref/id/value", equals: "199" }
