# ctx composer: composer_name (simplified_formats master06 §Composer). Setting
# `ctx/composer_name` sets the COMPOSITION.composer to a PARTY_IDENTIFIED with
# that name (and, with ctx/composer_id, an external_ref) — the composer_name
# branch, distinct from composer_self. This functional case commits a FLAT
# composition carrying ctx/composer_name, reads it back as canonical JSON, and
# asserts a PARTY_IDENTIFIED composer with the given name.
id: SF-CTX-composer_name
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit with ctx/composer_name round-trips to canonical JSON with
  COMPOSITION.composer typed PARTY_IDENTIFIED carrying that name.
description: "ctx/composer_name sets the composer to a named PARTY_IDENTIFIED"
spec_refs:
  - "ITS-REST simplified_formats master06 §Composer"
  - "ITS-REST simplified_formats master05 §PARTY_IDENTIFIED"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM common §PARTY_IDENTIFIED"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]   # official minimal_action FLAT: ctx/composer_name "Silvia Blake"
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "composer/_type", equals: "PARTY_IDENTIFIED" }
      - { assert: field, path: "composer/name", equals: "Silvia Blake" }
