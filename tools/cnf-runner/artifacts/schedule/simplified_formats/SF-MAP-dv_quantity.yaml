# Per-RM-type suffix mapping: DV_QUANTITY (simplified_formats master05
# §DV_QUANTITY + master04 §Attribute Suffixes). The master05 DV_QUANTITY suffix
# table is exercised functionally: a FLAT composition carrying the |magnitude
# and |unit suffixes on the Test_all_types `quantity` leaf is committed, read
# back canonical, and the RM attributes the suffixes map to (DV_QUANTITY
# magnitude:Real, units:String) are asserted on the canonical leaf. The leaf is
# content[0] OBSERVATION items[3] (openEHR-EHR-OBSERVATION.test_all_types.v1
# at0007) of the official Test_all_types template (cnf.opt.maximal).
id: SF-MAP-dv_quantity
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: DV_QUANTITY
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  The DV_QUANTITY FLAT suffixes map to their documented RM attributes: |magnitude
  -> magnitude (Real) and |unit -> units (String), verified by canonical
  read-back of a FLAT commit.
description: "DV_QUANTITY |magnitude/|unit suffix -> RM path mapping (master05)"
spec_refs:
  - "ITS-REST simplified_formats master05 §DV_QUANTITY"
  - "ITS-REST simplified_formats master04 §Attribute Suffixes"
  - "RM data_types §DV_QUANTITY"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "master05 DV_QUANTITY table swaps the flat-type cells (|magnitude shown String, |unit shown Real) — an upstream editorial defect; the RM types (magnitude:Real, units:String) are used here per RM data_types §DV_QUANTITY"
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "content[0]/data/events[0]/data/items[3]/value/_type", equals: "DV_QUANTITY" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[3]/value/magnitude", equals: 68.07 }
      - { assert: field, path: "content[0]/data/events[0]/data/items[3]/value/units", equals: "mg" }
