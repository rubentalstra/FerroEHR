# Underscore-prefixed RM attribute round-trip: _normal_range on a DV_QUANTITY
# leaf (simplified_formats master04 §RM Attributes prefix — the temperature
# _normal_range JSON block). A FLAT commit that supplies the optional
# DV_QUANTITY.normal_range via `value/_normal_range/lower|magnitude` +
# `.../upper|magnitude` round-trips to canonical JSON with the RM
# normal_range.lower/upper populated — proving the underscore-prefix mechanism
# reaches an optional RM attribute not surfaced as a template field.
id: SF-RMATTR-normal_range_commit
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit populating value/_normal_range/lower|magnitude and
  .../upper|magnitude on a DV_QUANTITY leaf round-trips to canonical JSON with
  normal_range.lower and normal_range.upper present.
description: "FLAT commit of an underscore _normal_range, canonical read-back"
spec_refs:
  - "ITS-REST simplified_formats master04 §RM Attributes prefix"
  - "ITS-REST simplified_formats master05 §DV_QUANTITY"
  - "ITS-REST overview Requests_and_responses §openehr-template-id"
  - "RM data_types §DV_QUANTITY"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.vitals]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.sf.flat.normal_range]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.sf.flat.normal_range}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/normal_range/lower/magnitude", exists: true }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/value/normal_range/upper/magnitude", exists: true }
