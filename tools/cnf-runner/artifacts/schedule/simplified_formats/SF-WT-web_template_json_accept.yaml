# The `Accept: application/json` sibling of SF-WT-web_template_get. The
# released docs text is SILENT on what an application/json read of an
# operational template returns — it defines no canonical-JSON
# OPERATIONAL_TEMPLATE representation and names only
# application/openehr.wt+json for the template-as-JSON case — so fulfilling
# the request (rather than refusing it 406) is OUR OWN documented extension,
# recorded as AMB-58. This case therefore reports and never gates: no
# conformant server is required to answer this way. What IS spec-derived is
# the shape of the answer ONCE a body is returned — decisive docs-text
# sentence (ITS-REST overview Resources.md §JSON Format): "Proper header
# `Content-Type: application/json` MUST be present in the response of the
# service unless the response has no content body" — so answering this request
# with application/openehr.wt+json, a type the client never accepted, is a
# defect. The spec-named branch gates separately in SF-WT-web_template_get.
#
# Fully executable: the status branch, the body identity of the returned
# document, and the response Content-Type — the `Content-Type: negotiated`
# matcher on the get_opt binding outcome is an EXECUTED assertion since #403
# (tools/cnf-runner/src/exec/headers.rs).
id: SF-WT-web_template_json_accept
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_DEFINITION_ADL14.get_opt
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
ambiguities: [AMB-58]
test_purpose: >-
  Retrieving a loaded OPT with Accept application/json is fulfilled with the
  Web Template JSON document (the only JSON template representation the spec
  defines), not refused and not answered in a type the client did not accept.
description: "GET a template with Accept: application/json"
spec_refs:
  - "ITS-REST overview Resources.md §JSON Format"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "SM openehr_platform §I_DEFINITION_ADL14.get_opt"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "Fulfilling Accept: application/json on the OPT GET at all is OUR OWN documented extension (AMB-58), not a spec expectation: no released ITS-REST sentence defines a canonical-JSON OPERATIONAL_TEMPLATE representation or assigns this request an outcome, so a service that answers 406 instead is equally conformant. Only the shape of a returned body is spec-derived — ITS-REST overview Resources.md §JSON Format binds the response Content-Type to the negotiated type. The wt+json representation is the spec-named one and is exercised by SF-WT-web_template_get"
requires:
  server: any
  templates: [cnf.opt.minimal_action]    # provisioned as precondition (idempotent; 409 tolerated)
flow:
  - step: 1
    call: get_opt
    format: canonical-json                # Accept: application/json
    with: { template_id: "minimal_action.en.v1" }   # the template_id of cnf.opt.minimal_action
    expect: ok
    assert:
      - { assert: field, path: "templateId", exists: true }
      - { assert: field, path: "tree", exists: true }
