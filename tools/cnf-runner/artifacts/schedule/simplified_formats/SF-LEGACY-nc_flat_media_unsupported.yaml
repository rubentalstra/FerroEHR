# ICS-conditional LEGACY alternative-format support — the request-side
# (Content-Type) UNSUPPORTED branch for `application/openehr.nc.flat+json`.
# ITS-REST overview Resources.md §Alternative data formats enumerates it under
# "Legacy or experimental formats": "`application/openehr.nc.flat+json` based
# on the ECISFLAT format". §Data representation makes support optional
# ("Services MUST support at least one of the openEHR **XML** or **JSON**
# canonical formats … while other alternative formats MAY be supported as
# well"), so whether a server accepts it is implementation-defined — register
# AMB-61, option_select. This case is the legacy-alt-formats-unsupported
# branch: the commit cannot be processed and MUST be refused 415.
#
# Decisive docs-text sentence (Resources.md §Simplified Formats): "If the
# service cannot process the request payload as the simplified format is not
# supported, it MUST respond with HTTP status code `415 Unsupported Media
# Type`" — the same MUST §JSON Format and §XML Format state for the canonical
# types.
#
# Sibling of SF-DEPRECATED-media_unsupported, which covers the DEPRECATED
# pre-1.1.0 SDT-era `.schema+json` types (AMB-39). One behaviour per case: the
# body is the same valid FLAT payload, so only the declared media type
# distinguishes this exchange.
id: SF-LEGACY-nc_flat_media_unsupported
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
option: legacy-alt-formats-unsupported   # AMB-61 option_select branch
ambiguities: [AMB-61]
test_purpose: >-
  On a server that does not support the legacy ECISFLAT media type, a
  COMPOSITION commit declaring application/openehr.nc.flat+json is refused as
  unsupported_media.
description: "Legacy ECISFLAT media type refused (unsupported branch, 415)"
spec_refs:
  - "ITS-REST overview Resources.md §Alternative data formats"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Requests_and_responses (HTTP status codes: 415 Unsupported Media Type)"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # Simplified-Format media types on the resource endpoints arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-61; SPECITS-84 for CONTRIBUTION)
guards:
  - "Legacy alternative-format support is statement-declared, not spec-mandated — the ICS options declaration selects this branch (AMB-61); ITS-REST overview Resources.md §Data representation makes the alternative formats a MAY"
requires:
  server: any
  templates: [cnf.opt.minimal_action]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.vitals.minimal_ctx]
flow:
  - step: 1
    call: create_composition
    format: wt-flat
    variant: legacy_nc_flat_media        # sends Content-Type: application/openehr.nc.flat+json
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.vitals.minimal_ctx}" }
    expect: unsupported_media            # Resources.md §Simplified Formats 415 MUST
