# Level removal, part 2 (simplified_formats master04 §Always Collapsed Wrapper
# Types + §Conditionally Collapsed Wrapper Types). Beyond container-attribute
# elision, certain wrapper node types are themselves collapsed — their
# archetype node-id is also dropped. The ITEM_STRUCTURE family and HISTORY are
# ALWAYS collapsed; an EVENT is CONDITIONALLY collapsed (only when max=1 AND no
# sibling EVENT of any concrete type shares the parent HISTORY). This content
# decision table encodes the collapse rule per wrapper type, covering the
# conditional EVENT case both ways (collapsed vs retained).
id: SF-LEVELS-collapsed_wrappers
kind: content
component: SIMPLIFIED_FORMATS
rm_class: LOCATABLE
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  ITEM_STRUCTURE (and its concrete subtypes) and HISTORY are always collapsed;
  an EVENT is collapsed only when max=1 and no sibling EVENT exists, and is
  retained when multiple EVENT types share the HISTORY or the EVENT repeats.
description: "Wrapper-type collapse rules incl. the conditional EVENT collapse (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Always Collapsed Wrapper Types"
  - "ITS-REST simplified_formats master04 §Conditionally Collapsed Wrapper Types"
  - "ITS-REST simplified_formats master04 §Level Removal"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
constraint_context:
  template: cnf.opt.vitals
  path: "/"
decision_table:
  columns: ["wrapper_type", "condition", "collapsed"]
  rows:
    - ["ITEM_STRUCTURE", "always", "yes"]
    - ["ITEM_TREE", "always", "yes"]
    - ["ITEM_LIST", "always", "yes"]
    - ["ITEM_SINGLE", "always", "yes"]
    - ["ITEM_TABLE", "always", "yes"]
    - ["HISTORY", "always", "yes"]
    - ["EVENT", "max_1_and_no_sibling_event", "yes"]
    - ["EVENT", "multiple_event_types_in_history", "no"]
    - ["EVENT", "max_greater_than_1", "no"]
