# Level removal (simplified_formats master04 §Always Collapsed Wrapper Types +
# §Conditionally Collapsed Wrapper Types). In FLAT input the wrapper nodes are
# collapsed — their path segments are absent from the flat keys (e.g.
# `test_all_types/test_all_types:0/text` carries no data/events/data/items
# wrappers). Exercised functionally on the official Test_all_types template
# (cnf.opt.maximal): committing the collapsed-path FLAT and reading back
# canonical proves the always-collapsed wrappers (HISTORY, ITEM_TREE) and the
# conditionally-collapsed single EVENT (a lone max=1 POINT_EVENT) are
# reconstituted as RM nodes on the round-trip.
id: SF-LEVELS-collapsed_wrappers
kind: functional
component: SIMPLIFIED_FORMATS
sm_operation: I_EHR_COMPOSITION.create_composition
rm_class: LOCATABLE
capabilities: [SimplifiedFormats]
profiles: [OPTIONS]           # SHOULD-level per ITS-REST — never gates CORE/STANDARD
test_purpose: >-
  A FLAT commit using collapsed wrapper paths (no HISTORY/ITEM_TREE/EVENT
  segments) reconstitutes on canonical read-back to the full RM wrapper chain:
  data:HISTORY -> events:POINT_EVENT -> data:ITEM_TREE -> items:ELEMENT.
description: "Wrapper-type collapse/reconstitution incl. the conditional single EVENT (master04)"
spec_refs:
  - "ITS-REST simplified_formats master04 §Always Collapsed Wrapper Types"
  - "ITS-REST simplified_formats master04 §Conditionally Collapsed Wrapper Types"
  - "ITS-REST simplified_formats master04 §Level Removal"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  templates: [cnf.opt.maximal]
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.flat.all_types]
flow:
  - step: 1
    call: create_composition
    format: wt-flat                       # binding adds openehr-template-id
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.flat.all_types}" }
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: get_composition_at_version      # SM I_EHR_COMPOSITION.get_composition_at_version
    format: canonical-json
    with: { ehr_id: "${ehr_id}", version_uid: "${version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      # HISTORY always collapsed in FLAT, reconstituted on read (master04 §Always Collapsed)
      - { assert: field, path: "content[0]/data/_type", equals: "HISTORY" }
      # a lone max=1 EVENT is conditionally collapsed, reconstituted as POINT_EVENT (master04 §Conditionally Collapsed)
      - { assert: field, path: "content[0]/data/events[0]/_type", equals: "POINT_EVENT" }
      # ITEM_TREE always collapsed, reconstituted (master04 §Always Collapsed)
      - { assert: field, path: "content[0]/data/events[0]/data/_type", equals: "ITEM_TREE" }
      - { assert: field, path: "content[0]/data/events[0]/data/items[0]/_type", equals: "ELEMENT" }
