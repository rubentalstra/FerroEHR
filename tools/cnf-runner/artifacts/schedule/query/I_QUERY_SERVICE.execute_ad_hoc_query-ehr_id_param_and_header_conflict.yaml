# The DISAGREEING half of the ehr_id parameter/header duality: two DIFFERENT
# EHRs named in the two released places is a self-contradictory request and is
# refused, never silently resolved to one of them.
#
# Ground (ITS-REST DOCS TEXT, the released oracle). The two forms are offered
# as alternatives — docs/query/Request.md §"About the ehr_id parameter":
# "Depending on the needs, clients MAY supply it as a query parameter `ehr_id`
# or alternatively as a request header named `openehr-ehr-id`" — and no
# released sentence assigns precedence when they disagree. Register AMB-59
# carries the fixed handling (refuse), on
# docs/overview/Requests_and_responses.md §"HTTP status codes", row 400: "The
# service cannot or will not process the request due to something that is
# perceived to be a client error (e.g., malformed request syntax,
# syntactically invalid content)", plus the clause below the table — "Status
# code `400` indicates normally a bad request, as well as a generic
# client-side error, used when no other `4xx` error code is appropriate".
#
# BOTH EHRs EXIST, deliberately. If the header named a non-existent EHR the
# refusal could be the unknown-scope 404 (register AMB-101) rather than the
# conflict, and the case would prove nothing about the collision. A second EHR
# is minted in step 1 so the ONLY defect in step 2's request is that the two
# scope forms disagree.
#
# The outcome kind is `bad_request`, added by the 2026-07-28 schedule release
# (#544); before it the closed taxonomy had no kind for a self-contradictory
# REQUEST (`invalid_query` means malformed AQL, which this is not;
# `validation_failed` means semantically invalid CONTENT), which is why the
# behaviour was carried as the `query-ehr-id-parameter-header-conflict` ledger
# exception.
id: I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_param_and_header_conflict
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic, QueryApi]
profiles: [STANDARD]
ambiguities: [AMB-59]
test_purpose: >-
  An ad-hoc execution whose ehr_id query parameter and openehr-ehr-id request
  header name DIFFERENT existing EHRs is refused as a client error rather than
  executed against either.
description: "Ad-hoc AQL with conflicting ehr_id parameter and openehr-ehr-id header"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §About the ehr_id parameter"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", aql: ">=1.1", its_rest: ">=1.1.0" }
guards:
  - "No released sentence assigns precedence when the ehr_id parameter and the openehr-ehr-id header disagree — ITS-REST query Request.md §About the ehr_id parameter offers them as alternatives and stops there; the refusal rests on the AMB-59 adjudication, so a server that honoured one form over the other breaches no quoted rule"
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions
flow:
  - step: 1                                 # a SECOND existing EHR, so the only defect is the disagreement
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { second_ehr_id: created.ehr_id }
  - step: 2
    call: execute_ad_hoc_query
    variant: ehr_id_param_and_header
    with:
      ehr_id: "${ehr_id}"                   # the URL form
      header_ehr_id: "${second_ehr_id}"     # the header form — a DIFFERENT existing EHR
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e CONTAINS COMPOSITION c
      fetch: 100
    expect: bad_request                     # §HTTP status codes row 400 (register AMB-59)
