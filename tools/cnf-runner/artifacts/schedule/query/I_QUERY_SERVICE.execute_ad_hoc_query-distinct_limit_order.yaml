# The ORDER of the two result-set modifiers, which QUERY AQL master03-syntax
# §LIMIT states in one sentence: "Where `DISTINCT` modifier is used (see
# §DISTINCT), the `LIMIT` and `OFFSET` applies to remaining rows, AFTER
# duplicates were filtered out from result set." §DISTINCT gives the filtering
# rule it applies to ("A row is considered to be duplicated in the result set
# if there is at least one other row with the same value for each corresponding
# column expression. DISTINCT specifies removal of all such duplicate rows"),
# and §LIMIT bounds what survives ("If a `LIMIT row_count` is given, no more
# than that many rows will be returned (but possibly fewer, if the query itself
# yields fewer rows)").
#
# The corpus supplies the duplicates: the recipe contract
# (corpus/recipes/query_bp.md) gives all ten committed OBSERVATIONs the same
# name, so that projection is ten identical rows. Filtering FIRST leaves one
# row, which LIMIT 3 cannot pad back up — while limiting first would leave
# three rows to dedupe, and an engine that applied LIMIT before DISTINCT is
# indistinguishable from a correct one on the count alone unless the control
# step pins what the same LIMIT yields WITHOUT the modifier. Hence the pair:
# 1 row with DISTINCT, 3 rows without.
#
# LIMIT places this case in the AqlAdvanced battery, matching its sibling
# LIMIT cases (-order_by_limit, -fetch_over_limit).
id: I_QUERY_SERVICE.execute_ad_hoc_query-distinct_limit_order
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlAdvanced]
profiles: [OPTIONS]
test_purpose: >-
  With DISTINCT in force, LIMIT bounds the rows that REMAIN after duplicate
  filtering, not the rows the query would otherwise have produced.
description: "AQL DISTINCT × LIMIT: duplicates are filtered before LIMIT applies"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §LIMIT (LIMIT applies after duplicates are filtered)"
  - "QUERY AQL master03-syntax §DISTINCT"
  - "QUERY AQL master03-syntax §ORDER BY"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions sharing one OBSERVATION name
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT DISTINCT o/name/value AS name
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        ORDER BY o/name/value ASC
        LIMIT 3
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # one determined row
        rows: [["Blood pressure"]]          # ten duplicates collapse to one BEFORE LIMIT 3 sees them
        columns: [{ name: name }]
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT o/name/value AS name
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        ORDER BY o/name/value ASC
        LIMIT 3
      fetch: 100
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # identical cell values: the sequence is determined
        rows: [["Blood pressure"], ["Blood pressure"], ["Blood pressure"]]
        columns: [{ name: name }]           # without DISTINCT the same LIMIT returns three rows
postconditions:
  - assert: state
    text: >-
      DISTINCT is applied to the result set first and LIMIT bounds what
      remains, so a duplicate-collapsing projection cannot be padded back up to
      the row_count.
