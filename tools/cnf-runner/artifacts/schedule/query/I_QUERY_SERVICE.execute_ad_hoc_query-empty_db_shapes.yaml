# Re-adjudicated 2026-07-21 from the retired ECC AQL empty-db golden battery
# (ECC-QRY-006..009, corpus groups A-D against an empty server). The vendored
# goldens are RM-1.0.x-era wire and are NOT derivable from AQL 1.1 spec text, so
# the exact-row goldens are excluded (not derivable from AQL 1.1 spec text); the
# spec-groundable core is carried here: representative valid AQL query shapes are
# accepted by the grammar and, scoped to an EHR that holds no COMPOSITION,
# return zero rows. `ecc-` id namespace pending upstream adoption.
#
# THE ZERO-ROW GROUND IS LOAD-BEARING, not vacuous: each row first mints a
# SECOND EHR and commits a COMPOSITION into it, so the server DOES hold
# composition content when the query runs, and the fixtures are UNSCOPED
# population queries (Query_types.md §"Population queries": "not referring or
# using any `ehr_id` parameter to constrain the scope on a specific EHR"). The
# `ehr_id` request parameter is therefore the only thing excluding that content
# — a server that dropped it would answer one row. Without the second EHR the
# row would pass on any server whenever provisioning had refused every template.
id: I_QUERY_SERVICE.execute_ad_hoc_query-empty_db_shapes
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  Representative well-formed AQL query shapes (bare EHR projection, CONTAINS
  chain, WHERE predicate) are accepted and return an empty RESULT_SET against an
  empty server.
description: "Valid AQL query shapes against an empty database return zero rows"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §SELECT, §FROM, §CONTAINS, §WHERE"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.aql.valid.contains_composition, expected: ok, defect: "EHR CONTAINS COMPOSITION projection" }
    - { data_set: cnf.aql.valid.where_predicate, expected: ok, defect: "CONTAINS chain with a WHERE predicate" }
requires:
  server: any                              # emptiness scoped to a fresh EHR (Request.md ehr_id scope)
  templates: [cnf.opt.minimal_event]       # the second EHR's content needs its OPT provisioned
  ehr: { commits: none }                   # mints ${ehr_id} with zero commits
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                                # a SECOND EHR, so the zero-row answer has something to exclude
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { second_ehr_id: created.ehr_id }
  - step: 2                                # content in the second EHR — an unscoped answer would carry it
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${second_ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
  - step: 3
    call: execute_ad_hoc_query
    with:
      ehr_id: "${ehr_id}"                  # single-EHR execution context
      q: "${ds:fixture}"
      fetch: 100                            # fetch always explicit
    expect: "${fixture.expected}"
    assert:
      - assert: result_set
        match: count
        count: 0
