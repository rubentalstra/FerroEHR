# Literal column expressions. QUERY AQL master03-syntax §SELECT: "A column
# expression is formed by an identified path, a function, a LITERAL value or
# plain variable name defined in the FROM clause", and the section's own
# Example 3 is exactly a literal-and-function projection
# (`SELECT true AS dangerousBP, "alert" as indication, count(*) as counter`).
# §Literals fixes what a literal is — "a fixed value that is supplied directly
# in the AQL statement, not derived from an identified path … It can be used in
# the SELECT clause as a column expression" — and names the fourth column of
# this case: "Another supported literal value is the `NULL` keyword, indicating
# that the data item is either missing or is unknown". §Built-in Types settles
# the spellings: strings "enclosed in double or single quotes", booleans "the
# case-insensitive literals `true` or `false`", unquoted.
#
# Both steps assert the CELLS, not just the shape, so a server that dropped a
# literal column or returned the literal's text for the NULL keyword fails.
# Step 1 is the chapter's own literal+aggregate shape (one determined row).
# Step 2 puts the literals beside an identified path, on the single composition
# the WHERE clause isolates: the recipe contract (corpus/recipes/query_bp.md)
# fixes the top of the systolic ladder at 190 and the OBSERVATION name at
# "Blood pressure", so that row is fully determined too.
id: I_QUERY_SERVICE.execute_ad_hoc_query-select_literals
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  String, boolean and NULL literals are legal SELECT column expressions and are
  returned verbatim in every row, alongside identified-path and aggregate
  columns.
description: "AQL literal SELECT columns: string, boolean and the NULL keyword"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §SELECT, §Name alias"
  - "QUERY AQL master03-syntax §Literals, §Built-in Types"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions, systolic 100..190
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT true AS flagged, 'alert' AS indication, NULL AS unknown, COUNT(*) AS counter
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # a single aggregate row: order is determined
        rows: [[true, "alert", null, 10]]   # the literals verbatim; the NULL keyword as a void cell
        columns: [{ name: flagged }, { name: indication }, { name: unknown }, { name: counter }]
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT o/name/value AS name, 'alert' AS indication, true AS flagged, NULL AS unknown
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude = 190
      fetch: 100
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # the WHERE clause isolates exactly one composition
        rows: [["Blood pressure", "alert", true, null]]   # literals repeat per row beside the projected path
        columns: [{ name: name }, { name: indication }, { name: flagged }, { name: unknown }]
postconditions:
  - assert: state
    text: >-
      A literal column expression contributes the same fixed value to every row
      of the result set, and the NULL keyword yields a void cell rather than a
      string.
