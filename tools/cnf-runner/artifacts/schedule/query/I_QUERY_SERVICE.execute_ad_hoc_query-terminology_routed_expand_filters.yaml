# QUERY AQL master03-syntax §TERMINOLOGY, the FIRST usage form — "as a
# right-hand operand of `matches` operator, to directly match function
# results" — resolved against a REAL external terminology server. §TERMINOLOGY
# defines `expand` as "Expand a value set; this will retrieve all the codes
# contained in a value set as an explicit set", and §matches (master03 §matches,
# "results of function calls") says the function "is used to invoke operations
# of an external terminology server and return the results back to the
# `matches` operator for further use".
#
# The filter is the evidence. Two compositions are pre-committed against the
# UNBOUND CONSTRAINT_REF template — one coded with a value-set MEMBER, one with
# a code the same value set excludes but the same code system defines — so the
# expansion is the only thing that can tell them apart: a server that returned
# both rows did not expand the value set, and a server that returned neither
# did not resolve it at all. The template is deliberately the unbound twin
# (cnf.tpl.dv_coded_text_constraint_ref, no ontology constraint_bindings), so
# both compositions commit and the case measures the QUERY path alone, never
# commit-time binding validation.
id: I_QUERY_SERVICE.execute_ad_hoc_query-terminology_routed_expand_filters
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlTerminology]
profiles: [OPTIONS]
test_purpose: >-
  A `matches TERMINOLOGY('expand', …)` predicate resolved against an external
  terminology server returns exactly the committed compositions whose code is
  in the expanded value set.
description: "AQL matches TERMINOLOGY('expand', …) filters committed compositions through the routed terminology server"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §TERMINOLOGY, §WHERE"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.tpl.dv_coded_text_constraint_ref]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit:
    - cnf.composition.terminology_unbound_sct_member
    - cnf.composition.terminology_unbound_sct_non_member
  terminology:
    served:
      - "http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders"
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS ELEMENT el[at0004]
        WHERE el/value/defining_code/code_string
        matches TERMINOLOGY('expand', 'hl7.org/fhir/4.0', 'http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders')
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 1                            # the member composition only; the excluded code is filtered out
        columns: [{ name: uid }]
