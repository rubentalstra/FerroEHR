# The LIKE operator at every boundary point QUERY AQL master03-syntax §LIKE
# states, driven against the generated BP corpus. AQL's wildcards are its OWN,
# not SQL's: "The `?` wildcard in the pattern matches any single character,
# while the `*` wildcard matches any sequence of zero or more characters"; "If
# the pattern does not contain any of these wildcards, then LIKE acts like the
# `=` (equal) operator"; and "The LIKE operator always tries to match the
# ENTIRE string value, therefore if the intention is to match a sequence
# anywhere within the string, the pattern must start and end with the `*`
# wildcard". Each of those four sentences gets its own step, plus the
# complementary `?`-arity boundary that a `*`-shaped reading of `?` would pass.
#
# The left-hand operand is `c/context/start_time/value` — the spec's own LIKE
# example is a `c/context/start_time` pattern — and the recipe contract
# (corpus/recipes/query_bp.md) fixes those values: composition k carries
# 2026-01-01T00:00:00Z + k hours, so the ten values are the hours 00..09 of one
# day. §LIKE takes a left operand "that is either a String or has a String
# representation"; `/value` names the String leaf outright.
id: I_QUERY_SERVICE.execute_ad_hoc_query-like_wildcards
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  The LIKE operator matches whole string values under AQL's own wildcards —
  `*` for zero or more characters, `?` for exactly one, no wildcard for
  equality — and never as an implicit substring search.
description: "AQL LIKE: `*`/`?` wildcards, equality fallback, whole-string matching"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §LIKE"
  - "QUERY AQL master03-syntax §Identified Paths"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions, event times 2026-01-01T00..09:00:00Z
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/context/start_time/value LIKE '2026-01-01T*'
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # `*` = any sequence of zero or more characters
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/context/start_time/value LIKE '2026-01-01T0?:00:00Z'
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # `?` = any SINGLE character (the second hour digit)
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/context/start_time/value LIKE '2026-01-01T?:00:00Z'
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # exactly one character, never a sequence: the hour is two
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/context/start_time/value LIKE '2026-01-01T03:00:00Z'
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }    # no wildcard in the pattern: LIKE acts like `=`
  - step: 5
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/context/start_time/value LIKE '2026-01-01'
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # LIKE matches the ENTIRE value: a bare prefix matches nothing
  - step: 6
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/context/start_time/value LIKE '*T03*'
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }    # a sequence anywhere: the pattern must start AND end with `*`
postconditions:
  - assert: state
    text: >-
      LIKE is evaluated against the whole string value under AQL's own wildcard
      alphabet: `*` spans zero or more characters, `?` exactly one, and a
      wildcard-free pattern degenerates to equality.
