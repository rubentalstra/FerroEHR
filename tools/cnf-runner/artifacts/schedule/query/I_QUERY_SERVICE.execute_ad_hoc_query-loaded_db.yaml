# Official master11 case (id verbatim). master11:96-107 is a stub (Flow "xx").
# The assertion derives from AQL 1.1 (§CONTAINS, §Identified paths) + the
# ITS-REST QUERY contract: after a bulk commit of compositions into a fresh EHR,
# an EHR-scoped CONTAINS COMPOSITION query returns exactly the committed set. The
# bulk load is precondition state (requires.commit of a generated corpus set),
# never an un-anchored flow call. Row order is unspecified (no ORDER BY), so the
# expected uids are matched as a bag (match: set) — QUERY master03 §ORDER BY.
id: I_QUERY_SERVICE.execute_ad_hoc_query-loaded_db
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  An ad-hoc EHR-scoped CONTAINS COMPOSITION query over a loaded server returns
  exactly the committed compositions, projected by uid, as a spec-shaped
  RESULT_SET.
description: "Execute ad-hoc AQL query against a loaded database"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "CNF platform_test_schedule master11 §I_QUERY_SERVICE.execute_ad_hoc_query-loaded_db"
  - "QUERY AQL §CONTAINS, §Identified Paths"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
      fetch: 100                            # AMB-6: fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: set                          # no ORDER BY: bag equality (QUERY master03 §ORDER BY)
        rows: { from: "${ds:cnf.set.query-bp-10#all_uids_asc}" }
        columns: [{ name: uid }]
