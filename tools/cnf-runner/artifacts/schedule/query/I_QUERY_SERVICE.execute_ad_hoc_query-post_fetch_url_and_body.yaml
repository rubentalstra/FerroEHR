# The AGREEING half of the URL/body paging duality: `fetch` carried in BOTH the
# query string and the request body, with the same value, executes and windows
# to that value.
#
# Ground. The two forms both exist for POST: docs/query/Request.md §"Common
# Headers and Query Parameters" ("All query execution requests SHOULD support at
# least the following parameters" — `fetch` among them, no GET/POST
# distinction), and the body form recorded first-hand in register AMB-99. No
# released sentence assigns precedence when a value is carried in both places;
# AMB-99's fixed handling (the AMB-59 pattern) is that the two must AGREE —
# equal values are accepted, and a disagreement is a rejection. This case gates
# the accepted half; the disagreeing half is not authorable under the closed
# outcome taxonomy and is recorded as an honest boundary in
# vocab/wire_surface.yaml (`query-post-paging-parameter-conflict`).
#
# The binding places the one bound `${fetch}` in both slots, so agreement is
# structural: the case cannot accidentally send two different values.
id: I_QUERY_SERVICE.execute_ad_hoc_query-post_fetch_url_and_body
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A POST ad-hoc execution carrying the same `fetch` value in both the URL and
  the body is accepted and windowed to that value.
description: "POST ad-hoc AQL with agreeing URL and body fetch values"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST query Request.md §GET vs POST"
  - "ITS-REST query Response.md §RESULT_SET response"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
ambiguities: [AMB-99]
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                      # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]               # generated: 10 BP compositions
flow:
  - step: 1
    call: execute_ad_hoc_query
    variant: post_fetch_url                   # the variant that offers both slots
    with:
      ehr_id: "${ehr_id}"
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e CONTAINS COMPOSITION c
      url_fetch: 4                            # the URL form
      fetch: 4                                # the body form — the same value
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 4
