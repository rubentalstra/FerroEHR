# A `{major}` PREFIX selector executes the HIGHEST version inside that major.
#
# Ground (ITS-REST docs text, the released oracle).
# docs/query/Qualified_query_name.md: "When only a partial `version` pattern is
# supplied, or when `version` is not supplied at all, the system must use the
# latest `version` with the supplied prefix - i.e. if only `major` or
# `major.minor` is used, then the latest query version matching supplied prefix
# will be used." A MUST, and this case is its `{major}` branch: with 1.0.0 and
# 1.2.0 both stored, the selector `1` must resolve to 1.2.0.
#
# HOW THE EXECUTED VERSION IS OBSERVED. The RESULT_SET carries no version field
# (register AMB-103), so the two definitions project the same column under
# different `AS` aliases and the alias surfaces as the RESULT_SET column name
# (docs/query/Response.md §"RESULT_SET response"). A server that resolved the
# prefix to the LOWEST matching version answers `v_1_0_0` and the case bites.
id: I_QUERY_SERVICE.execute_stored_query-version_major_prefix
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A stored query addressed by a bare `{major}` selector executes the highest
  stored version within that major.
description: "Stored-query execution at a {major} version prefix resolves to the latest match"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Qualified_query_name.md §version identifier"
  - "ITS-REST query Response.md §RESULT_SET response"
  - "QUERY AQL §SELECT, §FROM, §CONTAINS"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                      # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]               # generated: 10 BP compositions
flow:
  - step: 1
    call: I_DEFINITION_QUERY.store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_major"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_1_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: I_DEFINITION_QUERY.store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_major"
      version: "1.2.0"
      query: "SELECT c/uid/value AS v_1_2_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 3
    call: execute_stored_query
    variant: version                          # GET /query/{name}/1
    with:
      qualified_query_name: "org.openehr.cnf::version_major"
      version: "1"
      ehr_id: "${ehr_id}"                     # single-EHR execution context
      fetch: 100                              # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: set                            # no ORDER BY: bag equality (QUERY master03 §ORDER BY)
        rows: { from: "${ds:cnf.set.query-bp-10#all_uids_asc}" }
        columns: [{ name: v_1_2_0 }]          # the LATEST version inside major 1
