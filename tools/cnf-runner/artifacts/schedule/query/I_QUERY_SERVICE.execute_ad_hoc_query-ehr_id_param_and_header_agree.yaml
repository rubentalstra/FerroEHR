# The AGREEING half of the ehr_id parameter/header duality: the same EHR named
# in BOTH released places at once is one unambiguous request and is executed.
#
# Ground (ITS-REST DOCS TEXT, the released oracle). The two forms are offered
# as alternatives — docs/query/Request.md §"About the ehr_id parameter":
# "Depending on the needs, clients MAY supply it as a query parameter `ehr_id`
# or alternatively as a request header named `openehr-ehr-id`" — and
# §"Common Headers and Query Parameters" repeats the pair. No released sentence
# defines the both-supplied case; register AMB-59's fixed handling is that
# agreeing forms execute and disagreeing forms are refused. This case gates the
# executing half; the refusal is the isolated sibling
# -ehr_id_param_and_header_conflict, so a red row names which half broke.
#
# The AQL is deliberately UNSCOPED (Query_types.md §"Population queries"), so
# the scope is carried only by the two forms under test: a server that dropped
# both would answer with every EHR's compositions and the bag equality below
# would fail.
id: I_QUERY_SERVICE.execute_ad_hoc_query-ehr_id_param_and_header_agree
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic, QueryApi]
profiles: [STANDARD]
ambiguities: [AMB-59]
test_purpose: >-
  An ad-hoc execution naming the SAME EHR in both the ehr_id query parameter
  and the openehr-ehr-id request header is executed and scoped to that EHR.
description: "Ad-hoc AQL with agreeing ehr_id parameter and openehr-ehr-id header"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §About the ehr_id parameter"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST query Query_types.md §Single EHR queries, §Population queries"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions
flow:
  - step: 1
    call: execute_ad_hoc_query
    variant: ehr_id_param_and_header        # GET /query/aql?ehr_id=… with openehr-ehr-id set too
    with:
      ehr_id: "${ehr_id}"                   # the URL form
      header_ehr_id: "${ehr_id}"            # the header form — the SAME EHR
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e CONTAINS COMPOSITION c
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: set                          # no ORDER BY: bag equality (QUERY master03 §ORDER BY)
        rows: { from: "${ds:cnf.set.query-bp-10#all_uids_asc}" }
        columns: [{ name: uid }]
