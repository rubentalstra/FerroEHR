# A MALFORMED version selector — neither an exact SEMVER nor a legal
# `{major}`/`{major}.{minor}` prefix — is 404, not a fallback to the latest.
#
# Ground. docs/query/Qualified_query_name.md admits exactly two selector shapes:
# "The `version` identifier is in the format specified by SEMVER style (i.e.
# `major.minor.patch`)" and, partially, "if only `major` or `major.minor` is
# used, then the latest query version matching supplied prefix will be used".
# `1.x` is neither: `x` is not a SEMVER numeric identifier, so the token names
# no version. The released text assigns no outcome to that shape — the silence
# is adjudicated in register AMB-102 (fixed handling: an unmatchable selector IS
# "a version that does not exist", so it takes the 404 the not-found branch
# already carries), grounded on docs/overview/Requests_and_responses.md §"HTTP
# status codes", row `404 Not Found`: "The origin service did not find the
# target resource or is not willing to disclose that one exists".
#
# The definition IS stored at 1.0.0, so a server that ignored the malformed
# token and served the latest would answer 200 and the case bites.
id: I_QUERY_SERVICE.execute_stored_query-version_malformed_selector
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A stored query addressed with a version selector that is neither an exact
  SEMVER nor a legal prefix is not found — it never resolves to another version.
description: "Stored-query execution at a malformed version selector is not found"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Qualified_query_name.md §version identifier"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
applies: { rm: ">=1.0.2", aql: ">=1.1", its_rest: ">=1.1.0" }
ambiguities: [AMB-102]
requires:
  server: any
flow:
  - step: 1
    call: I_DEFINITION_QUERY.store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_malformed"
      version: "1.0.0"
      query: "SELECT c/uid/value AS uid FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: execute_stored_query
    variant: version                          # GET /query/{name}/1.x — not a SEMVER, not a prefix
    with:
      qualified_query_name: "org.openehr.cnf::version_malformed"
      version: "1.x"
    expect: not_found
