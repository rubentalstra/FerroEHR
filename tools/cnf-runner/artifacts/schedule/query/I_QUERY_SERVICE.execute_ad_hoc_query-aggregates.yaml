# The aggregate functions over a corpus whose input values are known exactly,
# so every returned cell is an arithmetic fact rather than a shape check.
# QUERY AQL master03-syntax §Aggregate functions defines the five:
# COUNT "returns the count of the number of rows returned or of the input
# values", MIN/MAX "the minimum/maximum of the non-null input values", SUM
# "the sum of the non-null input values", AVG "the average (arithmetic mean)
# of all the non-null input values"; §COUNT adds "The `COUNT(*)` is used to
# calculate the number of all rows of the result set, including duplicates and
# NULL values" and the "COUNT([DISTINCT] expression|*)" syntax. The chapter's
# own worked example is MIN/MAX/AVG over exactly this systolic path.
#
# The recipe contract (corpus/recipes/query_bp.md) fixes the ten systolic
# magnitudes at 100, 110, … 190, so COUNT(*)=10, MIN=100, MAX=190,
# SUM=1450, AVG=145 — and the ten OBSERVATION names are all "Blood pressure",
# so COUNT(DISTINCT name) = 1 against COUNT(name) = 10, which is what
# separates the DISTINCT modifier from a plain count.
id: I_QUERY_SERVICE.execute_ad_hoc_query-aggregates
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  COUNT, MIN, MAX, SUM and AVG return the exact aggregate of the input values
  selected by FROM, and COUNT(DISTINCT …) counts only distinct values.
description: "AQL aggregate functions return the exact aggregates of the committed input values"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Aggregate functions, §COUNT, §MIN, §MAX, §SUM, §AVG"
  - "QUERY AQL master03-syntax §Name alias"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: systolic 100,110,…,190; OBSERVATION name constant
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT
        COUNT(*) AS n,
        MIN(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) AS mn,
        MAX(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) AS mx,
        SUM(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) AS sm,
        AVG(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) AS av
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # a single aggregate row: order is determined
        rows: [[10, 100, 190, 1450, 145]]   # 100..190 step 10: count 10, sum 1450, mean 145
        columns: [{ name: n }, { name: mn }, { name: mx }, { name: sm }, { name: av }]
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT COUNT(DISTINCT o/name/value) AS distinct_names, COUNT(o/name/value) AS all_names
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
      fetch: 100
    expect: ok
    assert:
      - assert: result_set
        match: ordered
        rows: [[1, 10]]                     # one distinct OBSERVATION name across the ten input values
        columns: [{ name: distinct_names }, { name: all_names }]
postconditions:
  - assert: state
    text: >-
      The aggregates are computed over the input values the FROM clause
      selects, and the DISTINCT modifier of COUNT restricts the count to
      distinct values.
