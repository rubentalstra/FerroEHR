# The deprecated TOP modifier's BACKWARD direction. QUERY AQL
# master03-syntax §TOP keeps it in the language (the published grammar,
# master07-grammar §grammar, still reads `top : TOP INTEGER
# direction=(FORWARD|BACKWARD)?`, and the section deprecates rather than
# removes it) but defines it in one clause only — it "uses `BACKWARD` and
# `FORWARD` to indicate the direction where to start to get the number of
# results to be returned". What BACKWARD starts FROM is nowhere stated: §ORDER
# BY declares that without an ORDER BY clause "default ordering in results is
# undefined", so there is no defined last row to count back from, and with one
# §TOP never says whether BACKWARD reverses the returned row order or only
# shifts which n rows are taken.
#
# So the released text mandates NEITHER acceptance with fixed semantics NOR
# rejection, and this case is report_only under AMB-174: the outcome is
# published per SUT and never gates a profile — the same shape the sibling
# dialect_extensions case carries under AMB-30. It exercises ONLY the BACKWARD
# direction; the DEFINED part of §TOP (plain `TOP n`) is gating in
# -fetch_with_top and -fetch_over_limit and is untouched by this entry.
id: I_QUERY_SERVICE.execute_ad_hoc_query-top_backward_rejected
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A query using the deprecated TOP modifier's under-defined BACKWARD direction
  is refused rather than answered with an arbitrary row set — reported per SUT;
  rejection is not spec-mandated (AMB-174).
description: "AQL TOP … BACKWARD — rejection reported, never gating"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §TOP (deprecated; the direction is described only as where to start)"
  - "QUERY AQL master03-syntax §ORDER BY (default ordering undefined)"
  - "QUERY AQL master07-grammar §grammar (top : TOP INTEGER direction=(FORWARD|BACKWARD)?)"
  - "ITS-REST query §400_Query"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT TOP 5 BACKWARD c/uid/value AS uid
        FROM EHR e CONTAINS COMPOSITION c
      fetch: 100                            # fetch always explicit
    expect: invalid_query
ambiguities: [AMB-174]
