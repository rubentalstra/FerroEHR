# The URL paging form is honoured on POST: `fetch` supplied ONLY in the query
# string windows a POST ad-hoc execution exactly as it does on GET.
#
# Ground (ITS-REST docs text, the released oracle). docs/query/Request.md
# §"Common Headers and Query Parameters" opens "All query execution requests
# SHOULD support at least the following parameters" and lists "`fetch` - used
# for paging: the number of rows to fetch (i.e. limit)". ALL query execution
# requests — the sentence draws no GET/POST distinction, so the URL form is not
# a GET-only surface; register AMB-99 records the duality (the body form exists
# too) and its fixed handling. A server that ignored the URL parameter on POST
# would answer all ten committed compositions and the count below fails.
#
# The body carries only the query (§"GET vs POST": "a mostly self-documented AQL
# query in a request body"), so the URL is the ONLY place the window comes from
# — a red row localizes to the URL form on POST alone.
id: I_QUERY_SERVICE.execute_ad_hoc_query-post_fetch_url_only
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A POST ad-hoc execution whose `fetch` is supplied only as a URL query
  parameter returns exactly that many rows — the URL paging form is honoured on
  the body-carrying method.
description: "POST ad-hoc AQL windowed by the URL fetch parameter alone"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST query Request.md §GET vs POST"
  - "ITS-REST query Response.md §RESULT_SET response"
applies: { rm: ">=1.0.2", aql: ">=1.1", its_rest: ">=1.1.0" }
ambiguities: [AMB-99]
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                      # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]               # generated: 10 BP compositions
flow:
  - step: 1
    call: execute_ad_hoc_query
    variant: post_fetch_url                   # POST /query/aql?fetch=…, body carries only the query
    with:
      ehr_id: "${ehr_id}"                     # URL scope (Request.md §About the ehr_id parameter)
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e CONTAINS COMPOSITION c
      url_fetch: 4                            # the window, in the URL only
    expect: ok
    assert:
      - assert: result_set
        match: count                          # 4 of the EHR's 10 compositions
        count: 4
