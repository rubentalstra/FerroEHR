# Re-adjudicated 2026-07-21: a natural spec-grounded extension of the retired ECC
# AQL corpus (the corpus exercises projections but no dedicated DISTINCT case).
# AQL is bag-semantics absent DISTINCT (QUERY master03 §DISTINCT); the 10 loaded
# compositions share one template name, so SELECT DISTINCT c/name/value collapses
# the ten identical projected rows to a single row. A judgment-call catalogue
# addition (this authoring comment is the record). `ecc-` id namespace pending upstream
# adoption.
id: I_QUERY_SERVICE.execute_ad_hoc_query-distinct
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  SELECT DISTINCT over a projection that is constant across the committed
  compositions collapses the duplicate rows to one, per AQL DISTINCT set
  semantics.
description: "AQL DISTINCT collapses duplicate projected rows"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §DISTINCT, §Identified Paths"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT DISTINCT o/name/value AS name
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count                        # the ten identical OBSERVATION names ("Blood pressure", the bp_series contract) collapse to one distinct row
        count: 1
