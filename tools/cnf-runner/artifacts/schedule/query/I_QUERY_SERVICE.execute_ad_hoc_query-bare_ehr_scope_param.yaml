# ONE behaviour, ONE carrier: the `ehr_id` QUERY PARAMETER narrows a bare-EHR
# population projection to exactly the named EHR. The grammar half is the
# -bare_ehr_projection sibling; the header carrier is -bare_ehr_scope_header.
#
# Ground — RELEASED TEXT, which is why this case declares no ambiguity.
# SM UML/classes/i_query_service.adoc §execute_ad_hoc_query defines the
# parameter's effect: "`_ehr_ids_`:: Specific set of EHRs on which to execute
# the query. If none supplied, a full population query will be performed on all
# EHRs whose status has the `_is_queryable_` flag set to `True`". ITS-REST
# docs/query/Query_types.md states the same effect from both sides — §"Single
# EHR queries": "This is achieved by supplying an `ehr_id` query parameter or
# setting an `openehr-ehr-id` request header"; §"Population queries": those are
# the queries "not referring or using any `ehr_id` parameter to constrain the
# scope on a specific EHR". Register AMB-101 is NOT declared: its remaining
# half is the unrealized wire branch for an UNKNOWN ehr_id, which the
# -unknown_ehr_scope sibling drives, and the scoping semantics asserted here
# need no adjudication.
#
# THE DISCRIMINATION IS TWO-EHR AND DETERMINISTIC: the flow mints a SECOND EHR
# before executing, so at least two EHRs exist and the unscoped AQL selects over
# the whole population. Exactly one row is expected — the scoped EHR — so a
# server that drops the parameter answers with two rows or more and the row
# fails. (A single-EHR ground could only fail a server that returned FEWER
# rows.)
id: I_QUERY_SERVICE.execute_ad_hoc_query-bare_ehr_scope_param
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic, QueryApi]
profiles: [STANDARD]
test_purpose: >-
  An ad-hoc execution whose EHR scope is supplied ONLY as the `ehr_id` query
  parameter answers a bare-EHR projection with exactly the scoped EHR's row.
description: "Bare-EHR AQL scoped by the ehr_id query parameter alone"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST query Query_types.md §Single EHR queries, §Population queries"
  - "QUERY AQL §SELECT, §FROM"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  ehr: { commits: none }                   # mints ${ehr_id} — the scoped EHR
flow:
  - step: 1                                 # a SECOND EHR, so the scoped read has something to exclude
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { second_ehr_id: created.ehr_id }
  - step: 2
    call: execute_ad_hoc_query
    with:
      ehr_id: "${ehr_id}"                   # travels in the URL query string
      q: "${ds:cnf.aql.valid.select_ehr}"   # unscoped AQL: the parameter is the only scope
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 1                            # the scoped EHR alone, never the population
