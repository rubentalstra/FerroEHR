# Official master11 case (id verbatim). master11:83-94 is a stub (Flow "xx"),
# so the assertion derives from AQL 1.1 + the ITS-REST QUERY contract: an
# ad-hoc query over an EHR that holds no COMPOSITION returns a well-formed
# RESULT_SET with zero rows.
#
# THE ZERO-ROW GROUND IS LOAD-BEARING, not vacuous: the flow first mints a
# SECOND EHR and commits a COMPOSITION into it, so the server DOES hold
# composition content when the query runs. The in-AQL EHR predicate
# (`EHR e[ehr_id/value='${ehr_id}']` — QUERY `master03-syntax.adoc` §FROM, the
# standard predicate on the class expression) is therefore the only thing
# excluding it, and a server that ignored the predicate would answer one row.
# Without that second EHR the row would pass on any server whenever
# provisioning had refused every template — an empty store answers zero rows
# however it treats the scope.
id: I_QUERY_SERVICE.execute_ad_hoc_query-empty_db
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  An ad-hoc AQL query executed against an empty server returns an empty,
  spec-shaped RESULT_SET (HTTP 200, zero rows).
description: "Execute ad-hoc AQL query against an empty database"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "CNF platform_test_schedule master11 §I_QUERY_SERVICE.execute_ad_hoc_query-empty_db"
  - "QUERY AQL §SELECT, §FROM"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any                              # emptiness scoped to a fresh EHR (shared-SUT realization of the empty ground)
  templates: [cnf.opt.minimal_event]       # the second EHR's content needs its OPT provisioned
  ehr: { commits: none }                   # mints ${ehr_id} with zero commits
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                                # a SECOND EHR, so the zero-row answer has something to exclude
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { second_ehr_id: created.ehr_id }
  - step: 2                                # content in the second EHR — a predicate-ignoring answer would carry it
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${second_ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: "SELECT c/uid/value FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c"
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 0
