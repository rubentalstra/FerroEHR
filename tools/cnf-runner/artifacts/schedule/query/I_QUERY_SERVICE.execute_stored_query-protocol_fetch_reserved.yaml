# The PROTOCOL parameter names are reserved: a URL `fetch` is always the paging
# parameter, never a bind for an AQL `$fetch`, and the AQL bind arrives only
# through the body's `query_parameters` object.
#
# Ground, and the silence it rests on. docs/query/Request.md §"Common Headers
# and Query Parameters" defines `fetch` as a protocol parameter of every query
# execution request ("`fetch` - used for paging: the number of rows to fetch
# (i.e. limit)"), while §"Query parameters" defines the OTHER kind — "other
# parameter(s) to replace placeholder(s) within the query, here generically
# named `query_parameters` … in the real request they will have specific names
# (e.g. `uid`, `systolic_bp`, etc.) according to their names in the query
# definition". No released sentence says what happens when a definition's
# placeholder name COLLIDES with a protocol name, and the spec contradicts
# itself nearby (register AMB-100, confirmed first-hand: the QueryParameters
# example binds `ehr_id` as a query parameter while §"About the ehr_id
# parameter" defines it as the EHR-scope protocol parameter). AMB-100's fixed
# handling is the reservation: q/ehr_id/offset/fetch in the URL are ALWAYS the
# protocol parameter, and an AQL `$parameter` sharing one of those names is
# supplied only through the JSON `query_parameters` object, where no protocol
# meaning exists. Reported upstream as #1546.
#
# THE DISCRIMINATOR. The stored AQL binds `$fetch` as a systolic threshold; the
# corpus commits ten compositions with systolic 100..190 (one per step of 10),
# so `>= 190` selects exactly ONE. The body binds `fetch: 190`; the URL carries
# the protocol `fetch=5`, a window wider than the single matching row, so a
# correct server answers 1 row. A server that bound the URL value into `$fetch`
# instead would evaluate `>= 5` and answer up to ten; one that dropped the body
# binding entirely leaves `$fetch` unbound. Both miss the count.
#
# `fetch` is a legal AQL parameter name: FETCH is not an AQL keyword (register
# AMB-103 records the released Request.md example's use of a "non-existent FETCH
# keyword" as a doc defect), so the collision this case drives is real.
id: I_QUERY_SERVICE.execute_stored_query-protocol_fetch_reserved
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [AqlBasic, QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A URL `fetch` is the paging parameter even when the executed query declares an
  AQL `$fetch`; the AQL bind is taken from the body's `query_parameters` alone.
description: "Protocol parameter names are reserved from AQL $parameter binding"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST query Request.md §Query parameters"
  - "QUERY AQL §Parameters, §WHERE"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
ambiguities: [AMB-100]
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                      # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]               # generated: 10 BP compositions, systolic 100..190
flow:
  - step: 1
    call: I_DEFINITION_QUERY.store_query
    with:
      qualified_query_name: "org.openehr.cnf::protocol_fetch"
      query: >-
        SELECT c/uid/value AS uid FROM EHR e CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude >= $fetch
    expect: stored
  - step: 2
    call: execute_stored_query
    variant: post_body                        # POST /query/{name}?ehr_id=…&fetch=5, body carries query_parameters
    with:
      qualified_query_name: "org.openehr.cnf::protocol_fetch"
      ehr_id: "${ehr_id}"                     # single-EHR execution context
      url_fetch: 5                            # the PROTOCOL parameter: a window of 5
      query_parameters: { fetch: 190 }        # the AQL $fetch bind: the systolic threshold
    expect: ok
    assert:
      - assert: result_set
        match: count                          # only the systolic-190 composition matches
        count: 1
        columns: [{ name: uid }]
