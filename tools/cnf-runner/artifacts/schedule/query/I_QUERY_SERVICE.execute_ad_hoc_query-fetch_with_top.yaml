# The spec-MANDATED rejection in the fetch/LIMIT space (contrast with the
# report_only dialect cases under AMB-30): the ITS-REST query interface
# states that the fetch parameter cannot be combined with an AQL TOP —
# a citable prohibition, so this rejection gates.
id: I_QUERY_SERVICE.execute_ad_hoc_query-fetch_with_top
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A request combining the REST fetch parameter with an AQL TOP in the query
  text is rejected — the two limit mechanisms must not be combined.
description: "fetch combined with AQL TOP is rejected (invalid_query)"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query §Request (fetch cannot be combined with TOP)"
  - "QUERY AQL §TOP"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: "SELECT TOP 5 e/ehr_id/value FROM EHR e"
      fetch: 10                             # the mandated conflict: fetch + TOP together
    expect: invalid_query
ambiguities: [AMB-6]
