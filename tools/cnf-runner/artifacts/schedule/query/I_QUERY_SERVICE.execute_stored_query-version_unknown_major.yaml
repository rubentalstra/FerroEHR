# A well-formed selector that matches no stored version is 404 — the prefix rule
# resolves to nothing, and nothing is not silently substituted with the latest.
#
# Ground (ITS-REST docs text, the released oracle).
# docs/query/Qualified_query_name.md fixes what a `{major}` selector means:
# "the latest query version matching supplied prefix will be used" — with only
# 1.0.0 stored, the prefix `9` matches no version at all, so there is no
# definition to use. docs/overview/Requests_and_responses.md §"HTTP status
# codes", row `404 Not Found`, assigns the answer: "The origin service did not
# find the target resource or is not willing to disclose that one exists".
#
# The negative half of the prefix rule matters as much as the positive half: a
# server that fell back to the latest version on an unmatched prefix would
# execute 1.0.0 here and silently answer the wrong definition.
id: I_QUERY_SERVICE.execute_stored_query-version_unknown_major
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A stored query addressed at a major version that was never stored is not
  found — the unmatched prefix never falls back to another version.
description: "Stored-query execution at an unmatched {major} selector is not found"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Qualified_query_name.md §version identifier"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
applies: { rm: ">=1.0.2", aql: ">=1.1", its_rest: ">=1.1.0" }
requires:
  server: any
flow:
  - step: 1
    call: I_DEFINITION_QUERY.store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_unknown"
      version: "1.0.0"
      query: "SELECT c/uid/value AS uid FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: execute_stored_query
    variant: version                          # GET /query/{name}/9 — no such major
    with:
      qualified_query_name: "org.openehr.cnf::version_unknown"
      version: "9"
    expect: not_found
