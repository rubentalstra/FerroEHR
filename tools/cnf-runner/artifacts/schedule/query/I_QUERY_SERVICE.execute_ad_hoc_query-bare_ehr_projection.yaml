# ONE behaviour: the GRAMMAR accepts a bare EHR-id projection and names its
# column. Nothing here is about the request-level EHR scope — the two
# -bare_ehr_scope_* siblings carry that, one per released carrier, so a red row
# names either the grammar or one carrier and never both at once.
#
# Ground. QUERY `master03-syntax.adoc` §SELECT admits a projection of identified
# paths over the FROM-clause variables, and §FROM admits `EHR e` as the
# top-level class expression, so `SELECT e/ehr_id/value FROM EHR e` is a
# well-formed query; ITS-REST docs/query/Query_types.md §"Population queries"
# names exactly this shape — a query "not referring or using any `ehr_id`
# parameter to constrain the scope on a specific EHR" — so the request carries
# no scope at all here.
#
# WHAT MAKES THE ROW NON-VACUOUS on a shared server whose population no case
# owns: the COLUMN name. The released OAS (docs text silent, so the OAS grounds
# it — cited as the OAS) fixes the naming rule in
# query-codegen.openapi.yaml components/schemas/ResultSetColumn `name`: "When
# column alias is not present in the AQL, a `0`-based column index is used
# prefixed by a hash sign (i.e. `#0`, `#1`...)", and the very example beside it
# is this projection (`name: '#0'`, `path: /ehr_id/value`). A server that never
# parsed the projection cannot name its one column that way. The row count is
# deliberately unasserted — a population query's cardinality is a property of
# the whole server, not of this case.
id: I_QUERY_SERVICE.execute_ad_hoc_query-bare_ehr_projection
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A bare EHR-id projection is accepted by the grammar and answers a well-formed
  RESULT_SET whose single unaliased column is named by the released index rule.
description: "Valid bare-EHR AQL projection is accepted and its column named"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §SELECT, §FROM"
  - "ITS-REST query Query_types.md §Population queries"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  ehr: { commits: none }                   # at least one EHR exists, so the projection has something to project
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: "${ds:cnf.aql.valid.select_ehr}"  # unscoped: no ehr_id parameter, no openehr-ehr-id header
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: contains                     # the released floor: a rows array exists
        rows: []                            # population query on a shared server: the row set is not deterministic
        columns: [{ name: "#0" }]           # OAS ResultSetColumn.name — unaliased columns are `#<index>`
