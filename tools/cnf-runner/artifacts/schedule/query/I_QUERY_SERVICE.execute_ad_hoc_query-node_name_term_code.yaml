# The name TERM-CODE node predicate over data whose node name IS coded — the
# fake-proof wire pin for the canonical expansion (QUERY master03 §Node
# predicate: `[at0002, terminology::code]` ≡ name/defining_code/code_string
# AND name/defining_code/terminology_id/value compared separately, the
# informational |value| tail ignored). The committed fixture's single ELEMENT
# carries a DV_CODED_TEXT name (snomed_ct(3.1)::271649006 |Systolic blood
# pressure|), so a defective engine that compares the raw lexeme against
# code_string alone fails the match step — plain-DV_TEXT corpora could not
# discriminate that (the #969 boundary this fixture closes).
id: I_QUERY_SERVICE.execute_ad_hoc_query-node_name_term_code
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
exercises: [CompositionOps]
profiles: [STANDARD]
test_purpose: >-
  The name term-code node predicate matches by its decomposed parts: the
  right code in the right terminology matches the coded-named node
  (informational tail ignored), a wrong code matches nothing, and a wrong
  terminology matches nothing.
description: "AQL name term-code node predicate decomposes (code AND terminology; |tail| informational)"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Node predicate (the name term-code shortcut and its canonical expansion)"
  - "QUERY AQL master03-syntax §Identified Paths"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                    # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event_coded_name.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event_coded_name.v1}" }
    expect: created
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS EVALUATION ev
        WHERE EXISTS ev/data[at0001]/items[at0002, snomed_ct(3.1)::271649006|Systolic blood pressure|]/value
      fetch: 10                             # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }   # right code, right terminology — the tail is informational
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS EVALUATION ev
        WHERE EXISTS ev/data[at0001]/items[at0002, snomed_ct(3.1)::999999999]/value
      fetch: 10
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }   # wrong code
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS EVALUATION ev
        WHERE EXISTS ev/data[at0001]/items[at0002, icd10AM::271649006]/value
      fetch: 10
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }   # right code, WRONG terminology — the expansion compares both parts
postconditions:
  - assert: state
    text: >-
      One committed composition with a coded-named ELEMENT; the term-code
      predicate matched only under the exact code AND terminology pair.
