# The AND / OR containment operators. QUERY AQL master03-syntax §Containment:
# "Logical operators AND and OR and parentheses `()` are used when multiple
# containment constrains are required", with the chapter's own parenthesised
# OR example nested under a CONTAINS. §AND and §OR fix the truth tables (AND
# "evaluates to true when both operands evaluate to true, and false
# otherwise"; OR "evaluates to true when any of the operands evaluate to
# true").
#
# The branches are ELEMENT node predicates, because the recipe contract
# (corpus/recipes/query_bp.md) gives every one of the ten compositions BOTH a
# systolic ELEMENT (at0004) and a diastolic ELEMENT (at0005) — so AND has a
# genuinely POSITIVE case with two distinct bindings, not only a vacuous
# negative one. `at0099`/`at0098` are node ids the corpus carries nowhere, so
# the negative branches are unsatisfiable by construction. The four steps
# separate the two operators: an engine reading OR as AND fails step 3, one
# reading AND as OR fails step 2.
id: I_QUERY_SERVICE.execute_ad_hoc_query-contains_and_or
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  Multiple containment constraints combined with AND require every branch to
  be satisfied, while OR requires any one of them.
description: "AQL containment operators: CONTAINS (… AND …) and CONTAINS (… OR …)"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Containment"
  - "QUERY AQL master03-syntax §AND, §OR"
  - "QUERY AQL master03-syntax §Node predicate"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions, each with ELEMENTs at0004 + at0005
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS (ELEMENT systolic[at0004] AND ELEMENT diastolic[at0005])
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # both branches satisfied by every committed composition
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS (ELEMENT systolic[at0004] AND ELEMENT absent[at0099])
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # AND is false when either branch is false
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS (ELEMENT systolic[at0004] OR ELEMENT absent[at0099])
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # OR is true when any branch is true
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS (ELEMENT absent[at0098] OR ELEMENT missing[at0099])
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # OR is false only when every branch is false
postconditions:
  - assert: state
    text: >-
      A parenthesised containment expression combines its branches under the
      stated AND/OR truth tables, and the parent is selected on the combined
      result rather than on any single branch.
