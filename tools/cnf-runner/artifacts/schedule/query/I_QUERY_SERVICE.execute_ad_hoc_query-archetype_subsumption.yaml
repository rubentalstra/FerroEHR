# The archetype-predicate MATCHING SET, pinned at its three boundary points
# (AMB-173): data committed with a SPECIALISED root archetype
# (openEHR-EHR-COMPOSITION.report-result.v1, the ckm lab-result example) is
# matched by a predicate naming the exact child id AND by one naming its
# specialisation PARENT (openEHR-EHR-COMPOSITION.report.v1) — BASE
# architecture_overview master10 §Design-time Relationships: "the data created
# with any specialised archetype will always be matched by queries based on
# the parent archetype" — while an unrelated archetype id matches nothing
# (the set is lineage-scoped, not a catch-all). The commit is in-flow so the
# EHR provably holds exactly the one composition the counts assert over.
id: I_QUERY_SERVICE.execute_ad_hoc_query-archetype_subsumption
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
exercises: [CompositionOps]
profiles: [STANDARD]
test_purpose: >-
  An ad-hoc AQL archetype predicate matches data by specialisation lineage:
  the exact child archetype id and its specialisation parent both retrieve a
  composition rooted in the specialised archetype, and an unrelated archetype
  id retrieves nothing.
description: "Ad-hoc AQL archetype predicate matches specialisation children of the named archetype"
spec_refs:
  - "BASE architecture_overview master10 §Design-time Relationships between Archetypes (parent-archetype queries retrieve specialisation-child data)"
  - "AM AOM1.4 master07 §Querying / §Supporting Archetype-based Querying (the archetype-based matching set)"
  - "QUERY AQL master03 §Archetype predicate (the predicate scopes the data source by archetype)"
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
ambiguities: [AMB-173]
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.ckm.lab_result]
  ehr: { commits: none }                    # mints ${ehr_id}
data_sets: [cnf.ckm.lab_result.example]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.ckm.lab_result.example}"   # root archetype openEHR-EHR-COMPOSITION.report-result.v1
    expect: created
    capture: { version_uid: created.version_uid }
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS COMPOSITION c[openEHR-EHR-COMPOSITION.report-result.v1]
      fetch: 10                             # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }   # exact child id matches its own data
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS COMPOSITION c[openEHR-EHR-COMPOSITION.report.v1]
      fetch: 10
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }   # the PARENT id matches the specialisation child's data (AMB-173)
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS COMPOSITION c[openEHR-EHR-COMPOSITION.encounter.v1]
      fetch: 10
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }   # an unrelated archetype id matches nothing — the set is lineage-scoped
postconditions:
  - assert: state
    text: >-
      The EHR holds exactly one composition, rooted in the specialised
      archetype; the archetype predicate's matching set is the named
      archetype plus its specialisation descendants within the major, and
      nothing else.
