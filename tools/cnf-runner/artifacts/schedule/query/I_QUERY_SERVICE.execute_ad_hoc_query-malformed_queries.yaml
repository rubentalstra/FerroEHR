# Re-adjudicated 2026-07-21 from the retired ECC AQL invalid-corpus sweep
# against AQL 1.1 spec text: a query that admits NO interpretation under the
# AQL grammar (mandatory clause structure absent) cannot be assigned
# semantics, and the wire defines the invalid-AQL rejection (ITS-REST
# 400_Query). Dialect/superset constructs live in the sibling
# dialect_extensions case (AMB-30) — this case carries only the
# unambiguously-malformed ground.
id: I_QUERY_SERVICE.execute_ad_hoc_query-malformed_queries
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A query that is not a well-formed AQL statement (mandatory clause
  structure absent) is refused as an invalid query, never executed.
description: "Malformed AQL queries are rejected (invalid_query)"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §grammar"
  - "ITS-REST query §400_Query"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.aql.invalid.syntax_garbage, expected: invalid_query, defect: "not a well-formed AQL statement (missing FROM)" }
requires:
  server: any
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: "${ds:fixture}"
      fetch: 100                            # AMB-6: fetch always explicit
    expect: "${fixture.expected}"
ambiguities: [AMB-6]
