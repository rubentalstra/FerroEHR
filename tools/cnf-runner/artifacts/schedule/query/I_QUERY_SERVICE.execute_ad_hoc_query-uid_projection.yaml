# Re-adjudicated 2026-07-21 from the retired ECC AQL case ECC-QRY-025
# (uid-projection-value) and the loaded-db projection intent of ECC-QRY-010..013
# against AQL 1.1 spec text. AQL master03 §Identified Paths lists
# COMPOSITION.uid.value (path /uid/value) as a normative projection returning the
# version id; over a loaded EHR the projected cells are exactly the committed
# OBJECT_VERSION_IDs. ORDER BY /uid/value totally orders the distinct version ids
# (QUERY master03 §ORDER BY), so the rows are matched ordered. `ecc-` id
# namespace pending upstream adoption.
id: I_QUERY_SERVICE.execute_ad_hoc_query-uid_projection
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  Projecting c/uid/value over the committed compositions returns their
  OBJECT_VERSION_IDs; ordered by uid the RESULT_SET rows equal the committed set
  in ascending uid order.
description: "AQL c/uid/value projection returns the committed version ids"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §Identified Paths, §ORDER BY"
  - "RM common §change_control (OBJECT_VERSION_ID)"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        ORDER BY c/uid/value ASC
      fetch: 100                            # AMB-6: fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # ORDER BY /uid/value totally orders the distinct ids
        rows: { from: "${ds:cnf.set.query-bp-10#all_uids_asc}" }
        columns: [{ name: uid }]
