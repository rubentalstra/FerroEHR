# The stored-execution POST body is entirely OPTIONAL: every field it can carry
# is a parameter with a released default, so a stored query that declares no AQL
# parameters executes on an empty JSON object.
#
# Ground (ITS-REST docs text, the released oracle). docs/query/Request.md
# §"Common Headers and Query Parameters" gives each execution parameter a
# default rather than requiring it — "`offset` - used for paging: the row number
# in result to start result-set from (`0`-based); default `0`" and "`fetch` -
# used for paging: the number of rows to fetch (i.e. limit); default depends on
# the implementation" — and §"Query parameters" scopes `query_parameters` to
# "each query definition", so a definition with no `$parameters` needs none.
# The POST form itself is §"GET vs POST" ("we recommend clients using the `POST`
# method instead of `GET`", unqualified by execution form), and register AMB-99
# records first-hand that the query POSTs are where `offset`/`fetch`/
# `query_parameters` travel in a body. Nothing in the released text makes any of
# them mandatory, so `{}` is a complete request and must execute.
#
# The query is provisioned first (I_DEFINITION_QUERY.store_query,
# cross-interface call) because stored execution has nothing to run otherwise.
#
# The empty body carries no EHR scope, so this is a population query
# (Query_types.md §"Population queries") over a server other cases have
# committed into: the row SET is not deterministic and is deliberately NOT
# asserted. What IS asserted is the released RESULT_SET floor — a `rows` array
# is present (docs/query/Response.md's RESULT_SET requires `rows`) — on top of
# the binding's 200 + weak-ETag + RESULT_SET-schema expectations.
id: I_QUERY_SERVICE.execute_stored_query-post_empty_body
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A parameterless stored query POST-executed with an empty JSON body `{}` is
  accepted and answers a RESULT_SET — every body field is an optional parameter
  with a released default.
description: "Stored-query POST execution with an empty request body"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST query Request.md §GET vs POST"
  - "ITS-REST query Request.md §Query parameters"
  - "ITS-REST query Response.md §RESULT_SET response"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
ambiguities: [AMB-99]
requires:
  server: any
flow:
  - step: 1
    call: I_DEFINITION_QUERY.store_query
    with:
      qualified_query_name: "org.openehr.cnf::post_empty_body"
      query: "SELECT c/uid/value AS uid FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: execute_stored_query
    variant: post_body                        # POST /query/{name}, body `{}`
    with:
      qualified_query_name: "org.openehr.cnf::post_empty_body"
    expect: ok
    assert:
      - assert: result_set
        match: contains                       # the released floor: a rows array exists
        rows: []                              # population query on a shared server: the row set is not deterministic
