# An ad-hoc query whose bound parameter value cannot be coerced to the type
# its predicate compares against: the request is the CALLER's defect and the
# refusal is the released query 400, never an internal-error 500: the docs
# text is silent on parameter-value coercion, so the released OAS grounds it
# (cited AS the OAS) — 400_Query: "the server was unable to execute the
# query due to invalid input, e.g. … at least one of the parameters has an
# invalid syntax". Found live as an unclassified sqlstate 22007 answering
# 500 (#2593).
id: I_QUERY_SERVICE.execute_ad_hoc_query-uncoercible_parameter
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A query parameter whose value cannot be coerced to its predicate's
  compared type is refused as the caller's bad request, never a server
  fault.
description: "Ad-hoc AQL, an uncoercible temporal parameter — 400"
spec_refs:
  - "QUERY AQL §WHERE (typed comparison operands)"
  - "ITS-REST OAS responses 400_Query (docs-text-silent ground): \"at least one of the parameters has an invalid syntax\""
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid FROM EHR e CONTAINS COMPOSITION c
        WHERE c/context/start_time/value >= $from
      query_parameters: { from: "not-a-date" }
      fetch: 10
    expect: invalid_query                # 400_Query — the caller's own value, not a server fault
