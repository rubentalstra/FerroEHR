# Re-adjudicated 2026-07-21 from the retired ECC AQL-terminology cases
# ECC-AQT-002/003/004; RE-AUDITED 2026-07-24 (#231): AQL master03
# §TERMINOLOGY defines THREE usage positions, all in the WHERE clause —
# (a) the right-hand operand of `matches`, (b) inside the braces of a
# `matches` operand merged with explicit codes, (c) a Boolean value
# expression in an assertion — and explicitly leaves the `operation`
# argument OPEN ("It is not restricted to any particular value as
# different terminology servers may use different ways of specifying the
# operation"; 'lookup' and 'map' are listed example operations). The
# former operation-strictness rows ('lookup' in matches, Boolean
# 'lookup') asserted a restriction the spec disclaims and were REMOVED by
# the audit; the one spec-groundable "outside the defined usage forms"
# ground is a TERMINOLOGY() in a SELECT column — a position outside the
# WHERE-clause usage set. Rejection of out-of-language constructs is
# still not spec-mandated, so the row stays report_only per AMB-30.
id: I_QUERY_SERVICE.execute_ad_hoc_query-terminology_unsupported_forms
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlTerminology]
profiles: [OPTIONS]
test_purpose: >-
  A TERMINOLOGY() function used outside the master03 §TERMINOLOGY usage
  positions (which are all WHERE-clause forms) — here, in a SELECT column —
  is rejected as an invalid query.
description: "TERMINOLOGY() outside the WHERE-clause usage forms — rejection reported, never gating"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §TERMINOLOGY"
  - "ITS-REST query §400_Query"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.aql.invalid.terminology_in_select, expected: invalid_query, defect: "TERMINOLOGY() in a SELECT column — the §TERMINOLOGY usage positions are all WHERE-clause forms (matches operand, braces-merged matches operand, Boolean assertion)" }
requires:
  server: any
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: "${ds:fixture}"
      fetch: 100                            # fetch always explicit
    expect: "${fixture.expected}"
ambiguities: [AMB-30]
