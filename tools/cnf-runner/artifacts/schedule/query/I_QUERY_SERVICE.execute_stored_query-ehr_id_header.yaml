# The `openehr-ehr-id` REQUEST HEADER, alone, scopes a STORED-query execution to
# one EHR. Ground (ITS-REST docs text, the released oracle):
# docs/query/Request.md §"Common Headers and Query Parameters" opens with "All
# query execution requests SHOULD support at least the following parameters"
# and lists, under "Related request headers", "`openehr-ehr-id` - used to
# execute the query within a single EHR context: an EHR identifier taken from
# EHR.ehr_id.value"; §"About the ehr_id parameter" then states the equivalence —
# "clients MAY supply it as a query parameter `ehr_id` or alternatively as a
# request header named `openehr-ehr-id`". ALL execution requests: stored
# execution (Query_types.md §"Stored queries") is not carved out.
#
# The stored AQL is deliberately UNSCOPED (Query_types.md §"Population
# queries"), so the header is the ONLY thing narrowing the result: a server that
# ignores it answers with every EHR's compositions and the bag equality below
# fails. The query is provisioned first (I_DEFINITION_QUERY.store_query,
# cross-interface call) because stored execution has nothing to run otherwise;
# the store PUT is the `stored` outcome kind (see the store_query binding).
#
# TODO: strengthen to a deterministic two-EHR discrimination (commit into a
# second EHR in the same case, then assert the scoped read excludes it). Not
# authorable today: the case surface has no capture alias, so a second
# `create_ehr` step rebinds `${ehr_id}` and the first EHR becomes unreachable.
id: I_QUERY_SERVICE.execute_stored_query-ehr_id_header
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A stored query executed by qualified name, with the EHR scope supplied ONLY as
  the `openehr-ehr-id` request header, returns exactly that EHR's compositions.
description: "Stored-query execution scoped by the openehr-ehr-id request header alone"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Request.md §About the ehr_id parameter"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST query Query_types.md §Single EHR queries, §Stored queries"
  - "QUERY AQL §SELECT, §FROM, §CONTAINS"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions
flow:
  - step: 1
    call: I_DEFINITION_QUERY.store_query
    with:
      qualified_query_name: "org.openehr.cnf::stored_ehr_id_header"
      query: "SELECT c/uid/value AS uid FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: execute_stored_query
    variant: ehr_id_header                  # GET /query/{name}, scope via openehr-ehr-id
    with:
      qualified_query_name: "org.openehr.cnf::stored_ehr_id_header"
      ehr_id: "${ehr_id}"                   # travels in the header, not the query string
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: set                          # no ORDER BY: bag equality (QUERY master03 §ORDER BY)
        rows: { from: "${ds:cnf.set.query-bp-10#all_uids_asc}" }
        columns: [{ name: uid }]
