# The empty-input semantics of the aggregate functions, which QUERY AQL
# master03-syntax states per function and splits two ways: §COUNT — "If there
# are no matching rows, then this function returns `0`" — against §MIN, §MAX,
# §SUM and §AVG, each of which reads "If there are no matching rows, then this
# function returns `NULL`". So an aggregate query over an empty input is not a
# zero-row answer: it is ONE row carrying 0 for the count and the NULL literal
# (§Literals: "Another supported literal value is the `NULL` keyword,
# indicating that the data item is either missing or is unknown") for the four
# others.
#
# The empty input is a freshly minted EHR with no commits, scoped by its own
# ehr_id — the same empty ground the sibling empty_db cases use. The split
# between COUNT and the rest is the whole point: a server answering 0 to all
# five, NULL to all five, or no row at all fails this case.
id: I_QUERY_SERVICE.execute_ad_hoc_query-aggregates_empty_set
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  Over an empty input set the aggregate query returns a single row in which
  COUNT is 0 while MIN, MAX, SUM and AVG are NULL.
description: "AQL aggregates over an empty input: COUNT → 0, MIN/MAX/SUM/AVG → NULL"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §COUNT, §MIN, §MAX, §SUM, §AVG"
  - "QUERY AQL master03-syntax §Literals (the NULL keyword)"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any                               # emptiness scoped to a fresh EHR (Request.md ehr_id scope)
  ehr: { commits: none }                    # mints ${ehr_id} with zero commits
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT
        COUNT(*) AS n,
        MIN(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) AS mn,
        MAX(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) AS mx,
        SUM(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) AS sm,
        AVG(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) AS av
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # a single aggregate row: order is determined
        rows: [[0, null, null, null, null]] # COUNT returns 0; the four others return NULL
        columns: [{ name: n }, { name: mn }, { name: mx }, { name: sm }, { name: av }]
postconditions:
  - assert: state
    text: >-
      An aggregate query over no matching rows still yields one row, with the
      count at 0 and every value-returning aggregate NULL.
