# The stored-execution half of the spec-MANDATED rejection in the fetch/LIMIT
# space. The ad-hoc half is I_QUERY_SERVICE.execute_ad_hoc_query-fetch_with_top;
# the conflict is NOT ad-hoc-specific, because the released prohibition is
# stated on the protocol parameter itself, which every query execution request
# carries.
#
# Decisive released sentence (ITS-REST docs/query/Request.md §"Common Headers
# and Query Parameters", which opens "All query execution requests SHOULD
# support at least the following parameters"): "`fetch` - used for paging: the
# number of rows to fetch (i.e. limit); default depends on the implementation,
# but cannot be combined with [AQL-top]". A stored definition carrying TOP,
# invoked with a URL `fetch`, is exactly the combination the sentence forbids.
#
# THE DISCRIMINATOR: the stored text is otherwise perfectly executable and the
# name resolves, so neither the not_found branch nor a parse failure can
# explain a rejection — only the forbidden combination can. A server that
# silently let one limit win would answer 200 and the case bites.
id: I_QUERY_SERVICE.execute_stored_query-fetch_with_top
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [AqlBasic, QueryApi]
profiles: [STANDARD]
test_purpose: >-
  Invoking a stored query whose AQL carries a TOP with the REST fetch paging
  parameter is rejected — the two limit mechanisms must not be combined, on the
  stored route as on the ad-hoc one.
description: "Stored-query execution combining fetch with an AQL TOP is rejected"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters (fetch cannot be combined with TOP)"
  - "QUERY AQL §TOP"
applies: { rm: ">=1.0.2", aql: ">=1.1", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                    # mints ${ehr_id} for the single-EHR execution context
flow:
  - step: 1
    call: I_DEFINITION_QUERY.store_query
    with:
      qualified_query_name: "org.openehr.cnf::stored_top"
      query: "SELECT TOP 5 c/uid/value AS uid FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: execute_stored_query
    with:
      qualified_query_name: "org.openehr.cnf::stored_top"
      ehr_id: "${ehr_id}"                   # single-EHR execution context
      fetch: 10                             # the mandated conflict: fetch + the stored TOP together
    expect: invalid_query
