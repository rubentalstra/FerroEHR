# A well-formed but UNKNOWN EHR scope is 404 — the single-EHR scope addresses a
# real EHR, and a query scoped to one that does not exist is not an empty
# result.
#
# Ground. SM openehr_platform §I_QUERY_SERVICE declares the error on BOTH query
# operations: `execute_ad_hoc_query` lists ".Errors * `ehr_id_does_not_exist`",
# and its `_ehr_ids_` parameter is "Specific set of EHRs on which to execute the
# query". The released ITS-REST text gives that error no wire branch — the
# strongest sentence about the scope is docs/query/Request.md §"About the ehr_id
# parameter" ("MAY be used by the underlying backend to perform routing,
# optimizations or similar"), and the ad-hoc operation declares no not-found
# response of its own. The gap is adjudicated in register AMB-101 (fixed
# handling: the unknown scope answers 404, REALIZING the SM error), resting on
# docs/overview/Requests_and_responses.md §"HTTP status codes", row `404 Not
# Found`: "The origin service did not find the target resource or is not willing
# to disclose that one exists".
#
# The scope travels in the `openehr-ehr-id` request header (Request.md §"About
# the ehr_id parameter": clients "MAY supply it as a query parameter `ehr_id` or
# alternatively as a request header named `openehr-ehr-id`"), so the AQL itself
# is unscoped and the header is the only thing addressing an EHR. The ehr_id is
# a fixed arbitrary UUID literal that no case provisions.
id: I_QUERY_SERVICE.execute_ad_hoc_query-unknown_ehr_scope
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  An ad-hoc GET execution scoped to a well-formed but non-existent ehr_id
  reports the EHR does not exist rather than answering an empty result set.
description: "Ad-hoc AQL scoped to an unknown ehr_id is not found"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §About the ehr_id parameter"
  - "ITS-REST query Query_types.md §Single EHR queries"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
applies: { rm: ">=1.0.2", aql: ">=1.1", its_rest: ">=1.1.0" }
ambiguities: [AMB-101]
requires:
  server: any
flow:
  - step: 1
    call: execute_ad_hoc_query
    variant: get_ehr_id_header                # GET /query/aql, scope via openehr-ehr-id
    with:
      ehr_id: "44444444-4444-4444-8444-444444444444"   # fixed arbitrary UUID: no case provisions it
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e CONTAINS COMPOSITION c
      fetch: 100                              # fetch always explicit
    expect: not_found
