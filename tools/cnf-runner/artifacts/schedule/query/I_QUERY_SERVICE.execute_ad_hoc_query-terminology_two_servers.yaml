# N>=2 TERMINOLOGY SERVERS, SIMULTANEOUSLY, IN ONE RUNNING DEPLOYMENT.
#
# BASE docs/architecture_overview/master12-terminology.adoc §Overview names the
# ecosystem archetypes bind to — "recognised terminologies such as LOINC, ICDx,
# ICPC, SNOMED CT and the many other terminologies and vocabularies used in
# healthcare" — and §"Binding Terminology Value-sets to Archetypes" binds an ac
# code "to queries to ONE OR MORE external terminologies". A deployment
# therefore answers for several terminologies at once, and QUERY AQL
# master03-syntax §TERMINOLOGY reinforces that the query never names a server:
# `service_api` is "an identifier of a type of terminology service. This is not
# the service endpoint as such, neither a service name", so WHICH server
# answers a given terminology is a deployment fact — here declared in the
# ixit's `terminology.servers`, one namespace list per server.
#
# WHAT MAKES THIS A PROOF rather than two queries in a row: the two steps ask
# about DIFFERENT terminology namespaces, `requires.terminology.distinct_servers`
# demands that the party declares them on TWO DISTINCT reachable servers, and
# nothing is restarted or reconfigured between the steps. Both answers coming
# back correct in one run is therefore only possible if both servers were held
# open at the same time and each namespace reached its own. (A deployment that
# collapsed to a single server for everything is still a legitimate deployment
# — it simply declares one server, and this case is not-applicable on it.)
id: I_QUERY_SERVICE.execute_ad_hoc_query-terminology_two_servers
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlTerminology]
profiles: [OPTIONS]
test_purpose: >-
  Two TERMINOLOGY() operands naming two different terminology namespaces are
  both resolved in one running deployment, each through the server that
  deployment declares for it.
description: "AQL TERMINOLOGY() resolves two terminology namespaces through two simultaneously configured servers"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "BASE architecture_overview §Terminology in openEHR"
  - "QUERY AQL §TERMINOLOGY"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
guards:
  - "A deployment wired to a single terminology server is conformant: BASE master12 §Overview describes the multi-terminology ecosystem, it does not require every deployment to bind to more than one. Such a party declares one server and this case is not-applicable with that citation"
requires:
  server: any
  ehr: { commits: none }                    # mints ${ehr_id}
  terminology:
    served:
      - "http://cnf.example.test/fhir/CodeSystem/sct-shaped"
      - "http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders"
      - "http://cnf.example.test/fhir/CodeSystem/lab-shaped"
      - "http://cnf.example.test/fhir/ValueSet/lab-shaped-vitals"
    # The four namespaces above must be spread over at least two DISTINCT
    # reachable servers — the simultaneity this case exists to evidence.
    distinct_servers: 2
flow:
  # The first terminology: a hierarchical, SNOMED-CT-shaped namespace.
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT e/ehr_id/value AS ehr_id
        FROM EHR e[ehr_id/value='${ehr_id}']
        WHERE TERMINOLOGY('validate', 'hl7.org/fhir/4.0',
        'system=http://cnf.example.test/fhir/CodeSystem/sct-shaped&url=http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders&code=1000002') = true
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 1
  # The second terminology, in the SAME running deployment, with no restart
  # and no reconfiguration between the two steps: a LOINC-shaped namespace the
  # party declares on a different server.
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT e/ehr_id/value AS ehr_id
        FROM EHR e[ehr_id/value='${ehr_id}']
        WHERE TERMINOLOGY('validate', 'hl7.org/fhir/4.0',
        'system=http://cnf.example.test/fhir/CodeSystem/lab-shaped&url=http://cnf.example.test/fhir/ValueSet/lab-shaped-vitals&code=99991-1') = true
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 1
