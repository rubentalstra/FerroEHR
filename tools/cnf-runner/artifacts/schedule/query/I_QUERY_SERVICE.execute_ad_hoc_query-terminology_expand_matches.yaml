# Re-adjudicated 2026-07-21 from the retired ECC AQL-terminology case ECC-AQT-001
# against AQL 1.1 spec text. AQL master03 §TERMINOLOGY usage (a): TERMINOLOGY(
# 'expand', <server>, <value-set>) as a `matches` operand merges into a code
# list, filtering committed compositions by category. This is the AqlTerminology
# (OPTIONS) profile evidence the master11 spine leaves unevidenced. The 10 loaded
# blood-pressure compositions carry category event, which the value set contains,
# so all match. NOTE: value-set resolution against an in-process terminology
# bundle is an engine extension — no openEHR spec governs the bundle contents;
# only the AQL TERMINOLOGY() *language* form is spec-grounded. `ecc-` id namespace
# pending upstream adoption.
id: I_QUERY_SERVICE.execute_ad_hoc_query-terminology_expand_matches
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlTerminology]
profiles: [OPTIONS]
test_purpose: >-
  A matches TERMINOLOGY('expand', …) predicate over the committed compositions
  filters by the value set's codes and returns the matching compositions.
description: "AQL matches TERMINOLOGY('expand', …) filters committed compositions"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §TERMINOLOGY, §WHERE"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1", term: ">=3.0.0" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/category/defining_code/code_string
        matches TERMINOLOGY('expand', 'openehr', 'composition_category')
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: contains                     # every committed composition's category is in the value set
        rows: { from: "${ds:cnf.set.query-bp-10#all_uids_asc}" }
        columns: [{ name: uid }]
