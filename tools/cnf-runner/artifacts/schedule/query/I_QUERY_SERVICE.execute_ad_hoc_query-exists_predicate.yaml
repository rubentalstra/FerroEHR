# The EXISTS unary operator and its negation, pinned as a COMPLEMENTARY pair
# over one committed set so neither branch can pass by accident. QUERY AQL
# master03-syntax §EXISTS: "EXISTS is a unary operator, whose operand is an
# identified path. It returns a Boolean result: `true` means the data
# associated with the specified path exists, `false` otherwise." §NOT gives the
# negation ("returns a Boolean result: `true` means the operand is `false`")
# and the chapter's own example is exactly the negated form
# (`NOT EXISTS c/content[openEHR-EHR-ADMIN_ENTRY.discharge.v1]`).
#
# The two paths are chosen from the recipe contract (corpus/recipes/query_bp.md
# + the OBSERVATION shape it fixes): the systolic magnitude is PRESENT in every
# one of the ten compositions, while `c/context/other_context` — an optional
# EVENT_CONTEXT attribute (RM ehr master02 EVENT_CONTEXT.other_context [0..1])
# — is carried by none of them. Over the same ten rows the four steps must
# therefore read 10 / 0 / 0 / 10: an engine that ignored the predicate would
# answer 10 to all four, and one that inverted it would answer 0 to all four.
id: I_QUERY_SERVICE.execute_ad_hoc_query-exists_predicate
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  EXISTS over an identified path selects exactly the rows whose data at that
  path is present, and NOT EXISTS exactly the complement.
description: "AQL EXISTS / NOT EXISTS over present and absent identified paths"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §EXISTS, §NOT"
  - "QUERY AQL master03-syntax §Identified expression"
  - "RM ehr §EVENT_CONTEXT (other_context is optional)"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions, no other_context
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE EXISTS o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # the systolic magnitude is present in every committed composition
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE NOT EXISTS o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # the exact complement of step 1
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE EXISTS c/context/other_context
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # the optional attribute is absent from every committed composition
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE NOT EXISTS c/context/other_context
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # the exact complement of step 3
postconditions:
  - assert: state
    text: >-
      EXISTS is a genuine presence test on the identified path, and NOT EXISTS
      its exact complement over the same row set.
