# The VERSION class expression and its two named version predicates, over a
# versioned object the flow itself takes to two versions so the expected counts
# are facts of the case rather than of the server's history.
#
# GROUND. The AQL 1.1 grammar — the normative syntax QUERY AQL master07-grammar
# publishes as `AqlParser.g4` — gives the VERSION class expression its own
# production, `classExprOperand … #versionClassExpr`, and a closed version
# predicate: `versionPredicate : LATEST_VERSION | ALL_VERSIONS |
# standardPredicate`. master03-syntax §FROM fixes what a class expression
# ranges over — "All the classes referenced by the FROM clause should be
# defined by the RM" — and the RM defines both the class and the two
# selections the predicate names: VERSIONED_OBJECT `all_versions ():
# List<VERSION<T>>` against `latest_version (): VERSION`, tied together by the
# invariant `All_versions_valid: all_versions.count = version_count` (RM common
# VERSIONED_OBJECT). So `[ALL_VERSIONS]` ranges over every VERSION of the
# versioned object and `[LATEST_VERSION]` over the one latest — here 2 rows
# against 1.
#
# NOT covered here: a VERSION class expression carrying the third alternative,
# a bare `standardPredicate` on version metadata. Nothing in the released QUERY
# text says which version SCOPE such a predicate filters within (all versions,
# or the latest only), so its row count is not derivable and no honest
# expectation can be written for it.
id: I_QUERY_SERVICE.execute_ad_hoc_query-all_versions
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
exercises: [Versioning, CompositionOps]
profiles: [STANDARD]
test_purpose: >-
  A VERSION class expression qualified ALL_VERSIONS ranges over every version
  of the versioned object, while LATEST_VERSION ranges over the latest one
  only.
description: "AQL VERSION class expression: ALL_VERSIONS against LATEST_VERSION"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master07-grammar §grammar (AqlParser.g4 versionClassExpr; versionPredicate : LATEST_VERSION | ALL_VERSIONS | standardPredicate)"
  - "QUERY AQL master03-syntax §Class expressions, §FROM, §Containment"
  - "RM common §VERSIONED_OBJECT (all_versions(): List<VERSION>, latest_version(): VERSION; All_versions_valid)"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                    # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_EHR_COMPOSITION.update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS VERSION v[ALL_VERSIONS] CONTAINS COMPOSITION c
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 2 }    # both versions of the one versioned object
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS VERSION v[LATEST_VERSION] CONTAINS COMPOSITION c
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }    # the latest version only
postconditions:
  - assert: state
    text: >-
      The EHR holds one versioned COMPOSITION at two versions; the version
      predicate decides which of them the query ranges over.
