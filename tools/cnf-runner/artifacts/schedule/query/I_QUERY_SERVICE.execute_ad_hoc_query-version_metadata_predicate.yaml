# The THIRD alternative of the version predicate — a standard predicate on
# version metadata — over a versioned object the flow takes to two versions
# (creation 249, then amendment 250), so every expected count is a fact of the
# case. The version SCOPE such a predicate filters within is genuine released-
# text silence adjudicated in AMB-175 (fixed_handling: the predicate selects
# from the WHOLE version set — the grammar's three versionPredicate forms are
# peers, and a latest-only reading would collapse the standardPredicate
# alternative into LATEST_VERSION + WHERE). The rubric-form step additionally
# pins the coded-field sub-path law on the wire: change_type/value compares
# the RUBRIC, defining_code/code_string the stored code (QUERY master03
# §Predicates/Standard predicate; RM common §AUDIT_DETAILS change_type — a
# DV_CODED_TEXT from the openEHR audit_change_type group).
id: I_QUERY_SERVICE.execute_ad_hoc_query-version_metadata_predicate
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
exercises: [Versioning, CompositionOps]
profiles: [STANDARD]
test_purpose: >-
  A VERSION standard predicate on commit-audit metadata selects from the
  whole version set (AMB-175): over a created-then-amended object, the
  creation predicate answers exactly the first version — in both the
  defining_code/code_string and the rubric (value) sub-path forms — and a
  change type no version carries answers nothing.
description: "AQL VERSION standard predicate on commit_audit/change_type (whole-set scope, AMB-175)"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master07-grammar §grammar (versionPredicate : LATEST_VERSION | ALL_VERSIONS | standardPredicate)"
  - "QUERY AQL master03-syntax §Predicates/Standard predicate, §Class expressions"
  - "RM common §AUDIT_DETAILS (change_type: DV_CODED_TEXT, the audit_change_type group)"
ambiguities: [AMB-175]
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                    # mints ${ehr_id}
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      preceding_version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_EHR_COMPOSITION.update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${preceding_version_uid}"   # ITS-REST: If-Match (ITS-REST overview §If-Match)
    expect: updated
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT v/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS VERSION v[commit_audit/change_type/defining_code/code_string='249']
        CONTAINS COMPOSITION c
      fetch: 10                             # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }   # the creation version only (whole-set scope, AMB-175)
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT v/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS VERSION v[commit_audit/change_type/value='creation']
        CONTAINS COMPOSITION c
      fetch: 10
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 1 }   # the rubric sub-path answers the same version
  - step: 5
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT v/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}']
        CONTAINS VERSION v[commit_audit/change_type/defining_code/code_string='523']
        CONTAINS COMPOSITION c
      fetch: 10
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }   # no deleted version exists
postconditions:
  - assert: state
    text: >-
      The versioned object holds a creation and an amendment version; the
      metadata predicate selected over the whole set in both sub-path forms.
