# The exclusion containment constraint. QUERY AQL master03-syntax §Containment:
# "The logical operator NOT can be used in combination with CONTAINS to express
# an exclusion constraint, i.e. the absence of any containment relationship
# between a parent and potential child items", with the chapter's own example
# matching COMPOSITIONs that do NOT contain a given OBSERVATION. §NOT gives the
# same construct in the FROM clause.
#
# The committed set (corpus/recipes/query_bp.md) is ten COMPOSITIONs whose
# content is exactly one blood-pressure OBSERVATION — no INSTRUCTION, and no
# OBSERVATION of any other archetype. So the exclusion must read 10 for a class
# nothing carries, 0 for the class every composition carries, and 10 again when
# the excluded class is present but the archetype predicate scopes it to a
# lineage the data is not in: the third step is what separates a real
# archetype-scoped exclusion from a class-only one.
id: I_QUERY_SERVICE.execute_ad_hoc_query-not_contains
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A NOT CONTAINS containment constraint selects exactly the parents that hold
  no matching child, scoped by the excluded class expression's own predicate.
description: "AQL FROM … NOT CONTAINS excludes parents holding a matching child"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Containment, §NOT"
  - "QUERY AQL master03-syntax §Archetype predicate"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: 10 BP compositions, content = one OBSERVATION each
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        NOT CONTAINS INSTRUCTION i
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # no committed composition holds an INSTRUCTION
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        NOT CONTAINS OBSERVATION o
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # every committed composition holds an OBSERVATION — the exclusion bites
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        NOT CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.body_temperature.v2]
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # the excluded class is scoped by its own archetype predicate
postconditions:
  - assert: state
    text: >-
      NOT CONTAINS expresses the absence of a containment relationship, and the
      excluded child's own class expression predicate scopes what counts as a
      match.
