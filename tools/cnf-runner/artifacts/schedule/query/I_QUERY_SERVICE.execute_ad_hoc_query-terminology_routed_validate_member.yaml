# QUERY AQL master03-syntax §TERMINOLOGY, the THIRD usage form — "as a Boolean
# value expression, when an assertion is being tested" — resolved against a
# REAL external terminology server rather than an in-process bundle. The spec's
# own example is exactly this shape:
#   WHERE TERMINOLOGY('validate', 'hl7.org/fhir/r4',
#         'system=…&code=…&url=…&display=…') = true
# and §TERMINOLOGY defines the function as the way "to invoke operations of an
# external terminology server and return the results for further processing by
# AQL". The `service_api` argument is "an identifier of a type of terminology
# service … not the service endpoint as such", with `hl7.org/fhir/4.0` the
# spec's own FHIR R4 identifier, so which SERVER answers is a deployment fact
# the ixit declares (`terminology.servers`) — never something the query names.
#
# The proof is the ANSWER, not the round trip: the code asked about is a member
# of the seeded value set, so the assertion holds and the scoped EHR is
# returned. Its non-member twin (…-terminology_routed_validate_non_member) asks
# the same question about a code the same value set excludes and expects zero
# rows, so a server that ignored the terminology answer cannot pass both.
id: I_QUERY_SERVICE.execute_ad_hoc_query-terminology_routed_validate_member
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlTerminology]
profiles: [OPTIONS]
test_purpose: >-
  A Boolean TERMINOLOGY('validate', …) assertion over a code the bound value
  set CONTAINS holds, so the WHERE clause selects the scoped EHR.
description: "AQL Boolean TERMINOLOGY('validate', …) resolves true through the routed terminology server"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §TERMINOLOGY"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  ehr: { commits: none }                    # mints ${ehr_id}
  terminology:
    # The value set and the code system it draws from must both be answered by
    # a terminology server this deployment can reach — an ixit declaration,
    # because released ITS-REST surfaces no terminology resource to ask.
    served:
      - "http://cnf.example.test/fhir/CodeSystem/sct-shaped"
      - "http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders"
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT e/ehr_id/value AS ehr_id
        FROM EHR e[ehr_id/value='${ehr_id}']
        WHERE TERMINOLOGY('validate', 'hl7.org/fhir/4.0',
        'system=http://cnf.example.test/fhir/CodeSystem/sct-shaped&url=http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders&code=1000002') = true
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 1                            # the assertion holds -> the scoped EHR is selected
        columns: [{ name: ehr_id }]
