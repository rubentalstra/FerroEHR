# QUERY AQL master03-syntax §TERMINOLOGY, the SUBSUMPTION operation in the
# function's THIRD usage form — "as a Boolean value expression, when an
# assertion is being tested". The section names the operation and fixes its
# direction: "*subsumes*: Subsumption testing; this will determine if a
# particular terminology concept is a subtype (is-a) of another one. For
# example, test in SNOMED-CT if `"Myasthenia Gravis | 91637004"` is a subtype
# of `"autoimmune disease | 85828009"` (i.e. test if `85828009` subsumes
# `91637004`)" — the first code is the ancestor, the second the candidate
# descendant. The `service_api` argument is "an identifier of a type of
# terminology service … not the service endpoint as such", with
# `hl7.org/fhir/4.0` the section's own FHIR R4 identifier, so WHICH server
# answers is a deployment fact the ixit declares (`terminology.servers`) and
# never something the query names; the parameter names in `params_uri` are that
# flavour's, per the same paragraph ("The specified operation can be properly
# dereferenced by the implementation of the `service_api`").
#
# The proof is the ANSWER, not the round trip, and it takes both steps: the
# composed code system is hierarchical (is-a), with 1000001 the parent of
# 1000002 and 1000003 an unrelated top-level concept, so the SAME assertion
# shape must hold for the ancestor/descendant pair and fail for the unrelated
# one. A server that ignored the terminology answer — or inverted the two code
# arguments — cannot pass both steps.
id: I_QUERY_SERVICE.execute_ad_hoc_query-terminology_subsumes
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlTerminology]
profiles: [OPTIONS]
test_purpose: >-
  A Boolean TERMINOLOGY('subsumes', …) assertion holds exactly when the first
  code subsumes the second in the bound code system's is-a hierarchy.
description: "AQL Boolean TERMINOLOGY('subsumes', …) resolves through the routed terminology server"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §TERMINOLOGY"
  - "QUERY AQL master03-syntax §Identified expression"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  ehr: { commits: none }                    # mints ${ehr_id}
  terminology:
    # The subsumption question is asked of a code SYSTEM, so that namespace is
    # the one a reachable server must answer for — an ixit declaration, because
    # released ITS-REST surfaces no terminology resource to ask.
    served:
      - "http://cnf.example.test/fhir/CodeSystem/sct-shaped"
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT e/ehr_id/value AS ehr_id
        FROM EHR e[ehr_id/value='${ehr_id}']
        WHERE TERMINOLOGY('subsumes', 'hl7.org/fhir/4.0',
        'system=http://cnf.example.test/fhir/CodeSystem/sct-shaped&codeA=1000001&codeB=1000002') = true
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 1                            # 1000001 is-a parent of 1000002: the assertion holds
        columns: [{ name: ehr_id }]
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT e/ehr_id/value AS ehr_id
        FROM EHR e[ehr_id/value='${ehr_id}']
        WHERE TERMINOLOGY('subsumes', 'hl7.org/fhir/4.0',
        'system=http://cnf.example.test/fhir/CodeSystem/sct-shaped&codeA=1000003&codeB=1000002') = true
      fetch: 100
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 0                            # 1000003 is unrelated to 1000002: the assertion fails
        columns: [{ name: ehr_id }]
postconditions:
  - assert: state
    text: >-
      The subsumption answer comes from the bound terminology server's is-a
      hierarchy and decides the WHERE clause, in the direction the section
      states (the first code subsumes the second).
