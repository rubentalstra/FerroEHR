# Official master11 case (id verbatim). The schedule row is a pure stub —
# Description/Pre-conditions/Post-conditions/Flow are all "xx" (master11:48-59),
# and the heading sits under the execute_stored_query() section. The row defines
# NO service behaviour, so per the runner's spine-first rule the assertion is
# derived from the ITS-REST QUERY contract directly: "the query service responds"
# is realized as the simplest ad-hoc query returning a well-formed RESULT_SET.
# Anchored to execute_ad_hoc_query (a stored query would need provisioning the
# smoke ritual should not depend on).
id: I_QUERY_SERVICE.smoke_test
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  The query service is reachable and answers the simplest well-formed AQL query
  with a spec-shaped RESULT_SET (HTTP 200).
description: "Query service smoke test (master11 row is a stub; ad-hoc RESULT_SET liveness)"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "CNF platform_test_schedule master11 §I_QUERY_SERVICE.smoke_test"
  - "QUERY AQL §SELECT, §FROM"
  - "ITS-REST query §200_Query (RESULT_SET: rows required; columns, meta optional)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: "SELECT e/ehr_id/value FROM EHR e"
      fetch: 1                              # AMB-6: fetch always explicit
    expect: ok
