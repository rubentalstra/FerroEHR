# The query response's conditional header: a RESULT_SET is served with an
# `ETag` identifying it, in the weak form.
#
# Ground (ITS-REST docs text, the released oracle), both halves quoted.
# PRESENCE — docs/query/Request.md §"Common Headers and Query Parameters" lists
# the query response's own header: "Related response headers: `ETag` - A unique
# identifier of the resultSet"; docs/overview/Requests_and_responses.md §"ETag
# and Last-Modified" places it in the same family ("Both `ETag` and
# `Last-Modified` SHOULD be included in responses for VERSION,
# VERSIONED_OBJECT, or other resources that have versioning or unique state
# identifiers" — the resultSet identifier is exactly such a unique state
# identifier). FORM — §"Deprecated headers": "all `ETag` headers that hold a
# resource identifier MUST include a weakness indicator `W/`", with §"ETag and
# Last-Modified" giving the reason ("the `ETag` value is independent of its
# resource serialization format (JSON/XML) … Therefore, the `ETag` is considered
# to be of weak-type and should have a weakness indicator `W/` prefix").
#
# WHAT IS NOT ASSERTED: the identifier INSIDE the tag. The same section leaves
# it to the service ("usually taken from e.g. VERSIONED_OBJECT.uid.value,
# VERSION.uid.value, EHR.ehr_id.value, etc."), and no released sentence fixes
# how a resultSet identifier is derived — so the matcher pins the weak wrapper
# and nothing more.
#
# The matcher lives on the binding, so every ok query row checks it; this case
# exists so the header has a case whose PURPOSE is the header, and a red row
# names it directly. The query is scoped to the case's own freshly minted,
# commit-free EHR, so the row count is deterministic without any corpus — and
# the flow first mints a SECOND EHR carrying a COMPOSITION, so that zero-row
# answer is evidence of the `ehr_id` scope rather than of an empty store: the
# AQL is an unscoped population query (Query_types.md §"Population queries"),
# so a server that dropped the parameter would answer one row.
id: I_QUERY_SERVICE.execute_ad_hoc_query-result_set_etag
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A query execution answers with an `ETag` identifying the resultSet, carrying
  the mandatory weak-type indicator.
description: "RESULT_SET response carries a weak-form ETag identifying the result set"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST overview Requests_and_responses.md §ETag and Last-Modified"
  - "ITS-REST overview Requests_and_responses.md §Deprecated headers"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]          # the second EHR's content needs its OPT provisioned
  ehr: { commits: none }                      # mints ${ehr_id} with zero commits
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1                                   # a SECOND EHR, so the zero-row answer has something to exclude
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { second_ehr_id: created.ehr_id }
  - step: 2                                   # content in the second EHR — an unscoped answer would carry it
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${second_ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
  - step: 3
    call: execute_ad_hoc_query
    with:
      ehr_id: "${ehr_id}"                     # single-EHR execution context
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e CONTAINS COMPOSITION c
      fetch: 100                              # fetch always explicit
    expect: ok                                # the binding's ETag matcher is the pin under test
    assert:
      - assert: result_set
        match: count
        count: 0
