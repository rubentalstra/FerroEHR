# Re-adjudicated 2026-07-21 from the retired ECC dialect-adjudicated
# rejections against AQL 1.1 spec text. These constructs are OUTSIDE the AQL
# 1.1 language (TIMEWINDOW was removed at Release 1.0.1, SPECQUERY-20; the
# grammar orders orderByClause before limitClause) — but no spec clause
# forbids a server accepting a dialect superset, so per AMB-30 this case is
# report_only: the verdict is reported per SUT and never gates.
id: I_QUERY_SERVICE.execute_ad_hoc_query-dialect_extensions
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  Constructs outside the AQL 1.1 language (removed clauses, non-grammar
  clause order) are rejected rather than silently executed — reported per
  SUT; rejection is not spec-mandated (AMB-30).
description: "AQL dialect/superset constructs — rejection reported, never gating"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §grammar"
  - "QUERY AQL §Amendment Record (SPECQUERY-20: TIMEWINDOW removed at Release 1.0.1)"
  - "QUERY AQL §ORDER BY, §LIMIT (orderByClause precedes limitClause)"
  - "ITS-REST query §400_Query"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
parameters:
  iteration: reset_per_row
  fixture_set:
    - { data_set: cnf.aql.invalid.timewindow, expected: invalid_query, defect: "TIMEWINDOW clause removed from AQL at Release 1.0.1 (SPECQUERY-20); absent from the AQL 1.1 grammar" }
    - { data_set: cnf.aql.invalid.limit_before_order_by, expected: invalid_query, defect: "LIMIT precedes ORDER BY; the AQL 1.1 grammar orders orderByClause before limitClause" }
requires:
  server: any
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: "${ds:fixture}"
      fetch: 100                            # AMB-6: fetch always explicit
    expect: "${fixture.expected}"
ambiguities: [AMB-6, AMB-30]
