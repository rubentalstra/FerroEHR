# Re-adjudicated 2026-07-21 from the retired ECC AQL case ECC-QRY-014
# (advanced-order-by-limit) and the (corrected) ORDER-BY-with-LIMIT intent of the
# dialect goldens against AQL 1.1 spec text. AQL master03 §ORDER BY + §LIMIT: a
# query ordering the rows totally (by the distinct systolic magnitudes) then
# bounding with LIMIT returns exactly the top N in that order. Exceeds AQL basic
# (ORDER BY + LIMIT), so this carries AqlAdvanced (OPTIONS) — the profile
# capability the master11 spine otherwise leaves unevidenced. `ecc-` id namespace
# pending upstream adoption.
id: I_QUERY_SERVICE.execute_ad_hoc_query-order_by_limit
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlAdvanced]
profiles: [OPTIONS]
test_purpose: >-
  An ORDER BY … DESC LIMIT 3 query over the loaded compositions returns the three
  highest-magnitude compositions, projected by uid, in descending-magnitude
  order, as a bounded RESULT_SET.
description: "AQL ORDER BY + LIMIT returns the ordered, bounded top-N"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §ORDER BY, §LIMIT"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        ORDER BY o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude DESC
        LIMIT 3
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: ordered                      # distinct systolic magnitudes totally order the rows
        rows: { from: "${ds:cnf.set.query-bp-10#top3_systolic_desc_uids}" }
        columns: [{ name: uid }]
