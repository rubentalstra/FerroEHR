# Node predicates on a DATA path, at the two forms QUERY AQL master03-syntax
# §Node predicate defines over an at-code plus a name criterion, and at the
# equivalence the section itself states between them: `[at0002, 'real name
# value']` is "a shortcut of a `name/value` criterion" whose "corresponding
# standard predicate would be `[archetype_node_id=at0002 and name/value='real
# name value']`". Both spellings must therefore select the same rows, and the
# name half must genuinely bite — otherwise the shortcut is being dropped.
#
# The names come from the recipe contract's OBSERVATION shape
# (corpus/recipes/query_bp.md): at0004 is named "Systolic" and carries
# 100+10k mmHg, at0005 is named "Diastolic" and carries 60+5k mmHg. So the
# same at-code paired with the WRONG sibling name selects nothing (step 2),
# and the two ELEMENTs are told apart by their own predicates (steps 1 and 4:
# systolic >= 140 is k=4..9, diastolic >= 80 is k=4..9 as well, but read from
# the other ELEMENT).
#
# NOT covered here: the §Node predicate name TERM-CODE form
# (`[at0002, snomed_ct(3.1)::313267000]`). Its canonical expansion compares
# `name/defining_code/code_string` and `name/defining_code/terminology_id/value`,
# and the committed corpus names are plain DV_TEXT, so every term-code
# predicate over it answers zero rows whether or not an engine decomposes the
# lexeme — an assertion a defective engine passes for free. Proving that form
# needs corpus data with DV_CODED_TEXT node names.
id: I_QUERY_SERVICE.execute_ad_hoc_query-node_predicate_paths
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A node predicate on a data path constrains both the archetype_node_id and
  the node name, and the comma name shortcut selects exactly the same rows as
  the standard predicate it abbreviates.
description: "AQL node predicates on data paths: at-code, comma name shortcut, and their equivalence"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Node predicate"
  - "QUERY AQL master03-syntax §Identified Paths"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: systolic at0004 "Systolic" 100..190, diastolic at0005 "Diastolic" 60..105
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0004, 'Systolic']/value/magnitude >= 140
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 6 }    # the comma name shortcut on the at0004 ELEMENT: 140..190
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0004, 'Diastolic']/value/magnitude >= 140
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # the name half bites: at0004 is not named "Diastolic"
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0004 and name/value='Systolic']/value/magnitude >= 140
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 6 }    # the long form the shortcut abbreviates — same rows as step 1
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0005, 'Diastolic']/value/magnitude >= 80
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 6 }    # the sibling ELEMENT, addressed by its own at-code + name: 80..105
postconditions:
  - assert: state
    text: >-
      A node predicate constrains the archetype_node_id AND the node name, and
      the comma shortcut is equivalent to the standard predicate the section
      expands it to.
