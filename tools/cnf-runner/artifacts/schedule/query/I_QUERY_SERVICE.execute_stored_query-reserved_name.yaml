# The RESERVED query-name is never resolvable as a stored query: executing
# `org.openehr::aql` is 404, whatever namespace precedes it.
#
# Ground. docs/query/Qualified_query_name.md defines the identifier —
# "Usually a `qualified_query_name` has a format of `[{namespace}::]{query-name}`"
# — and reserves one value of its second part: "> NOTE: The `query-name` value
# must not be `aql` (case-insensitive), as that is a reserved name." A name that
# must not be stored can never name a stored query, so the read side has nothing
# to resolve; docs/overview/Requests_and_responses.md §"HTTP status codes", row
# `404 Not Found`, assigns the answer: "The origin service did not find the
# target resource or is not willing to disclose that one exists". Register
# AMB-102's fixed handling states the same reading explicitly (an unmatchable
# name IS a target that does not exist, "covering malformed versions,
# out-of-class names, and the reserved name alike").
#
# The namespaced form is the interesting one: `aql` alone is the ad-hoc route
# (§"Ad-hoc queries" — the `Execute ad-hoc AQL` operation endpoint), so only a
# qualified spelling reaches the stored-execution route with the reserved
# query-name in it. The store side of the same rule is gated separately by
# I_DEFINITION_QUERY.store_query-reserved_name.
id: I_QUERY_SERVICE.execute_stored_query-reserved_name
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  Executing a stored query whose query-name is the reserved value `aql` is not
  found — the reserved name can never identify a stored definition.
description: "Stored-query execution under the reserved query-name `aql` is not found"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "ITS-REST query Qualified_query_name.md §NOTE (reserved name)"
  - "ITS-REST query Query_types.md §Ad-hoc queries"
  - "ITS-REST overview Requests_and_responses.md §HTTP status codes"
applies: { rm: ">=1.0.2", aql: ">=1.1", its_rest: ">=1.1.0" }   # the reserved `aql` query-name resolution arrived in Release-1.1.0 — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-46)
ambiguities: [AMB-102]
requires:
  server: any
flow:
  - step: 1
    call: execute_stored_query
    with:
      qualified_query_name: "org.openehr::aql"   # reserved query-name behind a namespace
      fetch: 100                                 # fetch always explicit
    expect: not_found
