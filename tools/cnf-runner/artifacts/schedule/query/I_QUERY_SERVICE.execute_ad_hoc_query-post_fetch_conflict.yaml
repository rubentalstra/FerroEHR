# The DISAGREEING half of the URL/body paging duality: `fetch` carried in BOTH
# the query string and the request body with DIFFERENT values is refused, never
# silently resolved to one of them.
#
# Ground. The two forms both exist for POST: docs/query/Request.md §"Common
# Headers and Query Parameters" opens "All query execution requests SHOULD
# support at least the following parameters" and lists `fetch` among them,
# drawing no GET/POST distinction, while §"GET vs POST" gives the body form ("a
# mostly self-documented AQL query in a request body"), whose paging members
# register AMB-99 records first-hand. No released sentence assigns precedence
# when a value is carried in both places; AMB-99's fixed handling is that the
# two must AGREE — equal values accepted, a disagreement refused — on
# docs/overview/Requests_and_responses.md §"HTTP status codes", row 400: "The
# service cannot or will not process the request due to something that is
# perceived to be a client error (e.g., malformed request syntax,
# syntactically invalid content)", with the clause below the table ("used when
# no other `4xx` error code is appropriate").
#
# The ACCEPTED half is the sibling -post_fetch_url_and_body, so a red row names
# which arm of the duality broke. The two `fetch` values below differ and are
# both individually legal window sizes over the ten committed compositions, so
# nothing but the disagreement can explain a refusal.
#
# The outcome kind is `bad_request`, added by the 2026-07-28 schedule release
# (#544); before it the closed taxonomy had no kind for a self-contradictory
# REQUEST (`invalid_query` means malformed AQL, which this is not;
# `validation_failed` means semantically invalid CONTENT), which is why the
# behaviour was carried as the `query-post-paging-parameter-conflict` ledger
# exception.
id: I_QUERY_SERVICE.execute_ad_hoc_query-post_fetch_conflict
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [QueryApi]
profiles: [STANDARD]
ambiguities: [AMB-99]
test_purpose: >-
  A POST ad-hoc execution carrying DIFFERENT `fetch` values in the URL and in
  the body is refused as a client error rather than windowed to either value.
description: "POST ad-hoc AQL with disagreeing URL and body fetch values"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "ITS-REST query Request.md §GET vs POST"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", aql: ">=1.1", its_rest: ">=1.1.0" }
guards:
  - "No released sentence assigns precedence when the same paging parameter is carried in the URL and in the body — ITS-REST query Request.md §Common Headers and Query Parameters offers the URL forms and §GET vs POST the body form, and neither legislates the collision; the refusal rests on the AMB-99 adjudication, so a server that honoured one place over the other breaches no quoted rule"
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                      # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]               # generated: 10 BP compositions
flow:
  - step: 1
    call: execute_ad_hoc_query
    variant: post_fetch_url                   # the variant that offers both slots
    with:
      ehr_id: "${ehr_id}"
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e CONTAINS COMPOSITION c
      url_fetch: 4                            # the URL form
      fetch: 8                                # the body form — a DIFFERENT value
    expect: bad_request                       # §HTTP status codes row 400 (register AMB-99)
