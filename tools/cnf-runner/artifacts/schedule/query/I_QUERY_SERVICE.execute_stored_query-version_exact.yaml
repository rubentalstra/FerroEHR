# An EXACT three-part version selector executes that version, not the latest.
#
# Ground (ITS-REST docs text, the released oracle).
# docs/query/Qualified_query_name.md: "Stored queries are identified by their
# name, used as `qualified_query_name`, and an optional `version` number", and
# "The `version` identifier is in the format specified by SEMVER style (i.e.
# `major.minor.patch`)". An exact `major.minor.patch` selector names one stored
# definition; the prefix rule in the next sentence applies only "When only a
# partial `version` pattern is supplied", so an exact selector never falls
# through to the latest.
#
# HOW THE EXECUTED VERSION IS OBSERVED. The RESULT_SET carries no version field
# (register AMB-103: "the flattened wire descriptor loses
# version/formalism/registration_time — the EXECUTED STORED VERSION IS
# UNOBSERVABLE on the wire"), so the two stored definitions are made
# distinguishable by their own AQL: each projects the same column under a
# DIFFERENT `AS` alias, and the alias surfaces as the RESULT_SET column name
# (docs/query/Response.md §"RESULT_SET response"). A server that executed 1.2.0
# for an exact 1.0.0 selector answers the wrong column name.
id: I_QUERY_SERVICE.execute_stored_query-version_exact
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_stored_query
capabilities: [QueryApi]
profiles: [STANDARD]
test_purpose: >-
  A stored query addressed by an exact `major.minor.patch` selector executes
  that version's definition even when a higher version of the same name exists.
description: "Stored-query execution at an exact SEMVER version selector"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_stored_query"
  - "SM openehr_platform §I_DEFINITION_QUERY.store_query"
  - "ITS-REST query Qualified_query_name.md §version identifier"
  - "ITS-REST query Response.md §RESULT_SET response"
  - "QUERY AQL §SELECT, §FROM, §CONTAINS"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                      # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]               # generated: 10 BP compositions
flow:
  - step: 1
    call: I_DEFINITION_QUERY.store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_exact"
      version: "1.0.0"
      query: "SELECT c/uid/value AS v_1_0_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 2
    call: I_DEFINITION_QUERY.store_query
    variant: version
    with:
      qualified_query_name: "org.openehr.cnf::version_exact"
      version: "1.2.0"
      query: "SELECT c/uid/value AS v_1_2_0 FROM EHR e CONTAINS COMPOSITION c"
    expect: stored
  - step: 3
    call: execute_stored_query
    variant: version                          # GET /query/{name}/1.0.0
    with:
      qualified_query_name: "org.openehr.cnf::version_exact"
      version: "1.0.0"
      ehr_id: "${ehr_id}"                     # single-EHR execution context
      fetch: 100                              # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: set                            # no ORDER BY: bag equality (QUERY master03 §ORDER BY)
        rows: { from: "${ds:cnf.set.query-bp-10#all_uids_asc}" }
        columns: [{ name: v_1_0_0 }]          # the 1.0.0 definition's alias — the executed version
