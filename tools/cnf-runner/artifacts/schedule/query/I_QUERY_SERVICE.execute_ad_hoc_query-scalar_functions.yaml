# One representative single-row function from each of the three families QUERY
# AQL master03-syntax §Functions defines ("single-row functions, returning a
# single result for every row of the result set"), each used where §Identified
# expression admits it: "left-hand operand: an identified path or a FUNCTION
# having an identified path as an argument".
#
# STRING — §SUBSTRING: "SUBSTRING(expression, position, length) extracts the
# substring from expression argument, starting at the position-th character,
# and optionally stopping after a given length characters … The position of the
# first character (start) of a string is considered position `1`." The corpus
# OBSERVATION name is the constant "Blood pressure"
# (corpus/recipes/query_bp.md), so 1-based indexing puts "Blood" at (1,5) and
# "pressure" at (7,8) — a 0-based reading yields " pressur" at (7,8) and fails
# step 2, and a substring-SEARCH reading passes step 3 where positional
# extraction must not.
#
# NUMERIC — §ABS: "returns the absolute value of given expression argument …
# The result type is derived from the argument type." The committed systolic
# magnitudes are whole and positive, so ABS is value-preserving over them: the
# assertion pins that the function is accepted, typed numerically and evaluated
# per row (the >= 140 boundary is the same six rows the bare path selects), not
# that it flips a sign. Proving the sign flip needs corpus data with negative
# numeric leaves, which the RM ranges of this template do not carry.
#
# DATE/TIME — §CURRENT_DATE_TIME or NOW: "The function with syntax
# CURRENT_DATE_TIME(), or NOW(), accepts no arguments and returns the current
# datetime". The committed event times are 2026-01-01T00..09:00:00Z (recipe
# contract), which lie before any moment a run can occur, so the comparison and
# its complement are total: 10 and 0, whenever the suite is executed.
id: I_QUERY_SERVICE.execute_ad_hoc_query-scalar_functions
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlBasic]
profiles: [STANDARD]
test_purpose: >-
  A string, a numeric and a date/time single-row function are evaluated per row
  as the left-hand operand of a WHERE comparison, with the positions, types and
  values the function definitions state.
description: "AQL single-row functions: SUBSTRING, ABS and NOW() in WHERE comparisons"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL master03-syntax §Functions, §String functions, §SUBSTRING"
  - "QUERY AQL master03-syntax §Numeric functions, §ABS"
  - "QUERY AQL master03-syntax §Date and time functions, §CURRENT_DATE_TIME or NOW"
  - "QUERY AQL master03-syntax §Identified expression"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                    # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]             # generated: OBSERVATION name "Blood pressure", systolic 100..190, times 2026-01-01T00..09Z
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE SUBSTRING(o/name/value, 1, 5) = 'Blood'
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # position 1, length 5 of "Blood pressure"
  - step: 2
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE SUBSTRING(o/name/value, 7, 8) = 'pressure'
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # the first character is position 1, not 0
  - step: 3
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE SUBSTRING(o/name/value, 1, 5) = 'press'
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # extraction at a position, never a substring search
  - step: 4
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        CONTAINS OBSERVATION o [openEHR-EHR-OBSERVATION.blood_pressure.v2]
        WHERE ABS(o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude) >= 140
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 6 }    # numeric function as the left operand: 140..190
  - step: 5
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/context/start_time/value < NOW()
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 10 }   # every committed event time precedes the moment of execution
  - step: 6
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        WHERE c/context/start_time/value > NOW()
      fetch: 100
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 0 }    # the complement of step 5
postconditions:
  - assert: state
    text: >-
      Single-row functions are evaluated for every candidate row and their
      results feed the comparison, with SUBSTRING positions 1-based and NOW()
      resolving to the moment of execution.
