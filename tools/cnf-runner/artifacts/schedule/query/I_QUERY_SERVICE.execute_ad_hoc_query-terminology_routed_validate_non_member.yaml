# The negative half of the Boolean TERMINOLOGY() usage form (QUERY AQL
# master03-syntax §TERMINOLOGY, third usage: "as a Boolean value expression,
# when an assertion is being tested"). §TERMINOLOGY describes `validate` as
# "Validate a code in a value set; this will check if a given code belongs to a
# value set", so a code the value set does NOT contain makes the assertion
# false and the WHERE clause selects nothing.
#
# This is the case that makes its member twin meaningful. The two queries
# differ in exactly one character position — the `code=` argument — and the
# seeded value set contains one of the two codes and excludes the other, while
# the CODE SYSTEM defines BOTH. So a server that shortcut the terminology call
# (always true, always false, or "the code exists") gets one of the pair wrong.
id: I_QUERY_SERVICE.execute_ad_hoc_query-terminology_routed_validate_non_member
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlTerminology]
profiles: [OPTIONS]
test_purpose: >-
  A Boolean TERMINOLOGY('validate', …) assertion over a code the bound value
  set does NOT contain is false, so the WHERE clause selects no rows.
description: "AQL Boolean TERMINOLOGY('validate', …) resolves false for a non-member code"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "QUERY AQL §TERMINOLOGY"
  - "ITS-REST query §200_Query (RESULT_SET)"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  ehr: { commits: none }                    # mints ${ehr_id}
  terminology:
    served:
      - "http://cnf.example.test/fhir/CodeSystem/sct-shaped"
      - "http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders"
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT e/ehr_id/value AS ehr_id
        FROM EHR e[ehr_id/value='${ehr_id}']
        WHERE TERMINOLOGY('validate', 'hl7.org/fhir/4.0',
        'system=http://cnf.example.test/fhir/CodeSystem/sct-shaped&url=http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders&code=1000003') = true
      fetch: 100                            # fetch always explicit
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 0                            # 1000003 is defined by the code system, excluded by the value set
