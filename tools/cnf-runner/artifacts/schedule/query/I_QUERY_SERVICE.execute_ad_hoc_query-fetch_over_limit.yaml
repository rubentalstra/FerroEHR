# REST paging COMPOSES OVER an in-query AQL LIMIT: the AQL clause shapes the
# logical result, then `fetch` windows it.
#
# Ground, and the honest limit of it. The one released exclusion clause on
# `fetch` targets the DEPRECATED TOP only — docs/query/Request.md §"Common
# Headers and Query Parameters": "`fetch` - used for paging: the number of rows
# to fetch (i.e. limit); default depends on the implementation, but cannot be
# combined with AQL-top" (that prohibition is gated by
# I_QUERY_SERVICE.execute_ad_hoc_query-fetch_with_top). LIMIT — TOP's
# replacement, QUERY AQL master03-syntax.adoc §LIMIT — is named by no exclusion
# and by no composition rule either: the released text simply does not say
# whether REST paging overrides, composes with, or conflicts against
# LIMIT/OFFSET. That silence is adjudicated in register AMB-98, whose fixed
# handling is COMPOSITION — the AQL LIMIT/OFFSET shape the logical result set,
# then offset/fetch window it — and which is reported upstream as UPR-62.
#
# LIMIT 3 over ten committed compositions leaves three logical rows; `fetch: 1`
# windows that to one. The three candidate readings separate cleanly: composition
# answers 1, "REST paging overrides LIMIT" answers 1 as well only by accident of
# fetch < limit — so the discriminating failure is the opposite pair: a server
# that IGNORED fetch answers 3, and one that rejected the combination answers no
# rows at all.
id: I_QUERY_SERVICE.execute_ad_hoc_query-fetch_over_limit
kind: functional
component: QUERY
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
capabilities: [AqlAdvanced]
exercises: [QueryApi]
profiles: [OPTIONS]
test_purpose: >-
  A query whose AQL carries LIMIT 3, executed with fetch=1, returns exactly one
  row — the REST window applies over the AQL-limited result set.
description: "REST fetch composes over an in-query AQL LIMIT"
spec_refs:
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "ITS-REST query Request.md §Common Headers and Query Parameters"
  - "QUERY AQL §LIMIT"
  - "ITS-REST query Response.md §RESULT_SET response"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
ambiguities: [AMB-98]
requires:
  server: any
  templates: [cnf.opt.blood_pressure]
  ehr: { commits: none }                      # mints ${ehr_id}
  commit: [cnf.set.query-bp-10]               # generated: 10 BP compositions
flow:
  - step: 1
    call: execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
        ORDER BY c/uid/value ASC
        LIMIT 3
      fetch: 1                                # the REST window over the AQL-limited set
    expect: ok
    assert:
      - assert: result_set
        match: count
        count: 1
