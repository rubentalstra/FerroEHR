# SMART on openEHR — the master08 resource-scope grammar, PERMITTING side.
#
# WHAT THIS CASE IS. Each row presents a Bearer access token whose `scope`
# claim is one row of the master08 resource-scope grammar, and asserts that the
# operation the scope names succeeds. The operation under test is the ADL 1.4
# template list — the `template-` resource noun read at the only depth that
# needs no provisioning, so a row's verdict localizes to the scope string and
# nothing else.
#
# HOW THE TOKEN EXISTS AT ALL. The CDR is a SMART *resource server*: it
# validates presented access tokens and never issues them (ITS-REST
# docs/smart_app_launch/master06-authentication.adoc §Supported Authentication
# Flows; token issuance belongs to the Authorization Server, master02
# §Glossary). The conformance stack runs no Authorization Server, so the runner
# signs each row's token itself against the static test issuer the party
# declares in `ixit.smart` and the deployment trusts. A party that declares no
# `smart` lane records this case not-applicable with that citation (ISO/IEC
# 9646 test selection) instead of driving a scope-less request and calling the
# result a scope verdict.
#
# THE GRAMMAR ROWS AND THEIR GROUND — master08-scopes.adoc §Resource Scopes:
# the syntax is `<compartment>/<resource>.<permission>`; the compartments are
# `patient` / `user` ("acting on behalf of a logged-in user … subject to the
# user's security profile") / `system` ("server-to-server integrations …
# Grants access across all data"); `template-<templateId>` is one of the three
# supported resource types ("Access to operational templates matching
# `<templateId>` expression"); the pattern table's `*` row reads "All available
# templates or queries"; and the permission list assigns "`r` - Read". The
# maximal table then names both compartment rows this case uses —
# `user/template-<templateId>.crud` ("Create and manage templates accessible to
# the user") and `system/template-<templateId>.crud` ("Full system-wide
# template management"). A tail carrying several letters grants each of them,
# so a `.cruds` tail includes the Read this operation needs.
#
# THE IDENTITY-SCOPE ROW. §Scopes lists three purposes for scopes and makes
# `openid` an *Identity Claim*, not a resource grant, so presenting it beside a
# resource scope must neither widen nor narrow the resource decision. The row
# asserts exactly that: same outcome, extra identity scope.
#
# WHAT IS NOT ASSERTED. No row asserts a *body* — the operation's own response
# shape is the concern of the definition-chapter cases, and asserting it here
# would make a scope verdict depend on template provisioning. An empty template
# list is a perfectly good 200: the question this case asks is whether the
# scope opened the door.
id: SMART-RESOURCE_SCOPES-granted_scope_permits
kind: functional
component: SECURITY
sm_operation: I_DEFINITION_ADL14.list_opts
capabilities: [SmartAppLaunch]
profiles: [OPTIONS]
test_purpose: >-
  A Bearer token whose scope claim grants the operation under the master08
  resource-scope grammar reaches that operation: each granted compartment,
  pattern and permission-letter combination the specification names for the
  template resource permits the template read.
description: "Granted SMART resource scopes permit the operation they name"
spec_refs:
  - "ITS-REST smart_app_launch master08-scopes.adoc §Resource Scopes"
  - "ITS-REST smart_app_launch master08-scopes.adoc §Scopes"
  - "ITS-REST smart_app_launch master06-authentication.adoc §Supported Authentication Flows"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEFINITION_ADL14.list_opts"
applies: { its_rest: ">=1.1.0" }
guards:
  - "applies only to a deployment running the CDR's SMART resource-server role — the specification is config-gated and DEVELOPMENT-state (ITS-REST docs/smart_app_launch/manifest_vars.adoc `:spec_status: DEVELOPMENT`); the party declares the role by declaring an ixit `smart` lane"
formats: [canonical-json]
requires:
  server: any
ambiguities: [AMB-150, AMB-151]
parameters:
  iteration: single_pass
  matrix:
    # One row = one `scope` claim (space-delimited per RFC 6749 §3.3, which
    # master08 §Scopes cites as the transport of scopes).
    columns: [scope]
    rows:
      - ["user/template-*.r"]              # user compartment, `*` pattern row, `r` = Read
      - ["system/template-*.cruds"]        # system compartment, multi-letter tail containing `r`
      - ["user/template-*.r openid"]       # an Identity Claim alongside the resource grant changes nothing
flow:
  - step: 1
    call: list_opts
    on: smart_app                          # the minted-token principal — ixit `smart` lane
    scopes: ["${row.scope}"]
    expect: ok
postconditions:
  - assert: state
    text: >-
      Every scope string the master08 grammar defines as granting read access
      to the template resource does grant it, so a SMART Application holding
      the scope it was issued can use the operation the scope names.
