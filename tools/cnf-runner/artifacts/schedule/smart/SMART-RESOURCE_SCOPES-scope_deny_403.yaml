# SMART on openEHR — the scope-deny discipline: 403, and SMART only narrows.
#
# WHAT THIS CASE IS. The mirror of the granting case: each row presents a
# Bearer token the RBAC layer accepts (it carries the deployment's clinical
# role) whose SMART `scope` claim does NOT grant the operation, and asserts the
# request is refused with the authenticated-but-unauthorized status. The
# principal is otherwise identical to the granting case's, so a row's verdict
# localizes to the scope string: whatever is refused here is refused *by the
# scope*, not by authentication or by RBAC.
#
# THE STATUS AND ITS GROUND. master08 states the obligation and assigns no
# status — §Scopes ¶2: "The _Platform_ must validate requested scopes against
# the _Application_ registration metadata, applicable access control policies,
# the authenticated user's permissions." The released overview assigns it:
# specifications/docs/overview/Requests_and_responses.md §"Authentication and
# authorization", "If authentication and authorization are required, services
# MUST properly use the `WWW-Authenticate` and/or `Proxy-Authenticate` response
# headers, returning `403 Forbidden`, `401 Unauthorized` or `407 Proxy
# Authentication` as applicable", with §"HTTP status codes" defining 403 as
# "The service understood the request but refuses to authorize it" — which is
# precisely an authenticated caller whose grant does not cover the request.
# Register AMB-150(4) carries that adjudication.
#
# ROW 1 IS MODE-INDEPENDENT. `user/template-*.cud` is a granted scope of the
# operation's own resource family whose permission tail simply does not contain
# the letter this operation needs: master08 §Resource Scopes assigns "`r` -
# Read", and the request is a read. A grant that names create/update/delete on
# templates does not name reading them, so the refusal follows from the grammar
# alone, whatever else the deployment is configured to do.
#
# ROWS 2-4 REST ON THE ADVERTISED CAPABILITY. They present a token holding no
# scope of the operation's resource family at all — a resource scope of a
# different family, only Identity Claims, and no scope claim whatever. Whether
# the absence of a grant is a refusal or a deferral is a deployment posture,
# and master04 §Capabilities is where a Platform declares it: the
# `openehr-permission-v1` capability "Indicates support for fine-grained
# <<_resource_scopes,scopes>> and authorization scheme over openEHR
# resources". A Platform advertising it — as this lane's SUT does, which
# SMART-DISCOVERY-document_shape reads off the wire — has declared that its
# scope layer decides these requests, so an ungranted family is a refusal.
# Registers AMB-150 and AMB-151 carry the adjudication.
#
# SMART ONLY NARROWS. Every row is a request the SAME principal completes in
# SMART-RESOURCE_SCOPES-granted_scope_permits with a granting scope, so the
# pair together shows the scope layer composing as an AND onto the
# authentication and RBAC layers rather than replacing either: no scope string
# grants what the base layers refuse, and a non-granting one takes access away.
id: SMART-RESOURCE_SCOPES-scope_deny_403
kind: functional
component: SECURITY
sm_operation: I_DEFINITION_ADL14.list_opts
capabilities: [SmartAppLaunch]
profiles: [OPTIONS]
test_purpose: >-
  An authenticated Bearer caller whose SMART scopes do not grant the operation
  is refused with 403 Forbidden — whether the granted scope of that resource
  family carries the wrong permission letter, or no scope of that family is
  granted at all on a Platform advertising openehr-permission-v1.
description: "SMART scopes that do not grant the operation are refused 403"
spec_refs:
  - "ITS-REST smart_app_launch master08-scopes.adoc §Scopes"
  - "ITS-REST smart_app_launch master08-scopes.adoc §Resource Scopes"
  - "ITS-REST smart_app_launch master04-service_discovery.adoc §Capabilities"
  - "ITS-REST overview Requests_and_responses §Authentication and authorization"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_DEFINITION_ADL14.list_opts"
applies: { its_rest: ">=1.1.0" }
guards:
  - "applies only to a deployment running the CDR's SMART resource-server role — the specification is config-gated and DEVELOPMENT-state (ITS-REST docs/smart_app_launch/manifest_vars.adoc `:spec_status: DEVELOPMENT`); the party declares the role by declaring an ixit `smart` lane"
  - "rows 2-4 apply only to a Platform advertising the `openehr-permission-v1` capability (ITS-REST docs/smart_app_launch/master04-service_discovery.adoc §Capabilities), the declaration that its scope layer decides an ungranted resource family"
formats: [canonical-json]
requires:
  server: any
ambiguities: [AMB-150, AMB-151]
parameters:
  iteration: single_pass
  matrix:
    # One row = one `scope` claim (space-delimited per RFC 6749 §3.3).
    columns: [scope]
    rows:
      - ["user/template-*.cud"]            # right family + pattern, no `r` — master08 §Resource Scopes permission list
      - ["system/composition-*.cruds"]     # a resource scope of a different family
      - ["openid profile"]                 # Identity Claims only — no resource scope at all
      - [""]                               # no scope claim whatever
flow:
  - step: 1
    call: list_opts
    on: smart_app                          # the minted-token principal — ixit `smart` lane
    scopes: ["${row.scope}"]
    expect: forbidden                      # universal 403 (selectors.yaml universal_outcomes, route-table-wide)
postconditions:
  - assert: state
    verified_by: SMART-RESOURCE_SCOPES-granted_scope_permits   # the mirror case: grant-permits and deny-refuses are one law's two halves
    text: >-
      A SMART Application is held to exactly the grant it presents: a scope
      naming other permissions, another resource family, or nothing at all
      does not reach the operation, and the refusal is the base
      specification's 403 rather than a SMART-specific code.
