# SMART on openEHR — the Platform's service-discovery document.
#
# ANCHOR: `I_ITS_REST_SMART.discovery` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the SM models no Platform component
# (the Platform is "a software ecosystem comprising at minimum an Authorization
# Server, an openEHR Clinical Data Repository (CDR), and a FHIR Server",
# ITS-REST docs/smart_app_launch/master02-overview.adoc §Glossary). It is
# pinned in NON_SM_REST_OPERATIONS (tools/cnf-runner/src/validate.rs), the
# ITS-side half of the Axis-1 enumeration domain, so it carries the same
# coverage obligation as an SM operation.
#
# COMPONENT: `SECURITY` — the case-core component axis is the CNF Platform Test
# Schedule's chapter taxonomy, which has no SMART chapter; the discovery
# document is the deployment's authentication/authorization metadata, so the
# Security family is the closest legal token. Taxonomy only: the runner reads
# `component` for no functional purpose outside PERFORMANCE.
#
# TOPOLOGY: master04 §Service Discovery serves the document "relative to the
# _Platform_ base URL" — NOT the openEHR REST base every other case addresses.
# The party declares that base as an ixit instance and names it in
# `ixit.smart.platform_instance`; this case addresses it with `on:`. A party
# whose ixit declares no `smart` lane records the case not-applicable with that
# citation (ISO/IEC 9646 test selection) rather than driving a surface a
# non-SMART deployment deliberately does not serve.
#
# WHAT IS ASSERTED, and only that: the three CDR-side obligations master04
# actually states. The document answers 200 as `application/json`; its
# `services` map carries `org.openehr.rest` (§Services: "At a minimum, the
# `services` section must include the openEHR REST API using the key
# `org.openehr.rest`") whose `baseUrl` is an ABSOLUTE URL (§Services:
# "`baseUrl`: Absolute URL to the root of the API `*(required)*`" — asserted as
# an http(s) scheme prefix, which is what "absolute" means and all the text
# constrains); and `capabilities` is an array value (§Capabilities: "The
# `capabilities` section advertises supported SMART features as an array
# value"). Nothing else: the OAuth2/OIDC member requiredness is delegated to
# OIDC Discovery / the HL7 SMART metadata (§Authentication Endpoints — the
# B-2 boundary of register AMB-151, and the section names the WRONG well-known
# document, register AMB-146), the status code and caching posture are
# unstated (register AMB-149), and `org.fhir.rest` is `*(recommended)*`, never
# required. Asserting a member the release only recommends — or one whose
# presence we observed on this SUT — would exceed the specification.
id: SMART-DISCOVERY-document_shape
kind: functional
component: SECURITY
sm_operation: I_ITS_REST_SMART.discovery
capabilities: [SmartAppLaunch]
profiles: [OPTIONS]
test_purpose: >-
  A SMART-enabled Platform serves /.well-known/smart-configuration relative to
  its base URL as application/json, advertising the required org.openehr.rest
  service with an absolute baseUrl and an array of SMART capabilities.
description: "SMART discovery document: application/json, required org.openehr.rest service, absolute baseUrl"
spec_refs:
  - "ITS-REST smart_app_launch master04-service_discovery.adoc §Service Discovery"
  - "ITS-REST smart_app_launch master04-service_discovery.adoc §Services"
  - "ITS-REST smart_app_launch master04-service_discovery.adoc §Capabilities"
  - "ITS-REST smart_app_launch master02-overview.adoc §Glossary"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { its_rest: ">=1.1.0" }
guards:
  - "applies only to a deployment running the CDR's SMART resource-server role — the specification is config-gated and DEVELOPMENT-state (ITS-REST docs/smart_app_launch/manifest_vars.adoc `:spec_status: DEVELOPMENT`); the party declares the role by declaring an ixit `smart` lane"
formats: [canonical-json]
requires:
  server: any
ambiguities: [AMB-146, AMB-149, AMB-151, AMB-161]
flow:
  - step: 1
    call: discovery
    on: smart_platform                # the PLATFORM base URL — master04 §Service Discovery
    expect: ok
    assert:
      # §Services: the openEHR REST API entry is the one REQUIRED service.
      - { assert: field, path: "services/org.openehr.rest", exists: true }
      # §Services: "`baseUrl`: Absolute URL to the root of the API *(required)*".
      - { assert: field, path: "services/org.openehr.rest/baseUrl", matches: "^https?://" }
      # §Capabilities: "advertises supported SMART features as an array value".
      - { assert: field, path: "capabilities[0]", exists: true }
postconditions:
  - assert: state
    text: >-
      The Platform advertises its openEHR REST API at an absolute base URL in a
      JSON discovery document served from the Platform base URL, so a SMART
      Application can discover the CDR without out-of-band configuration.
