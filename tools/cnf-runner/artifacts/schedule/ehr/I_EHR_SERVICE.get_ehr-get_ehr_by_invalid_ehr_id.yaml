# Official master06 case — retrieving a non-existent EHR by ehr_id fails.
# "A random ehr_id" is a fixed arbitrary UUID literal absent on an empty server
#.
id: I_EHR_SERVICE.get_ehr-get_ehr_by_invalid_ehr_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.get_ehr
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  get_ehr on an ehr_id that does not exist is rejected as not found.
description: "Get non existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.get_ehr"
  - "CNF platform_test_schedule master06 §get_ehr-get_ehr_by_invalid_ehr_id"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
flow:
  - step: 1
    call: get_ehr
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: not_found                    # negative: "EHR with <ehr_id> does not exist"
