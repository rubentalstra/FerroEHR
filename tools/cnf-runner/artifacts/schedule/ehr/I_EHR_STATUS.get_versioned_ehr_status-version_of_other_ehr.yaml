# A version_uid that is perfectly well-formed AND really exists — but in
# ANOTHER EHR's versioned EHR_STATUS — is not reachable through this EHR's
# route. The version container is per-EHR, so the addressed version is simply
# not a member of it.
#
# RM ehr ehr.adoc types EHR.ehr_status as the EHR's own VERSIONED_EHR_STATUS,
# and RM common versioned_object.adoc guards the accessor with
# `Pre: has_version_id (a_version_uid)` — a uid from a different container
# fails that precondition. ITS-REST overview Requests_and_responses.md §HTTP
# status codes assigns the state its row: "404 | Not Found | The origin
# service did not find the target resource or is not willing to disclose that
# one exists".
#
# This is the isolation half of the by-version read that a random-uid 404
# cannot prove: the uid here is a real, live identifier, so a server that
# resolved version ids globally instead of within the addressed EHR would
# answer 200 and leak another EHR's status.
id: I_EHR_STATUS.get_versioned_ehr_status-version_of_other_ehr
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  A live EHR_STATUS version_uid belonging to a different EHR is not served
  through this EHR's versioned_ehr_status route.
description: "Get EHR_STATUS VERSION addressed by another EHR's version_uid"
spec_refs:
  - "RM ehr §EHR (ehr_status: VERSIONED_EHR_STATUS of this EHR)"
  - "RM common §versioned_object (version_with_id / has_version_id)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_STATUS.get_versioned_ehr_status"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id} — EHR A, the addressed EHR
flow:
  - step: 1                              # EHR B, the owner of the uid under test
    call: I_EHR_SERVICE.create_ehr
    expect: created
    capture: { ehr_b: created.ehr_id }
  - step: 2
    call: get_ehr_status
    with: { ehr_id: "${ehr_b}" }
    expect: ok
    capture: { ehr_b_status_version_uid: ok.status_version_uid }
  - step: 3                              # EHR B's version uid, addressed under EHR A
    call: get_versioned_ehr_status
    variant: version
    with: { ehr_id: "${ehr_id}", version_uid: "${ehr_b_status_version_uid}" }
    expect: not_found
