# The fifth EHR_STATUS field-level setter, which had no case at all: SM
# i_ehr_status.adoc §update_other_details — "Update other_details part of
# `EHR_STATUS` with new content", taking (an_ehr_id, a_details: ITEM_TREE).
#
# Like its four is_queryable/is_modifiable siblings it has no field-level
# endpoint; the whole-status PUT is its realization (the binding carries the
# read-modify-write and the ITEM_TREE payload). The case therefore anchors on
# the SM operation itself, which now has its own realized its-rest binding —
# the reason its `sm_operations` exception in vocab/wire_surface.yaml is gone.
#
# What is under test is the ROUND TRIP, because that is what the SM meaning
# promises: after the update the stored EHR_STATUS must carry the new content.
# A server that accepted the PUT and dropped `other_details` (it is the one
# EHR_STATUS attribute with no flag semantics and no invariant forcing it to
# persist) would answer 200 and still be wrong — step 3 is what catches that.
#
# The read-back is a plain get_ehr_status, so the assertion is on the stored
# resource rather than on the update's own echo: RM ehr ehr_status.adoc
# §Attributes types other_details as an ITEM_STRUCTURE, and the ELEMENT value
# planted by the binding is addressed through it.
#
# Step 2's 200 body / ETag discipline is the binding's; this case adds nothing
# to it, so a red row here means the round trip, not the envelope.
id: I_EHR_STATUS.update_other_details-round_trip
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.update_other_details
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  Updating an EHR_STATUS with new other_details content commits a version and
  the stored status carries that content afterwards.
description: "Update EHR_STATUS other_details and read it back"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.update_other_details"
  - "RM ehr §EHR_STATUS (other_details: ITEM_STRUCTURE)"
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "ITS-REST overview Resources.md §JSON Format"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 carries no other_details
flow:
  - step: 1
    call: get_ehr_status                 # the payload the PUT modifies (the read-modify-write realization)
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2
    call: update_other_details
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3                              # "with new content" — the content must be there afterwards
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "other_details/_type", equals: "ITEM_TREE" }
      - { assert: field, path: "other_details/items[0]/value/value", equals: "cnf other_details round-trip" }
postconditions:
  - assert: state
    text: >-
      EHR_STATUS.other_details for the EHR holds the ITEM_TREE the update
      supplied (verified by step 3)
