# The lost-update guard on the EHR_STATUS whole-resource PUT: an If-Match
# naming a version that is no longer current is refused, and the refusal tells
# the client which version IS current.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "If a service receives this header,
# and the condition evaluates to `false`, it MUST NOT perform the requested
# method. Instead, it MUST respond with HTTP status code `412 Precondition
# Failed`, and SHOULD return also latest `version_uid` in the `ETag` response
# headers."
#
# The staleness is manufactured, not assumed: step 1 reads v1's uid, step 2
# commits v2 with it, and step 3 re-offers the SAME v1 uid — now superseded.
# The binding's `ETag: latest-version-uid` matcher compares the returned
# entity tag against the version step 2 actually created (RM common master06
# §change_control fixes that uid as an OBJECT_VERSION_ID; BASE master05
# §Composite Identifiers and Case makes the comparison case-insensitive).
#
# MUST NOT perform: step 4 reads the status back and finds the v2 state
# (is_queryable = false) intact — the refused PUT did not slip its
# is_queryable = true through.
id: I_EHR_STATUS.set_ehr_queryable-stale_if_match
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_queryable
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  An EHR_STATUS update whose If-Match names a superseded version is refused
  with a precondition failure that carries the latest version uid, and the
  stored status is left unchanged.
description: "Update EHR_STATUS with a stale If-Match precondition"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_queryable"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_queryable = true
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2                              # v2 — this is what makes the step-1 uid stale
    call: clear_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3                              # the SAME (now superseded) uid offered as the precondition
    call: set_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: precondition_failed
  - step: 4                              # "it MUST NOT perform the requested method"
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "is_queryable", equals: false }
postconditions:
  - assert: state
    text: >-
      The refused update committed no version: EHR_STATUS.is_queryable is
      still the value the last accepted update left (verified by step 4)
