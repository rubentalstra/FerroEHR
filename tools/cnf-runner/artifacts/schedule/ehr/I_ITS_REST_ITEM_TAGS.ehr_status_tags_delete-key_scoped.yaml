# The EHR_STATUS tag DELETE is KEY-scoped, not collection-scoped: it removes
# the tags under the addressed key and leaves the rest of the collection
# intact.
#
# GROUND: the route itself carries the key — DELETE
# /ehr/{ehr_id}/ehr_status/{uid_based_id}/tags/{key} — and the released
# description says "Deletes the ITEM_TAG resource(s) identified by `tag_key`"
# (ITS-REST operations/ehr_status_tags_delete.yaml; the parameter is spelled
# `{key}` in the path and "tag_key" in the prose — the naming mismatch is
# registered in AMB-97 and does not affect the wire). The success code is
# responses/204_deleted.yaml, "`204 No Content` is returned when the resource
# identified by the request parameters has been (logically) deleted", whose
# body floor is the status table's 204 row: "there is no additional content to
# send in the response payload body".
#
# WHY THE EHR_STATUS SEAM GETS ITS OWN CASE: the EHR-side pair
# (/composition and /ehr_status) are two distinct route families with distinct
# target-kind guards, and the released files are separate operations, so the
# key-scoped delete driven on COMPOSITION
# (I_ITS_REST_ITEM_TAGS.composition_tags_delete-key_scoped) does not exercise
# this one. This case retires the last EHR_STATUS coverage_gap rows in
# vocab/wire_surface.yaml.
#
# ADDRESSING: the version form. The EHR_STATUS container uid is not disclosed
# by any released read that this flow performs, while the status VERSION uid
# is the read's own weak ETag — so the collection addressed here is the
# version's, which is one of the two the released dual-form `uid_based_id`
# admits.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.ehr_status_tags_delete-key_scoped
kind: functional
component: EHR
sm_operation: I_ITS_REST_ITEM_TAGS.ehr_status_tags_delete
capabilities: [ItemTags]
exercises: [EhrApi, EhrStatus]
profiles: [OPTIONS]
test_purpose: >-
  Deleting one tag key from an EHR_STATUS version's collection removes only
  that key's tags and leaves the others readable.
description: "EHR_STATUS tag DELETE is key-scoped"
spec_refs:
  - "ITS-REST ehr_status_tags_delete.yaml §description"
  - "ITS-REST ehr_status_tags_update.yaml §description"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common master07-tags.adoc §Semantics"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }
flow:
  - step: 1                                       # the status VERSION uid, from the read's ETag
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture:
      status_version_uid: ok.status_version_uid
  - step: 2
    call: I_ITS_REST_ITEM_TAGS.ehr_status_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${status_version_uid}"
      tags:
        - { key: "alpha", value: "a" }
        - { key: "beta", value: "b" }
    expect: updated
  - step: 3
    call: ehr_status_tags_delete
    with: { ehr_id: "${ehr_id}", uid_based_id: "${status_version_uid}", key: "alpha" }
    expect: deleted
  - step: 4
    call: I_ITS_REST_ITEM_TAGS.ehr_status_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${status_version_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "beta" }
      - { assert: field, path: "[1]", absent: true }
