# Committing a new version of a tagged COMPOSITION moves no tag: the
# CONTAINER's collection is untouched, the tag on version 1 stays on version 1,
# and version 2 starts with none.
#
# THE GROUND, and exactly how far it reaches. `ITEM_TAG.target` is
# `UID_BASED_ID[1..1]` — "Identifier of target, which may be a
# `VERSIONED_OBJECT<T>` or a `VERSION<T>`" (RM
# UML/classes/org.openehr.rm.common.item_tag.adoc §Attributes) — so a tag has
# exactly ONE target and the two arities name different things: the container
# that outlives its versions, or one immutable version. The released reads are
# defined against that target: composition_tags_get.yaml retrieves "the list of
# all ITEM_TAG resources associated with a given target COMPOSITION version or
# VERSIONED_COMPOSITION identified by `uid_based_id`", the two forms being
# used "to get the tags of a particular (target) version" versus "the tags of
# the target VERSIONED_COMPOSITION container". A commit creates a new VERSION;
# it does not rename the VERSIONED_COMPOSITION and it does not rewrite any
# tag's `target`, so each of the three reads below is answered by the released
# definition alone.
#
# WHAT MAKES THE REWRITE FORBIDDEN rather than merely unmentioned: RM ehr
# master04-ehr_package.adoc §Tags — tags "have no direct association with the
# objects they annotate", "they do not constitute part of the content they
# annotate", "they do not cause re-versioning of the content", and "a distinct
# tag instance is used to represent each use of the tag ... If one is modified
# or deleted, it has no effect on the others". A commit that migrated a tag
# from version 1 to version 2 would be modifying a tag instance as a side
# effect of a content commit, which is exactly the association those sentences
# deny.
#
# THE RECORDED SILENCE: register AMB-97 notes that "nothing states tag
# persistence across new target versions, container-tag reach, or cascade on
# target deletion" — i.e. no released sentence spells the supersession case
# out in so many words. This case does not fill that silence with a choice; it
# asserts the CONSEQUENCE of the 1..1 target plus the no-association rule,
# which is the only reading under which all three reads above stay answerable
# by the released operation descriptions.
#
# ONE BEHAVIOUR: the three reads are one statement — supersession does not
# move tags — and they must be asserted together, because any two of them pass
# under a wrong migration rule that the third catches.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_get-supersession_does_not_move_tags
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_get
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-97]
test_purpose: >-
  After a COMPOSITION is superseded, the container's tag survives, the tag
  written against the previous version is still served under that version, and
  the new version carries no tag.
description: "COMPOSITION tags survive supersession without migrating"
spec_refs:
  - "RM item_tag.adoc §Attributes"
  - "RM ehr master04-ehr_package §Tags"
  - "RM common master07-tags.adoc §Semantics"
  - "ITS-REST composition_tags_get.yaml §description"
  - "ITS-REST composition_tags_update.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1, cnf.composition.minimal_event.v2]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      v1_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # a CONTAINER-addressed tag
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "container-scope", value: "c" }
    expect: updated
  - step: 3                                       # a VERSION-addressed tag on version 1
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${v1_uid}"
      tags:
        - { key: "version-scope", value: "v1" }
    expect: updated
  - step: 4                                       # supersede the tagged content
    call: I_EHR_COMPOSITION.update_composition
    with:
      ehr_id: "${ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v2}"
      versioned_object_uid: "${versioned_object_uid}"
      preceding_version_uid: "${v1_uid}"
    expect: updated
    capture: { v2_uid: updated.version_uid }
  - step: 5                                       # the container tag survived the new version
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "container-scope" }
      - { assert: field, path: "[1]", absent: true }
  - step: 6                                       # the version tag is still on version 1
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${v1_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "version-scope" }
      - { assert: field, path: "[0]/value", equals: "v1" }
      - { assert: field, path: "[1]", absent: true }
  - step: 7                                       # and version 2 was never tagged
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${v2_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
