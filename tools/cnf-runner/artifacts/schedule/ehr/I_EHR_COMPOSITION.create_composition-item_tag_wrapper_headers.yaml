# The two ITEM_TAG wrapper headers on ONE change-controlled write land in TWO
# DISTINCT collections: `openehr-item-tag` on the VERSIONED_OBJECT,
# `openehr-version-item-tag` on the committed VERSION.
#
# THE LAW — ITS-REST overview Requests_and_responses.md §openehr-item-tag and
# openehr-version-item-tag, the docs text: "`openehr-item-tag` applies to
# *VERSIONED_OBJECT* targets"; "`openehr-version-item-tag` applies to a
# specific target *VERSION* within a VERSIONED_OBJECT"; and §Usage in Requests:
# "When used as request headers for creation or update operations (`PUT`,
# `POST`), the header instructs the system which ITEM_TAG list should be
# associated with the target VERSION or VERSIONED_OBJECT resource (depending on
# the header name)." Two named targets, therefore two collections — the same
# split RM common item_tag.adoc §Attributes makes on `target` ("may be a
# `VERSIONED_OBJECT<T>` or a `VERSION<T>`").
#
# WHY THE PROOF IS THE READ-BACK AND NOT THE ECHO: §Usage in Responses makes
# the echo a MAY ("Servers MAY include the `openehr-item-tag` or
# `openehr-version-item-tag` header in responses to confirm the actual list of
# ITEM_TAGs stored on the server side"), and the closed header-matcher
# vocabulary has no conditional-value form, so the binding declares the echo
# `present?` and asserts nothing about it (register AMB-166 adjudicates the
# conflict with the operation file's "will return", in favour of the docs
# text). What the echo would CONFIRM — the stored list of each target — is
# asserted directly, by reading each collection through its own tag route. The
# single-member expectation on each read is what refutes a merged collection.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_EHR_COMPOSITION.create_composition-item_tag_wrapper_headers
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-166]
test_purpose: >-
  A COMPOSITION commit carrying both wrapper headers stores each header's tags
  against its own target: the container collection and the version collection
  hold exactly their own tag.
description: "Wrapper headers on a COMPOSITION commit land in distinct collections"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST composition_create.yaml §description"
  - "RM item_tag.adoc §Attributes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    variant: item_tag_headers                     # sends openehr-item-tag + openehr-version-item-tag
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # openehr-item-tag -> the VERSIONED_OBJECT collection
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "category" }
      - { assert: field, path: "[0]/value", equals: "final" }
      - { assert: field, path: "[1]", absent: true }
  - step: 3                                       # openehr-version-item-tag -> the VERSION collection
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${version_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "reviewed" }
      - { assert: field, path: "[0]/value", equals: "true" }
      - { assert: field, path: "[1]", absent: true }
