# The negative half of the bare-EHR_STATUS by-version read: a well-formed
# OBJECT_VERSION_ID that names no version of this EHR's versioned EHR_STATUS.
#
# The addressed value has the lexical form ITS-REST overview Resources.md
# §Identifier types fixes — "`object_id :: creating_system_id ::
# version_tree_id`" — so the request is not refused for shape; it is refused
# because RM common versioned_object.adoc's `Pre: has_version_id
# (a_version_uid)` is false. ITS-REST overview Requests_and_responses.md §HTTP
# status codes assigns that state its row: "404 | Not Found | The origin
# service did not find the target resource or is not willing to disclose that
# one exists".
id: I_EHR_STATUS.get_ehr_status_at_version-unknown_version
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_ehr_status_at_version
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  get_ehr_status_at_version for a well-formed version_uid that names no
  version of this EHR's EHR_STATUS is refused as not found.
description: "Get EHR_STATUS at a version that does not exist"
spec_refs:
  - "ITS-REST overview Resources §Identifier types"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM common §versioned_object (has_version_id)"
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status_at_version"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status_at_version
    with:
      ehr_id: "${ehr_id}"
      version_uid: "11111111-1111-4111-8111-111111111111::cnf.example.org::1"
    expect: not_found
