# The EHR-scoped aggregate reaches a tag placed on a target INSIDE the EHR.
#
# GROUND: ITS-REST operations/ehr_tags_get.yaml — "Retrieves the list of
# ITEM_TAG resources associated with any target VERSION or VERSIONED_OBJECT
# within the EHR identified by `ehr_id`" and "In case no such parameter is
# provided then all ITEM_TAG resources will be retrieved". The RM says the
# same reach from the other side: RM ehr ehr.adoc §Attributes, `tags` —
# "Optional list of tags associated with this EHR. Tag `_target_` values can
# only be within the same EHR".
#
# The three filter parameters are NOT exercised: their semantics are unstated
# on both list routes (register AMB-94), so the unfiltered call — the one the
# release does define — is what is driven.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.ehr_tags_get-ehr_wide_listing
kind: functional
component: EHR
sm_operation: I_ITS_REST_ITEM_TAGS.ehr_tags_get
capabilities: [ItemTags]
exercises: [EhrApi]
profiles: [OPTIONS]
ambiguities: [AMB-94]
test_purpose: >-
  The unfiltered EHR-wide tag listing returns a tag associated with a
  COMPOSITION target inside that EHR.
description: "EHR-wide tag listing reaches a COMPOSITION tag"
spec_refs:
  - "ITS-REST ehr_tags_get.yaml §description"
  - "RM ehr.adoc §Attributes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "ward", value: "a3" }
    expect: updated
  - step: 3
    call: ehr_tags_get
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "ward" }
      - { assert: field, path: "[0]/value", equals: "a3" }
      - { assert: field, path: "[1]", absent: true }
