# The canonical-XML REQUEST-payload branch of I_EHR_STATUS.set_ehr_queryable —
# the last format branch of the SM EHR_STATUS setters. The variant-less
# realization builds its PUT body by JSON read-modify-write, so the XML request
# seam is the `xml_body` variant: a case-supplied canonical-XML EHR_STATUS
# (codec-derived corpus fixture) PUT with the current version in If-Match.
#
# WHY THIS ROW IS THE REFUSAL ARM AND NOT THE OFFER ARM (register AMB-167,
# re-adjudicated 2026-07-29). The published XSDs declare no document element
# for EHR_STATUS — the STABLE 1.0.2-nsv1 bundle ships no Ehr.xsd at all, so the
# class has no complexType there either, and the 2.0.0-nsv2 bundle types it as
# a LOCATABLE subtype with no element of its own. A WRITE row must commit to
# one request root element, and ITS-REST overview Resources.md §"XML Format"
# opens with "When resources are serialized in **canonical XML** format, both
# request payloads and responses MUST conform to the [published XSDs]" — a
# payload whose root no published schema declares does not conform, so
# requiring a service to accept it would mark a conformant validating service
# non-conformant. (A READ row escapes this because the SERVER picks the
# document and the row can assert the released conduct — the negotiated
# `Content-Type` and an XML document entity — without naming a root.)
#
# What IS released here is the other half of the same section: "A client MAY
# use the header `Content-Type: application/xml` in the requests to specify the
# XML payload format. If the service cannot process the request payload as XML
# format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
# A party declaring `ehr-status-xml-unsupported` declares exactly the
# antecedent, so the MUST is enforceable against it — and it fires on the MEDIA
# TYPE, before any document is parsed, which is why the row keeps the
# codec-derived fixture: the payload's root name is not part of what is
# asserted, and picking the generic `items`+`xsi:type` spelling instead would
# be the catalogue endorsing a wire form the release withholds.
#
# Steps 1-3 set the observable baseline in canonical JSON (`is_queryable` false),
# so step 5 is the state proof: the refused payload writes it back to true, and
# a still-false flag after the 415 shows the refusal happened before any version
# was committed.
#
# Technology-profile scope: canonical XML is optional support (Resources.md
# §Data representation, "at least one of" the two canonical formats), so the
# case declares the canonical-xml format axis and counts only against a
# statement whose technology profile declares XML.
id: I_EHR_STATUS.set_ehr_queryable-xml_body
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_queryable
capabilities: [EhrStatus]
profiles: [CORE]
option: ehr-status-xml-write-refused     # AMB-167 option_select branch (the refusal arm)
ambiguities: [AMB-167]
test_purpose: >-
  On a service that declares it cannot process canonical-XML request payloads
  for the EHR_STATUS family, set_ehr_queryable refuses an `application/xml`
  EHR_STATUS payload as unsupported media and commits nothing.
description: "set_ehr_queryable refuses a canonical-XML request payload as unsupported media"
spec_refs:
  - "ITS-REST overview Resources §XML Format"
  - "ITS-REST overview Resources §Data representation"
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_queryable"
applies: { rm: ">=1.0.2" }
guards:
  - "Canonical-XML support for this resource family is statement-declared, not spec-mandated — the published XSDs declare no document element for EHR_STATUS and ITS-REST overview Resources.md §Data representation leaves the format to the service, so this row judges only a party that declares it cannot process such a payload (register AMB-167)"
formats: [canonical-xml]
data_sets: [cnf.ehr_status.with_subject.h.xml]
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status                 # current version for the If-Match precondition
    format: canonical-json
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }   # the flip step is the variant-less read-modify-write realization: its binding builds the PUT body from this capture
  - step: 2                              # make the refused transition observable: is_queryable -> false first (JSON read-modify-write sibling)
    call: clear_ehr_queryable
    format: canonical-json
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: get_ehr_status                 # the superseding version uid for the XML PUT's If-Match
    format: canonical-json
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_v2_uid: ok.status_version_uid }
    assert:
      - { assert: field, path: "is_queryable", equals: false }
  - step: 4
    call: set_ehr_queryable
    variant: xml_body                    # the canonical-XML request seam
    format: canonical-xml
    with:
      ehr_id: "${ehr_id}"
      preceding_version_uid: "${status_v2_uid}"
      ehr_status: "${ds:cnf.ehr_status.with_subject.h.xml}"
    expect: unsupported_media            # Resources.md §XML Format 415 MUST
  - step: 5                              # the refusal committed nothing
    call: get_ehr_status
    format: canonical-json
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "is_queryable", equals: false }
postconditions:
  - assert: state
    text: "EHR_STATUS.is_queryable for the EHR with known ehr_id is still false — the canonical-XML payload was refused as unsupported media, not applied"
