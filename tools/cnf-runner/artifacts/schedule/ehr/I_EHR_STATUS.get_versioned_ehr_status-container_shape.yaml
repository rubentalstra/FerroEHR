# The shape of the VERSIONED_EHR_STATUS container itself — the resource the
# /versioned_ehr_status route serves, as distinct from the VERSION envelopes
# it holds.
#
# Three of the four facts are normative RM, quoted from RM common
# UML/classes/org.openehr.rm.common.versioned_object.adoc §Attributes:
#   * the served object is a VERSIONED_EHR_STATUS (ITS-REST overview
#     Resources.md §Resources names it among the "versioned entities:
#     VERSIONED_COMPOSITION, VERSIONED_EHR_STATUS, etc.");
#   * `uid`: HIER_OBJECT_ID — "Unique identifier of this version container in
#     the form of a UID with no extension", so the container id carries NO
#     `::system::n` version coordinate (contrast VERSION.uid, the three-part
#     OBJECT_VERSION_ID of RM common master06 §change_control);
#   * `time_created`: DV_DATE_TIME 1..1 — "Time of initial creation of this
#     versioned object".
#
# The fourth — the WIRE VALUES of `owner_id` — is stated by no released text.
# RM types it OBJECT_REF 1..1 and says only that it refers to "the id of the
# containing EHR or other relevant owning entity"; BASE constrains the
# namespace lexically but assigns no value; the ITS-REST docs text never
# mentions owner_id. Register AMB-69 carries the adjudicated fixed handling
# this case pins: namespace "local", type "EHR", id.value the owning ehr_id.
id: I_EHR_STATUS.get_versioned_ehr_status-container_shape
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-69]
test_purpose: >-
  The VERSIONED_EHR_STATUS container read serves a VERSIONED_EHR_STATUS whose
  uid is an extension-less container id, whose owner_id references the owning
  EHR, and which carries its creation time.
description: "Get VERSIONED_EHR_STATUS container shape"
spec_refs:
  - "RM common §versioned_object (uid / owner_id / time_created)"
  - "RM common §change_control (master06 — the three-part VERSION uid the container uid is NOT)"
  - "ITS-REST overview Resources §Resources"
  - "ITS-REST overview Requests_and_responses §ETag and Last-Modified"
  - "SM openehr_platform §I_EHR_STATUS.get_versioned_ehr_status"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_versioned_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: VERSIONED_EHR_STATUS }
      # "a UID with no extension" — no `::creating_system_id::version_tree_id`
      - { assert: field, path: "uid/value", matches: "^[^:]+$" }
      # AMB-69 fixed handling — the owning EHR, as a local EHR reference
      - { assert: field, path: "owner_id/namespace", equals: "local" }
      - { assert: field, path: "owner_id/type", equals: "EHR" }
      - { assert: field, path: "owner_id/id/value", equals: "${ehr_id}" }
      # "Time of initial creation of this versioned object" (1..1)
      - { assert: field, path: "time_created/value", exists: true }
