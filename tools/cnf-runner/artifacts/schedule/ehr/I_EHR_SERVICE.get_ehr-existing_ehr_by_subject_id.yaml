# Official master06 case — retrieve an existing EHR by subject_id.
# The schedule groups this under I_EHR_SERVICE.get_ehr(), but the subject query
# is realized by the SM operation get_ehrs_for_subject (CNF<->SM naming
# divergence; AMB-14). The
# known subject is provisioned in-flow via the with_subject fixture.
id: I_EHR_SERVICE.get_ehr-existing_ehr_by_subject_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.get_ehrs_for_subject
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  get_ehrs_for_subject on the subject of an existing EHR returns that EHR.
description: "Get existing EHR by subject_id"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.get_ehrs_for_subject"
  - "CNF platform_test_schedule master06 §get_ehr-existing_ehr_by_subject_id"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.ehr_status.with_subject]
flow:
  - step: 1
    call: create_ehr                     # provision the "EHR with a known subject_id" precondition
    with: { ehr_status: "${ds:cnf.ehr_status.with_subject.c}" }
    expect: created
  - step: 2
    call: get_ehrs_for_subject
    with: { subject_id: "cnf-subject-02", subject_namespace: "cnf" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
ambiguities: [AMB-14]
