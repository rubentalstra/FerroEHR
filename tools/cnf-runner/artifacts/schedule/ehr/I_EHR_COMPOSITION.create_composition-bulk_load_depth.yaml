# BULK EHR LOAD — the per-EHR depth half (the sibling of
# I_EHR_SERVICE.create_ehr-bulk_load_population, which covers breadth).
#
# WHAT REALIZES THIS CAPABILITY: see the population sibling's derivation —
# neither the SM Admin chapter (SM openehr_platform
# master15-admin_service.adoc) nor the released ITS-REST admin API defines a
# bulk operation, so the load is the released EHR/COMPOSITION operations
# driven at volume, which is also how this runner seeds its scale corpora.
# A loaded corpus is two-dimensional — a population of EHRs, and content
# DEPTH within each — and the depth axis has its own failure mode: a
# repeated commit into ONE EHR must produce N independent
# VERSIONED_COMPOSITIONs, not overwrite one container, and all N must be
# visible to the query surface afterwards.
#
# THE BEHAVIOUR (one per case): N commits into a single EHR leave N distinct,
# independently addressable versioned objects whose content reads back
# unchanged, and an EHR-scoped AQL CONTAINS COMPOSITION query over that EHR
# returns exactly N rows. Every commit here is a CREATE of a NEW container
# (RM common master06 §The 'Virtual Version Tree': each POST mints its own
# VERSIONED_OBJECT) — the update/version-tree axis belongs to Versioning, not
# to this capability.
#
# The count is asserted through the query surface rather than by counting the
# runner's own captures, because "the loaded corpus is queryable" is the
# property a seeded corpus actually has to have; the per-container reads
# beside it are what make the count a count of the RIGHT rows.
#
# N is deliberately small: this is the FUNCTIONAL catalogue, where the
# property under test is correctness under repetition, not throughput.
id: I_EHR_COMPOSITION.create_composition-bulk_load_depth
kind: functional
component: EHR_COMPOSITION
sm_operation: I_EHR_COMPOSITION.create_composition
capabilities: [BulkEhrLoad]
profiles: [OPTIONS]
test_purpose: >-
  Repeated commits into one EHR leave one distinct VERSIONED_COMPOSITION per
  commit, each retrievable with its committed content, and an EHR-scoped AQL
  query over the loaded EHR returns exactly the loaded number of rows.
description: "Bulk-load four COMPOSITIONs into one EHR and query the loaded set"
spec_refs:
  - "CNF profiles master03-profiles.adoc §Functional (Admin: Bulk EHR load)"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "SM openehr_platform §I_QUERY_SERVICE.execute_ad_hoc_query"
  - "RM common §change_control (VERSIONED_OBJECT, VERSION.uid)"
  - "QUERY AQL §CONTAINS, §Identified Paths"
applies: { rm: ">=1.0.2", aql: ">=1.1" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }                 # mints ${ehr_id} — one fresh, empty EHR
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { load_1_container: created.versioned_object_uid }
  - step: 2
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { load_2_container: created.versioned_object_uid }
  - step: 3
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { load_3_container: created.versioned_object_uid }
  - step: 4
    call: create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture: { load_4_container: created.versioned_object_uid }
  # integrity: every loaded container is independently addressable and serves
  # back the content that was committed into it.
  - step: 5
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${load_1_container}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
  - step: 6
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${load_2_container}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
  - step: 7
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${load_3_container}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
  - step: 8
    call: get_composition_latest
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${load_4_container}" }
    expect: ok
    assert:
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
  # count: the loaded set is visible to the query surface, in full and with
  # nothing extra. The query is EHR-scoped, so the count is a fact about THIS
  # load and not about whatever else the shared SUT holds.
  - step: 9
    call: I_QUERY_SERVICE.execute_ad_hoc_query
    with:
      q: >-
        SELECT c/uid/value AS uid
        FROM EHR e[ehr_id/value='${ehr_id}'] CONTAINS COMPOSITION c
      fetch: 100                          # fetch always explicit
    expect: ok
    assert:
      - { assert: result_set, match: count, count: 4 }
