# The tag DELETE is deliberately NON-IDEMPOTENT at the wire: the second
# identical DELETE answers 404, because after the first one no ITEM_TAG under
# that key exists on the addressed collection.
#
# THE RELEASED TRIGGER SET, verbatim (ITS-REST
# responses/404_unknown_ehr_id_or_uid_based_id_or_key.yaml, referenced by
# operations/composition_tags_delete.yaml): "`404 Not Found` is returned when
# an EHR with `ehr_id` does not exist, or when the `uid_based_id` does not
# exist, or when the ITEM_TAG identified by the `key` does not exist." The
# THIRD trigger is the one this case drives, and it is what makes the repeat
# a miss rather than a second success.
#
# WHY THERE IS NO SURVIVING TAG TO FIND. The 204 text says the resource "has
# been (logically) deleted" — change-control vocabulary the release reuses
# here although an ITEM_TAG is not change-controlled: the RM class carries no
# `lifecycle_state`, no uid and no version at all (RM
# UML/classes/org.openehr.rm.common.item_tag.adoc), and register AMB-97
# records that wording as an editorial defect. With no lifecycle state there is
# no deleted-but-present state a second DELETE could address, so the released
# 404 trigger is the only reading left. The final read confirms it from the
# other side: the collection is empty, not carrying a tombstone.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_delete-second_delete_not_found
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_delete
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-97]
test_purpose: >-
  Deleting the same COMPOSITION tag key twice succeeds once and is not found
  the second time — the deleted tag leaves no addressable remnant.
description: "COMPOSITION tag DELETE repeated on the same key (204 then 404)"
spec_refs:
  - "ITS-REST composition_tags_delete.yaml §description"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM item_tag.adoc §Attributes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "alpha", value: "a" }
    expect: updated
  - step: 3
    call: composition_tags_delete
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}", key: "alpha" }
    expect: deleted
  - step: 4                                       # the third released 404 trigger: the key no longer exists
    call: composition_tags_delete
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}", key: "alpha" }
    expect: not_found
  - step: 5                                       # and nothing remains under it
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
