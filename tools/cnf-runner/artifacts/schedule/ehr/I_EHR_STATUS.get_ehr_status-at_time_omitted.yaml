# The omitted-parameter branch of the at-time EHR_STATUS read: with no
# `version_at_time` the server serves the LATEST version, not the first.
#
# SM i_ehr_status.adoc §get_ehr_status_at_time states the branch outright:
# "Get the version of the EHR Status extant at time `_a_time_`. If no time
# supplied, get the latest."
#
# The proof is a state the two versions do not share, not an identifier: the
# provisioned EHR's first EHR_STATUS carries is_queryable = true (RM ehr
# ehr_status.adoc §Attributes — `is_queryable` 1..1), step 2 commits a second
# version with is_queryable = false, and the parameter-less read in step 3
# must show false. Asserting the served object's own `uid` instead would rest
# on the contained-uid question AMB-65/AMB-67 adjudicate (LOCATABLE.uid is
# 0..1 and no released sentence REQUIRES it populated), which would make this
# branch non-gating; the version identity of a parameter-less read is gated on
# the envelope route instead
# (I_EHR_STATUS.get_versioned_ehr_status-at_time_omitted).
id: I_EHR_STATUS.get_ehr_status-at_time_omitted
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  An EHR_STATUS read that supplies no version_at_time serves the latest
  version of the versioned EHR_STATUS, not the first.
description: "Get EHR_STATUS at time, version_at_time omitted"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status_at_time"
  - "ITS-REST overview Resources §Datetime format"
  - "RM common §versioned_object (VERSIONED_OBJECT.latest_version)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_queryable = true
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2                              # commit v2 with the flag flipped, so the two versions differ observably
    call: clear_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: get_ehr_status
    variant: at_time                     # the at-time route, parameter omitted
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR_STATUS }
      - { assert: field, path: "is_queryable", equals: false }   # the v2 state — "If no time supplied, get the latest"
