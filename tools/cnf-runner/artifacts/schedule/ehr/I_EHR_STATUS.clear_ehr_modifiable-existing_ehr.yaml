# Official master06 case — clear_ehr_modifiable leaves is_modifiable = false.
# ITS-REST has no field-level setter: the SM clear_ehr_modifiable is realized as
# a read-modify-write of the whole EHR_STATUS (step 1 reads the current version
# for If-Match; step 2 PUTs the modified status; step 3 verifies) — see the
# schedule/ehr REQUIREMENTS.md SM-setter divergence and AMB-3 for the
# preceding_version_uid -> If-Match realization.
id: I_EHR_STATUS.clear_ehr_modifiable-existing_ehr
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.clear_ehr_modifiable
capabilities: [EhrStatus]
profiles: [CORE]
test_purpose: >-
  clear_ehr_modifiable on an existing EHR succeeds and its
  EHR_STATUS.is_modifiable is false afterwards.
description: "Clear EHR modifiable of an existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.clear_ehr_modifiable"
  - "CNF platform_test_schedule master06 §clear_ehr_modifiable-existing_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }                  # "An EHR with known ehr_id should exist" — mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status                 # ITS-REST realization: obtain the If-Match precondition
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2
    call: clear_ehr_modifiable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3                              # in-case verification of the postcondition
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "is_modifiable", equals: false }
postconditions:
  - assert: state
    text: "EHR_STATUS.is_modifiable for the EHR with known ehr_id is false"
ambiguities: [AMB-3]
