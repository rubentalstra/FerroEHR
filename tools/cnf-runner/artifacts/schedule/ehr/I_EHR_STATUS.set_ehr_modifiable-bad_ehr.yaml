# Official master06 case — set_ehr_modifiable on a non-existent EHR fails.
# "A random ehr_id" is a fixed arbitrary UUID literal absent on an empty server
# (see the schedule/ehr REQUIREMENTS.md judgment call).
id: I_EHR_STATUS.set_ehr_modifiable-bad_ehr
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_modifiable
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  set_ehr_modifiable on an ehr_id that does not exist is rejected as not found.
description: "Set EHR modifiable of non-existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_modifiable"
  - "CNF platform_test_schedule master06 §set_ehr_modifiable-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
flow:
  - step: 1
    call: set_ehr_modifiable
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: not_found                    # negative: "EHR with <ehr_id> doesn't exist"
ambiguities: [AMB-3, AMB-15]
