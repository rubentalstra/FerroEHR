# An EHR_STATUS tag PUT whose body is not the declared array is a client
# error.
#
# GROUND: the operation's requestBody is `required` and its only content is
# `application/json` bound to an ARRAY of schemas/common/UpdateItemTag.yaml
# (ITS-REST operations/ehr_status_tags_update.yaml). Its released 400 says
# "`400 Bad Request` is returned when the request could not be parsed or is
# invalid (e.g. malformed request URL syntax, missing required header or
# parameter, or syntactically invalid header, parameter or content)"
# (responses/400.yaml). Register AMB-93 splits the body-defect families
# identically on all seven tag PUTs: "syntactic failures (non-array body,
# non-string key, unparseable JSON) stay 400" — this case drives the non-array
# body on the EHR_STATUS seam, which is its own released operation with its own
# route family and target-kind guard, and therefore not covered by the
# COMPOSITION twin
# (I_ITS_REST_ITEM_TAGS.composition_tags_update-non_array_body).
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.ehr_status_tags_update-non_array_body
kind: functional
component: EHR
sm_operation: I_ITS_REST_ITEM_TAGS.ehr_status_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, EhrStatus]
profiles: [OPTIONS]
ambiguities: [AMB-93]
test_purpose: >-
  An EHR_STATUS tag PUT whose body is a JSON object rather than the declared
  array is refused as a client error and stores nothing.
description: "EHR_STATUS tag PUT with a non-array body (400)"
spec_refs:
  - "ITS-REST ehr_status_tags_update.yaml §requestBody"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }
flow:
  - step: 1                                       # the status VERSION uid, from the read's ETag
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture:
      status_version_uid: ok.status_version_uid
  - step: 2
    call: ehr_status_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${status_version_uid}"
      tags: { key: "not-an-array" }               # a JSON object where the release declares an array
    expect: bad_request                           # AMB-93's syntactic half
  - step: 3
    call: I_ITS_REST_ITEM_TAGS.ehr_status_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${status_version_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
