# The EHR_STATUS sibling of the imported-version read: a WHOLE-EHR clone
# (master06 §Copying Case 1 — "an EHR does not exist for the subject", so the
# receiver "creates a new EHR", re-using the source EHR identifier the extract
# names) leaves the clone's EHR_STATUS a version this repository did not
# create, and the released versioned-EHR_STATUS version read must serve it as
# the IMPORTED_VERSION it is.
#
# The same wrapper/wrapped split as the COMPOSITION sibling, on the resource
# whose singleton multiplicity (EHR.ehr_status 1..1, RM ehr master04) makes a
# whole-EHR clone the ONLY receiving situation that can land it: an
# import_ehr_extract of a second status into an existing EHR could only ever be
# refused.
#
# The read is the SUBJECT; the clone is precondition state (`requires.import`
# with no `requires.ehr`), because the import route is an EXTENSION this
# product serves while the read is released wire.
id: I_EHR_STATUS.get_versioned_ehr_status-imported_version
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
capabilities: [Versioning]
exercises: [EhrStatus, EhrExtract]
profiles: [CORE]
ambiguities: [AMB-198]
test_purpose: >-
  The released version read of a cloned EHR's EHR_STATUS serves an
  IMPORTED_VERSION wrapping the received ORIGINAL_VERSION, with the source
  system's committal preserved on the wrapped original.
description: "Get the IMPORTED_VERSION envelope of a cloned EHR's EHR_STATUS version"
spec_refs:
  - "RM common §change_control (master06 §Copying — the IMPORTED_VERSION wrapper; Case 1, the whole-EHR clone)"
  - "RM common UML/classes/org.openehr.rm.common.imported_version.adoc (§Attributes: item only)"
  - "RM ehr §ehr (master04 §EHR Status — EHR.ehr_status 1..1)"
  - "SM openehr_platform §I_EHR_STATUS.get_versioned_ehr_status"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  # master06 §Copying Case 1 — the clone CREATES the EHR, so ${ehr_id} is
  # minted by the import together with the container/version identities
  import:
    extract: cnf.messaging.ehr_extract.imported_status
    container: X_VERSIONED_EHR_STATUS
flow:
  - step: 1
    call: get_versioned_ehr_status
    variant: version
    with:
      ehr_id: "${ehr_id}"
      version_uid: "${imported_version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: IMPORTED_VERSION }
      # AMB-198: uid / lifecycle_state / data are effected functions over item
      - { assert: field, path: "data", absent: true }
      - { assert: field, path: "item/_type", equals: "ORIGINAL_VERSION" }
      - { assert: field, path: "item/uid/value", equals: "${imported_version_uid}" }
      - { assert: field, path: "item/data/_type", equals: "EHR_STATUS" }
      # the wrapped original keeps the source system's act of committal ...
      - { assert: field, path: "item/commit_audit/system_id", equals: "cnf.source.openehr.org" }
      - { assert: field, path: "item/commit_audit/time_committed/value", equals: "2026-07-20T08:15:00Z" }
      # ... while the wrapper carries the local one
      - { assert: field, path: "commit_audit/system_id", equals: "${ixit:system_id}" }
      - { assert: field, path: "commit_audit/time_committed/value", not_equals: "2026-07-20T08:15:00Z" }
