# The canonical-XML REQUEST-payload branch of I_EHR_STATUS.set_ehr_modifiable — the last
# format branch of the SM EHR_STATUS setters (#288 slice 3). The variant-less
# realization builds its PUT body by JSON read-modify-write, so the XML request
# seam is the `xml_body` variant: a case-supplied canonical-XML EHR_STATUS
# (codec-derived corpus fixture) PUT with the current version in If-Match.
#
# Payload branch ground (ITS-REST overview Resources.md §XML Format): "A client
# MAY use the header `Content-Type: application/xml` in the requests to specify
# the XML payload format. If the service cannot process the request payload as
# XML format, it MUST respond with HTTP status code `415 Unsupported Media
# Type`". The format role on a body-carrying request names the REQUEST
# representation; the response is negotiated canonical JSON, which is what lets
# the final step read the status back and prove the XML was UNDERSTOOD: the
# asserted is_modifiable value and the fixture's own subject id can only appear if the
# service parsed the XML payload.
#
# Technology-profile scope: canonical XML is optional support (Resources.md
# §Data representation, "at least one of" the two canonical formats), so the
# case declares the canonical-xml format axis and counts only against a
# statement whose technology profile declares XML.
#
# ENFORCEABILITY — this row is judged only against a statement that DECLARES
# canonical-XML support for the EHR_STATUS family (register AMB-167,
# adjudicated 2026-07-28). ITS-REST overview Resources.md §"Data
# representation" makes the format a service choice ("Services MUST support
# at least one of the openEHR **XML** or **JSON** canonical formats"), and
# the published XSDs declare no document element for EHR_STATUS (the RM
# `EHR_STATUS` complexType is LOCATABLE-derived, so only the generic
# abstract `items` root could carry it, and no released sentence assigns
# that root to this resource).
# The release therefore DECLARES `application/xml` for this resource and
# WITHHOLDS the document it would carry: serving the representation (under a
# root name no released sentence assigns) and refusing it under the §XML
# Format 406 MUST are BOTH conformant. The opposite arm is the mirror case
# I_EHR_STATUS.get_ehr_status-xml_not_acceptable, gated
# on `ehr-status-xml-unsupported`.
id: I_EHR_STATUS.set_ehr_modifiable-xml_body
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_modifiable
capabilities: [EhrStatus]
profiles: [CORE]
option: ehr-status-xml-supported       # AMB-167 option_select branch
ambiguities: [AMB-167]
test_purpose: >-
  set_ehr_modifiable driven by a canonical-XML EHR_STATUS payload is processed as the
  resource it represents: is_modifiable is true afterwards and the payload's
  subject is stored.
description: "set_ehr_modifiable with a canonical-XML request payload"
spec_refs:
  - "ITS-REST overview Resources §XML Format"
  - "ITS-REST overview Resources §Data representation"
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_modifiable"
applies: { rm: ">=1.0.2" }
guards:
  - "Canonical-XML support for this resource family is statement-declared, not spec-mandated — the published XSDs declare no document element for EHR_STATUS and ITS-REST overview Resources.md §Data representation leaves the format to the service, so offering and refusing are both conformant (register AMB-167)"
formats: [canonical-xml]
data_sets: [cnf.ehr_status.with_subject.i.xml]
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status                 # current version for the If-Match precondition
    format: canonical-json
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }   # the flip step is the variant-less read-modify-write realization: its binding builds the PUT body from this capture
  - step: 2                              # make the target transition observable: is_modifiable -> false first (JSON read-modify-write sibling)
    call: clear_ehr_modifiable
    format: canonical-json
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: get_ehr_status                 # the superseding version uid for the XML PUT's If-Match
    format: canonical-json
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_v2_uid: ok.status_version_uid }
    assert:
      - { assert: field, path: "is_modifiable", equals: false }
  - step: 4
    call: set_ehr_modifiable
    variant: xml_body                    # the canonical-XML request seam
    format: canonical-xml
    with:
      ehr_id: "${ehr_id}"
      preceding_version_uid: "${status_v2_uid}"
      ehr_status: "${ds:cnf.ehr_status.with_subject.i.xml}"
    expect: updated
  - step: 5                              # negotiated-JSON read-back proves the XML payload was parsed
    call: get_ehr_status
    format: canonical-json
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "is_modifiable", equals: true }
      - { assert: field, path: "subject/external_ref/id/value", equals: "cnf-subject-08" }
postconditions:
  - assert: state
    text: "EHR_STATUS.is_modifiable for the EHR with known ehr_id is true, set by a canonical-XML payload"
