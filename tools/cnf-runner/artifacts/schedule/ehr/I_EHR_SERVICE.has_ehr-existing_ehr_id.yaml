# Official master06 case — existence check by ehr_id returns positive.
id: I_EHR_SERVICE.has_ehr-existing_ehr_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.has_ehr
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  has_ehr on the ehr_id of an existing EHR reports the EHR exists.
description: "Check has EHR with existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.has_ehr"
  - "CNF platform_test_schedule master06 §has_ehr-existing_ehr_id"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }                  # "An EHR should exist ... with a known ehr_id" — mints ${ehr_id}
flow:
  - step: 1
    call: has_ehr
    with: { ehr_id: "${ehr_id}" }
    expect: ok                           # positive: "the EHR with <ehr_id> exists"
