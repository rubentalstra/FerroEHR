# The client-supplied-id EHR creation as a FIRST-CLASS case: PUT
# /ehr/{ehr_id}, the wire form of the SM operation `create_ehr_with_id`.
#
# Why it needed its own case. The create-with-id path WAS reached at run time
# — I_EHR_SERVICE.create_ehr-main and -same_ehr_twice both carry `ehr_id:
# provided` rows, and the driver auto-selects the `with_ehr_id` variant
# whenever a step binds a non-null ehr_id — but the surface-coverage gate
# resolves a step's binding from its EXPLICIT `variant` only, so the variant's
# branches counted as unexercised and were carried as wire_surface exceptions.
# A first-class case with `variant: with_ehr_id` makes the path visible to the
# gate and, more importantly, asserts the two things the auto-selected rows
# never did: that the created EHR carries the ID THE CLIENT CHOSE, and that
# the duplicate refusal is the one this operation's own precondition names.
#
# Spec grounding, first-hand:
#   SM i_ehr_service.adoc §create_ehr_with_id — "Create a new EHR with a
#   provided EHR id; return the id as a safety check", `Pre_no_duplicate`:
#   `not has_ehr (an_ehr_id)`, `Post_has_ehr`: `has_ehr (Result)`, error
#   `ehr_create_fail_duplicate_id`. The safety-check return and the
#   postcondition are exactly steps 1-2; the precondition is step 3.
#   ITS-REST overview Requests_and_responses.md §HTTP status codes — row 201
#   ("The request has been fulfilled and has resulted in one or more new
#   resources being created") and row 409 ("Indicates that the request could
#   not be processed because it might generate a duplicate or a conflict").
#   RM ehr EHR class — `ehr_id`: "The unique identifier of this EHR", with the
#   NOTE "is is strongly recommended that a UUID always be used for this
#   field"; the id the client provides is that identifier, so the served EHR
#   must echo it rather than mint its own.
#
# The id is the deterministic per-case/per-row value the `provided` matrix
# sentinel mints (pure function of case id + row index), so two runners choose
# the same id and no other case can collide with it.
id: I_EHR_SERVICE.create_ehr-with_ehr_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrOperations]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  Creating an EHR under a client-supplied ehr_id stores it under exactly that
  identifier, and a second creation naming the same identifier is refused as a
  duplicate without disturbing the EHR already there.
description: "Create EHR with a client-supplied ehr_id"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr_with_id"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM ehr §ehr_package (EHR.ehr_id)"
applies: { rm: ">=1.0.2" }
requires: { server: any }
parameters:
  iteration: reset_per_row
  matrix: { columns: [ehr_id], rows: [[provided]] }
flow:
  - step: 1
    call: create_ehr
    variant: with_ehr_id                 # PUT /ehr/{ehr_id}
    format: canonical-json
    with: { ehr_id: "${row.ehr_id}" }
    expect: created
    capture: { new_ehr_id: created.ehr_id }
    assert:
      # "return the id as a safety check" — the response names the client's id
      - { assert: instance_of, rm_type: EHR }
      - { assert: field, path: "ehr_id/value", equals: "${row.ehr_id}" }
  - step: 2
    call: get_ehr                        # Post_has_ehr: has_ehr (Result)
    with: { ehr_id: "${row.ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
      - { assert: field, path: "ehr_id/value", equals: "${row.ehr_id}" }
  - step: 3
    call: create_ehr                     # Pre_no_duplicate: not has_ehr (an_ehr_id)
    variant: with_ehr_id
    with: { ehr_id: "${row.ehr_id}" }
    expect: already_exists
  - step: 4                              # in-case verification of the postcondition
    call: get_ehr
    with: { ehr_id: "${row.ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
      - { assert: field, path: "ehr_id/value", equals: "${new_ehr_id}" }
postconditions:
  - assert: state
    text: >-
      Exactly one EHR exists under the client-supplied ehr_id — the one created
      in step 1, unchanged by the refused duplicate (verified by step 4)
