# The VERSIONED_EHR_STATUS container read for an ehr_id that does not exist.
#
# ITS-REST overview Requests_and_responses.md §HTTP status codes, row 404:
# "The origin service did not find the target resource or is not willing to
# disclose that one exists". The container is addressed only through its EHR,
# so an absent EHR leaves no target resource at all.
#
# "A random ehr_id" is a fixed arbitrary UUID literal, absent on an empty
# server.
id: I_EHR_STATUS.get_versioned_ehr_status-bad_ehr
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
capabilities: [EhrStatus]
profiles: [CORE]
test_purpose: >-
  The VERSIONED_EHR_STATUS container read for an ehr_id that does not exist is
  rejected as not found.
description: "Get VERSIONED_EHR_STATUS of a non-existing EHR"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_STATUS.get_versioned_ehr_status"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # no EHRs, so the literal below cannot resolve
flow:
  - step: 1
    call: get_versioned_ehr_status
    with: { ehr_id: "22222222-2222-4222-8222-222222222222" }
    expect: not_found
