# The committal headers reach the EHR_STATUS commit too, not only the
# COMPOSITION one: a client-supplied change_type and description survive into
# the persisted VERSION's AUDIT_DETAILS.
#
# Decisive docs-text sentences (ITS-REST overview Requests_and_responses.md
# §"openehr-version and openehr-audit-details"):
#   "When it comes to committing content to an openEHR system, for all
#   change-controlled resources (e.g. COMPOSITION, EHR_STATUS, FOLDER, etc.)
#   the services are performing versioning under the hood." — EHR_STATUS is
#   named outright;
#   "Through the `openehr-audit-details` header, clients MAY supply values for
#   the AUDIT_DETAILS attributes `change_type`, `description`, `committer` and
#   `system_id`.";
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime."
#
# 250|amendment| is a legal update code of the openEHR audit_change_type group
# alongside the 251|modification| an update would otherwise default to (RM
# common master06 §Contributions; TERM group audit_change_type), so the
# supplied value is a legal DIVERGENCE from the default — which is what makes
# the merge observable rather than a coincidence.
#
# The read-back is the envelope route, whose ORIGINAL_VERSION carries
# commit_audit directly (RM common master06 §change_control).
id: I_EHR_STATUS.set_ehr_queryable-audit_change_type
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_queryable
capabilities: [EhrStatus]
exercises: [Versioning, ChangeSets]
profiles: [CORE]
test_purpose: >-
  Client-supplied AUDIT_DETAILS change_type and description on an EHR_STATUS
  update are merged into the committed VERSION's commit_audit instead of being
  overwritten by the operation defaults.
description: "Update EHR_STATUS with client-supplied committal audit details"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM common §change_control (AUDIT_DETAILS.change_type; audit_change_type group)"
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_queryable"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2
    call: set_ehr_queryable
    variant: audit_change_type           # pins the openehr-audit-details request header
    with:
      ehr_id: "${ehr_id}"
      preceding_version_uid: "${status_version_uid}"
      audit_change_type: "250"
      audit_description: "EHR_STATUS queryable flag reviewed"
    expect: updated
    capture: { v2_uid: updated.status_version_uid }
  - step: 3
    call: get_versioned_ehr_status
    variant: version
    with: { ehr_id: "${ehr_id}", version_uid: "${v2_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "commit_audit/change_type/defining_code/code_string", equals: "250" }
      - { assert: field, path: "commit_audit/description/value", equals: "EHR_STATUS queryable flag reviewed" }
