# Official master06 case — a second EHR for the same subject is rejected.
# Both creates commit the same subject (the with_subject fixture, external_ref
# id "cnf-subject-01" / namespace "cnf") without a client ehr_id.
id: I_EHR_SERVICE.create_ehr-two_ehrs_same_patient
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  A subject may have at most one EHR: creating a second EHR for a subject that
  already has one is rejected.
description: "Create two EHRs for the same patient"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
  - "CNF platform_test_schedule master06 §create_ehr-two_ehrs_same_patient"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.ehr_status.with_subject]
flow:
  - step: 1
    call: create_ehr                     # VALID data set, provided subject, no ehr_id
    with: { ehr_status: "${ds:cnf.ehr_status.with_subject.b}" }
    expect: created
    capture: { first_ehr_id: created.ehr_id }
  - step: 2
    call: create_ehr                     # same data set (same subject) again
    with: { ehr_status: "${ds:cnf.ehr_status.with_subject.b}" }
    expect: already_exists               # negative: EHR already exists for the provided subject
  - step: 3                              # in-case verification of the postcondition
    call: has_ehr_for_subject
    with: { subject_id: "cnf-subject-01", subject_namespace: "cnf" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
postconditions:
  - assert: state
    text: >-
      Exactly one EHR exists for the subject — the one created in step 1
      (verified by step 3 retrieving it by subject)
