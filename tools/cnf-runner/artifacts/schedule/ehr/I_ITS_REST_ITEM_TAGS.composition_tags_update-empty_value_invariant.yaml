# An ITEM_TAG whose `value` is present but EMPTY is semantically invalid, not
# syntactically malformed: the PUT is refused 422 and the collection is
# unchanged.
#
# THE INVARIANT, verbatim (RM
# UML/classes/org.openehr.rm.common.item_tag.adoc §Invariants):
# "__Inv_value_valid__: `value /= Void implies not value.is_empty`" — a tag
# either carries no value at all (`value: String[0..1]`) or carries a
# non-empty one; `""` is neither.
#
# WHY 422 AND NOT THE DECLARED 400. The body satisfies the released write
# schema in full: schemas/common/UpdateItemTag.yaml requires `key` only,
# types `value` as a string, and forbids undeclared members — a JSON array of
# one object with a string `key` and a string `value` is exactly what it
# admits, so nothing here "could not be parsed or is invalid ... syntactically
# invalid ... content" (responses/400.yaml). What fails is the RM meaning of
# the parsed content, which the DOCS TEXT has a row for —
# Requests_and_responses.md §"HTTP status codes", `422 Unprocessable Entity`:
# "The request was well-formed but was unable to be followed due to semantic
# errors". The released tag PUTs declare 200/204/400/404 and not 422, which is
# the silence register AMB-93 fixes: "RM-invariant violations answer 422;
# syntactic failures (non-array body, non-string key, unparseable JSON) stay
# 400. Applied identically on all seven tag PUTs." This case is the semantic
# half; I_ITS_REST_ITEM_TAGS.composition_tags_update-non_array_body is the
# syntactic half on the same seam.
#
# WHY THE EMPTY VALUE AND NOT AN EMPTY/PADDED KEY: `Inv_key_valid` reads "not
# key.is_empty and key.is_justified", and `is_justified` is defined nowhere in
# the released BASE String class, so only its first conjunct is enforceable as
# written. `Inv_value_valid` has no such defect and is the invariant this case
# drives.
#
# THE FINAL READ is the substance of the refusal: a rejected PUT must leave
# the addressed collection exactly as it was, because a full-collection
# replace that half-applied would have destroyed the prior tag.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-empty_value_invariant
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-93]
test_purpose: >-
  A COMPOSITION tag PUT carrying a present-but-empty `value` violates
  ITEM_TAG.Inv_value_valid and is refused as semantically invalid, leaving the
  existing collection intact.
description: "COMPOSITION tag PUT with an empty value (422)"
spec_refs:
  - "RM item_tag.adoc §Invariants"
  - "RM common master07-tags.adoc §Semantics"
  - "ITS-REST composition_tags_update.yaml §requestBody"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # a valid collection to be preserved
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "alpha", value: "a" }
    expect: updated
  - step: 3
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "beta", value: "" }              # present and empty — Inv_value_valid
    expect: validation_failed
  - step: 4                                       # the refused replace changed nothing
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "alpha" }
      - { assert: field, path: "[1]", absent: true }
