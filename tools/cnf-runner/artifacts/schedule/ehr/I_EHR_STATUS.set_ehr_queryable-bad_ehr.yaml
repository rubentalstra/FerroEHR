# Official master06 case — set_ehr_queryable on a non-existent EHR fails.
# "A random ehr_id" is a fixed arbitrary UUID literal absent on an empty server
# (see the schedule/ehr REQUIREMENTS.md judgment call).
id: I_EHR_STATUS.set_ehr_queryable-bad_ehr
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_queryable
capabilities: [EhrStatus]
profiles: [CORE]
test_purpose: >-
  set_ehr_queryable on an ehr_id that does not exist is rejected as not found.
description: "Set EHR queryable of non existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_queryable"
  - "CNF platform_test_schedule master06 §set_ehr_queryable-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
flow:
  - step: 1
    call: set_ehr_queryable
    with: { ehr_id: "11111111-1111-4111-8111-111111111111", preceding_version_uid: "11111111-1111-4111-8111-111111111111::cnf.fake::1" }   # wire-required If-Match value; the negative is the unknown ehr
    expect: not_found                    # negative: "EHR with <ehr_id> doesn't exist"
ambiguities: [AMB-3, AMB-15]
