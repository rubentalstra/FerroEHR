# A VERSION-addressed ITEM_TAG carries `target` as the bare OBJECT_VERSION_ID of
# the addressed VERSION — the other half of the one RM shape rule, on the same
# class.
#
# THE LAW: RM common item_tag.adoc §Attributes, `target`: `1..1 UID_BASED_ID`,
# "Identifier of target, which may be a `VERSIONED_OBJECT<T>` or a
# `VERSION<T>`" — the VERSION case is the OBJECT_VERSION_ID form, which
# ITS-REST names as the request addressing too ("an OBJECT_VERSION_ID
# identifier taken from VERSION.uid.value (i.e. a `version_uid`) … used to get
# the tags of a particular (target) version",
# operations/composition_tags_get.yaml). NO released example anywhere shows a
# VERSION-targeted tag (register AMB-97 records that gap), so the shape is read
# off the RM class, which is the source that types the attribute.
#
# `target/id` ABSENT is again the discriminator against an OBJECT_REF wrapper.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_get-version_target_shape
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_get
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
test_purpose: >-
  A VERSION-addressed COMPOSITION tag serves target as the bare
  OBJECT_VERSION_ID of the addressed version, with no OBJECT_REF wrapper.
description: "COMPOSITION version tag: target is a bare OBJECT_VERSION_ID"
spec_refs:
  - "RM item_tag.adoc §Attributes"
  - "RM common master07-tags.adoc §Class Descriptions"
  - "ITS-REST composition_tags_get.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
  - step: 2
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${version_uid}"
      tags:
        - { key: "shape" }
    expect: updated
  - step: 3
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${version_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/target/value", equals: "${version_uid}" }
      - { assert: field, path: "[0]/target/id", absent: true }
