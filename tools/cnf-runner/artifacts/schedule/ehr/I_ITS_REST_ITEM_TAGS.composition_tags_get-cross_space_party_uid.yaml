# The CROSS-SPACE direction of the route-kind rule: a demographic party's
# container uid presented on a COMPOSITION tag route is a miss.
#
# GROUND: RM common master06-change_control_package.adoc §Typing makes a version
# container single-typed ("all versions in a given `VERSIONED_OBJECT` are of the
# same type, such as `COMPOSITION`, `FOLDER`, or `PARTY`"), and RM demographic
# master02 §Versioning Semantics adds "Every Party is stored in its own Version
# container" — so no VERSIONED_COMPOSITION carries that uid. On top of the
# typing, the EHR side has a containment rule the demographic side lacks: RM
# ehr ehr.adoc §Attributes, `tags` — "Tag `_target_` values can only be within
# the same EHR" — and a party is not in any EHR. The released 404 covers it
# verbatim: "returned when an EHR with `ehr_id` does not exist, or when the
# `uid_based_id` does not exist"
# (ITS-REST responses/404_unknown_ehr_id_or_uid_based_id.yaml). Register AMB-91
# adjudicates the cross-space direction explicitly.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_get-cross_space_party_uid
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_get
capabilities: [ItemTags]
exercises: [EhrApi, DemographicApi]
profiles: [OPTIONS]
ambiguities: [AMB-91]
guards:
  - "DEMOGRAPHIC API is DEVELOPMENT-stage in ITS-REST 1.1.0 — CNF profiles (Demographic Persistence, OPTIONS); ITS-REST demographic (DEVELOPMENT lifecycle)"
  - "authored from the released ITEM_TAG operation files + RM common master07-tags.adoc; CNF master10 (DEMOGRAPHIC) is a stalled schedule stub — a coverage guide only, not the authority"
test_purpose: >-
  A demographic party's container uid presented on the COMPOSITION tag route is
  a miss, and the party's own tag route still answers.
description: "COMPOSITION tag route rejects a demographic uid (404)"
spec_refs:
  - "RM common §change_control (master06 §Typing)"
  - "RM demographic master02 §Versioning Semantics"
  - "RM ehr.adoc §Attributes"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST composition_tags_get.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }
data_sets: [cnf.demographic.person.v1]
flow:
  - step: 1
    call: I_DEMOGRAPHIC_SERVICE.create_party
    with: { party: "${ds:cnf.demographic.person.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: not_found
  - step: 3                                       # the party's own tag route is unaffected
    call: I_ITS_REST_ITEM_TAGS.person_tags_get
    with: { uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
