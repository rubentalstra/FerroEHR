# A container-addressed ITEM_TAG carries `target` as the BARE RM UID_BASED_ID —
# the HIER_OBJECT_ID of the VERSIONED_COMPOSITION — never an OBJECT_REF wrapper.
#
# THE LAW: RM common item_tag.adoc §Attributes types ITEM_TAG.target `1..1
# UID_BASED_ID` ("Identifier of target, which may be a `VERSIONED_OBJECT<T>` or
# a `VERSION<T>`"), and types the sibling `owner_id` `1..1 OBJECT_REF`
# ("Identifier of owner object, such as EHR"). The two are DIFFERENT BASE
# classes, so the served shapes differ: a UID_BASED_ID is an identifier with a
# `value`, an OBJECT_REF is a triple of `id`/`namespace`/`type`. The released
# OAS ItemTag schema types `target` as an OBJECT_REF-shaped
# `UObjectRefOfUidBasedId` and its ItemTagOfComposition example writes
# `target: {id: …, namespace: local, type: COMPOSITION}` — a released
# OAS-vs-RM divergence in which the RELEASED RM wins (the ITS-REST OAS is the
# subordinate source and cannot re-type an RM attribute).
#
# The discriminating assertion is `target/id` ABSENT: an OBJECT_REF wrapper
# necessarily carries `id`, a bare UID_BASED_ID never can. `target/value`
# pins that the identifier served is the addressed container's.
#
# owner_id on the EHR side IS the EHR: the RM declares the containment
# (RM ehr ehr.adoc §Attributes, `tags`: "Tag `_target_` values can only be
# within the same EHR") and both EHR-side released examples set
# `owner_id.type: EHR` (register AMB-137 contrasts the demographic silence).
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_get-container_target_shape
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_get
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-137]
test_purpose: >-
  A container-addressed COMPOSITION tag serves target as the bare
  HIER_OBJECT_ID of the addressed container, with no OBJECT_REF wrapper.
description: "COMPOSITION container tag: target is a bare HIER_OBJECT_ID"
spec_refs:
  - "RM item_tag.adoc §Attributes"
  - "RM common master07-tags.adoc §Class Descriptions"
  - "RM ehr.adoc §Attributes"
  - "ITS-REST composition_tags_get.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "shape" }
    expect: updated
  - step: 3
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/target/value", equals: "${versioned_object_uid}" }
      - { assert: field, path: "[0]/target/id", absent: true }   # no OBJECT_REF wrapper — RM types target UID_BASED_ID
      - { assert: field, path: "[0]/owner_id/type", equals: "EHR" }
      - { assert: field, path: "[0]/owner_id/id/value", equals: "${ehr_id}" }
