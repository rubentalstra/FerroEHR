# The `Prefer: return=minimal` verbosity branch of the EHR_STATUS
# whole-resource PUT — the operation the SM setter is realized as, ITS-REST
# publishing no field-level setter.
#
# The status comes from register AMB-62's re-adjudication: the docs text states
# two answers for the minimal branch and settles on neither, so the released OAS
# fills the silence per operation family — `operations/ehr_status_update.yaml`
# declares both 200 and 204 and the response files split them by preference,
# `responses/204_version_updated.yaml` reading "`204 No Content` is returned
# when the update operation was successful and the `Prefer` header is missing or
# is set to `return=minimal`".
#
# A 204 carries no body, so the new EHR_STATUS version's identity travels in the
# entity tag alone; step 3 reads the status back and finds the update applied,
# which is what proves the empty answer still committed.
id: I_EHR_STATUS.set_ehr_queryable-prefer_minimal
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_queryable
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-62]
test_purpose: >-
  An EHR_STATUS update sent with Prefer: return=minimal answers 204 No Content
  and the modified status is committed.
description: "Prefer: return=minimal honoured on EHR_STATUS update"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer minimal, identifier or full representation response"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_queryable"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status                 # ITS-REST realization: obtain the If-Match precondition and the body to modify
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2
    call: set_ehr_queryable
    variant: return_minimal              # pins Prefer: return=minimal
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated                      # 204 No Content
  - step: 3                              # the empty answer still committed the modified status
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "is_queryable", equals: true }
