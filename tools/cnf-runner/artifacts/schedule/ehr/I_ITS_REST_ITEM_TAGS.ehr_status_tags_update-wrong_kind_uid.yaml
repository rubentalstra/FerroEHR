# A well-formed `uid_based_id` that resolves to a version container of ANOTHER
# KIND is a MISS on this route — the WITHIN-EHR-space direction of the
# route-kind rule, on UPDATE.
#
# GROUND: RM common master06-change_control_package.adoc §Typing makes a
# version container SINGLE-TYPED — "This ensures that all versions in a given
# `VERSIONED_OBJECT` are of the same type" — so no VERSIONED_EHR_STATUS carries
# a VERSIONED_COMPOSITION's uid, and the addressed resource does not exist.
# The released 404 says exactly that and no more: "`404 Not Found` is returned
# when an EHR with `ehr_id` does not exist, or when the `uid_based_id` does not
# exist" (ITS-REST responses/404_unknown_ehr_id_or_uid_based_id.yaml),
# which is the status table's 404 row verbatim ("The origin service did not
# find the target resource or is not willing to disclose that one exists").
# Register AMB-91 adjudicates the kind mismatch as that miss, on GET, PUT and
# DELETE alike; this case is the UPDATE arm.
#
# The final step keeps the refusal honest: the COMPOSITION's own tag route is
# untouched, so the 404 is a route-scope decision and not a side effect.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.ehr_status_tags_update-wrong_kind_uid
kind: functional
component: EHR
sm_operation: I_ITS_REST_ITEM_TAGS.ehr_status_tags_update
capabilities: [ItemTags]
exercises: [EhrApi]
profiles: [OPTIONS]
ambiguities: [AMB-91]
test_purpose: >-
  A COMPOSITION container uid presented on the EHR_STATUS tag PUT route is a
  miss, and stores nothing anywhere.
description: "EHR_STATUS tag PUT through the wrong kind's route (404)"
spec_refs:
  - "RM common §change_control (master06 §Typing)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST ehr_status_tags_update.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # a COMPOSITION container uid on the EHR_STATUS tag PUT route
    call: ehr_status_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "misrouted" }
    expect: not_found
  - step: 3                                       # the refused write stored nothing on the COMPOSITION
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
