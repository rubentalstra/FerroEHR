# A version_at_time value outside the ISO 8601 grammar is refused as a client
# error — it is never silently ignored (which would answer the latest version)
# and never resolved to some arbitrary instant.
#
# Decisive docs-text sentences: ITS-REST overview Resources.md §Datetime format
# — "HTTP query parameters and path segments that are dates, datetimes, or
# times, MUST always use the _extended_ ISO 8601 format. The general form of a
# datetime is `YYYY-MM-DDThh:mm:ss.sss[Z|±hh:mm]`" — and overview
# Requests_and_responses.md §HTTP status codes, row 400: "The service cannot
# or will not process the request due to something that is perceived to be a
# client error (e.g., malformed request syntax, syntactically invalid
# content)". The literal below is not a datetime in any format, so no
# tolerance reading reaches it.
id: I_EHR_STATUS.get_ehr_status-at_time_malformed
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [EhrStatus]
profiles: [CORE]
test_purpose: >-
  An EHR_STATUS at-time read whose version_at_time is not an ISO 8601 datetime
  is rejected as a client error rather than served.
description: "Get EHR_STATUS at time, malformed version_at_time"
spec_refs:
  - "ITS-REST overview Resources §Datetime format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status_at_time"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status
    variant: at_time
    with: { ehr_id: "${ehr_id}", a_time: "not-a-datetime" }
    expect: validation_failed
