# The miss branch of the EHR_STATUS revision-history read. The container is the
# EHR's own singleton, addressed only through the EHR, so an absent EHR leaves
# no target resource at all — there is no separate unknown-container arm on this
# route.
#
# DECISIVE DOCS TEXT (ITS-REST specifications/docs/overview/
# Requests_and_responses.md §HTTP status codes, the 404 row verbatim): "The
# origin service did not find the target resource or is not willing to disclose
# that one exists." The released OAS assigns the same code to this operation —
# operations/versioned_ehr_status_revision_history.yaml declares '404' ->
# responses/404_unknown_ehr_id.yaml.
#
# "A random ehr_id" is a fixed arbitrary UUID literal, absent on an empty
# server.
id: I_ITS_REST_REVISION_HISTORY.versioned_ehr_status_revision_history-bad_ehr
kind: functional
component: EHR
sm_operation: I_ITS_REST_REVISION_HISTORY.versioned_ehr_status_revision_history
capabilities: [Versioning]
exercises: [EhrStatus]
profiles: [CORE]
test_purpose: >-
  The EHR_STATUS revision-history read for an ehr_id that does not exist is
  rejected as not found.
description: "EHR_STATUS revision history of a non-existing EHR (404)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires: { server: empty }              # no EHRs, so the literal below cannot resolve
flow:
  - step: 1
    call: versioned_ehr_status_revision_history
    with: { ehr_id: "22222222-2222-4222-8222-222222222222" }
    expect: not_found
