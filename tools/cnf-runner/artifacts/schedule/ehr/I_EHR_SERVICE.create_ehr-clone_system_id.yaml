# A CLONED EHR keeps the source's ehr_id but takes the RECEIVING system's
# system_id — the half of the clone rule that has released wire.
#
# RM ehr master04-ehr_package.adoc §EHR Identifier Allocation states both
# halves in one paragraph: "the EHR id should be a copy of the EHR id from the
# other institution. In all cases, the `EHR._system_id_` value should be set to
# the value that would normally be used for locally created EHRs. In the case
# of creating a cloned EHR, the `_system_id_` is from the receiving (cloning)
# system." RM common master06-change_control_package.adoc §Copying says the
# same of the id half — "the newly created EHR should re-use the EHR identifier
# from the source system. This establishes the new EHR as an intentional clone."
#
# PUT /ehr/{ehr_id} is the ONLY released affordance for that clone: it is the
# one operation through which a client can name the id an EHR is created under,
# so it is where a receiving system's clone would be born. The sibling case
# I_EHR_SERVICE.create_ehr-with_ehr_id already pins the id echo and the
# duplicate refusal; this one adds the system_id claim, which is the half a
# regression could silently break — a server that carried a foreign system id
# in with a supplied ehr_id would still pass every existing row.
#
# WHY THIS NEEDS AN IXIT FACT. "the value that would normally be used for
# locally created EHRs" is a deployment fact, and no released operation
# discloses it, so it can only be checked against a value the PARTY declares.
# `${ixit:system_id}` reads exactly that declaration; a party that declares
# none records the case not-applicable with that citation rather than the
# runner guessing an identifier.
id: I_EHR_SERVICE.create_ehr-clone_system_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrOperations]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  An EHR created under a client-supplied identifier carries the LOCAL system's
  configured system_id, never one travelling with the identifier — the
  receiving-system half of the clone rule.
description: "A client-supplied ehr_id never brings a foreign system_id with it"
spec_refs:
  - "RM ehr §ehr_package (master04 §EHR Identifier Allocation)"
  - "RM common §change_control (master06 §Copying — the intentional clone re-uses the source EHR identifier)"
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr_with_id"
applies: { rm: ">=1.0.2" }
guards:
  - "the identity claim is only checkable against a party declaration — no released ITS-REST operation discloses a server's configured system identifier, so a party whose ixit omits system_id records this case not-applicable (RM ehr master04 §EHR Identifier Allocation states the rule but the wire exposes no source for the expected value)"
requires: { server: any }
parameters:
  iteration: reset_per_row
  matrix: { columns: [ehr_id], rows: [[provided]] }
flow:
  - step: 1
    call: create_ehr
    variant: with_ehr_id                 # PUT /ehr/{ehr_id} — the clone affordance
    with: { ehr_id: "${row.ehr_id}" }
    expect: created
    assert:
      - { assert: instance_of, rm_type: EHR }
      # the id half: the identifier the client named is the one stored
      - { assert: field, path: "ehr_id/value", equals: "${row.ehr_id}" }
      # the system half: the receiving (cloning) system's own identifier
      - { assert: field, path: "system_id/value", equals: "${ixit:system_id}" }
  - step: 2                              # and it survives the read
    call: get_ehr
    with: { ehr_id: "${row.ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
      - { assert: field, path: "ehr_id/value", equals: "${row.ehr_id}" }
      - { assert: field, path: "system_id/value", equals: "${ixit:system_id}" }
postconditions:
  - assert: state
    text: >-
      One EHR exists under the client-supplied identifier, carrying the local
      system's system_id.
