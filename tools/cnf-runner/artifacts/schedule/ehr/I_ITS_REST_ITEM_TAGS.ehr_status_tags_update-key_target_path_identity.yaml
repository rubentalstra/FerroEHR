# The (key, target_path) identity on the SECOND EHR-side typed family: the
# EHR_STATUS tag route, addressed by the status VERSION uid.
#
# THE LAW is the one the whole tag surface repeats: "More than one ITEM_TAG may
# be associated with a single target EHR_STATUS or VERSIONED_EHR_STATUS, in
# which case they are uniquely identified by their `key` and `target_path` pair
# attributes" (ITS-REST operations/ehr_status_tags_get.yaml, and the same
# sentence in ehr_status_tags_update.yaml and overview
# Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag).
#
# The list order is unstated (register AMB-97), so — as on the COMPOSITION
# twin — the assertions are order-free: both members carry the shared key and
# there is no third, which a key-only identity cannot satisfy.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.ehr_status_tags_update-key_target_path_identity
kind: functional
component: EHR
sm_operation: I_ITS_REST_ITEM_TAGS.ehr_status_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, EhrStatus]
profiles: [OPTIONS]
test_purpose: >-
  Two ITEM_TAGs sharing a key but differing in target_path coexist on one
  EHR_STATUS version and both survive the PUT round-trip.
description: "EHR_STATUS tags: (key, target_path) is the identity"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST ehr_status_tags_update.yaml §description"
  - "ITS-REST ehr_status_tags_get.yaml §description"
  - "RM common master07-tags.adoc §Semantics"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }
flow:
  - step: 1                                       # the status VERSION uid, from the read's ETag
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture:
      status_version_uid: ok.status_version_uid
  - step: 2
    call: ehr_status_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${status_version_uid}"
      tags:
        - { key: "flag", value: "on-subject", target_path: "/subject" }
        - { key: "flag", value: "on-queryable", target_path: "/is_queryable" }
    expect: updated
  - step: 3
    call: ehr_status_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${status_version_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "flag" }
      - { assert: field, path: "[1]/key", equals: "flag" }
      - { assert: field, path: "[2]", absent: true }
      - { assert: returns, matches: "/is_queryable" }
