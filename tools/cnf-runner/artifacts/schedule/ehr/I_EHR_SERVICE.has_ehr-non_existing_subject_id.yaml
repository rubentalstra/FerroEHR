# Official master06 case — existence check by a random subject_id returns
# negative. The schedule groups this under I_EHR_SERVICE.has_ehr(), but the
# subject query is realized by the SM operation has_ehr_for_subject (CNF<->SM
# naming divergence).
id: I_EHR_SERVICE.has_ehr-non_existing_subject_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.has_ehr_for_subject
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  has_ehr_for_subject on a subject with no EHR reports the EHR does not exist.
description: "Check has EHR with non existing EHR by subject_id"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.has_ehr_for_subject"
  - "CNF platform_test_schedule master06 §has_ehr-non_existing_subject_id"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
flow:
  - step: 1
    call: has_ehr_for_subject
    with: { subject_id: "cnf-absent-subject", subject_namespace: "cnf" }
    expect: not_found                    # negative: "the EHR for <subject_id> does not exist"
