# The EHR_STATUS revision history after two commits — the singleton twin of the
# COMPOSITION case: the container is the EHR's own VERSIONED_EHR_STATUS, so the
# route carries no container id, and the first revision is the one EHR creation
# itself committed.
#
# WHAT THE SERVED RESOURCE MUST BE (RM common
# UML/classes/org.openehr.rm.common.revision_history.adoc §Attributes): `items`
# is a `List<REVISION_HISTORY_ITEM>` at 1..1; RM common
# UML/classes/org.openehr.rm.common.revision_history_item.adoc §Attributes gives
# each item `version_id: OBJECT_VERSION_ID [1..1]` and `audits:
# List<AUDIT_DETAILS> [1..1]` with the invariant `Audit_valid: not
# audits.is_empty`.
#
# THE ORDER IS THE RM'S: the class table's Purpose row ("most-recent-first") and
# its `items` Meaning ("most-recent-last") contradict each other, and the two
# function postconditions settle it on `items.last` — `most_recent_version`:
# `Result.is_equal (items.last.version_id.value)`. Oldest-first on the wire;
# register AMB-68 carries the adjudication and UPR-30 the upstream report.
#
# ANCHOR: `I_ITS_REST_REVISION_HISTORY` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM declares no
# revision-history operation on any interface. It is pinned in
# NON_SM_REST_OPERATIONS (tools/cnf-runner/src/validate.rs).
#
# The second revision is committed through the SM setter's ITS-REST realization
# (a read-modify-write of the whole EHR_STATUS behind the If-Match precondition
# — ITS-REST overview §If-Match), because the release publishes no field-level
# setter.
id: I_ITS_REST_REVISION_HISTORY.versioned_ehr_status_revision_history-two_versions
kind: functional
component: EHR
sm_operation: I_ITS_REST_REVISION_HISTORY.versioned_ehr_status_revision_history
capabilities: [Versioning]
exercises: [EhrStatus]
profiles: [CORE]
ambiguities: [AMB-68]
test_purpose: >-
  The VERSIONED_EHR_STATUS revision history lists one item per committed
  version, oldest first, each naming its version and carrying a commit audit.
description: "EHR_STATUS revision history after two commits"
spec_refs:
  - "RM common §revision_history (items 1..1; the items.last postconditions)"
  - "RM common §revision_history_item (version_id / audits; Audit_valid)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
applies: { rm: ">=1.0.2" }
formats: [canonical-json]
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; EHR creation commits EHR_STATUS v1
flow:
  - step: 1                              # learn v1 — the version EHR creation committed
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { v1_uid: ok.status_version_uid, status_body: ok.body }   # the flip binding read-modify-writes from status_body
  - step: 2                              # v2, so the history has an order to get wrong
    call: I_EHR_STATUS.set_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${v1_uid}" }
    expect: updated
    capture: { v2_uid: updated.status_version_uid }
  - step: 3
    call: versioned_ehr_status_revision_history
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: REVISION_HISTORY }
      # oldest first — the items.last postconditions (AMB-68)
      - { assert: field, path: "items[0]/version_id/value", equals: "${v1_uid}" }
      - { assert: field, path: "items[1]/version_id/value", equals: "${v2_uid}" }
      - { assert: field, path: "items[2]", absent: true }
      # "there will always be at least one commit audit" (Audit_valid)
      - { assert: field, path: "items[0]/audits[0]/time_committed/value", exists: true }
      - { assert: field, path: "items[1]/audits[0]/time_committed/value", exists: true }
