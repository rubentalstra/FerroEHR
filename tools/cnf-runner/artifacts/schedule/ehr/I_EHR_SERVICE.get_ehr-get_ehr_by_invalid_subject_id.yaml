# Official master06 case — retrieving an EHR by a subject with none fails.
# The schedule groups this under I_EHR_SERVICE.get_ehr(), but the subject query
# is realized by the SM operation get_ehrs_for_subject (CNF<->SM naming
# divergence).
id: I_EHR_SERVICE.get_ehr-get_ehr_by_invalid_subject_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.get_ehrs_for_subject
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  get_ehrs_for_subject on a subject with no EHR is rejected as not found.
description: "Get non existing EHR by subject_id"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.get_ehrs_for_subject"
  - "CNF platform_test_schedule master06 §get_ehr-get_ehr_by_invalid_subject_id"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
flow:
  - step: 1
    call: get_ehrs_for_subject
    with: { subject_id: "cnf-absent-subject", subject_namespace: "cnf" }
    expect: not_found                    # negative: "EHR for <subject_id> does not exist"
