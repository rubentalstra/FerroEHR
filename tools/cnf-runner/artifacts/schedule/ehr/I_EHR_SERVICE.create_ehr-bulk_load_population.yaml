# BULK EHR LOAD — the population (breadth) half.
#
# WHAT REALIZES THIS CAPABILITY, derived first-hand. The CNF Profiles book
# lists "Bulk EHR load" as an Admin OPTIONS capability
# (master03-profiles.adoc §Functional) and says nothing further about it; the
# SM Admin chapter (SM openehr_platform master15-admin_service.adoc:
# I_ADMIN_SERVICE, I_ADMIN_ARCHIVE, I_ADMIN_DUMP_LOAD) declares NO bulk-load
# operation — the only load-shaped operation is I_ADMIN_DUMP_LOAD.load_ehrs,
# which is the separate "EHR Dump/Load" book row and reads from a file-system
# archive; and the released ITS-REST admin API declares exactly two paths
# (/admin/ehr/{ehr_id} and /admin/ehr/all), so no released wire names a bulk
# operation at all. What DOES exist on released wire is the load itself: a
# population created and filled through the ordinary EHR and COMPOSITION
# operations. That is the realization this case drives, and it is the same
# path this runner's own scale corpora are seeded on — the released public
# API only, never a database backdoor.
#
# THE BEHAVIOUR (one per case): loading a POPULATION of EHRs — many
# containers, one commit each — leaves every EHR a distinct, independently
# addressable container whose committed content reads back unchanged. The two
# ways a bulk load fails are identity collision (two EHRs, or two versions,
# sharing an id) and content bleed (a read returning another EHR's content);
# the aggregate `unique` postconditions and the per-row content check are
# exactly those two.
#
# N is deliberately small: this is the FUNCTIONAL catalogue, where the
# property under test is correctness under repetition, not throughput — the
# volumetric classes are earned by the separate measured instrument.
id: I_EHR_SERVICE.create_ehr-bulk_load_population
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [BulkEhrLoad]
profiles: [OPTIONS]
test_purpose: >-
  Loading a population of EHRs through the released create-EHR and
  create-COMPOSITION operations yields one distinct EHR per load with its own
  distinct first VERSION, and each committed COMPOSITION reads back unchanged
  from its own EHR.
description: "Bulk-load a population of EHRs, one COMPOSITION each"
spec_refs:
  - "CNF profiles master03-profiles.adoc §Functional (Admin: Bulk EHR load)"
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
  - "SM openehr_platform §I_EHR_COMPOSITION.create_composition"
  - "SM openehr_platform §I_EHR_COMPOSITION.get_composition_latest"
  - "RM ehr §EHR (ehr_id)"
  - "RM common §change_control (VERSION.uid)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  templates: [cnf.opt.minimal_event]
data_sets: [cnf.composition.minimal_event.v1]
parameters:
  iteration: single_pass      # the loaded EHRs must COEXIST — the cross-row
                              # uniqueness postconditions are the whole point
  matrix:
    columns: [load_index]
    rows: [[1], [2], [3], [4], [5], [6], [7], [8]]
flow:
  - step: 1
    call: create_ehr
    expect: created
    capture: { bulk_ehr_id: created.ehr_id }
  - step: 2
    call: I_EHR_COMPOSITION.create_composition
    with:
      ehr_id: "${bulk_ehr_id}"
      composition: "${ds:cnf.composition.minimal_event.v1}"
    expect: created
    capture:
      bulk_version_uid: created.version_uid
      bulk_versioned_object_uid: created.versioned_object_uid
  - step: 3                    # integrity: this EHR serves back THIS content
    call: I_EHR_COMPOSITION.get_composition_latest
    with:
      ehr_id: "${bulk_ehr_id}"
      versioned_object_uid: "${bulk_versioned_object_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: COMPOSITION }
      - { assert: equivalent, to: "${ds:cnf.composition.minimal_event.v1}", ignoring: server_assigned }
postconditions:
  # count + identity: eight loads, eight distinct EHRs, eight distinct first
  # VERSIONs. A bulk load that silently reused a container would collapse
  # these bags.
  - { assert: unique, over: "${bulk_ehr_id}", aggregate: true }
  - { assert: unique, over: "${bulk_version_uid}", aggregate: true }
