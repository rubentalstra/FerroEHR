# An ITEM_TAG list requested as XML is refused, never answered in a
# representation the client did not ask for.
#
# DECISIVE DOCS-TEXT SENTENCE (ITS-REST overview Resources.md §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to
# specify the expected XML response format. If the service cannot fulfill this
# aspect of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`." Corroborated by Requests_and_responses.md §"HTTP status
# codes", row `406 Not Acceptable`: "The target resource does not have a
# current representation that would be acceptable to the user".
#
# WHY THE SERVICE CANNOT FULFILL IT — and why this is a MUST here rather than
# an arm that a server could legitimately answer either way. §"XML Format"
# also states that "both request payloads and responses MUST conform to the
# [published XSDs]", and NO published ITS-XML schema declares an ITEM_TAG type
# at all — neither lineage carries the name (register AMB-97 records exactly
# that, and it is the reason every tag operation's `content` block is
# `application/json` only while parameters/header/Accept_canonical.yaml still
# enumerates `application/xml`). So there is no conforming XML representation
# for a server to serve, in ANY deployment: unlike the PARTY and CONTRIBUTION
# reads — where a complexType exists and only the document ELEMENT is
# unassigned, which is why those carry an option-gated pair of arms
# (register AMB-167) — the tag surface has nothing to serialize from. The
# refusal is therefore unconditional and this case is not option-gated.
#
# ONE BEHAVIOUR: the GET is the only step whose outcome is asserted; the
# create and the tag write exist so the refusal is measured against an
# EXISTING, non-empty collection — a 406 on a missing target would prove
# nothing about negotiation.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_get-xml_not_acceptable
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_get
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-97]
test_purpose: >-
  A COMPOSITION ITEM_TAG list requested with `Accept: application/xml` is
  refused as not acceptable, the tag surface having no published canonical-XML
  representation.
description: "COMPOSITION tag GET with Accept: application/xml (406)"
spec_refs:
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST composition_tags_get.yaml §description"
  - "RM common master07-tags.adoc §Semantics"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    format: canonical-json                        # precondition only — the XML branch under test is step 3
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # a non-empty collection, so the refusal is about negotiation
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    format: canonical-json
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "alpha", value: "a" }
    expect: updated
  - step: 3
    call: composition_tags_get
    format: canonical-xml                         # the unfulfillable Accept
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: not_acceptable
