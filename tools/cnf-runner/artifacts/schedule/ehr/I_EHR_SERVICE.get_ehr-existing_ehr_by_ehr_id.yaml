# Official master06 case — retrieve an existing EHR by ehr_id.
id: I_EHR_SERVICE.get_ehr-existing_ehr_by_ehr_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.get_ehr
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  get_ehr on the ehr_id of an existing EHR returns that EHR.
description: "Get existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.get_ehr"
  - "CNF platform_test_schedule master06 §get_ehr-existing_ehr_by_ehr_id"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: any }                  # "An EHR should exist ... with a known ehr_id" — mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
