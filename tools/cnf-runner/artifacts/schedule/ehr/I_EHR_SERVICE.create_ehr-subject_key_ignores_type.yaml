# The EHR subject-conflict key is (id, namespace) — PARTY_REF.type is NOT part
# of it. Two creates whose subject external_ref differs ONLY in `type` collide.
#
# THE ASSIGNING SENTENCE (ITS-REST specifications/responses/409_EHR.yaml, cited
# AS the OAS because the docs text never mentions a subject at all — the
# oracle-order fallback of the 2026-07-28 ruling): "`409 Conflict` Unable to
# create a new EHR due to a conflict with an already existing EHR with the same
# subject id, namespace pair, whenever EHR_STATUS is supplied." The key is
# named exhaustively — "the same subject id, namespace pair" — so a third
# attribute cannot join it, and the EXCLUSION of `type` is a released fact
# rather than an implementation choice. Register AMB-63 carries the narrowing
# (its former reading was that one-EHR-per-subject was undefined outright) and
# the halves that remain open.
#
# THE PAIR IS OTHERWISE IDENTICAL. Both payloads carry `cnf-subject-11` in
# namespace `cnf`; only `type` differs, PERSON in step 1 and ORGANISATION in
# step 2. Both values are legal — BASE
# UML/classes/org.openehr.base.base_types.party_ref.adoc §Invariants
# `Type_validity`: `type.is_equal("PERSON") or type.is_equal("ORGANISATION") or
# … or type.is_equal("ACTOR")` — so a rejection cannot be blamed on an invalid
# payload, and a change in `type` is exactly the one variable under test.
#
# The sibling -two_ehrs_same_patient case pins the same key for two IDENTICAL
# subjects; this one pins that the key does not widen when a non-key attribute
# moves.
id: I_EHR_SERVICE.create_ehr-subject_key_ignores_type
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrOperations]
profiles: [CORE]
ambiguities: [AMB-63]
test_purpose: >-
  A second EHR whose subject external_ref differs from an existing one only in
  PARTY_REF.type is rejected: the conflict key is the id, namespace pair alone.
description: "Create two EHRs whose subject refs differ only in type"
spec_refs:
  - "ITS-REST 409_EHR.yaml §description"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "BASE base_types §party_ref (Type_validity)"
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires: { server: empty }
data_sets: [cnf.ehr_status.with_subject.l, cnf.ehr_status.with_subject.m]
flow:
  - step: 1                              # subject cnf-subject-11@cnf, type PERSON
    call: create_ehr
    with: { ehr_status: "${ds:cnf.ehr_status.with_subject.l}" }
    expect: created
    capture: { first_ehr_id: created.ehr_id }
  - step: 2                              # SAME id + namespace, type ORGANISATION — the only difference
    call: create_ehr
    with: { ehr_status: "${ds:cnf.ehr_status.with_subject.m}" }
    expect: already_exists
  - step: 3                              # the subject still resolves to exactly the first EHR
    call: has_ehr_for_subject
    with: { subject_id: "cnf-subject-11", subject_namespace: "cnf" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
postconditions:
  - assert: state
    text: >-
      Exactly one EHR exists for the (id, namespace) subject key — the one
      created in step 1; the type-only variant created nothing (verified by
      step 3)
