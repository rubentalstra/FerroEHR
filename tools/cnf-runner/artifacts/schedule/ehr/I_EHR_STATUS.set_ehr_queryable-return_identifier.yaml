# The `Prefer: return=identifier` branch on an EHR_STATUS UPDATE — the update
# half of a preference the catalogue so far only exercises on creates.
#
# Decisive docs-text sentences (ITS-REST overview Requests_and_responses.md
# §"Prefer only identifier"): "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`)." and "The
# response body SHOULD contain only the identifier of the affected resource
# formatted according to the `Accept` request header. For example, when
# `application/json` is requested as above, the response body will be a single
# JSON object with a single `uid` attribute." An update creates no resource,
# so the permitted status is the 200 half — never the 204 the default
# `return=minimal` may answer.
#
# "the identifier of the AFFECTED resource" is asserted, not merely the
# presence of a uid: the body's `uid` must be the very version the response's
# own ETag names (§ETag and Last-Modified: the ETag "is usually taken from
# e.g. VERSIONED_OBJECT.uid.value, VERSION.uid.value" and "changes as soon as
# the resource changes").
id: I_EHR_STATUS.set_ehr_queryable-return_identifier
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_queryable
capabilities: [EhrStatus]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  An EHR_STATUS update sent with Prefer: return=identifier answers a non-empty
  identifier body at 200 — never 204 — and that identifier is the version the
  update created.
description: "Prefer: return=identifier honoured on EHR_STATUS update"
spec_refs:
  - "ITS-REST overview Requests_and_responses (Prefer only identifier)"
  - "ITS-REST overview Requests_and_responses (Representation details negotiation)"
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_queryable"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2
    call: set_ehr_queryable
    format: canonical-json
    variant: return_identifier           # pins Prefer: return=identifier
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated                      # "201 Created or 200 OK, never 204 No Content"
    capture: { new_version_uid: updated.status_version_uid }
    assert:
      # "a single JSON object with a single `uid` attribute", and it is the
      # identifier of the AFFECTED resource — the version this update created.
      - { assert: field, path: "uid", equals: "${new_version_uid}" }
      # "only the identifier of the affected resource" — not the full EHR_STATUS
      - { assert: field, path: "is_queryable", absent: true }
