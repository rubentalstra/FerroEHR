# The bare-EHR_STATUS by-version read serves the ADDRESSED version, not the
# latest one.
#
# ITS-REST overview Resources.md §Multiple identifiers for the same resource
# draws exactly this contrast: a resource "can be accessed using either" the
# "explicit version reference, using the _version_uid_ identifier" or the
# "implicit latest version reference", and "the implicit URI will only resolve
# to the same resource as the explicit versioned URI as long as no new
# versions are created". This case creates that new version and then addresses
# the older one explicitly, so the two URIs must diverge.
#
# The proof is a state the two versions do not share: the provisioned EHR's
# first EHR_STATUS carries is_queryable = true, step 2 commits a second with
# false, and the explicit read of v1 in step 3 must still show true. The
# served object's own `uid` is deliberately NOT the assertion here — whether a
# top-level object carries the enclosing VERSION's uid at all is the
# AMB-65/AMB-67 question (LOCATABLE.uid is 0..1 and no released sentence
# requires it populated), gated separately and non-gatingly by
# I_EHR_STATUS.get_versioned_ehr_status-contained_uid_form.
id: I_EHR_STATUS.get_ehr_status_at_version-addressed_version
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_ehr_status_at_version
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  get_ehr_status_at_version serves the EHR_STATUS as it stood at the addressed
  version, even after a newer version has been committed.
description: "Get EHR_STATUS at an explicitly addressed version"
spec_refs:
  - "ITS-REST overview Resources §Multiple identifiers for the same resource"
  - "RM common §versioned_object (version_with_id)"
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status_at_version"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_queryable = true
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2                              # v2 with the flag flipped, so "latest" and "addressed" differ
    call: clear_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: get_ehr_status_at_version
    with: { ehr_id: "${ehr_id}", version_uid: "${status_version_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR_STATUS }
      - { assert: field, path: "is_queryable", equals: true }   # the v1 state — the addressed version, not the latest
