# An empty-string `target_path` on a posted tag is stored and served as ABSENT
# — one identity, not a second one.
#
# WHY THIS IS A REAL WIRE QUESTION and not a curiosity: `target_path` is half
# the ITEM_TAG identity ("uniquely identified by their `key` and `target_path`
# pair attributes" — ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so if `""` and absent were
# two values they would be two tags under one key. The two released artifacts
# model it differently: RM
# UML/classes/org.openehr.rm.common.item_tag.adoc types `target_path` as
# `String[0..1]` — absent means no path — with invariants on `key` and `value`
# only and none forbidding an empty path, while SIX of the seven released
# example schemas write `target_path: ""` outright
# (schemas/ehr/ItemTagOfEhrStatus.yaml and
# schemas/demographic/ItemTagOf{Person,Agent,Group,Organisation,Role}.yaml;
# only ...OfComposition uses a real path, and no released example omits the
# attribute). Register AMB-96 fixes the handling: "`\"\"` normalizes to ABSENT
# at the service seam — one identity, not two; served tags never carry an
# empty target_path", noting that the empty spelling is exactly what an
# example-following client sends and that folding it into the no-path identity
# is what keeps such a client's tags addressable by the DELETE-by-key route.
#
# THE ASSERTION IS THE SERVED SHAPE: the tag comes back under its key with NO
# `target_path` member at all. The DELETE step is the consequence that makes
# the normalization matter — the route carries only `{key}`, so a tag whose
# stored path were `""` rather than absent would still have to be reachable,
# and this pins that it is.
#
# THIS CASE IS THE EHR-FAMILY ARM; the demographic arm is
# I_ITS_REST_ITEM_TAGS.person_tags_update-empty_target_path_absent. AMB-96
# fixes the handling "identically on the EHR and demographic families", so
# both families are driven.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-empty_target_path_absent
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-96]
test_purpose: >-
  A COMPOSITION tag posted with an empty-string target_path is served with no
  target_path at all and stays addressable by the key-scoped DELETE.
description: "COMPOSITION tag with target_path \"\" is stored as absent"
spec_refs:
  - "RM item_tag.adoc §Attributes"
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST composition_tags_update.yaml §requestBody"
  - "ITS-REST composition_tags_delete.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "alpha", value: "a", target_path: "" }   # the spelling six released examples use
    expect: updated
  - step: 3
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "alpha" }
      - { assert: field, path: "[0]/target_path", absent: true }   # normalized away, never served as ""
      - { assert: field, path: "[1]", absent: true }
  - step: 4                                       # and it is reachable by the key-only DELETE route
    call: I_ITS_REST_ITEM_TAGS.composition_tags_delete
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}", key: "alpha" }
    expect: deleted
  - step: 5
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
