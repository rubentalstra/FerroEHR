# EHR creation is a commit on change-controlled content, so the committal
# request headers are accepted and merged there too.
#
# Derived from the ITS-REST docs text (Requests_and_responses.md
# §"openehr-version and openehr-audit-details"), not from any SUT:
#   "for all change-controlled resources (e.g. COMPOSITION, EHR_STATUS,
#   FOLDER, etc.) the services are performing versioning under the hood";
#   "services MUST also allow PUT, POST and DELETE methods directly on these
#   change-controlled resources. However, these operations MUST internally be
#   executed using the 'native' way."; "In order to allow clients to provide
#   committal metadata, services MUST accept openehr-version and
#   openehr-audit-details custom request headers."; "None of these headers are
#   mandatory, but whatever is provided it MUST be merged with the default
#   VERSION and VERSION.audit_details attributes on commit runtime."
# POST /ehr commits an EHR_STATUS — one of the change-controlled resources
# that sentence names: "the result should be a root EHR object, an EHR Status
# object, and an EHR Access object … created and committed in a Contribution"
# (RM ehr master04 §EHR Creation). So the supplied description and committer
# MUST reach the persisted EHR_STATUS ORIGINAL_VERSION.commit_audit, and the
# creation's own change type (249|creation| — a first version, RM common
# master06 §Contributions) MUST survive the merge unharmed.
id: I_EHR_SERVICE.create_ehr-committal_headers
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [Versioning]
exercises: [EhrOperations, EhrStatus, ChangeSets]
profiles: [CORE]
test_purpose: >-
  A POST /ehr carrying openehr-audit-details merges the supplied description
  and committer into the creation commit, leaving the 249|creation| change
  type of the first version intact.
description: "EHR creation accepts and merges committal headers"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-version and openehr-audit-details"
  - "RM ehr §ehr_package (master04 §EHR Creation)"
  - "RM common §change_control (AUDIT_DETAILS; audit_change_type group)"
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
applies: { rm: ">=1.0.2" }
requires:
  server: any
flow:
  - step: 1
    call: create_ehr
    variant: committal
    expect: created
    capture:
      new_ehr_id: created.ehr_id
  # The EHR body's ehr_status ref names the CONTAINER (RM ehr
  # `Ehr_status_valid`; BASE master05 OBJECT_REF.id), so the committed
  # VERSION uid is read from the served EHR_STATUS.
  - step: 2
    call: I_EHR_STATUS.get_ehr_status
    with:
      ehr_id: "${new_ehr_id}"
    expect: ok
    capture:
      status_version_uid: ok.status_version_uid
  - step: 3
    call: I_EHR_STATUS.get_versioned_ehr_status
    variant: version
    with:
      ehr_id: "${new_ehr_id}"
      version_uid: "${status_version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "commit_audit/description/value", equals: "EHR opened at triage" }
      - { assert: field, path: "commit_audit/committer/name", equals: "Dr Chart" }
      - { assert: field, path: "commit_audit/change_type/defining_code/code_string", equals: "249" }
