# The canonical-XML REQUEST-payload branch of EHR creation, on both wire forms
# of the operation: the client-supplied-id PUT /ehr/{ehr_id} and the id-less
# POST /ehr. One case, one step per wire form — the accept-forms shape
# (SF-EXAMPLE-accept_forms), because both steps drive the SAME SM operation and
# the behaviour under test is a single one: an `application/xml` request
# payload a service cannot process is refused with the released status code.
#
# WHY THIS ROW IS THE REFUSAL ARM AND NOT THE OFFER ARM (register AMB-167,
# re-adjudicated 2026-07-29). The payload this operation carries is an
# EHR_STATUS, and the published XSDs declare no document element for it: the
# STABLE 1.0.2-nsv1 bundle ships no Ehr.xsd at all, so EHR_STATUS has no
# complexType there either, and the 2.0.0-nsv2 bundle types it as a LOCATABLE
# subtype with no element of its own. So a WRITE row cannot be authored on the
# offer side: it must commit to one request root element, and ITS-REST overview
# Resources.md §"XML Format" opens with "When resources are serialized in
# **canonical XML** format, both request payloads and responses MUST conform to
# the [published XSDs]" — a payload whose root no published schema declares
# does not conform, so requiring a service to accept it would mark a
# conformant validating service non-conformant. (A READ row escapes this
# because the SERVER picks the document, and the row can assert the released
# conduct — the negotiated `Content-Type` and an XML document entity — without
# ever naming a root.)
#
# What IS released here is the other half of the same section: "A client MAY
# use the header `Content-Type: application/xml` in the requests to specify the
# XML payload format. If the service cannot process the request payload as XML
# format, it MUST respond with HTTP status code `415 Unsupported Media Type`."
# A party declaring `ehr-xml-unsupported` declares exactly the antecedent, so
# the MUST is enforceable against it — and it fires on the MEDIA TYPE, before
# any document is parsed, which is why the row keeps the codec-derived fixture:
# the payload's root name is not part of what is asserted, and picking the
# generic `items`+`xsi:type` spelling instead would be the catalogue endorsing
# a wire form the release withholds.
#
# Step 3 is the state proof: neither refusal may have created anything, so the
# client-supplied ehr_id must still be unknown (ITS-REST overview
# Requests_and_responses.md §HTTP status codes, row 404 — "The requested
# resource could not be found but may be available in the future").
#
# Technology-profile scope: canonical XML is OPTIONAL support — Resources.md
# §Data representation, "Services MUST support at least one of the openEHR
# **XML** or **JSON** canonical formats for resource representation" — so the
# case declares the canonical-xml format axis and is counted only against a
# statement whose technology profile declares that format.
#
# The ehr_id is the deterministic per-case/per-row value the `provided` matrix
# sentinel mints (a pure function of case id + row index), so two runners
# choose the same id and no other case can collide with it.
id: I_EHR_SERVICE.create_ehr-xml
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrOperations]
exercises: [EhrApi]
profiles: [CORE]
option: ehr-xml-write-refused       # AMB-167 option_select branch (the refusal arm)
ambiguities: [AMB-167]
test_purpose: >-
  On a service that declares it cannot process canonical-XML request payloads
  for the EHR family, both wire forms of EHR creation refuse an
  `application/xml` EHR_STATUS payload as unsupported media, and no EHR is
  created.
description: "Refuse a canonical-XML EHR_STATUS create payload as unsupported media"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr_for_subject_with_id"
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr_for_subject"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
guards:
  - "Canonical-XML support for this resource family is statement-declared, not spec-mandated — the published XSDs declare no document element for the EHR_STATUS this operation's payload carries and ITS-REST overview Resources.md §Data representation leaves the format to the service, so this row judges only a party that declares it cannot process such a payload (register AMB-167)"
formats: [canonical-xml]
requires: { server: any }
data_sets: [cnf.ehr_status.with_subject.xml]
parameters:
  iteration: reset_per_row
  matrix: { columns: [ehr_id], rows: [[provided]] }
flow:
  - step: 1
    call: create_ehr
    variant: with_ehr_id                 # PUT /ehr/{ehr_id}
    format: canonical-xml                # Content-Type: application/xml
    with:
      ehr_id: "${row.ehr_id}"
      ehr_status: "${ds:cnf.ehr_status.with_subject.xml}"
    expect: unsupported_media            # Resources.md §XML Format 415 MUST
  - step: 2
    call: create_ehr                     # POST /ehr — same payload, id-less wire form
    format: canonical-xml                # Content-Type: application/xml
    with: { ehr_status: "${ds:cnf.ehr_status.with_subject.xml}" }
    expect: unsupported_media            # Resources.md §XML Format 415 MUST
  - step: 3                              # the refusals left no EHR behind
    call: get_ehr
    format: canonical-json
    with: { ehr_id: "${row.ehr_id}" }
    expect: not_found
postconditions:
  - assert: state
    text: >-
      No EHR exists under the client-supplied ehr_id — both XML creates were
      refused before any resource was committed (verified by step 3)
