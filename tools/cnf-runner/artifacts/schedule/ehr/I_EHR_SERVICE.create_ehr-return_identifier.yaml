# The `Prefer: return=identifier` representation branch of the EHR creation.
# Decisive docs-text sentences (ITS-REST overview Requests_and_responses.md
# §"Prefer only identifier"): "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`)." and "The
# response body SHOULD contain only the identifier of the affected resource
# formatted according to the `Accept` request header. For example, when
# `application/json` is requested as above, the response body will be a single
# JSON object with a single `uid` attribute."
#
# WHICH identifier the EHR's `uid` member carries is not left to guesswork:
# Resources.md §Identifier types enumerates the identifier of this resource —
# "an `ehr_id` to identify an EHR" — so "the identifier of the affected
# resource" for a created EHR is its ehr_id. Step 2 PROVES that rather than
# asserting it by inspection: the value read out of the identifier body is
# used as the `ehr_id` path segment of a plain read, which can only succeed if
# the body named the EHR that was just created.
#
# One behaviour per case: the same creation every other create_ehr case
# performs, distinguished only by the `Prefer` value the return_identifier
# variant binding pins. The observable facts asserted are the created 201
# (never the 204 the sentence excludes), the identifier body's `uid`, and the
# absence of the full representation's own attributes beside it.
#
# The sibling `return=minimal` preference has NO case ON THIS FAMILY, and the
# EHR create is now the ONLY create family of which that is true. The docs text
# assigns the branch nothing anywhere ("typically `201 Created`" is
# descriptive, and the `204 No Content` SHOULD is conditional on a
# body-presence fact the text never assigns); AMB-62's 2026-07-28
# re-adjudication then let the released OAS fill that silence per family — but
# the fill comes from the sentence "If the `Prefer` header is missing or set to
# `return=minimal`, the body is empty", which `responses/201_COMPOSITION.yaml`,
# `201_PERSON.yaml`, `201_directory.yaml`, `201_CONTRIBUTION.yaml` and the two
# template-upload 201s all carry and `responses/201_EHR.yaml` does NOT (its
# description stops after the representation and identifier preferences,
# verified first-hand 2026-07-28). With both sources silent here, a status
# expectation on the EHR minimal branch would still be catalogue invention.
# That residue is the registered boundary AMB-62 /
# vocab/wire_surface.yaml `header-prefer-return-minimal`.
id: I_EHR_SERVICE.create_ehr-return_identifier
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrOperations]
exercises: [EhrApi]
profiles: [CORE]
test_purpose: >-
  An EHR creation sent with Prefer: return=identifier answers a non-empty
  identifier body at a created status — never 204 No Content — and the uid it
  carries is the new EHR's ehr_id, which addresses the created EHR.
description: "Prefer: return=identifier honoured on EHR create"
spec_refs:
  - "ITS-REST overview Requests_and_responses (Prefer only identifier)"
  - "ITS-REST overview Resources (Identifier types — ehr_id identifies an EHR)"
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires: { server: any }
flow:
  - step: 1
    call: create_ehr
    format: canonical-json
    variant: return_identifier           # pins Prefer: return=identifier
    expect: created                      # "201 Created or 200 OK, never 204 No Content"
    capture: { new_ehr_id: created.ehr_id }
    assert:
      # "a single JSON object with a single `uid` attribute"
      - { assert: field, path: "uid", exists: true }
      # "only the identifier of the affected resource" — not the full EHR
      - { assert: field, path: "ehr_id", absent: true }
      - { assert: field, path: "system_id", absent: true }
      - { assert: field, path: "ehr_status", absent: true }
  # The identifier is the ehr_id (Resources.md §Identifier types): reading the
  # EHR back through it is the proof, not an inspection of the string's shape.
  - step: 2
    call: get_ehr
    with: { ehr_id: "${new_ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
      - { assert: field, path: "ehr_id/value", equals: "${new_ehr_id}" }
