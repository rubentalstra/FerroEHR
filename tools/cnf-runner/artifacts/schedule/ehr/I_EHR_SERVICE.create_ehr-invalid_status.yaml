# Framework-added case: CNF master06 lists the INVALID EHR_STATUS data-set
# class (missing/empty flags, invalid subject/other_details) but heads no
# test case for it — this case carries that ground.
#
# WHICH BRANCH EACH ROW TAKES: the docs-text status table does not say where
# "invalid content" ends and "semantic error" begins; the released OAS does.
# `responses/400.yaml` (which `operations/ehr_create.yaml` declares under
# '400') scopes 400 to "syntactically invalid ... content" and
# `responses/422.yaml` scopes 422 to content that "could be converted to a
# resource" and then fails validation — so a body missing a `required` member,
# or one whose abstract slot carries no `_type` to decode, is the 400 row, and
# one that converts and then breaks an invariant is the 422 row. This is the
# same split the sibling `I_EHR_STATUS.*-invalid_body` cases carry.
id: I_EHR_SERVICE.create_ehr-invalid_status
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  Creating an EHR with a semantically invalid EHR_STATUS is rejected and no
  EHR is created.
description: "Create EHR with invalid EHR_STATUS data sets"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
  - "CNF platform_test_schedule master06 §Test Data Sets (the INVALID class)"
  - "RM ehr §EHR_STATUS"
  - "ITS-REST OAS operations/ehr_create.yaml §responses ('400')"
  - "ITS-REST OAS schemas/ehr/EhrStatus.yaml §required (subject, is_queryable, is_modifiable)"
  - "ITS-REST OAS responses/400.yaml"
  - "ITS-REST OAS responses/422.yaml"
  - "ITS-REST overview Resources §JSON Format"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
parameters:
  iteration: reset_per_row
  fixture_set:
    # missing-mandatory + missing-_type-on-abstract-slot rows are the 400 parse class (OAS responses/400.yaml, "syntactically invalid ... content");
    # the Archetyped_valid row stays the 422 semantic class (archetype_details is 0..1 — the body converts, then the invariant fails).
    - { data_set: cnf.ehr_status.invalid.missing-is-queryable, expected: bad_request, defect: "OAS schemas/ehr/EhrStatus.yaml §required: is_queryable" }
    - { data_set: cnf.ehr_status.invalid.missing-is-modifiable, expected: bad_request, defect: "OAS schemas/ehr/EhrStatus.yaml §required: is_modifiable" }
    - { data_set: cnf.ehr_status.invalid.missing-subject, expected: bad_request, defect: "OAS schemas/ehr/EhrStatus.yaml §required: subject" }
    - { data_set: cnf.ehr_status.invalid.invalid-other-details, expected: bad_request, defect: "ITS-REST Resources §JSON Format: other_details carries no _type discriminator" }
    - { data_set: cnf.ehr_status.invalid.missing-archetype-details, expected: validation_failed, defect: "RM: archetype root without archetype_details (Archetyped_valid)" }
flow:
  - step: 1
    call: create_ehr
    with: { ehr_status: "${ds:fixture}" }
    expect: "${fixture.expected}"
postconditions:
  - assert: state
    text: "No EHR was created (the rejected status leaves the server empty)"
    verified_by: I_EHR_STATUS.get_ehr_status-get_by_ehr_id
