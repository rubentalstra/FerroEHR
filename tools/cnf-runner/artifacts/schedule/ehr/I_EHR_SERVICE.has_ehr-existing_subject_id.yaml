# Official master06 case — existence check by subject_id returns positive.
# The schedule groups this under the I_EHR_SERVICE.has_ehr() heading, but the
# flow queries by subject_id, which the SM realizes with the distinct operation
# has_ehr_for_subject (CNF<->SM naming divergence; see the schedule/ehr
# REQUIREMENTS.md ambiguity candidate). The official case id is unchanged.
# The known subject is provisioned in-flow via the with_subject fixture, whose
# external_ref carries id "cnf-subject-01" in namespace "cnf".
id: I_EHR_SERVICE.has_ehr-existing_subject_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.has_ehr_for_subject
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  has_ehr_for_subject on the subject of an existing EHR reports the EHR exists.
description: "Check has EHR with existing EHR by subject_id"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.has_ehr_for_subject"
  - "CNF platform_test_schedule master06 §has_ehr-existing_subject_id"
applies: { rm: ">=1.0.2" }
requires: { server: empty }
data_sets: [cnf.ehr_status.with_subject]
flow:
  - step: 1
    call: create_ehr                     # provision the "EHR with a known subject_id" precondition
    with: { ehr_status: "${ds:cnf.ehr_status.with_subject.d}" }
    expect: created
  - step: 2
    call: has_ehr_for_subject
    with: { subject_id: "cnf-subject-03", subject_namespace: "cnf" }
    expect: ok                           # positive: "the EHR with <subject_id> exists"
ambiguities: [AMB-14]
