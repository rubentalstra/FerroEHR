# The omitted-parameter branch on the ENVELOPE route: with no
# `version_at_time`, /versioned_ehr_status/version serves the VERSION envelope
# of the latest version.
#
# Unlike the bare-EHR_STATUS route, the identity is assertable here without
# touching the contained-uid question: RM common master06 §change_control
# fixes the envelope's OWN identifier — "VERSION objects are identified by a
# `_uid_` attribute of type `OBJECT_VERSION_ID`" — so comparing the served
# `uid/value` to the uid the second commit returned proves exactly which
# version was served.
id: I_EHR_STATUS.get_versioned_ehr_status-at_time_omitted
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  A versioned-EHR_STATUS version read that supplies no version_at_time serves
  the VERSION envelope of the latest version.
description: "Get EHR_STATUS VERSION at time, version_at_time omitted"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.get_versioned_ehr_status"
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "RM common §versioned_object (latest_version)"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2
    call: clear_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
    capture: { v2_uid: updated.status_version_uid }
  - step: 3
    call: get_versioned_ehr_status
    variant: at_time                     # the at-time version route, parameter omitted
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${v2_uid}" }
