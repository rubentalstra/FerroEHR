# Tagging committed content does NOT re-version it — the ITEM_TAG chapter's
# one hard behavioural MUST, and the only one that can be refuted from the
# wire.
#
# THE LAW, verbatim (RM ehr master04-ehr_package.adoc §Tags, the consequence
# list of "Tags are associated with an EHR via the `EHR._tags_` attribute, but
# have no direct association with the objects they annotate"):
#
#     "* they may be added at any time with respect to the commit time of the
#        content they annotate, including much later;
#      * they do not constitute part of the content they annotate;
#      * accordingly, where they annotate versioned content, they do not cause
#        re-versioning of the content;"
#
# RM common master07-tags.adoc is the "detail" that section defers to and adds
# nothing that softens it; the ITEM_TAG class carries no version, no audit and
# no contribution attribute at all
# (RM UML/classes/org.openehr.rm.common.item_tag.adoc).
#
# WHAT THE WIRE CAN SHOW, and why these two assertions are the whole of it.
# "No re-versioning" is observable as the VERSIONED_COMPOSITION's revision
# history: RM common revision_history.adoc makes it one REVISION_HISTORY_ITEM
# per committed version, so a second item after a tag write IS the refutation.
# "No CONTRIBUTION" rides on the same read plus the VERSION envelope's own
# `contribution` reference: RM common master06 §Contributions makes a
# CONTRIBUTION a set of committed VERSIONs ("a CONTRIBUTION object will be
# created, listing the affected VERSION objects"), so a CONTRIBUTION with no
# new version is not a thing the model admits — and the envelope read pins
# that the EXISTING version still points at the contribution the creation
# minted, i.e. the tag write did not join it either. The released wire exposes
# no contribution-listing operation (I_EHR_CONTRIBUTION.list_contributions is
# an `unrealized` binding — register AMB-22), so an enumeration assertion is
# not available here; the deeper storage-level statement (no new contribution
# row, no audit row) is asserted by the service-level twin in
# app/ferroehr/tests/it/service_ehr_package.rs.
#
# ORDER OF THE FLOW: the contribution reference is captured BEFORE the tag
# write, so the comparison is against a value recorded independently of the
# behaviour under test.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-no_reversioning
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
test_purpose: >-
  Tagging a committed COMPOSITION creates no new version and no new
  CONTRIBUTION: the revision history still holds exactly one item and the
  existing VERSION still names the contribution its creation minted.
description: "COMPOSITION tags do not re-version the content"
spec_refs:
  - "RM ehr master04-ehr_package §Tags"
  - "RM common master07-tags.adoc §Semantics"
  - "RM common §revision_history (items 1..1; one item per committed version)"
  - "RM common §change_control (master06 §Contributions)"
  - "ITS-REST composition_tags_update.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      v1_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # the pre-tag CONTRIBUTION of the one committed VERSION
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    capture:
      contribution_before: ok.contribution_uid
  - step: 3                                       # the behaviour under test
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "clin-proj-27a" }
    expect: updated
  - step: 4                                       # no new VERSION
    call: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
    with: { ehr_id: "${ehr_id}", versioned_object_uid: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: REVISION_HISTORY }
      - { assert: field, path: "items[0]/version_id/value", equals: "${v1_uid}" }
      - { assert: field, path: "items[1]", absent: true }   # exactly one revision — the tag write minted none
  - step: 5                                       # no new CONTRIBUTION, and the old one unmoved
    call: I_EHR_COMPOSITION.get_versioned_composition
    variant: version
    with:
      ehr_id: "${ehr_id}"
      versioned_object_uid: "${versioned_object_uid}"
      version_uid: "${v1_uid}"
    expect: ok
    assert:
      - { assert: field, path: "uid/value", equals: "${v1_uid}" }
      - { assert: field, path: "contribution/id/value", equals: "${contribution_before}" }
  - step: 6                                       # and the tag itself is there, so step 3 really wrote
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "clin-proj-27a" }
      - { assert: field, path: "[1]", absent: true }
