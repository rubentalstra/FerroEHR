# An EHR_STATUS whose defect sits BELOW the root is refused: the ARCHETYPED
# block carries an empty rm_version.
#
# WHAT MAKES THE PAYLOAD INVALID (one defect, so a red row names one thing):
# RM common UML/classes/org.openehr.rm.common.archetyped.adoc §Invariants
# states `Rm_version_valid: not rm_version.is_empty`, and §Attributes types
# `rm_version` 1..1. The fixture is the otherwise-valid minimal EHR_STATUS with
# that one string emptied — every root-level attribute the sibling
# `-invalid_body` case exercises is present and correct, so the only thing
# under test is whether the server judges a node BELOW the resource root at
# all.
#
# WHY THE REFUSAL IS REQUIRED (not merely permitted): SM i_ehr_status.adoc
# §set_ehr_queryable carries the content-validity precondition, and SM
# i_validity_checker.adoc §content_valid defines the predicate as "Return
# `True` if the content structure is a valid instance of the relevant RM
# classes" — an ARCHETYPED breaking its own class invariant is not one. The
# invariant is a property of the ARCHETYPED INSTANCE, so it binds identically
# wherever the block occurs; the catalogue already gates the same invariant
# inside a COMPOSITION.
#
# WHICH BRANCH THE REFUSAL TAKES: the docs-text status table does not say
# where "invalid content" ends and "semantic error" begins; the released OAS
# does. Every member the request-body schemas declare `required` is present
# and well-typed here, so the body DOES convert — `responses/422.yaml`'s
# "could be converted to a resource, but there are semantic validation
# errors". `responses/400.yaml`'s "syntactically invalid ... content" owns the
# unconvertible half, which this body is not.
id: I_EHR_STATUS.set_ehr_queryable-rm_version_empty
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_queryable
capabilities: [EhrStatus]
profiles: [CORE]
test_purpose: >-
  Updating an EHR_STATUS whose ARCHETYPED block carries an empty rm_version is
  rejected, so RM class invariants are enforced below the resource root and not
  only on it.
description: "Update EHR_STATUS with an empty ARCHETYPED.rm_version"
spec_refs:
  - "RM common §archetyped (Rm_version_valid)"
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_queryable"
  - "SM openehr_platform §I_VALIDITY_CHECKER.content_valid"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
data_sets: [cnf.ehr_status.invalid.empty-rm-version]
flow:
  - step: 1
    call: get_ehr_status                 # the current version, for the If-Match precondition
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: set_ehr_queryable
    variant: invalid_body                # the variant binding takes the case-supplied payload
    with:
      ehr_id: "${ehr_id}"
      preceding_version_uid: "${status_version_uid}"
      ehr_status: "${ds:cnf.ehr_status.invalid.empty-rm-version}"
    expect: validation_failed
