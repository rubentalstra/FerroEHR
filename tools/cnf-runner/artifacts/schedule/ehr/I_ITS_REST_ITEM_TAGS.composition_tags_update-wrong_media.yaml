# The request-side media-type branch of the tag PUT: a request that DECLARES a
# payload media type the ITEM_TAG collection has no representation for —
# `text/plain` — cannot be processed and is refused 415, not with a parse
# error and not with an invariant error.
#
# DECISIVE DOCS-TEXT SENTENCE (ITS-REST overview Resources.md §"JSON Format"):
# "If the service cannot process the request payload as JSON format, it MUST
# respond with HTTP status code `415 Unsupported Media Type`"; §"XML Format"
# states the mirror rule and §"Simplified Formats" a third for the simplified
# types.
#
# WHY NO REPRESENTATION CAN CONSUME IT. The tag write has exactly one declared
# payload form — the released requestBody of
# operations/composition_tags_update.yaml is `application/json` only (an array
# of schemas/common/UpdateItemTag.yaml) — no ITEM_TAG type exists anywhere in
# ITS-XML (register AMB-97), and the Simplified Formats sub-specification
# models no tag payload. `text/plain` is therefore not among ANY of this
# resource's representations, so unlike §Simplified Formats' own 415 (which is
# conditioned on a service not supporting that format) nothing here is
# implementation-defined and the case is not option-gated.
#
# ONE BEHAVIOUR PER CASE (the I_EHR_COMPOSITION.create_composition-wrong_media
# and I_EHR_CONTRIBUTION.commit_contribution-wrong_media precedents): the body
# is the same valid tag array the variant-less binding sends, so only the
# declared media type distinguishes this exchange. The read-back keeps the
# refusal honest — a full-collection replace that ran anyway would have
# rewritten the collection.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-wrong_media
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
test_purpose: >-
  A COMPOSITION tag PUT declaring an unprocessable payload media type
  (text/plain) is refused as unsupported_media and leaves the addressed
  collection untouched.
description: "COMPOSITION tag PUT with a plain-wrong Content-Type"
spec_refs:
  - "ITS-REST overview Resources.md §JSON Format"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Resources.md §Simplified Formats"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "ITS-REST composition_tags_update.yaml §requestBody"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # a collection the refused replace must not disturb
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "alpha", value: "a" }
    expect: updated
  - step: 3
    call: composition_tags_update
    variant: wrong_media_type                     # sends Content-Type: text/plain on the canonical tag array
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "beta", value: "b" }
    expect: unsupported_media                     # Resources.md §JSON Format MUST
  - step: 4
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "alpha" }
      - { assert: field, path: "[1]", absent: true }
