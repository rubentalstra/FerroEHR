# The other half of the precondition rule: the EHR_STATUS PUT expects
# If-Match, so a request that omits it is refused rather than applied
# unconditionally.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "When the service expects `If-Match`
# for an operation, but the client does not provide it, the service SHOULD
# respond with `400 Bad Request`." That the EHR_STATUS PUT is such an
# operation comes from the same section's scope sentence: the header is
# required "by a small set of versioned resources in this specification, when
# the `preceding_version_uid` is not part of the endpoint path segment" —
# PUT /ehr/{ehr_id}/ehr_status carries no version segment.
#
# The omission is expressed by the `no_if_match` VARIANT binding, which simply
# does not declare the header; the request is otherwise byte-identical to the
# accepted update, so a red row localizes to the precondition alone.
#
# Step 3 shows the refusal really refused: the status still carries the v1
# state, so no version was committed without a precondition.
id: I_EHR_STATUS.set_ehr_queryable-missing_if_match
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.set_ehr_queryable
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
test_purpose: >-
  An EHR_STATUS update sent without the If-Match precondition header is
  refused as a client error and commits no version.
description: "Update EHR_STATUS without the If-Match precondition"
spec_refs:
  - "ITS-REST overview Requests_and_responses §If-Match and accidental overwrites"
  - "SM openehr_platform §I_EHR_STATUS.set_ehr_queryable"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is is_queryable = true
flow:
  - step: 1
    call: get_ehr_status                 # the payload the PUT modifies (the read-modify-write realization)
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2                              # first flip the flag, so an unconditionally-applied PUT would be visible
    call: clear_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: set_ehr_queryable
    variant: no_if_match                 # the variant binding omits the header entirely
    with: { ehr_id: "${ehr_id}" }
    expect: precondition_missing
  - step: 4
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    assert:
      - { assert: field, path: "is_queryable", equals: false }   # the step-2 state survived the refused PUT
