# The lower edge of the at-time branch: an instant BEFORE the versioned
# EHR_STATUS existed has no version to serve.
#
# RM common versioned_object.adoc §Functions guards the accessor with
# `Pre: has_version_at_time (a_time)` — below the first commit the
# precondition is false, so there is no VERSION for the service to return, and
# ITS-REST overview Requests_and_responses.md §HTTP status codes assigns that
# state its row: "404 | Not Found | The origin service did not find the target
# resource or is not willing to disclose that one exists".
#
# The queried instant is a FIXED literal in the extended ISO 8601 form the
# Resources.md §Datetime format MUST requires. It is deterministic without a
# capture: the runner seeds a freshly composed, empty SUT, so every commit in
# the run is later than the year 2000.
id: I_EHR_STATUS.get_ehr_status-at_time_before_first_version
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  An EHR_STATUS at-time read for an instant earlier than the first committed
  version finds no version and is refused as not found.
description: "Get EHR_STATUS at time, before the first version"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status_at_time"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}; its EHR_STATUS v1 is committed during this run
flow:
  - step: 1
    call: get_ehr_status
    variant: at_time
    with: { ehr_id: "${ehr_id}", a_time: "2000-01-01T00:00:00Z" }
    expect: not_found
