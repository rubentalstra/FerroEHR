# The upper edge on the ENVELOPE route: an instant after the newest commit
# still names the newest VERSION and is answered.
#
# No released text closes a version's extancy interval at the next commit or
# leaves it open — RM common versioned_object.adoc gives only
# `version_at_time (a_time): VERSION` with `Pre: has_version_at_time
# (a_time)`. Register AMB-70 carries the adjudicated fixed handling this case
# pins: a future T is a 200 carrying the newest version, never a 404.
#
# The envelope's own identifier is normative and not in dispute — RM common
# master06 §change_control: "VERSION objects are identified by a `_uid_`
# attribute of type `OBJECT_VERSION_ID`" — so the served uid names the
# version exactly.
id: I_EHR_STATUS.get_versioned_ehr_status-at_time_future
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  A versioned-EHR_STATUS version read for an instant later than every
  committed version serves the newest VERSION rather than refusing the
  request.
description: "Get EHR_STATUS VERSION at time, future instant"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "ITS-REST overview Resources §Datetime format"
  - "SM openehr_platform §I_EHR_STATUS.get_versioned_ehr_status"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2
    call: clear_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
    capture: { v2_uid: updated.status_version_uid }
  - step: 3
    call: get_versioned_ehr_status
    variant: at_time
    with: { ehr_id: "${ehr_id}", a_time: "2099-01-01T00:00:00Z" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      - { assert: field, path: "uid/value", equals: "${v2_uid}" }
