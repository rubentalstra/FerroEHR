# Two entries in ONE tag-PUT body that share the ITEM_TAG identity are ONE
# tag after the write, and the LAST occurrence is the one stored.
#
# THE IDENTITY (ITS-REST overview Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag, repeated verbatim in
# operations/composition_tags_update.yaml): "More than one ITEM_TAG may be
# associated with a single target, in which case they are uniquely identified
# by their `key` and `target_path` pair attributes." Both entries below carry
# key `alpha` and no `target_path`, so they are the SAME tag by that rule.
#
# THE SILENCE, and its fixed handling. The released array schema carries no
# `uniqueItems` and no released sentence says whether a duplicated pair is a
# refusal, a first-wins merge or a last-wins merge — register AMB-95:
# "Fixed handling: last-wins — the posted set is deduped on the identity pair
# with the final occurrence kept, mirroring a full-replace applied left to
# right." The full-replace reading is the released one the handling mirrors:
# the PUT "will effectively remove all ITEM_TAG associated with the given
# target" when the list is empty (composition_tags_update.yaml), i.e. the body
# IS the resulting collection, applied in the order given.
#
# WHY BOTH ASSERTIONS ARE NEEDED: `[1]` absent alone would also pass on a
# first-wins server, and the value alone would also pass on a server that kept
# both; together they pin exactly one surviving tag carrying the LAST posted
# value. Result ordering is undefined on every tag GET (register AMB-97), but
# a single-member list has only one index, so nothing here depends on order.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-duplicate_identity_last_wins
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-95]
test_purpose: >-
  A tag PUT body carrying the same (key, target_path) identity twice stores one
  tag, keeping the last occurrence's value.
description: "COMPOSITION tag PUT with a duplicated identity pair (last wins)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST composition_tags_update.yaml §description"
  - "RM item_tag.adoc §Attributes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "alpha", value: "first" }        # same key, same (absent) target_path …
        - { key: "alpha", value: "last" }         # … so this is the SAME tag, posted twice
    expect: updated
  - step: 3
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "alpha" }
      - { assert: field, path: "[0]/value", equals: "last" }   # the FINAL occurrence
      - { assert: field, path: "[1]", absent: true }           # exactly one — the pair was deduped
