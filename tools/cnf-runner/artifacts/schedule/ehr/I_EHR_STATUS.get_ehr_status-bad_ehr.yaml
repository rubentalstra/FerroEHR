# Official master06 case — EHR_STATUS retrieval for a non-existent EHR fails.
# "A random ehr_id" is a fixed arbitrary UUID literal absent on an empty server
#.
id: I_EHR_STATUS.get_ehr_status-bad_ehr
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [EhrStatus]
profiles: [CORE]
test_purpose: >-
  get_ehr_status on an ehr_id that does not exist is rejected as not found.
description: "Get status of a non-existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status"
  - "CNF platform_test_schedule master06 §get_ehr_status-bad_ehr"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: not_found                    # negative: "EHR with <ehr_id> doesn't exist"
