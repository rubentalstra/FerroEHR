# `Prefer: return=identifier` on a tag PUT resolves to the APPLIED default
# `return=minimal`: the write happens and the response is the empty 204, never
# an identifier body.
#
# THE UNSATISFIABLE CONTRACT (ITS-REST overview Requests_and_responses.md
# §"Prefer only identifier"): "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`). The
# response body SHOULD contain only the identifier of the affected resource
# ... a single JSON object with a single `uid` attribute." An ITEM_TAG has no
# uid — RM UML/classes/org.openehr.rm.common.item_tag.adoc declares `key`,
# `value`, `target`, `target_path` and `owner_id` and no identifier attribute,
# the identity being the (key, target_path) pair — and the affected resource
# is a COLLECTION, not one resource. There is nothing for the identifier body
# to carry, and no released sentence assigns the branch.
#
# THE FALLBACK IS THE RELEASED DEFAULT, not an invention:
# §"Representation details negotiation" — "If no `Prefer` header is provided,
# the default behavior is assumed to be `return=minimal`" — and
# responses/204_updated.yaml is "returned when the update operation was
# successful and the `Prefer` header is missing or is set to `return=minimal`".
# Register AMB-92 fixes exactly this handling: "return=identifier on a tag PUT
# resolves to the APPLIED default return=minimal (204, Preference-Applied:
# return=minimal) — there is no identifier to return, and claiming the
# identifier preference was applied would be false."
#
# WHY THE 204 IS THE PROOF: the identifier contract forbids that status
# outright ("never `204 No Content`"), so a server answering 204 has demonstrably
# NOT applied the identifier preference. The `Preference-Applied` value is
# pinned in the binding as an optional matcher — the docs text makes presence a
# MAY, so a server that omits it is not refuted, while one that sends it may
# not claim a preference it did not apply.
#
# The read-back proves the write itself still landed: an unhonourable response
# preference must not turn into a refusal of the request.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-prefer_identifier
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-92]
test_purpose: >-
  A COMPOSITION tag PUT sent with `Prefer: return=identifier` applies the
  default minimal preference — an empty 204 rather than an identifier body an
  ITEM_TAG collection has no identifier for — and still performs the write.
description: "COMPOSITION tag PUT with Prefer: return=identifier (applied as minimal)"
spec_refs:
  - "ITS-REST overview Requests_and_responses §Prefer only identifier"
  - "ITS-REST overview Requests_and_responses §Representation details negotiation"
  - "ITS-REST composition_tags_update.yaml §responses"
  - "RM item_tag.adoc §Attributes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: composition_tags_update
    variant: prefer_identifier                    # sends Prefer: return=identifier
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "alpha", value: "a" }
    expect: updated                               # 204 + the applied minimal preference (AMB-92)
  - step: 3                                       # the write landed regardless of the response preference
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "alpha" }
      - { assert: field, path: "[0]/value", equals: "a" }
      - { assert: field, path: "[1]", absent: true }
