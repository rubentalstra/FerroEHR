# The upper edge of the at-time branch: an instant AFTER the newest commit
# still names a version — the newest one — and is answered, not refused.
#
# No released text states this: RM common versioned_object.adoc gives only
# `version_at_time (a_time): VERSION` with `Pre: has_version_at_time (a_time)`
# and never says whether a version's extancy interval closes at the next
# commit or runs open-ended. Register AMB-70 carries the adjudicated fixed
# handling this case pins — a version is extant from its own commit instant
# until the next commit, so the newest version is extant at every later
# instant and a future T is a 200, never a 404.
#
# The queried instant is a FIXED literal in the extended ISO 8601 form the
# Resources.md §Datetime format MUST requires — never a clock reading, so two
# runners query the same instant.
id: I_EHR_STATUS.get_ehr_status-at_time_future
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]
ambiguities: [AMB-70]
test_purpose: >-
  An EHR_STATUS at-time read for an instant later than every committed version
  serves the newest version rather than refusing the request.
description: "Get EHR_STATUS at time, future instant"
spec_refs:
  - "RM common §versioned_object (version_at_time / has_version_at_time)"
  - "ITS-REST overview Resources §Datetime format"
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status_at_time"
applies: { rm: ">=1.0.2" }
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid, status_body: ok.body }
  - step: 2                              # a second version, so "newest" is a distinguishable state
    call: clear_ehr_queryable
    with: { ehr_id: "${ehr_id}", preceding_version_uid: "${status_version_uid}" }
    expect: updated
  - step: 3
    call: get_ehr_status
    variant: at_time
    with: { ehr_id: "${ehr_id}", a_time: "2099-01-01T00:00:00Z" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR_STATUS }
      - { assert: field, path: "is_queryable", equals: false }   # the v2 state — the newest version, not the first
