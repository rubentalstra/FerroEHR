# A tag PUT whose member object carries a property the write schema does not
# declare is refused, never silently ignored.
#
# GROUND: the released write schema is CLOSED —
# schemas/common/UpdateItemTag.yaml declares exactly `key` (required), `value`
# and `target_path`, and closes with `additionalProperties: false`. The
# ITS-REST docs text never discusses the tag write body's member set at all, so
# under the oracle order the released OAS grounds the strictness; the schema is
# the release's, not ours. `target` is the member this case sends because it is
# the realistic mistake: it IS declared on the READ shape
# (schemas/common/ItemTag.yaml: key/value/target_path/target/owner_id), so a
# client echoing back what it read posts exactly this body.
#
# THE CODE is the operation's declared 400 (responses/400.yaml, verbatim:
# "returned when the request could not be parsed or is invalid (e.g. malformed
# request URL syntax, missing required header or parameter, or syntactically
# invalid header, parameter or content)") — a body that violates the declared
# request schema is content that "is invalid". Register AMB-205 fixes the
# handling for the two schema-violation shapes (an undeclared member; a
# declared member of the wrong JSON type) across all seven tag PUTs, and
# AMB-93's 422 branch does not reach them: 422 is reserved there for a body
# that SATISFIES the schema and then fails an ITEM_TAG RM invariant.
#
# WHAT THIS RULES OUT is the tolerant read — accepting the request while
# dropping the member, which tells the client its body was stored as sent.
# The accepting twin is -key_target_path_identity, whose members carry only
# declared properties. The read-back proves the refusal was total.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-undeclared_member
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
ambiguities: [AMB-205]
test_purpose: >-
  A COMPOSITION tag PUT whose member carries a property the closed write schema
  does not declare is refused as a client error and stores nothing.
description: "COMPOSITION tag PUT with an undeclared member (400)"
spec_refs:
  - "ITS-REST OAS schemas/common/UpdateItemTag.yaml §additionalProperties"
  - "ITS-REST composition_tags_update.yaml §requestBody"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "reviewed", target: "anything" }   # `target` is a READ-shape member, not a write one
    expect: bad_request
  - step: 3
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
