# The DELETE arm of the container/VERSION disjointness: a key deleted through
# the VERSION-addressed route removes the VERSION's tag and leaves the
# same-keyed tag on the container untouched.
#
# THE LAW: RM common item_tag.adoc §Attributes types ITEM_TAG.target a
# UID_BASED_ID and glosses it "Identifier of target, which may be a
# `VERSIONED_OBJECT<T>` or a `VERSION<T>`" — two targets, two collections. The
# released DELETE carries the same dual-form addressing as its get/update
# siblings: the OBJECT_VERSION_ID form "is used to delete the tags a particular
# (target) version of the COMPOSITION version …, whereas the latter … is be
# used to delete the tags of the target VERSIONED_COMPOSITION container"
# (ITS-REST operations/composition_tags_delete.yaml). A delete that reached
# both would contradict that sentence.
#
# The two tags deliberately SHARE a key: the key is what the DELETE addresses,
# so a same-key pair is the only arrangement in which a cross-collection reach
# is observable at all.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional outright
# ("If the server does not support ITEM_TAGs, these headers will also be
# unsupported", ITS-REST overview Requests_and_responses.md §openehr-item-tag
# and openehr-version-item-tag), so the `ItemTags` capability may never gate
# CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_delete-version_container_disjoint
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_delete
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
test_purpose: >-
  A tag DELETE addressed by a COMPOSITION's version uid removes only the
  VERSION's tag and leaves the same-keyed container tag in place.
description: "COMPOSITION tag DELETE reaches only the addressed collection"
spec_refs:
  - "RM item_tag.adoc §Attributes"
  - "ITS-REST composition_tags_delete.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "shared", value: "container" }
    expect: updated
  - step: 3
    call: I_ITS_REST_ITEM_TAGS.composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${version_uid}"
      tags:
        - { key: "shared", value: "version" }
    expect: updated
  - step: 4                                       # delete the VERSION's tag by key
    call: composition_tags_delete
    with: { ehr_id: "${ehr_id}", uid_based_id: "${version_uid}", key: "shared" }
    expect: deleted
  - step: 5                                       # the version collection is now empty
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${version_uid}" }
    expect: ok
    assert:
      - { assert: returns, equals: [] }
  - step: 6                                       # the container's same-keyed tag survived
    call: I_ITS_REST_ITEM_TAGS.composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/value", equals: "container" }
      - { assert: field, path: "[1]", absent: true }
