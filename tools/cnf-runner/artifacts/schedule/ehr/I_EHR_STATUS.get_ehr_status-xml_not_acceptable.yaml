# The REFUSAL arm of the EHR_STATUS family's canonical-XML question (register
# AMB-167): a server that does not serve the EHR_STATUS resource in XML answers
# the unfulfillable `Accept` with 406 rather than with a representation the
# client did not ask for.
#
# Decisive released sentences (ITS-REST overview Resources.md §"XML Format"):
# "The client SHOULD use the `Accept: application/xml` request header to
# specify the expected XML response format. If the service cannot fulfill this
# aspect of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`." Corroborated by docs/overview/Requests_and_responses.md §"HTTP
# status codes", row `406 Not Acceptable`: "The target resource does not have a
# current representation that would be acceptable to the user".
#
# WHY THIS IS AN ARM AND NOT A UNIVERSAL RULE: §"Data representation" leaves
# canonical XML to the service ("Services MUST support at least one of the
# openEHR **XML** or **JSON** canonical formats"), and the published XSDs
# declare no document element for EHR_STATUS — the RM `EHR_STATUS` complexType
# (ITS-XML RM Ehr.xsd) is LOCATABLE-derived, so only the generic abstract
# `items` root could carry it, and no released sentence assigns that root to
# this resource. Serving the resource in XML under a root name no released
# sentence assigns is therefore as conformant as refusing it, and neither may
# be asserted of every server. The opposite arm is the mirror case
# I_EHR_STATUS.get_ehr_status-xml, gated on `ehr-status-xml-supported`.
#
# No format axis: this row asserts the refusal discipline itself, which is
# judged on a party regardless of its XML technology profile.
id: I_EHR_STATUS.get_ehr_status-xml_not_acceptable
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_ehr_status
capabilities: [EhrStatus]
profiles: [CORE]
option: ehr-status-xml-unsupported     # AMB-167 option_select branch
ambiguities: [AMB-167]
test_purpose: >-
  On a server that declares no canonical-XML support for the EHR_STATUS
  resource, an EHR_STATUS read requested with `Accept: application/xml` is
  refused with 406 rather than answered in a representation the client did not
  accept.
description: "Get EHR_STATUS with Accept: application/xml on an XML-less EHR_STATUS resource (406)"
spec_refs:
  - "SM openehr_platform §I_EHR_STATUS.get_ehr_status"
  - "ITS-REST overview Resources.md §Data representation"
  - "ITS-REST overview Resources.md §XML Format"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
guards:
  - "Whether the EHR_STATUS resource is served in canonical XML is statement-declared, not spec-mandated — the published XSDs declare no document element for EHR_STATUS and ITS-REST overview Resources.md §Data representation leaves the format to the service, so offering and refusing are both conformant (register AMB-167)"
requires:
  server: any
  ehr: { commits: any }                  # mints ${ehr_id}
flow:
  - step: 1
    call: get_ehr_status
    format: canonical-xml                # the unfulfillable Accept
    with: { ehr_id: "${ehr_id}" }
    expect: not_acceptable
