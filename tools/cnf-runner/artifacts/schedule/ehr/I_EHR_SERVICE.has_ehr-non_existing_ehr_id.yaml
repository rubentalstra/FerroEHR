# Official master06 case — existence check by a random ehr_id returns negative.
# "A random ehr_id" is encoded as a fixed arbitrary UUID literal that cannot
# exist on an empty server (see the schedule/ehr REQUIREMENTS.md judgment call).
id: I_EHR_SERVICE.has_ehr-non_existing_ehr_id
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.has_ehr
capabilities: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  has_ehr on an ehr_id that does not exist reports the EHR does not exist.
description: "Check has EHR with non existing EHR"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.has_ehr"
  - "CNF platform_test_schedule master06 §has_ehr-non_existing_ehr_id"
applies: { rm: ">=1.0.2" }
requires: { server: empty }              # "The server should be empty (no EHRs, no commits, no OPTs)"
flow:
  - step: 1
    call: has_ehr
    with: { ehr_id: "11111111-1111-4111-8111-111111111111" }
    expect: not_found                    # negative: "the EHR with <ehr_id> does not exist"
