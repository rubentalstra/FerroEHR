# The HTTP-method discipline of a known resource, cased on the EHR API's
# collection resource `/ehr`: a request naming a method the specification
# recognizes but that resource does not serve is answered 405, and the 405
# carries the `Allow` field naming the methods the resource does support.
#
# DECISIVE DOCS TEXT — ITS-REST overview `Requests_and_responses.md`
# §HTTP Methods: "If a method is recognized but not allowed for the target
# resource, the response SHOULD be `405 Method Not Allowed` status code." The
# same section fixes what "recognized" means ("The following subset is used in
# this specification": GET, HEAD, POST, PUT, DELETE, OPTIONS) and names the
# authority for method semantics ("HTTP Methods are described by RFC 9110"),
# whose §15.5.6 makes the header mandatory: "The origin server MUST generate
# an Allow header field in a 405 response containing a list of the target
# resource's currently supported methods".
#
# WHY DELETE ON `/ehr` IS THE WRONG METHOD: the released resource assigns POST
# and GET and no DELETE (specifications/ehr.openapi.yaml `'/ehr'` — cited AS
# the OAS, which fills the docs text's silence about paths). So the method is
# recognized by the specification and unallowed by the resource — exactly the
# antecedent of the quoted SHOULD, and NOT the overlapping unrecognized-method
# antecedent of the sentence before it, which register AMB-60 adjudicates and
# which stays uncased (the closed method vocabulary admits no arbitrary
# token).
#
# ONE BEHAVIOUR: nothing is created, read or validated here — the exchange is
# refused for its method alone, before any EHR is addressed, which is why the
# case needs no EHR and no template.
#
# THE `Allow` ASSERTION is the executed half (#403, exec/headers.rs): both
# released methods of the resource must appear in the field. Order is
# unconstrained by RFC 9110 §10.2.1 and a service may support more methods
# than the release assigns (HEAD, OPTIONS), so the matcher asserts membership
# of the two and tolerates order and extras rather than pinning a set no
# source fixes.
id: I_EHR_SERVICE.create_ehr-wrong_method
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrApi]
exercises: [EhrOperations]
profiles: [CORE]
test_purpose: >-
  A recognized method the target resource does not serve is answered 405
  Method Not Allowed, carrying an Allow field that lists the methods the
  resource does support.
description: "Recognized-but-unallowed method on /ehr answers 405 with Allow"
spec_refs:
  - "ITS-REST overview Requests_and_responses §HTTP Methods"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr"
applies: { its_rest: ">=1.1.0" }
requires:
  server: any
ambiguities: [AMB-60]
flow:
  - step: 1
    call: create_ehr
    variant: wrong_method                # DELETE /ehr — recognized method, unallowed on this resource
    expect: method_not_allowed           # §HTTP Methods SHOULD; the Allow field is asserted by the binding
