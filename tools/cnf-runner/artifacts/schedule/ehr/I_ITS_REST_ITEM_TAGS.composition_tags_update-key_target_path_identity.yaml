# ITEM_TAG identity is the (key, target_path) PAIR, not the key: two tags that
# share a key but differ in target_path are two distinct tags and both survive
# a PUT round-trip.
#
# THE LAW, released and repeated: "More than one ITEM_TAG may be associated
# with a single target, in which case they are uniquely identified by their
# `key` and `target_path` pair attributes" — ITS-REST overview
# Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag, and
# verbatim again in operations/composition_tags_get.yaml and
# composition_tags_update.yaml. The RM makes the pair meaningful: `target_path`
# is an "Optional archetype (i.e. AQL) or RM path within `_target_`, used to tag
# a fine-grained element" (RM common item_tag.adoc §Attributes).
#
# WHY THE ASSERTIONS ARE SOUND UNDER AN UNDEFINED LIST ORDER: result ordering is
# unstated on every tag GET (register AMB-97), so nothing may depend on which
# tag lands at which index. The case therefore asserts (a) that BOTH members
# carry the shared key — true at either index — and (b) that there is no third
# member, which is what refutes a key-only identity: a server collapsing the
# two on the key alone answers with ONE tag, so `[1]/key` resolves to nothing
# and the row goes red.
#
# REPRESENTATIVE COVERAGE: the identity sentence is byte-repeated across all
# seven typed families, which the catalogue drives on the three DISTINCT
# service seams the released surface has — this case (COMPOSITION),
# I_ITS_REST_ITEM_TAGS.ehr_status_tags_update-key_target_path_identity
# (EHR_STATUS) and
# I_ITS_REST_ITEM_TAGS.person_tags_update-key_target_path_identity (the
# demographic store). The four remaining party kinds share the person seam and
# are tracked as per-binding coverage_gap entries in vocab/wire_surface.yaml.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-key_target_path_identity
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
test_purpose: >-
  Two ITEM_TAGs sharing a key but differing in target_path coexist on one
  COMPOSITION container and both survive the PUT round-trip.
description: "COMPOSITION tags: (key, target_path) is the identity"
spec_refs:
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST composition_tags_update.yaml §description"
  - "ITS-REST composition_tags_get.yaml §description"
  - "RM common master07-tags.adoc §Semantics"
  - "RM item_tag.adoc §Attributes"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      versioned_object_uid: created.versioned_object_uid
  - step: 2
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"       # the HIER_OBJECT_ID form — the VERSIONED_COMPOSITION container
      tags:
        - { key: "flag", value: "start", target_path: "/context/start_time/value" }
        - { key: "flag", value: "setting", target_path: "/context/setting/value" }
    expect: updated
  - step: 3
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/key", equals: "flag" }
      - { assert: field, path: "[1]/key", equals: "flag" }   # both members carry the shared key, at either index
      - { assert: field, path: "[2]", absent: true }         # exactly two — no duplicate, no third
      - { assert: returns, matches: "/context/start_time/value" }
      - { assert: returns, matches: "/context/setting/value" }
