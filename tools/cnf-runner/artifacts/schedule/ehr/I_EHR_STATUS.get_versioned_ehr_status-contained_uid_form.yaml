# The FORM of the uid a served top-level object carries, on the EHR_STATUS —
# the one behaviour on which two RELEASED sources give different answers
# (register AMB-65).
#
# The RM says copy the leading Guid only: RM common
# master03-archetyped_package.adoc §Unique Node Identification — "the top-level
# types such as `COMPOSITION`, `EHR_STATUS`, `PARTY` etc for which it is
# recommended to set the `_uid_` value to a copy of the `_uid.object_id()_`
# value of the owning `VERSION` object … i.e. the leading Uid, which is
# normally a Guid", and the RM ehr EHR_STATUS class restates it for this very
# class. The ITS-REST docs text says copy the whole three-part value:
# Resources.md §Identifier types — "the inherited `uid` attribute … be
# populated using the `uid` copied from the enclosing VERSION object. For
# example, if an ORIGINAL_VERSION.uid is
# `87284370-2D4B-4e3d-A3F3-F303D2F4F34B::uk.nhs.ehr1::2`, then this value
# should be copied to the … uid attribute."
#
# AMB-65 adjudicates the wire in favour of the ITS-REST form, because the same
# chapter builds request addressing on that value — "the COMPOSITION identifier
# `8849182c-…::openEHRSys.example.com::1`, taken from COMPOSITION.uid.value,
# which also implies that the VERSIONED_OBJECT identifier is `8849182c-…` and
# the latest version is `1`" — so truncating to the object_id deletes the
# version coordinate a client parses out of the served body, while the RM form
# stays recoverable from the full one as its first segment.
#
# The case does not have to trust where the version identity came from: step 2
# ADDRESSES the version by that identity in the path, so a 200 is itself the
# server's confirmation that it served exactly that version, and the two uid
# assertions then compare the served envelope and its contained object against
# the same addressed value.
#
# Kept at OPTIONS: the adjudication picks one of two released recommendations,
# so a server following the RM's object_id()-only wording is not in breach of
# the RM. The ORIGINAL_VERSION's OWN uid is not part of that dispute — RM
# common master06 §change_control fixes it as the three-part OBJECT_VERSION_ID
# outright — but it shares the case so the contrast is visible in one row.
id: I_EHR_STATUS.get_versioned_ehr_status-contained_uid_form
kind: functional
component: EHR
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
capabilities: [EhrStatus]
exercises: [Versioning]
profiles: [CORE]                         # EhrStatus is Core-tier; the WIRE form is assigned by the ITS-REST docs text's own worked example (Resources.md §Resource identification: the full three-part value "should be copied") — AMB-65/UPR-27 carries the RM-side conflict upstream
ambiguities: [AMB-65]
test_purpose: >-
  An EHR_STATUS ORIGINAL_VERSION read at an addressed version carries that
  version identity twice — as the VERSION's own uid, and copied into the
  contained EHR_STATUS in the same full three-part OBJECT_VERSION_ID form,
  not truncated to its leading object_id.
description: "Contained EHR_STATUS uid is the full version identifier"
spec_refs:
  - "ITS-REST overview Resources §Identifier types"
  - "RM common §change_control (master06 — VERSION.uid is an OBJECT_VERSION_ID)"
  - "RM common §archetyped (master03 §Unique Node Identification)"
  - "SM openehr_platform §I_EHR_STATUS.get_versioned_ehr_status"
applies: { rm: ">=1.0.2" }
guards:
  - "The contained-object uid FORM rests on the AMB-65 adjudication: RM common master03 §Unique Node Identification recommends the leading object_id() only, while ITS-REST Resources.md §Identifier types recommends the whole enclosing VERSION uid, over the same worked example. The wire follows ITS-REST because §Identifier types derives request addressing from the served value. A server following the RM wording answers a bare Guid here and is not in breach of the RM"
requires:
  server: any
  ehr: { commits: none }                 # mints ${ehr_id}
flow:
  - step: 1
    call: I_EHR_STATUS.get_ehr_status
    with: { ehr_id: "${ehr_id}" }
    expect: ok
    capture: { status_version_uid: ok.status_version_uid }
  - step: 2
    call: I_EHR_STATUS.get_versioned_ehr_status
    variant: version
    with:
      ehr_id: "${ehr_id}"
      version_uid: "${status_version_uid}"
    expect: ok
    assert:
      - { assert: instance_of, rm_type: ORIGINAL_VERSION }
      # RM common master06 §change_control — "VERSION objects are identified by
      # a `_uid_` attribute of type `OBJECT_VERSION_ID`": not in dispute.
      - { assert: field, path: "uid/value", equals: "${status_version_uid}" }
      # AMB-65 — the contained top-level object copies the FULL value, the
      # ITS-REST Resources.md §Identifier types form.
      - { assert: field, path: "data/uid/value", equals: "${status_version_uid}" }
