# A create-with-id whose ehr_id is FRESH but whose subject already owns an
# EHR: the second of the two duplicates the create operation can generate, on
# the path where the released text does not say whether it applies.
#
# The id-duplicate half is I_EHR_SERVICE.create_ehr-with_ehr_id; this case
# isolates the subject half so a red row names exactly one of them. Both
# answer the same status — ITS-REST overview Requests_and_responses.md §HTTP
# status codes, row 409: "Indicates that the request could not be processed
# because it might generate a duplicate or a conflict" — and no released
# sentence gives them distinguishable wire signals, so they are told apart by
# CASE, never by outcome kind.
#
# NOT GATING, and why (register AMB-63, fixed_handling). The released sources
# establish the subject refusal only on the id-LESS create: SM
# i_ehr_service.adoc §create_ehr_for_subject lists the error
# `ehr_for_subject_already_exists`, while §create_ehr_for_subject_with_id — the
# operation this wire form realizes (the subject travels in
# EHR_STATUS.subject; ITS-REST 1.1.0 surfaces no separate for-subject
# endpoint) — lists only `ehr_create_fail_duplicate_id` and says nothing about
# a taken subject. Nothing in its text lifts the refusal either, and the same
# document's §get_ehrs_for_subject points the other way again ("Retrieve EHR
# or EHRs that have `ehr_status.subject_id` = supplied subject id", returning a
# List). The catalogue therefore carries the refusal to this path as the
# AMB-63 fixed handling and keeps the case at OPTIONS, reported and never
# gating — the same treatment SF-WT-web_template_json_accept gets for AMB-58.
# It flips to CORE if a future release states the scope.
#
# The subject is this case's own (cnf-subject-04@cnf): the SUT is shared
# across the catalogue and a subject may own at most one EHR under the reading
# above, so a subject-keyed case that borrowed another case's fixture would
# fail on ordering rather than on the behaviour under test.
id: I_EHR_SERVICE.create_ehr-with_ehr_id_subject_taken
kind: functional
component: EHR
sm_operation: I_EHR_SERVICE.create_ehr
capabilities: [EhrOperations]
exercises: [EhrApi]
profiles: [CORE]                         # EhrOperations is Core-tier; the sibling two_ehrs_same_patient already gates CORE on the same AMB-63-adjudicated uniqueness
ambiguities: [AMB-63]
test_purpose: >-
  A create-with-id naming a fresh ehr_id but a subject that already owns an
  EHR is refused as a duplicate, and the refused id stays unused.
description: "Create EHR with a fresh ehr_id for a subject that already has one"
spec_refs:
  - "SM openehr_platform §I_EHR_SERVICE.create_ehr_for_subject_with_id"
  - "ITS-REST overview Requests_and_responses §HTTP status codes"
  - "RM ehr §ehr_package (EHR_STATUS.subject)"
applies: { rm: ">=1.0.2" }
guards:
  - "The subject refusal on the client-supplied-id create path rests on the AMB-63 fixed handling: SM i_ehr_service.adoc names the error `ehr_for_subject_already_exists` on create_ehr_for_subject but not on create_ehr_for_subject_with_id, and §get_ehrs_for_subject returns a List of \"EHR or EHRs\" for one subject — the released sources neither state nor deny the scope. The id-duplicate refusal, which IS stated (`Pre_no_duplicate`), gates in I_EHR_SERVICE.create_ehr-with_ehr_id"
requires: { server: any }
data_sets: [cnf.ehr_status.with_subject.e]
parameters:
  iteration: reset_per_row
  matrix: { columns: [ehr_id], rows: [[provided]] }
flow:
  - step: 1
    call: create_ehr                     # id-less create; the subject comes in the EHR_STATUS
    with: { ehr_status: "${ds:cnf.ehr_status.with_subject.e}" }
    expect: created
    capture: { first_ehr_id: created.ehr_id }
  - step: 2
    call: create_ehr                     # FRESH ehr_id, SAME subject
    variant: with_ehr_id
    with:
      ehr_id: "${row.ehr_id}"
      ehr_status: "${ds:cnf.ehr_status.with_subject.e}"
    expect: already_exists
  - step: 3                              # the refused id was not consumed
    call: has_ehr
    with: { ehr_id: "${row.ehr_id}" }
    expect: not_found
  - step: 4                              # the subject's original EHR is untouched
    call: get_ehrs_for_subject
    with: { subject_id: "cnf-subject-04", subject_namespace: "cnf" }
    expect: ok
    assert:
      - { assert: instance_of, rm_type: EHR }
      - { assert: field, path: "ehr_id/value", equals: "${first_ehr_id}" }
postconditions:
  - assert: state
    text: >-
      The subject still has exactly the EHR created in step 1, and the ehr_id
      the refused create named exists nowhere (verified by steps 3 and 4)
