# The container-addressed and VERSION-addressed tag collections of the SAME
# COMPOSITION are DISJOINT: each PUT replaces only the addressed collection and
# each GET reaches only the addressed one.
#
# THE LAW: RM common item_tag.adoc §Attributes types ITEM_TAG.target as a
# UID_BASED_ID and glosses it "Identifier of target, which may be a
# `VERSIONED_OBJECT<T>` or a `VERSION<T>`" — two different targets, therefore
# two different tag sets. ITS-REST carries the same split on the wire twice
# over: the wrapper headers are split by target ("`openehr-item-tag` applies to
# *VERSIONED_OBJECT* targets"; "`openehr-version-item-tag` applies to a
# specific target *VERSION* within a VERSIONED_OBJECT" — overview
# Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag),
# and the dual-form `uid_based_id` paragraph says the OBJECT_VERSION_ID form
# "is used to update the tags of a particular COMPOSITION version … whereas the
# latter … the target VERSIONED_COMPOSITION container"
# (operations/composition_tags_update.yaml).
#
# The single-member expectation on each read is what makes the disjointness
# executable without depending on list order: if the two collections were one,
# each read would answer with two members and `[1]` would resolve.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved catalogue pseudo-interface
# (register AMB-161), not an SM operation — the vendored SM models no tag
# concept at all. It is pinned in NON_SM_REST_OPERATIONS
# (tools/cnf-runner/src/validate.rs), so the operation is enumerated by Axis 1
# and held to the same coverage obligation as an SM one.
#
# COMPONENT is taxonomy only: the CNF Platform Test Schedule has no ITEM_TAG
# chapter, so the case takes the chapter of the resource it tags.
#
# TIER: OPTIONS, honestly — the release states tag support is optional
# outright ("If the server does not support ITEM_TAGs, these headers will also
# be unsupported", ITS-REST overview Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag), so the `ItemTags` capability
# may never gate CORE or STANDARD.
id: I_ITS_REST_ITEM_TAGS.composition_tags_update-version_container_disjoint
kind: functional
component: EHR_COMPOSITION
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
capabilities: [ItemTags]
exercises: [EhrApi, CompositionOps]
profiles: [OPTIONS]
test_purpose: >-
  Tags written against a COMPOSITION's version uid and against its container
  uid form two disjoint collections; each read returns only its own.
description: "COMPOSITION tags: version and container collections are disjoint"
spec_refs:
  - "RM common master07-tags.adoc §Semantics"
  - "RM item_tag.adoc §Attributes"
  - "ITS-REST overview Requests_and_responses §openehr-item-tag and openehr-version-item-tag"
  - "ITS-REST composition_tags_update.yaml §description"
applies: { rm: ">=1.0.2", its_rest: ">=1.1.0" }   # ITEM_TAGs are Release-1.1.0 behaviour — ITS-REST overview Amendment_record.md §Release-1.1.0 (SPECITS-77)
formats: [canonical-json]
requires:
  server: any
  templates: [cnf.opt.minimal_event]
  ehr: { commits: none }
data_sets: [cnf.composition.minimal_event.v1]
flow:
  - step: 1
    call: I_EHR_COMPOSITION.create_composition
    with: { ehr_id: "${ehr_id}", composition: "${ds:cnf.composition.minimal_event.v1}" }
    expect: created
    capture:
      version_uid: created.version_uid
      versioned_object_uid: created.versioned_object_uid
  - step: 2                                       # container-addressed write
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${versioned_object_uid}"
      tags:
        - { key: "scope", value: "container" }
    expect: updated
  - step: 3                                       # VERSION-addressed write
    call: composition_tags_update
    with:
      ehr_id: "${ehr_id}"
      uid_based_id: "${version_uid}"
      tags:
        - { key: "scope", value: "version" }
    expect: updated
  - step: 4                                       # the container collection is untouched by step 3
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${versioned_object_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/value", equals: "container" }
      - { assert: field, path: "[1]", absent: true }
  - step: 5                                       # and the version collection holds only its own
    call: composition_tags_get
    with: { ehr_id: "${ehr_id}", uid_based_id: "${version_uid}" }
    expect: ok
    assert:
      - { assert: field, path: "[0]/value", equals: "version" }
      - { assert: field, path: "[1]", absent: true }
