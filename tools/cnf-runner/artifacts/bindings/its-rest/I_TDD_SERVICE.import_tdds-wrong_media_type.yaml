# EXTENSION realization of I_TDD_SERVICE.import_tdds, variant wrong_media_type:
# the BATCH import is sent DECLARING `Content-Type: application/xml` on a route
# whose body form is the SM `List<String>` as a JSON array.
#
# The mirror of the single-import variant, and deliberately the OPPOSITE
# declaration: the single import takes XML and refuses JSON, the batch takes
# JSON and refuses XML, so one media-type rule cannot accidentally stand in for
# the other.
#
# NO RELEASED WIRE EXISTS (register AMB-34), so the refusal rule is the SERVED
# route's own documented contract, not a released MUST.
sm_operation: I_TDD_SERVICE.import_tdds
its: its-rest
variant: wrong_media_type
extension:
  family: message-tdd
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract/TDD API at all, so the SM
    import_tdds has no released wire; this product serves the operation on its
    own /message/tdd/{ehr_id}/batch route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc; SM
    docs/UML/classes/i_tdd_service.adoc (import_tdds); ITS-REST specifications (the seven
    released API groups, none of them message/extract/tdd); ITS-REST specifications/docs (no
    such API); no openEHR spec governs this — our own design/extension
  ambiguity: AMB-34
request:
  method: POST
  path: /message/tdd/{an_ehr_id}/batch
  body: tdds
  headers:
    Content-Type: application/xml         # the DECLARED non-JSON payload type under test
outcomes:
  unsupported_media: { status: 415 }
