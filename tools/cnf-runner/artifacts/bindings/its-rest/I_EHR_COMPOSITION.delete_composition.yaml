# Wire realization of I_EHR_COMPOSITION.delete_composition for ITS-REST 1.1.0.
# The SM delete_composition(ehr_id, a_version_uid) logically deletes a
# COMPOSITION; a_version_uid identifies the current top VERSION and is realized
# as the path `uid_based_id` (OBJECT_VERSION_ID form) — the same
# preceding_version_uid realization pattern as update_composition (ITS-REST overview §If-Match).
# Sources: specifications/operations/composition_delete.yaml (204/400/404/409),
# responses/204_version_deleted.yaml, 400_already_deleted.yaml,
# 404_unknown_ehr_id_or_uid_based_id.yaml, 409_COMPOSITION_with_uid_based_id.yaml;
# parameters/path/uid_based_id_as_version_uid.yaml.
sm_operation: I_EHR_COMPOSITION.delete_composition
its: its-rest
request:
  method: DELETE
  path: /ehr/{ehr_id}/composition/{preceding_version_uid}
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  deleted:
    status: 204                           # 204_version_deleted.yaml — logical delete performed
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } }
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # DELETE — overview §Deprecated headers
  already_deleted: { status: 400 }        # 400_already_deleted.yaml — resource already deleted
  not_found: { status: 404 }              # 404_unknown_ehr_id_or_uid_based_id.yaml — unknown ehr_id or version uid
  conflict:
    status: 409                           # 409_COMPOSITION_with_uid_based_id.yaml — uid_based_id is not the latest version
    headers:
      ETag: latest-version-uid
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # error response — overview §Location (creation/redirect only)
captures:
  version_uid:
    from: header ETag                     # the new (deleted) VERSION uid (204_version_deleted.yaml ETag)
    strip: weak-quotes
server_assigned: [uid, context/_uid]
