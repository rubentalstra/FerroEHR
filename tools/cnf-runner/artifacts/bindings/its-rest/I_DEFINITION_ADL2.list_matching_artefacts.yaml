# Wire realization of I_DEFINITION_ADL2.list_matching_artefacts for ITS-REST
# 1.1.0. The SM operation lists artefacts whose identifiers match a regex
# pattern (Error: invalid_id_pattern). ITS-REST 1.1.0 has no generic
# match-by-pattern endpoint; the closest wire is the ADL2 list's
# filter_template_id query parameter, which matches with WILDCARDS (`*`), not a
# regex, and defines no invalid-pattern error path (list returns 200 only).
# So this binding realizes the positive filter behaviour only; the SM
# invalid_id_pattern negative is unrealizable on this wire (AMB-37).
# Sources: specifications/operations/definition_template_adl2_list.yaml (200),
# parameters/query/filter_template_id.yaml ("Pattern for matching template_id
# (supports wildcards *)"), responses/200_TemplateList_adl2.yaml.
sm_operation: I_DEFINITION_ADL2.list_matching_artefacts
its: its-rest
request:
  method: GET
  path: /definition/template/adl2                 # definition_template_adl2_list.yaml
  query:
    template_id: "${id_pattern}"                  # filter_template_id.yaml (wildcard glob, not regex)
  headers:
    Accept: application/json                       # Accept_JSON.yaml
outcomes:
  ok: { status: 200, headers: { Content-Type: negotiated } }   # 200_TemplateList_adl2.yaml
