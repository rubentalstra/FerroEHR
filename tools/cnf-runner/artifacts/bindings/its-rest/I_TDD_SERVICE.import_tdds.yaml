# EXTENSION realization of I_TDD_SERVICE.import_tdds.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the release publishes SEVEN API groups (overview, system, ehr,
# demographic, query, definition, admin) and no message / EHR-Extract / TDD
# group in either the docs text (specifications/docs/**) or the OAS
# (specifications/*.openapi.yaml); there are no message_*/extract_*/tdd_*
# operations anywhere in specifications/operations. Register AMB-34.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `POST /message/tdd/{ehr_id}/batch`, declared in the `message-tdd` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the Tds CAPABILITY verdict(s)
# only and never ITS-REST wire conformance; the capability-matrix rows carry
# `realization: extension`, which may never be `required` (owner ruling
# 2026-07-28).
sm_operation: I_TDD_SERVICE.import_tdds
its: its-rest
extension:
  family: message-tdd
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract/TDD API at all, so the SM
    import_tdds has no released wire; this product serves the operation on its
    own /message/tdd/{ehr_id}/batch route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc +
    docs/UML/classes/i_tdd_service.adoc (import_tdds) vs released ITS-REST
    specifications/*.openapi.yaml (seven groups, none of them
    message/extract/tdd) + specifications/docs/** (no such API) — no openEHR
    spec governs the extension route, our own design/extension
  ambiguity: AMB-34
request:
  method: POST
  path: /message/tdd/{an_ehr_id}/batch
  # The SM `List<String>` of TDD documents, as a JSON array of XML strings.
  body: tdds
  headers:
    Content-Type: application/json
outcomes:
  # Every TDD is converted before any is committed, so the batch is
  # all-or-nothing and a fulfilled call created every COMPOSITION. Nothing
  # released governs this route; the status choice is ours (RFC 9110 §15.3.2).
  created:
    status: 201
  # An EMPTY `List<String>` is fulfilled with nothing created: the operation's
  # `an_ehr_id` precondition is still checked, but no document is converted and
  # no COMPOSITION is committed. Nothing released governs this route; the
  # status choice is ours and it is NOT `created` — RFC 9110 §15.3.2 assigns
  # 201 to a request that "has been fulfilled and has resulted in one or more
  # new resources being created", which an empty batch has not, so §15.3.1's
  # 200 carries the empty result list instead.
  ok_empty:
    status: 200
  # SM `precondition_violation` — a document does not conform to its
  # operational template; nothing is committed.
  bad_request:
    status: 400
  # SM `ehr_id_does_not_exist` / `template_does_not_exist`.
  not_found:
    status: 404
  # Any document is not well-formed XML, or any produced COMPOSITION fails
  # validation; nothing is committed.
  validation_failed:
    status: 422
