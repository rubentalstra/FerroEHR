# Wire realization of I_DEFINITION_QUERY.list_queries for ITS-REST 1.1.0.
#
# Ground (ITS-REST DOCS TEXT + the released operation):
#
# - the route and its matching rule — specifications/operations/
#   definition_query_list.yaml: "Retrieves list of all stored queries on the
#   system matched by `qualified_query_name` as pattern", with the worked
#   example "`GET …/v1/definition/query/org.openehr` will list all versions of
#   all queries with names starting with `org.openehr`" — a PREFIX over the
#   qualified name, returning every stored version of every match.
# - `200` — docs/overview/Requests_and_responses.md §"HTTP status codes", row
#   `200 OK`. It is the operation's only declared branch: a pattern matching
#   nothing is a fulfilled request answering an empty list, and the listing
#   order is name + SEMVER ascending (register AMB-124).
# - `Content-Type` — docs/overview/Resources.md §"JSON Format": "Proper header
#   `Content-Type: application/json` MUST be present in the response of the
#   service unless the response has no content body (HTTP status code `204`)."
# - `Location: absent` — docs/overview/Requests_and_responses.md §Location: "It
#   MUST NOT be used to indicate an alternate representation of an existing
#   resource (e.g. via `GET` method)"; §Deprecated headers deprecates the read
#   usage outright.
# - `406` — docs/overview/Resources.md §"XML Format": "The client SHOULD use the
#   `Accept: application/xml` request header to specify the expected XML
#   response format. If the service cannot fulfill this aspect of the request,
#   it MUST respond with HTTP status code `406 Not Acceptable`." The released
#   stored-query list has one representation (the JSON QueryList), so an XML
#   `Accept` cannot be fulfilled.
#
# NOTE: header matchers are EXECUTED assertions (exec/headers.rs) — a violated
# declaration is a red row.
sm_operation: I_DEFINITION_QUERY.list_queries
its: its-rest
request:
  method: GET
  path: /definition/query/{qualified_query_name}      # definition_query_list.yaml
  headers:
    Accept: application/json                           # Accept_JSON.yaml
formats: [canonical-json]
outcomes:
  ok:
    status: 200                                        # Requests_and_responses.md §HTTP status codes, row 200
    headers:
      Content-Type: negotiated                         # Resources.md §JSON Format MUST
      Location: absent                                 # read — overview §Location / §Deprecated headers
  not_acceptable: { status: 406 }                      # Resources.md §XML Format MUST (single JSON representation)
