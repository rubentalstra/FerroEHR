# Wire realization of I_EHR_STATUS.get_versioned_ehr_status, variant `version`:
# read a specific EHR_STATUS ORIGINAL_VERSION envelope (uid, commit_audit,
# lifecycle_state, data, signature) — the RM VERSIONED_OBJECT.version_with_id
# accessor on the versioned EHR_STATUS, realized as the /version/{version_uid}
# sub-resource. Surfaces VERSION.signature (RM common master06 §Digital
# Signature) for the SIG-VERSION signature family on EHR_STATUS versions
# (master06 signs "each Version of any logical item", not just COMPOSITION).
# Sources (ITS-REST DOCS TEXT — the wire oracle, not the stalled OAS):
#   - Resource: overview Resources.md §Resource identification — a VERSION is
#     retrievable by `version_uid`; "versioned entities: VERSIONED_COMPOSITION,
#     VERSIONED_EHR_STATUS, etc. or their contained VERSION instances". The
#     EHR_STATUS is a per-EHR singleton, so its versioned-object URI carries no
#     {versioned_object_uid} segment (unlike versioned_composition): the version
#     sub-resource is /versioned_ehr_status/version/{version_uid}.
#   - `ok` 200 / `not_found` 404: overview Requests_and_responses.md §HTTP
#     status codes table ("200 | OK | The request succeeded …"; "404 | Not Found
#     | The origin service did not find the target resource …").
#   - signature: RM common master06 §change_control (ORIGINAL_VERSION.signature).
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
its: its-rest
variant: version
request:
  method: GET
  path: /ehr/{ehr_id}/versioned_ehr_status/version/{version_uid}
formats: [canonical-json, canonical-xml]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # overview §HTTP status codes (200 OK — payload = the ORIGINAL_VERSION)
    headers:
      Content-Type: negotiated
      ETag: 'pattern:W/"[^"]+"'           # the weakness indicator is a MUST — overview §Deprecated headers
      Last-Modified: present
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }              # overview §HTTP status codes (404 — target resource not found)
