# Wire realization of the RELEASED operation `versioned_party_get` for
# ITS-REST 1.1.0 — "Retrieves a VERSIONED_PARTY identified by
# `versioned_object_uid`" (specifications/operations/versioned_party_get.yaml),
# served at GET /demographic/versioned_party/{versioned_object_uid}
# (specifications/demographic.openapi.yaml).
#
# ANCHOR: `I_ITS_REST_VERSIONED_PARTY` is a reserved CATALOGUE pseudo-interface,
# NOT an SM interface — register AMB-136, confirmed first-hand: SM
# UML/classes/i_party.adoc declares no container read (its reads all return a
# bare PARTY), and SM
# docs/openehr_platform/master06-demographic_service.adoc includes exactly
# i_demographic_service, i_party, i_party_relationship, uv_party and
# uv_party_relationship — no versioned-party interface anywhere. The two
# EHR-side twins of this route DO have SM anchors
# (I_EHR_COMPOSITION.get_versioned_composition,
# I_EHR_STATUS.get_versioned_ehr_status); the demographic one has none, so it is
# anchored under the AMB-161 pseudo-interface mechanism. Pseudo-interfaces are
# grouped by the SERVED RESOURCE FAMILY, not by the OAS tag — exactly as
# I_ITS_REST_ITEM_TAGS spans the EHR and DEMOGRAPHIC tag routes — which is why
# the sibling revision-history route under the same OAS tag lives in
# I_ITS_REST_REVISION_HISTORY instead: it serves a REVISION_HISTORY, this one
# serves a VERSIONED_OBJECT. The operation name is the RELEASED operationId
# verbatim.
#
# Re-adjudicated 2026-07-28: AMB-136 left this route unanchored, but that
# decision PRE-DATES the AMB-161 pseudo-interface + NON_SM_REST_OPERATIONS
# mechanism, which was established for precisely this shape — a released
# ITS-REST operation the SM models no interface for.
#
# Sources for the wire values (ITS-REST DOCS TEXT first — it wins every
# conflict; the released OAS fills only what the docs text is silent on and is
# cited AS the OAS):
#   - Resource: overview Resources.md §Resources — "versioned entities:
#     VERSIONED_COMPOSITION, VERSIONED_EHR_STATUS, etc. or their contained
#     VERSION instances" is the resource class this route serves.
#   - `ok` 200 / `not_found` 404: overview Requests_and_responses.md §HTTP
#     status codes ("200 | OK | The request succeeded …"; "404 | Not Found |
#     The origin service did not find the target resource or is not willing to
#     disclose that one exists"). The released OAS agrees:
#     operations/versioned_party_get.yaml declares exactly '200' ->
#     responses/200_VERSIONED_PARTY.yaml and '404' -> responses/404.yaml, so
#     no other branch exists.
#   - the served object's shape: RM common
#     UML/classes/org.openehr.rm.common.versioned_object.adoc §Attributes
#     (`uid`: HIER_OBJECT_ID, "Unique identifier of this version container in
#     the form of a UID with no extension"; `owner_id`: OBJECT_REF 1..1;
#     `time_created`: DV_DATE_TIME 1..1).
#
# Header discipline on the `ok` outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (DOCS TEXT): "Both
# `ETag` and `Last-Modified` SHOULD be included in responses for VERSION,
# VERSIONED_OBJECT, or other resources that have versioning or unique state
# identifiers" — a VERSIONED_OBJECT is named outright, and this route serves one
# —, and "For openEHR resources, this value [Last-Modified] should be derived
# from `VERSION.commit_audit.time_committed.value`". The identifier INSIDE the
# entity tag stays unconstrained beyond the weak envelope, because the same
# section makes its source a choice ("usually taken from e.g.
# VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc."); the
# weakness indicator itself is a MUST (§Deprecated headers).
# `Location` MUST BE ABSENT on this outcome — §Location: "It MUST NOT be used to
# indicate an alternate representation of an existing resource (e.g. via `GET`
# method)".
# NOTE: header matchers are EXECUTED assertions — a violated declaration is a
# red row.
#
# FORMATS: canonical-json + canonical-xml. The released
# parameters/header/Accept_canonical.yaml enum offers both, and unlike the bare
# PARTY reads the XML branch here is DOCUMENTED rather than undefined — ITS-XML
# publishes the global `versioned_object` document element, which register
# AMB-167 classifies as carrying the VERSIONED_* container reads, so the
# §XML Format MUSTs are enforceable as written and the branch needs no
# statement-declared option.
sm_operation: I_ITS_REST_VERSIONED_PARTY.versioned_party_get
its: its-rest
request:
  method: GET
  path: /demographic/versioned_party/{versioned_object_uid}
formats: [canonical-json, canonical-xml]
outcomes:
  ok:
    status: 200                           # 200_VERSIONED_PARTY.yaml
    headers:
      Content-Type: negotiated
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # the weakness indicator is a MUST — overview §Deprecated headers
      Last-Modified: present
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
    body: present
  not_acceptable: { status: 406 }         # Resources.md §XML Format — an Accept the service cannot fulfill (offering XML on this resource is a service choice, AMB-167)
  not_found: { status: 404 }              # unknown versioned_object_uid (responses/404.yaml)
