# Wire realization of I_DEFINITION_ADL2.upload_artefact, variant
# `return_identifier`: the ADL2 upload asks for the identifier-only response
# with `Prefer: return=identifier`. The variant-less binding sends no `Prefer`
# at all (the assumed default, `return=minimal`), so this preference needs its
# own realization.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §"Prefer only
# identifier"): "This is a variant of preference that implies minimal response
# semantics, but with a non-empty response body (i.e., the status will be `201
# Created` or `200 OK`, never `204 No Content`)." and "The response body SHOULD
# contain only the identifier of the affected resource formatted according to
# the `Accept` request header." An upload CREATES the artefact, so `created`
# takes the 201 of that pair.
#
# WHICH identifier: the ADL2 upload's 201 text says "if is `return=identifier`,
# only its unique identifier is included" and offers `application/json` as the
# `TemplateIdentifier` object (`{ "template_id": … }`) beside the text/plain
# full source. For this API group the operation + response `description:` prose
# IS the released docs text — the specification's own `docs/definition/`
# chapter carries no operation semantics (registered as AMB-110).
#
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
sm_operation: I_DEFINITION_ADL2.upload_artefact
its: its-rest
variant: return_identifier
request:
  method: POST
  path: /definition/template/adl2
  body: opt_adl2
  headers:
    Content-Type: text/plain              # the ONLY accepted upload type (operation Content-Type enum)
    Accept: application/json              # Accept_Template_adl2.yaml — the TemplateIdentifier rendering
    Prefer: "return=identifier"
outcomes:
  created:
    status: 201                           # §Prefer only identifier — "201 Created or 200 OK, never 204 No Content"
    body: present                         # §Prefer only identifier — "a non-empty response body"
    headers:
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
captures:
  template_id:
    from: body "template_id"              # the TemplateIdentifier object's single member
    fallback: header Location last-segment
