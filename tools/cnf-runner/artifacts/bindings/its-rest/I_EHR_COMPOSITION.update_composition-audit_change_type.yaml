# Wire realization of I_EHR_COMPOSITION.update_composition, variant
# `audit_change_type`: the update carries a client-supplied AUDIT_DETAILS
# change_type through the `openehr-audit-details` committal request header.
#
# Why, from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"):
#   "clients MAY supply values for the AUDIT_DETAILS attributes change_type,
#   description, committer and system_id" and "whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime."
# The legal value set is the openEHR `audit_change_type` group (RM common
# master04 `AUDIT_DETAILS.Change_type_valid`; TERM group audit_change_type):
# a group code compatible with the operation is honoured verbatim (an update
# legally carries 250|amendment| as well as 251|modification|); an
# out-of-group token violates AUDIT_DETAILS.Change_type_valid — a semantic
# error, 422 per the overview §HTTP status codes table ("well-formed but was
# unable to be followed due to semantic errors"). A group code contradicting
# the operation (249|creation| on an update) MUST be rejected (RM change
# control), but the released docs text assigns NO status code to that
# rejection — the adjudicated AMB-54 silence (registers/ambiguities.yaml):
# the outcome accepts both codes the overview permits (400 generic client
# error / 422 semantic), exactly like the commit_contribution binding.
#
# Identical to the variant-less I_EHR_COMPOSITION.update_composition binding
# except the added committal header, so a red row localizes to the
# change_type merge alone. The case supplies `${audit_change_type}`.
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
variant: audit_change_type
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    If-Match: '"${preceding_version_uid}"'
    Prefer: "return=representation"
    openehr-audit-details: 'change_type.code_string="${audit_change_type}"'
formats: [canonical-json]
outcomes:
  updated:
    status: 200
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"'
    body: prefer_conditional
  validation_failed:
    status: 422                           # Change_type_valid violation = semantic error (overview §HTTP status codes: 422 "semantic errors")
    alt_status: [400]                     # the operation-contradicting group code carries the AMB-54 spec-unassigned status (400/422 both accepted) — the same fixed_handling as commit_contribution
    body: error_loose
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid, context/_uid]
