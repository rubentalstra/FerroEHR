# Wire realization of I_EHR_STATUS.set_ehr_modifiable for ITS-REST 1.1.0.
# ITS-REST has no field-level setter: setting EHR_STATUS.is_modifiable = true is
# realized as a read-modify-write of the whole EHR_STATUS via
# PUT /ehr/{ehr_id}/ehr_status, with the current version_uid in If-Match
# (the SM preceding_version_uid, ITS-REST overview §If-Match). The runner reads the current
# EHR_STATUS, flips is_modifiable, and PUTs it back (the SM setter
# vs ITS-REST whole-resource-update divergence).
# Sources: specifications/operations/ehr_status_update.yaml,
# responses/200_EHR_STATUS_updated.yaml, 204_version_updated.yaml,
# 412_EHR_STATUS.yaml, 400.yaml, 404_unknown_ehr_id.yaml; If-Match per
# overview Requests_and_responses.
sm_operation: I_EHR_STATUS.set_ehr_modifiable
its: its-rest
request:
  method: PUT
  path: /ehr/{ehr_id}/ehr_status
  body: { from_capture: status_body, set: { is_modifiable: true } }   # read-modify-write                          # modified EHR_STATUS (is_modifiable set true; runner read-modify-write)
  headers:
    If-Match: '"${preceding_version_uid}"'  # REQUIRED (If-Match.yaml); realizes SM preceding_version_uid (ITS-REST overview §If-Match)
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml]
# The `ETag` weakness indicator is a MUST, not a style note — ITS-REST overview
# `Requests_and_responses.md` §Deprecated headers: "The `ETag` response header
# was used without a weakness indicator `W/`. This is now deprecated, all
# `ETag` headers that hold a resource identifier MUST include a weakness
# indicator `W/`" (§"ETag and Last-Modified" gives the shape:
# `ETag: W/"8849182c-…::openEHRSys.example.com::2"`). The matcher asserts the
# weak entity-tag envelope only; the identifier INSIDE it is left unconstrained
# because the same section makes the source a choice ("usually taken from e.g.
# VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc.").
outcomes:
  updated:
    status: 200                             # 200_EHR_STATUS_updated.yaml (204 when Prefer minimal)
    headers: { ETag: 'pattern:W/"[^"]+"', Location: present }
    body: prefer_conditional
  precondition_failed:
    status: 412                             # 412_EHR_STATUS.yaml, stale If-Match
    headers: { ETag: latest-version-uid }
  precondition_missing: { status: 400 }     # If-Match absent -> SHOULD 400 (Requests_and_responses)
  validation_failed: { status: 400, body: error_loose }   # 400.yaml
  not_found: { status: 404 }                # 404_unknown_ehr_id.yaml
captures:
  status_version_uid:
    from: header ETag
    strip: weak-quotes
