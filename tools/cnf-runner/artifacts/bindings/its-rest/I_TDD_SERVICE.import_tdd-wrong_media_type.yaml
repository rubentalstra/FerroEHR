# EXTENSION realization of I_TDD_SERVICE.import_tdd, variant wrong_media_type:
# the single TDD import is sent DECLARING `Content-Type: application/json` on a
# route whose only body form is the TDD XML document.
#
# NO RELEASED WIRE EXISTS (register AMB-34 — the release publishes SEVEN API
# groups and no message / EHR-Extract / TDD group in either the docs text or
# the OAS), so the refusal rule is the SERVED route's own documented contract,
# not a released MUST: the route accepts `application/xml` and nothing else, so
# a request declaring another payload type is refused 415 before the document
# is read.
#
# The body is the same VALID TDD the success case imports, so nothing but the
# declared media type distinguishes this exchange.
sm_operation: I_TDD_SERVICE.import_tdd
its: its-rest
variant: wrong_media_type
extension:
  family: message-tdd
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract/TDD API at all, so the SM
    import_tdd has no released wire; this product serves the operation on its
    own /message/tdd/{ehr_id} route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc; SM
    docs/UML/classes/i_tdd_service.adoc (import_tdd); ITS-REST specifications (the seven
    released API groups, none of them message/extract/tdd); ITS-REST specifications/docs (no
    such API); no openEHR spec governs this — our own design/extension
  ambiguity: AMB-34
request:
  method: POST
  path: /message/tdd/{an_ehr_id}
  body: tdd_text
  headers:
    Content-Type: application/json        # the DECLARED non-XML payload type under test
outcomes:
  unsupported_media: { status: 415 }
