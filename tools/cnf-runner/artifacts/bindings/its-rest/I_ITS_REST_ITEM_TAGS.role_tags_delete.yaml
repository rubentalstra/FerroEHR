# Wire realization of the RELEASED ITEM_TAG operation `role_tags_delete` for
# ITS-REST 1.1.0 — "Deletes the ITEM_TAG resource(s) identified by `tag_key`,
# associated with a given target ROLE version or VERSIONED_PARTY
# identified by `uid_based_id`" (specifications/operations/role_tags_delete.yaml).
# The delete is KEY-scoped, not collection-scoped: the `{key}` path segment
# names the tags to remove, so tags under other keys on the same target
# survive.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved CATALOGUE pseudo-interface, NOT
# an SM interface — the vendored SM models no tag concept at all (the whole
# docs/specs/openehr/SM/docs/ tree contains zero occurrences of "tag",
# grep-verified), while the release defines twenty-three tag operations and
# calls the wrapper headers "convenient wrappers around the dedicated ITEM_TAG
# operations" (specifications/docs/overview/Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag). Case cores speak SM
# operations only, so the pinned NON_SM_REST_OPERATIONS table
# (tools/cnf-runner/src/validate.rs) is what makes these enumerable at all; the
# naming convention is adjudicated in register AMB-161. The operation name is
# the RELEASED operationId verbatim.
#
# ADDRESSING: `{uid_based_id}` is the released path parameter and carries BOTH
# forms — "an OBJECT_VERSION_ID identifier taken from VERSION.uid.value (i.e. a
# `version_uid`), or a form of a HIER_OBJECT_ID identifier taken from
# VERSIONED_PARTY.uid.value (i.e. a `versioned_object_uid`). The former is used
# to delete the tags of a particular (target) version …, whereas the latter …
# the target VERSIONED_PARTY container" (operations/role_tags_delete.yaml). ONE binding serves
# both: a case's `with:` binds `uid_based_id` to a container uid or to a version
# uid, which is exactly the released parameter's dual form — the two forms
# address DISJOINT collections (RM common master07-tags.adoc ITEM_TAG.target:
# "Identifier of target, which may be a `VERSIONED_OBJECT<T>` or a
# `VERSION<T>`").
#
# NO `ETag` / `Last-Modified`: the overview scopes those to "responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers" (§"ETag and Last-Modified"). An ITEM_TAG collection is
# none of those — an ITEM_TAG carries no uid at all, its identity being the
# (key, target_path) pair (§openehr-item-tag and openehr-version-item-tag:
# "they are uniquely identified by their `key` and `target_path` pair
# attributes"; register AMB-92) — and no released tag response declares either
# header. Neither is declared here: declaring one would invent an obligation
# the release does not state.
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
#
# OUTCOMES — the released response set of this operation:
#  - `deleted` 204: responses/204_deleted.yaml, "`204 No Content` is returned
#    when the resource identified by the request parameters has been
#    (logically) deleted". The body floor is `absent`, per the status table's
#    204 row: "The request has been fulfilled and there is no additional
#    content to send in the response payload body". (An ITEM_TAG has no
#    lifecycle_state, so the released "(logically)" wording is the
#    change-control copy-paste registered in AMB-97; the wire code is
#    unaffected.)
#  - `not_found` 404: responses/404_unknown_uid_based_id_or_key.yaml —
#    "… or when the ITEM_TAG identified by the `key` does not exist".
#  - `not_found` ALSO covers a well-formed `uid_based_id` that resolves to a
#    version container of ANOTHER kind (within this space or across the EHR /
#    demographic boundary). The released 404 text says only "when the
#    `uid_based_id` does not exist"; register AMB-91 adjudicates the kind
#    mismatch as that miss, on GET, PUT and DELETE alike and on all seven typed
#    families.
#
# The released operation declares NO Accept parameter and no response content,
# so this binding declares no format axis at all.
sm_operation: I_ITS_REST_ITEM_TAGS.role_tags_delete
its: its-rest
request:
  method: DELETE
  path: /demographic/role/{uid_based_id}/tags/{key}                    # parameters/path/key.yaml
outcomes:
  deleted:
    status: 204
    headers:
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # DELETE — overview §Location ("MUST ONLY be used for resource creation … or redirect responses"); §Deprecated headers: "the `Location` response header was deprecated from responses of `DELETE` methods"
    body: absent
  not_found: { status: 404 }
