# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# `prefer_absent`: NO `Prefer` request header at all. Every other
# create_composition binding pins a `Prefer` value, so the DEFAULT — the branch
# a client gets by saying nothing — needs its own realization to be exercised at
# all.
#
# WHY THE OUTCOME IS THE MINIMAL ONE. Overview `Requests_and_responses.md`
# §Representation details negotiation, DOCS TEXT: "If no `Prefer` header is
# provided, the default behavior is assumed to be `return=minimal`". The
# released response file says the same thing from the other side, naming both
# forms in one breath — `responses/201_COMPOSITION.yaml`: "If the `Prefer`
# header is missing or set to `return=minimal`, the body is empty" (cited AS the
# OAS; the docs text assigns no status to this branch, see the sibling
# `-return_minimal` binding's oracle-order note and register AMB-62).
#
# So this binding declares the SAME outcome as `-return_minimal` and differs
# only in the request: that identity IS the behaviour under test. The same
# chapter still tells clients to state the preference anyway ("clients are
# strongly encouraged to always include the `Prefer` request header
# explicitly"), which is why the explicit form gets its own variant rather than
# this one standing for both.
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: prefer_absent
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # OAS operations/composition_create.yaml — the one declared success status
    body: absent                          # OAS responses/201_COMPOSITION.yaml — "If the `Prefer` header is missing or set to `return=minimal`, the body is empty"
    headers:
      ETag: 'pattern:W/"[^"]+"'           # the weakness indicator is a MUST — overview §Deprecated headers
      Location: present                   # overview §Prefer minimal — "The response SHOULD include a `Location` header pointing to the newly created or updated resource"
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
