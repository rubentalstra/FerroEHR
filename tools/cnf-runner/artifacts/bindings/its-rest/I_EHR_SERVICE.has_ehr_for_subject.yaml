# Wire realization of I_EHR_SERVICE.has_ehr_for_subject for ITS-REST 1.1.0.
# The SM has_ehr_for_subject() returns Boolean; ITS-REST has no dedicated
# existence probe, so it is realized as GET /ehr?subject_id&subject_namespace:
# 200 = an EHR exists for the subject (positive), 404 = none (negative).
# subject_id and subject_namespace are query parameters (ehr_get_by_subject.yaml).
# Sources: specifications/operations/ehr_get_by_subject.yaml (200/404),
# responses/200_EHR.yaml, 404_EHR_subject.yaml.
sm_operation: I_EHR_SERVICE.has_ehr_for_subject
its: its-rest
request:
  method: GET
  path: /ehr
  query:
    subject_id: "${subject_id}"                                # ehr_get_by_subject.yaml (required)
    subject_namespace: "${subject_namespace}"
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_EHR.yaml — EHR exists for subject
    headers:
      Content-Type: negotiated
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }                                   # 404_EHR_subject.yaml — no EHR for subject
