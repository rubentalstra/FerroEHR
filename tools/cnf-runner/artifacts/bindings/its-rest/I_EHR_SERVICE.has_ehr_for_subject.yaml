# Wire realization of I_EHR_SERVICE.has_ehr_for_subject for ITS-REST 1.1.0.
# The SM has_ehr_for_subject() returns Boolean; ITS-REST has no dedicated
# existence probe, so it is realized as GET /ehr?subject_id&subject_namespace:
# 200 = an EHR exists for the subject (positive), 404 = none (negative).
# subject_id and subject_namespace are query parameters (ehr_get_by_subject.yaml).
# Sources: specifications/operations/ehr_get_by_subject.yaml (200/404),
# responses/200_EHR.yaml, 404_EHR_subject.yaml.
sm_operation: I_EHR_SERVICE.has_ehr_for_subject
its: its-rest
request:
  method: GET
  path: /ehr                                                   # ?subject_id=…&subject_namespace=… (query params)
formats: [canonical-json, canonical-xml]
outcomes:
  ok: { status: 200, headers: { Content-Type: negotiated } }   # 200_EHR.yaml — EHR exists for subject
  not_found: { status: 404 }                                   # 404_EHR_subject.yaml — no EHR for subject
