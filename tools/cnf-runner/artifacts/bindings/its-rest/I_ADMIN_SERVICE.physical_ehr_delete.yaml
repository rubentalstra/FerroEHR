# Wire realization of I_ADMIN_SERVICE.physical_ehr_delete for ITS-REST 1.1.0 —
# the only master12 admin operation the ITS surfaces.
# Sources: specifications/operations/admin_ehr_delete.yaml (DELETE
# /admin/ehr/{ehr_id}, 202/204/404), responses/204_deleted_hard.yaml,
# 202.yaml, 404_unknown_ehr_id.yaml. The Admin API is DEVELOPMENT-stage
# (admin.openapi.yaml x-status: DEVELOPMENT); every physical_ehr_delete case
# carries the matching guard.
# Physical (hard) deletion produces no VERSION, so the synchronous success is
# ok_empty (204 No Content).
#
# THE ASYNCHRONOUS ARM IS ITS OWN NAMEABLE KIND SINCE THE 2026-07-28 SCHEDULE
# RELEASE (#544), AND THE ABSORPTION IS KEPT ALONGSIDE IT ON PURPOSE.
# Released ground (specifications/operations/admin_ehr_delete.yaml, verbatim):
# "The server may execute this operation asynchronously (e.g. in batches), in
# which case returns status `202 Accepted`. If the deletion is processed
# synchronously and completes successfully, the server returns status
# `204 No Content`." That is a MAY on the SERVICE, not a choice a client can
# make, so:
#   * `accepted` (202) is DECLARED, so a case that could drive the async arm can
#     name it instead of hiding inside a success alias;
#   * `ok_empty` KEEPS `alt_status: [202]`, because a case that asks for the
#     deletion to have happened must still pass against a conformant server
#     that answers 202 — dropping the alias would turn the released MAY into a
#     catalogue MUST-NOT and REFUTE an asynchronous implementation.
# The overlap (two kinds over one status) is the documented #557 tie-break
# pattern — expectation-driven classification, where the expected member's
# status match satisfies the expectation — not an ambiguity. No case can FORCE
# the async arm: the branch is a service-side execution choice with no request
# form behind it, so it stays a declared-but-unexercised branch row in
# vocab/wire_surface.yaml (the AMB-140 / AMB-159 pattern for a declared branch
# whose trigger the release withholds). Register AMB-139 carries the fact that
# 202 is absent from the overview's own status-code table and legalized by that
# table's "Additional status codes MAY be used" clause.
sm_operation: I_ADMIN_SERVICE.physical_ehr_delete
its: its-rest
request:
  method: DELETE
  path: /admin/ehr/{ehr_id}
outcomes:
  ok_empty:
    status: 204                           # 204_deleted_hard.yaml (synchronous hard delete)
    alt_status: [202]                     # the operation's own async sentence; a deletion-happened case must not refute an async server (register AMB-139)
  accepted:
    status: 202                           # 202.yaml — "returned when the requested operation has been accepted for processing, but processing has not been completed or may not have started"
  not_found: { status: 404 }              # 404_unknown_ehr_id.yaml — ehr_id_does_not_exist
