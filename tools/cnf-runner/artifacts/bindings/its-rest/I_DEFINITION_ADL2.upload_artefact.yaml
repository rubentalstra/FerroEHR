# Wire realization of I_DEFINITION_ADL2.upload_artefact for ITS-REST 1.1.0.
# ITS-REST 1.1.0 surfaces ADL2 provisioning ONLY for operational templates
# (OPTs): the SM upload_artefact is artefact-generic ("archetype, template or
# operational_template") but the only wire is POST /definition/template/adl2,
# which accepts an OperationalTemplateV2 (text/plain ADL2 source). Bare ADL2
# archetype upload has no wire (AMB-37); this binding realizes the OPT path.
# Sources: specifications/operations/definition_template_adl2_upload.yaml
# (operationId definition_template_adl2_upload; Content-Type enum text/plain),
# responses/201_Template_adl2_upload.yaml (Location + ETag + TemplateIdentifier
# body under Prefer), 409_template_already_exists.yaml, 400.yaml.
sm_operation: I_DEFINITION_ADL2.upload_artefact
its: its-rest
request:
  method: POST
  path: /definition/template/adl2                # definition_template_adl2_upload.yaml
  body: opt_adl2
  headers:
    Content-Type: text/plain                     # the ONLY accepted upload type (operation Content-Type enum)
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and the `ETag` "is considered to be of weak-type and
# should have a weakness indicator `W/` prefix". An ADL2 operational template's
# unique state identifier is its versioned ARCHETYPE_HRID (AM am24 —
# `release_version` is the artefact's SEMVER), so the ETag names the RESOLVED
# HRID, not the addressed (possibly partial) template_id.
# TODO: the runner does not evaluate `outcomes.*.headers` matchers yet (only the
# status is classified, tools/cnf-runner/src/exec/outcome.rs), so this
# declaration is the authored contract, not an executed assertion — it becomes
# executable when #403 wires header-matcher evaluation into the step judgement.
outcomes:
  created:
    status: 201                                   # 201_Template_adl2_upload.yaml
    headers:
      ETag: 'pattern:W/"<template_id>"'           # the stored ARCHETYPE_HRID
      Location: present
  already_exists: { status: 409 }                 # 409_template_already_exists.yaml — duplicate template_id
  validation_failed:
    status: 422                           # ITS-REST overview §HTTP status codes — 422 = semantic errors
    body: error_loose                             # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
captures:
  template_id:
    from: body "template_id"                      # TemplateIdentifier.yaml (Prefer: return=identifier|representation)
    fallback: header Location last-segment        # Location_Template_adl2.yaml (Prefer: return=minimal)
