# Wire realization of I_EHR_DIRECTORY.create_directory, variant
# `invalid_item_tag_header`: the SAME released directory commit, driven with a
# wrapper header whose ONE tag entry breaks an RM ITEM_TAG invariant, so the
# refusal — and, crucially, WHEN it happens relative to the content commit —
# can be observed.
#
# WHAT MAKES THE HEADER INVALID (one defect, so a red row names one thing):
# `key=" padded "`. RM common
# UML/classes/org.openehr.rm.common.item_tag.adoc §Invariants declares
# `Inv_key_valid: not key.is_empty and key.is_justified`, and the same file's
# Meaning column for `key` spells out what that means: "May not be empty or
# contain leading or trailing whitespace". The FOLDER body itself is the valid
# cnf.directory.root_only fixture, unmodified — the tag is the only defect.
#
# WHICH BRANCH THE REFUSAL TAKES: register AMB-93 (the rejection status for an
# ITEM_TAG violating its RM invariants is unassigned by the release — all seven
# tag PUTs declare only 400/404 while the body is well-formed JSON satisfying
# the schema). Its fixed handling assigns 422, on the docs-text row that
# describes exactly this: ITS-REST overview Requests_and_responses.md §HTTP
# status codes, "422 | Unprocessable Entity | The request was well-formed but
# was unable to be followed due to semantic errors". The wrapper header carries
# the same ITEM_TAG payload as those PUTs — it is declared "a convenient
# wrapper around the dedicated ITEM_TAG operations" — so it takes the same
# branch.
#
# WHETHER THE CONTENT SURVIVES THE REFUSAL is a separate question the release
# does not answer: §Usage in Requests states what the header MEANS and nothing
# about atomicity, and no operation carrying the header declares a tag-specific
# failure branch. Register AMB-204 carries the fixed handling (validate the tag
# list before the content commit, so a refused request commits nothing). The
# case proves it by asking, after the refusal, whether the EHR has a directory
# at all.
#
# The rest of the wire is the variant-less create binding's (see
# I_EHR_DIRECTORY.create_directory.yaml).
sm_operation: I_EHR_DIRECTORY.create_directory
its: its-rest
variant: invalid_item_tag_header
request:
  method: POST
  path: /ehr/{ehr_id}/directory
  body: directory
  headers:
    openehr-item-tag: 'key=" padded "'    # breaks RM ITEM_TAG.Inv_key_valid ("may not … contain leading or trailing whitespace")
formats: [canonical-json]
outcomes:
  validation_failed:
    status: 422                           # register AMB-93 + overview §HTTP status codes (the 422 row)
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details
