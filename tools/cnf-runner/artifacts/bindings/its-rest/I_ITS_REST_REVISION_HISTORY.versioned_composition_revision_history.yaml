# Wire realization of the RELEASED operation
# `versioned_composition_revision_history` for ITS-REST 1.1.0 — "Retrieves
# revision history of the VERSIONED_COMPOSITION identified by
# `versioned_object_uid` and associated with the EHR identified by `ehr_id`"
# (specifications/operations/versioned_composition_revision_history.yaml),
# served at
# GET /ehr/{ehr_id}/versioned_composition/{versioned_object_uid}/revision_history
# (specifications/ehr.openapi.yaml).
#
# ANCHOR, ORACLE ORDER, HEADER AND FORMAT DISCIPLINE: identical to the sibling
# binding I_ITS_REST_REVISION_HISTORY.versioned_ehr_status_revision_history —
# the reserved pseudo-interface of register AMB-161 (the SM models no
# revision-history operation at all), the docs text silent on revision history
# so the released OAS grounds every value below, no ETag/Last-Modified declared
# because a REVISION_HISTORY is neither a VERSION nor a VERSIONED_OBJECT and
# carries no identity of its own (RM common
# UML/classes/org.openehr.rm.common.revision_history.adoc), and canonical-json
# only because ITS-XML publishes no document element for the type (register
# AMB-167).
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
#
# OUTCOMES — exactly the released response set of this operation:
#  - `ok` 200: responses/200_REVISION_HISTORY.yaml, "`200 OK` is returned when
#    the requested REVISION_HISTORY is successfully retrieved", content
#    application/json = schemas/common/RevisionHistory.yaml (required: items).
#  - `not_found` 404: responses/404_unknown_ehr_id_or_versioned_object_uid.yaml
#    — this route carries the container id in the path, so the miss covers both
#    an unknown `ehr_id` and an unknown `versioned_object_uid` (the difference
#    from the EHR_STATUS sibling, whose container is the EHR's singleton).
# The released operation declares NO other response, so no other branch exists.
sm_operation: I_ITS_REST_REVISION_HISTORY.versioned_composition_revision_history
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/versioned_composition/{versioned_object_uid}/revision_history
formats: [canonical-json]                 # AMB-167: REVISION_HISTORY has no published document element
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated            # 200_REVISION_HISTORY.yaml -> headers/ContentType_canonical.yaml
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
    body: present
  not_found: { status: 404 }              # responses/404_unknown_ehr_id_or_versioned_object_uid.yaml
