# ITS-REST 1.1.0 surfaces no wire for I_DEFINITION_ADL2.opts_count — there is no
# count endpoint on the ADL2 (or any definition) surface; a count of operational templates (OPTs)
# is only derivable client-side from a list response, not returned by a
# dedicated operation. Declared unrealized so the case is not-applicable WITH
# CITATION and activates when a later ITS release adds a count endpoint.
sm_operation: I_DEFINITION_ADL2.opts_count
its: its-rest
unrealized:
  reason: >-
    No artefact/template/OPT count operation exists in ITS-REST 1.1.0; counts
    are derivable from list length client-side but have no dedicated wire.
  source: >-
    SM docs/UML/classes/i_definition_adl2.adoc (opts_count); ITS-REST specifications/operations
    (no ADL2 count endpoint)
  ambiguity: AMB-37
