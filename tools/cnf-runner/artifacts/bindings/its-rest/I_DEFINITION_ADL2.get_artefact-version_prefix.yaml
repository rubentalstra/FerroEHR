# Wire realization of I_DEFINITION_ADL2.get_artefact for the DEPRECATED ADL2
# "Get a template at version" endpoint, variant `version_prefix`: the
# `{version}` path segment carries a PARTIAL prefix rather than an exact SEMVER,
# so the highest matching version must be resolved. A FOURTH realization of
# get_artefact (plain OPT GET + example + the exact-version GET + this one);
# the exact-version sibling is `variant: version`.
#
# Decisive released sentence (specifications/parameters/path/version.yaml, the
# `{version}` path parameter of this operation): "A SEMVER version number. This
# can be an exact version (e.g. `1.7.1`), or a pattern as partial prefix, in a
# form of `{major}` or `{major}.{minor}` (e.g. `1` or `1.0`), in which case the
# highest (latest) version matching the prefix will be considered." The
# addressed artefact is therefore named by the version-less HRID
# (parameters/path/template_id.yaml admits "Template identifier or partial
# reference") plus the prefix, and the RESOLVED artefact is the highest match.
#
# The `ETag` matcher is what makes the resolution observable: the overview's
# §"ETag and Last-Modified" makes the entity tag the resource's unique state
# identifier, which for an ADL2 operational template is its versioned
# ARCHETYPE_HRID (AM am24 — `release_version` is the artefact's SEMVER), so the
# tag names the RESOLVED HRID and not the addressed prefix. The case captures
# that HRID from the upload of the higher member and the `<resolved_hrid>`
# placeholder resolves against it, so a server that resolved to the LOWER
# member fails the row.
#
# The operation is `deprecated: true` (SPECITS-87); cases guard on that, and
# the deprecation posture is register entry AMB-113.
sm_operation: I_DEFINITION_ADL2.get_artefact
its: its-rest
variant: version_prefix
request:
  method: GET
  path: /definition/template/adl2/{template_id}/{version}  # definition_template_adl2_version_get.yaml (deprecated)
  headers:
    Accept: text/plain                            # Accept_Template_adl2.yaml
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
outcomes:
  ok:
    status: 200                                   # 200_Template_adl2_retrieved.yaml
    headers:
      Content-Type: negotiated
      ETag: { match: 'pattern:W/"<resolved_hrid>"', applies: { its_rest: ">=1.1.0" } }  # the RESOLVED (highest-matching) ARCHETYPE_HRID, captured by the case from the higher upload
  not_found: { status: 404 }                      # 404_unknown_template_id_or_version.yaml
