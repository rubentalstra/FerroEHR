# Wire realization of I_PARTY.get_party_at_version, variant `versioned_party`:
# the same SM read served through the VERSIONED_PARTY sub-resource —
# GET /demographic/versioned_party/{versioned_object_uid}/version/{version_uid}
# returns the ORIGINAL_VERSION envelope (uid, commit_audit, data).
#
# Sources (ITS-REST DOCS TEXT — the wire oracle):
#   - overview Resources.md §Resource identification: a VERSION is retrievable
#     by version_uid (the "explicit version reference").
#   - overview Requests_and_responses.md §"ETag and Last-Modified": both
#     "SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other
#     resources that have versioning or unique state identifiers"; Last-Modified
#     "should be derived from VERSION.commit_audit.time_committed.value";
#     §Location: "MUST NOT be used to indicate an alternate representation of
#     an existing resource (e.g. via GET method)".
# The ETag/Last-Modified/Location matchers are EXECUTED assertions (#403).
sm_operation: I_PARTY.get_party_at_version
its: its-rest
variant: versioned_party
request:
  method: GET
  path: /demographic/versioned_party/{versioned_object_uid}/version/{version_uid}
formats: [canonical-json]
outcomes:
  ok:
    status: 200
    headers:
      ETag: { match: 'pattern:W/".*"', applies: { its_rest: ">=1.1.0" } }
      Last-Modified: present
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }
  not_found:
    # An unknown `version_uid` under a known container. DOCS TEXT (overview
    # Requests_and_responses.md §HTTP status codes, the 404 row verbatim): "The
    # origin service did not find the target resource or is not willing to
    # disclose that one exists" — the addressed VERSION does not exist, so the
    # request names no target resource.
    status: 404
