# Wire realization of I_DEFINITION_ADL2.has_artefact for ITS-REST 1.1.0.
# ITS-REST 1.1.0 exposes no dedicated artefact existence-check endpoint; the SM
# has_artefact (Boolean) is realized via the list-by-filter GET (the same
# precedent as I_DEFINITION_QUERY.has_query): a non-empty result set for the
# `template_id` filter means the artefact is present, an empty set means it is
# not — both are 200. Only OPTs are listable (AMB-37): has_artefact for a bare
# ADL2 archetype HRID is always false on this wire.
# Sources: specifications/operations/definition_template_adl2_list.yaml (200),
# parameters/query/filter_template_id.yaml (name: template_id, wildcard match),
# responses/200_TemplateList_adl2.yaml.
sm_operation: I_DEFINITION_ADL2.has_artefact
its: its-rest
request:
  method: GET
  path: /definition/template/adl2                 # definition_template_adl2_list.yaml
  query:
    template_id: "${template_id}"                 # filter_template_id.yaml (exact HRID is a valid pattern)
  headers:
    Accept: application/json                       # Accept_JSON.yaml
outcomes:
  ok: { status: 200, headers: { Content-Type: negotiated } }   # 200_TemplateList_adl2.yaml (non-empty => true, empty => false)
