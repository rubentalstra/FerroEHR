# Wire realization of I_EHR_COMPOSITION.delete_composition, variant
# `audit_headers`: the DELETE carries committal metadata through the
# `openehr-audit-details` request header.
#
# Why, from the ITS-REST docs text (Requests_and_responses.md
# §"openehr-version and openehr-audit-details"):
#   "services MUST also allow PUT, POST and DELETE methods directly on these
#   change-controlled resources" and "services MUST accept openehr-version and
#   openehr-audit-details custom request headers" — a DELETE commits a
#   523|deleted| VERSION (RM common master06 §Logical Deletion), so the
#   supplied description/committer merge into that commit's AUDIT_DETAILS.
# Identical to the variant-less delete binding otherwise, so a red row
# localizes to the committal-header acceptance on DELETE alone.
sm_operation: I_EHR_COMPOSITION.delete_composition
its: its-rest
variant: audit_headers
request:
  method: DELETE
  path: /ehr/{ehr_id}/composition/{preceding_version_uid}
  headers:
    openehr-audit-details: 'description.value="retracted per patient request",committer.name="Dr Chart"'
outcomes:
  deleted:
    status: 204
    headers: { ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } } }
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid, context/_uid]
