# Wire realization of I_DEFINITION_ADL14.upload_opt for ITS-REST 1.1.0.
# Sources, RELEASED OAS (tier 2 — the docs text describes no template-upload
# exchange at all, so the OAS grounds it per the 2026-07-28 oracle order; cited
# AS the OAS): specifications/operations/definition_template_adl1.4_upload.yaml,
# responses/201_Template_adl1_4_upload.yaml, 409_template_already_exists.yaml.
sm_operation: I_DEFINITION_ADL14.upload_opt
its: its-rest
request:
  method: POST
  path: /definition/template/adl1.4
  body: opt_xml
  headers:
    Content-Type: application/xml         # the ONLY accepted upload type (operation enum)
    # The binding DECLARES the response representation it asks for, so the one
    # request-construction path sends the same upload whether the call is a
    # driven step or a case precondition (issue #629 — the two paths used to
    # differ, and this operation answered differently to each). OAS ground
    # (the docs text describes no template-upload exchange at all):
    # definition_template_adl1.4_upload.yaml `$ref`s components/parameters/
    # Accept_Template, whose enum is [application/json, application/xml,
    # application/openehr.wt+json], and responses/201_Template_adl1_4_upload.yaml
    # declares an `application/json` content entry (schema TemplateIdentifier).
    Accept: application/json
outcomes:
  created:
    status: 201                           # 201_Template_adl1_4_upload.yaml
    headers:
      # OAS-declared on this response (headers/ETag_Template_adl1_4.yaml —
      # "identifier of Template"), weak-prefixed per the overview
      # §Deprecated headers MUST; register AMB-112.
      ETag: { match: 'pattern:W/"<template_id>"', applies: { its_rest: ">=1.1.0" } }
      Location: present                   # Location_Template_adl1_4 on the same response
  # The refusal branch is MAPPED so a server that will not serve the Accept
  # this binding declares is JUDGED rather than swallowed as an unmapped
  # status (issue #629). Ground: docs/overview/Requests_and_responses.md
  # §"HTTP status codes", row `406 Not Acceptable` — "The target resource does
  # not have a current representation that would be acceptable to the user".
  not_acceptable: { status: 406 }
  already_exists: { status: 409 }         # 409_template_already_exists.yaml: "`409 Conflict` is returned when a template with same `template_id` already exists" — AMB-4, gating for every server since 2026-07-28
  validation_failed:
    status: 422                           # ITS-REST overview §HTTP status codes — 422 = semantic errors
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
captures:
  template_id:
    from: body "template_id"              # implementation latitude (AMB-4 area)
    fallback: header Location last-segment
