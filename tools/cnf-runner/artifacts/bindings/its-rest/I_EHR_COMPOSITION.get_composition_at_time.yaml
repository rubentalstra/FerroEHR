# Wire realization of I_EHR_COMPOSITION.get_composition_at_time for
# ITS-REST 1.1.0.
# The SM get_composition_at_time(ehr_id, versioned_object_uid, a_time) is
# realized as GET /ehr/{ehr_id}/composition/{versioned_object_uid} with the
# optional `version_at_time` query parameter: the version extant at the given
# time, or (time omitted) the latest (composition_get.yaml). No version extant
# at the requested time is a 404 (404_unknown_ehr_id_or_no_version_at_time.yaml).
# The `a_time` flow argument maps to the `version_at_time` QUERY parameter
# (parameters/query/version_at_time.yaml).
# Sources: specifications/operations/composition_get.yaml (200/204/404),
# parameters/query/version_at_time.yaml, responses/200_COMPOSITION_retrieved.yaml,
# 204_deleted_at_time.yaml, 404_unknown_ehr_id_or_no_version_at_time.yaml.
sm_operation: I_EHR_COMPOSITION.get_composition_at_time
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  query:
    version_at_time: "${a_time?}"         # omitted -> latest (composition_get.yaml)
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_COMPOSITION_retrieved.yaml
    headers:
      Content-Type: negotiated
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } }
      Last-Modified: present
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
  ok_empty: { status: 204 }               # version extant at the requested time is a logical delete (204_deleted_at_time.yaml)
  not_found: { status: 404 }              # unknown ehr_id, unknown versioned_object_uid, or no version at the requested time
  bad_request:
    # The kind is `bad_request`, not `validation_failed`: the 2026-07-28
    # schedule release (#544) added it for the malformed-REQUEST family whose
    # meaning quotes the very row cited below, while `validation_failed` means
    # 422 — well-formed content that is semantically invalid — and was only
    # borrowed here while the closed taxonomy had no malformed-request kind.
    # The wire status is unchanged (400 before and after).
    #
    # A `version_at_time` outside the extended ISO 8601 grammar the DOCS TEXT
    # makes a MUST (overview Resources.md §Datetime format: "HTTP query
    # parameters and path segments that are dates, datetimes, or times, MUST
    # always use the _extended_ ISO 8601 format") is exactly the overview's
    # 400 row: "The service cannot or will not process the request due to
    # something that is perceived to be a client error (e.g., malformed
    # request syntax, syntactically invalid content)" — the same mapping the
    # sibling I_EHR_STATUS.get_ehr_status#at_time binding carries.
    status: 400
    body: error_loose
server_assigned: [uid]                    # the retrieved resource carries the server-assigned version uid the committed payload lacks
