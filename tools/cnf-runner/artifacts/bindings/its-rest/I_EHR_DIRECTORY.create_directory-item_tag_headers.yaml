# Wire realization of I_EHR_DIRECTORY.create_directory, variant
# `item_tag_headers`: the SAME released directory commit, driven with the
# `openehr-item-tag` wrapper header set, so the FOLDER container's tag
# collection can be read back.
#
# WHY A FOLDER MAY BE TAGGED AT ALL — ITS-REST overview
# Requests_and_responses.md §openehr-item-tag and openehr-version-item-tag, the
# DOCS TEXT, naming the resource types by name: the two headers "provide a
# lightweight mechanism for associating tags with change-controlled resources
# (e.g. COMPOSITION, EHR_STATUS, FOLDER, etc.)". The DIRECTORY is a
# change-controlled FOLDER (RM ehr master04-ehr_package.adoc §EHR.directory),
# and this operation is one of the creation operations §Usage in Requests binds
# the header to ("When used as request headers for creation or update
# operations (`PUT`, `POST`), the header instructs the system which ITEM_TAG
# list should be associated with the target VERSION or VERSIONED_OBJECT
# resource").
#
# WHY THE READ-BACK IS THE EHR-WIDE LISTING AND NOT A DIRECTORY TAG ROUTE: the
# release defines NO dedicated /directory/.../tags operations — the twenty-three
# tag operations cover COMPOSITION, EHR_STATUS and the five party kinds only.
# That asymmetry with the FOLDER the header section names is a released gap, not
# something a server may close by inventing routes, so a FOLDER tag is reachable
# through the wrapper headers and `ehr_tags_get` ("associated with any target
# VERSION or VERSIONED_OBJECT within the EHR identified by `ehr_id`",
# operations/ehr_tags_get.yaml) — which is exactly what the case drives.
#
# THE ECHO IS A MAY, SO IT IS DECLARED `present?` AND NOT ASSERTED: §Usage in
# Responses says "Servers MAY include the `openehr-item-tag` or
# `openehr-version-item-tag` header in responses to confirm the actual list of
# ITEM_TAGs stored on the server side" (register AMB-166). What the echo would
# CONFIRM is asserted directly instead, by reading the tag back.
#
# The rest of the wire is the variant-less create binding's, for the same
# reasons (see I_EHR_DIRECTORY.create_directory.yaml).
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
sm_operation: I_EHR_DIRECTORY.create_directory
its: its-rest
variant: item_tag_headers
request:
  method: POST
  path: /ehr/{ehr_id}/directory
  body: directory
  headers:
    Prefer: "return=representation"
    openehr-item-tag: 'key="folder-scope",value="clinical"'   # §openehr-item-tag example syntax; VERSIONED_OBJECT (the VERSIONED_FOLDER) target
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # 201_directory.yaml
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # ETag_FOLDER.yaml (weak, W/"<version_uid>")
      Location: present                   # Location_directory.yaml
      Content-Type: negotiated
      openehr-item-tag: "present?"        # MAY — §Usage in Responses ("Servers MAY include …")
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: ["**/uid"]
