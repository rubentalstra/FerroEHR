# EXTENSION realization of I_DEFINITION_ADL14.upload_archetype, variant
# wrong_media_type: the ADL 1.4 archetype upload is sent DECLARING
# `Content-Type: application/json` on a route whose only body form is ADL
# source text.
#
# NO RELEASED WIRE EXISTS (register AMB-41 — the ITS-REST docs text names no
# ADL 1.4 archetype resource and the released definition OAS declares
# /definition/template/adl1.4* alone), so the refusal rule is the SERVED
# route's own documented contract, not a released MUST: the route accepts
# `text/plain` and nothing else, and a request declaring another payload type
# cannot be processed as ADL source, so it is refused 415 before any parse.
#
# The body is the same VALID archetype the round-trip case uploads, so nothing
# but the declared media type distinguishes this exchange — the refusal is a
# media-type decision, never a parse outcome.
sm_operation: I_DEFINITION_ADL14.upload_archetype
its: its-rest
variant: wrong_media_type
extension:
  family: adl14-archetype
  reason: >-
    ITS-REST 1.1.0 provisions operational templates only, so the SM ADL 1.4
    archetype operations have no released wire; this product serves them on
    its own /definition/archetype/adl1.4 routes, which is what the cases
    drive (owner adjudication 2026-07-29: full implementation over an
    excused claim — the book-CORE required marker drops with the register
    derivation, since an extension realization may never be required).
  source: >-
    SM docs/UML/classes/i_definition_adl14.adoc (upload_archetype); ITS-REST
    specifications/operations (definition_template_adl1.4_* only, no archetype path anywhere);
    ITS-REST specifications/docs/definition (no mention); no openEHR spec governs this — our own
    design/extension
  ambiguity: AMB-41
request:
  method: POST
  path: /definition/archetype/adl1.4
  body: archetype_adl14
  headers:
    Content-Type: application/json        # the DECLARED non-ADL payload type under test
    Accept: application/json
outcomes:
  unsupported_media: { status: 415 }
