# EXTENSION realization of I_ADMIN_DUMP_LOAD.load_ehrs.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the ITS-REST docs text describes the Admin API as EHR deletion only
# (specifications/docs/admin/**), and the released
# specifications/admin.openapi.yaml declares exactly two operations —
# admin_ehr_delete and admin_ehr_delete_all. Nothing in the release populates a
# repository from an archive. Register AMB-33.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `POST /admin/load`, declared in the `admin-dump-load` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the EhrDumpLoad CAPABILITY verdict
# only and never ITS-REST wire conformance.
#
# `load_ehrs(file_sys_loc)` takes exactly ONE parameter
# (i_admin_dump_load.adoc), so the body carries that one member and the archive
# container is detected by the service from what the location holds.
sm_operation: I_ADMIN_DUMP_LOAD.load_ehrs
its: its-rest
extension:
  family: admin-dump-load
  reason: >-
    ITS-REST 1.1.0 realizes only admin_ehr_delete / admin_ehr_delete_all of the
    SM Admin surface, so the SM load_ehrs has no released wire; this product
    serves the operation on its own /admin/load route, which is what the cases
    drive.
  source: >-
    SM docs/UML/classes/i_admin_dump_load.adoc (load_ehrs — "Populate EHR
    repository from export archive on file system. Repository need not be
    empty, but import EHRs with duplicate EHR ids will fail") +
    dump_load_fail_report.adoc vs released ITS-REST
    specifications/admin.openapi.yaml (admin_ehr_delete + admin_ehr_delete_all
    only) + specifications/docs/admin/** (no dump/load resource) — no openEHR
    spec governs the extension route, our own design/extension
  ambiguity: AMB-33
request:
  method: POST
  path: /admin/load
  body:
    file_sys_loc: "${file_sys_loc}"
  headers:
    Content-Type: application/json
outcomes:
  # `load_ehrs` returns `List<DUMP_LOAD_FAIL_REPORT>`
  # (dump_load_fail_report.adoc), so a fulfilled call carries the report array.
  # A NON-empty array is still a fulfilled call: the SM makes duplicate-id
  # failure a PER-ENTITY report ("import EHRs with duplicate EHR ids will
  # fail"), not an operation failure. Nothing released governs this route; the
  # status choice is ours (RFC 9110 §15.3.1).
  ok:
    status: 200
  # SM `precondition_violation`: no `file_sys_loc`.
  bad_request:
    status: 400
