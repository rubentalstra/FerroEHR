# Wire realization of I_EHR_COMPOSITION.update_composition, variant
# `no_if_match`: the COMPOSITION PUT sent WITHOUT the `If-Match` precondition
# header the variant-less realization always supplies. Identical to that
# binding in every other respect, so a red row localizes to the
# missing-precondition branch alone.
#
# The omission is the point of the variant: the request model has no
# "deliberately omit a declared header" form, so a binding FILE that simply
# does not declare `If-Match` is how the case expresses it.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "When the service expects `If-Match`
# for an operation, but the client does not provide it, the service SHOULD
# respond with `400 Bad Request`." The COMPOSITION PUT is such an operation:
# the same section scopes the header to "a small set of versioned resources in
# this specification, when the `preceding_version_uid` is not part of the
# endpoint path segment" — PUT /ehr/{ehr_id}/composition/{versioned_object_uid}
# carries the VERSION CONTAINER id in its path, never the preceding VERSION
# uid, so the precondition has nowhere else to travel (the operation's own
# description says it outright: "The existing latest `version_uid` of
# COMPOSITION resource (i.e. the `preceding_version_uid`) must be specified in
# the `If-Match` header", specifications/operations/composition_update.yaml).
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
variant: no_if_match
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    Prefer: "return=representation"
formats: [canonical-json]
outcomes:
  precondition_missing:
    status: 400                           # overview §If-Match and accidental overwrites — "the service SHOULD respond with `400 Bad Request`"
    body: error_loose
