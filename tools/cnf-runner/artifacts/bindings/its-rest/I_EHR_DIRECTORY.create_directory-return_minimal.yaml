# Wire realization of I_EHR_DIRECTORY.create_directory, variant
# `return_minimal`: the directory create states the minimal preference
# EXPLICITLY. The variant-less binding pins `Prefer: return=representation`, so
# this preference needs its own realization.
#
# ORACLE ORDER for the status/body pair (register AMB-62, re-adjudicated
# 2026-07-28). TIER 1, THE DOCS TEXT, is SILENT — not conflicting: overview
# `Requests_and_responses.md` §"Prefer minimal, identifier or full
# representation response" offers "The HTTP status is typically `201 Created`"
# (descriptive) and "If no response body is returned, the service SHOULD use
# `204 No Content`" (conditional on a fact the same text never assigns). TIER 2,
# THE RELEASED OAS, fills exactly that silence and is cited AS the OAS:
# `operations/directory_create.yaml` maps success to a single `'201'` and
# declares no `'204'`, and `responses/201_directory.yaml` closes "If the
# `Prefer` header is missing or set to `return=minimal`, the body is empty"
# (verified first-hand 2026-07-28 — the same closing sentence the COMPOSITION,
# PERSON, CONTRIBUTION and template-upload 201 files carry verbatim).
#
# `Location` IS declared, on the docs text's own SHOULD — §Prefer minimal: "The
# response SHOULD include a `Location` header pointing to the newly created or
# updated resource" — corroborated by the released 201 header block
# (`headers/Location_directory.yaml`). No `Content-Type`: Resources.md §JSON
# Format requires it "unless the response has no content body", and this branch
# has none.
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
sm_operation: I_EHR_DIRECTORY.create_directory
its: its-rest
variant: return_minimal
request:
  method: POST
  path: /ehr/{ehr_id}/directory
  body: directory
  headers:
    Prefer: "return=minimal"
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # OAS operations/directory_create.yaml — the one declared success status
    # AMB-62 re-adjudicated 2026-07-28: 204 is a CONFORMANT answer to this
    # branch too, so both are judged and neither server's answer is
    # inconclusive. Once the OAS fill supplies "the body is empty", the
    # docs-text conditional it satisfies FIRES — overview §"Prefer minimal,
    # identifier or full representation response": "If no response body is
    # returned, the service SHOULD use `204 No Content`" — and the docs text
    # outranks the OAS. It is a SHOULD, not a MUST, and the release's own
    # computable artifact declares 201 for this operation, so 201-with-an-
    # empty-body is a weighed deviation rather than a violation. That 204 is
    # reachable at all under `minimal` is the docs text's own contrast: the
    # SIBLING preference is the one it excludes it from (§"Prefer only
    # identifier": "the status will be `201 Created` or `200 OK`, never `204
    # No Content`").
    alt_status: [204]
    body: absent                          # OAS responses/201_directory.yaml — "If the `Prefer` header is missing or set to `return=minimal`, the body is empty"
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # the weakness indicator is a MUST — overview §Deprecated headers
      Location: present                   # overview §Prefer minimal — "The response SHOULD include a `Location` header pointing to the newly created or updated resource"
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
