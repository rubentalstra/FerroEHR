# Wire realization of I_PARTY.get_party, variant `organisation`: the SAME SM read
# over the ORGANISATION route family — the read half of the kind-parity spot rows
# (the create half is I_DEMOGRAPHIC_SERVICE.create_party#organisation).
#
# Header discipline is the variant-less binding's, for the same docs-text
# reasons (ITS-REST overview Requests_and_responses.md): the weak `ETag`
# identifies the served version (§"ETag and Last-Modified" — "usually taken
# from e.g. VERSIONED_OBJECT.uid.value, VERSION.uid.value", with the `W/`
# weakness indicator), and `Location` MUST BE ABSENT on a read (§Location:
# "It MUST NOT be used to indicate an alternate representation of an existing
# resource (e.g. via `GET` method)").
#
# Sources: specifications/operations/organisation_get.yaml (200/204/404);
# responses/200_ORGANISATION_retrieved.yaml, 404_not_found_or_no_version_at_time.yaml.
sm_operation: I_PARTY.get_party
its: its-rest
variant: organisation
request:
  method: GET
  path: /demographic/organisation/{versioned_object_uid}
formats: [canonical-json]
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"'
      Location: absent
  not_found:
    # The route addresses a version container of ANOTHER kind. DOCS TEXT
    # (overview Requests_and_responses.md §HTTP status codes, the 404 row
    # verbatim): "The origin service did not find the target resource or is
    # not willing to disclose that one exists." RM common
    # master06-change_control_package.adoc §Typing makes a version container
    # single-typed — "all versions in a given `VERSIONED_OBJECT` are of the
    # same type … and the version container itself is properly typed" — so an
    # ORGANISATION with that uid does not exist. Register AMB-131 carries the
    # adjudication; the same outcome also covers a simply unknown uid.
    status: 404
