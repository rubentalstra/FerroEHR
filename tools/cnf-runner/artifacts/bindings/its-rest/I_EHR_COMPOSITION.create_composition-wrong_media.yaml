# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# wrong_media_type: the COMPOSITION commit is sent declaring a payload media
# type that is not a representation of ANY openEHR resource form —
# `text/plain`. The canonical endpoint accepts the canonical JSON/XML and the
# simplified representations only, so the service cannot process the payload
# and MUST refuse with 415. Decisive docs-text sentences (ITS-REST overview
# Resources.md): §JSON Format — "If the service cannot process the request
# payload as JSON format, it MUST respond with HTTP status code `415
# Unsupported Media Type`"; §XML Format states the mirror rule for a payload
# the service cannot process as XML.
#
# One behaviour per case (the I_DEFINITION_ADL14.upload_opt-wrong_media
# precedent): the body is the same valid canonical COMPOSITION the
# variant-less create_composition binding commits, so only the declared media
# type distinguishes this exchange — the refusal is a media-type decision, not
# a parse or validation outcome.
#
# Sources (ITS-REST DOCS TEXT — the wire oracle, not the stalled OAS):
#   specifications/docs/overview/Resources.md §JSON Format + §XML Format.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: wrong_media_type
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Content-Type: text/plain              # the DECLARED unprocessable payload type under test
outcomes:
  unsupported_media: { status: 415 }      # Resources.md §JSON Format MUST
