# Wire realization of the ADL 1.4 "Get example data by template" endpoint,
# variant `example_invalid_detail_level`: a `detail_level` value OUTSIDE the
# declared enum.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §HTTP status codes,
# row 400 — the wire oracle): "The service cannot or will not process the
# request due to something that is perceived to be a client error (e.g.,
# malformed request syntax, syntactically invalid content)"; the same section
# adds "Status code `400` indicates normally a bad request, as well as a
# generic client-side error, used when no other `4xx` error code is
# appropriate". `parameters/query/example_detail_level.yaml` declares the
# closed enum [required, medium, complete], so `verbose` is a syntactically
# invalid parameter value — the row-400 case directly, and the operation
# declares the 400 branch.
#
# This is NOT the either/or of the operation's fall-back sentence ("When the
# server does not support the requested `type` or `detail_level`, it will fall
# back to the closest supported level, or it may return an error (typically
# `400 Bad Request`)"), which concerns an enum member the server does not
# IMPLEMENT. An out-of-enum value has no closest supported level to fall back
# to in the first place. Our position on the either/or itself is register entry
# AMB-115.
#
# The closed outcome taxonomy has no dedicated malformed-request kind, so the
# 400 is expressed with `validation_failed` — the kind the catalogue already
# uses at 400 wherever a released sentence puts malformed input there
# (I_EHR_COMPOSITION.get_composition_at_time, I_DEFINITION_QUERY.store_query).
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example_invalid_detail_level
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example
  query:
    type: input
    detail_level: verbose                # outside the declared enum [required, medium, complete]
outcomes:
  validation_failed:
    status: 400                          # §HTTP status codes row 400 — syntactically invalid parameter
    body: error_loose                    # §HTTP status codes — 4xx detail is a MAY under Prefer: return=representation
