# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# `version_bare_deprecated`: the committal VERSION metadata rides the
# DEPRECATED header name from the §"Deprecated headers" table —
# `openEHR-VERSION` instead of the Release-1.1.0 `openehr-version`.
#
# Why it MUST still work (ITS-REST overview Requests_and_responses.md
# §"Deprecated headers"): the table row "openEHR-VERSION | openehr-version",
# plus "While the deprecated headers remain available for backward
# compatibility, their use is strongly discouraged." Backward compatibility is
# the assigned behaviour: the deprecated name still carries the committal
# VERSION metadata that §"openehr-version and openehr-audit-details" defines
# ("whatever is provided it MUST be merged with the default VERSION and
# VERSION.audit_details attributes on commit runtime").
#
# How this row DIFFERS from the two deprecated rows already cased
# (I_EHR_COMPOSITION.create_composition-deprecated_template_id,
# I_EHR_COMPOSITION.update_composition-audit_bare_deprecated): those two names
# carry an UNDERSCORE (`openEHR-TEMPLATE_ID` -> `openehr-template_id`,
# `openEHR-AUDIT_DETAILS` -> `openehr-audit_details`), so they fold to
# genuinely different field names than their replacements. `openEHR-VERSION`
# folds to exactly `openehr-version`, so under RFC 9110 §5.1 ("Field names are
# case-insensitive") a conformant HTTP server reaches the same handler for
# free. The case is still authored rather than assumed: the released table
# makes the old spelling normative, and a server that matches custom field
# names case-SENSITIVELY (the RFC 9110 §5.1 violation) drops the committal
# metadata silently — which is precisely the backward-compatibility failure
# this row exists to catch.
#
# Identical to the variant-less binding except for the header spelling, so a
# red row localizes to the deprecated-name acceptance alone. The case supplies
# `${lifecycle_state}`.
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: version_bare_deprecated
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Prefer: "return=representation"
    openEHR-VERSION: 'lifecycle_state.code_string="${lifecycle_state}"'   # the DEPRECATED spelling under test (§Deprecated headers table row)
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # the commit is accepted exactly as under the new header name
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::1"', applies: { its_rest: ">=1.1.0" } }  # overview §ETag and Last-Modified + §Deprecated headers (the W/ indicator is a MUST)
      Location: present                   # overview §Location (201 Created)
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid, context/_uid, "composer/external_ref", territory/terminology_id]
