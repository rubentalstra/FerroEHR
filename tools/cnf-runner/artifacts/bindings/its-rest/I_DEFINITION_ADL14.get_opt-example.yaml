# Wire realization of the "Get example data by template" endpoint for
# ITS-REST 1.1.0. The SM I_DEFINITION_ADL14 interface defines NO
# example-generation operation (grep of SM docs/UML/classes/i_definition_adl14.adoc:
# archetypes_count/delete_*/get_archetype/get_opt/has_*/list_*/opts_count/
# upload_*/valid_* only), so this surface is anchored to the closest genuine
# SM operation, get_opt (both key on template_id and return template-derived
# content), with sm_operation carrying the resolvable
# anchor even when the CNF/wire realization diverges from the SM name).
#
# This is a SECOND realization of I_DEFINITION_ADL14.get_opt (the plain
# /definition/template/adl1.4/{template_id} OPT GET is the first). The two are
# selected by the flow step `variant`: this example realization by
# `variant: example`, the plain OPT GET by its absence (the binding `variant`
# discriminator; a variant-less step selects the variant-less plain binding).
#
# Sources: specifications/operations/definition_template_adl1.4_example_get.yaml
# (operationId definition_template_adl1.4_example_get, "Get example data by
# template"; Accept controls the returned data instance format via
# parameters/header/Accept_LOCATABLE.yaml), responses 200/404/406.
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example  # definition_template_adl1.4_example_get.yaml
  query:
    type: input                          # parameters/query (example input vs output data instance)
    detail_level: required               # parameters/query (required | medium | complete)
# The example is a LOCATABLE (COMPOSITION) instance negotiable across canonical
# JSON/XML and the FLAT/STRUCTURED simplified forms (Accept_LOCATABLE.yaml).
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
outcomes:
  ok:
    status: 200                          # 200 (example instance in the negotiated format)
    headers: { Content-Type: negotiated }
  not_acceptable: { status: 406 }        # 406.yaml — Accept outside the LOCATABLE forms (e.g. application/openehr.wt+json)
  not_found: { status: 404 }             # 404_unknown_template_id.yaml — unknown template_id
