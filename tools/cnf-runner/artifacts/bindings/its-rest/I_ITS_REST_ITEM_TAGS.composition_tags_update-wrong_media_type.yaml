# Wire realization of I_ITS_REST_ITEM_TAGS.composition_tags_update, variant
# wrong_media_type: the tag PUT is sent declaring a payload media type the
# ITEM_TAG collection has no representation for — `text/plain`.
#
# DOCS TEXT (ITS-REST overview Resources.md, the wire oracle), the decisive
# MUST, verbatim: §JSON Format — "If the service cannot process the request
# payload as JSON format, it MUST respond with HTTP status code `415
# Unsupported Media Type`"; §XML Format states the mirror rule for an XML
# payload. The tag collection has ONE representation: the released requestBody
# of operations/composition_tags_update.yaml declares `application/json` only
# (an array of schemas/common/UpdateItemTag.yaml), no ITEM_TAG type exists
# anywhere in ITS-XML (register AMB-97), and the Simplified Formats
# sub-specification models no tag payload — so `text/plain` is a payload type
# no representation of this resource can consume and the refusal is
# unconditional. Unlike §Simplified Formats' own 415, which is conditioned on
# a service NOT supporting the format, nothing here is implementation-defined:
# there is no branch on which `text/plain` could be processable.
#
# One behaviour per case (the I_EHR_CONTRIBUTION.commit_contribution-
# wrong_media_type precedent): the body is the same valid tag array the
# variant-less binding sends, so ONLY the declared media type distinguishes
# the exchange — the refusal is a media-type decision, not a parse or an
# invariant outcome.
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved CATALOGUE pseudo-interface, NOT
# an SM interface — the vendored SM models no tag concept at all — pinned in
# NON_SM_REST_OPERATIONS (tools/cnf-runner/src/validate.rs) and adjudicated in
# register AMB-161.
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
its: its-rest
variant: wrong_media_type
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{uid_based_id}/tags
  body: tags                              # requestBody: required, application/json array of schemas/common/UpdateItemTag.yaml
  headers:
    Content-Type: text/plain              # the DECLARED unprocessable payload type under test
outcomes:
  unsupported_media: { status: 415 }      # Resources.md §JSON Format MUST
