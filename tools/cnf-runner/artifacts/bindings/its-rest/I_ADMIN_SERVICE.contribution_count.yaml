# EXTENSION realization of I_ADMIN_SERVICE.contribution_count.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the ITS-REST docs text describes the Admin API as EHR deletion only
# (specifications/docs/admin/**), and the released
# specifications/admin.openapi.yaml declares exactly two operations —
# admin_ehr_delete and admin_ehr_delete_all. No reporting/statistics path
# exists anywhere in the release. Register AMB-33.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `GET /admin/report/contribution/count`, declared in the
# `admin-activity-report` family of vocab/wire_surface.yaml served_extensions.
# NO openEHR SPEC GOVERNS IT — our own design/extension. It therefore gates the
# ActivityReport CAPABILITY verdict only and never ITS-REST wire conformance;
# the capability-matrix row carries `realization: extension`, which may never be
# `required` (owner ruling 2026-07-28).
#
# THE ENVELOPE below is what the route serves. `a_service` carries the SM
# `PLATFORM_SERVICE` member (platform_service.adoc) and the optional
# `time_interval` the SM `Interval<Iso8601_date_time>` as `<lower>/<upper>` —
# the two parameters the SM signature declares, nothing more.
sm_operation: I_ADMIN_SERVICE.contribution_count
its: its-rest
extension:
  family: admin-activity-report
  reason: >-
    ITS-REST 1.1.0 realizes only admin_ehr_delete / admin_ehr_delete_all of the
    SM Admin surface, so the SM contribution_count has no released wire; this product
    serves the operation on its own /admin/report/contribution/count route,
    which is what the cases drive.
  source: >-
    SM docs/UML/classes/i_admin_service.adoc (contribution_count); ITS-REST
    specifications/admin.openapi.yaml (the released admin API declares admin_ehr_delete and
    admin_ehr_delete_all only); ITS-REST specifications/docs/admin (no reporting resource); no
    openEHR spec governs this — our own design/extension
  ambiguity: AMB-33
request:
  method: GET
  path: /admin/report/contribution/count
  query:
    a_service: "${a_service}"
    time_interval: "${time_interval?}"      # absent => the fully open interval
  headers:
    Accept: application/json
formats: [canonical-json]
# NO `applies:` floor rides on these expectations — a floor dates a RELEASED
# rule, and nothing released governs this route.
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated
  # SM `precondition_violation` — a parameter value the operation cannot take:
  # `a_service` naming no `PLATFORM_SERVICE` member (platform_service.adoc),
  # a `time_interval` that is not the `<lower>/<upper>` pair the SM
  # `Interval<Iso8601_date_time>` is carried as, a bound that is not an ISO 8601
  # date-time, or a BOTH-bounded pair whose lower bound is after its upper bound
  # (BASE org.openehr.base.foundation_types.interval.adoc §Invariants,
  # `Limits_consistent`: "(not upper_unbounded and not lower_unbounded) implies
  # lower <= upper" — such a pair is no Interval, so the argument violates its
  # own type). Nothing released governs this route; the status choice is ours
  # (RFC 9110 §15.5.1).
  bad_request:
    status: 400
