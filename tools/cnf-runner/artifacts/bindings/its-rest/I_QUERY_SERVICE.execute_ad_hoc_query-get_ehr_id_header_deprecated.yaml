# Wire realization of I_QUERY_SERVICE.execute_ad_hoc_query, variant
# `get_ehr_id_header_deprecated`: the GET form of ad-hoc execution whose
# single-EHR scope travels under the DEPRECATED header name from the
# §"Deprecated headers" table — `openEHR-EHR-id` instead of the Release-1.1.0
# `openehr-ehr-id`.
#
# Why it MUST still work (ITS-REST overview Requests_and_responses.md
# §"Deprecated headers"): the table row "openEHR-EHR-id | openehr-ehr-id",
# plus "While the deprecated headers remain available for backward
# compatibility, their use is strongly discouraged."
# What the header MEANS is assigned by docs/query/Request.md §"About the
# ehr_id parameter": "Depending on the needs, clients MAY supply it as a query
# parameter `ehr_id` or alternatively as a request header named
# `openehr-ehr-id`", and §"Common Headers and Query Parameters": "Related
# request headers: `openehr-ehr-id` - used to execute the query within a
# single EHR context: an EHR identifier taken from EHR.ehr_id.value".
# So the deprecated spelling must scope the execution exactly as the current
# one does.
#
# Like the `openEHR-VERSION` row (and unlike `openEHR-TEMPLATE_ID` /
# `openEHR-AUDIT_DETAILS`, which fold to underscore names), `openEHR-EHR-id`
# folds to exactly `openehr-ehr-id`, so RFC 9110 §5.1 ("Field names are
# case-insensitive") already reaches the same handler on a conformant server.
# The row is cased rather than assumed because a server matching custom field
# names case-SENSITIVELY silently loses the scope and answers a POPULATION
# query — a wrong-answer failure, not an error the client can see.
#
# The remaining expectations are the variant-less/`get_ehr_id_header` ones,
# same citations:
# - `200` — docs/overview/Requests_and_responses.md §"HTTP status codes", row
#   `200 OK`: "The request succeeded, payload sent in a 200 response depends on
#   the request method".
# - `ETag` — docs/query/Request.md §"Common Headers and Query Parameters":
#   "Related response headers: `ETag` - A unique identifier of the resultSet";
#   its FORM by §"Deprecated headers": "all `ETag` headers that hold a resource
#   identifier MUST include a weakness indicator `W/`".
# - `offset` / `fetch` — docs/query/Request.md §"Common Headers and Query
#   Parameters": "All query execution requests SHOULD support at least the
#   following parameters: ... `offset` - used for paging ... `fetch` - used for
#   paging".
#
# `ehr_id` is deliberately ABSENT from `query` — the point of the variant is
# that the deprecated header ALONE must scope the execution.
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
its: its-rest
variant: get_ehr_id_header_deprecated
request:
  method: GET
  path: /query/aql
  query:
    q: "${q}"                             # Request.md §GET vs POST (`q` parameter)
    offset: "${offset?}"                  # Request.md §Common Headers and Query Parameters
    fetch: "${fetch?}"                    # Request.md §Common Headers and Query Parameters
    query_parameters: "${query_parameters?}"
  headers:
    openEHR-EHR-id: "${ehr_id}"           # the DEPRECATED spelling under test (overview §Deprecated headers table row)
    Accept: application/json
formats: [canonical-json]
outcomes:
  ok:
    status: 200                           # Requests_and_responses.md §HTTP status codes, row 200
    headers: { ETag: 'pattern:W/"[^"]+"' } # Request.md §Common Headers and Query Parameters + overview §Deprecated headers
    body: result_set_body
