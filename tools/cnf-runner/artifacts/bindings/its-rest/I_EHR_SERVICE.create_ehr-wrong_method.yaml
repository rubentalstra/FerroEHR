# Wire realization of I_EHR_SERVICE.create_ehr, variant `wrong_method`: the
# DELIBERATE-WRONG-METHOD form. The request addresses the operation's own
# resource — `/ehr` — with a method that resource does not serve, so nothing
# about `create_ehr` is exercised except the HTTP-method discipline of the
# path it is served on. The variant is the anchoring device the catalogue
# already uses for deliberate-wrong-request forms (upload_opt#wrong_media_type
# sends the wrong Content-Type on the same path); it claims nothing about the
# SM operation beyond owning its resource.
#
# WHY THE METHOD IS `DELETE`, AND WHY THAT IS EXPRESSIBLE AT ALL. The
# overview's §HTTP Methods table is "the following subset is used in this
# specification" — GET, HEAD, POST, PUT, DELETE, OPTIONS — and the binding
# request model's method vocabulary is exactly that subset
# (tools/cnf-runner/src/vocab.rs `HttpMethod`). A method is therefore
# RECOGNIZED by the specification and still not allowed on a given resource
# whenever the release assigns that resource no operation under it, which is
# precisely the antecedent of the second SHOULD. The released `/ehr` resource
# carries POST (ehr_create) and GET (ehr_get_by_subject) and no DELETE
# — specifications/ehr.openapi.yaml `'/ehr'`, whose two members are
# `post: ./operations/ehr_create.yaml` and
# `get: ./operations/ehr_get_by_subject.yaml`. That is cited AS the OAS
# (owner ruling 2026-07-28): the docs text carries no path table at all, so
# the resource's method inventory is a docs-text SILENCE the released OAS
# fills, and nothing is read into it beyond those two path-item members.
# So DELETE /ehr is a recognized-but-not-allowed method on a known resource,
# and no schedule-release extension is needed to author it.
#
# THE OUTCOME — ITS-REST overview `Requests_and_responses.md` §HTTP Methods,
# the decisive sentence: "If a method is recognized but not allowed for the
# target resource, the response SHOULD be `405 Method Not Allowed` status
# code." The `method_not_allowed` kind (vocab/outcomes.yaml) names exactly
# that branch.
#
# THE `Allow` HEADER is required, not decorative: the same §HTTP Methods
# section names RFC 9110 as the authority for method semantics ("HTTP Methods
# are described by RFC 9110"), and RFC 9110 §15.5.6 states "The origin server
# MUST generate an Allow header field in a 405 response containing a list of
# the target resource's currently supported methods". WHAT the matcher may
# assert: the two methods the release itself assigns this resource must be
# among the ones it currently supports, so both tokens appear. The field's
# ORDER is unconstrained by RFC 9110 §10.2.1, and a service may additionally
# support methods the release does not assign here (HEAD alongside GET,
# OPTIONS), so the pattern tolerates order and extra members and asserts only
# the two released memberships — asserting an exact list would claim a set
# neither source fixes. (The empty-Allow arm of §10.2.1 — a resource a
# deployment's configuration leaves serving none — is a different resource
# and stays with the admin-bulk-delete-disabled-405 element.)
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# Register: AMB-60 (the 405/501 overlap and its fixed handling).
sm_operation: I_EHR_SERVICE.create_ehr
its: its-rest
variant: wrong_method
request:
  method: DELETE                          # recognized by §HTTP Methods, assigned no operation on /ehr
  path: /ehr
outcomes:
  method_not_allowed:
    status: 405                           # §HTTP Methods — "the response SHOULD be `405 Method Not Allowed` status code"
    headers:
      Allow: 'pattern:.*(GET.*POST|POST.*GET).*'   # RFC 9110 §15.5.6 MUST; both released methods of /ehr, order and extras unconstrained
    body: error_loose                     # §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
