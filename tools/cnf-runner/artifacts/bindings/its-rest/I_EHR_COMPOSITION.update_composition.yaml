# Wire realization of I_EHR_COMPOSITION.update_composition for ITS-REST 1.1.0.
# Sources: specifications/operations/composition_update.yaml,
# responses/200_COMPOSITION_updated.yaml / 204_version_updated.yaml,
# 412_COMPOSITION.yaml; If-Match per overview Requests_and_responses.
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    If-Match: '"${preceding_version_uid}"'   # REQUIRED (If-Match.yaml); realizes SM preceding_version_uid (ITS-REST overview §If-Match)
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# The request above sends `Prefer: return=representation`, so §Representation
# details negotiation also applies: "The service MAY include a
# `Preference-Applied` header in the response, such as `Preference-Applied:
# return=minimal` or `Preference-Applied: return=representation`, to indicate
# that the client's preference has been honored." Presence is a MAY, so the
# declaration is the optional matcher — the docs text fixes only the VALUE (the
# honoured preference token) when the header is sent, never that it must be.
# TODO: the runner does not evaluate `outcomes.*.headers` matchers yet (only the
# status is classified, tools/cnf-runner/src/exec/outcome.rs), so this
# declaration is the authored contract, not an executed assertion — it becomes
# executable when #403 wires header-matcher evaluation into the step judgement.
outcomes:
  updated:
    status: 200                           # 204 when Prefer minimal (204_version_updated.yaml)
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"'
      Last-Modified: present
      Preference-Applied: "present?"
    body: prefer_conditional
  precondition_failed:
    status: 412                           # 412_COMPOSITION.yaml, MUST
    headers: { ETag: latest-version-uid }
  precondition_missing: { status: 400 }   # If-Match absent -> SHOULD 400 (Requests_and_responses)
  not_found: { status: 404 }              # unknown ehr_id or uid
  version_not_found:
    status: 412                           # unknown preceding version = the If-Match condition
                                          # evaluates FALSE => MUST 412 (overview
                                          # Requests_and_responses §If-Match); the 404 family
                                          # is for unknown PATH ids only
    headers: { ETag: latest-version-uid }
  validation_failed: { status: 422, body: error_loose }
  template_mismatch: { status: 422, body: error_loose }   # wrong-template update (master07)
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid, context/_uid]
