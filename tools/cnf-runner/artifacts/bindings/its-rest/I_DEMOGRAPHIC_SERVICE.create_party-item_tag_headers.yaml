# Wire realization of I_DEMOGRAPHIC_SERVICE.create_party, variant
# `item_tag_headers`: the SAME released party commit (PERSON, the
# representative concrete PARTY subtype — see the variant-less binding's
# polymorphism NOTE), driven with BOTH ITEM_TAG wrapper headers set.
#
# BEHAVIOUR — ITS-REST specifications/docs/overview/Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag, the DOCS TEXT:
#  - "`openehr-item-tag` applies to *VERSIONED_OBJECT* targets."
#  - "`openehr-version-item-tag` applies to a specific target *VERSION* within
#    a VERSIONED_OBJECT."
#  - §Usage in Requests: "When used as request headers for creation or update
#    operations (`PUT`, `POST`), the header instructs the system which ITEM_TAG
#    list should be associated with the target VERSION or VERSIONED_OBJECT
#    resource (depending on the header name)."
# The section is resource-neutral — it speaks of "change-controlled resources
# (e.g. COMPOSITION, EHR_STATUS, FOLDER, etc.)" and of VERSIONED_OBJECT /
# VERSION targets, never of an EHR — and the released
# specifications/operations/person_create.yaml declares both headers in its own
# parameter list, so the demographic commit carries the identical law. (The
# five party UPDATE operations declare only `openehr-version-item-tag` in their
# parameter lists while their own prose says "a `openehr-item-tag` or
# `openehr-version-item-tag` request header can be set" — an OAS-shape omission
# against released prose, adjudicated in register AMB-97; it does not touch
# this create.)
#
# THE ECHO IS A MAY, SO IT IS NOT ASSERTED AS PRESENT: §Usage in Responses,
# "Servers MAY include the `openehr-item-tag` or `openehr-version-item-tag`
# header in responses to confirm the actual list of ITEM_TAGs stored on the
# server side", against this operation's own "The corresponding response
# header(s) will return ITEM_TAGs as they were set by the server"
# (operations/person_create.yaml L6-7) — the released conflict adjudicated in
# register AMB-166, where the DOCS TEXT wins. `present?` is the honest
# declaration; what the echo would confirm is asserted where it is executable —
# the case reads each collection back through the PERSON tag route.
#
# The rest of the wire is the variant-less create binding's (201_PERSON.yaml;
# ETag/Location per overview §"ETag and Last-Modified" and §Location).
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
its: its-rest
variant: item_tag_headers
request:
  method: POST
  path: /demographic/person
  body: party
  headers:
    Prefer: "return=representation"
    openehr-item-tag: 'key="category",value="final"'          # §openehr-item-tag example syntax; VERSIONED_PARTY container target
    openehr-version-item-tag: 'key="reviewed",value="true"'   # §openehr-version-item-tag; the committed VERSION target
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # responses/201_PERSON.yaml
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::1"', applies: { its_rest: ">=1.1.0" } }
      Location: present
      Content-Type: negotiated
      openehr-item-tag: "present?"        # MAY — §Usage in Responses ("Servers MAY include …")
      openehr-version-item-tag: "present?"
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid]
