# Wire realization of I_EHR_COMPOSITION.delete_composition, variant
# `volunteered_if_match`: the DELETE additionally carries an `If-Match`
# precondition the operation does NOT declare (composition_delete.yaml lists
# no such parameter — the version already travels in the path).
#
# Why the header is still evaluated, from the ITS-REST docs text
# (Requests_and_responses.md §"If-Match and accidental overwrites"):
#   "If a service receives this header, and the condition evaluates to
#   `false`, it MUST NOT perform the requested method. Instead, it MUST
#   respond with HTTP status code `412 Precondition Failed`, and SHOULD
#   return also latest `version_uid` in the `ETag` response headers."
# The receipt sentence is unconditional about ANY received `If-Match`; the
# scoping sentence ("required when the preceding_version_uid is not part of
# the endpoint path segment") governs when a CLIENT must send it, not what a
# service does with one it receives. RFC 9110 §13.2.1 precedence still
# applies: a request whose unconditioned answer is not 2xx (unknown uid →
# 404, already deleted → 400, stale path → 409) ignores the precondition.
#
# The header value is its own interpolation variable (`if_match_version_uid`)
# because the point of the variant is that the path and the condition can
# name DIFFERENT versions; identical to the variant-less delete binding in
# every other respect, so a red row localizes to the volunteered-precondition
# branch alone.
sm_operation: I_EHR_COMPOSITION.delete_composition
its: its-rest
variant: volunteered_if_match
request:
  method: DELETE
  path: /ehr/{ehr_id}/composition/{preceding_version_uid}
  headers:
    If-Match: '"${if_match_version_uid?}"'
outcomes:
  deleted:
    status: 204                           # condition true → the delete performs (204_version_deleted.yaml)
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } }
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # DELETE — overview §Deprecated headers
  precondition_failed:
    status: 412                           # condition false → MUST NOT perform (§If-Match and accidental overwrites)
    headers:
      ETag: latest-version-uid            # "SHOULD return also latest version_uid in the ETag response headers"
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # error response — overview §Location (creation/redirect only)
captures:
  version_uid:
    from: header ETag                     # on 204: the new (deleted) VERSION uid; on 412: the latest live version
    strip: weak-quotes
server_assigned: [uid, context/_uid]
