# Wire realization of I_EHR_COMPOSITION.update_composition, variant
# `return_minimal`: the COMPOSITION PUT states the minimal preference
# EXPLICITLY. The variant-less realization pins `return=representation`, so this
# preference needs its own variant.
#
# ORACLE ORDER for the status (register AMB-62, re-adjudicated 2026-07-28).
# TIER 1, THE DOCS TEXT, is SILENT — not conflicting: overview
# `Requests_and_responses.md` §"Prefer minimal, identifier or full
# representation response" offers "The HTTP status is typically `201 Created`"
# (descriptive) and "If no response body is returned, the service SHOULD use
# `204 No Content`" (conditional on a fact the same text never assigns). TIER 2,
# THE RELEASED OAS, fills exactly that silence and is cited AS the OAS:
# `operations/composition_update.yaml` declares BOTH `'200'` and `'204'` and the
# response files split them by preference — `responses/200_COMPOSITION_updated.yaml`
# is scoped to "when `Prefer` header is `return=representation`, or only its
# identifiers when `Prefer` header is `return=identifier`", while
# `responses/204_version_updated.yaml` states "`204 No Content` is returned when
# the update operation was successful and the `Prefer` header is missing or is
# set to `return=minimal`" — the one indicative sentence that assigns this
# branch outright. So an update under the minimal preference is 204.
#
# `ETag` IS declared: a 204 carries no body, so the new version's identity
# travels in the entity tag alone, and the weakness indicator is a MUST
# (overview §Deprecated headers). No `Content-Type` — Resources.md §JSON Format
# requires it "unless the response has no content body".
#
# `Location` is NOT declared here. The §Prefer minimal SHOULD does say "newly
# created or updated resource" and `204_version_updated.yaml` declares a
# `Location` header, but AMB-62's handling scopes the catalogue's Location
# assertion to the CREATE outcomes (wire_surface `header-location-on-create`),
# and a variant binding does not widen an adjudicated scope on its own.
# Declaring nothing forbids nothing: a binding asserts only what it declares.
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
variant: return_minimal
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
    Prefer: "return=minimal"
formats: [canonical-json]
outcomes:
  updated:
    status: 204                             # OAS responses/204_version_updated.yaml — "returned when the update operation was successful and the `Prefer` header is missing or is set to `return=minimal`"
    body: absent                            # 204 No Content
    headers:
      ETag: 'pattern:W/"[^"]+"'             # the weakness indicator is a MUST — overview §Deprecated headers
      Preference-Applied: "present?"        # MAY — overview §Representation details negotiation
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
