# EXTENSION realization of I_DEFINITION_ADL2.artefacts_count.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the ITS-REST docs text names no ADL 2 artefact-count resource
# (specifications/docs/definition/** describes operational-template
# provisioning only), and the released specifications/definition.openapi.yaml
# declares the ADL 2 group as `/definition/template/adl2*` alone — no count path anywhere.
# Register AMB-37.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `GET /definition/artefact/adl2/count`, declared in the `adl2-archetype` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the CAPABILITY verdicts of the rows
# whose cases drive it and never ITS-REST wire conformance.
sm_operation: I_DEFINITION_ADL2.artefacts_count
its: its-rest
extension:
  family: adl2-archetype
  reason: >-
    ITS-REST 1.1.0 has no count endpoint on any definition path, so the SM
    artefacts_count has no released wire; this product serves the operation on
    its own /definition/artefact/adl2/count route, whose body is the bare
    Integer the SM operation returns.
  source: >-
    SM docs/UML/classes/i_definition_adl2.adoc (artefacts_count); ITS-REST
    specifications/definition.openapi.yaml (definition_template_adl2_* only, no count path
    anywhere); ITS-REST specifications/docs/definition (no mention); no openEHR spec governs
    this — our own design/extension
  ambiguity: AMB-37
request:
  method: GET
  path: /definition/artefact/adl2/count
  headers:
    Accept: application/json
formats: [canonical-json]
# NO `applies:` floor rides on these expectations — a floor dates a RELEASED
# rule, and nothing released governs this route.
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated
