# EXTENSION realization of I_EHR_EXTRACT_SERVICE.import_ehr, variant
# wrong_media_type: the whole-EHR import is sent DECLARING
# `Content-Type: text/plain` on a route whose body is a canonical RM `EXTRACT`
# in JSON or XML.
#
# NO RELEASED WIRE EXISTS (register AMB-34 — the release publishes SEVEN API
# groups and no message / EHR-Extract group in either the docs text or the
# OAS), so the refusal rule is the SERVED route's own documented contract, not
# a released MUST: the route reads the body through the shared canonical-RM
# decoder, which accepts the two canonical representations and refuses any
# other DECLARED type with 415 before parsing.
#
# The body is the same VALID EXTRACT the success case imports, so nothing but
# the declared media type distinguishes this exchange.
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr
its: its-rest
variant: wrong_media_type
extension:
  family: message-extract
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract API at all, so the SM
    import_ehr has no released wire; this product serves the operation on its
    own /message/import route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc +
    docs/UML/classes/i_ehr_extract_service.adoc (import_ehr) vs released
    ITS-REST specifications/*.openapi.yaml (seven groups, none of them
    message/extract/tdd) + specifications/docs/** (no such API) — no openEHR
    spec governs the extension route, our own design/extension
  ambiguity: AMB-34
request:
  method: POST
  path: /message/import
  # `an_ehr_id` stays the OPTIONAL query parameter of the variant-less binding;
  # this case supplies none, because the refusal precedes every parameter.
  query:
    ehr_id: "${an_ehr_id?}"
  body: an_extract
  headers:
    Content-Type: text/plain              # the DECLARED non-canonical payload type under test
    Accept: application/json
outcomes:
  unsupported_media: { status: 415 }
