# Wire realization of I_QUERY_SERVICE.execute_ad_hoc_query for ITS-REST 1.1.0.
# Sources: specifications/operations query_execute (POST /query/aql),
# responses/200_Query.yaml, 400_Query.yaml, 408_Query.yaml.
#
# The identifier INSIDE the entity tag is the service's choice (overview
# §"ETag and Last-Modified": "usually taken from e.g. VERSIONED_OBJECT.uid.value,
# …"), so only the weak wrapper is asserted; the strength of the assertion is
# adjudicated at the `ok` outcome below.
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
its: its-rest
request:
  method: POST                            # spec-recommended over GET for parameterized queries
  path: /query/aql
  query:
    ehr_id: "${ehr_id?}"                  # optional single-EHR scope (Request.md §Common Headers and Query Parameters)
  body:
    q: "${q}"
    query_parameters: "${query_parameters?}"
    offset: "${offset?}"
    fetch: "${fetch?}"
  headers:
    Content-Type: application/json
    Accept: application/json
formats: [canonical-json]
outcomes:
  ok:
    status: 200                           # 200_Query.yaml
    # Request.md §Common Headers and Query Parameters (related response
    # headers) + overview §Deprecated headers (the W/ MUST)
    # The resultSet `ETag`: presence is SHOULD-strength, the weak form is a MUST.
    # docs/query/Request.md §"Common Headers and Query Parameters" names the header
    # with no RFC 2119 keyword at all ("Related response headers: `ETag` - A unique
    # identifier of the resultSet"), and the released OAS declares it without
    # `required` (query-codegen.openapi.yaml components/headers/ETag_RESULT_SET), so
    # the only strength anywhere is docs/overview/Requests_and_responses.md §"ETag and
    # Last-Modified": "Both `ETag` and `Last-Modified` SHOULD be included in responses
    # for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
    # state identifiers". A server that omits it is therefore not failed (`optional:
    # true`), while one that emits it must weaken it — §"Deprecated headers": "all
    # `ETag` headers that hold a resource identifier MUST include a weakness indicator
    # `W/`", a MUST the same chapter dates to Release 1.1.0 (`applies`).
    headers: { ETag: { match: 'pattern:W/"[^"]+"', optional: true, applies: { its_rest: ">=1.1.0" } } }
    body: result_set_body
  invalid_query: { status: 400 }          # 400_Query.yaml
  timeout: { status: 408 }                # 408_Query.yaml
  # NOTE: register AMB-210 — no openEHR spec governs runtime generation-set
  # selection (our own design/extension); a whole-object projection reaching a
  # stored version body the active `spec_profile` cannot express refuses the
  # whole query 409 (RFC 9110 §15.5.10), never a silently elided row.
  conflict: { status: 409 }
