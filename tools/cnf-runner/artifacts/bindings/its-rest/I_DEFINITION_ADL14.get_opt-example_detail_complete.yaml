# Wire realization of the ADL 1.4 "Get example data by template" endpoint,
# variant `example_detail_complete`: the fullest `detail_level`.
#
# DOCS TEXT (ITS-REST specifications/operations/definition_template_adl1.4_example_get.yaml
# — the operation `description:` prose IS the released docs text for this API
# group): "`complete`: a full representation of all possible data points; not
# expected to be committable or realistic, and intended as reference guidance
# for how parts of the RM should be represented".
# `parameters/query/example_detail_level.yaml` declares the enum [required,
# medium, complete], so `complete` is a declared, supported value answering the
# same 200.
#
# WHAT IS NOT ASSERTED: that the returned instance is committable. The released
# text says the opposite for this level ("not expected to be committable"), so
# the case reads it as an example instance only, and the operation's NOTE ("The
# implementation and completeness of these examples are not specified, and
# vendors may produce different results") rules out asserting content.
# Register: AMB-115.
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example_detail_complete
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example
  query:
    type: input                          # the released default, held constant so only `detail_level` varies
    detail_level: complete               # parameters/query/example_detail_level.yaml
formats: [canonical-json]
outcomes:
  ok:
    status: 200
    headers: { Content-Type: negotiated }
