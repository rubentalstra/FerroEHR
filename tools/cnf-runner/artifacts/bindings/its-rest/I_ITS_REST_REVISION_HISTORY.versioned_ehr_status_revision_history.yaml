# Wire realization of the RELEASED operation `versioned_ehr_status_revision_history`
# for ITS-REST 1.1.0 — "Retrieves revision history of the VERSIONED_EHR_STATUS
# associated with the EHR identified by `ehr_id`"
# (specifications/operations/versioned_ehr_status_revision_history.yaml), served
# at GET /ehr/{ehr_id}/versioned_ehr_status/revision_history
# (specifications/ehr.openapi.yaml).
#
# ANCHOR: `I_ITS_REST_REVISION_HISTORY` is a reserved CATALOGUE pseudo-interface,
# NOT an SM interface. The vendored SM defines no revision-history operation on
# any interface (grep across docs/specs/openehr/SM/docs/ = zero hits; the
# abstract counterpart is RM common
# UML/classes/org.openehr.rm.common.versioned_object.adoc §Functions
# `revision_history`), while the release publishes three revision-history reads
# — one per versioned family. Case cores speak SM operations only, so without
# the pinned NON_SM_REST_OPERATIONS table (tools/cnf-runner/src/validate.rs)
# these routes would be unnameable AND structurally invisible to the Axis-1
# enumeration. The mechanism and the reservation are adjudicated in register
# AMB-161; register AMB-136 records the ITS→SM realization gap the anchoring
# leaves standing (it is a naming convention, never a claim that SM defines the
# operation). The operation name is the RELEASED operationId verbatim, so this
# row traces to exactly one specifications/operations/<operationId>.yaml.
#
# ORACLE ORDER. The ITS-REST DOCS TEXT is SILENT on revision history — the whole
# specifications/docs/ tree contains zero occurrences of "revision_history" or
# "REVISION_HISTORY" (grep-verified) — so under the 2026-07-28 order the
# RELEASED OAS grounds this binding, and every status/shape citation below is
# cited AS the OAS. The one docs-text sentence that does reach this route is the
# §Location prohibition, which is scoped to the METHOD rather than the resource.
#
# NO `ETag` / `Last-Modified` ARE DECLARED. The docs-text SHOULD is scoped to
# "responses for VERSION, VERSIONED_OBJECT, or other resources that have
# versioning or unique state identifiers" (overview Requests_and_responses.md
# §"ETag and Last-Modified"); a REVISION_HISTORY is a projection of a
# container's audit trail — RM common
# UML/classes/org.openehr.rm.common.revision_history.adoc gives it no `uid` and
# no identity of its own — and the released `200_REVISION_HISTORY.yaml` declares
# only `Content-Type`. Declaring either header would invent an obligation the
# release does not state (the same reasoning the ITEM_TAG bindings carry); not
# declaring one forbids nothing, because a binding asserts what it declares.
#
# NO canonical-XML: ITS-XML publishes a REVISION_HISTORY complexType but NO
# global document element for it, so no released sentence assigns the response's
# document root — register AMB-167 classifies the resource "UNDEFINED, media
# type declared" and pins that no revision-history binding declares
# canonical-xml.
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
#
# OUTCOMES — exactly the released response set of this operation:
#  - `ok` 200: responses/200_REVISION_HISTORY.yaml, "`200 OK` is returned when
#    the requested REVISION_HISTORY is successfully retrieved", header
#    Content-Type -> headers/ContentType_canonical.yaml, content
#    application/json = schemas/common/RevisionHistory.yaml (required: items).
#  - `not_found` 404: responses/404_unknown_ehr_id.yaml.
# The released operation declares NO other response, so no other branch exists.
sm_operation: I_ITS_REST_REVISION_HISTORY.versioned_ehr_status_revision_history
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/versioned_ehr_status/revision_history
formats: [canonical-json]                 # AMB-167: REVISION_HISTORY has no published document element
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated            # 200_REVISION_HISTORY.yaml -> headers/ContentType_canonical.yaml
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location: "MUST NOT be used to indicate an alternate representation of an existing resource (e.g. via `GET` method)"; §Deprecated headers deprecates it on GET responses
    body: present
  not_found: { status: 404 }              # unknown ehr_id (responses/404_unknown_ehr_id.yaml)
