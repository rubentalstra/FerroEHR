# Wire realization of I_PARTY.get_party_at_version, variant
# `versioned_party_at_time`: the VERSION-envelope read of a VERSIONED_PARTY
# selected by TIME —
# GET /demographic/versioned_party/{versioned_object_uid}/version
# [?version_at_time=…] — which serves the ORIGINAL_VERSION envelope (uid,
# commit_audit, data) rather than the bare PARTY the SM read returns.
#
# ANCHORING NOTE: this released route realizes NO SM operation — `I_PARTY`
# declares no operation returning a VERSION envelope, and no versioned-object
# read at all. It is anchored to the closest SM read whose result it serves
# one member of, exactly as register AMB-127 anchors the stored-query
# single-definition read; that is a CATALOGUE NAMING CONVENTION and NOT a
# claim that SM defines the operation. Register AMB-136 carries the full
# demographic realization picture; the container get and the
# `revision_history` sub-resource remain unanchored honest boundaries.
#
# Sources (ITS-REST DOCS TEXT — the wire oracle):
#   - overview Resources.md §Resource identification: a VERSION is retrievable
#     from its version container.
#   - overview Requests_and_responses.md §"ETag and Last-Modified": both
#     "SHOULD be included in responses for VERSION, VERSIONED_OBJECT, or other
#     resources that have versioning or unique state identifiers";
#     Last-Modified "should be derived from
#     VERSION.commit_audit.time_committed.value".
#   - overview Requests_and_responses.md §Location: "It MUST NOT be used to
#     indicate an alternate representation of an existing resource (e.g. via
#     `GET` method)".
#   - overview Requests_and_responses.md §HTTP status codes, the 404 row:
#     "The origin service did not find the target resource or is not willing
#     to disclose that one exists" — no VERSION extant at the requested time.
# The ETag/Last-Modified/Location matchers are EXECUTED assertions (#403).
sm_operation: I_PARTY.get_party_at_version
its: its-rest
variant: versioned_party_at_time
request:
  method: GET
  path: /demographic/versioned_party/{versioned_object_uid}/version
  query:
    # OPTIONAL by the operation's own released description: "If
    # `version_at_time` is supplied, retrieves the VERSION extant _at specified
    # time_, otherwise retrieves the _latest_ VERSION." The optional-ref form
    # lets one binding drive both arms — supplied and omitted.
    version_at_time: "${version_at_time?}"
formats: [canonical-json]
outcomes:
  ok:
    status: 200
    headers:
      ETag: { match: 'pattern:W/".*"', applies: { its_rest: ">=1.1.0" } }
      Last-Modified: present
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }
  not_found:
    status: 404
