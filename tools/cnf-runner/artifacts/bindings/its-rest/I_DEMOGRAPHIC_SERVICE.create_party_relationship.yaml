# ITS-REST 1.1.0 surfaces no wire for the PARTY_RELATIONSHIP operations.
# demographic.openapi.yaml exposes resource endpoints only for the concrete
# actor subtypes (person/organisation/role/group/agent) and the versioned_party /
# contribution resources; PARTY_RELATIONSHIP appears only as a schema/tag, never
# a path. Per RM demographic §PARTY_RELATIONSHIP, a relationship is stored
# by-value in the source PARTY's `relationships` attribute, so it has no
# standalone REST resource. An explicit unrealized declaration (the AMB-17
# delete_opt / AMB-22 list_contributions / AMB-24 get_versioned_directory
# precedent) so the master10 create_party_relationship cases are not-applicable
# WITH CITATION on this ITS and activate when a later ITS release adds the wire.
# Register entry: AMB-32.
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party_relationship
its: its-rest
unrealized:
  reason: >-
    No PARTY_RELATIONSHIP resource exists in ITS-REST 1.1.0
    (demographic.openapi.yaml has no /demographic/party_relationship* path);
    PARTY_RELATIONSHIP is a schema only, and per RM demographic a relationship is
    held by-value in the source PARTY's relationships attribute — the SM
    create_party_relationship has no bindable wire realization.
  source: "SM docs/UML/classes/i_demographic_service.adoc (create_party_relationship) vs ITS-REST specifications/demographic.openapi.yaml (no party_relationship path)"
  ambiguity: AMB-32
