# EXTENSION realization of I_DEMOGRAPHIC_SERVICE.create_party_relationship.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-28 under the oracle
# order: the ITS-REST docs text names no PARTY_RELATIONSHIP resource anywhere
# (specifications/docs/demographic/**), and the released
# specifications/demographic.openapi.yaml declares twenty-seven paths, none of
# them `/demographic/party_relationship*` (`PARTY_RELATIONSHIP` appears only as
# schemas/demographic/PartyRelationship.yaml, the by-value member of
# `PARTY.relationships` — RM demographic master02 §Party Relationships).
# Register AMB-32.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `POST /demographic/party_relationship`, declared in the
# `party-relationship` family of vocab/wire_surface.yaml served_extensions.
# NO openEHR SPEC GOVERNS IT — our own design/extension. It therefore gates the
# PartyRelationshipOperations CAPABILITY verdict ONLY and never ITS-REST wire
# conformance; the capability-matrix row carries `realization: extension`, which
# may never be `required` (owner ruling 2026-07-28).
#
# THE ENVELOPE below is what the route serves. It deliberately mirrors the
# released party create so clients see one consistent surface, but every branch
# is ours: the overview conventions the route follows are a convention it chose,
# never an obligation it inherits.
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party_relationship
its: its-rest
extension:
  family: party-relationship
  reason: >-
    ITS-REST 1.1.0 surfaces no PARTY_RELATIONSHIP resource, so the SM
    create_party_relationship has no released wire; this product serves the
    operation on its own /demographic/party_relationship route, which is what
    the cases drive.
  source: >-
    SM docs/UML/classes/i_demographic_service.adoc (create_party_relationship)
    vs released ITS-REST specifications/demographic.openapi.yaml (no
    party_relationship path) + specifications/docs/demographic/** (no mention) —
    no openEHR spec governs the extension route, our own design/extension
  ambiguity: AMB-32
request:
  method: POST
  path: /demographic/party_relationship
  body: party_relationship
  headers:
    Prefer: "return=representation"
formats: [canonical-json]
# NO `applies:` floor rides on these header expectations — see the note in
# I_PARTY_RELATIONSHIP.get_party_relationship.yaml: a floor dates a RELEASED
# rule, and nothing released governs this route.
outcomes:
  bad_request:
    status: 400                             # overview §HTTP status codes, the 400 row — "could not be parsed or is invalid": the parse class (typed construction refuses missing mandatories, empty 1..* lists, foreign _type; owner ruling 2026-08-03)
    body: error_loose
  created:
    status: 201
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::1"'
      Location: present
      Content-Type: negotiated
    body: prefer_conditional
  validation_failed:
    status: 422
    body: error_loose
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid]
# TODO: case the canonical-XML request/response branch of this extension route
# once a codec-derived cnf.demographic.party_relationship.v1.xml fixture exists
# in the corpus; until then the binding declares only canonical-json, so the XML
# branch is uncovered rather than silently claimed.
