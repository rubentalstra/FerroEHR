# Wire realization of I_EHR_STATUS.set_ehr_queryable, variant
# `audit_change_type`: the whole-EHR_STATUS PUT carrying client-supplied
# AUDIT_DETAILS attributes through the `openehr-audit-details` committal
# request header. Identical to the variant-less realization otherwise, so a
# red row localizes to the committal merge alone.
#
# Decisive docs-text sentences (ITS-REST overview Requests_and_responses.md
# §"openehr-version and openehr-audit-details"):
#   "When it comes to committing content to an openEHR system, for all
#   change-controlled resources (e.g. COMPOSITION, EHR_STATUS, FOLDER, etc.)
#   the services are performing versioning under the hood." — the EHR_STATUS
#   PUT is named as such a resource;
#   "Through the `openehr-audit-details` header, clients MAY supply values for
#   the AUDIT_DETAILS attributes `change_type`, `description`, `committer` and
#   `system_id`.";
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime."
# The multi-attribute comma form on one header line is the same shape the
# section's own `committer.name="John Doe",committer.external_ref.id="…"`
# example uses.
#
# The legal change_type value set is the openEHR `audit_change_type` group
# (RM common master06 §Contributions; TERM group audit_change_type):
# 250|amendment| is a legal update code alongside 251|modification|, so a
# supplied 250 MUST survive to the persisted ORIGINAL_VERSION.commit_audit.
#
# The case supplies `${audit_change_type}` and `${audit_description}`.
sm_operation: I_EHR_STATUS.set_ehr_queryable
its: its-rest
variant: audit_change_type
request:
  method: PUT
  path: /ehr/{ehr_id}/ehr_status
  body: { from_capture: status_body, set: { is_queryable: true } }   # read-modify-write, as the variant-less realization
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
    Prefer: "return=representation"
    openehr-audit-details: 'change_type.code_string="${audit_change_type}",description.value="${audit_description}"'
formats: [canonical-json]
outcomes:
  updated:
    status: 200                             # overview §HTTP status codes — "200 | OK | The request succeeded, payload sent in a 200 response depends on the request method"
    headers:
      ETag: 'pattern:W/"[^"]+"'             # the weakness indicator is a MUST — overview §Deprecated headers
    body: prefer_conditional
captures:
  status_version_uid:
    from: header ETag
    strip: weak-quotes
  version_uid:
    from: header ETag
    strip: weak-quotes
