# EXTENSION realization of I_PARTY_RELATIONSHIP.delete_party_relationship.
#
# NO RELEASED WIRE EXISTS (re-derived first-hand 2026-07-28): the released
# specifications/demographic.openapi.yaml declares no `/demographic/
# party_relationship*` path and the ITS-REST docs text never names the resource
# — register AMB-32.
#
# WHAT THIS BINDING DRIVES: `DELETE /demographic/party_relationship/
# {uid_based_id}` where the path id is the latest VERSION uid — the route this
# product serves of its own design (the `party-relationship` served_extensions
# family), carrying the preceding version IN THE PATH exactly as the released
# party delete does. NO openEHR SPEC GOVERNS IT — our own design/extension — so
# it gates the PartyRelationshipOperations CAPABILITY verdict only, never
# ITS-REST wire conformance.
#
# The delete is LOGICAL (a deletion VERSION is committed), so the SM
# Post_relationship_deleted postcondition is verified through the RM
# change_control version facts, not through a get-after-delete status.
#
# NOTE (a real difference from the released party delete, recorded rather than
# glossed): the `conflict` branch of this route does NOT echo the latest
# `version_uid` in an `ETag`, so no such header is declared here. Nothing
# released governs the route, so nothing is violated — but the divergence is
# stated so a reader is never misled into expecting the released shape.
sm_operation: I_PARTY_RELATIONSHIP.delete_party_relationship
its: its-rest
extension:
  family: party-relationship
  reason: >-
    ITS-REST 1.1.0 surfaces no PARTY_RELATIONSHIP resource, so the SM
    delete_party_relationship has no released wire; this product serves the
    delete on its own /demographic/party_relationship/{uid_based_id} route with
    the preceding version in the path.
  source: >-
    SM docs/UML/classes/i_party_relationship.adoc (delete_party_relationship,
    Post_relationship_deleted); ITS-REST specifications/demographic.openapi.yaml (no
    party_relationship path); ITS-REST specifications/docs/demographic (no mention); no openEHR
    spec governs this — our own design/extension
  ambiguity: AMB-32
request:
  method: DELETE
  path: /demographic/party_relationship/{version_uid}
formats: [canonical-json]
# NO `applies:` floor rides on these header expectations — see the note in
# I_PARTY_RELATIONSHIP.get_party_relationship.yaml: a floor dates a RELEASED
# rule, and nothing released governs this route.
outcomes:
  deleted:
    status: 204
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"'
      Location: absent
  not_found: { status: 404 }
  conflict:
    status: 409
    headers:
      Location: absent
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid]
