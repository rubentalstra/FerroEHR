# Wire realization of I_EHR_SERVICE.create_ehr WITH a client-supplied ehr_id
# for ITS-REST 1.1.0: PUT /ehr/{ehr_id}. The SM operation is
# `create_ehr_with_id` (SM i_ehr_service.adoc: "Create a new EHR with a
# provided EHR id; return the id as a safety check", `Pre_no_duplicate`:
# `not has_ehr (an_ehr_id)`); it is realized as this variant of create_ehr
# because case cores speak one SM operation per binding family and the
# client id is the SM optional argument that chooses the wire form.
# Auto-selected when the step binds a non-null `ehr_id`; a step may also
# select it explicitly via `variant: with_ehr_id`.
#
# Header discipline on the `created` outcome — identical to the variant-less
# I_EHR_SERVICE.create_ehr binding, because this is the same EHR creation
# reached by the other method, and every sentence below is method-neutral
# (ITS-REST overview `Requests_and_responses.md`, the DOCS TEXT, the wire
# oracle):
#   §Location — "it is used in `201 Created` responses when a new resource is
#   successfully created"; "The `Location` header MUST ONLY be used for
#   resource creation (e.g., `201 Created`) or redirect responses".
#   §Deprecated headers — "all `ETag` headers that hold a resource identifier
#   MUST include a weakness indicator `W/`" (the matcher asserts the weak
#   entity-tag envelope only; the identifier INSIDE it is left unconstrained,
#   since §"ETag and Last-Modified" makes the source a choice — "usually taken
#   from e.g. VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value,
#   etc.").
#   §"ETag and Last-Modified" — "Both `ETag` and `Last-Modified` SHOULD be
#   included in responses for VERSION, VERSIONED_OBJECT, or other resources
#   that have versioning or unique state identifiers", and "For openEHR
#   resources, this value [Last-Modified] should be derived from
#   `VERSION.commit_audit.time_committed.value`". Whether the non-versioned
#   EHR resource itself falls inside that scope sentence is register AMB-64;
#   this binding follows that entry's fixed handling, which asserts the header
#   on the CREATION — where a real VERSION.commit_audit.time_committed exists
#   (the EHR_STATUS creation commit, RM ehr master04 §EHR Creation).
# Before #428 this outcome declared only `ETag: present?` and `Location:
# present?`, with no Last-Modified at all. Header matchers are EXECUTED
# assertions (#403, exec/headers.rs) and the optional form never fails, so
# that declaration asserted nothing whatever and let the client-supplied-id
# creation path drift silently from its variant-less twin.
sm_operation: I_EHR_SERVICE.create_ehr
its: its-rest
variant: with_ehr_id
request:
  method: PUT
  path: /ehr/{ehr_id}
  body: ehr_status?                        # optional EHR_STATUS (server defaults otherwise)
  headers:
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml]
outcomes:
  created:
    # ITS-REST overview §HTTP status codes, row 201: "The request has been
    # fulfilled and has resulted in one or more new resources being created".
    status: 201
    headers: { ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }, Last-Modified: present, Location: present }
    body: prefer_conditional
  validation_failed:
    status: 422                           # ITS-REST overview §HTTP status codes — 422 = semantic errors
  # ITS-REST overview §HTTP status codes, row 409: "Indicates that the request
  # could not be processed because it might generate a duplicate or a
  # conflict". Both duplicates this operation can generate land here — the
  # client-supplied ehr_id already in use (SM i_ehr_service.adoc
  # `create_ehr_with_id.Pre_no_duplicate`, error `ehr_create_fail_duplicate_id`)
  # and a subject that already owns an EHR (SM `create_ehr_for_subject`, error
  # `ehr_for_subject_already_exists`). No released sentence gives the two a
  # distinguishable wire signal, so they share the outcome kind and are told
  # apart by CASE, never by expectation — register AMB-63.
  already_exists: { status: 409 }
captures:
  ehr_id:
    from: body "ehr_id.value"
    fallback: header Location last-segment
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [ehr_id, system_id, time_created, ehr_status/uid, ehr_access]
