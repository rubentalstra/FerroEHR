# Wire realization of get_composition_latest requesting the canonical-XML
# response in the ITS-XML **v1** lineage — the NON-DEFAULT direction of the
# declared-option branch of register AMB-169 since the served default flipped
# to v2 (owner ruling 2026-08-03, issue #1666).
#
# THE `version` MEDIA-TYPE PARAMETER IS NOT SPEC-DERIVED. Released ITS-REST
# offers exactly one XML media type and never names a schema namespace or a
# way to select one (overview Resources.md §"XML Format" requires conformance
# to "the [published XSDs]" as a set; §"Data representation" only requires one
# canonical format). The two lineages are an ITS-XML fact — README.adoc
# §"Releases and IM Versions": Release-2.0.0 changed "the internal namespace
# used in the schemas … to `http://schemas.openehr.org/v2`" and is marked
# TRIAL, while Release-1.0.2 remains the STABLE bundle — with no wire
# mechanism attached. So a service that lets a client choose does so by its
# OWN design/extension, and this variant realizes exactly the mechanism such a
# party declares (option `xml-namespace-negotiated`, AMB-169). A party
# declaring `xml-namespace-fixed` is not judged by it.
#
# The Accept is PINNED in request.headers (no format axis), so a format-less
# step preserves the parameter — the same shape as the
# I_DEFINITION_ADL14.get_opt-example_legacy_tds2_accept variant. The
# `Content-Type: negotiated` matcher still executes the released
# §"XML Format" MUST ("Proper header `Content-Type: application/xml` MUST be
# present in the response of the service unless the response has no content
# body"): the matcher compares media TOKENS with parameters stripped, so it
# holds whether or not the service echoes the parameter back.
#
# Sources (ITS-REST DOCS TEXT — the wire oracle):
#   specifications/docs/overview/Resources.md §XML Format, §Data representation;
#   specifications/operations/composition_get.yaml (the 200 branch);
#   responses/200_COMPOSITION_retrieved.yaml.
sm_operation: I_EHR_COMPOSITION.get_composition_latest
its: its-rest
variant: xml_namespace_v1
request:
  method: GET
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  headers:
    Accept: application/xml; version=1   # the declared lineage selector (AMB-169, our-own-extension)
outcomes:
  ok:
    status: 200                          # 200_COMPOSITION_retrieved.yaml
    headers:
      Content-Type: negotiated           # §XML Format MUST, token-compared
