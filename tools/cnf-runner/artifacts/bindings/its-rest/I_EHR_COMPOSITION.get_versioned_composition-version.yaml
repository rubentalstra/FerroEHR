# Wire realization of I_EHR_COMPOSITION.get_versioned_composition, variant
# `version`: read a specific ORIGINAL_VERSION envelope (uid, commit_audit,
# lifecycle_state, data, signature) rather than the VERSIONED_COMPOSITION
# container. This is the RM VERSIONED_OBJECT.version_with_id accessor on the
# versioned composition (RM common master06 §change_control), realized as the
# /version/{version_uid} sub-resource of the versioned object. It surfaces
# VERSION.signature (RM common master06 §Digital Signature) and the
# commit_audit / lifecycle_state facts the signature (and version) assertion
# families verify.
# Sources (ITS-REST DOCS TEXT — tier 1, which wins every conflict; the
# RELEASED OAS fills only what the docs text is silent on and is cited AS
# the OAS where it does — owner ruling 2026-07-28):
#   - Resource: overview Resources.md §Resource identification — a VERSION is
#     retrievable by `version_uid` (OBJECT_VERSION_ID = object_id::system::tree),
#     the "explicit version reference"; its uid is the ORIGINAL_VERSION.uid.
#   - `ok` 200: overview Requests_and_responses.md §HTTP status codes table —
#     "200 | OK | The request succeeded, payload sent in a 200 response depends
#     on the request method" (the payload here is the ORIGINAL_VERSION).
#   - `not_found` 404: same table — "404 | Not Found | The origin service did
#     not find the target resource or is not willing to disclose that one
#     exists" (unknown ehr_id / versioned_object_uid / version_uid).
#   - The envelope's signature: RM common master06 §change_control
#     (ORIGINAL_VERSION.signature).
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
its: its-rest
variant: version
request:
  method: GET
  path: /ehr/{ehr_id}/versioned_composition/{versioned_object_uid}/version/{version_uid}
formats: [canonical-json, canonical-xml]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
outcomes:
  ok:
    status: 200                           # overview §HTTP status codes (200 OK — payload = the ORIGINAL_VERSION)
    headers:
      Content-Type: negotiated
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"'
      Last-Modified: present
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }              # overview §HTTP status codes (404 — target resource not found)
captures:
  # The envelope's stored signature (RM common master06 §Digital Signature:
  # ORIGINAL_VERSION.signature) — capturable so a later step can compare
  # signatures across versions (the distinct-per-version fact).
  signature:
    from: body "signature"
