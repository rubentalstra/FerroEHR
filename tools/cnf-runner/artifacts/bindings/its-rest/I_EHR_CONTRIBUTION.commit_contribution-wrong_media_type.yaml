# Wire realization of I_EHR_CONTRIBUTION.commit_contribution, variant
# wrong_media_type: the CONTRIBUTION commit is sent declaring a payload media
# type that is a representation of NO openEHR resource form — `text/plain`.
#
# DOCS TEXT (ITS-REST overview Resources.md, the wire oracle), the decisive
# MUSTs, verbatim: §JSON Format — "If the service cannot process the request
# payload as JSON format, it MUST respond with HTTP status code `415
# Unsupported Media Type`"; §XML Format states the mirror rule; §Simplified
# Formats states it a third time for the simplified payloads ("If the service
# cannot process the request payload as the simplified format is not
# supported, it MUST respond with HTTP status code `415 Unsupported Media
# Type`"). `text/plain` is none of the four representations this operation
# admits, so no service can process it and the refusal is unconditional —
# unlike the simplified sentence's own 415, which is conditioned on a service
# NOT supporting the format and therefore cannot be required of a service that
# does (that arm stays unforceable and is not declared here).
#
# One behaviour per case (the I_EHR_COMPOSITION.create_composition-
# wrong_media_type and I_DEFINITION_ADL14.upload_opt-wrong_media precedents):
# the body is the same valid canonical CONTRIBUTION envelope the variant-less
# binding commits, so only the declared media type distinguishes the exchange —
# the refusal is a media-type decision, not a parse or validation outcome.
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
its: its-rest
variant: wrong_media_type
request:
  method: POST
  path: /ehr/{ehr_id}/contribution
  body: contribution
  headers:
    Content-Type: text/plain              # the DECLARED unprocessable payload type under test
outcomes:
  unsupported_media: { status: 415 }      # Resources.md §JSON Format MUST
