# Wire realization of I_EHR_COMPOSITION.update_composition, variant
# `return_identifier`: the COMPOSITION PUT asking for the identifier-only
# response with `Prefer: return=identifier`. The variant-less realization pins
# `return=representation`, so the identifier preference needs its own variant.
#
# Decisive docs-text sentences (ITS-REST overview Requests_and_responses.md
# §"Prefer only identifier"): "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`)." and "The
# response body SHOULD contain only the identifier of the affected resource
# formatted according to the `Accept` request header. For example, when
# `application/json` is requested as above, the response body will be a single
# JSON object with a single `uid` attribute." An update creates no new
# resource, so the permitted status on this branch is the 200 half — never the
# 204 the default `return=minimal` may answer.
#
# `Preference-Applied` is declared with the OPTIONAL matcher: §Representation
# details negotiation makes it a MAY ("The service MAY include a
# `Preference-Applied` header in the response … to indicate that the client's
# preference has been honored"), so neither its presence nor its value is
# assertable without over-claiming the MAY (the closed matcher vocabulary has
# no if-present-then-equals form — the standing `header-preference-applied`
# wire_surface boundary).
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
variant: return_identifier
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
    Prefer: "return=identifier"
formats: [canonical-json]
outcomes:
  updated:
    status: 200                             # §Prefer only identifier — "the status will be `201 Created` or `200 OK`, never `204 No Content`"; an update creates nothing, so 200
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # the weakness indicator is a MUST — overview §Deprecated headers
      Content-Type: negotiated              # Resources.md §JSON Format — the Content-Type MUST be present unless the response has no content body
      Preference-Applied: "present?"        # MAY — overview §Representation details negotiation
    body: prefer_conditional                # the identifier branch: a non-empty body carrying `uid`
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
