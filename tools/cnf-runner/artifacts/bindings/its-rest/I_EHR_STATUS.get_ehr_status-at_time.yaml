# Wire realization of I_EHR_STATUS.get_ehr_status, variant `at_time`: the
# EHR_STATUS read carrying the optional `version_at_time` query parameter —
# the ITS-REST realization of the SM operation
# I_EHR_STATUS.get_ehr_status_at_time ("Get the version of the EHR Status
# extant at time `a_time`. If no time supplied, get the latest.", SM
# i_ehr_status.adoc), recorded as such in `vocab/wire_surface.yaml`
# (sm_operations, variant_of). Same resource and same route as the
# variant-less binding; the parameter is the only difference, so a red row
# localizes to the at-time branch alone.
#
# Sources (ITS-REST DOCS TEXT — tier 1, which wins every conflict; the
# RELEASED OAS path `ehr_status_get_at_time` is the tier-2 ground for the
# route shape the docs text does not state, cited AS the OAS — owner ruling
# 2026-07-28):
#   - the parameter's lexical form: overview Resources.md §Datetime format —
#     "HTTP query parameters and path segments that are dates, datetimes, or
#     times, MUST always use the _extended_ ISO 8601 format. The general form
#     of a datetime is `YYYY-MM-DDThh:mm:ss.sss[Z|±hh:mm]`".
#   - `ok` 200 / `not_found` 404 / `validation_failed` 400: overview
#     Requests_and_responses.md §HTTP status codes ("200 | OK | The request
#     succeeded …"; "404 | Not Found | The origin service did not find the
#     target resource …"; "400 | Bad Request | The service cannot or will not
#     process the request due to something that is perceived to be a client
#     error (e.g., malformed request syntax, syntactically invalid content)" —
#     a value outside the extended ISO 8601 grammar is exactly that).
#
# WHICH version each branch serves is not stated by any released text: RM
# common versioned_object.adoc gives only `version_at_time (a_time): VERSION`
# with `Pre: has_version_at_time (a_time)`. Register AMB-70 carries the
# adjudicated fixed handling the at-time cases pin (extancy anchors on the
# commit instant, inclusive at commit; a T at or after the newest commit is
# the newest version, never a 404; a T before the first held commit is 404).
sm_operation: I_EHR_STATUS.get_ehr_status
its: its-rest
variant: at_time
request:
  method: GET
  path: /ehr/{ehr_id}/ehr_status
  query:
    version_at_time: "${a_time?}"         # omitted -> the latest version (SM i_ehr_status.adoc get_ehr_status_at_time)
formats: [canonical-json]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)";
# §Deprecated headers deprecates it on `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200
    headers:
      ETag: 'pattern:W/"[^"]+"'           # the weakness indicator is a MUST — overview §Deprecated headers
      Last-Modified: present
      Content-Type: negotiated
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }              # no version extant at the requested time (overview §HTTP status codes, row 404)
  bad_request:
    # The kind is `bad_request`, not `validation_failed`: what fails here is
    # the REQUEST's own syntax — a `version_at_time` outside the extended
    # ISO 8601 grammar the DOCS TEXT makes a MUST (overview Resources.md
    # §Datetime format: "HTTP query parameters and path segments that are
    # dates, datetimes, or times, MUST always use the _extended_ ISO 8601
    # format") — which is the overview's 400 row verbatim: "The service cannot
    # or will not process the request due to something that is perceived to be
    # a client error (e.g., malformed request syntax, syntactically invalid
    # content)". `validation_failed` is the 422 kind (well-formed content,
    # semantically invalid) and was only borrowed while the closed taxonomy
    # had no malformed-request kind; the 2026-07-28 schedule release (#544)
    # added one. The wire status is unchanged (400 before and after), and this
    # is the same mapping the sibling I_EHR_COMPOSITION.get_composition_at_time
    # binding carries.
    status: 400
    body: error_loose
captures:
  status_version_uid:
    from: header ETag
    strip: weak-quotes
