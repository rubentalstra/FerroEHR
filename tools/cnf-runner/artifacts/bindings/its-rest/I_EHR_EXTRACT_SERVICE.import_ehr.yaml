# EXTENSION realization of I_EHR_EXTRACT_SERVICE.import_ehr.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the release publishes SEVEN API groups (overview, system, ehr,
# demographic, query, definition, admin) and no message / EHR-Extract / TDD
# group in either the docs text (specifications/docs/**) or the OAS
# (specifications/*.openapi.yaml); there are no message_*/extract_*/tdd_*
# operations anywhere in specifications/operations. Register AMB-34.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `POST /message/import{?ehr_id}`, declared in the `message-extract` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the EhrExtract CAPABILITY verdict(s)
# only and never ITS-REST wire conformance; the capability-matrix rows carry
# `realization: extension`, which may never be `required` (owner ruling
# 2026-07-28).
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr
its: its-rest
extension:
  family: message-extract
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract/TDD API at all, so the SM
    import_ehr has no released wire; this product serves the operation on its
    own /message/import route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc +
    docs/UML/classes/i_ehr_extract_service.adoc (import_ehr) vs released ITS-REST
    specifications/*.openapi.yaml (seven groups, none of them
    message/extract/tdd) + specifications/docs/** (no such API) — no openEHR
    spec governs the extension route, our own design/extension
  ambiguity: AMB-34
request:
  method: POST
  path: /message/import
  # `an_ehr_id` is `[0..1]` on the SM signature, so it is an OPTIONAL query
  # parameter: absent, the clone re-uses the source EHR id the extract's
  # EXTRACT_SPEC names (RM common master06 §Copying Case 1).
  query:
    ehr_id: "${an_ehr_id?}"
  body: an_extract
  headers:
    Content-Type: application/json
formats: [canonical-json]
outcomes:
  # A whole EHR is created. Nothing released governs this route; the status
  # choice is ours (RFC 9110 §15.3.2: 201 when the request has created
  # resources). The body names the created EHR, which a caller that supplied
  # no `ehr_id` cannot otherwise know.
  created:
    status: 201
  # SM `precondition_violation` — the payload is not a well-formed EXTRACT, it
  # carries no EHR_STATUS versioned object (EHR.ehr_status 1..1), or it names
  # no source EHR id while `ehr_id` is absent.
  bad_request:
    status: 400
  # SM `ehr_create_fail_duplicate_id` — the clone target must be empty.
  already_exists:
    status: 409
captures:
  ehr_id:
    from: body "uid"
