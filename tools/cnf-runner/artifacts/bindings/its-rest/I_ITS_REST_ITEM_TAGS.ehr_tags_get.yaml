# Wire realization of the RELEASED ITEM_TAG operation `ehr_tags_get` for
# ITS-REST 1.1.0 — the EHR-scoped aggregate: "Retrieves the list of ITEM_TAG
# resources associated with any target VERSION or VERSIONED_OBJECT within the
# EHR identified by `ehr_id`" (specifications/operations/ehr_tags_get.yaml).
# Scoped by construction: `ehr_id` is a path parameter and an unknown one is a
# 404, so the largest answer is one EHR's tags (contrast `demographic_tags_get`
# — register AMB-138).
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved CATALOGUE pseudo-interface, NOT
# an SM interface — the vendored SM models no tag concept at all (the whole
# docs/specs/openehr/SM/docs/ tree contains zero occurrences of "tag",
# grep-verified), while the release defines twenty-three tag operations and
# calls the wrapper headers "convenient wrappers around the dedicated ITEM_TAG
# operations" (specifications/docs/overview/Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag). Case cores speak SM
# operations only, so the pinned NON_SM_REST_OPERATIONS table
# (tools/cnf-runner/src/validate.rs) is what makes these enumerable at all; the
# naming convention is adjudicated in register AMB-161. The operation name is
# the RELEASED operationId verbatim.
#
# NO `ETag` / `Last-Modified`: the overview scopes those to "responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers" (§"ETag and Last-Modified"). An ITEM_TAG collection is
# none of those — an ITEM_TAG carries no uid at all, its identity being the
# (key, target_path) pair (§openehr-item-tag and openehr-version-item-tag:
# "they are uniquely identified by their `key` and `target_path` pair
# attributes"; register AMB-92) — and no released tag response declares either
# header. Neither is declared here: declaring one would invent an obligation
# the release does not state.
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
#
# OUTCOMES — the released response set of this operation:
#  - `ok` 200: responses/200_COMPOSITION_ItemTagList_retrieved.yaml (the
#    released file this cross-kind aggregate declares; that it names the
#    COMPOSITION-specific schema for a response spanning kinds is the released
#    editorial defect registered in AMB-97, so this binding asserts only the
#    document floor and no member shape). "This will return an empty list when
#    there is no matching ITEM_TAG associated with any target within given
#    EHR", so an empty array is a conformant answer.
#  - `not_found` 404: responses/404_unknown_ehr_id.yaml, "`404 Not Found` is
#    returned when an EHR with `ehr_id` does not exist".
#
# The released 400 branch (responses/400.yaml) is NOT declared: the three
# filter parameters are unconstrained strings (parameters/query/tag_key.yaml,
# tag_value.yaml, tag_target_path.yaml), so no request this catalogue can build
# is syntactically invalid. Declaring a branch no case can reach would be an
# invented mapping. (The kind itself is no longer the obstacle: the 2026-07-28
# schedule release, #544, added `bad_request`; the unconstrained-parameter
# reason stands on its own.)
#
# The filter parameters themselves are NOT exercised by this binding: their
# semantics (repeat combination, cross-parameter combination, match mode,
# behaviour against a tag with no target_path) are unstated on both list routes
# — register AMB-94.
sm_operation: I_ITS_REST_ITEM_TAGS.ehr_tags_get
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/tags
formats: [canonical-json]                 # parameters/header/Accept_canonical.yaml
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated            # 200_COMPOSITION_ItemTagList_retrieved.yaml -> headers/ContentType_canonical.yaml
      Location: absent                    # read — overview §Location: the header "MUST ONLY be used for resource creation (e.g., `201 Created`) or redirect responses"; §Deprecated headers deprecates it on GET responses
    body: present
  not_found: { status: 404 }
