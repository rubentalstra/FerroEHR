# Wire realization of I_EHR_STATUS.get_versioned_ehr_status, variant
# `at_time`: the VERSION envelope of the versioned EHR_STATUS extant at a
# given time, realized as GET /ehr/{ehr_id}/versioned_ehr_status/version with
# the optional `version_at_time` query parameter. The RM accessor is
# VERSIONED_OBJECT.version_at_time; the sibling `version` variant addresses a
# VERSION by its uid instead.
#
# Sources (ITS-REST DOCS TEXT — tier 1, which wins every conflict; the
# RELEASED OAS fills only what the docs text is silent on and is cited AS
# the OAS where it does — owner ruling 2026-07-28):
#   - Resource: overview Resources.md §Resources — "versioned entities:
#     VERSIONED_COMPOSITION, VERSIONED_EHR_STATUS, etc. or their contained
#     VERSION instances".
#   - the parameter's lexical form: overview Resources.md §Datetime format —
#     "HTTP query parameters and path segments that are dates, datetimes, or
#     times, MUST always use the _extended_ ISO 8601 format. The general form
#     of a datetime is `YYYY-MM-DDThh:mm:ss.sss[Z|±hh:mm]`".
#   - `ok` 200: overview Requests_and_responses.md §HTTP status codes — "200 |
#     OK | The request succeeded, payload sent in a 200 response depends on the
#     request method".
#   - `not_found` 404: same table — "404 | Not Found | The origin service did
#     not find the target resource or is not willing to disclose that one
#     exists" (no version is extant at the requested time, so there is no
#     target resource).
#   - `validation_failed` 400: same table — "400 | Bad Request | The service
#     cannot or will not process the request due to something that is
#     perceived to be a client error (e.g., malformed request syntax,
#     syntactically invalid content)"; a `version_at_time` value outside the
#     extended ISO 8601 grammar the §Datetime format MUST fixes is
#     syntactically invalid content.
#
# WHICH version is "extant at T" is stated by no released text — RM common
# versioned_object.adoc gives only `version_at_time (a_time): VERSION` with
# `Pre: has_version_at_time (a_time)`. Register AMB-70 carries the adjudicated
# fixed handling the at-time cases pin.
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
its: its-rest
variant: at_time
request:
  method: GET
  path: /ehr/{ehr_id}/versioned_ehr_status/version
  query:
    version_at_time: "${a_time?}"         # omitted -> the latest version
formats: [canonical-json]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)".
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated
      ETag: 'pattern:W/"[^"]+"'           # the weakness indicator is a MUST — overview §Deprecated headers
      Last-Modified: present
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }
  validation_failed:
    status: 400
    body: error_loose
captures:
  status_version_uid:
    from: header ETag
    strip: weak-quotes
