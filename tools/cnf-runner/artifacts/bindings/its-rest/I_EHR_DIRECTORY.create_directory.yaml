# Wire realization of I_EHR_DIRECTORY.create_directory for ITS-REST 1.1.0.
# The SM create_directory(ehr_id, a_dir_struct) creates the EHR.directory
# VERSIONED_FOLDER; realized as POST /ehr/{ehr_id}/directory with the FOLDER
# in the body.
# Sources: specifications/operations/directory_create.yaml (201/400/404),
# responses/201_directory.yaml, 404_unknown_ehr_id.yaml, 400.yaml;
# headers ETag_FOLDER.yaml, Location_directory.yaml.
sm_operation: I_EHR_DIRECTORY.create_directory
its: its-rest
request:
  method: POST
  path: /ehr/{ehr_id}/directory
  body: directory
  headers:
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml]
# The `ETag` weakness indicator is a MUST, not a style note — ITS-REST overview
# `Requests_and_responses.md` §Deprecated headers: "The `ETag` response header
# was used without a weakness indicator `W/`. This is now deprecated, all
# `ETag` headers that hold a resource identifier MUST include a weakness
# indicator `W/`" (§"ETag and Last-Modified" gives the shape:
# `ETag: W/"8849182c-…::openEHRSys.example.com::2"`). The matcher asserts the
# weak entity-tag envelope only; the identifier INSIDE it is left unconstrained
# because the same section makes the source a choice ("usually taken from e.g.
# VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc.").
outcomes:
  bad_request:
    status: 400                             # overview §HTTP status codes, the 400 row — "could not be parsed or is invalid": the parse class (typed construction refuses missing mandatories, empty 1..* lists, foreign _type; owner ruling 2026-08-03)
    body: error_loose
  created:
    status: 201                           # 201_directory.yaml
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # ETag_FOLDER.yaml (weak, W/"<version_uid>")
      Location: present                    # Location_directory.yaml
      Content-Type: negotiated
    body: prefer_conditional
  validation_failed:
    # The SEMANTIC class: a FOLDER that DOES convert to the resource and then
    # fails validation. `responses/422.yaml` scopes 422 to content that "could
    # be converted to a resource, but there are semantic validation errors";
    # `responses/400.yaml` owns the unconvertible half (`bad_request` above) —
    # a body missing a member the release's own request-body schema declares
    # `required` is "syntactically invalid ... content" and never converts.
    # `directory_create.yaml` declares no 422; the docs-text 422 row grounds
    # it, and §HTTP status codes permits "Additional status codes … as long as
    # they do not conflict with the predefined codes".
    status: 422
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  not_found: { status: 404 }              # unknown ehr_id (404_unknown_ehr_id.yaml)
  already_exists: { status: 409 }         # a LIVE directory already occupies the slot (SM Pre_no_directory; RM ehr §EHR.directory 0..1) — no released branch assigns this; register AMB-79 carries the adjudicated 409, whose text the overview §HTTP status codes 409 row supplies ("the request could not be processed because it might generate a duplicate or a conflict")
  conflict:
    # A content write into a DEACTIVATED EHR. RM ehr master04 §EHR Active
    # Status refuses writes to "everything other than the EHR_STATUS object"
    # while `is_modifiable` is false — naming hierarchical Folders alongside
    # Compositions — but no released ITS-REST sentence assigns the refusal a
    # code; register AMB-82 carries the adjudicated 409, the overview §HTTP
    # status codes row for a request that "could not be processed because it
    # might generate a duplicate or a conflict" with the resource's state.
    status: 409
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
captures:
  version_uid:
    from: header ETag                     # the new directory VERSION uid (201_directory.yaml ETag)
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid             # the VERSIONED_FOLDER container id — ITS-REST overview Resources.md §Identifier types: a version_uid's "`object_id` matches the VERSIONED_OBJECT identifier"
    transform: root-uid
# The server-assigned uid, at EVERY FOLDER node: RM common locatable.adoc types
# `uid` `0..1` ("Optional globally unique object identifier for root points of
# archetyped structures") and RM common folder.adoc's NOTE recommends populating
# it only "in _top-level_ (i.e. tree-root) `FOLDER` objects" — a uid at a nested
# archetype-root FOLDER is permitted and unrequired, so it is a server
# assignment, never a content difference. `**` matches every depth of the
# recursive `folders: List<FOLDER>` shape.
server_assigned: ["**/uid"]
