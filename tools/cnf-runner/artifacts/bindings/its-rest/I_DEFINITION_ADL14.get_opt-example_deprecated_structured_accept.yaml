# Wire realization of the "Get example data by template" endpoint requesting
# the DEPRECATED `application/openehr.wt.structured.schema+json`
# representation via Accept — the STRUCTURED twin of
# `example_deprecated_accept` (which pins the FLAT `.schema+json` type). The
# release deprecates BOTH in one sentence, so both need their own wire cell:
# ITS-REST overview Resources.md §Simplified Formats — "The
# `application/openehr.wt.flat.schema+json` and
# `application/openehr.wt.structured.schema+json` which were historically
# available in earlier versions of this specification, are now deprecated and
# will be removed in a future version of the specification." A server that
# does not serve the deprecated representation cannot fulfil the Accept and
# MUST respond 406 — same section: "If the service cannot fulfill this aspect
# of the request, it MUST respond with HTTP status code `406 Not
# Acceptable`".
#
# The deprecated Accept is pinned in request.headers (no format axis), so a
# format-less step preserves it. Whether the deprecated support still exists
# is statement-declared (register AMB-39, option_select).
#
# Sources (ITS-REST DOCS TEXT — tier 1, which wins every conflict; the
# RELEASED OAS fills only what the docs text is silent on and is cited AS
# the OAS where it does — owner ruling 2026-07-28):
#   specifications/docs/overview/Resources.md §Simplified Formats,
#   §Alternative data formats, §Data representation.
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example_deprecated_structured_accept
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example
  query:
    type: input                          # parameters/query (example input vs output data instance)
    detail_level: required               # parameters/query (required | medium | complete)
  headers:
    Accept: application/openehr.wt.structured.schema+json   # DEPRECATED pre-1.1.0 SDT-era STRUCTURED media type (Resources.md §Simplified Formats)
outcomes:
  # ONLY the branch a case drives. The supported branch of this option pair is
  # carried on the Content-Type axis (SF-DEPRECATED-media_supported); an
  # outcome declared here that nothing exercises is a claim, not coverage.
  not_acceptable: { status: 406 }        # unsupported branch: Accept cannot be fulfilled (Resources.md §Simplified Formats 406 MUST)
