# Wire realization of I_DEMOGRAPHIC_SERVICE.create_party, variant `agent`:
# the SAME SM operation over the AGENT route family.
#
# Why the variant exists: the SM create_party(a_version: UV_PARTY) is
# polymorphic over the abstract PARTY, and ITS-REST 1.1.0 surfaces one create
# route per CONCRETE subtype. The variant-less binding realizes the operation
# through PERSON as the representative subtype; this one exercises the
# KIND-PARITY claim that the quintets really are the same operation, not five
# operations that happen to look alike. It is a spot row by design — the five
# route families declare identical parameter sets and identical response sets,
# so re-running the whole PERSON battery on each kind would assert the same
# behaviour five times and localize nothing.
#
# Sources: specifications/operations/agent_create.yaml (201/400/422/404);
# responses/201_AGENT.yaml; docs/overview/Requests_and_responses.md
# §"ETag and Last-Modified" (the weak `ETag` and its W/ MUST), §Location
# (the header on a 201 creation).
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
its: its-rest
variant: agent
request:
  method: POST
  path: /demographic/agent
  body: party
  headers:
    Prefer: "return=representation"
formats: [canonical-json]
outcomes:
  created:
    status: 201
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::1"'
      Location: present
      Content-Type: negotiated
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid]
