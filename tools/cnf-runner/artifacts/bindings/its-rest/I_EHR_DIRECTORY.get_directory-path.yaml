# Wire realization of I_EHR_DIRECTORY.get_directory, variant `path`: the
# latest-directory read NARROWED to a sub-FOLDER by the `path` query
# parameter. Identical to the variant-less binding otherwise, so a red row
# localizes to the path navigation alone.
#
# The parameter is declared on this very operation — ITS-REST
# specifications/operations/directory_get_at_time.yaml, whose description
# says: "If `path` is supplied, retrieves from the directory only the
# sub-FOLDER that is associated with that path." So the SERVED BODY on 200 is
# the sub-FOLDER, not the root — which is what separates this variant from the
# has_path boolean probe on the same wire (that one reads only the status).
#
# The 404 trigger is declared too, by the operation's own response file
# 404_directory_unknown_ehr_id_or_no_version_at_time_or_no_path.yaml: "`404
# Not Found` is returned when an EHR with `ehr_id` does not exist, or when a
# directory does not exist at the specified `version_at_time`, or when `path`
# does not exist within the directory."
#
# The GRAMMAR of the parameter — leading slash, whether the root's own name is
# a segment, duplicate-sibling disambiguation, escaping — is stated by nothing
# released beyond one sentence ("consists of slash-separated values of the
# name attribute of FOLDERs in the directory", parameters/query/path.yaml);
# register AMB-81 carries the adjudicated fixed handling the path cases pin.
sm_operation: I_EHR_DIRECTORY.get_directory
its: its-rest
variant: path
request:
  method: GET
  path: /ehr/{ehr_id}/directory
  query:
    path: "${a_path}"                      # slash-separated FOLDER names (parameters/query/path.yaml)
formats: [canonical-json]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_FOLDER_retrieved.yaml — the body is the addressed sub-FOLDER
    headers:
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }              # "when `path` does not exist within the directory"
# The server-assigned uid, at EVERY FOLDER node: RM common locatable.adoc types
# `uid` `0..1` ("Optional globally unique object identifier for root points of
# archetyped structures") and RM common folder.adoc's NOTE recommends populating
# it only "in _top-level_ (i.e. tree-root) `FOLDER` objects" — a uid at a nested
# archetype-root FOLDER is permitted and unrequired, so it is a server
# assignment, never a content difference. `**` matches every depth of the
# recursive `folders: List<FOLDER>` shape.
server_assigned: ["**/uid"]
