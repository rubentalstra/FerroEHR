# Wire realization of I_EHR_COMPOSITION.update_composition, variant
# `prefer_absent`: NO `Prefer` request header at all. Every other
# update_composition binding pins a `Prefer` value, so the DEFAULT — the branch
# a client gets by saying nothing — needs its own realization to be exercised at
# all.
#
# WHY THE OUTCOME IS THE MINIMAL ONE. Overview `Requests_and_responses.md`
# §Representation details negotiation, DOCS TEXT: "If no `Prefer` header is
# provided, the default behavior is assumed to be `return=minimal`". The
# released response file names both forms in one breath —
# `responses/204_version_updated.yaml`: "`204 No Content` is returned when the
# update operation was successful and the `Prefer` header is missing or is set
# to `return=minimal`" (cited AS the OAS; the docs text assigns this branch no
# status, see the sibling `-return_minimal` binding's oracle-order note and
# register AMB-62).
#
# So this binding declares the SAME outcome as `-return_minimal` and differs
# only in the request: that identity IS the behaviour under test.
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
variant: prefer_absent
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
formats: [canonical-json]
outcomes:
  updated:
    status: 204                             # OAS responses/204_version_updated.yaml — "the `Prefer` header is missing or is set to `return=minimal`"
    body: absent                            # 204 No Content
    headers:
      ETag: 'pattern:W/"[^"]+"'             # the weakness indicator is a MUST — overview §Deprecated headers
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
