# Wire realization of I_EHR_DIRECTORY.delete_directory for ITS-REST 1.1.0.
# The SM delete_directory(ehr_id) logically deletes the directory by creating a
# new (deleted) version; realized as DELETE /ehr/{ehr_id}/directory. The
# existing latest version_uid (SM preceding_version_uid) is the required
# `If-Match` header (ITS-REST overview §If-Match); it is omitted for the empty-EHR / bad-EHR cases
# where no directory version exists to match.
# Sources: specifications/operations/directory_delete.yaml (204/400/404/412),
# responses/204_deleted.yaml, 404_unknown_ehr_id.yaml, 412_directory.yaml;
# header If-Match.yaml.
sm_operation: I_EHR_DIRECTORY.delete_directory
its: its-rest
request:
  method: DELETE
  path: /ehr/{ehr_id}/directory
  headers:
    If-Match: '"${preceding_version_uid?}"'   # REQUIRED when a directory exists (If-Match.yaml); realizes SM preceding_version_uid (ITS-REST overview §If-Match)
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
#
# WHICH identity the 204's `ETag` carries is stated by no released sentence —
# `204_deleted.yaml` declares no headers at all. Register AMB-75 carries the
# adjudicated fixed handling, and the overview supplies both halves of it:
# §"ETag and Last-Modified" says the entity tag "acts as a unique identifier
# for a specific version of a resource" and "changes as soon as the resource
# changes (i.e. when a new version is created)", and "Both `ETag` and
# `Last-Modified` SHOULD be included in responses for VERSION,
# VERSIONED_OBJECT, or other resources that have versioning or unique state
# identifiers" (`Last-Modified` "should be derived from
# VERSION.commit_audit.time_committed.value"). The delete IS such a change —
# RM common master06 §Logical Deletion commits a new VERSION — so the tag
# names that new version, and the weakness indicator is the §Deprecated
# headers MUST. The `<n>` placeholder is deliberately unconstrained here: the
# ordinal depends on how many versions the case committed first; the
# etag_names_new_version case pins the increment.
outcomes:
  deleted:
    status: 204                           # 204_deleted.yaml — logical delete performed
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"'
      Last-Modified: present
      Location: absent                    # DELETE — overview §Deprecated headers
  precondition_failed:
    status: 412                           # 412_directory.yaml (stale If-Match)
    headers: { ETag: latest-version-uid }
  precondition_missing: { status: 400 }   # If-Match absent when required -> 400.yaml
  not_found: { status: 404 }              # unknown ehr_id, or an EHR with no directory to delete (RM ehr §EHR.directory 0..1) — ITS-REST overview §HTTP status codes: 404 = target resource not found; If-Match precedence per RFC 9110 §13.2.2
captures:
  version_uid:
    from: header ETag                     # the NEW 523|deleted| VERSION uid (register AMB-75)
    strip: weak-quotes
