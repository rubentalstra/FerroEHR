# Wire realization of I_EHR_SERVICE.create_ehr, variant `committal`: the EHR
# create carries client-supplied committal metadata through the
# `openehr-audit-details` request header.
#
# Why the headers apply to a CREATE, from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"):
#   "for all change-controlled resources (e.g. COMPOSITION, EHR_STATUS,
#   FOLDER, etc.) the services are performing versioning under the hood";
#   "services MUST also allow PUT, POST and DELETE methods directly on these
#   change-controlled resources"; "In order to allow clients to provide
#   committal metadata, services MUST accept `openehr-version` and
#   `openehr-audit-details` custom request headers"; "None of these headers
#   are mandatory, but whatever is provided it MUST be merged with the default
#   VERSION and VERSION.audit_details attributes on commit runtime."
# EHR creation commits an EHR_STATUS — one of the change-controlled resources
# that sentence names — under a CONTRIBUTION: "the result should be a root EHR
# object, an EHR Status object, and an EHR Access object … created and
# committed in a Contribution" (RM ehr master04-ehr_package.adoc §EHR
# Creation). So the merge MUST governs POST /ehr exactly as it governs a
# COMPOSITION write, and the supplied description/committer MUST survive to
# the persisted EHR_STATUS ORIGINAL_VERSION.commit_audit.
#
# Identical to the variant-less I_EHR_SERVICE.create_ehr binding except the
# added committal header, so a red row localizes to the create-time merge
# alone. The EHR body's `ehr_status` OBJECT_REF names the version CONTAINER
# (a HIER_OBJECT_ID — RM ehr `Ehr_status_valid` + BASE master05
# `OBJECT_REF.id`), so the case fetches the committed VERSION uid from the
# served EHR_STATUS itself (`I_EHR_STATUS.get_ehr_status` step 2).
sm_operation: I_EHR_SERVICE.create_ehr
its: its-rest
variant: committal
applies: { its_rest: ">=1.0.0" }
request:
  method: POST
  path: /ehr
  body: ehr_status?
  headers:
    Prefer: "return=representation"
    openehr-audit-details: 'description.value="EHR opened at triage",committer.name="Dr Chart"'
formats: [canonical-json]
# Outcome set: `created` only. The base binding's error outcomes are NOT
# repeated here — the released docs text assigns no status to a committal
# attribute the server refuses, so declaring one would be an invented
# expectation rather than a spec-derived one.
outcomes:
  created:
    status: 201
    headers: { ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }, Last-Modified: present, Location: present }
    body: prefer_conditional
captures:
  ehr_id:
    from: body "ehr_id.value"
    fallback: header Location last-segment
server_assigned: [ehr_id, system_id, time_created, ehr_status/uid, ehr_access]
