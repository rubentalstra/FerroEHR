# EXTENSION realization variant: the relationship update sent WITHOUT the
# If-Match header the route requires.
#
# Same extension route and same spec position as the variant-less binding (no
# released PARTY_RELATIONSHIP wire exists — register AMB-32); the only
# difference is that the request omits `If-Match` entirely, so the sole outcome
# this variant can reach is the missing-precondition refusal. Keeping it a
# separate binding is what makes the ABSENT-header case expressible at all: a
# case cannot delete a header the variant-less binding always sends.
#
# NO openEHR SPEC GOVERNS the route — our own design/extension — so this gates
# the PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire
# conformance.
sm_operation: I_PARTY_RELATIONSHIP.update_party_relationship
its: its-rest
variant: missing_if_match
extension:
  family: party-relationship
  reason: >-
    ITS-REST 1.1.0 surfaces no PARTY_RELATIONSHIP resource, so the SM
    update_party_relationship has no released wire; this variant drives the same
    extension route with no If-Match header, exercising the absent-precondition
    refusal.
  source: >-
    SM docs/UML/classes/i_party_relationship.adoc (update_party_relationship,
    Pre_has_relationship); ITS-REST specifications/demographic.openapi.yaml (no
    party_relationship path); ITS-REST specifications/docs/demographic (no mention); no openEHR
    spec governs this — our own design/extension
  ambiguity: AMB-32
request:
  method: PUT
  path: /demographic/party_relationship/{versioned_object_uid}
  body: party_relationship
  headers:
    Prefer: "return=representation"
formats: [canonical-json]
outcomes:
  precondition_missing: { status: 400 }
