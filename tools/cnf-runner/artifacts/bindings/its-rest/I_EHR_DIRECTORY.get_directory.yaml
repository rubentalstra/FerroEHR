# Wire realization of I_EHR_DIRECTORY.get_directory for ITS-REST 1.1.0.
# The SM get_directory(ehr_id) returns the current EHR.directory FOLDER, or Void;
# realized as GET /ehr/{ehr_id}/directory with version_at_time OMITTED (the
# `latest` case of directory_get_at_time.yaml).
# Empty-directory retrieval: a never-existed directory is the OAS-defined 404,
# a logically deleted one is a 204 — no 200 empty-structure body exists for a
# missing directory anywhere in the release.
# Sources: specifications/operations/directory_get_at_time.yaml (200/204/404),
# responses/200_FOLDER_retrieved.yaml, 204_deleted_at_time.yaml,
# 404_directory_unknown_ehr_id_or_no_version_at_time_or_no_path.yaml.
sm_operation: I_EHR_DIRECTORY.get_directory
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/directory
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_FOLDER_retrieved.yaml
    headers:
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
  ok_empty: { status: 204 }               # logically deleted directory (204_deleted_at_time.yaml)
  not_found: { status: 404 }
  not_acceptable: { status: 406 }         # unfulfillable Accept (overview Requests_and_responses negotiation rules; no simplified mapping exists for this resource)              # unknown ehr_id or no directory (404_directory_unknown_ehr_id_or_no_version_at_time_or_no_path.yaml)
# The retrieved resource carries the server-assigned version uid the committed
# payload lacks — at EVERY FOLDER node, not only the tree root. RM common
# locatable.adoc types `uid` `0..1`, "Optional globally unique object identifier
# for root points of archetyped structures", and RM common folder.adoc's NOTE
# scopes its population recommendation to the root alone ("It is strongly
# recommended that the inherited attribute `uid` be populated in _top-level_
# (i.e. tree-root) `FOLDER` objects"). A uid a server assigns at a nested
# archetype-root FOLDER is therefore permitted and unrequired, and no released
# text makes a directory read attribute-identical to the committed payload — so
# its presence is a server assignment, never a content difference. `**` matches
# at every depth of the recursive `folders: List<FOLDER>` shape.
server_assigned: ["**/uid"]
