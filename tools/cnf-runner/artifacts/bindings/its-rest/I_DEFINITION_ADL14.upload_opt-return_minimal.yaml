# Wire realization of I_DEFINITION_ADL14.upload_opt, variant `return_minimal`:
# the OPT upload states the minimal preference EXPLICITLY. The variant-less
# binding sends no `Prefer` header at all, which the overview says is the same
# thing by default ("If no `Prefer` header is provided, the default behavior is
# assumed to be `return=minimal`" — Requests_and_responses.md §Representation
# details negotiation); this variant exercises the stated form, which the same
# chapter tells clients to prefer ("clients are strongly encouraged to always
# include the `Prefer` request header explicitly").
#
# The status/body pair for this branch is assigned by the upload's own 201
# text: "`201 Created` is returned when the template has been successfully
# uploaded. … If the `Prefer` header is missing or set to `return=minimal`, the
# body is empty." That is the released statement for THIS operation, and it is
# the one that governs here: the overview's general "If no response body is
# returned, the service SHOULD use `204 No Content`" is a SHOULD-level default
# for writes whose own text assigns nothing, and these two uploads assign
# directly. Registered as AMB-110(b) — which also records that this resolves
# AMB-62's unassigned minimal status for these two operations only. For this
# API group the operation + response `description:` prose IS the released docs
# text (the specification's `docs/definition/` chapter carries no operation
# semantics).
#
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
sm_operation: I_DEFINITION_ADL14.upload_opt
its: its-rest
variant: return_minimal
request:
  method: POST
  path: /definition/template/adl1.4
  body: opt_xml
  headers:
    Content-Type: application/xml         # the ONLY accepted upload type (operation Content-Type enum)
    Prefer: "return=minimal"
outcomes:
  created:
    status: 201                           # 201 upload text — "`201 Created` is returned when the template has been successfully uploaded"
    body: absent                          # 201 upload text — "If the `Prefer` header is missing or set to `return=minimal`, the body is empty"
    headers:
      Location: present                   # overview §Prefer minimal — "The response SHOULD include a `Location` header pointing to the newly created or updated resource"
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
captures:
  template_id:
    from: header Location last-segment    # the only identifier an empty-bodied minimal response carries
