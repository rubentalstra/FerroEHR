# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# deprecated_template_id: the Simplified-Formats commit identifies its template
# under the DEPRECATED header name from the §"Deprecated headers" table —
# `openEHR-TEMPLATE_ID` instead of the Release-1.1.0 `openehr-template-id`.
#
# The two names are genuinely DIFFERENT header names, not a casing variant:
# HTTP field names are case-insensitive, so `openEHR-TEMPLATE_ID` folds to
# `openehr-template_id` — underscore, not hyphen. A server that only reads the
# new name therefore never sees the deprecated one. Decisive docs-text
# sentences (ITS-REST overview Requests_and_responses.md §Deprecated headers):
# the table row "openEHR-TEMPLATE_ID | openehr-template-id" plus "While the
# deprecated headers remain available for backward compatibility, their use is
# strongly discouraged." Backward compatibility is the assigned behaviour: the
# deprecated name still identifies the template, and §openehr-template-id makes
# that identification mandatory for a Simplified-Format commit ("The
# `openehr-template-id` request header MUST be used whenever committing
# COMPOSITION (via `PUT` or `POST` methods) using a Simplified Format which
# does not support TEMPLATE_ID value under an equivalent
# `LOCATABLE.archetype_details.template_id` attribute of contained data").
#
# The sibling of I_EHR_COMPOSITION.update_composition-audit_bare_deprecated,
# which pins the same backward-compatibility rule for the
# openEHR-AUDIT_DETAILS row of the table.
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: deprecated_template_id
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Prefer: "return=representation"
formats: [wt-flat]
format_headers:
  wt-flat:
    Content-Type: application/openehr.wt.flat+json
    openEHR-TEMPLATE_ID: required        # the DEPRECATED spelling under test (§Deprecated headers table row)
outcomes:
  created:
    status: 201                           # the commit is accepted exactly as under the new header name
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # the weakness indicator is a MUST — overview §Deprecated headers
      Location: present                   # 201 Created — overview §Location
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid, context/_uid, "composer/external_ref", territory/terminology_id]
