# Wire realization of the "Get example data by template" endpoint requesting a
# DEPRECATED simplified-format representation via Accept. This is the
# RESPONSE-side (Accept) mirror of the request-side (Content-Type) deprecated
# media handling: the client asks for the pre-1.1.0 SDT-era
# `application/openehr.wt.flat.schema+json` representation, which ITS-REST
# overview Resources.md lists as deprecated/MAY-supported. A server that does
# not support it cannot fulfil the Accept and MUST respond 406 Not Acceptable
# (Resources.md §Simplified Formats: "If the service cannot fulfil this aspect
# of the request, it MUST respond with HTTP status code 406 Not Acceptable"). A
# server that still serves it responds 200. Whether that legacy support exists
# is statement-declared (AMB-39, option_select).
#
# A third `variant` realization of I_DEFINITION_ADL14.get_opt (plain OPT GET;
# `variant: example`; and this `variant: example_deprecated_accept`), selected
# by the flow step. The deprecated Accept is pinned in request.headers (no
# format axis), so a format-less step preserves it.
#
# Sources: specifications/operations/definition_template_adl1.4_example_get.yaml;
# ITS-REST overview Resources.md §Simplified Formats + §Alternative data formats
# (deprecated media types); simplified_formats master02 §MIME Types.
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example_deprecated_accept
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example
  query:
    type: input                          # parameters/query (example input vs output data instance)
    detail_level: required               # parameters/query (required | medium | complete)
  headers:
    Accept: application/openehr.wt.flat.schema+json   # DEPRECATED pre-1.1.0 SDT-era simplified media type (Resources.md §Alternative data formats)
outcomes:
  ok:
    status: 200                          # supported branch: a server that still serves the deprecated representation
    headers: { Content-Type: negotiated }
  not_acceptable: { status: 406 }        # unsupported branch: Accept cannot be fulfilled (Resources.md §Simplified Formats 406 MUST rule)
  not_found: { status: 404 }             # 404_unknown_template_id.yaml — unknown template_id
