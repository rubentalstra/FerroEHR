# Wire realization of the SMART on openEHR service-discovery document.
#
# ANCHOR: `I_ITS_REST_SMART` is a reserved CATALOGUE pseudo-interface, NOT an
# SM interface — the SM models no Platform component at all. SMART's subject is
# the *Platform*, "a software ecosystem comprising at minimum an Authorization
# Server, an openEHR Clinical Data Repository (CDR), and a FHIR Server"
# (docs/smart_app_launch/master02-overview.adoc §Glossary), which
# is not an SM service; the CDR is only its `org.openehr.rest` member. Case
# cores speak SM operations only, so the pinned NON_SM_REST_OPERATIONS table in
# tools/cnf-runner/src/validate.rs is what makes this RELEASED ITS-REST
# operation enumerable at all. The naming convention (and the fact that it
# claims nothing about the SM) is adjudicated in register AMB-161, exactly as
# for I_ITS_REST_SYSTEM and I_ITS_REST_ITEM_TAGS.
#
# BEHAVIOUR — the decisive released sentences, all from
# docs/smart_app_launch/master04-service_discovery.adoc:
#  - THE RESOURCE: §Service Discovery, "The configuration endpoint should be
#    always available relative to the _Platform_ base URL. For example, given a
#    base URL as `https://platform.example.com`, the SMART configuration
#    endpoint must be available at
#    `https://platform.example.com/.well-known/smart-configuration`." The path
#    below is therefore relative to the PLATFORM base, which is a different
#    origin+path from the openEHR REST base every other binding hangs off — the
#    case addresses the ixit's declared `smart.platform_instance` for exactly
#    that reason.
#  - THE MEDIA TYPE: §Service Discovery, "Responses to
#    `/.well-known/smart-configuration` endpoint must be served with the
#    `application/json` MIME type." The `Content-Type: negotiated` matcher
#    compares against the case's one declared format (canonical-json =
#    application/json), so this sentence is what the matcher asserts.
#  - THE STATUS: the released overview assigns the success code —
#    specifications/docs/overview/Requests_and_responses.md §HTTP status codes,
#    "| 200 | OK | The request succeeded, payload sent in a 200 response depends
#    on the request method |", under "To indicate the status of a request or
#    operation, an appropriate HTTP status code MUST be used as described
#    above". master04 assigns no status of its own — register AMB-149.
#  - THE METHOD: §Service Discovery describes a document a client *fetches*;
#    the overview §HTTP Methods row for GET ("Retrieve a representation of the
#    target resource") is the released assignment.
#
# NOT ASSERTED HERE. master04 states no caching directives, no auth posture and
# no error branch for this endpoint (register AMB-149), and its §Authentication
# Endpoints list names the wrong well-known document (register AMB-146) — so
# the binding declares one outcome and nothing beyond the three sentences
# above. The document MEMBERS §Services marks `*(required)*` are asserted by
# the case, not by the binding, because they are body facts.
#
# NEGOTIATION: master04 fixes ONE media type ("must be served with the
# `application/json` MIME type"), so there is no second format branch and no
# 406 branch to declare — the single canonical-json form is the whole surface.
sm_operation: I_ITS_REST_SMART.discovery
its: its-rest
request:
  method: GET
  path: /.well-known/smart-configuration   # relative to the PLATFORM base URL — master04 §Service Discovery
formats: [canonical-json]
outcomes:
  ok:
    status: 200                            # overview §HTTP status codes (200 OK), the released assignment; master04 assigns none (AMB-149)
    headers:
      Content-Type: negotiated             # master04 §Service Discovery: "must be served with the `application/json` MIME type"
