# ITS-REST 1.1.0 surfaces no wire for I_DEFINITION_QUERY.delete_query — an
# explicit unrealized declaration so the SM-anchored delete case is
# not-applicable WITH CITATION on this ITS (never silently absent), and
# activates unchanged when a later ITS-REST release adds the endpoint.
sm_operation: I_DEFINITION_QUERY.delete_query
its: its-rest
unrealized:
  reason: >-
    The released definition API declares exactly two stored-query paths —
    `/definition/query/{qualified_query_name}` (GET list, PUT store) and
    `/definition/query/{qualified_query_name}/{version}` (GET, PUT) — and no
    DELETE on either, so the SM operation's contract (`Pre_has_query`,
    `Post_query_deleted`: `not has_query (a_query_name)`, i.e. delete BY NAME)
    has no request shape. Our admin `DELETE /admin/query/{qualified_query_name}/
    {version}` is an extension of our own and is deliberately NOT bound here:
    it removes one `(name, version)` row and therefore cannot establish the SM
    postcondition.
  source: "ITS-REST specifications/definition.openapi.yaml (the two /definition/query paths) + operations/definition_query_{list,store,version_get,version_store}.yaml vs SM docs/UML/classes/i_definition_query.adoc §delete_query"
  ambiguity: AMB-127
