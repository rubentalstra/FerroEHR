# Wire realization of the ADL2 "Get example data by template" endpoint. The SM
# I_DEFINITION_ADL2 interface defines NO example-generation operation (grep of
# SM docs/UML/classes/i_definition_adl2.adoc: has_artefact/valid_artefact/
# upload_artefact/get_artefact/list_*/delete_artefact/*_count only), so this
# ITS-only surface is anchored to the closest genuine SM operation, get_artefact
# (both key on template_id and return template-derived content) — AMB-37.
#
# This is a SECOND realization of I_DEFINITION_ADL2.get_artefact (the plain
# /definition/template/adl2/{template_id} OPT GET is the first). Flow steps
# select this realization by `variant: example`.
# TODO: the operation-binding schema has no variant discriminator and the
#       binding-completeness check matches by sm_operation only, so a case that
#       observed `not_acceptable` here would (wrongly) require the plain
#       get_artefact binding to map 406 too; the schedule therefore authors no
#       406 example case (see REQUIREMENTS.md). Add a variant discriminator so
#       example can carry its own 406 independently (AMB-37 forcing item).
#
# Sources: specifications/operations/definition_template_adl2_example_get.yaml
# (operationId definition_template_adl2_example_get; Accept controls the returned
# data instance format via parameters/header/Accept_LOCATABLE.yaml), responses
# 200_Template_example_retrieved.yaml / 404_unknown_template_id.yaml / 406.yaml.
sm_operation: I_DEFINITION_ADL2.get_artefact
its: its-rest
variant: example
request:
  method: GET
  path: /definition/template/adl2/{template_id}/example  # definition_template_adl2_example_get.yaml
  query:
    type: input                          # parameters/query/example_type.yaml (input vs output data instance)
    detail_level: required               # parameters/query/example_detail_level.yaml (required | medium | complete)
# The example is a LOCATABLE (COMPOSITION) instance negotiable across canonical
# JSON/XML and the FLAT/STRUCTURED simplified forms (Accept_LOCATABLE.yaml).
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
outcomes:
  ok:
    status: 200                          # 200_Template_example_retrieved.yaml (example instance in the negotiated format)
    headers: { Content-Type: negotiated }
  not_found: { status: 404 }             # 404_unknown_template_id.yaml — unknown template_id
  not_acceptable: { status: 406 }        # 406.yaml — Accept outside the LOCATABLE forms
