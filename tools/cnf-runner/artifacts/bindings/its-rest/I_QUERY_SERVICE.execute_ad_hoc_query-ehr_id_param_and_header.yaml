# Wire realization of I_QUERY_SERVICE.execute_ad_hoc_query, variant
# `ehr_id_param_and_header`: the GET form carrying the single-EHR scope in BOTH
# released places at once — the `ehr_id` query parameter AND the
# `openehr-ehr-id` request header.
#
# WHY A VARIANT AT ALL. The two forms are offered as ALTERNATIVES —
# docs/query/Request.md §"About the ehr_id parameter": "Depending on the needs,
# clients MAY supply it as a query parameter `ehr_id` or alternatively as a
# request header named `openehr-ehr-id`" — and no released sentence defines the
# both-supplied case. The existing variants each carry exactly one form
# (`get_ehr_id_header` the header, the variant-less binding the parameter), so
# neither can express the collision; this one binds the two slots to SEPARATE
# references (`${ehr_id}` in the query, `${header_ehr_id}` in the header) so a
# case chooses whether they agree.
#
# THE OUTCOMES.
# - `ok` (200) — docs/overview/Requests_and_responses.md §"HTTP status codes",
#   row `200 OK`. Two forms naming the SAME EHR are one unambiguous request and
#   are executed; that half is the direct reading of the alternatives sentence.
# - `bad_request` (400) — the DISAGREEING half. The released text is SILENT on
#   precedence, adjudicated in register AMB-59 (fixed handling: a
#   self-contradictory scope is refused, never silently resolved to one of the
#   two), on docs/overview/Requests_and_responses.md §"HTTP status codes",
#   row 400: "The service cannot or will not process the request due to
#   something that is perceived to be a client error (e.g., malformed request
#   syntax, syntactically invalid content)" and the clause below the table
#   ("used when no other `4xx` error code is appropriate"). The kind is
#   `bad_request`, added by the 2026-07-28 schedule release (#544);
#   `invalid_query` would be wrong (the AQL is well formed) and
#   `validation_failed` means 422 semantic CONTENT.
# - not_found stays on the VARIANT-LESS binding (its cases gate it); this
#   variant declares only the branches its two cases drive, register
#   AMB-101, as on the sibling variants.
# - `ETag` — docs/query/Request.md §"Common Headers and Query Parameters":
#   "Related response headers: `ETag` - A unique identifier of the resultSet";
#   its FORM by docs/overview/Requests_and_responses.md §"Deprecated headers":
#   "all `ETag` headers that hold a resource identifier MUST include a weakness
#   indicator `W/`".
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
its: its-rest
variant: ehr_id_param_and_header
request:
  method: GET
  path: /query/aql
  query:
    q: "${q}"                             # Request.md §GET vs POST (`q` parameter)
    ehr_id: "${ehr_id}"                   # Request.md §About the ehr_id parameter (the URL form)
    offset: "${offset?}"                  # Request.md §Common Headers and Query Parameters
    fetch: "${fetch?}"                    # Request.md §Common Headers and Query Parameters
  headers:
    openehr-ehr-id: "${header_ehr_id}"    # Request.md §About the ehr_id parameter (the header form)
    Accept: application/json
formats: [canonical-json]
outcomes:
  ok:
    status: 200                           # Requests_and_responses.md §HTTP status codes, row 200
    headers: { ETag: 'pattern:W/"[^"]+"' } # Request.md §Common Headers and Query Parameters + overview §Deprecated headers
    body: result_set_body
  bad_request:
    status: 400                           # §HTTP status codes row 400 — the self-contradictory scope (register AMB-59)
    body: error_loose                     # §HTTP status codes — 4xx detail is a MAY under Prefer: return=representation
