# Wire realization of I_DEFINITION_ADL2.list_templates for ITS-REST 1.1.0.
# The SM separates list_templates (concrete type TEMPLATE) from list_opts
# (OPERATIONAL_TEMPLATE), but ITS-REST 1.1.0 exposes a SINGLE ADL2 list
# endpoint that returns operational templates and does not distinguish bare
# TEMPLATEs from OPTs (AMB-37) — so list_templates realizes via the same
# GET /definition/template/adl2 as list_opts.
# Sources: specifications/operations/definition_template_adl2_list.yaml (200),
# responses/200_TemplateList_adl2.yaml.
sm_operation: I_DEFINITION_ADL2.list_templates
its: its-rest
request:
  method: GET
  path: /definition/template/adl2                 # definition_template_adl2_list.yaml
  headers:
    Accept: application/json                       # Accept_JSON.yaml
outcomes:
  ok: { status: 200, headers: { Content-Type: negotiated } }   # 200_TemplateList_adl2.yaml
