# ITS-REST 1.1.0 surfaces no wire for I_ADMIN_SERVICE.list_contributions — an
# explicit unrealized declaration so the master12 list_contributions cases are
# not-applicable WITH CITATION on this ITS (never silently absent), activating
# when a later ITS-REST release adds an admin activity-report endpoint.
sm_operation: I_ADMIN_SERVICE.list_contributions
its: its-rest
unrealized:
  reason: >-
    No admin activity-report operation exists in ITS-REST 1.1.0. The only
    admin_* operations in the OAS are admin_ehr_delete and admin_ehr_delete_all
    (physical EHR deletion); there is no endpoint to list Contribution ids.
  source: "ITS-REST specifications/operations (admin_ehr_delete, admin_ehr_delete_all only) vs SM docs/UML/classes/i_admin_service.adoc (list_contributions)"
  ambiguity: AMB-33
