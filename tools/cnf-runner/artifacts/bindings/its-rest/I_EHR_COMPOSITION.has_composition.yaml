# Wire realization of I_EHR_COMPOSITION.has_composition for ITS-REST 1.1.0.
# The SM has_composition(ehr_id, version_uid) returns Boolean; ITS-REST has no
# dedicated composition-existence probe, so — mirroring the has_ehr binding —
# the check is realized as GET /ehr/{ehr_id}/composition/{version_uid}:
# 200 = the version exists (TRUE), 404 = it does not exist, or the EHR does not
# exist (FALSE / error).
# Sources: specifications/operations/composition_get.yaml (200/404),
# responses/200_COMPOSITION_retrieved.yaml,
# responses/404_unknown_ehr_id_or_no_version_at_time.yaml.
sm_operation: I_EHR_COMPOSITION.has_composition
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/composition/{version_uid}
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_COMPOSITION_retrieved.yaml — version exists (TRUE)
    headers:
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }                                   # 404_unknown_ehr_id_or_no_version_at_time.yaml — absent version or absent EHR (FALSE)
