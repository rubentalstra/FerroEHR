# Wire realization of I_EHR_CONTRIBUTION.commit_contribution, variant
# `return_identifier`: the commit asks for the identifier-only response with
# `Prefer: return=identifier`. The variant-less binding pins
# `Prefer: return=representation` in its request headers, so the identifier
# preference needs its own realization.
#
# DOCS TEXT (overview `Requests_and_responses.md` §"Prefer only identifier"):
# "This is a variant of preference that implies minimal response semantics, but
# with a non-empty response body (i.e., the status will be `201 Created` or
# `200 OK`, never `204 No Content`)." and "The response body SHOULD contain
# only the identifier of the affected resource formatted according to the
# `Accept` request header. For example, when `application/json` is requested as
# above, the response body will be a single JSON object with a single `uid`
# attribute." A commit CREATES the CONTRIBUTION, so the `created` outcome maps
# to the 201 of that pair — the 204 the minimal preference may answer is
# explicitly excluded by the quoted sentence.
#
# `Preference-Applied` is declared with the optional matcher: §Representation
# details negotiation makes it a MAY ("The service MAY include a
# `Preference-Applied` header in the response … to indicate that the client's
# preference has been honored"), so presence is not assertable without
# over-claiming the MAY. `Location` is likewise a MAY on this preference ("The
# response MAY include a `Location` header pointing to the newly created or
# updated resource") and is therefore not declared at all.
#
# The identifier is captured from the entity tag rather than the body, because
# the body's single `uid` attribute is a bare string on this preference while
# the full representation nests it under `uid.value` — one capture source that
# holds for both would need a body path that does not exist here.
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
its: its-rest
variant: return_identifier
request:
  method: POST
  path: /ehr/{ehr_id}/contribution
  body: contribution
  headers:
    Prefer: "return=identifier"
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # §Prefer only identifier: "201 Created or 200 OK, never 204 No Content"
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # the weakness indicator is a MUST — overview §Deprecated headers
      Content-Type: negotiated            # Resources.md §JSON Format: the Content-Type MUST be present unless the response has no content body
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
captures:
  contribution_uid:
    from: header ETag
    strip: weak-quotes
