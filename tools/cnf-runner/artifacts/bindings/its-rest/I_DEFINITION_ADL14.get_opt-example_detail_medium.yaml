# Wire realization of the ADL 1.4 "Get example data by template" endpoint,
# variant `example_detail_medium`: the middle `detail_level`. The variant-less
# example binding pins the released default (`required`), so each other
# declared level needs its own realization — query values are literal in the
# binding request model.
#
# DOCS TEXT (ITS-REST specifications/operations/definition_template_adl1.4_example_get.yaml
# — the operation `description:` prose IS the released docs text for this API
# group): "The level of detail in the generated example can be customized using
# the `detail_level` query parameter. … `medium`: a fairly realistic set of
# data points, including some optional RM attributes and elements; intended to
# be committable (e.g., it should not contain more than one choice element,
# even if the template allows it)". `parameters/query/example_detail_level.yaml`
# declares the enum [required, medium, complete] with `required` as the
# default, so `medium` is a declared, supported value answering the same 200.
#
# WHAT IS NOT ASSERTED: the CONTENT difference between levels. The same
# operation carries "> NOTE: The implementation and completeness of these
# examples are not specified, and vendors may produce different results", so
# only the negotiated 200 + the committability the level promises are
# assertable. Register: AMB-115.
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example_detail_medium
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example
  query:
    type: input                          # the released default, held constant so only `detail_level` varies
    detail_level: medium                 # parameters/query/example_detail_level.yaml
formats: [canonical-json]
outcomes:
  ok:
    status: 200
    headers: { Content-Type: negotiated }
