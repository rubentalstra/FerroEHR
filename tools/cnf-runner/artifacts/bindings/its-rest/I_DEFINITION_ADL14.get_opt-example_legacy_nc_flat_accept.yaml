# Wire realization of the "Get example data by template" endpoint requesting
# the LEGACY `application/openehr.nc.flat+json` representation via Accept —
# the response-side (Accept) mirror of the request-side (Content-Type)
# `legacy_nc_flat_media` variant, so the ECISFLAT type is pinned on both
# negotiation axes. ITS-REST overview Resources.md §Alternative data formats
# enumerates it under "Legacy or experimental formats"
# ("`application/openehr.nc.flat+json` based on the ECISFLAT format"), and
# §Data representation makes support optional ("other alternative formats MAY
# be supported as well"). A server that does not support it cannot fulfil the
# Accept and MUST respond 406 — Resources.md §Simplified Formats: "If the
# service cannot fulfill this aspect of the request, it MUST respond with
# HTTP status code `406 Not Acceptable`".
#
# The legacy Accept is pinned in request.headers (no format axis), so a
# format-less step preserves it. Whether the legacy support exists is
# statement-declared (register AMB-61, option_select).
#
# Sources (ITS-REST DOCS TEXT — tier 1, which wins every conflict; the
# RELEASED OAS fills only what the docs text is silent on and is cited AS
# the OAS where it does — owner ruling 2026-07-28):
#   specifications/docs/overview/Resources.md §Alternative data formats,
#   §Data representation, §Simplified Formats.
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example_legacy_nc_flat_accept
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example
  query:
    type: input                          # parameters/query (example input vs output data instance)
    detail_level: required               # parameters/query (required | medium | complete)
  headers:
    Accept: application/openehr.nc.flat+json   # LEGACY ECISFLAT media type (Resources.md §Alternative data formats)
outcomes:
  # ONLY the branch a case drives. The supported branch of this option pair is
  # carried on the Content-Type axis (SF-LEGACY-nc_flat_media_supported); an
  # outcome declared here that nothing exercises is a claim, not coverage.
  not_acceptable: { status: 406 }        # unsupported branch: Accept cannot be fulfilled (Resources.md §Simplified Formats 406 MUST)
