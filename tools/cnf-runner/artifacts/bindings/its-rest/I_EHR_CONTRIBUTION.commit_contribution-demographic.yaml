# Wire realization of the DEMOGRAPHIC CONTRIBUTION commit —
# POST /demographic/contribution — as the `demographic` variant of
# I_EHR_CONTRIBUTION.commit_contribution.
#
# ANCHORING NOTE: this released route realizes NO SM operation. SM's
# demographic chapter (docs/openehr_platform/master06-demographic_service.adoc)
# includes exactly I_DEMOGRAPHIC_SERVICE, I_PARTY, I_PARTY_RELATIONSHIP and
# their two UV classes — there is no demographic contribution interface
# anywhere in SM, and I_EHR_CONTRIBUTION is EHR-scoped. Anchoring the route to
# the EHR commit under an explicit variant is a CATALOGUE NAMING CONVENTION,
# not a claim that SM defines it — the same device register AMB-127 uses for
# the stored-query single-definition read. Register AMB-136 carries the gap.
#
# THE ENVELOPE IS CANONICAL JSON. Unlike its EHR sibling, this operation's
# released prose documents no Simplified-Formats arm at all, and the party
# payloads it commits have no simplified representation (register AMB-128:
# the format is template-derived and its RM mapping is COMPOSITION-rooted).
# The negotiated format is therefore canonical JSON only — register AMB-134.
#
# THE RELAXED ENVELOPE. The operation's own description states the three
# optional attributes verbatim: "`uid`: when provided, it will be accepted in
# case is not in-use, otherwise error will be returned"; "`audit.time_committed`:
# server will always set it"; "`audit.system_id`: when provided, it will be
# validated". It also states the UPDATE_AUDIT `_type` tolerance ("Clients
# SHOULD send `_type: \"UPDATE_AUDIT\"`; for interoperability servers SHOULD
# additionally accept `_type: \"AUDIT_DETAILS\"` or an omitted `_type`").
#
# STATUS GROUNDS (ITS-REST DOCS TEXT, overview Requests_and_responses.md
# §HTTP status codes, the rows verbatim):
#   201 — "The request has been fulfilled and has resulted in one or more new
#         resources being created".
#   409 — "Indicates that the request could not be processed because it might
#         generate a duplicate or a conflict" — the in-use client uid.
#   422 — "The request was well-formed but was unable to be followed due to
#         semantic errors" — a member whose change_type/lifecycle pair the
#         change-control model does not allow for the commit; `alt_status`
#         carries the 400 row ("malformed request syntax, syntactically
#         invalid content") for the structurally-mismatched modification-type
#         shapes, the same split the EHR-side binding records.
# `ETag`/`Location` on the 201 are the overview's own: §"ETag and
# Last-Modified" (the weak-tag `W/` MUST of §Deprecated headers) and §Location
# ("used in `201 Created` responses when a new resource is successfully
# created").
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
its: its-rest
variant: demographic
request:
  method: POST
  path: /demographic/contribution
  body: contribution
  headers:
    Prefer: "return=representation"
formats: [canonical-json]
outcomes:
  created:
    status: 201
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }
      Location: present
      # The same pair, the same sentence — overview §"ETag and Last-Modified":
      # "Both `ETag` and `Last-Modified` SHOULD be included in responses for
      # VERSION, VERSIONED_OBJECT, or other resources that have versioning or
      # unique state identifiers", the value "derived from
      # `VERSION.commit_audit.time_committed.value`". Register AMB-87's fixed
      # handling, whose scope covers the demographic commit alongside the
      # EHR-scoped one (the released 201_demographic_CONTRIBUTION.yaml declares
      # ETag/Location and is silent on this header, not conflicting).
      Last-Modified: present
    body: prefer_conditional
  conflict:
    status: 409
    body: error_loose
  validation_failed:
    status: 422
    alt_status: [400]
    body: error_loose
  bad_request:
    # The parse-refusal class, as on the EHR-scoped commit binding: a body
    # that never converts to the resource (e.g. a mandatory 1..* container
    # sent present-but-empty) is 400, distinct from validation_failed's
    # well-formed-but-semantically-invalid 422 (issue #1939 pins the split
    # on this lane).
    status: 400
    body: error_loose
captures:
  contribution_uid:
    from: body "uid.value"
    fallback: header Location last-segment
  contribution_etag_uid:
    from: header ETag
    strip: weak-quotes
  version_uids:
    from: body "versions[*].id.value"
  first_version_uid:
    from: body "versions[0].id.value"
  first_versioned_object_uid:
    from: capture first_version_uid
    transform: root-uid
server_assigned: [uid, "audit.time_committed"]
