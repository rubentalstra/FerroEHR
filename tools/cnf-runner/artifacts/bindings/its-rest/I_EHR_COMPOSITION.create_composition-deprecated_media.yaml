# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# deprecated_media_type: the simplified commit is sent with the DEPRECATED
# pre-1.1.0 media type `application/openehr.wt.flat.schema+json` — named
# deprecated by ITS-REST overview Resources §Alternative data formats
# ("deprecated in favour of application/openehr.wt.flat+json"). A server on
# the sf-deprecated-types-unsupported branch (AMB-39) refuses it 415 per the
# overview negotiation rules; a supporting server creates 201.
# Sources: specifications/docs/overview/Resources.md §Alternative data
# formats; simplified_formats master02 §MIME Types; operations/
# composition_create.yaml.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: deprecated_media_type
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Prefer: "return=representation"
formats: [wt-flat, wt-structured]
format_headers:
  wt-flat:
    Content-Type: application/openehr.wt.flat.schema+json
    openehr-template-id: required
  wt-structured:
    Content-Type: application/openehr.wt.structured.schema+json
    openehr-template-id: required
outcomes:
  created:
    status: 201                           # 201_COMPOSITION.yaml
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::1"'
      Location: present
      Content-Type: negotiated
    body: prefer_conditional
  not_found: { status: 404 }              # unknown ehr_id (404_unknown_ehr_id.yaml)
  validation_failed:
    status: 422                           # 422.yaml
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  template_not_found:
    status: 422                           # same wire code; kind distinguished by fixture
    body: error_loose
  missing_template_id: { status: 422 }    # simplified commit without openehr-template-id
  conflict: { status: 409 }               # persistent-COMPOSITION uniqueness rejection — ITS-REST overview §HTTP status codes: 409 = conflict
  unsupported_media: { status: 415 }      # overview negotiation rules (AMB-7 layering)
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid, context/_uid, "composer/external_ref", territory/terminology_id]
