# Wire realization of I_DEFINITION_ADL14.upload_opt, variant
# `return_identifier`: the OPT upload asks for the identifier-only response
# with `Prefer: return=identifier`. The variant-less binding sends no `Prefer`
# at all (the assumed default, `return=minimal`), so the identifier preference
# needs its own realization.
#
# DOCS TEXT (ITS-REST overview `Requests_and_responses.md` §"Prefer only
# identifier"): "This is a variant of preference that implies minimal response
# semantics, but with a non-empty response body (i.e., the status will be `201
# Created` or `200 OK`, never `204 No Content`)." and "The response body SHOULD
# contain only the identifier of the affected resource formatted according to
# the `Accept` request header." An upload CREATES the template, so the `created`
# outcome takes the 201 of that pair, and the body is non-empty by the same
# sentence.
#
# WHICH identifier: the ADL 1.4 upload's 201 names the identifier body type for
# this preference in its own text — "If `Prefer` header is `return=representation`,
# the full resource is included in the response body; if is `return=identifier`,
# only its unique identifier is included" — and offers `application/json` as the
# `TemplateIdentifier` object (`{ "template_id": … }`). For this API group the
# operation + response `description:` prose IS the released docs text: the
# specification's own `docs/definition/` chapter carries no operation semantics
# at all, so the prose embedded in the operation files is the only released
# statement about these branches (registered as AMB-110).
#
# `Preference-Applied` is declared with the OPTIONAL matcher: §Representation
# details negotiation makes it a MAY ("The service MAY include a
# `Preference-Applied` header in the response … to indicate that the client's
# preference has been honored"), so presence is not assertable without
# over-claiming the MAY.
#
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
sm_operation: I_DEFINITION_ADL14.upload_opt
its: its-rest
variant: return_identifier
request:
  method: POST
  path: /definition/template/adl1.4
  body: opt_xml
  headers:
    Content-Type: application/xml         # the ONLY accepted upload type (operation Content-Type enum)
    Accept: application/json              # Accept_Template.yaml — the TemplateIdentifier rendering
    Prefer: "return=identifier"
outcomes:
  created:
    status: 201                           # §Prefer only identifier — "201 Created or 200 OK, never 204 No Content"
    body: present                         # §Prefer only identifier — "a non-empty response body"
    headers:
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
captures:
  template_id:
    from: body "template_id"              # the TemplateIdentifier object's single member
    fallback: header Location last-segment
