# ITS-REST 1.1.0 surfaces no wire for I_EHR_CONTRIBUTION.list_contributions —
# the only CONTRIBUTION paths in ehr.openapi.yaml are POST
# /ehr/{ehr_id}/contribution (contribution_create) and GET
# /ehr/{ehr_id}/contribution/{contribution_uid} (contribution_get); there is no
# collection GET on /ehr/{ehr_id}/contribution. An explicit unrealized
# declaration (the AMB-17 delete_opt precedent) so the five official master08
# list_contributions cases are not-applicable WITH CITATION on this ITS (never
# silently absent) and activate when a later ITS-REST release adds the endpoint.
# The proposed register entry (AMB-22) is documented in
# schedule/contribution/REQUIREMENTS.md.
sm_operation: I_EHR_CONTRIBUTION.list_contributions
its: its-rest
unrealized:
  reason: >-
    No collection GET exists on /ehr/{ehr_id}/contribution in ITS-REST 1.1.0
    (ehr.openapi.yaml wires only contribution_create on the collection path and
    contribution_get on the {contribution_uid} item path); the SM
    list_contributions has no bindable wire realization.
  source: "SM docs/UML/classes/i_ehr_contribution.adoc (list_contributions) vs ITS-REST specifications/ehr.openapi.yaml (contribution paths: no collection GET)"
  ambiguity: AMB-22
