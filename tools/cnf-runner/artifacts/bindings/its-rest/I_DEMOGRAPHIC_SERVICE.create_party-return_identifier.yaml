# Wire realization of I_DEMOGRAPHIC_SERVICE.create_party, variant
# `return_identifier`: the party create asks for the identifier-only response.
# The variant-less binding pins `Prefer: return=representation`, so this
# preference needs its own realization.
#
# DOCS TEXT (ITS-REST specifications/docs/overview/Requests_and_responses.md
# §"Prefer only identifier"): "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`)." and "The
# response body SHOULD contain only the identifier of the affected resource
# formatted according to the `Accept` request header. For example, when
# `application/json` is requested as above, the response body will be a single
# JSON object with a single `uid` attribute." A create CREATES the party, so
# the `created` outcome takes the 201 of that pair, and the body is non-empty
# by the same sentence.
#
# The THIRD member of the preference triad — `return=minimal` — deliberately
# has NO binding here: register AMB-62 records that the released text assigns
# that branch no status at all ("typically `201 Created`" is descriptive, and
# the 204 sentence is conditional on a fact nothing assigns), so declaring a
# minimal outcome would author an expectation the docs text does not carry.
# What the minimal branch DOES assign — the `Location` SHOULD — is asserted on
# the create outcomes generally (wire_surface `header-location-on-create`).
#
# `Preference-Applied` uses the OPTIONAL matcher: §Representation details
# negotiation makes it a MAY ("The service MAY include a `Preference-Applied`
# header in the response … to indicate that the client's preference has been
# honored"), so presence is not assertable without over-claiming the MAY.
#
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
its: its-rest
variant: return_identifier
request:
  method: POST
  path: /demographic/person
  body: party
  headers:
    Accept: application/json
    Prefer: "return=identifier"
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # §Prefer only identifier — "201 Created or 200 OK, never 204 No Content"
    body: present                         # §Prefer only identifier — "a non-empty response body"
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::1"'
      Location: present                   # overview §Location — the header on a 201 creation
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid]
