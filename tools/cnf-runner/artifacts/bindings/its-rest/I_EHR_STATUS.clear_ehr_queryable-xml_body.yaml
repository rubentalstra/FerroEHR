# Wire realization of I_EHR_STATUS.clear_ehr_queryable, variant `xml_body`: the
# whole-EHR_STATUS PUT with a CASE-SUPPLIED canonical-XML payload instead of
# the JSON read-modify-write body the variant-less realization builds. The
# variant exists because the variant-less realization has no XML request seam
# at all — the runner constructs its body as patched JSON (`from_capture` +
# `set:`) — so the canonical-XML REQUEST branch of this operation is reachable
# only here (wire_surface variant_of on the variant-less row).
#
# Decisive docs-text sentence for the payload branch (ITS-REST overview
# Resources.md §XML Format): "A client MAY use the header `Content-Type:
# application/xml` in the requests to specify the XML payload format. If the
# service cannot process the request payload as XML format, it MUST respond
# with HTTP status code `415 Unsupported Media Type`" — and the same section
# fixes the payload shape ("both request payloads and responses MUST conform
# to the published XSDs"). Status/headers on success are the variant-less
# binding's `updated` row (ehr_status_update realization; the ETag weakness
# indicator per overview §Deprecated headers).
sm_operation: I_EHR_STATUS.clear_ehr_queryable
its: its-rest
variant: xml_body
request:
  method: PUT
  path: /ehr/{ehr_id}/ehr_status
  body: ehr_status                          # the case supplies the canonical-XML payload
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
    Prefer: "return=representation"
formats: [canonical-xml]
outcomes:
  updated:
    status: 200                             # the variant-less binding's updated row (200_EHR_STATUS_updated.yaml realization; Prefer representation)
    headers: { ETag: 'pattern:W/"[^"]+"', Location: present }
