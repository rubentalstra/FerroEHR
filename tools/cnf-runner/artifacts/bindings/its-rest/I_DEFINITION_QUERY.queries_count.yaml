# ITS-REST 1.1.0 surfaces no wire for I_DEFINITION_QUERY.queries_count — an
# explicit unrealized declaration so the SM-anchored case is not-applicable
# WITH CITATION on this ITS (never silently absent), and activates unchanged
# when a later ITS-REST release adds the endpoint.
sm_operation: I_DEFINITION_QUERY.queries_count
its: its-rest
unrealized:
  reason: >-
    No count resource exists under /definition/query, and the count is not
    inferable from the released listing either: the list operation's
    `qualified_query_name` is a REQUIRED path parameter matched as a prefix, so
    there is no request that enumerates the whole registry ("Return total count
    of queries") — the description's empty-pattern wildcard clause names a
    request the released paths cannot express (register AMB-124(d)).
  source: "SM docs/UML/classes/i_definition_query.adoc §queries_count vs ITS-REST specifications/definition.openapi.yaml (the two /definition/query paths, no count resource) + parameters/path/qualified_query_name.yaml (`required: true`)"
  ambiguity: AMB-127
