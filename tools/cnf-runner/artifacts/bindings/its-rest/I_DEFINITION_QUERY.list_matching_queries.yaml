# ITS-REST 1.1.0 surfaces no wire for I_DEFINITION_QUERY.list_matching_queries
# — an explicit unrealized declaration so the SM-anchored case is
# not-applicable WITH CITATION on this ITS (never silently absent), and
# activates unchanged when a later ITS-REST release adds the endpoint.
sm_operation: I_DEFINITION_QUERY.list_matching_queries
its: its-rest
unrealized:
  reason: >-
    The SM operation matches TWO PERL regexes — one on the query identifier,
    one on the archetype/template identifiers referenced inside the query text
    — with `item_offset`/`items_to_fetch` paging and an `invalid_id_pattern`
    error. The one released listing operation takes only the required
    `qualified_query_name`, matched as a PREFIX ("will list all versions of all
    queries with names starting with `org.openehr`"), declares a single 200 and
    no paging, and so realizes neither pattern language, the artefact-reference
    filter, the paging, nor a branch the declared error could wear. Bound
    unrealized rather than folded into the prefix list, which is a different
    operation (`list_queries`) with its own binding.
  source: "SM docs/UML/classes/i_definition_query.adoc §list_matching_queries (the two regex patterns, the paging pair, the `invalid_id_pattern` error) vs ITS-REST specifications/operations/definition_query_list.yaml (the prefix description + a single '200') and definition.openapi.yaml (no other list path)"
  ambiguity: AMB-121
