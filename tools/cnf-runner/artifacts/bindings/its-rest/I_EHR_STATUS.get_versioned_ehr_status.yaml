# Wire realization of I_EHR_STATUS.get_versioned_ehr_status (variant-less):
# the VERSIONED_EHR_STATUS version CONTAINER of an EHR, realized as
# GET /ehr/{ehr_id}/versioned_ehr_status. The EHR_STATUS is a per-EHR
# singleton, so the container URI carries no {versioned_object_uid} segment
# (unlike versioned_composition).
#
# Sources (ITS-REST DOCS TEXT — the wire oracle, not the stalled OAS):
#   - Resource: overview Resources.md §Resources — "versioned entities:
#     VERSIONED_COMPOSITION, VERSIONED_EHR_STATUS, etc. or their contained
#     VERSION instances" is the resource this route serves.
#   - `ok` 200 / `not_found` 404: overview Requests_and_responses.md §HTTP
#     status codes ("200 | OK | The request succeeded …"; "404 | Not Found |
#     The origin service did not find the target resource …").
#   - the served object's shape: RM common
#     UML/classes/org.openehr.rm.common.versioned_object.adoc §Attributes
#     (`uid`: HIER_OBJECT_ID, "Unique identifier of this version container in
#     the form of a UID with no extension"; `owner_id`: OBJECT_REF 1..1;
#     `time_created`: DV_DATE_TIME 1..1).
sm_operation: I_EHR_STATUS.get_versioned_ehr_status
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/versioned_ehr_status
formats: [canonical-json, canonical-xml]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers" — a VERSIONED_OBJECT is named outright —, and "For openEHR
# resources, this value [Last-Modified] should be derived from
# `VERSION.commit_audit.time_committed.value`". The ETag identifier itself is
# left unconstrained beyond the weak envelope, because the same section makes
# the source a choice ("usually taken from e.g. VERSIONED_OBJECT.uid.value,
# VERSION.uid.value, EHR.ehr_id.value, etc.").
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)";
# §Deprecated headers deprecates it on `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated
      ETag: 'pattern:W/"[^"]+"'           # the weakness indicator is a MUST — overview §Deprecated headers
      Last-Modified: present
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }              # unknown ehr_id (overview §HTTP status codes, row 404)
