# Wire realization of I_QUERY_SERVICE.execute_ad_hoc_query, variant
# `post_fetch_url`: the POST form with the paging parameter available in the
# URL as well as the body — the duality register AMB-99 adjudicates.
#
# Ground (ITS-REST DOCS TEXT, the released oracle), quoted:
#
# - the URL forms applying to POST — docs/query/Request.md §"Common Headers and
#   Query Parameters" opens "All query execution requests SHOULD support at
#   least the following parameters" and lists `ehr_id`, `offset`, `fetch`,
#   `query_parameters`. The sentence says ALL query execution requests and
#   draws no GET/POST distinction, so the URL forms are not a GET-only surface.
# - the body form — §"GET vs POST" ("a mostly self-documented AQL query in a
#   request body"), with register AMB-99 recording first-hand that the query
#   POSTs carry `offset`/`fetch`/`query_parameters` in the body.
# - the both-places case — no released sentence assigns precedence when a value
#   is carried in the URL and the body at once; register AMB-99's fixed handling
#   accepts AGREEING values and REFUSES a disagreement. The two slots take
#   SEPARATE references (`${url_fetch?}` in the query, `${fetch?}` in the body),
#   so a case chooses which arm it drives: binding only `url_fetch` is the
#   URL-only form, binding both to the same number is the agreeing form, and
#   binding them to different numbers is the refusal. That last arm became
#   nameable with the `bad_request` kind the 2026-07-28 schedule release (#544)
#   added; `invalid_query` would be wrong (the AQL is well formed) and
#   `validation_failed` means 422 semantic CONTENT.
# - `400` on the disagreeing form — docs/overview/Requests_and_responses.md
#   §"HTTP status codes", row 400: "The service cannot or will not process the
#   request due to something that is perceived to be a client error (e.g.,
#   malformed request syntax, syntactically invalid content)", with the clause
#   below the table ("used when no other `4xx` error code is appropriate").
# - `200` — docs/overview/Requests_and_responses.md §"HTTP status codes", row
#   `200 OK`.
# - `ETag` — docs/query/Request.md §"Common Headers and Query Parameters":
#   "Related response headers: `ETag` - A unique identifier of the resultSet";
#   its FORM by docs/overview/Requests_and_responses.md §"Deprecated headers":
#   "all `ETag` headers that hold a resource identifier MUST include a weakness
#   indicator `W/`".
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
its: its-rest
variant: post_fetch_url
request:
  method: POST
  path: /query/aql
  query:
    ehr_id: "${ehr_id?}"                     # Request.md §About the ehr_id parameter (URL form, available on POST)
    fetch: "${url_fetch?}"                   # Request.md §Common Headers and Query Parameters (the URL paging form)
  body:
    q: "${q}"                                # Request.md §GET vs POST (the body-borne query)
    query_parameters: "${query_parameters?}" # Request.md §Query parameters
    offset: "${offset?}"                     # Request.md §Common Headers and Query Parameters
    fetch: "${fetch?}"                       # the body paging form; bound only by the both-places case
  headers:
    Content-Type: application/json
    Accept: application/json
formats: [canonical-json]
outcomes:
  ok:
    status: 200                              # Requests_and_responses.md §HTTP status codes, row 200
    # The resultSet `ETag`: presence is SHOULD-strength, the weak form is a MUST.
    # docs/query/Request.md §"Common Headers and Query Parameters" names the header
    # with no RFC 2119 keyword at all ("Related response headers: `ETag` - A unique
    # identifier of the resultSet"), and the released OAS declares it without
    # `required` (query-codegen.openapi.yaml components/headers/ETag_RESULT_SET), so
    # the only strength anywhere is docs/overview/Requests_and_responses.md §"ETag and
    # Last-Modified": "Both `ETag` and `Last-Modified` SHOULD be included in responses
    # for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
    # state identifiers". A server that omits it is therefore not failed (`optional:
    # true`), while one that emits it must weaken it — §"Deprecated headers": "all
    # `ETag` headers that hold a resource identifier MUST include a weakness indicator
    # `W/`", a MUST the same chapter dates to Release 1.1.0 (`applies`).
    headers: { ETag: { match: 'pattern:W/"[^"]+"', optional: true, applies: { its_rest: ">=1.1.0" } } }
    body: result_set_body
  bad_request:
    status: 400                              # §HTTP status codes row 400 — URL and body disagree on the same paging parameter (register AMB-99)
    body: error_loose                        # §HTTP status codes — 4xx detail is a MAY under Prefer: return=representation
