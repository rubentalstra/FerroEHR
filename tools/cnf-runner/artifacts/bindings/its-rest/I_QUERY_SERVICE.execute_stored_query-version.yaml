# Wire realization of I_QUERY_SERVICE.execute_stored_query, variant `version`:
# execution of a stored query at a NAMED version selector (exact or prefix)
# instead of the latest.
#
# Ground (ITS-REST DOCS TEXT, the released oracle), quoted:
#
# - the selector and its matching rule — docs/query/Qualified_query_name.md:
#   "Stored queries are identified by their name, used as
#   `qualified_query_name`, and an optional `version` number"; "The `version`
#   identifier is in the format specified by SEMVER style (i.e.
#   `major.minor.patch`)"; "When only a partial `version` pattern is supplied,
#   or when `version` is not supplied at all, the system must use the latest
#   `version` with the supplied prefix - i.e. if only `major` or `major.minor`
#   is used, then the latest query version matching supplied prefix will be
#   used." That is a MUST, and it is the whole contract this variant exists to
#   drive.
# - `ehr_id` / `offset` / `fetch` / `query_parameters` — docs/query/Request.md
#   §"Common Headers and Query Parameters": "All query execution requests SHOULD
#   support at least the following parameters" (the list is not carved out by
#   execution form) + §"Query parameters".
# - `200` — docs/overview/Requests_and_responses.md §"HTTP status codes", row
#   `200 OK`.
# - `ETag` — docs/query/Request.md §"Common Headers and Query Parameters":
#   "Related response headers: `ETag` - A unique identifier of the resultSet";
#   its FORM by docs/overview/Requests_and_responses.md §"Deprecated headers":
#   "all `ETag` headers that hold a resource identifier MUST include a weakness
#   indicator `W/`".
# - `404` — docs/overview/Requests_and_responses.md §"HTTP status codes", row
#   `404 Not Found`: "The origin service did not find the target resource or is
#   not willing to disclose that one exists". A selector that matches no stored
#   version — an out-of-range `major`, or a token that is neither an exact
#   3-part SEMVER nor a `{major}`/`{major}.{minor}` prefix — addresses no target
#   resource; the malformed-selector half is adjudicated in register AMB-102.
#
# The executed VERSION is not carried on the wire (the RESULT_SET has no version
# field — register AMB-103), so cases discriminate the matched version by the
# stored AQL's own `AS` alias, which surfaces as `columns[].name` (the column
# identity rule of docs/query/Response.md's RESULT_SET).
sm_operation: I_QUERY_SERVICE.execute_stored_query
its: its-rest
variant: version
request:
  method: GET
  path: /query/{qualified_query_name}/{version}   # Qualified_query_name.md (name + version identity)
  query:
    ehr_id: "${ehr_id?}"                     # Request.md §About the ehr_id parameter
    offset: "${offset?}"                     # Request.md §Common Headers and Query Parameters
    fetch: "${fetch?}"                       # Request.md §Common Headers and Query Parameters
    query_parameters: "${query_parameters?}" # Request.md §Query parameters
  headers:
    Accept: application/json
formats: [canonical-json]
outcomes:
  ok:
    status: 200                              # Requests_and_responses.md §HTTP status codes, row 200
    # The resultSet `ETag`: presence is SHOULD-strength, the weak form is a MUST.
    # docs/query/Request.md §"Common Headers and Query Parameters" names the header
    # with no RFC 2119 keyword at all ("Related response headers: `ETag` - A unique
    # identifier of the resultSet"), and the released OAS declares it without
    # `required` (query-codegen.openapi.yaml components/headers/ETag_RESULT_SET), so
    # the only strength anywhere is docs/overview/Requests_and_responses.md §"ETag and
    # Last-Modified": "Both `ETag` and `Last-Modified` SHOULD be included in responses
    # for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
    # state identifiers". A server that omits it is therefore not failed (`optional:
    # true`), while one that emits it must weaken it — §"Deprecated headers": "all
    # `ETag` headers that hold a resource identifier MUST include a weakness indicator
    # `W/`", a MUST the same chapter dates to Release 1.1.0 (`applies`).
    headers: { ETag: { match: 'pattern:W/"[^"]+"', optional: true, applies: { its_rest: ">=1.1.0" } } }
    body: result_set_body
  not_found: { status: 404 }                 # Requests_and_responses.md §HTTP status codes, row 404
