# EXTENSION realization of I_EHR_EXTRACT_SERVICE.export_ehrs.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the release publishes SEVEN API groups (overview, system, ehr,
# demographic, query, definition, admin) and no message / EHR-Extract / TDD
# group in either the docs text (specifications/docs/**) or the OAS
# (specifications/*.openapi.yaml); there are no message_*/extract_* operations
# anywhere in specifications/operations. Register AMB-34.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `GET /message/export/{ehr_id}`, declared in the `message-extract`
# family of vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS
# IT — our own design/extension. It therefore gates the EhrExtract / MessageApi
# CAPABILITY verdicts only and never ITS-REST wire conformance; the
# capability-matrix rows carry `realization: extension`, which may never be
# `required` (owner ruling 2026-07-28).
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehrs
its: its-rest
extension:
  family: message-extract
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract API at all, so the SM
    export_ehrs has no released wire; this product serves the operation on its
    own /message/export/{ehr_id} route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc +
    docs/UML/classes/i_ehr_extract_service.adoc (export_ehrs) vs released
    ITS-REST specifications/*.openapi.yaml (seven groups, none of them
    message/extract/tdd) + specifications/docs/** (no such API) — no openEHR
    spec governs the extension route, our own design/extension
  ambiguity: AMB-34
request:
  method: GET
  path: /message/export/{ehr_id}
  headers:
    Accept: application/json
formats: [canonical-json]
# NO `applies:` floor rides on these expectations — a floor dates a RELEASED
# rule, and nothing released governs this route.
outcomes:
  # The SM return is `List<EXTRACT>`, so a fulfilled call carries the extract
  # array. Nothing released governs this route; the status choice is ours
  # (RFC 9110 §15.3.1: 200 for a successful request whose representation is the
  # result).
  ok:
    status: 200
    headers:
      Content-Type: negotiated
  # SM `precondition_violation` — the `{ehr_id}` path segment is not a
  # well-formed EHR identifier. Distinct from `not_found`: a malformed
  # identifier is refused before any lookup, so the answer says nothing about
  # what the store holds. Nothing released governs this route; the status
  # choice is the served route's own documented contract (RFC 9110 §15.5.1:
  # 400 for a request the server "cannot or will not process ... due to
  # something that is perceived to be a client error").
  bad_request:
    status: 400
  # SM error `ehr_id_does_not_exist`.
  not_found:
    status: 404
