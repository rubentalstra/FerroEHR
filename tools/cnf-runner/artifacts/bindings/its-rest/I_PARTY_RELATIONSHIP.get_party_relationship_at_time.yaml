# EXTENSION realization of I_PARTY_RELATIONSHIP.get_party_relationship_at_time.
#
# NO RELEASED WIRE EXISTS (re-derived first-hand 2026-07-28): the released
# specifications/demographic.openapi.yaml declares no `/demographic/
# party_relationship*` path and the ITS-REST docs text never names the resource
# — register AMB-32.
#
# WHAT THIS BINDING DRIVES: the same extension read with the `version_at_time`
# query parameter — `GET /demographic/party_relationship/{uid_based_id}
# ?version_at_time=…`, the `party-relationship` served_extensions family.
# NO openEHR SPEC GOVERNS IT — our own design/extension — so it gates the
# PartyRelationshipOperations CAPABILITY verdict only, never ITS-REST wire
# conformance.
sm_operation: I_PARTY_RELATIONSHIP.get_party_relationship_at_time
its: its-rest
extension:
  family: party-relationship
  reason: >-
    ITS-REST 1.1.0 surfaces no PARTY_RELATIONSHIP resource, so the SM
    get_party_relationship_at_time has no released wire; this product serves the
    at-time read as the version_at_time query on its own
    /demographic/party_relationship/{uid_based_id} route.
  source: >-
    SM docs/UML/classes/i_party_relationship.adoc (get_party_relationship_at_time); ITS-REST
    specifications/demographic.openapi.yaml (no party_relationship path); ITS-REST
    specifications/docs/demographic (no mention); no openEHR spec governs this — our own
    design/extension
  ambiguity: AMB-32
request:
  method: GET
  path: /demographic/party_relationship/{versioned_object_uid}
  query:
    version_at_time: "${version_at_time}"
formats: [canonical-json]
# NO `applies:` floor rides on these header expectations — see the note in
# I_PARTY_RELATIONSHIP.get_party_relationship.yaml: a floor dates a RELEASED
# rule, and nothing released governs this route.
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"'
      Location: absent
  not_found: { status: 404 }
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
