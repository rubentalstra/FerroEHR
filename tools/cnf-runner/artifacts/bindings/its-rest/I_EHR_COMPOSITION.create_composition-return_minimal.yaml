# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# `return_minimal`: the commit states the minimal preference EXPLICITLY. The
# variant-less binding pins `Prefer: return=representation`, so this preference
# needs its own realization — the same shape
# I_DEFINITION_ADL14.upload_opt-return_minimal already carries on the template
# upload.
#
# ORACLE ORDER for the status/body pair (register AMB-62, re-adjudicated
# 2026-07-28). TIER 1, THE DOCS TEXT, is SILENT — not conflicting: overview
# `Requests_and_responses.md` §"Prefer minimal, identifier or full
# representation response" offers "The HTTP status is typically `201 Created`"
# (descriptive — "typically", no RFC 2119 keyword) and "If no response body is
# returned, the service SHOULD use `204 No Content`" (conditional on whether a
# body is returned, which the same text never assigns), so the paragraph settles
# no status. TIER 2, THE RELEASED OAS, fills exactly that silence and is cited
# AS the OAS: `operations/composition_create.yaml` maps success to a single
# `'201'` and declares no `'204'`, and `responses/201_COMPOSITION.yaml` closes
# "If the `Prefer` header is missing or set to `return=minimal`, the body is
# empty". So: created, with nothing in the body.
#
# `Location` IS declared, on the docs text's own SHOULD — §Prefer minimal: "The
# response SHOULD include a `Location` header pointing to the newly created or
# updated resource" — corroborated by the released 201 header block
# (`headers/Location_COMPOSITION.yaml`). On an empty-bodied response it is the
# only thing addressing what was created, which is what makes the branch usable
# at all.
#
# NO `Content-Type` is declared: Resources.md §JSON Format requires it "unless
# the response has no content body", and this branch has none.
# `Preference-Applied` uses the optional matcher — §Representation details
# negotiation makes it a MAY.
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: return_minimal
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Prefer: "return=minimal"
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # OAS operations/composition_create.yaml — the one declared success status
    # AMB-62 re-adjudicated 2026-07-28: 204 is a CONFORMANT answer to this
    # branch too, so both are judged and neither server's answer is
    # inconclusive. Once the OAS fill supplies "the body is empty", the
    # docs-text conditional it satisfies FIRES — overview §"Prefer minimal,
    # identifier or full representation response": "If no response body is
    # returned, the service SHOULD use `204 No Content`" — and the docs text
    # outranks the OAS. It is a SHOULD, not a MUST, and the release's own
    # computable artifact declares 201 for this operation, so 201-with-an-
    # empty-body is a weighed deviation rather than a violation. That 204 is
    # reachable at all under `minimal` is the docs text's own contrast: the
    # SIBLING preference is the one it excludes it from (§"Prefer only
    # identifier": "the status will be `201 Created` or `200 OK`, never `204
    # No Content`").
    alt_status: [204]
    body: absent                          # OAS responses/201_COMPOSITION.yaml — "If the `Prefer` header is missing or set to `return=minimal`, the body is empty"
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # the weakness indicator is a MUST — overview §Deprecated headers
      Location: present                   # overview §Prefer minimal — "The response SHOULD include a `Location` header pointing to the newly created or updated resource"
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
