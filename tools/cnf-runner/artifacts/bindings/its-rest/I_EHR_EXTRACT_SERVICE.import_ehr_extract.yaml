# EXTENSION realization of I_EHR_EXTRACT_SERVICE.import_ehr_extract.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the release publishes SEVEN API groups (overview, system, ehr,
# demographic, query, definition, admin) and no message / EHR-Extract / TDD
# group in either the docs text (specifications/docs/**) or the OAS
# (specifications/*.openapi.yaml); there are no message_*/extract_*/tdd_*
# operations anywhere in specifications/operations. Register AMB-34.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `POST /message/import/{ehr_id}`, declared in the `message-extract` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the EhrExtract CAPABILITY verdict(s)
# only and never ITS-REST wire conformance; the capability-matrix rows carry
# `realization: extension`, which may never be `required` (owner ruling
# 2026-07-28).
sm_operation: I_EHR_EXTRACT_SERVICE.import_ehr_extract
its: its-rest
extension:
  family: message-extract
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract/TDD API at all, so the SM
    import_ehr_extract has no released wire; this product serves the operation on its
    own /message/import/{ehr_id} route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc; SM
    docs/UML/classes/i_ehr_extract_service.adoc (import_ehr_extract); ITS-REST specifications
    (the seven released API groups, none of them message/extract/tdd); ITS-REST
    specifications/docs (no such API); no openEHR spec governs this — our own design/extension
  ambiguity: AMB-34
request:
  method: POST
  path: /message/import/{an_ehr_id}
  body: an_extract
  headers:
    Content-Type: application/json
formats: [canonical-json]
outcomes:
  # The extract's content items land as new versions of the addressed EHR's
  # versioned objects (RM common master06 §Copying Cases 2/3). The SM operation
  # returns nothing and the affected resources are read through their own
  # released endpoints, so the answer carries no body — nothing released
  # governs this route; the status choice is ours (RFC 9110 §15.3.5: 204 for a
  # successful request with no content to send).
  updated:
    status: 204
  # SM `precondition_violation` — the payload is not a well-formed EXTRACT, or
  # a content item / ORIGINAL_VERSION is malformed.
  bad_request:
    status: 400
  # SM `ehr_id_does_not_exist`.
  not_found:
    status: 404
  # The EHR already holds an EHR_STATUS/EHR_ACCESS under a different object id
  # (EHR.ehr_status / ehr_access 1..1, RM ehr master04), or the imported status
  # names a subject another EHR holds (one EHR per subject, §EHR Status).
  conflict:
    status: 409
