# Wire realization of I_DEFINITION_QUERY.store_query, variant
# wrong_media_type: the stored-query PUT is sent DECLARING `Content-Type:
# application/json` on an operation whose body is the query text.
#
# Ground (ITS-REST DOCS TEXT): docs/overview/Resources.md §"JSON Format" — "A
# client MAY use the header `Content-Type: application/json` in the requests to
# specify the JSON payload format. If the service cannot process the request
# payload as JSON format, it MUST respond with HTTP status code `415
# Unsupported Media Type`." The declared type is a client claim about the
# payload, and an AQL statement is not a JSON document, so the service cannot
# process it as the declared format and MUST refuse. Corroborated by
# docs/overview/Requests_and_responses.md §"HTTP status codes", row `415
# Unsupported Media Type`: "The service is refusing the request because the
# payload is in a format not supported by this method on the target resource".
#
# The refusal is a media-type decision, not a parse outcome: the body is the
# same valid AQL the variant-less binding stores, so nothing but the declared
# type distinguishes this exchange (the same discipline as
# I_DEFINITION_ADL14.upload_opt-wrong_media on the XML-only upload).
sm_operation: I_DEFINITION_QUERY.store_query
its: its-rest
variant: wrong_media_type
request:
  method: PUT
  path: /definition/query/{qualified_query_name}
  body: aql_text
  headers:
    Content-Type: application/json        # the DECLARED non-matching payload type under test
    Accept: application/json
outcomes:
  unsupported_media: { status: 415 }      # Resources.md §JSON Format MUST
