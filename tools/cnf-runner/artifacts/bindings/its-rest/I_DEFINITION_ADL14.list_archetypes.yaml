# ITS-REST 1.1.0 surfaces no wire for I_DEFINITION_ADL14.list_archetypes —
# the ADL 1.4 REST surface provisions only operational templates; there is no
# archetype endpoint. Declared unrealized so the case is not-applicable WITH
# CITATION and activates when a later ITS release adds ADL 1.4 archetype
# provisioning.
#
# THIS SUT NEVERTHELESS SERVES an ADL 1.4 archetype surface of its own design
# (the `adl14-archetype` family of vocab/wire_surface.yaml served_extensions),
# and the row above stays exactly right about the SPEC. The binding is NOT
# flipped to an `extension:` realization, for a reason that is an adjudication
# rather than a coverage decision: `Adl14ArchetypeProvisioning` is a CORE row
# the CNF Profiles book marks REQUIRED, and `Realization::Extension` may never
# be `required` (`CapabilityMatrix::check_realization_scoping`, owner ruling
# 2026-07-28) — so realizing this operation on the extension surface would mean
# dropping `required` from a book-CORE row, which is the owner's call, not the
# catalogue's.
#
# TODO: flip this binding to an `extension:` realization over the served
# `GET /definition/archetype/adl1.4` route once (a) the owner has adjudicated
# `required` on the CORE Adl14ArchetypeProvisioning row against the
# extension-may-not-be-required rule, and (b) the closed CorpusFormat vocabulary
# can carry an ADL 1.4 source fixture (it has opt-xml and adl2-text but no ADL
# 1.4 archetype member), so the served upload/get/delete branches get real
# cases instead of a list-only battery.
sm_operation: I_DEFINITION_ADL14.list_archetypes
its: its-rest
unrealized:
  reason: >-
    No ADL 1.4 archetype operation exists in ITS-REST 1.1.0; the surface is
    operational-template only (/definition/template/adl1.4* — no archetype
    paths).
  source: "SM docs/UML/classes/i_definition_adl14.adoc (archetype provisioning) vs ITS-REST specifications/operations (definition_template_adl1.4_* — OPT-only)"
  ambiguity: AMB-41
