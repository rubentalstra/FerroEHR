# Wire realization of I_PARTY.get_party_at_time for ITS-REST 1.1.0.
# The SM I_PARTY.get_party_at_time(a_versioned_party_id, a_time) returns the
# PARTY version current at a_time; realized as GET
# /demographic/person/{uid_based_id}?version_at_time=... with the HIER_OBJECT_ID
# form — "if version_at_time is supplied, retrieves the version extant at
# specified time" (person_get.yaml). PERSON is the representative concrete PARTY
# subtype; the dedicated GET /demographic/versioned_party/{versioned_object_uid}/
# version?version_at_time is the VERSIONED_PARTY-resource alternative but returns
# a VERSION<PARTY> wrapper rather than the PARTY the SM returns.
# master10 anchors the cases under I_DEMOGRAPHIC_SERVICE; the resolvable SM
# operation is I_PARTY.get_party_at_time.
# Sources: specifications/operations/person_get.yaml (200/204/404),
# responses/200_PERSON_retrieved.yaml, 204_deleted_at_time.yaml,
# 404_not_found_or_no_version_at_time.yaml; parameters/query/version_at_time.yaml.
sm_operation: I_PARTY.get_party_at_time
its: its-rest
request:
  method: GET
  path: /demographic/person/{versioned_object_uid}
  query:
    version_at_time: "${version_at_time}"
formats: [canonical-json, canonical-xml]
outcomes:
  ok:
    status: 200                           # 200_PERSON_retrieved.yaml
    headers: { Content-Type: negotiated }
  ok_empty: { status: 204 }               # 204_deleted_at_time.yaml — deleted at requested time
  not_found: { status: 404 }              # unknown party or no version at time
