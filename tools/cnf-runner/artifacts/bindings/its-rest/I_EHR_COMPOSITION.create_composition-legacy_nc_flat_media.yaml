# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# legacy_nc_flat_media: the commit is sent declaring the LEGACY
# `application/openehr.nc.flat+json` payload media type — one of the
# "Legacy or experimental formats" ITS-REST overview Resources.md
# §Alternative data formats enumerates ("`application/openehr.nc.flat+json`
# based on the ECISFLAT format"). §Data representation makes support for them
# optional ("other alternative formats MAY be supported as well"), so a server
# that does not support the type cannot process the payload and MUST refuse
# with 415 — Resources.md §Simplified Formats: "If the service cannot process
# the request payload as the simplified format is not supported, it MUST
# respond with HTTP status code `415 Unsupported Media Type`" (the symmetric
# §JSON Format / §XML Format sentences say the same for the canonical types).
#
# One behaviour per case: the body is the same valid FLAT payload the
# SF-DEPRECATED cases commit, so nothing but the declared media type
# distinguishes this exchange. Whether the legacy support exists is
# statement-declared (register AMB-61, option_select).
#
# Sources (ITS-REST DOCS TEXT — tier 1, which wins every conflict; the
# RELEASED OAS fills only what the docs text is silent on and is cited AS
# the OAS where it does — owner ruling 2026-07-28):
#   specifications/docs/overview/Resources.md §Alternative data formats,
#   §Data representation, §Simplified Formats.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: legacy_nc_flat_media
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
formats: [wt-flat]
format_headers:
  wt-flat:
    Content-Type: application/openehr.nc.flat+json   # the LEGACY ECISFLAT media type under test
    openehr-template-id: required
outcomes:
  unsupported_media: { status: 415 }      # Resources.md §Simplified Formats 415 MUST
