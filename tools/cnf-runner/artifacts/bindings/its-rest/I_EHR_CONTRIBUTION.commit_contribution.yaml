# Wire realization of I_EHR_CONTRIBUTION.commit_contribution for ITS-REST 1.1.0.
# Sources: specifications/operations/contribution_create.yaml (201/400/404/409),
# responses/201_CONTRIBUTION.yaml, 400_CONTRIBUTION.yaml.
sm_operation: I_EHR_CONTRIBUTION.commit_contribution
its: its-rest
request:
  method: POST
  path: /ehr/{ehr_id}/contribution
  body: contribution                      # CONTRIBUTION envelope: versions[] + audit
  headers:
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
# THE SIMPLIFIED-FORMAT COMMIT FORMS (SPECITS-84). The DOCS TEXT records the
# amendment itself — docs/overview/Amendment_record.md, the SPECITS-84 row
# verbatim: "Add support for FLAT/SDT to Contribution REST API calls - accept
# the Simplified Formats MIME types on CONTRIBUTION endpoints; the Simplified
# Formats serialization applies to `versions[].data` only, the CONTRIBUTION
# envelope remains canonical" — and docs/overview/Resources.md §Simplified
# Formats fixes the negotiation ("To use these formats, content negotiation
# SHOULD be done in the same manner as for the canonical XML or JSON format
# above, but instead of `application/xml` or `application/json`, clients and
# servers MUST use: `application/openehr.wt.flat+json` … `application/
# openehr.wt.structured+json`"). The docs text does NOT spell the split per
# operation, so the RELEASED OAS grounds the operation-level statement (cited
# AS the OAS — owner ruling 2026-07-28): operations/contribution_create.yaml
# §"Simplified Formats", verbatim: "The `Content-Type` and `Accept` headers MAY
# be set to one of the Simplified Formats MIME types … in addition to the
# canonical `application/json` / `application/xml`" and "When a Simplified
# Formats MIME type is used, the **CONTRIBUTION envelope itself remains
# canonical JSON** (i.e. `uid`, `versions[]` metadata, and `audit` follow the
# canonical RM serialization). Only the inner versioned payload - each
# `versions[i].data` … - is serialized in the chosen FLAT or STRUCTURED form."
#
# So the format axis on THIS binding names the representation of the INNER
# `versions[i].data` only; the request body the runner sends is always the
# canonical envelope, with each member's `data` in the named simplified form.
# `openehr-template-id` is required with it for the same reason the COMPOSITION
# commit requires it — ITS-REST overview `Requests_and_responses.md`
# §openehr-template-id: the header identifies the template "when the request
# body format does not include the template identifier", which is exactly the
# simplified inner payload's situation.
format_headers:
  wt-flat:
    Content-Type: application/openehr.wt.flat+json
    openehr-template-id: required
  wt-structured:
    Content-Type: application/openehr.wt.structured+json
    openehr-template-id: required
# The `ETag` weakness indicator is a MUST, not a style note — ITS-REST overview
# `Requests_and_responses.md` §Deprecated headers: "The `ETag` response header
# was used without a weakness indicator `W/`. This is now deprecated, all
# `ETag` headers that hold a resource identifier MUST include a weakness
# indicator `W/`" (§"ETag and Last-Modified" gives the shape:
# `ETag: W/"8849182c-…::openEHRSys.example.com::2"`). The matcher asserts the
# weak entity-tag envelope only; the identifier INSIDE it is left unconstrained
# because the same section makes the source a choice ("usually taken from e.g.
# VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc.").
#
# `Last-Modified` rides the SAME sentence as the tag — §"ETag and
# Last-Modified": "Both `ETag` and `Last-Modified` SHOULD be included in
# responses for VERSION, VERSIONED_OBJECT, or other resources that have
# versioning or unique state identifiers" — under register AMB-87's fixed
# handling, whose scope covers the COMMIT response as well as the read: the
# 201 already names the CONTRIBUTION's unique identifier in its entity tag, and
# the instant it reports is the committal the same section points the value at
# ("derived from `VERSION.commit_audit.time_committed.value`"). The released
# 201_CONTRIBUTION declares ETag / Location / Content-Type and is SILENT on
# this header — silence, not a conflict, so the docs-text SHOULD stands.
outcomes:
  created:
    status: 201                           # 201_CONTRIBUTION.yaml — the whole commit is one transaction
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }
      Location: present
      Last-Modified: present              # AMB-87 — the committal instant of the resource the 201 identifies
    body: prefer_conditional
  validation_failed:
    status: 422                           # ITS-REST overview §HTTP status codes — 422 = semantic errors (invalid version content)
    alt_status: [400]                     # on commit_contribution this kind ALSO carries mismatched-modification-type rejections (a MODIFICATION as first version; a CREATION naming a preceding version) — a structurally-invalid/mismatched request, which the overview classes as 400 (§HTTP status codes: 400 = syntactically invalid content / generic client error)
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  template_not_found:
    status: 422                           # ITS-REST overview §HTTP status codes — 422 = semantic errors ("the underlying template is not known"); kind distinguished by fixture
    body: error_loose
  bad_request:
    # The SHAPE class the released `400_CONTRIBUTION.yaml` enumerates verbatim:
    # "`400 Bad Request` is returned when the request could not be parsed or is
    # invalid (e.g. malformed request URL syntax, missing required header or
    # parameter, or syntactically invalid header, parameter or content …)".
    # Distinct from `validation_failed`, which is the well-formed-but-
    # semantically-unfollowable branch: this kind covers an envelope that does
    # not match the released `NewContribution`/`UpdateVersion` schemas — a
    # member missing a `required` property, or carrying one the schemas do not
    # declare — AND the same response's change-control clause ("the
    # modification type does not match the operation"), e.g. a delete member
    # declaring a non-523 lifecycle_state (#2450).
    status: 400
    body: error_loose
  not_found: { status: 404 }              # 404_unknown_ehr_id.yaml — the EHR the route addresses does not exist
  conflict:
    # DOCS TEXT (overview `Requests_and_responses.md` §HTTP status codes, the
    # 409 row verbatim): "Indicates that the request could not be processed
    # because it might generate a duplicate or a conflict". Two request shapes
    # on this operation land in that row. (1) A duplicate: the CONTRIBUTION
    # envelope carries an optional client-supplied `uid`, and a second commit
    # naming a uid already in use would generate exactly the duplicate the row
    # names. (2) A conflict with the resource's current state: a content write
    # into an EHR whose `EHR_STATUS.is_modifiable` is false (RM ehr master04
    # §EHR Active Status) — code adjudicated in register AMB-82, whose scope was
    # extended to the native CONTRIBUTION commit.
    status: 409
    body: error_loose
  precondition_failed:
    # A member naming a STALE or unknown `preceding_version_uid`.
    #
    # SPEC SILENCE — no docs-text sentence assigns this branch a code. The
    # overview's 412 row reads "One or more conditions given in the request
    # HEADER FIELDS evaluated to false when tested on the server" and
    # §"If-Match and accidental overwrites" scopes its 412 to the `If-Match`
    # header, which this route does not carry at all: the precondition travels
    # inside the member body (`preceding_version_uid`). Register AMB-54(b)
    # carries the adjudicated fixed handling — 412, with the response BEYOND
    # the status unconstrained: the §If-Match ETag SHOULD is conditioned on
    # the service RECEIVING If-Match ("If a service receives this header …"),
    # which this operation has no parameter for, and CONTRIBUTION.versions is
    # a list over "any number of versionable items" (RM contribution.adoc), so
    # no single latest version_uid exists for an ETag to name.
    status: 412
    body: error_loose
captures:
  contribution_uid:
    from: body "uid.value"
    fallback: header Location last-segment
  contribution_etag_uid:
    # The SAME identity read from the OTHER channel, so a case can assert the
    # two agree instead of trusting either alone. Grounded in the create's own
    # entity-tag contract (register AMB-87 anchors the read side on it).
    from: header ETag
    strip: weak-quotes
  version_uids:
    from: body "versions[*].id.value"     # list capture: one element per committed VERSION
  first_version_uid:
    from: body "versions[0].id.value"     # scalar: the first committed VERSION (single-version contributions)
  first_versioned_object_uid:
    from: capture first_version_uid
    transform: root-uid                    # the versioned_object_uid of the first VERSION (for a version-envelope read)
