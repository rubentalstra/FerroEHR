# Wire realization of I_EHR_COMPOSITION.update_composition, variant
# `audit_bare_deprecated`: the committal metadata rides the BARE deprecated
# header name from the §"Deprecated headers" table — `openEHR-AUDIT_DETAILS`
# (which lowercases to `openehr-audit_details`, a DIFFERENT header name than
# the Release-1.1.0 `openehr-audit-details`).
#
# Why it MUST still work (Requests_and_responses.md §"Deprecated headers"):
#   "While the deprecated headers remain available for backward compatibility,
#   their use is strongly discouraged." — the table maps openEHR-AUDIT_DETAILS
#   -> openehr-audit-details.
# The value carries the same attribute-path-in-value grammar as the new name.
# Identical to the variant-less binding otherwise, so a red row localizes to
# the deprecated-name acceptance alone.
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
variant: audit_bare_deprecated
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    If-Match: '"${preceding_version_uid}"'
    Prefer: "return=representation"
    openEHR-AUDIT_DETAILS: 'description.value="from a 1.0.x client"'
formats: [canonical-json]
outcomes:
  updated:
    status: 200
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } }
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid, context/_uid]
