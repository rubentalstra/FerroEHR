# Wire realization of I_EHR_DIRECTORY.get_directory_at_version, variant
# `path`: the by-version directory read NARROWED to a sub-FOLDER by the `path`
# query parameter. Identical to the variant-less binding otherwise, so a red
# row localizes to the path navigation alone.
#
# The parameter is declared on this operation as well, not only on the at-time
# route — ITS-REST specifications/operations/directory_get_by_version_id.yaml
# lists `../parameters/query/path.yaml` among its parameters and its
# description says: "If `path` is supplied, retrieves from the directory only
# the sub-FOLDER that is associated with that path." So the pairing is
# symmetric: both directory GET routes navigate, and the version coordinate
# selects WHICH directory version the path is resolved against.
#
# The 404 trigger is the operation's own response file
# 404_directory_unknown_ehr_id_or_no_version_uid_or_no_path.yaml: "`404 Not
# Found` is returned when an EHR with `ehr_id` does not exist, or when a
# directory with `version_uid` does not exist, or when `path` does not exist
# within the directory."
#
# The parameter's GRAMMAR is spec-silent beyond one sentence; register AMB-81
# carries the adjudicated fixed handling the path cases pin.
sm_operation: I_EHR_DIRECTORY.get_directory_at_version
its: its-rest
variant: path
request:
  method: GET
  path: /ehr/{ehr_id}/directory/{version_uid}
  query:
    path: "${a_path}"                      # slash-separated FOLDER names (parameters/query/path.yaml)
formats: [canonical-json]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_FOLDER_retrieved.yaml — the body is the addressed sub-FOLDER
    headers:
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }              # "when `path` does not exist within the directory"
server_assigned: [uid]                    # the retrieved resource carries the server-assigned version uid the committed payload lacks
