# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# `version_lifecycle`: the commit carries a client-supplied
# VERSION.lifecycle_state through the `openehr-version` committal request
# header — the sibling of the `openehr-audit-details` variants, for the OTHER
# committal header of the same section.
#
# Why, from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"):
#   "In order to allow clients to provide committal metadata, services MUST
#   accept `openehr-version` and `openehr-audit-details` custom request
#   headers." — the worked example's first line is literally
#   `openehr-version: lifecycle_state.code_string="532"` — and
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime."
# The same section pins the legal value set to the openEHR terminology:
#   "The list of `code_string` values and their meaning is specified by the
#   Audit Change Type and Version Lifecycle State openEHR terminology
#   vocabularies."
# (TERM SupportTerminology §Version Lifecycle State: 532|complete|,
# 553|incomplete|, 523|deleted|, 800|inactive|, 801|abandoned|.)
#
# The header rides the POST because the section's rule is method-agnostic
# ("for all change-controlled resources ... services MUST also allow `PUT`,
# `POST` and `DELETE` methods directly on these change-controlled resources"),
# and because a FIRST commit is the one point where RM common
# master06-change_control_package.adoc §"Incomplete Content" makes a
# non-default lifecycle unambiguously legal ("Usually content will be
# committed in the `complete` state. However, in some circumstances ... it may
# be committed as `incomplete`"): the state machine's transition table lists no
# `complete` -> `incomplete` transition, so an UPDATE could not carry the same
# value without asserting a transition the RM does not define.
#
# Identical to the variant-less I_EHR_COMPOSITION.create_composition binding
# except for the added committal header, so a red row localizes to the
# lifecycle_state merge alone. The case supplies `${lifecycle_state}`.
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: version_lifecycle
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Prefer: "return=representation"
    openehr-version: 'lifecycle_state.code_string="${lifecycle_state}"'
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # overview §HTTP status codes, row 201
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::1"', applies: { its_rest: ">=1.1.0" } }  # overview §ETag and Last-Modified + §Deprecated headers (the W/ indicator is a MUST)
      Location: present                   # overview §Location ("used in `201 Created` responses when a new resource is successfully created")
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid, context/_uid, "composer/external_ref", territory/terminology_id]
