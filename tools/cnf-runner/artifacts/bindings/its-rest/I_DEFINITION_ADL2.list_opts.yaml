# Wire realization of I_DEFINITION_ADL2.list_opts for ITS-REST 1.1.0.
# The ADL2 list endpoint returns the available operational templates (OPTs) on
# the system; an empty system is a 200 with an empty list.
# Sources: specifications/operations/definition_template_adl2_list.yaml (200),
# responses/200_TemplateList_adl2.yaml (TemplateList entries carry template_id,
# concept, archetype_id, created_timestamp).
sm_operation: I_DEFINITION_ADL2.list_opts
its: its-rest
request:
  method: GET
  path: /definition/template/adl2                 # definition_template_adl2_list.yaml
  headers:
    Accept: application/json                       # Accept_JSON.yaml
outcomes:
  ok: { status: 200, headers: { Content-Type: negotiated } }   # 200_TemplateList_adl2.yaml
