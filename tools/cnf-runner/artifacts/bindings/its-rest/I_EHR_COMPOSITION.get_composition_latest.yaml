# Wire realization of I_EHR_COMPOSITION.get_composition_latest for
# ITS-REST 1.1.0.
# The SM get_composition_latest(ehr_id, versioned_object_uid) is realized as
# GET /ehr/{ehr_id}/composition/{versioned_object_uid}: when uid_based_id has
# the HIER_OBJECT_ID form (a versioned_object_uid) and no version_at_time is
# supplied, the server returns the LATEST version (composition_get.yaml).
# Sources: specifications/operations/composition_get.yaml (200/204/404),
# responses/200_COMPOSITION_retrieved.yaml, 204_deleted_at_time.yaml,
# 404_unknown_ehr_id_or_no_version_at_time.yaml.
sm_operation: I_EHR_COMPOSITION.get_composition_latest
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
outcomes:
  ok:
    status: 200                           # 200_COMPOSITION_retrieved.yaml
    headers: { Content-Type: negotiated }
  ok_empty: { status: 204 }               # latest version is a logical delete (204_deleted_at_time.yaml)
  not_found: { status: 404 }              # unknown ehr_id or unknown versioned_object_uid
