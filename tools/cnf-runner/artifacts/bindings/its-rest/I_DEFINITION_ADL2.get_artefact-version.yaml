# Wire realization of I_DEFINITION_ADL2.get_artefact for the DEPRECATED ADL2
# "Get a template at version" endpoint. A THIRD realization of get_artefact
# (plain OPT GET + example + this version GET), selected by `variant: version`.
# The endpoint is marked `deprecated: true` in the OAS (SPECITS-87: "Deprecate
# ADL2 'Get template at version'"); cases guard on that.
# Sources: specifications/operations/definition_template_adl2_version_get.yaml
# (operationId definition_template_adl2_version_get, deprecated: true),
# responses/200_Template_adl2_retrieved.yaml, 404_unknown_template_id_or_version.yaml,
# parameters/path/template_id.yaml + parameters/path/version.yaml.
sm_operation: I_DEFINITION_ADL2.get_artefact
its: its-rest
variant: version
request:
  method: GET
  path: /definition/template/adl2/{template_id}/{version}  # definition_template_adl2_version_get.yaml (deprecated)
  headers:
    Accept: text/plain                            # Accept_Template_adl2.yaml
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and the `ETag` "is considered to be of weak-type and
# should have a weakness indicator `W/` prefix". An ADL2 operational template's
# unique state identifier is its versioned ARCHETYPE_HRID (AM am24 —
# `release_version` is the artefact's SEMVER), so the ETag names the RESOLVED
# HRID, not the addressed (possibly partial) template_id.
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
outcomes:
  ok:
    status: 200                                    # 200_Template_adl2_retrieved.yaml
    headers:
      Content-Type: negotiated
      ETag: { match: 'pattern:W/"<template_hrid>"', applies: { its_rest: ">=1.1.0" } }  # the resolved ARCHETYPE_HRID, not the addressed prefix
  not_found: { status: 404 }                       # 404_unknown_template_id_or_version.yaml
