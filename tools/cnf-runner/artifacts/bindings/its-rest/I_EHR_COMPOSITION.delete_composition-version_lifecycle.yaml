# Wire realization of I_EHR_COMPOSITION.delete_composition, variant
# `version_lifecycle`: the DELETE carries a client-supplied
# VERSION.lifecycle_state through the `openehr-version` committal request
# header.
#
# The header is legal on this method — ITS-REST overview
# `Requests_and_responses.md` §"openehr-version and openehr-audit-details":
# "services MUST also allow `PUT`, `POST` and `DELETE` methods directly on
# these change-controlled resources" and "services MUST accept
# `openehr-version` and `openehr-audit-details` custom request headers" — and
# "whatever is provided it MUST be merged with the default VERSION and
# `VERSION.audit_details` attributes on commit runtime".
#
# The `bad_request` outcome exists because that merge duty cannot be honoured
# for every value here: a DELETE commits the logical-deletion procedure, which
# FIXES the state — RM common master06 §Logical Deletion, "set the
# `_lifecycle_state_` value to the code for `deleted`". A supplied state other
# than `523|deleted|` contradicts the operation, and the released
# `400_CONTRIBUTION`-class shape rule ("syntactically invalid header …") is the
# branch that says so out loud instead of silently discarding the instruction.
#
# Identical to the variant-less delete binding otherwise, so a red row
# localizes to the lifecycle header alone. The case supplies
# `${lifecycle_state}`.
sm_operation: I_EHR_COMPOSITION.delete_composition
its: its-rest
variant: version_lifecycle
request:
  method: DELETE
  path: /ehr/{ehr_id}/composition/{preceding_version_uid}
  headers:
    openehr-version: 'lifecycle_state.code_string="${lifecycle_state}"'
outcomes:
  deleted:
    status: 204                           # 204_version_deleted.yaml
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } }
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # DELETE — overview §Deprecated headers
  bad_request:
    status: 400                           # overview §HTTP status codes — syntactically invalid header
    body: error_loose
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid, context/_uid]
