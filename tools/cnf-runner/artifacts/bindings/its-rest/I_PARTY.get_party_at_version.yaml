# Wire realization of I_PARTY.get_party_at_version for ITS-REST 1.1.0.
# The SM I_PARTY.get_party_at_version(a_party_version_id) returns a particular
# PARTY version; realized as GET /demographic/person/{uid_based_id} with the
# OBJECT_VERSION_ID form (a version_uid) — "used to retrieve a specific known
# version of the PERSON" (person_get.yaml). PERSON is the representative concrete
# PARTY subtype; GET /demographic/versioned_party/{versioned_object_uid}/version/
# {version_uid} is the VERSIONED_PARTY-resource alternative but returns a
# VERSION<PARTY> wrapper rather than the PARTY the SM returns.
# master10 anchors the cases under I_DEMOGRAPHIC_SERVICE; the resolvable SM
# operation is I_PARTY.get_party_at_version (the AMB-13 rule; see REQUIREMENTS.md).
# Sources: specifications/operations/person_get.yaml (200/404),
# responses/200_PERSON_retrieved.yaml, 404_not_found_or_no_version_at_time.yaml;
# parameters/path/uid_based_id_as_version_uid.yaml.
sm_operation: I_PARTY.get_party_at_version
its: its-rest
request:
  method: GET
  path: /demographic/person/{version_uid}
formats: [canonical-json, canonical-xml]
outcomes:
  ok:
    status: 200                           # 200_PERSON_retrieved.yaml
    headers: { Content-Type: negotiated }
  not_found: { status: 404 }              # unknown version_uid (object_version_does_not_exist)
