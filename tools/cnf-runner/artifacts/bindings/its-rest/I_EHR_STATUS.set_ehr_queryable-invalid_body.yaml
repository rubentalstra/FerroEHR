# Wire realization of I_EHR_STATUS.set_ehr_queryable, variant `invalid_body`:
# the whole-EHR_STATUS PUT with a CASE-SUPPLIED payload instead of the
# read-modify-write body the variant-less realization builds. The variant
# exists so the invalid-EHR_STATUS data-set class can be driven through the
# update seam the SM setters are realized on; the case names the payload as
# the `ehr_status` role.
#
# Decisive docs-text sentence for the outcome (ITS-REST overview
# Requests_and_responses.md §HTTP status codes): "422 | Unprocessable Entity |
# The request was well-formed but was unable to be followed due to semantic
# errors". Every payload of this class is well-formed JSON that breaks an RM
# invariant — a mandatory attribute absent (RM ehr ehr_status.adoc §Attributes:
# `subject` 1..1 PARTY_SELF, `is_queryable` 1..1 Boolean, `is_modifiable` 1..1
# Boolean), or an archetype root without `archetype_details` (RM common
# locatable.adoc `Archetyped_valid`) — so it is semantic, not syntactic, and
# the 400 row of the same table ("malformed request syntax, syntactically
# invalid content") does not describe it. This is the same reading the
# catalogue already applies to the identical fixtures on the create seam
# (I_EHR_SERVICE.create_ehr, validation_failed -> 422).
sm_operation: I_EHR_STATUS.set_ehr_queryable
its: its-rest
variant: invalid_body
request:
  method: PUT
  path: /ehr/{ehr_id}/ehr_status
  body: ehr_status                          # the case supplies the payload (the invalid data-set class)
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
    Prefer: "return=representation"         # §HTTP status codes — "For `4xx` and `5xx` status codes, services MAY return additional error details if the `Prefer: return=representation` header is present"
formats: [canonical-json]
outcomes:
  validation_failed:
    status: 422                             # overview §HTTP status codes — "422 | Unprocessable Entity | The request was well-formed but was unable to be followed due to semantic errors"
    body: error_loose
