# Wire realization of I_EHR_STATUS.update_other_details for ITS-REST 1.1.0.
# SM i_ehr_status.adoc §update_other_details takes (an_ehr_id, a_details:
# ITEM_TREE) and means "Update other_details part of `EHR_STATUS` with new
# content" — a FIELD-level setter, and ITS-REST has none: exactly like its four
# is_queryable/is_modifiable siblings it is realized as a read-modify-write of
# the whole EHR_STATUS via PUT /ehr/{ehr_id}/ehr_status, with the current
# version_uid in If-Match (the SM preceding_version_uid, ITS-REST overview
# §"If-Match and accidental overwrites"). The runner reads the current
# EHR_STATUS, replaces `other_details`, and PUTs it back.
#
# The ITEM_TREE lives HERE rather than in the case because a patched body's
# `set` takes a literal value: this binding IS the SM operation's payload, the
# same way the sibling bindings fix `true`/`false`. Its shape is the released
# one: RM ehr ehr_status.adoc §Attributes types other_details as an
# `ITEM_STRUCTURE` and describes it as "Any other details of the EHR summary
# object, in the form of an archetyped `ITEM_STRUCTURE`" — archetyped, hence an
# archetype root carrying `archetype_details` (RM common locatable.adoc
# `Archetyped_valid`: is_archetype_root xor archetype_details = Void) — and
# ITEM_STRUCTURE is abstract, so the concrete `_type` is mandatory: ITS-REST
# overview Resources.md §"JSON Format", the `_type` attribute "should be used
# to specify the RM type whenever polymorphism is involved, or when the
# underlying definition in RM type is abstract". SM's own parameter type picks
# the concrete member: ITEM_TREE.
sm_operation: I_EHR_STATUS.update_other_details
its: its-rest
request:
  method: PUT
  path: /ehr/{ehr_id}/ehr_status
  body:
    from_capture: status_body             # read-modify-write, as the four sibling setters
    set:
      other_details:
        _type: ITEM_TREE
        name: { _type: DV_TEXT, value: "other details" }
        archetype_node_id: "openEHR-EHR-ITEM_TREE.generic.v1"
        archetype_details:
          archetype_id: { value: "openEHR-EHR-ITEM_TREE.generic.v1" }
          rm_version: "1.0.2"
        items:
          - _type: ELEMENT
            name: { _type: DV_TEXT, value: "note" }
            archetype_node_id: "at0001"
            value: { _type: DV_TEXT, value: "cnf other_details round-trip" }
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
    Prefer: "return=representation"
formats: [canonical-json]
# The `ETag` weakness indicator is a MUST, not a style note — ITS-REST overview
# `Requests_and_responses.md` §Deprecated headers: "The `ETag` response header
# was used without a weakness indicator `W/`. This is now deprecated, all
# `ETag` headers that hold a resource identifier MUST include a weakness
# indicator `W/`". The matcher asserts the weak entity-tag envelope only; the
# identifier INSIDE it is left unconstrained because the same section makes the
# source a choice ("usually taken from e.g. VERSIONED_OBJECT.uid.value,
# VERSION.uid.value, EHR.ehr_id.value, etc.").
outcomes:
  updated:
    status: 200                             # 204 when Prefer minimal — overview §Representation details negotiation
    headers: { ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } } }
    body: prefer_conditional
captures:
  status_version_uid:
    from: header ETag
    strip: weak-quotes
