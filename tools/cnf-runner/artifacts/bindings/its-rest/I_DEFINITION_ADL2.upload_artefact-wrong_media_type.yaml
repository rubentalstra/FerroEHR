# Wire realization of I_DEFINITION_ADL2.upload_artefact, variant
# wrong_media_type: the ADL2 upload is sent declaring `Content-Type:
# application/xml` on an operation whose only body type is the ADL2 source
# text. The service cannot process the payload as the declared format, so it
# MUST refuse with 415 — the exact mirror of the ADL 1.4 guard, grounded in the
# same overview sentences.
#
# DOCS TEXT (ITS-REST overview `Resources.md` §XML Format): "If the service
# cannot process the request payload as XML format, it MUST respond with HTTP
# status code `415 Unsupported Media Type`", with §JSON Format stating the
# mirror rule for a payload the service cannot process as JSON. Declaring
# `application/xml` on a body the operation types as `text/plain` ADL2 source
# is exactly that request: the service is being asked to process the payload as
# XML and cannot. The refusal is a MEDIA-TYPE decision, not a parse outcome —
# the body is the same valid ADL2 source the variant-less binding uploads, so
# only the declared type distinguishes this exchange, which is why the 400
# syntactic branch is not the answer here.
#
# Sources: specifications/docs/overview/Resources.md §XML Format + §JSON
# Format; specifications/operations/definition_template_adl2_upload.yaml
# (Content-Type enum: text/plain only; single request body content type
# text/plain).
sm_operation: I_DEFINITION_ADL2.upload_artefact
its: its-rest
variant: wrong_media_type
request:
  method: POST
  path: /definition/template/adl2
  body: opt_adl2
  headers:
    Content-Type: application/xml         # the DECLARED non-text/plain payload type under test
outcomes:
  unsupported_media: { status: 415 }      # Resources.md §XML Format MUST
