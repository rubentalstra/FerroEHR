# Wire realization of the RELEASED operation `versioned_party_revision_history`
# for ITS-REST 1.1.0 — "Retrieves revision history of the VERSIONED_PARTY
# identified by `versioned_object_uid`"
# (specifications/operations/versioned_party_revision_history.yaml), served at
# GET /demographic/versioned_party/{versioned_object_uid}/revision_history
# (specifications/demographic.openapi.yaml).
#
# ANCHOR, ORACLE ORDER, HEADER AND FORMAT DISCIPLINE: identical to the two
# EHR-side siblings under I_ITS_REST_REVISION_HISTORY — the reserved
# pseudo-interface of register AMB-161, the docs text silent on revision history
# so the released OAS grounds every value below, no ETag/Last-Modified declared
# (a REVISION_HISTORY is neither a VERSION nor a VERSIONED_OBJECT and carries no
# identity of its own — RM common
# UML/classes/org.openehr.rm.common.revision_history.adoc), canonical-json only
# (register AMB-167: no published document element).
#
# WHY THE PSEUDO-INTERFACE AND NOT `I_PARTY`: register AMB-136 records that
# `I_PARTY` declares no container read, no revision-history operation and no
# operation returning a VERSION envelope. The two VERSION sub-resources ARE
# anchored to `I_PARTY.get_party_at_version` under the AMB-127 closest-read
# convention, because a VERSION read is what that SM operation performs; a
# revision history is not — it serves the container's audit trail, which no
# `I_PARTY` operation returns. Re-adjudicated 2026-07-28: AMB-136's decision to
# leave this route unanchored PRE-DATES the AMB-161 pseudo-interface mechanism,
# which fits it exactly.
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
#
# OUTCOMES — exactly the released response set of this operation:
#  - `ok` 200: responses/200_REVISION_HISTORY.yaml, content application/json =
#    schemas/common/RevisionHistory.yaml (required: items).
#  - `not_found` 404: responses/404.yaml — "`404 Not Found` is returned when,
#    based on the request parameters, the server did not find a current
#    representation of a target resource, or is not willing to disclose that one
#    exists".
# The released operation declares NO other response, so no other branch exists.
sm_operation: I_ITS_REST_REVISION_HISTORY.versioned_party_revision_history
its: its-rest
request:
  method: GET
  path: /demographic/versioned_party/{versioned_object_uid}/revision_history
formats: [canonical-json]                 # AMB-167: REVISION_HISTORY has no published document element
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated            # 200_REVISION_HISTORY.yaml -> headers/ContentType_canonical.yaml
      Location: absent                    # read — overview §Location / §Deprecated headers
    body: present
  not_found: { status: 404 }              # responses/404.yaml
