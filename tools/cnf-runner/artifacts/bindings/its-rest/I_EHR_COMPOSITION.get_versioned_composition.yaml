# Wire realization of I_EHR_COMPOSITION.get_versioned_composition for
# ITS-REST 1.1.0.
# The SM get_versioned_composition(ehr_id, versioned_object_uid) returns the
# VERSIONED_COMPOSITION container; realized as
# GET /ehr/{ehr_id}/versioned_composition/{versioned_object_uid}.
# Sources: specifications/operations/versioned_composition_get.yaml (200/404),
# responses/200_VERSIONED_COMPOSITION.yaml,
# 404_unknown_ehr_id_or_versioned_object_uid.yaml.
sm_operation: I_EHR_COMPOSITION.get_versioned_composition
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/versioned_composition/{versioned_object_uid}
formats: [canonical-json, canonical-xml]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers" — a VERSIONED_OBJECT is named outright, and this route
# serves one —, and "For openEHR resources, this value [Last-Modified] should
# be derived from `VERSION.commit_audit.time_committed.value`". The ETag
# identifier itself is left unconstrained beyond the weak envelope, because the
# same section makes the source a choice ("usually taken from e.g.
# VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc.").
# The sibling VERSIONED_EHR_STATUS container binding carries the identical
# declaration for the identical sentence.
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_VERSIONED_COMPOSITION.yaml
    headers:
      Content-Type: negotiated
      ETag: 'pattern:W/"[^"]+"'           # the weakness indicator is a MUST — overview §Deprecated headers
      Last-Modified: present
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }              # unknown ehr_id or versioned_object_uid (404_unknown_ehr_id_or_versioned_object_uid.yaml)
  bad_request:
    # A `versioned_object_uid` path segment that parses as no UID form at all
    # is a syntactically invalid parameter, the overview's 400 row: "The
    # service cannot or will not process the request due to something that is
    # perceived to be a client error (e.g., malformed request syntax,
    # syntactically invalid content)". WHICH branch a malformed identifier
    # takes is assigned by no released sentence — register AMB-76 carries the
    # adjudicated repo-wide fixed handling (malformed identifier segments are
    # 400; unknown-but-well-formed identifiers stay 404).
    # KIND: `bad_request`, the taxonomy's malformed-request kind, not
    # `validation_failed` — nothing about the addressed CONTENT is judged
    # here, only the request's own syntax (vocab/outcomes.yaml: bad_request is
    # "distinct from validation_failed, the well-formed-but-semantically-
    # invalid branch"). One law, one kind: this is AMB-76's law, the same one
    # the other malformed-identifier reads carry.
    status: 400
    body: error_loose
