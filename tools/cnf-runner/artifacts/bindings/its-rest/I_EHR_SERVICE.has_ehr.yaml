# Wire realization of I_EHR_SERVICE.has_ehr for ITS-REST 1.1.0.
# The SM has_ehr() returns Boolean; ITS-REST has no dedicated existence probe,
# so the check is realized as GET /ehr/{ehr_id}: 200 = exists (positive),
# 404 = does not exist (negative).
# Sources: specifications/operations/ehr_get_by_id.yaml (200/404),
# responses/200_EHR.yaml, 404_unknown_ehr_id.yaml.
sm_operation: I_EHR_SERVICE.has_ehr
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_EHR.yaml — EHR exists
    headers:
      Content-Type: negotiated
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }                                   # 404_unknown_ehr_id.yaml — EHR absent
