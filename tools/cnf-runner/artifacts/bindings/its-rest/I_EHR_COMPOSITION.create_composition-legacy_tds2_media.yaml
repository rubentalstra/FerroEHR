# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# legacy_tds2_media: the commit is sent declaring the LEGACY
# `application/openehr.tds2+xml` payload media type — the request-side
# (Content-Type) mirror of the `example_legacy_tds2_accept` read variant, so
# the TDS2 type is pinned on both negotiation axes. ITS-REST overview
# Resources.md §Alternative data formats enumerates it under "Legacy or
# experimental formats" ("`application/openehr.tds2+xml` for TDS
# simplification of RM as XML"), and §Data representation makes support for
# them optional ("other alternative formats MAY be supported as well"), so a
# server that does not support the type cannot process the payload and MUST
# refuse with 415 — Resources.md §XML Format: "If the service cannot process
# the request payload ... it MUST respond with HTTP status code `415
# Unsupported Media Type`" (§Simplified Formats states the same rule for the
# simplified types).
#
# One behaviour per case: the body is the same valid canonical-XML
# COMPOSITION the create_composition-xml case commits, so nothing but the
# declared media type distinguishes this exchange — the `canonical-xml`
# format role names the BODY, while `format_headers` pins the media type
# actually sent. Whether the legacy support exists is statement-declared
# (register AMB-61, option_select).
#
# Sources (ITS-REST DOCS TEXT — tier 1, which wins every conflict; the
# RELEASED OAS fills only what the docs text is silent on and is cited AS
# the OAS where it does — owner ruling 2026-07-28):
#   specifications/docs/overview/Resources.md §Alternative data formats,
#   §Data representation, §XML Format, §Simplified Formats.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: legacy_tds2_media
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
formats: [canonical-xml]
format_headers:
  canonical-xml:
    Content-Type: application/openehr.tds2+xml   # the LEGACY TDS2 media type under test
    openehr-template-id: required
outcomes:
  unsupported_media: { status: 415 }      # Resources.md §XML Format / §Simplified Formats 415 MUST
