# Wire realization of I_DEFINITION_QUERY.has_query for ITS-REST 1.1.0.
# ITS-REST 1.1.0 exposes no dedicated existence-check endpoint; the SM
# has_query (Boolean) is realized via the list-by-name GET
# (specifications/operations/definition_query_list.yaml, responses/200_QueryList.yaml):
# a non-empty result set means the query is registered, an empty set means it
# is not. Recorded as an ambiguity candidate in the master05 REQUIREMENTS.md.
sm_operation: I_DEFINITION_QUERY.has_query
its: its-rest
request:
  method: GET
  path: /definition/query/{qualified_query_name}      # definition_query_list.yaml
  headers:
    Accept: application/json                           # Accept_JSON.yaml
outcomes:
  ok: { status: 200, headers: { Content-Type: negotiated } }  # 200_QueryList.yaml
