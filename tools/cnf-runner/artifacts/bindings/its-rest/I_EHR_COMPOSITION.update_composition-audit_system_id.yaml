# Wire realization of I_EHR_COMPOSITION.update_composition, variant
# `audit_system_id`: the update carries a client-supplied AUDIT_DETAILS
# system_id through the `openehr-audit-details` committal request header.
#
# Why, from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"):
#   "Through the `openehr-audit-details` header, clients MAY supply values for
#   the AUDIT_DETAILS attributes `change_type`, `description`, `committer` and
#   `system_id`." — the worked example's last line is literally
#   `openehr-audit-details: system_id="example.openehr.systemid"` — and
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime. In particular, when `system_id` is not provided by the
#   client, the server MUST set it to its own configured system identifier."
# The two sentences are one rule with two arms: SUPPLIED is merged verbatim,
# ABSENT is filled from the server's own configuration. This variant drives the
# supplied arm; the absent arm needs no variant at all (the variant-less
# I_EHR_COMPOSITION.update_composition binding sends no committal header), so
# the case exercises both arms against the same server.
#
# Identical to the variant-less binding except the added committal header, so a
# red row localizes to the system_id merge alone. The case supplies
# `${audit_system_id}`.
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
variant: audit_system_id
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    If-Match: '"${preceding_version_uid}"'
    Prefer: "return=representation"
    openehr-audit-details: 'system_id="${audit_system_id}"'
formats: [canonical-json]
outcomes:
  updated:
    status: 200                           # 200_COMPOSITION_updated.yaml
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } }
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid, context/_uid]
