# Wire realization of I_QUERY_SERVICE.execute_stored_query, variant
# `post_body`: the POST form of stored execution — the execution parameters
# travel in a JSON request body, and the URL protocol parameters remain
# available alongside it.
#
# Ground (ITS-REST DOCS TEXT, the released oracle), quoted:
#
# - the POST form itself — docs/query/Request.md §"GET vs POST": "Requests based
#   on the `GET` method have URI length restriction, or some characters might
#   not be allowed and have to be encoded. Long queries in the `q` parameter and
#   having a long list of `query_parameters` may add up to reach that limit,
#   thus we recommend clients using the `POST` method instead of `GET`." The
#   recommendation is unqualified by execution form, so stored execution has a
#   POST form as ad-hoc execution does; docs/query/Query_types.md §"Stored
#   queries" places both in the same query family.
# - the BODY carrying the execution parameters — the §"GET vs POST" example is
#   "a mostly self-documented AQL query in a request body" whose fields are the
#   execution parameters, and register AMB-99 records first-hand that the three
#   query POSTs carry `offset`/`fetch`/`query_parameters` in the body.
# - the parameters being OPTIONAL, so an empty JSON object is a complete
#   request — docs/query/Request.md §"Common Headers and Query Parameters"
#   gives each a default rather than requiring it: "`offset` - used for paging:
#   the row number in result to start result-set from (`0`-based); default `0`"
#   and "`fetch` - used for paging: the number of rows to fetch (i.e. limit);
#   default depends on the implementation". A stored query that declares no
#   AQL parameters needs none of them, so `{}` is the whole body.
# - the URL forms staying available on POST — docs/query/Request.md §"Common
#   Headers and Query Parameters" opens "All query execution requests SHOULD
#   support at least the following parameters" and draws no GET/POST
#   distinction; the both-places precedence question is register AMB-99, whose
#   fixed handling accepts agreeing values.
# - `200` — docs/overview/Requests_and_responses.md §"HTTP status codes", row
#   `200 OK`.
# - `ETag` — docs/query/Request.md §"Common Headers and Query Parameters":
#   "Related response headers: `ETag` - A unique identifier of the resultSet";
#   its FORM by docs/overview/Requests_and_responses.md §"Deprecated headers":
#   "all `ETag` headers that hold a resource identifier MUST include a weakness
#   indicator `W/`".
#
# `url_fetch` is the case variable that lands the PROTOCOL `fetch` in the query
# string; the body `fetch` is the body-borne form of the same parameter. Naming
# them apart is what lets one case place the protocol parameter in the URL while
# the AQL's own `$fetch` bind travels in `query_parameters` (register AMB-100).
sm_operation: I_QUERY_SERVICE.execute_stored_query
its: its-rest
variant: post_body
request:
  method: POST
  path: /query/{qualified_query_name}
  query:
    ehr_id: "${ehr_id?}"                     # Request.md §About the ehr_id parameter (URL form, available on POST)
    fetch: "${url_fetch?}"                   # Request.md §Common Headers and Query Parameters (the PROTOCOL parameter)
  body:
    offset: "${offset?}"                     # Request.md §Common Headers and Query Parameters (default 0)
    fetch: "${fetch?}"                       # Request.md §Common Headers and Query Parameters (implementation default)
    query_parameters: "${query_parameters?}" # Request.md §Query parameters
  headers:
    Content-Type: application/json
    Accept: application/json
formats: [canonical-json]
outcomes:
  ok:
    status: 200                              # Requests_and_responses.md §HTTP status codes, row 200
    headers: { ETag: 'pattern:W/"[^"]+"' }   # Request.md §Common Headers and Query Parameters + overview §Deprecated headers
    body: result_set_body
