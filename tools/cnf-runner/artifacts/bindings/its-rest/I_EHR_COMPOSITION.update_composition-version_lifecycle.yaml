# Wire realization of I_EHR_COMPOSITION.update_composition, variant
# `version_lifecycle`: the update carries a client-supplied
# VERSION.lifecycle_state through the `openehr-version` committal request
# header — the PUT sibling of the create binding of the same name.
#
# Why, from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"): the rule is method-agnostic — "for all
# change-controlled resources … services MUST also allow `PUT`, `POST` and
# `DELETE` methods directly on these change-controlled resources" and
# "services MUST accept `openehr-version` and `openehr-audit-details` custom
# request headers" — and the section's own worked example is a `PUT` action on
# a COMPOSITION whose first header line is
# `openehr-version: lifecycle_state.code_string="532"`.
#
# Identical to the variant-less update binding except for the added committal
# header, so a red row localizes to the lifecycle_state merge alone. The case
# supplies `${lifecycle_state}`.
#
# NOTE: header matchers are EXECUTED assertions — a violated declaration is a
# red row.
sm_operation: I_EHR_COMPOSITION.update_composition
its: its-rest
variant: version_lifecycle
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{versioned_object_uid}
  body: composition
  headers:
    If-Match: '"${preceding_version_uid}"'   # REQUIRED (If-Match.yaml); ITS-REST overview §If-Match
    Prefer: "return=representation"
    openehr-version: 'lifecycle_state.code_string="${lifecycle_state}"'
formats: [canonical-json]
outcomes:
  updated:
    status: 200                           # 200_COMPOSITION_updated.yaml
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } }
      Last-Modified: present
    body: prefer_conditional
  validation_failed: { status: 422, body: error_loose }   # overview §HTTP status codes — well-formed but unfollowable
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid, context/_uid]
