# Wire realization of the "Get example data by template" endpoint requesting
# the LEGACY `application/openehr.tds2+xml` representation via Accept — the
# response-side (Accept) mirror of the request-side (Content-Type) legacy
# media handling. ITS-REST overview Resources.md §Alternative data formats
# enumerates it among the "Legacy or experimental formats"
# ("`application/openehr.tds2+xml` for TDS simplification of RM as XML"), and
# §Data representation makes support optional ("other alternative formats MAY
# be supported as well"). A server that does not support it cannot fulfil the
# Accept and MUST respond 406 — Resources.md §XML Format: "If the service
# cannot fulfill this aspect of the request, it MUST respond with HTTP status
# code `406 Not Acceptable`" (§Simplified Formats states the same rule for the
# simplified types).
#
# A fourth `variant` realization of I_DEFINITION_ADL14.get_opt (plain OPT GET;
# `example`; `example_deprecated_accept`; and this
# `example_legacy_tds2_accept`), selected by the flow step. The legacy Accept
# is pinned in request.headers (no format axis), so a format-less step
# preserves it. Whether the legacy support exists is statement-declared
# (register AMB-61, option_select).
#
# Sources (ITS-REST DOCS TEXT — tier 1, which wins every conflict; the
# RELEASED OAS fills only what the docs text is silent on and is cited AS
# the OAS where it does — owner ruling 2026-07-28):
#   specifications/docs/overview/Resources.md §Alternative data formats,
#   §Data representation, §XML Format, §Simplified Formats.
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example_legacy_tds2_accept
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example
  query:
    type: input                          # parameters/query (example input vs output data instance)
    detail_level: required               # parameters/query (required | medium | complete)
  headers:
    Accept: application/openehr.tds2+xml # LEGACY TDS2 media type (Resources.md §Alternative data formats)
outcomes:
  not_acceptable: { status: 406 }        # unsupported branch: Accept cannot be fulfilled (Resources.md §XML Format 406 MUST)
