# Wire realization of I_EHR_COMPOSITION.create_composition for ITS-REST 1.1.0.
# Sources: specifications/operations/composition_create.yaml,
# responses/201_COMPOSITION.yaml, 404_unknown_ehr_id.yaml, 422.yaml;
# format headers per Accept_LOCATABLE / ContentType_LOCATABLE.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
format_headers:
  wt-flat:
    Content-Type: application/openehr.wt.flat+json
    openehr-template-id: required
  wt-structured:
    Content-Type: application/openehr.wt.structured+json
    openehr-template-id: required
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# The request above sends `Prefer: return=representation`, so §Representation
# details negotiation applies: "The service MAY include a `Preference-Applied`
# header in the response, such as `Preference-Applied: return=minimal` or
# `Preference-Applied: return=representation`, to indicate that the client's
# preference has been honored." Presence is a MAY, so the declaration is the
# optional matcher — the docs text fixes only the VALUE (the honoured
# preference token) when the header is sent, never that it must be.
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
outcomes:
  created:
    status: 201                           # 201_COMPOSITION.yaml
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::1"'
      Last-Modified: present
      Location: present
      Content-Type: negotiated
      Preference-Applied: "present?"
    body: prefer_conditional
  not_found: { status: 404 }              # unknown ehr_id (404_unknown_ehr_id.yaml)
  validation_failed:
    status: 422                           # 422.yaml
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  template_not_found:
    status: 422                           # same wire code; kind distinguished by fixture
    body: error_loose
  missing_template_id: { status: 422 }    # simplified commit without openehr-template-id
  conflict: { status: 409 }               # persistent-COMPOSITION uniqueness rejection — ITS-REST overview §HTTP status codes: 409 = conflict
  unsupported_media: { status: 415 }      # overview negotiation rules
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid, context/_uid, "composer/external_ref", territory/terminology_id]
