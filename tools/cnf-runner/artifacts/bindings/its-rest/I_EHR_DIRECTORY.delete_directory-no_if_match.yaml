# Wire realization of I_EHR_DIRECTORY.delete_directory, variant `no_if_match`:
# the directory DELETE sent WITHOUT the `If-Match` precondition header the
# variant-less realization always supplies. Identical to that binding in every
# other respect, so a red row localizes to the missing-precondition branch
# alone.
#
# The omission is the point of the variant: the request model has no
# "deliberately omit a declared header" form, so a binding FILE that simply
# does not declare `If-Match` is how the case expresses it.
#
# Decisive docs-text sentence (ITS-REST overview Requests_and_responses.md
# §"If-Match and accidental overwrites"): "When the service expects `If-Match`
# for an operation, but the client does not provide it, the service SHOULD
# respond with `400 Bad Request`." The directory DELETE is such an operation:
# the same section scopes the header to "a small set of versioned resources in
# this specification, when the `preceding_version_uid` is not part of the
# endpoint path segment" — DELETE /ehr/{ehr_id}/directory carries no version
# segment at all, and the operation's own description says it outright: "The
# existing latest `version_uid` of directory FOLDER resource (i.e. the
# `preceding_version_uid`) must be specified in the `If-Match` header"
# (specifications/operations/directory_delete.yaml).
#
# THE CONTRAST THIS VARIANT EXISTS TO KEEP HONEST: the COMPOSITION delete
# addresses its version IN THE PATH, so the scope sentence excludes it and its
# stale-version branch is a 409; the directory delete has no version segment,
# so its precondition lives in `If-Match` and its branches are 412 (stale) and
# 400 (absent) — never 409.
sm_operation: I_EHR_DIRECTORY.delete_directory
its: its-rest
variant: no_if_match
request:
  method: DELETE
  path: /ehr/{ehr_id}/directory
outcomes:
  precondition_missing:
    status: 400                           # overview §If-Match and accidental overwrites — "the service SHOULD respond with `400 Bad Request`"
    body: error_loose
