# Wire realization of I_DEMOGRAPHIC_SERVICE.create_party, variant
# `version_lifecycle`: the party commit carries a client-supplied
# VERSION.lifecycle_state through the `openehr-version` committal request
# header — the demographic twin of
# I_EHR_COMPOSITION.create_composition-version_lifecycle.
#
# Why, from the ITS-REST docs text
# (specifications/docs/overview/Requests_and_responses.md §"openehr-version
# and openehr-audit-details"):
#   "In order to allow clients to provide committal metadata, services MUST
#   accept `openehr-version` and `openehr-audit-details` custom request
#   headers." — the worked example's first line is literally
#   `openehr-version: lifecycle_state.code_string="532"` — and
#   "None of these headers are mandatory, but whatever is provided it MUST be
#   merged with the default VERSION and VERSION.audit_details attributes on
#   commit runtime."
# The rule is stated over change-controlled resources generally, and the same
# section extends the direct methods to them: "services MUST also allow `PUT`,
# `POST` and `DELETE` methods directly on these change-controlled resources".
# A demographic PARTY is one — RM demographic
# master02-demographic_package.adoc §Versioning Semantics: "Every Party is
# stored in its own Version container" — and, unlike a COMPOSITION commit,
# its `UPDATE_VERSION` envelope never travels in the body, so this header is
# the ONLY channel the merge can arrive through on the direct route.
#
# The value set is the same terminology the section pins: "The list of
# `code_string` values and their meaning is specified by the Audit Change Type
# and Version Lifecycle State openEHR terminology vocabularies" (TERM
# SupportTerminology §Version Lifecycle State: 532|complete|, 553|incomplete|,
# 523|deleted|, 800|inactive|, 801|abandoned|).
#
# Identical to the variant-less I_DEMOGRAPHIC_SERVICE.create_party binding
# except for the added committal header, so a red row localizes to the
# lifecycle_state merge alone. The case supplies `${lifecycle_state}`.
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
its: its-rest
variant: version_lifecycle
request:
  method: POST
  path: /demographic/person
  body: party
  headers:
    Prefer: "return=representation"
    openehr-version: 'lifecycle_state.code_string="${lifecycle_state}"'
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # 201_PERSON.yaml
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::1"', applies: { its_rest: ">=1.1.0" } }
      Location: present
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid]
