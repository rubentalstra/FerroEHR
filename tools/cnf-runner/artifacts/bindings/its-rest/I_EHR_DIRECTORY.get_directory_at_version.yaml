# Wire realization of I_EHR_DIRECTORY.get_directory_at_version for ITS-REST 1.1.0.
# The SM get_directory_at_version(ehr_id, a_version_uid) returns a particular
# version of the directory FOLDER; realized as
# GET /ehr/{ehr_id}/directory/{version_uid}.
# Sources: specifications/operations/directory_get_by_version_id.yaml (200/404),
# parameters/path/version_uid.yaml, responses/200_FOLDER_retrieved.yaml,
# 404_directory_unknown_ehr_id_or_no_version_uid_or_no_path.yaml.
sm_operation: I_EHR_DIRECTORY.get_directory_at_version
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/directory/{version_uid}
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_FOLDER_retrieved.yaml
    headers:
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
  ok_empty:
    # The addressed version is a logically deleted one. The by-version route
    # declares no deleted branch at all (the operation lists 200/404 only) —
    # register AMB-74 carries the adjudicated fixed handling, which the
    # sibling at-time route states outright for the same resource
    # (directory_get_at_time's 204) and the overview §HTTP status codes gives
    # its meaning: "204 | No Content | The request has been fulfilled and
    # there is no additional content to send in the response payload body".
    # There is nothing to send because RM common master06 §Logical Deletion
    # deletes the version's `_data_`; the version itself is present, so 404
    # would deny a resource the service holds.
    status: 204
  version_not_found: { status: 404 }      # unknown version_uid (404_directory_unknown_ehr_id_or_no_version_uid_or_no_path.yaml)
  not_found: { status: 404 }              # unknown ehr_id — same 404 family
  bad_request:
    # A `version_uid` path segment that parses as no OBJECT_VERSION_ID form at
    # all is a syntactically invalid parameter, the overview §HTTP status codes
    # 400 row: "The service cannot or will not process the request due to
    # something that is perceived to be a client error (e.g., malformed
    # request syntax, syntactically invalid content)". WHICH branch a
    # malformed identifier takes is assigned by no released sentence —
    # register AMB-76 carries the adjudicated repo-wide fixed handling
    # (malformed identifier segments are 400; unknown-but-well-formed
    # identifiers stay 404).
    # KIND: `bad_request`, the taxonomy's malformed-request kind, not
    # `validation_failed` — nothing about the addressed CONTENT is judged
    # here, only the request's own syntax (vocab/outcomes.yaml: bad_request is
    # "distinct from validation_failed, the well-formed-but-semantically-
    # invalid branch"). One law, one kind: this is AMB-76's law.
    status: 400
    body: error_loose
# The server-assigned uid, at EVERY FOLDER node: RM common locatable.adoc types
# `uid` `0..1` ("Optional globally unique object identifier for root points of
# archetyped structures") and RM common folder.adoc's NOTE recommends populating
# it only "in _top-level_ (i.e. tree-root) `FOLDER` objects" — a uid at a nested
# archetype-root FOLDER is permitted and unrequired, so it is a server
# assignment, never a content difference. `**` matches every depth of the
# recursive `folders: List<FOLDER>` shape.
server_assigned: ["**/uid"]
