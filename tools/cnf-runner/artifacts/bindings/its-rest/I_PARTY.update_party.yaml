# Wire realization of I_PARTY.update_party for ITS-REST 1.1.0.
# The SM I_PARTY.update_party(a_versioned_party_id, a_version) creates a new
# PARTY version; realized as PUT /demographic/person/{uid_based_id} with the
# HIER_OBJECT_ID form. The existing latest version_uid (the preceding_version_uid)
# is REQUIRED in the If-Match header (person_update.yaml) — the same
# preceding_version_uid realization as update_composition (ITS-REST overview §If-Match). PERSON is the
# representative concrete PARTY subtype.
# master10 anchors the cases under I_DEMOGRAPHIC_SERVICE; the resolvable SM
# operation is I_PARTY.update_party.
# Sources: specifications/operations/person_update.yaml (200/204/400/404/412/422),
# responses/200_PERSON_updated.yaml, 204_version_updated.yaml, 412_PERSON.yaml,
# 422.yaml; parameters/header/If-Match.yaml.
sm_operation: I_PARTY.update_party
its: its-rest
request:
  method: PUT
  path: /demographic/person/{versioned_object_uid}
  body: party
  headers:
    If-Match: '"${preceding_version_uid}"'   # REQUIRED (If-Match.yaml); realizes SM preceding_version_uid (ITS-REST overview §If-Match)
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml]
outcomes:
  updated:
    status: 200                           # 204 when Prefer minimal (204_version_updated.yaml)
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"'
    body: prefer_conditional
  precondition_failed:
    status: 412                           # 412_PERSON.yaml — If-Match does not match latest
    # overview §"If-Match and accidental overwrites": on a false condition the
    # service "SHOULD return also latest version_uid in the ETag response
    # headers"; §Location keeps Location off a non-creation response.
    headers:
      ETag: latest-version-uid
      Location: absent
  precondition_missing: { status: 400 }   # If-Match absent -> SHOULD 400 (Requests_and_responses)
  not_found: { status: 404 }              # unknown party (versioned_object_does_not_exist)
  # DECISION (#557, 2026-07-28): version_not_found and precondition_failed
  # STAY distinct kinds on this binding although both realize as the identical
  # 412 + latest-version ETag (§"If-Match and accidental overwrites" folds
  # them: a false-evaluating If-Match MUST 412 whether the named version is
  # unknown or stale). The kinds carry the SM-level cause; the fold is this
  # realization's fact; exec::outcome's tie-break (the expected member's
  # status match satisfies the expectation) is the documented norm.
  version_not_found:
    # An If-Match naming a version the ADDRESSED container never issued is a
    # condition that evaluates false, so the released If-Match rule decides it,
    # not the 404 family — ITS-REST overview Requests_and_responses.md §"If-Match
    # and accidental overwrites": "If a service receives this header, and the
    # condition evaluates to `false`, it MUST NOT perform the requested method.
    # Instead, it MUST respond with HTTP status code `412 Precondition Failed`,
    # and SHOULD return also latest `version_uid` in the `ETag` response
    # headers." 404 stays for an unresolvable PATH id, where there is no
    # resource to hold a current version at all (I_PARTY.update_party's
    # not_found, above).
    # CORRECTED 2026-07-28: this branch read 404. RE-GROUNDED the same day
    # under the OAS-fallback oracle order, and the correction stands on a
    # firmer footing than the one first written for it. It is not that the OAS
    # cannot ground anything (it can, where the docs text is silent) — it is
    # that the docs text is NOT silent here and the two DISAGREE, which the
    # docs text wins outright (owner ruling 2026-07-24, preserved by the
    # 2026-07-28 order). The released OAS in fact declares BOTH branches on
    # this operation (specifications/operations/person_update.yaml: '404' ->
    # responses/404.yaml, '412' -> responses/412_PERSON.yaml), and the
    # docs-text MUST above is what assigns an If-Match miss to the 412 of the
    # two. The
    # sibling PUT with the identical If-Match realization,
    # I_EHR_COMPOSITION.update_composition, already carries exactly this
    # adjudication ("unknown preceding version = the If-Match condition
    # evaluates FALSE => MUST 412 … the 404 family is for unknown PATH ids
    # only"). §Location keeps Location off a non-creation response.
    status: 412
    headers:
      ETag: latest-version-uid
      Location: absent
  validation_failed: { status: 422, body: error_loose }   # content_invalid / definition_unknown
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid]
