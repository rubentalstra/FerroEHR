# Wire realization of I_DEFINITION_QUERY.store_query for ITS-REST 1.1.0 — the
# VERSION-LESS store (the overwriting form; the version-addressed immutable
# form is the `version` variant binding).
# Sources: specifications/operations/definition_query_store.yaml,
# responses/200_StoredQuery_stored.yaml, headers/Location_Query.yaml, 400.yaml,
# parameters/query/query_type.yaml.
# Stored-query PUT success is the `stored` outcome kind (wire 200, not 201).
#
# `query_type` — parameters/query/query_type.yaml ("Parameter indicating the
# query language/type", a string with `default: "AQL"`): declared optional, so
# a step that binds it drives the formalism branch and one that does not takes
# the released default.
#
# `Location` on the `stored` outcome — the DOCS TEXT assigns both its presence
# and its value. docs/overview/Requests_and_responses.md §"Representation
# details negotiation": "If no `Prefer` header is provided, the default
# behavior is assumed to be `return=minimal`" — this operation declares no
# `Prefer` parameter, so every request to it IS that exchange — and §"Prefer
# minimal, identifier or full representation response", `return=minimal`: "The
# response SHOULD include a `Location` header pointing to the newly created or
# updated resource." The value is therefore the resource THIS request wrote.
# The pattern pins that version: a version-less store writes the constant
# `1.0.0` default slot (register AMB-117 — the minted version is spec-silent
# and adjudicated there), so the URL it names ends `/1.0.0`, including when
# higher versions of the same name are already stored. That the header rides a
# 200 rather than a 201 is register AMB-119 (§Location's MUST ONLY covers
# creation and redirects, and the same §Prefer text pairs a `Location` with
# "201 Created or 200 OK" on the identifier/representation branches).
# NOTE: header matchers are EXECUTED assertions (exec/headers.rs) — a violated
# declaration is a red row.
sm_operation: I_DEFINITION_QUERY.store_query
its: its-rest
request:
  method: PUT
  path: /definition/query/{qualified_query_name}     # definition_query_store.yaml
  query:
    query_type: "${query_type?}"                     # parameters/query/query_type.yaml
  body: aql_text
  headers:
    Content-Type: text/plain                          # ContentType_text.yaml (AQL body)
    Accept: application/json                           # Accept_JSON.yaml
outcomes:
  stored:
    status: 200                                       # 200_StoredQuery_stored.yaml
    headers:
      Location: 'pattern:.*/1\.0\.0'                  # the WRITTEN version — Location_Query.yaml + AMB-117
  # `bad_request`, not `validation_failed`: the 2026-07-28 schedule release
  # (#544) added the malformed-REQUEST kind whose meaning quotes the very row
  # cited below, while `validation_failed` means 422 (well-formed content,
  # semantically invalid) and was only borrowed while the taxonomy had no
  # malformed-request kind. The wire status is unchanged (400 either way).
  bad_request:
    status: 400
    body: error_loose                                 # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
