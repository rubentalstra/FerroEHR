# ITS-REST 1.1.0 surfaces no wire for I_DEFINITION_QUERY.store_query_set — an
# explicit unrealized declaration so the SM-anchored case is not-applicable
# WITH CITATION on this ITS (never silently absent), and activates when both
# sides exist: the SM operation itself is unfinished upstream.
sm_operation: I_DEFINITION_QUERY.store_query_set
its: its-rest
unrealized:
  reason: >-
    Doubly unrealized. The released definition API has no query-set resource of
    any kind (the only stored-query paths are
    `/definition/query/{qualified_query_name}` and `…/{version}`), and the SM
    operation is itself unfinished: its whole released Meaning is "Register a
    query set. TODO: determine details." — it names no members, no identity and
    no result beyond a UUID, so even a hypothetical binding would have nothing
    to bind. The case anchored here is therefore not-applicable with citation
    on BOTH counts.
  source: >-
    SM docs/UML/classes/i_definition_query.adoc §store_query_set ("Register a query set. TODO:
    determine details."); ITS-REST specifications/definition.openapi.yaml (no query-set path)
  ambiguity: AMB-127
