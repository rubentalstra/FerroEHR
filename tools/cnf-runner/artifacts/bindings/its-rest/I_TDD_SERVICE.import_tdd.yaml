# EXTENSION realization of I_TDD_SERVICE.import_tdd.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the release publishes SEVEN API groups (overview, system, ehr,
# demographic, query, definition, admin) and no message / EHR-Extract / TDD
# group in either the docs text (specifications/docs/**) or the OAS
# (specifications/*.openapi.yaml); there are no message_*/extract_*/tdd_*
# operations anywhere in specifications/operations. Register AMB-34.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `POST /message/tdd/{ehr_id}`, declared in the `message-tdd` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the Tds CAPABILITY verdict(s)
# only and never ITS-REST wire conformance; the capability-matrix rows carry
# `realization: extension`, which may never be `required` (owner ruling
# 2026-07-28).
sm_operation: I_TDD_SERVICE.import_tdd
its: its-rest
extension:
  family: message-tdd
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract/TDD API at all, so the SM
    import_tdd has no released wire; this product serves the operation on its
    own /message/tdd/{ehr_id} route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc +
    docs/UML/classes/i_tdd_service.adoc (import_tdd) vs released ITS-REST
    specifications/*.openapi.yaml (seven groups, none of them
    message/extract/tdd) + specifications/docs/** (no such API) — no openEHR
    spec governs the extension route, our own design/extension
  ambiguity: AMB-34
request:
  method: POST
  path: /message/tdd/{an_ehr_id}
  # A TDD is an opaque `String` to the SM — concretely a template-namespaced
  # XML instance conforming to the template-derived TDS ("a kind of XSD", AM
  # OPT2 master02-overview.adoc §Purpose of the OPT) — so the document itself
  # is the payload, declared as XML.
  body: tdd_text
  headers:
    Content-Type: application/xml
outcomes:
  # The converted COMPOSITION is committed through the ordinary validated
  # commit path, so the call creates a resource. Nothing released governs this
  # route; the status choice is ours (RFC 9110 §15.3.2). The body names the
  # created OBJECT_VERSION_ID.
  created:
    status: 201
  # SM `precondition_violation` — the root is not in the templates namespace,
  # carries no `template_id`, or the body does not conform to the operational
  # template.
  bad_request:
    status: 400
  # SM `ehr_id_does_not_exist` / `template_does_not_exist`.
  not_found:
    status: 404
  template_not_found:
    status: 404
  # The payload is not well-formed XML, or the produced COMPOSITION fails
  # WebTemplate / RM-invariant / terminology validation at commit
  # (`content_invalid`).
  validation_failed:
    status: 422
captures:
  version_uid:
    from: body "uid"
