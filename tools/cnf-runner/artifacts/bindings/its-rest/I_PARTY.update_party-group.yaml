# Wire realization of I_PARTY.update_party for the GROUP route —
# PUT /demographic/group/{uid_based_id} — as the `group` variant of the PERSON
# binding. The released OAS declares all five concrete-subtype update routes
# (`specifications/operations/group_update.yaml`, alongside person_update.yaml),
# so each is its own wire surface: a server could run the strict reader on one
# route and not another.
#
# SCOPE, honestly: this variant declares ONLY the branches its cases drive —
# the parse-class refusal and the successful update. The route's remaining
# released branches (412 on a false If-Match, 404 on an unresolvable path id,
# 422 on a converting-but-invalid body) are realized and adjudicated on the
# PERSON binding, which carries the full derivation; declaring them here with
# no case to exercise them would be a claim, not coverage. Extending this
# variant is the path when those branches get their own GROUP cases.
#
# Sources: specifications/operations/group_update.yaml (200/204/400/404/412/422),
# responses/204_version_updated.yaml, 400.yaml;
# parameters/header/If-Match.yaml.
sm_operation: I_PARTY.update_party
its: its-rest
variant: group
request:
  method: PUT
  path: /demographic/group/{versioned_object_uid}
  body: party
  headers:
    If-Match: '"${preceding_version_uid}"'   # REQUIRED (If-Match.yaml); realizes SM preceding_version_uid (ITS-REST overview §If-Match)
    Prefer: "return=representation"
formats: [canonical-json]
outcomes:
  bad_request:
    status: 400                             # overview §HTTP status codes, the 400 row — the parse class: a mandatory list sent empty never converts
    body: error_loose
  updated:
    status: 200                           # 204 when Prefer minimal (204_version_updated.yaml)
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::<n>"', applies: { its_rest: ">=1.1.0" } }
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid]
