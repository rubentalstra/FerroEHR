# Wire realization of I_ITS_REST_ITEM_TAGS.composition_tags_update, variant
# prefer_identifier: the tag PUT sent with `Prefer: return=identifier`, the
# one legal `Prefer` token the released identifier contract cannot honour on
# this resource.
#
# WHY THE TOKEN IS LEGAL AND THE CONTRACT UNSATISFIABLE. `Prefer` on this
# operation is parameters/header/Prefer.yaml, whose enum carries
# `return=identifier` alongside `return=minimal` and `return=representation`.
# The DOCS TEXT then fixes what that token obliges — Requests_and_responses.md
# §"Prefer only identifier": "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`). The
# response body SHOULD contain only the identifier of the affected resource
# ... a single JSON object with a single `uid` attribute". An ITEM_TAG has NO
# uid — RM UML/classes/org.openehr.rm.common.item_tag.adoc declares key,
# value, target, target_path and owner_id and no identifier attribute, the
# identity being the (key, target_path) pair — and the affected resource is a
# COLLECTION, not one resource, so there is no identifier the body could
# carry. No released sentence assigns the branch; register AMB-92 fixes the
# handling.
#
# THE DECLARED OUTCOME IS THE APPLIED DEFAULT. §"Representation details
# negotiation": "If no `Prefer` header is provided, the default behavior is
# assumed to be `return=minimal`", and §"Prefer minimal, identifier or full
# representation response" for that preference: "If no response body is
# returned, the service SHOULD use `204 No Content`". So an unhonourable
# identifier preference resolves to the applied minimal branch —
# responses/204_updated.yaml, "returned when the update operation was
# successful and the `Prefer` header is missing or is set to `return=minimal`".
# The 204 is itself the evidence: the identifier contract forbids it outright
# ("never `204 No Content`"), so a server that had applied the identifier
# preference could not answer this way.
#
# `Preference-Applied` stays the optional matcher: the docs text makes its
# PRESENCE a MAY ("The service MAY include a `Preference-Applied` header ...
# to indicate that the client's preference has been honored"), and the VALUE
# it must carry when the preference was NOT honoured is exactly what no
# released sentence states — AMB-92's fixed handling declares the applied
# default, so the form is pinned and the presence is not.
#
# NO `ETag` / `Last-Modified` / `Location`: unchanged from the variant-less
# binding — an ITEM_TAG collection is not a versioned or uniquely-identified
# resource (§"ETag and Last-Modified") and the write mints no resource
# (§Location).
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved CATALOGUE pseudo-interface, NOT
# an SM interface — the vendored SM models no tag concept at all — pinned in
# NON_SM_REST_OPERATIONS (tools/cnf-runner/src/validate.rs) and adjudicated in
# register AMB-161.
sm_operation: I_ITS_REST_ITEM_TAGS.composition_tags_update
its: its-rest
variant: prefer_identifier
request:
  method: PUT
  path: /ehr/{ehr_id}/composition/{uid_based_id}/tags
  body: tags                              # requestBody: required, application/json array of schemas/common/UpdateItemTag.yaml
  headers:
    Prefer: "return=identifier"           # parameters/header/Prefer.yaml enum — the unhonourable token under test
formats: [canonical-json]                 # parameters/header/{Accept,ContentType}_canonical.yaml
outcomes:
  updated:
    status: 204                           # responses/204_updated.yaml — the APPLIED default (AMB-92)
    body: absent                          # 204 No Content: "there is no additional content to send in the response payload body"
    headers:
      Preference-Applied: { match: "return=minimal", optional: true }  # presence is a MAY (§Representation details negotiation); the VALUE is AMB-92's fixed handling
