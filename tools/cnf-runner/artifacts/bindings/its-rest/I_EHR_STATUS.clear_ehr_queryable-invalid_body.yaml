# Wire realization of I_EHR_STATUS.clear_ehr_queryable, variant `invalid_body`:
# the whole-EHR_STATUS PUT with a CASE-SUPPLIED payload instead of the
# read-modify-write body the variant-less realization builds. The variant
# exists so the invalid-EHR_STATUS data-set class can be driven through the
# update seam the SM setters are realized on; the case names the payload as
# the `ehr_status` role.
#
# This is BYTE-FOR-BYTE the same wire exchange as
# I_EHR_STATUS.set_ehr_queryable-invalid_body — one PUT /ehr/{ehr_id}/ehr_status
# carrying the same invalid payload class — so it carries the same adjudication,
# not a new one; only the SM operation the case anchors on differs.
#
# Outcome split (ITS-REST overview Requests_and_responses.md §HTTP status
# codes; owner ruling 2026-08-03 — the parse class): a payload that CANNOT be
# converted to the resource — a mandatory attribute absent (RM ehr
# ehr_status.adoc §Attributes) or a missing `_type` on an abstract slot — is
# the 400 row ("could not be parsed or is invalid"; typed construction is the
# shape check). A payload that CONVERTS and then breaks an RM invariant (an
# archetype root without `archetype_details`, RM common locatable.adoc
# `Archetyped_valid`) is the 422 row ("well-formed but … semantic errors").
sm_operation: I_EHR_STATUS.clear_ehr_queryable
its: its-rest
variant: invalid_body
request:
  method: PUT
  path: /ehr/{ehr_id}/ehr_status
  body: ehr_status                          # the case supplies the payload (the invalid data-set class)
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
    Prefer: "return=representation"         # §HTTP status codes — "For `4xx` and `5xx` status codes, services MAY return additional error details if the `Prefer: return=representation` header is present"
formats: [canonical-json]
outcomes:
  bad_request:
    status: 400                             # overview §HTTP status codes, the 400 row — "could not be parsed or is invalid": the parse class (typed construction refuses missing mandatories, empty 1..* lists, foreign _type; owner ruling 2026-08-03)
    body: error_loose
  validation_failed:
    status: 422                             # overview §HTTP status codes — "422 | Unprocessable Entity | The request was well-formed but was unable to be followed due to semantic errors"
    body: error_loose
