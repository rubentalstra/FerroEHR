# Wire realization of the DEMOGRAPHIC CONTRIBUTION read —
# GET /demographic/contribution/{contribution_uid} — as the `demographic`
# variant of I_EHR_CONTRIBUTION.get_contribution.
#
# ANCHORING NOTE: as with its commit sibling, this released route realizes no
# SM operation (SM has no demographic contribution interface); the anchor is
# the AMB-127 catalogue naming convention, not an SM claim. Register AMB-136.
#
# The route differs from the EHR read in ONE structural way: it has no `ehr_id`
# path scope, so its only miss is an unknown `contribution_uid` — a
# CONTRIBUTION is addressed globally on the demographic side.
#
# HEADER + STATUS GROUNDS (ITS-REST DOCS TEXT, overview
# Requests_and_responses.md):
#   §Location — "It MUST NOT be used to indicate an alternate representation of
#   an existing resource (e.g. via `GET` method)"; §Deprecated headers
#   deprecates it on GET responses. So `Location` MUST BE ABSENT.
#   §HTTP status codes, the 404 row verbatim — "The origin service did not find
#   the target resource or is not willing to disclose that one exists".
#   §HTTP status codes, the 400 row verbatim — "malformed request syntax,
#   syntactically invalid content"; register AMB-76 carries the repo-wide fixed
#   handling for a malformed identifier segment (400, where a well-formed but
#   unknown one stays 404) and its scope names `contribution_uid`.
# ETag + Last-Modified on this read are SPEC-SILENT in the same way as on the
# EHR sibling and are adjudicated identically by register AMB-87 — the
# CONTRIBUTION is immutable and uniquely identified, so the entity tag is that
# identifier and Last-Modified its one committal instant. The ETag payload is
# asserted against the `contribution_uid` capture — taken from the COMMIT's
# body `uid.value`, a different response on a different channel, so this is a
# real cross-response identity assertion. `contribution_uid` is NOT a
# structural grammar token, so it must resolve to a case variable; a
# placeholder that resolves to neither FAILS LOUD (#1865) and never degrades
# to a `.*` wildcard. See bindings/README.md.
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs).
sm_operation: I_EHR_CONTRIBUTION.get_contribution
its: its-rest
variant: demographic
request:
  method: GET
  path: /demographic/contribution/{contribution_uid}
formats: [canonical-json]
outcomes:
  ok:
    status: 200
    headers:
      ETag: { match: 'pattern:W/"<contribution_uid>"', applies: { its_rest: ">=1.1.0" } }  # register AMB-87 + §Deprecated headers (the `W/` MUST)
      Last-Modified: present                   # register AMB-87 — the committal instant
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
    body: present
  not_found:
    status: 404
    body: error_loose
