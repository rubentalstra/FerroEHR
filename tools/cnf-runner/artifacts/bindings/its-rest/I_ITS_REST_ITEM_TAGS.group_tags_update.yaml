# Wire realization of the RELEASED ITEM_TAG operation `group_tags_update` for
# ITS-REST 1.1.0 — "Updates the list of all ITEM_TAG resources associated with
# a given target GROUP version or VERSIONED_PARTY identified by
# `uid_based_id`" (specifications/operations/group_tags_update.yaml). The PUT is a
# FULL REPLACE of the addressed collection: "Providing an empty list will
# effectively remove all ITEM_TAG associated with the given target" (same
# file), the operation-level twin of the wrapper-header rule "Providing an
# empty value for this header will effectively remove all ITEM_TAGs associated
# with the given target" (docs/overview/Requests_and_responses.md §Usage in
# Requests).
#
# ANCHOR: `I_ITS_REST_ITEM_TAGS` is a reserved CATALOGUE pseudo-interface, NOT
# an SM interface — the vendored SM models no tag concept at all (the whole
# docs/specs/openehr/SM/docs/ tree contains zero occurrences of "tag",
# grep-verified), while the release defines twenty-three tag operations and
# calls the wrapper headers "convenient wrappers around the dedicated ITEM_TAG
# operations" (specifications/docs/overview/Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag). Case cores speak SM
# operations only, so the pinned NON_SM_REST_OPERATIONS table
# (tools/cnf-runner/src/validate.rs) is what makes these enumerable at all; the
# naming convention is adjudicated in register AMB-161. The operation name is
# the RELEASED operationId verbatim.
#
# ADDRESSING: `{uid_based_id}` is the released path parameter and carries BOTH
# forms — "an OBJECT_VERSION_ID identifier taken from VERSION.uid.value (i.e. a
# `version_uid`), or a form of a HIER_OBJECT_ID identifier taken from
# VERSIONED_PARTY.uid.value (i.e. a `versioned_object_uid`). The former is used
# to update the tags of a particular (target) version …, whereas the latter …
# the target VERSIONED_PARTY container" (operations/group_tags_update.yaml). ONE binding serves
# both: a case's `with:` binds `uid_based_id` to a container uid or to a version
# uid, which is exactly the released parameter's dual form — the two forms
# address DISJOINT collections (RM common master07-tags.adoc ITEM_TAG.target:
# "Identifier of target, which may be a `VERSIONED_OBJECT<T>` or a
# `VERSION<T>`").
#
# NO `ETag` / `Last-Modified`: the overview scopes those to "responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers" (§"ETag and Last-Modified"). An ITEM_TAG collection is
# none of those — an ITEM_TAG carries no uid at all, its identity being the
# (key, target_path) pair (§openehr-item-tag and openehr-version-item-tag:
# "they are uniquely identified by their `key` and `target_path` pair
# attributes"; register AMB-92) — and no released tag response declares either
# header. Neither is declared here: declaring one would invent an obligation
# the release does not state.
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
#
# `Location` is NOT declared on the update: the docs text contradicts itself
# for this exchange — §Location makes it a MUST-ONLY for creation/redirect
# responses, while §"Prefer minimal, identifier or full representation
# response" says a `return=representation` response "MAY include a `Location`
# header". A MAY on one side and a MUST-ONLY on the other assign nothing
# testable, so neither presence nor absence is asserted.
#
# OUTCOMES — the released response set of this operation:
#  - `updated` 200: responses/200_GROUP_ItemTagList_updated.yaml (content
#    application/json = the stored ITEM_TAG array). WHICH of the operation's
#    two success codes applies is fixed by the request this binding sends:
#    responses/204_updated.yaml is "returned when the update operation was
#    successful and the `Prefer` header is missing or is set to
#    `return=minimal`", and this request sends `Prefer: return=representation`,
#    for which §"Prefer minimal, identifier or full representation response"
#    says "the response body SHOULD contain the full representation of the
#    resource. The HTTP status is typically … `200 OK`". The 204 branch is the
#    cross-cutting minimal-preference behaviour, carried by the
#    `header-prefer-return-minimal` wire-surface element, not re-litigated per
#    tag operation.
#  - `validation_failed` 400: responses/400.yaml, "returned when the request
#    could not be parsed or is invalid (e.g. malformed request URL syntax,
#    missing required header or parameter, or syntactically invalid header,
#    parameter or content)" — content schemas/others/Error.yaml, whose required
#    members are `message` + `validationErrors`. Register AMB-93 splits the
#    body-defect families: syntactic failures (non-array body, non-string key,
#    unparseable JSON) are this 400; an RM-invariant violation answers 422.
#  - `not_found` 404: responses/404_unknown_uid_based_id.yaml —
#    "`404 Not Found` is returned when the `uid_based_id` does not exist".
#  - `not_found` ALSO covers a well-formed `uid_based_id` that resolves to a
#    version container of ANOTHER kind (within this space or across the EHR /
#    demographic boundary). The released 404 text says only "when the
#    `uid_based_id` does not exist"; register AMB-91 adjudicates the kind
#    mismatch as that miss, on GET, PUT and DELETE alike and on all seven typed
#    families.
#
# `Prefer: return=identifier` is NOT realized: an ITEM_TAG has no uid and the
# affected resource is a collection, so the released identifier contract cannot
# apply (register AMB-92).
sm_operation: I_ITS_REST_ITEM_TAGS.group_tags_update
its: its-rest
request:
  method: PUT
  path: /demographic/group/{uid_based_id}/tags
  body: tags                              # requestBody: required, application/json array of schemas/common/UpdateItemTag.yaml
  headers:
    Prefer: "return=representation"       # parameters/header/Prefer.yaml enum; selects the 200 branch
formats: [canonical-json]                 # parameters/header/{Accept,ContentType}_canonical.yaml
outcomes:
  updated:
    status: 200
    headers:
      Content-Type: negotiated            # 200_GROUP_ItemTagList_updated.yaml -> headers/ContentType_canonical.yaml
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
    body: prefer_conditional
  validation_failed:
    status: 400
    body: error_loose
  not_found: { status: 404 }
