# Wire realization of I_EHR_STATUS.set_ehr_queryable, variant `return_minimal`:
# the EHR_STATUS whole-resource PUT states the minimal preference EXPLICITLY.
# The variant-less realization pins `return=representation`, so this preference
# needs its own variant. ITS-REST publishes no field-level setter, so the SM
# setter is realized here as the same read-modify-write the variant-less
# binding performs.
#
# ORACLE ORDER for the status (register AMB-62, re-adjudicated 2026-07-28).
# TIER 1, THE DOCS TEXT, is SILENT — not conflicting: overview
# `Requests_and_responses.md` §"Prefer minimal, identifier or full
# representation response" offers "The HTTP status is typically `201 Created`"
# (descriptive) and "If no response body is returned, the service SHOULD use
# `204 No Content`" (conditional on a fact the same text never assigns). TIER 2,
# THE RELEASED OAS, fills exactly that silence and is cited AS the OAS:
# `operations/ehr_status_update.yaml` declares BOTH `'200'` and `'204'` and the
# response files split them by preference — `responses/200_EHR_STATUS_updated.yaml`
# scopes the 200 to the representation/identifier preferences, while
# `responses/204_version_updated.yaml` states "`204 No Content` is returned when
# the update operation was successful and the `Prefer` header is missing or is
# set to `return=minimal`".
#
# `ETag` IS declared: a 204 carries no body, so the new EHR_STATUS version's
# identity travels in the entity tag alone, and the weakness indicator is a MUST
# (overview §Deprecated headers). No `Content-Type` — Resources.md §JSON Format
# requires it "unless the response has no content body". `Location` is not
# declared, on the same AMB-62 scoping the COMPOSITION PUT variant records.
#
# NOTE: header matchers and body selectors are EXECUTED assertions — a violated
# declaration is a red row.
sm_operation: I_EHR_STATUS.set_ehr_queryable
its: its-rest
variant: return_minimal
request:
  method: PUT
  path: /ehr/{ehr_id}/ehr_status
  body: { from_capture: status_body, set: { is_queryable: true } }   # read-modify-write, as the variant-less realization
  headers:
    If-Match: '"${preceding_version_uid}"'  # realizes the SM preceding_version_uid (overview §If-Match and accidental overwrites)
    Prefer: "return=minimal"
formats: [canonical-json]
outcomes:
  updated:
    status: 204                             # OAS responses/204_version_updated.yaml
    body: absent                            # 204 No Content
    headers:
      ETag: 'pattern:W/"[^"]+"'             # the weakness indicator is a MUST — overview §Deprecated headers
      Preference-Applied: "present?"        # MAY — overview §Representation details negotiation
captures:
  status_version_uid:
    from: header ETag
    strip: weak-quotes
