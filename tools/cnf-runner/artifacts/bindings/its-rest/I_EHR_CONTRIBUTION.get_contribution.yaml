# Wire realization of I_EHR_CONTRIBUTION.get_contribution for ITS-REST 1.1.0.
# Sources: specifications/operations/contribution_get.yaml (200/404),
# responses/200_CONTRIBUTION.yaml, responses/404_CONTRIBUTION.yaml
# ("404 ... when an EHR with ehr_id does not exist, or when a CONTRIBUTION with
# contribution_uid does not exist").
sm_operation: I_EHR_CONTRIBUTION.get_contribution
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/contribution/{contribution_uid}
# canonical-xml is DECLARED-BUT-UNDEFINED on this read (register AMB-167,
# adjudicated 2026-07-28): The published XSDs declare global document elements only for composition, version, items, template, extract, extract_request, versioned_object and archetype (xs:element inventory of crates/openehr-its/schemas/xml/its-xml-1.0.2-nsv1 + its-xml-2.0.0-nsv2); CONTRIBUTION exists only as a complexType (Common.xsd), so the release assigns this response no document ROOT NAME while ITS-REST overview Resources.md addresses `Accept: application/xml` to the resource surface. The format therefore stays DECLARED — a service that answers the read in XML under a root of its own choosing is not thereby non-conformant, and the declaration is what lets the classifier recognise the exchange — and the opposite arm, §XML Format's 406 MUST ("If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code 406 Not Acceptable"), is exercised by the option-gated -xml_not_acceptable case. The COMMIT envelope is the separate, genuinely undefinable branch (AMB-165).
formats: [canonical-json, canonical-xml, wt-flat, wt-structured]
# THE SIMPLIFIED-FORMAT READ FORMS (SPECITS-84), the mirror of the commit
# binding's split. DOCS TEXT — docs/overview/Amendment_record.md, the
# SPECITS-84 row verbatim: "accept the Simplified Formats MIME types on
# CONTRIBUTION endpoints; the Simplified Formats serialization applies to
# `versions[].data` only, the CONTRIBUTION envelope remains canonical", with
# docs/overview/Resources.md §Simplified Formats fixing the two MIME types and
# their `Accept` negotiation. The docs text does not spell the split per
# operation; the RELEASED OAS does and is cited AS the OAS (owner ruling
# 2026-07-28): operations/contribution_get.yaml §"Simplified Formats" —
# "The `Accept` header MAY be set to one of the Simplified Formats MIME types
# … When a Simplified Formats MIME type is requested, the **CONTRIBUTION
# envelope itself is still returned as canonical JSON** (`uid`, `versions[]`
# metadata, `audit`). Only the inner `versions[i].data` payload … is serialized
# in the chosen FLAT or STRUCTURED form."
# So the format axis names the INNER payload's representation only; the served
# envelope stays a canonical CONTRIBUTION, which is what the gating cases
# assert.
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
#
# ETag + Last-Modified on this READ are SPEC-SILENT, adjudicated in register
# AMB-87: the overview SHOULDs both headers "for VERSION, VERSIONED_OBJECT, or
# other resources that have versioning or unique state identifiers", while
# Resources.md classifies CONTRIBUTION among the NON-versioned resources — so no
# docs-text sentence settles whether the SHOULD reaches this response. The
# register's fixed handling: the CONTRIBUTION is immutable and has a unique
# identifier, so the entity tag is that identifier (the same one the create's
# 201 already carries) and Last-Modified is its one modification instant, the
# committal. The ETag payload is asserted against the case's own
# `contribution_uid` capture — taken from the COMMIT's body `uid.value`, a
# different response on a different channel, so this is a real cross-response
# identity assertion, not a header compared with itself. `contribution_uid` is
# NOT one of the structural grammar tokens (`<versioned_object_uid>`,
# `<template_hrid>`, `<n>`, `<system_id>`), which resolve BEFORE case variables;
# a placeholder that is neither resolves to nothing and the row FAILS LOUD
# (#1865) — it never degrades to a `.*` wildcard. See bindings/README.md.
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
outcomes:
  ok:
    status: 200                           # 200_CONTRIBUTION.yaml — the existing CONTRIBUTION
    headers:
      ETag: { match: 'pattern:W/"<contribution_uid>"', applies: { its_rest: ">=1.1.0" } }  # register AMB-87 + §Deprecated headers (the `W/` MUST)
      Last-Modified: present              # register AMB-87 — the committal instant (§ETag and Last-Modified: "derived from VERSION.commit_audit.time_committed.value")
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
    body: present
  not_acceptable: { status: 406 }        # Resources.md §XML Format — an Accept the service cannot fulfill (no CONTRIBUTION XML document is published; AMB-165)
  not_found:
    status: 404                           # 404_CONTRIBUTION.yaml — absent CONTRIBUTION or absent EHR
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  bad_request:
    # A `contribution_uid` path segment that is not a well-formed identifier at
    # all. DOCS TEXT (overview §HTTP status codes, the 400 row verbatim): "The
    # service cannot or will not process the request due to something that is
    # perceived to be a client error (e.g., malformed request syntax,
    # syntactically invalid content)" — and, below the table, "Status code `400`
    # indicates normally a bad request, as well as a generic client-side error,
    # used when no other `4xx` error code is appropriate". WHICH of the 400/404
    # rows a malformed identifier segment takes is assigned by no released
    # sentence; register AMB-76 carries the repo-wide fixed handling (malformed
    # identifier segments are 400, well-formed-but-unknown ones stay 404) and
    # its scope names `contribution_uid`.
    # KIND: `bad_request` — the taxonomy's kind for exactly the two sentences
    # quoted above (vocab/outcomes.yaml). AMB-76's law is one law, so it wears
    # one kind on every binding that realizes it; `validation_failed` would
    # claim the addressed CONTRIBUTION's content was judged and found
    # semantically invalid, which no part of this exchange does.
    status: 400
    body: error_loose
# The CONTRIBUTION carries server-assigned identity + the server-set audit time
# (contribution_create.yaml: "audit.time_committed: server will always set it").
server_assigned: [uid, "audit.time_committed"]
