# Wire realization of I_EHR_CONTRIBUTION.get_contribution for ITS-REST 1.1.0.
# Sources: specifications/operations/contribution_get.yaml (200/404),
# responses/200_CONTRIBUTION.yaml, responses/404_CONTRIBUTION.yaml
# ("404 ... when an EHR with ehr_id does not exist, or when a CONTRIBUTION with
# contribution_uid does not exist").
sm_operation: I_EHR_CONTRIBUTION.get_contribution
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/contribution/{contribution_uid}
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_CONTRIBUTION.yaml — the existing CONTRIBUTION
    headers:
      Content-Type: negotiated
      Location: absent                    # read — overview §Location / §Deprecated headers
    body: present
  not_found:
    status: 404                           # 404_CONTRIBUTION.yaml — absent CONTRIBUTION or absent EHR
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
# The CONTRIBUTION carries server-assigned identity + the server-set audit time
# (contribution_create.yaml: "audit.time_committed: server will always set it").
server_assigned: [uid, "audit.time_committed"]
