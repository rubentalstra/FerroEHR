# Wire realization of I_EHR_DIRECTORY.has_directory for ITS-REST 1.1.0.
# The SM has_directory(ehr_id) returns Boolean; ITS-REST 1.1.0 has no dedicated
# directory-existence probe, so — mirroring the shipped I_EHR_COMPOSITION.
# has_composition / has_ehr bindings — the check is realized as
# GET /ehr/{ehr_id}/directory: 200 = a directory exists (TRUE), 404 = no
# directory, or the EHR does not exist (FALSE / error). ITS-REST provides no
# 200-with-boolean-body probe, so the boolean is carried by the ok/not_found
# outcome kind rather than a response body (see schedule/directory/REQUIREMENTS.md).
# Sources: specifications/operations/directory_get_at_time.yaml (200/404),
# responses/200_FOLDER_retrieved.yaml,
# 404_directory_unknown_ehr_id_or_no_version_at_time_or_no_path.yaml.
sm_operation: I_EHR_DIRECTORY.has_directory
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/directory
formats: [canonical-json, canonical-xml]
outcomes:
  ok: { status: 200, headers: { Content-Type: negotiated } }   # a directory exists (TRUE)
  not_found: { status: 404 }                                   # no directory, or absent EHR (FALSE / error)
