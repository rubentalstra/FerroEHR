# ITS-REST 1.1.0 surfaces no wire for I_DEFINITION_ADL14.delete_opt — an
# explicit unrealized declaration so the four official master04 delete_opt
# cases are not-applicable WITH CITATION on this ITS (never silently absent),
# and activate when a later ITS-REST release adds the endpoint.
sm_operation: I_DEFINITION_ADL14.delete_opt
its: its-rest
unrealized:
  reason: >-
    No DELETE operation exists on any /definition/template/adl1.4* path in
    ITS-REST 1.1.0 (the only DELETEs in the OAS are admin_ehr_delete*,
    composition_delete, directory_delete and the demographic deletes).
  source: >-
    ITS-REST specifications/operations (definition template operations); SM
    docs/UML/classes/i_definition_adl14.adoc (delete_opt)
  ambiguity: AMB-17
