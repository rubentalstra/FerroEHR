# EXTENSION realization of I_EHR_EXTRACT_SERVICE.export_ehr_extracts.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the release publishes SEVEN API groups (overview, system, ehr,
# demographic, query, definition, admin) and no message / EHR-Extract / TDD
# group in either the docs text (specifications/docs/**) or the OAS
# (specifications/*.openapi.yaml); there are no message_*/extract_*/tdd_*
# operations anywhere in specifications/operations. Register AMB-34.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `POST /message/export`, declared in the `message-extract` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the EhrExtract CAPABILITY verdict(s)
# only and never ITS-REST wire conformance; the capability-matrix rows carry
# `realization: extension`, which may never be `required` (owner ruling
# 2026-07-28).
sm_operation: I_EHR_EXTRACT_SERVICE.export_ehr_extracts
its: its-rest
extension:
  family: message-extract
  reason: >-
    ITS-REST 1.1.0 publishes no MESSAGE/EHR-Extract/TDD API at all, so the SM
    export_ehr_extracts has no released wire; this product serves the operation on its
    own /message/export route, which is what the cases drive.
  source: >-
    SM docs/openehr_platform/master09-message_service.adoc +
    docs/UML/classes/i_ehr_extract_service.adoc (export_ehr_extracts) vs released ITS-REST
    specifications/*.openapi.yaml (seven groups, none of them
    message/extract/tdd) + specifications/docs/** (no such API) — no openEHR
    spec governs the extension route, our own design/extension
  ambiguity: AMB-34
request:
  method: POST
  path: /message/export
  # The SM parameter IS an EXTRACT_SPEC (extract_spec.adoc), so the whole
  # structure is the request payload. A read modelled as POST because its
  # selector is a structure, exactly as the released ad-hoc AQL read is.
  body: extract_spec
  headers:
    Content-Type: application/json
    Accept: application/json
formats: [canonical-json]
# NO `applies:` floor rides on these expectations — a floor dates a RELEASED
# rule, and nothing released governs this route.
outcomes:
  # The SM return is `List<EXTRACT>` — one EXTRACT per manifest entity, in
  # manifest order. Nothing released governs this route; the status choice is
  # ours (RFC 9110 §15.3.1).
  ok:
    status: 200
    headers:
      Content-Type: negotiated
  # SM `precondition_violation` — an entity naming neither `ehr_id` nor
  # `subject_id` cannot be located ("Various identifiers may be provided for
  # the entity; these are to be used by the receiver system to locate the
  # entity", extract_entity_manifest.adoc).
  bad_request:
    status: 400
  # SM `ehr_id_does_not_exist` / `versioned_object_does_not_exist`.
  not_found:
    status: 404
