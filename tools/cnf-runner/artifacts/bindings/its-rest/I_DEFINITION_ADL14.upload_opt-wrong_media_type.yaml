# Wire realization of I_DEFINITION_ADL14.upload_opt, variant wrong_media_type:
# the OPT upload is sent declaring `Content-Type: application/json` on an
# operation whose only body type is the canonical OPT XML. The service cannot
# process the payload as XML, so it MUST refuse with 415 — ITS-REST overview
# Resources.md §XML Format ("If the service cannot process the request payload
# as XML format, it MUST respond with HTTP status code 415 Unsupported Media
# Type"), symmetric with §JSON Format for a payload it cannot process as JSON.
# The refusal is a media-type decision, not a parse outcome: the body is the
# same valid OPT the variant-less binding uploads, so nothing but the declared
# type distinguishes this exchange.
#
# Sources: specifications/docs/overview/Resources.md §XML Format + §JSON
# Format; specifications/operations/definition_template_adl1.4_upload.yaml
# (single request body: the OPT XML).
sm_operation: I_DEFINITION_ADL14.upload_opt
its: its-rest
variant: wrong_media_type
request:
  method: POST
  path: /definition/template/adl1.4
  body: opt_xml
  headers:
    Content-Type: application/json        # the DECLARED non-XML payload type under test
outcomes:
  unsupported_media: { status: 415 }      # Resources.md §XML Format MUST
