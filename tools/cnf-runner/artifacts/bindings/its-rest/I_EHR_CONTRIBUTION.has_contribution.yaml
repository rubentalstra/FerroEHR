# Wire realization of I_EHR_CONTRIBUTION.has_contribution for ITS-REST 1.1.0.
# The SM has_contribution(an_ehr_id, a_contrib_id) returns Boolean; ITS-REST
# 1.1.0 has no dedicated CONTRIBUTION-existence probe (only contribution_create
# and contribution_get exist under /ehr/{ehr_id}/contribution*), so — mirroring
# the has_composition binding — the check is realized as
# GET /ehr/{ehr_id}/contribution/{contribution_uid}:
# 200 = the CONTRIBUTION exists (TRUE), 404 = it does not exist, or the EHR does
# not exist (FALSE / error). The realization is registered (the existence-probe family).
# Sources: specifications/operations/contribution_get.yaml (200/404),
# responses/200_CONTRIBUTION.yaml, responses/404_CONTRIBUTION.yaml.
sm_operation: I_EHR_CONTRIBUTION.has_contribution
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/contribution/{contribution_uid}
# canonical-xml is DECLARED-BUT-UNDEFINED on this read (register AMB-167,
# adjudicated 2026-07-28): The published XSDs declare global document elements only for composition, version, items, template, extract, extract_request, versioned_object and archetype (xs:element inventory of crates/openehr-its/schemas/xml/its-xml-1.0.2-nsv1 + its-xml-2.0.0-nsv2); CONTRIBUTION exists only as a complexType (Common.xsd), so the release assigns this response no document ROOT NAME while ITS-REST overview Resources.md addresses `Accept: application/xml` to the resource surface. The format therefore stays DECLARED — a service that answers the read in XML under a root of its own choosing is not thereby non-conformant, and the declaration is what lets the classifier recognise the exchange — and the opposite arm, §XML Format's 406 MUST ("If the service cannot fulfill this aspect of the request, it MUST respond with HTTP status code 406 Not Acceptable"), is exercised by the option-gated -xml_not_acceptable case. The COMMIT envelope is the separate, genuinely undefinable branch (AMB-165).
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_CONTRIBUTION.yaml — exists (TRUE)
    headers:
      Content-Type: negotiated
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_acceptable: { status: 406 }        # Resources.md §XML Format — an Accept the service cannot fulfill (no CONTRIBUTION XML document is published; AMB-165)
  not_found: { status: 404 }                                   # 404_CONTRIBUTION.yaml — absent CONTRIBUTION or absent EHR (FALSE / error)
