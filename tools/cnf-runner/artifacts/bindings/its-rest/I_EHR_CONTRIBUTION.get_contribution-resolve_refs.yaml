# Wire realization of I_EHR_CONTRIBUTION.get_contribution, variant
# `resolve_refs`: the CONTRIBUTION read sent with the object-reference
# resolution preference. Identical to the variant-less realization in every
# other respect, so a red row localizes to the preference alone.
#
# DOCS TEXT (overview `Requests_and_responses.md` §"Prefer resolving Object
# references", quoted whole): "Clients MAY request that object references
# (e.g., OBJECT_REF) be resolved into full or partial representations by
# specifying: `Prefer: return=representation, resolve_refs`". That is a CLIENT
# sentence — it assigns the service no obligation and names no resource, which
# is why the cross-cutting `header-prefer-resolve-refs` element carries no
# general gating case.
#
# What binds it HERE is register AMB-57 (fixed_handling). The released
# contribution read promises inner-payload serialization it cannot deliver
# through its own declared body: the §Simplified Formats paragraph of
# contribution_get says "only each `versions[i].data` payload is serialized in
# the requested FLAT or STRUCTURED form", while the declared 200 body carries
# `versions` as OBJECT_REFs and has no `versions[i].data` at all. The register
# resolves the conflict by binding the inner serialization to the one
# mechanism the docs text does define for resolving OBJECT_REFs: with
# `Prefer: return=representation, resolve_refs` the members inline as full
# ORIGINAL_VERSIONs; without it the OBJECT_REF members pass through.
#
# Only the `ok` branch is declared: the variant exists to exercise the
# resolved shape, and every rejection branch is exercised on the variant-less
# binding (its addressing and payload are byte-identical).
sm_operation: I_EHR_CONTRIBUTION.get_contribution
its: its-rest
variant: resolve_refs
request:
  method: GET
  path: /ehr/{ehr_id}/contribution/{contribution_uid}
  headers:
    Prefer: "return=representation, resolve_refs"
formats: [canonical-json]
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
    body: present
server_assigned: [uid, "audit.time_committed"]
