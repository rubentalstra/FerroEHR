# Wire realization of I_QUERY_SERVICE.execute_ad_hoc_query, variant
# `get_ehr_id_header`: the GET form of ad-hoc execution, with the single-EHR
# scope carried by the `openehr-ehr-id` REQUEST HEADER instead of the `ehr_id`
# query parameter.
#
# Every expectation below is assigned by the ITS-REST DOCS TEXT (the released
# oracle), quoted:
#
# - the header realization of the EHR scope — docs/query/Request.md §"About the
#   ehr_id parameter": "Depending on the needs, clients MAY supply it as a query
#   parameter `ehr_id` or alternatively as a request header named
#   `openehr-ehr-id`." §"Common Headers and Query Parameters" repeats it under
#   "Related request headers: `openehr-ehr-id` - used to execute the query
#   within a single EHR context: an EHR identifier taken from EHR.ehr_id.value",
#   and docs/query/Query_types.md §"Single EHR queries" states the pair again:
#   "This is achieved by supplying an `ehr_id` query parameter or setting an
#   `openehr-ehr-id` request header." None of the three distinguishes HTTP
#   methods, so the header realization is normative on GET too.
# - the GET form itself and `q` in the query string — docs/query/Request.md
#   §"GET vs POST": "Requests based on the `GET` method have URI length
#   restriction ... Long queries in the `q` parameter and having a long list of
#   `query_parameters` may add up to reach that limit" — a length caveat about a
#   supported form, not its removal.
# - `offset` / `fetch` — docs/query/Request.md §"Common Headers and Query
#   Parameters": "All query execution requests SHOULD support at least the
#   following parameters: ... `offset` - used for paging ... `fetch` - used for
#   paging".
# - `200` — docs/overview/Requests_and_responses.md §"HTTP status codes", row
#   `200 OK`: "The request succeeded, payload sent in a 200 response depends on
#   the request method".
# - `ETag` — docs/query/Request.md §"Common Headers and Query Parameters":
#   "Related response headers: `ETag` - A unique identifier of the resultSet";
#   its FORM by docs/overview/Requests_and_responses.md §"Deprecated headers":
#   "all `ETag` headers that hold a resource identifier MUST include a weakness
#   indicator `W/`". Only the weak wrapper is asserted — the identifier inside
#   is the service's choice ("usually taken from e.g. VERSIONED_OBJECT.uid.value,
#   VERSION.uid.value, EHR.ehr_id.value, etc.").
# - `404` on a well-formed but UNKNOWN `ehr_id` — the released ad-hoc operation
#   declares no not-found branch of its own, and docs/query/Request.md §"About
#   the ehr_id parameter" says only that the scope "MAY be used by the underlying
#   backend to perform routing, optimizations or similar". The branch is
#   adjudicated in register AMB-101 (fixed handling), which realizes the SM's
#   declared `ehr_id_does_not_exist` error (SM i_query_service.adoc) on
#   docs/overview/Requests_and_responses.md §"HTTP status codes", row `404 Not
#   Found`: "The origin service did not find the target resource or is not
#   willing to disclose that one exists".
#
# Identical to the variant-less binding except for the method and where the
# scope travels, so a red row localizes to the header realization on GET alone.
# `ehr_id` is deliberately ABSENT from `query` — the point of the variant is
# that the header ALONE must scope the execution.
sm_operation: I_QUERY_SERVICE.execute_ad_hoc_query
its: its-rest
variant: get_ehr_id_header
request:
  method: GET
  path: /query/aql
  query:
    q: "${q}"                             # Request.md §GET vs POST (`q` parameter)
    offset: "${offset?}"                  # Request.md §Common Headers and Query Parameters
    fetch: "${fetch?}"                    # Request.md §Common Headers and Query Parameters
    query_parameters: "${query_parameters?}"
  headers:
    openehr-ehr-id: "${ehr_id}"           # Request.md §About the ehr_id parameter
    Accept: application/json
formats: [canonical-json]
outcomes:
  ok:
    status: 200                           # Requests_and_responses.md §HTTP status codes, row 200
    # The resultSet `ETag`: presence is SHOULD-strength, the weak form is a MUST.
    # docs/query/Request.md §"Common Headers and Query Parameters" names the header
    # with no RFC 2119 keyword at all ("Related response headers: `ETag` - A unique
    # identifier of the resultSet"), and the released OAS declares it without
    # `required` (query-codegen.openapi.yaml components/headers/ETag_RESULT_SET), so
    # the only strength anywhere is docs/overview/Requests_and_responses.md §"ETag and
    # Last-Modified": "Both `ETag` and `Last-Modified` SHOULD be included in responses
    # for VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
    # state identifiers". A server that omits it is therefore not failed (`optional:
    # true`), while one that emits it must weaken it — §"Deprecated headers": "all
    # `ETag` headers that hold a resource identifier MUST include a weakness indicator
    # `W/`", a MUST the same chapter dates to Release 1.1.0 (`applies`).
    headers: { ETag: { match: 'pattern:W/"[^"]+"', optional: true, applies: { its_rest: ">=1.1.0" } } }
    body: result_set_body
  not_found: { status: 404 }              # Requests_and_responses.md §HTTP status codes, row 404 (register AMB-101)
