# EXTENSION realization of I_DEFINITION_ADL2.delete_artefact.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the ITS-REST docs text names no ADL 2 artefact-delete resource
# (specifications/docs/definition/** describes operational-template
# provisioning only), and the released specifications/definition.openapi.yaml
# declares the ADL 2 group as `/definition/template/adl2*` alone — no DELETE on any ADL 2 path.
# Register AMB-37.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `DELETE /definition/artefact/adl2/{artefact_id}`, declared in the `adl2-archetype` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the CAPABILITY verdicts of the rows
# whose cases drive it and never ITS-REST wire conformance.
sm_operation: I_DEFINITION_ADL2.delete_artefact
its: its-rest
extension:
  family: adl2-archetype
  reason: >-
    ITS-REST 1.1.0 declares no DELETE on any /definition/template/adl2* path,
    so the SM delete_artefact has no released wire; this product serves the
    operation on its own /definition/artefact/adl2/{artefact_id} route.
  source: >-
    SM docs/UML/classes/i_definition_adl2.adoc (delete_artefact) vs released
    ITS-REST specifications/definition.openapi.yaml (definition_template_adl2_*
    only — no DELETE on any ADL 2 path) + specifications/docs/definition/** (no mention) — no
    openEHR spec governs the extension route, our own design/extension
  ambiguity: AMB-37
request:
  method: DELETE
  # The path parameter is named for the CASE variable it is filled from (the
  # delete_artefact cases carry the artefact HRID as `template_id`); the served
  # route spells the same segment `{artefact_id}`, and the realization-scope
  # gate compares path SHAPE, not parameter names.
  path: /definition/artefact/adl2/{template_id}
outcomes:
  # A definition-store artefact carries NO version history — removing it
  # commits no VERSION and leaves nothing to return — so the case's `deleted`
  # outcome is realized as a bodyless 204 rather than as a change-controlled
  # logical delete. Nothing released governs this route; the status choice is
  # ours (RFC 9110 §15.3.5: 204 for a successful request with no content to
  # send).
  deleted: { status: 204 }
  # SM `Pre_artefact_exists` / error `artefact_does_not_exist`.
  not_found: { status: 404 }
