# EXTENSION realization of I_ADMIN_DUMP_LOAD.export_ehrs.
#
# NO RELEASED WIRE EXISTS, re-derived first-hand 2026-07-29 under the oracle
# order: the ITS-REST docs text describes the Admin API as EHR deletion only
# (specifications/docs/admin/**), and the released
# specifications/admin.openapi.yaml declares exactly two operations —
# admin_ehr_delete and admin_ehr_delete_all. Nothing in the release exports a
# repository to a file system. Register AMB-33.
#
# WHAT THIS BINDING DRIVES INSTEAD: the route this product serves of its own
# design — `POST /admin/dump`, declared in the `admin-dump-load` family of
# vocab/wire_surface.yaml served_extensions. NO openEHR SPEC GOVERNS IT — our
# own design/extension. It therefore gates the EhrDumpLoad CAPABILITY verdict
# only and never ITS-REST wire conformance; the capability-matrix row carries
# `realization: extension`, which may never be `required` (owner ruling
# 2026-07-28).
#
# BODY SHAPE. `export_ehrs`'s signature passes `logical_fmt` / `comp_fmt` /
# `enc_format` loose, while export_spec.adoc bundles the same three attributes
# with the mandatory `segment_split_size: Integer [1..1]` (kb). EXPORT_SPEC is
# the SM's own richer form for exactly this operation, so the body is the
# EXPORT_SPEC attribute set plus the separate `file_sys_loc` parameter, and
# every enumeration value is the vendored literal verbatim.
sm_operation: I_ADMIN_DUMP_LOAD.export_ehrs
its: its-rest
extension:
  family: admin-dump-load
  reason: >-
    ITS-REST 1.1.0 realizes only admin_ehr_delete / admin_ehr_delete_all of the
    SM Admin surface, so the SM export_ehrs has no released wire; this product
    serves the operation on its own /admin/dump route, which is what the cases
    drive.
  source: >-
    SM docs/UML/classes/i_admin_dump_load.adoc (export_ehrs, error
    file_not_writable) + export_spec.adoc / export_format.adoc /
    compression_format.adoc / encoding_format.adoc vs released ITS-REST
    specifications/admin.openapi.yaml (admin_ehr_delete + admin_ehr_delete_all
    only) + specifications/docs/admin/** (no dump/load resource) — no openEHR
    spec governs the extension route, our own design/extension
  ambiguity: AMB-33
request:
  method: POST
  path: /admin/dump
  body:
    file_sys_loc: "${file_sys_loc}"
    logical_format: "${logical_fmt?}"
    compression_format: "${comp_fmt?}"
    segment_split_size: "${segment_split_size?}"
  headers:
    Content-Type: application/json
outcomes:
  # `export_ehrs` returns `List<DUMP_LOAD_FAIL_REPORT>`
  # (dump_load_fail_report.adoc), so a fulfilled call carries the report array —
  # empty when every EHR was dumped. Nothing released governs this route; the
  # status choice is ours (RFC 9110 §15.3.1: 200 for a successful request whose
  # representation is the result).
  ok:
    status: 200
  # SM `precondition_violation`: no `file_sys_loc`, a value naming no member of
  # its vendored enumeration, a non-positive `segment_split_size`, or an
  # `encoding` — ENCODING_FORMAT (encoding_format.adoc) is an enumeration with
  # NO members, so no value a client can send names one.
  bad_request:
    status: 400
