# Wire realization of I_DEMOGRAPHIC_SERVICE.create_party for ITS-REST 1.1.0.
# The SM create_party(a_version: UV_PARTY) is polymorphic over the abstract
# PARTY; ITS-REST 1.1.0 surfaces only per-concrete-subtype create endpoints
# (person/organisation/role/group/agent). This binding realizes create_party via
# the PERSON endpoint as the representative concrete subtype — a conformant
# server exposing any concrete PARTY subtype passes (this binding NOTE is the
# polymorphism record).
# Sources: specifications/operations/person_create.yaml,
# responses/201_PERSON.yaml, 422.yaml; ETag.yaml, Location_PERSON.yaml,
# ContentType_LOCATABLE.yaml.
sm_operation: I_DEMOGRAPHIC_SERVICE.create_party
its: its-rest
request:
  method: POST
  path: /demographic/person
  body: party
  headers:
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml]
outcomes:
  created:
    status: 201                           # 201_PERSON.yaml
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::1"'
      Location: present
      Content-Type: negotiated
    body: prefer_conditional
  validation_failed:
    status: 422                           # 422.yaml — content_invalid / definition_unknown
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  unsupported_media:
    # A request payload declared in one of the two Simplified Formats MIME
    # types. DOCS TEXT (overview Resources.md §Simplified Formats): "If the
    # service cannot process the request payload as the simplified format is
    # not supported, it MUST respond with HTTP status code `415 Unsupported
    # Media Type`." A party HAS no simplified representation — the format is
    # template-derived and its RM mapping is COMPOSITION-rooted, and the party
    # commits declare no `openehr-template-id` channel — so this service cannot
    # process such a payload at all. Register AMB-128 carries the adjudication;
    # the read-side twin (a Simplified-only `Accept` -> 406) is the
    # `not_acceptable` outcome of the I_PARTY.get_party binding.
    status: 415
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
  # The same identifier with its ASCII case flipped — authoring material for
  # case-variant If-Match cases (BASE master05 §"Composite Identifiers and
  # Case": identifiers "identical apart from case ... identify the same
  # thing"); the uppercase transform exists for exactly this (#403).
  version_uid_upper:
    from: capture version_uid
    transform: uppercase
server_assigned: [uid]
