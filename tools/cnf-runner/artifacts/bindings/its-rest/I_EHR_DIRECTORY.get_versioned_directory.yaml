# ITS-REST 1.1.0 surfaces no wire for I_EHR_DIRECTORY.get_versioned_directory —
# there is no /ehr/{ehr_id}/versioned_directory resource (the directory paths
# are only /ehr/{ehr_id}/directory and /ehr/{ehr_id}/directory/{version_uid}),
# unlike versioned_ehr_status / versioned_composition. An explicit unrealized
# declaration keeps the three official master09 get_versioned_directory cases in
# the catalogue, active and SM-anchored, verdicting not-applicable WITH CITATION
# on this ITS and activating when a later ITS-REST release adds the endpoint.
sm_operation: I_EHR_DIRECTORY.get_versioned_directory
its: its-rest
unrealized:
  reason: >-
    No GET operation exists on any /ehr/{ehr_id}/versioned_directory path in
    ITS-REST 1.1.0; the VERSIONED_FOLDER container has no REST resource (the
    only directory paths are /ehr/{ehr_id}/directory and
    /ehr/{ehr_id}/directory/{version_uid}).
  source: "SM docs/UML/classes/i_ehr_directory.adoc (get_versioned_directory -> VERSIONED_FOLDER) vs ITS-REST specifications/ehr.openapi.yaml (directory paths: no versioned_directory)"
  ambiguity: AMB-24
