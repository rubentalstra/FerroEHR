# Wire realization of I_EHR_DIRECTORY.get_directory_at_time for ITS-REST 1.1.0.
# The SM get_directory_at_time(ehr_id, a_time) returns the directory FOLDER
# extant at a_time, or (a_time omitted) the latest; realized as
# GET /ehr/{ehr_id}/directory with the optional `version_at_time` query
# parameter. The `a_time` flow argument maps to `version_at_time`
# (parameters/query/version_at_time.yaml); omitted -> latest.
# An empty EHR / before the first version is the OAS-defined 404 (no
# empty-structure representation exists in the release).
# Sources: specifications/operations/directory_get_at_time.yaml (200/204/404),
# parameters/query/version_at_time.yaml, responses/200_FOLDER_retrieved.yaml,
# 204_deleted_at_time.yaml,
# 404_directory_unknown_ehr_id_or_no_version_at_time_or_no_path.yaml.
sm_operation: I_EHR_DIRECTORY.get_directory_at_time
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/directory
  query:
    version_at_time: "${a_time?}"         # omitted -> latest (directory_get_at_time.yaml)
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # 200_FOLDER_retrieved.yaml
    headers:
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
  ok_empty: { status: 204 }               # 204_deleted_at_time.yaml
  not_found: { status: 404 }              # unknown ehr_id or no version at the requested time
# The server-assigned uid, at EVERY FOLDER node: RM common locatable.adoc types
# `uid` `0..1` ("Optional globally unique object identifier for root points of
# archetyped structures") and RM common folder.adoc's NOTE recommends populating
# it only "in _top-level_ (i.e. tree-root) `FOLDER` objects" — a uid at a nested
# archetype-root FOLDER is permitted and unrequired, so it is a server
# assignment, never a content difference. `**` matches every depth of the
# recursive `folders: List<FOLDER>` shape.
server_assigned: ["**/uid"]
