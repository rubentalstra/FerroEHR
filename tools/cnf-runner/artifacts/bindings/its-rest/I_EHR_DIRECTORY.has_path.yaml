# Wire realization of I_EHR_DIRECTORY.has_path for ITS-REST 1.1.0.
# The SM has_path(ehr_id, a_path) returns Boolean; ITS-REST 1.1.0 has no
# dedicated path-existence probe, so it is realized as
# GET /ehr/{ehr_id}/directory with the `path` query parameter selecting the
# sub-FOLDER: 200 = the path exists (TRUE), 404 = the path does not exist, or
# the EHR does not exist (FALSE / error). The `a_path` flow argument maps to the
# `path` query parameter (parameters/query/path.yaml). The boolean is carried by
# the ok/not_found outcome kind (no dedicated existence endpoint in ITS-REST 1.1.0).
# Sources: specifications/operations/directory_get_at_time.yaml (200/404),
# parameters/query/path.yaml, responses/200_FOLDER_retrieved.yaml,
# 404_directory_unknown_ehr_id_or_no_version_at_time_or_no_path.yaml.
sm_operation: I_EHR_DIRECTORY.has_path
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/directory
  query:
    path: "${a_path}"                      # slash-separated FOLDER names (parameters/query/path.yaml)
formats: [canonical-json, canonical-xml]
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)" /
# "The `Location` header MUST ONLY be used for resource creation (e.g.,
# `201 Created`) or redirect responses"; §Deprecated headers deprecates it on
# `GET` and `DELETE` responses alike.
outcomes:
  ok:
    status: 200                           # the path exists (TRUE)
    headers:
      Content-Type: negotiated
      Location: { match: absent, applies: { its_rest: ">=1.1.0" } }  # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }                                   # no such path, or absent EHR (FALSE / error)
