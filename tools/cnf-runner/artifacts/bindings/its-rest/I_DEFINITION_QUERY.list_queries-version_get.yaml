# Wire realization of the released single-definition read
# (`GET /definition/query/{qualified_query_name}/{version}`), bound as
# I_DEFINITION_QUERY.list_queries variant `version_get`.
#
# ANCHOR (catalogue convention, not an SM claim): the SM interface declares NO
# get-a-query operation, so this released wire behaviour has no service-model
# anchor of its own — the ITS→SM half of register AMB-127. It is bound to
# `list_queries` because the object it serves is exactly one member of what
# `list_queries` returns, the same way AMB-108 anchors the released `/example`
# routes to the closest SM read.
#
# Ground (ITS-REST DOCS TEXT + the released operation):
#
# - the route + what it returns — specifications/operations/
#   definition_query_version_get.yaml: "Retrieves the definition of a particular
#   stored query (at specified version) and its associated metadata."
# - the version selector — docs/query/Qualified_query_name.md: "The `version`
#   identifier is in the format specified by SEMVER style (i.e.
#   `major.minor.patch`)", and "When only a partial `version` pattern is
#   supplied, or when `version` is not supplied at all, the system must use the
#   latest `version` with the supplied prefix - i.e. if only `major` or
#   `major.minor` is used, then the latest query version matching supplied
#   prefix will be used." That is a MUST and it is the read contract this
#   binding drives.
# - `200` — docs/overview/Requests_and_responses.md §"HTTP status codes", row
#   `200 OK`; the served `q` is the stored text verbatim (register AMB-126).
# - `Content-Type` — docs/overview/Resources.md §"JSON Format": "Proper header
#   `Content-Type: application/json` MUST be present in the response of the
#   service unless the response has no content body (HTTP status code `204`)."
# - `Location: absent` — docs/overview/Requests_and_responses.md §Location: "It
#   MUST NOT be used to indicate an alternate representation of an existing
#   resource (e.g. via `GET` method)".
# - `404` — §"HTTP status codes", row `404 Not Found`: "The origin service did
#   not find the target resource or is not willing to disclose that one
#   exists"; a selector matching no stored version addresses no resource
#   (register AMB-102 for the unmatchable-selector half).
# - `406` — docs/overview/Resources.md §"XML Format": "If the service cannot
#   fulfill this aspect of the request, it MUST respond with HTTP status code
#   `406 Not Acceptable`." The released StoredQuery representation is JSON-only.
#
# NOTE: header matchers are EXECUTED assertions (exec/headers.rs) — a violated
# declaration is a red row.
sm_operation: I_DEFINITION_QUERY.list_queries
its: its-rest
variant: version_get
request:
  method: GET
  path: /definition/query/{qualified_query_name}/{version}   # definition_query_version_get.yaml
  headers:
    Accept: application/json                                  # Accept_JSON.yaml
formats: [canonical-json]
outcomes:
  ok:
    status: 200                                               # Requests_and_responses.md §HTTP status codes, row 200
    headers:
      Content-Type: negotiated                                # Resources.md §JSON Format MUST
      Location: absent                                        # read — overview §Location
  not_found: { status: 404 }                                  # §HTTP status codes, row 404
  not_acceptable: { status: 406 }                             # Resources.md §XML Format MUST (single JSON representation)
