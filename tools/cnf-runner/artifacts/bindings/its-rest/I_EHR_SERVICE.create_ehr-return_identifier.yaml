# Wire realization of I_EHR_SERVICE.create_ehr, variant `return_identifier`:
# the EHR creation asks for the identifier-only response with
# `Prefer: return=identifier`. Every other create_ehr binding pins
# `return=representation` in its request headers, so the identifier preference
# needs its own variant realization (the same shape as
# I_EHR_COMPOSITION.create_composition#return_identifier).
#
# Decisive docs-text sentences (ITS-REST overview Requests_and_responses.md
# §"Prefer only identifier"): "This is a variant of preference that implies
# minimal response semantics, but with a non-empty response body (i.e., the
# status will be `201 Created` or `200 OK`, never `204 No Content`)." and "The
# response body SHOULD contain only the identifier of the affected resource
# formatted according to the `Accept` request header. For example, when
# `application/json` is requested as above, the response body will be a single
# JSON object with a single `uid` attribute."
#
# STATUS — unlike the sibling `return=minimal` preference (whose status the
# released text leaves unassigned — register AMB-62), this preference IS
# assigned: the quoted sentence fixes the pair {201, 200} and excludes 204,
# and §HTTP status codes assigns 201 to the create half of that pair ("The
# request has been fulfilled and has resulted in one or more new resources
# being created"). A create therefore maps to 201 exactly, with no alt_status.
#
# WHICH identifier — Resources.md §Identifier types names it for this resource:
# "an `ehr_id` to identify an EHR". So "the identifier of the affected
# resource" for a created EHR is its `ehr_id`, carried under the `uid` member
# the §"Prefer only identifier" example fixes. The `ehr_id` capture reads it
# from there, and the case proves it addresses the created EHR by reading the
# EHR back with it.
#
# `Preference-Applied` is declared with the optional matcher: §Representation
# details negotiation makes it a MAY ("The service MAY include a
# `Preference-Applied` header in the response … to indicate that the client's
# preference has been honored"), so presence is not assertable without
# over-claiming the MAY. `Location` is likewise a MAY on this preference ("The
# response MAY include a `Location` header pointing to the newly created or
# updated resource") and is therefore not declared at all.
#
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
sm_operation: I_EHR_SERVICE.create_ehr
its: its-rest
variant: return_identifier
applies: { its_rest: ">=1.1.0" }
request:
  method: POST
  path: /ehr
  body: ehr_status?
  headers:
    Prefer: "return=identifier"
formats: [canonical-json]
# Outcome set: `created` only. The base binding's error outcomes are NOT
# repeated here — the preference governs the SUCCESS representation alone, and
# a rejected create answers the same codes whatever `Prefer` it carried.
outcomes:
  created:
    status: 201                           # §Prefer only identifier: "201 Created or 200 OK, never 204 No Content"
    headers:
      ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }  # the weakness indicator is a MUST — overview §Deprecated headers
      Content-Type: negotiated            # Resources.md §JSON Format: the Content-Type MUST be present unless the response has no content body — and this preference's body is non-empty by the sentence above
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
    body: prefer_conditional
captures:
  ehr_id:
    from: body "uid"
server_assigned: [ehr_id, system_id, time_created, ehr_status/uid, ehr_access]
