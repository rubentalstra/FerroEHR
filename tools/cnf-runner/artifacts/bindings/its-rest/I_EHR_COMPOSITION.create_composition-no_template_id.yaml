# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# no_template_id: the simplified (FLAT/STRUCTURED) commit is sent WITHOUT the
# `openehr-template-id` request header. The overview makes that header the
# template resolver for a simplified commit (a FLAT body cannot carry
# archetype_details.template_id), so the server cannot resolve a template and
# must reject the commit as a semantic failure.
# Sources: specifications/docs/overview/Requests_and_responses.md
# §openehr-template-id; simplified_formats master02 §MIME Types;
# operations/composition_create.yaml + responses/422.yaml.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: no_template_id
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Prefer: "return=representation"
formats: [wt-flat, wt-structured]
format_headers:
  wt-flat:
    Content-Type: application/openehr.wt.flat+json
  wt-structured:
    Content-Type: application/openehr.wt.structured+json
outcomes:
  created:
    status: 201                           # 201_COMPOSITION.yaml
    headers:
      ETag: { match: 'pattern:W/"<versioned_object_uid>::<system_id>::1"', applies: { its_rest: ">=1.1.0" } }
      Location: present
      Content-Type: negotiated
    body: prefer_conditional
  not_found: { status: 404 }              # unknown ehr_id (404_unknown_ehr_id.yaml)
  validation_failed:
    status: 422                           # 422.yaml
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  template_not_found:
    status: 422                           # same wire code; kind distinguished by fixture
    body: error_loose
  missing_template_id: { status: 422 }    # simplified commit without openehr-template-id
  conflict: { status: 409 }               # persistent-COMPOSITION uniqueness rejection — ITS-REST overview §HTTP status codes: 409 = conflict
  unsupported_media: { status: 415 }      # overview negotiation rules
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid, context/_uid, "composer/external_ref", territory/terminology_id]
