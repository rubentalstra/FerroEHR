# Wire realization of I_EHR_COMPOSITION.create_composition, variant
# `item_tag_headers`: the SAME released commit, driven with BOTH ITEM_TAG
# wrapper headers set, so the two collections the headers address can be read
# back separately.
#
# BEHAVIOUR — ITS-REST specifications/docs/overview/Requests_and_responses.md
# §openehr-item-tag and openehr-version-item-tag, the DOCS TEXT and the only
# released text that assigns these headers a meaning:
#  - "`openehr-item-tag` applies to *VERSIONED_OBJECT* targets."
#  - "`openehr-version-item-tag` applies to a specific target *VERSION* within
#    a VERSIONED_OBJECT."
#  - §Usage in Requests: "When used as request headers for creation or update
#    operations (`PUT`, `POST`), the header instructs the system which ITEM_TAG
#    list should be associated with the target VERSION or VERSIONED_OBJECT
#    resource (depending on the header name)."
#  - the syntax is the section's own example, verbatim:
#    `openehr-item-tag: key="category",value="final"`.
# Two headers, two named targets, therefore two DISJOINT collections — which is
# also what the RM says the tag target is (RM common master07-tags.adoc
# ITEM_TAG.target: "Identifier of target, which may be a `VERSIONED_OBJECT<T>`
# or a `VERSION<T>`").
#
# THE ECHO IS A MAY, SO IT IS NOT ASSERTED AS PRESENT: §Usage in Responses says
# "Servers MAY include the `openehr-item-tag` or `openehr-version-item-tag`
# header in responses to confirm the actual list of ITEM_TAGs stored on the
# server side", while this operation's own file says "The corresponding
# response header(s) will return ITEM_TAGs as they were set by the server"
# (operations/composition_create.yaml L6-7) — a released conflict adjudicated
# in register AMB-166: the DOCS TEXT wins, so `present?` is the honest
# declaration. The closed matcher vocabulary has no conditional value form, and
# turning a MAY into a presence assertion would exceed the release. What the
# echo would CONFIRM is asserted instead where it is executable: the case reads
# each collection back through its own tag route.
#
# The rest of the wire is the variant-less create binding's, for the same
# reasons (see I_EHR_COMPOSITION.create_composition.yaml): 201 +
# ETag/Last-Modified/Location per overview §"ETag and Last-Modified" and
# §Location, `Preference-Applied` a MAY under §Representation details
# negotiation.
# NOTE: header matchers and body selectors are EXECUTED assertions (#403,
# #415) — a violated declaration is a red row.
sm_operation: I_EHR_COMPOSITION.create_composition
its: its-rest
variant: item_tag_headers
request:
  method: POST
  path: /ehr/{ehr_id}/composition
  body: composition
  headers:
    Prefer: "return=representation"
    openehr-item-tag: 'key="category",value="final"'          # §openehr-item-tag example syntax; VERSIONED_OBJECT target
    openehr-version-item-tag: 'key="reviewed",value="true"'   # §openehr-version-item-tag; the committed VERSION target
formats: [canonical-json]
outcomes:
  created:
    status: 201                           # responses/201_COMPOSITION.yaml
    headers:
      ETag: 'pattern:W/"<versioned_object_uid>::<system_id>::1"'
      Last-Modified: present
      Location: present
      Content-Type: negotiated
      Preference-Applied: "present?"      # MAY — overview §Representation details negotiation
      openehr-item-tag: "present?"        # MAY — §Usage in Responses ("Servers MAY include …")
      openehr-version-item-tag: "present?"
    body: prefer_conditional
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
  versioned_object_uid:
    from: capture version_uid
    transform: root-uid
server_assigned: [uid, context/_uid, "composer/external_ref", territory/terminology_id]
