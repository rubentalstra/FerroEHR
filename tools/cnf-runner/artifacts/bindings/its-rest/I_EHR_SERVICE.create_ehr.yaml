# Wire realization of I_EHR_SERVICE.create_ehr for ITS-REST 1.1.0.
# Sources: specifications/operations/ehr_create.yaml (+ ehr_create_with_id),
# responses/201_EHR.yaml, 400.yaml, 409_EHR.yaml; overview
# Requests_and_responses.
sm_operation: I_EHR_SERVICE.create_ehr
its: its-rest
applies: { its_rest: ">=1.0.0" }
request:
  method: POST
  path: /ehr
  body: ehr_status?                       # optional EHR_STATUS (ehr_create.yaml)
  headers:
    Prefer: "return=representation"       # default is return=minimal (Prefer.yaml); ask for the body
formats: [canonical-json, canonical-xml]  # EHR resource is canonical-only (Accept_canonical)
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# The `ETag` weakness indicator is a MUST, not a style note — ITS-REST overview
# `Requests_and_responses.md` §Deprecated headers: "The `ETag` response header
# was used without a weakness indicator `W/`. This is now deprecated, all
# `ETag` headers that hold a resource identifier MUST include a weakness
# indicator `W/`" (§"ETag and Last-Modified" gives the shape:
# `ETag: W/"8849182c-…::openEHRSys.example.com::2"`). The matcher asserts the
# weak entity-tag envelope only; the identifier INSIDE it is left unconstrained
# because the same section makes the source a choice ("usually taken from e.g.
# VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc.").
outcomes:
  created:
    status: 201                           # 201_EHR.yaml
    headers: { ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } }, Last-Modified: present, Location: present }
    body: prefer_conditional              # oneOf [Ehr | {uid} | empty] per Prefer
  already_exists:
    status: 409                           # 409_EHR.yaml (subject/ehr_id conflict)
  bad_request:
    # The PARSE class the operation itself declares: `ehr_create.yaml` lists
    # '400' -> `responses/400.yaml`, "returned when the request could not be
    # parsed or is invalid (e.g. ... syntactically invalid header, parameter
    # or content)". An EHR_STATUS body missing a member the release's own
    # request-body schema declares `required` never converts to the resource
    # `responses/422.yaml` presupposes, so it lands here, not on 422.
    status: 400
    body: error_loose
  validation_failed:
    status: 422                           # ITS-REST overview §HTTP status codes — 422 = semantic errors
captures:
  ehr_id:
    from: body "ehr_id.value"
    fallback: header Location last-segment
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [ehr_id, system_id, time_created, ehr_status/uid, ehr_access]
