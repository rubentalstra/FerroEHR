    this — our own design/extension
  ambiguity: AMB-37
request:
  method: GET
  path: /definition/archetype/adl2
  headers:
    Accept: application/json
formats: [canonical-json]
# NO `applies:` floor rides on these expectations — a floor dates a RELEASED
