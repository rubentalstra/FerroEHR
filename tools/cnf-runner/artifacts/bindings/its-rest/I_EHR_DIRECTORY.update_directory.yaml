# Wire realization of I_EHR_DIRECTORY.update_directory for ITS-REST 1.1.0.
# The SM update_directory(ehr_id, a_dir_struct) replaces the directory with a
# new complete FOLDER; realized as PUT /ehr/{ehr_id}/directory. The existing
# latest version_uid (SM preceding_version_uid) is the required `If-Match`
# header (ITS-REST overview §If-Match); it is omitted only for the empty-EHR / bad-EHR cases where no
# directory version exists to match.
# Sources: specifications/operations/directory_update.yaml (200/204/400/404/412),
# responses/200_directory_updated.yaml, 204_version_updated.yaml,
# 404_unknown_ehr_id.yaml, 412_directory.yaml; header If-Match.yaml,
# ETag_FOLDER.yaml.
sm_operation: I_EHR_DIRECTORY.update_directory
its: its-rest
request:
  method: PUT
  path: /ehr/{ehr_id}/directory
  body: directory
  headers:
    If-Match: '"${preceding_version_uid?}"'   # REQUIRED when a directory exists (If-Match.yaml); realizes SM preceding_version_uid (ITS-REST overview §If-Match)
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml]
# The `ETag` weakness indicator is a MUST, not a style note — ITS-REST overview
# `Requests_and_responses.md` §Deprecated headers: "The `ETag` response header
# was used without a weakness indicator `W/`. This is now deprecated, all
# `ETag` headers that hold a resource identifier MUST include a weakness
# indicator `W/`" (§"ETag and Last-Modified" gives the shape:
# `ETag: W/"8849182c-…::openEHRSys.example.com::2"`). The matcher asserts the
# weak entity-tag envelope only; the identifier INSIDE it is left unconstrained
# because the same section makes the source a choice ("usually taken from e.g.
# VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc.").
outcomes:
  updated:
    status: 200                           # 204 when Prefer minimal (204_version_updated.yaml)
    headers: { ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } } }   # ETag_FOLDER.yaml
    body: prefer_conditional
  validation_failed:
    # An RM-invalid FOLDER is well-formed JSON that breaks an RM rule, so the
    # SEMANTIC row of the released status table describes it and the syntactic
    # one does not — ITS-REST overview Requests_and_responses.md §HTTP status
    # codes: "422 | Unprocessable Entity | The request was well-formed but was
    # unable to be followed due to semantic errors" versus "400 | Bad Request |
    # … (e.g., malformed request syntax, syntactically invalid content)".
    # The SM ground is the same on this seam as on create: i_ehr_directory.adoc
    # §update_directory carries `Pre_content_valid: valid_content(a_dir_struct)`
    # and declares the error `content_invalid`, so the refusal is required, not
    # merely permitted.
    # WHY 422 AND NOT THE OAS 400 that `directory_update.yaml` declares: that
    # response file scopes ITSELF to input that does not parse ("the request
    # could not be parsed or is invalid (e.g. malformed request URL syntax,
    # missing required header or parameter, or syntactically invalid header,
    # parameter or content)" — `responses/400.yaml`), and an RM-invalid FOLDER
    # parses fine, so the OAS never grounds this branch even as a tier-2
    # source. The docs-text 422 row does describe it, and §HTTP status codes
    # permits "Additional status codes … as long as they do not conflict with
    # the predefined codes". This mirrors the identical correction already
    # carried on I_EHR_DIRECTORY.create_directory, and the same mapping the
    # rest of the catalogue uses for this defect class
    # (I_EHR_SERVICE.create_ehr, I_EHR_COMPOSITION.create_composition,
    # I_EHR_STATUS.*-invalid_body). The 400 that REMAINS correct on this
    # binding is `precondition_missing` below — a MISSING required header,
    # which the 400 row does describe.
    status: 422
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  precondition_failed:
    status: 412                           # 412_directory.yaml (stale If-Match)
    headers: { ETag: latest-version-uid }
  precondition_missing: { status: 400 }   # If-Match absent when required -> 400.yaml (overview Requests_and_responses)
  not_found: { status: 404 }              # unknown ehr_id, or an EHR with no directory to update (RM ehr §EHR.directory 0..1) — ITS-REST overview §HTTP status codes: 404 = target resource not found; If-Match precedence per RFC 9110 §13.2.2
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
server_assigned: [uid]
