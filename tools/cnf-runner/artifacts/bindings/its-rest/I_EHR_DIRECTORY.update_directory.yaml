# Wire realization of I_EHR_DIRECTORY.update_directory for ITS-REST 1.1.0.
# The SM update_directory(ehr_id, a_dir_struct) replaces the directory with a
# new complete FOLDER; realized as PUT /ehr/{ehr_id}/directory. The existing
# latest version_uid (SM preceding_version_uid) is the required `If-Match`
# header (ITS-REST overview §If-Match); it is omitted only for the empty-EHR / bad-EHR cases where no
# directory version exists to match.
# Sources: specifications/operations/directory_update.yaml (200/204/400/404/412),
# responses/200_directory_updated.yaml, 204_version_updated.yaml, 400.yaml,
# 404_unknown_ehr_id.yaml, 412_directory.yaml; header If-Match.yaml,
# ETag_FOLDER.yaml.
sm_operation: I_EHR_DIRECTORY.update_directory
its: its-rest
request:
  method: PUT
  path: /ehr/{ehr_id}/directory
  body: directory
  headers:
    If-Match: '"${preceding_version_uid?}"'   # REQUIRED when a directory exists (If-Match.yaml); realizes SM preceding_version_uid (ITS-REST overview §If-Match)
    Prefer: "return=representation"
formats: [canonical-json, canonical-xml]
# The `ETag` weakness indicator is a MUST, not a style note — ITS-REST overview
# `Requests_and_responses.md` §Deprecated headers: "The `ETag` response header
# was used without a weakness indicator `W/`. This is now deprecated, all
# `ETag` headers that hold a resource identifier MUST include a weakness
# indicator `W/`" (§"ETag and Last-Modified" gives the shape:
# `ETag: W/"8849182c-…::openEHRSys.example.com::2"`). The matcher asserts the
# weak entity-tag envelope only; the identifier INSIDE it is left unconstrained
# because the same section makes the source a choice ("usually taken from e.g.
# VERSIONED_OBJECT.uid.value, VERSION.uid.value, EHR.ehr_id.value, etc.").
outcomes:
  bad_request:
    # The PARSE class: a body missing a member the release's own request-body
    # schema declares `required` (e.g. `schemas/common/Locatable.yaml`
    # `required: [name, archetype_node_id]`) is invalid CONTENT.
    # `responses/400.yaml` scopes 400 to "syntactically invalid header,
    # parameter or content"; `responses/422.yaml` scopes 422 to content that
    # "could be converted to a resource". Such a body never converts.
    # Same wire code as `precondition_missing` below; kind distinguished by
    # fixture (an absent If-Match vs an unconvertible body).
    status: 400                           # operations/directory_update.yaml '400' -> responses/400.yaml
    body: error_loose
  updated:
    status: 200                           # 204 when Prefer minimal (204_version_updated.yaml)
    headers: { ETag: { match: 'pattern:W/"[^"]+"', applies: { its_rest: ">=1.1.0" } } }   # ETag_FOLDER.yaml
    body: prefer_conditional
  validation_failed:
    # The SEMANTIC class: a FOLDER that DOES convert to the resource and then
    # fails validation. `responses/422.yaml` scopes 422 to content that "could
    # be converted to a resource, but there are semantic validation errors";
    # `responses/400.yaml` owns the unconvertible half (`bad_request` above).
    # The SM ground for the refusal itself is the same on this seam as on
    # create: i_ehr_directory.adoc §update_directory carries
    # `Pre_content_valid: valid_content(a_dir_struct)` and declares the error
    # `content_invalid`, so the refusal is required, not merely permitted.
    status: 422
    body: error_loose                     # ITS-REST overview §HTTP status codes — for 4xx/5xx, services MAY return additional error details if Prefer: return=representation
  precondition_failed:
    status: 412                           # 412_directory.yaml (stale If-Match)
    headers: { ETag: latest-version-uid }
  precondition_missing: { status: 400 }   # If-Match absent when required -> 400.yaml (overview Requests_and_responses)
  not_found: { status: 404 }              # unknown ehr_id, or an EHR with no directory to update (RM ehr §EHR.directory 0..1) — ITS-REST overview §HTTP status codes: 404 = target resource not found; If-Match precedence per RFC 9110 §13.2.1 ("A server MUST ignore all received preconditions if its response to the same request without those conditions … would have been a status code other than a 2xx … or 412")
captures:
  version_uid:
    from: header ETag
    strip: weak-quotes
# The server-assigned uid, at EVERY FOLDER node: RM common locatable.adoc types
# `uid` `0..1` ("Optional globally unique object identifier for root points of
# archetyped structures") and RM common folder.adoc's NOTE recommends populating
# it only "in _top-level_ (i.e. tree-root) `FOLDER` objects" — a uid at a nested
# archetype-root FOLDER is permitted and unrequired, so it is a server
# assignment, never a content difference. `**` matches every depth of the
# recursive `folders: List<FOLDER>` shape.
server_assigned: ["**/uid"]
