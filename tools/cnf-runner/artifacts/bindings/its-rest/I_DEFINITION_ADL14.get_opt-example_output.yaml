# Wire realization of the ADL 1.4 "Get example data by template" endpoint,
# variant `example_output`: the NON-default `type` value. The variant-less
# example binding pins the released defaults (`type=input`,
# `detail_level=required`), so the other declared enum member needs its own
# realization — the binding request model carries query values literally.
#
# DOCS TEXT (ITS-REST specifications/operations/definition_template_adl1.4_example_get.yaml
# — for this API group the operation `description:` prose IS the released docs
# text, the `docs/definition/` chapter carrying no operation semantics): "The
# generated example can be either of type `input` (i.e., ready to be submitted
# to the repository) or `output` (as it would appear when retrieved from the
# repository). This behavior is controlled by the `type` query parameter."
# `parameters/query/example_type.yaml` declares the enum [input, output] with
# `input` as the default, so `output` is a declared, supported value and its
# response is the same 200 example instance.
#
# Register: AMB-115 (the unsupported-value branch of the same parameters).
sm_operation: I_DEFINITION_ADL14.get_opt
its: its-rest
variant: example_output
request:
  method: GET
  path: /definition/template/adl1.4/{template_id}/example
  query:
    type: output                         # parameters/query/example_type.yaml — the non-default enum member
    detail_level: required               # the released default, held constant so only `type` varies
formats: [canonical-json]
outcomes:
  ok:
    status: 200                          # the example instance in the negotiated format
    headers: { Content-Type: negotiated }
