# Wire realization of I_PARTY.update_party, variant `missing_if_match`: the
# party update sent WITHOUT the `If-Match` header the operation requires.
#
# DOCS TEXT (ITS-REST specifications/docs/overview/Requests_and_responses.md
# §"If-Match and accidental overwrites"): "When the service expects `If-Match`
# for an operation, but the client does not provide it, the service SHOULD
# respond with `400 Bad Request`." The party update is such an operation — its
# path carries the version CONTAINER id, not the preceding VERSION uid, which
# is the exact shape that section addresses ("This is only required by a small
# set of versioned resources in this specification, when the
# `preceding_version_uid` is not part of the endpoint path segment").
#
# Identical to the variant-less I_PARTY.update_party binding in every other
# respect (path, body, Prefer); only the absence of `If-Match` distinguishes
# the exchange, so a red row localizes to the missing-precondition rule alone.
# The variant-less binding keeps declaring the branch too — it is the same
# rule — but always sends the header, so it can never reach it.
sm_operation: I_PARTY.update_party
its: its-rest
variant: missing_if_match
request:
  method: PUT
  path: /demographic/person/{versioned_object_uid}
  body: party
  headers:
    Prefer: "return=representation"       # no If-Match — the behaviour under test
formats: [canonical-json]
outcomes:
  precondition_missing:
    status: 400                           # overview §If-Match and accidental overwrites — the SHOULD
