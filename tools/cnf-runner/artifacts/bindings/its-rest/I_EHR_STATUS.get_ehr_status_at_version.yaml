# Wire realization of I_EHR_STATUS.get_ehr_status_at_version for ITS-REST
# 1.1.0: the EHR_STATUS as it stood at an ADDRESSED version, realized as
# GET /ehr/{ehr_id}/ehr_status/{version_uid}.
#
# This is the operation's own realization, not a fold of another: SM
# i_ehr_status.adoc types `get_ehr_status_at_version` as returning an
# EHR_STATUS ("Get a particular version of an EHR Status object"), and this
# route is the one that serves an EHR_STATUS at a version — the
# versioned_ehr_status/version route serves the VERSION envelope instead
# (the SM-vs-ITS return-type mismatch AMB-72 records as defect 4).
#
# Sources (ITS-REST DOCS TEXT — the wire oracle, not the stalled OAS):
#   - the addressing form: overview Resources.md §Identifier types — "a
#     `version_uid` for identifying a VERSION from the version container,
#     stored under VERSION.uid.value, in a form of an OBJECT_VERSION_ID", and
#     §Multiple identifiers for the same resource, which contrasts the
#     "explicit version reference, using the _version_uid_ identifier" with
#     the "implicit latest version reference" of the id-less path — exactly
#     the pair this route and the variant-less get_ehr_status route form.
#   - `ok` 200: overview Requests_and_responses.md §HTTP status codes — "200 |
#     OK | The request succeeded, payload sent in a 200 response depends on the
#     request method".
#   - `not_found` 404: same table — "404 | Not Found | The origin service did
#     not find the target resource or is not willing to disclose that one
#     exists" (unknown ehr_id or unknown version_uid).
sm_operation: I_EHR_STATUS.get_ehr_status_at_version
its: its-rest
request:
  method: GET
  path: /ehr/{ehr_id}/ehr_status/{version_uid}
formats: [canonical-json]
# Header discipline on this outcome — ITS-REST overview
# `Requests_and_responses.md` §"ETag and Last-Modified" (the DOCS TEXT, the wire
# oracle): "Both `ETag` and `Last-Modified` SHOULD be included in responses for
# VERSION, VERSIONED_OBJECT, or other resources that have versioning or unique
# state identifiers", and "For openEHR resources, this value [Last-Modified]
# should be derived from `VERSION.commit_audit.time_committed.value`".
# NOTE: header matchers are EXECUTED assertions (#403, exec/headers.rs) — a
# violated declaration is a red row.
# `Location` MUST BE ABSENT on this outcome — ITS-REST overview
# `Requests_and_responses.md` §Location: "It MUST NOT be used to indicate an
# alternate representation of an existing resource (e.g. via `GET` method)".
outcomes:
  ok:
    status: 200
    headers:
      Content-Type: negotiated
      ETag: 'pattern:W/"[^"]+"'           # the weakness indicator is a MUST — overview §Deprecated headers
      Last-Modified: present
      Location: absent                    # read — overview §Location / §Deprecated headers
  not_found: { status: 404 }
captures:
  status_version_uid:
    from: header ETag
    strip: weak-quotes
