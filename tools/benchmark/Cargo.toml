[package]
name = "benchmark"
version.workspace = true
description = "Honest benchmark harness: ehrbase-rs vs EHRbase (Java) at the openEHR REST surface (docs/design/benchmarking.md)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
# The SUT client is REUSED from the conformance crate so the request path is
# provably identical for both targets (design §5) — the core fairness guarantee.
conformance = { path = "../conformance" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
jiff = { workspace = true }
# `process` (docker stats / docker exec / psql sampling in sample.rs) is not in
# the workspace default tokio feature set; enable it here on top of the shared pin.
tokio = { workspace = true, features = ["process"] }
hdrhistogram = { workspace = true }
sysinfo = { workspace = true }
# Concurrency-safe per-patient runtime table for the open-loop driver (drive.rs).
dashmap = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
