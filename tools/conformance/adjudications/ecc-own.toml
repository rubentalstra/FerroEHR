# ── LIMIT before ORDER BY: 2019-era corpus dialect → corpus-dialect (skip) ─────
# The AQL 1.1 grammar orders `orderByClause? limitClause?` (AqlParser.g4), so a
# query placing LIMIT before ORDER BY is invalid AQL and the golden is defective.
# The runner SKIPS these with the citation; the golden is never edited.

[[entry]]
ecc_id = "ECC-QRY-018"
disposition = "corpus-dialect"
reason = "Query A/107 (get_ehrs_top_5) places LIMIT before ORDER BY; invalid under the AQL 1.1 grammar (orderByClause? limitClause?), so the vendored golden is a 2019-dialect defect."
citation = "QUERY AqlParser.g4 selectQuery (orderByClause? limitClause?); CNF tests corpus aql_queries_valid/A/107_get_ehrs_top_5.json"

