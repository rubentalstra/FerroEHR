# Own-corpus adjudications — committed reclassification of vendored-data defects
# for OUR OWN baseline (register 07 §4 G-3; format documented in
# `src/model/adjudication.rs`). Applied by the runner (`src/engine/run.rs`) to
# every SUT, keyed by ECC id:
#
#   - corpus-dialect        → the vendored golden/query contradicts the pinned
#                             spec; the runner SKIPS the case with the citation
#                             (standing rule 3: the defective golden is never
#                             edited, only adjudicated here).
#   - spec-supersedes-corpus → the pinned spec's meaning replaces the corpus
#                             expectation; the case RUNS against the
#                             spec-derived expectation (documented here).
#
# The dedicated dialect cases are authored in `src/suites/query_golden.rs`
# (`DIALECT_CASES`); each body asserts the spec-derived reject (4xx) so the case
# is green whether or not the runner short-circuits it.
#
# ECC-id NOTE (fix-pass reconciliation): the QRY dialect cases are NEW slugs, so
# their ECC numbers are allocated by `REGEN_CATALOG=1` in registry order after
# the carried QRY-001..013. The ids below assume the allocation
# QRY-015..QRY-024 (query.rs appends `qry/advanced-order-by-limit` = QRY-014
# first, then query_golden.rs appends the ten dialect cases). Verify against
# `inventory/ecc-catalog.tsv` after regeneration and correct any drift — a
# mismatched key is a no-op (the corpus-dialect skip simply does not apply; the
# case body still asserts the spec-derived reject and stays green).

[meta]
description = "Own-corpus adjudications: AQL golden-dialect defects (spec-cited)."

# ── TIMEWINDOW: removed from the AQL 1.1 grammar → spec-supersedes-corpus ──────
# The corpus classifies these `TIMEWINDOW` queries as valid; AQL 1.1 removed the
# clause, so the spec-derived expectation is a 4xx rejection. The case RUNS
# against that expectation (the runner does not skip spec-supersedes-corpus).

[[entry]]
ecc_id = "ECC-QRY-015"
disposition = "spec-supersedes-corpus"
reason = "Golden A/109 (get_ehrs_within_timewindow) uses TIMEWINDOW, removed from AQL 1.1; the query must be rejected (4xx), not diffed against its void golden."
citation = "QUERY master00-amendment_record SPECQUERY-20 (remove TIMEWINDOW); CNF tests corpus aql_queries_valid/A/109_get_ehrs_within_timewindow.json"

