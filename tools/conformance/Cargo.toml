[package]
name = "conformance"
version = "0.1.0"
description = "openEHR CNF Platform Conformance Test Schedule runner (the ADR-008 acceptance instrument)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# The SIGN-* capability cases (design §4.6) recompute the version digest from the
# served VERSION's canonical form: `sha256:` + base64(SHA-256(canonical_form)),
# the exact format `ehrbase-signing` produces (docs/design/version-signing.md
# §3.2). Recomputed here (not pulled from `ehrbase-signing`) so the lean
# external-SUT CLI build stays free of the crypto stack.
sha2 = { workspace = true }
base64 = { workspace = true }

openehr-base = { path = "../../crates/openehr-base" }
openehr-its = { path = "../../crates/openehr-its" }
openehr-rm = { path = "../../crates/openehr-rm" }
# FLAT→canonical conversion for content cases whose ONLY constraining template
# ships a FLAT instance (no canonical composition): the harness converts the
# vendored FLAT deterministically via the same `from_flat` path the SUT's FLAT
# endpoint uses (design §4.5), then commits the canonical result + a mutated copy.
openehr-flat = { path = "../../crates/openehr-flat" }

[lints]
workspace = true
