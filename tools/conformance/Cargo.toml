[package]
name = "conformance"
version.workspace = true
description = "openEHR CNF Platform Conformance Test Schedule runner (the acceptance instrument)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
# The B4 `TS` area spins up a hermetic FHIR-tx fixture server (canned
# $expand/$validate-code/$lookup/$subsumes + fault injection) the runner hosts
# and records the exchange from — a runtime dependency, not just a test tool.
# tools/conformance is a dev/verification crate (publish = false), not part of
# the shipped app.
wiremock = { workspace = true }
clap = { workspace = true }
# The upstream fairness adjudication register (X1) is a committed TOML file
# loaded at run time for non-ehrbase-rs SUTs; it only reclassifies cases
# (extension / rm-version-sensitive → NotApplicable, defect → stays a failure),
# never edits one.
toml = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# The SIGN-* capability cases recompute the version digest from the
# served VERSION's canonical form: `sha256:` + base64(SHA-256(canonical_form)),
# the exact format `ehrbase-signing` produces.
# Recomputed here (not pulled from `ehrbase-signing`) so the lean
# external-SUT CLI build stays free of the crypto stack.
sha2 = { workspace = true }
base64 = { workspace = true }
# Percent-encode a `template_id` path segment (e.g. "International Patient
# Summary") — never hand-roll a percent codec (owner rule).
urlencoding = { workspace = true }

openehr-base = { path = "../../crates/openehr-base" }
openehr-its = { path = "../../crates/openehr-its" }
openehr-rm = { path = "../../crates/openehr-rm" }
# FLAT→canonical conversion for content cases whose ONLY constraining template
# ships a FLAT instance (no canonical composition): the harness converts the
# vendored FLAT deterministically via the same `from_flat` path the SUT's FLAT
# endpoint uses (design §4.5), then commits the canonical result + a mutated copy.
openehr-flat = { path = "../../crates/openehr-flat" }

[lints]
workspace = true
