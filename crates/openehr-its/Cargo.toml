[package]
name = "openehr-its"
version = "0.1.0"
description = "openEHR ITS (Implementation Technology Specifications): canonical JSON + XML serialization, ITS-REST OpenAPI contract, ITS-BMM. Mirrors the specifications-ITS-{JSON,XML,REST,BMM} repos."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
jsonschema.workspace = true
base64.workspace = true
uuid.workspace = true
# The generated `opt14` model keeps `StringDictionaryItem` groups in
# document order (XSD ordered sequence; F-09-05) — order-preserving map.
indexmap.workspace = true
# The generated ITS-REST contract: an async_trait server trait + axum-typed DTOs.
async-trait.workspace = true
axum.workspace = true
http.workspace = true
# The generated XML (de)serializers impl the crate's ToXml/FromXml traits for the
# RM/BASE spec types, so these are real (non-dev) deps (ADR-005).
openehr-base = { path = "../openehr-base" }
openehr-rm = { path = "../openehr-rm" }

[dev-dependencies]
serde_json.workspace = true
# The opt14↔am14 divergence sentinel (`tests/opt14_am14_divergence.rs`,
# ADR-009) exhaustively matches both constraint models so a spec bump that
# grows either one fails the build until reconciled.
openehr-am = { path = "../openehr-am" }

[lints]
workspace = true
