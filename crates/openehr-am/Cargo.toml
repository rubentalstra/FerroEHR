[package]
name = "openehr-am"
version = "2.4.0"                 # = the implemented openEHR spec version: AM 2.4.0 (also carries the AM 1.4 profile as am14)
description = "openEHR AM: Archetype Model 1.4.0 (am14) + 2.4.0 (am24), generated from BMM"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
openehr-base = { path = "../openehr-base" }
openehr-lang = { path = "../openehr-lang" }
# Canonical-JSON (de)serialization is EMITTED manual `serde` impls on the spec
# types (`openehr-codegen -- emit-json`, into `src/json_serde.rs`) — never a
# derive. `serde_json` also carries the untyped `Value` fields the generator
# emits for cross-schema-`Any` slots.
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
