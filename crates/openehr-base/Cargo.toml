[package]
name = "openehr-base"
version = "1.3.0"                 # = the implemented openEHR spec version: BASE 1.3.0
description = "openEHR BASE 1.3.0: foundation + base types (generated from BMM)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# No serde: the spec types are plain data records; canonical-JSON
# (de)serialization is the native `ToJson`/`FromJson` codec in `openehr-its`.
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
