[package]
name = "openehr-base"
version = "0.0.2"
description = "openEHR BASE 1.3.0: foundation + base types (generated from BMM)"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/openehr-base"
readme = "README.md"
keywords = ["openehr", "healthcare", "ehr", "foundation", "types"]
categories = ["data-structures", "science"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE-2.0"]

[dependencies]
# Canonical-JSON (de)serialization is EMITTED serde impls (`openehr-codegen --
# emit-json`) on the spec types themselves — the standard traits, in manual
# form, never a derive: the wire contract (`_type` first, BMM declaration
# order, absent-not-null, `_type`-keyed polymorphic dispatch) is not
# expressible with serde's built-in representations. `serde_support` is the
# small hand-written runtime those impls share; `serde_json` backs its
# out-of-order `_type` buffering.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
