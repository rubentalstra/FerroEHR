[package]
name = "openehr-rm"
version = "1.2.0"                 # = the implemented openEHR spec version: RM 1.2.0
description = "openEHR RM 1.2.0 Reference Model, generated from BMM"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
openehr-base = { path = "../openehr-base" }
# The terminology-backed RM class invariants (`validate::terminology`) resolve
# openEHR terminology groups + code sets against the vendored TERM 3.1.0 bundle.
# `openehr-term` itself depends only on `openehr-base`, so this is acyclic.
openehr-term = { path = "../openehr-term" }
# Canonical-JSON (de)serialization is EMITTED manual `serde` impls on the spec
# types (`openehr-codegen -- emit-json`, into `src/json_serde.rs`) — never a
# derive. `serde_json` also backs the untyped `Value` RM representation used by
# the hand-written path/validation helpers; `serde_jcs` canonicalises the
# already-assembled `Value` for `VERSION.canonical_form()`.
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
# The typed-dispatch tier (`validate::typed_dispatch`) re-reads a failing node
# with the path tracker so a refusal names the offending JSON node, exactly as
# the canonical-JSON entry points do.
serde_path_to_error.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
# The canonical-JSON codec lives in `openehr-its` (the spec types no longer
# carry serde derives); the dispatch tests exercise it directly. This is a
# dev-only dependency cycle (openehr-its depends on openehr-rm), which cargo
# permits for dev-dependencies.
openehr-its = { path = "../openehr-its" }
insta.workspace = true
jsonschema.workspace = true

[features]
ehr-extract = []

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
