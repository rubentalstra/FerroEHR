[package]
name = "openehr-rm"
version = "0.1.0"
description = "openEHR RM 1.2.0 Reference Model, generated from BMM (ADR-004)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openehr-base = { path = "../openehr-base" }
openehr-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
jsonschema.workspace = true

[features]
ehr-extract = []

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
