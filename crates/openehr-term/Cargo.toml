[package]
name = "openehr-term"
version = "0.0.20"
description = "openEHR TERM terminology data model, generated from BMM (generation v3_1 = TERM 3.1.0), plus the embedded official terminology XML bundle"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/openehr-term"
readme = "README.md"
keywords = ["openehr", "terminology", "healthcare", "ehr", "vocabulary"]
categories = ["data-structures", "science"]
include = ["src/**", "assets/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE-2.0"]

[dependencies]
openehr-base = { path = "../openehr-base", version = "0.0.20" }
# Canonical-JSON (de)serialization is EMITTED manual `serde` impls on the spec
# types (`openehr-codegen -- emit-json`, into `src/json_serde.rs`) — never a
# derive.
serde.workspace = true
# Hand-written terminology loader (bundle.rs): read-only XML DOM + error type.
roxmltree.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The XSD structural-conformance suite (tests/it) re-parses the vendored
# assets against the vendored schemas' rules.
roxmltree.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
