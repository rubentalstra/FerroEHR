[package]
name = "openehr-term"
version = "3.1.0"                 # = the implemented openEHR spec version: TERM 3.1.0
description = "openEHR TERM 3.1.0 terminology data model, generated from BMM; vendored terminology XML in assets/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
openehr-base = { path = "../openehr-base" }
# No serde: the spec types are plain data records; the terminology data model
# carries no untyped `Any` field, so neither `serde` nor `serde_json` is needed.
# Hand-written terminology loader (bundle.rs): read-only XML DOM + error type.
roxmltree.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
