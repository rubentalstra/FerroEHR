[package]
name = "openehr-lang"
version = "1.0.0"                 # = the implemented openEHR spec version: LANG 1.0.0
description = "openEHR LANG 1.1.0: BMM/P_BMM object model, generated from BMM (ADR-004). ODIN + EL parsers are future hand-written runtime work (P8/P9)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openehr-base = { path = "../openehr-base" }
openehr-derive.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
