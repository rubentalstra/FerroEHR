[package]
name = "openehr-lang"
version = "0.0.7"
description = "openEHR LANG 1.0.0: BMM/P_BMM object model (generated from BMM) plus a hand-written ODIN instance parser (the `odin` module — deliberately off the codegen path)."
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/openehr-lang"
readme = "README.md"
keywords = ["openehr", "bmm", "odin", "metamodel", "parser"]
categories = ["parser-implementations", "data-structures"]
include = ["src/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE-2.0"]

[dependencies]
openehr-base = { path = "../openehr-base", version = "0.0.7" }
# Canonical-JSON (de)serialization is EMITTED manual `serde` impls on the
# generated types (`openehr-codegen -- emit-json`, into `src/json_serde.rs`) —
# never a derive. `serde_json` also carries the untyped `Value` fields the
# generated P_BMM/BEOM types hold and backs the BEL `to_json` builder.
serde.workspace = true
serde_json.workspace = true
logos.workspace = true       # DFA lexer for the ODIN instance parser (odin module)
chumsky.workspace = true     # combinator parser for ODIN (odin.g4 / odin_values.g4)
thiserror.workspace = true   # typed OdinError
indexmap.workspace = true    # insertion-ordered ODIN objects

[dev-dependencies]
# Temp-directory fixtures for the rm_access schema-repository tests (the one
# module that exercises real filesystem scanning).
assert_fs.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
