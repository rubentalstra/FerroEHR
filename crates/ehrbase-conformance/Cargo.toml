[package]
name = "ehrbase-conformance"
version = "0.1.0"
description = "openEHR CNF Platform Conformance Test Schedule runner (the ADR-008 acceptance instrument)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

openehr-its = { path = "../openehr-its" }
openehr-rm = { path = "../openehr-rm" }

# `self-host` mode: boot the real application (testcontainers PG18 + the axum
# app) in-process, so the runner can drive a SUT it controls end to end without
# an external deployment. Kept optional so the CLI can be built lean for
# external-SUT-only use (design §4.1, §4.3).
ehrbase = { path = "../ehrbase", optional = true }
ehrbase-rest = { path = "../ehrbase-rest", optional = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[features]
self-host = [
    "dep:ehrbase",
    "dep:ehrbase-rest",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
]

[lints]
workspace = true
