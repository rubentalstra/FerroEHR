[package]
name = "openehr-flat"
version.workspace = true
description = "openEHR Simplified Formats: FLAT / STRUCTURED data instances and the Web Template model (ITS-REST simplified_formats)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openehr-rm = { path = "../openehr-rm" }
openehr-its = { path = "../openehr-its" }
openehr-am = { path = "../openehr-am" }
openehr-base = { path = "../openehr-base" }
openehr-term = { path = "../openehr-term" }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
moka = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
# The ADL2 → OPT compiler, used only by the am24 Web-Template builder tests to
# turn real ADL2 corpus sources into operational templates (dev-only; the
# production am24 front end takes an already-created OPT as input).
openehr-adl = { path = "../openehr-adl" }

[lints]
workspace = true
