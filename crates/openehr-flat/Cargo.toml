[package]
name = "openehr-flat"
version.workspace = true
description = "openEHR Simplified Formats: FLAT / STRUCTURED data instances and the Web Template model (ITS-REST simplified_formats)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openehr-rm = { path = "../openehr-rm" }
openehr-its = { path = "../openehr-its" }
openehr-am = { path = "../openehr-am" }
openehr-term = { path = "../openehr-term" }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
moka = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
fancy-regex = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `openehr-am` is wired for the (later) FLAT/ADL2 paths; not consumed yet.
ignored = ["openehr-am"]
