[package]
name = "ehrbase-audit"
version = "0.1.0"
description = "IHE ATNA audit trail (DICOM PS3.15 AuditMessage over RFC 5424 syslog) for the ehrbase-rs CDR"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# DICOM AuditMessage XML (NOT openEHR ITS-XML — the DICOM PS3.15 §A.5 schema).
quick-xml = { workspace = true }

# Async runtime + transports (UDP/TLS syslog).
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }

# Time (ISO-8601 UTC EventDateTime + syslog TIMESTAMP).
jiff = { workspace = true }

# Config (figment) + serde.
serde = { workspace = true }
figment = { workspace = true }

# Errors, tracing, metrics.
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
insta = { workspace = true }
figment = { workspace = true, features = ["test"] }
# The total-coverage table guard walks the generated ITS-REST ROUTES tables
# (read-only spec crate, dev-only — no runtime dependency on openehr-its).
openehr-its = { path = "../openehr-its" }

[lints]
workspace = true
