[package]
name = "ehrbase"
version = "0.1.0"
description = "EHRbase server binary: persistence, AQL execution engine (ASL), versioning, contributions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
figment.workspace = true
jiff.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Observability (telemetry init): the OTLP export layer + metrics facade +
# Prometheus recorder. The single `tracing` API fans out to stdout logs and
# (opt-in) OTLP spans; `metrics` is pulled via the Prometheus recorder.
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
jiff-sqlx.workspace = true
sea-query.workspace = true
sea-query-sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true

openehr-base = { path = "../openehr-base" }
openehr-term = { path = "../openehr-term" }
openehr-rm = { path = "../openehr-rm" }
openehr-its = { path = "../openehr-its" }
openehr-lang = { path = "../openehr-lang" }
openehr-am = { path = "../openehr-am" }
openehr-flat = { path = "../openehr-flat" }
openehr-query = { path = "../openehr-query" }
ehrbase-rest = { path = "../ehrbase-rest" }
ehrbase-compat = { path = "../ehrbase-compat" }
ehrbase-audit = { path = "../ehrbase-audit" }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
insta.workspace = true
ehrbase-rest = { path = "../ehrbase-rest" }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
# The in-memory OTLP exporters for the export-pipeline smoke tests.
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "testing"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Wired for later phases, not consumed yet: ehrbase-compat (P17 EhrScape),
# openehr-am (ADL2), openehr-lang (BMM at runtime).
ignored = ["ehrbase-compat", "openehr-am", "openehr-lang"]
