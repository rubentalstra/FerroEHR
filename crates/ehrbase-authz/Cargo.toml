[package]
name = "ehrbase-authz"
version = "0.1.0"
description = "Access control (RBAC + ABAC) for the ehrbase-rs CDR: operation classification, role model, and the policy-decision seam"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Config (figment) + serde; JSON claim-set navigation for role extraction.
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }

# Errors + logging + metrics.
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }

# ABAC (§5.4–5.6): the async PDP seam, the embedded Cedar engine, the
# v1-compatible remote PDP client, and hot-reload swap.
async-trait = { workspace = true }
cedar-policy = { workspace = true }
reqwest = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
# The total-coverage classification guard walks the generated ITS-REST ROUTES
# tables (read-only spec crate, dev-only — no runtime dependency on openehr-its;
# the same trick as ehrbase-audit).
openehr-its = { path = "../openehr-its" }
# ABAC engine tests: the RemotePdp wire-contract suite + the Cedar/remote
# differential suite.
wiremock = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
