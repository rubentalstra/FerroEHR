<svg xmlns="http://www.w3.org/2000/svg" width="205" height="56" viewBox="0 0 205 56" role="img" aria-label="FerroEHR">
  <!-- FerroEHR theme-adaptive lockup: switches light/dark via prefers-color-scheme,
       for contexts that render one SVG in both themes (README, landing page). -->
  <style>
    .tile{fill:#21262B}.fe{fill:#F2F1EF}.pulse{stroke:#D97742}.ferro{fill:#21262B}.ehr{fill:#B7431B}
    @media (prefers-color-scheme: dark){
      .tile{fill:#B7431B}.fe{fill:#FFF6F0}.pulse{stroke:#FFD9C2}.ferro{fill:#F2F1EF}.ehr{fill:#D97742}
    }
  </style>
  <rect class="tile" x="2" y="4" width="48" height="48" rx="10"/>
  <text class="fe" x="24.5" y="37.5" font-family="'Avenir Next',Avenir,Futura,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle">Fe</text>
  <polyline class="pulse" points="10,14 14,14 16.4,9.4 18.8,17.4 21.2,12.6 23,14 28,14" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="ferro" x="62" y="39" font-family="'Avenir Next',Avenir,Futura,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="600">Ferro<tspan class="ehr" font-weight="700">EHR</tspan></text>
</svg>
