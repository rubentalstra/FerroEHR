# Workspace nextest configuration.
#
# PostgreSQL is NOT a per-test container anymore: every DB-backed test takes
# a template-database clone from the shared server via `tools/testkit`, so
# the bulk of the suite parallelizes freely. Only the broker/blob suites
# (RabbitMQ, SeaweedFS testcontainers per test) stay serialized: under a
# full-workspace run several brokers otherwise start concurrently and
# broker-delivery / gateway-readiness deadlines flake on host contention
# (observed 2026-07-13/14 before the harness rewrite). Assertions are
# unchanged — only scheduling is constrained, plus ONE retry so a single
# container-startup hiccup on a loaded runner doesn't fail the suite. A
# genuine regression still fails: it fails both attempts, deterministically.
#
# The three container suites used to be their own integration-test BINARIES, so
# the override matched `binary(...)`. They are now topic MODULES of the single
# `ehrbase` integration binary (`app/ehrbase/tests/it/`), so the override
# matches the module prefix of the test name instead: nextest test names are the
# Rust path inside the binary (`events_amqp::publishes_...`), the `test()`
# predicate matches that whole string, and `/…/` is a regex matcher
# (https://nexte.st/docs/filtersets/reference/). Scoping with
# `package(ehrbase) & binary(it)` keeps a same-named module in another crate's
# `it` binary out of the group. Group membership is therefore unchanged: exactly
# the tests of those three suites, serialized, with one retry.
[test-groups.containers]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(ehrbase) & binary(it) & test(/^(events_amqp|fhir_outbound_amqp|multimedia_s3)::/)'
test-group = 'containers'
retries = 1

# Surface the next slow-test regression immediately instead of letting the
# suite silently grow: nextest flags any test past 60 s as SLOW (no
# termination — flagging only).
[profile.default]
slow-timeout = { period = "60s" }

# CI: never stop at the first failure — the full failure surface in one run.
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s" }

[[profile.ci.overrides]]
filter = 'package(ehrbase) & binary(it) & test(/^(events_amqp|fhir_outbound_amqp|multimedia_s3)::/)'
test-group = 'containers'
retries = 1
