# Dual-stack benchmark comparison (docs/design/benchmarking.md §6): ehrbase-rs
# and the reference EHRbase (Java), each with its own PostgreSQL, on distinct
# ports so the harness can drive them one at a time.
#
# Both are configured with HTTP Basic auth (user ehrbase / pass ehrbase) — no
# Keycloak — so the two servers are exercised through the identical credential
# path (config-parity, §3.4). Bring a stack up, benchmark it, take it down;
# `run.sh` does exactly that. Images are pinned by tag; record the digests in
# the report's environment block.
#
# All services share one explicit network so each app resolves its database by
# service name (Compose's default network would also do this; the explicit
# declaration mirrors the reference EHRbase compose and removes any ambiguity).
networks:
  benchmark-net: {}

services:
  # ── ehrbase-rs (this project) ───────────────────────────────────────────────
  ehrbase-rs-db:
    image: ${EHRBASE_RS_POSTGRES_IMAGE:-ghcr.io/rubentalstra/ehrbase-rs-postgres:develop}
    # PG tuning parity (benchmarking.md §3.4): the identical settings are passed
    # to BOTH SUTs' databases below — container-default shared_buffers (128MB)
    # and max_wal_size (1GB) throttle a write-heavy benchmark with buffer
    # eviction + constant checkpoints, so both sides get the same sane floor.
    # shm parity: Docker's default 64MB /dev/shm starves PostgreSQL's dynamic
    # shared memory (parallel workers erroring `could not resize shared memory
    # segment … No space left on device` — observed 5× on the upstream stack
    # 2026-07-14, twice inside measured windows). Both SUT databases get the
    # same 1GB floor.
    shm_size: ${BENCH_PG_SHM_SIZE:-1gb}
    command:
      - postgres
      - -c
      - shared_buffers=${BENCH_PG_SHARED_BUFFERS:-1GB}
      - -c
      - max_wal_size=${BENCH_PG_MAX_WAL_SIZE:-4GB}
      - -c
      - work_mem=${BENCH_PG_WORK_MEM:-16MB}
    environment:
      POSTGRES_PASSWORD: postgres
      # DB-container app-role password (init script); outside the server's
      # reserved EHRBASE_ namespace.
      PG_INIT_PASSWORD: ehrbase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [benchmark-net]
    profiles: ["rs"]

  ehrbase-rs:
    image: ${EHRBASE_RS_IMAGE:-ghcr.io/rubentalstra/ehrbase-rs:develop}
    depends_on:
      ehrbase-rs-db:
        condition: service_healthy
    environment:
      # The mounted ehrbase.dev.toml is auto-discovered at
      # /etc/ehrbase/ehrbase.toml (config search-order position 4); these
      # EHRBASE_ env overrides use the mechanical `__` mapping and beat the file.
      EHRBASE__DB__URL: postgres://ehrbase:ehrbase@ehrbase-rs-db:5432/ehrbase
      # Pool parity with the upstream stack's HikariCP ceiling below — this
      # forward was missing, silently pinning published-image runs to the
      # app default (20) while upstream got BENCH_DB_POOL.
      EHRBASE__DB__MAX_CONNECTIONS: ${BENCH_DB_POOL:-10}
      # Admission parity (see scripts/benchmark.sh): raised so overload fails
      # as queueing latency like upstream's Tomcat window, not shed 503s.
      EHRBASE__SERVER__MAX_IN_FLIGHT: ${BENCH_RS_MAX_IN_FLIGHT:-2048}
    volumes:
      - ../ehrbase.dev.toml:/etc/ehrbase/ehrbase.toml:ro
    ports:
      - "8090:8080"
    networks: [benchmark-net]
    profiles: ["rs"]

  # ── EHRbase (Java, the reference implementation) ────────────────────────────
  ehrbase-java-db:
    image: ${EHRBASE_JAVA_POSTGRES_IMAGE:-ehrbase/ehrbase-v2-postgres:16.2}
    # Identical PG tuning to ehrbase-rs-db above (benchmarking.md §3.4 — same
    # DB settings both sides; the PG major difference 16 vs 18 is each SUT's
    # own shipped platform and is recorded in the report's environment block).
    # shm parity — see ehrbase-rs-db above (this stack is where the 64MB
    # default was caught erroring mid-window).
    shm_size: ${BENCH_PG_SHM_SIZE:-1gb}
    command:
      - postgres
      - -c
      - shared_buffers=${BENCH_PG_SHARED_BUFFERS:-1GB}
      - -c
      - max_wal_size=${BENCH_PG_MAX_WAL_SIZE:-4GB}
      - -c
      - work_mem=${BENCH_PG_WORK_MEM:-16MB}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EHRBASE_USER_ADMIN: ehrbase
      EHRBASE_PASSWORD_ADMIN: ehrbase
      EHRBASE_USER: ehrbase_restricted
      EHRBASE_PASSWORD: ehrbase_restricted
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [benchmark-net]
    profiles: ["java"]

  ehrbase-java:
    image: ${EHRBASE_JAVA_IMAGE:-ehrbase/ehrbase:2.34.0}
    depends_on:
      ehrbase-java-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://ehrbase-java-db:5432/ehrbase
      DB_USER_ADMIN: ehrbase
      DB_PASS_ADMIN: ehrbase
      DB_USER: ehrbase_restricted
      DB_PASS: ehrbase_restricted
      # Basic auth. The clinical user is `ehrbase`/`ehrbase` (what the harness
      # drives, matching ehrbase-rs's dev credentials — config parity §3.4); the
      # admin user MUST have a distinct username or EHRbase's in-memory user
      # store fails to start ("user should not exist").
      SECURITY_AUTHTYPE: BASIC
      SECURITY_AUTHUSER: ehrbase
      SECURITY_AUTHPASSWORD: ehrbase
      SECURITY_AUTHADMINUSER: ehrbase-admin
      SECURITY_AUTHADMINPASSWORD: ehrbase
      # Allow template overwrite so repeat runs are idempotent.
      SYSTEM_ALLOWTEMPLATEOVERWRITE: "true"
      # Logging parity (benchmarking.md §3.4): warn during measured runs,
      # matching the ehrbase-rs side's EHRBASE__LOG__FILTER.
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      # HikariCP pool ceiling — raised in lockstep with ehrbase-rs's
      # EHRBASE__DB__MAX_CONNECTIONS (config parity; both default 10).
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${BENCH_DB_POOL:-10}
    ports:
      - "8091:8080"
    networks: [benchmark-net]
    profiles: ["java"]
