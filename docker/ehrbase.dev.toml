# Dev-only server configuration, mounted into the app container by
# docker-compose and pointed at via EHRBASE_REST_CONFIG.
#
# The out-of-the-box AuthConfig has authentication ENABLED but no configured
# mechanism, so every API request 401s until a user store is provided. This
# file ships ONE Basic-auth user so the quickstart authenticates out of the box.
#
# DEV DEFAULTS — do NOT use in production. The credentials are:
#   username: ehrbase
#   password: ehrbase   (stored below only as its Argon2id PHC hash)

bind = "0.0.0.0:8080"
cors_permissive = true

# Dev-only: expose the admin API (`DELETE /admin/...`) so the conformance
# suite's AdminApi cases run against the compose stack (they authenticate as
# the ADMIN-role user below). Production deployments keep this off unless
# operationally needed.
[admin]
enabled = true

[auth]
enabled = true

[[auth.basic.users]]
username = "ehrbase"
# Argon2id hash of the password "ehrbase".
password_hash = "$argon2id$v=19$m=4096,t=2,p=1$ZWhyYmFzZURldlNhbHQ$4Cf1W/JiP800r2sbj8/y0HbNAcwMb/YseM1fTINO3Dc"

# Dev-only ADMIN account for the admin API (`DELETE /admin/...`) and the
# conformance suite's AdminApi cases (scripts/conformance.sh CONF_ADMIN_AUTH
# defaults to it). Same dev password "ehrbase" (same hash); ADMIN + USER
# roles. Do NOT use in production.
[[auth.basic.users]]
username = "ehrbase-admin"
password_hash = "$argon2id$v=19$m=4096,t=2,p=1$ZWhyYmFzZURldlNhbHQ$4Cf1W/JiP800r2sbj8/y0HbNAcwMb/YseM1fTINO3Dc"
roles = ["ADMIN", "USER"]
