# openEHR CNF conformance harness — dual stack (ehrbase-rs + EHRbase Java).
#
# The CNF framework is server-agnostic: it drives any ITS-REST server over HTTP
# via `--base-url`. This compose brings up either edition (its own PostgreSQL) so
# `run.sh <rs|java>` can run the *identical* 322-case schedule against each and
# write a per-edition report set under `docs/conformance/<edition>/` — the basis
# for the head-to-head comparison in `CNF_COMPARISON.md`.
#
# Both are Basic-auth (clinical user ehrbase/ehrbase) for an identical credential
# path, and both have the ADMIN API activated so the master12/ADMIN-* cases run.
# Bring one edition up with its profile, run the suite, take it down — run.sh does
# exactly that. Images are pinned by tag.
networks:
  cnf-net: {}

services:
  # ── ehrbase-rs (this project) — profile: rs, port 8090 ──────────────────────
  ehrbase-rs-db:
    image: ${EHRBASE_RS_POSTGRES_IMAGE:-ghcr.io/rubentalstra/ehrbase-rs-postgres:develop}
    environment:
      POSTGRES_PASSWORD: postgres
      EHRBASE_DB_PASSWORD: ehrbase
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [cnf-net]
    profiles: ["rs"]

  ehrbase-rs:
    image: ${EHRBASE_RS_IMAGE:-ghcr.io/rubentalstra/ehrbase-rs:develop}
    depends_on:
      ehrbase-rs-db:
        condition: service_healthy
    environment:
      EHRBASE_DB_URL: postgres://ehrbase:ehrbase@ehrbase-rs-db:5432/ehrbase
      EHRBASE_REST_CONFIG: /etc/ehrbase/ehrbase.toml
      # Activate the ADMIN API so master12/ADMIN-* cases exercise the live surface.
      EHRBASE_REST_ADMIN__ENABLED: "true"
    volumes:
      - ../ehrbase.dev.toml:/etc/ehrbase/ehrbase.toml:ro
    ports:
      - "8090:8080"
    networks: [cnf-net]
    profiles: ["rs"]

  # ── EHRbase (Java, the reference implementation) — profile: java, port 8091 ──
  ehrbase-java-db:
    image: ${EHRBASE_JAVA_POSTGRES_IMAGE:-ehrbase/ehrbase-v2-postgres:16.2}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EHRBASE_USER_ADMIN: ehrbase
      EHRBASE_PASSWORD_ADMIN: ehrbase
      EHRBASE_USER: ehrbase_restricted
      EHRBASE_PASSWORD: ehrbase_restricted
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [cnf-net]
    profiles: ["java"]

  ehrbase-java:
    image: ${EHRBASE_JAVA_IMAGE:-ehrbase/ehrbase:2.33.0}
    depends_on:
      ehrbase-java-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://ehrbase-java-db:5432/ehrbase
      DB_USER_ADMIN: ehrbase
      DB_PASS_ADMIN: ehrbase
      DB_USER: ehrbase_restricted
      DB_PASS: ehrbase_restricted
      # Basic auth — clinical user ehrbase/ehrbase (what the CNF harness drives);
      # the admin user needs a distinct username (ehrbase-admin) or EHRbase's
      # in-memory user store refuses to start ("user should not exist").
      SECURITY_AUTHTYPE: BASIC
      SECURITY_AUTHUSER: ehrbase
      SECURITY_AUTHPASSWORD: ehrbase
      SECURITY_AUTHADMINUSER: ehrbase-admin
      SECURITY_AUTHADMINPASSWORD: ehrbase
      # Activate the ADMIN API + allow template overwrite for idempotent re-runs.
      ADMINAPI_ACTIVE: "true"
      ADMINAPI_ALLOWDELETEALL: "true"
      SYSTEM_ALLOWTEMPLATEOVERWRITE: "true"
    ports:
      - "8091:8080"
    networks: [cnf-net]
    profiles: ["java"]
