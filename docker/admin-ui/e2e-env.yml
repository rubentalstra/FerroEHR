# Compose override for the image-mode E2E run (scripts/ui-e2e.sh with
# UI_E2E_IMAGE=1): the composed console image receives the same OIDC test
# wiring the host-mode harness passes as process env. The issuer uses the
# in-network hostname at the aligned port (docker-compose.override.yml keycloak
# KC_HTTP_PORT) so the SAME URL resolves for the container (docker DNS)
# and for the E2E browser (a chromedriver host-resolver mapping of
# `keycloak` to 127.0.0.1). The client secret is the shipped DEV realm's
# (docker/keycloak/import) — test-only, never a production credential.
#
# The CDR block turns four opt-in extensions on for the run, all of which
# answer `404` as if unmounted while they are off — so the console's journeys
# over them would otherwise have nothing but a disabled empty state to drive:
# the terminology surface (`[terminology] api_enabled`), the tenant registry
# (`[tenancy] enabled`), the FHIR connector (`[fhir] api_enabled`, which
# gates both `/fhir/r4/*` and the `/admin/fhir_mapping` store) and the
# event-subscription admin API (`[events] admin_api`). Enabling
# tenancy is a POSTURE change, which is why it rides this overlay alone and not
# the dev quickstart or the CNF stack. The mechanical `__` env mapping
# addresses the same TOML keys (app/ferroehr/assets/ferroehr.default.toml).
#
# `[events] admin_api` is deliberately alone: the subscription CRUD is a
# database store, so it needs no broker and no `[events] enabled` — turning the
# publisher on without a reachable AMQP broker would only add a retry loop to
# the run.
services:
  ferroehr:
    environment:
      FERROEHR__TERMINOLOGY__API_ENABLED: "true"
      FERROEHR__TENANCY__ENABLED: "true"
      FERROEHR__FHIR__API_ENABLED: "true"
      FERROEHR__EVENTS__ADMIN_API: "true"

  ferroehr-admin-ui:
    environment:
      FERROEHR_ADMIN__CDR__BASE_URL: http://ferroehr:8080
      FERROEHR_ADMIN__AUTH__OIDC__ENABLED: "true"
      FERROEHR_ADMIN__AUTH__OIDC__ISSUER: http://keycloak:8081/auth/realms/ferroehr
      FERROEHR_ADMIN__AUTH__OIDC__CLIENT_ID: ferroehr
      FERROEHR_ADMIN__AUTH__OIDC__CLIENT_SECRET: bT5T4oWn3xNdBytQsl2cfpBDi1pp15Va
      FERROEHR_ADMIN__AUTH__OIDC__PUBLIC_BASE_URL: http://127.0.0.1:3000
