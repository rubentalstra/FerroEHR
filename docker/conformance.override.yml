# Conformance-only compose override — applied ONLY by scripts/conformance.sh for
# CONF_SUT=ehrbase-rs (`-f docker-compose.yml -f docker/conformance.override.yml`).
# It is NOT part of the quickstart `docker compose up`, so the shipped stack is
# unchanged. Two additions let the ECC execute six otherwise-unexercisable cases:
#
#  1. FHIR terminology provider (ECC-TS-006…009) — the main `ehrbase` service
#     gets a `[terminology.external]` FHIR R4 provider pointed at the hermetic
#     FHIR-tx fixture the conformance runner hosts on the *host* at a fixed port
#     (--tx-fixture-port 8099), reached from the container over
#     `host.docker.internal`. The runner drives `TERMINOLOGY('expand',
#     'hl7.org/fhir/4.0', …)` queries; the fixture serves the canned surface
#     value set and, for the three fault-marker value sets, injects
#     timeout/5xx/malformed so the SUT maps each to HTTP 500.
#
#  2. pgp-signing sibling (ECC-SIG-005) — a second `ehrbase-pgp` instance booted
#     in `[signing] mode = "pgp"` with the committed TEST-ONLY key. The main SUT
#     signs in `digest` mode (the four digest cases assert `sha256:`); a single
#     server cannot serve both signature schemes, so the pgp case runs against
#     this sibling and verifies its RFC 4880 detached signature.
#
# Port coupling: the fixture port (8099) here MUST match scripts/conformance.sh's
# --tx-fixture-port; the pgp sibling host port (8082) MUST match its
# --sig-pgp-base-url.
services:
  ehrbase:
    # Linux CI needs the explicit host-gateway mapping (Docker Desktop provides
    # host.docker.internal automatically; this makes it work on both).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # A single FHIR provider named `default` (the AQL FHIR-service_api path
      # selects it). fail_on_error stays default-false (fail-open): unrelated
      # composition validation is never affected — the bundle answers openEHR/ISO
      # terminologies and the external provider is consulted only for genuinely
      # unknown ones (none in the corpus) and the explicit TERMINOLOGY() queries.
      EHRBASE__TERMINOLOGY__EXTERNAL__ENABLED: "true"
      EHRBASE__TERMINOLOGY__EXTERNAL__PROVIDERS__DEFAULT__URL: "http://host.docker.internal:8099"
      EHRBASE__TERMINOLOGY__EXTERNAL__PROVIDERS__DEFAULT__CONNECT_TIMEOUT_MS: "1000"
      # Below the fixture's 30s timeout-fault delay so the timeout case resolves
      # quickly (the SUT gives up first → server-fault → 500).
      EHRBASE__TERMINOLOGY__EXTERNAL__PROVIDERS__DEFAULT__REQUEST_TIMEOUT_MS: "2000"

  ehrbase-pgp:
    image: ${EHRBASE_IMAGE:-ghcr.io/rubentalstra/ehrbase-rs:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      ehrbase-postgres:
        condition: service_healthy
      # The main SUT runs the migrations once; this sibling then starts against
      # the already-migrated schema (they share the one database).
      ehrbase:
        condition: service_healthy
    environment:
      EHRBASE__DB__URL: postgres://${PG_INIT_USER:-ehrbase}:${PG_INIT_PASSWORD:-ehrbase}@ehrbase-postgres:5432/${PG_INIT_DB:-ehrbase}
      # pgp signing over the committed TEST-ONLY key (see docker/conformance/pgp).
      EHRBASE__SIGNING__ENABLED: "true"
      EHRBASE__SIGNING__MODE: "pgp"
      EHRBASE__SIGNING__KEY_PATH: "/etc/ehrbase/pgp/signing-key.asc"
      EHRBASE__LOG__FORMAT: ${EHRBASE__LOG__FORMAT:-pretty}
    volumes:
      - ./docker/ehrbase.dev.toml:/etc/ehrbase/ehrbase.toml:ro
      - ./docker/conformance/pgp:/etc/ehrbase/pgp:ro
    ports:
      - "${EHRBASE_PGP_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/ehrbase", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
