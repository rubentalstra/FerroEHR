[package]
name = "ferroehr-admin-ui"
version.workspace = true
description = "FerroEHR admin console: Leptos SSR web app + BFF over the ITS-REST API (its own binary and OCI image; a pure REST client of the CDR, never in-process)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

# Full-stack Leptos crate (cargo-leptos): the rlib feeds the server binary
# (feature `ssr`) and the cdylib is the WASM client bundle (feature
# `hydrate`). NOTE: no openEHR spec governs an admin UI — our own design /
# product extension; the wire it consumes is spec-bound (see CLAUDE.md).
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ferroehr-admin-ui"
path = "src/main.rs"

[dependencies]
openehr-query = { path = "../../crates/openehr-query" }

# Taken WITHOUT default features, so on both targets it contributes only the
# std-only SMART scope grammar (`openehr_its::rest::smart_scopes`, master08) —
# the ONE parser the CDR's scope gate and the console's scope previewer share, so
# what the drawer explains can never drift from what the CDR enforces. Parsing a
# scope string is a pure function, so the previewer runs in the browser rather
# than round-tripping the BFF; that is why this dependency is unconditional.
# The heavy ITS surfaces (`openehr_its::opt14` + `flat` for the query-builder
# path catalog) ride the crate's default `full` feature, which the `ssr` gate
# below adds back BFF-side — they stay out of the WASM bundle.
openehr-its = { path = "../../crates/openehr-its", default-features = false }

leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
thaw.workspace = true
serde.workspace = true
serde_json.workspace = true
# ISO 8601 parsing/formatting for the results chart's time axis (pure —
# no clock access, so it needs no wasm js feature).
jiff.workspace = true

# Isomorphic (compiles on both targets): `use_interval_fn` for the shell's
# health poll; its default `storage` feature also enables `web-sys/Storage`,
# which the dark-mode toggle uses (via leptos's `web_sys` re-export) to persist
# the theme to `localStorage`.
leptos-use = { workspace = true }

# Pure-Rust SVG icons (no JS, both targets): the Lucide pack alone plus the
# leptos Icon component — the icondata umbrella crate pulls every pack and
# bloats the WASM binary.
leptos_icons.workspace = true
icondata_lu.workspace = true
icondata_core.workspace = true

# Pure-Rust SVG charts (no JS) for the dashboard commit-activity trend.
# Isomorphic: it renders a "Loading…" placeholder server-side and draws the
# chart after the client measures the container. Its own `ssr` feature MUST
# ride the `ssr` gate below (see the feature list) so the leptos-use timers it
# uses compile the native path server-side instead of panicking at SSR — the
# same reason `leptos-use/ssr` is required.
leptos-chartistry = { workspace = true }

# JsFuture for the browser-side OPT file read (thaw Upload custom_request);
# compiles on both targets, only ever runs in the browser.
wasm-bindgen-futures.workspace = true

thiserror.workspace = true

# server-only (behind `ssr`)
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
config = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true, features = ["memory-store"] }
# The browser security-header layer (`SetResponseHeaderLayer`). Server-only:
# headers are a response property, so the hydrate target never needs it.
tower-http = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
# Bounded concurrent fan-out for the dashboard namespace tiles (ssr only —
# the client never runs the tile queries).
futures = { workspace = true, optional = true }
openidconnect = { workspace = true, optional = true }
# Percent-encoding is ALWAYS the `urlencoding` crate (owner hard rule —
# never hand-rolled). Non-optional: the audit screen builds
# filter-preserving pagination hrefs on every target (ssr, hydrate, and
# plain featureless test builds); the crate is tiny and wasm-clean.
urlencoding = { workspace = true }
# Typed status comparisons on every target (owner directive 2026-08-06,
# issue #2055): `http::StatusCode` names the codes the pages branch on, and
# the crate is tiny and wasm-clean — so it is non-optional, like urlencoding.
http = { workspace = true }

# browser-only (behind `hydrate`)
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "thaw/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
]
ssr = [
    "dep:tower-http",
    "leptos/ssr",
    # The per-request CSP nonce (src/main.rs): `leptos::nonce::Nonce` +
    # `HydrationScripts` stamping `nonce=` on the bootstrap script. Named
    # explicitly rather than inherited from leptos_axum's own dependency
    # edge, so the strict script-src cannot lose its nonce to a feature
    # change upstream.
    "leptos/nonce",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "thaw/ssr",
    # leptos-use MUST get its `ssr` feature on the server target: without it
    # its browser primitives (use_interval_fn's js-sys timer) compile the
    # wasm path into the native binary and panic at SSR ("function not
    # implemented on non-wasm32 targets") — caught by the W2 live smoke.
    "leptos-use/ssr",
    "leptos-use/axum",
    # chartistry embeds its own leptos-use; give it the ssr path server-side.
    "leptos-chartistry/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:anyhow",
    "dep:reqwest",
    "dep:futures",
    "dep:config",
    "dep:tower-sessions",
    "dep:csv",
    "dep:openidconnect",
    # The full ITS surface BFF-side (OPT parsing + WebTemplate building); the
    # scope grammar itself is unconditional (see the dependency comment above).
    "openehr-its/full",
]

[dev-dependencies]
indexmap.workspace = true
# `ServiceExt::oneshot`: the CSP-nonce tests drive a stub router through the
# security layer in-process, with no listener.
tower.workspace = true
# E2E journeys (tests/e2e_*.rs): Rust-native WebDriver + the async runtime;
# the console gate reads the browser log via thirtyfour's legacy-log API.
thirtyfour.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The docs-shots journey seeds stored queries over the Definition API
# directly (bypassing the UI) — a plain HTTP client for test setup. `form`
# (test-only): the export journey re-posts the console's own
# `<form method="post">` to /export/aql, which is url-encoded by definition.
reqwest = { workspace = true, features = ["form"] }

[lints]
workspace = true

# cargo-leptos build config (Tailwind v4 standalone — pin the
# binary with LEPTOS_TAILWIND_VERSION=v4.3.3 in CI/containers; no Node/npm).
[package.metadata.leptos]
output-name = "ferroehr-admin-ui"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
