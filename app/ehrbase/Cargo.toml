[package]
name = "ehrbase"
version = "0.1.0"
description = "EHRbase server binary: persistence, AQL execution engine (ASL), versioning, contributions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
figment.workspace = true
jiff.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Observability (telemetry init): the OTLP export layer + metrics facade +
# Prometheus recorder. The single `tracing` API fans out to stdout logs and
# (opt-in) OTLP spans; `metrics` is pulled via the Prometheus recorder.
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
jiff-sqlx.workspace = true
# `events` module (contribution-outbox eventing, ADR-014): AMQP 0.9.1 publisher
# (RabbitMQ) draining the transactional outbox at-least-once, with `backon`
# retry/backoff.
lapin.workspace = true
backon.workspace = true
sea-query.workspace = true
sea-query-sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
# OPT 1.4 upload structure validation (`service::template`): a depth-aware scan
# of the template XML that rejects foreign / duplicated top-level elements the
# tolerant opt14 codec would otherwise accept (CNF master04 upload_opt-invalid_opt).
quick-xml.workspace = true
# ADL 1.4 / OPT / stored-query id-pattern matching (SM-2 `list_matching_*`):
# RE2-class regexes for the `I_DEFINITION_*` regex-pattern list calls.
regex.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true

# `signing` module (RM common §Digital Signature; ADR-011, moved from the former
# ehrbase-signing crate): OpenPGP (rPGP) detached signatures + SHA-256 digest mode.
pgp.workspace = true
sha2.workspace = true
base64.workspace = true
secrecy = { workspace = true, features = ["serde"] }
# PORT NOTE: rPGP 0.20's `DetachedSignature::sign_binary_data` takes an
# `rng: Rng + CryptoRng` from rand 0.8's rand_core 0.6; the workspace `rand`
# pin (0.10) is a trait-incompatible major, so the `signing` module pins the
# rand version pgp itself requires purely to name `OsRng` for that one call.
rand = "0.8"
# `system_log` module (IHE ATNA audit trail, SM `I_SYSTEM_LOG`; ADR-011, moved
# from the former ehrbase-audit crate): TLS syslog transport.
tokio-rustls.workspace = true
rustls.workspace = true

openehr-base = { path = "../../crates/openehr-base" }
openehr-term = { path = "../../crates/openehr-term" }
openehr-rm = { path = "../../crates/openehr-rm" }
openehr-its = { path = "../../crates/openehr-its" }
openehr-lang = { path = "../../crates/openehr-lang" }
openehr-am = { path = "../../crates/openehr-am" }
openehr-flat = { path = "../../crates/openehr-flat" }
openehr-query = { path = "../../crates/openehr-query" }
ehrbase-rest = { path = "../ehrbase-rest" }
ehrbase-sm = { path = "../ehrbase-sm" }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
# Hermetic FHIR terminology-server mock for the external-terminology provider
# tests (B4): canned `$validate-code`/`$expand`/`$subsumes`/`$lookup` responses
# + fault injection (timeout, 5xx, malformed) — no network in CI.
wiremock.workspace = true
testcontainers.workspace = true
# testcontainers-modules `rabbitmq` feature (workspace) drives the end-to-end
# eventing tests against a real broker (ADR-014). `futures` gives the lapin
# Consumer its `StreamExt::next` in those tests.
testcontainers-modules.workspace = true
futures.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
insta.workspace = true
ehrbase-rest = { path = "../ehrbase-rest" }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
# The in-memory OTLP exporters for the export-pipeline smoke tests.
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "testing"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Wired for later phases, not consumed yet: openehr-am (ADL2),
# openehr-lang (BMM at runtime).
ignored = ["openehr-am", "openehr-lang"]
