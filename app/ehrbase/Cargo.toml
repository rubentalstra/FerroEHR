[package]
name = "ehrbase"
version = "0.1.0"
description = "EHRbase server binary: persistence, AQL execution engine (ASL), versioning, contributions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
figment.workspace = true
jiff.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Observability (telemetry init): the OTLP export layer + metrics facade +
# Prometheus recorder. The single `tracing` API fans out to stdout logs and
# (opt-in) OTLP spans; `metrics` is pulled via the Prometheus recorder.
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
jiff-sqlx.workspace = true
sea-query.workspace = true
sea-query-sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
# OPT 1.4 upload structure validation (`service::template`): a depth-aware scan
# of the template XML that rejects foreign / duplicated top-level elements the
# tolerant opt14 codec would otherwise accept (CNF master04 upload_opt-invalid_opt).
quick-xml.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true

openehr-base = { path = "../../crates/openehr-base" }
openehr-term = { path = "../../crates/openehr-term" }
openehr-rm = { path = "../../crates/openehr-rm" }
openehr-its = { path = "../../crates/openehr-its" }
openehr-lang = { path = "../../crates/openehr-lang" }
openehr-am = { path = "../../crates/openehr-am" }
openehr-flat = { path = "../../crates/openehr-flat" }
openehr-query = { path = "../../crates/openehr-query" }
ehrbase-rest = { path = "../ehrbase-rest" }
ehrbase-sm = { path = "../ehrbase-sm" }
ehrbase-audit = { path = "../ehrbase-audit" }
ehrbase-authz = { path = "../ehrbase-authz" }
ehrbase-signing = { path = "../ehrbase-signing" }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
testcontainers.workspace = true
testcontainers-modules.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
insta.workspace = true
ehrbase-rest = { path = "../ehrbase-rest" }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
# The in-memory OTLP exporters for the export-pipeline smoke tests.
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "testing"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Wired for later phases, not consumed yet: openehr-am (ADL2),
# openehr-lang (BMM at runtime).
ignored = ["openehr-am", "openehr-lang"]
