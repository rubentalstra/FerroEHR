[package]
name = "ehrbase-rest"
version = "0.1.0"
description = "openEHR ITS-REST 1.0.3 server surface (axum) + authentication"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# openEHR generated foundation: the domain model + the ITS-REST contract.
openehr-rm = { path = "../../crates/openehr-rm" }
openehr-its = { path = "../../crates/openehr-its" }
# WebTemplate (Better wt+json) builder + cache for the ADL1.4 template endpoint.
openehr-flat = { path = "../../crates/openehr-flat" }
# The SM Platform Service Model native API (ADR-010): the service traits +
# response/query types this crate dispatches to (moved here at SM-1).
ehrbase-sm = { path = "../ehrbase-sm" }
# IHE ATNA audit trail (DICOM AuditMessage over syslog) — the audit tower layer.
ehrbase-audit = { path = "../ehrbase-audit" }
# Access control (RBAC): operation classification + role model + gate decision.
ehrbase-authz = { path = "../ehrbase-authz" }

# Web framework & HTTP core.
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }

# Async runtime.
tokio = { workspace = true }

# Serialization & data structures.
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }

# Config, errors, observability, time.
figment = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
jiff = { workspace = true }
# Metrics facade + the Prometheus recorder handle (the HTTP-metrics tower layer
# and the /management/prometheus render surface).
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
# Trace-context propagation (W3C traceparent) + the OTel span extension used by
# the root-span middleware; the export layer itself is installed in the binary.
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }

# Authentication: Basic (argon2) + OAuth2/OIDC bearer (jsonwebtoken over a JWKS,
# issuer discovery via openidconnect, whose bundled reqwest does the network I/O).
# See src/auth for the resource-server scope decision.
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
openidconnect = { workspace = true }
moka = { workspace = true }

# OpenAPI / Swagger UI (a drift-check against the vendored OAS, not the source).
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true, features = ["test"] }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
admin-api = []

[lints]
workspace = true
