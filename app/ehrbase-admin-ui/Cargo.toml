[package]
name = "ehrbase-admin-ui"
version.workspace = true
description = "EHRbase admin console: Leptos SSR web app + BFF over the ITS-REST API (its own binary and OCI image; a pure REST client of the CDR, never in-process)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Full-stack Leptos crate (cargo-leptos): the rlib feeds the server binary
# (feature `ssr`) and the cdylib is the WASM client bundle (feature
# `hydrate`). NOTE: no openEHR spec governs an admin UI — our own design /
# product extension; the wire it consumes is spec-bound (see CLAUDE.md).
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ehrbase-admin-ui"
path = "src/main.rs"

[dependencies]
openehr-query = { path = "../../crates/openehr-query" }

# spec crates used BFF-side only (OPT parsing + WebTemplate building for the
# query-builder path catalog) — ssr-gated to keep them out of the WASM bundle
openehr-flat = { path = "../../crates/openehr-flat", optional = true }
openehr-its = { path = "../../crates/openehr-its", optional = true }

leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
thaw.workspace = true
serde.workspace = true
serde_json.workspace = true

# Isomorphic (compiles on both targets): `use_interval_fn` for the shell's
# health poll; its default `storage` feature also enables `web-sys/Storage`,
# which the dark-mode toggle uses (via leptos's `web_sys` re-export) to persist
# the theme to `localStorage`.
leptos-use = { workspace = true }

thiserror.workspace = true

# server-only (behind `ssr`)
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
config = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true, features = ["memory-store"] }
openidconnect = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true, features = ["serde"] }
urlencoding = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# browser-only (behind `hydrate`)
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "thaw/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "thaw/ssr",
    # leptos-use MUST get its `ssr` feature on the server target: without it
    # its browser primitives (use_interval_fn's js-sys timer) compile the
    # wasm path into the native binary and panic at SSR ("function not
    # implemented on non-wasm32 targets") — caught by the W2 live smoke.
    "leptos-use/ssr",
    "leptos-use/axum",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:anyhow",
    "dep:reqwest",
    "dep:config",
    "dep:tower-sessions",
    "dep:openidconnect",
    "dep:secrecy",
    "dep:urlencoding",
    "dep:http",
    "dep:openehr-flat",
    "dep:openehr-its",
]

[dev-dependencies]
indexmap.workspace = true

[lints]
workspace = true

# cargo-leptos build config (design doc §8: Tailwind v4 standalone — pin the
# binary with LEPTOS_TAILWIND_VERSION=v4.3.3 in CI/containers; no Node/npm).
[package.metadata.leptos]
output-name = "ehrbase-admin-ui"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
