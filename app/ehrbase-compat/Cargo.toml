[package]
name = "ehrbase-compat"
version = "0.1.0"
description = "EHRbase-compatible endpoints: EhrScape, WebTemplate export; receives rest-ehr-scape"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ehrbase-rest = { path = "../ehrbase-rest" }
# This crate IS the EHRbase/Better compatibility surface (EhrScape + FLAT/
# WebTemplate), so it opts into the Better-only FLAT extras that the default
# openehr-flat path keeps gated off (`|unit_system`/`|unit_display_name`; see
# F-13-25 and serialization.md). Core ITS-REST serving stays quirk-free.
openehr-flat = { path = "../../crates/openehr-flat", features = ["ehrbase-quirks"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Scaffolded dependency graph (ADR-004 / phase 0R); these internal crates are wired now and consumed when this crate is ported (P6+).
ignored = ["ehrbase-rest", "openehr-flat"]
