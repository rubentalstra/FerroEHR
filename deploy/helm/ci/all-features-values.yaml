# All-features-on overlay: every optional integration enabled, autoscaling +
# separate management port + egress network policy + a mounted config file. Used
# as the "all-features" golden render and to exercise every template branch.
database:
  existingSecret: ehrbase-db
  existingSecretKey: EHRBASE_DB__URL

secrets:
  authOidcHmacSecret: dev-hmac-secret
  signingKeyPassphrase: dev-passphrase
  eventsUrl: amqps://user:pass@rabbitmq:5671/%2f
  fhirOutboundUrl: amqps://user:pass@rabbitmq:5671/%2f
  multimediaAccessKeyId: AKIAEXAMPLE
  multimediaSecretAccessKey: s3-secret

metrics:
  enabled: true

config:
  server:
    bind: "0.0.0.0:8080"
    base_path: /ehrbase/rest/openehr/v1
    swagger_ui: true
    cors_permissive: false
  db:
    max_connections: 10
    min_connections: 0
    acquire_timeout_secs: 30
  log:
    format: json
    filter: info,ehrbase=debug
  telemetry:
    otlp_endpoint: http://otel-collector:4317
    service_name: ehrbase-rs
    environment: production
    traces_sample_ratio: 0.1
    metrics_push: true
  auth:
    enabled: true
    basic:
      users:
        - username: clinician
          password_hash: "$argon2id$v=19$m=4096,t=2,p=1$c2FsdA$hash"
          roles: [USER]
    oidc:
      issuer: https://keycloak.example.com/realms/ehrbase
      audiences: [ehrbase]
      algorithms: [RS256]
  authz:
    rbac:
      enabled: true
      admin_role: ADMIN
      user_role: USER
      management_access: admin_only
    abac:
      enabled: true
      engine: cedar
      organization_claim: organization_id
      patient_claim: patient_id
      cedar:
        policy_dir: /etc/ehrbase
  admin:
    enabled: true
  tenancy:
    enabled: true
    claim: realm_access.tenant
    header: X-EHRbase-Tenant
  smart:
    enabled: true
    ehr_id_claim: ehrId
    patient_claim: patient
  management:
    enabled: true
    base_path: /management
    port: 9100
    access_default: admin_only
    probes_enabled: true
    endpoints:
      health: private
      info: admin_only
      metrics: admin_only
      prometheus: public
      env: admin_only
      loggers: admin_only
  query:
    plan_cache_capacity: 256
    timeout_ms: 30000
  signing:
    enabled: true
    mode: pgp
    key_path: /etc/ehrbase/signing.asc
    verify_on_read: strict
  atna:
    enabled: true
    repository_host: arr.example.com
    repository_port: 6514
    transport: tls
    source_id: ehrbase-prod
    fail_mode: closed
    enterprise_site_id: site-1
  events:
    enabled: true
    exchange: ehrbase.events
    tls: true
  fhir:
    api_enabled: true
    outbound:
      enabled: true
      exchange: ehrbase.fhir
      tls: true
  terminology:
    api_enabled: true
    external:
      enabled: true
      fail_on_error: false
      providers:
        default:
          type: fhir
          url: https://tx.example.com/fhir
          operation: validate_code
  multimedia:
    enabled: true
    threshold_bytes: 262144
    endpoint: https://s3.example.com
    bucket: openehr-multimedia
    region: eu-west-1
    allow_http: false
  subject_proxy:
    systems:
      pas:
        base_url: https://pas.example.com/fhir
  files:
    signing.asc: |
      -----BEGIN PGP PRIVATE KEY BLOCK-----
      (dev placeholder)
      -----END PGP PRIVATE KEY BLOCK-----

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ehrbase.example.com
      paths:
        - path: /ehrbase
          pathType: Prefix
  tls:
    - secretName: ehrbase-tls
      hosts:
        - ehrbase.example.com

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  egress:
    enabled: true
    rules:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: postgres
        ports:
          - port: 5432
            protocol: TCP

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ehrbase-s3
