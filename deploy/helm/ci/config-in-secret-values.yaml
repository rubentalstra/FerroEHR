# The Secret-borne configuration mode: a Basic user's Argon2id hash is a secret
# with no `*_file` sibling in the server's config tree, so the chart cannot route
# it through `secrets:` — the whole rendered ferroehr.toml moves into the Secret
# and NO ConfigMap is created. This overlay is the golden render of that branch;
# the "default" and "all-features" cases cover the ConfigMap branch.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DB__URL

config:
  auth:
    enabled: true
    basic:
      users:
        - username: clinician
          password_hash: "$argon2id$v=19$m=19456,t=2,p=1$c2FsdA$hash"
          roles: [USER]
