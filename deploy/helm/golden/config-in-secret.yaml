---
# Source: ferroehr/templates/networkpolicy.yaml
# Default-deny ingress for the ferroehr pods, admitting traffic ONLY to the
# API port (and the management port when it runs on its own listener). Every
# other inbound port is denied. A PHI workload should never be reachable on
# anything but its serving port.
# The SOURCE is narrowed only when networkPolicy.ingressFrom is set: a rule with
# no `from` admits every source, including other namespaces
# (https://kubernetes.io/docs/concepts/services-networking/network-policies/).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-4.0.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.17.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
---
# Source: ferroehr/templates/poddisruptionbudget.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
