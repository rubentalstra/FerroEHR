# Source: ferroehr/templates/secret.yaml
# Mounted config files (TOML/PEM) at /etc/ferroehr — file-shaped material an
# in-TOML `*_path`/`*_file` key points at: the PGP key, Cedar/ABAC policies,
# ATNA PEMs, a JWKS blob. Mounted alongside ferroehr.toml.
apiVersion: v1
kind: Secret
metadata:
  name: ferroehr-config
  labels:
    helm.sh/chart: ferroehr-4.0.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.17.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
type: Opaque
stringData:
  # ferroehr.toml lives HERE rather than in a ConfigMap because the configuration
  # carries a secret the chart has no `secrets:` route for — today only a Basic
  # user's Argon2id hash, whose config key has no `*_file` sibling. No ConfigMap
  # is rendered in this mode; this is the file the pod reads.
  ferroehr.toml: |
    spec_profile = "development"
    
    [admin]
      enabled = false
    
    [audit]
      enabled = true
      [audit.store]
        enabled = true
        retention_days = 0.0
    
    [auth]
      enabled = true
      [auth.basic]
    
        [[auth.basic.users]]
          password_hash = "$argon2id$v=19$m=19456,t=2,p=1$c2FsdA$hash"
          roles = ["USER"]
          username = "clinician"
    
    [authz]
      [authz.abac]
        enabled = false
      [authz.rbac]
        admin_role = "ADMIN"
        enabled = true
        management_access = "admin_only"
        user_role = "USER"
    
    [db]
      acquire_timeout_secs = 30.0
      max_connections = 10.0
      min_connections = 0.0
      statement_timeout_ms = 60000.0
    
    [events]
      enabled = false
      exchange = "ferroehr.events"
      tls = false
    
    [fhir]
      api_enabled = false
      [fhir.outbound]
        enabled = false
        exchange = "ferroehr.fhir"
        tls = false
    
    [log]
      format = "json"
    
    [management]
      access_default = "admin_only"
      base_path = "/management"
      enabled = true
      [management.endpoints]
        env = "off"
        flamegraph = "off"
        info = "off"
        loggers = "off"
        metrics = "off"
        prometheus = "off"
    
    [multimedia]
      allow_http = false
      bucket = "openehr-multimedia"
      enabled = false
      region = "us-east-1"
    
    [server]
      base_path = "/ferroehr/rest/openehr/v1"
      bind = "0.0.0.0:8080"
      cors_permissive = false
      swagger_ui = true
      [server.connection]
        header_read_timeout_secs = 10.0
        http2_keep_alive_interval_secs = 30.0
        http2_keep_alive_timeout_secs = 10.0
        max_concurrent_streams = 256.0
      [server.limits]
        body_bytes = 1.6777216e+07
        bulk_body_bytes = 6.7108864e+07
      [server.rate_limit]
        address_burst = 4096.0
        address_per_second = 2048.0
        enabled = true
        principal_burst = 2048.0
        principal_per_second = 1024.0
    
    [signing]
      enabled = true
      mode = "digest"
      verify_on_read = "strict"
    
    [tenancy]
      claim = "tenant"
      enabled = false
    
    [terminology]
      api_enabled = false
      [terminology.external]
        enabled = false
        fail_on_error = false
---
