# Source: ferroehr/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-3.2.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.17.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr
  template:
    metadata:
      annotations:
        # Roll pods when the rendered ferroehr.toml changes.
        checksum/config: 9e588a7866c16a223d517366fc5a44d878f3103432598e8f97c8288aebd18b79
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/management/prometheus"
      labels:
        app.kubernetes.io/name: ferroehr
        app.kubernetes.io/instance: ferroehr
    spec:
      serviceAccountName: ferroehr
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferroehr
          image: "ghcr.io/rubentalstra/ferroehr:3.17.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9100
              protocol: TCP
          # Only SECRET config is env; the rest is the mounted ferroehr.toml.
          # The DSN comes from an existing Secret (preferred) or the chart Secret;
          # the env layer overrides the file, so each secret here wins over any
          # matching TOML key.
          env:
            - name: FERROEHR__DB__URL
              valueFrom:
                secretKeyRef:
                  name: ferroehr-db
                  key: FERROEHR__DB__URL
            - name: FERROEHR__AUTH__OIDC__HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: ferroehr-env
                  key: FERROEHR__AUTH__OIDC__HMAC_SECRET
            - name: FERROEHR__SIGNING__KEY_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: ferroehr-env
                  key: FERROEHR__SIGNING__KEY_PASSPHRASE
            - name: FERROEHR__EVENTS__URL
              valueFrom:
                secretKeyRef:
                  name: ferroehr-env
                  key: FERROEHR__EVENTS__URL
            - name: FERROEHR__FHIR__OUTBOUND__URL
              valueFrom:
                secretKeyRef:
                  name: ferroehr-env
                  key: FERROEHR__FHIR__OUTBOUND__URL
            - name: FERROEHR__MULTIMEDIA__ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ferroehr-env
                  key: FERROEHR__MULTIMEDIA__ACCESS_KEY_ID
            - name: FERROEHR__MULTIMEDIA__SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ferroehr-env
                  key: FERROEHR__MULTIMEDIA__SECRET_ACCESS_KEY
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem=true → give the process a writable scratch dir.
            - name: tmp
              mountPath: /tmp
            # ferroehr.toml (+ any config.files) mounted read-only at /etc/ferroehr.
            - name: config
              mountPath: /etc/ferroehr
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          projected:
            sources:
              - configMap:
                  name: ferroehr
                  items:
                    - key: ferroehr.toml
                      path: ferroehr.toml
              - secret:
                  name: ferroehr-config
