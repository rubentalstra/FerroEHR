apiVersion: v1
kind: Service
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-7.0.5
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.0.18"
    app.kubernetes.io/managed-by: Helm
