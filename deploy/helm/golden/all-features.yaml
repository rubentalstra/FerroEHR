# Source: ehrbase-rs/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.1
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ehrbase-rs
      app.kubernetes.io/instance: ehrbase-rs
  template:
    metadata:
      annotations:
        # Roll pods when the rendered ehrbase.toml changes.
        checksum/config: f106c18afbf5d007a90948cc1c5ee78c872c1edbbf3c416e46ea0bfed8bce9a6
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/management/prometheus"
      labels:
        app.kubernetes.io/name: ehrbase-rs
        app.kubernetes.io/instance: ehrbase-rs
    spec:
      serviceAccountName: ehrbase-rs
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ehrbase
          image: "ghcr.io/rubentalstra/ehrbase-rs:3.0.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9100
              protocol: TCP
          # Only SECRET config is env; the rest is the mounted ehrbase.toml.
          # The DSN comes from an existing Secret (preferred) or the chart Secret;
          # the env layer overrides the file, so each secret here wins over any
          # matching TOML key.
          env:
            - name: EHRBASE_DB__URL
              valueFrom:
                secretKeyRef:
                  name: ehrbase-db
                  key: EHRBASE_DB__URL
            - name: EHRBASE_AUTH__OIDC__HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_AUTH__OIDC__HMAC_SECRET
            - name: EHRBASE_SIGNING__KEY_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_SIGNING__KEY_PASSPHRASE
            - name: EHRBASE_EVENTS__URL
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_EVENTS__URL
            - name: EHRBASE_FHIR__OUTBOUND__URL
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_FHIR__OUTBOUND__URL
            - name: EHRBASE_MULTIMEDIA__ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_MULTIMEDIA__ACCESS_KEY_ID
            - name: EHRBASE_MULTIMEDIA__SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_MULTIMEDIA__SECRET_ACCESS_KEY
          livenessProbe:
            httpGet:
              path: /management/health/liveness
              port: management
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /management/health/readiness
              port: management
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /management/health/liveness
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem=true → give the process a writable scratch dir.
            - name: tmp
              mountPath: /tmp
            # ehrbase.toml (+ any config.files) mounted read-only at /etc/ehrbase.
            - name: config
              mountPath: /etc/ehrbase
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          projected:
            sources:
              - configMap:
                  name: ehrbase-rs
                  items:
                    - key: ehrbase.toml
                      path: ehrbase.toml
              - secret:
                  name: ehrbase-rs-config
