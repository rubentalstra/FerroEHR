---
# Source: ferroehr/templates/networkpolicy.yaml
# Default-deny ingress for the ferroehr pods, admitting traffic ONLY to the
# API port (and the management port when it runs on its own listener). Every
# other inbound port is denied. A PHI workload should never be reachable on
# anything but its serving port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-3.2.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.17.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
        - port: management
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    # DNS is always required.
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
      - port: 5432
        protocol: TCP
      to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: postgres
