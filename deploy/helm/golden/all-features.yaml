# Source: ferroehr/templates/secret.yaml
# Mounted config files (TOML/PEM) at /etc/ferroehr — file-shaped material an
# in-TOML `*_path`/`*_file` key points at: the PGP key, Cedar/ABAC policies,
# ATNA PEMs, a JWKS blob. Mounted alongside ferroehr.toml.
apiVersion: v1
kind: Secret
metadata:
  name: ferroehr-config
  labels:
    helm.sh/chart: ferroehr-3.2.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.17.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
type: Opaque
stringData:
  signing.asc: |
    -----BEGIN PGP PRIVATE KEY BLOCK-----
    (dev placeholder)
    -----END PGP PRIVATE KEY BLOCK-----
---
# Source: ferroehr/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-3.2.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.17.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
data:
  # The whole server configuration as one ferroehr.toml, mounted at
  # /etc/ferroehr/ferroehr.toml (config search-order position 4). Rendered from
  # .Values.config (minus `files`, which is mounted separately). Secrets are NOT
  # here — they are injected as FERROEHR_* env from the Secret and override the file.
  ferroehr.toml: |
    [admin]
      enabled = true
    
    [audit]
      enabled = true
      enterprise_site_id = "site-1"
      fail_mode = "closed"
      source_id = "ferroehr-prod"
      [audit.fhir_feed]
        enabled = true
        url = "https://arr.example.com/fhir"
      [audit.store]
        enabled = true
        retention_days = 90.0
      [audit.syslog]
        enabled = true
        host = "arr.example.com"
        port = 6514.0
        transport = "tls"
    
    [auth]
      enabled = true
      [auth.basic]
    
        [[auth.basic.users]]
          password_hash = "$argon2id$v=19$m=4096,t=2,p=1$c2FsdA$hash"
          roles = ["USER"]
          username = "clinician"
      [auth.oidc]
        algorithms = ["RS256"]
        audiences = ["ferroehr"]
        issuer = "https://keycloak.example.com/realms/ferroehr"
    
    [authz]
      [authz.abac]
        enabled = true
        engine = "cedar"
        organization_claim = "organization_id"
        patient_claim = "patient_id"
        [authz.abac.cedar]
          policy_dir = "/etc/ferroehr"
      [authz.rbac]
        admin_role = "ADMIN"
        enabled = true
        management_access = "admin_only"
        user_role = "USER"
    
    [db]
      acquire_timeout_secs = 30.0
      max_connections = 10.0
      min_connections = 0.0
    
    [events]
      enabled = true
      exchange = "ferroehr.events"
      tls = true
    
    [fhir]
      api_enabled = true
      [fhir.outbound]
        enabled = true
        exchange = "ferroehr.fhir"
        tls = true
    
    [log]
      filter = "info,ferroehr=debug"
      format = "json"
    
    [management]
      access_default = "admin_only"
      base_path = "/management"
      enabled = true
      port = 9100.0
      [management.endpoints]
        env = "admin_only"
        flamegraph = "off"
        info = "admin_only"
        loggers = "admin_only"
        metrics = "admin_only"
        prometheus = "public"
    
    [multimedia]
      allow_http = false
      bucket = "openehr-multimedia"
      enabled = true
      endpoint = "https://s3.example.com"
      region = "eu-west-1"
      threshold_bytes = 262144.0
    
    [query]
      plan_cache_capacity = 256.0
      timeout_ms = 30000.0
    
    [server]
      base_path = "/ferroehr/rest/openehr/v1"
      bind = "0.0.0.0:8080"
      cors_permissive = false
      swagger_ui = true
    
    [signing]
      enabled = true
      key_path = "/etc/ferroehr/signing.asc"
      mode = "pgp"
      verify_on_read = "strict"
    
    [smart]
      ehr_id_claim = "ehrId"
      enabled = true
      patient_claim = "patient"
    
    [subject_proxy]
      [subject_proxy.systems]
        [subject_proxy.systems.pas]
          base_url = "https://pas.example.com/fhir"
    
    [telemetry]
      environment = "production"
      metrics_push = true
      otlp_endpoint = "http://otel-collector:4317"
      service_name = "ferroehr"
      traces_sample_ratio = 0.1
    
    [tenancy]
      claim = "realm_access.tenant"
      enabled = true
      header = "X-FerroEHR-Tenant"
    
    [terminology]
      api_enabled = true
      [terminology.external]
        enabled = true
        fail_on_error = false
        [terminology.external.providers]
          [terminology.external.providers.default]
            operation = "validate_code"
            type = "fhir"
            url = "https://tx.example.com/fhir"
