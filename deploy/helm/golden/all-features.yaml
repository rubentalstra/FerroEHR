# Source: ferroehr/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-7.0.5
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.0.18"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
data:
  # The whole server configuration as one ferroehr.toml, mounted at
  # /etc/ferroehr/ferroehr.toml (config search-order position 4). Rendered by
  # `ferroehr.configToml`, never from .Values.config verbatim: a ConfigMap is not
  # a sensitive object, so a secret-bearing key is either refused (when a
  # `secrets:` key carries it) or moves this whole file into the Secret, in which
  # case this ConfigMap is not created at all.
  # NOTE: Helm decodes values through JSON, so every number reaches a template as
  # a float64 and `toToml` writes it back as a TOML float (`10.0`, `1.6777216e+07`)
  # — the server's configuration layer coerces those onto integer keys, which is
  # why the rendered file is accepted as written.
  ferroehr.toml: |
    spec_profile = "development"
    
    [admin]
      enabled = true
    
    [audit]
      enabled = true
      enterprise_site_id = "site-1"
      fail_mode = "closed"
      source_id = "ferroehr-prod"
      [audit.fhir_feed]
        enabled = true
      [audit.store]
        enabled = true
        retention_days = 90.0
      [audit.syslog]
        enabled = true
        host = "arr.example.com"
        port = 6514.0
        transport = "tls"
    
    [auth]
      enabled = true
      [auth.oidc]
        algorithms = ["HS256"]
        audiences = ["ferroehr"]
        issuer = "https://keycloak.example.com/realms/ferroehr"
    
    [authz]
      [authz.abac]
        enabled = true
        engine = "cedar"
        organization_claim = "organization_id"
        patient_claim = "patient_id"
        [authz.abac.cedar]
          policy_dir = "/etc/ferroehr"
      [authz.rbac]
        admin_role = "ADMIN"
        enabled = true
        user_role = "USER"
    
    [db]
      acquire_timeout_secs = 30.0
      max_connections = 10.0
      migrate = "apply"
      min_connections = 0.0
      statement_timeout_ms = 60000.0
    
    [events]
      enabled = true
      exchange = "ferroehr.events"
      tls = true
    
    [fhir]
      api_enabled = true
      [fhir.outbound]
        enabled = true
        exchange = "ferroehr.fhir"
        tls = true
    
    [log]
      filter = "info,ferroehr=debug"
      format = "json"
    
    [management]
      base_path = "/management"
      enabled = true
      port = 9100.0
      [management.endpoints]
        env = "admin_only"
        flamegraph = "off"
        info = "admin_only"
        loggers = "admin_only"
        metrics = "admin_only"
        prometheus = "public"
    
    [multimedia]
      allow_http = false
      bucket = "openehr-multimedia"
      enabled = true
      endpoint = "https://s3.example.com"
      region = "eu-west-1"
      threshold_bytes = 262144.0
    
    [query]
      plan_cache_capacity = 256.0
      timeout_ms = 30000.0
    
    [server]
      base_path = "/ferroehr/rest/openehr/v1"
      bind = "0.0.0.0:8080"
      cors_permissive = false
      swagger_ui = true
      [server.connection]
        header_read_timeout_secs = 10.0
        http2_keep_alive_interval_secs = 30.0
        http2_keep_alive_timeout_secs = 10.0
        max_concurrent_streams = 256.0
      [server.limits]
        body_bytes = 1.6777216e+07
        bulk_body_bytes = 6.7108864e+07
      [server.rate_limit]
        address_burst = 4096.0
        address_per_second = 2048.0
        enabled = true
        principal_burst = 2048.0
        principal_per_second = 1024.0
    
    [signing]
      enabled = true
      key_path = "/etc/ferroehr/signing.asc"
      mode = "pgp"
      verify_on_read = "strict"
    
    [smart]
      ehr_id_claim = "ehrId"
      enabled = true
      patient_claim = "patient"
      public_base_url = "https://ferroehr.example.com"
      [smart.endpoints]
        authorization_endpoint = "https://keycloak.example.com/realms/ferroehr/protocol/openid-connect/auth"
        capabilities = ["launch-ehr", "sso-openid-connect"]
        code_challenge_methods_supported = ["S256"]
        grant_types_supported = ["authorization_code", "client_credentials"]
        issuer = "https://keycloak.example.com/realms/ferroehr"
        jwks_uri = "https://keycloak.example.com/realms/ferroehr/protocol/openid-connect/certs"
        response_types_supported = ["code"]
        scopes_supported = ["openid", "fhirUser", "launch", "patient/*.rs"]
        token_endpoint = "https://keycloak.example.com/realms/ferroehr/protocol/openid-connect/token"
        token_endpoint_auth_methods_supported = ["client_secret_basic", "private_key_jwt"]
    
    [subject_proxy]
      [subject_proxy.systems]
        [subject_proxy.systems.pas]
          base_url = "https://pas.example.com/fhir"
    
    [telemetry]
      environment = "production"
      metrics_push = true
      otlp_endpoint = "http://otel-collector:4317"
      service_name = "ferroehr"
      traces_sample_ratio = 0.1
    
    [tenancy]
      claim = "realm_access.tenant"
      enabled = true
      header = "X-FerroEHR-Tenant"
    
    [terminology]
      api_enabled = true
      [terminology.external]
        enabled = true
        fail_on_error = false
        [terminology.external.oauth2_clients]
          [terminology.external.oauth2_clients.tx]
            client_id = "ferroehr"
            client_secret_file = "/etc/ferroehr-secrets/terminology.external.oauth2_clients.tx.client_secret"
            scopes = ["tx.read"]
            token_url = "https://idp.example.org/realms/ts/protocol/openid-connect/token"
        [terminology.external.providers]
          [terminology.external.providers.default]
            operation = "validate_code"
            type = "fhir"
            url = "https://tx.example.com/fhir"
    

---
# Source: ferroehr/templates/grafana-dashboard.yaml
# The default Grafana dashboard, shipped for sidecar auto-import: the Grafana
# Helm chart's dashboard sidecar (which kube-prometheus-stack embeds) watches
# ConfigMaps carrying the `grafana_dashboard` label — any value matches its
# default `sidecar.dashboards.labelValue: ""` — and imports every data key as
# a dashboard (github.com/grafana-community/helm-charts, charts/grafana
# values). The sidecar searches its own release namespace unless configured
# otherwise, so install this release there or widen `searchNamespace`. The
# `grafana_folder` annotation takes effect only where the sidecar's
# `folderAnnotation` feature is turned on; it is inert otherwise.
#
# The JSON is the canonical copy at files/dashboards/ferroehr-overview.json;
# the compose observability overlay inlines the same document, and
# scripts/checks/dashboard-drift.sh holds the two identical.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferroehr-grafana-dashboard
  labels:
    helm.sh/chart: ferroehr-7.0.5
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.0.18"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "FerroEHR"
data:
  ferroehr-overview.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "title": "FerroEHR — service overview",
      "uid": "ferroehr-overview",
      "tags": ["ferroehr", "openehr"],
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "type": "stat",
          "title": "Version",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "/^version$/" }, "textMode": "name" },
          "targets": [
            { "expr": "ferroehr_build_info", "format": "table", "instant": true }
          ]
        },
        {
          "type": "stat",
          "title": "Uptime",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 0 }, "overrides": [] },
          "targets": [
            { "expr": "time() - process_start_time_seconds", "legendFormat": "uptime" }
          ]
        },
        {
          "type": "stat",
          "title": "In-flight requests",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "sum(http_server_active_requests)", "legendFormat": "in flight" }
          ]
        },
        {
          "type": "stat",
          "title": "5xx error ratio (1h)",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.001 },
                { "color": "red", "value": 0.01 }
              ] }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{status_class=\"5xx\"}[1h])) / sum(rate(http_server_request_duration_seconds_count[1h]))",
              "legendFormat": "5xx ratio"
            }
          ]
        },
        {
          "type": "stat",
          "title": "DB pool in use",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "sum(db_pool_connections{state=\"in_use\"})", "legendFormat": "in use" }
          ]
        },
        {
          "type": "row",
          "title": "RED — requests, errors, duration",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 4 }
        },
        {
          "type": "timeseries",
          "title": "Request rate by route (req/s)",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (http_route) (rate(http_server_request_duration_seconds_count[$__rate_interval]))",
              "legendFormat": "{{http_route}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Error rate by status class (req/s)",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (status_class) (rate(http_server_request_duration_seconds_count{status_class=~\"4xx|5xx\"}[$__rate_interval]))",
              "legendFormat": "{{status_class}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request latency (p50 / p95 / p99)",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency by route",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{http_route}}"
            }
          ]
        },
        {
          "type": "row",
          "title": "AQL",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 }
        },
        {
          "type": "timeseries",
          "title": "AQL query rate by outcome (q/s)",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(aql_queries_total[$__rate_interval]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "AQL p95 latency by phase",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, phase) (rate(aql_query_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{phase}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "AQL plan-cache hit ratio",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(aql_plan_cache_events_total{event=\"hit\"}[$__rate_interval])) / sum(rate(aql_plan_cache_events_total[$__rate_interval]))",
              "legendFormat": "hit ratio"
            }
          ]
        },
        {
          "type": "row",
          "title": "Database and runtime",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 }
        },
        {
          "type": "timeseries",
          "title": "DB pool connections by state",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (state) (db_pool_connections)",
              "legendFormat": "{{state}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Tokio runtime (tasks, queue depth, workers)",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "tokio_alive_tasks", "legendFormat": "alive tasks" },
            { "expr": "tokio_global_queue_depth", "legendFormat": "global queue depth" },
            { "expr": "tokio_workers", "legendFormat": "workers" }
          ]
        },
        {
          "type": "row",
          "title": "Audit (IHE ATNA)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 39 }
        },
        {
          "type": "timeseries",
          "title": "Audit events emitted vs forwarded (events/s)",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 40 },
          "fieldConfig": { "defaults": { "unit": "cps" }, "overrides": [] },
          "targets": [
            { "expr": "sum(rate(atna_audit_emitted_total[$__rate_interval]))", "legendFormat": "emitted" },
            { "expr": "sum(rate(atna_audit_sent_total[$__rate_interval]))", "legendFormat": "forwarded" }
          ]
        }
      ]
    }
    

