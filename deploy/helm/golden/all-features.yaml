# Source: ehrbase-rs/templates/secret.yaml
# Mounted config files (TOML/PEM) at /etc/ehrbase — file-shaped material an
# in-TOML `*_path`/`*_file` key points at: the PGP key, Cedar/ABAC policies,
# ATNA PEMs, a JWKS blob. Mounted alongside ehrbase.toml.
apiVersion: v1
kind: Secret
metadata:
  name: ehrbase-rs-config
  labels:
    helm.sh/chart: ehrbase-rs-3.0.1
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
type: Opaque
stringData:
  signing.asc: |
    -----BEGIN PGP PRIVATE KEY BLOCK-----
    (dev placeholder)
    -----END PGP PRIVATE KEY BLOCK-----
---
# Source: ehrbase-rs/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.1
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
data:
  # The whole server configuration as one ehrbase.toml, mounted at
  # /etc/ehrbase/ehrbase.toml (config search-order position 4). Rendered from
  # .Values.config (minus `files`, which is mounted separately). Secrets are NOT
  # here — they are injected as EHRBASE_* env from the Secret and override the file.
  ehrbase.toml: |
    [admin]
      enabled = true
    
    [atna]
      enabled = true
      enterprise_site_id = "site-1"
      fail_mode = "closed"
      repository_host = "arr.example.com"
      repository_port = 6514.0
      source_id = "ehrbase-prod"
      transport = "tls"
    
    [auth]
      enabled = true
      [auth.basic]
    
        [[auth.basic.users]]
          password_hash = "$argon2id$v=19$m=4096,t=2,p=1$c2FsdA$hash"
          roles = ["USER"]
          username = "clinician"
      [auth.oidc]
        algorithms = ["RS256"]
        audiences = ["ehrbase"]
        issuer = "https://keycloak.example.com/realms/ehrbase"
    
    [authz]
      [authz.abac]
        enabled = true
        engine = "cedar"
        organization_claim = "organization_id"
        patient_claim = "patient_id"
        [authz.abac.cedar]
          policy_dir = "/etc/ehrbase"
      [authz.rbac]
        admin_role = "ADMIN"
        enabled = true
        management_access = "admin_only"
        user_role = "USER"
    
    [db]
      acquire_timeout_secs = 30.0
      max_connections = 10.0
      min_connections = 0.0
    
    [events]
      enabled = true
      exchange = "ehrbase.events"
      tls = true
    
    [fhir]
      api_enabled = true
      [fhir.outbound]
        enabled = true
        exchange = "ehrbase.fhir"
        tls = true
    
    [log]
      filter = "info,ehrbase=debug"
      format = "json"
    
    [management]
      access_default = "admin_only"
      base_path = "/management"
      enabled = true
      port = 9100.0
      probes_enabled = true
      [management.endpoints]
        env = "admin_only"
        health = "private"
        info = "admin_only"
        loggers = "admin_only"
        metrics = "admin_only"
        prometheus = "public"
    
    [multimedia]
      allow_http = false
      bucket = "openehr-multimedia"
      enabled = true
      endpoint = "https://s3.example.com"
      region = "eu-west-1"
      threshold_bytes = 262144.0
    
    [query]
      plan_cache_capacity = 256.0
      timeout_ms = 30000.0
    
    [server]
      base_path = "/ehrbase/rest/openehr/v1"
      bind = "0.0.0.0:8080"
      cors_permissive = false
      swagger_ui = true
    
    [signing]
      enabled = true
      key_path = "/etc/ehrbase/signing.asc"
      mode = "pgp"
      verify_on_read = "strict"
    
    [smart]
      ehr_id_claim = "ehrId"
      enabled = true
      patient_claim = "patient"
    
    [subject_proxy]
      [subject_proxy.systems]
        [subject_proxy.systems.pas]
          base_url = "https://pas.example.com/fhir"
    
    [telemetry]
      environment = "production"
      metrics_push = true
      otlp_endpoint = "http://otel-collector:4317"
      service_name = "ehrbase-rs"
      traces_sample_ratio = 0.1
    
    [tenancy]
      claim = "realm_access.tenant"
      enabled = true
      header = "X-EHRbase-Tenant"
    
    [terminology]
      api_enabled = true
      [terminology.external]
        enabled = true
        fail_on_error = false
        [terminology.external.providers]
          [terminology.external.providers.default]
            operation = "validate_code"
            type = "fhir"
            url = "https://tx.example.com/fhir"
