# Source: ehrbase-rs/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.0
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ehrbase-rs
      app.kubernetes.io/instance: ehrbase-rs
  template:
    metadata:
      annotations:
        # Roll pods when the non-secret config changes.
        checksum/config: a4bb3107995058f4c2c784da76fef4a76b345aa78d9c74f2f3c089e3f6479474
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/management/prometheus"
      labels:
        app.kubernetes.io/name: ehrbase-rs
        app.kubernetes.io/instance: ehrbase-rs
    spec:
      serviceAccountName: ehrbase-rs
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ehrbase
          image: "ghcr.io/rubentalstra/ehrbase-rs:3.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9100
              protocol: TCP
          # The DSN comes from an existing Secret (preferred) or the chart Secret.
          env:
            - name: EHRBASE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: ehrbase-db
                  key: EHRBASE_DB_URL
            - name: EHRBASE_REST_AUTH__OIDC__HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_REST_AUTH__OIDC__HMAC_SECRET
            - name: EHRBASE_SIGNING_KEY_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_SIGNING_KEY_PASSPHRASE
            - name: EHRBASE_EVENTS_URL
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_EVENTS_URL
            - name: EHRBASE_FHIR_OUTBOUND_URL
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_FHIR_OUTBOUND_URL
            - name: EHRBASE_MULTIMEDIA_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_MULTIMEDIA_ACCESS_KEY_ID
            - name: EHRBASE_MULTIMEDIA_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ehrbase-rs-env
                  key: EHRBASE_MULTIMEDIA_SECRET_ACCESS_KEY
            - name: EHRBASE_REST_CONFIG
              value: /etc/ehrbase/rest.toml
            - name: EHRBASE_SIGNING_KEY_PATH
              value: /etc/ehrbase/signing.asc
          envFrom:
            - configMapRef:
                name: ehrbase-rs
          livenessProbe:
            httpGet:
              path: /management/health/liveness
              port: management
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /management/health/readiness
              port: management
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /management/health/liveness
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem=true → give the process a writable scratch dir.
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/ehrbase
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          secret:
            secretName: ehrbase-rs-config
