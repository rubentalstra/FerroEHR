# Source: ferroehr/templates/servicemonitor.yaml
# A Prometheus Operator ServiceMonitor. The prometheus.io/* pod annotations that
# `metrics.enabled` adds are honoured only by a Prometheus whose scrape config
# does kubernetes_sd discovery; an operator-managed Prometheus selects its
# targets through ServiceMonitor objects instead
# (https://prometheus-operator.dev/docs/developer/getting-started/), so a
# kube-prometheus-stack cluster needs this object and not those annotations.
# Requires the monitoring.coreos.com CRDs to be installed first.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-7.0.5
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.0.18"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr
  namespaceSelector:
    matchNames:
      - ferroehr
  endpoints:
    # The Service port the ops-introspection surface answers on: its own
    # `management` port when config.management.port is set, else the API port.
    - port: management
      path: "/management/prometheus"
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
