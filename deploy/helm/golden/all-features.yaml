  FERROEHR__AUTH__OIDC__HMAC_SECRET: "dev-hmac-secret"
  FERROEHR__SIGNING__KEY_PASSPHRASE: "dev-passphrase"
  FERROEHR__EVENTS__URL: "amqps://user:pass@rabbitmq:5671/%2f"
  FERROEHR__FHIR__OUTBOUND__URL: "amqps://user:pass@rabbitmq:5671/%2f"
  FERROEHR__MULTIMEDIA__ACCESS_KEY_ID: "AKIAEXAMPLE"
  FERROEHR__MULTIMEDIA__SECRET_ACCESS_KEY: "s3-secret"
