---
# Source: ferroehr/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-3.2.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
data:
  # The whole server configuration as one ferroehr.toml, mounted at
  # /etc/ferroehr/ferroehr.toml (config search-order position 4). Rendered from
  # .Values.config (minus `files`, which is mounted separately). Secrets are NOT
  # here — they are injected as FERROEHR_* env from the Secret and override the file.
  ferroehr.toml: |
    [admin]
      enabled = false
    
    [audit]
      enabled = true
      [audit.store]
        enabled = true
        retention_days = 0.0
    
    [auth]
      enabled = true
    
    [authz]
      [authz.abac]
        enabled = false
      [authz.rbac]
        admin_role = "ADMIN"
        enabled = true
        management_access = "admin_only"
        user_role = "USER"
    
    [db]
      acquire_timeout_secs = 30.0
      max_connections = 10.0
      min_connections = 0.0
    
    [events]
      enabled = false
      exchange = "ferroehr.events"
      tls = false
    
    [fhir]
      api_enabled = false
      [fhir.outbound]
        enabled = false
        exchange = "ferroehr.fhir"
        tls = false
    
    [log]
      format = "json"
    
    [management]
      access_default = "admin_only"
      base_path = "/management"
      enabled = true
      [management.endpoints]
        env = "off"
        info = "off"
        loggers = "off"
        metrics = "off"
        prometheus = "off"
    
    [multimedia]
      allow_http = false
      bucket = "openehr-multimedia"
      enabled = false
      region = "us-east-1"
    
    [server]
      base_path = "/ferroehr/rest/openehr/v1"
      bind = "0.0.0.0:8080"
      cors_permissive = false
      swagger_ui = true
    
    [signing]
      enabled = true
      mode = "digest"
      verify_on_read = "strict"
    
    [tenancy]
      claim = "tenant"
      enabled = false
    
    [terminology]
      api_enabled = false
      [terminology.external]
        enabled = false
        fail_on_error = false
---
# Source: ferroehr/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-3.2.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
---
# Source: ferroehr/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-3.2.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "3.16.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr
  template:
    metadata:
      annotations:
        # Roll pods when the rendered ferroehr.toml changes.
        checksum/config: de613573c9decf1631cae5ac1f2a2abf145a0d09f39cb502627e09efb96932cf
      labels:
        app.kubernetes.io/name: ferroehr
        app.kubernetes.io/instance: ferroehr
    spec:
      serviceAccountName: ferroehr
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ferroehr
          image: "ghcr.io/rubentalstra/ferroehr:3.16.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Only SECRET config is env; the rest is the mounted ferroehr.toml.
          # The DSN comes from an existing Secret (preferred) or the chart Secret;
          # the env layer overrides the file, so each secret here wins over any
          # matching TOML key.
          env:
            - name: FERROEHR__DB__URL
              valueFrom:
                secretKeyRef:
                  name: ferroehr-db
                  key: FERROEHR__DB__URL
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem=true → give the process a writable scratch dir.
            - name: tmp
              mountPath: /tmp
            # ferroehr.toml (+ any config.files) mounted read-only at /etc/ferroehr.
            - name: config
              mountPath: /etc/ferroehr
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          projected:
            sources:
              - configMap:
                  name: ferroehr
                  items:
                    - key: ferroehr.toml
                      path: ferroehr.toml
