---
# Source: ehrbase-rs/templates/networkpolicy.yaml
# Default-deny ingress for the ehrbase-rs pods, admitting traffic ONLY to the
# API port (and the management port when it runs on its own listener). Every
# other inbound port is denied. A PHI workload should never be reachable on
# anything but its serving port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.2
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ehrbase-rs
      app.kubernetes.io/instance: ehrbase-rs
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
---
# Source: ehrbase-rs/templates/poddisruptionbudget.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.2
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ehrbase-rs
      app.kubernetes.io/instance: ehrbase-rs
---
# Source: ehrbase-rs/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.2
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
automountServiceAccountToken: false
---
# Source: ehrbase-rs/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.2
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
data:
  # The whole server configuration as one ehrbase.toml, mounted at
  # /etc/ehrbase/ehrbase.toml (config search-order position 4). Rendered from
  # .Values.config (minus `files`, which is mounted separately). Secrets are NOT
  # here — they are injected as EHRBASE_* env from the Secret and override the file.
  ehrbase.toml: |
    [admin]
      enabled = false
    
    [atna]
      enabled = false
    
    [auth]
      enabled = true
    
    [authz]
      [authz.abac]
        enabled = false
      [authz.rbac]
        admin_role = "ADMIN"
        enabled = true
        management_access = "admin_only"
        user_role = "USER"
    
    [db]
      acquire_timeout_secs = 30.0
      max_connections = 10.0
      min_connections = 0.0
    
    [events]
      enabled = false
      exchange = "ehrbase.events"
      tls = false
    
    [fhir]
      api_enabled = false
      [fhir.outbound]
        enabled = false
        exchange = "ehrbase.fhir"
        tls = false
    
    [log]
      format = "json"
    
    [management]
      access_default = "admin_only"
      base_path = "/management"
      enabled = true
      probes_enabled = true
      [management.endpoints]
        env = "off"
        health = "off"
        info = "off"
        loggers = "off"
        metrics = "off"
        prometheus = "off"
    
    [multimedia]
      allow_http = false
      bucket = "openehr-multimedia"
      enabled = false
      region = "us-east-1"
    
    [server]
      base_path = "/ehrbase/rest/openehr/v1"
      bind = "0.0.0.0:8080"
      cors_permissive = false
      swagger_ui = true
    
    [signing]
      enabled = true
      mode = "digest"
      verify_on_read = "off"
    
    [tenancy]
      claim = "tenant"
      enabled = false
    
    [terminology]
      api_enabled = false
      [terminology.external]
        enabled = false
        fail_on_error = false
---
# Source: ehrbase-rs/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.2
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
---
# Source: ehrbase-rs/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehrbase-rs
  labels:
    helm.sh/chart: ehrbase-rs-3.0.2
    app.kubernetes.io/name: ehrbase-rs
    app.kubernetes.io/instance: ehrbase-rs
    app.kubernetes.io/version: "3.0.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ehrbase-rs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ehrbase-rs
      app.kubernetes.io/instance: ehrbase-rs
  template:
    metadata:
      annotations:
        # Roll pods when the rendered ehrbase.toml changes.
        checksum/config: 3bf0b723b61503bc653df58ac3cd28d78e894c76693a959b9bfd97677b669c5a
      labels:
        app.kubernetes.io/name: ehrbase-rs
        app.kubernetes.io/instance: ehrbase-rs
    spec:
      serviceAccountName: ehrbase-rs
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ehrbase
          image: "ghcr.io/rubentalstra/ehrbase-rs:3.0.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Only SECRET config is env; the rest is the mounted ehrbase.toml.
          # The DSN comes from an existing Secret (preferred) or the chart Secret;
          # the env layer overrides the file, so each secret here wins over any
          # matching TOML key.
          env:
            - name: EHRBASE__DB__URL
              valueFrom:
                secretKeyRef:
                  name: ehrbase-db
                  key: EHRBASE__DB__URL
          livenessProbe:
            httpGet:
              path: /management/health/liveness
              port: management
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /management/health/readiness
              port: management
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /management/health/liveness
              port: management
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem=true → give the process a writable scratch dir.
            - name: tmp
              mountPath: /tmp
            # ehrbase.toml (+ any config.files) mounted read-only at /etc/ehrbase.
            - name: config
              mountPath: /etc/ehrbase
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          projected:
            sources:
              - configMap:
                  name: ehrbase-rs
                  items:
                    - key: ehrbase.toml
                      path: ehrbase.toml
