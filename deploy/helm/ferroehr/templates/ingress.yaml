{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ferroehr.fullname" . }}
  labels:
    {{- include "ferroehr.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- /* `pathType` is REQUIRED on networking.k8s.io/v1 and the values
                   schema does not make it so; without a default an omitted one
                   renders empty and the API server rejects the whole Ingress
                   (https://kubernetes.io/docs/concepts/services-networking/ingress/#path-types). */}}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "ferroehr.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
