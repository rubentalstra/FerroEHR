{{- if eq (include "ferroehr.hasChartSecret" .) "true" }}
# Chart-managed Secret. In production prefer database.existingSecret (and an
# external secret store / IRSA for the rest); anything set here is rendered from
# values, so keep it out of committed values.
#
# Two key shapes live here, and the difference is deliberate. A key spelled
# `<config.path>` is MOUNTED as a read-only file and reached through the config
# tree's `*_file` sibling — the posture the OWASP Kubernetes Security Cheat Sheet
# asks for, since an environment variable is readable through /proc/<pid>/environ
# and inherited by every child process
# (https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html).
# A key spelled `FERROEHR__…` is injected as an environment VALUE, which is the
# honest interim for the three secrets whose config keys have no `*_file` sibling
# (db.url, events.url, fhir.outbound.url).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ferroehr.secretName" . }}
  labels:
    {{- include "ferroehr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.authOidcHmacSecret }}
  auth.oidc.hmac_secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.signingKeyPassphrase }}
  signing.key_passphrase: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.multimediaSecretAccessKey }}
  multimedia.secret_access_key: {{ . | quote }}
  {{- end }}
  {{- if and (not .Values.database.existingSecret) .Values.database.url }}
  FERROEHR__DB__URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- with .Values.secrets.eventsUrl }}
  FERROEHR__EVENTS__URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.fhirOutboundUrl }}
  FERROEHR__FHIR__OUTBOUND__URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.multimediaAccessKeyId }}
  FERROEHR__MULTIMEDIA__ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if .Values.config.files }}
---
# Mounted config files (TOML/PEM) at /etc/ferroehr — file-shaped material an
# in-TOML `*_path`/`*_file` key points at: the PGP key, Cedar/ABAC policies,
# ATNA PEMs, a JWKS blob. Mounted alongside ferroehr.toml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ferroehr.configSecretName" . }}
  labels:
    {{- include "ferroehr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $content := .Values.config.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
