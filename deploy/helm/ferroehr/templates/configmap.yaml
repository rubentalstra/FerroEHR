apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ferroehr.fullname" . }}
  labels:
    {{- include "ferroehr.labels" . | nindent 4 }}
data:
  # The whole server configuration as one ferroehr.toml, mounted at
  # /etc/ferroehr/ferroehr.toml (config search-order position 4). Rendered from
  # .Values.config (minus `files`, which is mounted separately). Secrets are NOT
  # here — they are injected from the Secret and override the file.
  # NOTE: Helm decodes values through JSON, so every number reaches a template as
  # a float64 and `toToml` writes it back as a TOML float (`10.0`, `1.6777216e+07`)
  # — the server's configuration layer coerces those onto integer keys, which is
  # why the rendered file is accepted as written.
  ferroehr.toml: |
{{ omit .Values.config "files" | toToml | indent 4 }}
