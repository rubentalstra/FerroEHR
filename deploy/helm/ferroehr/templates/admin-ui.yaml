{{- if .Values.adminUi.enabled }}
{{- /*
The admin console — an OPTIONAL companion workload (#2193).

Everything here is gated on `adminUi.enabled`, so the default render is
byte-identical to a chart without this file. The console is a REST client of the
CDR by mandate (it may never reach the database or the platform library), which
is what makes the egress policy below enforceable rather than advisory.

The pod-security posture is NOT inherited from the server's values: a second
workload is exactly where a hardened posture is quietly lost, so the console
carries its own copy and the chart's security gate checks both.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ferroehr.adminUiFullname" . }}
  labels:
    {{- include "ferroehr.adminUiLabels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferroehr.adminUiFullname" . }}
  annotations:
    kubernetes.io/description: >-
      In-cluster address for the FerroEHR admin console. The console is a REST client of the CDR and holds no data of its own; it is the human-facing surface, so this is the Service an Ingress normally publishes.
  labels:
    {{- include "ferroehr.adminUiLabels" . | nindent 4 }}
spec:
  {{- /* Rendered only when it differs from the API default, per
         https://kubernetes.io/docs/concepts/configuration/overview/
         "Don't specify default values unnecessarily" — as on the CDR Service.
         `protocol: TCP` is gone from the port for the same reason. */}}
  {{- if ne .Values.adminUi.service.type "ClusterIP" }}
  type: {{ .Values.adminUi.service.type }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.adminUi.service.port }}
      targetPort: http
      appProtocol: http
  selector:
    {{- include "ferroehr.adminUiSelectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ferroehr.adminUiFullname" . }}
  annotations:
    kubernetes.io/description: >-
      The FerroEHR admin console: a Leptos SSR web UI that consumes the CDR strictly over ITS-REST. It never reaches the database, which the console NetworkPolicy enforces rather than assumes.
  labels:
    {{- include "ferroehr.adminUiLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.adminUi.replicaCount }}
  selector:
    matchLabels:
      {{- include "ferroehr.adminUiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ferroehr.adminUiSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ferroehr.adminUiFullname" . }}
      automountServiceAccountToken: false
      # Same reason as the server's: the kubelet's per-Service link variables
      # land in the reserved `FERROEHR_` namespace for any Service named
      # `ferroehr*`, and a strict boot-time sweep then refuses to start
      # (https://kubernetes.io/docs/concepts/services-networking/service/#environment-variables).
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.adminUi.terminationGracePeriodSeconds }}
      {{- if not .Values.hostUsers }}
      {{- include "ferroehr.hostUsers" . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.adminUi.podSecurityContext | nindent 8 }}
      containers:
        - name: admin-ui
          image: "{{ include "ferroehr.adminUiImage" . }}"
          imagePullPolicy: {{ .Values.adminUi.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.adminUi.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # The CDR is addressed by its in-cluster Service — the console never
            # talks to the database, and the egress policy below enforces that.
            - name: FERROEHR_ADMIN__CDR__BASE_URL
              value: {{ printf "http://%s:%v" (include "ferroehr.fullname" .) .Values.service.port | quote }}
            {{- if .Values.adminUi.auth.oidc.enabled }}
            - name: FERROEHR_ADMIN__AUTH__OIDC__ENABLED
              value: "true"
            - name: FERROEHR_ADMIN__AUTH__OIDC__ISSUER
              value: {{ .Values.adminUi.auth.oidc.issuer | quote }}
            - name: FERROEHR_ADMIN__AUTH__OIDC__CLIENT_ID
              value: {{ .Values.adminUi.auth.oidc.clientId | quote }}
            - name: FERROEHR_ADMIN__AUTH__OIDC__PUBLIC_BASE_URL
              value: {{ .Values.adminUi.auth.oidc.publicBaseUrl | quote }}
            {{- if .Values.adminUi.existingSecret }}
            # The client secret is a mounted FILE and only its path is
            # environment: an env VALUE is readable through /proc/<pid>/environ
            # and inherited by every child process.
            - name: FERROEHR_ADMIN__AUTH__OIDC__CLIENT_SECRET_FILE
              value: /etc/ferroehr-admin-secrets/client_secret
            {{- end }}
            {{- end }}
            {{- with .Values.adminUi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- /* The console serves one page tree from one process, so `/` is
                 both "the process answers" and "the process can serve" — the
                 two probe roles genuinely coincide here, unlike the server's,
                 where readiness owns the database. What it still needs is the
                 third role: a startup probe, so a slow first render is not
                 read as a wedged process and restarted mid-boot
                 (https://kubernetes.io/docs/concepts/workloads/pods/probes/). */}}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          {{- if gt (int .Values.adminUi.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.adminUi.preStopSleepSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.adminUi.resources | nindent 12 }}
          volumeMounts:
            # `readOnlyRootFilesystem: true` leaves nowhere to write, so the
            # writable scratch the runtime needs is an explicit emptyDir.
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.adminUi.auth.oidc.enabled .Values.adminUi.existingSecret }}
            - name: admin-secrets
              mountPath: /etc/ferroehr-admin-secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.adminUi.auth.oidc.enabled .Values.adminUi.existingSecret }}
        - name: admin-secrets
          secret:
            secretName: {{ .Values.adminUi.existingSecret }}
            items:
              - key: {{ .Values.adminUi.existingSecretKey }}
                path: client_secret
        {{- end }}
      {{- with .Values.adminUi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.adminUi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.adminUi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.adminUi.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ferroehr.adminUiFullname" . }}
  labels:
    {{- include "ferroehr.adminUiLabels" . | nindent 4 }}
  {{- with .Values.adminUi.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.adminUi.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.adminUi.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.adminUi.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "ferroehr.adminUiFullname" $ }}
                port:
                  number: {{ $.Values.adminUi.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.adminUi.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ferroehr.adminUiFullname" . }}
  labels:
    {{- include "ferroehr.adminUiLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ferroehr.adminUiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {{- with .Values.adminUi.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # The CDR, by pod selector — the console's ONLY application destination.
    #
    # This selects the server's pods exactly: the console carries its own
    # `app.kubernetes.io/name`, so the two label sets no longer overlap and
    # this rule cannot admit console→console traffic.
    - to:
        - podSelector:
            matchLabels:
              {{- include "ferroehr.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    # DNS. Without this the Service name above does not resolve and the console
    # fails in a way that looks like the CDR being down.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.adminUi.auth.oidc.enabled }}
    # The OIDC issuer is off-cluster in nearly every deployment, and the
    # NetworkPolicy API cannot name a DNS host
    # (https://kubernetes.io/docs/concepts/services-networking/network-policies/
    # — "you cannot ... target Services or Pods by name"), so the issuer is
    # admitted as an explicit egress rule the operator narrows with an ipBlock.
    - ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
{{- end }}
