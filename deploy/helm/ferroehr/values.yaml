# Default values for ferroehr.
#
# Configuration model: the server reads ONE `ferroehr.toml`. This
# chart renders that file from the `config:` block below (typed values mapped
# 1:1 onto the ferroehr.toml schema) into a ConfigMap mounted at
# /etc/ferroehr/ferroehr.toml — the server's config search order discovers it
# automatically. Secrets never go in the ConfigMap: they come from a Secret (see
# `secrets:` and `database:`) — mounted as read-only FILES wherever the config key
# has a `*_file` sibling, which is now everything except `audit.fhir_feed.url` and
# `multimedia.access_key_id`; only the mounted PATH is passed as env. `config.files` mounts genuinely file-shaped material
# (Cedar policies, ATNA PEMs, the PGP key, JWKS) that in-TOML `*_path`/`*_file`
# keys point at. `extraEnv` is the escape hatch for anything not surfaced here.
#
# Every feature below defaults to the SAME state as the binary (all optional
# integrations OFF), with one deliberate deployment exception: the management
# surface's master switch is ON, so enabling Prometheus scraping is a one-key
# change (config.management.endpoints.prometheus: public). Every management
# endpoint still defaults to `off`, so nothing is actually exposed. The health
# probes do NOT depend on it: /health, /health/liveness and /health/readiness are
# always served on the HTTP port.
#
# The env-mapping grammar for overrides is FERROEHR_ + the TOML path upper-cased
# with `__` between segments (e.g. config.db.max_connections ⇔
# FERROEHR__DB__MAX_CONNECTIONS). Run `ferroehr config default` to print the
# complete TOML schema with every key and its default.
#
# The database role architecture, the pgaudit/TLS/PITR posture, and the
# optional-integrations security notes are deployment concerns: no openEHR spec
# governs them, so each is summarised inline at the setting it applies to.

# -- Number of replicas (ignored when autoscaling.enabled is true).
replicaCount: 2

# ─────────────────────────────────────────────────────────────────────────────
# Rollout strategy. The OWASP Kubernetes Security Cheat Sheet's upgrade rule is
# that a new version arrives as a rolling update rather than by mutating a
# running container, so the strategy is stated here rather than inherited
# silently from the API server's defaults
# (https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy).
#
# `maxUnavailable: 0` guarantees the served capacity never DROPS during an
# upgrade: a new pod must pass its readiness probe before an old one is removed.
# At the default two replicas this is exactly what Kubernetes already computed
# (25% of 2 rounds down to 0), so it changes nothing here — it only matters above
# two replicas, where the percentage default would take a pod out of service.
# The trade-off, stated because it is real: with no spare scheduling capacity a
# `maxUnavailable: 0` rollout STALLS rather than proceeding at reduced capacity.
# That is the safe direction for a clinical API, and it fails visibly.
# ─────────────────────────────────────────────────────────────────────────────
strategy:
  # -- Rollout strategy. RollingUpdate with maxUnavailable 0 never drops capacity; Recreate takes the service down.
  type: RollingUpdate
  rollingUpdate:
    # -- Extra pods allowed above `replicaCount` while rolling.
    maxSurge: 1
    # -- Pods allowed to be unavailable while rolling. 0 = capacity never drops.
    maxUnavailable: 0

image:
  # -- Image repository. Multi-arch distroless (gcr.io/distroless/cc-debian13:nonroot base).
  repository: ghcr.io/rubentalstra/ferroehr
  # -- Pull policy. IfNotPresent + an immutable pinned tag/digest in production.
  pullPolicy: IfNotPresent
  # -- Image tag. Empty string falls back to .Chart.appVersion. Pin a version in
  # production, never `latest` — and prefer `digest` below, which a tag cannot be
  # substituted for once it is set.
  tag: ""
  # -- Image digest (`sha256:…`). Set it and the pod runs `repository@digest`,
  # ignoring `tag` entirely: a digest is what the provenance attestation is made
  # over, so deploying by digest is what makes verification bind to the running
  # image. A tag can be moved afterwards; a digest cannot.
  digest: ""

# -- imagePullSecrets for private registries.
imagePullSecrets: []
# -- Override the chart name portion of resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount.
  create: true
  # -- Extra annotations (e.g. IRSA/Workload-Identity role bindings for S3).
  annotations: {}
  # -- Name to use; generated when empty.
  name: ""
  # -- The workload never calls the K8s API, so no token is mounted.
  automountServiceAccountToken: false

# ─────────────────────────────────────────────────────────────────────────────
# Database credential (external PostgreSQL 18).
#
# There is NO in-chart PostgreSQL. A clinical data repository stores PHI; its
# database MUST be an externally-managed, backed-up, PITR-capable PostgreSQL 18
# (managed service or an operator-run cluster) — never a chart-side sidecar.
#
# The application connects as the UNPRIVILEGED `ferroehr_app` writer role: a
# LOGIN role granted the DML privileges the runtime needs and none of the DDL
# ones, so a compromised app process cannot alter the schema (PostgreSQL 18
# docs, "Database Roles": https://www.postgresql.org/docs/18/user-manag.html).
# The DSN is a SECRET, and the credential that reaches patient data: it is MOUNTED
# from a Secret as /etc/ferroehr-secrets/db.url and reached through
# `FERROEHR__DB__URL_FILE`, so it never enters the pod's environment (an env value
# is readable through /proc/<pid>/environ and inherited by every child process).
# Never the ConfigMap. The non-secret pool bounds live in
# config.db.{max_connections,min_connections,acquire_timeout_secs}.
# ─────────────────────────────────────────────────────────────────────────────
database:
  # -- Reference an existing Secret holding the app-role DSN (STRONGLY preferred
  # for production — keeps the credential out of chart values and git). The
  # secret's value must be a full `postgres://ferroehr_app:...@host:5432/ferroehr`
  # (optionally `?sslmode=verify-full`).
  existingSecret: ""
  # -- Key WITHIN existingSecret that holds the DSN. This is a Secret key name,
  # not an environment variable name: the chart mounts that key as a file and
  # passes only its PATH as `FERROEHR__DB__URL_FILE`, so the DSN never enters the
  # pod's environment. The default spelling is kept for compatibility with
  # existing Secrets created for the older env-borne arrangement.
  existingSecretKey: FERROEHR__DB__URL
  # -- Inline DSN (DEV/TEST ONLY — lands in a chart-managed Secret). Leave empty
  # and use existingSecret in production. Ignored when existingSecret is set.
  url: ""

# ─────────────────────────────────────────────────────────────────────────────
# Migrations: who runs the schema.
#
# Migrations are append-only DDL, so whoever applies them can rewrite the
# schema. Two postures, and the choice is yours:
#   (a) The server migrates itself at boot (config.db.migrate=apply, the
#       default). Simplest, and the runtime DSN must then be a member of
#       ferroehr_migrator — i.e. the running process holds DDL rights.
#   (b) A separate migration step under a migrator DSN, with the server on
#       config.db.migrate=verify and a DSN that is ferroehr_app ONLY. The server
#       then issues no DDL at all and refuses to boot against a database that
#       has not been migrated. Recommended for production.
# Setting migrations.job.enabled runs (b) for you as a pre-install/pre-upgrade
# hook Job that Helm waits on, so a failed migration fails the release. Point
# its migrator DSN at a short `lock_timeout` (`?options=-c%20lock_timeout%3D5s`)
# so DDL blocked behind live traffic fails fast instead of queueing (PostgreSQL
# 18 docs, "Client Connection Defaults" § lock_timeout:
# https://www.postgresql.org/docs/18/runtime-config-client.html).
# ─────────────────────────────────────────────────────────────────────────────
migrations:
  # -- Purely informational marker rendered into NOTES for the operator.
  runByMigratorRole: true
  job:
    # -- Run the migrations as a pre-install/pre-upgrade hook Job under the
    # migrator DSN. Pair it with config.db.migrate=verify and an app-role-only
    # runtime DSN for the least-privilege posture.
    enabled: false
    # -- REQUIRED when enabled: an existing Secret holding the MIGRATOR DSN
    # (`postgres://ferroehr_migrator:...@host:5432/ferroehr`). Deliberately a
    # different credential from `database.*`, which carries the runtime app-role
    # DSN — rendering fails if it is empty.
    existingSecret: ""
    # -- Key WITHIN existingSecret holding the migrator DSN. Mounted as a file;
    # only its PATH reaches the pod's environment.
    existingSecretKey: FERROEHR__DB__URL
    # -- Retries before the Job (and therefore the release) is declared failed.
    backoffLimit: 3
    # -- How long the finished Job's pod is kept for its logs.
    ttlSecondsAfterFinished: 600
    # -- Hard ceiling on the migration step; a migration blocked behind live
    # traffic must fail the release rather than hang it.
    activeDeadlineSeconds: 600
    # -- Resource requests/limits for the migration pod.
    resources: {}
    # -- Extra annotations on the migration pod.
    podAnnotations: {}
    # -- Node selector for the migration pod.
    nodeSelector: {}
    # -- Tolerations for the migration pod.
    tolerations: []

# ─────────────────────────────────────────────────────────────────────────────
# Secret values carried by a chart-managed Secret. Anything set here is rendered
# from values (keep it out of committed values — prefer an external secret store
# / IRSA, or set these via `helm --set`/a values overlay from your secret
# manager). Each maps to the matching in-TOML key and wins over the file layer;
# empty = not supplied (the ConfigMap value, if any, stands).
#
# HOW each one reaches the process differs, and the reason is a security one: a
# secret mounted as a read-only FILE is preferred over an environment variable,
# which is readable through /proc/<pid>/environ and inherited by every child
# process (OWASP Kubernetes Security Cheat Sheet,
# https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html).
# So every value whose config key has a `*_file` sibling is MOUNTED at
# /etc/ferroehr-secrets/<config.path> and the chart passes only the PATH as env.
# The one key that has no `*_file` sibling (audit.fhir_feed.url) still passes
# its value as env — that is a config-tree gap, not a chart choice.
#
# Setting any of these under `config:` instead REFUSES to render: they would land
# in the ConfigMap, which is not a sensitive object. The refusal names the key
# here that carries it securely.
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  # -- Symmetric HS256 secret for [auth.oidc] (dev/test). MOUNTED as
  # /etc/ferroehr-secrets/auth.oidc.hmac_secret (auth.oidc.hmac_secret_file).
  authOidcHmacSecret: ""
  # -- PGP key passphrase (config.signing.mode=pgp). MOUNTED as
  # /etc/ferroehr-secrets/signing.key_passphrase (signing.key_passphrase_file).
  signingKeyPassphrase: ""
  # -- AMQP broker URL for [events] (carries credentials). MOUNTED as
  # /etc/ferroehr-secrets/events.url (events.url_file).
  eventsUrl: ""
  # -- AMQP broker URL for [fhir.outbound] (carries credentials). MOUNTED as
  # /etc/ferroehr-secrets/fhir.outbound.url (fhir.outbound.url_file).
  fhirOutboundUrl: ""
  # -- Argon2id password hashes for [[auth.basic.users]], keyed by username. Each
  # is MOUNTED as /etc/ferroehr-secrets/auth.basic.users.<username>.password_hash
  # and the chart injects the matching `password_hash_file` into the rendered TOML.
  # Declare the user itself — `username`, `roles` — under
  # config.auth.basic.users; a username with no matching entry is a render error.
  # A hash under `config:` is refused: it would reach the ConfigMap.
  basicUserPasswordHashes: {}
  # -- FHIR base URL of the external Audit Record Repository for
  # [audit.fhir_feed] (may carry basic-auth credentials in its userinfo) →
  # FERROEHR__AUDIT__FHIR_FEED__URL env: audit.fhir_feed.url has no `*_file`
  # sibling either.
  auditFhirFeedUrl: ""
  # -- OAuth2 client secrets for [terminology.external.oauth2_clients.<name>],
  # keyed by client name. Each is MOUNTED as
  # /etc/ferroehr-secrets/terminology.external.oauth2_clients.<name>.client_secret
  # and the chart injects the matching `client_secret_file` into the rendered
  # TOML (a path is not sensitive). Declare the client itself — token_url,
  # client_id, scopes — under config.terminology.external.oauth2_clients.<name>;
  # a name with no such declaration is a render error.
  terminologyOauth2ClientSecrets: {}
  # -- S3 access key id for [multimedia] → FERROEHR__MULTIMEDIA__ACCESS_KEY_ID
  # env. Not a secret in the server's own model (it is reported unredacted by
  # /management/env); prefer IRSA/Workload-Identity (leave empty) on cloud.
  multimediaAccessKeyId: ""
  # -- S3 secret access key for [multimedia]. MOUNTED as
  # /etc/ferroehr-secrets/multimedia.secret_access_key
  # (multimedia.secret_access_key_file).
  multimediaSecretAccessKey: ""

# ─────────────────────────────────────────────────────────────────────────────
# Prometheus scraping. Whichever mechanism you use, the endpoint itself must be
# opened with config.management.endpoints.prometheus (requires
# config.management.enabled) — the chart only arranges DISCOVERY.
#
# Two mechanisms, and they are not interchangeable: the prometheus.io/* pod
# annotations work with a Prometheus that does kubernetes_sd discovery in its own
# scrape config, while an operator-managed Prometheus (kube-prometheus-stack)
# ignores them entirely and selects targets through ServiceMonitor objects
# (https://prometheus-operator.dev/docs/developer/getting-started/).
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  # -- Add prometheus.io scrape annotations to the pods.
  enabled: false
  serviceMonitor:
    # -- Render a Prometheus Operator ServiceMonitor. Needs the
    # monitoring.coreos.com CRDs installed, or the install fails on an unknown kind.
    enabled: false
    # -- Namespace for the ServiceMonitor; empty = the release namespace.
    namespace: ""
    # -- Extra labels, for the `serviceMonitorSelector` your Prometheus matches on.
    labels: {}
    # -- Scrape interval / timeout.
    interval: 30s
    # -- Per-scrape timeout. Must be shorter than the interval.
    scrapeTimeout: 10s
  grafanaDashboard:
    # -- Ship the default "FerroEHR — service overview" Grafana dashboard as a
    # ConfigMap labelled `grafana_dashboard: "1"`, the label the Grafana Helm
    # chart's dashboard sidecar (and therefore kube-prometheus-stack) discovers
    # and auto-imports. The sidecar searches its own release namespace unless
    # its `sidecar.dashboards.searchNamespace` says otherwise.
    enabled: false
    # -- Value for the `grafana_folder` annotation. Applied only when the
    # sidecar's `folderAnnotation` feature is configured; harmless otherwise.
    folder: "FerroEHR"

# ═════════════════════════════════════════════════════════════════════════════
# ferroehr.toml — rendered VERBATIM into the ConfigMap as /etc/ferroehr/ferroehr.toml
# (keys map 1:1 onto the server config schema — `ferroehr config default` prints
# it in full). Secrets are NOT here — see `secrets:` above.
# The `files:` key is NOT part of the TOML (see below); it is mounted separately.
# ═════════════════════════════════════════════════════════════════════════════
config:
  # The openEHR specification generation set the server runs — one coupled
  # choice: "development" (RM 1.2.0 + BASE 1.3.0 + LANG 1.1.0, the default)
  # or "stable" (the released generations: RM 1.1.0 + BASE 1.2.0 +
  # LANG 1.0.0). stable → development is always safe; development → stable
  # only for data that never used development-only constructs (refused
  # loudly at read otherwise).
  spec_profile: development

  # [server] — HTTP listener + REST surface.
  server:
    bind: "0.0.0.0:8080"
    base_path: /ferroehr/rest/openehr/v1
    # Serve Swagger UI + the OpenAPI JSON. Consider false in production.
    swagger_ui: true
    # Permissive CORS — DEV ONLY. Production configures explicit origins.
    cors_permissive: false
    # [server.limits] — the largest accepted request body per route family.
    # Raise body_bytes if compositions embed large DV_MULTIMEDIA data; the bulk
    # tier covers template upload and the /message imports. Over-limit is 413.
    limits:
      body_bytes: 16777216
      bulk_body_bytes: 67108864
    # [server.rate_limit] — per-caller rates, refused 429 + Retry-After. Not the
    # same control as the in-flight shed (503): this one is per caller over time.
    # The defaults sit above the reference SUT's measured whole-server ceiling
    # (512 req/s) — raise them in proportion on server-class hardware. Turn the
    # limiter off before benchmarking, or the benchmark measures the limiter.
    rate_limit:
      enabled: true
      principal_per_second: 1024
      principal_burst: 2048
      address_per_second: 2048
      address_burst: 4096
    # [server.connection] — the bounds that apply BEFORE a request exists. Every
    # other limit engages after a request head is parsed, so a client that opens a
    # socket and trickles headers reaches none of them. h1 and h2 differ: h1
    # streams a request head (trickle-able), h2 multiplexes streams (so the
    # exposure is concurrency — the rapid-reset class).
    connection:
      header_read_timeout_secs: 10
      max_concurrent_streams: 256
      http2_keep_alive_interval_secs: 30
      http2_keep_alive_timeout_secs: 10

  # [db] — pool bounds (the DSN itself is the FERROEHR__DB__URL secret, above).
  db:
    # apply | verify — whether the server runs its embedded migrations at boot.
    # `verify` issues no DDL and refuses to boot against a database that has not
    # been migrated, which is what lets the runtime DSN be ferroehr_app only.
    # Pair it with migrations.job.enabled (see the Migrations section above).
    migrate: apply
    max_connections: 10
    min_connections: 0
    acquire_timeout_secs: 30
    # The backstop the HTTP request timeout cannot be: dropping a handler future
    # does not cancel the statement PostgreSQL is running. Above query.timeout_ms
    # so the engine's typed 408 fires first.
    statement_timeout_ms: 60000

  # [log] — logging. json is correct for cluster log collectors.
  log:
    format: json

  # [auth] — authentication (Basic + OAuth2/OIDC bearer). Enabled by default.
  # auth.enabled=true with NO mechanism is REFUSED BY THIS CHART AT RENDER TIME,
  # because the server refuses to boot on it (RFC 9110 §11.6.1: a 401 challenge
  # must name a scheme the server implements) and a crash-loop hides the reason
  # in a pod log. So a stock `helm install` stops with an actionable error rather
  # than appearing to succeed. Add an [auth.oidc] issuer, an [[auth.basic.users]]
  # entry, or set enabled=false — the last serves EVERY request unauthenticated
  # and is a development-only choice the chart makes you state explicitly.
  # An [auth.oidc] table additionally requires `audiences` (at least one) and an
  # https `issuer` with no query/fragment; every [[auth.basic.users]]
  # password_hash must be argon2id at m>=19456,t=2,p=1. All checked at boot.
  auth:
    enabled: true

  # [authz] — coarse RBAC (on with auth) + ABAC (off).
  authz:
    rbac:
      enabled: true
      admin_role: ADMIN
      user_role: USER
    abac:
      enabled: false

  # [admin] — ADMIN API group (physical, irreversible delete). Off ⇒ routes 404.
  admin:
    enabled: false

  # [tenancy] — multi-tenancy. Our own extension; no openEHR spec governs it.
  # Off by default.
  tenancy:
    enabled: false
    claim: tenant

  # [management] — ops-introspection surface (info / prometheus / metrics / env /
  # loggers / flamegraph). The master switch is ON here (unlike the bare binary)
  # so scraping is a one-key change; every endpoint below stays off, so nothing
  # is exposed until you opt in (set prometheus=public + metrics.enabled to
  # scrape). Health probes are NOT part of this surface — /health,
  # /health/liveness and /health/readiness are always served on the HTTP port,
  # whatever this section says.
  management:
    enabled: true
    base_path: /management
    endpoints:
      # off | public | private | admin_only
      info: "off"
      metrics: "off"
      prometheus: "off"
      env: "off"
      loggers: "off"
      # On-demand CPU flamegraph of the running server (pprof sampling; caps
      # under [management.profiling] — see the configuration reference).
      flamegraph: "off"

  # [signing] — VERSION signing. On/digest by default (the STANDARD "Signing"
  # capability). pgp mode requires signing.key_path (a mounted config.files key)
  # + the secrets.signingKeyPassphrase secret, and FAILS CLOSED at boot.
  signing:
    enabled: true
    # digest | pgp
    mode: digest
    # off | warn | strict — read-time verification of OUR OWN signatures.
    # Defaults to strict when signing is enabled (a served version whose stored
    # signature no longer recomputes is a 5xx integrity fault); set warn (log +
    # meter, still serve) or off (never check) to opt out. Client-supplied
    # signatures are always stored verbatim and never re-verified.
    verify_on_read: "strict"

  # [audit] — the IHE ATNA audit trail. ON by default with only the local
  # store active (records stay in PostgreSQL, queryable via the ITI-81 FHIR
  # AuditEvent search); forwarding to an external ARR is opt-in per sink
  # ([audit.syslog] classic DICOM/syslog, [audit.fhir_feed] RESTful ATNA).
  audit:
    enabled: true
    store:
      enabled: true
      retention_days: 0

  # [events] — contribution-outbox eventing → AMQP. Our own extension; no
  # openEHR spec governs it. Off by default.
  # Envelopes are PHI-FREE by design. The broker URL is the secrets.eventsUrl secret.
  events:
    enabled: false
    exchange: ferroehr.events
    tls: false

  # [fhir] — FHIR connector. api_enabled mounts /fhir/r4/* (inbound façade).
  # outbound.enabled emits mapped resources → AMQP (WARNING: PHI stream; distinct
  # exchange). The outbound broker URL is the secrets.fhirOutboundUrl secret.
  fhir:
    api_enabled: false
    outbound:
      enabled: false
      exchange: ferroehr.fhir
      tls: false

  # [terminology] — terminology extension API + external FHIR-TS validation.
  terminology:
    api_enabled: false
    external:
      enabled: false
      fail_on_error: false

  # [multimedia] — DV_MULTIMEDIA externalization → S3. Our own extension; no
  # openEHR spec governs it. Off by default
  # (inline behaviour byte-identical). WARNING: offloaded blobs are PHI — bucket
  # must be private, encrypted, HTTPS. Credentials are the secrets.multimedia* secrets.
  multimedia:
    enabled: false
    bucket: openehr-multimedia
    region: us-east-1
    # Allow plain HTTP — DEV ONLY; prod S3 is HTTPS.
    allow_http: false

  # ── Mounted config files (NOT part of the TOML above) ──────────────────────
  # Each key becomes /etc/ferroehr/<key> from a chart Secret (opaque, read-only),
  # alongside ferroehr.toml. Use for file-shaped material an in-TOML `*_path`/
  # `*_file` key points at: the PGP key (signing.key_path), Cedar policies
  # (authz.abac.cedar.policy_dir), ATNA PEMs, terminology-server mutual-TLS PEMs
  # (terminology.external.providers.<name>.client_cert_path / client_key_path /
  # ca_bundle_path), a JWKS blob (auth.oidc.jwks_json_file).
  files: {}
  # signing.asc: |
  #   -----BEGIN PGP PRIVATE KEY BLOCK-----
  #   ...

# -- Extra raw env vars (list of {name,value} or {name,valueFrom}). Escape hatch
# for anything not surfaced above (array-valued keys via comma-separated values,
# one-off FERROEHR_* overrides).
extraEnv: []
# -- Extra envFrom sources (configMapRef/secretRef).
extraEnvFrom: []

# ─────────────────────────────────────────────────────────────────────────────
# Networking.
# ─────────────────────────────────────────────────────────────────────────────
service:
  # -- Service type. ClusterIP + an Ingress/gateway in front is the norm.
  type: ClusterIP
  # -- Public API port.
  port: 8080
  # -- Extra annotations.
  annotations: {}
  # -- Topology preference for how the Service picks an endpoint (KEP-4444,
  # stable v1.33). Empty leaves the API default: spread across every ready
  # endpoint cluster-wide. `PreferSameZone` (`PreferClose` is its older
  # spelling) keeps traffic inside the client's zone while endpoints there are
  # ready, which cuts cross-zone latency and inter-zone egress billing;
  # `PreferSameNode` is stricter still. Both trade EVENNESS for locality — a
  # zone with one replica and most of the callers will take most of the load —
  # so it is off unless you have measured that you want it
  # (https://kubernetes.io/docs/reference/networking/virtual-ips/#traffic-distribution).
  trafficDistribution: ""

ingress:
  # -- Create an Ingress. TLS termination belongs here (or at a gateway).
  enabled: false
  # -- IngressClass name. Empty leaves the cluster default to apply.
  className: ""
  # -- Ingress annotations (TLS issuer, body size, timeouts — controller-specific).
  annotations: {}
  hosts:
    - host: ferroehr.example.com
      paths:
        - path: /ferroehr
          pathType: Prefix
  # -- TLS blocks, passed through verbatim.
  tls: []

networkPolicy:
  # -- Install a NetworkPolicy that admits inbound traffic to the API (and
  # management) port and nothing else. Strongly recommended for a PHI workload —
  # but it narrows PORTS unconditionally and SOURCES only when `ingressFrom` is
  # set, so "networkPolicy.enabled=true" alone is not a source restriction.
  enabled: true
  # -- Ingress `from` selectors admitted to the API port. Empty means the rule
  # carries no `from` at all, and a NetworkPolicy ingress rule without `from`
  # admits EVERY source — other namespaces and off-cluster clients included, not
  # just this namespace
  # (https://kubernetes.io/docs/concepts/services-networking/network-policies/).
  # Only the port list is narrowed in that state, so SET this to your
  # ingress-controller namespace/pods for a PHI workload.
  ingressFrom: []
  # -- Admit every source while `ingressFrom` is empty — which is the posture
  # this chart SHIPS, stated as a value rather than left implicit in an empty
  # list. Set it to `false` to make "no open ingress" a machine-checked fact:
  # with `ingressFrom` still empty the render is then REFUSED instead of quietly
  # producing a policy that admits everything while reading as default-deny.
  # It only decides the empty case — a non-empty `ingressFrom` always narrows.
  ingressAllowAll: true
  # ── Egress ────────────────────────────────────────────────────────────────
  # Default-deny egress: everything outbound is refused except what is listed
  # here. Off by default, and that is a deliberate choice rather than laziness —
  # every destination below the database is OPTIONAL and switched on by a
  # configuration key, and most are off-cluster, where a NetworkPolicy can only
  # name an `ipBlock` CIDR because **the API has no way to match a DNS name**
  # (https://kubernetes.io/docs/concepts/services-networking/network-policies/
  # — "you cannot … target Services or Pods by name"). So the destination set is
  # deployment-specific by construction, and shipping it on with a guessed set
  # would break features in a way that looks like the feature being broken.
  #
  # The full config-key-to-destination table, with the port each needs and the
  # order to add them in, is in the book: installation/hardening-network-policy.md
  # §Egress. Read it before enabling this.
  #
  # DNS is always allowed when this is on — without it nothing resolves and
  # every destination below fails regardless of its own rule.
  egress:
    # -- Refuse all outbound traffic except DNS, `database` and `rules`.
    enabled: false
    # -- The database, which is NOT optional: the server cannot pass readiness
    # without it. Rendering an egress policy with no database destination is a
    # refusal, not a warning (see the template) — an egress policy that forgets
    # the DSN is a total outage that looks like a database failure.
    # `to` takes raw NetworkPolicyPeer entries: a `podSelector`/
    # `namespaceSelector` for an in-cluster database, or an `ipBlock` for a
    # managed one. `port` is the DSN's port.
    database:
      to: []
      port: 5432
    # -- Every other destination, as raw NetworkPolicyEgressRule entries — one
    # per integration you have switched on. See the book's table.
    rules: []

# ─────────────────────────────────────────────────────────────────────────────
# Pod / container security: the Kubernetes Pod Security Standards "Restricted"
# profile — non-root, no privilege escalation, seccomp RuntimeDefault, all
# capabilities dropped
# (https://kubernetes.io/docs/concepts/security/pod-security-standards/) —
# plus a read-only root filesystem.
# ─────────────────────────────────────────────────────────────────────────────
# The fields below satisfy the Kubernetes "restricted" Pod Security Standard,
# but satisfying it and ENFORCING it are different things: enforcement comes
# from a namespace label the chart cannot set for you —
#   pod-security.kubernetes.io/enforce=restricted
# Without it these values are a convention nothing checks. See the NOTES printed
# on install (https://kubernetes.io/docs/concepts/security/pod-security-admission/).
# -- Run the pods in their own USER NAMESPACE, so container UIDs map to
# unprivileged host UIDs and a container escape lands as nobody rather than as
# the UID it ran under (KEP-127, stable v1.36 — the reason this chart's
# kubeVersion floor is 1.36). `false` here is the Kubernetes field spelling and
# means user namespaces are ON; set it to `true` to share the host's user
# namespace, which is the API default.
#
# Set it to `true` if your nodes cannot support it. The requirement is a
# node-level one the chart cannot check: a Linux node whose container runtime
# implements it (containerd >= 2.0 or CRI-O >= 1.25) with idmap-mount support
# in the kernel. On a node without it the pod does not start — a loud failure,
# not a silent downgrade
# (https://kubernetes.io/docs/tasks/configure-pod-container/user-namespaces/).
hostUsers: false

podSecurityContext:
  # -- Refuse to start as root (pod level). Required by the restricted profile.
  runAsNonRoot: true
  # 65532 = the distroless `nonroot` uid/gid.
  # -- UID to run as (pod level). 65532 is the distroless nonroot user.
  runAsUser: 65532
  # -- GID to run as.
  runAsGroup: 65532
  # -- Supplemental group owning mounted volumes, so a non-root process can read them.
  fsGroup: 65532
  # -- Only chown volumes whose ownership differs, avoiding a full relabel on every mount.
  fsGroupChangePolicy: OnRootMismatch
  # -- Whether the groups in the IMAGE's /etc/group are merged into the
  # process's supplemental groups. `Strict` uses only the groups this manifest
  # names, so a group baked into an image cannot silently widen file access
  # (KEP-3619, stable v1.35;
  # https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
  supplementalGroupsPolicy: Strict
  seccompProfile:
    # -- Seccomp profile. RuntimeDefault is required by the restricted profile.
    type: RuntimeDefault

securityContext:
  # -- Refuse to start as root (container level). Required by the restricted profile.
  runAsNonRoot: true
  # -- UID to run as (container level). 65532 is the distroless nonroot user.
  runAsUser: 65532
  # -- Block setuid/file-capability escalation. Required by the restricted profile.
  allowPrivilegeEscalation: false
  # -- Never true. A privileged container is effectively root on the node.
  privileged: false
  # -- Immutable root filesystem; writable paths are explicit emptyDir mounts.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    # -- Seccomp profile at container level. RuntimeDefault is required by the restricted profile.
    type: RuntimeDefault
  # AppArmor (KEP-24, stable v1.31) is a further confinement layer, and it is
  # deliberately NOT set here, because it is not a free win: a node without
  # AppArmor REJECTS the pod outright rather than ignoring the field. Verified
  # on a v1.36.1 node — the pod went to status `AppArmor` with
  # "Cannot enforce AppArmor: AppArmor is not enabled on the host" and never
  # started. Enable it once you know your nodes carry it (most Debian/Ubuntu
  # nodes do; Docker Desktop and several minimal distributions do not):
  #
  #   appArmorProfile:
  #     type: RuntimeDefault
  #
  # https://kubernetes.io/docs/tutorials/security/apparmor/

# -- Resource requests/limits. Sized for a modest API replica; tune for load.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# ─────────────────────────────────────────────────────────────────────────────
# Probes — three roles, and the split is load-bearing
# (https://kubernetes.io/docs/concepts/workloads/pods/probes/).
#
#   liveness  → /health/liveness, a CONSTANT the server answers by existing. It
#               must never consult a dependency: "Incorrect implementation of
#               liveness probes can lead to cascading failures", and a database
#               blip that restarts every pod is exactly that.
#   readiness → /health/readiness, which DOES consult dependencies (DB ping,
#               migrations applied) and answers 503 when they are down. That is
#               its job: "the readiness probe additionally checks that each
#               required back-end service is available".
#   startup   → the same constant as liveness, with a long failureThreshold, so
#               a cold start (migrations, template cache) is never killed
#               mid-boot by the liveness probe.
#
# A `probes.exec` option once ran `ferroehr healthcheck` for all three. It was
# removed: it passed no --url, so it probed the openEHR status document rather
# than a health endpoint, and READINESS therefore never touched the database —
# a pod with a dead database reported Ready and took clinical traffic.
# ─────────────────────────────────────────────────────────────────────────────
probes:
  liveness:
    # -- Liveness probe: delay before the first check.
    initialDelaySeconds: 10
    # -- Liveness probe: seconds between checks.
    periodSeconds: 15
    # -- Liveness probe: per-check timeout.
    timeoutSeconds: 3
    # -- Liveness probe: consecutive failures before the pod is acted on.
    failureThreshold: 3
  readiness:
    # -- Readiness probe: delay before the first check.
    initialDelaySeconds: 5
    # -- Readiness probe: seconds between checks.
    periodSeconds: 10
    # -- Readiness probe: per-check timeout.
    timeoutSeconds: 3
    # -- Readiness probe: consecutive failures before the pod is acted on.
    failureThreshold: 3
  startup:
    # -- Startup probe. Gives a slow first boot (migrations) room before liveness applies.
    enabled: true
    # -- Startup probe: delay before the first check.
    initialDelaySeconds: 5
    # -- Startup probe: seconds between checks.
    periodSeconds: 5
    # -- Startup probe: per-check timeout.
    timeoutSeconds: 3
    # -- Startup probe: consecutive failures before the pod is acted on.
    failureThreshold: 30

# ─────────────────────────────────────────────────────────────────────────────
# Autoscaling.
# ─────────────────────────────────────────────────────────────────────────────
autoscaling:
  # -- Horizontal pod autoscaling. When on, the chart omits replicas and the HPA owns the count.
  enabled: false
  # -- Lower bound the HPA may scale to.
  minReplicas: 2
  # -- Upper bound the HPA may scale to.
  maxReplicas: 6
  # -- Target average CPU. 0 removes the metric; removing BOTH metrics is refused, since an HPA with none never scales.
  targetCPUUtilizationPercentage: 75
  # -- Target average memory. 0 removes the metric. A CDR is usually CPU-bound, so this is off by default.
  targetMemoryUtilizationPercentage: 0
  # -- Scaling behaviour, passed through verbatim to `spec.behavior`. Empty
  # leaves the documented defaults, which are already asymmetric in the right
  # direction for a clinical API: scale-up is immediate, scale-down waits out a
  # 300-second stabilization window so a traffic trough cannot tear down
  # capacity that is about to be needed. Set this only to make it MORE
  # conservative — e.g. a `scaleDown.policies` entry capping how many pods may
  # go per minute
  # (https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior).
  behavior: {}

# ─────────────────────────────────────────────────────────────────────────────
# PodDisruptionBudget.
# ─────────────────────────────────────────────────────────────────────────────
podDisruptionBudget:
  # -- Protect availability during voluntary disruption (drains, upgrades).
  enabled: true
  # -- Pods that must stay available. Used only when maxUnavailable is unset.
  minAvailable: 1
  # maxUnavailable: ""   # set one of minAvailable / maxUnavailable
  # -- Whether a node drain may evict pods that are already unhealthy.
  # `AlwaysAllow` is the documented recommendation; the alternative,
  # `IfHealthyBudget`, is the API default and makes a drain wait for pods to
  # become healthy first — which never completes when they are unhealthy
  # because of the drain itself.
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Extra pod labels / annotations.
podLabels: {}
# -- Extra annotations on the pod template. Note a change here rolls the Deployment.
podAnnotations: {}

# -- Scheduling.
nodeSelector: {}
# -- Tolerations for tainted nodes. Empty = none.
tolerations: []
# -- Pod affinity/anti-affinity rules. Empty = none.
affinity: {}
# -- Spread replicas across nodes. Empty does NOT mean "no spreading": it means
# the chart's own default constraint applies — one soft `maxSkew: 1` over
# `kubernetes.io/hostname`, so two replicas prefer two nodes and a node failure
# does not take the whole CDR with it. It is `ScheduleAnyway`, not
# `DoNotSchedule`, so a single-node or capacity-constrained cluster still
# schedules rather than leaving a pod Pending forever.
#
# A non-empty list REPLACES that default entirely — give the full constraint,
# including its own `labelSelector`. Add a `topology.kubernetes.io/zone`
# constraint here if your cluster spans zones; the chart does not assume one
# (https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/).
topologySpreadConstraints: []

# -- Termination grace period (audit/outbox drain has a 5s window in-binary).
terminationGracePeriodSeconds: 30

# -- Lame-duck pause before SIGTERM, in seconds (0 disables). Endpoint removal
# and SIGTERM happen concurrently on pod deletion, so without a pause a
# terminating pod can still be sent requests. Uses the native `preStop.sleep`
# action (this image has no shell, so an exec hook cannot run).
# Must stay comfortably under terminationGracePeriodSeconds: the sleep runs
# INSIDE that budget and the server still needs its own drain window after it.
preStopSleepSeconds: 5

# -- Extra volumes / volumeMounts (e.g. an external secret store for the PGP key).
extraVolumes: []
# -- Mounts for extraVolumes, in the server container.
extraVolumeMounts: []

# ── Admin console (optional companion workload) ──────────────────────────────
# The Leptos admin console. OFF by default: it is a separate product surface
# with its own OCI image and its own attack surface, and a CDR is complete
# without it. Enabling it renders a second Deployment/Service (and optionally an
# Ingress) alongside the server.
#
# It reaches the CDR STRICTLY over ITS-REST — that is the console's binding
# mandate, not an implementation detail — so its egress is narrow and the
# NetworkPolicy below enforces it rather than trusting it.
adminUi:
  # -- Deploy the admin console alongside the CDR.
  enabled: false
  # -- Replica count. The console holds session state in process, so more than
  # one replica needs sticky sessions at the ingress or users get logged out on
  # a reroute; left at 1 deliberately.
  replicaCount: 1
  image:
    # -- Console image repository.
    repository: ghcr.io/rubentalstra/ferroehr-admin-ui
    # -- Pull policy.
    pullPolicy: IfNotPresent
    # -- Image tag. Empty falls back to .Chart.appVersion, so the console and
    # the server move together by default.
    tag: ""
    # -- Image digest (`sha256:…`); wins over `tag` when set, exactly as the
    # server's `image.digest` does.
    digest: ""
  service:
    # -- Service type for the console.
    type: ClusterIP
    # -- Service port. The container always listens on 3000.
    port: 3000
  ingress:
    # -- Publish the console through an Ingress. The console is a human-facing
    # web UI, so unlike the API this is the normal way to reach it.
    enabled: false
    # -- IngressClass name.
    className: ""
    # -- Extra annotations for the console Ingress.
    annotations: {}
    # -- Hosts and paths.
    hosts: []
    # -- TLS blocks.
    tls: []
  auth:
    oidc:
      # -- Authenticate console users through OIDC. Off means the console's own
      # session auth is whatever its defaults provide — acceptable for a private
      # cluster, not for anything reachable by a person who should not see PHI.
      enabled: false
      # -- Issuer URL (must be https for anything but local development).
      issuer: ""
      # -- OAuth2 client id.
      clientId: ""
      # -- The console's own externally-reachable base URL, used to build the
      # OIDC redirect. Must match what the identity provider has registered.
      publicBaseUrl: ""
  # -- Name of an existing Secret holding the console's OIDC client secret. The
  # chart mounts that key as a FILE and passes only its path, so the credential
  # never enters the pod's environment — the same discipline the server's DSN
  # uses.
  existingSecret: ""
  # -- Key within `existingSecret` carrying the client secret.
  existingSecretKey: FERROEHR_ADMIN__AUTH__OIDC__CLIENT_SECRET
  networkPolicy:
    # -- Install a NetworkPolicy for the console. Egress admits the CDR Service
    # and DNS, and nothing else — the console is a REST client of the CDR by
    # mandate, so that half is enforceable rather than aspirational. Ingress
    # narrows the console's PORT unconditionally and its SOURCES only when
    # `ingressFrom` is set.
    enabled: true
    # -- Ingress `from` selectors admitted to the console port. Empty means the
    # rule carries no `from`, which admits EVERY source — other namespaces and
    # off-cluster clients included
    # (https://kubernetes.io/docs/concepts/services-networking/network-policies/).
    # This is the human-facing login surface, so SET this to your
    # ingress-controller namespace/pods.
    ingressFrom: []
    # -- Admit every source while `ingressFrom` is empty — the posture this chart
    # SHIPS for the console, stated as a value rather than left implicit in an
    # empty list. Set it to `false` to have the render REFUSED while `ingressFrom`
    # is empty, instead of quietly exposing the console to everything. It only
    # decides the empty case — a non-empty `ingressFrom` always narrows.
    ingressAllowAll: true
  # -- Pod-level security context. Mirrors the server's; a second workload is
  # where a hardened posture is most easily lost. The user-namespace setting is
  # NOT mirrored here — it is the release-wide `hostUsers` key, because a
  # posture that differs between two workloads of one release is a posture
  # nobody can state.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroupsPolicy: Strict
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context. Mirrors the server's.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  # -- Termination grace period for the console. Shorter than the server's: it
  # holds no write in flight and nothing to drain but in-flight page renders.
  terminationGracePeriodSeconds: 20
  # -- Lame-duck pause before SIGTERM, in seconds (0 disables) — the same
  # endpoint-propagation race the server's `preStopSleepSeconds` covers.
  preStopSleepSeconds: 5
  # -- Resource requests/limits.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- Node selector.
  nodeSelector: {}
  # -- Tolerations.
  tolerations: []
  # -- Affinity.
  affinity: {}
  # -- Extra environment for the console (escape hatch).
  extraEnv: []
