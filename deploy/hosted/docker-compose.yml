#
# What runs on the sandbox box: the CDR, the viewer, and a proxy that
# gets its own certificate (#2974).
#
# The file lives at /opt/ferroehr-sandbox/docker-compose.yml on the host, and
# it gets there from inside the ferroehr image: it is COPYed to
# /opt/sandbox-posture/ (docker/Dockerfile) and the deploy script installs it
# out of the image it just pulled. So an edit here reaches the box with the
# release that carries it, and never before one.
#
# The database is the dedicated DB box (ferroehr-sandbox-postgres, a second
# CX33 provisioned by deploy/hosted/cloud-init-postgres.yaml): `.env` carries
# its private-network connection string as DATABASE_URL, which the config
# alias layer maps to db.url (app/ferroehr/src/config/alias.rs). The database
# has no public port; the app reaches it over the Hetzner private network
# (10.0.0.0/24) alone.

services:
  ferroehr:
    # The release pointer the image lane moves on real release tags. `.env`
    # names the exact reference so a rollback can pin an older one.
    image: ${FERROEHR_IMAGE:-ghcr.io/rubentalstra/ferroehr:latest}
    container_name: ferroehr-sandbox
    restart: unless-stopped
    # The image is its own health probe (`ferroehr healthcheck`): the
    # distroless base carries no shell and no curl. The deploy lane waits on
    # this before it verifies anything from outside.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Sized for the box (a CX33: 4 vCPU, 8 GB), not for an aspiration. On a
    # resize this limit and the viewer's move together, and neither is a
    # code change.
    deploy:
      resources:
        limits:
          memory: 4096m
    environment:
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      # The DB box's private-network string, interpolated from `.env` (Compose
      # reads `.env` for ${...} substitution regardless), so the ONLY thing the
      # container's environment gains from `.env` is this one key — the config
      # alias layer maps DATABASE_URL to db.url (app/ferroehr/src/config/alias.rs).
      # Not `env_file: .env`: that injected EVERY operator var, including the
      # compose-only FERROEHR_*_IMAGE substitution names, and the CDR's strict
      # boot sweep (app/ferroehr/src/config/strict.rs) rejects any FERROEHR_ name
      # it does not allowlist — so a stale image var in `.env` crashlooped the
      # CDR (a renamed image var and its allowlist entry drifting apart). An
      # explicit key list cannot drift with the operator's file.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in /opt/ferroehr-sandbox/.env}
    volumes:
      - ./ferroehr.sandbox.toml:/etc/ferroehr/ferroehr.toml:ro
    expose:
      - "8080"

  viewer:
    image: ${FERROEHR_VIEWER_IMAGE:-ghcr.io/rubentalstra/ferroehr-viewer:latest}
    container_name: ferroehr-sandbox-viewer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr-viewer", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1536m
    environment:
      FERROEHR_VIEWER_CONFIG: /etc/ferroehr/viewer.toml
    volumes:
      - ./ferroehr-viewer.sandbox.toml:/etc/ferroehr/viewer.toml:ro
    depends_on:
      - ferroehr
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: ferroehr-sandbox-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and the account key survive a redeploy. Losing them
      # means asking for a new certificate on every deploy, which is how a
      # deploy loop meets a rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ferroehr
      - viewer

volumes:
  caddy_data:
  caddy_config:
