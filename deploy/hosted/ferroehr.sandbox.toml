#
# The hosted-sandbox posture (#2974, sandbox.ferroehr.eu), served from the
# Hetzner box: the file travels inside the ferroehr image (/opt/sandbox-posture)
# and the deploy script bind-mounts the installed copy. It differs from the
# compose quickstart where a PUBLIC endpoint demands it: the management
# introspection stays OFF (default). The admin API is ON (owner ruling, #2965):
# the sandbox resets nightly, so it is disposable by design — the
# development/testing posture the released admin operations describe — and the
# conformance statement's AdminApi claims are exercisable against this
# deployment. The public bulk delete is accepted: it wipes what the nightly
# reset wipes anyway. The database DSN comes from the box's `.env`, never from
# this file — the DB box's private-network connection string as
# DATABASE_URL, mapped to db.url by the config aliases (#2716).

[server]
# The image's own port; Caddy terminates TLS in front of it.
bind = "0.0.0.0:8080"
# Browser tinkering against the demo is the point.
cors_permissive = true
# The public API reference the documentation links to; the default asks for the
# API credential.
swagger_ui = "public"

[auth]
enabled = true

# The whole admin group behind the demo credential — no partial enablement,
# no separate admin user (owner ruling, #2965).
[admin]
enabled = true

# The demo user: ferroehr / ferroehr (the hash is Argon2id of "ferroehr").
# Public by design; the sandbox holds demo data only and is wiped on a
# schedule.
[[auth.basic.users]]
username = "ferroehr"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
roles = ["USER"]

# Authentication only, no role gate — the one demo user deliberately reaches
# every enabled surface, the admin group included (#2965).
[authz.rbac]
enabled = false
